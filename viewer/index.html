        "graph_theory": [
          {
            "id": "stmt-graph-1",
            "text": "В первом пункте нужно выбрать минимальное число ребер в графе на 2n+1 вершине так, чтобы в любом множестве из n+1 вершин нашлось выбранное ребро; иначе говоря, граф не должен содержать независимое множество размера n+1. Во втором пункте нужно выбрать минимальное число ребер в графе на 2n вершинах так, чтобы в любом множестве из n вершин нашлось выбранное ребро; иначе говоря, граф не должен содержать независимое множество размера n.",

      "id": "turan-theorem",
      "title": "Теорема Турана",
      "kind": {

      },
      "language": "ru",
      "authors": [
        {
          "name": "Pál Turán",

        }
      ],
      "problem_profile": {
        "objects": [
          "clique_free_graph",

        ],
        "methods": [

        ],
        "transformations": [

        "keywords": [
          "turan_theorem",

          "balanced_partite_graph"
        ],
        "status": "ai_checked"
      },
      "statements": {
        "original": [
          {
            "id": "stmt-original-1",
            "text": "Пусть n и r — натуральные числа. Среди всех простых неориентированных графов на n вершинах, в которых нет r+1 попарно соединенных вершин, наибольшее число ребер имеет полный r-дольный граф с долями, размеры которых отличаются не более чем на 1.",
            "source_id": "src-wikipedia-turan",
            "status": "needs_review",
            "self_contained": {
              "status": "ai_checked"
            },
            "definition_ids": [
              "simple_graph",
              "clique",
              "complete_graph",
              "independent_set"
            ],
            "distinct_from": [
              "stmt-graph-1",
              "stmt-graph-complement"
            ]
          }
        ],
        "graph_theory": [
          {
            "id": "stmt-graph-1",
            "text": "Пусть G — простой неориентированный граф на n вершинах. Если G не содержит клики \\( K_{r+1} \\), то \\( e(G) \\le e(T_r(n)) \\), где \\( T_r(n) \\) — полный r-дольный граф Турана: вершины разбиты на r почти равных независимых долей, а ребра проведены между всеми вершинами из разных долей.",
            "status": "ai_checked",
            "self_contained": {
              "status": "ai_checked"
            },
            "definition_ids": [
              "simple_graph",
              "clique",
              "complete_graph",
              "independent_set"
            ],
            "distinct_from": [
              "stmt-original-1",
              "stmt-graph-complement"
            ]
          },
          {
            "id": "stmt-graph-complement",
            "text": "Пусть \\(G\\) — простой граф на \\(n\\) вершинах, в котором число независимости не превосходит \\(r\\). Тогда \\(e(G)\\) не меньше числа рёбер в графе, состоящем из \\(r\\) попарно несвязанных клик с мощностями, отличающимися не более чем на 1. Равенство достигается именно на таком графе; эквивалентно, дополнительный граф \\(\\overline G\\) является графом Турана \\(T_r(n)\\).",
            "status": "ai_checked",
            "self_contained": {
              "status": "ai_checked"
            },
            "definition_ids": [
              "simple_graph",
              "independent_set",
              "clique",
              "complement_graph"
            ],
            "distinct_from": [
              "stmt-original-1",
              "stmt-graph-1"
            ]
          }
        ],
        "olympiad_reformulations": [
          {
            "id": "stmt-independence-form",
            "text": "Пусть m и k — натуральные числа, 1 ≤ k < m. Найдите наименьшее возможное число ребер в простом графе на m вершинах, в котором нет антиклики размера k+1, то есть среди любых k+1 вершин найдутся две соединенные ребром.",
            "source_id": "src-mathus-turan",
            "status": "ai_checked",
            "self_contained": {
              "status": "ai_checked"
            },
            "definition_ids": [
              "simple_graph",
              "independent_set",
              "complete_graph",
              "complement_graph"
            ],
            "title": "Форма через отсутствие большой антиклики"
          },
          {
            "id": "stmt-complement-independence-form",
            "text": "Если простой граф G на m вершинах имеет число независимости \\( \\alpha(G) \\le k \\), то минимальное число ребер достигается на графе, состоящем из k компонент связности почти равного размера, каждая из которых является кликой. Эквивалентно, дополнительный граф к G является графом Турана \\( T_k(m) \\).",
            "status": "ai_checked",
            "self_contained": {
              "status": "ai_checked"
            },
            "definition_ids": [
              "simple_graph",
              "independent_set",
              "complete_graph",
              "complement_graph",
              "connected_graph",
              "clique"
            ],
            "title": "Эквивалентная форма через дополнительный граф"
          },
          {
            "id": "stmt-flashlight-batteries-general",
            "title": "Фонарик и батарейки, общий вариант",
            "text": "Есть m батареек, среди которых как минимум k+1 хорошая, но неизвестно, какие батарейки хорошие. Одна проверка состоит в том, что в фонарик вставляют две выбранные батарейки; фонарик светит только если обе хорошие. Нужно найти минимальное число заранее выбранных проверок, которое гарантирует свет независимо от расположения хороших батареек. В графовой модели батарейки являются вершинами, проверки — ребрами, а требование означает, что любое множество из k+1 хороших вершин содержит проверенное ребро.",
            "source_id": "src-mathus-turan",
            "status": "ai_checked",
            "self_contained": {
              "status": "ai_checked"
            },
            "definition_ids": [
              "simple_graph",
              "complete_graph",
              "complement_graph",
              "independent_set"
            ]
          }
        ]
      },
      "ideas": [
        {
          "id": "idea-symmetrization",
          "title": "Симметризация",
          "text": "Если две несмежные вершины имеют разные окрестности, одну из них можно заменить копией другой так, чтобы число ребер не уменьшилось и клика \\( K_{r+1} \\) не появилась.",
          "tags": [
            "symmetrization",
            "extremal_graph_theory"
          ],
          "status": "ai_draft"
        }
      ],
      "solutions": [
        {
          "id": "sol-symmetrization",
          "title": "Доказательство через симметризацию",
          "text": "Возьмем \\( K_{r+1} \\)-свободный граф с максимальным числом ребер. Последовательно применяем симметризацию Зыкова: для несмежных вершин u,v заменяем окрестность вершины меньшей степени на окрестность вершины большей степени. Число ребер не уменьшается, а запрещенная клика не возникает, потому что новая вершина копирует старую. В предельном экстремальном графе любые две несмежные вершины имеют одинаковые окрестности; классы отношения несмежности становятся независимыми долями, а между разными долями проведены все ребра. Так как граф не содержит \\( K_{r+1} \\), долей не больше r. При фиксированном числе долей произведения размеров долей максимальны при почти равных размерах, значит максимум достигается на \\( T_r(n) \\).",

      "statements": {
        "original": [
          {
            "id": "stmt-original",
            "title": "Условие",
            "text": "В Лапландии есть \\(100n\\) городов, каждая пара соединена дорогой с пунктом оплаты. Доход от дороги делится поровну между двумя её концами. Губернатор хочет передать часть пунктов федеральному правительству так, чтобы после этого каждая вершина сохранила как минимум 99% прежнего суммарного дохода от инцидентных дорог. Нужно найти наибольшее число дорог, которое можно гарантированно изъять при любых положительных доходах на дорогах.",
            "source_id": "src-memo-2025-official",
            "status": "needs_human_review",
            "self_contained": {
              "status": "ai_checked"
            },
            "definition_ids": [],
            "distinct_from": [

        "graph_theory": [
          {
            "id": "stmt-graph",
            "text": "Пусть дан взвешенный полный граф на \\(100n\\) вершинах; все веса рёбер положительны. Требуется удалить как можно больше рёбер так, чтобы для каждой вершины сумма весов оставшихся инцидентных ей рёбер была не меньше \\(99\\%\\) от суммы весов всех исходных инцидентных ей рёбер. Найдите наибольшее число рёбер, которое можно гарантированно удалить при любых положительных весах.",

      "ideas": [
        {
          "id": "idea-uniform-weight-upper-bound",
          "title": "Равные веса дают верхнюю оценку через лемму о рукопожатиях",
          "text": "Если все рёбра имеют одинаковый вес, то у каждой вершины можно удалить не более \\(n-1\\) инцидентных рёбер. По лемме о рукопожатиях это ограничивает общее число удалённых рёбер сверху числом \\(100\\binom n2\\).",

        {
          "id": "idea-minimal-partition",
          "title": "Минимизируем внутриклассовый вес разбиением на 100 частей",
          "text": "Разбиваем вершины на 100 частей так, чтобы суммарный вес внутриклассовых рёбер был минимален. Тогда у любой вершины вес рёбер внутри своей части не превосходит веса рёбер в любую другую фиксированную часть, следовательно не превышает 1% её полного инцидентного веса. Можно удалить все внутриклассовые рёбра, а их число снизу оценивается через квадратичную среднюю размеров частей.",

        {
          "id": "sol-official-compressed",
          "title": "Сжатое официальное решение",
          "text": "Интерпретируем страну как взвешенный полный граф на \\(100n\\) вершинах, где вес ребра - половина дохода соответствующей дороги. Верхняя оценка: если все веса одинаковы, то у каждой вершины можно удалить не более \\(1\\%\\) от \\(100n-1\\) инцидентных рёбер, то есть не более \\(n-1\\). По лемме о рукопожатиях удаляется не более \\(\\frac12(100n)(n-1)=100\\binom n2\\) рёбер. Нижняя оценка: разобьём вершины на 100 частей так, чтобы суммарный вес рёбер внутри частей был минимален. Если бы для вершины \\(v\\) вес рёбер внутри её части был больше веса рёбер из \\(v\\) в некоторую другую часть, то перенос \\(v\\) уменьшил бы внутриклассовый вес, вопреки минимальности. Значит внутриклассовый вес каждой вершины не превосходит \\(1/100\\) её полного инцидентного веса, то есть не более 1%. Поэтому можно удалить все рёбра внутри частей. Если размеры частей равны \\(a_1,\\dots,a_{100}\\), то число удалённых рёбер равно \\(\\sum_i \\binom{a_i}2 = \\frac12\\sum_i a_i^2 - 50n\\). По неравенству между средней квадратичной и средней арифметической имеем \\(\\sum_i a_i^2\\ge 100n^2\\), откуда удаляется не меньше \\(50n^2-50n=100\\binom n2\\) рёбер. Следовательно, искомое максимальное гарантированное число равно \\(100\\binom n2\\).",

            "title": "Игра с туристом и направлениями дорог",
            "text": "В виртуальном компьютерном государстве не менее двух городов. Некоторые пары городов соединены дорогой, причём из каждого города можно добраться по дорогам до любого другого. Если можно, начав движение из какого-то города и не проходя дважды по одной и той же дороге, вернуться в этот город, государство называется сложным, иначе простым. Петя и Вася играют так: сначала Петя задаёт направление на каждой дороге и помещает туриста в один из городов; затем за ход Петя перемещает туриста по дороге в разрешённом направлении в соседний город, а Вася меняет направление одной дороги, входящей или выходящей из нового города туриста. Вася выигрывает, если Петя в какой-то момент не сможет сделать ход. Докажите, что в простом государстве Петя может не проиграть, а в сложном государстве Вася может гарантировать победу.",

            "text": "Дан связный неориентированный граф. Петя сначала ориентирует все рёбра и выбирает начальную вершину фишки. На каждом ходе фишка обязана пройти по исходящему ребру, после чего Вася разворачивает одно ребро, инцидентное новой вершине. Если граф является деревом, Петя имеет бесконечную стратегию; если граф содержит цикл, Вася имеет выигрышную стратегию.",

      "statements": {

          {
            "id": "stmt-original",
            "title": "Гномы за двумя столиками",
            "text": "За каждым из двух круглых столиков сидит по \\(n\\) гномов. Каждый дружит только со своими соседями по столику слева и справа. Добрый волшебник хочет рассадить гномов за один круглый стол так, чтобы каждые два соседних гнома дружили между собой. Он может подружить \\(2n\\) пар гномов, а затем злой волшебник поссорит между собой \\(n\\) пар из этих \\(2n\\) новых пар. При каких \\(n\\) добрый волшебник может добиться желаемого, как бы ни действовал злой волшебник?",
            "source_id": "src-problems-66880",

        "graph_theory": [

            "id": "stmt-graph",
            "text": "Изначально дан граф, являющийся объединением двух непересекающихся циклов длины \\(n\\). Первый игрок добавляет \\(2n\\) новых рёбер, затем второй удаляет \\(n\\) из добавленных рёбер. Нужно определить, при каких \\(n\\) первый игрок может гарантировать, что после удаления в графе будет гамильтонов цикл.",

      "ideas": [

          "title": "Две сдвинутые системы мостов",
          "text": "При нечётном \\(n\\) добавляются две циклически сдвинутые системы рёбер между столиками; после удаления половины рёбер одна из систем сохраняет две соседние перемычки.",

          "title": "Цветовое препятствие по сумме степеней",
          "text": "При чётном \\(n\\) вершины каждого исходного цикла красятся через одну. У одного цвета суммарная степень по добавленным рёбрам не больше \\(n\\), и злой волшебник удаляет все добавленные рёбра, инцидентные этому цвету.",

      "solutions": [
        {
          "id": "sol-odd-even",
          "title": "Нечётный и чётный случаи",
          "text": "Если \\(n=2k-1\\), обозначим гномов за столиками \\(A_i\\) и \\(B_i\\). Добрый волшебник добавляет рёбра \\((A_i,B_i)\\) и \\((A_i,B_{i+1})\\). После удаления \\(n\\) из \\(2n\\) рёбер в одной из двух систем останется хотя бы \\(k\\) рёбер; на нечётном цикле среди них найдутся две соседние перемычки. Эти две перемычки позволяют разрезать оба старых цикла и склеить их в один общий цикл. Если \\(n\\) чётно, раскрасим вершины каждого старого цикла в два цвета через одну. Сумма степеней по добавленным рёбрам равна \\(4n\\), поэтому у одного из четырёх цветовых классов она не больше \\(n\\). Злой волшебник удаляет все добавленные рёбра, инцидентные этому классу. Тогда каждая вершина этого класса остаётся соединённой только со своими двумя старыми соседями, и общий гамильтонов цикл через все вершины невозможен. Ответ: все нечётные \\(n>1\\).",
          "idea_ids": [
            "idea-two-families-of-bridges",
            "idea-degree-color-obstruction"

            "text": "В таблице \\(44\\times44\\) часть клеток синие, а остальные красные. Никакие синие клетки не граничат друг с другом по стороне. Множество красных клеток связно по сторонам: от любой красной клетки можно добраться до любой другой красной, переходя из клетки в клетку через общую сторону и не заходя в синие клетки. Докажите, что синих клеток в таблице меньше трети.",

          "text": "Рассмотрим граф дружбы G. Регионы дают исходную раскраску вершин в n цветов; условие задачи означает, что в каждом простом цикле никакой цвет не занимает более половины вершин. Назовём такую раскраску приятной. Нужно построить правильную n-раскраску. Достаточно показать, что для любых двух цветов A и B можно перекрасить все вершины этих цветов снова в A и B так, чтобы оба цвета стали правильными, а приятность сохранилась. Рассмотрим индуцированный подграф H на вершинах цветов A и B. Любой простой цикл в H имеет не более половины вершин цвета A и не более половины цвета B, значит цветов на нём поровну и цикл чётный. Следовательно, H двудолен и его вершины можно правильно раскрасить в A и B. После такой перекраски оба цвета становятся правильными. Остаётся проверить сохранение приятности. Для любого простого цикла C в исходном графе условие могло испортиться только для цветов A или B; скажем, для A. Но в новой раскраске вершины цвета A на цикле не соседствуют, поэтому каждой такой вершине можно сопоставить следующую за ней по циклу вершину. Эти сопоставленные вершины различны и не имеют цвета A, так что вершин цвета A не больше половины длины цикла. Повторяя процедуру для разных пар цветов, поочерёдно делаем каждый цвет правильным и получаем правильную n-раскраску.",

  "definitions": {
    "simple_graph": {
      "id": "simple_graph",
      "title": "Простой граф",
      "aliases": [
        "простой граф",
        "простого графа",
        "простом графе",
        "простым графом"
      ],
      "text": "Простой граф — это граф без петель и кратных ребер: между двумя различными вершинами может быть не более одного ребра, а ребро из вершины в саму себя запрещено.",
      "examples": [
        "Треугольник из трех вершин и трех ребер — простой граф.",
        "Если между двумя вершинами проведены два разных ребра, такой граф уже не простой."
      ],
      "status": "ai_checked"
    },
    "directed_graph": {
      "id": "directed_graph",
      "title": "Ориентированный граф",
      "aliases": [
        "ориентированный граф",
        "ориентированного графа",
        "ориентированном графе",
        "ориентированное ребро",
        "ориентированным ребром",
        "стрелка",
        "стрелку",
        "стрелки"
      ],
      "text": "Ориентированный граф — это граф, у каждого ребра которого выбрано направление. Такое ребро часто называют дугой или стрелкой.",
      "examples": [
        "Если есть стрелка из A в B, то по ней можно идти от A к B.",
        "Наличие стрелки из A в B не означает, что есть стрелка из B в A."
      ],
      "status": "ai_checked"
    },
    "bipartite_graph": {
      "id": "bipartite_graph",
      "title": "Двудольный граф",
      "aliases": [
        "двудольный граф",
        "двудольного графа",
        "двудольном графе",
        "двудольным графом"
      ],
      "text": "Двудольный граф — это граф, вершины которого можно разбить на две доли так, что каждое ребро соединяет вершины из разных долей.",
      "examples": [
        "Полный двудольный граф K_{m,n}: каждая вершина первой доли соединена с каждой вершиной второй доли.",
        "Цикл четной длины является двудольным графом."
      ],
      "status": "ai_checked"
    },
    "matching": {
      "id": "matching",
      "title": "Паросочетание",
      "aliases": [
        "паросочетание",
        "паросочетания",
        "паросочетанию",
        "паросочетанием"
      ],
      "text": "Паросочетание — это набор ребер графа, никакие два из которых не имеют общего конца.",
      "examples": [
        "В пути из четырех вершин можно взять первое и третье ребро: они образуют паросочетание.",
        "Два соседних ребра пути не образуют паросочетание, потому что имеют общую вершину."
      ],
      "status": "ai_checked"
    },
    "vertex_cover": {
      "id": "vertex_cover",
      "title": "Вершинное покрытие",
      "aliases": [
        "вершинное покрытие",
        "вершинного покрытия",
        "вершинным покрытием"
      ],
      "text": "Вершинное покрытие — это множество вершин графа, которое содержит хотя бы один конец каждого ребра.",
      "examples": [
        "В треугольнике любые две вершины образуют вершинное покрытие.",
        "Одна вершина треугольника не покрывает ребро между двумя другими вершинами."
      ],
      "status": "ai_checked"
    },
    "chromatic_number": {
      "id": "chromatic_number",
      "title": "Хроматическое число",
      "aliases": [
        "хроматическое число",
        "хроматического числа",
        "хроматическим числом",
        "chi(G)",
        "\\\\chi(G)"
      ],
      "text": "Хроматическое число графа — это минимальное число цветов, в которое можно правильно раскрасить его вершины: концы каждого ребра должны иметь разные цвета.",
      "examples": [
        "Хроматическое число двудольного графа без ребер не превосходит 2, если в нем есть хотя бы одно ребро.",
        "Хроматическое число треугольника равно 3."
      ],
      "status": "ai_checked"
    },
    "connected_graph": {
      "id": "connected_graph",
      "title": "Связность",
      "aliases": [
        "связный граф",
        "связного графа",
        "связном графе",
        "связным графом",
        "связность",
        "связности"
      ],
      "text": "Граф называется связным, если между любыми двумя его вершинами существует путь.",
      "examples": [
        "Любое дерево связно.",
        "Две отдельные вершины без ребра между ними образуют несвязный граф."
      ],
      "status": "ai_checked"
    },
    "clique": {
      "id": "clique",
      "title": "Клика",
      "aliases": [
        "клика",
        "клики",
        "клику",
        "кликой",
        "попарно соединенных вершин",
        "попарно соединенные вершины"
      ],
      "text": "Клика — это множество вершин графа, любые две из которых соединены ребром.",
      "examples": [
        "Три попарно соединенные вершины образуют клику K_3.",
        "В цикле длины 4 нет клики из трех вершин."
      ],
      "status": "ai_checked"
    },
    "independent_set": {
      "id": "independent_set",
      "title": "Независимое множество",
      "aliases": [
        "независимое множество",
        "независимого множества",
        "независимых долей",
        "независимую долю",
        "независимое множество",
        "антиклика",
        "антиклики",
        "антиклик",
        "антикликой"
      ],
      "text": "Независимое множество — это множество вершин графа, никакие две из которых не соединены ребром.",
      "examples": [
        "В полном двудольном графе каждая доля является независимым множеством.",
        "В треугольнике любое независимое множество имеет не более одной вершины."
      ],
      "status": "ai_checked"
    },
    "degree": {
      "id": "degree",
      "title": "Степень вершины",
      "aliases": [
        "степень вершины",
        "степени вершины",
        "степень",
        "степеней",
        "минимальная степень",
        "максимальная степень"
      ],
      "text": "Степень вершины в неориентированном графе — это число ребер, выходящих из этой вершины.",
      "examples": [
        "В треугольнике степень каждой вершины равна 2.",
        "В звезде центр имеет степень, равную числу листьев."
      ],
      "status": "ai_checked"
    },
    "path": {
      "id": "path",
      "title": "Путь",
      "aliases": [
        "путь",
        "пути",
        "путей",
        "простого пути",
        "простой путь"
      ],
      "text": "Путь — это последовательность вершин, в которой соседние вершины соединены ребром. Простой путь не проходит через одну и ту же вершину дважды.",
      "examples": [
        "В цепочке A-B-C последовательность A,B,C является путем.",
        "Если вершина повторяется, путь уже не простой."
      ],
      "status": "ai_checked"
    },
    "cycle": {
      "id": "cycle",
      "title": "Цикл",
      "aliases": [

  <script>
    const DB = JSON.parse(document.getElementById('db-data').textContent);
    const problems = DB.problems;
    const relations = DB.relations;
    const comments = DB.comments;
    const sources = DB.sources;
    const definitions = DB.definitions;
    const standardIdeas = DB.standard_ideas;
    const taxonomy = DB.taxonomy;
    const state = { query: '', tag: 'all', view: 'problems' };

    const byId = (id) => document.getElementById(id);
    const esc = (value) => String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');

    function label(map, id) {
      return map?.[id]?.title || id;
    }

    function prettyText(value) {
      return esc(value)
        .replaceAll('&lt;=', '≤')
        .replaceAll('&gt;=', '≥')
        .replaceAll('-&gt;', '→');
    }

    function escapeRegExp(value) {
      return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function linkDefinitions(html, definitionIds = []) {
      const replacements = [];
      definitionIds.forEach(id => {
        const definition = definitions[id];
        if (!definition) return;
        (definition.aliases || []).forEach(alias => {
          if (!alias.includes('\\')) replacements.push({ id, alias });
        });
      });
      replacements.sort((a, b) => b.alias.length - a.alias.length);
      let result = html;
      const used = new Set();
      replacements.forEach(item => {
        if (used.has(item.id)) return;
        const pattern = new RegExp(`(^|[^А-Яа-яA-Za-z0-9_])(${escapeRegExp(esc(item.alias))})(?=$|[^А-Яа-яA-Za-z0-9_])`, 'i');
        if (pattern.test(result)) {
          result = result.replace(pattern, `$1<a class="def-link" href="#def-${encodeURIComponent(item.id)}">$2</a>`);
          used.add(item.id);
        }
      });
      return result;
    }

    function linkStandardIdeas(html, ideaIds = []) {
      const replacements = [];
      ideaIds.forEach(id => {
        const idea = standardIdeas[id];
        if (!idea) return;
        (idea.aliases || []).forEach(alias => replacements.push({ id, alias }));
      });
      replacements.sort((a, b) => b.alias.length - a.alias.length);
      let result = html;
      const used = new Set();
      replacements.forEach(item => {
        if (used.has(item.id)) return;
        const pattern = new RegExp(`(^|[^А-Яа-яA-Za-z0-9_])(${escapeRegExp(esc(item.alias))})(?=$|[^А-Яа-яA-Za-z0-9_])`, 'i');
        if (pattern.test(result)) {
          result = result.replace(pattern, `$1<a class="idea-link" href="#stdidea-${encodeURIComponent(item.id)}">$2</a>`);
          used.add(item.id);
        }
      });
      return result;
    }

    function textBlock(text, definitionIds = [], standardIdeaIds = []) {
      let html = prettyText(text || '');
      html = linkDefinitions(html, definitionIds);
      html = linkStandardIdeas(html, standardIdeaIds);
      return `<div class="text">${html}</div>`;
    }

    function renderExample(example, definitionIds = [], standardIdeaIds = []) {
      if (typeof example === 'string') {
        return `<div class="example-card">${textBlock(example, definitionIds, standardIdeaIds)}</div>`;
      }
      if (!example || typeof example !== 'object') return '';
      const title = example.title || 'Пример';
      const optional = example.optional ? `<span class="example-optional">необязательный блок</span>` : '';
      if (example.type === 'image') {
        const alt = example.alt || title;
        const caption = example.caption ? `<figcaption class="example-caption">${textBlock(example.caption, definitionIds, standardIdeaIds)}</figcaption>` : '';
        return `
          <div class="example-card">
            <div class="example-label">
              <span>${esc(title)}</span>
              ${optional}
            </div>
            <figure class="example-figure">
              <img class="example-image" src="${esc(example.path)}" alt="${esc(alt)}">
              ${caption}
            </figure>
          </div>
        `;
      }
      return `
        <div class="example-card">
          <div class="example-label">
            <span>${esc(title)}</span>
            ${optional}
          </div>
          ${textBlock(example.text || '', definitionIds, standardIdeaIds)}
        </div>
      `;
    }

    function renderExamples(examples, definitionIds = [], standardIdeaIds = []) {
      if (!examples || !examples.length) return '';
      return `
        <div class="example-stack">
          ${examples.map(example => renderExample(example, definitionIds, standardIdeaIds)).join('')}
        </div>
      `;
    }

    function statusPill(status) {
      if (!status) return '';
      return `<span class="pill status-${esc(status)}">${esc(label(taxonomy.statuses, status))}</span>`;
    }

    function commentStatusPill(status) {
      if (!status) return '';
      return `<span class="pill">${esc(label(taxonomy.comment_statuses, status))}</span>`;
    }

    function tagPill(tag) {
      return `<span class="pill">${esc(label(taxonomy.tags, tag))}</span>`;
    }

    function definitionPill(id) {
      return definitions[id] ? `<a class="pill" href="#def-${encodeURIComponent(id)}">${esc(definitions[id].title)}</a>` : '';
    }

    function standardIdeaPill(id) {
      return standardIdeas[id] ? `<a class="pill" href="#stdidea-${encodeURIComponent(id)}">${esc(standardIdeas[id].title)}</a>` : '';
    }

    function renderAuthors(problem) {
      const authors = problem.authors || [];
      if (!authors.length) return '';
      const items = authors.map(author => {
        const name = esc(author.name || '?');
        const review = author.status && author.status !== 'source_verified'
          ? `<span class="pill">${esc(label(taxonomy.statuses, author.status) || author.status)}</span>`
          : '';
        return `<span class="author-entry"><span>${name}</span>${review}</span>`;
      }).join('');
      return `
        <div class="section">
          <h3>Авторы</h3>
          <div class="card">
            <div class="pill-row">${items}</div>
          </div>
        </div>
      `;
    }

    function sortedProblems() {
      return Object.values(problems).sort((a, b) => a.title.localeCompare(b.title, 'ru'));
    }

    function sortedDefinitions() {
      return Object.values(definitions).sort((a, b) => a.title.localeCompare(b.title, 'ru'));
    }

    function sortedStandardIdeas() {
      return Object.values(standardIdeas).sort((a, b) => a.title.localeCompare(b.title, 'ru'));
    }

    function sortedComments() {
      return Object.values(comments).sort((a, b) => {
        const dateCmp = String(b.created_at || '').localeCompare(String(a.created_at || ''));
        if (dateCmp) return dateCmp;
        return a.id.localeCompare(b.id, 'ru');
      });
    }

    function searchBlob(value) {
      return JSON.stringify(value).toLowerCase();
    }

    function filteredProblems() {
      const query = state.query.trim().toLowerCase();
      return sortedProblems().filter(problem => {
        const tagOk = state.tag === 'all' || (problem.tags || []).includes(state.tag);
        const queryOk = !query || searchBlob(problem).includes(query);
        return tagOk && queryOk;
      });
    }

    function filteredDefinitions() {
      const query = state.query.trim().toLowerCase();
      return sortedDefinitions().filter(item => !query || searchBlob(item).includes(query));
    }

    function filteredStandardIdeas() {
      const query = state.query.trim().toLowerCase();
      return sortedStandardIdeas().filter(item => !query || searchBlob(item).includes(query));
    }

    function filteredComments() {
      const query = state.query.trim().toLowerCase();
      return sortedComments().filter(item => !query || searchBlob(item).includes(query));
    }

    function currentRoute() {
      const id = decodeURIComponent(location.hash.replace(/^#/, ''));
      if (id.startsWith('def-')) {
        const definitionId = id.slice(4);
        if (definitions[definitionId]) return { type: 'definition', id: definitionId };
      }
      if (id.startsWith('stdidea-')) {
        const ideaId = id.slice(8);
        if (standardIdeas[ideaId]) return { type: 'idea', id: ideaId };
      }
      if (id.startsWith('comment-')) {
        const commentId = id.slice(8);
        if (comments[commentId]) return { type: 'comment', id: commentId };
      }
      if (problems[id]) return { type: 'problem', id };
      if (state.view === 'definitions') return { type: 'definition', id: sortedDefinitions()[0]?.id };
      if (state.view === 'ideas') return { type: 'idea', id: sortedStandardIdeas()[0]?.id };
      if (state.view === 'comments') return { type: 'comment', id: sortedComments()[0]?.id || null };
      return { type: 'problem', id: sortedProblems()[0]?.id };
    }

    function setProblem(id) {
      state.view = 'problems';
      location.hash = encodeURIComponent(id);
      render();
    }

    function setDefinition(id) {
      state.view = 'definitions';
      location.hash = `def-${encodeURIComponent(id)}`;
      render();
    }

    function setStandardIdea(id) {
      state.view = 'ideas';
      location.hash = `stdidea-${encodeURIComponent(id)}`;
      render();
    }

    function setComment(id) {
      state.view = 'comments';
      location.hash = id ? `comment-${encodeURIComponent(id)}` : '';
      render();
    }

    function problemUsesDefinition(problem, definitionId) {
      const statementsUse = Object.values(problem.statements || {}).some(group =>
        (group || []).some(statement => (statement.definition_ids || []).includes(definitionId))
      );
      const solutionsUse = (problem.solutions || []).some(solution =>
        (solution.definition_ids || []).includes(definitionId)
      );
      return statementsUse || solutionsUse;
    }

    function definitionUsage(definitionId) {
      return sortedProblems().filter(problem => problemUsesDefinition(problem, definitionId));
    }

    function solutionUsesStandardIdea(solution, ideaId) {
      return (solution.standard_idea_ids || []).includes(ideaId);
    }

    function standardIdeaUsage(ideaId) {
      const items = [];
      sortedProblems().forEach(problem => {
        (problem.solutions || []).forEach(solution => {
          if (solutionUsesStandardIdea(solution, ideaId)) items.push({ problem, solution });
        });
      });
      return items;
    }

    function relationsForProblem(problemId) {
      return relations.filter(rel => rel.from === problemId || rel.to === problemId);
    }

    function commentsForProblem(problemId) {
      return sortedComments().filter(comment => comment.target?.type === 'problem' && comment.target?.problem_id === problemId);
    }

    function architectureComments() {
      return sortedComments().filter(comment => comment.target?.type === 'architecture');
    }

    function renderSidebar() {
      const route = currentRoute();
      state.view = route.type === 'definition' ? 'definitions' : route.type === 'idea' ? 'ideas' : route.type === 'comment' ? 'comments' : 'problems';
      byId('db-meta').textContent = `${Object.keys(problems).length} карточек · ${Object.keys(definitions).length} определений · ${Object.keys(standardIdeas).length} идей · ${relations.length} связей · ${Object.keys(comments).length} комментариев`;
      byId('mode-problems').classList.toggle('active', state.view === 'problems');
      byId('mode-definitions').classList.toggle('active', state.view === 'definitions');
      byId('mode-ideas').classList.toggle('active', state.view === 'ideas');
      byId('mode-comments').classList.toggle('active', state.view === 'comments');

      const list = byId('list');
      if (state.view === 'definitions') {
        list.innerHTML = filteredDefinitions().map(item => `
          <button class="list-button ${item.id === route.id ? 'active' : ''}" data-definition-id="${esc(item.id)}">
            <div>${esc(item.title)}</div>
            <div class="id">${esc(item.id)} · задач: ${definitionUsage(item.id).length}</div>
          </button>
        `).join('');
        list.querySelectorAll('[data-definition-id]').forEach(button => {
          button.addEventListener('click', () => setDefinition(button.dataset.definitionId));
        });
      } else if (state.view === 'ideas') {
        list.innerHTML = filteredStandardIdeas().map(item => `
          <button class="list-button ${item.id === route.id ? 'active' : ''}" data-standard-idea-id="${esc(item.id)}">
            <div>${esc(item.title)}</div>
            <div class="id">${esc(item.id)} · задач: ${standardIdeaUsage(item.id).length}</div>
          </button>
        `).join('');
        list.querySelectorAll('[data-standard-idea-id]').forEach(button => {
          button.addEventListener('click', () => setStandardIdea(button.dataset.standardIdeaId));
        });
      } else if (state.view === 'comments') {
        const items = filteredComments();
        list.innerHTML = items.length ? items.map(item => {
          const targetTitle = item.target?.type === 'problem'
            ? (problems[item.target.problem_id]?.title || item.target.problem_id)
            : 'Архитектура базы';
          return `
            <button class="list-button ${item.id === route.id ? 'active' : ''}" data-comment-id="${esc(item.id)}">
              <div>${esc(item.title)}</div>
              <div class="id">${esc(item.id)} · ${esc(targetTitle)}</div>
            </button>
          `;
        }).join('') : `<div class="empty" style="padding:10px;">Комментариев пока нет.</div>`;
        list.querySelectorAll('[data-comment-id]').forEach(button => {
          button.addEventListener('click', () => setComment(button.dataset.commentId));
        });
      } else {
        list.innerHTML = filteredProblems().map(item => `
          <button class="list-button ${item.id === route.id ? 'active' : ''}" data-problem-id="${esc(item.id)}">
            <div>${esc(item.title)}</div>
            <div class="id">${esc(item.id)}</div>
          </button>
        `).join('');
        list.querySelectorAll('[data-problem-id]').forEach(button => {
          button.addEventListener('click', () => setProblem(button.dataset.problemId));
        });
      }
    }

    function renderTagFilter() {
      const select = byId('tag-filter');
      if (state.view !== 'problems') {
        select.disabled = true;
        const labelText = state.view === 'definitions'
          ? `Определения (${Object.keys(definitions).length})`
          : state.view === 'ideas'
          ? `Идеи (${Object.keys(standardIdeas).length})`
          : `Комментарии (${Object.keys(comments).length})`;
        select.innerHTML = `<option>${labelText}</option>`;
        return;
      }
      select.disabled = false;
      const counts = {};
      Object.values(problems).forEach(problem => {
        (problem.tags || []).forEach(tag => {
          counts[tag] = (counts[tag] || 0) + 1;
        });
      });
      const tags = Object.keys(counts).sort((a, b) => label(taxonomy.tags, a).localeCompare(label(taxonomy.tags, b), 'ru'));
      select.innerHTML = `<option value="all">Все метки (${Object.keys(problems).length})</option>` + tags.map(tag =>
        `<option value="${esc(tag)}">${esc(label(taxonomy.tags, tag))} (${counts[tag]})</option>`
      ).join('');
      select.value = state.tag;
    }

    function renderStatements(problem) {
      const groups = [
        ['original', 'Оригинальные формулировки'],
        ['graph_theory', 'На языке теории графов'],
        ['olympiad_reformulations', 'Олимпиадные переформулировки']
      ];
      return groups.map(([key, title]) => {
        const items = problem.statements?.[key] || [];
        if (!items.length) return '';
        return `<h4>${title}</h4>` + items.map(statement => {
          const source = statement.source_id ? sources[statement.source_id] : null;
          return `
            <div class="card">
              <div class="item-title">
                <span>${esc(statement.title || statement.id)}</span>
                ${statusPill(statement.status)}
                ${statement.self_contained ? `<span class="pill">самодостаточность: ${esc(label(taxonomy.statuses, statement.self_contained.status))}</span>` : ''}
                ${source ? `<a class="subtle" href="${esc(source.url)}" target="_blank" rel="noreferrer">${esc(source.title)}</a>` : ''}
              </div>
              ${textBlock(statement.text, statement.definition_ids || [])}
              <div class="pill-row">${(statement.definition_ids || []).map(definitionPill).join('')}</div>
              ${statement.review_notes ? `<div class="subtle">${esc(statement.review_notes)}</div>` : ''}
            </div>
          `;
        }).join('');
      }).join('');
    }

    function renderIdeas(problem) {
      const ideas = problem.ideas || [];
      if (!ideas.length) return '<div class="empty">Идей пока нет.</div>';
      return ideas.map(idea => `
        <div class="card">
          <div class="item-title">
            <span>${esc(idea.title || idea.id)}</span>
            ${statusPill(idea.status)}
          </div>
          ${textBlock(idea.text)}
          <div class="pill-row">${(idea.tags || []).map(tagPill).join('')}</div>
        </div>
      `).join('');
    }

    function renderSolutions(problem) {
      const solutions = problem.solutions || [];
      if (!solutions.length) return '<div class="empty">Решений пока нет.</div>';
      return solutions.map(solution => `
        <div class="card">
          <div class="item-title">
            <span>${esc(solution.title || solution.id)}</span>
            ${statusPill(solution.status)}
          </div>
          ${textBlock(solution.text, solution.definition_ids || [], solution.standard_idea_ids || [])}
          ${renderExamples(solution.examples || [], solution.definition_ids || [], solution.standard_idea_ids || [])}
          <div class="pill-row">
            ${(solution.definition_ids || []).map(definitionPill).join('')}
            ${(solution.idea_ids || []).map(id => `<span class="pill code">${esc(id)}</span>`).join('')}
            ${(solution.standard_idea_ids || []).map(standardIdeaPill).join('')}
          </div>
        </div>
      `).join('');
    }

    function renderRelations(problem) {
      const items = relationsForProblem(problem.id);
      if (!items.length) return '<div class="empty">Связей пока нет.</div>';
      return items.sort((a, b) => a.distance - b.distance || a.id.localeCompare(b.id)).map(rel => {
        const forward = rel.from === problem.id;
        const otherId = forward ? rel.to : rel.from;
        const other = problems[otherId];
        const text = forward ? rel.forward_text : rel.backward_text;
        return `
          <div class="card">
            <div class="item-title">
              <a class="relation-link" href="#${encodeURIComponent(otherId)}">${esc(other?.title || otherId)}</a>
              <span class="pill">${esc(label(taxonomy.relation_types, rel.type))}</span>
              <span class="pill">длина ${esc(rel.distance)}</span>
              ${statusPill(rel.status)}
            </div>
            ${textBlock(text)}
          </div>
        `;
      }).join('');
    }

    function renderSources(problem) {
      const items = problem.sources || [];
      if (!items.length) return '<div class="empty">Источники пока не указаны.</div>';
      return items.map(item => {
        const source = sources[item.source_id];
        if (!source) return '';
        return `
          <div class="card">
            <div class="item-title">
              <a href="${esc(source.url)}" target="_blank" rel="noreferrer">${esc(source.title)}</a>
              ${statusPill(item.status)}
            </div>
            <div class="subtle">${esc(source.type)} · ${esc(source.language)} · ${source.official ? 'официальный' : 'справочный'}</div>
          </div>
        `;
      }).join('');
    }

    function renderProperties(problem) {
      const props = problem.properties || {};
      const keys = Object.keys(props);
      if (!keys.length) return '<div class="empty">Динамические признаки пока не указаны.</div>';
      return keys.map(key => {
        const item = props[key];
        const value = Array.isArray(item.value) ? item.value.join(', ') : String(item.value);
        return `
          <div class="card">
            <div class="item-title">
              <span>${esc(label(taxonomy.properties, key))}</span>
              ${statusPill(item.status)}
            </div>
            <div class="code">${esc(value)}</div>
          </div>
        `;
      }).join('');
    }

    function renderCommentCard(comment) {
      const targetHtml = comment.target?.type === 'problem'
        ? `<a class="relation-link" href="#${encodeURIComponent(comment.target.problem_id)}">${esc(problems[comment.target.problem_id]?.title || comment.target.problem_id)}</a>`
        : '<span class="pill">Архитектура базы</span>';
      return `
        <div class="card">
          <div class="item-title">
            <span>${esc(comment.title)}</span>
            <span class="pill">${esc(label(taxonomy.comment_kinds, comment.kind))}</span>
            ${commentStatusPill(comment.status)}
          </div>
          <div class="subtle">${esc(comment.author)} · ${esc(comment.created_at || '')}</div>
          <div style="margin:8px 0 10px;">${targetHtml}</div>
          ${textBlock(comment.text)}
          ${comment.response?.notes ? `<div class="subtle" style="margin-top:10px;">Ответ: ${esc(comment.response.notes)}</div>` : ''}
        </div>
      `;
    }

    function problemCommentKindOptions() {
      return ['bug_report', 'alternative_solution', 'related_connection']
        .map(kind => `<option value="${esc(kind)}">${esc(label(taxonomy.comment_kinds, kind))}</option>`)
        .join('');
    }

    function architectureCommentKindOptions() {
      return `<option value="architecture">${esc(label(taxonomy.comment_kinds, 'architecture'))}</option>`;
    }

    function renderCommentForm(targetType, problemId = '') {
      const title = targetType === 'problem' ? 'Новый комментарий к задаче' : 'Новый комментарий по архитектуре';
      const note = targetType === 'problem'
        ? 'Сохраните файл в data/comments/, чтобы я потом увидел его и смог обработать.'
        : 'Сохраните файл в data/comments/, чтобы комментарий попал в базу.';
      const options = targetType === 'problem' ? problemCommentKindOptions() : architectureCommentKindOptions();
      return `
        <form class="comment-form" data-comment-form data-target-type="${esc(targetType)}" data-problem-id="${esc(problemId)}">
          <div class="item-title"><span>${title}</span></div>
          <select name="kind">${options}</select>
          <input name="author" type="text" placeholder="Автор" required>
          <input name="title" type="text" placeholder="Короткий заголовок" required>
          <textarea name="text" placeholder="Текст комментария" required></textarea>
          <div class="subtle">${note}</div>
          <button type="submit">Сохранить комментарий в файл</button>
        </form>
      `;
    }

    function buildCommentPayload(targetType, problemId, formData) {
      const now = new Date();
      const createdAt = now.toISOString().slice(0, 10);
      const timePart = now.toISOString().slice(11, 19).replaceAll(':', '-');
      const rawTitle = String(formData.get('title') || '').trim().toLowerCase();
      const slug = rawTitle.replace(/[^a-zа-я0-9]+/gi, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'comment';
      const baseId = targetType === 'problem' ? `${problemId}-${slug}` : `architecture-${slug}`;
      return {
        id: `comment-${createdAt}-${timePart}-${baseId}`,
        target: targetType === 'problem' ? { type: 'problem', problem_id: problemId } : { type: 'architecture' },
        kind: String(formData.get('kind') || '').trim(),
        title: String(formData.get('title') || '').trim(),
        text: String(formData.get('text') || '').trim(),
        author: String(formData.get('author') || '').trim(),
        created_at: createdAt,
        status: 'open',
        response: { status: 'open', notes: '' },
        editorial: { created_by: 'human', notes: [] }
      };
    }

    async function persistCommentPayload(payload) {
      const text = JSON.stringify(payload, null, 2);
      const suggestedName = `${payload.id}.yaml`;
      if (window.showSaveFilePicker) {
        const handle = await window.showSaveFilePicker({
          suggestedName,
          types: [{
            description: 'YAML',
            accept: { 'application/x-yaml': ['.yaml'] }
          }]
        });
        const writable = await handle.createWritable();
        await writable.write(text);
        await writable.close();
        alert('Комментарий сохранён. Если вы сохранили его не в data/comments/, перенесите файл туда.');
        return;
      }
      const blob = new Blob([text], { type: 'application/x-yaml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = suggestedName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      alert('Файл комментария скачан. Переместите его в data/comments/, чтобы база его увидела.');
    }

    function attachCommentForms() {
      document.querySelectorAll('[data-comment-form]').forEach(form => {
        form.addEventListener('submit', async event => {
          event.preventDefault();
          const formData = new FormData(form);
          const payload = buildCommentPayload(form.dataset.targetType, form.dataset.problemId || '', formData);
          try {
            await persistCommentPayload(payload);
            form.reset();
          } catch (error) {
            alert(`Не удалось сохранить комментарий: ${error.message || error}`);
          }
        });
      });
    }

    function renderProblem() {
      const route = currentRoute();
      const problem = problems[route.id];
      byId('content').innerHTML = `
        <div class="topline">
          <span class="pill code">${esc(problem.id)}</span>
          ${statusPill(problem.editorial?.review_status)}
          <span class="pill">${esc(label(taxonomy.difficulty_levels, problem.difficulty?.main))}</span>
        </div>
        <h2>${esc(problem.title)}</h2>
        <div class="subtle">${esc(problem.difficulty?.comment || '')}</div>
        <div class="pill-row">${(problem.tags || []).map(tagPill).join('')}</div>

        ${renderAuthors(problem)}

        <div class="section">
          <h3>Формулировки</h3>
          ${renderStatements(problem)}
        </div>

        <div class="section">
          <h3>Родственные связи</h3>
          ${renderRelations(problem)}
        </div>

        <div class="section">
          <h3>Идеи</h3>
          ${renderIdeas(problem)}
        </div>

        <div class="section">
          <h3>Решения</h3>
          ${renderSolutions(problem)}
        </div>

        <div class="section">
          <h3>Признаки</h3>
          ${renderProperties(problem)}
        </div>

        <div class="section">
          <h3>Источники</h3>
          ${renderSources(problem)}
        </div>

        <div class="section">
          <h3>Комментарии</h3>
          ${commentsForProblem(problem.id).length ? commentsForProblem(problem.id).map(renderCommentCard).join('') : '<div class="empty">Комментариев к этой задаче пока нет.</div>'}
          ${renderCommentForm('problem', problem.id)}
        </div>

        <div class="section">
          <h3>Редактура</h3>
          ${textBlock((problem.editorial?.notes || []).join('\n') || 'Заметок нет.')}
        </div>
      `;
      attachCommentForms();
      if (window.MathJax?.typesetPromise) window.MathJax.typesetPromise([byId('content')]);
    }

    function renderDefinition() {
      const route = currentRoute();
      const item = definitions[route.id];
      const usage = definitionUsage(item.id);
      byId('content').innerHTML = `
        <div class="topline">
          <span class="pill code">${esc(item.id)}</span>
          ${statusPill(item.status)}
          <span class="pill">стандартное определение</span>
        </div>
        <h2>${esc(item.title)}</h2>
        <div class="section">
          <h3>Формулировка</h3>
          <div class="card">${textBlock(item.text)}</div>
        </div>
        <div class="section">
          <h3>Примеры</h3>
          ${(item.examples || []).map(example => `<div class="card">${textBlock(example)}</div>`).join('')}
        </div>
        <div class="section">
          <h3>Используется в задачах</h3>
          ${usage.length ? usage.map(problem => `
            <div class="card">
              <a class="relation-link" href="#${encodeURIComponent(problem.id)}">${esc(problem.title)}</a>
              <div class="id">${esc(problem.id)}</div>
            </div>
          `).join('') : '<div class="empty">Пока не используется.</div>'}
        </div>
      `;
      if (window.MathJax?.typesetPromise) window.MathJax.typesetPromise([byId('content')]);
    }

    function renderStandardIdea() {
      const route = currentRoute();
      const item = standardIdeas[route.id];
      const usage = standardIdeaUsage(item.id);
      byId('content').innerHTML = `
        <div class="topline">
          <span class="pill code">${esc(item.id)}</span>
          ${statusPill(item.status)}
          <span class="pill">стандартная идея</span>
        </div>
        <h2>${esc(item.title)}</h2>
        <div class="section">
          <h3>Описание</h3>
          <div class="card">${textBlock(item.text)}</div>
        </div>
        <div class="section">
          <h3>Примеры</h3>
          ${(item.examples || []).map(example => `<div class="card">${textBlock(example)}</div>`).join('')}
        </div>
        <div class="section">
          <h3>Используется в решениях</h3>
          ${usage.length ? usage.map(entry => `
            <div class="card">
              <a class="relation-link" href="#${encodeURIComponent(entry.problem.id)}">${esc(entry.problem.title)}</a>
              <div class="subtle">${esc(entry.solution.title || entry.solution.id)} · <span class="code">${esc(entry.problem.id)}</span></div>
            </div>
          `).join('') : '<div class="empty">Пока не используется.</div>'}
        </div>
      `;
      if (window.MathJax?.typesetPromise) window.MathJax.typesetPromise([byId('content')]);
    }

    function renderCommentPage() {
      const route = currentRoute();
      const comment = route.id ? comments[route.id] : null;
      if (!comment) {
        byId('content').innerHTML = `
          <div class="topline">
            <span class="pill">Комментарии</span>
          </div>
          <h2>Комментарии и предложения</h2>
          <div class="section">
            <h3>Комментарии по архитектуре</h3>
            ${architectureComments().length ? architectureComments().map(renderCommentCard).join('') : '<div class="empty">Архитектурных комментариев пока нет.</div>'}
            ${renderCommentForm('architecture')}
          </div>
        `;
        attachCommentForms();
        return;
      }
      const target = comment.target?.type === 'problem'
        ? `<a class="relation-link" href="#${encodeURIComponent(comment.target.problem_id)}">${esc(problems[comment.target.problem_id]?.title || comment.target.problem_id)}</a>`
        : '<span class="pill">Архитектура базы</span>';
      byId('content').innerHTML = `
        <div class="topline">
          <span class="pill code">${esc(comment.id)}</span>
          <span class="pill">${esc(label(taxonomy.comment_kinds, comment.kind))}</span>
          ${commentStatusPill(comment.status)}
        </div>
        <h2>${esc(comment.title)}</h2>
        <div class="subtle">${esc(comment.author)} · ${esc(comment.created_at || '')}</div>
        <div class="section">
          <h3>Цель комментария</h3>
          <div class="card">${target}</div>
        </div>
        <div class="section">
          <h3>Текст</h3>
          <div class="card">${textBlock(comment.text)}</div>
        </div>
        <div class="section">
          <h3>Текущий ответ</h3>
          <div class="card">
            <div class="pill-row">${comment.response?.status ? commentStatusPill(comment.response.status) : ''}</div>
            ${textBlock(comment.response?.notes || 'Ответ пока не добавлен.')}
          </div>
        </div>
        <div class="section">
          <h3>Новый комментарий по архитектуре</h3>
          ${renderCommentForm('architecture')}
        </div>
      `;
      attachCommentForms();
    }

    function render() {
      const route = currentRoute();
      state.view = route.type === 'definition' ? 'definitions' : route.type === 'idea' ? 'ideas' : route.type === 'comment' ? 'comments' : 'problems';
      renderSidebar();
      renderTagFilter();
      if (route.type === 'definition') renderDefinition();
      else if (route.type === 'idea') renderStandardIdea();
      else if (route.type === 'comment') renderCommentPage();
      else renderProblem();
    }

    byId('search-input').addEventListener('input', event => {
      state.query = event.target.value;
      renderSidebar();
    });

    byId('tag-filter').addEventListener('change', event => {
      state.tag = event.target.value;
      renderSidebar();
    });

    byId('mode-problems').addEventListener('click', () => setProblem(sortedProblems()[0]?.id));
    byId('mode-definitions').addEventListener('click', () => setDefinition(sortedDefinitions()[0]?.id));
    byId('mode-ideas').addEventListener('click', () => setStandardIdea(sortedStandardIdeas()[0]?.id));
    byId('mode-comments').addEventListener('click', () => setComment(sortedComments()[0]?.id || null));

    window.addEventListener('hashchange', render);
    render();
  </script>
</body>
</html>
