        "простом графе",
        "простым графом"
      ],
      "text": "Простой граф — это граф без петель и кратных ребер: между двумя различными вершинами может быть не более одного ребра, а ребро из вершины в саму себя запрещено.",
      "examples": [
        "Треугольник из трех вершин и трех ребер — простой граф.",
        "Если между двумя вершинами проведены два разных ребра, такой граф уже не простой."
      ],
      "status": "ai_checked"
    },
    {
