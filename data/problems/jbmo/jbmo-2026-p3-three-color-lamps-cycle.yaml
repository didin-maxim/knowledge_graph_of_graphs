    "solutions":  [
                      {
                          "id":  "sol-ai-f3-image",
                          "title":  "Образ линейного отображения над F3",
                          "text":  "Ответ равен\n\\[\n\\begin{cases}\nn, \u0026 3\\mid n,\\\\\nn-1, \u0026 n\\text{ нечётно и }3\\nmid n,\\\\\nn-2, \u0026 n\\text{ чётно и }3\\nmid n.\n\\end{cases}\n\\]\n\nБудем считать вершины цикла по модулю \\(n\\) в направлении по часовой стрелке. Закодируем красный, синий и зелёный цвета числами \\(0,1,2\\) из \\(\\mathbb F_3\\). Одно нажатие прибавляет 1, а два нажатия прибавляют 2, то есть \\(-1\\). Пусть ход с выбором вершины \\(i\\) был сделан \\(x_i\\) раз по модулю 3. Тогда итоговое значение в вершине \\(i\\) равно\n\\[\ny_i=x_{i-1}-x_{i+1}.\n\\]\nОбозначим это линейное отображение через \\(T\\colon\\mathbb F_3^n\\to\\mathbb F_3^n\\). Любой набор \\(x_i\\in\\mathbb F_3\\) можно реализовать, сделав в каждой вершине 0, 1 или 2 хода, поэтому образ \\(T\\) в точности совпадает с множеством достижимых раскрасок.\n\nВсегда выполняется \\(\\sum_i y_i=0\\). Если \\(n\\) чётно, то верно и более сильное утверждение:\n\\[\n\\sum_{i\\text{ чётное}}y_i=0,\\qquad \\sum_{i\\text{ нечётное}}y_i=0,\n\\]\nпоскольку в каждой из этих сумм одни и те же переменные \\(x_j\\) появляются по одному разу со знаками плюс и минус.\n\nПокажем, что других ограничений нет. Равенство \\(Tx=0\\) означает \\(x_{i-1}=x_{i+1}\\) для всех \\(i\\). При нечётном \\(n\\) переходы через две вершины обходят весь цикл, поэтому все \\(x_i\\) равны и \\(\\dim\\ker T=1\\). Следовательно, \\(\\dim\\operatorname{im}T=n-1\\). Подпространство \\(\\{y:\\sum y_i=0\\}\\) тоже имеет размерность \\(n-1\\), а образ уже лежит в нём; значит, эти пространства совпадают.\n\nПри чётном \\(n\\) равенства из ядра заставляют быть равными все \\(x_i\\) с чётными индексами и отдельно все \\(x_i\\) с нечётными индексами. Поэтому \\(\\dim\\ker T=2\\) и \\(\\dim\\operatorname{im}T=n-2\\). Два условия на суммы по классам чётности независимы и задают подпространство той же размерности \\(n-2\\). Значит, и в этом случае они полностью характеризуют достижимость.\n\nТеперь максимизируем число координат, равных 2. Если \\(3\\mid n\\), то раскраска \\(y_i=2\\) для всех \\(i\\) удовлетворяет всем нужным суммам: при чётном \\(n\\) число вершин каждой чётности равно \\(n/2\\), которое тоже делится на 3. Поэтому достижимы \\(n\\) зелёных ламп.\n\nПусть \\(3\\nmid n\\) и \\(n\\) нечётно. Все лампы не могут быть зелёными, потому что тогда \\(\\sum_i y_i=2n\\ne0\\) в \\(\\mathbb F_3\\). Однако можно назначить значение 2 всем вершинам, кроме одной, а в оставшейся вершине выбрать единственное значение \\(a\\in\\{0,1\\}\\), для которого \\(2(n-1)+a=0\\). Такая раскраска достижима, поэтому максимум равен \\(n-1\\).\n\nНаконец, пусть \\(3\\nmid n\\) и \\(n\\) чётно. В каждом классе чётности находится \\(n/2\\) вершин, причём \\(3\\nmid n/2\\). Поэтому ни один класс не может целиком состоять из зелёных вершин: сумма его значений была бы ненулевой. Значит, незелёных ламп не меньше двух. С другой стороны, в каждом классе можно оставить ровно одну незелёную вершину и выбрать для неё \\(a\\in\\{0,1\\}\\) так, чтобы сумма по этому классу стала нулевой. Полученная раскраска достижима и содержит \\(n-2\\) зелёных ламп. Ответ доказан.",
