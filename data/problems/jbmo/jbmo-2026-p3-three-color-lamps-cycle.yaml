                                            "title":  "Условие",
                                            "text":  "По кругу расположены \\(n\\ge 3\\) ламп. Каждая лампа может гореть зелёным, красным или синим светом. При каждом нажатии цвет меняется по циклу: зелёный на красный, красный на синий, синий на зелёный. Изначально все лампы красные. За один ход выбирают лампу \\(L\\), саму её не нажимают, соседнюю с ней лампу по часовой стрелке нажимают один раз, а соседнюю против часовой стрелки — два раза. Какое наибольшее число ламп может стать зелёным после некоторого конечного числа ходов?",
