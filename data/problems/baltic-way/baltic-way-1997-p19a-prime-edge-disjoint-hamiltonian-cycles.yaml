        "title": "Условие, часть (a)",
        "text": "В лесу каждое из \\(n\\) животных, где \\(n\\ge3\\) и \\(n\\) простое, живёт в своей пещере, и между любыми двумя пещерами есть ровно одна отдельная тропа. Перед выборами короля леса некоторые животные проводят кампанию. Каждое такое животное посещает каждую из остальных пещер ровно один раз, передвигается только по тропам, нигде между пещерами не сворачивает с одной тропы на другую и в конце возвращается в свою пещеру. Никакая тропа между двумя пещерами не используется более чем одним агитирующим животным. Докажите, что максимальное число агитирующих животных равно \\((n-1)/2\\).",
