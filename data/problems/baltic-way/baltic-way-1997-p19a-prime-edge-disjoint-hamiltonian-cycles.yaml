      "id": "idea-edge-upper-bound",
      "title": "Общая рёберная верхняя оценка",
      "text": "Каждый гамильтонов цикл в \\(K_n\\) содержит \\(n\\) рёбер, а всего в \\(K_n\\) есть \\(n(n-1)/2\\) рёбер. Поэтому рёберно непересекающихся гамильтоновых циклов не может быть больше \\((n-1)/2\\).",
