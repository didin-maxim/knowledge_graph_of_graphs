      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-prime-difference-cycles",
      "title": "Циклы по ненулевым разностям",
      "text": "Если вершины — вычеты по модулю простого \\(n\\), то для каждого шага \\(a=1,\\ldots,(n-1)/2\\) последовательность \\(0,a,2a,\\ldots,(n-1)a,0\\) является гамильтоновым циклом. Его рёбра имеют разность \\(\\pm a\\), поэтому разные шаги дают непересекающиеся множества рёбер.",
      "tags": [
