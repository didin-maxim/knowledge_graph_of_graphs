  "solutions": [
    {
      "id": "sol-prime-modular-differences",
      "title": "Модульная конструкция для простого \\(n\\)",
      "text": "Переведём условие на язык графов. Пещеры — вершины полного графа \\(K_n\\), тропы — его рёбра, а маршрут одного агитирующего животного — гамильтонов цикл. Требование, что одна тропа не используется двумя животными, означает рёберную непересекаемость выбранных циклов.\n\nСначала получим верхнюю оценку. Каждый гамильтонов цикл проходит по всем \\(n\\) вершинам и содержит ровно \\(n\\) рёбер. В полном графе \\(K_n\\) всего \\(n(n-1)/2\\) рёбер. Если выбрано \\(m\\) попарно рёберно непересекающихся гамильтоновых циклов, то \\(mn\\le n(n-1)/2\\), откуда \\(m\\le (n-1)/2\\).\n\nОсталось построить \\((n-1)/2\\) таких циклов. Пронумеруем вершины вычетами \\(0,1,\\ldots,n-1\\) по модулю \\(n\\). Для каждого \\(a=1,2,\\ldots,(n-1)/2\\) рассмотрим цикл\n\\[\n0, a, 2a, \\ldots, (n-1)a, 0 \\pmod n.\n\\]\nТак как \\(n\\) простое, умножение на ненулевой вычет \\(a\\) переставляет все вычеты, поэтому эта последовательность действительно проходит через все вершины ровно по одному разу и возвращается в начало.\n\nРёбра этого цикла соединяют пары вершин, разность которых равна \\(a\\) или \\(-a\\) по модулю \\(n\\). Для разных \\(a\\) из диапазона \\(1,\\ldots,(n-1)/2\\) множества \\(\\{a,-a\\}\\) различны, значит никакое неориентированное ребро не встречается в двух построенных циклах. Мы получили ровно \\((n-1)/2\\) рёберно непересекающихся гамильтоновых циклов, что совпадает с верхней оценкой. Поэтому максимум равен \\((n-1)/2\\).",
