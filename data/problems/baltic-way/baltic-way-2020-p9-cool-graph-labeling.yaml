      "title": "У вершины с \\(k\\) обработанными соседями есть \\(k+1\\) возможная сумма",
      "text": "При обработке очередной вершины каждое ребро к уже обработанному соседу можно локально изменить так, чтобы сумма у соседа не изменилась, а сумма у новой вершины менялась на 0 или 1.",
