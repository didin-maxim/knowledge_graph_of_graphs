  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Жадная обработка вершин",
      "text": "Зафиксируем произвольный порядок вершин \\(v_1,\\ldots,v_n\\). Сначала положим \\(f(v)=1\\) для всех вершин и \\(f(e)=2\\) для всех рёбер. Удобно думать, что на каждой вершине лежит одна фишка, а на каждом ребре — две фишки.\n\nБудем обрабатывать вершины по порядку. На шаге \\(i\\) пусть \\(x_1,\\ldots,x_k\\) — уже обработанные соседи вершины \\(v_i\\), то есть соседи с меньшими индексами, а \\(e_j=v_ix_j\\). Для каждого такого ребра есть ровно два допустимых действия, сохраняющих сумму \\(S(x_j)\\). Если на \\(x_j\\) лежит одна фишка, можно либо ничего не делать, либо перенести одну фишку с \\(e_j\\) на \\(x_j\\). Тогда вклад ребра в сумму \\(x_j\\) уменьшается на 1, а вклад вершины \\(x_j\\) увеличивается на 1. Если на \\(x_j\\) лежат две фишки, можно либо ничего не делать, либо перенести одну фишку с \\(x_j\\) на \\(e_j\\); сумма \\(S(x_j)\\) снова сохраняется.\n\nПри каждом из \\(k\\) независимых выборов сумма \\(S(v_i)\\) меняется на 0 или 1 относительно текущего значения. Поэтому возможны все \\(k+1\\) значения, получающиеся по числу выполненных изменений. Среди уже обработанных соседей есть только \\(k\\) чисел \\(S(x_1),\\ldots,S(x_k)\\), значит можно выбрать действия так, чтобы итоговое \\(S(v_i)\\) отличалось от всех этих \\(k\\) чисел. После этого фиксируем шаг и переходим дальше.\n\nОсталось проверить допустимость. Значение вершины всегда остаётся равным 1 или 2. Каждое ребро \\(v_mv_i\\) с \\(m<i\\) рассматривается только на шаге \\(i\\), поэтому его значение из начального 2 меняется не более чем на 1 и остаётся в множестве \\(\\{1,2,3\\}\\). Сумма \\(S(v_i)\\) после шага \\(i\\) больше не меняется: будущие шаги могут трогать ребро к \\(v_i\\), но одновременно компенсируют это переносом фишки на \\(v_i\\) или с \\(v_i\\). На шаге \\(i\\) мы сделали \\(S(v_i)\\) отличной от сумм всех ранее обработанных соседей, поэтому в конце у любых соседних вершин суммы различны. Получена крутая разметка.",
