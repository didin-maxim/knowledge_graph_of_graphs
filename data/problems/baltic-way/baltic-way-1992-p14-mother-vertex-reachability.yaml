      "id": "sol-official-expanded",
      "title": "Максимальное число достижимых городов",
      "text": "Выберем город \\(A\\), из которого достижимо максимальное возможное число городов. Предположим, что есть город \\(B\\), до которого из \\(A\\) добраться нельзя. По условию для пары \\(A,B\\) один из этих городов достижим из другого; так как \\(B\\) не достижим из \\(A\\), город \\(A\\) достижим из \\(B\\).\n\nТогда из \\(B\\) можно добраться до \\(A\\), а затем из \\(A\\) — до каждого города, достижимого из \\(A\\). Кроме того, из \\(B\\) достижим сам \\(A\\), который не входил в множество городов, достижимых из \\(A\\) как новый конечный город в этом сравнении. Поэтому из \\(B\\) достижимо больше городов, чем из \\(A\\), что противоречит выбору \\(A\\). Следовательно, такого \\(B\\) нет, и из \\(A\\) достижимы все остальные города.",
