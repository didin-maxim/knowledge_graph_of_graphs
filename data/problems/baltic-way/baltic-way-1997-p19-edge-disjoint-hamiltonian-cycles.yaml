  "ideas": [{
    "id": "idea-complete-graph-cycle-packing",
    "title": "Подсчёт рёбер и циклы по модулю",
    "text": "Каждый гамильтонов цикл в \\(K_n\\) использует \\(n\\) рёбер, а всего рёбер \\(n(n-1)/2\\). Для простого \\(n\\) циклы \\(0,a,2a,\\ldots,(n-1)a,0\\) по модулю \\(n\\) дают \\((n-1)/2\\) рёберно непересекающихся циклов.",
