        "title": "Условие",
        "text": "В лесу каждое из \\(n\\) животных, \\(n\\ge3\\), живёт в своей пещере, и между любыми двумя пещерами есть ровно одна отдельная тропа. Перед выборами короля леса некоторые животные проводят кампанию. Каждое такое животное посещает каждую из остальных пещер ровно один раз, передвигается только по тропам, нигде между пещерами не сворачивает с одной тропы на другую и в конце возвращается в свою пещеру. Известно также, что никакая тропа между двумя пещерами не используется более чем одним агитирующим животным. (a) Докажите, что для простого \\(n\\) максимальное число агитирующих животных равно \\((n-1)/2\\). (b) Найдите максимум при \\(n=9\\).",
