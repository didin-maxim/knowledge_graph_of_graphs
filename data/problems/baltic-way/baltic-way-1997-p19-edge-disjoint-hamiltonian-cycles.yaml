  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Упаковка гамильтоновых циклов",
      "text": "Переведём условие на язык графов. Пещеры — вершины полного графа \\(K_n\\), тропы — его рёбра, а кампания одного животного — гамильтонов цикл. Условие о том, что одна тропа не используется двумя животными, означает рёберную непересекаемость выбранных циклов.\n\nКаждый гамильтонов цикл содержит \\(n\\) рёбер. В \\(K_n\\) всего \\(n(n-1)/2\\) рёбер, поэтому число таких циклов не превосходит \\((n-1)/2\\).\n\nПусть теперь \\(n\\) — простое. Пронумеруем вершины вычетами \\(0,1,\\ldots,n-1\\) по модулю \\(n\\). Для каждого \\(a=1,2,\\ldots,(n-1)/2\\) рассмотрим цикл \\(0,a,2a,\\ldots,(n-1)a,0\\). Так как \\(n\\) простое, ненулевой шаг \\(a\\) проходит через все вычеты, поэтому это гамильтонов цикл. Его рёбра соединяют пары вершин, разность которых равна \\(\\pm a\\). Для разных \\(a\\) из выбранного диапазона эти множества разностей различны, значит циклы не имеют общих рёбер. Получены \\((n-1)/2\\) циклов, и оценка точна.\n\nДля \\(n=9\\) верхняя оценка даёт не больше 4 циклов. Официальная конструкция из четырёх циклов такова:\n\\(0,1,2,8,3,7,4,6,5,0\\),\n\\(0,2,3,1,4,8,5,7,6,0\\),\n\\(0,3,4,2,5,1,6,8,7,0\\),\n\\(0,4,5,3,6,2,7,1,8,0\\).\nПрямая проверка показывает, что каждое из этих четырёх перечислений проходит через все девять вершин и возвращается в начало, а никакое ребро не повторяется в двух циклах. Следовательно, при \\(n=9\\) максимум равен 4.",
