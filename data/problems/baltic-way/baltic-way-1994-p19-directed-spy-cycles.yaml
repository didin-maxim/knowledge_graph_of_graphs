  "solutions": [{
    "id": "sol-official-expanded",
    "title": "Нейтральные пары",
    "text": "Назовём двух шпионов нейтральными, если ни один из них не следит за другим. Для шпиона \\(A_i\\) обозначим через \\(a_i\\) число шпионов, которые следят за ним, через \\(b_i\\) число шпионов, за которыми следит он, а через \\(c_i\\) число нейтральных к нему шпионов. Тогда \\(a_i+b_i+c_i=15\\).\n\nИз условия о любых 10 шпионах следует, что \\(a_i+c_i\\le 8\\) и \\(b_i+c_i\\le 8\\). Действительно, если бы, например, \\(a_i+c_i\\ge9\\), то вместе с \\(A_i\\) можно было бы выбрать 10 шпионов, среди которых из \\(A_i\\) нет дуги ни в одну из остальных девяти вершин. Тогда \\(A_i\\) не мог бы стоять в ориентированном цикле длины 10. Аналогично для \\(b_i+c_i\\ge9\\). Складывая две оценки, получаем \\(a_i+b_i+2c_i\\le16\\). Так как \\(a_i+b_i+c_i=15\\), имеем \\(c_i\\le1\\).\n\nПредположим теперь, что существует группа из 11 шпионов без нужной нумерации. Возьмём в ней произвольного шпиона \\(B\\). Остальные 10 можно занумеровать \\(C_1,\\ldots,C_{10}\\) так, что \\(C_1\to C_2\to\\cdots\to C_{10}\to C_1\\). Если среди \\(C_i\\) нет нейтрального к \\(B\\), то между \\(B\\) и каждым \\(C_i\\) есть ровно одна дуга. Если \\(C_i\to B\\), то не может быть \\(B\to C_{i+1}\\), иначе \\(C_i,B,C_{i+1},C_{i+2},\\ldots,C_{i-1}\\) дали бы ориентированный цикл длины 11. Поэтому из \\(C_i\to B\\) следует \\(C_{i+1}\to B\\). Так как хотя бы одна дуга между \\(B\\) и циклом направлена в \\(B\\) или из \\(B\\), обходом по циклу получаем, что все \\(C_i\to B\\), но тогда из любой дуги \\(B\to C_j\\), если она есть, получается противоречие; если таких дуг нет, то \\(B\\) имеет десять входящих соседей в этой группе, что несовместимо с оценками для подходящего выбора 10 вершин. Значит, среди десяти \\(C_i\\) обязан быть нейтральный к \\(B\\).\n\nИтак, в любой предполагаемой плохой группе из 11 вершин каждая вершина имеет нейтральную пару внутри этой группы. Но выше доказано, что у каждой вершины во всём графе не больше одного нейтрального партнёра. Тогда нейтральные пары должны разбить 11 вершин на пары, что невозможно для нечётного числа 11. Противоречие доказывает утверждение.",
