  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Нейтральные пары и вставка вершины в цикл",
      "text": "Назовём двух шпионов нейтральными, если ни один из них не следит за другим. Для шпиона \\(A_i\\) обозначим через \\(a_i\\) число шпионов, которые следят за ним, через \\(b_i\\) число шпионов, за которыми следит он, а через \\(c_i\\) число шпионов, нейтральных к нему. Тогда \\(a_i+b_i+c_i=15\\).\n\nДокажем, что для каждого \\(i\\) выполнены неравенства \\(a_i+c_i\\le 8\\) и \\(b_i+c_i\\le 8\\). Если бы \\(a_i+c_i\\ge 9\\), то можно было бы выбрать \\(A_i\\) и ещё девять шпионов из тех, за кем \\(A_i\\) не следит: это либо шпионы, следящие за \\(A_i\\), либо нейтральные к \\(A_i\\). В выбранной десятке из \\(A_i\\) не выходит ни одной дуги, поэтому \\(A_i\\) не может иметь следующую вершину в ориентированном 10-цикле. Это противоречит условию. Так же, если бы \\(b_i+c_i\\ge 9\\), можно было бы выбрать \\(A_i\\) и ещё девять шпионов, которые не следят за \\(A_i\\); тогда в выбранной десятке в \\(A_i\\) не входит ни одной дуги, и \\(A_i\\) не может иметь предыдущую вершину в ориентированном 10-цикле. Значит, обе оценки верны. Складывая их, получаем \\(a_i+b_i+2c_i\\le 16\\). Вместе с \\(a_i+b_i+c_i=15\\) это даёт \\(c_i\\le 1\\). Итак, у каждого шпиона во всей группе из 16 не больше одного нейтрального партнёра.\n\nПредположим теперь, что существует плохая группа \\(S\\) из 11 шпионов, которую нельзя занумеровать требуемым образом. Возьмём в ней произвольного шпиона \\(B\\). Остальные 10 шпионов, по условию, можно занумеровать \\(C_1,\\ldots,C_{10}\\) так, что \\(C_1\\to C_2\\to\\cdots\\to C_{10}\\to C_1\\); индексы далее считаются по модулю 10.\n\nПокажем, что среди \\(C_1,\\ldots,C_{10}\\) есть шпион, нейтральный к \\(B\\). Предположим обратное. Тогда между \\(B\\) и каждым \\(C_i\\) проведена ровно одна дуга. Не все эти дуги могут идти из \\(B\\) в цикл, потому что тогда у \\(B\\) было бы по крайней мере 10 исходящих соседей, а это противоречит уже доказанному неравенству \\(b_B+c_B\\le 8\\). Значит, для некоторого \\(i\\) имеем \\(C_i\\to B\\).\n\nЕсли при этом \\(B\\to C_{i+1}\\), то вершины \\(C_i,B,C_{i+1},C_{i+2},\\ldots,C_{i-1}\\) образуют ориентированный цикл длины 11: сначала идём по дуге \\(C_i\\to B\\), затем по дуге \\(B\\to C_{i+1}\\), а дальше по имеющемуся 10-циклу до \\(C_i\\). Это запрещено выбором плохой группы \\(S\\). Поэтому из \\(C_i\\to B\\) обязательно следует \\(C_{i+1}\\to B\\). Повторяя этот вывод вокруг всего цикла, получаем \\(C_j\\to B\\) для всех \\(j=1,\\ldots,10\\). Но тогда у \\(B\\) есть по крайней мере 10 входящих соседей, что противоречит неравенству \\(a_B+c_B\\le 8\\). Противоречие доказывает, что нейтральный к \\(B\\) шпион среди \\(C_1,\\ldots,C_{10}\\) действительно существует.\n\nИтак, в плохой группе \\(S\\) каждая вершина имеет хотя бы одного нейтрального партнёра внутри \\(S\\). С другой стороны, во всём графе у каждой вершины не больше одного нейтрального партнёра. Значит, внутри \\(S\\) каждая вершина имеет ровно одного нейтрального партнёра, то есть нейтральные пары должны разбить 11 вершин на непересекающиеся пары. Это невозможно, так как 11 нечётно. Полученное противоречие доказывает, что каждые 11 шпионов можно занумеровать требуемым образом.",
