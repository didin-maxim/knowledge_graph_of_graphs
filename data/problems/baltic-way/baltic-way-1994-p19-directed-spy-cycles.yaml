      "id": "idea-neutral-pair-count",
      "title": "Нейтральные пары образуют невозможное паросочетание",
      "text": "Сначала из свойства всех 10-вершинных множеств следует, что каждая вершина имеет не больше одного нейтрального партнёра во всём орграфе. Затем в предполагаемом плохом 11-вершинном множестве каждая вершина обязана иметь нейтрального партнёра внутри множества: иначе её можно вставить в 10-цикл или получить слишком большую входящую/исходящую степень. Но 11 вершин нельзя разбить на пары.",
