    "id": "idea-neutral-pair-count",
    "title": "У каждой вершины не больше одного нейтрального партнёра",
    "text": "Если у вершины слишком мало входящих или исходящих соседей среди остальных, можно выбрать 10 вершин, которые не образуют требуемый цикл. Отсюда число нейтральных вершин для каждой вершины не превосходит 1.",
