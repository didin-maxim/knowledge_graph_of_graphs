      "title": "Условие",
      "text": "В разведывательной службе Чудо-острова в Тарту находятся 16 шпионов. Каждый из них следит за некоторыми своими коллегами. Известно, что если шпион \\(A\\) следит за шпионом \\(B\\), то \\(B\\) не следит за \\(A\\). Кроме того, любые 10 шпионов можно занумеровать так, что первый следит за вторым, второй — за третьим, ..., десятый — за первым. Докажите, что любые 11 шпионов тоже можно занумеровать таким образом.",
