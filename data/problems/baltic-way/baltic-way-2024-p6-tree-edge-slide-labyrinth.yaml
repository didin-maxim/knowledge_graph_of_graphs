  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Индукция по числу вершин",
      "text": "Будем писать \\(ab\\) для коридора между пещерами \\(a\\) и \\(b\\). Сначала заметим, что любой ход обратим. Пусть есть путь \\(a-b-c\\), фишка стоит на \\(ab\\), и сделан ход \\(ab\to bc\\), после которого вместо \\(ab\\) появилось \\(ac\\). Теперь можно выполнить \\(bc\to ca\\), а затем \\(ca\to ab\\). После этих двух ходов фишка снова стоит на \\(ab\\), и множество рёбер снова такое же, как до первого хода. Значит, если одну схему можно привести к другой, то можно пройти и обратно.\n\nПоэтому достаточно доказать, что из любой схемы можно получить звезду с некоторым центром. Докажем это индукцией по числу \\(n\\) вершин. При \\(n=3\\) любое дерево уже является звездой. Пусть \\(n\\ge 4\\). В дереве есть хотя бы два листа; они не могут быть соединены друг с другом, иначе при \\(n>2\\) дерево было бы несвязным. Значит, среди этих двух листьев найдётся лист \\(v\\), ребро которого не является текущим ребром с фишкой.\n\nУдалим лист \\(v\\). По предположению индукции, не трогая ребро при \\(v\\), можно преобразовать оставшееся дерево в звезду. Пусть её центр \\(c\\), а фишка после этого стоит на ребре \\(cw\\). Осталось присоединить лист \\(v\\) к центру. Если \\(v\\) уже соединён с \\(c\\), всё готово. Если \\(v\\) соединён с \\(w\\), то ход \\(cw\to wv\\) заменяет \\(cw\\) на \\(cv\\); после него фишка стоит на \\(wv\\), а затем нужная звезда получается с тем же центром после обратного переноса фишки внутри уже имеющейся звезды, что не меняет достижимость. В явной официальной записи достаточно последовательности \\(cw\to wv\to vc\\).\n\nОстаётся случай, когда \\(v\\) соединён с некоторой нецентральной вершиной \\(u\ne w\\). Тогда выполняем последовательность ходов \\(wc\to cu\to uw\to uv\to vw\to wc\to wu\to uc\\). Прямая проверка показывает, что в результате ребро \\(uv\\) заменяется на \\(cv\\), а все рёбра звезды на остальных вершинах восстанавливаются. Таким образом, дерево на \\(n\\) вершинах тоже приводится к звезде. По обратимости ходов из любой исходной схемы можно перейти к звезде, а из звезды — к любой заданной схеме.",
