  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Индукция по числу вершин",
      "text": "Будем писать \\(ab\\) для коридора между пещерами \\(a\\) и \\(b\\). Сначала заметим, что любой ход обратим. Пусть есть путь \\(a-b-c\\), фишка стоит на \\(ab\\), и сделан ход \\(ab\\to bc\\), после которого вместо \\(ab\\) появилось \\(ac\\). Теперь можно выполнить \\(bc\\to ca\\), а затем \\(ca\\to ab\\): после первого из этих двух ходов удаляется \\(bc\\) и возвращается \\(ab\\), а после второго удаляется \\(ac\\) и возвращается \\(bc\\). Фишка снова стоит на \\(ab\\), и множество рёбер снова такое же, как до исходного хода. Значит, если одну схему можно привести к другой, то можно пройти и обратно.\n\nПоэтому достаточно доказать, что из любой схемы можно получить звезду с некоторым центром. Докажем это индукцией по числу \\(n\\) вершин. При \\(n=3\\) любое дерево уже является звездой. Пусть \\(n\\ge 4\\). В дереве есть хотя бы два листа: это, например, концы самого длинного простого пути. Эти два листа не могут быть соединены друг с другом, иначе при \\(n>2\\) дерево было бы несвязным. Значит, среди них найдётся лист \\(v\\), ребро которого не является текущим ребром с фишкой.\n\nУдалим лист \\(v\\) вместе с его единственным ребром. По предположению индукции можно преобразовать оставшееся дерево в звезду; все эти ходы идут только по рёбрам оставшегося дерева, поэтому добавленное назад ребро при \\(v\\) им не мешает. Пусть центр полученной звезды на оставшихся вершинах равен \\(c\\), а фишка после этого стоит на ребре \\(cw\\). Осталось присоединить лист \\(v\\) к центру. Если \\(v\\) уже соединён с \\(c\\), всё готово.\n\nЕсли \\(v\\) соединён с \\(w\\), выполняем \\(cw\\to wv\\to vc\\). После хода \\(cw\\to wv\\) ребро \\(cw\\) заменяется на \\(cv\\), а фишка стоит на \\(wv\\). После хода \\(wv\\to vc\\) ребро \\(wv\\) заменяется на \\(wc\\), так что рёбра при \\(v\\) и \\(w\\) стали \\(cv\\) и \\(cw\\), то есть звезда восстановлена уже на всех \\(n\\) вершинах.\n\nОстаётся случай, когда \\(v\\) соединён с некоторой нецентральной вершиной \\(u\\ne w\\). Все остальные рёбра звезды не участвуют в следующих ходах. На четырёх вершинах \\(c,w,u,v\\) сначала есть рёбра \\(cw,cu,uv\\) и фишка на \\(wc\\). Выполняем последовательность \\(wc\\to cu\\to uw\\to uv\\to vw\\to wc\\to wu\\to uc\\). По шагам меняются только три указанных ребра: после первых четырёх ходов получаются соответственно наборы \\(cu,uw,uv\\), затем \\(cw,uw,uv\\), затем \\(cw,vw,uv\\), затем \\(cw,vw,uw\\). Ход \\(vw\\to wc\\) заменяет \\(vw\\) на \\(vc\\), ход \\(wc\\to wu\\) возвращает \\(cu\\), а ход \\(wu\\to uc\\) возвращает \\(cw\\). В конце на этих вершинах стоят рёбра \\(cw,cu,cv\\), значит ребро листа \\(uv\\) заменено на \\(cv\\), а звезда восстановлена.\n\nТаким образом, дерево на \\(n\\) вершинах тоже приводится к звезде. По обратимости ходов из любой исходной схемы можно перейти к звезде, а из звезды — к любой заданной схеме.",
