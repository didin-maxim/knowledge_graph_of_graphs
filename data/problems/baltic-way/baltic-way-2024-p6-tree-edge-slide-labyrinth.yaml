        "title": "Условие",
        "text": "Лабиринт состоит из 2024 пещер и 2023 непересекающихся двусторонних коридоров; каждый коридор соединяет ровно две пещеры, и из любой пещеры можно добраться до любой другой по последовательности коридоров. Сначала Эрик стоит в некотором коридоре. За один ход он может пройти через одну из двух пещер этого коридора в другой коридор, выходящий из той же пещеры. При этом старый коридор исчезает и вместо него появляется новый коридор, соединяющий другой конец нового коридора с другим концом старого: если Эрик был в коридоре между \\(a\\) и \\(b\\), прошёл через \\(b\\) в коридор между \\(b\\) и \\(c\\), то коридор \\(ab\\) исчезает, а появляется коридор \\(ac\\). Докажите, что Эрик может преобразовать лабиринт в любую заранее заданную допустимую схему, независимо от исходной схемы и начального коридора.",
