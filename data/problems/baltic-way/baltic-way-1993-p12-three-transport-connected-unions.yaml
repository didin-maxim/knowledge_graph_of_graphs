      "title": "Условие",
      "text": "В некотором королевстве 13 городов. Между некоторыми парами городов устанавливаются прямые двусторонние сообщения трёх видов: автобусные, железнодорожные или воздушные. Какое наименьшее число сообщений нужно установить, чтобы при выборе любых двух видов транспорта можно было добраться из любого города в любой другой, не используя третий вид?",
