  "solutions": [{
    "id": "sol-official-expanded",
    "title": "Двойной подсчёт и конструкция",
    "text": "Докажем нижнюю оценку. Если выбрать любые два вида транспорта, полученный граф на 13 городах должен быть связным, а значит содержит не меньше 12 сообщений. Есть три выбора пары видов транспорта. При суммировании трёх полученных чисел каждое сообщение учитывается ровно дважды, потому что его цвет входит ровно в две пары цветов. Поэтому \\(2E\\ge 12+12+12=36\\), откуда \\(E\\ge18\\).\n\nПостроим пример с 18 сообщениями. Пронумеруем города числами \\(0,1,\\ldots,12\\). Проведём автобусные сообщения \\(01,23,45,67,89,10\\,11\\), железнодорожные сообщения \\(12,34,56,78,9\\,10,11\\,12\\) и воздушные сообщения \\(02,14,36,58,7\\,10,9\\,12\\). Если оставить автобусные и железнодорожные сообщения, получится путь \\(0-1-2-\\cdots-12\\). Если оставить автобусные и воздушные, получится путь \\(11-10-7-6-3-2-0-1-4-5-8-9-12\\). Если оставить железнодорожные и воздушные, получится путь \\(0-2-1-4-3-6-5-8-7-10-9-12-11\\). Во всех трёх случаях любые два вида транспорта связывают все города. Следовательно, нижняя оценка достижима, и минимальное число сообщений равно 18.",
