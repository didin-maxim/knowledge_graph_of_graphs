    "id": "idea-three-connected-unions-counting",
    "title": "Каждое двухцветное объединение содержит хотя бы 12 рёбер",
    "text": "Связный граф на 13 вершинах имеет не меньше 12 рёбер. Суммируя это для трёх пар цветов, каждое ребро считается ровно дважды.",
