        "id": "stmt-graph-hint",
        "title": "Граф цветов и ограничение диаметра",
        "text": "Постройте граф цветов: вершины — использованные цвета, два цвета соединены ребром, если они соприкасаются по стороне клетки. Этот граф связен и имеет максимальную степень не больше 2; значит, он является путём или циклом. Используя расстояния от центральной клетки или центрального блока \\(2\\times 2\\), найдите наибольшее число вершин такого графа.",
