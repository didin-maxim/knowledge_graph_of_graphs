      "id": "idea-colour-graph-diameter",
      "title": "Граф цветов имеет степень не больше 2",
      "text": "Связный граф максимальной степени 2 — путь или цикл; если от одной или нескольких центральных клеток до любой клетки таблицы путь по клеткам имеет длину не больше \\(n-1\\), то и в графе цветов все цвета лежат на расстоянии не больше \\(n-1\\).",
