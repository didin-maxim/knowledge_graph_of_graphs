        "id": "stmt-original",
        "title": "Условие",
        "text": "Пусть \\(n\\) — положительное целое число. Каждая клетка таблицы \\(n\\times n\\) окрашена в один из \\(k\\) цветов, причём каждый цвет использован хотя бы один раз. Два разных цвета называются соприкасающимися, если существуют две клетки этих цветов с общей стороной. Раскраска такова, что каждый цвет соприкасается не более чем с двумя другими цветами. Найдите максимальное возможное значение \\(k\\) в зависимости от \\(n\\).",
