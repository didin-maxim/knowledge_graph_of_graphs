  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Оценка через граф цветов",
      "text": "Ответ: \\(k=1\\) при \\(n=1\\), \\(k=4\\) при \\(n=2\\), а при \\(n\\ge 3\\) максимум равен \\(2n-1\\). Конструкция для \\(n\\ge3\\) получается диагональными полосами: клетки с одинаковой суммой координат получают один цвет. Тогда цветов \\(2n-1\\), и каждый цвет соприкасается только с соседними по номеру диагоналями.\n\nДокажем оценку сверху. Построим граф, вершины которого — цвета, а ребро соединяет два соприкасающихся цвета. Так как вся таблица связна по сторонам и каждый цвет используется, этот граф связен. По условию степень каждой вершины не больше 2, поэтому граф является либо путём, либо циклом.\n\nПусть \\(n\\) нечётно. Возьмём центральную клетку. От неё до любой клетки таблицы можно дойти по соседним клеткам не более чем за \\(n-1\\) шагов. Следовательно, от цвета центральной клетки до любого другого цвета в графе цветов расстояние не больше \\(n-1\\). В пути или цикле с \\(2n\\) и более вершинами у любой вершины найдётся вершина на расстоянии хотя бы \\(n\\). Значит, \\(k\\le 2n-1\\).\n\nПусть \\(n\\) чётно. Рассмотрим четыре центральные клетки. Если все они имеют разные цвета, то эти четыре цвета образуют цикл длины 4 в графе цветов; так как связный граф степени не больше 2, содержащий цикл, сам является этим циклом, и тогда \\(k=4\\). Если среди центральных клеток два цвета совпадают, то от этого цвета до любой клетки снова можно дойти не более чем за \\(n-1\\) переходов по клеткам, и предыдущий аргумент даёт \\(k\\le 2n-1\\). При \\(n=2\\) возможны четыре цвета, а при \\(n\\ge3\\) диагональная конструкция даёт \\(2n-1\\), что не меньше 4. Ответ доказан.",
