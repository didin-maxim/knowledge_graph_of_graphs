        "id": "stmt-original-k9",
        "title": "Условие, часть (b)",
        "text": "В лесу каждое из 9 животных живёт в своей пещере, и между любыми двумя пещерами есть ровно одна отдельная тропа. Перед выборами короля леса некоторые животные проводят кампанию. Каждое такое животное посещает каждую из остальных пещер ровно один раз, передвигается только по тропам, нигде между пещерами не сворачивает с одной тропы на другую и в конце возвращается в свою пещеру. Никакая тропа между двумя пещерами не используется более чем одним агитирующим животным. Найдите максимальное число агитирующих животных.",
