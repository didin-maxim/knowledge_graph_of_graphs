      "title": "Явная упаковка четырёх циклов",
      "text": "Чтобы достичь верхней оценки, достаточно предъявить четыре гамильтоновых цикла, суммарно использующие все \\(36\\) рёбер \\(K_9\\). Простая модульная конструкция по постоянным шагам для простого числа здесь не применима: шаг \\(3\\) по модулю \\(9\\) не проходит через все вершины.",
