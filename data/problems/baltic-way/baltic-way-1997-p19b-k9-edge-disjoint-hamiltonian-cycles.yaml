  "solutions": [
    {
      "id": "sol-k9-explicit-four-cycles",
      "title": "Явные четыре цикла",
      "text": "Переведём условие на язык графов: пещеры — вершины \\(K_9\\), тропы — рёбра, а маршрут одного агитирующего животного — гамильтонов цикл. Условие о неповторении троп означает, что выбранные циклы должны быть попарно рёберно непересекающимися.\n\nВерхняя оценка следует из подсчёта рёбер. В \\(K_9\\) есть \\(9\\cdot8/2=36\\) рёбер, а каждый гамильтонов цикл содержит \\(9\\) рёбер. Поэтому число таких циклов не превосходит \\(36/9=4\\).\n\nПокажем, что четыре цикла возможны. Пронумеруем вершины числами \\(0,1,\\ldots,8\\) и возьмём следующие циклы:\n\\[\n0,1,2,8,3,7,4,6,5,0,\n\\]\n\\[\n0,2,3,1,4,8,5,7,6,0,\n\\]\n\\[\n0,3,4,2,5,1,6,8,7,0,\n\\]\n\\[\n0,4,5,3,6,2,7,1,8,0.\n\\]\nКаждая строка содержит все девять вершин ровно по одному разу, а затем возвращается в начальную вершину, значит каждая строка задаёт гамильтонов цикл.\n\nОстаётся проверить, что рёбра не повторяются. Удобно сгруппировать рёбра по первому числу пары, записывая каждое ребро как неупорядоченную пару. Первый цикл даёт\n\\((0,1),(1,2),(2,8),(3,8),(3,7),(4,7),(4,6),(5,6),(0,5)\\).\nВторой даёт\n\\((0,2),(2,3),(1,3),(1,4),(4,8),(5,8),(5,7),(6,7),(0,6)\\).\nТретий даёт\n\\((0,3),(3,4),(2,4),(2,5),(1,5),(1,6),(6,8),(7,8),(0,7)\\).\nЧетвёртый даёт\n\\((0,4),(4,5),(3,5),(3,6),(2,6),(2,7),(1,7),(1,8),(0,8)\\).\nВ этих четырёх списках ровно \\(4\\cdot9=36\\) пар, и они попарно различны. Но всего рёбер в \\(K_9\\) тоже \\(36\\), поэтому построенные циклы действительно рёберно непересекаются и вместе покрывают все рёбра \\(K_9\\). Верхняя оценка достигнута, значит максимум равен \\(4\\).",
