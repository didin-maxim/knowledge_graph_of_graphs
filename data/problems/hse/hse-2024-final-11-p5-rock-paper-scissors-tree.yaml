        "title": "Официальная формулировка",
        "text": "Деревни некоторой языческой страны соединены дорогами так, что от любой деревни можно добраться до любой другой, не проходя ни через какую деревню дважды, причём сделать это можно единственным способом. В каждой деревне живёт племя, поклоняющееся одному из трёх идолов: Камню, Ножницам или Бумаге. Камень сильнее Ножниц, Ножницы сильнее Бумаги, а Бумага сильнее Камня. Каждый вечер одновременно каждое племя, у которого есть сосед с более сильным идолом, начинает поклоняться этому более сильному идолу. Верно ли, что рано или поздно все племена начнут верить в одного и того же идола?",
