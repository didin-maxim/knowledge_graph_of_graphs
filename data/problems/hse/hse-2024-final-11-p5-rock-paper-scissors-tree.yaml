  "solutions": [
    {
      "id": "sol-integer-height-lift",
      "title": "Решение через целочисленные высоты",
      "text": "Ответ: да. Занумеруем три идола числами по модулю \\(3\\) так, что \\(A_{i+1}\\) побеждает \\(A_i\\). Выберем корень дерева и сопоставим каждой вершине целую высоту \\(h(v)\\), сравнимую по модулю \\(3\\) с номером её идола. В корне выберем любой целый представитель. Далее, проходя от корня к листьям, для каждого ребра \\(uv\\), где высота \\(u\\) уже выбрана, выберем единственную высоту \\(h(v)\\), сравнимую с цветом \\(v\\) по модулю \\(3\\) и удовлетворяющую \\(h(v)-h(u)\\in\\{-1,0,1\\}\\). На дереве противоречий не возникает, поскольку к каждой вершине из корня ведёт единственный путь.\n\nПокажем, как выглядит один шаг процесса в этих высотах. Если у вершины \\(v\\) есть сосед высоты \\(h(v)+1\\), то его цвет побеждает цвет \\(v\\), поэтому высота \\(v\\) увеличивается на \\(1\\). Если такого соседа нет, ни у одного соседа нет побеждающего цвета: из условия на разности соседних высот их высоты принадлежат \\(\\{h(v)-1,h(v),h(v)+1\\}\\), а последний случай отсутствует. Значит, высота не меняется. Итак, после одного шага\n\\[h_{t+1}(v)=\\max\\bigl(\\{h_t(v)\\}\\cup\\{h_t(u):u\\sim v\\}\\bigr).\\]\nНовые высоты соседних вершин снова отличаются не больше чем на \\(1\\): замкнутые окрестности концов ребра содержатся одна в другой с точностью до вершин на расстоянии \\(1\\), а старые высоты вдоль каждого ребра менялись не более чем на \\(1\\). Поэтому полученные числа действительно являются согласованным подъёмом новой раскраски.\n\nИтерируя формулу максимума, получаем\n\\[h_t(v)=\\max\\{h_0(u):d(u,v)\\le t\\}.\\]\nЭто доказывается индукцией по \\(t\\): на следующем шаге объединяются шары радиуса \\(t\\) с центрами в \\(v\\) и его соседях, то есть получается шар радиуса \\(t+1\\) с центром \\(v\\).\n\nПусть \\(M=\\max_u h_0(u)\\), а \\(Z=\\{u:h_0(u)=M\\}\\). Дерево конечно и связно, поэтому число \\(T=\\max_v d(v,Z)\\) конечно. При \\(t\\ge T\\) шар радиуса \\(t\\) вокруг каждой вершины содержит вершину из \\(Z\\), откуда \\(h_t(v)=M\\) для всех \\(v\\). Следовательно, все вершины имеют один и тот же цвет, после чего изменения прекращаются.",
