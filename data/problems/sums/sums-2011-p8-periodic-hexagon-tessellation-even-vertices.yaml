  "ideas": [
    {
      "id": "idea-fundamental-square-parity",
      "title": "Рёбра, выходящие из фундаментального квадрата, разбиваются на пары",
      "text": "Если считать инцидентности у \\(n\\) вершин в единичном квадрате, получаем \\(3n=2|E|+|E'|\\), где \\(E'\\) - рёбра, имеющие ровно один конец в квадрате. Периодичность задаёт на \\(E'\\) свободную инволюцию: ребро заменяется его сдвигом, у которого внутрь квадрата попал другой конец. Значит \\(|E'|\\) чётно, и \\(n\\) чётно.",
      "tags": [
        "planar_graphs",
        "double_counting",
        "parity_coloring"
      ],
      "status": "source_verified"
    },
    {
      "id": "idea-even-periodic-construction",
      "title": "Чётный случай сводится к стандартной периодической сетке",
      "text": "Точки внутри фундаментального квадрата можно периодическим гомеоморфизмом перевести в равномерно расположенные точки на горизонтальной середине квадрата. Для двух точек строится стандартная периодическая гексагональная сетка, а для общего чётного \\(n\\) она растягивается/сжимается по горизонтали.",
