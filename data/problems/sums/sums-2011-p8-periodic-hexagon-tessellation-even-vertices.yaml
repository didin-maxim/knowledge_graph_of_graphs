        "id": "stmt-original",
        "title": "Условие",
        "text": "Пусть \\((x_1,y_1),\\ldots,(x_n,y_n)\\) - различные точки единичного квадрата с \\(0<x_i<1\\) и \\(0<y_i<1\\). Пусть \\(V\\) - множество всех их целочисленных сдвигов. Периодической гексагональной тесселяцией с множеством вершин \\(V\\) называется набор непересекающихся вне концов непрерывных рёбер, соединяющих точки из \\(V\\), такой что каждая вершина имеет степень 3, каждая область дополнения имеет шесть рёбер на границе, и вместе с каждым ребром присутствуют все его целочисленные сдвиги. Докажите, что такая тесселяция существует тогда и только тогда, когда \\(n\\) чётно.",
        "source_id": "src-sums-2011-p8-official",
        "status": "source_verified",
