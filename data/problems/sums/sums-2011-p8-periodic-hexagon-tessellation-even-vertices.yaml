        "title": "Периодический плоский кубический граф",
        "text": "Дано \\(n\\) орбит вершин относительно действия \\(\\mathbb Z^2\\) на плоскости. Нужно охарактеризовать, когда существует \\(\\mathbb Z^2\\)-периодическое плоское вложение 3-регулярного графа с этими вершинами, у которого все грани являются шестиугольниками. Ответ: такое вложение существует ровно при чётном \\(n\\).",
