  "solutions": [
    {
      "id": "sol-official-parity-and-construction",
      "title": "Паритет в фундаментальном квадрате и явная конструкция",
      "text": "Пусть тесселяция уже существует. Обозначим через \\(E\\) рёбра с обоими концами в квадрате \\([0,1]\\times[0,1]\\), а через \\(E'\\) - рёбра с ровно одним концом в этом квадрате. У каждой из \\(n\\) вершин степень 3, поэтому \\(3n=2|E|+|E'|\\). Если \\(C\\in E'\\), один его конец лежит в квадрате, а другой равен целочисленному сдвигу некоторой вершины. Сдвинув \\(C\\) обратно на этот целый вектор, получаем другое ребро из \\(E'\\). Эта операция является инволюцией без неподвижных точек, значит \\(|E'|\\) чётно. Тогда \\(3n\\) чётно, и \\(n\\) чётно. Обратно, пусть \\(n\\) чётно. Периодическим гомеоморфизмом каждого единичного квадрата можно перевести заданные \\(n\\) точек в точки \\(((2i-1)/(2n),1/2)\\). Для \\(n=2\\) берётся стандартная периодическая картинка из трёх типов отрезков, порождающая гексагональную сетку. Для общего чётного \\(n\\) эту картинку растягивают так, чтобы в фундаментальном квадрате появилось \\(n\\) вершин; периодичность по целочисленным сдвигам сохраняется. Применяя обратный гомеоморфизм, получаем тесселяцию для исходного множества \\(V\\).",
