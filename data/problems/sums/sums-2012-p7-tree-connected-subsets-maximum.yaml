    {
      "id": "idea-star-realizes-all-edge-subsets",
      "title": "В звезде любое непустое множество рёбер связно",
      "text": "В звезде все рёбра имеют общий центр, поэтому любое непустое множество её рёбер задаёт связное поддерево: центр вместе с выбранными листьями.",
