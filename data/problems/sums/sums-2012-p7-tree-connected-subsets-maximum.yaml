        "id": "stmt-maximum",
        "title": "Максимум",
        "text": "Для дерева \\(T\\) обозначим через \\(s(T)\\) число непустых подмножеств \\(X\\) множества вершин \\(T\\), таких что любые две вершины из \\(X\\) соединяются в \\(T\\) путём, проходящим только через вершины из \\(X\\). Для данного положительного целого \\(n\\) найдите максимальное возможное значение \\(s(T)\\) по всем деревьям с \\(n\\) вершинами.",
