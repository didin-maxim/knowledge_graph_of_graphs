  "solutions": [
    {
      "id": "sol-maximum-star",
      "title": "Звезда даёт максимум",
      "text": "Докажем, что максимум равен \\(2^{n-1}+n-1\\). В дереве на \\(n\\) вершинах ровно \\(n-1\\) ребро. Разделим связные подмножества вершин на одноэлементные и остальные. Одноэлементных ровно \\(n\\). Если связное подмножество \\(X\\) содержит хотя бы две вершины, то рёбра дерева с обоими концами в \\(X\\) образуют непустое множество рёбер. Более того, \\(X\\) однозначно восстанавливается по этому множеству рёбер как множество всех концов выбранных рёбер. Поэтому таких \\(X\\) не больше, чем непустых множеств рёбер дерева, то есть не больше \\(2^{n-1}-1\\). Следовательно, для любого \\(T\\) выполнено \\[s(T)\\le n+(2^{n-1}-1)=2^{n-1}+n-1.\\]\n\nПокажем достижимость. Возьмём звезду \\(K_{1,n-1}\\) (при \\(n=1\\) это единственная вершина). Любое непустое множество её рёбер имеет общий центр и потому задаёт связное поддерево. Значит все \\(2^{n-1}-1\\) непустых множеств рёбер действительно дают связные подмножества с более чем одной вершиной, а вместе с \\(n\\) одноэлементными подмножествами получаем \\(2^{n-1}+n-1\\).\n\nПри \\(n\\ge4\\) равенство возможно только для звезды: если дерево не звезда, его диаметр хотя бы \\(3\\), и крайние рёбра диаметрального пути не имеют общей вершины. Выбранная пара этих рёбер не задаёт связного поддерева, так что верхняя оценка становится строгой. Для \\(n=1,2,3\\) единственное дерево одновременно является путём и звездой в указанном смысле.",
