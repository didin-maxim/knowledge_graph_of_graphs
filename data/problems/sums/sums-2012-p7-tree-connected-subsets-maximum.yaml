  "ideas": [
    {
      "id": "idea-subtree-determined-by-edge-set",
      "title": "Связное подмножество с несколькими вершинами задаётся множеством рёбер",
      "text": "Если связное подмножество вершин содержит больше одной вершины, то рёбра между этими вершинами образуют непустое поддерево. В дереве вершины такого поддерева однозначно восстанавливаются по его множеству рёбер.",
