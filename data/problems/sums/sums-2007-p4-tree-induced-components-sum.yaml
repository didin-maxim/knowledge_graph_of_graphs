  },
  "ideas": [
    {
      "id": "idea-induced-forest-components",
      "title": "В лесу число компонент равно вершины минус рёбра",
      "text": "Индуцированный подграф дерева снова является лесом. Поэтому для \\(k\\)-вершинного множества \\(S\\) выполнено \\(c(S)=k-e(S)\\), где \\(e(S)\\) - число рёбер дерева с обоими концами в \\(S\\).",
      "tags": [
        "trees",
        "double_counting"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-official-edge-count",
      "title": "Двойной подсчёт рёбер внутри выбранного множества",
      "text": "Для каждого \\(S\\in S_k\\) индуцированный подграф является лесом, значит \\(c(S)=k-e(S)\\). Суммируя по всем \\(S\\), получаем \\[\\sum_{S\\in S_k}c(S)=k\\binom nk-\\sum_{S\\in S_k}e(S).\\] В дереве ровно \\(n-1\\) рёбер. Каждое фиксированное ребро попадает в индуцированный подграф ровно для тех \\(S\\), которые содержат оба его конца и ещё \\(k-2\\) вершин из оставшихся \\(n-2\\), то есть \\(\\binom{n-2}{k-2}\\) раз. Поэтому \\[\\sum_{S\\in S_k}e(S)=(n-1)\\binom{n-2}{k-2}.\\] Остаётся упростить: \\[k\\binom nk=n\\binom{n-1}{k-1},\\qquad (n-1)\\binom{n-2}{k-2}=(k-1)\\binom{n-1}{k-1}.\\] Разность равна \\((n-k+1)\\binom{n-1}{k-1}\\).",
