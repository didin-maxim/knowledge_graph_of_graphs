        "id": "stmt-original",
        "title": "Условие",
        "text": "Пусть \\(T\\) - дерево с \\(n\\) вершинами. Зафиксируем \\(1\\le k\\le n\\), и пусть \\(S_k\\) - множество всех \\(k\\)-элементных подмножеств множества вершин \\(T\\). Для \\(S\\in S_k\\) обозначим через \\(c(S)\\) число компонент связности подграфа, индуцированного вершинами из \\(S\\). Докажите, что \\[\\sum_{S\\in S_k} c(S)=(n-k+1)\\binom{n-1}{k-1}.\\]",
        "source_id": "src-sums-2007-p4-official",
        "status": "source_verified",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [
