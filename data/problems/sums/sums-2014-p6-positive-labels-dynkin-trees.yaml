        "trees",
        "extremal_choice",
        "goal_classification"
      ],
      "status": "source_verified"
    },
    {
      "id": "idea-branch-length-equations",
      "title": "Оставшиеся деревья классифицируются рекурсиями вдоль ветвей",
      "text": "Если дерево является путём, метки вдоль пути выражаются как \\(ka-\\binom k2\\), и конечное условие даёт путь чётной длины. Если есть одна вершина степени 3, длины трёх ветвей удовлетворяют диофантовым ограничениям, откуда остаются серии типа \\(D\\) и исключительные случаи \\(E_6,E_8\\).",
      "tags": [
