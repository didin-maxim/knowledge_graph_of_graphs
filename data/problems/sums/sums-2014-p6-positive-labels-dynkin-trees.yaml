  "ideas": [
    {
      "id": "idea-minimum-label-forces-tree",
      "title": "Минимальная метка запрещает циклы и большие ветвления",
      "text": "На цикле вершина с минимальной меткой имела бы двух соседей с суммой не меньше \\(2f(v)\\), что противоречит \\(2f(v)-1\\). Аналогично две ветвящиеся вершины или вершина степени хотя бы 4 дают слишком большую сумму соседей.",
