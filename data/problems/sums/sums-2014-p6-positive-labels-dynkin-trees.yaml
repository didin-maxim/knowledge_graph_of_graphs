        "goal_classification"
      ],
      "status": "source_verified"
    }
  ],
  "solutions": [
    {
      "id": "sol-official-dynkin-classification",
      "title": "Классификация через минимальную метку и ветви",
      "text": "Пусть такая разметка существует. Сначала граф не содержит циклов: на цикле возьмём вершину с минимальной меткой; две её циклические соседки дают сумму не меньше \\(2f(v)\\), а требуется \\(2f(v)-1\\). Значит граф - дерево. В дереве не может быть двух вершин степени хотя бы 3: на пути между ними минимум меток достигается у конца, а затем условие в ветвящейся вершине снова заставляет сумму соседей быть больше \\(2f(v)-1\\). Не может быть и вершины степени хотя бы 4, поскольку каждый её сосед имеет метку больше \\(f(v)/2\\), и сумма четырёх соседей превысила бы \\(2f(v)-1\\). Поэтому дерево либо путь, либо имеет ровно одну вершину степени 3. Для пути с конечной меткой \\(a\\) на конце рекурсия вдоль пути даёт \\(f(v_k)=ka-\\binom k2\\). Условие на другом конце вынуждает число вершин быть \\(2a\\); это серия путей \\(A_{2a}\\). Если есть одна вершина степени 3, пусть длины ветвей равны \\(k\\ge \\ell\\ge m\\). Рекурсия вдоль каждой ветви выражает метку ветвящейся вершины \\(d\\) через конечные метки, а условие в ветвящейся вершине даёт неравенство \\(k/(k+1)+\\ell/(\\ell+1)+m/(m+1)<2\\). Отсюда \\(m=1\\), затем \\(\\ell=1\\) или \\(\\ell=2\\). При \\(\\ell=1\\) получается серия \\(D_{a+1}\\) с целочисленным условием \\(a\\equiv0\\) или \\(3\\pmod4\\). При \\(\\ell=2\\) остаются только \\(k=2,3,4\\); из них целочисленные положительные разметки дают случаи \\(E_6\\) и \\(E_8\\), а \\(k=3\\) отбрасывается. Описанные разметки непосредственно проверяются, значит это полный список.",
