  "ideas": [
    {
      "id": "idea-regular-tree-turn-words",
      "title": "Вершины кодируются первым направлением и поворотами налево/направо",
      "text": "От корня \\(a\\) к любой другой вершине идёт единственный путь. Его можно записать как первую букву \\(b,c,d\\), а затем строку из поворотов \\(L,R\\). Поворот меняет первую букву, а отражение после приведения первой буквы к \\(b\\) уменьшает длину слова.",
      "tags": [
        "trees",
        "graph_symmetry",
        "induction"
      ],
      "status": "source_verified"
    },
    {
      "id": "idea-root-stabilizer-three",
      "title": "Стабилизатор корня состоит только из трёх поворотов",
      "text": "После сокращения слов в порождающих \\(\\rho,\\sigma\\) всякий нетривиальный элемент, содержащий \\(\\sigma\\), переводит корень в вершину с непустым словом. Поэтому корень фиксируют только \\(1,\\rho,\\rho^2\\).",
