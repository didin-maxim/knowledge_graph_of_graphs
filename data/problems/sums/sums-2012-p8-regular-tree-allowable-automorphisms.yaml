        "graph_symmetry",
        "minimal_counterexample"
      ],
      "status": "source_verified"
    }
  ],
  "solutions": [
    {
      "id": "sol-official-word-action",
      "title": "Действие на словах вершин",
      "text": "Зафиксируем корень \\(a\\) и обозначим его соседей \\(b,c,d\\). Любая другая вершина кодируется словом: первая буква показывает, через какого из \\(b,c,d\\) начинается путь от \\(a\\), а последующие буквы \\(L,R\\) показывают левые и правые повороты вдоль пути. Поворот \\(\\rho\\) циклически меняет первую букву \\(b\\to c\\to d\\to b\\), а отражение \\(\\sigma\\) устроено так, что после подходящего поворота оно сокращает расстояние до \\(a\\) на один. Поэтому индукцией по длине слова любую вершину можно перевести в \\(a\\); действие допустимой группы на вершинах транзитивно. Теперь достаточно посчитать допустимые автоморфизмы, фиксирующие \\(a\\). Очевидно, \\(1,\\rho,\\rho^2\\) фиксируют \\(a\\). Любое другое сокращённое слово в порождающих можно записать как \\(\\rho^{i_0}\\sigma\\rho^{i_1}\\sigma\\cdots\\sigma\\rho^{i_k}\\), где внутри стоят только ненулевые степени \\(\\rho\\). Применяя такое слово справа налево к \\(a\\), первое появление \\(\\sigma\\) переводит \\(a\\) в соседнюю вершину, а каждое последующее звено увеличивает длину соответствующего слова или меняет только первое направление; вернуться в \\(a\\) уже нельзя. Значит стабилизатор \\(a\\) имеет ровно три элемента. По транзитивности число элементов, переводящих \\(v\\) в \\(w\\), равно размеру стабилизатора одной вершины, то есть равно 3.",
