        "id": "stmt-original",
        "title": "Условие",
        "text": "Пусть \\(T\\) - бесконечное 3-регулярное дерево. В фиксированном плоском рисунке заданы два автоморфизма: отражение \\(\\sigma\\) и поворот \\(\\rho\\), который фиксирует одну вершину \\(a\\) и циклически переставляет три соседних направления. Допустимыми называются автоморфизмы, которые можно получить последовательным применением \\(\\rho\\) и \\(\\sigma\\). Докажите, что для любых двух вершин \\(v\\) и \\(w\\) дерева \\(T\\) существует ровно три допустимых автоморфизма, переводящих \\(v\\) в \\(w\\).",
