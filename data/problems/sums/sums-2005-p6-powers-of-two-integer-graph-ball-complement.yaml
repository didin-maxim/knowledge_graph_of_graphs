        "id": "stmt-original",
        "title": "Условие",
        "text": "На множестве целых чисел построен граф: разные числа \\(m\\) и \\(n\\) соединены ребром тогда и только тогда, когда \\(|m-n|\\) является степенью двойки: \\(1,2,4,8,\\ldots\\). Пусть \\(\\operatorname{dist}(m,n)\\) - длина кратчайшего пути между \\(m\\) и \\(n\\) в этом графе. Для целого \\(r\\ge 0\\) обозначим через \\(B_r\\) множество всех целых \\(n\\), для которых \\(\\operatorname{dist}(n,0)\\le r\\). Докажите, что дополнение \\(\\mathbb Z\\setminus B_r\\) связно: любые две его вершины можно соединить путём, все вершины которого лежат вне \\(B_r\\).",
