  "ideas": [
    {
      "id": "idea-signed-power-normal-form",
      "title": "Кратчайшие пути задаются разреженными суммами степеней двойки",
      "text": "Если вершина находится на расстоянии \\(s\\) от нуля, её можно записать как сумму \\(s\\) слагаемых вида \\(\\pm 2^m\\). В кратчайшей записи одинаковые степени и слишком длинные цепочки соседних степеней можно устранять переносами, поэтому есть запись с промежутками между показателями не меньше двух.",
      "tags": [
        "minimal_counterexample",
        "goal_proof"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-detour-by-huge-powers",
      "title": "Уходить к большим степеням двойки безопасно",
      "text": "Для достаточно большой степени \\(2^M\\) все промежуточные вершины на пути, который прибавляет или вычитает такие большие степени, имеют нормальную форму длины больше \\(r\\). Поэтому снаружи шара можно вывести любую вершину в далёкую область, а затем соединить две далёкие области.",
      "tags": [
        "connectivity",
        "construction"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-official-normal-form-detour",
      "title": "Нормальная форма и обход шара",
      "text": "Путь длины не больше \\(r\\) от 0 к числу \\(n\\) равносилен представлению \\(n=\\varepsilon_1 2^{m_1}+\\cdots+\\varepsilon_r2^{m_r}\\), где \\(\\varepsilon_i\\in\\{-1,1\\}\\), а недостающие слагаемые можно не использовать. В кратчайшем представлении одинаковые показатели не нужны: равные с противоположными знаками уничтожаются, а равные с одинаковыми знаками заменяются одной следующей степенью двойки. Также соседние показатели с разными знаками и три подряд идущих показателя можно укоротить стандартными двоичными переносами. Поэтому для вершины на расстоянии ровно \\(s\\) можно выбрать представление из \\(s\\) степеней, показатели которых идут с промежутком хотя бы два. Из такого представления следует важная оценка: старшая степень строго доминирует сумму всех меньших слагаемых. Значит, если к числу прибавить достаточно большую степень двойки, расстояние от нуля увеличится, а при последовательном движении по очень большим степеням мы не попадаем обратно в шар \\(B_r\\). Возьмём две вершины вне \\(B_r\\). Каждую из них выведем, прибавляя большие степени двойки, к числам с одинаковой большой положительной частью. Между такими числами можно пройти, меняя только ещё более младшие, но всё равно достаточно большие степени; доминирующая большая часть сохраняет расстояние от нуля больше \\(r\\). Склеивая эти пути, получаем путь между исходными вершинами целиком в \\(\\mathbb Z\\setminus B_r\\).",
