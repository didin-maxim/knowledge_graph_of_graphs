      "id": "idea-path-intervals-are-all-connected-subsets",
      "title": "В пути связные подмножества - это интервалы",
      "text": "Если дерево само является путём, то каждое связное подмножество его вершин является непрерывным отрезком пути и однозначно задаётся своими концами или одной вершиной.",
