  "ideas": [
    {
      "id": "idea-pairs-give-distinct-paths",
      "title": "Одноэлементные множества и пути между парами уже дают нижнюю оценку",
      "text": "В дереве между двумя различными вершинами есть единственный путь. Множества вершин этих путей различны для разных пар концов, поэтому в любом дереве есть как минимум \\(n\\) одноэлементных связных подмножеств и \\(\\binom n2\\) связных подмножеств, заданных парами вершин.",
