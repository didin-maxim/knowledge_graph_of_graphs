  "solutions": [
    {
      "id": "sol-minimum-paths",
      "title": "Путь даёт минимум",
      "text": "Докажем, что минимум равен \\(n+\\binom n2=\\frac{n(n+1)}2\\). Связные подмножества вершин дерева - это ровно множества вершин его связных поддеревьев. В любом дереве есть \\(n\\) одноэлементных связных подмножеств. Кроме того, каждая неупорядоченная пара различных вершин \\(u,v\\) задаёт единственный путь от \\(u\\) к \\(v\\), а множество вершин этого пути связно. Разные пары дают разные множества: у пути, содержащего хотя бы две вершины, концы восстанавливаются как его две крайние вершины. Поэтому для любого дерева \\(T\\) выполнено \\[s(T)\\ge n+\\binom n2.\\]\n\nОстаётся показать достижимость. Пусть \\(T=P_n\\) - путь на \\(n\\) вершинах. Его связные подмножества - это ровно интервалы подряд идущих вершин. Интервал либо состоит из одной вершины, либо задаётся парой своих концов, значит их ровно \\(n+\\binom n2\\). Следовательно, минимальное значение равно \\(\\frac{n(n+1)}2\\).\n\nБолее того, если дерево не является путём, то в нём есть вершина \\(v\\) степени хотя бы \\(3\\). Взяв \\(v\\) и трёх её соседей, получаем связное подмножество, которое не является ни одной вершиной, ни множеством вершин пути между двумя концами. Значит вне путей нижняя оценка строгая.",
