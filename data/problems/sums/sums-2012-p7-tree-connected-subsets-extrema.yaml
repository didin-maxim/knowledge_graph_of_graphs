      "id": "idea-pairs-give-paths",
      "title": "Каждая пара вершин даёт связное подмножество",
      "text": "В дереве между двумя вершинами есть единственный путь. Поэтому все одноэлементные множества и все пути между парами вершин уже дают \\(n+\\binom n2\\) связных подмножеств.",
