  "solutions": [
    {
      "id": "sol-official-path-and-star",
      "title": "Путь даёт минимум, звезда даёт максимум",
      "text": "Связные подмножества вершин дерева - это ровно множества вершин поддеревьев. Снизу: есть \\(n\\) одноэлементных поддеревьев, а каждая пара различных вершин задаёт единственный путь, значит \\(s(T)\\ge n+\\binom n2\\). Если дерево не является путём, в нём есть вершина степени хотя бы 3; эта вершина вместе с тремя соседями даёт связное подмножество, не являющееся ни одной вершиной, ни путём между двумя концами. Поэтому минимум равен \\(n+\\binom n2\\) и достигается ровно на пути. Сверху: в дереве \\(n-1\\) рёбер, а каждое непустое связное подмножество с более чем одной вершиной определяется своим непустым множеством рёбер. Значит \\(s(T)\\le n+(2^{n-1}-1)=2^{n-1}+n-1\\). У звезды любое непустое множество рёбер задаёт поддерево, поэтому верхняя оценка достигается. Если дерево не звезда, найдутся два рёбра без общей вершины, и выбранная из них пара рёбер не задаёт связного поддерева; значит равенства нет. Итак, минимум \\(\\frac{n^2+n}{2}\\), максимум \\(2^{n-1}+n-1\\).",
