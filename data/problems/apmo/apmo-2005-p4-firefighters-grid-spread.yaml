        "title": "Условие",
        "text": "В городе имеется таблица домов \\(n\\times n\\), дом в строке \\(i\\) и столбце \\(j\\) обозначается \\((i,j)\\). В момент \\(0\\) пожар начинается в доме \\((1,c)\\), где \\(c\\le n/2\\). За каждый следующий промежуток времени пожарные успевают защитить один ещё не горящий дом, а затем огонь распространяется на все незащищённые соседние дома каждого уже горящего дома. Соседними считаются дома на расстоянии 1 по Манхэттену. После защиты дом остаётся защищённым навсегда. Когда огонь больше не может распространяться, процесс заканчивается. Какое наибольшее число домов можно спасти?",
