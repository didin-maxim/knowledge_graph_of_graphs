  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Развёрнутое решение через барьер и слои расстояния",
      "text": "Ответ: можно спасти ровно \\(n^2+c^2-nc-c\\) домов.\n\nСначала опишем стратегию, достигающую этой оценки. Защищаем клетки в порядке\n\\[\n(2,c),(2,c+1),(3,c-1),(3,c+2),\\ldots,(c+1,1),(c+1,2c),\n\\]\nа затем клетки \\((c+1,2c+1),(c+1,2c+2),\\ldots,(c+1,n)\\). Первая часть строит две диагональные стены от очага вниз-влево и вниз-вправо, а вторая часть достраивает горизонтальную стену вправо.\n\nПроверим, что защита ставится вовремя. Клетка \\((r+1,c-r+1)\\) или \\((r+1,c+r)\\) находится на манхэттенском расстоянии \\(r\\) от \\((1,c)\\), поэтому её защищают как раз до того, как огонь впервые мог бы до неё добраться. Защищённая клетка навсегда остаётся преградой.\n\nПосчитаем спасённые клетки. Для каждого \\(r=1,2,\\ldots,c\\) две защищённые клетки на соответствующей диагонали спасают вертикальные хвосты длины \\(n-r\\). Это даёт\n\\[\n2((n-1)+(n-2)+\\cdots+(n-c)).\n\\]\nСправа от горизонтальной стены остаётся прямоугольник из \\(n-2c\\) столбцов и \\(n-c\\) строк, то есть ещё \\((n-2c)(n-c)\\) клеток. Всего стратегия спасает\n\\[\n2\\sum_{r=1}^c(n-r)+(n-2c)(n-c)=n^2+c^2-nc-c.\n\\]\n\nДокажем, что больше спасти нельзя. Назовём уровнем \\(t\\) множество клеток на манхэттенском расстоянии \\(t\\) от очага. Пусть \\(s(t)\\) — число клеток уровня \\(t\\), которые не горят к моменту \\(t\\), \\(d(t)\\) — число клеток уровня \\(t\\), уже защищённых к этому моменту, а \\(p(t)\\) — число уже защищённых клеток на уровнях, больших \\(t\\). Докажем индукцией, что при \\(1\\le t\\le n-1\\)\n\\[\ns(t)\\le t-p(t).\n\\]\nДля \\(t=1\\) это очевидно: до прихода огня на первый уровень можно защитить не более одной клетки.\n\nПусть утверждение доказано для уровня \\(t\\). Любые \\(t-p(t)+1\\) клеток уровня \\(t+1\\) имеют не меньше \\(t-p(t)+1\\) соседей на уровне \\(t\\): на границе манхэттенского шара в решётке нет сжатия при переходе к предыдущему уровню. По предположению индукции на уровне \\(t\\) к моменту \\(t\\) не горят не более \\(t-p(t)\\) клеток. Значит, среди таких \\(t-p(t)+1\\) клеток уровня \\(t+1\\) хотя бы одна имеет горящего соседа и не может остаться не горящей, если только она не была заранее защищена. Поэтому к моменту \\(t+1\\)\n\\[\ns(t+1)\\le t-p(t)+d(t+1).\n\\]\nС другой стороны, после шага от \\(t\\) к \\(t+1\\) на уровнях выше \\(t+1\\) вместе с защищёнными клетками уровня \\(t+1\\) находится не больше, чем \\(p(t)+1\\) защит: за этот шаг добавилась только одна новая защита. То есть \\(p(t+1)+d(t+1)\\le p(t)+1\\), и потому\n\\[\ns(t+1)\\le t-p(t)+d(t+1)\\le (t+1)-p(t+1).\n\\]\nИндукция завершена.\n\nСледовательно, на первых \\(n-1\\) уровнях окончательно спасено не более\n\\[\n\\sum_{t=1}^{n-1} t=\\binom n2\n\\]\nклеток. На уровнях \\(t\\ge n\\) для верхней оценки можно считать спасёнными все клетки. Их число равно\n\\[\n\\sum_{j=1}^n |j-c|={c(c-1)\\over2}+{(n-c)(n-c+1)\\over2}.\n\\]\nИтак, любая стратегия спасает не более\n\\[\n\\binom n2+{c(c-1)\\over2}+{(n-c)(n-c+1)\\over2}=n^2+c^2-nc-c.\n\\]\nЭто совпадает с построенной стратегией.",
