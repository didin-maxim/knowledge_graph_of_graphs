        "id": "stmt-original",
        "title": "Условие",
        "text": "В городе имеется таблица домов \\(n\\times n\\), дом в строке \\(i\\) и столбце \\(j\\) обозначается \\((i,j)\\). В момент \\(0\\) пожар начинается в доме \\((1,c)\\), где \\(c\\le n/2\\). За каждый следующий промежуток времени пожарные успевают защитить один ещё не горящий дом, а затем огонь распространяется на все незащищённые соседние дома каждого уже горящего дома. Соседними считаются дома на расстоянии 1 по Манхэттену. После защиты дом остаётся защищённым навсегда. Когда огонь больше не может распространяться, процесс заканчивается. Какое наибольшее число домов можно спасти?",
        "source_id": "src-apmo-2005-official",
        "status": "needs_human_review",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [],
        "distinct_from": [
          "stmt-graph"
        ]
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Пусть \\(G=P_n\\square P_n\\) — решёточный граф на вершинах \\((i,j)\\), где \\(1\\le i,j\\le n\\), и начально заражена вершина \\((1,c)\\), где \\(c\\le n/2\\). На каждом шаге сначала разрешается выбрать одну ещё не заражённую вершину и удалить её из графа навсегда, после чего заражение распространяется из всех уже заражённых вершин на всех их соседей, не удалённых ранее. Когда заражение больше не может расширяться, процесс останавливается. Каково наибольшее возможное число вершин, которые так и не будут заражены?",
        "status": "needs_human_review",
