        "title": "Формулировка через слои расстояний",
        "text": "В решёточном графе \\(P_n\\square P_n\\) зафиксируем начальную вершину \\((1,c)\\), где \\(c\\le n/2\\). В момент \\(t\\) заражённое множество состоит из всех вершин, до которых можно дойти из начальной не более чем за \\(t\\) шагов, если они не были удалены раньше. Перед каждым новым раундом заражения разрешается навсегда удалить одну ещё не заражённую вершину. Определите наибольшее возможное число вершин, которые могут навсегда избежать заражения.",
