  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Сжатое официальное решение",
      "text": "Официальное решение строит явную стратегию защиты, образующую две расходящиеся границы вокруг фронта пожара, и получает число спасённых домов \\(n^2+c^2-nc-c\\). Для верхней оценки вводятся уровни по манхэттенскому расстоянию от стартового дома \\((1,c)\\). Пусть \\(d(t)\\) — число домов уровня \\(t\\), уже защищённых к моменту \\(t\\), а \\(p(t)\\) — число заранее защищённых домов на более высоких уровнях. Из того, что за ход можно защитить не более одного дома, получаются рекуррентные неравенства на \\(d(t)\\) и \\(p(t)\\). Далее доказывается, что число не горящих домов уровня \\(t\\) не превосходит \\(t-p(t)\\), то есть фронт огня на каждом уровне почти полностью заполняет решётку. Суммирование этих оценок даёт ровно ту же величину, что и в конструкции, так что она оптимальна.",
