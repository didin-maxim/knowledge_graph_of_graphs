  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Решение через уровни пожара",
      "text": "Решение строит явную стратегию защиты, образующую две расходящиеся границы вокруг фронта пожара, и получает число спасённых домов \\(n^2+c^2-nc-c\\). Стратегия защищает клетки \\((2,c),(2,c+1);(3,c-1),(3,c+2);\\dots;(c+1,1),(c+1,2c)\\), а затем оставшиеся клетки строки \\(c+1\\) справа. Она спасает по \\(n-r\\) домов в двух столбцах на расстоянии \\(r-1\\) от \\(c,c+1\\), для \\(1\\le r\\le c\\), и ещё \\((n-2c)(n-c)\\) домов справа; сумма равна \\(2((n-1)+\\cdots+(n-c))+(n-2c)(n-c)=n^2+c^2-nc-c\\). Для верхней оценки назовём уровнем \\(t\\) множество клеток на манхэттенском расстоянии \\(t\\) от \\((1,c)\\). Пусть \\(d(t)\\) — число клеток уровня \\(t\\), защищённых к моменту \\(t\\), \\(p(t)\\) — число защищённых к этому моменту клеток более высоких уровней, а \\(s(t)\\) — число клеток уровня \\(t\\), не горящих в момент \\(t\\). Из одного действия защиты за ход имеем \\(p(t)+\\sum_{i=1}^t d(i)\\le t\\) и \\(p(t+1)+d(t+1)\\le p(t)+1\\). Докажем индукцией, что \\(s(t)\\le t-p(t)\\) для \\(1\\le t\\le n-1\\). База \\(t=1\\) очевидна. Если утверждение верно для \\(k\\), то любые \\(k-p(k)+1\\) клеток уровня \\(k+1\\) имеют не менее \\(k-p(k)+1\\) соседей на уровне \\(k\\); поскольку на уровне \\(k\\) не горит не более \\(k-p(k)\\) клеток, у одной из выбранных клеток есть горящий сосед. Поэтому до новой защиты не более \\(k-p(k)\\) клеток уровня \\(k+1\\) могут не иметь горящего соседа, и \\(s(k+1)\\le k-p(k)+d(k+1)\\le (k+1)-p(k+1)\\). Следовательно, на уровнях \\(1,\\dots,n-1\\) можно спасти не более \\(1+2+\\cdots+(n-1)=\\binom n2\\) клеток, и эта граница достигается указанной стратегией; все клетки более высоких уровней в ней тоже спасены. Значит максимум равен \\(n^2+c^2-nc-c\\).",
