  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Сжатое официальное решение",
      "text": "Официальное решение рассматривает граф знакомств. Звезда с центром в вершине \\(A\\), знакомой со всеми остальными, уже даёт \\(\\binom{n-1}{2}=\\frac{(n-1)(n-2)}2\\) подходящих не-рёбер: любые две разные листья не соединены, но имеют общего соседа \\(A\\). Для верхней оценки доказывается, что в экстремальном графе можно считать каждую компоненту связности непустой и между любыми двумя непустыми частями можно добавить ребро, не уменьшая искомое число; значит, достаточно изучать связный граф. Далее анализируется структура связной компоненты и показывается, что любой дополнительный внутренний рёберный «излишек» лишь уменьшает число подходящих не-рёбер по сравнению со звездой. Отсюда максимум равен \\(\\frac{(n-1)(n-2)}2\\).",
