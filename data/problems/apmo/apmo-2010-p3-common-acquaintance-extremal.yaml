  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Решение через компоненты графа знакомств",
      "text": "Ответ равен \\(\\binom{n-1}{2}\\).\n\nСначала покажем, что эта величина достижима. Пусть один человек знаком со всеми остальными, а между остальными знакомых пар нет. Тогда любые два человека, отличные от него, не знакомы друг с другом и имеют общего знакомого, поэтому получается ровно\n\\[\n\\binom{n-1}{2}\n\\]\nподходящих пар.\n\nДокажем, что больше быть не может. Рассмотрим граф знакомств \\(G\\): вершины соответствуют людям, а ребра - парам знакомых. Подходящие пары - это пары несмежных вершин, имеющих общего соседа.\n\nПусть компоненты связности графа имеют размеры \\(a_1,\\ldots,a_t\\). Подходящая пара не может лежать в разных компонентах, поэтому достаточно оценить вклад каждой компоненты отдельно. В связной компоненте размера \\(a_i\\) всего \\(\\binom{a_i}{2}\\) пар вершин. Из них хотя бы \\(a_i-1\\) пар являются ребрами, потому что всякая связная компонента на \\(a_i\\) вершинах содержит не меньше \\(a_i-1\\) ребер. Следовательно, число подходящих пар внутри этой компоненты не превосходит\n\\[\n\\binom{a_i}{2}-(a_i-1)=\\binom{a_i-1}{2}.\n\\]\nСуммируя по компонентам, получаем\n\\[\nN_2(G)\\le \\sum_{i=1}^t \\binom{a_i-1}{2}.\n\\]\nПоложим \\(x_i=a_i-1\\ge 0\\). Тогда \\(\\sum x_i=n-t\\le n-1\\), а для неотрицательных целых \\(x,y\\)\n\\[\n\\binom{x}{2}+\\binom{y}{2}\\le \\binom{x+y}{2},\n\\]\nпоскольку разность равна \\(xy\\). Поэтому\n\\[\n\\sum_i \\binom{x_i}{2}\\le \\binom{\\sum_i x_i}{2}\\le \\binom{n-1}{2}.\n\\]\nИтак, максимальное число подходящих пар равно \\(\\binom{n-1}{2}\\).",
