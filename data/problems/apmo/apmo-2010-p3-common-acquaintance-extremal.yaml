        "text": "Для простого графа \\(G\\) на \\(n\\) вершинах обозначим через \\(N_2(G)\\) число неупорядоченных пар различных несмежных вершин, имеющих общего соседа, то есть число пар вершин на расстоянии 2. Найдите максимально возможное значение \\(N_2(G)\\).",
