        "id": "stmt-original",
        "title": "Условие",
        "text": "На вечеринке присутствуют \\(n\\) человек. Для каждой пары либо эти люди знакомы, либо нет. Каково максимально возможное число пар людей, которые не знакомы друг с другом, но имеют общего знакомого среди участников вечеринки?",
