        "id": "stmt-original",
        "title": "Условие",
        "text": "В стране Dreamland есть 2016 городов. Компания Starways организует односторонние авиарейсы так, что из каждого города выходит ровно один рейс. Нужно найти наименьшее положительное целое \\(k\\), для которого при любом выборе рейсов города всегда можно разбить на \\(k\\) групп так, чтобы из любого города нельзя было добраться до другого города той же группы, используя не более 28 перелётов.",
        "source_id": "src-apmo-2016-official",
        "status": "needs_human_review",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [],
        "distinct_from": [
          "stmt-graph"
        ]
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Пусть \\(k\\ge 1\\) и \\(N\\ge 2k+1\\). Дан ориентированный граф \\(D\\) на \\(N\\) вершинах, в котором исходящая степень каждой вершины равна 1. Требуется разбить множество вершин на минимальное число классов так, чтобы никакие две вершины одного класса не были достижимы одна из другой ориентированным путём длины не более \\(k\\). Эквивалентно, требуется правильно раскрасить вспомогательный граф \\(k\\)-шаговой достижимости, в котором две вершины соединены, если одна достижима из другой не более чем за \\(k\\) шагов. Найдите наименьшее гарантированное число классов.",
        "status": "needs_human_review",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [
          "directed_graph",
          "degree"
        ],
        "distinct_from": [
          "stmt-original"
        ]
      }
    ],
    "olympiad_reformulations": [],
    "graph_hint_reformulations": [
      {
        "id": "stmt-graph-conflict",
        "text": "Пусть \\(r\\ge 1\\) и \\(N\\ge 2r+1\\). Для ориентированного графа \\(D\\) на \\(N\\) вершинах, у каждой из которых исходящая степень равна 1, определим неориентированный граф \\(R_r(D)\\) на том же множестве вершин: вершины \\(u\\) и \\(v\\) соединяются ребром, если в \\(D\\) есть ориентированный путь из \\(u\\) в \\(v\\) или из \\(v\\) в \\(u\\) длины не более \\(r\\). Докажите, что \\(\\chi(R_r(D))\\le 2r+1\\), и что эта оценка точна.",
