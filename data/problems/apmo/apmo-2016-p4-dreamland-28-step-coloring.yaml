  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Сжатое официальное решение",
      "text": "Официальное решение отвечает \\(57\\). Нижняя оценка берётся из ориентированного цикла длины 57: на таком цикле никакие две вершины нельзя посадить в одну группу, потому что одна достижима из другой не более чем за 28 шагов. Для верхней оценки исходный граф полётов заменяется вспомогательным ориентированным графом \\(H\\), где есть дуга \\(u\\to v\\), если из \\(v\\) можно попасть в \\(u\\) не более чем за 28 перелётов. В этом графе исходящая степень каждой вершины не больше 28. Дальше доказывается более сильная лемма: любой ориентированный граф, в котором исходящая степень каждой вершины не превосходит 28, можно разбить на 57 классов так, чтобы внутри класса не было дуг. Индукция работает потому, что средняя входящая степень тоже не превосходит 28, значит найдётся вершина с входящей степенью не больше 28; удалив её, раскрашиваем оставшийся граф и затем возвращаем вершину, запрещая ей не более 56 цветов по входящим и исходящим соседям. Следовательно, 57 цветов всегда достаточно.",
