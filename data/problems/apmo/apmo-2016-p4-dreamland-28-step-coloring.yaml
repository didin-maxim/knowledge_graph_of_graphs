  "statements": {
    "original": [
      {
        "id": "stmt-original",
        "title": "Условие",
        "text": "В стране Dreamland есть 2016 городов. Компания Starways организует односторонние авиарейсы так, что из каждого города выходит ровно один рейс. Нужно найти наименьшее положительное целое \\(k\\), для которого при любом выборе рейсов города всегда можно разбить на \\(k\\) групп так, чтобы из любого города нельзя было добраться до другого города той же группы, используя не более 28 перелётов.",
        "source_id": "src-apmo-2016-official",
        "status": "needs_human_review",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [],
        "distinct_from": [
          "stmt-graph"
        ]
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Пусть \\(N\\ge 57\\). Дан ориентированный граф \\(D\\) на \\(N\\) вершинах, в котором исходящая степень каждой вершины равна 1. Требуется разбить множество вершин на минимальное число классов так, чтобы никакие две вершины одного класса не были достижимы одна из другой ориентированным путём длины не более 28. Эквивалентно, требуется правильно раскрасить вспомогательный граф 28-шаговой достижимости, в котором две вершины соединены, если одна достижима из другой не более чем за 28 шагов.",
        "status": "needs_human_review",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [
          "directed_graph",
          "degree"
        ],
        "distinct_from": [
          "stmt-original"
        ]
      },
      {
        "id": "stmt-graph-conflict",
        "text": "Let $N\\ge 57$. For a directed graph $D$ on $N$ vertices with outdegree 1 at every vertex, define an undirected graph $R_{28}(D)$ on the same vertex set by joining $u$ and $v$ whenever $D$ contains a directed path from $u$ to $v$ or from $v$ to $u$ of length at most 28. Determine the least $k$ such that $\\chi(R_{28}(D))\\le k$ for every such $D$.",
