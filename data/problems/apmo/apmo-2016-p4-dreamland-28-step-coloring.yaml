      "id": "idea-cycle-lower-bound",
      "title": "Длинный цикл даёт нижнюю оценку",
      "text": "Если исходный функциональный граф содержит цикл длины 57, то любые две вершины этого цикла находятся в отношении достижимости за не более чем 28 шагов в одну из сторон, поэтому им требуются разные цвета.",
