  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Официальное решение через раскраску графа достижимости",
      "text": "Ответ: \\(57\\).\n\nСначала докажем, что меньше 57 групп иногда недостаточно. Построим допустимую систему рейсов так, чтобы среди городов был направленный цикл длины 57; остальные города можно, например, соединить в другой направленный цикл, чтобы из каждого города по-прежнему выходил ровно один рейс. Возьмём любые две различные вершины \\(a\\) и \\(b\\) на 57-цикле. Если расстояние от \\(a\\) до \\(b\\) по направлению цикла равно \\(d\\), где \\(1\\le d\\le 56\\), то расстояние от \\(b\\) до \\(a\\) равно \\(57-d\\). Одно из чисел \\(d\\) и \\(57-d\\) не превосходит 28. Значит, из одной из двух вершин можно добраться до другой не более чем за 28 перелётов, поэтому эти две вершины не могут лежать в одной группе. Все 57 вершин цикла попарно конфликтуют, так что требуется как минимум 57 групп.\n\nОстаётся доказать, что 57 групп всегда достаточно. Рассмотрим произвольную систему рейсов и соответствующий ориентированный граф \\(G\\): вершины -- города, а из каждой вершины выходит ровно одна дуга. Построим вспомогательный ориентированный граф \\(H\\) на тех же вершинах: для различных городов \\(u\\) и \\(v\\) проведём дугу \\(u\\to v\\), если в \\(G\\) из \\(u\\) можно попасть в \\(v\\) за \\(1,2,\\ldots,28\\) перелётов. Из каждой вершины \\(u\\) в графе \\(G\\) на каждом шаге есть только один следующий город, поэтому за первые 28 шагов из \\(u\\) можно получить не более 28 различных других городов. Следовательно, исходящая степень каждой вершины в \\(H\\) не превосходит 28. Если мы правильно раскрасим вершины \\(H\\), то города одного цвета не будут соединены дугой ни в одну сторону; значит, из одного города этого цвета нельзя добраться до другого города того же цвета не более чем за 28 перелётов.\n\nНужна лемма. Пусть \\(r\\ge 0\\), и пусть \\(Q\\) -- конечный ориентированный граф, в котором исходящая степень каждой вершины не превосходит \\(r\\). Тогда вершины \\(Q\\) можно раскрасить в \\(2r+1\\) цветов так, чтобы концы каждой дуги имели разные цвета.\n\nДокажем лемму индукцией по числу вершин. Для пустого графа и для одной вершины всё очевидно. Пусть вершин больше. Число дуг не превосходит \\(r|V(Q)|\\), поэтому средняя входящая степень тоже не превосходит \\(r\\). Значит, найдётся вершина \\(x\\), в которую входит не более \\(r\\) дуг. Удалим \\(x\\). В оставшемся графе исходящие степени по-прежнему не больше \\(r\\), поэтому по предположению индукции его можно раскрасить в \\(2r+1\\) цветов. Вернём \\(x\\). Её исходящих соседей не больше \\(r\\), входящих соседей тоже не больше \\(r\\), значит, среди уже раскрашенных соседей вершины \\(x\\) встречается не более \\(2r\\) запрещённых цветов. Из \\(2r+1\\) цветов остаётся хотя бы один свободный; покрасим в него \\(x\\). Индукционный шаг доказан.\n\nПрименяя лемму к графу \\(H\\) при \\(r=28\\), получаем раскраску в \\(2\\cdot 28+1=57\\) цветов, то есть разбиение городов на 57 групп с требуемым свойством. Вместе с нижней оценкой это доказывает минимальность числа \\(57\\).",
