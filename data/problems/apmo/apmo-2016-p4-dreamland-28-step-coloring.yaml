    {
      "id": "idea-outdegree-28-coloring",
      "title": "Граф с исходящей степенью не более 28 57-раскрашим",
      "text": "Во вспомогательном графе достижимости у каждой вершины исходящая степень не превосходит 28. Тогда по индукции можно удалить вершину с малой входящей степенью и вернуть её обратно, всегда находя свободный цвет среди 57 цветов.",
