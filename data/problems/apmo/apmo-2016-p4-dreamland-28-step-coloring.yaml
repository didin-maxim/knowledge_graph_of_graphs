    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Дан ориентированный граф на 2016 вершинах, в котором у каждой вершины исходящая степень равна 1. Нужно покрасить вершины в минимальное число цветов так, чтобы вершины одного цвета не были достижимы друг из друга путём длины не более 28; эквивалентно, покрасить граф 28-шаговой достижимости.",
