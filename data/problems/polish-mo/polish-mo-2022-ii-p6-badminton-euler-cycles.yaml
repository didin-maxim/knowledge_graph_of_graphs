  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Решение через разложение чётного графа на циклы",
      "text": "Рассмотрим фиксированного игрока. Пусть он выиграл \\(a\\) двухматчевых встреч со счётом \\(2:0\\), проиграл \\(b\\) двухматчевых встреч со счётом \\(0:2\\), а ещё \\(c\\) двухматчевых встреч закончились для него счётом \\(1:1\\). Всего он сыграл с \\(n-1\\) соперниками, поэтому\n\\[\na+b+c=n-1.\n\\]\nПо условию общее число его побед равно общему числу поражений. В односторонних двухматчевых встречах это даёт соответственно \\(2a\\) побед и \\(2b\\) поражений, а каждая ничейная встреча добавляет по одной победе и одному поражению. Значит\n\\[\n2a+c=2b+c,\n\\]\nоткуда \\(a=b\\). Так как \\(n\\) нечётно, число \\(n-1\\) чётно, и потому\n\\[\nc=n-1-2a\n\\]\nтоже чётно.\n\nТеперь обработаем односторонние двухматчевые встречи. В каждой такой паре матчей аннулируем произвольный один матч. Для данного игрока число его выигранных односторонних встреч равно числу проигранных, поэтому после этих аннулирований его баланс побед и поражений среди зачётных матчей не изменится: из выигранных им двухматчевых встреч удалится ровно \\(a\\) его побед, а из проигранных ровно \\(a\\) его поражений.\n\nОстаётся выбрать по одному матчу из каждой ничейной двухматчевой встречи. Построим граф \\(G\\): вершины соответствуют игрокам, а ребро между двумя игроками проводим тогда и только тогда, когда их двухматчевая встреча была ничейной, то есть каждый выиграл по одному матчу. Для любой вершины степень в \\(G\\) равна числу \\(c\\) ничейных встреч соответствующего игрока, а мы уже доказали, что это число чётно. Следовательно, все степени в \\(G\\) чётные.\n\nКаждый конечный граф, в котором все степени чётны, раскладывается на попарно рёберно непересекающиеся циклы. Действительно, в каждой непустой компоненте можно идти по ещё неиспользованным рёбрам, пока впервые не вернёмся в уже посещённую вершину; так получается цикл, после удаления его рёбер чётность всех степеней сохраняется, и процесс продолжается до исчезновения рёбер.\n\nВозьмём такое разложение графа \\(G\\) на циклы. Для цикла\n\\[\nv_1v_2\\ldots v_kv_1\n\\]\nаннулируем в паре \\(v_i,v_{i+1}\\) тот матч, который выиграл игрок \\(v_i\\) у игрока \\(v_{i+1}\\), для всех \\(i\\) по модулю \\(k\\). Тогда на этом цикле у каждого игрока аннулируется ровно одна победа: матч против следующего игрока цикла, и ровно одно поражение: матч против предыдущего игрока цикла. Значит баланс побед и поражений каждого игрока среди зачётных матчей сохраняется.\n\nМы аннулировали ровно один матч в каждой паре игроков: сначала в каждой односторонней двухматчевой встрече, затем в каждой ничейной. Всего пар игроков столько же, сколько половина всех матчей, потому что каждая пара сыграла два матча. Поэтому аннулирована ровно половина всех матчей, и после аннулирования у каждого игрока число зачётных побед равно числу зачётных поражений.",
