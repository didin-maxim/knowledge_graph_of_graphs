  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Решение через 2022 последовательных остовных леса",
      "text": "Переведём условие на язык графов. Отмеченные точки считаем вершинами, проведённые хорды - рёбрами. Свойство задачи означает, что граф остаётся связным после удаления любых \\(2021\\) рёбер. Назовём такой граф хорошим. Нужно оставить не более \\(2022n\\) рёбер так, чтобы получившийся граф тоже был хорошим.\n\nПусть исходный хороший граф равен \\(G_0\\), его множество вершин обозначим через \\(V\\), \\(|V|=n\\). Построим графы\n\\[\nG_0,F_0,G_1,F_1,\\ldots,G_{2021},F_{2021},G_{2022}\n\\]\nна одном и том же множестве вершин. Если \\(G_i\\) уже построен, выберем в каждой его компоненте связности остовное дерево; объединение этих деревьев обозначим через \\(F_i\\). Иначе говоря, \\(F_i\\) - остовный лес графа \\(G_i\\). Затем определим \\(G_{i+1}\\) как граф, полученный из \\(G_i\\) удалением всех рёбер леса \\(F_i\\).\n\nПусть \\(H\\) - граф на множестве вершин \\(V\\), рёбрами которого являются все рёбра лесов \\(F_0,F_1,\\ldots,F_{2021}\\). Каждый лес содержит не более \\(n-1\\) рёбер, поэтому\n\\[\ne(H)\\le 2022(n-1)<2022n.\n\\]\nОстаётся доказать, что \\(H\\) хороший.\n\nВозьмём произвольное множество \\(Z\\) из \\(2021\\) рёбер графа \\(H\\), и пусть \\(H' = H-Z\\). Докажем, что \\(H'\\) связен. Сначала зафиксируем полезный факт.\n\nЛемма. Если вершины \\(u\\) и \\(v\\) лежат в одной компоненте связности графа \\(G_{2022}\\), то они лежат в одной компоненте связности графа \\(H'\\).\n\nДоказательство леммы. Граф \\(G_{2022}\\) является подграфом каждого из графов \\(G_0,G_1,\n\\ldots,G_{2021}\\). Поэтому вершины \\(u\\) и \\(v\\), связанные в \\(G_{2022}\\), лежат в одной компоненте каждого \\(G_i\\). Так как \\(F_i\\) содержит остовное дерево каждой компоненты \\(G_i\\), в лесу \\(F_i\\) есть путь от \\(u\\) к \\(v\\). Для разных \\(i\\) эти пути рёберно не пересекаются, потому что леса \\(F_i\\) построены из попарно непересекающихся слоёв рёбер исходного графа. Всего получаем \\(2022\\) рёберно непересекающихся \\(u\\)-\\(v\\)-пути в \\(H\\). Множество \\(Z\\) содержит только \\(2021\\) рёбер, значит хотя бы один из этих путей не содержит рёбер из \\(Z\\). Следовательно, \\(u\\) и \\(v\\) соединены в \\(H'\\). Лемма доказана.\n\nТеперь докажем связность \\(H'\\). Предположим противное: вершины можно разбить на два непустых множества \\(A\\) и \\(B\\), между которыми в \\(H'\\) нет рёбер. В исходном графе \\(G_0\\) после удаления рёбер \\(Z\\) граф остаётся связным, поскольку \\(G_0\\) хороший. Поэтому в \\(G_0-Z\\) есть ребро или путь из \\(A\\) в \\(B\\); в частности, среди рёбер исходного графа, не удалённых в \\(Z\\), существует ребро, соединяющее \\(A\\) и \\(B\\), если взять первое пересечение такого пути с разрезом.\n\nРазберём, где может лежать такое ребро \\(xy\\), \\(x\\in A\\), \\(y\\in B\\). Если оно принадлежит одному из лесов \\(F_0,\n\\ldots,F_{2021}\\), то оно является ребром \\(H\\), не лежит в \\(Z\\), а значит является ребром \\(H'\\), что противоречит выбору разбиения \\(A,B\\). Следовательно, все рёбра из \\(G_0-Z\\), пересекающие разрез \\((A,B)\\), должны лежать в остаточном графе \\(G_{2022}\\).\n\nНо тогда концы такого ребра \\(xy\\) лежат в одной компоненте \\(G_{2022}\\), а по лемме они должны лежать в одной компоненте \\(H'\\). Это снова невозможно, потому что \\(x\\in A\\), \\(y\\in B\\), и между компонентами разбиения \\(H'\\) нет пути. Противоречие доказывает, что \\(H'\\) связен.\n\nИтак, после удаления любых \\(2021\\) рёбер граф \\(H\\) остаётся связным. При этом в \\(H\\) меньше \\(2022n\\) рёбер, значит можно оставить именно рёбра \\(H\\), а все остальные хорды стереть.",
