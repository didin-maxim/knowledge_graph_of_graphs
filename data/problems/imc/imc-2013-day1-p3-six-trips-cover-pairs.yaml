  "ideas": [
    {
      "id": "idea-each-student-needs-three-trips",
      "title": "Каждому ученику нужны как минимум три экскурсии",
      "text": "За одну экскурсию ученик встречает не больше \\(n-1\\) других, а всего ему нужно встретить \\(2n-1\\) школьников. Поэтому каждый участвует минимум в трёх экскурсиях, что даёт нижнюю оценку \\(6n\\) ученико-мест.",
