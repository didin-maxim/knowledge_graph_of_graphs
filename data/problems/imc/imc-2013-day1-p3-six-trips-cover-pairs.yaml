  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Нижняя оценка и блочные конструкции",
      "text": "Ответ: \\(6\\) экскурсий.\n\nСначала докажем, что пяти экскурсий недостаточно. Если было не больше пяти экскурсий, суммарное число участий учеников в них не превосходит \\(5n\\). С другой стороны, фиксированный ученик за одну экскурсию встречает не более \\(n-1\\) других учеников. Чтобы встретить всех остальных \\(2n-1\\) учеников, он должен участвовать как минимум в трёх экскурсиях, потому что \\(2(n-1)<2n-1\\). Значит, суммарное число участий не меньше \\(3\\cdot2n=6n\\), противоречие. Поэтому нужно хотя бы \\(6\\) экскурсий.\n\nПостроим расписание из шести экскурсий. Если \\(n\\) чётно, делим всех \\(2n\\) учеников на четыре равные группы \\(A,B,C,D\\) размера \\(n/2\\). Шесть экскурсий берём как объединения пар групп:\n\\[\n(A,B),\\ (C,D),\\ (A,C),\\ (B,D),\\ (A,D),\\ (B,C).\n\\]\nЛюбые две группы встречаются вместе ровно в одной экскурсии, а ученики внутри одной группы вместе участвуют во всех трёх экскурсиях, содержащих эту группу. Значит, все пары покрыты.\n\nЕсли \\(n\\) нечётно и делится на \\(3\\), делим учеников на шесть равных групп \\(E,F,G,H,I,J\\) размера \\(n/3\\). Экскурсии:\n\\[\n(E,F,G),\\ (E,F,H),\\ (G,H,I),\\ (G,H,J),\\ (E,I,J),\\ (F,I,J).\n\\]\nКаждая экскурсия содержит три группы, то есть \\(n\\) учеников. Нетрудно проверить, что всякая пара групп встречается хотя бы в одной строке списка; пары внутри одной группы, конечно, тоже встречаются.\n\nОстаётся случай, когда \\(n\\) не чётно и не делится на \\(3\\). Тогда \\(n\\ge5\\), и можно представить \\(n=2x+3y\\) с натуральными \\(x,y\\). Возьмём четыре группы \\(A,B,C,D\\) размера \\(x\\) и шесть групп \\(E,F,G,H,I,J\\) размера \\(y\\). Теперь используем объединённую схему из шести экскурсий:\n\\[\n(A,B,E,F,G),\\quad (C,D,E,F,H),\\quad (A,C,G,H,I),\n\\]\n\\[\n(B,D,G,H,J),\\quad (A,D,E,I,J),\\quad (B,C,F,I,J).\n\\]\nВ каждой строке находится \\(2x+3y=n\\) учеников. Четыре группы \\(A,B,C,D\\) покрываются попарно по схеме для чётного случая; шесть групп \\(E,…,J\\) покрываются по схеме для случая, кратного \\(3\\); смешанные пары групп тоже покрыты, что проверяется по списку строк: каждая из групп \\(A,B,C,D\\) встречается с каждой из \\(E,F,G,H,I,J\\) хотя бы один раз. Значит, после этих шести экскурсий любые два ученика побывали вместе. Нижняя оценка и конструкция совпадают, поэтому минимум равен \\(6\\).",
