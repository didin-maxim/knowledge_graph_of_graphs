  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Nice-матрицы как вершины нечётной степени",
      "text": "Рассмотрим стандартные таблицы Юнга прямоугольной формы \\\\(m\\\\times n\\\\): это матрицы с числами \\\\(1,2,\\ldots,mn\\\\), строго возрастающими в каждой строке и каждом столбце. Построим граф на таких таблицах. Две таблицы назовём друзьями и соединим ребром, если одна получается из другой перестановкой двух последовательных чисел \\\\(x\\\\) и \\\\(x+1\\\\), причём после перестановки таблица остаётся стандартной. Такая перестановка возможна ровно тогда, когда клетки с \\\\(x\\\\) и \\\\(x+1\\\\) не являются соседними по стороне; иначе монотонность немедленно нарушилась бы.\n\nТеперь возьмём nice-матрицу \\\\(A\\\\). Пусть число \\\\(i\\\\) встречается \\\\(n_i\\\\) раз. Заменим все вхождения \\\\(1\\\\) числами \\\\(1,\\ldots,n_1\\\\), все вхождения \\\\(2\\\\) числами \\\\(n_1+1,\\ldots,n_1+n_2\\\\), и так далее; внутри каждого горизонтального или вертикального блока делаем это в единственном порядке, сохраняющем возрастание строк и столбцов. Условие (iii) гарантирует, что равные элементы лежат в одной строке или одном столбце, поэтому такой порядок не создаёт конфликта. Получаем стандартную таблицу \\\\(Y_A\\\\).\n\nПосмотрим на друзей таблицы \\\\(Y_A\\\\). Перестановка двух последовательных чисел возможна только на границе между двумя соседними блоками исходной матрицы, то есть между последним числом, заменившим значение \\\\(s\\\\), и первым числом, заменившим значение \\\\(s+1\\\\). Условие (iv) говорит, что для каждого \\\\(s=1,\\ldots,2t-1\\\\) есть вхождения \\\\(s\\\\) и \\\\(s+1\\\\), стоящие в разных строках и разных столбцах; в стандартной таблице соответствующая пара последовательных чисел допускает дружескую перестановку. Поэтому степень \\\\(Y_A\\\\) равна \\\\(2t-1\\\\), нечётному числу.\n\nОбратно, пусть стандартная таблица \\\\(Y\\\\) имеет нечётное число друзей. Разобьём последовательность \\\\(1,\\ldots,mn\\\\) на максимальные подряд идущие блоки так, чтобы внутри блока соседние числа нельзя было переставить дружески, а между соседними блоками такая перестановка возможна. Заменим все числа первого блока на \\\\(1\\\\), второго -- на \\\\(2\\\\), и так далее. Монотонность строк и столбцов переходит в неубывание. Внутри блока числа вынужденно идут по одной строке или по одному столбцу, иначе появилась бы допустимая перестановка; значит, равные элементы удовлетворяют условию (iii). Между соседними блоками дружеская перестановка даёт две клетки в разных строках и столбцах, то есть условие (iv). Нечётность степени означает, что число границ между блоками нечётно, поэтому число блоков чётно, скажем \\\\(2t\\\\). Полученная матрица nice.\n\nЭти две процедуры взаимно обратны: из nice-матрицы мы помним ровно её блоки равных значений, а таблица с нечётной степенью восстанавливает те же блоки по допустимым границам. Значит, nice-матрицы находятся во взаимно однозначном соответствии с вершинами нечётной степени в построенном графе стандартных таблиц.\n\nВ любом конечном графе число вершин нечётной степени чётно, потому что сумма всех степеней равна удвоенному числу рёбер. Следовательно, число nice-матриц размера \\\\(m\\\\times n\\\\) чётно.\"\n",
