        "title": "Условие",
        "text": "Матрица \\(A=(a_{ij})\\) называется nice, если: (i) множество всех её элементов равно \\(\\{1,2,\\ldots,2t\\}\\) для некоторого целого \\(t\\); (ii) элементы не убывают в каждой строке и каждом столбце; (iii) равные элементы могут стоять только в одной строке или только в одном столбце; (iv) для каждого \\(s=1,2,\\ldots,2t-1\\) существуют \\(i\\ne k\\) и \\(j\\ne\\ell\\) такие, что \\(a_{i,j}=s\\), \\(a_{k,\\ell}=s+1\\). Докажите, что для любых положительных \\(m,n\\) число nice-матриц размера \\(m\\times n\\) чётно.",
