  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Хорошие матрицы как вершины нечётной степени",
      "text": "Рассмотрим стандартные таблицы Юнга прямоугольной формы \\(m\\times n\\): это матрицы с числами \\(1,2,\\ldots,mn\\), строго возрастающими в каждой строке и каждом столбце. Если число \\(r\\) стоит в клетке \\(c_r\\), то перестановка \\(r\\) и \\(r+1\\) снова даёт стандартную таблицу тогда и только тогда, когда клетки \\(c_r\\) и \\(c_{r+1}\\) лежат в разных строках и разных столбцах. Действительно, если они в одной строке или одном столбце, то из-за отсутствия чисел между \\(r\\) и \\(r+1\\) они являются соседними по стороне, и перестановка сразу нарушает возрастание. Если же строки и столбцы разные, то у клетки \\(c_r\\) все правые и нижние соседи, кроме возможной клетки \\(c_{r+1}\\), имеют значения больше \\(r+1\\), а все левые и верхние соседи клетки \\(c_{r+1}\\), кроме возможной клетки \\(c_r\\), имеют значения меньше \\(r\\); поэтому после перестановки все строковые и столбцовые неравенства сохраняются. Построим граф, соединяя такие пары стандартных таблиц ребром; степень таблицы равна числу индексов \\(r\\), для которых \\(c_r\\) и \\(c_{r+1}\\) лежат в разных строках и разных столбцах.\n\nНам понадобится простая лемма. Пусть в стандартной таблице для всех \\(r=a,a+1,\\ldots,b-1\\) клетки \\(c_r\\) и \\(c_{r+1}\\) соседни по стороне. Тогда все клетки \\(c_a,c_{a+1},\\ldots,c_b\\) лежат в одной строке или в одном столбце. В самом деле, при переходе от \\(c_r\\) к \\(c_{r+1}\\) можно идти только вправо или вниз. Если два последовательных шага повернули, например вправо, а затем вниз, то в соответствующем прямоугольнике \\(2\\times 2\\) четвёртая клетка имеет значение одновременно больше \\(r\\) и меньше \\(r+2\\), что невозможно, потому что единственное целое число между ними уже занято числом \\(r+1\\). Случай поворота вниз, а затем вправо аналогичен. Значит, направление не меняется, и весь отрезок лежит на одной горизонтали или вертикали.\n\nПусть теперь \\(A\\) -- хорошая матрица, а число \\(s\\) встречается \\(n_s\\) раз. Клетки с одним и тем же значением \\(s\\) образуют подряд идущий отрезок в одной строке или в одном столбце: это следует из неубывания строк и столбцов и условия (iii). Заменим все вхождения \\(1\\) числами \\(1,\\ldots,n_1\\), все вхождения \\(2\\) числами \\(n_1+1,\\ldots,n_1+n_2\\), и так далее; внутри горизонтального отрезка пишем числа слева направо, внутри вертикального -- сверху вниз. Получается стандартная таблица \\(Y_A\\): между разными значениями интервалы чисел идут в правильном порядке, а внутри каждого отрезка порядок выбран возрастающим.\n\nПосчитаем друзей \\(Y_A\\). Внутри отрезка, соответствующего одному значению \\(s\\), соседние числа стоят в соседних по стороне клетках, поэтому дружеской перестановки там нет. Рассмотрим границу между значениями \\(s\\) и \\(s+1\\). Если последнее число отрезка \\(s\\) и первое число отрезка \\(s+1\\) стояли бы в соседних по стороне клетках, то объединение двух отрезков было бы цепочкой подряд идущих чисел с соседними клетками на каждом шаге. По лемме все клетки с числами \\(s\\) и \\(s+1\\) лежали бы в одной строке или в одном столбце, что противоречит условию (iv). Следовательно, каждая из \\(2t-1\\) границ даёт ровно одного друга, и других друзей нет. Поэтому степень \\(Y_A\\) равна \\(2t-1\\), то есть нечётна.\n\nОбратно, пусть стандартная таблица \\(Y\\) имеет нечётную степень. Разобьём последовательность \\(1,2,\\ldots,mn\\) на максимальные подряд идущие блоки так, что внутри блока каждые два соседних числа стоят в соседних по стороне клетках; границы блоков ровно соответствуют друзьям таблицы, то есть индексам \\(r\\), для которых \\(c_r\\) и \\(c_{r+1}\\) лежат в разных строках и разных столбцах. Заменим все числа первого блока на \\(1\\), второго блока на \\(2\\), и так далее. Строгое возрастание строк и столбцов в \\(Y\\) переходит в неубывание строк и столбцов новой матрицы. По лемме каждый блок лежит в одной строке или в одном столбце, значит, равные элементы удовлетворяют условию (iii). На каждой границе блоков клетки последнего числа предыдущего блока и первого числа следующего блока лежат в разных строках и разных столбцах, значит, для соседних значений выполнено условие (iv). Число блоков равно степени \\(Y\\) плюс \\(1\\); степень нечётна, поэтому блоков чётное число, скажем \\(2t\\). Полученная матрица является хорошей.\n\nОсталось проверить, что эти две процедуры взаимно обратны. Если начать с хорошие матрицы, то внутри каждого множества равных элементов дружеских границ нет, а между любыми двумя соседними значениями дружеская граница есть, как доказано выше; следовательно, обратное разбиение стандартной таблицы восстановит ровно исходные блоки равных значений. Если начать со стандартной таблицы нечётной степени, сначала свернуть максимальные блоки, а затем снова развернуть их в последовательные числа, то каждый блок, по лемме, является одним горизонтальным или вертикальным отрезком, и единственный возрастающий порядок на нём возвращает исходное расположение чисел. Значит, хорошие матрицы размера \\(m\\times n\\) находятся во взаимно однозначном соответствии с вершинами нечётной степени в построенном графе стандартных таблиц.\n\nВ любом конечном графе число вершин нечётной степени чётно: сумма всех степеней равна удвоенному числу рёбер. Следовательно, число хороших матриц размера \\(m\\times n\\) чётно.\n",
