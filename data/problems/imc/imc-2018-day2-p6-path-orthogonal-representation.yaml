    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Рассмотрим путь \\(1-2-\\cdots-k\\). Требуется найти минимальную размерность евклидова пространства, в котором вершинам пути можно сопоставить ненулевые векторы так, чтобы любые две несмежные вершины пути получили ортогональные векторы. Докажите, что эта минимальная размерность равна \\(\\lceil k/2\\rceil\\).",
