        "title": "Условие",
        "text": "Пусть \\(k\\) -- положительное целое число. Найдите наименьшее положительное целое \\(n\\), для которого существуют \\(k\\) ненулевых векторов \\(v_1,\\ldots,v_k\\) в \\(\\mathbb R^n\\) такие, что для любых индексов \\(i,j\\) с \\(|i-j|>1\\) векторы \\(v_i\\) и \\(v_j\\) ортогональны.",
