  "ideas": [
    {
      "id": "idea-odd-indices-independent-set",
      "title": "Нечётные индексы дают слишком большую ортогональную систему",
      "text": "В графе пути вершины \\(1,3,5,\\ldots\\) попарно несмежны, поэтому соответствующие векторы должны быть попарно ортогональны. В \\(\\mathbb R^n\\) не может быть больше \\(n\\) ненулевых попарно ортогональных векторов.",
      "tags": [
        "graph_model"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-pair-basis-vectors",
      "title": "Одна базисная ось на две соседние вершины",
      "text": "Для конструкции достаточно присвоить один и тот же базисный вектор парам индексов \\((1,2),(3,4),\\ldots\\). Несоседние индексы попадают в разные пары и получают разные ортогональные базисные векторы.",
      "tags": [
        "construction"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Оценка по независимому множеству пути и явная конструкция",
      "text": "Ответ: \\(\\lceil k/2\\rceil\\).\n\nСначала докажем нижнюю оценку. Пусть такие векторы существуют в \\(\\mathbb R^n\\). Если \\(k\\ge 2n+1\\), то среди них можно выбрать\n\\[\nv_1,v_3,v_5,\\ldots,v_{2n+1}.\n\\]\nИндексы любых двух выбранных векторов отличаются больше чем на \\(1\\), поэтому по условию эти \\(n+1\\) векторов попарно ортогональны. Но в \\(n\\)-мерном евклидовом пространстве ненулевых попарно ортогональных векторов не больше \\(n\\): после нормировки они были бы линейно независимыми. Значит, необходимо \\(k\\le 2n\\), то есть \\(n\\ge \\lceil k/2\\rceil\\).\n\nТеперь построим пример при \\(n=\\lceil k/2\\rceil\\). Возьмём ортогональный базис \\(e_1,\\ldots,e_n\\) пространства \\(\\mathbb R^n\\). Для полного списка длины \\(2n\\) положим\n\\[\nv_1=v_2=e_1,\\quad v_3=v_4=e_2,\\quad \\ldots,\\quad v_{2n-1}=v_{2n}=e_n.\n\\]\nЕсли \\(|i-j|>1\\), то индексы \\(i\\) и \\(j\\) не лежат в одной паре \\((2r-1,2r)\\). Значит, соответствующие векторы являются разными векторами выбранного ортогонального базиса, а потому ортогональны. Если нужно ровно \\(k\\) векторов, берём первые \\(k\\) членов этой последовательности. Конструкция работает, и вместе с нижней оценкой даёт требуемый минимум.\"\n",
