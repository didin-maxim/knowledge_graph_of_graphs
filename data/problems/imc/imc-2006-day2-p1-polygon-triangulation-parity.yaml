        "title": "Условие",
        "text": "Пусть \\(V\\) — выпуклый многоугольник с \\(n\\) вершинами. (a) Докажите, что если \\(3\\mid n\\), то \\(V\\) можно триангулировать, то есть разбить непересекающимися диагоналями на треугольники с вершинами в вершинах \\(V\\), так, чтобы каждая вершина \\(V\\) была вершиной нечётного числа треугольников. (b) Докажите, что если \\(3\\nmid n\\), то \\(V\\) можно триангулировать так, чтобы ровно две вершины были вершинами чётного числа треугольников.",
