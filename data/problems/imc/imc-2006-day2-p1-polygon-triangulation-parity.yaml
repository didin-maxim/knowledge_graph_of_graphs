  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Индукция с шагом на три вершины",
      "text": "Достаточно проверить три начальных случая и затем переходить от \\(k\\) к \\(k+3\\).\n\nДля \\(n=3\\) единственный треугольник даёт нечётное число треугольников при каждой вершине. Для \\(n=4\\) любая диагональ разбивает четырёхугольник на два треугольника: две вершины диагонали входят в два треугольника, а две остальные — в один, значит ровно две вершины имеют чётную инцидентность. Для \\(n=5\\) достаточно взять триангуляцию веером из одной вершины: эта вершина входит в три треугольника, две соседние с ней — в один, а две оставшиеся — в два; снова ровно две вершины чётные.\n\nПусть утверждение уже доказано для выпуклого \\(k\\)-угольника \\(P_1P_2\\ldots P_k\\). Рассмотрим \\((k+3)\\)-угольник \\(P_1P_2\\ldots P_{k+3}\\). Сначала триангулируем старый \\(k\\)-угольник \\(P_1P_2\\ldots P_k\\) по индукционному предположению. Затем добавим три треугольника\n\\[\nP_1P_kP_{k+2},\\qquad P_kP_{k+1}P_{k+2},\\qquad P_1P_{k+2}P_{k+3}.\n\\]\nОни заполняют добавленную часть многоугольника и вместе со старой триангуляцией дают триангуляцию всего \\((k+3)\\)-угольника.\n\nУ вершин \\(P_1\\) и \\(P_k\\) число инцидентных треугольников увеличилось на \\(2\\), поэтому его чётность не изменилась. Новые вершины \\(P_{k+1}\\), \\(P_{k+2}\\), \\(P_{k+3}\\) входят соответственно в \\(1\\), \\(3\\), \\(1\\) новых треугольников, то есть все они нечётные. Следовательно, количество вершин с чётным числом инцидентных треугольников остаётся тем же, что у исходного \\(k\\)-угольника.\n\nТак как переход увеличивает число вершин на \\(3\\), остаток \\(n\\) по модулю \\(3\\) не меняется. Начальные случаи \\(3,4,5\\) дают соответственно: ни одной чётной вершины при \\(3\\mid n\\) и ровно две чётные вершины при остальных остатках. Утверждение доказано для всех \\(n\\ge3\\).",
