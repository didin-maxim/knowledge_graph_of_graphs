  "ideas": [
    {
      "id": "idea-add-three-vertices",
      "title": "Добавление трёх вершин сохраняет нужное число чётных вершин",
      "text": "Если задача решена для \\(k\\)-угольника, то к стороне между двумя старыми вершинами можно приставить три новые вершины и три треугольника. Две старые вершины получают по два новых инцидентных треугольника, а три новые — по нечётному числу, поэтому набор чётных вершин не меняется.",
