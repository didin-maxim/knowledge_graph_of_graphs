  "solutions": [
    {
      "id": "sol-add-three-vertices-all-odd",
      "title": "Индукция с шагом на три вершины",
      "text": "Проведем индукцию по \\(n\\) среди чисел, кратных \\(3\\).\n\nБаза \\(n=3\\) очевидна: единственный треугольник инцидентен каждой из трех вершин ровно один раз, то есть нечетное число раз.\n\nПусть утверждение доказано для некоторого \\(k\\)-угольника \\(P_1P_2\\ldots P_k\\), где \\(3\\mid k\\). Рассмотрим выпуклый \\((k+3)\\)-угольник \\(P_1P_2\\ldots P_{k+3}\\). По предположению индукции триангулируем подмногоугольник \\(P_1P_2\\ldots P_k\\) так, что каждая его вершина входит в нечетное число треугольников. Оставшаяся часть большого многоугольника - пятиугольник \\(P_1P_kP_{k+1}P_{k+2}P_{k+3}\\). Разобьем его на три треугольника\n\\[\nP_1P_kP_{k+2},\\qquad P_kP_{k+1}P_{k+2},\\qquad P_1P_{k+2}P_{k+3}.\n\\]\nЭти треугольники вместе со старой триангуляцией дают триангуляцию всего \\((k+3)\\)-угольника.\n\nТеперь проверим четности. Вершины \\(P_1\\) и \\(P_k\\) получили по два новых инцидентных треугольника, поэтому их четность не изменилась. Все остальные старые вершины не получили новых треугольников. Новые вершины \\(P_{k+1}\\), \\(P_{k+2}\\), \\(P_{k+3}\\) входят соответственно в \\(1\\), \\(3\\), \\(1\\) новых треугольников, то есть тоже имеют нечетную инцидентность.\n\nЗначит, из подходящей триангуляции для \\(k\\) вершин получается подходящая триангуляция для \\(k+3\\) вершин. Вместе с базой \\(n=3\\) это доказывает утверждение для всех \\(n\\), кратных \\(3\\).",
