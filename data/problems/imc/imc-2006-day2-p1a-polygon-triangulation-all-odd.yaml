  "ideas": [
    {
      "id": "idea-add-three-vertices-preserves-all-odd",
      "title": "Добавлять три вершины, не меняя четность старых вершин",
      "text": "Если нужная триангуляция построена для \\(k\\)-угольника, то к стороне между двумя старыми вершинами можно пристроить три новые вершины и три новых треугольника. Две старые вершины получают по два новых инцидентных треугольника, а три новые вершины получают соответственно \\(1,3,1\\) треугольников; поэтому все вершины остаются нечетными.",
