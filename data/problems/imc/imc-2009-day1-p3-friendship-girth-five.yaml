        "id": "stmt-original",
        "title": "Условие",
        "text": "В городе любые два незнакомых жителя имеют общего друга, и нет жителя, который дружит со всеми остальными. Пронумеруем жителей числами \\(1,\\ldots,n\\), и пусть \\(a_i\\) — число друзей \\(i\\)-го жителя. Известно, что \\(\\sum_{i=1}^n a_i^2=n^2-n\\). Пусть \\(k\\) — наименьшее число жителей, не меньшее \\(3\\), которых можно посадить за круглый стол так, чтобы любые два соседа за столом были друзьями. Найдите все возможные значения \\(k\\).",
        "source_id": "src-imc-2009-day1-p3-official",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": []
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Пусть \\(G\\) — простой граф на \\(n\\) вершинах с \\(\\operatorname{diam}G\\le2\\), без универсальной вершины, и пусть степени вершин \\(a_1,…,a_n\\) удовлетворяют \\(\\sum a_i^2=n^2-n\\). Определите все возможные значения длины кратчайшего цикла в \\(G\\).",
