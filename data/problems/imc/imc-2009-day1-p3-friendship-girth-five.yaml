  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Подсчёт ходов длины два и обхват графа",
      "text": "Ответ: единственно возможное значение \\(k\\) равно \\(5\\).\n\nПостроим граф \\(G\\): вершины — жители, ребро означает дружбу. Условие про общих друзей говорит, что любые две несмежные вершины соединяются путём длины \\(2\\), а отсутствие жителя, знакомого со всеми, означает отсутствие универсальной вершины. Число \\(k\\) — это длина кратчайшего цикла в \\(G\\), если циклы есть.\n\nПодсчитаем упорядоченные ходы длины \\(2\\), то есть тройки \\((v_i,v_j,v_l)\\), где \\(v_iv_j\\) и \\(v_jv_l\\) — рёбра; разрешаем \\(i=l\\). Для фиксированной средней вершины \\(v_j\\) таких ходов \\(a_j^2\\), поэтому всего их \\(\\sum a_j^2=n^2-n\\).\n\nТеперь сопоставим каждой упорядоченной паре различных вершин ход длины \\(2\\). Если \\(v_i\\) и \\(v_j\\) несмежны, берём одного их общего соседа \\(v_l\\) и ход \\((v_i,v_l,v_j)\\). Если они смежны, берём ход \\((v_i,v_j,v_i)\\). Такое отображение инъективно: ход с разными концами мог прийти только от пары этих концов, а ход с одинаковыми концами — только от соответствующей ориентированной пары вдоль ребра.\n\nУпорядоченных пар различных вершин ровно \\(n^2-n\\), и ходов длины \\(2\\) тоже \\(n^2-n\\). Значит, инъекция является биекцией. Поэтому для каждой несмежной пары общий сосед единственен, а для каждой смежной пары общего соседа нет. Иначе появились бы дополнительные ходы длины \\(2\\). Это ровно означает, что в \\(G\\) нет треугольников и четырёхциклов.\n\nЕсли бы \\(G\\) был лесом, то из условия диаметра не больше \\(2\\) следовало бы, что каждая компонента с более чем одной вершиной является звездой, а так как любые две вершины имеют расстояние не больше \\(2\\), граф был бы одной звездой. Тогда центр был бы универсальной вершиной, что запрещено. Значит, цикл существует. Из предыдущего абзаца его длина не меньше \\(5\\).\n\nПокажем, что кратчайший цикл не может иметь длину \\(6\\) или больше. Пусть \\(C\\) — кратчайший цикл длины хотя бы \\(6\\). На нём можно выбрать две вершины так, чтобы обе дуги цикла между ними имели длину больше \\(2\\). Но в графе расстояние между любыми двумя вершинами не больше \\(2\\), значит, существует путь длины \\(1\\) или \\(2\\) между выбранными вершинами. Заменив одну из дуг цикла этим коротким путём, получаем замкнутый обход короче \\(C\\), а в нём содержится цикл короче \\(C\\), противоречие. Следовательно, кратчайший цикл имеет длину \\(5\\).\n\nПример существует: сам цикл \\(C_5\\) удовлетворяет всем условиям. Поэтому единственное возможное значение \\(k\\) — \\(5\\).",
