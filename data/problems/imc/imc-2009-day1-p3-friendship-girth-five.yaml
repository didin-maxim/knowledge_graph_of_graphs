  "ideas": [
    {
      "id": "idea-length-two-walks-force-no-c3-c4",
      "title": "Равенство в подсчёте ходов длины два запрещает \\(C_3\\) и \\(C_4\\)",
      "text": "Каждая упорядоченная пара различных вершин инъективно кодируется ходом длины два: ребро кодируется возвращением по тому же ребру, а неребро — путём через общего соседа. Равенство \\(\\sum a_i^2=n^2-n\\) означает, что лишних ходов длины два нет, то есть у смежных вершин нет общего соседа, а у несмежных он единственный.",
      "tags": [
        "double_counting",
        "degree_counting"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-diameter-two-shortest-cycle",
      "title": "Диаметр два укорачивает длинный кратчайший цикл",
      "text": "Если кратчайший цикл имел бы длину хотя бы \\(6\\), то на нём нашлись бы две вершины, далеко расположенные по обеим дугам. Путь между ними длины не больше \\(2\\) дал бы более короткий замкнутый обход и, значит, более короткий цикл.",
      "tags": [
