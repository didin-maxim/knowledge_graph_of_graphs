        "title": "Условие",
        "text": "Пусть \\(\\Omega=\\{(x,y,z)\\in\\mathbb Z^3: y+1\\ge x\\ge y\\ge z\\ge0\\}\\). Лягушка прыгает по точкам множества \\(\\Omega\\) прыжками длины \\(1\\). Для каждого положительного целого \\(n\\) определите число путей, которыми лягушка может попасть из \\((0,0,0)\\) в \\((n,n,n)\\) ровно за \\(3n\\) прыжков.",
