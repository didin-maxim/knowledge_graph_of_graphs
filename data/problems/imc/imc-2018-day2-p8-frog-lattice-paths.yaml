  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Рекурсия Паскаля на ориентированном решётчатом графе",
      "text": "Ответ:\n\\[\n\\frac{1}{2n+1}\\binom{3n}{n}.\n\\]\n\nРассмотрим отображение\n\\[\n\\pi(x,y,z)=(x+y,z).\n\\]\nИз условий \\(y+1\\ge x\\ge y\\ge z\\ge0\\) следует, что \\(v=z\\ge0\\), а \\(u=x+y\\ge2z=2v\\). Обратно, для всякой точки \\((u,v)\\) с \\(v\\ge0\\), \\(u\\ge2v\\) можно восстановить единственную точку \\(\\Omega\\): берём \\(z=v\\), а \\(x,y\\) как две соседние или равные целые координаты с суммой \\(u\\) и условием \\(y+1\\ge x\\ge y\\). Поэтому \\(\\pi\\) является биекцией между \\(\\Omega\\) и областью\n\\[\n\\Psi=\\\\{(u,v)\\in\\mathbb Z^2: v\\ge0,\\ u\\ge2v\\\\}.\n\\]\n\nПуть длины \\(3n\\) из \\((0,0,0)\\) в \\((n,n,n)\\) не может делать лишних обратных движений: сумма координат должна увеличиться от \\(0\\) до \\(3n\\) ровно за \\(3n\\) прыжков длины \\(1\\). Значит, каждый прыжок увеличивает одну координату на \\(1\\). После проекции это даёт шаги \\((1,0)\\) и \\((0,1)\\) из \\((0,0)\\) в \\((2n,n)\\), оставаясь в \\(\\Psi\\).\n\nОбозначим через \\(f(u,v)\\) число таких путей из \\((0,0)\\) в \\((u,v)\\). Тогда \\(f(0,0)=1\\), а для остальных точек области\n\\[\nf(u,v)=f(u-1,v)+f(u,v-1).\n\\]\nУдобно дополнить граничные условия нулями: \\(f(u,-1)=0\\) и \\(f(2v-1,v)=0\\). Они означают, что путь не может прийти из-за нижней границы или пересечь прямую \\(u=2v-1\\).\n\nТеперь проверим явную формулу\n\\[\nf^*(u,v)=\\binom{u+v}{v}-2\\binom{u+v}{v-1},\n\\]\nгде биномиальный коэффициент считается равным нулю при недопустимом нижнем индексе. Каждое слагаемое удовлетворяет рекурсии Паскаля, значит и \\(f^*\\) удовлетворяет той же рекурсии. При \\((0,0)\\) получаем \\(1\\). При \\(v=-1\\) оба слагаемых равны нулю. На наклонной границе \\(u=2v-1\\) имеем\n\\[\n\\binom{3v-1}{v}=2\\binom{3v-1}{v-1},\n\\]\nпоэтому \\(f^*(2v-1,v)=0\\). Рекурсия вместе с этими начальными и граничными условиями однозначно задаёт \\(f\\), следовательно \\(f=f^*\\).\n\nОстаётся подставить конечную точку:\n\\[\nf(2n,n)=\\binom{3n}{n}-2\\binom{3n}{n-1}.\n\\]\nТак как \\(\\binom{3n}{n-1}=\\binom{3n}{n}\\frac{n}{2n+1}\\), получаем\n\\[\nf(2n,n)=\\binom{3n}{n}\\left(1-\\frac{2n}{2n+1}\\right)=\\frac{1}{2n+1}\\binom{3n}{n}.\n\\]\"\n",
