  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Граф симпатий, обмены и проверка через Холла",
      "text": "Обозначим три множества участников через \\(M\\), \\(F\\), \\(E\\). Построим простой трёхдольный граф \\(G\\): ребро между двумя вершинами разных долей означает взаимную симпатию. Тогда брачная тройка — это треугольник с одной вершиной в каждой доле, а \\(n\\) непересекающихся брачных троек — это фактор из таких треугольников.\n\n(a) Пусть \\(n\\) чётно. Разобьём каждую долю на две равные части: \\(M_0,M_1,F_0,F_1,E_0,E_1\\). Проведём все рёбра между \\(M_i\\) и \\(F_i\\), между \\(F_i\\) и \\(E_i\\), а также между \\(E_i\\) и \\(M_{1-i}\\), где \\(i=0,1\\). У каждой вершины ровно \\(n/2\\) соседей в каждой из двух других долей. Треугольника нет: если вершины лежат в \\(M_a\\), \\(F_b\\), \\(E_c\\), то рёбра \\(M_aF_b\\) и \\(F_bE_c\\) требуют \\(a=b=c\\), а ребро \\(E_cM_a\\) требует \\(a=1-c\\), что невозможно. Значит, при \\(k=n/2\\) нельзя гарантировать даже одну брачную тройку.\n\n(b) Докажем сначала официальным методом локального улучшения. Возьмём произвольное разбиение всех участников на \\(n\\) троек вида \\((M_i,F_i,E_i)\\). Назовём недовольством число пар внутри этих троек, между которыми нет ребра. Если недовольство равно нулю, все тройки уже брачные.\n\nПусть недовольство положительно. Тогда в некоторой тройке найдётся вершина, не соединённая хотя бы с одним из двух остальных членов своей тройки. По симметрии долей достаточно рассмотреть случай, когда это \\(E_1\\) в тройке \\((M_1,F_1,E_1)\\). Найдём индекс \\(i\\), для которого \\(E_1\\) соединена с обеими вершинами \\(M_i,F_i\\), а \\(E_i\\) соединена с обеими вершинами \\(M_1,F_1\\). После этого можно поменять местами \\(E_1\\) и \\(E_i\\): пары \\(M_1F_1\\) и \\(M_iF_i\\) не меняются, а все четыре пары с двумя эмалями в новых тройках становятся хорошими. До обмена хотя бы одна пара с \\(E_1\\) была плохой, поэтому недовольство строго уменьшается.\n\nОсталось доказать существование такого \\(i\\). Вершина \\(E_1\\) не соединена не более чем с \\(n-k\\le n/4\\) мужчинами и не более чем с \\(n/4\\) женщинами. Поэтому множество индексов \\(i\\), для которых \\(E_1\\) не соединена хотя бы с одной из вершин \\(M_i,F_i\\), имеет размер не больше \\(n/2\\); оно содержит индекс \\(1\\). Тот же подсчёт для вершин \\(M_1\\) и \\(F_1\\), с учётом взаимности симпатий, показывает: множество индексов \\(i\\), для которых \\(E_i\\) не соединена хотя бы с одной из вершин \\(M_1,F_1\\), тоже имеет размер не больше \\(n/2\\) и тоже содержит индекс \\(1\\). Объединение двух таких множеств имеет размер не больше \\(n/2+n/2-1=n-1\\), значит, не покрывает все индексы. Индекс вне объединения даёт нужный обмен.\n\nНедовольство — неотрицательное целое число, и каждый обмен строго его уменьшает. Через конечное число шагов оно станет нулём, а значит, получится \\(n\\) попарно непересекающихся брачных троек.\n\nПроверим ту же часть (b) независимым способом через теорему Холла. Сначала между долями \\(M\\) и \\(F\\) существует совершенное паросочетание. Действительно, если для некоторого непустого \\(A\\subseteq M\\) его соседство \\(B\\subseteq F\\) имело бы \\(|B|<|A|\\), то \\(B\\ne F\\). Любая вершина \\(f\\in F\\setminus B\\) не соединена ни с одной вершиной из \\(A\\), поэтому её степень в \\(M\\) не больше \\(n-|A|<n-|B|\\le n-k<k\\), что противоречит условию.\n\nЗафиксируем совершенное паросочетание между \\(M\\) и \\(F\\) и обозначим через \\(P\\) множество его \\(n\\) пар. Построим двудольный граф \\(H\\) с долями \\(P\\) и \\(E\\): пару \\((m,f)\\in P\\) соединяем с \\(e\\in E\\), если \\(e\\) соединена в \\(G\\) и с \\(m\\), и с \\(f\\). Каждая пара \\((m,f)\\) имеет в \\(H\\) степень не меньше \\(|N_E(m)\\cap N_E(f)|\\ge k+k-n=2k-n\\).\n\nПокажем, что в \\(H\\) выполнено условие Холла. Предположим противное: для некоторого множества \\(A\\subseteq P\\), \\(|A|=l\\), его соседство \\(B\\subseteq E\\) имеет \\(|B|<l\\). Тогда из нижней оценки степеней пар следует \\(2k-n\\le |B|<l\\). Возьмём \\(e\\in E\\setminus B\\). Для каждой пары \\((m,f)\\in A\\) вершина \\(e\\) не может быть соединена сразу с обеими вершинами \\(m\\) и \\(f\\), иначе она лежала бы в \\(B\\). Значит, по этим \\(l\\) парам она даёт не больше \\(l\\) рёбер, а по остальным \\(n-l\\) парам — не больше \\(2(n-l)\\) рёбер. Поэтому степень \\(e\\) в \\(M\\cup F\\) не больше \\(l+2(n-l)=2n-l\\). С другой стороны, по условию эта степень не меньше \\(2k\\), откуда \\(l\\le 2n-2k\\). Итак, \\(2k-n<l\\le 2n-2k\\), что даёт \\(k<3n/4\\), противоречие. Следовательно, \\(H\\) имеет совершенное паросочетание, и оно вместе с парами из \\(P\\) даёт \\(n\\) непересекающихся треугольников в \\(G\\).",
