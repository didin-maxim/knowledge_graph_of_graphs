        "id": "stmt-original",
        "title": "Условие",
        "text": "У инопланетной расы три пола: мужской, женский и эмальский. Брачная тройка состоит из трёх представителей разных полов, которые все нравятся друг другу. Каждый человек может входить не более чем в одну брачную тройку; симпатии всегда взаимны. В экспедиции есть \\(n\\) мужчин, \\(n\\) женщин и \\(n\\) эмалей. Известно, что каждый участник симпатизирует хотя бы \\(k\\) представителям каждого из двух других полов. Нужно создать как можно больше брачных троек. (a) Докажите, что если \\(n\\) чётно и \\(k=n/2\\), то может быть невозможно создать даже одну брачную тройку. (b) Докажите, что если \\(k\\ge 3n/4\\), то всегда можно создать \\(n\\) попарно непересекающихся брачных троек, то есть включить в них всех участников экспедиции.",
