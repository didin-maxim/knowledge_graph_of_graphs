  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Трёхдольный граф, обмены и теорема Холла",
      "text": "Рассмотрим трёхдольный граф \\(G\\) с долями \\(M,F,E\\): ребро означает взаимную симпатию. Брачная тройка — это треугольник с одной вершиной в каждой доле.\n\n(a) Пусть \\(n\\) чётно. Разделим каждую долю на две равные части: \\(M_0,M_1,F_0,F_1,E_0,E_1\\). Проведём все рёбра между \\(M_i\\) и \\(F_i\\), между \\(F_i\\) и \\(E_i\\), а между \\(E_i\\) и \\(M_{1-i}\\), где \\(i=0,1\\). Тогда каждая вершина имеет ровно \\(n/2\\) соседей в каждой другой доле. Но треугольника нет: если \\(M_a\\) соединён с \\(F_b\\), то \\(a=b\\); если \\(F_b\\) соединён с \\(E_c\\), то \\(b=c\\); тогда \\(E_c\\) соединяется только с \\(M_{1-c}\\), а не с \\(M_a\\). Значит, при \\(k=n/2\\) нельзя гарантировать даже одну тройку.\n\n(b) Официальное решение даёт локальный способ улучшения. Возьмём произвольное разбиение всех участников на \\(n\\) троек, каждая из одного мужчины, одной женщины и одной эмали. Назовём недовольством число отсутствующих рёбер внутри этих троек. Если недовольство равно нулю, все тройки уже брачные.\n\nПредположим, что недовольство положительно. Достаточно разобрать случай, когда эмаль \\(E_1\\) не соединена хотя бы с одним из двух других членов своей тройки \\((M_1,F_1,E_1)\\); остальные случаи симметричны. Нужно найти другую тройку \\((M_i,F_i,E_i)\\), \\(i>1\\), такую, что \\(E_i\\) соединена с обоими \\(M_1,F_1\\), а \\(E_1\\) соединена с обоими \\(M_i,F_i\\). Тогда можно поменять местами \\(E_1\\) и \\(E_i\\): пары, не связанные с этими двумя эмалями, не изменятся, а число плохих пар с участием выбранной эмали уменьшится.\n\nПочему такой индекс существует? Так как \\(E_1\\) не любит не более \\(n-k\\le n/4\\) мужчин и не более \\(n/4\\) женщин, число индексов \\(i\\), для которых \\(E_1\\) не соединена хотя бы с одной вершиной из пары \\((M_i,F_i)\\), не превосходит \\(n/2\\); этот набор содержит индекс \\(1\\). Аналогично число индексов \\(i\\), для которых \\(E_i\\) не соединена хотя бы с одной из вершин \\(M_1,F_1\\), тоже не превосходит \\(n/2\\), и этот набор также содержит \\(1\\). Два подмножества размера не больше \\(n/2\\), имеющие общий элемент \\(1\\), не могут покрыть все \\(n\\) индексов. Значит, найдётся индекс \\(i\\), не входящий ни в один из плохих наборов. Обмен уменьшает недовольство.\n\nНедовольство — неотрицательное целое число, поэтому после конечного числа обменов оно станет нулём. Тогда получаются \\(n\\) попарно непересекающихся брачных троек.\n\nЕсть и эквивалентная проверка через Холла. Сначала между \\(M\\) и \\(F\\) существует совершенное паросочетание: если множество \\(A\\subset M\\) имеет соседство \\(B\\subset F\\) с \\(|B|<|A|\\), то любой \\(f\\in F\\setminus B\\) имеет в \\(M\\) степень меньше \\(n-|B|\\le n-k\\le n/4\\), что противоречит нижней оценке \\(k\\ge3n/4\\). Затем строим двудольный граф между найденными парами \\((m,f)\\) и вершинами \\(E\\): соединяем \\((m,f)\\) с \\(e\\), если \\(e\\) соединена и с \\(m\\), и с \\(f\\). Каждая пара имеет степень хотя бы \\(2k-n\\). Если условие Холла нарушено для \\(l\\) пар и их соседства \\(B\\), то \\(2k-n<l\\). С другой стороны, вершина \\(e\\notin B\\) не может быть соединена с обеими вершинами ни одной из этих \\(l\\) пар, поэтому её суммарная степень в \\(M\\cup F\\) не больше \\(2n-l\\); из степени \\(2k\\) получаем \\(l\\le2n-2k\\). Неравенства \\(2k-n<l\\le2n-2k\\) дают \\(k<3n/4\\), противоречие. Значит, второй граф тоже имеет совершенное паросочетание, то есть все участники покрываются треугольниками.",
