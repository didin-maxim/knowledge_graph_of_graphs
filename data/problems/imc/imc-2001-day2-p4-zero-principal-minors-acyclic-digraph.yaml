        "text": "Пусть \\(A=(a_{k,l})_{k,l=1,\\ldots,n}\\) - комплексная матрица \\(n\\times n\\), такая что для каждого \\(m\\in\\{1,\\ldots,n\\}\\) и любых \\(1\\le j_1<\\cdots<j_m\\le n\\) определитель матрицы \\((a_{j_k,j_l})_{k,l=1,\\ldots,m}\\) равен нулю. Докажите, что \\(A^n=0\\), и что существует перестановка \\(\\sigma\\in S_n\\), для которой матрица \\((a_{\\sigma(k),\\sigma(l)})_{k,l=1,\\ldots,n}\\) имеет нули на диагонали и ниже диагонали.",
