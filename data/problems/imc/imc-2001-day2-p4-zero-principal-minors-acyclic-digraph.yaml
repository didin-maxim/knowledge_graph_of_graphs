  "ideas": [
    {
      "id": "idea-minimal-cycle-determinant-term",
      "title": "Минимальный ориентированный цикл дает ненулевой главный минор",
      "text": "Если в графе ненулевых элементов есть кратчайший ориентированный цикл, то в определителе главной подматрицы по его вершинам есть ненулевой циклический член. Остальные ненулевые члены разлагаются на ориентированные циклы и нарушают минимальность, поэтому этот минор не может быть нулевым.",
      "tags": [
        "minimal_counterexample",
        "graph_model"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-acyclic-support-triangular",
      "title": "Ациклический граф упорядочивается топологически",
      "text": "Если в ориентированном графе нет циклов, его вершины можно занумеровать так, что каждая дуга идет вперед. В этой нумерации матрица имеет нули на диагонали и ниже нее, а значит является строго верхнетреугольной.",
      "tags": [
