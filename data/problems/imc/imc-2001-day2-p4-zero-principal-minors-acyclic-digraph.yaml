  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Граф ненулевых элементов",
      "text": "Сначала из главных миноров порядка \\(1\\) получаем \\(a_{ii}=0\\) для всех \\(i\\). Построим ориентированный граф \\(G\\) на вершинах \\(1,\\ldots,n\\): дуга \\(i\\to j\\) проводится тогда и только тогда, когда \\(a_{ij}\\ne0\\). Нужно доказать, что в \\(G\\) нет ориентированных циклов.\n\nПредположим противное и выберем ориентированный цикл минимальной длины \\(m\\), пусть его вершины \\(i_1,i_2,\\ldots,i_m\\) идут в порядке цикла. Рассмотрим главную подматрицу \\(B\\) с этими строками и столбцами. В разложении \\(\\det B\\) есть член\n\\(a_{i_1i_2}a_{i_2i_3}\\cdots a_{i_mi_1}\\), и он ненулевой. Рассмотрим любой другой ненулевой член разложения. Соответствующая перестановка раскладывается в непересекающиеся циклы; так как диагональные элементы равны нулю, неподвижных точек в ненулевом члене нет. Каждый цикл этой перестановки даёт ориентированный цикл в \\(G\\) на части выбранных вершин. Если циклов несколько, один из них короче \\(m\\), что противоречит минимальности. Значит, возможен только один цикл длины \\(m\\), проходящий по всем выбранным вершинам. Если он отличается от исходного, то в нём есть дуга \\(i_p\\to i_q\\), не являющаяся следующей дугой исходного цикла. Если \\(i_q\\ne i_{p-1}\\), эта дуга вместе с участком исходного цикла от \\(i_q\\) до \\(i_p\\) даёт цикл короче \\(m\\). Если \\(i_q=i_{p-1}\\), то дуги \\(i_p\\to i_{p-1}\\) и \\(i_{p-1}\\to i_p\\) дают цикл длины \\(2\\). В любом случае противоречие минимальности. Поэтому ненулевой член в \\(\\det B\\) единственный, и \\(\\det B\\ne0\\), что противоречит условию.\n\nЗначит, граф \\(G\\) ацикличен. Для конечного ациклического ориентированного графа существует топологический порядок вершин: можно, например, последовательно удалять вершину без входящих дуг. Пусть этот порядок задает перестановка \\(\\sigma\\). Тогда из \\(a_{\\sigma(k),\\sigma(l)}\\ne0\\) следует \\(k<l\\), то есть все элементы на диагонали и ниже диагонали в переставленной матрице равны нулю. Такая матрица строго верхнетреугольна, а \\(n\\)-я степень любой строго верхнетреугольной матрицы размера \\(n\\times n\\) равна нулю. Одновременная перестановка строк и столбцов не меняет факт нильпотентности, поэтому \\(A^n=0\\).",
