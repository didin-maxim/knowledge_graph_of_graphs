  "solutions": [
    {
      "id": "sol-add-three-vertices-two-even",
      "title": "Две базы и индукция с шагом 3",
      "text": "Проведем индукцию отдельно по двум остаткам \\(n\\equiv 1\\pmod 3\\) и \\(n\\equiv 2\\pmod 3\\).\n\nБаза \\(n=4\\): любая диагональ разбивает четырехугольник на два треугольника. Две вершины проведенной диагонали входят в два треугольника, а две остальные - в один. Значит, ровно две вершины имеют четное число инцидентных треугольников.\n\nБаза \\(n=5\\): возьмем веерную триангуляцию из одной вершины. Эта вершина входит в три треугольника; две соседние с ней вершины входят в один треугольник; две оставшиеся вершины входят в два треугольника. Значит, снова ровно две вершины имеют четную инцидентность.\n\nТеперь пусть утверждение доказано для некоторого \\(k\\)-угольника \\(P_1P_2\\ldots P_k\\), где \\(3\\nmid k\\). Рассмотрим выпуклый \\((k+3)\\)-угольник \\(P_1P_2\\ldots P_{k+3}\\). По предположению индукции триангулируем подмногоугольник \\(P_1P_2\\ldots P_k\\) так, что ровно две его вершины имеют четную инцидентность. Оставшийся пятиугольник \\(P_1P_kP_{k+1}P_{k+2}P_{k+3}\\) разобьем на три треугольника\n\\[\nP_1P_kP_{k+2},\\qquad P_kP_{k+1}P_{k+2},\\qquad P_1P_{k+2}P_{k+3}.\n\\]\nВместе со старой триангуляцией они дают триангуляцию всего \\((k+3)\\)-угольника.\n\nПри этом вершины \\(P_1\\) и \\(P_k\\) получили по два новых инцидентных треугольника, так что их четность не изменилась; остальные старые вершины не изменились вовсе. Новые вершины \\(P_{k+1}\\), \\(P_{k+2}\\), \\(P_{k+3}\\) входят соответственно в \\(1\\), \\(3\\), \\(1\\) новых треугольников, то есть все они нечетные. Поэтому число четных вершин осталось тем же, а именно равным двум.\n\nШаг увеличивает число вершин на \\(3\\), не меняя остаток по модулю \\(3\\). Базы \\(4\\) и \\(5\\) покрывают все \\(n\\), не делящиеся на \\(3\\), следовательно требуемая триангуляция существует для каждого такого \\(n\\).",
