      "id": "idea-add-three-vertices-preserves-two-even",
      "title": "Добавление трех вершин сохраняет число четных вершин",
      "text": "При пристройке трех вершин к стороне уже триангулированного многоугольника две старые вершины получают по два новых треугольника, а новые вершины получают \\(1,3,1\\) треугольников. Поэтому множество старых четных вершин не меняется, а новые вершины не добавляют четных инцидентностей.",
