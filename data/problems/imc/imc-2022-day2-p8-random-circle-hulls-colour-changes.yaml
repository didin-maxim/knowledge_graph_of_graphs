        "title": "Условие",
        "text": "Пусть \\(n,k\\ge3\\), и пусть \\(S\\) -- окружность. На \\(S\\) независимо и равномерно выбираются \\(n\\) синих и \\(k\\) красных точек. Обозначим через \\(F\\) пересечение выпуклой оболочки красных точек и выпуклой оболочки синих точек. Пусть \\(m\\) -- число вершин выпуклого многоугольника \\(F\\), причём \\(m=0\\), если \\(F\\) пусто. Найдите математическое ожидание \\(m\\).",
