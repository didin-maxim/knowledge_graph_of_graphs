  "ideas": [
    {
      "id": "idea-vertices-as-colour-changes",
      "title": "Вершины пересечения соответствуют сменам цвета",
      "text": "Если красные и синие точки чередуются хотя бы в двух блоках каждого цвета, каждая смена цвета на циклической последовательности даёт одну вершину пересечения оболочек, и других вершин нет.",
      "tags": [
        "graph_model"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Ожидание числа смен цвета в случайном циклическом слове",
      "text": "Ответ:\n\\[\n\\mathbb E m=\\frac{2nk}{n+k-1}-\\frac{2n!k!}{(n+k-1)!}.\n\\]\n\nПочти наверное все выбранные точки различны. Зафиксируем их циклический порядок на окружности и забудем о точных положениях: все способы выбрать, какие \\(n\\) из \\(n+k\\) мест синие, равновероятны. Так задача превращается в подсчёт смен цвета в случайной раскраске цикла с \\(n\\) синими и \\(k\\) красными вершинами.\n\nРассмотрим сначала обычный случай, когда красные точки не образуют одну сплошную дугу, за которой идёт одна сплошная дуга синих точек. Тогда при обходе окружности каждая пара соседних точек разных цветов определяет одну вершину пересечения выпуклых оболочек: сторона оболочки одного цвета и соседняя сторона оболочки другого цвета пересекаются. Обратно, всякая вершина пересечения возникает именно от такой смены цвета. Поэтому в этом случае \\(m\\) равно числу смен цвета в циклической последовательности.\n\nИсключительный случай: все красные точки идут подряд и все синие точки идут подряд. Тогда смен цвета ровно две, но выпуклые оболочки лежат по разные стороны от разделяющей хорды и не пересекаются, так что \\(m=0\\). Значит, от ожидаемого числа смен цвета надо вычесть \\(2\\) умножить на вероятность этого исключительного случая.\n\nНайдём ожидание числа смен. Для фиксированной соседней пары мест на цикле вероятность, что цвета различны, равна\n\\[\n\\frac{2nk}{(n+k)(n+k-1)}:\n\\]\nпервый цвет можно выбрать двумя способами с соответствующими численностями \\(n,k\\), а затем второй должен быть другого цвета. В цикле \\(n+k\\) соседних пар, поэтому по линейности ожидания ожидаемое число смен равно\n\\[\n(n+k)\\frac{2nk}{(n+k)(n+k-1)}=\\frac{2nk}{n+k-1}.\n\\]\n\nОсталось посчитать вероятность исключительного случая. Всего цветовых циклических размещений, если места уже пронумерованы, \\(\\binom{n+k}{n}\\). Сплошной красный блок длины \\(k\\) можно начать в любом из \\(n+k\\) мест, и этим раскраска полностью определяется. Поэтому вероятность равна\n\\[\n\\frac{n+k}{\\binom{n+k}{n}}=\\frac{n!k!}{(n+k-1)!}.\n\\]\nВычитая двойной вклад исключения, получаем заявленную формулу.\"\n",
