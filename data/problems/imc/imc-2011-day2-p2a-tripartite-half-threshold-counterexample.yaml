        "id": "stmt-original-half-threshold",
        "title": "Условие, часть (a)",
        "text": "У инопланетной расы три пола: мужской, женский и эмальский. Брачная тройка состоит из трех представителей разных полов, которые все нравятся друг другу; симпатии взаимны. В экспедиции есть \\(n\\) мужчин, \\(n\\) женщин и \\(n\\) эмалей. Каждый участник симпатизирует хотя бы \\(k\\) представителям каждого из двух других полов. Докажите, что если \\(n\\) четно и \\(k=n/2\\), то может быть невозможно создать даже одну брачную тройку.",
        "source_id": "src-imc-2011-day2-p2-official",
        "status": "ai_checked",
