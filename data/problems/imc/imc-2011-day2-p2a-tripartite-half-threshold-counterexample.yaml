      "id": "idea-binary-label-obstruction",
      "title": "Несовместимые двоичные метки на трех долях",
      "text": "Разбиваем каждую долю пополам и разрешаем ребра \\(M_iF_i\\), \\(F_iE_i\\), \\(E_iM_{1-i}\\). Любые два первых типа ребер заставляют три метки совпасть, а третий тип требует противоположности.",
