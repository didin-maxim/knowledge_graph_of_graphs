    "graph_theory": [
      {
        "id": "stmt-graph-half-threshold",
        "title": "Сбалансированный трехдольный граф без треугольников",
        "text": "Пусть \\(n\\) четно. Постройте простой трехдольный граф с долями \\(M,F,E\\), каждая размера \\(n\\), такой что каждая вершина имеет ровно \\(n/2\\) соседей в каждой из двух чужих долей, но граф не содержит треугольника с одной вершиной в каждой доле.",
