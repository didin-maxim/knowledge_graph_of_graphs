  "solutions": [
    {
      "id": "sol-half-threshold-construction",
      "title": "Двухцветная конструкция без треугольников",
      "text": "Пусть \\(n\\) четно. Разобьем каждую из трех долей на две равные части:\n\\[\nM=M_0\\sqcup M_1,\\qquad F=F_0\\sqcup F_1,\\qquad E=E_0\\sqcup E_1,\n\\]\nгде каждая часть имеет размер \\(n/2\\).\n\nПроведем все ребра между \\(M_i\\) и \\(F_i\\), все ребра между \\(F_i\\) и \\(E_i\\), а также все ребра между \\(E_i\\) и \\(M_{1-i}\\), где \\(i=0,1\\). Других ребер нет. Тогда каждая вершина из любой доли соединена ровно с одной половиной каждой из двух других долей, то есть имеет ровно \\(n/2\\) соседей в каждой чужой доле.\n\nПроверим, что треугольника нет. Если вершины предполагаемого треугольника лежат в \\(M_a\\), \\(F_b\\), \\(E_c\\), то ребро между \\(M_a\\) и \\(F_b\\) возможно только при \\(a=b\\), а ребро между \\(F_b\\) и \\(E_c\\) возможно только при \\(b=c\\). Значит, эти два ребра требуют \\(a=b=c\\). Но ребро между \\(E_c\\) и \\(M_a\\) возможно только при \\(a=1-c\\), что противоречит \\(a=c\\). Поэтому треугольников нет.\n\nВ исходном языке это означает, что при \\(k=n/2\\) можно выполнить все индивидуальные условия симпатий, но не получить ни одной брачной тройки.",
      "idea_ids": [
        "idea-binary-label-obstruction"
      ],
