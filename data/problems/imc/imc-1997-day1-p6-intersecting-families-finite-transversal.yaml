        "title": "Условие",
        "text": "Пусть \\(\\mathcal F\\) - семейство конечных подмножеств множества натуральных чисел \\(\\mathbb N\\), причем любые два множества \\(A,B\\in\\mathcal F\\) имеют непустое пересечение. (a) Верно ли, что существует конечное множество \\(Y\\subset\\mathbb N\\), такое что для любых \\(A,B\\in\\mathcal F\\) выполнено \\(A\\cap B\\cap Y\\ne\\varnothing\\)? (b) Останется ли утверждение пункта (a) верным, если дополнительно известно, что все множества из \\(\\mathcal F\\) имеют один и тот же размер? Ответы обоснуйте.",
