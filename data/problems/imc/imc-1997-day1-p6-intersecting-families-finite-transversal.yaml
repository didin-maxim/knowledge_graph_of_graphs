    {
      "id": "idea-traces-on-fixed-pair",
      "title": "Индукция по размерам через следы на фиксированной паре",
      "text": "Для двух равномерных перекрестно пересекающихся семейств фиксируем одну пару множеств \\(A_0,B_0\\) и разбиваем остальные множества по их следам на конечном множестве \\(A_0\\cup B_0\\). Если два следа пересекаются, одна точка из их пересечения уже работает; если нет, то пересечение вынуждено лежать вне \\(A_0\\cup B_0\\), и после удаления следов размеры обоих семейств уменьшаются.",
