      "title": "Пересечение можно уводить за любой конечный барьер",
      "text": "В неравномерном случае пары множеств можно устроить так, что \\(A_n\\cap B_n\\) состоит из одной большой точки \\(2n\\). Тогда любое заранее выбранное конечное \\(Y\\) промахивается мимо этой пары при больших \\(n\\).",
