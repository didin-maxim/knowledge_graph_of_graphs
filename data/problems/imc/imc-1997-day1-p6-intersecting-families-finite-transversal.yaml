  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Контрпример и индукция для равномерного случая",
      "text": "В пункте (a) ответ отрицательный. Для каждого \\(n\\ge 1\\) положим\n\\(A_n=\\{1,3,5,\\ldots,2n-1,2n\\}\\) и \\(B_n=\\{2,4,6,\\ldots,2n,2n+1\\}\\), а семейство \\(\\mathcal F\\) составим из всех этих \\(A_n\\) и \\(B_n\\). Любые два множества из семейства пересекаются: два множества типа \\(A\\) имеют общие нечетные элементы, два множества типа \\(B\\) имеют общие четные элементы; если сравнивать \\(A_n\\) и \\(B_m\\), то при \\(n\\le m\\) общим является \\(2n\\), а при \\(n>m\\) общим является \\(2m+1\\). Но \\(A_n\\cap B_n=\\{2n\\}\\). Поэтому для любого конечного \\(Y\\) можно выбрать \\(n\\) так, что \\(2n\\notin Y\\), и тогда \\(A_n\\cap B_n\\cap Y=\\varnothing\\).\n\nДля пункта (b) докажем более сильное утверждение. Пусть \\(\\mathcal F\\) и \\(\\mathcal G\\) - два семейства конечных подмножеств \\(\\mathbb N\\), каждое множество из \\(\\mathcal F\\) имеет размер \\(r\\), каждое множество из \\(\\mathcal G\\) имеет размер \\(s\\), и для любых \\(A\\in\\mathcal F\\), \\(B\\in\\mathcal G\\) выполнено \\(A\\cap B\\ne\\varnothing\\). Тогда существует конечное \\(Y\\), такое что \\(A\\cap B\\cap Y\\ne\\varnothing\\) для всех таких \\(A,B\\). Нужный результат получается при \\(\\mathcal F=\\mathcal G\\).\n\nДоказательство ведем индукцией по паре \\((r,s)\\), например по сумме \\(r+s\\). При \\(r=s=1\\) все очевидно. Зафиксируем \\(A_0\\in\\mathcal F\\) и \\(B_0\\in\\mathcal G\\). Для каждого непустого \\(C\\subset A_0\\cup B_0\\) рассмотрим подсемейство \\(\\mathcal F(C)=\\{A\\in\\mathcal F: A\\cap(A_0\\cup B_0)=C\\}\\); аналогично определим \\(\\mathcal G(D)\\). Следы непусты, потому что каждое \\(A\\) пересекает \\(B_0\\), а каждое \\(B\\) пересекает \\(A_0\\).\n\nДостаточно для каждой пары непустых следов \\(C,D\\subset A_0\\cup B_0\\) построить конечное множество \\(Y_{C,D}\\), работающее для \\(\\mathcal F(C)\\) и \\(\\mathcal G(D)\\), а затем взять объединение всех этих конечных множеств. Если \\(C\\cap D\\ne\\varnothing\\), то любая точка из \\(C\\cap D\\) лежит во всех соответствующих пересечениях \\(A\\cap B\\), так что можно взять одноточечное \\(Y_{C,D}\\). Если же \\(C\\cap D=\\varnothing\\), то пересечение любого \\(A\\in\\mathcal F(C)\\) и \\(B\\in\\mathcal G(D)\\) не может лежать внутри \\(A_0\\cup B_0\\), значит множества \\(A\\setminus C\\) и \\(B\\setminus D\\) по-прежнему перекрестно пересекаются. Их размеры равны \\(r-|C|<r\\) и \\(s-|D|<s\\), поэтому к этим двум новым семействам применима индукционная гипотеза. Полученное конечное множество и будет \\(Y_{C,D}\\). Объединение по всем \\(C,D\\) конечно и пересекает каждое \\(A\\cap B\\), что завершает доказательство.",
