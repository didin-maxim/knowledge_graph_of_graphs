  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Контрпример и индукция для равномерного случая",
      "text": "В пункте (a) ответ отрицательный. Для каждого \\(n\\ge 1\\) положим\\n\\(A_n=\\{1,3,5,\\ldots,2n-1,2n\\}\\) и \\(B_n=\\{2,4,6,\\ldots,2n,2n+1\\}\\), а семейство \\(\\mathcal F\\) составим из всех этих \\(A_n\\) и \\(B_n\\).\\n\\nПроверим, что любые два множества из \\(\\mathcal F\\) пересекаются. Если взяты \\(A_n\\) и \\(A_m\\), то они оба содержат \\(1\\). Если взяты \\(B_n\\) и \\(B_m\\), то они оба содержат \\(2\\). Наконец, для \\(A_n\\) и \\(B_m\\) при \\(n\\le m\\) общим элементом является \\(2n\\), а при \\(n>m\\) общим элементом является \\(2m+1\\). С другой стороны, \\(A_n\\cap B_n=\\{2n\\}\\). Если \\(Y\\) - любое конечное подмножество \\(\\mathbb N\\), выберем \\(n\\) так, что \\(2n\\notin Y\\). Тогда \\(A_n\\cap B_n\\cap Y=\\varnothing\\). Значит, универсального конечного множества \\(Y\\) в пункте (a) может не быть.\\n\\nДля пункта (b) докажем более сильное утверждение о двух перекрестно пересекающихся семействах. Пусть \\(\\mathcal F\\) и \\(\\mathcal G\\) - два семейства конечных подмножеств \\(\\mathbb N\\), каждое множество из \\(\\mathcal F\\) имеет размер \\(r\\), каждое множество из \\(\\mathcal G\\) имеет размер \\(s\\), и для любых \\(A\\in\\mathcal F\\), \\(B\\in\\mathcal G\\) выполнено \\(A\\cap B\\ne\\varnothing\\). Тогда существует конечное множество \\(Y\\subset\\mathbb N\\), такое что \\(A\\cap B\\cap Y\\ne\\varnothing\\) для всех \\(A\\in\\mathcal F\\), \\(B\\in\\mathcal G\\). Нужный результат получается при \\(\\mathcal F=\\mathcal G\\).\\n\\nЕсли одно из семейств пусто, утверждение пусто и можно взять \\(Y=\\varnothing\\). Далее считаем оба семейства непустыми. Доказываем утверждение индукцией по \\(r+s\\). Если \\(r=1\\), то зафиксируем любое \\(B_0\\in\\mathcal G\\). Всякое \\(A\\in\\mathcal F\\) является одноточечным множеством \\(\\{a\\}\\) и должно пересекать \\(B_0\\), значит \\(a\\in B_0\\). Для любого \\(B\\in\\mathcal G\\) из \\(A\\cap B\\ne\\varnothing\\) следует \\(a\\in B\\), поэтому \\(A\\cap B\\cap B_0\\ne\\varnothing\\). Значит, при \\(r=1\\) подходит конечное \\(Y=B_0\\). Если \\(s=1\\), то зафиксируем любое \\(A_0\\in\\mathcal F\\). Всякое \\(B\\in\\mathcal G\\) имеет вид \\(\\{b\\}\\) и пересекает \\(A_0\\), значит \\(b\\in A_0\\); из \\(A\\cap B\\ne\\varnothing\\) для любого \\(A\\in\\mathcal F\\) следует \\(b\\in A\\), поэтому \\(A\\cap B\\cap A_0\\ne\\varnothing\\). В этом случае подходит \\(Y=A_0\\).\\n\\nПусть теперь \\(r,s>1\\), и утверждение уже доказано для всех пар положительных размеров с меньшей суммой. Зафиксируем \\(A_0\\in\\mathcal F\\) и \\(B_0\\in\\mathcal G\\), положим \\(U=A_0\\cup B_0\\). Для каждого непустого \\(C\\subset U\\) рассмотрим подсемейство\\n\\[\\mathcal F(C)=\\{A\\in\\mathcal F: A\\cap U=C\\},\\]\\nа для каждого непустого \\(D\\subset U\\) определим\\n\\[\\mathcal G(D)=\\{B\\in\\mathcal G: B\\cap U=D\\}.\\]\\nСледы действительно непусты: каждое \\(A\\in\\mathcal F\\) пересекает \\(B_0\\subset U\\), а каждое \\(B\\in\\mathcal G\\) пересекает \\(A_0\\subset U\\). Поэтому семейства \\(\\mathcal F\\) и \\(\\mathcal G\\) разбиваются на конечное число таких классов по следам.\\n\\nДостаточно для каждой пары непустых следов \\(C,D\\subset U\\) построить конечное множество \\(Y_{C,D}\\), которое пересекает все \\(A\\cap B\\) при \\(A\\in\\mathcal F(C)\\), \\(B\\in\\mathcal G(D)\\). Тогда объединение всех \\(Y_{C,D}\\) по конечному числу пар \\((C,D)\\) будет конечным и будет работать для исходных \\(\\mathcal F,\\mathcal G\\).\\n\\nЗафиксируем непустые \\(C,D\\subset U\\). Если одно из подсемейств \\(\\mathcal F(C),\\mathcal G(D)\\) пусто, для этой пары следов можно взять \\(Y_{C,D}=\\varnothing\\). Если оба непусты и \\(C\\cap D\\ne\\varnothing\\), выберем \\(x\\in C\\cap D\\) и положим \\(Y_{C,D}=\\{x\\}\\). Тогда для любых \\(A\\in\\mathcal F(C)\\), \\(B\\in\\mathcal G(D)\\) имеем \\(x\\in A\\cap B\\cap Y_{C,D}\\).\\n\\nОстается случай, когда оба подсемейства непусты и \\(C\\cap D=\\varnothing\\). Для \\(A\\in\\mathcal F(C)\\), \\(B\\in\\mathcal G(D)\\) пересечение \\((A\\cap B)\\cap U\\) равно \\(C\\cap D\\), то есть пусто. Но \\(A\\cap B\\ne\\varnothing\\), следовательно, множества \\(A\\setminus C\\) и \\(B\\setminus D\\) пересекаются вне \\(U\\). Рассмотрим семейства\\n\\[\\widetilde{\\mathcal F}(C)=\\{A\\setminus C: A\\in\\mathcal F(C)\\},\\qquad \\widetilde{\\mathcal G}(D)=\\{B\\setminus D: B\\in\\mathcal G(D)\\}.\\]\\nОни снова перекрестно пересекаются; все множества первого имеют размер \\(r-|C|\\), все множества второго имеют размер \\(s-|D|\\). Так как \\(C\\) и \\(D\\) непусты, эти размеры положительны и их сумма меньше \\(r+s\\). По индукционному предположению существует конечное множество \\(Y_{C,D}\\), пересекающее каждое \\((A\\setminus C)\\cap(B\\setminus D)\\). Тогда оно тем более пересекает каждое \\(A\\cap B\\) для \\(A\\in\\mathcal F(C)\\), \\(B\\in\\mathcal G(D)\\).\\n\\nМы построили нужное конечное \\(Y_{C,D}\\) для всех пар следов. Их конечное объединение пересекает каждое \\(A\\cap B\\), что завершает индукцию и доказывает пункт (b).",
