      "id": "idea-independent-admissible-shift",
      "title": "Независимые множества вершин становятся допустимыми множествами рёбер",
      "text": "Одно и то же \\(k\\)-подмножество является вершиной \\(G_k\\) и ребром \\(G_{k-1}\\). Запрет на две последовательные тройки ровно означает отсутствие ориентированного пути длины 2 в соответствующем множестве рёбер.",
