        "title": "Условие",
        "text": "Пусть \\(n>3\\) -- целое число, а \\(\\Omega\\) -- множество всех троек различных элементов множества \\(\\{1,2,\\ldots,n\\}\\). Пусть \\(m\\) -- минимальное число цветов, достаточное для раскраски \\(\\Omega\\), при которой для любых \\(1\\le a<b<c<d\\le n\\) тройки \\(\\{a,b,c\\}\\) и \\(\\{b,c,d\\}\\) имеют разные цвета. Докажите, что \\(\\frac1{100}\\log\\log n\\le m\\le100\\log\\log n\\).",
