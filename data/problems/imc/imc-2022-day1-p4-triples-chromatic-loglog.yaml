        "coloring"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-b-index-log-chi",
      "title": "Покрытия рёбер связаны с логарифмом хроматического числа",
      "text": "Если рёбра покрыты \\(m\\) допустимыми классами, цвет вершины можно кодировать множеством исходящих классов, что даёт \\(\\chi\\le2^m\\). В другую сторону двоичные разряды правильной раскраски вершин дают \\(O(\\log\\chi)\\) допустимых классов рёбер.",
      "tags": [
