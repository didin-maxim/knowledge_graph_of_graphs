  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Итерация хроматического числа через допустимые покрытия рёбер",
      "text": "Для \\\\(k=1,\\ldots,n\\\\) обозначим через \\\\(\\\\Omega_k\\\\) множество всех \\\\(k\\\\)-элементных подмножеств \\\\([n]\\\\). Построим ориентированный граф \\\\(G_k\\\\): его вершины -- элементы \\\\(\\\\Omega_k\\\\), а каждое \\\\((k+1)\\)-подмножество \\\\(a_1<\\\\cdots<a_{k+1}\\\\) задаёт ребро\n\\\\[\n(a_1,\\ldots,a_k)\\\\to(a_2,\\ldots,a_{k+1}).\n\\\\]\nВ исходной задаче две тройки \\\\(\\\\{a,b,c\\\\}\\\\) и \\\\(\\\\{b,c,d\\\\}\\\\) должны иметь разные цвета ровно тогда, когда они являются концами ребра в \\\\(G_3\\\\). Следовательно, \\\\(m=\\\\chi(G_3)\\\\).\n\nДля ориентированного графа \\\\(G=(V,E)\\\\) назовём множество рёбер допустимым, если оно не содержит ориентированного пути длины \\\\(2\\\\). Пусть \\\\(b(G)\\\\) -- минимальное число допустимых множеств, покрывающих все рёбра. Ключевое наблюдение: для \\\\(k\\\\ge2\\\\) множество \\\\(A\\\\subset\\\\Omega_k\\\\) независимо в \\\\(G_k\\\\) тогда и только тогда, когда то же множество, рассматриваемое как набор рёбер графа \\\\(G_{k-1}\\\\), допустимо. Действительно, ребро в \\\\(G_k\\\\) между двумя \\\\(k\\\\)-подмножествами возникает из \\\\((k+1)\\)-подмножества, а в \\\\(G_{k-1}\\\\) эти два \\\\(k\\\\)-подмножества являются двумя последовательными рёбрами одного сдвига. Поэтому\n\\\\[\n\\\\chi(G_k)=b(G_{k-1}).\n\\\\]\n\nОсталось связать \\\\(b(G)\\\\) с \\\\(\\\\chi(G)\\\\). Докажем, что\n\\\\[\n\\\\log_2\\\\chi(G)\\le b(G)\\le2\\\\lceil\\\\log_2\\\\chi(G)\\\\rceil.\n\\\\]\nПусть рёбра покрыты допустимыми множествами \\\\(E_1,\\ldots,E_m\\\\). Покрасим вершину \\\\(v\\\\) множеством\n\\\\[\nc(v)=\\\\{i: \\\\text{из }v\\\\text{ выходит ребро из }E_i\\\\}.\n\\\\]\nЕсли \\\\(v\\\\to w\\\\) лежит в \\\\(E_i\\\\), то \\\\(i\\\\in c(v)\\\\). Но \\\\(i\\\\notin c(w)\\\\), иначе в \\\\(E_i\\\\) был бы путь длины \\\\(2\\\\). Значит, концы любого ребра получили разные коды, и \\\\(\\\\chi(G)\\le2^m\\\\).\n\nОбратно, пусть \\\\(\\\\tau:V\\\\to\\\\{0,\\ldots,q-1\\\\}\\\\) -- правильная раскраска, где \\\\(q=\\\\chi(G)\\\\), и \\\\(r=\\\\lceil\\\\log_2q\\\\rceil\\\\). Для каждого двоичного разряда \\\\(s\\\\) разобьём рёбра на два класса: те, где этот разряд меняется с \\\\(0\\\\) на \\\\(1\\\\), и те, где он меняется с \\\\(1\\\\) на \\\\(0\\\\). Эти \\\\(2r\\\\) классов покрывают все рёбра, потому что у концов каждого ребра разные цвета. Каждый такой класс допустим: вдоль двух последовательных рёбер один и тот же двоичный разряд не может сначала измениться в выбранном направлении, а затем ещё раз в том же направлении.\n\nДля \\\\(G_1\\\\) вершины -- числа \\\\(1,\\ldots,n\\\\), а между любыми двумя различными вершинами в возрастающем порядке есть ребро, поэтому \\\\(\\\\chi(G_1)=n\\\\). Из оценки выше и равенства \\\\(\\\\chi(G_k)=b(G_{k-1})\\\\) получаем\n\\\\[\n\\\\chi(G_2)=b(G_1)\\\\asymp\\\\log n,\\qquad\nm=\\\\chi(G_3)=b(G_2)\\\\asymp\\\\log\\\\log n.\n\\\\]\nБолее явно официальная оценка даёт\n\\\\[\n\\\\log_2\\\\lceil\\\\log_2 n\\\\rceil\\le m\\le2\\\\lceil\\\\log_2\\\\lceil\\\\log_2 n\\\\rceil\\\\rceil,\n\\\\]\nчто заведомо сильнее требуемых неравенств с константой \\\\(100\\\\).\"\n",
