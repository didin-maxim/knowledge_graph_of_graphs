  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Сведение к маршрутам на цикле вычетов",
      "text": "Ответ:\n\\\\[\nf(p)\\\\equiv\n\\\\begin{cases}\n0 \\\\pmod p, & p=3,\\\\\n1 \\\\pmod p, & p\\\\equiv1\\\\pmod3,\\\\\n-1 \\\\pmod p, & p\\\\equiv2\\\\pmod3.\n\\\\end{cases}\n\\\\]\n\nДля \\\\(p=3\\\\) прямо есть три стратегии: стоять два раза, пойти влево и вправо, пойти вправо и влево; значит \\\\(f(3)=3\\\\).\n\nДалее пусть \\\\(p\\\\ne3\\\\). Считаем положение блохи по модулю \\\\(p\\\\). За \\\\(p-1\\\\) ходов из \\\\(0\\\\) невозможно прийти на прямой в ненулевую кратную \\\\(p\\\\) точку, потому что абсолютное смещение не превосходит \\\\(p-1\\\\). Поэтому число возвратов на прямой равно числу маршрутов длины \\\\(p-1\\\\) из \\\\(0\\\\) в \\\\(0\\\\) на графе вычетов.\n\nОбозначим через \\\\(a_i(k)\\\\) число стратегий, после \\\\(k\\\\) минут приводящих в вычет \\\\(i\\\\). Тогда\n\\\\[\na_i(k+1)=a_{i-1}(k)+a_i(k)+a_{i+1}(k),\n\\\\]\nгде индексы берутся по модулю \\\\(p\\\\). Рассмотрим стратегии длины \\\\(p\\\\). Любое непостоянное слово из символов \\\\(-1,0,+1\\\\) имеет орбиту размера \\\\(p\\\\) относительно циклического сдвига: если слово имеет меньший период, этот период делит простое число \\\\(p\\\\), значит слово было бы постоянным. Все слова в одной орбите имеют одну и ту же сумму ходов, то есть один и тот же конечный вычет. Следовательно, по модулю \\\\(p\\\\) все непостоянные слова дают нулевой вклад. Три постоянных слова имеют суммы \\\\(-p,0,p\\\\), то есть все заканчиваются в вычете \\\\(0\\\\). Поэтому\n\\\\[\na_0(p)\\\\equiv3,\\qquad a_i(p)\\\\equiv0\\quad (i\\\\ne0).\n\\\\]\n\nПоложим \\\\(x_i=a_i(p-1)\\\\). Тогда после ещё одного шага получаем систему\n\\\\[\nx_{-1}+x_0+x_1=3,\\qquad x_{i-1}+x_i+x_{i+1}=0\\quad (i=1,\\ldots,p-1),\n\\\\]\nгде всё считается по модулю \\\\(p\\\\). Из второго уравнения следует рекурсия \\\\(x_{i+1}=-x_i-x_{i-1}\\\\), поэтому последовательность имеет период \\\\(3\\\\):\n\\\\[\nx_{i+3}=x_i.\n\\\\]\nЕсли \\\\(p\\\\equiv1\\\\pmod3\\\\), периодическое решение, согласованное с первым уравнением, имеет шаблон \\\\((1,1,-2)\\\\), поэтому \\\\(x_0=1\\\\). Если \\\\(p\\\\equiv2\\\\pmod3\\\\), получается шаблон \\\\((-1,2,-1)\\\\), поэтому \\\\(x_0=-1\\\\). Именно \\\\(x_0=a_0(p-1)=f(p)\\\\), что и даёт ответ.\"\n",
      "idea_ids": [
