    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "На цикле вычетов \\(\\mathbb Z/p\\mathbb Z\\) с петлёй в каждой вершине и рёбрами между соседними вычетами считаются маршруты длины \\(p-1\\) из \\(0\\) в \\(0\\). Определите это число по модулю \\(p\\), учитывая, что маршруты на прямой, возвращающиеся в \\(0\\) за \\(p-1\\) шагов, совпадают с такими маршрутами по модулю \\(p\\).",
