      "title": "Циклический сдвиг слов длины p",
      "text": "Слова из \\(p\\) ходов, кроме трёх постоянных слов, разбиваются на орбиты размера \\(p\\) по циклическому сдвигу. Поэтому по модулю \\(p\\) после \\(p\\) шагов остаётся только вклад трёх постоянных стратегий.",
