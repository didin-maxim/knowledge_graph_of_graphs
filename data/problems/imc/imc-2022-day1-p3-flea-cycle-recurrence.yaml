      "id": "idea-three-periodic-system",
      "title": "Линейная система на цикле имеет период 3",
      "text": "Если \\(x_i\\) -- число способов оказаться в вычете \\(i\\) после \\(p-1\\) шагов, то уравнения для следующего шага имеют вид \\(x_{i-1}+x_i+x_{i+1}\\). Их решение по модулю \\(p\\) задаётся периодическим шаблоном длины 3.",
