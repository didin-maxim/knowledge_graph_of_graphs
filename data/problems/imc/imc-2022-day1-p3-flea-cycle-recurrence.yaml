        "id": "stmt-original",
        "title": "Условие",
        "text": "Пусть \\(p\\) -- простое число. Блоха находится в точке \\(0\\) числовой прямой. Каждую минуту она может остаться на месте, прыгнуть на \\(1\\) влево или прыгнуть на \\(1\\) вправо. Через \\(p-1\\) минут она хочет снова оказаться в точке \\(0\\). Обозначим через \\(f(p)\\) число её стратегий сделать это. Найдите \\(f(p)\\) по модулю \\(p\\).",
