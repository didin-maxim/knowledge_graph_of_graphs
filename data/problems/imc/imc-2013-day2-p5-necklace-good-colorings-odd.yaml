        "id": "stmt-original",
        "title": "Условие",
        "text": "Рассмотрим круговое ожерелье из \\(2013\\) бусин. Каждую бусину можно покрасить в белый или зелёный цвет. Раскраска называется хорошей, если среди любых \\(21\\) последовательных бусин есть хотя бы одна зелёная. Докажите, что число хороших раскрасок нечётно. Две раскраски, которые различаются на каких-то бусинах, считаются различными даже тогда, когда одну можно получить из другой поворотом или отражением ожерелья.",
