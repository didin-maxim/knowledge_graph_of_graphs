  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Разрезание цикла и рекурсия по модулю два",
      "text": "Пусть \\(N_k\\) — число хороших линейных цепочек из \\(k\\) бусин, то есть таких бело-зелёных слов длины \\(k\\), в которых в любых \\(21\\) подряд идущих позициях есть зелёная. Для \\(0\\le k\\le20\\) все слова подходят, поэтому \\(N_k=2^k\\): \\(N_0\\) нечётно, а \\(N_1,…,N_{20}\\) чётны.\n\nПри \\(k\\ge21\\) в последних \\(21\\) позициях должна быть зелёная бусина. Пусть последняя зелёная бусина всей цепочки стоит на позиции \\(\\ell\\). Тогда \\(\\ell\\ge k-20\\), а первые \\(\\ell-1\\) бусин образуют произвольную хорошую цепочку. Выбор \\(\\ell=k,k-1,…,k-20\\) даёт рекурсию\n\\[\nN_k=N_{k-1}+N_{k-2}+\\cdots+N_{k-21}\\qquad (k\\ge21).\n\\]\nОтсюда \\(N_{21}=N_0+\\cdots+N_{20}\\) нечётно и \\(N_{22}=N_1+\\cdots+N_{21}\\) тоже нечётно. Кроме того, если заменить в правой части \\(N_{k-1}\\) через предыдущую рекурсию, то по модулю \\(2\\) все средние слагаемые удвоятся и исчезнут:\n\\[\nN_k\\equiv N_{k-22}\\pmod2.\n\\]\nСледовательно, чётность \\(N_k\\) периодична с периодом \\(22\\), и \\(N_k\\) нечётно ровно при \\(k\\equiv0\\) или \\(k\\equiv21\\pmod{22}\\).\n\nТеперь вернёмся к циклическому ожерелью. Разрежем его в фиксированном месте между двумя соседними бусинами. В получившейся цепочке пусть в начале стоит \\(x\\) белых бусин до первой зелёной, а в конце — \\(y\\) белых бусин после последней зелёной. Так как раскраска хорошая на цикле, \\(x+y\\le20\\). Между первой и последней зелёными находится хорошая линейная цепочка длины \\(2011-x-y\\), и по ней вместе с \\(x,y\\) исходная циклическая раскраска восстанавливается однозначно.\n\nПоэтому число хороших раскрасок цикла равно\n\\[\n\\sum_{x+y\\le20} N_{2011-x-y}\n= N_{2011}+2N_{2010}+3N_{2009}+\\cdots+21N_{1991}.\n\\]\nПо модулю \\(2\\) остаются только слагаемые с нечётными коэффициентами:\n\\[\nN_{2011}+N_{2009}+N_{2007}+\\cdots+N_{1991}.\n\\]\nСреди индексов \\(2011,2009,…,1991\\) ровно один, а именно \\(2001=91\\cdot22-1\\), сравним с \\(21\\) по модулю \\(22\\). Остальные не сравнимы ни с \\(0\\), ни с \\(21\\) по модулю \\(22\\), значит соответствующие \\(N_k\\) чётны. Сумма нечётна, и число хороших раскрасок ожерелья нечётно.",
