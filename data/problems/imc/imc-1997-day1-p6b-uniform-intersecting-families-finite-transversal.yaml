        "id": "stmt-original",
        "title": "Условие",
        "text": "Пусть \\(\\mathcal F\\) - семейство конечных подмножеств множества натуральных чисел \\(\\mathbb N\\). Предположим, что любые два множества из \\(\\mathcal F\\) имеют непустое пересечение и что все множества из \\(\\mathcal F\\) имеют один и тот же размер. Докажите, что существует конечное множество \\(Y\\subset\\mathbb N\\), такое что \\(A\\cap B\\cap Y\\ne\\varnothing\\) для любых \\(A,B\\in\\mathcal F\\).",
