      "id": "idea-cross-intersecting-lemma",
      "title": "Усилить задачу до двух перекрестно пересекающихся семейств",
      "text": "Вместо одного равномерного пересекающегося семейства доказывается более сильная лемма для двух семейств фиксированных размеров \\(r\\) и \\(s\\), где каждое множество первого пересекает каждое множество второго.",
