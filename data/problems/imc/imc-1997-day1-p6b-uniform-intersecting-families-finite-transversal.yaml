    {
      "id": "idea-finite-trace-partition",
      "title": "Разбить по следам на фиксированном конечном множестве",
      "text": "Фиксируем \\(A_0\\) и \\(B_0\\), кладем \\(U=A_0\\cup B_0\\) и разбиваем оба семейства по непустым следам на \\(U\\). Если следы пересекаются, одна точка из \\(U\\) уже работает; если следы не пересекаются, удаление следов уменьшает оба размера и запускает индукцию.",
