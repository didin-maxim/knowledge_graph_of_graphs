  "solutions": [
    {
      "id": "sol-cross-intersecting-induction",
      "title": "Индукция для перекрестно пересекающихся равномерных семейств",
      "text": "Докажем более сильное утверждение. Пусть \\(\\mathcal F\\) и \\(\\mathcal G\\) - два семейства конечных подмножеств \\(\\mathbb N\\), каждое множество из \\(\\mathcal F\\) имеет размер \\(r\\), каждое множество из \\(\\mathcal G\\) имеет размер \\(s\\), и для любых \\(A\\in\\mathcal F\\), \\(B\\in\\mathcal G\\) выполнено \\(A\\cap B\\ne\\varnothing\\). Тогда существует конечное множество \\(Y\\subset\\mathbb N\\), такое что \\(A\\cap B\\cap Y\\ne\\varnothing\\) для всех \\(A\\in\\mathcal F\\), \\(B\\in\\mathcal G\\). Искомая теорема получается из этого утверждения при \\(\\mathcal G=\\mathcal F\\) и \\(r=s\\).\n\nЕсли одно из семейств пусто, можно взять \\(Y=\\varnothing\\). Далее считаем оба семейства непустыми и доказываем утверждение индукцией по \\(r+s\\).\n\nБаза. Если \\(r=1\\), зафиксируем любое \\(B_0\\in\\mathcal G\\). Всякое \\(A\\in\\mathcal F\\) имеет вид \\(\\{a\\}\\) и должно пересекать \\(B_0\\), значит \\(a\\in B_0\\). Для любого \\(B\\in\\mathcal G\\) из \\(A\\cap B\\ne\\varnothing\\) следует \\(a\\in B\\). Поэтому \\(A\\cap B\\cap B_0\\ne\\varnothing\\), и подходит \\(Y=B_0\\). Случай \\(s=1\\) симметричен: фиксируем \\(A_0\\in\\mathcal F\\) и берем \\(Y=A_0\\).\n\nПусть теперь \\(r,s>1\\), и утверждение уже доказано для всех положительных пар размеров с меньшей суммой. Зафиксируем \\(A_0\\in\\mathcal F\\) и \\(B_0\\in\\mathcal G\\), положим \\(U=A_0\\cup B_0\\). Для непустых \\(C,D\\subset U\\) рассмотрим классы следов\n\\[\n\\mathcal F(C)=\\{A\\in\\mathcal F: A\\cap U=C\\},\\qquad\n\\mathcal G(D)=\\{B\\in\\mathcal G: B\\cap U=D\\}.\n\\]\nСледы каждого \\(A\\in\\mathcal F\\) и каждого \\(B\\in\\mathcal G\\) на \\(U\\) непусты, потому что \\(A\\) пересекает \\(B_0\\), а \\(B\\) пересекает \\(A_0\\). Значит, исходные семейства разбиты на конечное число таких классов.\n\nДостаточно для каждой пары следов \\(C,D\\) построить конечное множество \\(Y_{C,D}\\), пересекающее все \\(A\\cap B\\) при \\(A\\in\\mathcal F(C)\\), \\(B\\in\\mathcal G(D)\\). Тогда конечное объединение всех \\(Y_{C,D}\\) будет работать для \\(\\mathcal F\\) и \\(\\mathcal G\\).\n\nФиксируем непустые \\(C,D\\subset U\\). Если одно из семейств \\(\\mathcal F(C),\\mathcal G(D)\\) пусто, берем \\(Y_{C,D}=\\varnothing\\). Если оба непусты и \\(C\\cap D\\ne\\varnothing\\), выбираем \\(x\\in C\\cap D\\) и берем \\(Y_{C,D}=\\{x\\}\\). Тогда \\(x\\in A\\cap B\\) для всех \\(A\\in\\mathcal F(C)\\), \\(B\\in\\mathcal G(D)\\).\n\nОстается случай, когда оба класса непусты и \\(C\\cap D=\\varnothing\\). Для любых \\(A\\in\\mathcal F(C)\\), \\(B\\in\\mathcal G(D)\\) пересечение \\((A\\cap B)\\cap U\\) пусто. Но \\(A\\cap B\\ne\\varnothing\\), значит множества \\(A\\setminus C\\) и \\(B\\setminus D\\) пересекаются вне \\(U\\). Рассмотрим семейства\n\\[\n\\widetilde{\\mathcal F}(C)=\\{A\\setminus C:A\\in\\mathcal F(C)\\},\\qquad\n\\widetilde{\\mathcal G}(D)=\\{B\\setminus D:B\\in\\mathcal G(D)\\}.\n\\]\nОни снова перекрестно пересекаются. Все множества первого семейства имеют размер \\(r-|C|\\), все множества второго - размер \\(s-|D|\\). Эти размеры положительны: если бы, например, \\(A=C\\subset U\\), то из \\(A\\cap B\\ne\\varnothing\\) и \\((A\\cap B)\\cap U=C\\cap D=\\varnothing\\) получилось бы противоречие. Кроме того, сумма размеров строго меньше \\(r+s\\), так как \\(C\\) и \\(D\\) непусты.\n\nПо индукционному предположению существует конечное \\(Y_{C,D}\\), пересекающее каждое \\((A\\setminus C)\\cap(B\\setminus D)\\). Такое \\(Y_{C,D}\\) тем более пересекает каждое \\(A\\cap B\\) в рассматриваемой паре классов.\n\nМы построили конечные множества \\(Y_{C,D}\\) для всех конечного числа пар следов. Их объединение конечно и пересекает \\(A\\cap B\\) для любых \\(A\\in\\mathcal F\\), \\(B\\in\\mathcal G\\). Сильное утверждение доказано, а вместе с ним и исходная равномерная теорема.",
