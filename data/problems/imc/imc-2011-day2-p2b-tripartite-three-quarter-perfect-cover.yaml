        "id": "stmt-original-three-quarter",
        "title": "Условие, часть (b)",
        "text": "У инопланетной расы три пола: мужской, женский и эмальский. Брачная тройка состоит из трех представителей разных полов, которые все нравятся друг другу; симпатии взаимны. В экспедиции есть \\(n\\) мужчин, \\(n\\) женщин и \\(n\\) эмалей. Каждый участник симпатизирует хотя бы \\(k\\) представителям каждого из двух других полов. Докажите, что если \\(k\\ge 3n/4\\), то всегда можно создать \\(n\\) попарно непересекающихся брачных троек, то есть включить в них всех участников экспедиции.",
