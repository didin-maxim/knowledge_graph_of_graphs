  "solutions": [
    {
      "id": "sol-two-stage-hall",
      "title": "Два применения теоремы Холла",
      "text": "Работаем в графовой формулировке. Сначала докажем, что между долями \\(M\\) и \\(F\\) есть совершенное паросочетание. По теореме Холла достаточно проверить, что для любого \\(A\\subseteq M\\) его множество соседей \\(N_F(A)\\) имеет размер хотя бы \\(|A|\\). Если бы \\(|N_F(A)|<|A|\\), то, с одной стороны, из степени вершин \\(A\\) следовало бы \\(|N_F(A)|\\ge k\\). С другой стороны, любая вершина \\(f\\in F\\setminus N_F(A)\\) не соединена ни с одной вершиной из \\(A\\), поэтому ее степень в \\(M\\) не превосходит \\(n-|A|\\). Значит, \\(k\\le n-|A|\\), то есть \\(|A|\\le n-k\\). Получаем \\(k\\le |N_F(A)|<|A|\\le n-k\\), что невозможно, поскольку \\(k\\ge3n/4>n/2\\). Значит, совершенное паросочетание между \\(M\\) и \\(F\\) существует.\n\nЗафиксируем такое паросочетание и обозначим через \\(P\\) множество его \\(n\\) пар. Построим двудольный граф \\(H\\) с долями \\(P\\) и \\(E\\): пару \\(p=(m,f)\\) соединяем с вершиной \\(e\\in E\\), если в исходном графе есть оба ребра \\(em\\) и \\(ef\\). Совершенное паросочетание в \\(H\\) превратит каждую пару \\((m,f)\\) в треугольник \\((m,f,e)\\), а все выбранные вершины \\(e\\) будут различны. Поэтому осталось снова проверить условие Холла.\n\nПусть \\(A\\subseteq P\\), \\(|A|=l\\), а \\(B=N_H(A)\\subseteq E\\). Предположим противное: \\(|B|<l\\). Каждая пара \\((m,f)\\) имеет в \\(H\\) не меньше\n\\[\n|N_E(m)\\cap N_E(f)|\\ge k+k-n=2k-n\n\\]\nсоседей, поэтому \\(|B|\\ge2k-n\\), и значит \\(l>2k-n\\).\n\nВозьмем вершину \\(e\\in E\\setminus B\\). Для каждой пары из \\(A\\) вершина \\(e\\) не может быть соединена сразу с обоими ее концами, иначе она лежала бы в \\(B\\). Значит, по этим \\(l\\) парам она дает не более \\(l\\) ребер к \\(M\\cup F\\). По остальным \\(n-l\\) парам она дает не более \\(2(n-l)\\) ребер. Следовательно,\n\\[\nd_M(e)+d_F(e)\\le l+2(n-l)=2n-l.\n\\]\nНо по условию \\(d_M(e)+d_F(e)\\ge2k\\), откуда \\(l\\le2n-2k\\).\n\nИтак, из нарушения Холла следовало бы\n\\[\n2k-n<l\\le2n-2k.\n\\]\nПри \\(k\\ge3n/4\\) левая граница не меньше правой: \\(2k-n\\ge2n-2k\\). Противоречие. Следовательно, в \\(H\\) выполнено условие Холла, значит, существует совершенное паросочетание между \\(P\\) и \\(E\\).\n\nОбъединяя каждую пару \\((m,f)\\in P\\) с назначенной ей вершиной \\(e\\in E\\), получаем \\(n\\) попарно непересекающихся треугольников, покрывающих все вершины трех долей. В исходном языке это и есть \\(n\\) брачных троек, включающих всех участников.",
