  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Билинейная форма над \\(\\mathbb F_2\\)",
      "text": "Обозначим через \\(e_k\\) стандартный базисный столбец, а через \\(u\\) столбец, все элементы которого равны \\(1\\). \\(k\\)-й столбец матрицы \\(A^n\\) равен \\(A^n e_k\\), поэтому надо доказать, что \\(A^n e_k\\ne u\\) для всех \\(k\\) и \\(n\\ge1\\).\n\nВведём над \\(\\mathbb F_2^m\\) билинейную форму\n\\[\n(x,y)=x^Ty=x_1y_1+\\cdots+x_my_m.\n\\]\nДля любого \\(x\\) верно \\((x,x)=(x,u)\\), потому что в поле \\(\\mathbb F_2\\) имеем \\(x_i^2=x_i\\). Кроме того, для любого \\(w\\)\n\\[\n(w,Aw)=w^TAw=0.\n\\]\nДействительно, диагональные слагаемые равны нулю из-за нулевой диагонали \\(A\\), а внедиагональные слагаемые \\(a_{ij}w_iw_j\\) и \\(a_{ji}w_jw_i\\) попарно совпадают и в сумме дают \\(0\\) по модулю \\(2\\).\n\nДокажем лемму: если для некоторого вектора \\(v\\) и некоторого \\(n\\ge1\\) выполнено \\(A^n v=u\\), то \\((v,v)=0\\). Индукция идёт по \\(n\\). Если \\(n=2r+1\\) нечётно, положим \\(w=A^r v\\). Тогда\n\\[\n(v,v)=(v,u)=(v,A^n v)=(A^r v,A^{r+1}v)=(w,Aw)=0.\n\\]\nЕсли \\(n=2r\\) чётно, положим \\(w=A^r v\\). Из \\(A^r w=A^n v=u\\) и индукционного предположения для меньшей степени \\(r\\) получаем \\((w,w)=0\\). Поэтому\n\\[\n(v,v)=(v,u)=(v,A^n v)=(A^r v,A^r v)=(w,w)=0.\n\\]\nЛемма доказана.\n\nТеперь предположим противное: некоторый столбец \\(A^n\\) состоит из одних единиц. Тогда для некоторого \\(k\\) имеем \\(A^n e_k=u\\). По лемме \\((e_k,e_k)=0\\). Но \\((e_k,e_k)=1\\), противоречие. Значит, каждый столбец каждой положительной степени \\(A\\) имеет хотя бы один нулевой элемент.",
      "idea_ids": [
        "idea-f2-form-kills-aw",
        "idea-all-ones-implies-isotropic"
      ],
