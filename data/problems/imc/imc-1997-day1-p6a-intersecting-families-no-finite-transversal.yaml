        "title": "Контрпример для конечного трансверсаля пересечений",
        "text": "Постройте гиперграф \\(\\mathcal H\\) на множестве вершин \\(\\mathbb N\\), все рёбра которого конечны и попарно пересекаются, но для которого никакое конечное множество вершин \\(Y\\) не пересекает все множества вида \\(E\\cap E'\\), где \\(E,E'\\) — рёбра \\(\\mathcal H\\).",
