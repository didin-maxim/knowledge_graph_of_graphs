  "ideas": [
    {
      "id": "idea-distance-multiset",
      "title": "В дереве ровно \\(n-1\\) пар на расстоянии 1",
      "text": "Первые \\(n-1\\) расстояний между парами вершин равны \\(1\\), остальные не меньше \\(2\\). После этого задача сводится к неравенству для положительных чисел.",
      "tags": [
