  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Сведение к набору попарных расстояний",
      "text": "Упорядочим все расстояния между неупорядоченными парами вершин:\n\\[\nx_1\\le x_2\\le\\cdots\\le x_K,\\qquad K=\\binom n2.\n\\]\nВ дереве ровно \\(n-1\\) рёбер, значит ровно \\(n-1\\) пар вершин находятся на расстоянии \\(1\\). Поэтому\n\\[\nx_1=\\cdots=x_{n-1}=1,\n\\]\nа все остальные расстояния не меньше \\(2\\).\n\nЗапишем произведение:\n\\[\nW(T)H(T)=\\left(n-1+\\sum_{i=n}^{K}x_i\\right)\n\\left(n-1+\\sum_{i=n}^{K}\\frac1{x_i}\\right).\n\\]\nПосле раскрытия скобок получаем\n\\[\n(n-1)^2+(n-1)\\sum_{i=n}^{K}\\left(x_i+\\frac1{x_i}\\right)\n+\\left(\\sum_{i=n}^{K}x_i\\right)\\left(\\sum_{i=n}^{K}\\frac1{x_i}\\right).\n\\]\n\nПо неравенству Коши\n\\[\n\\left(\\sum_{i=n}^{K}x_i\\right)\\left(\\sum_{i=n}^{K}\\frac1{x_i}\\right)\\ge (K-n+1)^2.\n\\]\nЗдесь\n\\[\nK-n+1=\\binom n2-n+1=\\frac{(n-1)(n-2)}2.\n\\]\nКроме того, для каждого оставшегося расстояния \\(x_i\\ge2\\), а функция \\(x+1/x\\) возрастает при \\(x\\ge1\\). Следовательно\n\\[\nx_i+\\frac1{x_i}\\ge2+\\frac12=\\frac52.\n\\]\nПодставляем эти две оценки:\n\\[\nW(T)H(T)\\ge (n-1)^2+(n-1)\\frac52\\cdot\\frac{(n-1)(n-2)}2+\n\\left(\\frac{(n-1)(n-2)}2\\right)^2.\n\\]\nПриведение подобных членов даёт\n\\[\nW(T)H(T)\\ge\\frac{(n-1)^3(n+2)}4.\n\\]\n\nРавенство достигается, когда все неединичные расстояния равны \\(2\\). Это означает, что любые две несмежные вершины имеют общего центр-соседа, то есть дерево является звездой \\(S_n\\). Для звезды действительно есть \\(n-1\\) пар на расстоянии \\(1\\) и \\((n-1)(n-2)/2\\) пар на расстоянии \\(2\\), поэтому нижняя граница точна.\"\n",
      "idea_ids": [
