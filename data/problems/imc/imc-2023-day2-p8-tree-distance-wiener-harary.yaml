        "id": "stmt-original",
        "title": "Условие",
        "text": "Пусть \\(T\\) -- дерево с \\(n\\) вершинами, то есть связный простой граф без циклов. Для каждой пары вершин \\(u,v\\) обозначим через \\(d(u,v)\\) расстояние между ними, то есть число рёбер в кратчайшем пути, соединяющем \\(u\\) и \\(v\\). Рассмотрим суммы \\(W(T)=\\sum_{\\{u,v\\}\\subseteq V(T),u\\ne v}d(u,v)\\) и \\(H(T)=\\sum_{\\{u,v\\}\\subseteq V(T),u\\ne v}1/d(u,v)\\). Докажите, что \\(W(T)H(T)\\ge (n-1)^3(n+2)/4\\).",
        "source_id": "src-imc-2023-day2-p8-official",
        "status": "ai_checked",
