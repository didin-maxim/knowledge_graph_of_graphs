        "title": "Условие",
        "text": "Все стороны и диагонали правильного \\(43\\)-угольника \\(P\\) окрашены в красный или синий цвет так, что из каждой вершины выходит \\(20\\) красных и \\(22\\) синих отрезка. Треугольник с вершинами в вершинах \\(P\\) называется одноцветным, если все его стороны одного цвета. Известно, что синих одноцветных треугольников \\(2022\\). Сколько красных одноцветных треугольников?",
