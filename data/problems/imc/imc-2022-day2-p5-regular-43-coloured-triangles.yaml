  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Двойной счёт пар рёбер с общей вершиной",
      "text": "Будем рассматривать данный рисунок как полную графовую раскраску \\(K_{43}\\). Назовём вишней пару различных рёбер с общей вершиной. Вишня бывает одноцветной или разноцветной.\n\nПусть \\(M\\) -- число одноцветных вишен во всём графе, а \\(P\\) -- число разноцветных. Рассмотрим величину \\(2M-P\\) по треугольникам. Каждая вишня входит ровно в один треугольник: если рёбра имеют общий центр \\(v\\) и другие концы \\(a,b\\), то это треугольник \\(a,b,v\\).\n\nЕсли треугольник одноцветный, то все три его вишни одноцветны, и он даёт вклад \\(2\\cdot3=6\\). Если треугольник не одноцветный, то в двухцветной раскраске его рёбер есть две стороны одного цвета и одна другого; значит, ровно одна вишня одноцветна и две разноцветны. Его вклад равен \\(2\\cdot1-2=0\\). Поэтому\n\\[\n2M-P=6T,\n\\]\nгде \\(T\\) -- общее число одноцветных треугольников.\n\nТеперь посчитаем ту же величину по центрам вишен. В каждой вершине выходит \\(20\\) красных и \\(22\\) синих рёбер. Поэтому число одноцветных вишен с данным центром равно\n\\[\n\\binom{20}{2}+\\binom{22}{2}=190+231=421,\n\\]\nа число разноцветных вишен с данным центром равно \\(20\\cdot22=440\\). Вклад одной вершины в \\(2M-P\\) равен\n\\[\n2\\cdot421-440=402.\n\\]\nВершин \\(43\\), значит\n\\[\n2M-P=43\\cdot402.\n\\]\nСледовательно,\n\\[\nT=\\frac{43\\cdot402}{6}=43\\cdot67=2881.\n\\]\nИз них \\(2022\\) треугольника синие, поэтому красных одноцветных треугольников\n\\[\n2881-2022=859.\n\\]\"\n",
      "idea_ids": [
        "idea-cherries-contribution"
      ],
