      "id": "idea-cherries-contribution",
      "title": "Вишни отличают одноцветные треугольники",
      "text": "Пара рёбер с общей вершиной даёт вклад в подсчёт. Для одноцветного треугольника три такие пары одноцветны, а для неодноцветного ровно одна одноцветна и две разноцветны.",
