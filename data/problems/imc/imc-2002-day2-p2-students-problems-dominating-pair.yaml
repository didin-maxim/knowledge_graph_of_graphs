  "ideas": [
    {
      "id": "idea-count-bad-student-pairs",
      "title": "Считать пары, которые не покрывают задачу",
      "text": "Для фиксированной задачи оба студента не решили ее только если они оба лежат среди не более чем \\(80\\) нерешивших. Таких пар не больше \\(\\binom{80}{2}\\). Для шести задач этого меньше, чем общее число пар студентов.",
