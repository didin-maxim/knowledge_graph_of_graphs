  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Подсчет плохих пар",
      "text": "Назовем пару студентов плохой для некоторой задачи, если ни один из этих двух студентов эту задачу не решил. Если найдется пара, которая не является плохой ни для одной из шести задач, то она и требуется.\n\nВсего пар студентов равно \\(\\binom{200}{2}=19900\\). Зафиксируем одну задачу. Ее решили не менее \\(120\\) студентов, значит не решили ее не более \\(80\\) студентов. Поэтому пар, плохих для этой задачи, не больше \\(\\binom{80}{2}=3160\\). Для всех шести задач суммарное число инцидентностей вида «пара студентов плоха для задачи» не превосходит \\(6\\cdot3160=18960\\).\n\nЕсли бы каждая пара студентов не покрывала все задачи, то каждая из \\(19900\\) пар была бы плохой хотя бы для одной задачи, и таких инцидентностей было бы не меньше \\(19900\\). Это невозможно, поскольку \\(18960<19900\\). Следовательно, существует пара студентов, которая для каждой задачи содержит хотя бы одного решившего ее участника. Более того, подсчет показывает, что таких пар как минимум \\(19900-18960=940\\).",
      "idea_ids": [
        "idea-count-bad-student-pairs"
      ],
