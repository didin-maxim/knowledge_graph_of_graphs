                      {
                          "id":  "sol-official-two-path-posets",
      "title":  "Линейные продолжения двух путей и поправка Фибоначчи",
                          "text":  "Ответ: \\(2^n-F_{n+1}\\), где \\(F_1=F_2=1\\) и \\(F_{m+1}=F_m+F_{m-1}\\).\n\nОбозначим первую стопку буквой \\(A\\), вторую — буквой \\(B\\). Для удобства временно разрешим одной из стопок быть пустой. Множество получаемых перестановок от этого не изменится. Действительно, возрастающий порядок \\(1,2,\\ldots,n\\), получающийся при пустой стопке \\(B\\), получается и при \\(B=\\{2\\}\\), \\(A=\\{1,3,4,\\ldots,n\\}\\); убывающий порядок получается при \\(A=\\{n\\}\\), \\(B=\\{1,2,\\ldots,n-1\\}\\). Это верно и при \\(n=2\\).\n\nДля каждого разбиения запишем слово источников: на месте каждой вынутой карты ставим \\(A\\) или \\(B\\). Оно чередуется как \\(ABAB\\ldots\\), пока одна стопка не закончится, а затем состоит только из одной буквы. Пусть \\(S=ABAB\\ldots\\) — чередующееся слово длины \\(n\\). Разобьём все возможные слова на классы по первому месту \\(i\\), на котором слово отличается от \\(S\\); если отличия нет, положим \\(i=n+1\\). Пусть \\(\\mathcal B_i\\) — множество перестановок, совместимых со словом класса \\(i\\).\n\nЕсли \\(i=2h+1\\) нечётно, слово имеет вид \\((AB)^hB^{n-2h}\\): первая стопка содержит \\(h\\) карт. Если \\(i=2h+2\\) чётно, слово имеет вид \\((AB)^hA^{n-2h}\\): вторая стопка содержит \\(h\\) карт. Слово с индексом \\(n+1\\) является самим \\(S\\).\n\nЗафиксируем такое слово. Проведём между его позициями стрелки, заставляющие значения на позициях \\(A\\) возрастать слева направо, а значения на позициях \\(B\\) убывать слева направо. Получается объединение двух ориентированных путей. Перестановка совместима со словом тогда и только тогда, когда она является линейным продолжением заданного этими путями частичного порядка. В частности, для нечётного \\(i=2h+1\\) достаточно выбрать \\(h\\) значений первой стопки, а для чётного \\(i=2h+2\\) — \\(h\\) значений второй, поэтому в обоих случаях\n\\[\n|\\mathcal B_i|=\\binom nh.\n\\]\nТа же интерпретация действует для \\(i=n+1\\). Каждое из \\(2^n\\) подмножеств карт, выбранных в первую стопку, задаёт ровно одно слово и ровно одну совместимую перестановку, так что\n\\[\n\\sum_{i=1}^{n+1}|\\mathcal B_i|=2^n.\n\\]\nВ этой сумме одинаковая итоговая перестановка могла быть посчитана несколько раз; найдём все пересечения классов.\n\nПусть \\(i\u003cj\\le n\\). Если \\(j-i\\) нечётно, то хвосты соответствующих слов состоят из разных букв. Поэтому значения в последних двух позициях должны одновременно возрастать и убывать, что невозможно. Если \\(j-i\u003e2\\) чётно, рассмотрим позиции \\(i\\) и \\(i+2\\). В слове класса \\(i\\) они лежат в одном постоянном хвосте, а в слове класса \\(j\\) — в одной чередующейся подпоследовательности; требуемые порядки значений противоположны. Значит, пересечение снова пусто. Тот же довод с концом чередующегося слова показывает, что \\(\\mathcal B_{n+1}\\) может пересекаться лишь с \\(\\mathcal B_{n-1}\\) и \\(\\mathcal B_n\\).\n\nИтак, обычные пересечения имеют вид\n\\[\n\\mathcal D_i=\\mathcal B_i\\cap\\mathcal B_{i+2},\\qquad 1\\le i\\le n-1,\n\\]\nи остаётся граничное пересечение \\(\\mathcal B_n\\cap\\mathcal B_{n+1}\\). Посчитаем \\(\\mathcal D_i\\), объединив ограничения двух пар ориентированных путей.\n\nПусть \\(i=2h+1\\). В объединённом частичном порядке после двух свободно перемешиваемых цепей идёт общая цепь. Первая свободная цепь состоит из позиций\n\\[\n1\u003c3\u003c\\cdots\u003c2h-1,\n\\]\nа вторая — из позиций\n\\[\nn\u003cn-1\u003c\\cdots\u003c2h+2.\n\\]\nОбе должны предшествовать общей цепи\n\\[\n2h+1\u003c2h\u003c2h-2\u003c\\cdots\u003c2.\n\\]\nЗдесь знак \\(\u003c\\) означает, что значение в левой позиции должно быть меньше значения в правой. Поэтому свобода состоит ровно в перемешивании цепей длин \\(h\\) и \\(n-2h-1\\), откуда\n\\[\n|\\mathcal D_{2h+1}|=\\binom{n-1-h}{h}.\n\\]\n\nПусть теперь \\(i=2h+2\\). На этот раз общая начальная цепь заканчивается позицией \\(2h+2\\), после чего независимо перемешиваются цепи\n\\[\n2h\u003c2h-2\u003c\\cdots\u003c2\n\\]\nи\n\\[\n2h+3\u003c2h+4\u003c\\cdots\u003cn.\n\\]\nИх длины равны \\(h\\) и \\(n-2h-2\\), поэтому\n\\[\n|\\mathcal D_{2h+2}|=\\binom{n-2-h}{h}.\n\\]\nЭти рассуждения включают пересечение \\(\\mathcal B_{n-1}\\cap\\mathcal B_{n+1}\\).\n\nМножества \\(\\mathcal D_i\\) попарно не пересекаются: если бы перестановка принадлежала \\(\\mathcal D_i\\) и \\(\\mathcal D_j\\) при \\(i\u003cj\\), то она принадлежала бы одновременно \\(\\mathcal B_i\\) и \\(\\mathcal B_{j+2}\\), а разность индексов была бы хотя бы 3; один из двух уже разобранных конфликтов порядка дал бы противоречие. Прямой просмотр последних двух классов показывает, что\n\\[\n\\mathcal B_n\\cap\\mathcal B_{n+1}\n\\]\nсостоит из единственной перестановки\n\\[\n1,n,2,n-1,3,n-2,\\ldots.\n\\]\nОна не входит ни в одно \\(\\mathcal D_i\\): объединение ограничений последних двух слов задаёт полный порядок позиций, а добавление ограничений класса \\(n-1\\) даёт противоположное сравнение. Следовательно, тройных пересечений нет, и из суммы размеров классов надо вычесть размеры всех \\(\\mathcal D_i\\) и ещё 1.\n\nОсталось сложить биномиальные коэффициенты. Стандартное тождество\n\\[\nF_m=\\sum_{h=0}^{\\lfloor(m-1)/2\\rfloor}\\binom{m-1-h}{h}\n\\]\nследует, например, из подсчёта разбиений отрезка длины \\(m-1\\) на шаги длины 1 и 2 по числу двойных шагов. Для нечётных индексов \\(i=2h+1\\le n-1\\) сумма размеров \\(\\mathcal D_i\\) равна \\(F_n\\), если \\(n\\) чётно, и \\(F_n-1\\), если \\(n\\) нечётно: во втором случае отсутствует последний член, равный 1. Для чётных индексов она равна \\(F_{n-1}-1\\), если \\(n\\) чётно, и \\(F_{n-1}\\), если \\(n\\) нечётно. В обоих случаях\n\\[\n\\sum_{i=1}^{n-1}|\\mathcal D_i|=F_n+F_{n-1}-1=F_{n+1}-1.\n\\]\nИтак, число различных итоговых перестановок равно\n\\[\n2^n-(F_{n+1}-1)-1=2^n-F_{n+1}.\n\\]\n",
