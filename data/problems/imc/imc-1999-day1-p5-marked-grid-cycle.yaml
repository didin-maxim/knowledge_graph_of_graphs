        "text": "В таблице \\(n\\times n\\) отмечены \\(2n\\) точек. Докажите, что для некоторого \\(k>1\\) можно выбрать \\(2k\\) различных отмеченных точек \\(a_1,a_2,\\ldots,a_{2k}\\) так, что \\(a_1\\) и \\(a_2\\) лежат в одной строке, \\(a_2\\) и \\(a_3\\) - в одном столбце, \\(a_3\\) и \\(a_4\\) - в одной строке, и так далее, \\(a_{2k-1}\\) и \\(a_{2k}\\) лежат в одной строке, а \\(a_{2k}\\) и \\(a_1\\) - в одном столбце.",
