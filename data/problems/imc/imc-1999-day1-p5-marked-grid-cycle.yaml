  "solutions": [
    {
      "id": "sol-official-graph",
      "title": "Двудольный граф строк и столбцов",
      "text": "Рассмотрим граф \\(G\\). Его вершинами являются все \\(n\\) строк и все \\(n\\) столбцов таблицы. Для каждой отмеченной точки в строке \\(r\\) и столбце \\(c\\) проведем ребро между вершинами \\(r\\) и \\(c\\). Получается двудольный граф с \\(2n\\) вершинами и \\(2n\\) ребрами.\n\nЕсли граф без циклов имеет \\(N\\) вершин, то он содержит не более \\(N-1\\) ребра: каждая его компонента является деревом или изолированной вершиной, и сумма по компонентам дает эту оценку. В нашем случае ребер столько же, сколько вершин, то есть \\(2n\\), поэтому \\(G\\) обязан содержать цикл.\n\nТак как граф двудольный, любой его цикл имеет четную длину и попеременно проходит через вершины-строки и вершины-столбцы. Пусть цикл имеет вид \\(r_1,c_1,r_2,c_2,\\ldots,r_k,c_k,r_1\\). Каждое соседство \\(r_i c_i\\) и \\(c_i r_{i+1}\\) соответствует отмеченной точке таблицы. Взяв эти точки по порядку, получаем \\(2k\\) различных отмеченных точек, у которых соседние пары попеременно лежат то в одной строке, то в одном столбце, а последняя точка замыкается с первой. Поскольку простой цикл в двудольном графе имеет длину хотя бы 4, получаем \\(k>1\\).",
