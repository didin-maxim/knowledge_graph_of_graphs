      "id": "idea-row-column-bipartite-cycle",
      "title": "Строки и столбцы как вершины",
      "text": "Отмеченная точка становится ребром между своей строкой и своим столбцом. Если бы цикла не было, граф был бы лесом и имел бы не больше \\(2n-1\\) ребра, что противоречит наличию \\(2n\\) отмеченных точек.",
