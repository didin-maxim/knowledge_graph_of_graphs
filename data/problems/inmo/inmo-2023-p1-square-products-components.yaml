        "id": "stmt-original",
        "title": "Официальное условие",
        "text": "Пусть \\(S\\) — конечное множество положительных целых чисел. Предположим, что существует ровно \\(2023\\) упорядоченных пар \\((x,y)\\in S\\times S\\), для которых произведение \\(xy\\) является полным квадратом. Докажите, что можно найти по крайней мере четыре различных элемента множества \\(S\\), у которых произведение любых двух из них не является полным квадратом.\n\nНапример, если \\(S=\\{1,2,4\\}\\), то таких упорядоченных пар ровно пять: \\((1,1),(1,4),(2,2),(4,1),(4,4)\\).",
        "source_id": "src-inmo-2023-official-problems",
