  "ideas": [
    {
      "id": "idea-square-product-transitivity",
      "title": "Связность превращается в смежность",
      "text": "Если \\(x=a_1,a_2,\n\\ldots,a_t=y\\) — путь, и каждое произведение \\(a_i a_{i+1}\\) является квадратом, то \\(xy\\) тоже квадрат, потому что промежуточные множители входят в произведение дважды.",
      "tags": [
        "graph_model"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-component-square-count",
      "title": "Компоненты дают сумму квадратов",
      "text": "Внутри одной компоненты любые две вершины дают квадратное произведение, а из разных компонент — не дают. Поэтому число упорядоченных пар с квадратным произведением равно сумме квадратов размеров компонент.",
      "tags": [
        "double_counting"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-mod-8-three-squares",
      "title": "Три квадрата не дают 2023",
      "text": "Квадрат по модулю \\(8\\) равен \\(0\\), \\(1\\) или \\(4\\). Сумма трёх таких остатков не может быть равна \\(7\\), тогда как \\(2023\\equiv7\\pmod8\\).",
      "tags": [
        "goal_impossibility"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-official-graph-components",
      "title": "Решение через граф квадратных произведений",
      "text": "Построим граф \\(G\\), вершинами которого являются элементы множества \\(S\\). Две различные вершины \\(x\\) и \\(y\\) соединяем ребром тогда и только тогда, когда \\(xy\\) является полным квадратом.\n\nДокажем, что каждая компонента связности графа \\(G\\) является кликой. Возьмём две вершины \\(x\\) и \\(y\\) из одной компоненты. Между ними есть путь\n\\[\nx=a_1,a_2,\n\\ldots,a_{t-1},a_t=y,\n\\]\nто есть каждое произведение \\(a_i a_{i+1}\\) является полным квадратом. Тогда\n\\[\nxy=a_1a_t=\\frac{(a_1a_2)(a_2a_3)\n\\cdots(a_{t-1}a_t)}{a_2^2a_3^2\n\\cdots a_{t-1}^2}\n\\]\nтоже является полным квадратом: в числителе стоит произведение квадратов, а знаменатель сам является квадратом. Значит, \\(x\\) и \\(y\\) соединены ребром. Поэтому любые две вершины одной компоненты смежны, и компонента действительно является кликой.\n\nПусть размеры компонент равны \\(a_1,a_2,\n\\ldots,a_m\\). Так как компоненты — клики, две вершины \\(x,y\\) дают квадратное произведение \\(xy\\) тогда и только тогда, когда они лежат в одной компоненте. Упорядоченных пар внутри компоненты размера \\(a_i\\) ровно \\(a_i^2\\), включая пары \\((x,x)\\). По условию\n\\[\na_1^2+a_2^2+\n\\cdots+a_m^2=2023.\n\\]\n\nПредположим, что компонент не больше трёх. Добавив при необходимости нулевые размеры, получаем представление\n\\[\na^2+b^2+c^2=2023\n\\]\nнеотрицательными целыми числами. Но квадрат по модулю \\(8\\) может иметь только остаток \\(0\\), \\(1\\) или \\(4\\). Сумма трёх чисел из \\(\\{0,1,4\\}\\) не сравнима с \\(7\\) по модулю \\(8\\), а \\(2023\\equiv7\\pmod8\\). Противоречие.\n\nЗначит, компонент связности как минимум четыре. Выберем по одному элементу из четырёх разных компонент. Между элементами из разных компонент нет ребра, то есть произведение любых двух выбранных элементов не является полным квадратом. Это и требовалось доказать.",
