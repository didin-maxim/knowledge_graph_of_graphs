        "title": "Официальное условие",
        "text": "Фокусник и Детектив играют в игру. Фокусник кладёт на стол лицом вниз карты, пронумерованные числами от \\(1\\) до \\(52\\). За один ход Детектив может указать на две карты и спросить, стоят ли написанные на них числа рядом. Фокусник отвечает правдиво. После конечного числа ходов Детектив указывает на две карты. Она выигрывает, если числа на этих двух картах соседние, и проигрывает иначе.\n\nДокажите, что Детектив может гарантировать победу тогда и только тогда, когда ей разрешено задать не менее \\(50\\) вопросов.",
