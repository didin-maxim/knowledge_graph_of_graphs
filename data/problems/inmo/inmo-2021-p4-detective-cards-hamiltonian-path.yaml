  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Решение через удаление рёбер из полного графа",
      "text": "Сначала покажем, что \\(50\\) вопросов достаточно. Детектив выбирает карту \\(A\\) и спрашивает, соседнее ли число на ней с числом на каждой из \\(50\\) других карт, оставляя непроверенной только одну карту \\(B\\). Если на каком-то вопросе Фокусник отвечает «да», Детектив сразу указывает найденную пару. Если все \\(50\\) ответов были «нет», то карта \\(B\\) обязана быть соседней с \\(A\\): у числа на карте \\(A\\) среди чисел \\(1,2,\\ldots,52\\) есть хотя бы один сосед, и все карты, кроме \\(B\\), уже проверены и не подходят.\n\nДокажем, что \\(49\\) вопросов недостаточно. Рассмотрим более общий случай с \\(N>3\\) картами. Построим граф на картах. Сначала это полный граф \\(K_N\\). Каждый вопрос, на который Фокусник хочет ответить «нет», удаляет ребро между двумя спрошенными картами. Если после не более чем \\(N-2\\) вопросов в оставшемся графе есть гамильтонов путь, то Фокусник нумерует карты вдоль этого пути числами \\(1,2,\\ldots,N\\). Тогда карты с соседними номерами соединены ребром пути, то есть такая пара раньше не спрашивалась; все ответы «нет» правдивы.\n\nОсталось доказать лемму: удаление не более \\(N-2\\) рёбер из \\(K_N\\) оставляет граф с гамильтоновым путём. Возьмём любые две вершины \\(a,b\\). Так как удалено не более \\(N-2\\) рёбер, имеем \\(\\deg a+\\deg b\\ge 2(N-1)-(N-2)=N\\). Поэтому у \\(a\\) и \\(b\\) есть общий сосед; иначе сумма их степеней была бы не больше \\(N-1\\). В частности, граф связен.\n\nПусть \\(P:u=u_0,u_1,\\ldots,u_k=v\\) — длиннейший простой путь. Все соседи концов \\(u\\) и \\(v\\) лежат на \\(P\\), иначе путь можно продлить. Запишем соседей \\(u\\) как \\(u_{i_1},\\ldots,u_{i_x}\\), а соседей \\(v\\) как \\(u_{j_1},\\ldots,u_{j_y}\\). Из \\(x+y=\\deg u+\\deg v\\ge N\\) следует, что найдётся индекс \\(i\\), для которого есть оба ребра \\(u u_{i+1}\\) и \\(u_i v\\). Иначе индексы соседей \\(u\\) и индексы, следующие за соседями \\(v\\), не пересекались бы и не поместились бы на пути.\n\nЭти два ребра замыкают все вершины пути \\(P\\) в цикл. Если бы существовала вершина \\(w\\), не лежащая на \\(P\\), то по связности из \\(w\\) был бы путь к этому циклу; пройдя от \\(w\\) до цикла, а затем почти весь цикл, мы получили бы простой путь длиннее \\(P\\). Противоречие. Значит, \\(P\\) содержит все \\(N\\) вершин.\n\nДля исходной задачи \\(N=52\\). После \\(49\\) вопросов удалено не более \\(49<N-2\\) рёбер, поэтому Фокусник мог правдиво отвечать «нет» на все вопросы. Детектив не может гарантировать выигрыш за \\(49\\) вопросов, а за \\(50\\) может. Ответ: \\(50\\).",
