  "solutions": [
    {
      "id": "sol-kedlaya-euler-induction",
      "title": "Оценка через степени границы и индукцию",
      "text": "Занумеруем вершины исходного \\(n\\)-угольника по порядку: \\(v_1,\n\\ldots,v_n\\). Пусть \\(a_i\\) - степень \\(v_i\\) в графе триангуляции, то есть число ребер триангуляции, выходящих из этой вершины. Очевидно, \\(a_i\\ge2\\).\n\nВыведем ключевую оценку\n\\[\na_1+\\cdots+a_n\\le 4n-6. \\tag{1}\n\\]\nПусть \\(V,E,F\\) - соответственно число вершин, ребер и треугольных граней. Для диска эйлерова формула имеет вид \\(V-E+F=1\\) (эквивалентно, если добавить внешнюю грань, \\(V-E+(F+1)=2\\)). Суммируя стороны треугольников, получаем \\(3F=2E-n\\), потому что внутренние ребра считаются дважды, а \\(n\\) граничных ребер - один раз. Наконец, сумма степеней всех вершин равна \\(2E\\); внутренние вершины имеют степень не меньше 6, поэтому\n\\[\na_1+\\cdots+a_n+6(V-n)\\le 2E.\n\\]\nПодставляя \\(V=1+E-F\\), получаем\n\\[\na_1+\\cdots+a_n\\le 2E-6(V-n)=2E-6(1+E-F-n)=6n-6-4E+6F.\n\\]\nИз \\(3F=2E-n\\) следует \\(6F=4E-2n\\), и выходит ровно (1).\n\nТеперь зададим явную верхнюю оценку рекурсией: \\(A_3=1\\), а при \\(n\\ge4\\) положим \\(A_n=A_{n-1}+2n-3\\). Докажем по индукции, что всякая допустимая триангуляция \\(n\\)-угольника имеет не больше \\(A_n\\) треугольников.\n\nПри \\(n=3\\) из (1) и \\(a_i\\ge2\\) следует \\(a_1=a_2=a_3=2\\), значит, триангуляция состоит из одного треугольника. Пусть \\(n\\ge4\\). Если для некоторой граничной вершины \\(a_i=2\\), то эта вершина входит только в один треугольник. Удалив этот треугольник, получаем допустимую триангуляцию \\((n-1)\\)-угольника; следовательно, исходных треугольников не больше \\(A_{n-1}+1\\le A_n\\).\n\nОстается случай, когда все \\(a_i\\ge3\\). Из (1) среднее значение \\(a_i\\) меньше 4, значит, вершин степени 3 больше, чем вершин степени хотя бы 5. Поэтому на циклической границе найдется цепочка последовательных вершин со степенями\n\\[\n3,4,4,\\ldots,4,3\n\\]\nдлины \\(k\\), где \\(2\\le k\\le n-1\\). Удалим все треугольники, содержащие хотя бы одну вершину этой цепочки. Их не больше \\(2k-1\\): две концевые вершины степени 3 и промежуточные степени 4 образуют вдоль границы веерную полосу. После удаления остается допустимая триангуляция \\((n-1)\\)-угольника. По индукции число оставшихся треугольников не больше \\(A_{n-1}\\), значит, всего было не больше\n\\[\nA_{n-1}+2k-1\\le A_{n-1}+2n-3=A_n.\n\\]\nТакое \\(A_n\\) и можно взять в качестве \\(M_n\\).",
