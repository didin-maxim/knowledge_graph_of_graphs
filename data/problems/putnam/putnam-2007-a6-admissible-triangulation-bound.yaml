  "solutions": [
    {
      "id": "sol-kedlaya-euler-induction",
      "title": "Оценка через степени границы и индукцию",
      "text": "Занумеруем вершины исходного \\(n\\)-угольника по порядку: \\(v_1,\\ldots,v_n\\). Пусть \\(a_i\\) - степень \\(v_i\\) в графе триангуляции, то есть число ребер триангуляции, выходящих из этой вершины. Очевидно, \\(a_i\\ge2\\).\n\nВыведем ключевую оценку\n\\[\na_1+\\cdots+a_n\\le 4n-6. \\tag{1}\n\\]\nПусть \\(V,E,F\\) - соответственно число вершин, ребер и треугольных граней. Для диска эйлерова формула имеет вид \\(V-E+F=1\\) (эквивалентно, если добавить внешнюю грань, \\(V-E+(F+1)=2\\)). Суммируя стороны треугольников, получаем \\(3F=2E-n\\), потому что внутренние ребра считаются дважды, а \\(n\\) граничных ребер - один раз. Наконец, сумма степеней всех вершин равна \\(2E\\); внутренние вершины имеют степень не меньше 6, поэтому\n\\[\na_1+\\cdots+a_n+6(V-n)\\le 2E.\n\\]\nПодставляя \\(V=1+E-F\\), получаем\n\\[\na_1+\\cdots+a_n\\le 2E-6(V-n)=2E-6(1+E-F-n)=6n-6-4E+6F.\n\\]\nИз \\(3F=2E-n\\) следует \\(6F=4E-2n\\), и выходит ровно (1).\n\nТеперь зададим явную верхнюю оценку рекурсией: \\(A_3=1\\), а при \\(n\\ge4\\) положим \\(A_n=A_{n-1}+2n-3\\). Докажем по индукции, что всякая допустимая триангуляция \\(n\\)-угольника имеет не больше \\(A_n\\) треугольников. Последовательность \\(A_n\\) возрастает, поэтому если после удаления получится многоугольник с меньшим числом сторон, чем \\(n-1\\), оценка \\(A_{n-1}\\) все равно применима.\n\nПри \\(n=3\\) из (1) и \\(a_i\\ge2\\) следует \\(a_1=a_2=a_3=2\\). Тогда треугольник, содержащий сторону \\(v_1v_2\\), не может иметь третью вершину, отличную от \\(v_3\\), иначе одна из вершин \\(v_1,v_2\\) имела бы степень больше 2. Значит, вся триангуляция состоит из одного треугольника.\n\nПусть \\(n\\ge4\\) и утверждение доказано для всех меньших чисел сторон. Если для некоторой граничной вершины \\(v_i\\) выполнено \\(a_i=2\\), то единственный треугольник около нее имеет вершины \\(v_{i-1},v_i,v_{i+1}\\). Удалив этот треугольник и заменив две граничные стороны \\(v_{i-1}v_i, v_iv_{i+1}\\) стороной \\(v_{i-1}v_{i+1}\\), получаем допустимую триангуляцию \\((n-1)\\)-угольника: внутренние вершины не изменились, а вершины бывшего треугольника остаются на границе. Поэтому исходных треугольников не больше \\(A_{n-1}+1\\le A_n\\).\n\nОстается случай, когда все \\(a_i\\ge3\\). Из (1) получаем\n\\[\n\\sum_{i=1}^n (a_i-4)\\le -6.\n\\]\nВершина степени 3 дает вклад \\(-1\\), вершина степени 4 - вклад 0, а каждая вершина степени хотя бы 5 дает положительный вклад не меньше 1. Поэтому вершин степени 3 больше, чем вершин степени хотя бы 5. Если удалить из циклической записи степеней все четверки, то два соседних оставшихся символа где-то обязаны быть двумя тройками; возвращая удаленные четверки между ними, получаем цепочку последовательных граничных вершин\n\\[\nw_1,w_2,\\ldots,w_k\n\\]\nсо степенями\n\\[\n3,4,4,\\ldots,4,3\n\\]\nи \\(2\\le k\\le n-1\\).\n\nПроверим явно, что такая цепочка удаляется. Обозначим через \\(u\\) вершину перед \\(w_1\\) на границе, а через \\(z\\) вершину после \\(w_k\\). Для каждого граничного ребра цепочки рассмотрим третий угол соответствующего треугольника: пусть \\(x_0\\) - третья вершина треугольника на стороне \\(uw_1\\), \\(x_j\\) - третья вершина треугольника на стороне \\(w_jw_{j+1}\\) при \\(1\\le j\\le k-1\\), и \\(x_k\\) - третья вершина треугольника на стороне \\(w_kz\\). Так как \\(w_1\\) имеет степень 3, две грани около ребер \\(uw_1\\) и \\(w_1w_2\\) используют одну и ту же третью вершину, то есть \\(x_0=x_1\\). Та же проверка для правого конца цепочки дает \\(x_{k-1}=x_k\\). Если \\(2\\le j\\le k-1\\), то у вершины \\(w_j\\) ровно четыре соседа: \\(w_{j-1}\\), \\(w_{j+1}\\), \\(x_{j-1}\\), \\(x_j\\). Поэтому единственная грань около \\(w_j\\), не содержащая граничного ребра исходного многоугольника, есть треугольник \\(w_jx_{j-1}x_j\\).\n\nСледовательно, все треугольники, имеющие вершину среди \\(w_1,\n\\ldots,w_k\\), входят в следующий список: \\(k+1\\) треугольников на граничных ребрах \\(uw_1,w_1w_2,\\ldots,w_{k-1}w_k,w_kz\\) и еще \\(k-2\\) внутренних треугольников \\(w_jx_{j-1}x_j\\) для \\(2\\le j\\le k-1\\). Всего их не больше \\((k+1)+(k-2)=2k-1\\).\n\nУдаление этих треугольников срезает от триангулированного диска приграничную полосу. Новая граница получается из старого пути \\(u,w_1,\\ldots,w_k,z\\) заменой на путь \\(u,x_1,x_2,\\ldots,x_{k-1},z\\), с возможным отождествлением уже существующих граничных вершин; поэтому число сторон оставшегося многоугольника не превосходит \\(n-1\\). Все вершины, которые после удаления остаются внутренними, были внутренними и раньше и не теряют инцидентных треугольников; вершины \\(x_j\\), оказавшиеся на новой границе, больше не обязаны иметь степень 6. Значит, остаток является допустимой триангуляцией некоторого многоугольника с не более чем \\(n-1\\) сторонами; если остаток пуст, число оставшихся треугольников равно 0.\n\nПо индукции число оставшихся треугольников не больше \\(A_{n-1}\\), значит, всего было не больше\n\\[\nA_{n-1}+2k-1\\le A_{n-1}+2n-3=A_n.\n\\]\nТакое \\(A_n\\) и можно взять в качестве \\(M_n\\).",
