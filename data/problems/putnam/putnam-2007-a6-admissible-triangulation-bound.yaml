  "solutions": [
    {
      "id": "sol-kedlaya-euler-induction",
      "title": "Оценка через степени границы и индукцию",
      "text": "Будем использовать классическую лемму `disk-triangulation-boundary-degree-chain-reduction` о триангуляциях диска. В наших обозначениях она применима к графу триангуляции: граничные вершины — это вершины исходного многоугольника, а допустимость означает, что все внутренние вершины имеют степень не меньше \\(6\\). Лемма дает две вещи:\n\n1. если \\(a_i\\) — степени граничных вершин \\(v_i\\), то\n\\[\na_1+\\cdots+a_n\\le 4n-6; \\tag{1}\n\\]\n2. при \\(n\\ge4\\) можно удалить либо одно граничное ухо при вершине степени \\(2\\), либо приграничную полосу около цепи \\(w_1,\\ldots,w_k\\) со степенями \\(3,4,\\ldots,4,3\\), где \\(2\\le k\\le n-1\\). В первом случае удаляется \\(1\\) треугольник и остается допустимая триангуляция \\((n-1)\\)-угольника. Во втором случае удаляется не более \\(2k-1\\le 2n-3\\) треугольников, а остаток, если он непуст, является допустимой триангуляцией некоторого многоугольника с не более чем \\(n-1\\) сторонами.\n\nЗададим явную верхнюю оценку рекурсией: \\(A_3=1\\), а при \\(n\\ge4\\)\n\\[\nA_n=A_{n-1}+2n-3.\n\\]\nДокажем по индукции, что всякая допустимая триангуляция \\(n\\)-угольника имеет не больше \\(A_n\\) треугольников. Последовательность \\(A_n\\) возрастает, поэтому оценка \\(A_{n-1}\\) применима и к остаткам с числом сторон меньше \\(n-1\\).\n\nБаза \\(n=3\\). Из (1) и очевидного \\(a_i\\ge2\\) следует \\(a_1=a_2=a_3=2\\). Треугольник, содержащий сторону \\(v_1v_2\\), не может иметь третью вершину, отличную от \\(v_3\\), иначе одна из вершин \\(v_1,v_2\\) имела бы степень больше \\(2\\). Значит, вся триангуляция состоит из одного треугольника, то есть не превосходит \\(A_3\\).\n\nПусть \\(n\\ge4\\), и утверждение доказано для меньших чисел сторон. Применим граничную редукционную часть леммы. Если удаляется ухо степени \\(2\\), то оставшихся треугольников по индукции не больше \\(A_{n-1}\\), а всего было не больше\n\\[\nA_{n-1}+1\\le A_n.\n\\]\n\nЕсли удаляется полоса около цепи длины \\(k\\), то удалено не более \\(2k-1\\le2n-3\\) треугольников. Остаток либо пуст, либо по индукции содержит не больше \\(A_{n-1}\\) треугольников. Следовательно, исходная триангуляция содержит не больше\n\\[\nA_{n-1}+2k-1\\le A_{n-1}+2n-3=A_n.\n\\]\n\nТакое \\(A_n\\) зависит только от \\(n\\), поэтому можно взять \\(M_n=A_n\\).",
