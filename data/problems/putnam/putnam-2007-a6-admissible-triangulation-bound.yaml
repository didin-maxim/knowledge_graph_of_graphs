        "title": "Условие",
        "text": "Триангуляция \\(T\\) многоугольника \\(P\\) - это конечное семейство треугольников, объединение которых равно \\(P\\), причем пересечение любых двух треугольников либо пусто, либо является общей вершиной, либо общей стороной. Каждая сторона многоугольника является стороной ровно одного треугольника. Назовем триангуляцию допустимой, если каждая внутренняя вершина принадлежит как минимум шести треугольникам. Докажите, что для каждого \\(n\\) существует число \\(M_n\\), зависящее только от \\(n\\), такое что всякая допустимая триангуляция \\(n\\)-угольника имеет не более \\(M_n\\) треугольников.",
