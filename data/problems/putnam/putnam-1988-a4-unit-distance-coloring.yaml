  "solutions": [
    {
      "id": "sol-three-and-nine",
      "title": "Три цвета невозможны, девяти достаточно",
      "text": "Ответ: для трех цветов обязательно найдется одноцветная пара на расстоянии 1, а для девяти цветов можно избежать таких пар.\n\nСначала докажем невозможность трехцветной раскраски. Предположим, что одноцветных пар на расстоянии 1 нет. Возьмем две точки \\(A\\) и \\(B\\) на расстоянии \\(\\sqrt3\\). Единичные окружности с центрами \\(A\\) и \\(B\\) пересекаются в двух точках \\(X\\) и \\(Y\\). Тогда \\(AX=AY=BX=BY=1\\), а также \\(XY=1\\): эти пять точек дают два равносторонних треугольника со стороной 1 на общей стороне \\(XY\\). Так как \\(X\\) и \\(Y\\) находятся на расстоянии 1, их цвета различны. Точка \\(A\\) смежна с обеими \\(X,Y\\), значит при трех цветах она вынуждена иметь третий цвет. То же самое верно для \\(B\\). Следовательно, любые две точки на расстоянии \\(\\sqrt3\\) имеют один и тот же цвет.\n\nТеперь возьмем равносторонний треугольник со стороной \\(\\sqrt3\\). По только что доказанному все три его вершины должны иметь один цвет. Но расстояние между вершинами этого треугольника равно \\(\\sqrt3\\), а не 1; чтобы получить противоречие с исходным запретом, применим тот же вывод к двум вершинам \\(B,C\\) треугольника \\(ABC\\), где \\(AB=AC=\\sqrt3\\) и \\(BC=1\\). Из вывода следует, что \\(A\\) имеет тот же цвет, что \\(B\\), и тот же цвет, что \\(C\\). Поэтому \\(B\\) и \\(C\\) одноцветны, хотя \\(BC=1\\), противоречие.\n\nДля девяти цветов построим пример. Разобьем плоскость на квадраты со стороной \\(s\\), где, например, \\(1/2<s<1/\\sqrt2\\). Раскрасим квадраты периодическим блоком \\(3\\times3\\), давая девяти квадратам блока разные цвета и повторяя блок по обеим координатам. Если две точки лежат в одном квадрате, расстояние между ними не превосходит \\(s\\sqrt2<1\\). Если они лежат в разных квадратах одного цвета, то соответствующие квадраты разделены хотя бы двумя промежутками по горизонтали или вертикали, поэтому расстояние между точками больше либо равно \\(2s>1\\). Значит одноцветной пары на расстоянии 1 в этой раскраске нет.",
