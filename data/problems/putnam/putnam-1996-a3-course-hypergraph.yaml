  "solutions": [
    {
      "id": "sol-complete-3-uniform-counterexample",
      "title": "Контрпример из всех трехэлементных выборов",
      "text": "Утверждение неверно. Пронумеруем курсы числами \\(1,\n2,\n\\ldots,6\\). Так как \\(\\binom63=20\\), можно сопоставить 20 студентам все различные трехэлементные подмножества множества курсов: каждый студент выбирает ровно одну свою тройку, и каждая тройка появляется ровно один раз.\n\nПроверим, что эта конфигурация избегает требуемого вывода. Зафиксируем пару курсов, скажем \\(\\{i,j\\}\\). Студент выбрал оба этих курса тогда и только тогда, когда его тройка имеет вид \\(\\{i,j,k\\}\\), где \\(k\\) - один из оставшихся четырех курсов. Поэтому таких студентов ровно 4, а не 5.\n\nТеперь посчитаем студентов, которые не выбрали ни один из двух курсов \\(i,j\\). Их тройки должны быть трехэлементными подмножествами четырех оставшихся курсов. Таких троек \\(\\binom43=4\\). Значит для той же пары курсов ровно 4 студента не выбрали ни один из них.\n\nПара курсов была произвольной. Следовательно, ни для какой пары нельзя найти 5 студентов, которые все выбрали оба курса, и нельзя найти 5 студентов, которые все не выбрали оба курса. Это дает требуемый контрпример. В гиперграфовом языке это полный 3-однородный гиперграф \\(K_6^{(3)}\\): кодегепень каждой пары равна 4, и кодегепень той же пары в дополнении по непересечению также равна 4.",
