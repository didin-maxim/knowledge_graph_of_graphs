        "title": "Двадцать студентов и шесть курсов",
        "text": "Каждый из 20 студентов выбрал некоторое число курсов, от 0 до 6, из шести предложенных курсов. Верно ли, что обязательно найдутся 5 студентов и 2 курса такие, что либо все эти 5 студентов выбрали оба курса, либо все эти 5 студентов не выбрали ни один из этих двух курсов? Докажите или приведите контрпример.",
