  "solutions": [
    {
      "id": "sol-official-matching",
      "title": "Решение стратегией паросочетания",
      "text": "Исключим начальную строку \\(0^n\\) и рассмотрим граф на всех остальных строках из \\(\\{0,1,2\\}^n\\), где ребро соответствует изменению одной координаты на 1. Построим совершенное паросочетание этого графа. Для ненулевой строки найдём её первую ненулевую координату. Если там стоит 1, заменим её на 2; если стоит 2, заменим её на 1. Остальные координаты не меняем. Полученная строка отличается от исходной ровно в одной координате на 1, значит соединена с ней ребром. Эта операция является инволюцией без неподвижных точек, поэтому все ненулевые строки разбиваются на пары смежных вершин.\n\nСтратегия Боба теперь очевидна. Первый ход Алисы обязательно ведёт из \\(0^n\\) в некоторую ненулевую строку \\(v\\). Боб отвечает переходом в строку \\(w\\), парную к \\(v\\) в построенном паросочетании. Далее Боб делает то же самое после каждого хода Алисы.\n\nПочему ответ всегда легален? Индуктивно перед каждым ходом Алисы каждая пара паросочетания либо ещё не посещена вовсе, либо обе её вершины уже посещены. Алиса, если ходит, приходит в первую вершину некоторой ещё не посещённой пары; вторая вершина этой пары свободна и смежна с ней, так что Боб может туда перейти. После ответа Боба эта пара становится полностью посещённой, и инвариант сохраняется.\n\nТак как число всех позиций конечно, игра обязательно закончится. Если Алиса смогла сделать ход, то Боб по описанной стратегии тоже может ответить. Следовательно, первым игроком без хода будет Алиса, а Боб выигрывает при любом \\(n\\ge1\\).",
