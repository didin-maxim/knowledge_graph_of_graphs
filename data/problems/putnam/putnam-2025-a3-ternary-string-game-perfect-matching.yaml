        "id": "stmt-original",
        "title": "Условие",
        "text": "Алиса и Боб играют со строкой из \\(n\\) цифр, каждая из которых равна 0, 1 или 2. Изначально все цифры равны 0. За один ход можно прибавить 1 к одной цифре или вычесть 1 из одной цифры так, чтобы получилась строка, которая раньше в игре не встречалась. Игрок, у которого нет допустимого хода, проигрывает. Алиса ходит первой, далее игроки ходят по очереди. Для каждого \\(n\\ge1\\) определите, у кого есть гарантированно выигрышная стратегия.",
