        "title": "Условие",
        "text": "Круговой турнир с \\(2n\\) командами длился \\(2n-1\\) дней. В каждый день каждая команда играла ровно одну игру против другой команды; в каждой из \\(n\\) игр был один победитель и один проигравший. За весь турнир каждая команда сыграла с каждой другой ровно один раз. Всегда ли можно выбрать по одной выигравшей команде из каждого дня так, чтобы ни одна команда не была выбрана более одного раза?",
