      "id": "sol-kedlaya-hall",
      "title": "Теорема Холла",
      "text": "Ответ: да.\n\nВоспользуемся самостоятельной леммой `round-robin-winner-count-hall-lemma`: в полном круговом турнире с \\(2n\\) командами за любые \\(m\\) выбранных дней есть по крайней мере \\(m\\) различных команд, выигравших хотя бы одну игру в эти дни. Напомним ее короткое доказательство. Если множество таких победителей \\(W\\) имело бы размер меньше \\(m\\), то можно было бы выбрать команду вне \\(W\\). В каждый из выбранных дней она играла и не выигрывала, значит проиграла \\(m\\) раз. Эти \\(m\\) поражений были от \\(m\\) разных соперников, потому что одна пара команд встречается только один раз; все эти соперники лежат в \\(W\\), противоречие.\n\nТеперь построим двудольный граф. В левой доле находятся \\(2n-1\\) дней, в правой - \\(2n\\) команд. Соединим день \\(d\\) с командой \\(t\\), если команда \\(t\\) выиграла свою игру в день \\(d\\). Лемма говорит, что для любого множества из \\(m\\) левых вершин его множество соседей имеет размер не меньше \\(m\\). Это ровно условие Холла для покрытия всех дней паросочетанием.\n\nПо теореме Холла существует паросочетание, насыщающее все левые вершины. Оно выбирает для каждого дня одну соседнюю команду, то есть команду, выигравшую в этот день, причем разные дни сопоставлены разным командам. Это и требовалось.",
