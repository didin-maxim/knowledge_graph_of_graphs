  "solutions": [
    {
      "id": "sol-kedlaya-hall",
      "title": "Теорема Холла",
      "text": "Ответ: да.\n\nДокажем сначала ключевую оценку. Возьмем любые \\(m\\) дней, где \\(1\\le m\\le 2n-1\\). Утверждаем, что среди этих дней есть по крайней мере \\(m\\) различных команд, которые хотя бы раз выигрывали. Предположим обратное: множество таких победителей \\(W\\) имеет размер меньше \\(m\\). Тогда любая команда вне \\(W\\) не выигрывала ни в один из выбранных \\(m\\) дней, значит, в каждый из этих дней она проигрывала. За круговой турнир команда не играет с одним и тем же соперником дважды, поэтому за эти \\(m\\) дней она проиграла \\(m\\) различным соперникам. Все эти соперники принадлежат \\(W\\), потому что именно они выиграли соответствующие игры. Но \\(|W|<m\\), что невозможно.\n\nТеперь построим двудольный граф. В левой доле находятся \\(2n-1\\) дней, в правой - \\(2n\\) команд. Соединим день \\(d\\) с командой \\(t\\), если команда \\(t\\) выиграла свою игру в день \\(d\\). Только что доказанная оценка говорит, что для любого множества из \\(m\\) левых вершин его множество соседей имеет размер не меньше \\(m\\). Это ровно условие Холла для покрытия всех дней паросочетанием.\n\nПо теореме Холла существует паросочетание, насыщающее все левые вершины. Оно выбирает для каждого дня одну соседнюю команду, то есть команду, выигравшую в этот день, причем разные дни сопоставлены разным командам. Это и требовалось.",
