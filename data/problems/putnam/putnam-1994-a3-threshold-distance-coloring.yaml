  "solutions": [
    {
      "id": "sol-seven-point-distance-graph",
      "title": "Конечный граф внутри треугольника",
      "text": "Положим \\(k=2-\\sqrt2\\). Предположим, что треугольник раскрашен в четыре цвета и никакие две одноцветные точки не находятся на расстоянии хотя бы \\(k\\).\n\nВыберем координаты так, что \\(B=(0,0)\\), \\(A=(1,0)\\), \\(C=(0,1)\\). Обозначим \\(r=\\sqrt2-1\\). Тогда \\(k=\\sqrt2\\,r\\) и \\(k+r=1\\). Отметим семь точек на сторонах треугольника:\n\\[\nA=(1,0),\\quad B=(0,0),\\quad C=(0,1),\\quad D=(r,0),\\quad G=(0,r),\n\\]\n\\[\nE=(k,r),\\quad F=(r,k).\n\\]\nТочки \\(D\\) и \\(G\\) лежат на катетах, причем \\(AD=CG=k\\). Точки \\(E\\) и \\(F\\) лежат на гипотенузе \\(x+y=1\\), причем\n\\[\nAE=\\sqrt{(1-k)^2+r^2}=\\sqrt{r^2+r^2}=\\sqrt2\\,r=k\n\\]\nи аналогично \\(CF=k\\).\n\nПроверим все расстояния, которые понадобятся в запрете на одинаковый цвет. Во-первых, \\(A\\) и \\(C\\) удалены от любой другой отмеченной точки по крайней мере на \\(k\\): для \\(A\\) это следует из \\(AB=1\\), \\(AC=\\sqrt2\\), \\(AD=AE=k\\), \\(AG=\\sqrt{1+r^2}>k\\), а также\n\\[\nAF=\\sqrt{(1-r)^2+k^2}=\\sqrt{k^2+k^2}>k;\n\\]\nдля \\(C\\) рассуждение симметрично. Во-вторых,\n\\[\nDG=\\sqrt{r^2+r^2}=k,\\quad DF=k,\\quad EG=k,\n\\]\nпоскольку \\(D=(r,0)\\), \\(F=(r,k)\\) и \\(E=(k,r)\\), \\(G=(0,r)\\). Наконец,\n\\[\nBE=BF=\\sqrt{k^2+r^2}>k,\n\\]\nтак как \\(r>0\\).\n\nТеперь применим только эти проверенные расстояния. Точки \\(A\\) и \\(C\\) имеют разные цвета. Каждая из точек \\(D\\) и \\(G\\) находится на расстоянии не меньше \\(k\\) и от \\(A\\), и от \\(C\\), а также \\(DG=k\\). Значит \\(D\\) и \\(G\\) должны получить два оставшихся цвета, причем разные.\n\nТочка \\(E\\) находится на расстоянии не меньше \\(k\\) от \\(A\\), \\(C\\) и \\(G\\), поэтому ей запрещены цвета \\(A\\), \\(C\\) и \\(G\\); из четырех цветов остается только цвет \\(D\\). Аналогично \\(F\\) находится на расстоянии не меньше \\(k\\) от \\(A\\), \\(C\\) и \\(D\\), поэтому \\(F\\) вынуждена иметь цвет \\(G\\). Но точка \\(B\\) находится на расстоянии не меньше \\(k\\) от \\(A\\), \\(C\\), \\(E\\) и \\(F\\), а эти четыре точки уже представляют все четыре цвета: цвета \\(A\\), \\(C\\), \\(D\\) и \\(G\\). Для \\(B\\) не остается допустимого цвета.\n\nПротиворечие показывает, что в любой четырехцветной раскраске обязательно есть две одноцветные точки на расстоянии не меньше \\(2-\\sqrt2\\).",
