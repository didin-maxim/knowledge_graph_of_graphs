  "solutions": [
    {
      "id": "sol-seven-point-distance-graph",
      "title": "Конечный граф внутри треугольника",
      "text": "Положим \\(k=2-\\sqrt2\\). Обозначим вершины прямоугольного равнобедренного треугольника через \\(A,B,C\\), где \\(\\angle B=90^\\circ\\) и \\(AB=BC=1\\). Выберем точки \\(D\\in AB\\), \\(E,F\\in AC\\), \\(G\\in BC\\) так, что \\(AD=AE=k\\) и \\(CF=CG=k\\).\n\nПрямой расчет расстояний в таком треугольнике дает \\(DF=EG=DG=k\\). Кроме того, каждая из точек \\(A\\) и \\(C\\) находится на расстоянии не меньше \\(k\\) от любой другой отмеченной точки. Поэтому, если бы все точки треугольника можно было раскрасить в четыре цвета без одноцветной пары на расстоянии хотя бы \\(k\\), то отмеченные семь точек тоже давали бы правильную 4-раскраску соответствующего графа расстояний.\n\nПокажем, что это невозможно. Так как \\(AC\\ge k\\), вершины \\(A\\) и \\(C\\) имеют разные цвета. Точки \\(D\\) и \\(G\\) находятся на расстоянии не меньше \\(k\\) и каждая из них находится на расстоянии не меньше \\(k\\) от \\(A\\) и от \\(C\\). Значит \\(D\\) и \\(G\\) должны занять два оставшихся цвета, причем разные.\n\nТочка \\(E\\) находится на расстоянии не меньше \\(k\\) от \\(A\\), \\(C\\) и \\(G\\), поэтому она вынуждена иметь цвет \\(D\\). Аналогично точка \\(F\\) находится на расстоянии не меньше \\(k\\) от \\(A\\), \\(C\\) и \\(D\\), поэтому она вынуждена иметь цвет \\(G\\). Наконец, точка \\(B\\) находится на расстоянии не меньше \\(k\\) от \\(A\\), \\(C\\), \\(E\\) и \\(F\\). Эти четыре точки уже используют все четыре цвета, значит для \\(B\\) не остается допустимого цвета.\n\nПолучили противоречие. Следовательно, исходная раскраска всего треугольника обязательно содержит две одноцветные точки на расстоянии не меньше \\(2-\\sqrt2\\).",
      "idea_ids": [
