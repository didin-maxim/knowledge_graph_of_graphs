  "solutions": [
    {
      "id": "sol-cayley-euler",
      "title": "Эйлеров цикл в ориентированном графе Кэли",
      "text": "Утверждение верно. Построим ориентированный граф \\(D\\) с множеством вершин \\(G\\). Из каждой вершины \\(g\\) проведем две дуги: \\(g\\to ga\\) и \\(g\\to gb\\). Тогда всякая допустимая последовательность элементов группы является направленным обходом в этом графе.\n\nПроверим, что \\(D\\) эйлеров. Из каждой вершины выходит ровно две дуги. Входящих дуг тоже ровно две: в вершину \\(g\\) входят дуги из \\(ga^{-1}\\) и \\(gb^{-1}\\). Если случайно \\(a=b\\), это означает две параллельные дуги; для эйлерова обхода это не мешает, потому что мы работаем с ориентированным мультиграфом. Значит для каждой вершины входящая степень равна исходящей.\n\nОсталось связность в нужном смысле. Так как \\(a,b\\) порождают \\(G\\), из единицы можно попасть в любой элемент, умножая справа на \\(a,b\\) и их обратные. В неориентированном графе, полученном забыванием направлений, это дает связность. Более того, для существования эйлерова цикла достаточно, что все вершины положительной степени лежат в одной слабой компоненте и входящие степени равны исходящим; это здесь выполнено. Эквивалентно можно заметить, что равенство степеней в слабосвязном ориентированном графе устраняет односторонние компоненты и дает эйлерову циркуляцию через все дуги.\n\nПо теореме Эйлера в \\(D\\) существует замкнутый направленный обход, проходящий по каждой дуге ровно один раз. Всего дуг \\(2n\\), поэтому запишем начала последовательно проходимых дуг как \\(g_1,g_2,\\ldots,g_{2n}\\). Следующая вершина после \\(g_i\\) действительно равна \\(g_i a\\) или \\(g_i b\\), потому что так устроены дуги. Наконец, каждый элемент \\(g\\in G\\) встречается среди \\(g_i\\) ровно столько раз, сколько дуг выходит из \\(g\\), то есть ровно два раза. Это и есть требуемая последовательность.",
