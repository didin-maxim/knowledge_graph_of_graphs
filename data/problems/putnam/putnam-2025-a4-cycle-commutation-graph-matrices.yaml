    {
      "id": "idea-two-dimensional-obstruction",
      "title": "В размерности 2 коммутирование слишком транзитивно",
      "text": "Для не скалярной матрицы \\(2\\times2\\) её коммутант сильно ограничен: в недиагонализуемом случае это матрицы того же жорданова вида, а в диагонализуемом случае — матрицы в том же собственном базисе. Поэтому цепочка коммутирований заставляет появиться лишнее коммутирование.",
