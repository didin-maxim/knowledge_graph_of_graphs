      "id": "idea-three-dimensional-cycle",
      "title": "В \\(\\mathbb R^3\\) цикл задают ранговые проекторы",
      "text": "Берутся векторы \\(v_i\\) в \\(\\mathbb R^3\\), любые три из которых линейно независимы, и \\(w_i=v_{i-1}\\times v_{i+1}\\). Проектор \\(A_i\\) на прямую \\(\\langle w_i\\rangle\\) вдоль плоскости \\(v_i^\\perp\\) зануляет проекторы соседей, а для несоседей условие коммутирования заставило бы три вектора \\(v_j\\) оказаться в одной плоскости.",
