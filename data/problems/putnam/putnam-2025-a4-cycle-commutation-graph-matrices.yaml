      "id": "idea-three-dimensional-cycle",
      "title": "В \\(\\mathbb R^3\\) цикл задаётся соседней ортогональностью",
      "text": "Можно выбрать векторы \\(u_i\\) так, чтобы \\(u_i\\perp u_{i+1}\\) циклически и никаких лишних ортогональностей/коллинеарностей не возникало. Ранговые матрицы \\(A_i=u_i u_i^T\\) коммутируют ровно при ортогональности или коллинеарности соответствующих векторов.",
