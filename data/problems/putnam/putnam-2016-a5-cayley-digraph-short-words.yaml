  "solutions": [
    {
      "id": "sol-cayley-digraph",
      "title": "Решение через ориентированный граф Кэли",
      "text": "Рассмотрим четыре допустимых блока\n\\[\nS=\\{gh,gh^{-1},g^{-1}h,g^{-1}h^{-1}\\}.\n\\]\nСначала покажем, что они порождают всю группу \\(G\\). Действительно,\n\\[\n(gh)(g^{-1}h)^{-1}=ghh^{-1}g=g^2.\n\\]\nТак как порядок \\(g\\) нечётен, элемент \\(g^2\\) порождает ту же циклическую подгруппу, что и \\(g\\); значит, из элементов \\(S\\) можно получить \\(g\\). Тогда из \\(gh\\) и \\(g\\) получаем \\(h\\). Поскольку исходно \\(g,h\\) порождают \\(G\\), множество \\(S\\) тоже порождает \\(G\\).\n\nТеперь построим ориентированный граф Кэли: вершины — элементы \\(G\\), а дуга из \\(a\\) в \\(as\\) проводится для каждого \\(s\\in S\\). Так как \\(S\\) порождает \\(G\\), из единицы можно прийти в любой элемент группы; более того, граф сильно связен, но нам нужна только достижимость из единицы.\n\nВозьмём произвольный \\(x\\in G\\) и кратчайший направленный путь от единицы к \\(x\\). В кратчайшем пути не может быть повторяющейся вершины: если такая вершина встретилась дважды, промежуточный цикл можно удалить и получить более короткий путь к тому же концу. Следовательно, путь содержит не больше \\(|G|+1\\) вершин и имеет длину не больше \\(|G|\\).\n\nКаждый шаг этого пути есть умножение справа на один из блоков \\(g^{\\pm1}h^{\\pm1}\\). Поэтому конечная вершина \\(x\\) имеет представление\n\\[\nx=g^{m_1}h^{n_1}\\cdots g^{m_r}h^{n_r}\n\\]\nс \\(m_i,n_i\\in\\{-1,1\\}\\) и \\(r\\le |G|\\). Если \\(x=e\\), можно взять любой допустимый непустой путь к единице длины не больше \\(|G|\\), например из существования цикла в графе Кэли; либо отдельно получить представление из порождающих блоков. Для всех остальных элементов построенный путь сразу даёт требуемую запись.",
      "idea_ids": [
