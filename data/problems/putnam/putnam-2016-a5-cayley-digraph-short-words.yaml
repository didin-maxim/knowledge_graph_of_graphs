        "text": "Пусть \\(G\\) — конечная группа, порождённая двумя элементами \\(g\\) и \\(h\\), причём порядок \\(g\\) нечётен. Докажите, что каждый элемент \\(G\\) можно записать в виде\n\\[\ng^{m_1}h^{n_1}g^{m_2}h^{n_2}\\cdots g^{m_r}h^{n_r},\n\\]\nгде \\(1\\le r\\le |G|\\) и все \\(m_1,n_1,\n\\ldots,m_r,n_r\\) принадлежат \\(\\{-1,1\\}\\).",
