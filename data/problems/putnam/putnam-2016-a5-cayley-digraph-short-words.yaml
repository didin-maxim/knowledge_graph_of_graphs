  "solutions": [
    {
      "id": "sol-cayley-digraph",
      "title": "Решение через ориентированный граф Кэли",
      "text": "Обозначим через\n\\[\nB=\\{gh,gh^{-1},g^{-1}h,g^{-1}h^{-1}\\}\n\\]\nмножество допустимых блоков. Сначала проверим, что \\(B\\) порождает всю группу \\(G\\) как группа. Действительно,\n\\[\n(gh)(g^{-1}h)^{-1}=ghh^{-1}g=g^2.\n\\]\nЕсли порядок \\(g\\) равен нечётному числу \\(2q+1\\), то \\(g=(g^2)^{q+1}\\), поэтому из элементов \\(B\\) можно получить \\(g\\). Тогда \\(h=g^{-1}(gh)\\), значит, из \\(B\\) получаются оба исходных порождающих \\(g,h\\). Следовательно, группа, порождённая \\(B\\), равна \\(G\\).\n\nРассмотрим ориентированный граф Кэли \\(D\\): его вершины — элементы \\(G\\), а из \\(a\\) в \\(ab\\) проведена дуга для каждого \\(b\\in B\\). Так как \\(G\\) конечна и \\(B\\) порождает \\(G\\) как группа, положительные слова в буквах из \\(B\\) тоже дают все элементы \\(G\\): если в групповом слове встречается \\(b^{-1}\\), его можно заменить на положительную степень \\(b^{\\operatorname{ord}(b)-1}\\). Значит, из единицы в \\(D\\) достижима любая вершина; применяя то же рассуждение после сдвига стартовой вершины, получаем сильную связность \\(D\\).\n\nПусть сначала \\(x\\ne e\\). Возьмём кратчайший направленный путь из \\(e\\) в \\(x\\). Он не повторяет вершин: если одна и та же вершина встретилась дважды, участок между двумя её появлениями можно удалить и получить более короткий путь с теми же концами. Поэтому такой путь содержит не больше \\(|G|\\) вершин и имеет длину \\(r\\le |G|-1\\), в частности \\(1\\le r\\le |G|\\).\n\nОсталось аккуратно разобрать \\(x=e\\), потому что пустой путь не подходит условию задачи. Если хотя бы один блок \\(b\\in B\\) равен \\(e\\), то \\(e=b\\) даёт представление длины \\(1\\). Иначе выберем любой \\(b\\in B\\). Есть дуга \\(e\\to b\\), а поскольку \\(D\\) сильно связен, существует направленный путь из \\(b\\) обратно в \\(e\\). Выберем такой путь кратчайшим; его концы различны, поэтому он имеет длину не больше \\(|G|-1\\). Вместе с первой дугой получаем непустой направленный замкнутый маршрут из \\(e\\) в \\(e\\) длины не больше \\(|G|\\).\n\nТеперь любой из построенных маршрутов длины \\(r\\) последовательно умножает текущую вершину справа на блоки \\(b_i\\in B\\). Каждый блок имеет вид \\(g^{m_i}h^{n_i}\\), где \\(m_i,n_i\\in\\{-1,1\\}\\). Поэтому конечная вершина \\(x\\) записывается как\n\\[\nx=b_1b_2\\cdots b_r=g^{m_1}h^{n_1}g^{m_2}h^{n_2}\\cdots g^{m_r}h^{n_r},\n\\]\nгде \\(1\\le r\\le |G|\\). Это и требовалось доказать.",
