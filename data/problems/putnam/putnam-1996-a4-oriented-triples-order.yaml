        "title": "Система ориентированных троек",
        "text": "Пусть \\(A\\) - конечное множество, а \\(S\\) - множество упорядоченных троек \\((a,b,c)\\) попарно различных элементов \\(A\\). Предположим, что: 1) \\((a,b,c)\\in S\\) тогда и только тогда, когда \\((b,c,a)\\in S\\); 2) \\((a,b,c)\\in S\\) тогда и только тогда, когда \\((c,b,a)\\notin S\\); 3) \\((a,b,c)\\) и \\((c,d,a)\\) одновременно принадлежат \\(S\\) тогда и только тогда, когда \\((b,c,d)\\) и \\((d,a,b)\\) одновременно принадлежат \\(S\\). Докажите, что существует взаимно однозначная функция \\(g:A\\to\\mathbb R\\) такая, что из \\(g(a)<g(b)<g(c)\\) следует \\((a,b,c)\\in S\\).",
