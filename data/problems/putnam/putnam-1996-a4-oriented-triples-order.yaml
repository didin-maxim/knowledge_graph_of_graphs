  "solutions": [
    {
      "id": "sol-inductive-insertion",
      "title": "Индукция с вставкой нового элемента",
      "text": "Докажем более удобную форму утверждения: можно выбрать нумерацию элементов так, что для любых трех элементов \\(a,b,c\\) из условия \\(g(a)<g(b)<g(c)\\) следует \\((a,b,c)\\in S\\). Будем индуктивно строить порядок.\n\nДля трех элементов все ясно: одна из двух ориентаций тройки принадлежит \\(S\\), и порядок можно выбрать согласованно с ней. Пусть теперь \\(|A|>3\\). Выберем элемент \\(z\\) и положим \\(B=A\\setminus\\{z\\}\\). По индукции элементы \\(B\\) уже упорядочены: \\(a_1<a_2<\\cdots<a_m\\), и этот порядок правильно описывает ориентации троек внутри \\(B\\).\n\nНужно вставить \\(z\\) в один из промежутков этого порядка. Для удобства временно читаем индексы циклически, то есть после \\(a_m\\) идет \\(a_1\\). Рассмотрим соседние пары \\((a_i,a_{i+1})\\). Архивное решение доказывает ключевой факт: существует ровно один индекс \\(i\\), для которого \\((a_i,z,a_{i+1})\\in S\\). Идея такая. Если таких индексов нет, то четырехточечное правило, применяемое последовательно к четверкам с \\(z\\), переносит одну и ту же ориентацию вдоль всего цикла и в конце дает противоречие с правилом обращения ориентации. Если таких индексов два, то между ними выбирают ближайшие соседние промежутки; четырехточечное правило снова переносит ориентации через элементы между ними и вынуждает одновременно две противоположные ориентации одной тройки.\n\nВставим \\(z\\) между \\(a_i\\) и \\(a_{i+1}\\) в линейном порядке; если \\(i=m\\), ставим \\(z\\) после \\(a_m\\). Осталось проверить тройки, содержащие \\(z\\). Пусть две другие вершины \\(u,v\\) стоят по разные стороны от места вставки. Тогда нужная ориентация следует из выбора промежутка и повторного применения условия 3, которое позволяет заменять соседний элемент порядка следующим, не ломая согласованность ориентации. Если же обе вершины лежат по одну сторону, то циклическая симметрия и правило обращения сводят проверку к предыдущему случаю. Таким образом все тройки с \\(z\\) согласованы с новым порядком, а тройки без \\(z\\) согласованы по предположению индукции.\n\nИндукция завершена. Присвоив элементам построенного порядка любые строго возрастающие действительные числа, получаем требуемую взаимно однозначную функцию \\(g:A\\to\\mathbb R\\).",
