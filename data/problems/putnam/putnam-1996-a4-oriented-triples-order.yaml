  "solutions": [
    {
      "id": "sol-published-fixed-base-order",
      "title": "Опубликованное решение: порядок от фиксированного элемента",
      "text": "Если \\(|A|\\le 2\\), требование о возрастающих тройках пусто, и можно выбрать любую взаимно однозначную функцию \\(A\\to\\mathbb R\\). Далее считаем, что \\(|A|\\ge3\\), и фиксируем элемент \\(a\\in A\\). Обозначим \\(B=A\\setminus\\{a\\}\\).\n\nДля различных \\(x,y\\in B\\) зададим отношение \\(x<y\\) тогда и только тогда, когда \\((a,x,y)\\in S\\). Это отношение сравнивает любую пару ровно в одну сторону. Действительно, по условию 1 тройка \\((y,x,a)\\) принадлежит \\(S\\) тогда и только тогда, когда \\((a,y,x)\\) принадлежит \\(S\\). Поэтому условие 2, примененное к \\((a,x,y)\\), говорит, что ровно одна из троек \\((a,x,y)\\), \\((a,y,x)\\) лежит в \\(S\\). Значит, для любых различных \\(x,y\\in B\\) выполнено ровно одно из \\(x<y\\) и \\(y<x\\).\n\nДокажем транзитивность. Пусть \\(x<y\\) и \\(y<z\\), где \\(x,y,z\\in B\\) различны. Тогда \\((a,x,y)\\in S\\) и \\((a,y,z)\\in S\\). По условию 1 из \\((a,y,z)\\in S\\) следует \\((y,z,a)\\in S\\). Применим условие 3 к четверке \\((a,x,y,z)\\). Так как обе тройки \\((a,x,y)\\) и \\((y,z,a)\\) принадлежат \\(S\\), обе тройки \\((x,y,z)\\) и \\((z,a,x)\\) тоже принадлежат \\(S\\). Из \\((z,a,x)\\in S\\) и циклической инвариантности получаем \\((a,x,z)\\in S\\), то есть \\(x<z\\). Следовательно, отношение \\(<\\) является строгим линейным порядком на \\(B\\).\n\nЗапишем элементы \\(B\\) в этом порядке: \\(b_1<b_2<\\cdots<b_m\\). Построим линейный порядок на всем \\(A\\), поставив фиксированный элемент первым: \\(a<b_1<b_2<\\cdots<b_m\\). Проверим, что он имеет нужное свойство. Если возрастающая тройка начинается с \\(a\\), то она имеет вид \\((a,b_i,b_j)\\), где \\(i<j\\), и принадлежит \\(S\\) по определению порядка на \\(B\\). Если же возрастающая тройка целиком лежит в \\(B\\), скажем \\(b_i<b_j<b_k\\), то из \\((a,b_i,b_j)\\in S\\) и \\((a,b_j,b_k)\\in S\\) тем же применением условия 3, что и выше, следует \\((b_i,b_j,b_k)\\in S\\).\n\nОстается выбрать действительные значения. Положим, например, \\(g(a)=0\\) и \\(g(b_i)=i\\) для \\(1\\le i\\le m\\). Эта функция взаимно однозначна, и всякая тройка с \\(g(u)<g(v)<g(w)\\) идет в построенном линейном порядке слева направо, а потому \\((u,v,w)\\in S\\). Это и требовалось доказать.",
