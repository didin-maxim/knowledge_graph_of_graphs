  "solutions": [
    {
      "id": "sol-rooted-forest",
      "title": "Решение через функциональные графы и корневые леса",
      "text": "Обозначим \\(R=\\{1,\n\\ldots,k\\}\\). Сначала докажем, что условие зависит только от значений функции вне \\(R\\). Если из вершины \\(x\\) последовательность \\(x,f(x),f^2(x),\\ldots\\) впервые попала в \\(R\\) на шаге \\(j\\), то все вершины \\(x,f(x),\\ldots,f^{j-1}(x)\\) лежат вне \\(R\\). Поэтому до первого попадания в \\(R\\) используются только значения \\(f(y)\\) при \\(y\\notin R\\). Значения \\(f\\) на самом \\(R\\) можно выбрать произвольно и независимо: после попадания в \\(R\\) условие для исходной вершины уже выполнено, а для вершин из \\(R\\) оно выполнено при \\(j=0\\). Следовательно, достаточно посчитать допустимые функции с фиксированными значениями \\(f(1)=\\cdots=f(k)=1\\), а затем умножить результат на \\(n^k\\).\n\nПусть теперь значения на \\(R\\) зафиксированы. Рассмотрим только дуги \\(x\\to f(x)\\) из вершин \\(x\\notin R\\). У каждой такой вершины ровно одна исходящая дуга. Условие задачи эквивалентно тому, что, двигаясь по этим дугам, каждая вершина вне \\(R\\) рано или поздно попадает в \\(R\\). Значит, среди вершин вне \\(R\\) нет направленного цикла: иначе вершины этого цикла никогда не дошли бы до \\(R\\). Поэтому, если забыть ориентацию, получаем лес на вершинах \\(X\\), каждая компонента которого содержит ровно один корень из \\(R\\); ориентация каждого ребра направлена к этому корню. Обратно, любой такой корневой лес однозначно задаёт значения \\(f(x)\\) для \\(x\\notin R\\): надо направить каждое ребро к корню и положить \\(f(x)\\) равным следующей вершине на пути от \\(x\\) к корню. Итак, при фиксированных значениях на \\(R\\) нам нужно посчитать корневые леса на \\(n\\) помеченных вершинах с фиксированным множеством корней \\(R\\).\n\nДокажем нужную формулу для лесов. Если \\(k=n\\), есть ровно один пустой лес, и \\(k n^{n-k-1}=n n^{-1}=1\\). Пусть дальше \\(m=n-k\\ge 1\\). Для корневого леса с корнями \\(R\\) ориентируем все рёбра к корням. Пока некорневых вершин больше одной, берём наименьший некорневой лист, записываем его родителя и удаляем этот лист. Когда останется одна некорневая вершина, её родитель обязательно лежит в \\(R\\); запишем этот последний корень отдельно. Так лесу сопоставляется пара\n\\[\n (r; a_1,\n\\ldots,a_{m-1}),\n\\]\nгде \\(r\\in R\\), а каждый \\(a_i\\in X\\).\n\nЭто соответствие обратимо. Даны \\(r\\in R\\) и последовательность \\(a_1,\n\\ldots,a_{m-1}\\). На шаге \\(i\\) среди ещё не удалённых некорневых вершин выбираем наименьшую вершину, которая не встречается в хвосте \\(a_i,\n\\ldots,a_{m-1}\\), соединяем её ребром с \\(a_i\\) и удаляем. Такая вершина существует, потому что оставшихся некорневых вершин больше, чем длина этого хвоста. После \\(m-1\\) шагов остаётся одна некорневая вершина; соединяем её с \\(r\\). Получается лес, ориентированный к корням \\(R\\), и стандартная проверка кода Прюфера показывает, что обе процедуры взаимно обратны: на каждом шаге восстанавливается ровно тот лист, который был удалён при кодировании. Следовательно, число таких лесов равно\n\\[\n |R|\\cdot |X|^{m-1}=k n^{n-k-1}.\n\\]\n\nЗначит, при фиксированных значениях на \\(R\\) число допустимых функций равно \\(k n^{n-k-1}\\). Возвращая свободный выбор \\(f(1),\n\\ldots,f(k)\\), получаем\n\\[\n n^k\\cdot k n^{n-k-1}=k n^{n-1},\n\\]\nчто и требовалось.",
