        "id": "stmt-original",
        "title": "Условие",
        "text": "Пусть \\(X=\\{1,2,\\ldots,n\\}\\), и пусть \\(k\\in X\\). Докажите, что существует ровно \\(k n^{\\,n-1}\\) функций \\(f:X\\to X\\), таких что для каждого \\(x\\in X\\) существует \\(j\\ge 0\\), для которого \\(f^{(j)}(x)\\le k\\). Здесь \\(f^{(j)}\\) обозначает \\(j\\)-ю итерацию \\(f\\), так что \\(f^{(0)}(x)=x\\) и \\(f^{(j+1)}(x)=f(f^{(j)}(x))\\).",
        "source_id": "src-putnam-2013-B5-kedlaya",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [],
        "distinct_from": [
