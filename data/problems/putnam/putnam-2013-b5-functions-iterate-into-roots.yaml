        "graph_model"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-contract-roots",
      "title": "Сжатие корней превращает задачу в счёт корневых лесов",
      "text": "После сжатия \\(R\\) в одну вершину \\(*\\) оставшиеся вершины должны в функциональном графе дойти до \\(*\\). Это ровно ориентированное к корню дерево/лес, и стандартная формула для корневых лесов даёт множитель \\(k n^{n-k-1}\\) перед свободным выбором значений на \\(R\\).",
      "tags": [
