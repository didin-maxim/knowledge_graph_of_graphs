  "solutions": [
    {
      "id": "sol-rooted-forest",
      "title": "Решение через функциональные графы и корневые леса",
      "text": "Обозначим \\(R=\\{1,\n\\ldots,k\\}\\). Важное наблюдение: условие зависит только от значений функции вне \\(R\\). Действительно, если из вершины \\(x\\) путь \\(x,f(x),f^2(x),\\ldots\\) впервые попал в \\(R\\) на шаге \\(j\\), то все предыдущие вершины лежали вне \\(R\\). Поэтому изменение значений функции на самом \\(R\\) не портит и не создаёт путь до первого попадания в \\(R\\). Следовательно, достаточно посчитать функции с фиксированными значениями \\(f(1)=\\cdots=f(k)=1\\), а затем умножить ответ на \\(n^k\\).\n\nТеперь сожмём множество \\(R\\) в один корень \\(*\\). Для функции с указанной фиксацией рассмотрим только вершины \\(*,k+1,\n\\ldots,n\\). Каждая вершина вне \\(*\\) либо указывает на другую внешнюю вершину, либо на одну из \\(k\\) вершин множества \\(R\\), что после сжатия означает дугу в \\(*\\). Условие задачи становится таким: из каждой внешней вершины направленный путь должен прийти в \\(*\\). Иными словами, после забывания ориентации это корневое дерево на \\(n-k+1\\) с корнем \\(*\\), но каждое ребро, входящее в \\(*\\), можно поднять к одной из \\(k\\) исходных вершин из \\(R\\).\n\nСтандартная формула для корневых лесов на \\(n\\) помеченных вершинах с фиксированным множеством из \\(k\\) корней утверждает, что таких лесов равно\n\\[\n k n^{\\,n-k-1}.\n\\]\nЕё можно получить, например, из формулы Кэли с дополнительным корнем: добавить новую вершину \\(*\\), соединить её с каждым из \\(k\\) корней, а затем применить вариант кода Прюфера/матричной теоремы о деревьях к деревьям, в которых при удалении \\(*\\) остаётся лес, ориентированный к корням.\n\nЗначит, при фиксированных значениях на \\(R\\) число допустимых функций равно \\(k n^{n-k-1}\\). Возвращая свободный выбор \\(f(1),\n\\ldots,f(k)\\), получаем\n\\[\n n^k\\cdot k n^{n-k-1}=k n^{n-1},\n\\]\nчто и требовалось.",
