        ]
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Для функции \\(f:X\\to X\\) нарисуем функциональный ориентированный граф с дугой \\(x\\to f(x)\\) из каждой вершины. Сколько таких функциональных графов на \\(X=\\{1,\\ldots,n\\}\\) имеют свойство: из каждой вершины некоторый направленный путь попадает в множество \\(R=\\{1,\n\\ldots,k\\}\\)? Докажите, что число равно \\(k n^{n-1}\\).",
