  "ideas": [
    {
      "id": "idea-root-values-free",
      "title": "Значения на корневом множестве можно выбрать независимо",
      "text": "Если две функции совпадают вне \\(R=\\{1,\n\\ldots,k\\}\\), то свойство попадания в \\(R\\) одинаково для обеих: путь до первого попадания в \\(R\\) целиком лежит вне \\(R\\). Поэтому сначала можно зафиксировать значения на \\(R\\), например \\(f(1)=\\cdots=f(k)=1\\), а затем умножить счёт на \\(n^k\\).",
