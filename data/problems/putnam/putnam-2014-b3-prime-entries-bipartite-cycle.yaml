  "solutions": [
    {
      "id": "sol-kedlaya-graph",
      "title": "Решение через двудольный граф строк и столбцов",
      "text": "Предположим, что \\(\\operatorname{rank} A\\le 1\\). Нулевой ранг невозможен, так как в матрице есть элементы, абсолютные значения которых являются простыми числами. Поэтому можно считать, что ранг равен 1.\n\nПостроим двудольный граф: левая доля — строки, правая — столбцы, а ребро проводится там, где \\(|A_{ij}|\\) является простым числом. Так как среди абсолютных значений есть не меньше \\(m+n\\) различных простых чисел, в графе есть не меньше \\(m+n\\) рёбер. У графа всего \\(m+n\\) вершин, поэтому он не является лесом: всякий ациклический граф на \\(v\\) вершинах имеет не более \\(v-1\\) рёбер. Следовательно, в графе есть цикл. Поскольку граф двудольный, цикл имеет вид\n\\[\nR_1-C_1-R_2-C_2-\\cdots-R_t-C_t-R_1\n\\]\nпри \\(t\\ge 2\\), где все соответствующие матричные элементы имеют попарно различные простые модули; обозначим их \\(p_1,p_2,\n\\ldots,p_{2t}\\) по порядку обхода цикла.\n\nУ матрицы ранга 1 все миноры \\(2\\times2\\) равны нулю, а значит для любых строк \\(R_a,R_b\\) и столбцов \\(C_c,C_d\\) выполняется\n\\[\nA_{R_a C_c}A_{R_b C_d}=A_{R_a C_d}A_{R_b C_c}\n\\]\nтам, где эти четыре позиции рассматриваются. Применяя это последовательно вдоль цикла, получаем равенство модулей произведений элементов на чередующихся рёбрах цикла:\n\\[\n p_1p_3\\cdots p_{2t-1}=p_2p_4\\cdots p_{2t}.\n\\]\nНо слева и справа стоят произведения двух непересекающихся наборов различных простых чисел. Единственность разложения на простые множители делает такое равенство невозможным. Противоречие доказывает, что ранг \\(A\\) не меньше 2.",
