      "id": "idea-cycle-forces-prime-product",
      "title": "Много рёбер дают цикл, а цикл противоречит рангу 1",
      "text": "Граф на \\(m+n\\) вершинах с хотя бы \\(m+n\\) рёбрами содержит цикл. В двудольном цикле ранговое условие \\(A_{ij}=r_i c_j\\) заставляет произведения элементов через одну позицию совпадать, но они являются произведениями двух разных наборов простых чисел.",
