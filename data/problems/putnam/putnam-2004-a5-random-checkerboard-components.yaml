  "solutions": [
    {
      "id": "sol-kedlaya-graph-expectation",
      "title": "Граф компонент и линейность ожидания",
      "text": "Построим граф \\(G\\): его вершины - клетки доски, а ребро соединяет две клетки с общей стороной, если они одного цвета. Компоненты связности этого графа ровно соответствуют связным монохромным областям.\n\nПусть \\(A\\) - число ребер в \\(G\\), а \\(B\\) - число монохромных блоков \\(2\\times2\\). В каждом таком блоке четыре клетки образуют цикл длины 4 в графе \\(G\\). Удалим из каждого такого цикла, например, его нижнее ребро. Такое удаление не меняет число компонент: концы удаляемого ребра остаются соединены обходом вокруг соответствующего монохромного блока; если несколько монохромных блоков стоят друг над другом, тот же обход можно рассматривать по верхней границе соответствующей монохромной полосы. Важно лишь, что мы удаляем по одному ребру из каждого локального цикла, не разрывая монохромную область.\n\nПосле этих удалений остается граф на \\(mn\\) вершинах с \\(A-B\\) ребрами и тем же числом компонент, что у \\(G\\). Любой граф на \\(N\\) вершинах и \\(E\\) ребрах имеет не меньше \\(N-E\\) компонент: добавление одного ребра может уменьшить число компонент не более чем на 1. Поэтому для каждого исхода раскраски\n\\[\nC\\ge mn-A+B,\n\\]\nгде \\(C\\) - число монохромных областей. Берем математическое ожидание:\n\\[\n\\mathbb E C\\ge mn-\\mathbb E A+\\mathbb E B.\n\\]\n\nОсталось посчитать два локальных ожидания. Всего соседних по стороне пар клеток равно \\(m(n-1)+(m-1)n\\), и каждая такая пара одноцветна с вероятностью \\(1/2\\). Значит,\n\\[\n\\mathbb E A={1\\over2}(m(n-1)+(m-1)n).\n\\]\nБлоков \\(2\\times2\\) равно \\((m-1)(n-1)\\), и все четыре клетки блока имеют один цвет с вероятностью \\(2/16=1/8\\). Поэтому\n\\[\n\\mathbb E B={1\\over8}(m-1)(n-1).\n\\]\nПодстановка дает\n\\[\n\\mathbb E C\\ge mn-{1\\over2}(m(n-1)+(m-1)n)+{1\\over8}(m-1)(n-1)\n={mn+3m+3n+1\\over8}>{mn\\over8}.\n\\]\nЭто и требовалось доказать.",
