  "solutions": [
    {
      "id": "sol-kedlaya-bijection",
      "title": "Биекция с четными подмножествами",
      "text": "При \\(n=1\\) обходов из \\((1,1)\\) в \\((1,1)\\), проходящих все три точки ровно по одному разу, нет. Далее считаем \\(n\\ge2\\).\n\nБудем рассматривать ладейный обход как гамильтонов путь в графе \\(3\\times n\\). Для данного пути \\(P\\) отметим столбец \\(i\\), если в нем путь содержит одно из направленных вертикальных ребер \\((i,1)\\to(i,2)\\) или \\((i,3)\\to(i,2)\\). Обозначим множество отмеченных столбцов через \\(S(P)\\).\n\nДва свойства этого множества видны из формы пути. Во-первых, \\(n\\in S(P)\\): путь заканчивается в нижней клетке последнего столбца, поэтому перед финальным горизонтальным или вертикальным прохождением последний столбец вынужденно имеет вход в среднюю клетку указанного типа. Во-вторых, число отмеченных столбцов четно. Интуитивно путь переключает, по какой из двух внешних строк идет основной проход; чтобы стартовать в нижней строке и закончить снова в нижней строке, число переключений должно быть четным.\n\nОбратно пусть дано четное множество\n\\[\nS=\\{a_1<a_2<\\cdots<a_{2r}=n\\}\\subseteq\\{1,2,\n\\ldots,n\\}.\n\\]\nОно однозначно задает обход: в отмеченных столбцах путь по очереди проходит через клетки \\((a_i,2+(-1)^i)\\) и через среднюю клетку \\((a_i,2)\\), а между соседними отмеченными столбцами идет единственным возможным горизонтальным коридором, заполняя еще не использованные клетки без самопересечений. Получается ровно одна змейка из \\((1,1)\\) в \\((n,1)\\), и при построении явно восстанавливаются все ребра пути. Это обратная операция к отображению \\(P\\mapsto S(P)\\).\n\nИтак, число обходов равно числу четных подмножеств множества \\(\\{1,\n\\ldots,n\\}\\), которые содержат \\(n\\). После фиксации элемента \\(n\\) среди оставшихся \\(n-1\\) элементов надо выбрать подмножество нечетной мощности; таких подмножеств ровно половина от всех, то есть \\(2^{n-2}\\). Ответ: \\(0\\) при \\(n=1\\) и \\(2^{n-2}\\) при \\(n\\ge2\\).",
