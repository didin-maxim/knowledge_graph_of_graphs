  "solutions": [
    {
      "id": "sol-kedlaya-bijection",
      "title": "Биекция с четными подмножествами",
      "text": "При \\(n=1\\) обходов из \\((1,1)\\) в \\((1,1)\\), проходящих все три точки ровно по одному разу, нет. Далее считаем \\(n\\ge2\\).\n\nБудем рассматривать обход как гамильтонов путь графа \\(P_n\\square P_3\\), ориентированный от \\((1,1)\\) к \\((n,1)\\). Обозначим нижнюю, среднюю и верхнюю вершины столбца \\(i\\) через \\(b_i=(i,1)\\), \\(m_i=(i,2)\\), \\(t_i=(i,3)\\). Назовём столбец переключающим, если путь входит в \\(m_i\\) по вертикальному ребру, то есть содержит направленное ребро \\(b_i\\to m_i\\) или \\(t_i\\to m_i\\).\n\nДокажем ключевую лемму: всякий такой путь единственным образом разбивается на блоки, задаваемые парами переключающих столбцов \\(L_1<R_1<L_2<R_2<\\cdots<L_r<R_r=n\\). Пусть уже пройдены все вершины столбцов \\(1,\\ldots,R_{j-1}\\) и путь стоит в \\(b_{R_{j-1}}\\), где для первого блока считаем \\(R_0=0\\) и стартуем в \\(b_1\\). Пока путь остаётся в нижней строке, он вынужденно идёт вправо; пусть \\(L_j\\) — первый столбец после \\(R_{j-1}\\), где он поднимается из нижней строки в среднюю.\n\nПосле ребра \\(b_{L_j}\\to m_{L_j}\\) следующий ход также вынужден. Если путь не пойдёт влево по средней строке до \\(m_{R_{j-1}+1}\\), то ещё не посещённые вершины средней и верхней строк в столбцах \\(R_{j-1}+1,\\ldots,L_j\\) можно будет позже достигнуть только через верхнюю вершину \\(t_{L_j}\\). Но тогда внутри этой левой полосы единственный выход назад к непосещённым правым вершинам шёл бы через уже использованные \\(m_{L_j}\\) или \\(t_{L_j}\\), что запрещено. Значит путь идёт влево по средней строке до \\(m_{R_{j-1}+1}\\), затем поднимается в \\(t_{R_{j-1}+1}\\) и по верхней строке идёт вправо. Пусть \\(R_j\\) — столбец, где он впервые спускается из верхней строки в среднюю. После ребра \\(t_{R_j}\\to m_{R_j}\\) тем же аргументом путь обязан пройти по средней строке влево через \\(m_{R_j-1},m_{R_j-2},\\ldots,m_{L_j+1}\\), затем спуститься в \\(b_{L_j+1}\\) и по нижней строке пройти вправо до \\(b_{R_j}\\). Так ровно один раз покрываются все вершины столбцов \\(R_{j-1}+1,\\ldots,R_j\\), а путь снова оказывается в нижней строке. Если \\(R_j<n\\), следующий столбец ещё не покрыт, и тот же разбор повторяется. Последний блок обязан иметь \\(R_r=n\\), иначе остались бы непосещённые столбцы справа от конечной вершины.\n\nИз леммы следует, что переключающие столбцы имеют вид \\(\\{L_1,R_1,L_2,R_2,\\ldots,L_r,R_r\\}\\): их число чётно, и последний из них равен \\(n\\). Обратно любое чётное подмножество \\(\\{a_1<a_2<\\cdots<a_{2r}=n\\}\\) задаёт путь: берём блоки \\((L_j,R_j)=(a_{2j-1},a_{2j})\\) и в каждом блоке выполняем только что описанные вынужденные ходы. Блоки покрывают непересекающиеся последовательные наборы столбцов, поэтому построенная ломаная проходит каждую вершину ровно один раз, начинается в \\((1,1)\\), заканчивается в \\((n,1)\\), и её переключающие столбцы ровно \\(\\{a_1,\\ldots,a_{2r}\\}\\). Значит это действительно обратная операция к отображению пути в множество переключающих столбцов.\n\nОстаётся посчитать такие множества. При \\(n\\ge2\\) мы обязаны включить \\(n\\), а среди остальных \\(n-1\\) столбцов выбрать подмножество нечётной мощности; таких подмножеств ровно половина всех подмножеств, то есть \\(2^{n-2}\\). Ответ: \\(0\\) при \\(n=1\\) и \\(2^{n-2}\\) при \\(n\\ge2\\).",
