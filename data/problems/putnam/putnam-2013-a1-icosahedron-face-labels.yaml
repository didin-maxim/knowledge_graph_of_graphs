        "title": "Условие",
        "text": "Напомним, что правильный икосаэдр имеет 12 вершин и 20 граней, причём все грани являются равносторонними треугольниками. На каждой грани правильного икосаэдра написано неотрицательное целое число, а сумма всех 20 чисел равна 39. Докажите, что найдутся две грани, имеющие общую вершину, на которых написано одно и то же число.",
