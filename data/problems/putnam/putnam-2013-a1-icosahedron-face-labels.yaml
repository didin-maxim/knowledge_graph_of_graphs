      "id": "idea-count-at-vertices",
      "title": "Счёт суммы меток вокруг вершин",
      "text": "Если у каждой вершины пять прилегающих граней имеют попарно различные метки, то сумма этих пяти меток не меньше \\(0+1+2+3+4\\). Суммирование по вершинам даёт нижнюю оценку, несовместимую с тем, что каждая грань учитывается ровно по трём своим вершинам.",
      "tags": [
        "double_counting"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-kedlaya-compressed",
      "title": "Решение двойным подсчётом инцидентностей",
      "text": "Предположим противное: никакие две грани, имеющие общую вершину, не имеют одинаковой метки. Рассмотрим одну фиксированную вершину икосаэдра. В правильном икосаэдре в каждой вершине сходятся ровно пять треугольных граней. По нашему предположению метки этих пяти граней попарно различны.\n\nВсе метки являются неотрицательными целыми числами. Поэтому минимально возможная сумма пяти попарно различных меток равна сумме пяти наименьших неотрицательных целых чисел:\n\\[\n0+1+2+3+4=10.\n\\]\nЗначит, для каждой из 12 вершин сумма меток пяти граней, прилегающих к этой вершине, не меньше 10.\n\nТеперь просуммируем эти 12 локальных сумм по всем вершинам икосаэдра. С одной стороны, только что полученная оценка даёт общий вклад не меньше\n\\[\n12\\cdot 10=120.\n\\]\nС другой стороны, этот же общий вклад можно посчитать по граням. Каждая грань икосаэдра является треугольником, то есть имеет ровно три вершины. Поэтому метка каждой грани попадает в общий счёт ровно три раза, по одному разу за каждую вершину этой грани. Сумма всех 20 меток равна 39, следовательно общий вклад равен\n\\[\n3\\cdot 39=117.\n\\]\nПолучили, что один и тот же общий счёт должен быть одновременно не меньше 120 и равен 117, что невозможно. Противоречие возникло из предположения, что у любых двух граней с общей вершиной метки различны. Следовательно, существуют две грани, имеющие общую вершину и одинаковую метку.",
