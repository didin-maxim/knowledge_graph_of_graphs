    }
  ],
  "solutions": [
    {
      "id": "sol-kedlaya-compressed",
      "title": "Решение двойным подсчётом инцидентностей",
      "text": "Предположим противное: никакие две грани с общей вершиной не имеют одинаковой метки. Тогда в каждой вершине икосаэдра сходятся пять граней, и их пять меток попарно различны. Так как метки неотрицательные целые, сумма меток граней, инцидентных любой фиксированной вершине, не меньше\n\\[\n0+1+2+3+4=10.\n\\]\nПросуммируем эти суммы по всем 12 вершинам. С одной стороны, получаем не меньше \\(12\\cdot 10=120\\). С другой стороны, каждая грань икосаэдра треугольная, поэтому её метка входит в этот общий счёт ровно три раза, по одному разу за каждую вершину грани. Следовательно, общий счёт равен\n\\[\n3\\cdot 39=117.\n\\]\nНеравенство \\(120\\le 117\\) невозможно. Значит, предположение было неверным, и две грани, имеющие общую вершину, действительно могут быть выбраны с одинаковой меткой.",
      "idea_ids": [
        "idea-count-at-vertices"
      ],
