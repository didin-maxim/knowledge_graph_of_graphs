        "text": "Рассмотрим гиперграф инцидентности правильного икосаэдра: его вершины соответствуют 12 вершинам икосаэдра, а 20 гиперрёбер соответствуют треугольным граням; каждое гиперребро содержит 3 вершины, и через каждую вершину гиперграфа проходят 5 гиперрёбер. Каждому гиперребру приписано неотрицательное целое число, сумма всех приписанных чисел равна 39. Докажите, что существуют два гиперребра с общей вершиной и одинаковой меткой.",
