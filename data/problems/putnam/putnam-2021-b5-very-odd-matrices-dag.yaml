    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Работая по модулю 2, поставим матрице \\(A\\) ориентированный граф на вершинах \\(1,\n\\ldots,n\\): диагональные единицы игнорируются, а при \\(i\\ne j\\) проводим дугу \\(i\\to j\\), если \\(a_{ij}=1\\) в \\(\\mathbb F_2\\). Условие нечётности всех главных определителей означает, что все главные подматрицы невырождены над \\(\\mathbb F_2\\). Докажите, что этот граф ацикличен, после чего матрица перестановочно подобна верхнетреугольной унипотентной матрице; значит, то же верно для всех степеней.",
