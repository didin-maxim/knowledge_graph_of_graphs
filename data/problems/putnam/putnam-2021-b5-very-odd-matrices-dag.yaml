  "solutions": [
    {
      "id": "sol-official-dag",
      "title": "Решение через DAG над \\(\\mathbb F_2\\)",
      "text": "Достаточно работать по модулю 2: нечётность определителя означает невырожденность соответствующей матрицы над \\(\\mathbb F_2\\). Из одноэлементных главных подматриц сразу следует, что все диагональные элементы \\(a_{ii}\\) равны 1 по модулю 2.\n\nПостроим ориентированный граф на вершинах \\(1,\n\\ldots,n\\), проводя дугу \\(i\\to j\\) при \\(i\\ne j\\) и \\(a_{ij}=1\\) в \\(\\mathbb F_2\\). Покажем, что циклов в нём нет. Предположим наоборот и возьмём ориентированный цикл минимальной длины \\(m\\) с вершинами \\(i_1,\n\\ldots,i_m\\) по порядку. Минимальность означает, что среди этих вершин нет лишних дуг, перескакивающих вперёд по циклу, иначе был бы более короткий ориентированный цикл. Поэтому в главной подматрице по множеству \\(S=\\{i_1,\n\\ldots,i_m\\}\\) каждая строка имеет единицу на диагонали и единицу в столбце следующей вершины цикла, а остальные возможные единицы, нужные для суммы строк, отсутствуют. Над \\(\\mathbb F_2\\) сумма всех строк этой подматрицы равна нулю, значит подматрица вырождена. Это противоречит тому, что все главные определители нечётны.\n\nСледовательно, полученный ориентированный граф является DAG. У DAG есть топологический порядок вершин. Переставим базис в соответствии с таким порядком; тогда все внедиагональные единицы матрицы окажутся строго по одну сторону от диагонали. Иными словами, существует перестановочная матрица \\(P\\), такая что \\(P^{-1}AP\\) по модулю 2 является унипотентной треугольной матрицей.\n\nСтепень унипотентной треугольной матрицы снова унипотентна и треугольна над \\(\\mathbb F_2\\). Любая её главная подматрица также треугольна с единицами на диагонали, поэтому имеет определитель 1 над \\(\\mathbb F_2\\). Возвращаясь к целым числам, это означает, что все главные определители \\(A^k\\) нечётны. Значит, \\(A^k\\) очень нечётна для всех \\(k\\ge1\\).",
