        "id": "stmt-original",
        "title": "Условие",
        "text": "Назовём целочисленную матрицу \\(A=(a_{ij})_{1\\le i,j\\le n}\\) размера \\(n\\times n\\) очень нечётной, если для всякого непустого множества \\(S\\subseteq\\{1,2,\n\\ldots,n\\}\\) главная подматрица \\((a_{ij})_{i,j\\in S}\\) имеет нечётный определитель. Докажите, что если \\(A\\) очень нечётна, то \\(A^k\\) очень нечётна для каждого \\(k\\ge 1\\).",
        "source_id": "src-putnam-2021-B5-official",
