  "solutions": [
    {
      "id": "sol-kedlaya-expanded",
      "title": "Стратегия через большую грань",
      "text": "Сначала докажем структурный факт: у полиэдра есть грань, ограниченная как минимум четырьмя ребрами. Действительно, предположим обратное, то есть все грани треугольные. Возьмем грань с вершинами \\(v_1,v_2,v_3\\). Из каждой вершины выходит ровно три ребра; кроме двух ребер этой грани из \\(v_1\\) выходит еще одно ребро, пусть к вершине \\(v_4\\). Так как ребра и грани образуют обычную связную полиэдральную структуру, три грани, соседние с исходным треугольником по его сторонам, вынужденно имеют вершины \\(v_1,v_2,v_4\\), \\(v_1,v_3,v_4\\) и \\(v_2,v_3,v_4\\). Тогда четыре вершины \\(v_1,v_2,v_3,v_4\\) уже образуют тетраэдр, то есть целую связную компоненту из четырех граней. Это невозможно, поскольку полиэдр связен и граней не меньше пяти. Значит, существует грань \\(A\\) с не менее чем четырьмя сторонами.\n\nТеперь первый игрок первым ходом подписывает \\(A\\). После первого хода второго игрока среди граней, соседних с \\(A\\) вдоль ее сторон, занята не более одна. В циклическом порядке вокруг \\(A\\) поэтому можно выбрать три подряд идущие свободные соседние грани \\(B,C,D\\). Первый игрок вторым ходом подписывает среднюю грань \\(C\\).\n\nГрани \\(A,B,C\\) имеют общую вершину: это вершина на границе \\(A\\), где соседние с \\(A\\) грани \\(B\\) и \\(C\\) встречаются. Аналогично \\(A,C,D\\) имеют общую вершину. После второго хода первого игрока у него есть две угрозы: на следующем ходу подписать \\(B\\) или подписать \\(D\\). Второй игрок одним ходом может занять не более одной из этих двух граней, поэтому по крайней мере одна остается свободной. Третьим ходом первый игрок подписывает оставшуюся из \\(B,D\\) и получает три свои грани с общей вершиной. Следовательно, первый игрок выигрывает.",
