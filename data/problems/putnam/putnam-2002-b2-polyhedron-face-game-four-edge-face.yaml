  "solutions": [
    {
      "id": "sol-kedlaya-expanded",
      "title": "Стратегия через большую грань",
      "text": "Будем пользоваться стандартной комбинаторной моделью выпуклого полиэдра: его скелет является связным плоским графом на сфере, каждая грань является многоугольником, каждое ребро лежит на границе ровно двух граней, а две разные грани имеют не более одного общего ребра. При условии задачи в каждой вершине сходятся ровно три ребра, значит в каждой вершине сходятся ровно три грани.\n\nСначала докажем, что есть грань с не менее чем четырьмя сторонами. Обозначим через \\(V,E,F\\) числа вершин, ребер и граней полиэдра. Из условия о трех ребрах в каждой вершине получаем по лемме о рукопожатиях \\(3V=2E\\). Предположим, что все грани треугольные. Тогда сумма длин границ всех граней равна \\(3F\\), но каждое ребро при таком счете учитывается дважды, поэтому \\(3F=2E\\). Формула Эйлера для связного полиэдра дает \\(V-E+F=2\\). Подставляя \\(V=2E/3\\) и \\(F=2E/3\\), получаем \\(2E/3-E+2E/3=2\\), то есть \\(E/3=2\\). Следовательно, \\(E=6\\) и \\(F=2E/3=4\\), что противоречит условию \\(F\\ge 5\\). Значит, не все грани треугольные; так как каждая грань имеет хотя бы три стороны, существует грань \\(A\\) с числом сторон \\(k\\ge 4\\).\n\nПервый игрок первым ходом подписывает эту грань \\(A\\). Рассмотрим грани, соседние с \\(A\\) вдоль ее сторон, в циклическом порядке обхода границы \\(A\\): \\(H_1,H_2,\\ldots,H_k\\). Они попарно различны, потому что две грани полиэдра не могут иметь две разные общие стороны. После первого хода второго игрока среди этих \\(k\\) граней занята не более одна: второй игрок сделал только один ход, и этот ход мог быть вообще не соседней с \\(A\\) гранью. В цикле длины \\(k\\ge 4\\) с не более чем одной занятой позицией всегда найдутся три подряд идущие свободные позиции. Действительно, если занятая соседняя грань есть, возьмем три следующие после нее грани в циклическом порядке; если среди соседей \\(A\\) ничего не занято, возьмем любые три подряд. Обозначим такие свободные соседние грани через \\(B,C,D\\), где \\(C\\) стоит между \\(B\\) и \\(D\\). Вторым ходом первый игрок подписывает \\(C\\).\n\nПокажем явно, какие две угрозы возникли. Пусть \\(B\\) и \\(C\\) примыкают к двум соседним сторонам грани \\(A\\). Эти две стороны имеют общий конец, и в этой вершине ровно три инцидентные грани: \\(A\\), \\(B\\), \\(C\\). Поэтому если первый игрок следующим ходом подпишет \\(B\\), то у него будут три подписанные грани с общей вершиной. Точно так же грани \\(A\\), \\(C\\), \\(D\\) имеют общую вершину на другом конце стороны, общей для \\(A\\) и \\(C\\); ход в \\(D\\) тоже сразу выигрышный.\n\nСвоим вторым ходом второй игрок не может немедленно выиграть: после этого хода у него будет всего две подписанные грани. Этим же ходом он может занять не более одной из двух граней \\(B\\) и \\(D\\). Следовательно, по крайней мере одна из них остается свободной. Третьим ходом первый игрок подписывает оставшуюся свободной грань из \\(B,D\\) и получает либо тройку \\(A,B,C\\), либо тройку \\(A,C,D\\) с общей вершиной. Значит, первый игрок выигрывает, причем не позднее своего третьего хода.",
