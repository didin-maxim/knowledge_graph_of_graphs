  "solutions": [
    {
      "id": "sol-f3-linear-algebra",
      "title": "Решение через суммы по граням над \\(\\mathbb F_3\\)",
      "text": "Отождествим три цвета с элементами поля \\(\\mathbb F_3\\). Для одной треугольной грани сумма цветов трёх её рёбер равна нулю ровно тогда, когда либо все три цвета одинаковы, либо все три различны. Поэтому требование «два ребра одного цвета, третье другого» эквивалентно тому, что сумма цветов на каждой грани ненулевая.\n\nПусть \\(E\\) — множество 30 рёбер, \\(F\\) — множество 20 граней. Рассмотрим линейное отображение \\(T:\\mathbb F_3^E\\to \\mathbb F_3^F\\), которое каждой раскраске ставит в соответствие вектор сумм цветов по граням. Нужно посчитать прообразы тех векторов в \\(\\mathbb F_3^F\\), у которых все 20 координат ненулевые.\n\nКлючевой шаг: \\(T\\) сюръективно. Один способ увидеть это — взять двойственный граф икосаэдра: его вершины — грани, соседство означает общее ребро. В двойственном графе есть гамильтонов путь по всем 20 граням. Последовательно задавая цвета общих рёбер вдоль такого пути, можно независимо управлять суммами на первых 19 гранях; зеркально выбранный второй путь даёт недостающую независимость. Эквивалентная локальная проверка: раскраска пяти рёбер вокруг вершины значениями \\(2,1,2,1,2\\) и нулями на остальных рёбрах даёт в образе вектор, ненулевой ровно на одной грани; по симметрии получаются все базисные векторы пространства граней.\n\nИтак, \\(T\\) сюръективно. Тогда по теореме о ранге и дефекте размерность ядра равна \\(30-20=10\\). Каждый вектор из \\(\\mathbb F_3^F\\) имеет ровно \\(3^{10}\\) прообразов. Векторов с ненулевыми координатами на всех 20 гранях ровно \\(2^{20}\\), поскольку в каждой координате можно выбрать один из двух ненулевых элементов \\(\\mathbb F_3\\). Поэтому число требуемых раскрасок равно \\(2^{20}3^{10}=61917364224\\).",
