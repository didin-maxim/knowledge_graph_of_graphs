  "solutions": [
    {
      "id": "sol-f3-linear-algebra",
      "title": "Решение через суммы по граням над \\(\\mathbb F_3\\)",
      "text": "Отождествим три цвета с элементами поля \\(\\mathbb F_3\\). Для трёх элементов поля сумма равна нулю ровно в двух случаях: либо все три элемента равны, либо они попарно различны. Действительно, если цвета на грани равны \\(a,b,c\\) и \\(a+b+c=0\\), то из \\(a=b\\) следует \\(c=a\\), а если равных пар нет, то три элемента поля уже равны \\(0,1,2\\) в некотором порядке. Обратное очевидно. Значит, условие «два ребра одного цвета, третье другого» эквивалентно требованию, что сумма цветов на каждой грани ненулевая.\n\nПусть \\(E\\) — множество 30 рёбер, \\(F\\) — множество 20 граней. Рассмотрим линейное отображение\n\\[\nT:\\mathbb F_3^E\\to \\mathbb F_3^F,\n\\]\nкоторое каждой раскраске ставит в соответствие вектор сумм цветов по граням. После предыдущего абзаца надо посчитать прообразы тех векторов из \\(\\mathbb F_3^F\\), у которых все 20 координат ненулевые.\n\nДокажем, что \\(T\\) сюръективно. Достаточно показать, что в образе лежит стандартный базисный вектор \\(e_f\\) для каждой грани \\(f\\). Зафиксируем грань \\(f\\) и одну из её вершин \\(v\\). Вокруг вершины \\(v\\) находятся ровно пять треугольных граней, циклически упорядоченных; среди них есть \\(f\\). Пронумеруем пять рёбер, выходящих из \\(v\\), в циклическом порядке так, чтобы грань \\(f\\) содержала первое и пятое из этих рёбер. Зададим вектор из \\(\\mathbb F_3^E\\): на этих пяти рёбрах поставим соответственно \\(2,1,2,1,2\\), а на всех остальных рёбрах поставим \\(0\\).\n\nТеперь посмотрим на суммы по граням. Только пять граней, проходящих через \\(v\\), могут получить ненулевую сумму, потому что остальные грани не содержат ни одного из пяти выбранных рёбер. Четыре грани между соседними парами рёбер с номерами \\((1,2),(2,3),(3,4),(4,5)\\) имеют суммы \\(2+1\\), \\(1+2\\), \\(2+1\\), \\(1+2\\), то есть все они равны \\(0\\) в \\(\\mathbb F_3\\). Оставшаяся грань \\(f\\), соответствующая паре \\((5,1)\\), имеет сумму \\(2+2=1\\). Поэтому построенный вектор переходит ровно в \\(e_f\\). Так как \\(f\\) была произвольной, все стандартные базисные векторы пространства \\(\\mathbb F_3^F\\) лежат в образе \\(T\\), значит \\(T\\) сюръективно.\n\nСледовательно, по теореме о ранге и дефекте размерность ядра равна \\(30-20=10\\). Каждый вектор из \\(\\mathbb F_3^F\\) имеет ровно \\(3^{10}\\) прообразов. Векторов с ненулевыми координатами на всех 20 гранях ровно \\(2^{20}\\), поскольку в каждой координате можно выбрать один из двух ненулевых элементов \\(\\mathbb F_3\\). Поэтому число требуемых раскрасок равно\n\\[\n2^{20}3^{10}=61917364224.\n\\]",
