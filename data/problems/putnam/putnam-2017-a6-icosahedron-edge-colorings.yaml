      "id": "idea-f3-face-sums",
      "title": "Условие на грань — ненулевой суммарный цвет в \\(\\mathbb F_3\\)",
      "text": "Если три цвета отождествить с элементами поля \\(\\mathbb F_3\\), то на треугольнике сумма цветов равна 0 ровно в двух запрещённых случаях: все три одинаковы или все три различны. Значит, хорошие раскраски — это раскраски, у которых сумма по каждой грани ненулевая.",
