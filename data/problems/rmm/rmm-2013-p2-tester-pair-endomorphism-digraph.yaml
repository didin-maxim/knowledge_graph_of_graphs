      "id": "idea-rigid-components",
      "title": "Жёсткие компоненты без гомоморфизмов между ними",
      "text": "Берём красные дуги \\(t\\to t+1\\), поэтому компоненты имеют вид \\(x+\\mathbb Z\\), \\(0\\le x<1\\). Синие дуги внутри компоненты сначала ставят единственный маркер скачка на три, который фиксирует начало компоненты, а затем блоками по три кодируют двоичные цифры параметра \\(x\\). Цветосохраняющий гомоморфизм обязан сохранить красный сдвиг, затем маркер, затем каждый блок, поэтому возможен только между одинаковыми компонентами и только тождественный.",
