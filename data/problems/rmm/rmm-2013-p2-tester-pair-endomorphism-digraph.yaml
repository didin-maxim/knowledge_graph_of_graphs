  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Графовое решение",
      "text": "Ответ: да; более того, можно выбрать обе функции биекциями. Сначала переведём условие на язык раскрашенных орграфов. Для заданных \\(g,h:\\mathbb R\\to\\mathbb R\\) проведём из каждой вершины \\(t\\) красную дугу \\(t\\to g(t)\\) и синюю дугу \\(t\\to h(t)\\). Равенства \\(f(g(t))=g(f(t))\\) и \\(f(h(t))=h(f(t))\\) означают ровно то, что \\(f\\) переводит красные дуги в красные, а синие в синие, то есть является эндоморфизмом этого раскрашенного орграфа. Поэтому достаточно построить такой граф на \\(\\mathbb R\\), у которого нет нетождественных эндоморфизмов.\n\nПоложим \\(g(t)=t+1\\). Тогда красные дуги разбивают \\(\\mathbb R\\) на множества \\(S_x=x+\\mathbb Z\\), где \\(0\\le x<1\\). Они будут компонентами. Для каждого \\(x\\in[0,1)\\) зафиксируем двоичную запись \\(x=0.x_1x_2\\ldots\\), выбирая для двоично-рациональных чисел ту запись, которая не оканчивается бесконечной цепочкой единиц. Определим \\(h\\) отдельно на каждом \\(S_x\\). При \\(n>3\\) положим \\(h(x-n)=x-n+1\\). Далее зададим маркер: \\(h(x-3)=x\\), \\(h(x)=x-2\\), \\(h(x-2)=x-1\\), \\(h(x-1)=x+1\\). Наконец, для каждого \\(i\\ge1\\) кодируем цифру \\(x_i\\) на тройке \\(x+3i-2,x+3i-1,x+3i\\). Если \\(x_i=0\\), кладём \\(h(x+3i-2)=x+3i-1\\), \\(h(x+3i-1)=x+3i\\), \\(h(x+3i)=x+3i+1\\). Если \\(x_i=1\\), кладём \\(h(x+3i-2)=x+3i\\), \\(h(x+3i)=x+3i-1\\), \\(h(x+3i-1)=x+3i+1\\). На каждой компоненте это перестановка множества \\(x+\\mathbb Z\\), значит \\(h\\) является биекцией \\(\\mathbb R\\) на себя.\n\nПроверим жёсткость. Рассмотрим произвольный цветосохраняющий гомоморфизм \\(\\varphi:S_x\\to S_y\\), где возможно \\(x=y\\). Из сохранения красных дуг \\(x+n\\to x+n+1\\) следует, что \\(\\varphi(x+n)=\\varphi(x)+n\\) для всех \\(n\\in\\mathbb Z\\). Так как образ лежит в \\(S_y\\), можно написать \\(\\varphi(x)=y+k\\) с целым \\(k\\), и тогда \\(\\varphi(x+n)=y+k+n\\). Теперь используем синий маркер. В компоненте есть дуга \\(x-3\\to x\\), то есть единственная синяя дуга, у которой конец на три больше начала. Её образ должен быть дугой \\(y+k-3\\to y+k\\), а такая дуга в \\(S_y\\) возможна только при \\(k=0\\). Следовательно, \\(\\varphi(x+n)=y+n\\) для всех \\(n\\).\n\nОстаётся сравнить закодированные цифры. Если \\(x_i=0\\), то в \\(S_x\\) есть синяя дуга \\(x+3i-2\\to x+3i-1\\); после применения \\(\\varphi\\) должна существовать дуга \\(y+3i-2\\to y+3i-1\\), что по построению эквивалентно \\(y_i=0\\). Если \\(x_i=1\\), тем же способом дуга \\(x+3i-2\\to x+3i\\) заставляет существовать дугу \\(y+3i-2\\to y+3i\\), то есть \\(y_i=1\\). Поэтому все двоичные цифры \\(x\\) и \\(y\\) совпадают, а значит \\(x=y\\), и найденный гомоморфизм является тождеством на \\(S_x\\).\n\nИтак, между разными компонентами гомоморфизмов нет, а всякий эндоморфизм отдельной компоненты тождественен. Любой эндоморфизм всего построенного раскрашенного орграфа переводит компоненту в некоторую компоненту, поэтому по доказанному фиксирует каждую компоненту и каждую её вершину. Следовательно, единственный эндоморфизм всего графа тождественный. Значит, для построенных биекций \\(g\\) и \\(h\\) всякая функция \\(f\\), коммутирующая с ними обеими, тождественна.",
