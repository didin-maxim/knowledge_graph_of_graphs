  "ideas": [
    {
      "id": "idea-commuting-endomorphism",
      "title": "Коммутирование равно эндоморфизму орграфа",
      "text": "Если провести из каждой вершины красную дугу \\(x\\to g(x)\\) и синюю дугу \\(x\\to h(x)\\), то условие \\(f\\circ g=g\\circ f\\) и \\(f\\circ h=h\\circ f\\) в точности означает, что \\(f\\) сохраняет дуги и их цвета, то есть является эндоморфизмом построенного раскрашенного орграфа.",
      "tags": [],
      "status": "needs_human_review"
    },
    {
      "id": "idea-rigid-components",
      "title": "Жёсткие компоненты без гомоморфизмов между ними",
      "text": "Дальше официальный графовый разбор строит компоненты, каждая из которых не имеет нетривиальных эндоморфизмов, а гомоморфизмов между разными компонентами тоже нет. Тогда любой эндоморфизм всего графа обязан фиксировать каждую компоненту и каждую вершину.",
      "tags": [
        "connectivity"
      ],
      "status": "needs_human_review"
    }
  ],
  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Сжатое официальное графовое решение",
      "text": "В третьем официальном решении задача целиком переводится в язык графов. Строится ориентированный граф на \\(\\mathbb R\\) с красной дугой \\(x\\to g(x)\\) и синей дугой \\(x\\to h(x)\\). Тогда функция \\(f\\) коммутирует с \\(g\\) и \\(h\\) тогда и только тогда, когда она является эндоморфизмом этого раскрашенного орграфа. Значит, нужно лишь построить граф без нетривиальных эндоморфизмов. Для этого пространство разбивается на компоненты специального вида: каждая компонентa кодируется своим параметром и устроена так, чтобы в ней имелся жёсткий маркер, фиксирующий начало, а дальнейшая структура однозначно восстанавливалась. Между различными компонентами гомоморфизмов нет. Следовательно, любой эндоморфизм фиксирует все компоненты и все вершины, то есть тождественен.",
