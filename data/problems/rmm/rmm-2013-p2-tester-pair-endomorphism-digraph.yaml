      "title": "Коммутирование равно эндоморфизму орграфа",
      "text": "Если провести из каждой вершины красную дугу \\(x\\to g(x)\\) и синюю дугу \\(x\\to h(x)\\), то условие \\(f\\circ g=g\\circ f\\) и \\(f\\circ h=h\\circ f\\) в точности означает, что \\(f\\) сохраняет дуги и их цвета, то есть является эндоморфизмом построенного раскрашенного орграфа.",
