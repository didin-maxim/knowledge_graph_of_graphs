        "text": "Требуется построить ориентированный граф с множеством вершин мощности континуум, рёбра которого раскрашены в красный и синий цвета, так что из каждой вершины выходит ровно одна красная и ровно одна синяя дуга. Эндоморфизмом такого графа называется отображение вершин в себя, сохраняющее оба цвета дуг. Докажите, что существует такой граф, у которого единственный эндоморфизм — тождественное отображение.",
