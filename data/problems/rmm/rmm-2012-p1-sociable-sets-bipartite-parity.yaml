  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Сжатое официальное решение",
      "text": "Официальное решение переводит задачу в двудольный граф знакомств. Рассматриваются пары множеств \\((X,Y)\\), где ни один мальчик из \\(X\\) не знаком ни с одной девочкой из \\(Y\\). Если фиксировать \\(X\\), то допустимые \\(Y\\) образуют все подмножества максимального множества девочек, разделённых с \\(X\\); число таких \\(Y\\) равно \\(2^{|Y_X|}\\) и нечётно только когда \\(Y_X=\\varnothing\\), то есть когда \\(X\\) покрывает всех девочек. Значит, общее число разделённых пар сравнимо по модулю 2 с числом покрывающих множеств мальчиков. Аналогично, если фиксировать \\(Y\\), получаем ту же величину по модулю 2 для покрывающих множеств девочек. Следовательно, обе мощности одной чётности.",
