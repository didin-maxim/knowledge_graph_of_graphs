  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Решение через разделённые пары",
      "text": "Построим двудольный граф знакомств: левая доля \\(L\\) — мальчики, правая доля \\(R\\) — девочки, ребро означает знакомство. Будем считать по модулю \\(2\\) число упорядоченных пар подмножеств \\((X,Y)\\), где \\(X\\subseteq L\\), \\(Y\\subseteq R\\), и между \\(X\\) и \\(Y\\) нет ни одного ребра.\n\nСначала зафиксируем \\(X\\subseteq L\\). Пусть \\(Y_X\\) — множество девочек, не знакомых ни с одним мальчиком из \\(X\\). Тогда условие отсутствия ребер между \\(X\\) и \\(Y\\) означает ровно, что \\(Y\\) можно выбрать произвольным подмножеством \\(Y_X\\). Значит, при данном \\(X\\) число подходящих \\(Y\\) равно \\(2^{|Y_X|}\\). По модулю \\(2\\) это число равно \\(1\\) только в случае \\(|Y_X|=0\\), а это как раз означает, что каждая девочка знакома хотя бы с одним мальчиком из \\(X\\), то есть \\(X\\) покрывающее. Если \\(|Y_X|>0\\), вклад равен \\(0\\) по модулю \\(2\\). Поэтому общее число таких разделённых пар сравнимо по модулю \\(2\\) с числом покрывающих множеств мальчиков.\n\nТеперь посчитаем те же самые пары наоборот, фиксируя \\(Y\\subseteq R\\). Пусть \\(X_Y\\) — множество мальчиков, не знакомых ни с одной девочкой из \\(Y\\). Для фиксированного \\(Y\\) можно выбрать \\(X\\) произвольно внутри \\(X_Y\\), так что вклад равен \\(2^{|X_Y|}\\). Он нечётен ровно тогда, когда \\(X_Y=\\varnothing\\), то есть когда \\(Y\\) покрывает всех мальчиков. Следовательно, то же самое общее число разделённых пар сравнимо по модулю \\(2\\) и с числом покрывающих множеств девочек.\n\nОдна и та же величина не может иметь две разные чётности. Значит, число покрывающих наборов мальчиков и число покрывающих наборов девочек имеют одинаковую чётность.",
