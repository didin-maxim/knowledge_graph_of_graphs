      "id": "idea-separated-pairs",
      "title": "Счёт пар разделённых множеств",
      "text": "Считаются упорядоченные пары \\((X,Y)\\), где набор мальчиков \\(X\\) и набор девочек \\(Y\\) не соединены ни одним ребром. Для фиксированного \\(X\\) число подходящих \\(Y\\) равно степени двойки и потому даёт вклад 1 по модулю 2 ровно тогда, когда \\(X\\) уже покрывающий.",
