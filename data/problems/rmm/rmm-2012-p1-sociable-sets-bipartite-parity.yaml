        "title": "Условие",
        "text": "Есть конечное число мальчиков и девочек. Набор мальчиков называется покрывающим, если каждая девочка знает хотя бы одного мальчика из этого набора; аналогично определяется покрывающий набор девочек. Докажите, что число покрывающих наборов мальчиков и число покрывающих наборов девочек одной чётности.",
