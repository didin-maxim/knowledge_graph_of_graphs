    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Пусть \\(G=(L,R,E)\\) — конечный двудольный граф. Подмножество \\(X\\subseteq L\\) назовём покрывающим, если каждая вершина из \\(R\\) имеет соседа в \\(X\\). Аналогично определяется покрывающее подмножество \\(Y\\subseteq R\\). Докажите, что число покрывающих подмножеств в \\(L\\) и число покрывающих подмножеств в \\(R\\) имеют одинаковую чётность.",
