  "ideas": [
    {
      "id": "idea-separated-pairs",
      "title": "Счёт пар разделённых множеств",
      "text": "Считаются упорядоченные пары \\((X,Y)\\), где набор мальчиков \\(X\\) и набор девочек \\(Y\\) не соединены ни одним ребром. Для фиксированного \\(X\\) число подходящих \\(Y\\) равно степени двойки и потому даёт вклад 1 по модулю 2 ровно тогда, когда \\(X\\) уже покрывающий.",
      "tags": [
        "double_counting"
      ],
      "status": "needs_human_review"
    },
    {
      "id": "idea-bipartite-symmetry",
      "title": "Симметрия двух долей",
      "text": "То же рассуждение работает и в обратную сторону: по симметрии двудольного графа одна и та же сумма по модулю 2 равна и числу покрывающих множеств мальчиков, и числу покрывающих множеств девочек.",
      "tags": [
        "graph_symmetry"
      ],
