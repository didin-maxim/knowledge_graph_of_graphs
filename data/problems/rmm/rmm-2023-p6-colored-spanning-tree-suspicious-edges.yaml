      "id": "idea-good-family-box",
      "title": "Выбираем хорошее семейство остовов",
      "text": "Рассматривается семейство остовов, для которого заданные числа \\(r,g,b\\) лежат внутри прямоугольной коробки между минимальными и максимальными цветовыми счётчиками по этому семейству.",
