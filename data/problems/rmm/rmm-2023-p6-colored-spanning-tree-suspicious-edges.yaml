  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Сжатое официальное решение",
      "text": "Официальное решение рассматривает хорошие семейства остовов: такие, в которых каждая из целевых величин \\(r,g,b\\) лежит между минимумом и максимумом соответствующего цветового счётчика по этому семейству. Выбирается хорошее семейство с минимальным числом подозрительных рёбер — рёбер, присутствующих лишь в части остовов семейства. Если нужного остова ещё нет, то одна из цветовых координат слишком мала на каком-то остове, а другая слишком велика на другом. В первом случае берут подозрительное зелёное ребро и заменяют его в каждом остове через ребро того же разреза из фиксированного эталонного остова; во втором — принудительно вставляют подозрительное красное ребро, удаляя подходящее ребро цикла. В обоих случаях получается новое хорошее семейство с меньшим числом подозрительных рёбер, что невозможно. Значит, нужный остов существует.",
