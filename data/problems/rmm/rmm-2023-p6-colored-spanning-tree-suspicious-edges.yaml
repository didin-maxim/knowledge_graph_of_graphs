    {
      "id": "idea-suspicious-edges",
      "title": "Минимизируем число подозрительных рёбер",
      "text": "Подозрительным называется ребро, которое содержится не во всех и не ни в одном остове семейства. Если выбрать хорошее семейство с минимальным числом подозрительных рёбер, то локальными заменами по циклу или по разрезу можно построить другое хорошее семейство с меньшим числом подозрительных рёбер — противоречие.",
