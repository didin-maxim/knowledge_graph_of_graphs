        "title": "Условие",
        "text": "Дан связный граф на \\(r+g+b+1\\) вершинах с красными, зелёными и синими рёбрами. звестно, что у него есть остов с ровно \\(r\\) красными рёбрами, остов с ровно \\(g\\) зелёными и остов с ровно \\(b\\) синими. Докажите, что существует остов, в котором одновременно ровно \\(r\\) красных, \\(g\\) зелёных и \\(b\\) синих рёбер.",
