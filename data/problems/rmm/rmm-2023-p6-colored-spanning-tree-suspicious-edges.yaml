  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Решение через подозрительные рёбра",
      "lemma_card_ids": [
        "colored-spanning-tree-good-family-exchange-lemma"
      ],
      "text": "Для остова \\(T\\) обозначим через \\(r(T),g(T),b(T)\\) числа красных, зелёных и синих рёбер. Для семейства остовов \\(\\mathcal C\\) положим, например,\n\\[\nr(\\mathcal C)=\\min_{T\\in\\mathcal C}r(T),\\quad R(\\mathcal C)=\\max_{T\\in\\mathcal C}r(T),\n\\]\nи тем же способом для зелёного и синего цветов. Назовём \\(\\mathcal C\\) хорошим, если\n\\[\nr\\in [r(\\mathcal C),R(\\mathcal C)],\\quad g\\in [g(\\mathcal C),G(\\mathcal C)],\\quad b\\in [b(\\mathcal C),B(\\mathcal C)].\n\\]\nСемейство всех остовов хорошее по условию задачи. Ребро назовём подозрительным для \\(\\mathcal C\\), если оно входит хотя бы в один, но не во все остовы из \\(\\mathcal C\\). Выберем хорошее семейство \\(\\mathcal C\\) с минимальным числом подозрительных рёбер.\n\nЕсли в \\(\\mathcal C\\) уже есть остов с \\((r,g,b)\\), всё доказано. Иначе, так как каждый остов имеет ровно \\(r+g+b\\) рёбер, у каких-то цветов целевое число достигается снизу и сверху не одновременно. Переименовав цвета, можно считать, что\n\\[\nr(\\mathcal C)<r,\\qquad G(\\mathcal C)>g.\n\\]\nТак как \\(\\mathcal C\\) хорошее, остаются два случая: \\(B(\\mathcal C)=b\\) или \\(B(\\mathcal C)>b\\).\n\nСлучай 1: \\(B(\\mathcal C)=b\\). Возьмём остов \\(T_0\\in\\mathcal C\\) с \\(g(T_0)=g(\\mathcal C)\\le g\\). Поскольку \\(G(\\mathcal C)>g\\), в некотором остове семейства зелёных рёбер больше, чем в \\(T_0\\); значит существует зелёное ребро \\(e\\), входящее в какой-то остов из \\(\\mathcal C\\), но не входящее в \\(T_0\\). Это ребро подозрительно.\n\nДля каждого \\(T\\in\\mathcal C\\) построим новый остов \\(T'\\). Если \\(e\\notin T\\), положим \\(T'=T\\). Если \\(e\\in T\\), то граф \\(T\\setminus\\{e\\}\\) распадается на две компоненты. Рассмотрим соответствующий разрез между этими компонентами. Остов \\(T_0\\) связен, поэтому содержит ребро \\(e'\\), пересекающее этот разрез. Такое \\(e'\\) не принадлежит \\(T\\setminus\\{e\\}\\), иначе две компоненты уже были бы соединены; значит \\(T\\setminus\\{e\\}\\cup\\{e'\\}\\) снова остов. Кроме того, \\(e'\\in T_0\\) и \\(e'\\notin T\\), поэтому \\(e'\\) подозрительно для старого семейства. Положим \\(T'=T\\setminus\\{e\\}\\cup\\{e'\\}\\).\n\nПусть \\(\\mathcal C'=\\{T':T\\in\\mathcal C\\}\\). Новых подозрительных рёбер не появилось: каждое добавленное \\(e'\\) уже было подозрительным, а рёбра, которые раньше входили во все остовы или ни в один, не могут стать частичными из-за такой замены. При этом ребро \\(e\\) теперь не входит ни в один остов \\(\\mathcal C'\\), значит число подозрительных рёбер строго уменьшилось.\n\nОсталось проверить, что \\(\\mathcal C'\\) хорошее. Каждый изменённый остов получается удалением зелёного ребра и добавлением одного ребра произвольного цвета. Поэтому\n\\[\ng(\\mathcal C')\\le g(\\mathcal C)\\le g,\n\\quad G(\\mathcal C')\\ge G(\\mathcal C)-1\\ge g,\n\\]\n\\[\nr(\\mathcal C')\\le r(\\mathcal C)+1\\le r,\n\\quad R(\\mathcal C')\\ge R(\\mathcal C)\\ge r.\n\\]\nСиних рёбер при удалении зелёного ребра не становится меньше, так что \\(B(\\mathcal C')\\ge B(\\mathcal C)=b\\). А остов \\(T_0\\) не меняется и лежит в \\(\\mathcal C'\\), поэтому \\(b(\\mathcal C')\\le b(T_0)\\le B(\\mathcal C)=b\\). Значит \\(\\mathcal C'\\) хорошее, что противоречит минимальности \\(\\mathcal C\\).\n\nСлучай 2: \\(B(\\mathcal C)>b\\). Возьмём остов \\(T_0\\in\\mathcal C\\) с \\(r(T_0)=R(\\mathcal C)\\ge r\\). Так как \\(r(\\mathcal C)<r\\), в \\(T_0\\) есть красное ребро \\(e\\), отсутствующее в некотором другом остове семейства; фиксируем такое подозрительное красное ребро.\n\nДля каждого \\(T\\in\\mathcal C\\) построим \\(T''\\). Если \\(e\\in T\\), оставим \\(T''=T\\). Если \\(e\\notin T\\), то \\(T\\cup\\{e\\}\\) содержит единственный цикл, проходящий через \\(e\\). Этот цикл не может целиком лежать в \\(T_0\\), иначе \\(T_0\\) содержал бы цикл; значит на нём есть ребро \\(e'\\notin T_0\\). Оно принадлежит \\(T\\), поэтому старое семейство содержит \\(e'\\) не во всех остовах: \\(e'\\) подозрительно. Удаляя из цикла \\(e'\\), получаем остов\n\\[\nT''=T\\setminus\\{e'\\}\\cup\\{e\\}.\n\\]\nПусть \\(\\mathcal C''=\\{T'':T\\in\\mathcal C\\}\\). Как и раньше, новые подозрительные рёбра не появляются, потому что удаляемые \\(e'\\) уже были подозрительными, а ребро \\(e\\) теперь входит во все остовы \\(\\mathcal C''\\). Поэтому подозрительных рёбер стало меньше.\n\nПроверим хорошесть. Каждый изменённый остов получается добавлением красного ребра и удалением одного ребра произвольного цвета. Следовательно\n\\[\nr(\\mathcal C'')\\le r(\\mathcal C)+1\\le r,\n\\quad R(\\mathcal C'')\\ge R(\\mathcal C)\\ge r,\n\\]\n\\[\ng(\\mathcal C'')\\le g(\\mathcal C)\\le g,\n\\quad G(\\mathcal C'')\\ge G(\\mathcal C)-1\\ge g,\n\\]\n\\[\nb(\\mathcal C'')\\le b(\\mathcal C)\\le b,\n\\quad B(\\mathcal C'')\\ge B(\\mathcal C)-1\\ge b.\n\\]\nЗначит \\(\\mathcal C''\\) тоже хорошее, снова противоречие минимальному выбору \\(\\mathcal C\\). Оба случая невозможны, следовательно в выбранном хорошем семействе обязан быть остов с ровно \\(r\\) красными, \\(g\\) зелёными и \\(b\\) синими рёбрами.",
