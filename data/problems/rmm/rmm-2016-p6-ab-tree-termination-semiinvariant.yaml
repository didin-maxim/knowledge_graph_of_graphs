  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Строго убывающий потенциал на двудольных деревьях",
      "text": "Зафиксируем конечное множество точек и будем рассматривать только деревья на этих же вершинах. Таких деревьев конечное число, поэтому достаточно найти числовой потенциал, который строго уменьшается при каждой допустимой замене.\n\nДля ребра \\(e=AB\\) дерева \\(T\\), где \\(A\\in A\\), \\(B\\in B\\), удалим \\(e\\). Получатся две компоненты; обозначим через \\(p_T(e)\\) число вершин доли \\(A\\) в той компоненте, которая содержит конец \\(A\\) ребра \\(e\\). Введём\n\\[\nf(T)=\\sum_{e=AB} p_T(e)\\,|AB|,\n\\]\nгде \\(|AB|\\) — евклидова длина соответствующего отрезка.\n\nРассмотрим один допустимый шаг. В дереве есть путь \\(A_1B_1A_2B_2\\), удаляется ребро \\(A_1B_1\\) и добавляется ребро \\(A_1B_2\\). Пусть \\(p=p_T(A_1B_1)\\). Если разрезать дерево по ребру \\(A_1B_1\\), то ровно \\(p\\) вершин доли \\(A\\) лежат по сторону \\(A_1\\). При замене все рёбра вне локального пути дают в сумме тот же вклад: их длины не меняются, а изменение выбранной \\(A\\)-стороны компенсируется попарно. Остаётся локальный вклад четырёх отрезков из пути и нового ребра; прямой подсчёт коэффициентов даёт\n\\[\nf(T')-f(T)=p\\bigl(|A_1B_2|+|A_2B_1|-|A_1B_1|-|A_2B_2|\\bigr).\n\\]\nИменно неравенство из условия разрешённой операции утверждает, что выражение в скобках отрицательно. Кроме того, \\(p>0\\), потому что компонентa содержит вершину \\(A_1\\). Следовательно, \\(f(T')<f(T)\\) при каждом шаге.\n\nБесконечная последовательность операций теперь невозможна: она дала бы бесконечную последовательность различных состояний со строго убывающими значениями \\(f\\), но возможных двудольных деревьев на фиксированном конечном множестве вершин только конечное число. Значит, любой процесс преобразований обязательно останавливается.\n\nЛокальная формула для \\(f(T')-f(T)\\) переписана из официального решения; карточка всё ещё требует ручной проверки исходного геометрического условия и ориентации коэффициентов.",
