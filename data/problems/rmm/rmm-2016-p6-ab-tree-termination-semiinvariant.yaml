        "text": "Дано конечное двудольное дерево, вершины которого разбиты на доли \\(A\\) и \\(B\\) и расположены как точки в евклидовом пространстве; длина ребра равна евклидову расстоянию между его концами. Разрешена операция: если в дереве есть путь \\(A_1-B_1-A_2-B_2\\) и \\(|A_1B_2|+|A_2B_1|<|A_1B_1|+|A_2B_2|\\), удалить ребро \\(A_1B_1\\) и добавить ребро \\(A_1B_2\\), снова получая двудольное дерево на тех же вершинах. Докажите, что любая последовательность таких допустимых операций конечна.",
