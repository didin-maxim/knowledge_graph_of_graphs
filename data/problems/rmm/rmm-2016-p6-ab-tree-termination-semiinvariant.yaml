        "title": "Условие",
        "text": "Множество точек в пространстве разбито на две доли \\(A\\) и \\(B\\). AB-дерево состоит из \\(n-1\\) отрезков, каждый соединяет точку из \\(A\\) с точкой из \\(B\\), и замкнутых ломаных нет. Разрешено локально заменять ребро \\(A_1B_1\\) на \\(A_1B_2\\), если вдоль пути \\(A_1B_1A_2B_2\\) выполняется неравенство длин. Докажите, что любой процесс таких преобразований конечен.",
