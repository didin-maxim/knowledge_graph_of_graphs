  "ideas": [
    {
      "id": "idea-cut-weight-potential",
      "title": "Вес ребра умножается на размер своей A-стороны",
      "text": "Для каждого ребра \\(e\\) после его удаления смотрим на компоненту, содержащую его конец из \\(A\\), и считаем число вершин \\(A\\) в этой компоненте. Сумма \\(\\sum p_T(e)\\,|e|\\) по всем рёбрам оказывается естественным потенциалом.",
      "tags": [
        "trees"
      ],
      "status": "needs_human_review"
    },
    {
      "id": "idea-local-exchange-decreases",
      "title": "Локальная замена уменьшает потенциал",
      "text": "При замене \\(A_1B_1\\to A_1B_2\\) изменяются только коэффициенты у трёх рёбер локальной конфигурации. После подстановки получается множитель \\(p_T(A_1B_1)\\bigl(|A_1B_2|+|A_2B_1|-|A_1B_1|-|A_2B_2|\\bigr)<0\\).",
      "tags": [
        "extremal_choice"
      ],
      "status": "needs_human_review"
    }
  ],
  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Сжатое официальное решение",
      "text": "Официальное решение забывает почти всю геометрию и рассматривает конфигурацию как двудольное дерево. Для ребра \\(e\\) обозначим через \\(p_T(e)\\) число вершин доли \\(A\\) в компоненте дерева \\(T-e\\), содержащей конец ребра из \\(A\\). Вводится потенциал \\(f(T)=\\sum_e p_T(e)|e|\\). При одном разрешённом преобразовании меняются только три локальных коэффициента, и прямой расчёт даёт \\(f(T')-f(T)=p_T(A_1B_1)(|A_1B_2|+|A_2B_1|-|A_1B_1|-|A_2B_2|)<0\\). Значит, каждый шаг строго уменьшает потенциал. Поскольку двудольных деревьев на данном конечном множестве вершин лишь конечное число, бесконечный процесс невозможен.",
