  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Строго убывающий потенциал на двудольных деревьях",
      "text": "Зафиксируем конечное множество точек и будем рассматривать только деревья на этих же вершинах. Таких деревьев конечное число, поэтому достаточно найти числовой потенциал, который строго уменьшается при каждой допустимой замене.\n\nДля ребра \\(e=AB\\) дерева \\(T\\), где \\(A\\) -- вершина доли \\(A\\), а \\(B\\) -- вершина доли \\(B\\), удалим \\(e\\). Получатся две компоненты; обозначим через \\(p_T(e)\\) число вершин доли \\(A\\) в той компоненте, которая содержит конец \\(A\\) ребра \\(e\\). Введём\n\\[\nf(T)=\\sum_{e=AB} p_T(e)\\,|AB|,\n\\]\nгде \\(|AB|\\) -- евклидова длина соответствующего отрезка.\n\nРассмотрим один допустимый шаг. В дереве \\(T\\) есть путь \\(A_1B_1A_2B_2\\), удаляется ребро \\(A_1B_1\\) и добавляется ребро \\(A_1B_2\\); новое дерево обозначим \\(T'\\). После удаления трёх старых рёбер локального пути \\(A_1B_1\\), \\(A_2B_1\\), \\(A_2B_2\\) дерево распадается на четыре подвешенные части при вершинах \\(A_1,B_1,A_2,B_2\\). Пусть числа вершин доли \\(A\\) в этих частях равны соответственно \\(a,b,c,d\\). Тогда \\(a=p_T(A_1B_1)>0\\).\n\nВсе рёбра, лежащие внутри одной из четырёх подвешенных частей, имеют тот же коэффициент \\(p\\) до и после замены: если при удалении такого ребра выбранная сторона не содержит точку прикрепления части, снаружи вообще ничего не важно; если содержит, то снаружи остаётся то же самое число вершин доли \\(A\\). Поэтому достаточно сравнить коэффициенты только у трёх старых локальных рёбер и нового ребра.\n\nВ дереве \\(T\\) коэффициенты этих трёх рёбер равны\n\\[\np_T(A_1B_1)=a,\n\\quad p_T(A_2B_1)=c+d,\n\\quad p_T(A_2B_2)=a+b+c.\n\\]\nДействительно, например, после удаления \\(A_2B_1\\) компонента с концом \\(A_2\\) содержит части при \\(A_2\\) и \\(B_2\\), то есть \\(c+d\\) вершин доли \\(A\\). В новом дереве \\(T'\\), где вместо \\(A_1B_1\\) стоит \\(A_1B_2\\), соответствующие коэффициенты равны\n\\[\np_{T'}(A_1B_2)=a,\n\\quad p_{T'}(A_2B_1)=a+c+d,\n\\quad p_{T'}(A_2B_2)=b+c.\n\\]\nСледовательно,\n\\[\n\\begin{aligned}\nf(T')-f(T)\n&=a|A_1B_2|+(a+c+d)|A_2B_1|+(b+c)|A_2B_2|\\\\\n&\\quad{}-a|A_1B_1|-(c+d)|A_2B_1|-(a+b+c)|A_2B_2|\\\\\n&=a\\bigl(|A_1B_2|+|A_2B_1|-|A_1B_1|-|A_2B_2|\\bigr).\n\\end{aligned}\n\\]\nИменно неравенство из условия разрешённой операции утверждает, что выражение в скобках отрицательно. Так как \\(a>0\\), получаем \\(f(T')<f(T)\\).\n\nБесконечная последовательность операций невозможна: она дала бы бесконечную последовательность переходов между конечным числом возможных двудольных деревьев на фиксированном множестве вершин, причём значение \\(f\\) на каждом шаге строго уменьшалось бы. В конечном множестве состояний нельзя бесконечно долго двигаться со строгим убыванием числового потенциала. Значит, любой процесс преобразований обязательно останавливается.",
