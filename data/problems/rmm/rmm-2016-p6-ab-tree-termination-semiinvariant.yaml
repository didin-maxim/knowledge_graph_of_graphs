        "title": "Условие",
        "text": "Дано \\(n\\) точек в евклидовом пространстве, никакие четыре из них не лежат в одной плоскости; множество точек разбито на доли \\(A\\) и \\(B\\). AB-дерево состоит из \\(n-1\\) отрезков, каждый соединяет точку из \\(A\\) с точкой из \\(B\\), и замкнутых ломаных нет. Разрешена операция: если в дереве есть три ребра \\(A_1B_1\\), \\(B_1A_2\\), \\(A_2B_2\\), где \\(A_1,A_2\\in A\\), \\(B_1,B_2\\in B\\), и \\(|A_1B_1|+|A_2B_2|>|A_1B_2|+|A_2B_1|\\), то удаляют ребро \\(A_1B_1\\) и заменяют его ребром \\(A_1B_2\\). Докажите, что любой процесс таких преобразований конечен.",
