      "id": "idea-cut-weight-potential",
      "title": "Вес ребра умножается на размер своей A-стороны",
      "text": "Для каждого ребра \\(e\\) после его удаления смотрим на компоненту, содержащую его конец из \\(A\\), и считаем число вершин \\(A\\) в этой компоненте. Сумма \\(\\sum p_T(e)\\,|e|\\) по всем рёбрам оказывается естественным потенциалом.",
      "tags": [
        "trees"
      ],
      "status": "needs_human_review"
    },
    {
      "id": "idea-local-exchange-decreases",
      "title": "Локальная замена уменьшает потенциал",
      "text": "При замене \\(A_1B_1\\to A_1B_2\\) изменяются только коэффициенты у трёх рёбер локальной конфигурации. После подстановки получается множитель \\(p_T(A_1B_1)\\bigl(|A_1B_2|+|A_2B_1|-|A_1B_1|-|A_2B_2|\\bigr)<0\\).",
