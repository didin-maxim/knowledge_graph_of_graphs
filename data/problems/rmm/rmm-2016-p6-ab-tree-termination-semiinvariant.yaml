        "text": "Дано двудольное дерево с долями \\(A\\) и \\(B\\) и локальная операция замены ребра вдоль пути \\(A_1-B_1-A_2-B_2\\). Нужно доказать, что любой допустимый процесс таких обменов на конечном множестве вершин обязательно остановится.",
