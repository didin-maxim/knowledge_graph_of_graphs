  "ideas": [
    {
      "id": "idea-sticks-incidence-graph",
      "title": "Горизонтальные и вертикальные палочки образуют двудольный граф",
      "text": "Берутся максимальные горизонтальные и вертикальные палочки, возникающие после разрезания по всем линиям сетки. Клетка решета задаёт ребро между двумя палочками, которые в ней пересекаются.",
      "tags": [
        "matching"
      ],
      "status": "needs_human_review"
    },
    {
      "id": "idea-hall-cells",
      "title": "Совершенное паросочетание выбирает попарно несовместимые клетки",
      "text": "Если в построенном двудольном графе выполнено условие Холла, то существует паросочетание размера \\(2n-2\\). Соответствующие клетки лежат в разных палочках, поэтому никакая палочка не может покрыть две из них; отсюда сразу следует нижняя оценка на число палочек.",
      "tags": [
        "matching"
      ],
      "status": "needs_human_review"
    }
  ],
  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Сжатое официальное графовое решение",
      "text": "В третьем официальном решении нижняя оценка \\(m(A)\\ge 2n-2\\) доказывается графом инцидентности. В одну долю ставятся максимальные горизонтальные палочки, в другую — максимальные вертикальные, а каждая клетка даёт ребро между двумя палочками, проходящими через неё. Достаточно выбрать \\(2n-2\\) клеток так, чтобы никакие две не лежали в одной палочке; это ровно соответствует паросочетанию размера \\(2n-2\\). Остаётся проверить условие Холла для подмножества горизонтальных палочек: через анализ крайних столбцов и дополнения множества показывается, что число соседей не меньше размера самого множества. Поэтому существует совершенное паросочетание между двумя долями размера \\(2n-2\\), и требуемая нижняя оценка доказана. Верхняя оценка достигается тривиальным разрезанием по всем горизонтальным или всем вертикальным линиям.",
