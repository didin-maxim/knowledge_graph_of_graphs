        ]
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "После фиксации разбиения на палочки рассматриваются максимальные горизонтальные и вертикальные отрезки, а клетки задают рёбра инцидентности между ними. Нужно показать, что в этом двудольном графе есть паросочетание размера \\(2n-2\\).",
