        "id": "stmt-original",
        "title": "Условие",
        "text": "Решетом называется доска \\(n\\times n\\), из которой удалено ровно по одной клетке в каждой строке и каждом столбце. Палочка — это прямоугольник \\(1\\times k\\) или \\(k\\times1\\). Для данного решета \\(A\\) обозначим через \\(m(A)\\) минимальное число палочек, на которые можно разбить все его клетки. Найдите все возможные значения \\(m(A)\\).",
        "source_id": "src-rmm-2017-official",
        "status": "needs_human_review",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [],
        "distinct_from": [
