  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Графовое решение с проверкой Холла",
      "text": "Ответ: единственное возможное значение равно \\(2n-2\\). Верхняя оценка получается сразу: если разрезать решето на максимальные горизонтальные палочки, то в строке с удалённой крайней клеткой получается одна палочка, а в каждой из остальных \\(n-2\\) строк — две; всего \\(2n-2\\). Значит, \\(m(A)\\le 2n-2\\). Докажем обратную оценку графовым способом из третьего доказательства. Достаточно найти \\(2n-2\\) клеток решета, никакие две из которых не могут лежать в одной палочке: тогда любому разбиению понадобится по крайней мере столько палочек. Рассмотрим двудольный граф \\(G\\). В левую долю \\(G_h\\) поместим все максимальные горизонтальные палочки, получающиеся в строках решета, а в правую долю \\(G_v\\) — все максимальные вертикальные палочки. В каждой доле ровно \\(2n-2\\) вершин: например, горизонтальных палочек по одной в строках, где дырка стоит в крайнем столбце, и по две в остальных строках; так как в первом и последнем столбцах по одной дырке, всего получается \\(2+(n-2)\\cdot2=2n-2\\). Каждая не удалённая клетка задаёт ребро между горизонтальной и вертикальной максимальными палочками, проходящими через неё. Паросочетание, покрывающее \\(G_h\\), выберет \\(2n-2\\) клеток, причём никакие две не будут иметь общую горизонтальную или вертикальную максимальную палочку, а значит, не смогут попасть в одну палочку какого-либо разбиения. Проверим условие Холла для левой доли. Пусть \\(S\\subseteq G_h\\). Обозначим через \\(L\\) палочки из \\(S\\), содержащие клетку в первом столбце, а через \\(R\\) — палочки из \\(S\\), содержащие клетку в последнем столбце. Эти два множества разбивают \\(S\\), потому что в каждой строке ровно одна дырка, и каждая максимальная горизонтальная палочка лежит либо слева от дырки, либо справа от неё. Пусть \\(l\\) — длина самой длинной палочки из \\(L\\), а \\(r\\) — длина самой длинной палочки из \\(R\\); если соответствующее множество пусто, берём длину \\(0\\). В \\(L\\) не может быть двух палочек одинаковой длины: длина левой палочки равна номеру столбца с дыркой минус \\(1\\), а дырки стоят в разных столбцах. Поэтому \\(l\\ge |L|\\). Тем же рассуждением \\(r\\ge |R|\\), и значит \\(l+r\\ge |S|\\). Если \\(l+r\\le n\\), то клетки самой длинной левой палочки занимают первые \\(l\\) столбцов, а клетки самой длинной правой — последние \\(r\\) столбцов; эти столбцы не пересекаются. Соответствующие \\(l+r\\) вертикальных максимальных палочек являются соседями \\(S\\), поэтому \\(|N(S)|\\ge l+r\\ge |S|\\). Остаётся случай \\(l+r>n\\). Тогда палочки из \\(S\\) вместе задевают все \\(n\\) столбцов, откуда уже \\(|N(S)|\\ge n\\). Если \\(|S|\\le n\\), условие Холла снова выполнено. Пусть теперь \\(|S|>n\\). Положим \\(T=N(S)\\subseteq G_v\\), \\(S'=G_h\\setminus S\\), \\(T'=G_v\\setminus T\\). Так как \\(|T|\\ge n\\), имеем \\(|T'|\\le (2n-2)-n=n-2\\). Применим уже доказанную часть того же рассуждения к транспонированному решету, то есть к множеству вертикальных палочек \\(T'\\): для любого множества размера не больше \\(n\\) число его горизонтальных соседей не меньше его размера. Все горизонтальные соседи \\(T'\\) лежат в \\(S'\\), иначе такая вершина соединяла бы \\(S\\) с вертикальной палочкой не из \\(T\\). Следовательно, \\(|T'|\\le |S'|\\). Поскольку \\(|G_h|=|G_v|=2n-2\\), из этого следует \\(|S|\\le |T|=|N(S)|\\). Условие Холла выполнено для всех \\(S\\subseteq G_h\\), значит, существует паросочетание, покрывающее \\(G_h\\); из равенства размеров долей оно является совершенным. Соответствующие \\(2n-2\\) клетки попарно не лежат на одной максимальной горизонтальной или вертикальной палочке, поэтому никакая палочка не может покрыть две из них. Значит, \\(m(A)\\ge 2n-2\\), и вместе с верхней оценкой получаем \\(m(A)=2n-2\\) для любого решета \\(A\\).",
