  "solutions": [
    {
      "id": "sol-official-averaging-and-quadrants",
      "title": "Усреднение и обход четырех квадрантов",
      "text": "Ответ: \\(2n+2\\).\n\nПоложим \\(m=4n+2\\). Пронумеруем строки сверху вниз, а столбцы слева направо. По симметрии можно считать, что черепаха начинает в правой верхней угловой клетке. Пусть \\(r_i\\) - число входов в строку \\(i\\), а \\(c_j\\) - число входов в столбец \\(j\\). Вертикальный ход всегда дает один вход в новую строку, горизонтальный ход - один вход в новый столбец.\n\nЗа полный замкнутый обход черепаха делает ровно \\(m^2\\) ходов: она входит в \\(m^2-1\\) новых клеток и последним ходом возвращается в начальную клетку. Каждый ход учитывается ровно один раз, либо как вход в строку, либо как вход в столбец. Поэтому\n\\[\nr_1+\\cdots+r_m+c_1+\\cdots+c_m=m^2.\n\\]\nЭтих чисел \\(2m\\), значит их среднее равно \\(m^2/(2m)=m/2=2n+1\\).\n\nПокажем, что все \\(2m\\) чисел не могут быть равны. Рассмотрим первый столбец. Войти в столбец 1 можно только из столбца 2. Так как обход замкнутый, каждому такому входу соответствует следующий выход из столбца 1 в столбец 2; следовательно, число входов в столбец 2 из столбца 1 равно \\(c_1\\). Кроме того, черепаха посещает клетки по обе стороны границы между столбцами 2 и 3 и ее путь замкнут, поэтому она хотя бы один раз пересекает эту границу из столбца 3 в столбец 2. Значит, у столбца 2 есть все входы из столбца 1, а также хотя бы один дополнительный вход из столбца 3, то есть \\(c_2>c_1\\).\n\nИтак, числа \\(r_i,c_j\\) не все равны. При среднем значении \\(2n+1\\) хотя бы одно из них строго больше среднего, а поскольку все они целые, оно не меньше \\(2n+2\\). Это доказывает, что в любом обходе найдется строка или столбец с как минимум \\(2n+2\\) входами.\n\nОсталось построить обход, в котором ни одна строка и ни один столбец не имеют больше \\(2n+2\\) входов. Обозначим \\(q=2n+1\\) и разобьем доску на четыре квадранта размера \\(q\\times q\\): \\(A\\) - верхний левый, \\(B\\) - верхний правый, \\(C\\) - нижний левый, \\(D\\) - нижний правый.\n\nНачнем в правом верхнем углу квадранта \\(B\\). Сначала сделаем шаг вниз, затем змейкой пройдем строки \\(B\\) со второй до последней: вторую строку справа налево, третью слева направо, и так далее, каждый раз переходя на одну строку ниже. Так как \\(q\\) нечетно, после прохождения строк \\(2,3,\\ldots,q\\) квадранта \\(B\\) мы окажемся в его правом нижнем углу.\n\nЗатем перейдем вниз в \\(D\\) и пройдем \\(D\\) змейкой по столбцам, двигаясь после каждого столбца на один столбец влево; конец будет в левом нижнем углу \\(D\\). После этого перейдем влево в \\(C\\) и пройдем \\(C\\) змейкой по строкам снизу вверх, с переходом на одну строку выше после каждой строки; конец будет в левом верхнем углу \\(C\\). Далее перейдем вверх в \\(A\\) и пройдем \\(A\\) змейкой по столбцам, каждый раз сдвигаясь на один столбец вправо; конец будет в правом верхнем углу \\(A\\). Наконец, перейдем вправо в \\(B\\) и пройдем верхнюю строку \\(B\\) слева направо, возвращаясь в исходную клетку.\n\nЭтот маршрут посещает каждую клетку ровно один раз до возвращения в начало: в \\(B\\) сначала пройдены все строки, кроме верхней, а верхняя строка \\(B\\) пройдена в самом конце; квадранты \\(D,C,A\\) пройдены целиком своими змейками. Все соседние фрагменты стыкуются по общей стороне, поэтому получается гамильтонов цикл клеточного графа.\n\nПроверим число входов. Каждая верхняя строка всей доски получает не более одного вертикального входа при строковой змейке в \\(B\\) и не более одного входа из каждого из \\(q\\) столбцов при столбцовой змейке в \\(A\\). Значит, в такую строку входят не более \\(q+1=2n+2\\) раз. Каждая нижняя строка получает не более одного входа при строковой змейке в \\(C\\) и не более \\(q\\) входов при столбцовой змейке в \\(D\\), снова всего не более \\(q+1\\).\n\nДля столбцов рассуждение такое же с поменянными ролями строк и столбцов. Каждый левый столбец получает не более \\(q\\) горизонтальных входов во время строковой змейки в \\(C\\) и не более одного входа при переходах между соседними столбцами в столбцовой змейке \\(A\\). Каждый правый столбец получает не более \\(q\\) горизонтальных входов во время строковой змейки в \\(B\\) и не более одного входа при столбцовой змейке \\(D\\). Поэтому в построенном обходе все числа \\(r_i,c_j\\) не превосходят \\(q+1=2n+2\\).\n\nМы доказали, что \\(2n+2\\) всегда гарантируется, а приведенный обход показывает, что большего гарантировать нельзя. Следовательно, наибольшее возможное значение \\(k\\) равно \\(2n+2\\).",
