      {
        "id": "stmt-graph",
        "text": "Пусть \\(m=4n+2\\), и пусть \\(G\\) - граф решетки \\(m\\times m\\), вершинами которого являются клетки доски \\(m\\times m\\), а ребра соединяют клетки с общей стороной. Гамильтонов цикл в \\(G\\) проходится, начиная с угловой вершины. Для каждого направленного ребра обхода: если оно идет вертикально в строку \\(i\\), прибавим единицу к \\(r_i\\); если оно идет горизонтально в столбец \\(j\\), прибавим единицу к \\(c_j\\). Найдите наибольшее целое число \\(k\\), такое что для каждого такого гамильтонова цикла хотя бы одно из чисел \\(r_1,\\ldots,r_m,c_1,\\ldots,c_m\\) не меньше \\(k\\).",
