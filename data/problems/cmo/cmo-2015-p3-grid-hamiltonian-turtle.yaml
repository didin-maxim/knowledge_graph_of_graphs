        "id": "stmt-original",
        "title": "Условие задачи",
        "text": "На квадратной сетке \\((4n+2)\\times(4n+2)\\) черепаха может переходить между клетками, имеющими общую сторону. Черепаха начинает в угловой клетке сетки, посещает каждую клетку ровно один раз, после чего возвращается в начальную клетку. В терминах \\(n\\) найдите наибольшее положительное целое число \\(k\\), такое что обязательно существует строка или столбец, в который черепаха вошла как минимум \\(k\\) различных раз.",
