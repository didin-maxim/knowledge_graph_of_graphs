        "title": "Условие",
        "text": "Прямоугольный город имеет ровно \\(m\\) кварталов в длину и \\(n\\) кварталов в ширину. Женщина живет в юго-западном углу города и работает в северо-восточном углу. Каждый день она идет на работу так, что за один путь не проходит ни через один перекресток дважды. Пусть \\(f(m,n)\\) - число различных путей, которыми она может дойти до работы. Докажите, что \\(f(m,n)\\le 2^{mn}\\).",
