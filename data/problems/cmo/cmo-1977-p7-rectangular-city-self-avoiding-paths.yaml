  "solutions": [
    {
      "id": "sol-left-cells-injection",
      "title": "Инъекция в множества кварталов",
      "text": "Рассмотрим любой допустимый путь \\(P\\) и будем идти по нему от юго-западного угла к северо-восточному. Для каждого ребра пути отметим квартал, который лежит непосредственно слева от этого направленного ребра; если ребро идет по границе города и слева от него квартала нет, ничего не отмечаем. Так каждому пути сопоставляется некоторое множество \\(S(P)\\) из \\(mn\\) кварталов.\n\nДокажем, что это сопоставление инъективно. Удобно считать кварталы единичными квадратами, а путь - ломаной по их сторонам. Так как путь не проходит через один и тот же перекресток дважды, он не имеет самопересечений. После небольшого скругления в окрестностях перекрестков это простая дуга от юго-западного угла прямоугольника к северо-восточному. Идя по этой дуге, мы ровно записываем, какие клетки находятся с ее левой стороны вдоль каждого участка.\n\nТеперь пусть известно только множество \\(S=S(P)\\). Рассмотрим все стороны кварталов, которые разделяют отмеченную клетку и неотмеченную клетку или внешность прямоугольника. Среди этих сторон есть единственная граничная цепочка, идущая от юго-западного угла к северо-восточному так, что отмеченные клетки лежат слева от направления движения. Именно эта цепочка и есть исходный путь: каждое ребро пути входит в такую границу по определению \\(S(P)\\), а лишняя граничная цепочка с теми же концами дала бы две разные простые дуги с одной и той же левой стороной, что невозможно при обходе границы одного и того же множества клеток. Значит, по \\(S(P)\\) путь восстанавливается однозначно.\n\nИтак, разные допустимые пути дают разные подмножества множества всех \\(mn\\) кварталов. Подмножеств кварталов всего \\(2^{mn}\\), поэтому \\(f(m,n)\\le 2^{mn}\\).",
