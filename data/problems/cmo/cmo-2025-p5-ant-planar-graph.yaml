  "solutions": [
    {
      "id": "sol-official-planar-arcs",
      "title": "Решение через плоский граф дуг",
      "text": "Предположим противное: муравей дошел из левого нижнего угла прямоугольника \\(R\\) в правый верхний, и при этом каждый маленький прямоугольник был выбран не более одного раза.\n\nПостроим вспомогательный плоский граф. Его вершинами будут все точки, являющиеся углами маленьких прямоугольников. Для каждого маленького прямоугольника \\(r\\) проведем внутри него две непересекающиеся дуги между парами соседних углов. Если муравей при единственном выборе \\(r\\) прошел из одного угла \\(r\\) в соседний по горизонтальной стороне, проводим две горизонтальные дуги: между двумя нижними углами и между двумя верхними. Если он прошел по вертикальной стороне, проводим две вертикальные дуги. Если прямоугольник \\(r\\) вообще не выбирался, выбираем один из двух вариантов произвольно. Ребрами графа считаем эти дуги.\n\nТогда каждый ход муравья идет по одному из ребер построенного графа: для выбранного прямоугольника мы специально провели дуги в том же направлении, что и ход. Значит весь маршрут муравья содержит в этом графе путь из левого нижнего угла \\(R\\) в правый верхний угол \\(R\\).\n\nРазберем степени вершин построенного графа. Каждый из четырех углов большого прямоугольника принадлежит ровно одному маленькому прямоугольнику, поэтому из него выходит ровно одна проведенная дуга; его степень равна \\(1\\). Любая другая вершина имеет степень \\(2\\). Если точка лежит внутри стороны большого прямоугольника, то она является углом ровно двух маленьких прямоугольников, и из каждого из этих прямоугольников в этой точке выходит ровно одна дуга. Если точка внутренняя, то условие о том, что никакие три маленьких прямоугольника не имеют общего угла, оставляет только T-образную локальную картину: данная точка является углом ровно двух маленьких прямоугольников, а для остальных прилегающих прямоугольников лежит на стороне, но не является углом. Поэтому и здесь в графе инцидентны ровно две дуги.\n\nСледовательно, каждая компонента построенного конечного графа является либо циклом, либо путем. Концами компонент-путей могут быть только вершины степени \\(1\\), то есть четыре угла \\(R\\). Если существует путь из левого нижнего угла в правый верхний, то эти два угла являются концами одной компоненты-пути. Оставшиеся две вершины степени \\(1\\), правый нижний и левый верхний углы \\(R\\), тоже должны быть концами некоторой другой компоненты-пути. Поэтому в том же плоском графе есть второй путь, соединяющий правый нижний угол с левым верхним.\n\nНо два таких пути не могут быть одновременно нарисованы внутри прямоугольника без пересечения. На границе \\(R\\) четыре угла идут в циклическом порядке: левый нижний, правый нижний, правый верхний, левый верхний. Путь из левого нижнего угла в правый верхний вместе с одной из двух граничных дуг между этими углами образует замкнутую кривую, которая отделяет правый нижний угол от левого верхнего. Поэтому всякий путь из правого нижнего угла в левый верхний обязан пересечь первый путь. Это ровно лемма о невозможности двух непересекающихся дуг с чередующимися концами на границе диска. В нашем графе ребра внутри разных маленьких прямоугольников не пересекаются, а разные компоненты не имеют общих вершин, значит такое пересечение невозможно.\n\nПолученное противоречие показывает, что предположение было неверным. Следовательно, если муравей дошел из левого нижнего угла \\(R\\) в правый верхний, то некоторый маленький прямоугольник был выбран по крайней мере в двух операциях.",
