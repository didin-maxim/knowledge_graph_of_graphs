        "title": "Условие задачи",
        "text": "Прямоугольник \\(R\\) разбит на множество \\(S\\) из конечного числа меньших прямоугольников со сторонами, параллельными сторонам \\(R\\), так что никакие три прямоугольника из \\(S\\) не имеют общего угла. Муравей сначала находится в левом нижнем углу \\(R\\). За одну операцию можно выбрать прямоугольник \\(r\\in S\\), в одном из углов которого, скажем \\(c\\), сейчас находится муравей, и переместить муравья в один из двух углов \\(r\\), соседних с \\(c\\). Предположим, что после конечного числа операций муравей оказался в правом верхнем углу \\(R\\). Докажите, что некоторый прямоугольник \\(r\\in S\\) был выбран по крайней мере в двух операциях.",
