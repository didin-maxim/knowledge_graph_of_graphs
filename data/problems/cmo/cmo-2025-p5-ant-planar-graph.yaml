        "id": "stmt-graph-hint-corner-arcs",
        "text": "Для доказательства от противного предположите, что каждая метка использована не более одного раза. В каждом малом прямоугольнике проведите две непересекающиеся внутренние дуги, соединяющие две горизонтальные пары соседних углов, если использованное ребро горизонтально, или две вертикальные пары, если оно вертикально; для неиспользованного прямоугольника выберите любую из двух ориентаций. Полученный вложенный граф имеет четыре угла \\(R\\) в качестве вершин степени 1, а все остальные вершины имеют степень 2. Покажите, что такой граф не может содержать путь из левого нижнего угла \\(R\\) в правый верхний.",
