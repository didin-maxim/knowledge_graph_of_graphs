        "id": "stmt-graph",
        "title": "Маршруты в помеченном графе разбиения прямоугольника",
        "text": "Пусть прямоугольник \\(R\\) разбит на конечное число прямоугольников со сторонами, параллельными осям, причём никакие три малых прямоугольника не имеют общего угла. Рассматривается помеченный граф: его вершины — все углы малых прямоугольников, а для каждого малого прямоугольника каждая пара соседних углов соединена ребром с меткой этого прямоугольника. Докажите, что всякий маршрут в этом графе из левого нижнего угла \\(R\\) в правый верхний угол \\(R\\) содержит два ребра с одной и той же меткой.",
