  "ideas": [
    {
      "id": "idea-degree-one-corners",
      "title": "Граничные углы степени 1 заставляют пары концов пересекаться",
      "text": "Если ни один малый прямоугольник не используется дважды, официальный вспомогательный граф является объединением путей и циклов. Его единственные вершины степени 1 — четыре угла большого прямоугольника; маршрут из левого нижнего угла в правый верхний содержит путь между этими углами и заставил бы существовать другой непересекающийся путь из правого нижнего угла в левый верхний, что невозможно в плоском прямоугольнике.",
