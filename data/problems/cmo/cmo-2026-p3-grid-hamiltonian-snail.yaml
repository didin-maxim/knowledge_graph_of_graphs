        "id": "stmt-original",
        "title": "Условие задачи",
        "text": "Улитка Turbo играет в игру на доске с \\(2n\\) строками и \\(2n\\) столбцами. Есть \\(2n^2\\) чудовищ, которые сначала, зная всё о Turbo, выбирают \\(2n^2\\) различных клеток и занимают их. После этого Turbo выбирает любую клетку и помечает её числом \\(1\\). Начиная с этой клетки, Turbo затем проходит через все остальные \\(4n^2-1\\) клетки ровно по одному разу, помечая их по порядку числами \\(2,3,\\ldots,4n^2\\). Turbo ходит только между клетками с общей стороной и никогда не возвращается в уже посещённую клетку. Итоговый счёт равен сумме меток клеток с чудовищами. Чудовища стараются расположиться так, чтобы максимизировать счёт, а Turbo старается минимизировать счёт, зная расположение чудовищ. Найдите, в терминах \\(n\\), наибольший счёт, который чудовища могут гарантировать.",
