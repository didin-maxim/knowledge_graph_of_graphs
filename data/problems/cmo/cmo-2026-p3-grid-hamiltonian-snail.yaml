        "title": "Игра на гамильтоновом пути решётки",
        "text": "Пусть \\(G\\) — квадратный решётчатый граф размера \\((2n)\\times(2n)\\), вершинами которого являются клетки доски \\(2n\\) на \\(2n\\), а рёбра соединяют клетки с общей стороной. Сначала выбирается множество \\(M\\subseteq V(G)\\) размера \\(2n^2\\). Затем выбирается гамильтонов путь в \\(G\\), и его вершины помечаются числами \\(1,2,\\ldots,4n^2\\) в порядке прохождения пути. Счёт равен сумме меток на вершинах из \\(M\\). Выбирающий \\(M\\) хочет максимизировать этот счёт, а выбирающий гамильтонов путь хочет минимизировать его после того, как увидит \\(M\\). Определите значение этой игры в терминах \\(n\\).",
