  "solutions": [
    {
      "id": "sol-official-checkerboard-cycle-pairing",
      "title": "Шахматная расстановка и два обхода гамильтонова цикла",
      "text": "Ответ: \\(4n^4\\).\n\nСначала докажем, что чудовища могут гарантировать не меньше \\(4n^4\\). Раскрасим клетки доски в шахматном порядке. Так как доска имеет размер \\(2n\\times 2n\\), в каждом цвете ровно половина клеток, то есть \\(2n^2\\) клеток. Пусть чудовища займут все клетки одного цвета.\n\nЛюбой ход Turbo идет между соседними по стороне клетками, а соседние клетки имеют разные цвета. Поэтому вдоль любого пути цвета клеток чередуются. Если Turbo начнет с клетки цвета чудовищ, то чудовища окажутся ровно на местах с нечетными номерами \\(1,3,5,\\ldots,4n^2-1\\). Если он начнет с клетки другого цвета, то чудовища окажутся на местах с четными номерами \\(2,4,\n\\ldots,4n^2\\), что дает больший счет. Значит при такой расстановке оптимальный выбор Turbo дает чудовищам сумму первых \\(2n^2\\) нечетных чисел:\n\\[\n1+3+\\cdots+(4n^2-1)=(2n^2)^2=4n^4.\n\\]\nСледовательно, чудовища действительно могут гарантировать счет хотя бы \\(4n^4\\).\n\nТеперь докажем, что большего они гарантировать не могут. Нужно показать, что при любой расстановке \\(2n^2\\) чудовищ Turbo умеет получить счет не больше \\(4n^4\\).\n\nНам понадобится гамильтонов цикл по всем клеткам доски \\(2n\\times 2n\\). Он существует: например, можно пройти верхнюю строку слева направо, затем змейкой пройти строки со второй по последнюю, используя столбцы со второго по последний, после этого из последней строки перейти в первый столбец, подняться по нему до второй строки и последним шагом вернуться в левую верхнюю клетку. Так получается цикл, проходящий через каждую клетку ровно один раз. Четность числа строк важна: после змейки по строкам конец оказывается внизу во втором столбце, откуда можно замкнуть обход через первый столбец.\n\nЗафиксируем произвольную расстановку чудовищ. Выберем одну клетку с чудовищем и назовем ее начальной. Turbo рассмотрит два допустимых обхода: идти из этой клетки по найденному гамильтонову циклу в одну сторону или в другую. В обоих случаях начальная клетка получает метку \\(1\\), а удаление начальной клетки из цикла оставляет гамильтонов путь по всем остальным клеткам.\n\nПусть всего клеток \\(N=4n^2\\). Возьмем любое другое чудовище. Если при обходе цикла в первую сторону его клетка получила номер \\(i\\), то при обходе в противоположную сторону она получит номер \\(N+2-i\\). Действительно, в одну сторону от начальной клетки до этой клетки идет \\(i-1\\) ребер цикла, а в другую сторону идет \\(N-(i-1)\\) ребер; значит соответствующая метка во втором обходе равна \\(N-(i-1)+1=N+2-i\\).\n\nПросуммируем счета двух противоположных обходов. Начальное чудовище дает вклад \\(1+1=2\\). Каждое из остальных \\(2n^2-1\\) чудовищ дает вклад\n\\[\ni+(4n^2+2-i)=4n^2+2.\n\\]\nПоэтому сумма двух счетов равна\n\\[\n2+(2n^2-1)(4n^2+2)=2+(8n^4-2)=8n^4.\n\\]\nЕсли сумма двух чисел равна \\(8n^4\\), то хотя бы одно из них не превосходит \\(4n^4\\). Turbo выбирает соответствующее направление обхода цикла и получает счет не больше \\(4n^4\\).\n\nИтак, чудовища имеют расстановку, гарантирующую \\(4n^4\\), а при любой их расстановке Turbo может удержать счет не выше \\(4n^4\\). Следовательно, наибольший счет, который чудовища могут гарантировать, равен \\(4n^4\\).",
