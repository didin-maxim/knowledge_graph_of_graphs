      "id": "idea-branching-after-first-step",
      "title": "Ветвление после первого шага",
      "text": "После выбора первого единичного шага следующий шаг имеет не более трех возможных направлений, поскольку обратный шаг сразу вернул бы маршрут в предыдущую точку решетки. Это дает стандартную верхнюю оценку \\(f(n)\\le 4\\cdot 3^{n-1}\\).",
      "tags": [
        "goal_bound"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-monotone-subfamily",
      "title": "Монотонные маршруты дают нижнюю оценку",
      "text": "Каждая последовательность шагов на север и восток самоизбегающая, что дает \\(2^n\\) маршрутов; кроме них есть и другие маршруты, например маршрут только на юг. Следовательно, \\(2^n<f(n)\\).",
      "tags": [
        "goal_bound"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-four-step-square-correction",
      "title": "На четвертом шаге мешают только обходы единичного квадрата",
      "text": "Для четырехшаговых маршрутов наивная оценка дает \\(4\\cdot3^3\\). Единственные запрещенные четвертые ходы - это 8 завершений пути по трем сторонам единичного квадрата с возвращением в начало координат, поэтому \\(f(4)=108-8=100\\).",
      "tags": [
        "goal_counting"
      ],
