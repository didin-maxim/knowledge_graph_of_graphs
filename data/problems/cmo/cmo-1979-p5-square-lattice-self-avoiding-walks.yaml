        "id": "stmt-original",
        "title": "Официальное условие",
        "text": "Маршрут состоит из последовательности шагов длины 1 в направлениях на север, юг, восток или запад. Маршрут называется самоизбегающим, если он никогда не проходит через одну и ту же точку дважды. Пусть \\(f(n)\\) обозначает число \\(n\\)-шаговых самоизбегающих маршрутов, начинающихся в начале координат. Найдите \\(f(1)\\), \\(f(2)\\), \\(f(3)\\), \\(f(4)\\) и докажите, что \\(2^n<f(n)\\le 4\\cdot 3^{n-1}\\).",
        "source_id": "src-cmo-1979-official",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
