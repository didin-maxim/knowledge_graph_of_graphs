    "graph_theory": [
      {
        "id": "stmt-graph",
        "title": "Самоизбегающие пути в квадратной решётке",
        "text": "Пусть вершинами являются целочисленные точки решетки \\(\\mathbb Z^2\\), а ребра соединяют пары точек на евклидовом расстоянии 1. Пусть \\(f(n)\\) - число простых путей длины \\(n\\), начинающихся в \\((0,0)\\). Найдите \\(f(1),f(2),f(3),f(4)\\) и докажите, что \\(2^n<f(n)\\le 4\\cdot 3^{n-1}\\).",
