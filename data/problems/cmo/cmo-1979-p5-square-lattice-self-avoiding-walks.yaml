    "graph_hint_reformulations": [
      {
        "id": "stmt-graph-hint-branching",
        "title": "Ветвление и монотонное подсемейство путей",
        "text": "В графе квадратной решетки посчитайте простые пути из \\((0,0)\\). Для верхней оценки раскрывайте путь по одной вершине: первый шаг имеет 4 варианта, а затем путь не может сразу вернуться в предыдущую вершину, поэтому на каждом шаге есть не более 3 вариантов. Для нижней оценки сравните с монотонными путями, использующими только шаги на север и восток.",
