  "solutions": [
    {
      "id": "sol-enumeration-and-branching",
      "title": "Перебор и оценки ветвления",
      "text": "Для одного, двух и трех шагов после первого шага есть соответственно ноль, один или два дальнейших выбора, каждый с 3 доступными направлениями без немедленного возврата, и до шага 4 никакое другое повторение невозможно. Поэтому \\(f(1)=4\\), \\(f(2)=4\\cdot3=12\\) и \\(f(3)=4\\cdot3^2=36\\). Для четырех шагов начнем с тех же \\(4\\cdot3^3=108\\) маршрутов без немедленного возврата. Повторение может быть только возвращением в начало координат на четвертом шаге; это происходит ровно тогда, когда первые три шага идут по трем сторонам единичного квадрата. Есть 4 варианта первого шага и 2 варианта направления обхода квадрата, значит таких маршрутов 8. Следовательно, \\(f(4)=108-8=100\\). Для каждого \\(n\\ge1\\) первый шаг имеет 4 варианта, а каждый последующий шаг имеет не более 3 вариантов, потому что путь не может сразу вернуться в предыдущую точку решетки, поэтому \\(f(n)\\le4\\cdot3^{n-1}\\). Кроме того, все \\(2^n\\) маршрутов, использующих только шаги на север и восток, самоизбегающие, и существует хотя бы еще один самоизбегающий маршрут, например маршрут только на юг. Значит, \\(2^n<f(n)\\).",
