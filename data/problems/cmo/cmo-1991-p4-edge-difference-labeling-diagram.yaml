        "id": "stmt-parity-cut-hint",
        "title": "Препятствие через четность разреза",
        "text": "В графовой формулировке 14 попарно различных положительных разностей на ребрах должны быть ровно числами \\(1,2,\\ldots,14\\). Значит, ровно семь ребер имеют нечетную разность. Нечетная разность означает, что метки двух концов имеют разную четность, поэтому эти семь ребер образуют разрез между вершинами с нечетными и четными метками. Но каждая вершина \\(G\\) имеет четную степень, поэтому по лемме о рукопожатиях любой разрез в \\(G\\) имеет четный размер.",
