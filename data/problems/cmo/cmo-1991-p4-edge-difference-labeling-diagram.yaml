  "solutions": [
    {
      "id": "sol-parity-cut",
      "title": "Чётность разреза",
      "text": "Ответ: нет.\n\nПредположим, что такую разметку удалось сделать. Все 10 чисел различны, поэтому ни одна из 14 указанных разностей не равна нулю. Каждая разность лежит между 1 и 14. Так как разностей ровно 14 и они попарно различны, они обязаны быть ровно числами \\(1,2,\\ldots,14\\) в некотором порядке. Значит, среди них ровно 7 нечётных разностей.\n\nПосмотрим на чётность другим способом. Нечётная разность возникает тогда и только тогда, когда два числа на концах соответствующего ребра имеют разную чётность. Рассмотрим граф из условия: две копии \\(K_{2,3}\\), соединённые двумя дополнительными рёбрами. Вершины \\(t_1,t_2,b_1,b_2\\) имеют степень 4, а остальные шесть вершин имеют степень 2. Значит, степень каждой вершины графа чётна.\n\nРазобьём вершины на две группы: с чётными метками и с нечётными метками. Рёбра с нечётной разностью — это ровно рёбра, пересекающие этот разрез. В любом графе, где все степени чётны, каждый разрез имеет чётное число рёбер: если взять одну сторону разреза и сложить степени всех её вершин, то внутренние рёбра посчитаются дважды, а рёбра разреза — один раз; левая часть чётна, значит и число рёбер разреза чётно.\n\nПолучается, число нечётных разностей должно быть чётным. Но выше мы получили, что оно равно 7. Противоречие. Следовательно, требуемую разметку сделать невозможно.",
