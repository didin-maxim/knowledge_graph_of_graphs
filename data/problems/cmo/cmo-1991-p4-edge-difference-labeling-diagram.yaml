        "id": "stmt-original",
        "title": "Официальное условие",
        "text": "Нужно выбрать десять различных чисел из множества \\(\\{0,1,2,\\ldots,13,14\\}\\) и вписать их в десять кружков на следующем графе. Граф состоит из двух копий одного и того же пятивершинного ромба с центром: в каждой копии есть верхняя, нижняя, левая, центральная и правая вершины; ребра идут от верхней вершины к каждой из левой, центральной и правой, а также от каждой из левой, центральной и правой к нижней. Две копии соединены двумя дополнительными ребрами: одно соединяет две верхние вершины, другое - две нижние. Абсолютные величины разностей двух чисел, соединенных каждым отрезком, должны отличаться от значений для всех остальных отрезков. Возможно ли это сделать? Обоснуйте ответ.",
        "source_id": "src-cmo-1991-official",
