        "title": "Эквивалентная формулировка на языке разметки графа",
        "text": "Пусть \\(G\\) - простой граф на вершинах \\(t_1,b_1,x_1,y_1,z_1,t_2,b_2,x_2,y_2,z_2\\), с ребрами \\(t_i x_i,t_i y_i,t_i z_i,b_i x_i,b_i y_i,b_i z_i\\) при \\(i=1,2\\), а также с двумя ребрами \\(t_1t_2\\) и \\(b_1b_2\\). Можно ли инъективно пометить вершины \\(G\\) десятью числами, выбранными из \\(\\{0,1,\\ldots,14\\}\\), так, чтобы абсолютные разности на всех 14 ребрах были попарно различны?",
