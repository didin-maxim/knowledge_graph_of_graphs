      "title": "Нечетные разности образуют разрез",
      "text": "Поскольку ребер 14 и все разности на ребрах являются различными элементами \\(\\{1,2,\\ldots,14\\}\\), эти разности должны быть ровно всеми этими 14 числами. Нечетные разности соответствуют в точности ребрам, переходящим от вершин с нечетными метками к вершинам с четными метками.",
