  "solutions": [
    {
      "id": "sol-official-stabilizing-set",
      "title": "Решение через множество уже закрепившихся людей",
      "text": "Будем говорить, что человек согласен на \\(n\\)-м голосовании, если его ответ на этом голосовании совпадает с ответом хотя бы одного из двух соседей. Сначала отметим ключевой факт: если два соседа дали одинаковый ответ на \\(n\\)-м голосовании, то на \\((n+1)\\)-м голосовании оба сохранят свои ответы, потому что каждый из них имеет соседа с тем же ответом. Значит, на следующем голосовании эта пара снова будет согласной, и по индукции оба человека уже никогда не изменят ответ после \\(n\\)-го голосования.\n\nПусть \\(A_n\\) — множество людей, которые на \\(n\\)-м голосовании согласны хотя бы с одним из своих соседей. Из предыдущего абзаца следует, что \\(A_n\\subseteq A_{n+1}\\) для всех \\(n\\ge 1\\): попавший в \\(A_n\\) человек дальше не меняет ответ и остаётся согласным с тем же соседом. Нам достаточно доказать, что при некотором \\(n\\) множество \\(A_n\\) содержит всех 25 людей, потому что тогда каждый имеет соседа с тем же ответом и больше никто не изменит ответ.\n\nТак как людей за столом нечётное число, невозможно, чтобы на первом голосовании каждый человек отличался от обоих соседей. Иначе ответы должны были бы чередоваться по кругу: «да», «нет», «да», «нет», ...; на нечётном цикле это не замыкается. Поэтому \\(A_1\\) непусто. Более того, если есть пара соседей с одинаковыми ответами, то оба её конца лежат в \\(A_1\\), так что \\(|A_1|\\ge 2\\).\n\nМножества \\(A_n\\) возрастают и все содержатся в фиксированном множестве из 25 людей. Поэтому найдётся момент \\(T<25\\), для которого \\(A_T=A_{T+1}\\): если бы на каждом шаге было строгое включение, размер множества увеличивался бы каждый раз, что невозможно дольше чем конечное число раз.\n\nПредположим, что \\(A_T\\) ещё не содержит всех 25 людей. Так как \\(A_T\\ne\\varnothing\\) и \\(A_T\\) не весь круг, на окружности найдутся соседи \\(x\\) и \\(y\\) такие, что \\(x\\in A_T\\), а \\(y\\notin A_T\\). Человек \\(x\\) уже закрепился, значит на \\(T\\)-м и \\((T+1)\\)-м голосованиях он даёт один и тот же ответ. Условие \\(y\\notin A_T\\) означает, что на \\(T\\)-м голосовании ответ \\(y\\) отличается от ответов обоих его соседей, в частности от ответа \\(x\\). Поэтому по правилу на \\((T+1)\\)-м голосовании человек \\(y\\) меняет ответ. Так как возможны только два ответа, после смены ответ \\(y\\) совпадёт с ответом \\(x\\), который за это время не изменился. Следовательно, \\(y\\in A_{T+1}\\).\n\nНо это противоречит равенству \\(A_T=A_{T+1}\\), ведь \\(y\\notin A_T\\). Значит, наше предположение неверно, и \\(A_T\\) содержит всех 25 людей. Начиная с этого момента у каждого есть сосед с тем же ответом, поэтому на всех последующих голосованиях никто больше не изменит ответ.",
