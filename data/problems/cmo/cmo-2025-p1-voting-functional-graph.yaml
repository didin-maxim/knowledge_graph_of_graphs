      "id": "idea-pointer-jumping",
      "title": "Голосование является прыжком по указателям",
      "text": "Если текущий голос игрока \\(a\\) направлен на \\(b\\), а голос \\(b\\) направлен на \\(c\\), то обновление заменяет указатель \\(a\\to b\\) на \\(a\\to c\\). Значит, процесс является последовательным перепрыгиванием по указателям в функциональном ориентированном графе.",
