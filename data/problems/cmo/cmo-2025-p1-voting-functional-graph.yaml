        "id": "stmt-original",
        "title": "Официальное условие",
        "text": "\\(n\\) игроков хоккейной команды собираются, чтобы выбрать капитана. Сначала они стоят по кругу, и каждый голосует за человека слева от себя. Затем игроки будут обновлять свои голоса в серии раундов. В одном раунде каждый игрок \\(a\\) по очереди обновляет свой голос по следующему правилу: в момент обновления, если \\(a\\) голосует за \\(b\\), а \\(b\\) голосует за \\(c\\), то \\(a\\) меняет свой голос на \\(c\\). Вершины \\(a,b,c\\) не обязаны быть различными; если \\(b=c\\), то голос \\(a\\) при этом обновлении не меняется. В каждом раунде каждый игрок обновляет свой голос ровно один раз, в порядке, который определяют игроки; этот порядок может меняться от раунда к раунду. Они повторяют такую процедуру обновления в течение \\(n\\) раундов. Докажите, что к этому моменту все \\(n\\) игроков будут единогласно голосовать за одного и того же человека.",
