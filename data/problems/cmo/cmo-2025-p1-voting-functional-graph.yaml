  "solutions": [
    {
      "id": "sol-official-cycle-and-path-halving",
      "title": "Решение через сжатие цикла и путей",
      "text": "Будем рассматривать текущие голоса как ориентированный граф: из каждой вершины выходит ровно одна стрелка, направленная к тому игроку, за которого эта вершина сейчас голосует. Обновление вершины \\(a\\) устроено так: если в данный момент \\(a\\to b\\) и \\(b\\to c\\), то стрелка из \\(a\\) заменяется на \\(a\\to c\\). То есть вершина \\(a\\) перепрыгивает через один указатель.\n\nСначала зафиксируем структуру графа. В начальный момент все вершины образуют один направленный цикл. При любом обновлении новая стрелка из \\(a\\) ведет туда, куда до обновления вела стрелка из прежнего соседа \\(b\\). Поэтому обновление не может создать новый направленный цикл: если после замены \\(a\\to c\\) вершина \\(a\\) лежит на цикле, то и до замены путь из \\(c\\) обратно к \\(a\\) вместе со стрелками \\(a\\to b\\to c\\) уже давал цикл. Значит, в каждый момент существует ровно один направленный цикл; остальные вершины, если они есть, лежат на деревьях, направленных к этому циклу.\n\nДокажем, что пока длина единственного цикла равна \\(K>1\\) в начале некоторого раунда, к концу этого раунда она станет не больше \\(\\lfloor K/2\\rfloor\\). Рассмотрим \\(K\\) вершин, которые лежали на цикле в начале раунда. Если такая вершина \\(a\\) в момент своего обновления еще лежит на текущем цикле и на нем есть участок \\(a\\to b\\to c\\), то после замены \\(a\\to c\\) вершина \\(b\\) выпадает из цикла, а длина цикла уменьшается на 1. Последующее обновление самой вершины \\(b\\), если оно еще не произошло, уже не может вернуть ее в цикл или увеличить длину цикла.\n\nОсталось объяснить, почему таких полезных обновлений не меньше половины. Вершина начального цикла, которая к своему обновлению уже выпала из цикла, могла выпасть только из-за более раннего обновления своей текущей предшествующей вершины на цикле. Одно такое более раннее обновление выбрасывает не более одной вершины. Следовательно, число вершин начального цикла, выпавших до собственного обновления, не больше числа вершин начального цикла, которые успели обновиться, еще находясь на цикле. Из \\(K\\) вершин хотя бы \\(\\lceil K/2\\rceil\\) обновились полезно, и каждая из них уменьшила длину цикла на 1. Поэтому к концу раунда длина цикла не превосходит\n\\[\nK-\\lceil K/2\\rceil=\\lfloor K/2\\rfloor.\n\\]\nПосле \\(\\lfloor\\log_2 n\\rfloor\\) раундов длина единственного цикла становится равной 1; обозначим его вершину через \\(z\\). Это означает, что \\(z\\) голосует за себя.\n\nТеперь петля \\(z\\to z\\) уже не исчезнет: обновление \\(z\\) ничего не меняет. Докажем, что после этого расстояние любой вершины до \\(z\\) за каждый раунд уменьшается как минимум вдвое с округлением вверх. Возьмем произвольную вершину \\(a\\) и путь от нее к \\(z\\) в начале раунда:\n\\[\na=x_L\\to x_{L-1}\\to\\cdots\\to x_1\\to z.\n\\]\nНовые вершины не могут добавиться на этот путь: каждое обновление лишь заменяет указатель вершины на следующий указатель вдоль уже существующего пути к \\(z\\). Если вершина \\(x_i\\) обновляется, пока она еще лежит на текущем пути от \\(a\\) к \\(z\\), она перепрыгивает через следующую вершину, и длина этого пути уменьшается на 1. Как и для цикла, вершина из начального пути, которая выпала до собственного обновления, могла быть выброшена только более ранним полезным обновлением соседней предыдущей вершины, и одно полезное обновление выбрасывает не более одной вершины. Поэтому среди \\(L\\) вершин \\(x_1,\\ldots,x_L\\) не меньше \\(\\lfloor L/2\\rfloor\\) успевают обновиться, пока остаются на текущем пути. Значит, после раунда длина пути не превосходит\n\\[\nL-\\lfloor L/2\\rfloor=\\lceil L/2\\rceil.\n\\]\nИтак, после появления петли расстояние от любой вершины до \\(z\\) за каждый следующий раунд уменьшается по правилу \\(L\\mapsto\\lceil L/2\\rceil\\). В начале этого этапа любое расстояние не больше \\(n-1\\), поэтому через \\(\\lceil\\log_2 n\\rceil\\) раундов каждое расстояние станет не больше 1. Это означает, что каждая вершина, кроме, возможно, самой \\(z\\), указывает непосредственно на \\(z\\), а \\(z\\) указывает на себя. Следовательно, все игроки голосуют за одного и того же игрока \\(z\\).\n\nВсего потребовалось не более\n\\[\n\\lfloor\\log_2 n\\rfloor+\\lceil\\log_2 n\\rceil\n\\]\nраундов. Для \\(n=1\\) утверждение тривиально, а для \\(n\\ge2\\) эта сумма не превосходит \\(n\\): при \\(n=2,3,4\\) это проверяется напрямую, а при \\(n\\ge5\\) имеем \\(\\lfloor\\log_2 n\\rfloor+\\lceil\\log_2 n\\rceil\\le 2\\lfloor\\log_2 n\\rfloor+1\\le n\\). Поэтому после данных в условии \\(n\\) раундов единогласие обязательно уже наступило.",
