        "title": "Эквивалентная графовая формулировка",
        "text": "Пусть дано \\(n\\) вершин, сначала образующих один ориентированный цикл: из каждой вершины выходит ровно одна стрелка к следующей вершине цикла. Далее выполняются \\(n\\) раундов. В каждом раунде каждая вершина обновляется ровно один раз, в произвольном порядке, который может меняться от раунда к раунду. Если в момент обновления из вершины \\(a\\) выходит стрелка в \\(b\\), а из \\(b\\) выходит стрелка в \\(c\\), то стрелку из \\(a\\) заменяют на стрелку \\(a\\to c\\); если \\(b=c\\), стрелка из \\(a\\) не меняется. Докажите, что после этих \\(n\\) раундов все вершины имеют одного и того же исходящего соседа.",
