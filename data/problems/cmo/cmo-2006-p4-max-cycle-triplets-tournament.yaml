  "solutions": [
    {
      "id": "sol-degree-count-maximum",
      "title": "Подсчет транзитивных троек и регулярный турнир",
      "text": "Ответ:\n\\[\n\\frac{n(n+1)(2n+1)}6.\n\\]\n\nРассмотрим произвольный турнир на \\(2n+1\\) командах. Обозначим через \\(c\\) число циклических троек, а через \\(d\\) число остальных троек. Тогда\n\\[\nc+d=\\binom{2n+1}{3}.\n\\]\nЛюбая нециклическая тройка в турнире является транзитивной: в ней есть ровно одна команда, которая побеждает две другие. Обратно, если в тройке есть команда, побеждающая две остальные, то эта тройка не циклическая.\n\nПусть \\(x_i\\) — число побед команды \\(T_i\\), то есть ее исходящая степень. Команда \\(T_i\\) является победителем ровно в \\(\\binom{x_i}{2}\\) нециклических троек, потому что две остальные команды можно выбрать среди тех, кого она победила. Каждая нециклическая тройка имеет единственного такого победителя, значит\n\\[\nd=\\sum_{i=1}^{2n+1}\\binom{x_i}{2}.\n\\]\nТакже\n\\[\n\\sum_{i=1}^{2n+1}x_i=\\binom{2n+1}{2}=n(2n+1),\n\\]\nпоскольку каждая игра дает ровно одну победу.\n\nТеперь оценим \\(d\\) снизу. Имеем\n\\[\n\\sum_i\\binom{x_i}{2}=\\frac12\\sum_i x_i^2-\\frac12\\sum_i x_i.\n\\]\nПо неравенству Коши\n\\[\n(2n+1)\\sum_i x_i^2\\ge \\left(\\sum_i x_i\\right)^2=n^2(2n+1)^2,\n\\]\nпоэтому \\(\\sum_i x_i^2\\ge n^2(2n+1)\\). Следовательно,\n\\[\nd\\ge \\frac12 n^2(2n+1)-\\frac12 n(2n+1)=(2n+1)\\binom n2.\n\\]\nТогда\n\\[\nc=\\binom{2n+1}{3}-d\n\\le \\binom{2n+1}{3}-(2n+1)\\binom n2\n=\\frac{n(n+1)(2n+1)}6.\n\\]\n\nПокажем достижимость. Расположим \\(2n+1\\) команд по кругу. Пусть каждая команда побеждает следующие \\(n\\) команд по часовой стрелке и проигрывает оставшимся \\(n\\) командам. Для каждой пары это правило задает ровно один результат.\n\nВ построенном турнире каждая команда имеет ровно \\(n\\) побед. Поэтому\n\\[\nd=(2n+1)\\binom n2,\n\\]\nи число циклических троек равно\n\\[\n\\binom{2n+1}{3}-(2n+1)\\binom n2=\\frac{n(n+1)(2n+1)}6.\n\\]\nЗначит, найденная верхняя оценка точна.",
