  "solutions": [
    {
      "id": "sol-official-angle-count",
      "title": "Решение через сумму углов",
      "text": "Назовём угол бумеранга, больший \\(180^\\circ\\), рефлексным. У простого четырёхугольника сумма внутренних углов равна \\(360^\\circ\\), поэтому рефлексный угол у бумеранга ровно один: по определению он существует, а двух таких углов быть не может.\n\nПокажем, что вершины этих \\(b\\) рефлексных углов дают \\(b\\) различных внутренних вершин разбиения. Такая вершина не может быть вершиной исходного выпуклого многоугольника \\(C\\), потому что все его углы меньше \\(180^\\circ\\). Она также не может лежать внутри стороны \\(C\\): в этом случае весь четырёхугольник лежит по одну сторону от прямой, содержащей эту сторону, и угол части внутри \\(C\\) не превосходит \\(180^\\circ\\). Значит, вершина рефлексного угла является внутренней вершиной разбиения.\n\nДве разные рефлексные вершины не могут совпасть. Если бы в одной внутренней вершине разбиения встретились два угла, каждый больше \\(180^\\circ\\), то сумма углов прилегающих к этой вершине четырёхугольников была бы больше \\(360^\\circ\\). Но около внутренней вершины части разбиения заполняют полный круг без наложений, поэтому эта сумма равна ровно \\(360^\\circ\\). Следовательно, рефлексным углам соответствуют \\(b\\) различных внутренних вершин.\n\nТеперь сложим все внутренние углы всех \\(q\\) четырёхугольников разбиения. Граничные вершины дают вклад не меньше суммы углов исходного выпуклого \\(s\\)-угольника, то есть не меньше \\((s-2)\\pi\\). Если на сторонах \\(C\\) появились дополнительные вершины разбиения, каждая из них только добавляет ещё угол \\(\\pi\\), поэтому для нижней оценки это не мешает.\n\nКроме того, вокруг каждой из найденных \\(b\\) внутренних вершин сумма прилегающих углов равна \\(2\\pi\\). Мы учитываем только эти \\(b\\) внутренних вершин и можем отбросить вклад остальных внутренних вершин, так что общая сумма всех углов всех четырёхугольников не меньше\n\\[\n2\\pi b+(s-2)\\pi.\n\\]\n\nС другой стороны, сумма внутренних углов каждого четырёхугольника равна \\(2\\pi\\). Поэтому сумма внутренних углов всех \\(q\\) четырёхугольников равна \\(2\\pi q\\). Получаем\n\\[\n2\\pi q\\ge 2\\pi b+(s-2)\\pi.\n\\]\nПосле деления на \\(2\\pi\\) имеем \\(q\\ge b+(s-2)/2\\), что и требовалось доказать.",
      "idea_ids": [
        "idea-reflex-needs-interior",
        "idea-angle-sum-lower-bound"
      ],
      "standard_idea_ids": [
        "double_counting"
      ],
      "status": "ai_checked",
      "definition_ids": []
    },
    {
      "id": "sol-euler-counting-variant",
      "title": "Вариант через формулу Эйлера",
      "text": "Пусть \\(I\\) — число внутренних вершин разбиения, а \\(B\\) — число вершин плоского графа разбиения на границе \\(C\\). Выведем нужную формулу, а не будем ссылаться на неё как на внешнюю лемму.\n\nОбозначим через \\(E\\) число рёбер этого плоского графа. Внутренних граней ровно \\(q\\), и каждая из них является четырёхугольником. Если сложить числа сторон всех внутренних граней, то каждое внутреннее ребро посчитается дважды, а каждое граничное ребро — один раз. Граничных рёбер ровно \\(B\\), поэтому\n\\[\n4q=2E-B.\n\\]\nС другой стороны, вместе с внешней гранью у графа \\(q+1\\) грань, а вершин \\(I+B\\). По формуле Эйлера\n\\[\n(I+B)-E+(q+1)=2,\n\\]\nто есть \\(E=I+B+q-1\\). Подставляя это в равенство \\(4q=2E-B\\), получаем\n\\[\n4q=2(I+B+q-1)-B=2I+B+2q-2.\n\\]\nСледовательно,\n\\[\nq=I+B/2-1.\n\\]\n\nОсталось связать эту формулу с бумерангами. Как в первом решении, рефлексный угол бумеранга не может лежать на границе выпуклого многоугольника, а две разные рефлексные вершины не могут совпасть, иначе сумма углов вокруг одной внутренней вершины превысила бы \\(360^\\circ\\). Поэтому каждый бумеранг даёт свою внутреннюю вершину, и \\(I\\ge b\\). Кроме того, на границе разбиения есть по крайней мере все \\(s\\) вершин исходного выпуклого многоугольника, значит \\(B\\ge s\\).\n\nИтак,\n\\[\nq=I+B/2-1\\ge b+s/2-1=b+(s-2)/2,\n\\]\nчто и требовалось доказать.",
