        "title": "Условие",
        "text": "Бумерангом назовём четырёхугольник, противоположные стороны которого не пересекаются и один из внутренних углов которого больше 180 градусов. Пусть \\(C\\) — выпуклый многоугольник с \\(s\\) сторонами. Предположим, что внутренняя область \\(C\\) является объединением \\(q\\) четырёхугольников с попарно непересекающимися внутренностями, причём \\(b\\) из этих четырёхугольников являются бумерангами. Докажите, что \\(q\\ge b+(s-2)/2\\).",
