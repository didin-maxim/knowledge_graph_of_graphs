      "id": "idea-reflex-needs-interior",
      "title": "Каждый бумеранг даёт свою внутреннюю вершину",
      "text": "Рефлексный угол части, лежащей внутри выпуклого многоугольника, не может находиться в вершине исходного выпуклого многоугольника или на его стороне. В одной внутренней вершине не могут встретиться два угла, каждый больше \\(180^\\circ\\), потому что сумма углов вокруг такой вершины равна \\(360^\\circ\\). Поэтому \\(b\\) бумерангов дают по крайней мере \\(b\\) различных внутренних вершин разбиения.",
