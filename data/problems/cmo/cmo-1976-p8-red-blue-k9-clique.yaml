  "solutions": [
    {
      "id": "sol-ramsey-r34-upper-bound",
      "title": "Доказательство как \\(R(3,4)\\le 9\\)",
      "text": "Рассмотрим граф \\(G\\) на девяти вершинах, где вершины соответствуют данным точкам, а рёбра графа \\(G\\) — это синие отрезки. По условию каждый треугольник из трёх точек содержит красную сторону, значит в графе \\(G\\) нет синего треугольника, то есть \\(G\\) треугольник-свободен. Нужно доказать, что найдутся четыре вершины, между которыми нет синих рёбер; тогда все шесть отрезков между ними красные.\n\nЕсли у некоторой вершины \\(v\\) в графе \\(G\\) есть хотя бы четыре синих соседа, выберем четыре таких соседа. Между двумя из них не может быть синего ребра, иначе вместе с \\(v\\) получился бы синий треугольник. Поэтому эти четыре вершины попарно соединены не синими, а красными рёбрами. Это и есть требуемая красная четвёрка.\n\nОстаётся случай, когда степень каждой вершины в синем графе не превосходит 3. Сумма всех степеней графа чётна. Если бы все девять степеней были равны 3, сумма была бы 27, что невозможно. Значит, существует вершина \\(v\\), синяя степень которой не больше 2. Тогда среди остальных восьми вершин есть как минимум шесть вершин, соединённых с \\(v\\) красными рёбрами. Обозначим множество этих шести вершин через \\(S\\).\n\nДокажем, что внутри \\(S\\) есть красный треугольник. Возьмём любую вершину \\(a\\in S\\). От неё к остальным пяти вершинам множества \\(S\\) идут пять рёбер, каждое красное или синее, поэтому по принципу Дирихле среди них есть хотя бы три ребра одного цвета.\n\nЕсли от \\(a\\) идут три синих ребра к вершинам \\(b,c,d\\), то между \\(b,c,d\\) не может быть синего ребра, иначе возник бы синий треугольник с вершиной \\(a\\). Значит, все три ребра \\(bc,cd,db\\) красные, и \\(b,c,d\\) образуют красный треугольник.\n\nЕсли же от \\(a\\) идут три красных ребра к \\(b,c,d\\), то либо среди \\(bc,cd,db\\) есть красное ребро, и вместе с \\(a\\) оно даёт красный треугольник, либо все три эти ребра синие, что невозможно, потому что тогда \\(b,c,d\\) образовали бы синий треугольник. Следовательно, красный треугольник внутри \\(S\\) существует.\n\nПусть его вершины \\(x,y,z\\). По выбору множества \\(S\\) все рёбра \\(vx,vy,vz\\) красные, а по построению треугольника \\(xyz\\) рёбра \\(xy,yz,zx\\) тоже красные. Значит, четыре вершины \\(v,x,y,z\\) попарно соединены красными отрезками. Требуемая четвёрка найдена.",
