        "text": "Пусть \\(G\\) — конечный простой граф. Для вершины \\(v\\) обозначим через \\(N[v]\\) множество, состоящее из самой вершины \\(v\\) и всех её соседей. Одним ходом разрешается выбрать вершину \\(v\\) и одновременно переключить цвета всех вершин из \\(N[v]\\), то есть заменить чёрный цвет на белый, а белый на чёрный. Докажите, что из полностью чёрной раскраски всегда можно получить полностью белую раскраску.",
