        "text": "Каждая вершина конечного графа окрашена либо в чёрный, либо в белый цвет. Сначала все вершины чёрные. Разрешается выбрать вершину \\(P\\) и изменить цвет \\(P\\) и всех её соседей. Можно ли последовательностью таких операций изменить цвет каждой вершины с чёрного на белый?",
