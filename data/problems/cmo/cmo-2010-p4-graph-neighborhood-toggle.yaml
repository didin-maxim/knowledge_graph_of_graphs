  "solutions": [
    {
      "id": "sol-official-induction",
      "title": "Решение индукцией",
      "text": "Докажем утверждение индукцией по числу вершин. Для графа из одной вершины достаточно один раз выбрать эту вершину.\n\nПусть утверждение уже доказано для всех графов с меньшим числом вершин, и пусть вершины данного графа равны \\(P_1,\\dots,P_m\\). Обозначим через \\(f_i\\) ход, который переключает \\(P_i\\) и всех соседей \\(P_i\\). Зафиксируем индекс \\(i\\), удалим из графа вершину \\(P_i\\) вместе с инцидентными рёбрами и применим индукционное предположение к оставшемуся графу. Полученная последовательность ходов использует только центры \\(P_j\\) при \\(j\\ne i\\); обозначим её композицию через \\(g_i\\). На всех вершинах, кроме \\(P_i\\), эта композиция меняет цвет. На самой вершине \\(P_i\\) она может либо менять цвет, либо не менять, потому что некоторые выбранные центры могли быть соседями \\(P_i\\) в исходном графе.\n\nЕсли для некоторого \\(i\\) композиция \\(g_i\\) тоже меняет цвет \\(P_i\\), то \\(g_i\\) уже переключает все вершины исходного графа, и задача решена. Остаётся рассмотреть случай, когда для каждого \\(i\\) композиция \\(g_i\\) не меняет только вершину \\(P_i\\), а каждую другую вершину меняет.\n\nЕсли \\(m\\) чётно, выполним подряд композиции \\(g_1,g_2,\\dots,g_m\\). Тогда каждая фиксированная вершина \\(P_t\\) не меняется только в композиции \\(g_t\\), а в остальных \\(m-1\\) композициях меняется. Так как \\(m-1\\) нечётно, итоговый цвет каждой вершины изменится.\n\nПусть теперь \\(m\\) нечётно. По лемме о рукопожатиях не все степени вершин могут быть нечётными: иначе сумма степеней была бы нечётной, хотя она равна удвоенному числу рёбер. Значит, есть вершина чётной степени. Переобозначим её как \\(P_1\\), а её соседей как \\(P_2,\\dots,P_{2k+1}\\). Рассмотрим композицию\n\\[\nf_1\\,g_1\\,g_2\\cdots g_{2k+1}.\n\\]\nПосчитаем для каждой вершины, сколько раз она переключается, по модулю 2. Вершина \\(P_1\\) переключается ходом \\(f_1\\), не переключается композицией \\(g_1\\) и переключается каждой из \\(g_2,\\dots,g_{2k+1}\\). Всего это \\(1+2k\\), то есть нечётное число переключений. Если \\(P_t\\) — сосед \\(P_1\\), то она переключается ходом \\(f_1\\), переключается композицией \\(g_1\\), не переключается своей композицией \\(g_t\\), а каждой из остальных \\(2k-1\\) композиций среди \\(g_2,\\dots,g_{2k+1}\\) переключается. Всего опять \\(1+1+(2k-1)=2k+1\\), нечётно. Наконец, если \\(P_t\\) не является ни \\(P_1\\), ни соседом \\(P_1\\), то ход \\(f_1\\) её не трогает, зато каждая из \\(g_1,\\dots,g_{2k+1}\\) её переключает; всего \\(2k+1\\) раз. Во всех случаях каждая вершина переключается нечётное число раз, значит все цвета меняются с чёрного на белый.",
