        "id": "stmt-graph",
        "text": "Даны пять вертикальных путей от нижних терминалов к верхним терминалам. Горизонтальные рёбра соединяют пары вертикальных путей так, что на каждом вертикальном пути никакие два горизонтальных ребра не имеют одной и той же высоты; на одной высоте горизонтальные рёбра образуют паросочетание. Из каждого нижнего терминала одновременно выпускают по одной фишке: фишка движется вверх по своему вертикальному пути, а встретив горизонтальное ребро, переходит по нему на другой вертикальный путь и затем снова движется вверх. Докажите, что в конце заняты все пять верхних терминалов.",
