  "solutions": [
    {
      "id": "sol-transposition-levels",
      "title": "Решение через перестановки на уровнях",
      "text": "Рассмотрим все уровни, на которых к лестницам прикреплены верёвки, в порядке снизу вверх. На каждом таком уровне никакая лестница не участвует более чем в одной верёвке, поэтому верёвки этого уровня образуют паросочетание на пяти лестницах.\n\nДо первого уровня на каждой лестнице находится ровно одна обезьяна. Когда обезьяны доходят до очередного уровня, каждая верёвка этого уровня меняет местами обезьян на двух своих концах, а лестницы без верёвки на этом уровне сохраняют своих обезьян. Значит, переход через уровень является перестановкой пяти обезьян по пяти лестницам. После уровня снова на каждой лестнице ровно одна обезьяна.\n\nПовторяя это для всех уровней, получаем композицию перестановок. Следовательно, перед последним отрезком до вершин лестниц на каждой лестнице по-прежнему находится ровно одна обезьяна. Все обезьяны дальше лезут вверх и достигают верхов лестниц; поскольку верхов пять и на каждой лестнице приходит ровно одна обезьяна, все пять бананов будут взяты.",
      "idea_ids": [
