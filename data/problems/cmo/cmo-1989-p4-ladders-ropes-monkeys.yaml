        "id": "stmt-original",
        "title": "Условие",
        "text": "Есть 5 обезьян и 5 лестниц; наверху каждой лестницы лежит банан. Несколько верёвок соединяют лестницы, каждая верёвка соединяет две лестницы. Никакие две верёвки не прикреплены к одной и той же перекладине одной и той же лестницы. Каждая обезьяна начинает снизу своей лестницы. Обезьяны лезут вверх по лестницам, но всякий раз, когда встречают верёвку, переходят по ней на лестницу на другом конце верёвки и затем продолжают лезть вверх. Докажите, что при любом числе верёвок каждая обезьяна получит банан.",
