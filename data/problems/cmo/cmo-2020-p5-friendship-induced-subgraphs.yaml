  "solutions": [
    {
      "id": "sol-official-russian-expanded",
      "title": "Решение через минимальную половину вершин",
      "text": "Ответ: \\(49995\\).\n\nСначала построим пример с таким числом дружб. Разобьем \\(19998\\) человек на \\(3333\\) групп по \\(6\\) человек. Внутри каждой группы все пары дружат, а между разными группами дружб нет. Тогда всего дружб\n\\[\n3333\\binom 62=3333\\cdot 15=49995.\n\\]\nПроверим условие. Возьмем любые \\(9999\\) человек и пусть \\(x_i\\) — сколько из них попало в \\(i\\)-ю шестерку, \\(i=1,\\ldots,3333\\). Тогда \\(0\\le x_i\\le 6\\) и \\(\\sum x_i=9999\\). Число дружеских пар внутри выбранных \\(9999\\) человек равно\n\\[\n\\sum_{i=1}^{3333}\\binom{x_i}{2}=\\frac12\\sum_{i=1}^{3333}x_i(x_i-1).\n\\]\nДля каждого целого \\(x\\in\\{0,1,2,3,4,5,6\\}\\) верно\n\\[\nx(x-1)\\ge 5x-9.\n\\]\nЭто можно проверить напрямую для семи возможных значений. Поэтому\n\\[\n\\sum_{i=1}^{3333}\\binom{x_i}{2}\n\\ge \\frac12\\sum_{i=1}^{3333}(5x_i-9)\n=\\frac12(5\\cdot9999-9\\cdot3333)=9999.\n\\]\nЗначит, построение действительно удовлетворяет условию.\n\nОсталось доказать, что дружб не может быть меньше. Обозначим \\(N=9999\\); всего вершин \\(2N\\). Рассмотрим произвольный граф дружбы, удовлетворяющий условию. Выберем ровно \\(N\\) вершин и покрасим их в красный цвет, а остальные \\(N\\) — в синий так, чтобы число красно-красных ребер было минимально среди всех выборов \\(N\\) красных вершин.\n\nДля синей вершины \\(b\\) обозначим через \\(d_R(b)\\) число ее красных соседей. Для красной вершины \\(r\\) обозначим через \\(d_R(r)\\) число ее красных соседей. Минимальность выбранного красного множества дает важное неравенство. Если поменять местами красную вершину \\(r\\) и синюю вершину \\(b\\), то число красно-красных ребер не должно уменьшиться. При таком обмене мы теряем все старые красно-красные ребра, инцидентные \\(r\\), их \\(d_R(r)\\), и приобретаем ребра от \\(b\\) к старым красным вершинам, кроме возможного ребра \\(br\\). Поэтому приобретается \\(d_R(b)-\\mathbf 1_{br}\\) новых красно-красных ребер, где \\(\\mathbf 1_{br}=1\\), если \\(b\\) и \\(r\\) смежны, и \\(0\\) иначе. Следовательно,\n\\[\nd_R(b)-\\mathbf 1_{br}\\ge d_R(r).\n\\]\nВ частности, всегда \\(d_R(b)\\ge d_R(r)\\), а если \\(br\\) — ребро, то даже \\(d_R(b)>d_R(r)\\).\n\nПо условию любые \\(N\\) вершин индуцируют не менее \\(N\\) ребер. Поэтому внутри красного множества есть не менее \\(N\\) ребер, и внутри синего множества тоже есть не менее \\(N\\) ребер.\n\nЕсли каждая синяя вершина имеет хотя бы \\(3\\) красных соседей, то между красными и синими вершинами есть хотя бы \\(3N\\) ребер. Тогда общее число ребер не меньше\n\\[\nN+3N+N=5N=49995,\n\\]\nчто и требуется.\n\nОстается случай, когда некоторая синяя вершина \\(b\\) имеет не более \\(2\\) красных соседей. Тогда из неравенства выше для любой красной вершины \\(r\\) получаем \\(d_R(r)\\le d_R(b)\\le 2\\). Значит, сумма красных степеней всех красных вершин не больше \\(2N\\), а число красно-красных ребер не больше \\(N\\). Но по условию их не меньше \\(N\\), следовательно, их ровно \\(N\\), и каждая красная вершина имеет ровно \\(2\\) красных соседа.\n\nТеперь у выбранной синей вершины \\(b\\) не может быть \\(0\\) или \\(1\\) красный сосед: тогда все красные степени были бы не больше \\(1\\), и красно-красных ребер было бы не больше \\(N/2<N\\), что невозможно. Значит, у \\(b\\) ровно \\(2\\) красных соседа. Возьмем один из них, скажем \\(r\\). Так как \\(br\\) — ребро, строгое неравенство дает \\(d_R(b)>d_R(r)\\). Но \\(d_R(b)=2\\), а выше мы получили \\(d_R(r)=2\\) для каждой красной вершины. Противоречие.\n\nСледовательно, второй случай невозможен, а в первом уже доказана оценка \\(e(G)\\ge 5N=49995\\). Вместе с построением это дает минимально возможное число дружб \\(49995\\).",
