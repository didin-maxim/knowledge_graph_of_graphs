        "title": "Графовая формулировка",
        "text": "Пусть дан конечный прямоугольный подграф клеточной решетки: его вершины - клетки прямоугольника, а некоторые пары соседних по стороне клеток соединены проходимым ребром. Для каждого из четырех направлений задано отображение множества вершин в себя: вершина переходит к соседней вершине в этом направлении, если соответствующее ребро есть, и остается на месте иначе. Предположим, что полученная система сильносвязна в следующем смысле: для любых вершин \\(x\\) и \\(y\\) существует слово из четырех направлений, переводящее \\(x\\) в \\(y\\). Докажите, что для любого конечного набора фишек на вершинах существует одно слово из направлений, после применения которого все фишки окажутся в одной вершине.",
