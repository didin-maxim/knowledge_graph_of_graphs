  "solutions": [
    {
      "id": "sol-official-pairwise",
      "title": "Решение через уменьшение расстояния между двумя роботами",
      "text": "Сначала докажем, что любые два робота можно привести в одну клетку. Этого достаточно: когда два робота стоят в одной клетке, любая последующая команда действует на них одинаково, так что они навсегда остаются вместе. После слияния пары можно таким же способом привести к этой общей клетке третьего робота, затем четвертого и так далее, пока все роботы не окажутся вместе.\n\nРассмотрим двух роботов \\(A\\) и \\(B\\) в некоторый момент времени. Обозначим через \\(d(A,B)\\) минимальное число команд в слове, которое переводит робота \\(A\\) из его текущей клетки в текущую клетку робота \\(B\\). По условию такая последовательность существует для любых двух клеток, поэтому \\(d(A,B)\\) определено. Если \\(d(A,B)=0\\), роботы уже стоят вместе. Пусть \\(d(A,B)=n>0\\), и пусть \\(S=s_1s_2\\ldots s_n\\) - кратчайшее слово, переводящее \\(A\\) в текущую клетку \\(B\\).\n\nВо время выполнения слова \\(S\\) робот \\(A\\) ни разу не упирается в непроходимую сторону. Действительно, если на некоторой команде он остался бы на месте, эту команду можно было бы удалить, а остальные команды привели бы \\(A\\) в ту же конечную клетку. Это противоречило бы минимальности длины \\(S\\).\n\nТеперь одновременно применяем слово \\(S\\) к обоим роботам. Предположим сначала, что робот \\(B\\) впервые уперся в стену на команде \\(s_i\\). До этой команды оба робота выполняли одни и те же геометрические сдвиги, а на команде \\(s_i\\) робот \\(A\\) сдвинулся, а \\(B\\) остался на месте. После этого команды \\(s_{i+1},\\ldots,s_n\\) доводят робота \\(A\\) до той клетки, где \\(B\\) стоял в начале выполнения слова \\(S\\). Затем команды \\(s_1,\\ldots,s_{i-1}\\), примененные к этой клетке, переводят его ровно в текущее положение робота \\(B\\), потому что именно эти команды робот \\(B\\) успел выполнить до первого упора. Итак, слово\n\\[\n s_{i+1}s_{i+2}\\ldots s_n s_1s_2\\ldots s_{i-1}\n\\]\nимеет длину \\(n-1\\) и переводит текущее положение \\(A\\) в текущее положение \\(B\\). Значит, значение \\(d(A,B)\\) уменьшилось.\n\nОстается случай, когда робот \\(B\\) при выполнении всего слова \\(S\\) тоже ни разу не упирается в стену. Тогда на каждом шаге оба робота совершают один и тот же единичный сдвиг, поэтому вектор от \\(A\\) к \\(B\\) на прямоугольной сетке остается постоянным. Обозначим этот ненулевой вектор через \\(v\\). Слово \\(S\\) переводит \\(A\\) в исходную клетку \\(B\\), то есть суммарный сдвиг слова равен \\(v\\). Следовательно, тот же набор команд переводит \\(B\\) в клетку, полученную из его исходной клетки сдвигом на \\(v\\). Если повторять слово \\(S\\), то оба робота каждый раз будут сдвигаться еще на \\(v\\), пока не произошло столкновение со стеной. Но если столкновения никогда не происходит, позиции \\(B, B+v, B+2v,\\ldots\\) все лежат в конечном прямоугольнике, что невозможно при \\(v\\ne 0\\). Значит, при некотором повторении слова \\(S\\) робот \\(B\\) все-таки впервые упрется в непроходимую сторону, и предыдущий абзац даст уменьшение \\(d(A,B)\\).\n\nМы получили процедуру, которая из любой пары еще не совпавших роботов за конечное число команд строго уменьшает неотрицательное целое число \\(d(A,B)\\). Повторяя ее, в конце концов доводим это число до нуля, то есть сливаем выбранную пару роботов. Последовательное слияние пар, описанное в начале, приводит всех роботов в одну клетку.",
