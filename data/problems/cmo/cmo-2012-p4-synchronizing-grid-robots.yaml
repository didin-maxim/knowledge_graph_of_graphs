    },
    {
      "id": "idea-distance-drop",
      "title": "Минимальная длина слова уменьшается",
      "text": "Для двух роботов берется кратчайшее слово, переводящее первого на текущую клетку второго. Если второй робот в какой-то момент не может выполнить команду, то циклическая перестановка оставшихся команд переводит первого к новому положению второго короче. Если же второй никогда не упирается, то относительный вектор сохраняется и повторение слова сдвигало бы роботов все дальше в конечной сетке.",
