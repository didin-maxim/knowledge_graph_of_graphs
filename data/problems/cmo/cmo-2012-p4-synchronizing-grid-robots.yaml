        "id": "stmt-original",
        "title": "Условие",
        "text": "На клетках конечной прямоугольной сетки стоят роботы. В одной клетке может стоять любое число роботов. Каждая сторона каждой клетки объявлена либо проходимой, либо непроходимой; все стороны на границе прямоугольника непроходимы. Можно подавать команды вверх, вниз, влево и вправо. После команды все роботы одновременно пытаются пойти в указанном направлении: если соответствующая сторона клетки проходима, робот переходит через нее в соседнюю клетку, а если непроходима, остается на месте. Предположим, что для любого отдельного робота и любой клетки существует конечная последовательность команд, переводящая этого робота в эту клетку. Докажите, что существует конечная последовательность команд, после которой все роботы одновременно окажутся в одной клетке.",
