  "ideas": [
    {
      "id": "idea-pair-merge",
      "title": "Достаточно сливать пары",
      "text": "Если две фишки однажды оказались в одной клетке, дальнейшие общие команды действуют на них одинаково, поэтому они уже не расходятся. Значит, можно последовательно присоединять к одной уже собранной группе по одному роботу.",
      "tags": [
