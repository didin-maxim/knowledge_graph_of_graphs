  "solutions": [
    {
      "id": "sol-forced-matching",
      "title": "Вынужденные выборы в графе инцидентности",
      "text": "Запишем семь настоящих треугольников как \\(013,036,067,078,123,346,456\\). Разметка допустима тогда и только тогда, когда каждая метка \\(i\\) присвоена отдельному треугольнику, содержащему вершину \\(P_i\\). Поэтому нужно лишь посчитать совершенные паросочетания в этой таблице инцидентности.\n\nМетку \\(2\\) можно поставить только на треугольник \\(123\\), значит \\(\\Delta_2=123\\). Точно так же метку \\(5\\) можно поставить только на треугольник \\(456\\), значит \\(\\Delta_5=456\\).\n\nПосле удаления этих двух треугольников метка \\(1\\) уже не может использовать \\(123\\) и вынужденно идет на \\(013\\). Метка \\(4\\) уже не может использовать \\(456\\) и вынужденно идет на \\(346\\). Оставшиеся неразмеченные треугольники - \\(036,067,078\\), а оставшиеся метки - \\(3,6,7\\). Теперь метка \\(3\\) среди оставшихся треугольников может использовать только \\(036\\); затем метка \\(6\\) вынужденно идет на \\(067\\), а метка \\(7\\) - на \\(078\\).\n\nИтак, каждый шаг вынужден, и единственная допустимая разметка такова:\n\\[\n\\Delta_1=013,\n\\Delta_2=123,\n\\Delta_3=036,\n\\Delta_4=346,\n\\Delta_5=456,\n\\Delta_6=067,\n\\Delta_7=078.\n\\]\nСледовательно, число разметок равно \\(1\\).",
      "idea_ids": [
        "idea-incidence-matching",
        "idea-forced-leaves"
      ],
      "status": "ai_checked",
