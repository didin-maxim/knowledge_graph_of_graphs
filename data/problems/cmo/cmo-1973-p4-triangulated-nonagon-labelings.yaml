        "title": "Официальное условие",
        "text": "Выпуклый многоугольник имеет девять вершин \\(P_0,P_1,\\ldots,P_8\\) в циклическом порядке. Шесть диагоналей разбивают его на семь треугольников \\(P_0P_1P_3\\), \\(P_0P_3P_6\\), \\(P_0P_6P_7\\), \\(P_0P_7P_8\\), \\(P_1P_2P_3\\), \\(P_3P_4P_6\\) и \\(P_4P_5P_6\\). Сколькими способами можно присвоить этим треугольникам названия \\(\\Delta_1,\\Delta_2,\\ldots,\\Delta_7\\) так, чтобы \\(P_i\\) была вершиной треугольника \\(\\Delta_i\\) при \\(i=1,2,\\ldots,7\\)? Обоснуйте ответ.",
