    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Рассмотрим граф, вершинами которого являются клетки прямоугольной доски \\(3\\times n\\), а две вершины соединены ребром тогда и только тогда, когда соответствующие клетки имеют общую сторону. Пусть \\(r_n\\) - число простых путей в этом графе из левой нижней клетки в левую верхнюю клетку. Найдите явную формулу для \\(r_n\\).",
