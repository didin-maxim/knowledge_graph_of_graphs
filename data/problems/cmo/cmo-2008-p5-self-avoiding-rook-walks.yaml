  "solutions": [
    {
      "id": "sol-official-recurrence",
      "title": "Решение через рекурсию",
      "text": "Пусть \\(r_n=R(3,n)\\). Из условия и прямой проверки имеем \\(r_1=1\\), \\(r_2=4\\), \\(r_3=11\\). Докажем рекурсию для \\(n\\ge3\\). Обозначим клетки первого столбца снизу вверх через \\(A,B,C\\); путь идет из \\(A\\) в \\(C\\).\n\nСначала есть один прямой путь \\(A\\to B\\to C\\). Остальные пути в какой-то момент выходят из первого столбца вправо. Разобьем их на случаи.\n\n1. Путь не посещает \\(B\\). Тогда из \\(A\\) он сразу идет вправо, дальше целиком живет в доске из последних \\(n-1\\) столбцов и должен прийти к клетке справа от \\(C\\), после чего последним ходом входит в \\(C\\). После удаления первого столбца это ровно самоизбегающий ладейный путь на доске \\(3\\times(n-1)\\), поэтому таких путей \\(r_{n-1}\\).\n\n2. Путь посещает \\(B\\), после этого уходит вправо из \\(B\\) и затем ни разу не возвращается в нижний ряд. Тогда он обязан идти по средней строке до некоторого столбца \\(j\\), где \\(1\\le j\\le n-1\\) если считать столбцы справа от первого, затем подняться в верхний ряд и идти по верхней строке обратно к \\(C\\). Выбор столбца подъема единственный параметр, поэтому таких путей \\(n-1\\).\n\n3. Путь посещает \\(B\\), уходит вправо из \\(B\\), а затем впервые возвращается в нижний ряд в некотором столбце справа от первого. Пусть справа от места первого возвращения остается полоса ширины \\(k\\), где \\(1\\le k\\le n-2\\). До этого возврата путь вынужден обойти прямоугольный коридор без захода в нижний ряд, а после возврата оставшаяся часть, с точностью до сдвига и поворота картинки на 180 градусов внутри оставшейся полосы, является одним из \\(r_k\\) самоизбегающих путей на доске \\(3\\times k\\). Суммарно по \\(k=1,\\ldots,n-2\\) получаем \\(r_1+r_2+\\cdots+r_{n-2}\\) путей.\n\nСлучаи 2 и 3 имеют симметричные аналоги, если поменять верхний и нижний ряды местами: после посещения \\(B\\) путь может сначала вести себя относительно верхнего ряда так же, как выше относительно нижнего. Поэтому для \\(n\\ge3\\)\n\\[\nr_n=1+r_{n-1}+2\\left((n-1)+r_{n-2}+r_{n-3}+\\cdots+r_1\\right).\n\\]\nДля \\(n+1\\) та же формула дает\n\\[\nr_{n+1}=1+r_n+2\\left(n+r_{n-1}+r_{n-2}+\\cdots+r_1\\right).\n\\]\nВычитая первую формулу из второй, получаем\n\\[\nr_{n+1}-r_n=(r_n-r_{n-1})+2+2r_{n-1},\n\\]\nто есть\n\\[\nr_{n+1}=2r_n+r_{n-1}+2.\n\\]\nПоложим \\(s_n=r_n+1\\). Тогда\n\\[\ns_{n+1}=2s_n+s_{n-1},\\qquad s_1=2,\\quad s_2=5.\n\\]\nХарактеристическое уравнение \\(x^2-2x-1=0\\) имеет корни \\(1+\\sqrt2\\) и \\(1-\\sqrt2\\), поэтому\n\\[\ns_n=A(1+\\sqrt2)^n+B(1-\\sqrt2)^n.\n\\]\nИз начальных условий получается эквивалентная удобная форма\n\\[\ns_n=\\frac{(1+\\sqrt2)^{n+1}-(1-\\sqrt2)^{n+1}}{2\\sqrt2}.\n\\]\nСледовательно,\n\\[\nR(3,n)=r_n=\\frac{(1+\\sqrt2)^{n+1}-(1-\\sqrt2)^{n+1}}{2\\sqrt2}-1.\n\\]\nПроверка при \\(n=1,2,3\\) дает соответственно \\(1,4,11\\), как и в условии.",
      "idea_ids": [
