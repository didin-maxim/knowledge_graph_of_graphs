        "id": "stmt-original",
        "title": "Условие",
        "text": "Самоизбегающий ладейный путь на прямоугольной шахматной доске - это путь из ходов между соседними клетками параллельно сторонам доски, который не пересекает уже пройденную клетку. Пусть \\(R(m,n)\\) - число таких путей на доске \\(m\\times n\\) из левого нижнего угла в левый верхний. Известно, что \\(R(m,1)=1\\), \\(R(2,2)=2\\), \\(R(3,2)=4\\), \\(R(3,3)=11\\). Найдите формулу для \\(R(3,n)\\).",
        "source_id": "src-cmo-2008-official",
        "status": "ai_checked",
