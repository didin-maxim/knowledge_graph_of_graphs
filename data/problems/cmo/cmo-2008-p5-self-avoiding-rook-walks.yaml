  "ideas": [
    {
      "id": "idea-first-column-six-types",
      "title": "Классификация по первому столбцу",
      "text": "Для \\(n\\ge3\\) путь из нижней левой клетки в верхнюю левую либо сразу идет по первому столбцу, либо уходит в доску справа от первого столбца. Если он уходит вправо, то основной выбор - избежать средней клетки первого столбца или пройти через нее; во втором случае нужно учитывать первый возврат в нижний ряд, а затем добавить симметричное семейство для верхнего ряда.",
      "tags": [
        "goal_counting",
        "goal_classification"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-shifted-strip-recurrence",
      "title": "Остаток доски снова является полосой",
      "text": "Когда путь обходит среднюю клетку первого столбца, оставшаяся свобода живет на доске \\(3\\times(n-1)\\). Когда первый возврат фиксирован в некотором столбце, часть пути до возврата вынуждена, а хвост снова считается числом \\(r_k\\) для меньшей полосы.",
      "tags": [
        "induction"
      ],
      "status": "ai_checked"
    }
