        "id": "stmt-original",
        "title": "Минимальная часть официальной задачи",
        "text": "В круговом турнире участвуют \\(2n+1\\) команд, где \\(n\\ge1\\), каждая команда играет с каждой другой командой ровно один раз, и ничьих нет. Три команды \\(X,Y,Z\\) образуют циклическую тройку, если \\(X\\) побеждает \\(Y\\), \\(Y\\) побеждает \\(Z\\), а \\(Z\\) побеждает \\(X\\). Найдите минимально возможное число циклических троек.",
