      "title": "Транзитивный турнир не содержит циклических троек",
      "text": "Если команды линейно упорядочены и каждая более высокая в порядке команда побеждает каждую более низкую, то в любой тройке есть наибольшая команда, побеждающая две остальные. Такая тройка не может быть циклической.",
