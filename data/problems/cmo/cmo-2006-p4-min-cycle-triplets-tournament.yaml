  "solutions": [
    {
      "id": "sol-transitive-construction",
      "title": "Конструкция без циклических троек",
      "text": "Число циклических троек не может быть отрицательным, поэтому минимально возможное значение не меньше \\(0\\).\n\nОсталось построить турнир, где циклических троек нет. Пронумеруем команды \\(T_1,T_2,\\ldots,T_{2n+1}\\) и зададим результаты так: команда с большим номером всегда побеждает команду с меньшим номером. Это корректный круговой турнир без ничьих, потому что для каждой пары команд задан ровно один победитель.\n\nВозьмем любые три команды. Среди их номеров есть наибольший; соответствующая команда побеждает две остальные. В циклической тройке каждая команда имеет ровно одну победу и одно поражение внутри тройки, поэтому команда, побеждающая обе другие, невозможна. Значит, ни одна тройка в построенном турнире не является циклической.\n\nСледовательно, минимально возможное число циклических троек равно \\(0\\).",
