        "id": "stmt-graph",
        "title": "Эквивалентная графовая формулировка",
        "text": "Имеется \\(n\\) вершин, и в начале у каждой вершины есть свой уникальный жетон. За один ход выбирается упорядоченная пара различных вершин \\((u,v)\\), после чего все жетоны, известные вершине \\(u\\), копируются в вершину \\(v\\); вершина \\(u\\) при этом новых жетонов не получает. Определите минимальное число таких направленных передач, после которого каждая вершина знает все \\(n\\) жетонов, и докажите минимальность.",
