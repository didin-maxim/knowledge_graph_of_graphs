      "id": "idea-first-universal-knower",
      "title": "Первый человек, который узнал все",
      "text": "До первого момента, когда кто-то впервые знает все \\(n\\) фактов, информация каждого из остальных \\(n-1\\) людей должна по направленной цепочке дойти до него, что требует как минимум \\(n-1\\) звонков. После этого ни один другой человек еще не знал всего раньше, поэтому каждому из остальных \\(n-1\\) людей нужен хотя бы один последующий входящий звонок с полным набором фактов.",
