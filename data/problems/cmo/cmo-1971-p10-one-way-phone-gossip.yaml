  "solutions": [
    {
      "id": "sol-gather-and-broadcast",
      "title": "Сбор всей информации и обратная рассылка",
      "text": "Ответ: \\(2n-2\\) звонков.\n\nСначала покажем, что столько звонков достаточно. Обозначим людей через \\(P_1,\\ldots,P_n\\). Пусть сначала идут звонки \\(P_1\\to P_2\\), \\(P_2\\to P_3\\), ..., \\(P_{n-1}\\to P_n\\). После этих \\(n-1\\) звонков человек \\(P_n\\) знает все \\(n\\) фактов: каждый следующий человек получает всю уже накопленную информацию.\n\nТеперь передадим эту полную информацию обратно: \\(P_n\\to P_{n-1}\\), \\(P_{n-1}\\to P_{n-2}\\), ..., \\(P_2\\to P_1\\). Каждый звонящий на этом этапе уже знает все факты, поэтому после ещё \\(n-1\\) звонков все люди знают всё. Всего получилось \\(2n-2\\) звонков.\n\nДокажем минимальность. При \\(n=1\\) всё уже известно единственному человеку, и формула даёт \\(0\\). Пусть теперь \\(n\\ge2\\). Рассмотрим первый момент, когда какой-то человек впервые узнал все \\(n\\) фактов; назовём его \\(X\\). До этого момента каждый исходный факт должен был каким-то образом дойти до \\(X\\). Если смотреть только на уже сделанные звонки как на направленные рёбра \\(A\\to B\\), то от каждого человека, кроме \\(X\\), должен существовать направленный путь к \\(X\\). Значит, в этом ориентированном графе хотя бы \\(n-1\\) различных рёбер: иначе его неориентированная основа не могла бы связать все \\(n\\) вершин с \\(X\\). Следовательно, до появления первого человека, знающего всё, нужно не меньше \\(n-1\\) звонков.\n\nВ сам момент появления первого такого человека только получатель звонка может впервые узнать всё. Звонящий не мог уже знать всё раньше, иначе первый момент наступил бы раньше; остальные люди в этом звонке вообще не получают новой информации. Значит, сразу после этого момента ровно один человек знает все факты. Остальным \\(n-1\\) людям ещё нужно впервые узнать полный набор фактов. Каждый из них может сделать это только будучи получателем некоторого последующего звонка, а один звонок имеет только одного получателя. Поэтому после первого появления всезнающего человека требуется ещё как минимум \\(n-1\\) звонков.\n\nИтак, всего необходимо не меньше \\((n-1)+(n-1)=2n-2\\) звонков. Конструкция выше показывает, что эта оценка достигается.",
