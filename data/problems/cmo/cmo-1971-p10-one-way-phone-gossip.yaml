        "title": "Официальное условие",
        "text": "Пусть каждый из \\(n\\) человек знает ровно один факт, причем все \\(n\\) фактов различны. Каждый раз, когда человек \\(A\\) звонит человеку \\(B\\), \\(A\\) сообщает \\(B\\) все, что знает сам, а \\(B\\) ничего не сообщает \\(A\\). Каково минимальное число телефонных звонков между парами людей, необходимое для того, чтобы каждый знал все факты? Докажите, что найденное число минимально.",
