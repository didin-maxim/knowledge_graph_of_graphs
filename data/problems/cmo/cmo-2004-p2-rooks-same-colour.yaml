  "solutions": [
    {
      "id": "sol-official-parity",
      "title": "Решение через два цветовых разбиения",
      "text": "Считаем отдельно чёрные и белые клетки. Пронумеруем строки и столбцы числами от 1 до 9. Для чёрных клеток нечётные строки с нечётными столбцами образуют блок 5x5, а чётные строки с чётными столбцами — блок 4x4. Ладьи из разных блоков не конфликтуют, потому что у них различаются и чётности строк, и чётности столбцов. Полная расстановка 9 ладей на все строки и все столбцы этих двух чёрных блоков выбирается независимо: 5! способов в блоке 5x5 и 4! способов в блоке 4x4, всего 5!4!. Из каждой такой полной расстановки можно удалить любую из 9 ладей. Обратно, всякая расстановка 8 ладей на чёрных клетках единственным образом достраивается до такой полной расстановки: если в блоке 5x5 стоит 5 ладей, то в блоке 4x4 свободны ровно одна строка и один столбец; если в блоке 4x4 стоит 4 ладьи, то в блоке 5x5 свободны ровно одна строка и один столбец. Значит, чёрных расстановок 9·5!4!. Для белых клеток получаются два независимых блока 5x4 и 4x5. Так как в каждом из них можно поставить не больше 4 не бьющих друг друга ладей, при общем числе 8 нужно поставить по 4 ладьи в каждый блок. В блоке 5x4 это можно сделать 5·4! = 5! способами: выбираем пропущенную строку и переставляем четыре столбца; для блока 4x5 выбираем пропущенный столбец и переставляем четыре строки, снова 5! способов. Поэтому белых расстановок (5!)^2. Итого 9·5!4!+(5!)^2=14·5!4!=40320.",
