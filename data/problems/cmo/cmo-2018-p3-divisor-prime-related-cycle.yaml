  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Полная классификация через граф делителей",
      "text": "Ответ: подходят ровно те положительные целые \\(n\\) с хотя бы тремя делителями, которые не являются ни полными квадратами, ни степенями одного простого числа.\n\nСначала докажем необходимость. Пусть все делители подходящего числа \\(n\\) стоят на окружности в порядке\n\\[\nd_1,d_2,\\ldots,d_k,\n\\]\nгде индексы далее понимаются по модулю \\(k\\). Для каждого \\(i\\) соседние делители отличаются умножением или делением на один простой множитель, поэтому\n\\[\n\\frac{d_{i+1}}{d_i}=p_i^{\\varepsilon_i},\\qquad \\varepsilon_i\\in\\{1,-1\\}.\n\\]\nПеремножая эти равенства по всем \\(i\\), получаем\n\\[\n\\prod_{i=1}^k p_i^{\\varepsilon_i}=\\frac{d_2}{d_1}\\cdot\\frac{d_3}{d_2}\\cdots\\frac{d_1}{d_k}=1.\n\\]\nЗначит, для каждого простого числа количество его появлений с показателем \\(+1\\) равно количеству появлений с показателем \\(-1\\). Поэтому общее число шагов \\(k\\), то есть число делителей \\(n\\), четно. Но число положительных делителей целого числа нечетно тогда и только тогда, когда это число является полным квадратом: в парах \\(d,n/d\\) все делители разбиваются на пары, кроме возможного среднего делителя \\(\\sqrt n\\). Следовательно, подходящее \\(n\\) не может быть квадратом.\n\nКроме того, \\(n\\) не может быть степенью одного простого. Если \\(n=p^a\\), то его делители равны \\(1,p,p^2,\\ldots,p^a\\), и делитель \\(1\\) смежен только с \\(p\\). В циклическом расположении при \\(k\\ge3\\) у каждой вершины должны быть два соседа, что для \\(1\\) невозможно.\n\nТеперь докажем достаточность. Запишем\n\\[\nn=p_1^{e_1}p_2^{e_2}\\cdots p_t^{e_t},\n\\]\nгде \\(t\\ge2\\). Так как \\(n\\) не является квадратом, хотя бы один показатель нечетен; переобозначим простые так, что \\(e_1\\) нечетен.\n\nНачнем с числа \\(p_1^{e_1}p_2^{e_2}\\). Его делители удобно записать как клетки прямоугольника: клетке с координатами \\((i,j)\\), где \\(0\\le i\\le e_1\\), \\(0\\le j\\le e_2\\), соответствует делитель \\(p_1^i p_2^j\\). Соседние по стороне клетки соответствуют делителям, связанным простым множителем: горизонтальный шаг меняет показатель при \\(p_2\\) на \\(1\\), вертикальный шаг меняет показатель при \\(p_1\\) на \\(1\\). У прямоугольника \\((e_1+1)\\times(e_2+1)\\) обе стороны больше \\(1\\), а первая сторона четна.\n\nТакой прямоугольный решёточный граф имеет гамильтонов цикл. Для ясности приведем конструкцию. Если четная сторона имеет длину \\(2s\\), поставим ее горизонтально. Идем вниз по первому столбцу, затем змейкой проходим все внутренние столбцы, не заходя в верхнюю строку, а в конце возвращаемся по верхней строке к начальной клетке. Последовательные клетки всегда имеют общую сторону, каждая клетка посещена ровно один раз до замыкания, а последний шаг по верхней строке возвращает нас в старт. Поэтому все делители \\(p_1^{e_1}p_2^{e_2}\\) можно расставить по окружности с нужным свойством.\n\nОстается объяснить, что можно добавлять новые простые множители в любых положительных степенях. Пусть для числа \\(m\\) уже есть цикл по всем его делителям\n\\[\nd_1,d_2,\\ldots,d_k,d_1.\n\\]\nПо доказанной необходимости \\(k\\) четно. Возьмем простой \\(r\\nmid m\\) и показатель \\(e\\ge1\\). Делители числа \\(mr^e\\) образуют слои: в слое \\(j\\) стоят числа \\(d_1r^j,\\ldots,d_kr^j\\), где \\(0\\le j\\le e\\). Между соседними слоями разрешены вертикальные переходы, потому что они отличаются множителем \\(r\\), а внутри каждого слоя сохраняется тот же цикл по \\(d_i\\).\n\nЗаменим в старом цикле ребро между \\(d_1\\) и \\(d_2\\) длинной цепочкой, проходящей через все новые слои \\(j=1,\\ldots,e\\). Для этого в прямоугольнике с \\(k\\) строками и \\(e\\) столбцами, клетки которого соответствуют \\(d_i r^j\\), нужен гамильтонов путь от \\(d_1r\\) до \\(d_2r\\). Такой путь есть, потому что \\(k\\) четно: из \\(d_1r\\) идем по первой строке до \\(d_1r^e\\), затем вниз по последнему столбцу до \\(d_kr^e\\), а потом змейкой проходим строки \\(k,k-1,\\ldots,2\\) по оставшимся столбцам. Так как число этих строк равно \\(k-1\\) и оно нечетно, последней клеткой будет \\(d_2r\\). Все соседние элементы этой цепочки отличаются либо множителем \\(r\\), либо тем же простым множителем, который соединял соседние \\(d_i\\) в старом цикле. Тогда цепочка\n\\[\nd_1, d_1r,\\ldots,d_2r, d_2\n\\]\nвместе с остальной частью старого цикла дает цикл по всем делителям \\(mr^e\\).\n\nПрименим этот шаг последовательно к \\(p_1^{e_1}p_2^{e_2}\\): сначала добавим \\(p_3^{e_3}\\), затем \\(p_4^{e_4}\\), и так далее до \\(p_t^{e_t}\\). В итоге получаем нужный цикл для исходного \\(n\\).\n\nИтак, необходимые и достаточные условия совпадают: подходят ровно числа с хотя бы тремя делителями, которые не являются ни квадратами, ни степенями одного простого.",
