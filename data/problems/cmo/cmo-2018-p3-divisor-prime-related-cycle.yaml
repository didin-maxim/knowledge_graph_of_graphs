        "title": "Оригинальное условие",
        "text": "Назовём два положительных целых числа \\(a\\) и \\(b\\) связанными простым множителем, если \\(a=pb\\) или \\(b=pa\\) для некоторого простого числа \\(p\\). Найдите все положительные целые \\(n\\), у которых есть хотя бы три делителя и все делители можно без повторений расположить по окружности так, чтобы любые два соседних делителя были связаны простым множителем. Делители \\(1\\) и \\(n\\) тоже учитываются.",
