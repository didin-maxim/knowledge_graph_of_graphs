  "solutions": [
    {
      "id": "sol-official-degree-count",
      "title": "Подсчет транзитивных троек по исходящим степеням",
      "text": "Ответ: минимум равен \\(0\\), максимум равен\n\\[\n\\frac{n(n+1)(2n+1)}6.\n\\]\n\nСначала докажем минимум. Пронумеруем команды \\(T_1,T_2,\\ldots,T_{2n+1}\\) и пусть команда с большим номером всегда побеждает команду с меньшим номером. Тогда в любой тройке команд есть самая большая по номеру команда: она побеждает две остальные. Значит, циклических троек нет, и минимум действительно равен \\(0\\).\n\nТеперь найдем максимум. Рассмотрим произвольный турнир на \\(2n+1\\) командах. Обозначим через \\(c\\) число циклических троек, а через \\(d\\) число остальных троек. Всего троек команд\n\\[\nc+d=\\binom{2n+1}{3}.\n\\]\nЛюбая нециклическая тройка в турнире имеет одну команду, которая побеждает две другие: если три результата не образуют цикл, то они упорядочиваются как «сильная — средняя — слабая». Наоборот, если некоторая команда побеждает две другие внутри выбранной тройки, то эта тройка не может быть циклической.\n\nПусть \\(x_i\\) — число команд, которые побеждает команда \\(T_i\\), то есть ее исходящая степень. Тогда команда \\(T_i\\) является победителем ровно в \\(\\binom{x_i}{2}\\) нециклических троек: достаточно выбрать две команды из тех \\(x_i\\), которых она побеждает. Каждая нециклическая тройка так посчитана ровно один раз, по своему единственному победителю. Следовательно,\n\\[\nd=\\sum_{i=1}^{2n+1}\\binom{x_i}{2}.\n\\]\nКроме того,\n\\[\n\\sum_{i=1}^{2n+1}x_i=\\binom{2n+1}{2}=n(2n+1),\n\\]\nпотому что каждая игра дает ровно одну победу.\n\nОценим сумму \\(d\\). Так как\n\\[\n\\sum_i\\binom{x_i}{2}=\\frac12\\sum_i x_i^2-\\frac12\\sum_i x_i,\n\\]\nа сумма \\(\\sum_i x_i\\) фиксирована, нужно оценить снизу \\(\\sum_i x_i^2\\). По неравенству Коши\n\\[\n(2n+1)\\sum_i x_i^2\\ge \\left(\\sum_i x_i\\right)^2=n^2(2n+1)^2,\n\\]\nто есть \\(\\sum_i x_i^2\\ge n^2(2n+1)\\). Поэтому\n\\[\nd\\ge \\frac12 n^2(2n+1)-\\frac12 n(2n+1)=(2n+1)\\binom n2.\n\\]\nОтсюда\n\\[\nc=\\binom{2n+1}{3}-d\n\\le \\binom{2n+1}{3}-(2n+1)\binom n2\n=\\frac{n(n+1)(2n+1)}6.\n\\]\n\nОсталось показать, что эта оценка достижима. Расположим \\(2n+1\\) команд по кругу и пусть каждая команда побеждает следующие \\(n\\) команд по часовой стрелке, а оставшимся \\(n\\) командам проигрывает. Для каждой пары команд это правило задает ровно один результат: если от первой до второй по часовой стрелке расстояние \\(1,2,\\ldots,n\\), то первая побеждает вторую; если расстояние \\(n+1,\\ldots,2n\\), то побеждает вторая.\n\nВ таком турнире каждая команда имеет исходящую степень \\(n\\). Значит,\n\\[\nd=(2n+1)\binom n2,\n\\]\nи потому число циклических троек равно найденной верхней оценке\n\\[\n\\binom{2n+1}{3}-(2n+1)\binom n2=\\frac{n(n+1)(2n+1)}6.\n\\]\nИтак, минимально возможное число циклических троек равно \\(0\\), а максимально возможное — \\(\\frac{n(n+1)(2n+1)}6\\).",
