  "solutions": [
    {
      "id": "sol-official-russian",
      "title": "Решение через счётчик сторон ориентированных прямых",
      "text": "Ответ: все \\(n\\ge 5\\).\n\nСначала покажем, что при \\(n\\le 4\\) требуемое свойство не гарантировано. Возьмём \\(n\\) различных параллельных прямых. Они делят плоскость всего на \\(n+1\\le 5\\) областей. Но условие требует, чтобы среди областей встретились все шесть пар цветов из \\(\\{A_1,A_2\\}\\times\\{B_1,B_2,B_3\\}\\). Так как одна область получает только одну такую пару, при не более чем пяти областях это невозможно. Значит, такие \\(n\\) не подходят.\n\nТеперь пусть \\(n\\ge 5\\), и рассмотрим произвольную хорошую конфигурацию из \\(n\\) прямых. Слегка повернём всю картинку так, чтобы ни одна прямая не была горизонтальной; это не меняет ни областей, ни их соседства. Ориентируем каждую прямую в направлении возрастания координаты \\(y\\). Тогда у каждой ориентированной прямой есть правая и левая стороны.\n\nДля каждой области \\(R\\) обозначим через \\(k(R)\\) число прямых, для которых область \\(R\\) лежит справа от этой прямой. Очевидно, \\(0\\le k(R)\\le n\\). Важно, что для каждого \\(k=0,1,\\ldots,n\\) найдётся область с \\(k(R)=k\\). Действительно, выберем горизонтальную прямую \\(y=w\\), лежащую выше всех точек пересечения данных прямых. На этой горизонтали все данные прямые пересекаются в различных точках. Если идти по ней слева направо, то сначала точка лежит слева от всех данных прямых, а при пересечении очередной прямой она переходит с её левой стороны на правую. Поэтому значения числа прямых, справа от которых лежит текущая точка, последовательно принимают все значения \\(0,1,\\ldots,n\\). Между соседними точками пересечения находятся точки некоторых областей, что и даёт область для каждого значения \\(k\\).\n\nЗададим раскраску области \\(R\\) по числу \\(k=k(R)\\). Первый цвет пусть будет \\(A_1\\), если \\(k\\) нечётно, и \\(A_2\\), если \\(k\\) чётно. Второй цвет зададим по остатку \\(k\\) по модулю 3: берём \\(B_1\\) при \\(k\\equiv 1\\pmod 3\\), \\(B_2\\) при \\(k\\equiv 2\\pmod 3\\), и \\(B_3\\) при \\(k\\equiv 0\\pmod 3\\).\n\nПроверим условие о соседних областях. Если две области имеют общее ребро, то это ребро лежит на одной из данных прямых. При переходе через него меняется только сторона относительно этой одной прямой, а относительно всех остальных прямых сторона остаётся той же. Поэтому соответствующие значения \\(k\\) отличаются ровно на 1. Следовательно, у соседних областей разная чётность \\(k\\), значит, различаются их цвета типа \\(A\\); кроме того, соседние значения отличаются на 1 и потому имеют разные остатки по модулю 3, значит, различаются и их цвета типа \\(B\\). Значит, никакой из двух цветов не совпадает у двух областей, имеющих общее ребро.\n\nОсталось проверить, что встречаются все шесть пар. Так как \\(n\\ge 5\\), существуют области со значениями \\(k=0,1,2,3,4,5\\). Для этих шести значений получаются пары\n\\[\n(A_2,B_3),\\ (A_1,B_1),\\ (A_2,B_2),\\ (A_1,B_3),\\ (A_2,B_1),\\ (A_1,B_2),\n\\]\nто есть ровно все пары из \\(\\{A_1,A_2\\}\\times\\{B_1,B_2,B_3\\}\\). Поэтому каждая хорошая конфигурация из \\(n\\ge 5\\) прямых раскрашиваема, и ответ действительно \\(n\\ge 5\\).",
