        "id": "stmt-original",
        "title": "Условие задачи",
        "text": "Пусть \\(n\\) — положительное целое число. Набор из \\(n\\) различных прямых делит плоскость на разные, возможно неограниченные, области. Такой набор прямых называется хорошим, если никакие три прямые не пересекаются в одной точке. Раскраской называется назначение каждой области двух цветов так, что первый цвет берётся из \\(\\{A_1,A_2\\}\\), а второй — из \\(\\{B_1,B_2,B_3\\}\\). Данный хороший набор прямых назовём раскрашиваемым, если существует раскраска со свойствами: (a) никакой цвет не назначен двум областям, имеющим общее ребро; (b) для любых \\(i\\in\\{1,2\\}\\) и \\(j\\in\\{1,2,3\\}\\) найдётся хотя бы одна область, которой назначены оба цвета \\(A_i\\) и \\(B_j\\). Найдите все \\(n\\), для которых каждая хорошая конфигурация из \\(n\\) прямых раскрашиваема.",
        "source_id": "src-cmo-2022-official",
        "status": "ai_checked",
