        "title": "Раскраска графа смежности областей",
        "text": "Для хорошей конфигурации из \\(n\\) прямых построим плоский граф смежности областей: его вершинами являются области, а рёбра соединяют области, имеющие общий граничный отрезок. Найдите все \\(n\\), для которых при любой такой конфигурации вершины можно раскрасить упорядоченными парами из \\(\\{A_1,A_2\\}\\times\\{B_1,B_2,B_3\\}\\) так, чтобы у соседних вершин различались обе координаты и встретились все шесть упорядоченных пар.",
