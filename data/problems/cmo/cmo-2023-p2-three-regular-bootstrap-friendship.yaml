        "text": "В классе \\(20\\) учеников, и у каждого ученика ровно три близких друга в этом классе. Пятеро учеников купили билеты на предстоящий концерт. Если ученик видит, что хотя бы двое из его близких друзей купили билеты, он тоже покупает билет. Может ли случиться, что весь класс купит билеты? Дружба взаимна: если ученик \\(A\\) близко дружит с учеником \\(B\\), то \\(B\\) близко дружит с \\(A\\).",
