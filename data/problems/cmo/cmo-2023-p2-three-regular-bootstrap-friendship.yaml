  "solutions": [
    {
      "id": "sol-official-used-friendships-ru",
      "title": "Невозможность по подсчету использованных дружб",
      "text": "Ответ: нет, невозможно.\n\nБудем считать дружбу неупорядоченной парой близких друзей. Так как в классе 20 учеников и у каждого ровно 3 близких друга, сумма степеней равна \\(20\\cdot 3=60\\). Каждая дружба при таком подсчете учтена дважды, поэтому всего в классе ровно \\(30\\) дружб.\n\nРассмотрим процесс после того, как первые пять учеников уже купили билеты. Назовем дружбу использованной, если один из двух учеников в этой паре покупает билет не среди первых пяти, а другой ученик из этой пары уже имел билет в этот момент. Иначе говоря, когда появляется новый покупатель, мы отмечаем его дружбы с теми близкими друзьями, у которых билет уже был.\n\nОдна и та же дружба не может быть использована дважды. Действительно, она используется только в момент, когда один ее конец впервые становится новым покупателем, а другой конец уже имеет билет. После этого оба конца этой дружбы имеют билеты, поэтому позже эта же пара уже не может снова иметь вид \"новый покупатель - старый покупатель\".\n\nПредположим, что в итоге билеты купили все 20 учеников. Тогда после первых пяти должно произойти еще 15 покупок. При каждой такой покупке ученик перед покупкой видит по крайней мере двух близких друзей с билетами, значит, эта покупка использует не менее двух дружб.\n\nДля последней из 15 покупок можно сказать больше. Когда последний ученик покупает билет, остальные 19 учеников уже имеют билеты. У последнего ученика ровно 3 близких друга, и все они уже имеют билеты, поэтому при его покупке используются все 3 его дружбы.\n\nОстальные 14 покупок после первых пяти дают не менее чем по 2 использованные дружбы каждая. Поэтому, если бы весь класс купил билеты, число использованных дружб было бы не меньше\n\\[\n14\\cdot 2+3=31.\n\\]\nНо всего дружб только \\(30\\), а никакая дружба не используется дважды. Получили противоречие. Следовательно, весь класс не может купить билеты.\n\nТот же официальный аргумент можно сформулировать через \"убеждения\". Пусть ученик \\(A\\), уже купивший билет, убеждает ученика \\(B\\), если \\(A\\) и \\(B\\) близкие друзья, а у \\(B\\) еще нет билета. В начале таких направленных убеждений не больше \\(5\\cdot 3=15\\). Когда новый ученик покупает билет, перед покупкой его убеждают по крайней мере двое друзей, а после покупки он сам может убеждать не более одного из своих трех друзей: две соответствующие дружбы уже ведут к людям с билетами. Значит, при каждой из первых 14 новых покупок число убеждений уменьшается как минимум на 1. После 14 таких покупок остается не больше \\(1\\) убеждения, но последнему ученику для покупки нужны по крайней мере \\(2\\). Это снова дает противоречие.",
