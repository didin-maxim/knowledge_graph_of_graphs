  "solutions": [
    {
      "id": "sol-official-ru-expanded",
      "title": "Решение через двудольность, паросочетание и паритет",
      "text": "Ответ: Дэвид имеет выигрышную стратегию тогда и только тогда, когда \\(n\\equiv 2\\pmod 4\\).\n\nПерейдём к графовой формулировке: исходные точки считаем вершинами, а проведённые отрезки — рёбрами. Пересечения отрезков внутри плоскости не имеют значения, потому что в циклах разрешены только исходные точки как вершины. До проигрышного хода построенный граф не содержит нечётных циклов, а значит является двудольным. Будем называть ход безопасным, если после добавления ребра граф всё ещё не содержит нечётного цикла. Если перед ходом безопасных ходов нет, игрок всё равно обязан добавить какое-то ещё отсутствующее ребро и тем самым проигрывает.\n\nРазберём сначала нечётное \\(n\\). Покажем, что Джейкоб может играть очень просто: на каждом своём ходе, если безопасный ход существует, он делает любой безопасный ход. Предположим, что перед некоторым ходом Джейкоба безопасных ходов не осталось. Текущий граф двудолен; возьмём его двудольное разбиение на доли размеров \\(a\\) и \\(b\\), где \\(a+b=n\\). Если между разными долями есть ещё не проведённое ребро, его добавление сохраняет двудольность, то есть даёт безопасный ход. Значит, при отсутствии безопасных ходов граф уже должен быть полным двудольным графом \\(K_{a,b}\\) и иметь \\(ab\\) рёбер. Но \\(n\\) нечётно, поэтому одно из чисел \\(a,b\\) чётно, и \\(ab\\) чётно. С другой стороны, перед ходом Джейкоба уже сделано нечётное число ходов, ведь Дэвид ходит первым. Получили противоречие. Следовательно, пока Дэвид сам не проиграл, у Джейкоба всегда есть безопасный ход; при нечётном \\(n\\) Дэвид выиграть не может.\n\nТеперь пусть \\(n\\) чётно. Назовём граф хорошим, если все его вершины положительной степени можно покрыть паросочетанием, состоящим из уже проведённых рёбер. Иными словами, среди активных вершин есть паросочетание, покрывающее каждую активную вершину ровно один раз.\n\nДокажем ключевое наблюдение. Пусть после предыдущего хода некоторого игрока граф был хорошим, и ещё не все вершины активны. Тогда после своего следующего хода этот игрок может снова получить хороший граф, причём число активных вершин увеличится как минимум на две по сравнению с концом его предыдущего хода.\n\nДействительно, пусть \\(A\\) — множество активных вершин после предыдущего хода этого игрока, а \\(B\\) — множество остальных вершин. По хорошести \\(A\\) покрывается паросочетанием, значит \\(|A|\\) чётно; так как \\(n\\) чётно, число \\(|B|\\) тоже чётно. Рассмотрим ход соперника. Если он соединяет две вершины из \\(A\\), наш игрок отвечает ребром между двумя вершинами из \\(B\\). Если соперник соединяет две вершины из \\(B\\), наш игрок соединяет одну из этих двух вершин с какой-нибудь вершиной из \\(A\\); в самом первом раунде, когда \\(A\\) пусто, вместо этого он соединяет две другие вершины из \\(B\\). Если соперник соединяет вершину из \\(A\\) с вершиной из \\(B\\), то в \\(B\\) есть ещё одна вершина, потому что \\(|B|\\) чётно; наш игрок соединяет эти две вершины из \\(B\\). Во всех случаях ответное ребро имеет хотя бы один конец в вершине, которая до этого была изолированной, поэтому оно не может замкнуть цикл и является безопасным. Старое паросочетание на \\(A\\) сохраняется, а новые активные вершины покрываются либо ребром соперника, либо ответным ребром, согласно описанным случаям. Значит, граф снова хороший, а активных вершин стало как минимум на две больше. Наблюдение доказано.\n\nПусть \\(n\\equiv 2\\pmod 4\\). Пустой граф хорош, поэтому Дэвид применяет доказанное наблюдение к своим ходам и безопасными ходами добивается появления совершенного паросочетания; это произойдёт не позднее чем после того, как станут активны все \\(n\\) вершин. После этого Дэвид просто делает любой безопасный ход, если такой есть. Предположим, что перед некоторым ходом Дэвида безопасных ходов нет. Тогда текущий граф — полный двудольный граф \\(K_{a,b}\\). Кроме того, в нём уже есть совершенное паросочетание. Если бы одна из долей имела больше \\(n/2\\) вершин, две вершины этой доли были бы соединены ребром совершенного паросочетания, что невозможно в двудольном графе. Значит, обе доли имеют размер \\(n/2\\), и число рёбер равно \\((n/2)^2=n^2/4\\). При \\(n\\equiv 2\\pmod 4\\) число \\(n/2\\) нечётно, поэтому \\(n^2/4\\) нечётно. Но перед ходом Дэвида уже сделано чётное число ходов. Противоречие. Следовательно, Дэвид никогда не оказывается первым игроком без безопасного хода; значит, в этом случае он выигрывает.\n\nОстаётся случай \\(n\\equiv 0\\pmod 4\\). После первого хода Дэвида граф состоит из одного ребра и потому хорош. Теперь уже Джейкоб применяет ключевое наблюдение к своим ходам и добивается появления совершенного паросочетания, а затем делает любой безопасный ход, если он есть. Если бы перед ходом Джейкоба безопасных ходов не осталось, текущий граф, как и выше, был бы полным двудольным графом с равными долями размера \\(n/2\\) и имел бы \\(n^2/4\\) рёбер. При \\(n\\equiv 0\\pmod 4\\) число \\(n/2\\) чётно, значит \\(n^2/4\\) чётно. Но перед ходом Джейкоба сделано нечётное число ходов. Это невозможно. Поэтому Джейкоб тоже всегда сможет ходить безопасно, пока Дэвид не проиграет. Итак, Дэвид выигрывает ровно при \\(n\\equiv 2\\pmod 4\\).",
