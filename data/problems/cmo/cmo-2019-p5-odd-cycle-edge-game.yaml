        "title": "Официальная формулировка",
        "text": "Дэвид и Джейкоб играют в игру на \\(n\\ge 3\\) точках плоскости, никакие три из которых не лежат на одной прямой. За ход игрок выбирает две точки, ещё не соединённые отрезком, и проводит между ними новый отрезок. Проигрывает тот игрок, чей ход впервые завершает цикл, состоящий из нечётного числа уже проведённых отрезков. В таком цикле концами каждого отрезка должны быть исходные \\(n\\) точек, а не точки пересечения отрезков, возникшие позже. Дэвид ходит первым. Определите все \\(n\\), при которых у Дэвида есть выигрышная стратегия.",
