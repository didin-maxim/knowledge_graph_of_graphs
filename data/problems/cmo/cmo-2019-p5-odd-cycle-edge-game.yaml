    {
      "id": "sol-lktg-no-isolated-pair",
      "title": "Симметрическая стратегия в варианте без новых компонент",
      "text": "Пусть \\(n\\) чётно. Первым ходом Петя добавляет ребро \\(ab\\). Он фиксирует инволюцию \\(\\sigma\\): вершины \\(a,b\\) неподвижны, а все остальные разбиты на пары \\(x,\\sigma(x)\\). После каждого своего хода Петя поддерживает инварианты: граф сохраняется преобразованием \\(\\sigma\\); обе вершины каждой уже активной пары \\(x,\\sigma(x)\\) лежат в одной доле двудольного графа; все неизолированные вершины образуют одну компоненту. Последнее верно, потому что после первого хода правила запрещают начинать новую компоненту ребром между двумя изолированными вершинами.\n\nПусть Вася сделал безопасный ход. Если он присоединил изолированную вершину \\(x\\) ребром \\(vx\\), Петя добавляет \\(\\sigma(v)\\sigma(x)\\). Вершина \\(\\sigma(x)\\) тоже была изолирована, поэтому ход разрешён и безопасен. Если Вася добавил ребро \\(uv\\) между активными вершинами, Петя добавляет \\(\\sigma(u)\\sigma(v)\\). Это другое ещё не добавленное ребро. Ребро, совпадающее со своим образом, было бы либо первым ребром \\(ab\\), либо соединяло бы парные вершины \\(x,\\sigma(x)\\); но активные парные вершины лежат в одной доле, поэтому такой ход Васи уже создавал бы нечётный цикл. Образ безопасного ребра безопасен, поскольку \\(\\sigma\\) сохраняет доли. Так Петя отвечает на каждый безопасный ход Васи.\n\nПока есть изолированная вершина, её можно безопасно присоединить к активной компоненте, поэтому игра заканчивается только после активации всех вершин. Тогда в каждой доле лежит одна из вершин \\(a,b\\) и некоторое число полных \\(\\sigma\\)-пар, так что размеры обеих долей нечётны. Конечный полный двудольный граф имеет нечётное число рёбер. Следовательно, последний безопасный ход делает Петя, после чего Вася вынужден создать нечётный цикл. Петя выигрывает при каждом чётном \\(n\\).",
