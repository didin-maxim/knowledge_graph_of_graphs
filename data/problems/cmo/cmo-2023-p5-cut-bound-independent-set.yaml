  "solutions": [
    {
      "id": "sol-official-ru-expanded",
      "title": "Точная граница через максимальное \\(2k\\)-разделимое множество",
      "text": "Ответ: \\(m=\\left\\lceil \\frac{n}{4k}\\right\\rceil\\).\n\nСначала покажем, что больше гарантировать нельзя. Запишем \\(n=4kq+r\\), где \\(1\\le r\\le 4k\\); тогда \\(\\left\\lceil n/(4k)\\right\\rceil=q+1\\). Построим граф как несвязное объединение \\(q\\) копий полного графа \\(K_{4k}\\) и одной копии \\(K_r\\). Независимое множество в таком графе может взять не более одной вершины из каждой полной компоненты, поэтому его размер не превосходит \\(q+1=\\left\\lceil n/(4k)\\right\\rceil\\).\n\nПроверим, что этот пример удовлетворяет условию. Рассмотрим произвольный разрез всех вершин. Внутри полной компоненты размера \\(i\\le 4k\\), если разрез делит ее вершины на части размеров \\(a\\) и \\(b\\), число ребер между этими частями равно \\(ab\\). При фиксированном \\(i=a+b\\) имеем\n\\[\nab\\le \\frac{i^2}{4}\\le ki,\n\\]\nпоскольку \\(i\\le 4k\\). Суммируя по всем полным компонентам, получаем, что всего ребер, пересекающих данный разрез, не больше \\(k\\) умножить на суммарное число вершин, то есть не больше \\(kn\\). Значит, условие выполнено, а независимого множества большего размера в этом графе нет. Следовательно, \\(m\\le \\left\\lceil n/(4k)\\right\\rceil\\).\n\nТеперь докажем, что такое множество всегда существует. Назовем множество вершин \\(i\\)-разделимым, если его можно разбить на \\(i\\) попарно не пересекающихся независимых множеств; иначе говоря, индуцированный на нем граф можно правильно раскрасить в \\(i\\) цветов. В данном графе выберем множество \\(S\\) максимального по включению размера среди всех \\(2k\\)-разделимых множеств. Пусть\n\\[\nS=A_1\\sqcup A_2\\sqcup\\cdots\\sqcup A_{2k},\n\\]\nгде каждое \\(A_j\\) независимо, и пусть \\(|S|=t\\).\n\nДокажем, что \\(t\\ge n/2\\). Предположим противное: \\(t<n/2\\). Рассмотрим разрез между \\(S\\) и его дополнением. По условию между этими двумя частями не больше \\(kn\\) ребер. Вне \\(S\\) находится \\(n-t>n/2\\) вершин, поэтому среднее число соседей в \\(S\\) у вершины из дополнения к \\(S\\) меньше\n\\[\n\\frac{kn}{n-t}<2k.\n\\]\nЗначит, найдется вершина \\(u\\notin S\\), имеющая в \\(S\\) не более \\(2k-1\\) соседей. Эти соседи лежат в \\(2k\\) множествах \\(A_1,\\ldots,A_{2k}\\), поэтому хотя бы одно из множеств \\(A_j\\) не содержит соседей вершины \\(u\\). Тогда \\(A_j\\cup\\{u\\}\\) также независимо, а все остальные классы остаются независимыми. Следовательно, \\(S\\cup\\{u\\}\\) тоже \\(2k\\)-разделимо, что противоречит максимальности выбора \\(S\\). Значит, действительно \\(t\\ge n/2\\).\n\nОсталось применить принцип Дирихле к разбиению \\(S\\) на \\(2k\\) независимых множеств. Среди множеств \\(A_1,\\ldots,A_{2k}\\) найдется одно размера не меньше\n\\[\n\\frac{t}{2k}\\ge \\frac{n}{4k}.\n\\]\nПоскольку его размер целый, он не меньше \\(\\left\\lceil n/(4k)\\right\\rceil\\). Это независимое множество требуемого размера. Вместе с построенным выше примером получаем точное значение \\(m=\\left\\lceil n/(4k)\\right\\rceil\\).",
