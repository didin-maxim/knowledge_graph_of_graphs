        "title": "Оригинальное условие",
        "text": "В стране с \\(n\\) городами некоторые пары городов соединены двусторонними дорогами. Замечено, что при любом разбиении страны на две части между этими частями проходит не более \\(kn\\) дорог, где \\(k\\) — фиксированное положительное целое число. Каково наибольшее целое \\(m\\), выраженное через \\(n\\) и \\(k\\), для которого гарантированно найдётся множество из \\(m\\) городов, никакие два из которых не соединены дорогой напрямую?",
