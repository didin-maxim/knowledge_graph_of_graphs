      "text": "Выберите наибольшее множество \\(S\\), которое можно разбить на \\(2k\\) независимых множеств. Если \\(|S|<n/2\\), ограничение на разрез между \\(S\\) и дополнением даёт вершину вне \\(S\\), которую можно добавить в один из цветовых классов.",
