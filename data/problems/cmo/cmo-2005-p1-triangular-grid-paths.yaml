  "solutions": [
    {
      "id": "sol-official-crossings",
      "title": "Решение через горизонтальные линии",
      "text": "Проведем горизонтальные линии, отделяющие соседние ряды единичных треугольников, и обозначим их сверху вниз через \\(l_1,l_2,\\ldots,l_{n-1}\\). Линия \\(l_k\\) отделяет первые \\(k\\) рядов от оставшейся части большого треугольника. Диагональные стороны разбиения делят ее ровно на \\(k\\) единичных отрезков.\n\nРассмотрим допустимый путь. Он начинается в единственном верхнем треугольнике и заканчивается в нижнем ряду. Чтобы попасть из верхней части под линию \\(l_k\\), путь должен хотя бы один раз пересечь \\(l_k\\). С другой стороны, движение вверх запрещено, поэтому после перехода из \\(k\\)-го ряда в \\((k+1)\\)-й путь уже не может снова оказаться выше \\(l_k\\). Значит, каждая линия \\(l_k\\) пересекается ровно один раз. Это пересечение происходит по одному из \\(k\\) единичных отрезков линии \\(l_k\\).\n\nТеперь покажем, что набор выбранных отрезков действительно однозначно задает путь. Если для каждой линии \\(l_k\\) указан отрезок, через который путь переходит из \\(k\\)-го ряда в \\((k+1)\\)-й, то между двумя соседними переходами путь вынужден идти внутри соответствующего ряда по цепочке треугольников от предыдущего отрезка к следующему. В одном ряду такая цепочка единственна: треугольники ряда расположены линейно, а переходы через верхнюю и нижнюю границы задают ее начальный и конечный места. При таком восстановлении путь не поднимается вверх и не повторяет треугольники, потому что каждый ряд проходится один раз и затем навсегда покидается.\n\nИтак, допустимые пути находятся во взаимно однозначном соответствии с выбором одного отрезка на каждой из линий \\(l_1,l_2,\\ldots,l_{n-1}\\). Для \\(l_k\\) есть \\(k\\) вариантов, поэтому по правилу произведения\n\\[\nf(n)=1\\cdot2\\cdot\\ldots\\cdot(n-1)=(n-1)!.\n\\]\nСледовательно, \\(f(2005)=2004!\\).",
