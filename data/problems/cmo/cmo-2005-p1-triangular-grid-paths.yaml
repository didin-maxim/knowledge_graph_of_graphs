    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Пусть вершины графа - единичные треугольники в разбиении равностороннего треугольника со стороной \\(n\\), а две вершины соединены ребром тогда и только тогда, когда соответствующие единичные треугольники имеют общую сторону. Ряды нумеруются сверху вниз; верхний ряд состоит из одной вершины, а нижний ряд - из \\(2n-1\\) вершин, среди которых есть единственная средняя. Обозначим через \\(f(n)\\) число простых путей от верхней вершины к средней вершине нижнего ряда, в которых каждый следующий шаг остается в том же ряду или переходит в следующий более низкий ряд. Найдите \\(f(2005)\\).",
