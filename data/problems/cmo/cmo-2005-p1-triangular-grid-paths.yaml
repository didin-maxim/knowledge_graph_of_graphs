      "id": "idea-cross-lines",
      "title": "Выбор пересечений горизонтальных уровней",
      "text": "Путь обязан ровно один раз пересечь каждую из \\(n-1\\) горизонтальных линий между соседними рядами. На \\(k\\)-й такой линии есть ровно \\(k\\) возможных единичных отрезков пересечения, и независимый выбор этих отрезков восстанавливает единственный путь.",
