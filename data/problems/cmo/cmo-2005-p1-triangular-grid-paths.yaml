        "id": "stmt-original",
        "title": "Условие",
        "text": "Равносторонний треугольник со стороной \\(n\\) разбит на единичные треугольники. Пусть \\(f(n)\\) - число путей от треугольника в верхнем ряду до среднего треугольника в нижнем ряду таких, что соседние треугольники пути имеют общую сторону, путь никогда не идет вверх, то есть из более низкого ряда в более высокий, и не посещает треугольник повторно. Найдите \\(f(2005)\\).",
        "source_id": "src-cmo-2005-official",
