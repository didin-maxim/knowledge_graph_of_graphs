  "solutions": [
    {
      "id": "sol-official-recurrence",
      "title": "Решение через рекурсию по первому чётному члену",
      "text": "Пусть a_1,...,a_n — допустимая перестановка. Важное наблюдение: если соседние члены a_k,a_{k+1} являются последовательными целыми числами, то все члены справа от a_{k+1} должны быть либо меньше обоих этих чисел, либо больше обоих; иначе при дальнейшем движении пришлось бы перескочить через эту пару с разностью больше 2.\n\nТак как a_1=1, имеем a_2=2 или a_2=3. Если a_2=2, то хвост a_2,a_3,...,a_n, после сдвига меток, устроен как допустимая перестановка длины n-1. Это даёт f(n-1) вариантов.\n\nПусть a_2=3. Если a_3=2, то оставшийся хвост состоит из чисел 4,...,n, начинается с 4 и даёт f(n-3) вариантов. Если же a_3>=4, рассмотрим первый чётный член a_{k+1}. Тогда перед ним обязаны идти нечётные числа 1,3,5,...,2k-1 именно в таком порядке, а a_{k+1} равно 2k или 2k-2. Пара a_k,a_{k+1} последовательна, поэтому весь остаток справа лежит по одну сторону от неё. Число 2 ещё справа, значит справа остаются только меньшие чётные числа, и получается единственный зигзаг 1,3,5,...,a_k,...,6,4,2.\n\nСледовательно, для n>=4 выполнено f(n)=f(n-1)+f(n-3)+1. Начальные значения: f(1)=1, f(2)=1, f(3)=2, f(4)=4, f(5)=6. По модулю 3 рекурсия даёт 1,1,2,1,0,0,2,0,1,1,2, то есть значения повторяются с периодом 8. Так как 1996 ≡ 4 (mod 8), получаем f(1996) ≡ f(4) ≡ 1 (mod 3). Значит, f(1996) не делится на 3.",
