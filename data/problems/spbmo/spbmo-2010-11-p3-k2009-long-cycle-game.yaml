        "title": "Условие",
        "text": "В стране 2009 городов и любые два из них соединены дорогой (не проходящей через другие города). Бизнесмен и Министерство Дорожного Строительства играют в игру. Бизнесмен каждое утро приватизирует одну из дорог, а Министерство каждый вечер разрушает по десять еще не приватизированных им дорог. Сможет ли Бизнесмен, несмотря на козни Министерства, создать циклический маршрут из приватизированных дорог, проходящий по одному разу ровно по 75 разным городам?",
