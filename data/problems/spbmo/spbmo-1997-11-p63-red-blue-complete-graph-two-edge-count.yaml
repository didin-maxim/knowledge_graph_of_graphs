  "solutions": [
    {
      "id": "sol-degree-sum-complement",
      "title": "Сравнение графа с дополнением",
      "text": "Пусть \\(m=4n\\). Рассмотрим граф \\(G\\), рёбрами которого являются синие провода. Тогда красные провода образуют дополнительный граф \\(\\overline G\\) на тех же \\(m\\) вершинах. По условию\n\\[\ne(G)=e(\\overline G)=\\frac12\\binom m2.\n\\]\nОбозначим степень вершины \\(v\\) в \\(G\\) через \\(d_v\\). Тогда ее степень в \\(\\overline G\\) равна \\(m-1-d_v\\).\n\nВ произвольном простом графе с \\(e\\) рёбрами число пар непересекающихся рёбер равно\n\\[\n\\binom e2-\\sum_v\\binom{d_v}2. \\tag{1}\n\\]\nДействительно, из всех пар различных рёбер мы вычитаем пары, имеющие общий конец. В простом графе две разные смежные пары рёбер имеют ровно один общий конец, поэтому каждая такая пара вычитается ровно один раз.\n\nУ графов \\(G\\) и \\(\\overline G\\) одинаковое число рёбер, значит в формуле (1) первые слагаемые \\(\\binom e2\\) совпадают. Осталось доказать, что совпадают суммы \\(\\sum_v\\binom{d_v}2\\) и \\(\\sum_v\\binom{m-1-d_v}2\\).\n\nПоложим \\(N=m-1\\). Для каждой вершины\n\\[\n\\binom{d_v}2-\\binom{N-d_v}2=(N-1)\\left(d_v-\\frac N2\\right).\n\\]\nСуммируя по всем вершинам, получаем\n\\[\n\\sum_v\\left(\\binom{d_v}2-\\binom{N-d_v}2\\right)=(N-1)\\left(\\sum_v d_v-\\frac{mN}{2}\\right).\n\\]\nНо \\(\\sum_v d_v=2e(G)=\\binom m2=mN/2\\), так как синих рёбер ровно половина всех рёбер \\(K_m\\). Поэтому последняя скобка равна нулю, и суммы смежных пар рёбер в \\(G\\) и \\(\\overline G\\) одинаковы.\n\nСледовательно, по формуле (1) число пар непересекающихся синих рёбер равно числу пар непересекающихся красных рёбер. Именно эти пары и являются способами вывести прибор из строя удалением двух одноцветных проводов между четырьмя микросхемами.",
