  "ideas": [
    {
      "id": "idea-acquaintance-complement-symmetry",
      "title": "Знакомства и незнакомства симметричны через дополнительный граф",
      "text": "Условие про стеснительных людей -- это условие про общительных людей в дополнительном графе незнакомств. Поэтому в решении удобно одновременно следить за степенью вершины и числом ее несоседей, то есть числом незнакомых.",
      "tags": [
        "graph_model",
        "degree_counting"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-neighborhood-forces-independent-or-clique",
      "title": "Большая окрестность обязана быть независимой, а большая неокрестность -- кликой",
      "text": "Если у вершины есть хотя бы 20 знакомых, то среди этих знакомых не может быть знакомой пары; иначе вершина общительна. Если у вершины есть хотя бы 20 незнакомых, то все эти незнакомые обязаны быть попарно знакомы; иначе вершина стеснительна.",
      "tags": [
        "extremal_graph_theory",
        "degree_counting"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-k20-20-is-tight",
      "title": "Граница достигается полным двудольным графом \\(K_{20,20}\\)",
      "text": "Разделим 40 человек на две группы по 20 и познакомим только людей из разных групп. Тогда у каждого ровно 20 знакомых, но его знакомые попарно незнакомы; незнакомых у каждого только 19.",
      "tags": [
        "construction",
        "goal_exact_bound"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-degree-codegree-threshold",
      "title": "Оценка через степени и конструкция \\(K_{20,20}\\)",
      "text": "Рассмотрим граф знакомств \\(G\\): вершины -- люди, ребра -- пары знакомых. Для вершины \\(v\\) обозначим через \\(d(v)\\) число ее знакомых, а через \\(m(v)=n-1-d(v)\\) число ее незнакомых.\n\nСначала докажем важное наблюдение: ни у какой вершины не могут одновременно выполняться \\(d(v)\\ge 20\\) и \\(m(v)\\ge 20\\). Действительно, если \\(d(v)\\ge 20\\), то все знакомые вершины \\(v\\) попарно незнакомы, иначе \\(v\\) была бы общительной. Если \\(m(v)\\ge 20\\), то все незнакомые вершины \\(v\\) попарно знакомы, иначе \\(v\\) была бы стеснительной.\n\nПусть \\(N\\) -- множество знакомых \\(v\\), а \\(M\\) -- множество незнакомых \\(v\\). Если \\(|M|\\ge 21\\), то любой человек из \\(M\\) имеет в \\(M\\) не меньше 20 знакомых, причем среди них есть знакомая пара; значит, он общителен. Поэтому \\(|M|\\le 20\\). Если \\(|N|\\ge 21\\), то любой человек из \\(N\\) имеет в \\(N\\setminus\\{u\\}\\) не меньше 20 незнакомых, среди которых есть незнакомая пара; значит, он стеснителен. Поэтому \\(|N|\\le 20\\). Остается только случай \\(|N|=|M|=20\\). Тогда для любого \\(u\\in N\\), чтобы не стать стеснительным, вершина \\(u\\) должна быть знакома со всеми вершинами из \\(M\\): иначе к 19 незнакомым из \\(N\\setminus\\{u\\}\\) добавился бы еще один незнакомый из \\(M\\). Но тогда у \\(u\\) есть 20 знакомых из \\(M\\), попарно знакомых между собой, и \\(u\\) общителен. Противоречие.\n\nТеперь предположим, что в компании не меньше 41 человека. Если у некоторого человека \\(v\\) есть хотя бы 20 знакомых, то по наблюдению незнакомых у него не больше 19, значит знакомых у него хотя бы \\(n-20\\ge 21\\). Все эти знакомые попарно незнакомы. Возьмем одного из них, \\(u\\). Тогда остальные знакомые \\(v\\) -- это как минимум 20 человек, которые незнакомы с \\(u\\) и попарно незнакомы между собой. Значит, \\(u\\) стеснителен, противоречие.\n\nСледовательно, при \\(n\\ge 41\\) у каждого человека меньше 20 знакомых. Тогда у каждого человека не меньше \\(n-20\\ge 21\\) незнакомых. Но среди незнакомых любого человека все должны быть попарно знакомы; иначе этот человек стеснителен. Возьмем человека \\(v\\) и одного из его незнакомых \\(u\\). У вершины \\(u\\) есть по крайней мере 20 знакомых среди остальных незнакомых \\(v\\), и эти знакомые попарно знакомы между собой. Значит, \\(u\\) общителен. Снова противоречие. Поэтому людей не может быть 41 или больше.\n\nОсталось показать, что 40 человек возможны. Разобьем их на две группы по 20 человек и будем считать знакомыми ровно пары из разных групп. Тогда у каждого человека ровно 20 знакомых, но никакие двое из них не знакомы между собой, так что общительных нет. Незнакомых у каждого только 19, так что стеснительных тоже нет. Следовательно, наибольшее возможное число людей равно \\(40\\).",
