        "id": "stmt-original",
        "title": "Условие",
        "text": "На встречу собралась компания. Назовем человека общительным, если в этой компании у него есть не меньше 20 знакомых, причем хотя бы двое из них знакомы между собой. Назовем человека стеснительным, если в этой компании у него есть не меньше 20 незнакомых, причем хотя бы двое из них незнакомы между собой. Оказалось, что в собравшейся компании нет ни общительных, ни стеснительных людей. Какое наибольшее число людей может в ней быть?",
