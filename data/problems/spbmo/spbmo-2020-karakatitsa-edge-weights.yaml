      "id": "idea-maximum-matching-unmatched-independent",
      "title": "Вес вершин и максимальное паросочетание",
      "text": "Официальное решение вводит вес вершины как сумму весов инцидентных рёбер. Условие означает, что сумма весов двух смежных вершин неотрицательна. Берём максимальное паросочетание: покрытые им вершины дают неотрицательный вклад, а непокрытые образуют независимое множество и могут быть связаны только с покрытыми вершинами.",
