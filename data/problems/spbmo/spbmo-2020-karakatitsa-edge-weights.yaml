  "solutions": [
    {
      "id": "sol-official-matching",
      "title": "Официальная оценка через максимальное паросочетание",
      "text": "Обозначим вес ребра e через w(e), а через v(A) обозначим сумму весов всех рёбер, инцидентных вершине A. Если W — сумма весов всех рёбер графа, то \\(\\sum_A v(A)=2W\\), потому что каждое ребро учитывается ровно у двух своих концов. Поэтому достаточно доказать, что сумма всех вершинных весов не меньше -20000.\n\nДля ребра AB сумма весов его каракатицы равна v(A)+v(B)-w(AB): в v(A)+v(B) само ребро AB посчитано дважды, а в каракатице один раз. По условию эта сумма не меньше 1, а w(AB) равно 1 или -1. Значит\n\\[v(A)+v(B)=\\text{вес каракатицы }AB+w(AB)\\ge 1-1=0.\\]\nИтак, для любых двух смежных вершин сумма их вершинных весов неотрицательна.\n\nВозьмём паросочетание M максимального размера и пусть в нём k рёбер. Сумма весов вершин, покрытых M, неотрицательна: разбиваем эти 2k вершин на k пар — концов рёбер из M, и для каждой пары только что доказали неотрицательность суммы.\n\nПусть S — множество непокрытых вершин. Тогда \\(|S|=400-2k\\). В S нет двух смежных вершин, иначе ребро между ними можно было бы добавить к M и получить большее паросочетание. Поэтому суммарный вес вершин из S равен сумме весов всех рёбер между S и вершинами, покрытыми M: внутренних рёбер в S нет, а других непокрытых вершин вне S нет.\n\nОценим число таких рёбер. Зафиксируем ребро UV из M и положим s=|S|. Докажем, что из U и V суммарно идёт в S не больше s рёбер. Если s=0, это очевидно. Если s>0, то s чётно, поскольку s=400-2k; значит, s\\ge 2. Предположим, что из U и V в S идёт больше s рёбер. Если все эти рёбра ведут только из одной из вершин U,V, их не больше s, противоречие; значит, обе вершины имеют соседей в S. Если нельзя выбрать две разные вершины X,Y из S так, чтобы UX и VY были рёбрами, то все соседи U и V в S совпадают с одной и той же вершиной, и рёбер из {U,V} в S не больше 2\\le s, снова противоречие. Следовательно, существуют разные X,Y\\in S, для которых UX и VY — рёбра. Тогда можно удалить из M ребро UV и добавить два ребра UX и VY; получится паросочетание из k+1 рёбер, что невозможно. Значит, из концов каждого ребра M в S действительно идёт не больше s рёбер.\n\nВсего рёбер между S и покрытыми вершинами не больше \\(k|S|=k(400-2k)=2k(200-k)\\). При \\(0\\le k\\le 200\\) имеем \\(k(200-k)\\le 10000\\), так как максимум этой квадратичной функции достигается при k=100. Поэтому таких рёбер не больше 20000. На каждом из них стоит вес не меньше -1, значит, суммарный вес вершин из S не меньше -20000. Добавляя неотрицательный вклад покрытых вершин, получаем \\(\\sum_A v(A)\\ge -20000\\). Тогда \\(2W\\ge -20000\\), то есть \\(W\\ge -10000\\). Это и требовалось доказать.",
