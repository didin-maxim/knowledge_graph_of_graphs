        "title": "Условие СПбМО 2017, 11 класс, II тур, задача 6",
        "text": "В стране некоторые математики знакомы между собой, и при любом разбиении математиков на две непустые группы найдутся двое знакомых из разных групп. Известно, что если посадить за круглый стол любой набор из 4 или более математиков так, чтобы любые два соседа были знакомы, то за столом найдутся двое знакомых, не сидящих рядом. Обозначим через \\(c_i\\) количество наборов из \\(i\\) попарно знакомых математиков. Докажите, что \\(c_1-c_2+c_3-c_4+\\ldots=1\\).",
