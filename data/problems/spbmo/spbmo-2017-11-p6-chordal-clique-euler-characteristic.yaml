      "title": "Разрез хордалного графа является кликой",
      "text": "В связном не полном хордалном графе минимальный вершинный разделитель между двумя несмежными вершинами обязан быть кликой: иначе два пути через разные компоненты вместе дали бы цикл без хорды. Это позволяет разрезать граф на меньшие хордалные графы и применить включение-исключение к числам клик.",
