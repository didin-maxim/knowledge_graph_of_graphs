  "solutions": [
    {
      "id": "sol-clique-separator-euler-characteristic",
      "title": "Индукция по кликовому разделителю",
      "text": "Переведём условие на язык графов. Вершинами графа \\(G\\) будут математики, а рёбрами -- знакомства. Первое условие означает связность: если граф был бы несвязен, его компоненты можно было бы разбить на две непустые группы без рёбер между ними; обратно, любое разбиение без ребра между частями отделяло бы одни вершины от других. Второе условие означает, что в каждом цикле длины хотя бы 4 есть хорда: посадка вдоль цикла даёт знакомых соседей, а найденные знакомые несоседи дают хорду. Итак, надо доказать утверждение для конечного связного хордалного графа.\n\nДля графа \\(H\\) обозначим через \\(F(H)\\) величину \\(c_1(H)-c_2(H)+c_3(H)-\\ldots\\), где \\(c_i(H)\\) -- число клик размера \\(i\\). Докажем по индукции по числу вершин, что \\(F(G)=1\\) для всякого непустого связного хордалного графа \\(G\\).\n\nЕсли \\(G\\) -- полный граф на \\(m\\) вершинах, то его клики -- все непустые подмножества вершин. Поэтому\n\\[\nF(G)=\\binom m1-\\binom m2+\\binom m3-\\ldots=1,\n\\]\nтак как \\((1-1)^m=0\\).\n\nПусть теперь \\(G\\) не полный. Выберем две несмежные вершины \\(x\\) и \\(y\\), а среди всех множеств вершин, удаление которых отделяет \\(x\\) от \\(y\\), возьмём минимальное по включению множество \\(S\\). Покажем, что \\(S\\) является кликой. Пусть \\(A\\) и \\(B\\) -- компоненты графа \\(G-S\\), содержащие соответственно \\(x\\) и \\(y\\). Из минимальности \\(S\\) следует, что каждая вершина \\(S\\) имеет соседа в \\(A\\) и соседа в \\(B\\): иначе эту вершину можно было бы удалить из разделителя, и \\(x\\) с \\(y\\) всё равно остались бы разделены.\n\nПредположим, что две вершины \\(u,v\\in S\\) не соединены ребром. Так как \\(u\\) и \\(v\\) имеют соседей в связной компоненте \\(A\\), существует путь из \\(u\\) в \\(v\\), внутренние вершины которого лежат в \\(A\\); возьмём такой путь кратчайшим. По той же причине существует кратчайший путь из \\(u\\) в \\(v\\) с внутренними вершинами в \\(B\\). Эти два пути вместе образуют цикл длины хотя бы 4. Внутри каждого из двух путей хорд нет по кратчайшести, рёбер между внутренними вершинами из \\(A\\) и из \\(B\\) нет, потому что это разные компоненты графа \\(G-S\\), а ребра \\(uv\\) нет по предположению. Значит, получился цикл без хорды, что противоречит хордалности. Следовательно, любые две вершины из \\(S\\) смежны, то есть \\(S\\) -- клика.\n\nТеперь рассмотрим индуцированные подграфы \\(G_1=G[S\\cup A]\\) и \\(G_2=G[V(G)\\setminus A]\\). Оба они связны: компоненту \\(A\\) соединяет с \\(S\\) каждая вершина \\(S\\), а все остальные компоненты графа \\(G-S\\) присоединены к клике \\(S\\), поскольку исходный граф связен. Оба подграфа хордалны, потому что индуцированный цикл без хорды в одном из них был бы таким же циклом в \\(G\\). Кроме того, оба они имеют меньше вершин, чем \\(G\\), так как \\(x\\in A\\), а \\(y\\notin A\\).\n\nВсякая клика графа \\(G\\) целиком лежит либо в \\(G_1\\), либо в \\(G_2\\): между \\(A\\) и остальными вершинами вне \\(S\\) рёбер нет. Клики, посчитанные в обоих подграфах, -- ровно клики, лежащие в \\(S\\). Но \\(S\\) сама клика, поэтому для полного графа на \\(|S|\\) вершинах уже доказано \\(F(S)=1\\). По индукционному предположению \\(F(G_1)=F(G_2)=1\\), и включение-исключение даёт\n\\[\nF(G)=F(G_1)+F(G_2)-F(S)=1+1-1=1.\n\\]\nЭто и есть требуемое равенство \\(c_1-c_2+c_3-c_4+\\ldots=1\\).",
