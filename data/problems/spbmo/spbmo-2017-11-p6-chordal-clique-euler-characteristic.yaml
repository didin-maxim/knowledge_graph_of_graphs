      "id": "idea-chordal-translation",
      "title": "Рассадка за круглый стол задаёт хордальность",
      "text": "Если выбранные математики сидят по циклу и соседи знакомы, то дополнительные знакомые несоседних людей являются хордами этого цикла. Поэтому условие о любой рассадке из четырёх и более человек означает, что граф знакомств не содержит индуцированных циклов длины хотя бы 4.",
