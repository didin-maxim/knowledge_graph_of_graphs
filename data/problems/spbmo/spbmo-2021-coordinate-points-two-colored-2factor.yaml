        "title": "Числа 1 и -1 в точках плоскости",
        "text": "На плоскости даны 5000 точек, никакие две из которых не лежат на одной вертикальной или горизонтальной прямой. Серёжа хочет так расставить в этих точках числа 1 и -1, чтобы сумма всех чисел, расположенных слева от любой вертикальной прямой, была равна 0, 1 или -1, и сумма всех чисел, расположенных сверху от любой горизонтальной прямой, также была равна 0, 1 или -1. Верно ли, что при любом расположении точек он сможет этого добиться?",
