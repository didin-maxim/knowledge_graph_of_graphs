    {
      "id": "sol-official-bipartition",
      "title": "Официальная двудольная раскраска вспомогательного графа",
      "text": "Ответ: да.\n\nОбозначим точки в порядке возрастания абсциссы через \\(P_1,P_2,\\ldots,P_{5000}\\). Разобьём их на пары \\((P_1,P_2),(P_3,P_4),\\ldots,(P_{4999},P_{5000})\\) и соединим точки каждой такой пары красным ребром. Затем обозначим точки в порядке возрастания ординаты через \\(Q_1,Q_2,\\ldots,Q_{5000}\\), разобьём их на пары \\((Q_1,Q_2),(Q_3,Q_4),\\ldots,(Q_{4999},Q_{5000})\\) и соединим точки каждой такой пары синим ребром.\n\nПокажем сначала, почему достаточно поставить разные числа на концах каждого красного и каждого синего ребра. Возьмём любую вертикальную прямую. Так как никакие две точки не лежат на одной вертикали, слева от этой прямой находятся ровно первые \\(m\\) точек в порядке возрастания абсциссы при некотором \\(m\\) от 0 до 5000. Если \\(m\\) чётно, эти точки разбиваются на целые красные пары, а сумма чисел в каждой такой паре равна 0. Если \\(m\\) нечётно, среди первых \\(m\\) точек есть несколько целых красных пар и ровно одна точка из следующей пары, поэтому сумма равна числу в этой единственной точке, то есть 1 или -1. Следовательно, все вертикальные префиксные суммы будут равны 0, 1 или -1. Для горизонтальной прямой множество точек сверху от неё имеет вид \\(Q_j,Q_{j+1},\\ldots,Q_{5000}\\) или дополняет до всех точек начальный отрезок порядка по ординате. Общая сумма всех 5000 чисел равна 0, потому что точки разбиты на красные пары с нулевой суммой; значит, сумма по верхнему суффиксу равна сумме по дополнительному нижнему префиксу, взятой с противоположным знаком. Нижние префиксы по ординате контролируются синими парами: целая пара даёт вклад 0, а одна возможная неполная пара даёт вклад 1 или -1.\n\nОсталось доказать, что можно поставить числа так, чтобы концы каждого построенного ребра имели разные знаки. Рассмотрим построенный двухцветный мультиграф \\(G\\), вершинами которого являются исходные точки. Петли в нём невозможны, потому что в каждой паре соединяются две разные точки. Из каждой вершины выходит ровно одно красное ребро и ровно одно синее ребро: каждая точка входит ровно в одну пару по абсциссе и ровно в одну пару по ординате. Если красная и синяя пары у двух точек совпали, между этими двумя вершинами идут два разных ребра; поэтому корректно говорить о мультиграфе.\n\nВ этом мультиграфе степень каждой вершины равна 2. Рассмотрим одну связную компоненту и начнём в ней простой путь максимальной длины. Конец такого пути не может иметь соседа вне уже пройденных вершин, иначе путь можно было бы продолжить. Поэтому оба ребра из конца пути ведут к вершинам пути; одно из них ведёт к предыдущей вершине, а второе замыкает путь в цикл. После замыкания каждая вершина этого цикла уже имеет внутри цикла две инцидентные связи, то есть все свои рёбра компоненты. Значит, вся компонента является циклом. Вдоль такого цикла красные и синие рёбра чередуются, потому что в каждой вершине есть ровно одно ребро каждого цвета. Поэтому длина цикла чётна, включая возможный случай двух параллельных рёбер между двумя вершинами.\n\nКаждый чётный цикл двудолен: раскрасим его вершины попеременно в две доли при обходе цикла; чётность гарантирует, что при возвращении в начальную вершину противоречия не возникнет. Сделаем это независимо в каждой компоненте графа \\(G\\). Теперь поставим число 1 во всех вершинах первой доли каждой компоненты и число -1 во всех вершинах второй доли. Любое ребро соединяет разные доли, значит его концы получили разные числа. По доказанному выше это даёт требуемую расстановку для всех вертикальных и горизонтальных прямых.",
