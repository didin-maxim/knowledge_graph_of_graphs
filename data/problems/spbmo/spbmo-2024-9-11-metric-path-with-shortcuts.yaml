    },
    {
      "id": "idea-line-intersection-diameter",
      "title": "Пересадки как расстояние между линиями",
      "text": "Если построить вспомогательный граф, вершины которого соответствуют линиям, а две линии соединены при наличии общей станции, то число пересадок между двумя станциями контролируется расстоянием между подходящими вершинами этого вспомогательного графа. Полное решение, вероятно, должно дать точную экстремальную оценку диаметра такого графа при оптимальном разбиении дерева на пути.",
