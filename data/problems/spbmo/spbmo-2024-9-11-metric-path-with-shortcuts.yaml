      "id": "idea-spanning-tree-reduction",
      "title": "Достаточно контролировать остовное дерево",
      "text": "Для верхней гарантии естественно выбрать остовное дерево и разбивать его рёбра на простые пути; остальные рёбра исходного графа можно положить в однотоннельные линии и не использовать в маршрутах. Поэтому содержательная часть задачи сводится к разбиению рёбер произвольного дерева на пути с малым числом переходов между путями.",
