        "title": "Оригинальная формулировка",
        "text": "В очень большом Городе строят метро: много станций, некоторые пары которых соединены тоннелями, причем от любой станции можно добраться по тоннелям до любой другой. Все тоннели метро требуется разбить на <<линии>>: каждая линия состоит из нескольких последовательных тоннелей, все станции в которых различны (в частности, линия не должна быть кольцевой); допускаются и линии, состоящие из одного тоннеля.\n\nПо закону требуется, чтобы от любой станции до любой другой можно было доехать, сделав не более 100 пересадок с линии на линию. При каком наибольшем \\(N\\) любое связное метро с \\(N\\) станциями можно разбить на линии, соблюдая закон?",
