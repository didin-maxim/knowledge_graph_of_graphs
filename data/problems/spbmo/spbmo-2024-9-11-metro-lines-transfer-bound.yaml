  "solutions": [
    {
      "id": "sol-branch-rank-exact-threshold",
      "title": "Ответ \\(3\\cdot 2^{51}-3\\): ранги ветвей дерева",
      "text": "Ответ: \\(3\\cdot 2^{51}-3=6755399441055741\\).\n\nСначала перейдём к графам. Станции будем считать вершинами, тоннели — рёбрами. Для верхней оценки достаточно выбрать остовное дерево: если его рёбра разбиты на подходящие линии, то остальные рёбра исходного графа можно сделать однотоннельными линиями и просто не пользоваться ими при поездках. Поэтому дальше решаем задачу для деревьев. В дереве разбиение рёбер на линии удобно понимать локально: в каждой вершине некоторые пары инцидентных рёбер склеены в одну линию, а каждое ребро участвует не более чем в одной такой склейке с каждой стороны. При движении по единственному пути между двумя вершинами пересадка происходит ровно в тех внутренних вершинах пути, где две соседние стороны пути не склеены.\n\nНам понадобится стандартная лемма о рангах ветвей дерева. Для ориентированного ребра \\(xy\\) рассмотрим компоненту, содержащую \\(y\\), после удаления ребра \\(xy\\). Её ранг \\(r(x,y)\\) определим рекурсивно. Если из \\(y\\) дальше идти некуда, то \\(r(x,y)=0\\). Иначе выпишем по убыванию ранги \\(r(y,z)\\) по всем соседям \\(z\\ne x\\): \\(a_1\\ge a_2\\ge\\ldots\\), считая отсутствующий \\(a_2\\) равным \\(-1\\), и положим\n\\[\nr(x,y)=\\max(a_1,a_2+1).\n\\]\nСмысл такой: если поезд входит в эту ветвь по ребру \\(xy\\), то в вершине \\(y\\) та же линия может продолжиться не более чем в одну следующую ветвь; во все остальные следующие ветви при необходимости придётся пересаживаться. Поэтому по индукции \\(r(x,y)\\) — это точное минимально возможное худшее число дальнейших пересадок от входа в ветвь до произвольной её вершины. Из того же определения следует, что ветвь ранга \\(s\\) содержит не меньше \\(2^{s+1}-1\\) вершин: для ранга 0 это один конец, а для увеличения ранга до \\(s\\) нужны две подветви ранга хотя бы \\(s-1\\).\n\nЕщё одна форма той же индукции даёт критерий для всего дерева. Пусть в вершине \\(v\\) ранги всех выходящих из неё ветвей равны \\(b_1\\ge b_2\\ge b_3\\ge\\ldots\\). Если степень \\(v\\) равна 0 или 1, эта вершина ничего не ограничивает; если степень равна 2, вклад вершины равен \\(b_1+b_2\\); если степень хотя бы 3, вклад равен\n\\[\n\\max(b_1+b_2,\\ b_1+b_3+1).\n\\]\nДействительно, в вершине можно склеить в одну линию не более двух выходящих ветвей. Лучший локальный выбор — склеить две ветви с наибольшими рангами; путь между ними не получает новой пересадки в \\(v\\), а путь из самой большой ветви в третью по рангу получает одну пересадку. Индукция по ветвям показывает, что минимально возможное максимальное число пересадок во всём дереве равно максимуму этих вкладов по всем вершинам.\n\nТеперь докажем верхнюю оценку. Пусть в дереве не больше \\(3\\cdot2^{51}-3\\) вершин. Если какая-то вершина имела бы вклад хотя бы 101, то возник бы один из двух случаев.\n\nПервый случай: есть две ветви с рангами \\(a,b\\), где \\(a+b\\ge101\\). Тогда только эти две ветви и сама вершина содержали бы не меньше\n\\[\n1+(2^{a+1}-1)+(2^{b+1}-1)\\ge 1+(2^{52}-1)+(2^{51}-1)=3\\cdot2^{51}-1\n\\]\nвершин; минимум достигается при \\(a=51,b=50\\). Это больше разрешённого числа вершин.\n\nВторой случай: есть три ветви с рангами \\(a\\ge b\\ge c\\), где \\(a+c+1\\ge101\\). Тогда дерево содержало бы не меньше\n\\[\n1+(2^{a+1}-1)+(2^{b+1}-1)+(2^{c+1}-1)\\ge 3\\cdot2^{51}-2\n\\]\nвершин; минимум достигается при \\((a,b,c)=(50,50,50)\\) или \\((51,49,49)\\). Это тоже больше \\(3\\cdot2^{51}-3\\). Значит, вклад каждой вершины не превосходит 100, и по критерию дерево можно разбить на линии так, чтобы между любыми двумя станциями было не более 100 пересадок. Следовательно, любое связное метро с \\(3\\cdot2^{51}-3\\) станциями удовлетворяет закону.\n\nОсталось построить контрпример на одну станцию больше. Возьмём одну центральную вершину и присоединим к ней три одинаковые ветви ранга 50 минимального размера: каждая такая ветвь строится рекурсивно, разветвляясь на две ветви ранга на 1 меньше, а ветвь ранга 0 — один лист. В каждой ветви \\(2^{51}-1\\) вершин, всего получается\n\\[\n1+3(2^{51}-1)=3\\cdot2^{51}-2\n\\]\nстанции.\n\nКак бы ни были разбиты рёбра этого дерева на линии, в центральной вершине среди трёх главных ветвей найдутся две, не лежащие на одной линии через центр. В каждой из этих двух ветвей по определению ранга 50 можно выбрать станцию, до которой от центра неизбежно требуется не меньше 50 пересадок внутри ветви. Поездка между двумя выбранными станциями проходит через центр, даёт не меньше \\(50+1+50=101\\) пересадки и нарушает закон. Если нужно получить контрпример с ещё большим числом станций, достаточно добавить к центру новые листья: три тяжёлые ветви ранга 50 всё равно останутся, и тот же аргумент сохранится. Поэтому наибольшее \\(N\\) равно \\(3\\cdot2^{51}-3\\).",
