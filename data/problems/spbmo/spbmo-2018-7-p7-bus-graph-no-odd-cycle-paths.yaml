        "text": "В стране некоторые города соединены прямыми автобусными рейсами. Жители этой страны считают некоторое нечетное натуральное число \\(n\\) несчастливым, поэтому не существует циклического маршрута, состоящего ровно из \\(n\\) рейсов и не заходящего ни в один город дважды. Тем не менее, из любого города до любого другого существует путь, содержащий ровно 100 рейсов и не проходящий ни через один город дважды. При каких нечетных \\(n\\) это возможно?",
