  "solutions": [
    {
      "id": "sol-classification-101",
      "title": "Все нечётные n, кроме 101",
      "text": "Ответ: все нечётные натуральные \\(n\\), кроме \\(101\\).\n\nСначала докажем, что \\(n=101\\) невозможно. В графе есть хотя бы одно ребро: например, возьмём две различные вершины и рассмотрим простой путь длины 100 между ними; на нём есть рёбра. Пусть \\(uv\\) — любое ребро. По условию между \\(u\\) и \\(v\\) существует простой путь \\(P\\), состоящий ровно из 100 рёбер. Этот путь не использует ребро \\(uv\\): простой путь с концами \\(u\\) и \\(v\\), использующий ребро \\(uv\\), имел бы длину 1, иначе пришлось бы повторить одну из конечных вершин. Поэтому путь \\(P\\) вместе с ребром \\(uv\\) образует простой цикл длины \\(100+1=101\\). Значит, запретить циклы длины 101 нельзя.\n\nТеперь построим примеры для всех остальных нечётных \\(n\\). Если \\(n>101\\), возьмём полный граф \\(K_{101}\\). Между любыми двумя его вершинами можно пройти по простому пути длины 100: надо начать в первой вершине, закончить во второй и между ними поставить остальные 99 вершин в любом порядке. При этом в графе всего 101 вершина, поэтому простого цикла длины \\(n>101\\) в нём нет.\n\nОсталось построить пример для нечётных \\(n<101\\). Возьмём цикл длины 101 и заменим каждую его вершину \\(i\\) на независимое множество \\(V_i\\) из 101 вершины. Между вершинами из \\(V_i\\) и \\(V_j\\) проведём все рёбра тогда и только тогда, когда \\(i\\) и \\(j\\) соседние вершины исходного цикла. Иными словами, это раздутый цикл \\(C_{101}\\).\n\nПроверим условие о путях. Возьмём любые две различные вершины \\(x\\in V_a\\) и \\(y\\in V_b\\). На исходном цикле \\(C_{101}\\) между позициями \\(a\\) и \\(b\\) есть две дуги, длины которых в сумме равны 101; одна из этих двух длин имеет ту же чётность, что и 100, и не превосходит 100. Обозначим её через \\(d\\). Идём по этой дуге, а недостающие \\(100-d\\) шагов добавляем парами шагов туда-обратно вдоль какого-нибудь соседнего ребра цикла. Так получается маршрут длины 100 в исходном цикле от \\(a\\) к \\(b\\). Если \\(a=b\\), берём 50 раз движение туда-обратно вдоль одного ребра. В раздутом графе такой маршрут поднимается до простого пути: каждый раз, когда маршрут посещает один и тот же слой \\(V_i\\), выбираем новую вершину этого слоя; в каждом слое есть 101 вершина, а всего в пути только 101 посещение вершин. Первую выбранную вершину берём равной \\(x\\), последнюю — \\(y\\). Значит, между любыми двумя вершинами построен простой путь ровно из 100 рёбер.\n\nОсталось проверить, что в этом раздутом графе нет нечётных циклов длины меньше 101. Любой цикл раздутого графа проектируется в замкнутый маршрут той же длины на исходном цикле \\(C_{101}\\). Рассмотрим замкнутый маршрут длины \\(l<101\\) на \\(C_{101}\\). Пусть он сделал \\(p\\) шагов по часовой стрелке и \\(q\\) против часовой стрелки. Тогда \\(p-q\\) должно делиться на 101, но \\(|p-q|\\le p+q=l<101\\), значит \\(p=q\\). Поэтому \\(l=p+q=2p\\) чётно. Следовательно, нечётного замкнутого маршрута длины меньше 101 нет, а значит нет и простого нечётного цикла такой длины. Для любого нечётного \\(n<101\\) эта конструкция подходит.\n\nИтак, \\(101\\) невозможно, а каждое другое нечётное натуральное \\(n\\) реализуется одной из двух конструкций.",
