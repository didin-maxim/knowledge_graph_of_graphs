  "solutions": [
    {
      "id": "sol-checkerboard-right-side-invariant",
      "title": "Инвариант цвета справа от маршрута",
      "text": "Рассмотрим карту города как плоский граф: перекрестки - вершины, а участки дороги между соседними перекрестками - ребра. Из условия следует, что степень каждой вершины равна 4. Так как все степени четны, грани такого плоского графа можно раскрасить в два цвета, скажем в черный и белый, так, чтобы любые две грани по разные стороны одного ребра имели разные цвета. Например, можно обходить границы граней в эйлеровом плоском графе и красить соседние грани попеременно; четность степеней гарантирует отсутствие противоречия.\n\nПокажем, что во время поездки сохраняется цвет грани, находящейся справа от направления движения. Если на перекрестке машина поворачивает направо, то область справа непосредственно до поворота и непосредственно после поворота - это одна и та же четверть около перекрестка, значит ее цвет не меняется. Если машина поворачивает налево, то правая область до поворота и правая область после поворота являются противоположными четвертями около крестообразного перекрестка. В шахматной раскраске четыре четверти вокруг вершины чередуются по цветам, поэтому противоположные четверти имеют одинаковый цвет. Значит и при левом повороте цвет справа сохраняется.\n\nИтак, на всем маршруте цвет грани справа от машины постоянен. Но если одно и то же ребро пройти в противоположном направлении, правая и левая стороны этого ребра поменяются местами. Две грани по разные стороны ребра имеют разные цвета, поэтому цвет справа стал бы противоположным прежнему. Это невозможно из-за доказанного инварианта. Следовательно, когда шофер оказался на уже пройденной дороге, направление движения по ней совпадает с направлением первого проезда.",
