        "title": "Графовая формулировка",
        "text": "Пусть дана связная плоская дорожная сеть, в которой каждая вершина имеет степень 4 и четыре полуребра вокруг вершины разбиты на две пары противоположных направлений, соответствующие двум пересекающимся улицам. Рассматривается маршрут по ребрам этой сети: в каждой вершине он переходит не на противоположное ребро, а на одно из двух соседних ребер, то есть поворачивает налево или направо. Докажите, что если маршрут снова проходит по уже пройденному ребру, то направление прохождения этого ребра совпадает с направлением при первом прохождении.",
