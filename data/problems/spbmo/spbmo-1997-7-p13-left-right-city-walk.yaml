        "title": "Условие",
        "text": "В городе нет ни мостов, ни туннелей, ни тупиков. Все перекрестки имеют крестообразную форму и образованы пересечением ровно двух улиц. Совершая инспекционную поездку по городу, губернатор на каждом перекрестке поворачивал либо направо, либо налево. Через некоторое время шофер губернатора заметил, что они едут по дороге, по которой уже проезжали. Докажите, что они едут в ту же сторону, что и в первый раз.",
