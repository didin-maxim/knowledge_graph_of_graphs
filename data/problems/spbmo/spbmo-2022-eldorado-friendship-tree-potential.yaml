  "solutions": [
    {
      "id": "sol-official-rooted-tree",
      "title": "Решение через приращения на рёбрах дерева",
      "text": "Сначала объясним, почему возникает дерево. В момент вступления каждого нового члена клуба соединим его ребром с тем единственным старым членом клуба, который обязан быть его личным другом по правилу вступления. Начинаем с одной вершины, а дальше каждый раз добавляем одну новую вершину и одно ребро к уже построенному графу, поэтому после всех вступлений получается связный граф без циклов, то есть дерево. Если два человека являются друзьями в клубе, они соединены ребром этого дерева; условие про неудачников ровно говорит, что для каждой вершины её число не превосходит среднего арифметического чисел во всех соседних вершинах плюс 1. Состояние Пафнутия равно 0, так что в дереве есть вершина с числом 0.\n\nУкореним дерево в вершине с числом 0 и направим все рёбра от корня. Для вершины v обозначим её число через f(v). Если ориентированное ребро идёт из a в b, назовём его приращением число x(ab)=f(b)-f(a). Тогда для любой вершины v значение f(v) равно сумме приращений на пути от корня до v, потому что промежуточные значения телескопически сокращаются.\n\nДокажем ключевую оценку для одного ребра. Пусть ребро a->b ведёт из отца a в вершину b. Пусть из b выходят рёбра b->c_1,...,b->c_d, а их приращения равны y_1,...,y_d. Тогда степень вершины b равна d+1, а соседи b - это a,c_1,...,c_d. По условию задачи\n\n(d+1)f(b) <= f(a)+f(c_1)+...+f(c_d)+d+1.\n\nТак как f(c_i)=f(b)+y_i, правая часть равна f(a)+d f(b)+y_1+...+y_d+d+1. Перенося f(a)+d f(b) влево, получаем\n\nf(b)-f(a) <= y_1+...+y_d+d+1.\n\nИначе говоря, приращение на входящем в b ребре не больше суммы приращений на исходящих из b рёбрах плюс deg(b). Если b - лист, то d=0 и deg(b)=1, поэтому входящее приращение не больше 1.\n\nТеперь докажем индукцией по размеру поддерева следующую лемму: если ребро a->b ведёт в поддерево, состоящее из k вершин, включая b, то x(ab) <= 2k-1. База k=1 уже разобрана: b - лист, и x(ab) <= 1 = 2*1-1. Для перехода пусть из b выходят рёбра в корни поддеревьев размеров s_1,...,s_d. Эти поддеревья вместе со своей вершиной b образуют всё поддерево под b, значит s_1+...+s_d=k-1. По предположению индукции приращение на i-м исходящем ребре не превосходит 2s_i-1. Тогда сумма исходящих приращений не превосходит\n\n(2s_1-1)+...+(2s_d-1)=2(s_1+...+s_d)-d=2(k-1)-d.\n\nПодставляя это в только что полученную оценку для вершины b, получаем\n\nx(ab) <= 2(k-1)-d+(d+1)=2k-1.\n\nЛемма доказана.\n\nОсталось оценить число в произвольной вершине v. Пусть путь от корня до v состоит из m рёбер e_1,...,e_m. Для ребра e_i обозначим через k_i размер поддерева, в которое оно ведёт. При движении вниз каждое следующее поддерево строго содержится в предыдущем, поэтому k_1>k_2>...>k_m>=1. Все k_i - различные положительные целые числа, не превосходящие n, потому что вне корня в дереве всего n вершин. По лемме сумма приращений на пути не превосходит\n\n(2k_1-1)+...+(2k_m-1).\n\nСреди m различных чисел из множества {1,2,...,n} сумма выражений 2k_i-1 максимальна, когда это n,n-1,...,n-m+1. Поэтому\n\nf(v) <= (2n-1)+(2n-3)+...+(2(n-m+1)-1)=m(2n-m).\n\nНаконец, m<=n, а значит m(2n-m)<=n^2, поскольку n^2-m(2n-m)=(n-m)^2>=0. Следовательно, f(v)<=n^2.\n\nЭто верно для любой вершины v, значит состояние любого члена клуба не превосходит n^2 биткоинов.",
