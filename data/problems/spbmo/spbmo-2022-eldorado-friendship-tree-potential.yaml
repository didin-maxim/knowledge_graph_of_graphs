      "id": "idea-root-tree-edge-differences",
      "title": "Ориентировать дерево от нулевой вершины",
      "text": "История вступлений образует дерево. Дерево коренится в вершине с нулём, на рёбрах пишутся приращения чисел; локальное условие в вершине превращается в оценку входящего приращения через сумму исходящих. Затем индукцией по размеру поддерева доказывается, что ребро в поддерево размера k имеет приращение не больше 2k-1.",
