  "solutions": [
    {
      "id": "sol-deletion-contraction-mod3",
      "title": "Доказательство через удаление-сжатие",
      "text": "Перейдём к графовой формулировке. Города России и города Украины образуют две доли двудольного графа \\(G\\), а выбор направления на каждой авиалинии - это ориентация соответствующего ребра. Условие, что из города нельзя вернуться в него по односторонним авиалиниям, означает отсутствие ориентированного цикла. Поэтому нужно доказать утверждение для произвольного конечного двудольного графа.\n\nДля конечного графа \\(H\\) обозначим через \\(A(H)\\) число его ациклических ориентаций, а через \\(C(H)\\) число правильных раскрасок его вершин в два цвета. Докажем по индукции по числу рёбер, что\n\\[\nA(H)\\equiv (-1)^{|V(H)|}C(H) \\pmod 3.\n\\]\nПараллельные рёбра в промежуточных графах можно не различать: в правильных раскрасках они дают то же ограничение, что одно ребро, а в ациклической ориентации все параллельные рёбра между двумя вершинами обязаны быть направлены одинаково, иначе появился бы ориентированный цикл длины \\(2\\).\n\nЕсли рёбер нет, то \\(A(H)=1\\), а \\(C(H)=2^{|V(H)|}\\). Так как \\(-2\\equiv 1\\pmod 3\\), получаем \\((-1)^{|V(H)|}2^{|V(H)|}\\equiv 1\\pmod 3\\), и база доказана.\n\nПусть теперь в \\(H\\) есть ребро \\(e=uv\\). Рассмотрим граф \\(H-e\\). В каждой его ациклической ориентации возможны два случая. Если между \\(u\\) и \\(v\\) нет ориентированного пути ни в одну сторону, то ребро \\(e\\) можно добавить в любом из двух направлений, и цикл не появится. Если же есть ориентированный путь из \\(u\\) в \\(v\\) или из \\(v\\) в \\(u\\), то допустимо ровно одно направление ребра \\(e\\): то, которое не замыкает этот путь в ориентированный цикл. Следовательно,\n\\[\nA(H)=A(H-e)+N,\n\\]\nгде \\(N\\) - число ациклических ориентаций графа \\(H-e\\), в которых между \\(u\\) и \\(v\\) нет ориентированного пути ни в одну сторону.\n\nНо такие ориентации находятся во взаимно однозначном соответствии с ациклическими ориентациями графа \\(H/e\\), полученного сжатием ребра \\(e\\). Действительно, при сжатии вершин \\(u\\) и \\(v\\) ориентированный цикл мог бы возникнуть только из ориентированного пути между \\(u\\) и \\(v\\) в исходной ориентации; а если такого пути нет, сжатие сохраняет ацикличность. Значит,\n\\[\nA(H)=A(H-e)+A(H/e). \\tag{1}\n\\]\nДля правильных 2-раскрасок обычное разбиение даёт\n\\[\nC(H)=C(H-e)-C(H/e). \\tag{2}\n\\]\nВ самом деле, правильная 2-раскраска графа \\(H-e\\) либо уже красит \\(u\\) и \\(v\\) в разные цвета и тогда является раскраской \\(H\\), либо красит их одинаково и тогда после отождествления \\(u\\) и \\(v\\) даёт раскраску \\(H/e\\).\n\nПрименим индукционное предположение к \\(H-e\\) и \\(H/e\\). У графа \\(H-e\\) столько же вершин, сколько у \\(H\\), а у \\(H/e\\) на одну вершину меньше. Из (1) получаем\n\\[\nA(H)\\equiv (-1)^{|V(H)|}C(H-e)+(-1)^{|V(H)|-1}C(H/e)\n= (-1)^{|V(H)|}\\bigl(C(H-e)-C(H/e)\\bigr).\n\\]\nПо (2) это равно \\((-1)^{|V(H)|}C(H)\\) по модулю \\(3\\). Индукция завершена.\n\nОстаётся применить доказанную конгруэнцию к исходному двудольному графу \\(G\\). Пусть у него \\(c\\) компонент связности. Каждая компонента двудольного графа имеет ровно две правильные раскраски в два цвета: выбрав цвет одной вершины компоненты, цвета всех остальных вершин уже определяются; изолированная вершина также имеет два выбора. Поэтому\n\\[\nC(G)=2^c.\n\\]\nЭто число не делится на \\(3\\). Следовательно, \\(A(G)\\equiv \\pm 2^c\\pmod 3\\) тоже не равно нулю, то есть число допустимых способов ввести одностороннее движение не делится на \\(3\\).",
