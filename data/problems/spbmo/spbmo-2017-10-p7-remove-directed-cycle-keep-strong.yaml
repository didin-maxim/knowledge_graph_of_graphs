      "id": "idea-condensation-extreme-components",
      "title": "Конденсация отслеживает, где может сломаться сильная связность",
      "text": "Если после удаления цикла граф не сильно связен, его компоненты сильной связности образуют ациклическую конденсацию. Чтобы добавление удалённого цикла снова сделало граф сильно связным, этот цикл обязан проходить через крайние компоненты конденсации; поэтому при замене удаляемого цикла все новые крайние компоненты оказываются внутри старой минимальной компоненты.",
