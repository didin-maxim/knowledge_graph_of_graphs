      "id": "idea-minimal-extreme-component-after-cycle-deletion",
      "title": "Минимизировать крайнюю компоненту после удаления цикла",
      "text": "Предположим, что удаление любого ориентированного цикла разрушает сильную связность. Среди всех удалённых циклов выбираем такой, после которого некоторая крайняя компонента сильной связности имеет минимальный размер. Условие про две входящие и две исходящие дуги заставляет внутри этой компоненты существовать новый цикл; удаление уже этого внутреннего цикла приводит к меньшей крайней компоненте.",
