  "solutions": [
    {
      "id": "sol-extreme-strong-component",
      "title": "Крайняя компонента после удаления цикла",
      "text": "Будем считать дороги дугами ориентированного графа \\(G\\). Условие \"из любого города можно проехать в любой другой\" означает сильную связность.\n\nНам понадобится стандартный язык. Если ориентированный граф не сильно связен, разобьём его на компоненты сильной связности и сожмём каждую компоненту в одну вершину. Получается ациклический ориентированный граф, поэтому в нём есть источник и сток. Соответствующие компоненты исходного графа будем называть крайними: в компоненту-источник не входит дуг из других компонент, а из компоненты-стока не выходит дуг в другие компоненты.\n\nДля ориентированного цикла \\(Z\\) обозначим через \\(G_Z\\) граф, полученный из \\(G\\) удалением всех дуг этого цикла. Предположим противное: ни для какого цикла \\(Z\\) граф \\(G_Z\\) не остаётся сильно связным. Среди всех циклов \\(Z\\) и всех крайних компонент графов \\(G_Z\\) выберем пару \\((Z,U)\\), для которой число вершин в \\(U\\) минимально.\n\nДостаточно разобрать случай, когда \\(U\\) является стоком в конденсации \\(G_Z\\), то есть из \\(U\\) не выходит ни одной дуги в другие компоненты; случай источника полностью симметричен после замены входящих дуг на исходящие. Из каждой вершины \\(U\\) в исходном графе \\(G\\) выходит хотя бы две дуги. Цикл \\(Z\\) проходит через вершину не более одного раза, значит из каждой вершины \\(U\\) после удаления дуг \\(Z\\) всё ещё выходит хотя бы одна дуга. Так как \\(U\\) - стоковая компонента графа \\(G_Z\\), эта оставшаяся дуга ведёт в \\(U\\). Следовательно, в конечном орграфе, индуцированном \\(U\\), из каждой вершины выходит хотя бы одна дуга, а значит внутри \\(U\\) есть ориентированный цикл; обозначим его \\(C\\).\n\nЕсли \\(G_C\\) сильно связен, мы нашли требуемый цикл. Пусть это не так. Сравним разбиения графов \\(G_Z\\) и \\(G_C\\). Цикл \\(C\\) целиком лежит внутри \\(U\\) и состоит из дуг графа \\(G_Z\\), поэтому все компоненты \\(G_Z\\), отличные от \\(U\\), как сильно связные подграфы сохраняются в \\(G_C\\), а все дуги между ними тоже сохраняются. Кроме того, в \\(G_C\\) возвращены дуги старого цикла \\(Z\\).\n\nПочему старый цикл \\(Z\\) важен? Если бы \\(Z\\) не проходил через некоторую крайнюю компоненту графа \\(G_Z\\), то после возвращения дуг \\(Z\\) эта компонента всё равно оставалась бы крайней: у источника не появились бы входящие дуги, а у стока - исходящие. Но возвращение \\(Z\\) превращает \\(G_Z\\) обратно в исходный сильно связный граф \\(G\\). Значит, \\(Z\\) проходит через каждую крайнюю компоненту графа \\(G_Z\\).\n\nТеперь возьмём любую компоненту \\(G_Z\\), отличную от \\(U\\). В ациклической конденсации из неё можно дойти до некоторого стока, а из некоторого источника можно дойти до неё. Все эти пути используют дуги графа \\(G_Z\\) вне цикла \\(C\\), поэтому они сохраняются в \\(G_C\\). А старый цикл \\(Z\\), проходя через все крайние компоненты, соединяет источники и стоки в один общий сильно связный блок. Отсюда следует, что в графе \\(G_C\\) все вершины вне \\(U\\) и по крайней мере одна вершина из \\(U\\) лежат в одной компоненте сильной связности.\n\nСледовательно, если \\(G_C\\) всё же не сильно связен, то любая его крайняя компонента, не равная этому большому блоку, целиком лежит внутри \\(U\\). Такая компонента является собственным подмножеством \\(U\\), потому что большой блок уже содержит хотя бы одну вершину \\(U\\). Мы получили крайнюю компоненту графа \\(G_C\\) с меньшим числом вершин, чем \\(U\\), что противоречит минимальному выбору пары \\((Z,U)\\).\n\nПротиворечие доказывает, что наше предположение было неверным. Значит, существует ориентированный цикл, удаление всех дуг которого сохраняет сильную связность графа, то есть в исходной дорожной задаче можно удалить все дороги некоторого циклического маршрута и по-прежнему добираться из любого города в любой другой.",
