        "title": "Официальная олимпиадная формулировка",
        "text": "В стране некоторые пары городов соединены дорогами с односторонним движением, причем из любого города можно проехать в любой другой. Из каждого города выходит хотя бы две дороги и в каждый город входит хотя бы две дороги. Докажите, что можно найти циклический маршрут и удалить все его дороги так, что по-прежнему из любого города можно будет проехать в любой другой.",
