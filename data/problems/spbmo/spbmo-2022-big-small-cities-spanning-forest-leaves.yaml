      "text": "Официальное решение выбирает остовный лес из 500 деревьев с корнями в больших городах и помещает 10000 соседних с большими малых городов на первый ранг. В каждом корневом дереве разные вершины первого ранга имеют непересекающиеся нижние поддеревья, поэтому дают разные листья. После этого компоненты соединяются дорогами исходного графа, и каждое соединение может испортить не более двух прежних листьев.",
