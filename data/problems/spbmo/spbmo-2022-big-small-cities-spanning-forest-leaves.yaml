  "solutions": [
    {
      "id": "sol-official-spanning-forest",
      "title": "Официальный остовный лес и восстановление связности",
      "text": "Будем считать города вершинами, а дороги рёбрами связного графа. Больших вершин ровно 500. Обозначим через \\(S\\) множество малых вершин, которые смежны хотя бы с одной большой; по условию \\(|S|\\ge 10000\\).\n\nСначала построим остовный лес с 500 компонентами, корнями которых будут большие города. Для каждой вершины \\(s\\in S\\) выберем одну большую соседнюю вершину \\(b(s)\\) и оставим ребро \\(sb(s)\\). Вместе с 500 большими вершинами эти рёбра образуют лес из звёзд: каждая вершина из \\(S\\) присоединена ровно к одному выбранному большому городу, а других рёбер пока нет, значит циклов нет и разные большие города лежат в разных компонентах.\n\nЕсли после этого остались вершины, ещё не вошедшие в лес, будем добавлять их по одной. Пока не все вершины добавлены, связность исходного графа гарантирует ребро между уже добавленной частью и ещё не добавленной вершиной: иначе множество добавленных вершин было бы отделено от остальных. Добавим такую новую вершину вместе с одним таким ребром. Это не создаёт цикла, потому что новая вершина раньше не принадлежала лесу, и не склеивает две уже существующие компоненты. Повторяя шаг, получаем остовный лес из тех же 500 деревьев; его корни — большие города, а все вершины из \\(S\\) находятся на первом уровне, то есть непосредственно соединены со своим большим корнем.\n\nДокажем, что в этом лесу не меньше \\(|S|\\) листьев. Рассмотрим одно из 500 деревьев и его корень. Для каждой вершины первого уровня возьмём часть дерева, лежащую ниже неё: это компонента, которая содержит эту вершину после удаления ребра к корню. Такая часть является конечным деревом, поэтому в ней есть лист исходного корневого дерева: если сама вершина первого уровня не имеет потомков, она и есть лист; иначе, двигаясь от неё к потомкам, в конечном дереве обязательно придём к вершине без детей. Для разных вершин первого уровня эти нижние части не пересекаются, значит выбранные листья различны. Следовательно, в каждом дереве листьев хотя бы столько, сколько вершин первого уровня, а во всём лесу листьев хотя бы \\(|S|\\ge 10000\\).\n\nОсталось сделать оставленный подграф связным. Сожмём каждое из 500 деревьев леса в одну вершину и посмотрим на рёбра исходного графа между разными деревьями. Полученный граф на 500 сжатых вершинах связен, потому что исходный граф связен. Поэтому в нём есть остовное дерево; выберем соответствующие ему 499 исходных дорог и добавим их к нашему лесу. Теперь все города соединены оставленными дорогами.\n\nПри добавлении одной такой дороги степень меняется только у двух её концов. Значит, эта дорога может перестать быть листом не более чем для двух прежних листьев; все остальные прежние листья сохраняют степень 1. Мы добавили 499 дорог, поэтому потеряли не более \\(2\\cdot 499=998\\) листьев. Было хотя бы 10000 листьев, значит осталось не меньше \\(10000-998=9002\\), то есть больше 9000 городов, из которых выходит ровно одна оставленная дорога. Закроем все дороги, не вошедшие в построенный связный подграф; требуемые свойства выполнены.",
