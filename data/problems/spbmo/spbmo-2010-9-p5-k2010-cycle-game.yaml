        "text": "В стране 2010 городов и любые два из них соединены дорогой (не проходящей через другие города). Бизнесмен и Министерство Дорожного Строительства играют в игру. Бизнесмен каждое утро приватизирует одну из дорог, а Министерство каждый вечер разрушает по десять еще не приватизированных дорог. Сможет ли Бизнесмен, несмотря на козни Министерства, создать циклический маршрут по приватизированным дорогам, проходящий по одному разу по 11 разным городам?",
