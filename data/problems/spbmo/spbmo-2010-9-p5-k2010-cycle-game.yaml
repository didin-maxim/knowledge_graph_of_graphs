  "solutions": [
    {
      "id": "sol-subdivided-star-eleven-threats",
      "title": "Двенадцатый луч и одиннадцать угроз замыкания",
      "text": "Ответ: сможет.\n\nВыберем город \\(c\\). Бизнесмен сначала построит из \\(c\\) 11 попарно не пересекающихся внутри приватизированных путей длины 5. Будем называть их лучами, а их последние города - концами лучей. Это можно делать жадно: перед каждым из первых 55 утренних ходов Министерство успело разрушить не более \\(10\\cdot 54=540\\) дорог, а использовано меньше 56 городов. Поэтому из текущего конца строящегося луча остается хотя бы один еще не использованный город, дорога к которому не разрушена; Бизнесмен приватизирует такую дорогу. Если в процессе уже появился нужный цикл, задача решена, так что считаем, что этого не произошло.\n\nОбозначим концы построенных 11 лучей через \\(l_1,\\ldots,l_{11}\\). Теперь Бизнесмен начинает строить из того же центра \\(c\\) двенадцатый луч, снова используя только новые города, и жадно приватизирует первые 4 его дороги. Это возможно по той же причине: к этому моменту сделано всего 59 ходов или меньше, разрушенных дорог не более \\(590\\), а свободных городов намного больше.\n\nПусть \\(y\\) - текущий конец недостроенного двенадцатого луча, находящийся на расстоянии 4 от \\(c\\). Выберем последний город \\(x\\) этого луча так, чтобы не были разрушены дороги \\(yx,xl_1,\\ldots,xl_{11}\\). Такой город существует. Действительно, сейчас использовано только 60 городов, а среди остальных 1950 городов каждый неподходящий кандидат \\(x\\) требует хотя бы одной уже разрушенной дороги из набора \\(yx,xl_1,\\ldots,xl_{11}\\). Разрушенных дорог всего не более \\(590\\), значит неподходящих кандидатов не более \\(590\\), и подходящий город остается.\n\nБизнесмен приватизирует дорогу \\(yx\\), завершая двенадцатый луч длины 5. Теперь для каждого \\(i=1,\\ldots,11\\) в его приватизированном графе уже есть путь длины 10 от \\(x\\) до \\(l_i\\): пять дорог от \\(x\\) до \\(c\\) по двенадцатому лучу и пять дорог от \\(c\\) до \\(l_i\\) по старому лучу. Кроме того, все 11 дорог \\(xl_1,\\ldots,xl_{11}\\) еще целы и не приватизированы.\n\nВечером Министерство может разрушить не более 10 из этих 11 дорог. Поэтому на следующее утро хотя бы одна дорога \\(xl_i\\) остается целой. Бизнесмен приватизирует ее. Вместе с двумя лучами от \\(c\\) к \\(x\\) и к \\(l_i\\) эта дорога образует простой цикл из \\(5+5+1=11\\) дорог, проходящий по одному разу по 11 разным городам. Значит Бизнесмен имеет выигрышную стратегию.",
