      "title": "Раскрасить типы вершин и пятым цветом управлять одноцветными звездами",
      "text": "Вершины, у которых встречаются хотя бы два цвета ребер, можно красить только по подмножеству этих цветов, используя четыре из пяти вершинных цветов. Вершины с единственным инцидентным цветом образуют по каждому реберному цвету лес звезд; пятый цвет резервируется для центров таких звезд, а остальные вершины звезды, не имеющие внешних соседей, получают один из уже использованных цветов.",
