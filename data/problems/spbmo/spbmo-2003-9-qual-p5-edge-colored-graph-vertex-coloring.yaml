  "solutions": [
    {
      "id": "sol-incident-color-sets-and-reserved-color-stars",
      "title": "Раскраска по множествам инцидентных цветов и звездным одноцветным компонентам",
      "text": "Назовем четыре цвета ребер числами \\(1,2,3,4\\). Для вершины \\(v\\) обозначим через \\(S(v)\\) множество цветов ребер, инцидентных \\(v\\). Изолированные вершины можно будет покрасить как угодно.\n\nСначала докажем главный локальный факт. Пусть \\(uv\\) - ребро цвета \\(c\\). Тогда\n\\[\nS(u)\\cap S(v)=\\{c\\}.\n\\]\nДействительно, цвет \\(c\\) входит в оба множества. Если же некоторый цвет \\(d\\ne c\\) тоже входит в оба, то существуют ребра \\(ux\\) и \\(vy\\) цвета \\(d\\). Здесь \\(x\\ne v\\) и \\(y\\ne u\\), потому что ребро \\(uv\\) имеет цвет \\(c\\). Если \\(x\\ne y\\), то \\(xuvy\\) - путь из трех ребер, у которого первое и третье ребра имеют один цвет \\(d\\). Если \\(x=y\\), то получается замкнутый путь \\(xuvx\\) длины 3 с тем же нарушением. В обоих случаях противоречие условию.\n\nПокрасим все вершины с \\(|S(v)|\\ge 2\\) в четыре из пяти будущих цветов \\(A,B,C,E\\) по такой таблице:\n\\[\n\\{1,2\\},\\{3,4\\},\\{1,2,3,4\\}\\mapsto A;\n\\quad \\{1,3\\},\\{2,4\\}\\mapsto B;\n\\quad \\{1,4\\},\\{2,3\\}\\mapsto C;\n\\quad |S|=3\\mapsto E.\n\\]\nПроверим, что среди уже покрашенных вершин конфликтов нет. Если две такие вершины соединены ребром, то по доказанному факту их множества инцидентных цветов пересекаются ровно по одному элементу. Две тройки цветов так пересекаться не могут, тройка и четверка тоже, пара и четверка тоже. Две пары одного табличного цвета являются дополнительными парами и вообще не пересекаются. Наконец, пара и тройка при одноэлементном пересечении получают соответственно один из цветов \\(A,B,C\\) и цвет \\(E\\). Значит, одинаково покрашенные уже обработанные вершины не смежны.\n\nОсталось докрасить вершины, для которых \\(|S(v)|=1\\). Пятый цвет обозначим через \\(D\\); пока он нигде не использован. Зафиксируем реберный цвет \\(c\\) и рассмотрим граф \\(H_c\\), индуцированный вершинами с \\(S(v)=\\{c\\}\\). Все его ребра имеют цвет \\(c\\). В \\(H_c\\) нет пути из трех ребер и нет треугольника: такой путь или такой замкнутый путь был бы запрещен исходным условием, поскольку первое и третье ребра имели бы цвет \\(c\\). Поэтому каждая нетривиальная компонента \\(H_c\\) является звездой.\n\nНам понадобится еще одно простое следствие условия. Если \\(uv\\) - ребро внутри \\(H_c\\), то не могут обе вершины \\(u\\) и \\(v\\) иметь еще по соседу, отличному от другого конца этого ребра. В самом деле, если есть ребра \\(ux\\) и \\(vy\\), где \\(x\\ne v\\), \\(y\\ne u\\), то они тоже имеют цвет \\(c\\); путь \\(xuvy\\), а при \\(x=y\\) замкнутый путь \\(xuvx\\), снова имеет первый и третий цвет \\(c\\), что невозможно.\n\nТеперь красим компоненты \\(H_c\\). Одиночную вершину красим в \\(D\\): ее соседи вне \\(H_c\\), если они есть, уже получили только цвета \\(A,B,C,E\\), так что конфликта нет. В нетривиальной звездной компоненте выберем вершину \\(r\\), у которой могут быть соседи вне этой компоненты: если у центра звезды есть внешний сосед, берем центр; если нет, берем любую вершину, имеющую внешний сосед; если внешних соседей нет, берем центр. Предыдущее следствие показывает, что все остальные вершины этой компоненты не имеют никаких соседей вне компоненты. Покрасим \\(r\\) в \\(D\\), а все остальные вершины компоненты в \\(A\\). Это правильно: снаружи вершина \\(r\\) не встречает цвета \\(D\\), внутри она смежна только с вершинами цвета \\(A\\), а остальные вершины компоненты попарно не смежны и не имеют внешних соседей.\n\nПроделав это для всех четырех цветов \\(c\\), получаем правильную раскраску всех неизолированных вершин в пять цветов \\(A,B,C,D,E\\); изолированные вершины докрашиваем произвольно. Следовательно, \\(\\chi(G)\\le 5\\).",
