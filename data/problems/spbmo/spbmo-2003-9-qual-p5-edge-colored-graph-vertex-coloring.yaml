      "id": "idea-incident-color-sets-intersect-only-edge-color",
      "title": "Множества инцидентных цветов у концов ребра пересекаются только по цвету ребра",
      "text": "Если ребро \\(uv\\) имеет цвет \\(c\\), а другой цвет \\(d\\ne c\\) встречается и у \\(u\\), и у \\(v\\), то два ребра цвета \\(d\\) вместе с ребром \\(uv\\) дают путь из трех ребер, у которого первое и третье ребра одного цвета. Поэтому для соседних вершин их множества инцидентных цветов пересекаются ровно по цвету соединяющего ребра.",
