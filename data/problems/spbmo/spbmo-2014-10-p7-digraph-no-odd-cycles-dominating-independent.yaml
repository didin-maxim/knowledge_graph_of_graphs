  "ideas": [
    {
      "id": "idea-strong-component-bipartition",
      "title": "Сильная компонента без нечётных циклов двудольна по чётности пути",
      "text": "В сильной компоненте зафиксируем вершину \\(r\\). Если два направленных пути из \\(r\\) в одну и ту же вершину имели бы разную чётность, то, добавив направленный путь обратно к \\(r\\), получили бы два замкнутых маршрута разной чётности; один из них был бы нечётным. Значит, чётность пути от \\(r\\) корректно делит компоненту на две независимые доли.",
