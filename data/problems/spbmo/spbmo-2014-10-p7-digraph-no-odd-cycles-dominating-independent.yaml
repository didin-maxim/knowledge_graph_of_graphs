        "title": "Условие",
        "text": "Некоторые города Триодиннадцатого царства соединены дорогами с односторонним движением. Известно, что любой замкнутый циклический маршрут по дорогам этой страны, не нарушающий правил дорожного движения, проходит по чётному числу дорог. Докажите, что царь сможет разместить в некоторых городах военные базы так, чтобы между этими городами не было дорог, но в любой город, где нет базы, можно было добраться из города, где база есть, проехав ровно одну дорогу.",
