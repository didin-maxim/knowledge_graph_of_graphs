  "solutions": [
    {
      "id": "sol-strong-components-induction",
      "title": "Сильные компоненты и индукция по числу городов",
      "text": "Перейдём к графовой формулировке: города - вершины, дороги - направленные рёбра. Достаточно доказать утверждение для любого конечного ориентированного графа, в котором нет нечётного замкнутого направленного маршрута.\n\nСначала докажем лемму. Пусть \\(C\\) - сильная компонента такого графа. Зафиксируем вершину \\(r\\in C\\). Для каждой вершины \\(v\\in C\\) выберем какой-нибудь направленный путь из \\(r\\) в \\(v\\). Чётность длины этого пути не зависит от выбора. Действительно, если есть два пути \\(P\\) и \\(Q\\) из \\(r\\) в \\(v\\) разной чётности, то из сильной связности есть направленный путь \\(R\\) из \\(v\\) в \\(r\\). Замкнутые маршруты \\(P+R\\) и \\(Q+R\\) имеют разную чётность, значит один из них нечётный, что запрещено.\n\nРазобьём вершины \\(C\\) на две доли: в первую положим вершины, достижимые из \\(r\\) путём чётной длины, во вторую - путём нечётной длины. Если в \\(C\\) есть дуга \\(u\\to v\\), то путь из \\(r\\) в \\(u\\) вместе с этой дугой даёт путь из \\(r\\) в \\(v\\), поэтому чётности \\(u\\) и \\(v\\) различны. Следовательно, внутри каждой доли нет дуг. Кроме того, если компонента состоит более чем из одной вершины, то каждая вершина второй доли имеет входящую дугу из первой доли: у неё есть хотя бы одна входящая дуга внутри сильной компоненты, а все такие дуги идут между долями. Для одноэлементной компоненты просто выберем её единственную вершину.\n\nТеперь докажем основное утверждение индукцией по числу вершин. Если вершин нет, всё очевидно. Иначе рассмотрим конденсацию графа и возьмём начальную сильную компоненту \\(C\\), то есть такую, в которую не входит дуга из другой сильной компоненты. По лемме выберем одну из её долей \\(A\\); если \\(C\\) одноэлементна, берём \\(A=C\\). Тогда внутри \\(A\\) нет дуг, а каждая вершина из \\(C\\setminus A\\) доминируется вершиной из \\(A\\).\n\nУдалим из графа все вершины компоненты \\(C\\), а также все внешние вершины, в которые ведёт дуга из некоторой вершины \\(A\\). В оставшемся индуцированном подграфе по-прежнему нет нечётных замкнутых направленных маршрутов, поэтому по индукционному предположению в нём есть подходящее множество \\(B\\).\n\nПокажем, что \\(A\\cup B\\) подходит для исходного графа. Внутри \\(A\\) и внутри \\(B\\) дуг нет. Между \\(B\\) и \\(A\\) тоже нет дуг: дуг из внешней части в \\(C\\) нет, потому что \\(C\\) была начальной компонентой, а все вершины, в которые шла дуга из \\(A\\), мы удалили до применения индукции. Значит, базы в \\(A\\cup B\\) попарно не соединены дорогами.\n\nОсталось проверить доминирование. Вершины из \\(C\\setminus A\\) доминируются из \\(A\\) по лемме. Внешние вершины, удалённые вместе с \\(C\\), доминируются из \\(A\\) по определению удаления. Вершины, оставшиеся для индукции и не попавшие в \\(B\\), доминируются из \\(B\\). Поэтому каждая вершина без базы достижима из некоторой базы по одной дороге. Это и требовалось доказать.",
