      "id": "idea-delete-source-component-and-dominated",
      "title": "Выбрать долю начальной сильной компоненты и удалить всё уже доминированное",
      "text": "В конденсации ориентированного графа берём начальную сильную компоненту: из оставшейся части в неё нет дуг, поэтому будущие выбранные вершины не смогут быть смежны с уже выбранной долей. Одна доля этой компоненты доминирует вторую долю, а также некоторые внешние вершины; после удаления компоненты и этих внешних вершин задача сводится к меньшему графу.",
