  "solutions": [
    {
      "id": "sol-complement-11-cycle-hall-bridges",
      "title": "Решение через 11-цикл незнакомств и теорему Холла",
      "text": "Построим граф знакомств \\(G\\): его вершины - люди, а ребра - пары знакомых. Тогда \\(G\\) имеет 100 вершин, каждая вершина имеет степень 40, и любые две вершины имеют не более 20 общих соседей. Ребра дополнительного графа \\(\\overline G\\) будем называть ребрами незнакомства; степень каждой вершины в \\(\\overline G\\) равна\n\\[\n99-40=59.\n\\]\n\nСначала найдём в \\(\\overline G\\) цикл длины 11. Возьмем произвольную вершину \\(a\\) и множество \\(M\\) её соседей в \\(\\overline G\\); тогда \\(|M|=59\\). Любая вершина из \\(M\\) имеет в \\(\\overline G\\) всего 59 соседей, а вне \\(M\\) лежит только \\(41\\) вершина, включая саму \\(a\\). Поэтому внутри \\(M\\) у неё не меньше\n\\[\n59-41=18\n\\]\nсоседей. В частности, в подграфе \\(\\overline G[M]\\) можно построить простой путь из 10 вершин: начиная с любого пути, пока в нём меньше 10 вершин, его последний конец имеет хотя бы 18 соседей в \\(M\\), а занятых вершин меньше 10, значит есть сосед вне уже построенного пути.\n\nПусть этот путь равен\n\\[\nx_2x_3\\ldots x_{11}.\n\\]\nТак как все его вершины лежат в \\(M\\), они все соединены в \\(\\overline G\\) с вершиной \\(a\\). Обозначим \\(x_1=a\\). Тогда\n\\[\nx_1x_2\\ldots x_{11}x_1\n\\]\n- цикл длины 11 в \\(\\overline G\\). Иными словами, каждые две соседние по этому циклу вершины \\(x_i,x_{i+1}\\) не знакомы в исходной компании; индексы далее считаем по модулю 11.\n\nТеперь для каждого \\(i\\) выберем промежуточного человека \\(y_i\\), который знаком с \\(x_i\\), но не знаком с \\(x_{i+1}\\), причём все \\(y_i\\) должны быть различны и не должны совпадать с вершинами \\(x_1,\\ldots,x_{11}\\).\n\nПокажем, что такой выбор возможен. Для каждого \\(i\\) положим\n\\[\nA_i=N_G(x_i)\\setminus\\bigl(N_G(x_{i+1})\\cup\\{x_1,\n\\ldots,x_{11}\\}\\bigr),\n\\]\nгде \\(N_G(v)\\) - множество знакомых вершины \\(v\\). Вершины \\(x_i\\) и \\(x_{i+1}\\) не знакомы, поэтому из 40 знакомых вершины \\(x_i\\) не более 20 являются также знакомыми вершины \\(x_{i+1}\\). Следовательно,\n\\[\n|N_G(x_i)\\setminus N_G(x_{i+1})|\\ge 40-20=20.\n\\]\nИз найденных 11 вершин цикла в этом множестве не могут лежать \\(x_i\\), \\(x_{i+1}\\) и \\(x_{i-1}\\): первая не является своим соседом, а две остальные не знакомы с \\(x_i\\) по построению цикла в \\(\\overline G\\). Значит, при удалении вершин \\(x_1,\\ldots,x_{11}\\) мы теряем не более 8 кандидатов, и потому\n\\[\n|A_i|\\ge 20-8=12\n\\]\nдля каждого \\(i\\).\n\nОсталось выбрать из множеств \\(A_1,\\ldots,A_{11}\\) различные представители. Это сразу следует из теоремы Холла: объединение любого непустого набора этих множеств содержит хотя бы одно из них, значит имеет размер не меньше 12, а число множеств в наборе не превосходит 11. Поэтому для каждого \\(i\\) можно выбрать разные вершины \\(y_i\\in A_i\\).\n\nРассадим за столом 22 выбранных человека в порядке\n\\[\nx_1,y_1,x_2,y_2,\\ldots,x_{11},y_{11}.\n\\]\nПо определению \\(A_i\\) вершина \\(y_i\\) знакома с \\(x_i\\) и не знакома с \\(x_{i+1}\\). Поэтому вдоль этого кругового порядка связи идут так:\n\\[\nx_i y_i \\text{ - знакомство},\\qquad y_i x_{i+1} \\text{ - незнакомство}.\n\\]\nВсе вершины различны: вершины \\(x_i\\) различны, вершины \\(y_i\\) различны по выбору представителей, и ни одна \\(y_i\\) не принадлежит множеству \\(\\{x_1,\\ldots,x_{11}\\}\\). Следовательно, каждый из 22 сидящих знаком ровно с одним из двух своих соседей за столом. Что и требовалось доказать.",
