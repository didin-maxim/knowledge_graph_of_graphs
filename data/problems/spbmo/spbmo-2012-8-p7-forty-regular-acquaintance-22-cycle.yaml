        "text": "В компании из 100 человек каждый знаком ровно с 40 другими, но никакие двое не имеют более 20 общих знакомых. Докажите, что из этой компании можно выбрать 22 человека, которых можно посадить за круглый стол так, чтобы каждый из них был знаком ровно с одним из двух своих соседей.",
