      "title": "Сначала найти 11-цикл из незнакомств",
      "text": "В дополнительном графе степень каждой вершины равна 59. Если взять вершину и посмотреть на её 59 соседей в дополнении, то внутри этого множества минимальная степень не меньше 18, поэтому там есть путь из 10 вершин; вместе с исходной вершиной он даёт цикл длины 11 из незнакомств.",
