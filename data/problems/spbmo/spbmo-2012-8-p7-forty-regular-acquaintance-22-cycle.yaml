        "id": "stmt-original",
        "title": "Условие",
        "text": "В компании из 100 человек каждый знаком ровно с 40 другими, но никакие двое не имеют более 20 общих знакомых. Докажите, что из этой компании можно выбрать 22 человека, которых можно посадить за круглый стол так, чтобы каждый из них был знаком ровно с одним из двух своих соседей.",
        "source_id": "src-spbmo-2012-city-68-tex",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [
          "degree",
          "cycle"
        ],
        "source_note": "Сверено с официальным TeX-архивом СПбМО 2012 на сайте PDMI: файл c_68_12.tex, городской II тур, 8 класс, задача 7; авторская подпись: Д. Карпов, С. Берлов."
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "title": "Графовая формулировка",
        "text": "Пусть \\(G\\) -- простой 40-регулярный граф на 100 вершинах, причём любые две вершины имеют не более 20 общих соседей. Докажите, что существуют 22 различные вершины \\(v_1,v_2,\\ldots,v_{22}\\), расположенные циклически, такие что для каждого \\(i\\) ровно одна из двух пар \\(v_{i-1}v_i\\) и \\(v_iv_{i+1}\\) является ребром \\(G\\) (индексы берутся по модулю 22). Иными словами, вдоль этого цикла в полном графе на выбранных вершинах рёбра графа \\(G\\) и рёбра его дополнения чередуются.",
