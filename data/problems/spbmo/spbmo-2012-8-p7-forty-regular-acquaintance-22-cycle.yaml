      "title": "Рассадка означает чередующийся цикл, а не цикл знакомств",
      "text": "Если выбранных людей записать в порядке обхода круглого стола, то у каждого человека среди двух соседей должен быть ровно один знакомый. Поэтому статусы соседних пар вокруг стола вынужденно чередуются: знакомы, не знакомы, знакомы, не знакомы, и так далее. Длина 22 важна как чётная длина такого чередующегося цикла.",
