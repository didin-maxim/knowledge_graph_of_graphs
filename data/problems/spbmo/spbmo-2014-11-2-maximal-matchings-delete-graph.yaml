  "ideas": [{
    "id": "idea-each-surviving-edge-charges-neighbour",
    "title": "Выжившее ребро каждый день теряет соседнее ребро",
    "text": "Если ребро uv не попало в удаляемое максимальное паросочетание, то максимальность заставляет удалить какое-то ребро, инцидентное u или v. Таких соседних с uv ребер изначально не больше 198.",
    "tags": ["matching", "degree_counting"],
    "status": "ai_checked"
  }],
  "solutions": [{
    "id": "sol-expanded",
    "title": "Фиксируем последнее ребро",
    "text": "Рассмотрим произвольную дорогу uv, которая пока не разрушена. В день, когда выбирается идеальный набор, если uv не входит в этот набор, то из максимальности набора следует: какая-то выбранная дорога имеет общий конец с uv. Иначе uv можно было бы добавить к набору, что противоречило бы его идеальности.\n\nУ вершины u кроме uv есть не более 99 других дорог, и у v тоже не более 99. Значит, всего дорог, отличных от uv и имеющих с ней общий конец, не больше 198. Каждый день, пока uv остается неразрушенной, разрушается по крайней мере одна из этих соседних дорог, причем повторно разрушить ее уже нельзя. Поэтому uv не может пережить 199 операций. Поскольку это верно для любой исходной дороги, через 199 операций дорог не останется.",
