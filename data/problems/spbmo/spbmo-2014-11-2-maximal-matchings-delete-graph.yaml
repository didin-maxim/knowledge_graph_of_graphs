      "id": "stmt-original",
      "title": "Условие",
      "text": "В стране некоторые пары городов соединены дорогами, причем из каждого города выходит не более 100 дорог. Набор дорог называется идеальным, если эти дороги не имеют общих концов, но больше ни одной дороги с сохранением этого условия добавить к этому набору нельзя. Министерство транспорта каждый день выбирает какой-нибудь идеальный набор дорог и полностью разрушает их. Новых дорог министерство не строит. Докажите, что не более чем через 199 таких операций в стране вообще не останется дорог.",
      "source_id": "src-spbmo-2014-city-911-tex",
      "status": "ai_checked",
      "self_contained": {"status": "ai_checked"},
      "definition_ids": ["matching"]
