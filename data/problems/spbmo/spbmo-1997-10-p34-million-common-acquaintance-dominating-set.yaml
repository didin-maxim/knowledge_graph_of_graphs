  "solutions": [
    {
      "id": "sol-degree-split-random-choice",
      "title": "Разбор по минимальной степени и случайный выбор",
      "text": "Переведем условие на язык графов: вершины — жители, ребро означает знакомство. Условие говорит, что у любых двух вершин есть общий сосед, отличный от них.\n\nРассмотрим сначала случай, когда в графе есть вершина \\(v\\) степени не больше 5000. Возьмем в качестве \\(S\\) всех соседей вершины \\(v\\). Тогда \\(|S|\\le 5000\\). Сама вершина \\(v\\) имеет соседа в \\(S\\), так как при миллионе жителей условие, примененное к паре \\(v,u\\), гарантирует наличие знакомых у \\(v\\). Если вершина \\(x\\) не лежит в \\(S\\) и \\(x\\ne v\\), то у пары \\(x,v\\) есть общий сосед \\(y\\). Этот сосед смежен с \\(v\\), значит \\(y\\in S\\), и одновременно смежен с \\(x\\). Поэтому каждая вершина вне \\(S\\) знакома с кем-то из \\(S\\).\n\nОсталось разобрать случай, когда степень каждой вершины больше 5000. Выберем 5000 раз независимо и равновероятно одного из миллиона жителей; повторения пока разрешим. Для фиксированной вершины \\(x\\) вероятность того, что за все 5000 выборов не выбран ни один сосед \\(x\\), не превосходит\n\\[\n\\left(1-\\frac{5001}{10^6}\\right)^{5000}<e^{-5000\\cdot 5001/10^6}<e^{-25}.\n\\]\nЗначит математическое ожидание числа вершин, у которых среди выбранных нет ни одного соседа, меньше \\(10^6e^{-25}<1\\). Следовательно, существует конкретный набор из 5000 выборов, для которого таких вершин нет вообще. Удалив из этого набора возможные повторения, получим множество \\(S\\) размера не больше 5000; удаление повторов не меняет множество выбранных жителей. Тогда каждый невыбранный житель имеет знакомого в \\(S\\). В обоих случаях требуемые 5000 жителей существуют.",
