  "solutions": [
    {
      "id": "sol-degree-counting",
      "title": "Подсчет ребер между двумя разностями множеств",
      "text": "Рассмотрим граф знакомств: вершины - люди, ребра - пары знакомых. Пусть L - множество малообщительных людей, то есть вершин степени меньше 10, а C - множество чудаков, то есть вершин, все соседи которых лежат в L.\n\nДостаточно сравнить части C\\L и L\\C. Возьмем вершину v из C\\L. Она не малообщительна, значит имеет как минимум 10 соседей. Так как v - чудак, все эти соседи лежат в L. Более того, ни один из них не лежит в C: если u из L был бы чудаком и был знаком с v, то среди знакомых u оказался бы немалообщительный человек v, противоречие. Значит все соседи v лежат в L\\C.\n\nПоэтому число ребер между C\\L и L\\C не меньше 10|C\\L|. С другой стороны, каждая вершина из L\\C малообщительна, значит имеет меньше 10 соседей всего, а тем более меньше 10 соседей в C\\L. Поэтому тех же ребер меньше 10|L\\C|. Получаем |C\\L| < |L\\C|, если C\\L непусто; если C\\L пусто, неравенство очевидно. В обоих случаях |C| <= |L|, что и требовалось.",
