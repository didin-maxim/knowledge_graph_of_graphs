  "solutions": [
    {
      "id": "sol-ai-center-level-counting",
      "title": "ИИ-решение: подсчет уровней от центра дерева",
      "text": "Переведем условие на язык графов. Города и дороги образуют дерево \\(T\\) на 2003 вершинах, потому что между любыми двумя вершинами есть ровно один путь. Длина каждого такого пути не больше 8, значит диаметр дерева не больше 8. Вершину степени не больше 8 будем называть малой.\n\nВыберем центр дерева и подвесим дерево за него. Поскольку диаметр не больше 8, существует вершина \\(r\\), от которой до любой другой вершины расстояние не больше 4. Значит, все вершины дерева лежат на уровнях 0, 1, 2, 3, 4 от корня \\(r\\).\n\nПредположим противное: никакая вершина не смежна хотя бы с 8 малыми вершинами.\n\nСначала докажем, что все вершины дерева малы. Вершины уровня 4 являются листьями, поэтому они малые. Возьмем вершину уровня 3. Все ее дети, если они есть, лежат на уровне 4 и потому малы. Если бы степень этой вершины была больше 8, то, кроме родителя, у нее было бы хотя бы 8 детей, то есть хотя бы 8 малых соседей, что запрещено предположением. Значит, все вершины уровня 3 малые. Точно так же, поднимаясь вверх, получаем: все вершины уровней 2 и 1 малые, потому что их дети уже малы; наконец, корень \\(r\\) тоже мал, иначе он имел бы больше 8 детей, и все они были бы малыми соседями.\n\nИтак, каждая вершина дерева мала. Но тогда каждый сосед каждой вершины тоже мал. По предположению ни одна вершина не имеет 8 малых соседей, следовательно, степень каждой вершины на самом деле не больше 7.\n\nТеперь считаем вершины по уровням. У корня не больше 7 детей. У любой другой вершины, кроме родителя, остается не больше 6 детей. Поэтому число вершин не превосходит\n\\[\n1+7+7\\cdot6+7\\cdot6^2+7\\cdot6^3=1814.\n\\]\nЭто противоречит тому, что в дереве 2003 вершины. Значит, наше предположение неверно, и в дереве действительно есть вершина, смежная как минимум с 8 малыми, то есть с 8 захолустными, вершинами.",
