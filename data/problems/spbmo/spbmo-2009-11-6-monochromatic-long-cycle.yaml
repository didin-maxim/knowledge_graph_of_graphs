  "solutions": [
    {
      "id": "sol-expanded",
      "title": "Средняя степень и DFS-оценка для длинного цикла",
      "text": "Пусть в стране \\(n\\) городов. Так как из каждого города выходит не меньше 2008 дорог, сумма степеней не меньше \\(2008n\\), а значит, всего дорог не меньше \\(1004n\\). Поэтому дорог одного из двух цветов не меньше \\(502n\\). Рассмотрим подграф \\(H\\), образованный дорогами этого цвета.\n\nДокажем, что всякий простой граф на \\(n\\) вершинах с не менее чем \\(502n\\) ребрами содержит простой цикл длины не меньше 504. Запустим в таком графе поиск в глубину в каждой компоненте и получим DFS-лес. В неориентированном графе каждое ребро соединяет вершину с ее предком или потомком в этом лесе: если два конца ребра не находятся в отношении предок-потомок, то при просмотре ребра из той вершины, которая была открыта раньше, второй конец был бы еще не завершенной внешней вершиной и попал бы в то же DFS-поддерево.\n\nПрипишем каждое ребро его более глубокой вершине. Если ребро соединяет вершину \\(v\\) с предком \\(u\\), находящимся на расстоянии хотя бы 503 по дереву, то путь дерева от \\(u\\) до \\(v\\) вместе с ребром \\(uv\\) дает простой цикл длины хотя бы 504. Значит, при отсутствии таких циклов к каждой вершине могут быть приписаны только ребра, ведущие к одному из ее 502 ближайших предков. Таких ребер у вершины не больше 502, а у корней DFS-леса их вообще нет. Поэтому общее число ребер было бы строго меньше \\(502n\\).\n\nНо у выбранного цветового подграфа \\(H\\) ребер не меньше \\(502n\\), противоречие. Следовательно, в \\(H\\) есть простой цикл длины не меньше 504. В исходной формулировке это и есть несамопересекающийся циклический маршрут из не менее чем 504 дорог одного цвета.",
