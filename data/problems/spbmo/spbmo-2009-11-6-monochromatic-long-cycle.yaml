      "title": "Один цвет имеет достаточно много ребер",
      "text": "Суммарно в графе не меньше 1004n ребер, поэтому один из цветов содержит не меньше 502n ребер. Нужный частный случай оценки Эрдеша--Галлаи доказывается через лес поиска в глубину: если нет цикла длины хотя бы 504, каждое ребро идет только к одному из 502 ближайших предков в DFS-лесе, откуда всего ребер меньше 502n.",
