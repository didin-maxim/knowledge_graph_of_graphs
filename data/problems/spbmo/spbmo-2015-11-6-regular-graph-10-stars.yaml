  "solutions": [
    {
      "id": "sol-expanded",
      "title": "Эйлерова ориентация",
      "text": "Достаточно ориентировать все дороги так, чтобы в каждый город входило число дорог, кратное 10: после этого входящие в один город дороги можно произвольно разбить на десятки, и каждая десятка будет пучком с центром в этом городе.\n\nРассмотрим одну связную компоненту графа. В ней степень каждой вершины равна 100, то есть чётна, поэтому все рёбра компоненты можно пройти одним замкнутым эйлеровым обходом. Ориентируем каждое ребро по направлению этого обхода. Каждый раз, когда обход приходит в вершину, он затем из неё выходит; поэтому число входящих рёбер в этой ориентации равно числу исходящих. Так как всего с вершиной инцидентно 100 рёбер, в неё входит ровно 50 рёбер.\n\nЧисло 50 делится на 10. Значит, для каждой вершины можно разбить все входящие в неё рёбра на группы по 10. Каждая такая группа является пучком дорог, выходящих из соответствующего города, если смотреть на неориентированные дороги исходной задачи. Каждое ребро входит ровно в одну вершину, значит попадает ровно в один пучок. Получено требуемое разбиение всех дорог.",
