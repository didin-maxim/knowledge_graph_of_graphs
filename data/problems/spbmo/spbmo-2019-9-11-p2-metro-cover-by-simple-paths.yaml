        "id": "stmt-original",
        "title": "Оригинальная формулировка",
        "text": "В городе построено 2019 станций метро. Некоторые пары станций соединены тоннелями, причем от любой станции по тоннелям можно добраться до любой другой. Мэр распорядился организовать несколько линий метро: каждая линия должна включать в себя несколько различных станций, последовательно соединенных тоннелями (по одному и тому же тоннелю может проходить несколько линий). При этом каждая станция должна лежать хотя бы на одной линии. Для экономии средств следует сделать не более \\(k\\) линий. Оказалось, что приказ мэра неосуществим. При каком наибольшем \\(k\\) это могло произойти?",
