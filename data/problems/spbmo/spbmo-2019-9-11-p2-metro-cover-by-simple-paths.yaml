  "solutions": [
    {
      "id": "sol-spanning-tree-leaf-pairing",
      "title": "Ответ \\(1008\\): остовное дерево и попарное соединение листьев",
      "text": "Ответ: \\(1008\\).\n\nСначала докажем, что в любой связной схеме из 2019 станций приказ можно выполнить при \\(k=1009\\). Рассмотрим граф, вершины которого — станции, а ребра — тоннели. Он связен. Выберем в нем остовное дерево \\(T\\). Если вершины дерева покрыты простыми путями в \\(T\\), то те же пути являются допустимыми линиями метро в исходном графе, поэтому достаточно работать с деревом.\n\nПусть у дерева \\(T\\) ровно \\(\\ell\\) листьев. Докажем стандартную лемму: вершины дерева можно покрыть не более чем \\(\\lceil \\ell/2\\rceil\\) простыми путями. Если \\(\\ell\\) нечетно, временно добавим к любой не-листовой вершине дерева один новый лист; после построения путей удалим этот вспомогательный лист из того пути, где он встретился. Поэтому достаточно разобрать четное число листьев \\(2m\\).\n\nНарисуем дерево на плоскости без пересечений и обойдем его по контуру, как при обходе глубины. Запишем листья в циклическом порядке их появления: \\(a_1,a_2,\\ldots,a_{2m}\\). Соединим путями пары противоположных листьев: \\((a_1,a_{m+1}), (a_2,a_{m+2}), \\ldots, (a_m,a_{2m})\\). Всего взято \\(m\\) путей.\n\nПокажем, что эти пути покрывают все ребра дерева, а значит и все вершины. Удалим любое ребро \\(e\\). Дерево распадается на две части, и листья одной из этих частей идут в контурном порядке подряд одним блоком. Размер меньшего из двух блоков не превосходит \\(m\\). При сдвиге номера листа на \\(m\\) противоположный лист уже не может остаться в том же меньшем блоке; если размер блока равен \\(m\\), он переходит ровно в дополнительный блок. Значит, найдется выбранная пара листьев, лежащих по разные стороны от ребра \\(e\\), и путь между ними проходит через \\(e\\). Так покрыто каждое ребро.\n\nУ дерева на 2019 вершинах число листьев не превосходит 2018. Следовательно, каждую такую схему можно покрыть не более чем \\(\\lceil 2018/2\\rceil=1009\\) линиями. Поэтому при \\(k=1009\\) приказ всегда осуществим, а наибольшее невозможное \\(k\\), если оно достигается, не больше \\(1008\\).\n\nОсталось привести пример, где \\(1008\\) линий недостаточно. Возьмем схему-звезду: одна центральная станция соединена тоннелями со всеми остальными 2018 станциями, а других тоннелей нет. Любая простая линия в такой схеме может содержать не более двух листьев, потому что путь между двумя листьями уже имеет вид лист — центр — лист, и через центр нельзя пройти дважды. Значит, чтобы покрыть все 2018 листьев, нужно не менее \\(2018/2=1009\\) линий. При \\(k=1008\\) приказ мэра неосуществим. Следовательно, наибольшее возможное значение \\(k\\) равно \\(1008\\).",
