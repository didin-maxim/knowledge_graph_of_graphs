      {
        "id": "stmt-graph",
        "title": "Графовая формулировка",
        "text": "Пусть \\(G\\) — связный граф на 2019 вершинах. Одной линией называется простой путь в \\(G\\), содержащий хотя бы две различные вершины; разные линии могут иметь общие вершины и ребра. Нужно покрыть все вершины графа не более чем \\(k\\) такими путями. Для какого наибольшего \\(k\\) существует связный граф \\(G\\), вершины которого невозможно покрыть не более чем \\(k\\) простыми путями?",
