  "solutions": [
    {
      "id": "sol-fixed-edge-neighborhood-partition",
      "title": "Доказательство через разбиение относительно выбранного ребра",
      "text": "Построим граф знакомств: вершины - люди, ребро означает знакомство. По условию это простой граф на 100 вершинах, степень каждой вершины равна 40. Так как сумма степеней равна \\(100\\cdot 40\\), в графе есть ребра; выберем одно ребро и обозначим его концы через \\(A\\) и \\(B\\).\n\nПусть \\(X\\) - множество всех вершин, не смежных с \\(B\\), а \\(Y\\) - множество всех вершин, не смежных с \\(A\\). Если существует ребро \\(CD\\), где \\(C\\in X\\) и \\(D\\in Y\\), то эта четверка уже обладает нужными свойствами: \\(A\\) смежна с \\(B\\), \\(C\\) смежна с \\(D\\), вершина \\(B\\) не смежна с \\(C\\), а вершина \\(A\\) не смежна с \\(D\\). При этом вершины различны: \\(C\\ne D\\), потому что \\(CD\\) - ребро, а \\(C,D\\) не совпадают с нужными концами \\(A,B\\) из-за условий несмежности.\n\nДокажем существование такого ребра между \\(X\\) и \\(Y\\). Предположим противное: никакого ребра с одним концом в \\(X\\), а другим в \\(Y\\), нет.\n\nРазобьем остальные 98 вершин по отношению к \\(A\\) и \\(B\\). Пусть \\(S\\) - общие соседи \\(A\\) и \\(B\\), \\(P\\) - соседи \\(A\\), не смежные с \\(B\\), \\(Q\\) - соседи \\(B\\), не смежные с \\(A\\), а \\(R\\) - вершины, не смежные ни с \\(A\\), ни с \\(B\\). Если \\(|S|=s\\), то из \\(\\deg A=40\\) и наличия ребра \\(AB\\) получаем \\(|P|=39-s\\); из \\(\\deg B=40\\) получаем \\(|Q|=39-s\\). Поэтому\n\\[\n|R|=98-|S|-|P|-|Q|=98-s-2(39-s)=20+s.\n\\]\nВ частности, \\(R\\) непусто.\n\nВозьмем вершину \\(r\\in R\\). Она лежит и в \\(X\\), и в \\(Y\\), потому что не смежна ни с \\(A\\), ни с \\(B\\). По нашему предположению из \\(r\\) не может выходить ребро ни в одну вершину из \\(X\\cup Y\\). Но \\(X\\cup Y=P\\cup Q\\cup R\\), а с вершинами \\(A\\) и \\(B\\) вершина \\(r\\) тоже не смежна по определению \\(R\\). Значит, у \\(r\\) вообще нет соседей, что противоречит равенству \\(\\deg r=40\\).\n\nПротиворечие показывает, что нужное ребро \\(CD\\) между \\(X\\) и \\(Y\\) существует. Тогда четыре вершины \\(A,B,C,D\\) удовлетворяют всем условиям задачи.",
      "idea_ids": [
