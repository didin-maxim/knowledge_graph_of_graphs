      "id": "idea-fix-edge-and-look-at-nonneighbors",
      "title": "Зафиксировать одно ребро и смотреть на незнакомых с его концами",
      "text": "Выбираем знакомую пару \\(A,B\\). Если удастся найти ребро между множеством вершин, не смежных с \\(B\\), и множеством вершин, не смежных с \\(A\\), то его концы можно взять за \\(C,D\\). Если такого ребра нет, вершины, не смежные ни с \\(A\\), ни с \\(B\\), оказываются изолированными от всех, кроме невозможных соседей \\(A,B\\).",
