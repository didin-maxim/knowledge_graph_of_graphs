        "id": "stmt-original",
        "title": "Условие",
        "text": "В связном графе \\(G\\) даны два непересекающихся множества вершин \\(X\\) и \\(Y\\), между этими множествами нет ни одного ребра. Пусть в графе \\(G-X\\) ровно \\(m\\) компонент связности, а в графе \\(G-Y\\) ровно \\(n\\) компонент связности. Какое наименьшее количество компонент связности может быть в графе \\(G-(X\\cup Y)\\)?\n\nНапомним, что для множества вершин \\(W\\) через \\(G-W\\) обозначается граф, полученный из \\(G\\) в результате удаления всех вершин множества \\(W\\) и всех выходящих из них ребер.",
