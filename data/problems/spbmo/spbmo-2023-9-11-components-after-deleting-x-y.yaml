  "solutions": [
    {
      "id": "sol-component-incidence-tree-bound",
      "title": "Вспомогательный граф компонент",
      "text": "Ответ: \\(m+n-1\\).\n\nСначала докажем, что меньше быть не может. Пусть компоненты графа \\(G-X\\) обозначены через \\(A_1,\\ldots,A_m\\), а компоненты графа \\(G-Y\\) - через \\(B_1,\\ldots,B_n\\). Рассмотрим компоненты графа \\(H=G-(X\\cup Y)\\). Каждая такая компонента \\(C\\) целиком лежит ровно в одной компоненте \\(A_i\\) графа \\(G-X\\) и ровно в одной компоненте \\(B_j\\) графа \\(G-Y\\): при удалении только \\(X\\) вершины из \\(C\\) могут соединяться с другими вершинами только через вершины из \\(Y\\), а при удалении только \\(Y\\) - только через вершины из \\(X\\).\n\nПостроим двудольный граф \\(T\\). В одной доле у него вершины \\(A_1,\\ldots,A_m\\), в другой - вершины \\(B_1,\\ldots,B_n\\). Для каждой компоненты \\(C\\) графа \\(H\\) проведем ребро между теми \\(A_i\\) и \\(B_j\\), которые содержат \\(C\\). Если несколько компонент дают одну и ту же пару, считаем их параллельными ребрами; для оценки это не мешает.\n\nПокажем, что \\(T\\) связен. Возьмем любые две его вершины, например две компоненты одного из графов \\(G-X\\) или \\(G-Y\\), и выберем в соответствующих множествах по исходной вершине графа \\(G\\). Так как \\(G\\) связен, между ними есть путь в \\(G\\). Двигаясь вдоль этого пути, каждый раз, когда мы находимся вне \\(X\\cup Y\\), мы попадаем в некоторую компоненту \\(H\\); участки пути, проходящие через вершины из \\(Y\\), не выходят за пределы одной компоненты \\(A_i\\), а участки, проходящие через вершины из \\(X\\), не выходят за пределы одной компоненты \\(B_j\\). Поэтому исходный путь задает маршрут в графе \\(T\\) между выбранными вершинами. Значит, \\(T\\) связен.\n\nУ связного графа с \\(m+n\\) вершинами не меньше \\(m+n-1\\) ребер. Но ребра графа \\(T\\) находятся во взаимно однозначном соответствии с компонентами графа \\(H=G-(X\\cup Y)\\). Следовательно, в \\(G-(X\\cup Y)\\) не меньше \\(m+n-1\\) компонент связности.\n\nОсталось показать, что эта оценка точна. Построим дерево \\(T\\) с долями \\(a_1,\\ldots,a_m\\) и \\(b_1,\\ldots,b_n\\): проведем ребра \\(a_i b_1\\) для всех \\(i\\) и ребра \\(a_1 b_j\\) для всех \\(j\\ge 2\\). В нем ровно \\(m+n-1\\) ребер. Для каждой вершины \\(a_i\\) создадим вершину \\(y_i\\) множества \\(Y\\), для каждой вершины \\(b_j\\) создадим вершину \\(x_j\\) множества \\(X\\). Для каждого ребра \\(a_i b_j\\) дерева создадим одну новую вершину \\(c_{ij}\\) вне \\(X\\cup Y\\) и соединим ее ребрами с \\(y_i\\) и \\(x_j\\). Других ребер не проводим.\n\nВ полученном графе нет ребер между \\(X\\) и \\(Y\\), а сам граф связен, потому что дерево \\(T\\) связно. Если удалить \\(X\\), то для каждого \\(i\\) вершина \\(y_i\\) вместе со всеми соседними \\(c_{ij}\\) образует одну компоненту, и таких компонент ровно \\(m\\). Если удалить \\(Y\\), то для каждого \\(j\\) вершина \\(x_j\\) вместе со всеми соседними \\(c_{ij}\\) образует одну компоненту, и таких компонент ровно \\(n\\). Если же удалить и \\(X\\), и \\(Y\\), останутся только изолированные вершины \\(c_{ij}\\), по одной на каждое ребро дерева \\(T\\). Их ровно \\(m+n-1\\). Значит, наименьшее возможное число компонент действительно равно \\(m+n-1\\).",
