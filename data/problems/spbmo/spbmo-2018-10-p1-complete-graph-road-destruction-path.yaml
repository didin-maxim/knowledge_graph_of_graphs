        "title": "Условие",
        "text": "Миша приехал в страну, в которой \\(n\\) городов и каждые два напрямую соединены дорогой. Он собирается, начав с некоторого города, объехать несколько городов, не заезжая ни в один город дважды. Каждый раз, пока Миша едет по дороге, президент разрушает \\(k\\) дорог, ведущих из города, в который ведет эта дорога. (А если там нет такого количества уцелевших дорог, разрушает все оставшиеся, кроме той, по которой едет Миша.) Какое наибольшее количество городов сможет объехать Миша, независимо от действия президента?",
