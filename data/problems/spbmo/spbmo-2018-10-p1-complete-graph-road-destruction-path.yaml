        "text": "В полном графе \\(K_n\\) два игрока играют в следующую игру. Первый игрок выбирает начальную вершину и затем каждый раз переходит из текущей вершины в еще не посещенную вершину по сохранившемуся ребру. После каждого такого перехода во второй конец выбранного ребра второй игрок удаляет до \\(k\\) сохранившихся ребер, инцидентных новой текущей вершине, но не удаляет ребро, по которому только что был сделан переход. Если таких ребер меньше \\(k\\), он может удалить все, кроме только что использованного. Определите наибольшее число вершин простого пути, которое первый игрок может гарантировать при любой игре второго.",
