  "solutions": [
    {
      "id": "sol-local-deletion-threshold",
      "title": "Порог числа непосещенных городов",
      "text": "Ответ: если \\(n=1\\), то \\(1\\); если \\(n\\ge 2\\), то \\(\\max(2,n-k)\\). В обычной записи это означает: при \\(k\\le n-2\\) Миша гарантирует ровно \\(n-k\\) городов, а при \\(k\\ge n-1\\) - ровно \\(2\\) города.\n\nСначала докажем нижнюю оценку. Начать Миша может в любом городе. Предположим, что он уже посетил \\(t\\) городов и находится в городе \\(v\\), причем \\(t<n-k\\). Тогда непосещенных городов \\(n-t>k\\). До приезда Миши в \\(v\\) ни одна дорога из \\(v\\) в еще непосещенный город не могла быть разрушена президентом: президент разрушает дороги только из того города, в который Миша только что приехал, а \\(v\\) раньше текущим городом не был; непосещенные города тоже еще не были текущими. Значит, перед действием президента из \\(v\\) ведут целые дороги во все \\(n-t\\) непосещенных городов. Президент может разрушить среди них не более \\(k\\), поэтому хотя бы одна такая дорога останется, и Миша сможет по ней продолжить маршрут. Следовательно, при \\(k\\le n-2\\) он может дойти до \\(t=n-k\\) посещенных городов. Если же \\(k\\ge n-1\\) и \\(n\\ge2\\), он по крайней мере выбирает начальный город и делает первый переезд, то есть посещает два города.\n\nТеперь докажем, что большего гарантировать нельзя. При \\(k\\le n-2\\) президент действует так: как только Миша приехал в очередной город и всего уже посещено \\(n-k\\) городов, непосещенных осталось ровно \\(k\\). Президент разрушает все дороги из текущего города к этим непосещенным городам. Ребро, по которому Миша приехал, не трогается, но оно ведет в уже посещенный город, а туда Мише возвращаться нельзя. Значит, продолжить маршрут невозможно, и больше \\(n-k\\) городов Миша гарантировать не может.\n\nПри \\(k\\ge n-1\\) президент после первого переезда Миши разрушает все еще уцелевшие дороги из нового города, кроме дороги, по которой Миша приехал. Все возможные продолжения ведут в непосещенные города и уничтожены, а возвращаться по старой дороге нельзя. Поэтому гарантировать больше двух городов невозможно. Совмещая нижнюю и верхнюю оценки, получаем указанную формулу.",
