  "solutions": [
    {
      "id": "sol-degree-split-random-choice",
      "title": "Разбор по степени и случайный выбор",
      "text": "Рассмотрим граф знакомств: вершины — жители, а ребра — пары знакомых. Условие означает, что у любых двух вершин есть общий сосед. Достаточно найти множество из не более чем \\(n\\) вершин, смежное с каждой вершиной вне этого множества; если вершин окажется меньше \\(n\\), его можно дополнить произвольными жителями.\n\nСначала пусть есть вершина \\(v\\), степень которой не превосходит \\(n\\). Возьмем в качестве \\(S\\) всех соседей \\(v\\). Тогда \\(|S|\\le n\\). Сама вершина \\(v\\) имеет соседа в \\(S\\). Если же вершина \\(x\\) не лежит в \\(S\\) и \\(x\\ne v\\), то у \\(x\\) и \\(v\\) есть общий сосед \\(y\\). Поскольку \\(y\\) смежен с \\(v\\), он лежит в \\(S\\); поскольку \\(y\\) смежен с \\(x\\), вершина \\(x\\) тоже имеет соседа в \\(S\\). Значит, в этом случае требуемое множество найдено.\n\nОстается случай, когда степень каждой вершины не меньше \\(n+1\\). Выберем равновероятно среди всех \\(n\\)-элементных подмножеств вершин множество \\(S\\). Назовем вершину \\(x\\) плохой, если \\(x\\notin S\\) и у \\(x\\) нет соседей в \\(S\\). Чтобы \\(x\\) была плохой, все выбранные вершины должны лежать среди не-соседей \\(x\\), отличных от самой \\(x\\). Таких вершин не больше\n\\[\n3n-1-(n+1)=2n-2.\n\\]\nПоэтому\n\\[\n\\Pr(x\\text{ плохая})\\le \\frac{\\binom{2n-2}{n}}{\\binom{3n}{n}}.\n\\]\nМатематическое ожидание числа плохих вершин не превосходит\n\\[\n3n\\frac{\\binom{2n-2}{n}}{\\binom{3n}{n}}.\n\\]\nЭта величина меньше 1. Действительно, при \\(n=1\\) она равна 0, при \\(n=2\\) равна \\(2/5\\), при \\(n=3\\) равна \\(3/7\\), а начиная с \\(n=3\\) при переходе от \\(n\\) к \\(n+1\\) она умножается на\n\\[\n\\frac{4(2n-1)(n+1)(2n+1)}{3(n-1)(3n+2)(3n+1)}<1,\n\\]\nпоскольку\n\\[\n3(n-1)(3n+2)(3n+1)-4(2n-1)(n+1)(2n+1)\n=11n^3-16n^2-17n-2>0\n\\]\nдля \\(n\\ge3\\).\n\nСледовательно, существует выбор \\(S\\), для которого плохих вершин нет вообще. Тогда каждая вершина вне \\(S\\) имеет соседа в \\(S\\), то есть выбранные \\(n\\) жителей удовлетворяют требованию задачи.",
