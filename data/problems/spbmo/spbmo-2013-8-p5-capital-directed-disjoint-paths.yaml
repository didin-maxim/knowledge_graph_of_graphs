  "ideas": [
    {
      "id": "idea-close-is-transitive",
      "title": "Близость городов является транзитивным отношением",
      "text": "Если две вершины нельзя достижимо развести двумя непересекающимися путями из столицы, то у них есть общий обязательный промежуточный город-доминатор. Общие доминаторы одной фиксированной вершины упорядочены вдоль любого пути из столицы, поэтому из близости \\(a\\) к \\(b\\) и \\(b\\) к \\(c\\) следует близость \\(a\\) к \\(c\\).",
