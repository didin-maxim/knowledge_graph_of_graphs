        "id": "stmt-original",
        "title": "Официальная олимпиадная формулировка",
        "text": "В стране несколько городов, некоторые из которых соединены дорогами с односторонним движением так, что из столицы можно добраться до любого города, не нарушая правил дорожного движения (при этом, возможно, проезжая через другие города). Назовем два нестоличных города близкими, если до них нельзя добраться из столицы по непересекающимися (то есть не проходящими через общие города) путям. Президент приказал соединить каждые два близких города прямой авиалинией. Оказалось, что теперь между любыми двумя нестоличными городами можно добраться, пользуясь только открытыми авиалиниями. Докажите, что тогда между любыми двумя нестоличными городами есть прямая авиалиния.",
