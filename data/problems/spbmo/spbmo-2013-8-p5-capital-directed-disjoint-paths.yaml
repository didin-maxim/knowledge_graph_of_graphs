    {
      "id": "idea-connected-equivalence-class",
      "title": "Связный граф отношения с транзитивными ребрами становится полным",
      "text": "После доказательства транзитивности близость разбивает нестоличные города на классы эквивалентности. Авиалинии соединяют ровно пары внутри классов; если по ним можно добраться между любыми двумя нестоличными городами, то класс всего один, значит каждая пара городов близка.",
