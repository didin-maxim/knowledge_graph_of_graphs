  "solutions": [
    {
      "id": "sol-dominators-transitivity",
      "title": "Доминаторы и транзитивность близости",
      "text": "Будем считать, что два пути из столицы могут иметь общую вершину \\(s\\), но среди нестоличных городов общих вершин у них быть не должно: именно так следует понимать фразу условия, потому что оба пути начинаются в столице.\n\nНазовем нестоличный город \\(x\\) доминатором города \\(y\\), если всякий путь из столицы \\(s\\) в \\(y\\) проходит через \\(x\\). Сам город \\(y\\) тоже считается своим доминатором.\n\nНам понадобится двухпутевая форма теоремы Менгера. Для двух нестоличных городов \\(u\\) и \\(v\\) ровно одно из двух: либо существуют два пути из \\(s\\) в \\(u\\) и из \\(s\\) в \\(v\\), пересекающиеся только в \\(s\\), либо существует нестоличный город \\(x\\), через который проходит каждый путь из \\(s\\) в \\(u\\) и каждый путь из \\(s\\) в \\(v\\). Это получается из вершинной формы Менгера, если расщепить каждую нестоличную вершину на вход и выход с пропускной способностью 1 и добавить общий сток, достижимый из \\(u\\) и \\(v\\). В случае отсутствия двух непересекающихся путей минимальный разделитель имеет размер 1; соответствующая вершина обязана отрезать от столицы оба города, то есть является их общим доминатором. В другую сторону утверждение немедленно следует из определения: если такой общий доминатор есть, два непересекающихся пути пройти через него одновременно не могут.\n\nЗначит два города близки тогда и только тогда, когда у них есть общий доминатор.\n\nТеперь докажем, что близость транзитивна. Пусть города \\(a\\) и \\(b\\) близки, а города \\(b\\) и \\(c\\) тоже близки. Выберем общий доминатор \\(x\\) для \\(a,b\\) и общий доминатор \\(y\\) для \\(b,c\\). Оба города \\(x\\) и \\(y\\) являются доминаторами одного и того же города \\(b\\). Зафиксируем какой-нибудь путь из \\(s\\) в \\(b\\). На этом пути \\(x\\) и \\(y\\) встречаются в некотором порядке. Если \\(x\\) встречается раньше \\(y\\), то \\(x\\) доминирует \\(y\\): иначе был бы путь из \\(s\\) в \\(y\\), обходящий \\(x\\), и, дописав к нему хвост зафиксированного пути от \\(y\\) до \\(b\\), мы получили бы путь из \\(s\\) в \\(b\\), обходящий \\(x\\), что невозможно. Если раньше встречается \\(y\\), то тем же способом \\(y\\) доминирует \\(x\\): путь из \\(s\\) в \\(x\\), обходящий \\(y\\), вместе с хвостом от \\(x\\) до \\(b\\) дал бы путь к \\(b\\), обходящий \\(y\\).\n\nВ первом случае \\(x\\) доминирует \\(a\\) по выбору \\(x\\), а также доминирует \\(c\\), потому что каждый путь к \\(c\\) проходит через \\(y\\), а каждый путь к \\(y\\) проходит через \\(x\\). Значит \\(x\\) - общий доминатор для \\(a\\) и \\(c\\), и эти города близки. Во втором случае тем же рассуждением \\(y\\) будет общим доминатором для \\(a\\) и \\(c\\). Следовательно, отношение близости транзитивно.\n\nОно также симметрично по определению. Поэтому близость разбивает все нестоличные города на классы: внутри одного класса любые два города близки, а между разными классами близких пар нет. Авиалинии проведены ровно внутри этих классов. Если после их проведения между любыми двумя нестоличными городами можно добраться, пользуясь только авиалиниями, то таких классов не может быть больше одного. Значит все нестоличные города лежат в одном классе, то есть любые два из них близки. По приказу президента каждая такая пара соединена прямой авиалинией, что и требовалось доказать.",
