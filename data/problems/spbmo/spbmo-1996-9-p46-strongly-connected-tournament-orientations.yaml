      "id": "idea-source-component-union-bound",
      "title": "Плохой турнир имеет собственную начальную компоненту",
      "text": "Если ориентация полного графа не сильно связна, то в конденсации ее сильных компонент есть начальная компонента S, из которой все ребра в дополнение направлены наружу. Для фиксированного S это фиксирует |S|(n-|S|) ребер, что делает такие ориентации очень редкими; объединение по всем возможным S дает оценку доли плохих турниров.",
