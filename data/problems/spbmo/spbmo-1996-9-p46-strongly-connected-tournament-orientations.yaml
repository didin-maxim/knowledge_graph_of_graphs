  "solutions": [
    {
      "id": "sol-count-bad-orientations",
      "title": "Оценка числа несильно связных турниров",
      "text": "Пусть \\(n=2000\\). Каждый проект одностороннего движения - это ориентация полного графа \\(K_n\\), то есть турнир. Всего проектов \\(2^{n(n-1)/2}\\).\n\nОценим число плохих проектов, в которых не из каждого города можно добраться в каждый. В несильно связном ориентированном графе рассмотрим конденсацию сильных компонент. Это ациклический ориентированный граф; для турнира между любыми двумя компонентами все ребра направлены в одну сторону, поэтому есть начальная сильная компонента S, из которой все ребра в дополнение \\(V\\setminus S\\) направлены наружу. Множество S непусто и не равно V.\n\nЕсли \\(|S|=k\\), то все \\(k(n-k)\\) ребер между S и \\(V\\setminus S\\) имеют заранее заданное направление. Остальные ребра можно ориентировать произвольно. Поэтому доля ориентаций, для которых данное S может быть такой начальной частью, равна \\(2^{-k(n-k)}\\). По объединению по всем S доля плохих проектов не превосходит\n\\[\n\\sum_{k=1}^{n-1} \\binom{n}{k}2^{-k(n-k)}.\n\\]\nСлагаемые с k и n-k одинаково оцениваются, поэтому достаточно \\(k\\le n/2\\) и удвоить сумму. Для таких k имеем \\(\\binom{n}{k}\\le n^k\\) и \\(2^{-k(n-k)}\\le 2^{-kn/2}\\). Следовательно,\n\\[\n\\sum_{k=1}^{n-1} \\binom{n}{k}2^{-k(n-k)}\n\\le 2\\sum_{k\\ge 1} (n2^{-n/2})^k.\n\\]\nПри \\(n=2000\\) величина \\(r=n2^{-n/2}=2000\\cdot2^{-1000}<2^{11}\\cdot2^{-1000}=2^{-989}<1/5\\). Поэтому правая часть меньше \\(2r/(1-r)<1/2\\). Следовательно, плохих проектов меньше половины, а оставшихся сильно связных проектов больше половины.",
