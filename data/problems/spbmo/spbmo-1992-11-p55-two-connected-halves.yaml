  "solutions": [
    {
      "id": "sol-ear-ordering",
      "title": "Порядок вершин со связными началом и концом",
      "text": "Переведём условие на язык графов: вершины - города, рёбра - дороги. По условию после удаления любой вершины граф остаётся связным. Докажем более общее утверждение: в любом таком графе можно занумеровать вершины \\(v_1,\\ldots,v_n\\) так, что для каждого \\(k\\) подграфы на множествах \\(\\{v_1,\\ldots,v_k\\}\\) и \\(\\{v_k,\\ldots,v_n\\}\\) связны.\n\nСначала напомним и докажем нужный факт. Такой граф имеет ушное разложение: его можно получить из некоторого цикла, последовательно добавляя пути, концы которых уже построены, а внутренние вершины ещё не построены. В самом деле, начальный цикл есть, потому что граф связен и не имеет разделяющей вершины. Возьмём максимальный уже построенный подграф \\(H\\) такого вида. Если \\(H\\ne G\\), то у некоторой компоненты графа \\(G-H\\) есть сосед в \\(H\\). У неё не может быть только одна вершина-сосед в \\(H\\), иначе эта вершина отделяла бы компоненту от остального графа. Значит, есть две разные точки присоединения к \\(H\\); кратчайший путь между ними с внутренними вершинами вне \\(H\\) является очередным ухом, что противоречит максимальности \\(H\\). Поэтому \\(H=G\\).\n\nТеперь построим нужную нумерацию по этому разложению. Для начального цикла берём порядок вершин вдоль цикла после удаления одного ребра: каждый префикс и каждый суффикс тогда является путём, значит связен. Пусть порядок уже построен для текущего подграфа, и добавляется ухо\n\\[\na=x_0,x_1,\\ldots,x_m,x_{m+1}=b,\n\\]\nгде \\(a\\) и \\(b\\) уже есть в графе, а \\(x_1,\\ldots,x_m\\) - новые вершины. Считаем, что \\(a\\) стоит в текущем порядке раньше \\(b\\), и вставим новые вершины \\(x_1,\\ldots,x_m\\) сразу после \\(a\\). Любой новый префикс связен, потому что новые вершины идут по пути от \\(a\\). Любой новый суффикс, начинающийся с одной из новых вершин, связен по хвосту этого пути до \\(b\\), а \\(b\\) лежит дальше в старом суффиксе. Старые префиксы и суффиксы тоже не теряют связности. Значит, свойство порядка сохраняется после каждого добавления уха.\n\nИтак, в исходном графе на 100 вершинах есть порядок \\(v_1,\\ldots,v_{100}\\), у которого каждый префикс и каждый суффикс связны. Берём\n\\[\nS=\\{v_1,\\ldots,v_{50}\\},\\qquad T=\\{v_{51},\\ldots,v_{100}\\}.\n\\]\nПодграф на \\(S\\) связен как префикс, а подграф на \\(T\\) связен как суффикс. Оба множества содержат по 50 городов, поэтому они и задают требуемые два суверенных государства.",
