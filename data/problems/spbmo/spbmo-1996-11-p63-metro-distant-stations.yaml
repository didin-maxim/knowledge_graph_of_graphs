        "title": "Оригинальная формулировка",
        "text": "В городе N. 120 линий метро, причём с любой станции можно доехать до любой другой, сделав не более 15 пересадок. Будем говорить, что две станции находятся далеко друг от друга, если для того, чтобы добраться с одной на другую, требуется не менее 5 пересадок. Какое наибольшее количество попарно далеких друг от друга станций может быть в этом городе?",
