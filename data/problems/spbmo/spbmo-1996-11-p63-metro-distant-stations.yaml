  "solutions": [
    {
      "id": "sol-disjoint-balls-and-tree-construction",
      "title": "Ответ 40 через непересекающиеся шары радиуса 2",
      "text": "Ответ: \\(40\\).\n\nПостроим граф пересадок линий: его вершины — линии метро, а две вершины соединены ребром, если соответствующие линии имеют общую станцию, где можно пересесть. Если станция лежит на нескольких линиях, то при оценке расстояния от нее до другой станции можно выбрать любую из этих линий; число пересадок равно минимальному расстоянию между соответствующими множествами линий.\n\nДокажем, что попарно далеких станций не больше \\(40\\). Пусть выбраны \\(m\\) попарно далеких станций. Для каждой из них выберем одну линию, проходящую через эту станцию. Для двух разных выбранных станций любые их линии находятся на расстоянии не меньше \\(5\\), иначе между самими станциями можно было бы доехать менее чем с \\(5\\) пересадками. Значит, выбранные \\(m\\) линий попарно удалены в графе пересадок хотя бы на \\(5\\).\n\nРассмотрим вокруг каждой выбранной линии замкнутый шар радиуса \\(2\\), то есть все линии на расстоянии не больше \\(2\\) от нее. Эти шары попарно не пересекаются: если бы некоторая линия лежала в двух таких шарах, расстояние между центрами было бы не больше \\(4\\). Кроме того, если \\(m\\ge2\\), то каждый шар содержит как минимум три линии. Действительно, от его центра до любого другого выбранного центра есть кратчайший путь длины не меньше \\(5\\); первые две вершины этого пути вместе с центром лежат в шаре радиуса \\(2\\) и различны. Поэтому \\(120\\), общее число линий, не меньше \\(3m\\). Следовательно, \\(m\\le40\\). При \\(m=0\\) или \\(m=1\\) эта оценка тем более верна.\n\nОсталось показать, что \\(40\\) достижимо. Возьмем дерево из 120 вершин-линий: есть центральная линия \\(O\\), от нее выходит один луч длины \\(2\\) и 39 лучей длины \\(3\\). Всего вершин получается \\(1+2+39\\cdot3=120\\). Для каждого ребра этого дерева сделаем одну станцию пересадки, общую ровно для двух соответствующих линий. На конце каждого из 40 лучей добавим по одной обычной станции, лежащей только на концевой линии.\n\nДиаметр построенного дерева равен \\(6\\), поэтому из любой станции можно доехать до любой другой не более чем с \\(6\\) пересадками, а значит условие задачи с пределом \\(15\\) выполнено. Две обычные станции на разных концах лучей находятся на расстоянии, равном расстоянию между соответствующими концевыми линиями: между концом короткого луча и концом любого длинного луча это \\(2+3=5\\), а между концами двух длинных лучей это \\(3+3=6\\). Следовательно, эти 40 станций попарно далеки друг от друга. Максимум равен \\(40\\).",
