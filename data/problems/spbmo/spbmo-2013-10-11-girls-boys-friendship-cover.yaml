  "solutions": [
    {
      "id": "sol-threshold-grid-pigeonhole",
      "title": "Разбиение по порогам возраста и роста",
      "text": "Разделим девушек на два типа. Пусть девушек возрастного типа \\(a\\): каждая из них дружит ровно с юношами старше неё. Тогда девушек ростового типа \\(10-a\\): каждая из них дружит ровно с юношами выше неё.\n\nУпорядочим 40 юношей по возрасту от младших к старшим. Каждая девушка возрастного типа задаёт в этом порядке один порог: все юноши после порога являются её друзьями, а все юноши до порога не являются. Если несколько порогов совпадают, это только уменьшает число частей; в любом случае эти \\(a\\) порогов разбивают юношей не более чем на \\(a+1\\) возрастных классов. Два юноши из одного такого класса либо оба старше каждой фиксированной девушки возрастного типа, либо оба не старше её.\n\nТеперь упорядочим юношей по росту от низких к высоким. Каждая девушка ростового типа тоже задаёт один порог: после него стоят ровно те юноши, которые выше этой девушки. Поэтому девушки ростового типа задают не более \\((10-a)+1=11-a\\) ростовых классов. Два юноши из одного ростового класса либо оба выше каждой фиксированной девушки ростового типа, либо оба не выше её.\n\nТеперь каждому юноше сопоставим пару: его возрастной класс и его ростовой класс. Возможных пар не больше\n\\[\n(a+1)(11-a).\n\\]\nПри \\(0\\le a\\le 10\\) это число не превосходит 36: произведение максимально при наиболее равном разбиении, то есть при \\(a=5\\), и равно \\(6\\cdot 6=36\\).\n\nЮношей 40, а возможных пар классов не больше 36. По принципу Дирихле найдутся два различных юноши с одной и той же парой классов. Для любой девушки возрастного типа они одновременно дружат или одновременно не дружат с ней, потому что лежат в одном возрастном классе. Для любой девушки ростового типа то же верно по ростовому классу. Значит, эти два юноши имеют ровно одно и то же множество подруг.",
