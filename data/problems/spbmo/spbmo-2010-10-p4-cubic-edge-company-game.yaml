        "text": "В стране 2010 городов, из каждого из которых выходит ровно по три дороги, ведущие в другие города. Президент и премьер-министр играют в следующую игру: они по очереди продают дороги трём частным компаниям; изначально все дороги государственные, каждый своим ходом продаёт ровно одну дорогу. Первым ходит премьер. Президент хочет добиться того, чтобы хотя бы для одного города все три выходящие из него дороги оказались проданы разным компаниям, а премьер хочет этого избежать. Проигравший уходит в отставку. Кто из двух политиков сможет сохранить свой пост при правильной игре?",
