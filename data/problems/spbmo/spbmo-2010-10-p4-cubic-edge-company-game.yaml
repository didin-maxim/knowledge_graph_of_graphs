  "solutions": [
    {
      "id": "sol-candidate-threat-chain",
      "title": "Кандидатное решение через цепочку угроз",
      "text": "Ответ: президент.\n\nНазовём вершину опасной, если у неё уже окрашены два инцидентных ребра в два разных цвета, а третье ещё не окрашено. Если после хода премьера появилась опасная вершина, президент на следующем ходу окрашивает её третье ребро в оставшийся цвет и выигрывает. Значит, чтобы не проиграть сразу, премьер должен после каждого хода президента немедленно гасить созданную опасность: окрашивать единственное оставшееся ребро при этой вершине в один из двух уже использованных там цветов.\n\nСтратегия президента такая. После очередного хода премьера он смотрит на один из концов только что окрашенного ребра, где ещё есть неокрашенное соседнее ребро, и окрашивает такое соседнее ребро в цвет, отличный от цвета ребра премьера. Тем самым президент создаёт опасную вершину. Если премьер не закрасит третье ребро этой вершины, президент следующим ходом выигрывает. Если премьер закрашивает его, то игра переносится к другому концу этого третьего ребра, и президент повторяет тот же приём.\n\nТак получается цепочка вынужденных ответов. Внутри цепочки каждая обработанная вершина степени 3 полностью окрашивается, а премьер не имеет свободы уйти в другую часть графа: любое отклонение оставляет президенту радужный выигрыш на уже созданной опасной вершине. Если цепочка приходит в вершину, где уже есть окрашенное ребро другого цвета, президент сразу выигрывает, закрашивая оставшееся ребро третьим цветом. Если же такого немедленного выигрыша нет, цепочка заканчивает безопасный фрагмент; после следующего свободного хода премьера президент начинает новую цепочку тем же способом.\n\nКандидатное завершение проверки состоит в том, что весь 3-регулярный граф на 2010 вершинах имеет \\(2010\\cdot 3/2=3015\\) рёбер, а безопасные законченные фрагменты описанной стратегии разбирают рёбра попарно после стартового хода фрагмента. Поэтому премьер не может разбить всю игру только на безопасные фрагменты: в некоторый момент вынужденная защита отсутствует или приводит к ранее окрашенному ребру другого цвета, и президент получает радужную вершину. Следовательно, премьер уходит в отставку, а президент сохраняет пост.",
