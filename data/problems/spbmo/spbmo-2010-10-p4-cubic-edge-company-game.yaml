    {
      "id": "sol-double-threat-and-recursive-descent",
      "title": "Две угрозы на конце пути и спуск в свежую компоненту",
      "text": "Ответ: президент сохраняет свой пост.\n\nБудем говорить, что вершина опасна, если у неё уже окрашены два инцидентных ребра в два разных цвета, а третье инцидентное ребро ещё не окрашено. Если после хода премьера есть опасная вершина, президент сразу выигрывает: он окрашивает третье ребро этой вершины в оставшийся третий цвет. Поэтому, когда президент своим ходом создаёт опасную вершину, премьер обязан следующим ходом окрашивать именно её третье ребро и обязан красить его в один из двух уже имеющихся у этой вершины цветов.\n\nСначала опишем вспомогательную вилку. Пусть есть неокрашенный путь\n\\[\np_0p_1\\ldots p_k\n\\]\nв такой части графа, где никакие другие рёбра, инцидентные вершинам пути, ещё не окрашены, кроме двух внешних рёбер, входящих в \\(p_0\\) и \\(p_k\\). Президент ходит. Если \\(k=1\\), он красит ребро \\(p_0p_1\\) в цвет, отличный от цветов обоих внешних рёбер, если эти цвета различны, и в любой другой цвет, если они совпадают. Тогда сразу обе вершины \\(p_0,p_1\\) становятся опасными, а премьер может закрыть только одну из двух угроз; следующим ходом президент выигрывает.\n\nЕсли \\(k>1\\), президент красит \\(p_0p_1\\) в цвет, отличный от цвета внешнего ребра при \\(p_0\\). Вершина \\(p_0\\) становится опасной, и премьер вынужден окрасить её третье ребро, не лежащее на пути. Затем президент красит \\(p_1p_2\\) в цвет, отличный от цвета \\(p_0p_1\\); премьер вынужден закрывать угрозу при \\(p_1\\). Так президент последовательно проходит путь. На последнем шаге он красит ребро \\(p_{k-1}p_k\\) в цвет, отличный одновременно от цвета \\(p_{k-2}p_{k-1}\\) и от цвета внешнего ребра при \\(p_k\\); среди трёх цветов такой выбор всегда есть. Тогда опасными становятся обе вершины \\(p_{k-1}\\) и \\(p_k\\). Премьер одним ходом может закрыть только одну из этих угроз, поэтому президент выигрывает следующим ходом. Значит, как только президент получает две уже окрашенные внешние дороги к концам свежего неокрашенного пути, он может форсировать победу.\n\nРассмотрим первый ход премьера: он красит ребро \\(uv\\) в цвет \\(a\\). Если \\(uv\\) лежит на цикле, возьмём путь \\(u=p_0,p_1,\n\\ldots,p_k=v\\), который получается из этого цикла удалением ребра \\(uv\\). Президент красит \\(p_0p_1\\) в цвет, отличный от \\(a\\). Вершина \\(u\\) стала опасной, поэтому премьер вынужден окрасить третье ребро из \\(u\\). После этого у свежего пути \\(p_1p_2\\ldots p_k\\) есть два окрашенных внешних ребра: \\(p_0p_1\\) при \\(p_1\\) и \\(uv\\) при \\(p_k=v\\). Все остальные рёбра, инцидентные вершинам этого пути и не лежащие на нём, ещё не окрашены. Президент применяет вилку и выигрывает.\n\nОстаётся случай, когда первый ход премьера пришёлся на мост \\(uv\\). Удалим этот мост и посмотрим на компоненту \\(H\\), содержащую \\(u\\). В графе \\(H\\) вершина \\(u\\) имеет степень 2, а все остальные вершины имеют степень 3. Такая конечная компонента не может быть деревом: если в ней \\(m\\) вершин, сумма внутренних степеней равна \\(3m-1\\), значит число внутренних рёбер равно \\((3m-1)/2>m-1\\). Следовательно, в \\(H\\) есть цикл.\n\nТеперь президент спускается внутри \\(H\\). Текущая вершина \\(x\\) имеет одно уже окрашенное внешнее ребро цвета \\(c\\) к обработанной части, а два остальных ребра ведут в свежую компоненту \\(H\\) и ещё не окрашены; сначала это \\(x=u\\), \\(c=a\\). Президент красит одно из двух свежих рёбер из \\(x\\) в цвет, отличный от \\(c\\). Вершина \\(x\\) становится опасной, и премьер вынужден окрасить второе свежее ребро из \\(x\\). Если два новых конца соединены путём в \\(H-x\\), президент берёт кратчайший такой путь; его внутренние вершины не имеют окрашенных инцидентных рёбер, и президент выигрывает по вилке.\n\nЕсли эти два конца лежат в разных компонентах графа \\(H-x\\), президент выбирает одну из этих компонент и делает её новой свежей компонентой. Она снова имеет ровно одну вершину внутренней степени 2, а все остальные её вершины имеют внутреннюю степень 3, поэтому по тому же подсчёту содержит цикл. Кроме того, она строго меньше прежней свежей компоненты. Значит, такой спуск не может продолжаться бесконечно. На некотором шаге два передних конца окажутся соединены свежим путём, после чего президент применит вилку двух одновременных угроз.\n\nТаким образом, при любой игре премьера президент форсирует появление вершины, у которой три дороги проданы трём разным компаниям. Значит, премьер уходит в отставку, а президент сохраняет пост.",
