      "id": "idea-forest-construction",
      "title": "Лес из почти тысячных компонент",
      "text": "Если граф знакомств является лесом, все компоненты которого имеют не более 999 вершин, то любые 1000 выбранных вершин лежат как минимум в двух компонентах и потому индуцируют не более 998 рёбер. Чтобы получить много рёбер, надо взять как можно меньше таких компонент.",
