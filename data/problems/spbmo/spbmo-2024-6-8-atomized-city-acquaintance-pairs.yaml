  "solutions": [
    {
      "id": "sol-local-sparsity-forest-bound",
      "title": "Решение через разреженность каждых 1000 вершин",
      "text": "Ответ: \\(998998\\).\n\nСначала построим пример. Разобьём \\(999999\\) жителей на \\(1001\\) группу по \\(999\\) человек, а последнего жителя оставим отдельно. В каждой группе по \\(999\\) человек устроим знакомства так, чтобы граф знакомств внутри группы был деревом: например, можно выбрать одного человека и познакомить его со всеми остальными из этой группы. Между разными группами знакомств нет.\n\nВ каждой из \\(1001\\) больших групп получилось \\(998\\) пар знакомых, поэтому всего пар знакомых\n\\[\n1001\\cdot 998=998998.\n\\]\nПроверим условие атомизированности. Возьмём любых \\(1000\\) жителей. В одной компоненте нашего леса не может лежать больше \\(999\\) выбранных жителей, значит выбранные жители встречаются как минимум в двух компонентах. В лесу на \\(1000\\) вершинах, разбитом хотя бы на две непустые компоненты, число рёбер не больше \\(1000-2=998\\). Поэтому построенный город подходит.\n\nОсталось доказать, что больше быть не может. Докажем более общую лемму. Пусть \\(G\\) — простой граф на \\(n\\) вершинах, \\(n\\ge k\\), и любые \\(k\\) его вершин индуцируют не более \\(k-2\\) рёбер. Тогда\n\\[\ne(G)\\le n-\\left\\lceil \\frac{n}{k-1}\\right\\rceil.\n\\]\n\nСначала заметим два простых факта. Во-первых, в \\(G\\) нет связной компоненты хотя бы на \\(k\\) вершинах: в любой такой компоненте можно взять \\(k\\) вершин, образующих связное дерево на \\(k\\) вершинах, и выбранные вершины индуцировали бы как минимум \\(k-1\\) рёбер, что запрещено. Значит, все компоненты имеют не более \\(k-1\\) вершин.\n\nВо-вторых, если в графе с не менее чем \\(k\\) вершинами каждая компонента содержит цикл, то снова получается противоречие. Действительно, будем брать целые компоненты, пока их суммарный размер не превысил \\(k\\). Если на каком-то шаге набрали ровно \\(k\\) вершин, то эти целые циклические компоненты содержат не меньше \\(k\\) рёбер. Если же набрали \\(s<k\\) вершин, а следующая компонента уже слишком велика для полного добавления, то в этой следующей связной компоненте можно взять связное множество из \\(k-s\\) вершин; оно содержит хотя бы \\(k-s-1\\) рёбер. Полностью взятые циклические компоненты содержат не меньше \\(s\\) рёбер, поэтому вместе выбранные \\(k\\) вершин индуцируют не меньше\n\\[\ns+(k-s-1)=k-1\n\\]\nрёбер. Это опять невозможно. Следовательно, пока вершин хотя бы \\(k\\), в графе обязательно есть компонента, являющаяся деревом.\n\nТеперь докажем лемму индукцией по \\(n\\). При \\(n=k\\) она совпадает с условием: \\(e(G)\\le k-2=k-\\lceil k/(k-1)\\rceil\\). Пусть \\(n>k\\). Выберем компоненту-дерево \\(T\\), пусть в ней \\(t\\) вершин; тогда в ней \\(t-1\\) рёбер. Удалим эту компоненту. Если осталось хотя бы \\(k\\) вершин, то к оставшемуся графу применима индукция, и потому\n\\[\ne(G)\\le (t-1)+(n-t)-\\left\\lceil\\frac{n-t}{k-1}\\right\\rceil.\n\\]\nТак как \\(1\\le t\\le k-1\\), величина \\(\\left\\lceil n/(k-1)\\right\\rceil\\) отличается от \\(\\left\\lceil (n-t)/(k-1)\\right\\rceil\\) не более чем на \\(1\\). Значит правая часть не превосходит\n\\[\nn-\\left\\lceil\\frac{n}{k-1}\\right\\rceil.\n\\]\n\nОстаётся случай, когда после удаления \\(T\\) осталось \\(r<k\\) вершин. Так как до удаления было \\(n\\ge k\\) вершин, в дереве \\(T\\) можно выбрать связное множество из \\(k-r\\) вершин. Если бы оставшийся граф имел больше \\(r-1\\) рёбер, то эти \\(r\\) оставшихся вершин вместе с выбранными \\(k-r\\) вершинами дерева индуцировали бы больше\n\\[\n(r-1)+(k-r-1)=k-2\n\\]\nрёбер, то есть как минимум \\(k-1\\) рёбер. Это запрещено. Следовательно, в остатке не более \\(r-1\\) рёбер, и всего\n\\[\ne(G)\\le (t-1)+(r-1)=n-2.\n\\]\nПоскольку здесь \\(k\\le n\\le 2k-2\\), имеем \\(\\left\\lceil n/(k-1)\\right\\rceil=2\\), так что это ровно нужная оценка. Лемма доказана.\n\nПрименяем лемму при \\(k=1000\\) и \\(n=1\\,000\\,000\\). Получаем\n\\[\ne(G)\\le 1\\,000\\,000-\\left\\lceil\\frac{1\\,000\\,000}{999}\\right\\rceil.\n\\]\nТак как \\(1\\,000\\,000=1001\\cdot 999+1\\), то \\(\\left\\lceil 1\\,000\\,000/999\\right\\rceil=1002\\). Следовательно,\n\\[\ne(G)\\le 1\\,000\\,000-1002=998998.\n\\]\nПостроение выше показывает, что эта оценка достижима, значит наибольшее возможное число пар знакомых равно \\(998998\\).",
