    {
      "id": "idea-local-sparsity-induction",
      "title": "Локальная разреженность даёт удаляемую древесную компоненту",
      "text": "Для общей оценки используется лемма: если каждые \\(k\\) вершин графа индуцируют не более \\(k-2\\) рёбер, то всего рёбер не больше \\(n-\\lceil n/(k-1)\\rceil\\). Ключевой шаг индукции: пока вершин хотя бы \\(k\\), в графе есть компонента-дерево; иначе из циклических компонент можно набрать \\(k\\) вершин с как минимум \\(k-1\\) рёбрами.",
