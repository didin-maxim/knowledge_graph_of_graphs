        "id": "stmt-original",
        "title": "Оригинальная формулировка",
        "text": "Пусть между городами \\(A\\), \\(B\\), \\(C\\) и \\(D\\) есть дороги \\(AB\\) и \\(CD\\), но нет дорог \\(BC\\) и \\(AD\\). Назовем перестройкой замену пары дорог \\(AB\\) и \\(CD\\) на пару дорог \\(BC\\) и \\(AD\\). Изначально в стране было несколько городов, некоторые пары городов были соединены дорогами, причем из каждого города выходило по 100 дорог. Министр нарисовал новую схему дорог, в которой из каждого города по-прежнему выходит 100 дорог. Известно, что как в старой, так и в новой схемах никакие два города не соединены более чем одной дорогой. Докажите, что новую схему можно получить из старой с помощью нескольких перестроек.",
