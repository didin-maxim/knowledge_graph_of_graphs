  "solutions": [
    {
      "id": "sol-alternating-cycle-switches",
      "title": "Симметрическая разность и переключение чередующихся циклов",
      "text": "Будем говорить на языке графов: города - вершины, дороги - ребра простого графа. Старая схема - это граф \\(G\\), новая - граф \\(H\\) на том же множестве вершин. В обоих графах степень каждой вершины равна 100.\n\nСначала докажем лемму. Пусть в текущем простом графе дан четный цикл \\(C\\), ребра которого попеременно присутствуют и отсутствуют в графе. Тогда можно с помощью 2-перестроек заменить на этом цикле все присутствующие ребра отсутствующими, а все отсутствующие - присутствующими, не меняя ребер вне цикла в итоговом графе.\n\nДокажем лемму индукцией по половине длины цикла. Для 4-цикла это ровно одна разрешенная перестройка: две противоположные стороны цикла являются ребрами графа, две другие - не являются, и мы заменяем первую пару второй.\n\nПусть длина цикла больше 4. Запишем его как\n\\[\nv_0v_1v_2\\ldots v_{2k-1}v_0,\n\\]\nгде ребра \\(v_0v_1, v_2v_3,\\ldots,v_{2k-2}v_{2k-1}\\) отсутствуют, а ребра \\(v_1v_2, v_3v_4,\\ldots,v_{2k-1}v_0\\) присутствуют в текущем графе. Рассмотрим хорду \\(v_2v_{2k-1}\\).\n\nЕсли этой хорды сейчас нет, то выполним перестройку: удалим присутствующие ребра \\(v_1v_2\\) и \\(v_{2k-1}v_0\\), а добавим отсутствующие ребра \\(v_0v_1\\) и \\(v_2v_{2k-1}\\). После этого остается переключить меньший чередующийся цикл\n\\[\nv_2v_3\\ldots v_{2k-1}v_2,\n\\]\nчто возможно по предположению индукции. В итоге на исходном цикле все ребра действительно поменялись местами.\n\nЕсли хорда \\(v_2v_{2k-1}\\) уже есть, то цикл \\(v_2v_3\\ldots v_{2k-1}v_2\\) сам является меньшим чередующимся циклом: хорда присутствует, а дальше вдоль старого цикла ребра чередуются как отсутствующее, присутствующее, ..., отсутствующее. Сначала переключим этот меньший цикл по индукции; после этого хорда \\(v_2v_{2k-1}\\) исчезнет. Теперь можно выполнить ту же перестройку с ребрами \\(v_1v_2\\), \\(v_{2k-1}v_0\\), добавив \\(v_0v_1\\) и \\(v_2v_{2k-1}\\). Снова итог ровно такой, как нужно: все ребра исходного цикла переключены, а хорда вернулась в свое первоначальное состояние. Лемма доказана.\n\nТеперь применим лемму к нашим двум схемам. Покрасим ребра из \\(E(G)\\setminus E(H)\\) в красный цвет, а ребра из \\(E(H)\\setminus E(G)\\) - в синий. В каждой вершине число красных ребер равно числу синих: действительно, в обоих графах степень вершины равна 100, а общие ребра дают одинаковый вклад. Поэтому, начиная с любого еще не использованного красного или синего ребра и каждый раз продолжая ребром другого цвета, можно получить замкнутый чередующийся маршрут; если в нем есть самопересечения, он разбивается на более короткие чередующиеся циклы. Повторяя это, разбиваем всю симметрическую разность \\(E(G)\\triangle E(H)\\) на чередующиеся циклы.\n\nНа каждом таком цикле присутствующие в текущем графе ребра - это ровно красные ребра, которые надо удалить, а отсутствующие - синие ребра, которые надо добавить. По лемме один цикл можно полностью переключить конечным числом 2-перестроек. После переключения этого цикла число ребер, в которых текущий граф отличается от \\(H\\), уменьшается, а уже совпавшие с \\(H\\) ребра вне цикла в итоговом состоянии не меняются. Переключая циклы один за другим, мы в конце получим ровно граф \\(H\\).\n\nЗначит, новую дорожную схему можно получить из старой с помощью нескольких перестроек.",
