        "id": "stmt-original",
        "title": "Официальная олимпиадная формулировка",
        "text": "В стране 600 городов, некоторые пары городов соединены дорогами, причем из любого города можно добраться по дорогам в любой другой. Для любых двух соединенных дорогой городов A и B найдутся еще два таких города C и D, что любые два из этих четырёх городов соединены дорогой. Докажите, что можно закрыть на ремонт несколько дорог так, чтобы количество городов, из которых выходит ровно две дороги, стало меньше 100, и при этом между любыми двумя городами остался единственный путь, не проходящий два раза по одной и той же дороге.",
        "source_id": "src-spbmo-2018-city-68",
