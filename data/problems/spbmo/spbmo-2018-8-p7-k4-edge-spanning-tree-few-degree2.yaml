  "solutions": [
    {
      "id": "sol-hist-two-triangles",
      "title": "Через остовное дерево без вершин степени 2",
      "text": "Переведём условие на язык графов: города - вершины, дороги - рёбра. Связность страны означает связность графа \\(G\\). Фраза про города \\(A,B,C,D\\), любые два из которых соединены дорогой, означает, что каждое ребро \\(AB\\) лежит в некотором \\(K_4\\).\n\nОтсюда каждое ребро лежит хотя бы в двух треугольниках: если \\(A,B,C,D\\) образуют \\(K_4\\), то ребро \\(AB\\) входит в треугольники \\(ABC\\) и \\(ABD\\).\n\nИспользуем более сильную стандартную теорему Чена--Шаня: если в конечном связном графе каждое ребро лежит хотя бы в двух треугольниках, то в графе существует остовное дерево без вершин степени 2. Такое дерево называют homeomorphically irreducible spanning tree, или HIST.\n\nПрименяя теорему к нашему графу \\(G\\), получаем остовное дерево \\(T\\), в котором число вершин степени 2 равно нулю. Теперь закроем на ремонт все дороги, не входящие в \\(T\\). Оставшиеся дороги соединяют все 600 городов, потому что \\(T\\) остовное, и между любыми двумя городами остался ровно один путь, потому что \\(T\\) - дерево. Количество городов, из которых выходит ровно две оставленные дороги, равно \\(0\\), а значит меньше \\(100\\). Требуемое доказано.",
