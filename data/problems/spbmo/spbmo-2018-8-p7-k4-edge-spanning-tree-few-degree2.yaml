      "id": "idea-k4-edge-gives-two-triangles",
      "title": "Каждое ребро в K4 лежит в двух треугольниках",
      "text": "Если ребро \\(AB\\) дополняется вершинами \\(C,D\\) до полного графа на четырёх вершинах, то \\(AB\\) входит как минимум в два разных треугольника: \\(ABC\\) и \\(ABD\\). Значит условие задачи сильнее стандартного условия 'каждое ребро лежит хотя бы в двух треугольниках'.",
