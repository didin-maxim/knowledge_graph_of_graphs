        "title": "Графовая формулировка",
        "text": "Пусть \\(G\\) - конечный связный простой граф на 600 вершинах. Каждое ребро \\(AB\\) графа \\(G\\) лежит в некоторой клике \\(K_4\\): существуют вершины \\(C,D\\), такие что подграф на \\(A,B,C,D\\) полный. Докажите, что в \\(G\\) есть остовное дерево, в котором меньше 100 вершин имеют степень 2.",
