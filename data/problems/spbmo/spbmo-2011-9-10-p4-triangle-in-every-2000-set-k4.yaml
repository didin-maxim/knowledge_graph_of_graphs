  "solutions": [
    {
      "id": "sol-contrapositive-greedy-coloring",
      "title": "Контрапозиция, жадная раскраска и двойной счёт",
      "text": "Построим граф знакомств: вершины — жители, ребро означает знакомство. Условие говорит, что любое множество из 2000 вершин содержит треугольник. Нужно доказать существование \\(K_4\\).\n\nПредположим противное: в графе нет \\(K_4\\). Тогда степень любой вершины не превосходит 1999. Действительно, если у вершины \\(v\\) есть хотя бы 2000 соседей, то среди каких-нибудь 2000 из них по условию найдутся три попарно смежные вершины. Вместе с \\(v\\) они образуют \\(K_4\\), противоречие.\n\nЗначит, граф можно правильно раскрасить не более чем в 2000 цветов жадным алгоритмом: когда красим очередную вершину, среди её уже окрашенных соседей занято не более 1999 цветов, так что один из 2000 цветов свободен. Обозначим размеры цветовых классов через \\(a_1,\\dots,a_{2000}\\), разрешая пустые классы.\n\nОбъединение любых двух цветовых классов является двудольным графом, поэтому в нём нет треугольника. Но по условию каждое множество из 2000 вершин содержит треугольник; следовательно, всякое множество без треугольников имеет размер не больше 1999. Значит, для любых разных \\(i,j\\) выполнено\n\\[\na_i+a_j\\le 1999.\n\\]\nПросуммируем эти неравенства по всем \\(\\binom{2000}{2}\\) парам цветов. Каждое \\(a_i\\) встретится ровно в 1999 парах, поэтому\n\\[\n1999(a_1+\\cdots+a_{2000})\\le \\binom{2000}{2}\\cdot 1999.\n\\]\nПосле сокращения получаем\n\\[\na_1+\\cdots+a_{2000}\\le \\binom{2000}{2}=1 999 000.\n\\]\nНо левая часть — это число всех жителей, равное 2 000 000. Противоречие. Значит, четверо попарно знакомых жителей обязательно существуют.",
