  "solutions": [
    {
      "id": "sol-euler-incidence-count",
      "title": "Подсчет степеней и соседств с вершинами степени 5",
      "text": "Рассмотрим граф ребер многогранника. Так как многогранник выпуклый и все его грани треугольные, этот граф имеет плоскую укладку на сфере, в которой каждая грань является треугольником. Для каждой вершины \\(v\\) обозначим ее степень через \\(d(v)\\).\n\nПусть \\(V,E,F\\) - числа вершин, ребер и граней. Из треугольности граней имеем \\(3F=2E\\), а из формулы Эйлера \\(V-E+F=2\\). Поэтому \\(E=3V-6\\), и сумма степеней равна \\(2E=6V-12\\). Следовательно,\n\\[\n\\sum_v (6-d(v))=12. \\tag{1}\n\\]\n\nОбозначим через \\(n_5\\) число вершин степени 5, а через \\(H\\) множество вершин степени хотя бы 7. Вершин степени меньше 5 по условию нет, вершины степени 6 не дают вклада в (1), поэтому\n\\[\nn_5=12+\\sum_{u\\in H}(d(u)-6). \\tag{2}\n\\]\n\nПредположим противное: нет грани, у которой степени вершин равны \\(5,6,6\\). Возьмем вершину \\(x\\) степени 5. Ее соседи в триангуляции идут по циклу длины 5: каждые две соседние в этом цикле вместе с \\(x\\) образуют грань. По условию ни один сосед \\(x\\) не имеет степени 5. Значит все пять соседей имеют степень хотя бы 6. Если бы среди них нашлись две соседние вершины степени 6, то соответствующая грань имела бы степени \\(5,6,6\\), что запрещено нашим предположением. Поэтому в цикле из пяти соседей вершины степени 6 не стоят рядом, а значит таких соседей не больше двух. Следовательно, у каждой вершины степени 5 есть как минимум три соседа из \\(H\\).\n\nПосчитаем инцидентности между вершинами степени 5 и вершинами из \\(H\\). С одной стороны, их не меньше \\(3n_5\\). С другой стороны, зафиксируем вершину \\(u\\in H\\) степени \\(d\\). Ее соседи тоже расположены по циклу, и любые две соседние в этом цикле соединены ребром. Так как две вершины степени 5 по условию не соединены ребром, среди соседей \\(u\\) не может быть двух подряд идущих пятерок. Значит у \\(u\\) не больше \\(\\lfloor d/2\\rfloor\\) соседей степени 5. Поэтому\n\\[\n3n_5\\le \\sum_{u\\in H}\\left\\lfloor\\frac{d(u)}2\\right\\rfloor. \\tag{3}\n\\]\n\nНо при \\(d\\ge7\\) верно \\(\\lfloor d/2\\rfloor\\le 3(d-6)\\): для \\(d=7\\) обе части равны 3, а дальше правая часть растет быстрее. Из (3) получаем\n\\[\n3n_5\\le 3\\sum_{u\\in H}(d(u)-6).\n\\]\nПо (2) правая часть равна \\(3(n_5-12)\\), то есть \\(3n_5\\le3n_5-36\\), что невозможно. Противоречие доказывает, что нужная грань со степенями \\(5,6,6\\) существует.",
