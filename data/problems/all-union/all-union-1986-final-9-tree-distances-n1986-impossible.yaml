  "solutions": [
    {
      "id": "sol-parity-square-obstruction-n1986",
      "title": "Чётностное препятствие",
      "text": "Ответ: нельзя.\n\nПредположим, что такое дерево существует. Длина каждого ребра целая: ребро соединяет две соседние вершины, значит его длина сама является расстоянием между парой вершин и потому входит в набор \\(1,2,\\ldots,\\binom{1986}{2}\\).\n\nДокажем сначала общее необходимое условие для дерева на \\(n\\) вершинах. Выберем корень \\(r\\) и покрасим вершину \\(v\\) в белый цвет, если расстояние от \\(r\\) до \\(v\\) чётно, и в чёрный цвет, если оно нечётно. Так как все реберные длины целые, при переходе по ребру цвет меняется ровно тогда, когда длина этого ребра нечётна. Следовательно, для любых двух вершин расстояние между ними нечётно тогда и только тогда, когда вершины имеют разные цвета.\n\nПусть в двух цветах \\(x\\) и \\(y\\) вершин, \\(x+y=n\\). Тогда число пар вершин с нечётным расстоянием равно \\(xy\\). Но все расстояния по условию - это ровно числа \\(1,2,3,\\ldots,N\\), где \\(N=\\binom n2\\). Если \\(N\\) нечётно, то среди этих чисел \\((N+1)/2\\) нечётных, поэтому\n\\[\nxy=\\frac{N+1}{2}=\\frac{n^2-n+2}{4}.\n\\]\nТогда\n\\[\n(x-y)^2=(x+y)^2-4xy=n^2-(n^2-n+2)=n-2.\n\\]\nЗначит, при нечётном \\(N\\) число \\(n-2\\) обязано быть квадратом целого числа.\n\nТеперь подставим \\(n=1986\\). Имеем\n\\[\nN=\\binom{1986}{2}=993\\cdot1985,\n\\]\nэто нечётное число. Поэтому необходимо, чтобы \\(1986-2=1984\\) было квадратом. Но\n\\[\n44^2=1936<1984<2025=45^2.\n\\]\nПротиворечие. Следовательно, требуемого дерева, а значит и требуемой сети дорог для \\(1986\\) городов, не существует.",
