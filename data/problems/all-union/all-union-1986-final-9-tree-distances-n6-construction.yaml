        "id": "stmt-original-n6",
        "title": "Шесть городов и все расстояния от 1 до 15",
        "text": "В одном государстве король хочет построить \\(6\\) городов и \\(5\\) дорог между ними так, чтобы из каждого города можно было проехать в любой другой. Каждая дорога соединяет два города, дороги не пересекаются и не проходят через другие города. Можно ли сделать так, чтобы кратчайшие расстояния по сети дорог между всеми \\(15\\) парами городов равнялись \\(1\\) км, \\(2\\) км, \\(3\\) км, ..., \\(15\\) км?",
