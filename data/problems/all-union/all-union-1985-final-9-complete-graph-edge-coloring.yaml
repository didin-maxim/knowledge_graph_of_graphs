  "ideas": [
    {
      "id": "idea-parallel-chord-directions",
      "title": "Раскраска по направлениям хорд",
      "text": "В правильном \\(n\\)-угольнике все стороны и диагонали разбиваются ровно на \\(n\\) классов параллельных отрезков. Отрезки одного класса параллельны и различны, поэтому не имеют общей точки; это даёт верхнюю оценку. Нижняя оценка получается из \\(n\\) попарно пересекающихся отрезков около одной вершины.",
      "tags": [
        "coloring",
        "construction"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-published-parallel-classes",
      "title": "Ответ через параллельные классы хорд",
      "text": "Ответ: нужно ровно \\(n\\) цветов.\n\nСначала докажем, что меньшим числом цветов обойтись нельзя. Выберем вершину \\(A\\) правильного \\(n\\)-угольника и обозначим через \\(B\\) и \\(C\\) две соседние с ней вершины. Рассмотрим все \\(n-1\\) отрезков, выходящих из \\(A\\), и ещё отрезок \\(BC\\). Всего получилось \\(n\\) отрезков.\n\nЛюбые два отрезка из первых \\(n-1\\) имеют общую точку \\(A\\). Отрезок \\(BC\\) имеет общую точку с \\(AB\\) и \\(AC\\). Если \\(D\\) — любая другая вершина, то вершины \\(B\\) и \\(C\\) разделяют на границе многоугольника две дуги: одна из них содержит только \\(A\\), а другая содержит все остальные вершины. Поэтому хорды \\(AD\\) и \\(BC\\) в выпуклом многоугольнике пересекаются во внутренней точке. Значит, выбранные \\(n\\) отрезков попарно имеют общую точку, и все они должны получить разные цвета. Следовательно, цветов нужно не меньше \\(n\\).\n\nТеперь построим раскраску в \\(n\\) цветов. Пронумеруем вершины правильного \\(n\\)-угольника числами \\(0,1,\\ldots,n-1\\) по кругу. Для хорды с концами \\(i\\) и \\(j\\) её направление определяется остатком \\(i+j\\) по модулю \\(n\\): действительно, прямая через эти две вершины перпендикулярна радиусу, проведённому к середине соответствующей дуги, а эта середина имеет угловую координату \\(\\pi(i+j)/n\\) с точностью до \\(\\pi\\). Поэтому у всех сторон и диагоналей есть не более \\(n\\) разных направлений.\n\nПокрасим два отрезка одинаково тогда и только тогда, когда они параллельны, то есть имеют одно и то же направление. В одном классе параллельности два различных отрезка не могут иметь общей точки: пересекающиеся прямые не параллельны, а две разные параллельные прямые не пересекаются. Кроме того, из одной вершины не выходят два разных отрезка одного направления, так что совпадения в вершине тоже не возникает. Значит, такая раскраска допустима.\n\nОсталось отметить, что использовано ровно \\(n\\) цветов. Все \\(n\\) направлений действительно встречаются: например, у хорд \\(0j\\), где \\(j=1,2,\\ldots,n-1\\), получаются \\(n-1\\) разных остатков, а ещё оставшийся остаток даёт отрезок между двумя соседними с вершиной \\(0\\) вершинами. Итак, существует допустимая раскраска в \\(n\\) цветов, а меньше \\(n\\) цветов невозможно.",
