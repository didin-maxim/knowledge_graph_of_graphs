    {
      "id": "sol-published-degree-balance",
      "title": "Баланс побед и поражений",
      "text": "Каждый спортсмен сыграл ровно 9 партий, поэтому для каждого \\(i\\) выполнено\n\\[\nx_i+y_i=9.\n\\]\nКроме того, в каждой партии есть ровно один победитель и ровно один проигравший. Значит, общее число побед равно общему числу поражений:\n\\[\nx_1+\\cdots+x_{10}=y_1+\\cdots+y_{10}.\n\\]\nТеперь вычтем суммы квадратов:\n\\[\n\\sum_{i=1}^{10}x_i^2-\\sum_{i=1}^{10}y_i^2=\\sum_{i=1}^{10}(x_i-y_i)(x_i+y_i)=9\\sum_{i=1}^{10}(x_i-y_i)=0.\n\\]\nСледовательно,\n\\[\nx_1^2+\\cdots+x_{10}^2=y_1^2+\\cdots+y_{10}^2.\n\\]",
