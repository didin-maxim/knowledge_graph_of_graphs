        "title": "10 спортсменов в круговом турнире",
        "text": "Десять спортсменов участвовали в турнире по настольному теннису. Каждые два из них сыграли между собой ровно одну партию. Первый игрок одержал в ходе турнира \\(x_1\\) побед и потерпел \\(y_1\\) поражений, второй одержал \\(x_2\\) побед и потерпел \\(y_2\\) поражений и т. д. Доказать, что \\(x_1^2+\\cdots+x_{10}^2=y_1^2+\\cdots+y_{10}^2\\).",
