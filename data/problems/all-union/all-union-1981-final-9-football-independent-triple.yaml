      "id": "idea-nine-nonopponents-round-capacity",
      "title": "Взять девять команд, не игравших с фиксированной командой",
      "text": "Если фиксированная команда не играла с девятью командами, то достаточно найти среди этих девяти две команды, которые тоже не играли друг с другом. Все \\(\\binom{9}{2}=36\\) матчей внутри такой девятки нельзя провести за 8 туров: в одном туре внутри 9 команд возможно не более 4 матчей.",
