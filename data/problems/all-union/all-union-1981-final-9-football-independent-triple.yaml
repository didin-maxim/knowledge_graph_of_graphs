  "solutions": [
    {
      "id": "sol-published-nine-nonopponents",
      "title": "Подсчет матчей внутри девяти несыгравших с фиксированной командой",
      "text": "Выберем произвольную команду \\(A\\). За 8 туров она сыграла с 8 командами, поэтому осталось ровно 9 команд, с которыми \\(A\\) еще не встречалась.\n\nПокажем, что среди этих 9 команд найдутся две, также не игравшие друг с другом. Действительно, если бы каждые две из них уже сыграли, то внутри этой девятки были бы проведены все \\(\\binom{9}{2}=36\\) матчей. Но за один тур внутри 9 команд можно провести не более 4 матчей, потому что в одном туре каждая команда участвует не более чем в одном матче, а одна из 9 команд неизбежно остается без соперника из этой же девятки. Значит, за 8 туров внутри девятки могло быть проведено не более \\(8\\cdot4=32\\) матчей, что меньше 36.\n\nИтак, найдутся две команды \\(B\\) и \\(C\\) из этой девятки, которые еще не играли между собой. Команда \\(A\\) не играла ни с \\(B\\), ни с \\(C\\) по выбору девятки. Следовательно, \\(A,B,C\\) — три команды, между которыми пока не было ни одного матча.",
