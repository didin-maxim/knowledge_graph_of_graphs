      "id": "sol-official-summary",
      "title": "Развернутая стратегия второй фирмы",
      "text": "Ответ: могут.\n\nПостроим граф знакомств. Обозначим четырёх гениев через G0, G1, G2, G3. Добавим ещё четырёх программистов F0, F1, F2, F3, которые будут играть роль 'знаменитых'. Для каждой пары i, j соединим Fi и Gj отдельной цепочкой длины k(i,j), то есть цепочкой\nFi = H0(i,j), H1(i,j), ..., Hk(i,j)(i,j) = Gj,\nгде соседние вершины цепочки знакомы. Внутренние вершины всех шестнадцати цепочек считаются различными, а других программистов и других знакомств нет. Длины зададим таблицей:\n\nот F0: 13, 12, 11, 10;\nот F1: 12, 11, 10, 13;\nот F2: 11, 10, 13, 12;\nот F3: 10, 13, 12, 11.\n\nИными словами, в строке Fi стоят длины цепочек от Fi до G0, G1, G2, G3. Каждая следующая строка получается циклическим сдвигом: по сравнению со строкой Fi строка F(i+1) короче ровно на 1 для трёх последовательных гениев и длиннее для четвёртого.\n\nБудем говорить, что расстояние от фирмы до ещё не нанятого программиста X равно минимальному числу дальнейших ходов, за которое эта фирма могла бы нанять X, если бы другая фирма больше не мешала; уже занятые другой фирмой вершины использовать нельзя. После первого хода фирмы это обычное расстояние от её уже нанятого связного множества до X по свободным вершинам. Если фирма стоит в Fi, то её расстояние до Gj равно k(i,j).\n\nОпишем первый ответ второй фирмы. Если первая фирма первым ходом взяла знаменитого программиста Fi, то вторая берёт F(i+1) с индексами по модулю 4. Тогда три гения Gi, G(i+1), G(i+2) ближе ко второй фирме, чем к первой: соответствующие длины у F(i+1) меньше на 1. После переобозначения этих трёх гениев будем называть их G0, G1, G2, а оставшегося - G3. Например, если первая взяла F0, то вторая берёт F1 и имеет расстояния 12, 11, 10 до G0, G1, G2, тогда как первая имеет 13, 12, 11.\n\nЕсли первая фирма первым ходом взяла гения, назовём его G3, то вторая берёт любого знаменитого программиста, например F0, и будет бороться за G0, G1, G2. До этих трёх гениев второй фирме нужно соответственно 13, 12, 11 ходов. Первой же, чтобы из G3 добраться до любого другого гения, надо пройти через некоторого знаменитого программиста, поэтому требуется не меньше 10 + 10 = 20 ходов, фактически в таблице минимум равен 21. Значит, все G0, G1, G2 сначала существенно ближе ко второй фирме.\n\nЕсли первая фирма первым ходом взяла внутреннюю вершину цепочки между некоторым Fi и некоторым гением, назовём этот гений G3, то вторая берёт Fi и снова борется за G0, G1, G2. Для любого j = 0, 1, 2 путь первой фирмы к Gj через Fi длиннее пути второй ровно на расстояние от первой вершины до Fi; если же путь через Fi уже перекрыт занятым второй фирмой Fi, то первой тем более не легче. Поэтому каждый из G0, G1, G2 после ответа второй фирмы ближе ко второй фирме.\n\nИтак, после первого ответа второй фирмы есть знаменитый программист F, принадлежащий второй фирме, и три целевых гения G0, G1, G2 со свойством: каждый из них строго ближе ко второй фирме, чем к первой. Зафиксируем для второй фирмы три её канала - цепочки от F к G0, G1, G2. Эти три цепочки имеют общую только вершину F, а их внутренние вершины не встречаются ни в каких других каналах второй фирмы. Поэтому первая фирма не может попасть во внутренность такого канала со стороны F, потому что F уже занят второй фирмой; со стороны Gj она тоже не может войти, пока не наняла самого Gj. Следовательно, пока Gj ещё не у второй фирмы, её частный канал к Gj остаётся свободным, и вторая фирма всегда может одним ходом уменьшить своё расстояние до Gj на 1, взяв следующую вершину этого канала.\n\nТеперь поддерживается следующий инвариант: сразу после каждого хода второй фирмы каждый ещё не нанятый из G0, G1, G2 находится строго ближе ко второй фирме, чем к первой. Пусть инвариант выполнен. Первая фирма делает ход. Один ход может уменьшить её расстояние до любого фиксированного гения не более чем на 1, потому что новая вершина обязана быть смежна с уже нанятым связным множеством первой фирмы. Если первая фирма взяла вершину на цепочке, ведущей к одному из целевых гениев Gj, то именно расстояние до этого Gj является единственной немедленной угрозой: движение по такой цепочке приближает первую фирму к её гениевому концу, а к другим целевым гениям путь всё равно должен сначала пройти через один из концов цепочки и не становится короче защищённых каналов второй фирмы. Вторая фирма отвечает ходом по своему каналу к тому же Gj. До хода первой был строгий целочисленный зазор, значит расстояние первой до Gj после её хода всё ещё не меньше прежнего расстояния второй; затем вторая уменьшает своё расстояние на 1 и снова получает строгий зазор.\n\nЕсли же ход первой фирмы не лежит на цепочке к G0, G1 или G2, то он не приближает её ни к одному из этих трёх гениев. Тогда вторая фирма уменьшает на 1 своё расстояние до того из G0, G1, G2, который от неё дальше всего; при равенстве выбирает любой. Строгий зазор для всех трёх гениев сохраняется, а максимальное из расстояний второй фирмы до целевых гениев не растёт.\n\nОсталось объяснить, почему сохранение этого инварианта действительно даёт победу. Если первая фирма когда-нибудь смогла бы нанять один из G0, G1, G2, то непосредственно перед её ходом расстояние от неё до этого гения было бы равно 1. Но это состояние наступает после предыдущего хода второй фирмы, а по инварианту расстояние второй фирмы до того же гения должно быть строго меньше 1, то есть равно 0. Значит, этот гений уже нанят второй фирмой, противоречие. Поэтому первая фирма не может завладеть ни одним из G0, G1, G2.\n\nПри этом вторая фирма не застревает: пока среди G0, G1, G2 есть не нанятый ею гений, его частный канал от F свободен от вершин первой фирмы до самого конца, и вторая может продолжать идти по нему. Если первая фирма прекращает приём, вторая просто продолжает сокращать расстояния по тем же каналам. Так как граф конечен, после конечного числа ходов вторая фирма нанимает G0, G1 и G2. Следовательно, заранее устроенные знакомства действительно позволяют фирме, вступающей в игру второй, гарантированно нанять по крайней мере трёх гениев.",
