  "ideas": [
    {
      "id": "idea-independent-set-peeling",
      "title": "Снятие максимальных независимых множеств",
      "text": "Официальное решение прямо вводит граф точек и отрезков. Максимальные независимые множества дают первые оценки на число рёбер; усиление до 7n использует, что K4 нельзя реализовать единичными отрезками на плоскости.",
