    "graph_theory": [
      {
        "id": "stmt-graph",
        "title": "Граф единичных расстояний с малым числом независимости",
        "text": "Дан граф единичных расстояний G=(V,E) на 4n вершинах на плоскости. Любое множество из n+1 вершин не является независимым, то есть alpha(G) <= n. Докажите, что |E| >= 7n.",
