  "solutions": [
    {
      "id": "sol-official-summary",
      "title": "Слои максимальных независимых множеств",
      "text": "Построим граф \\(G=(V,E)\\): вершины -- отмеченные точки, а ребрами соединены ровно те пары точек, расстояние между которыми равно 1 см. По условию среди любых \\(n+1\\) вершин есть ребро, то есть всякое независимое множество имеет размер не больше \\(n\\).\n\nВыберем в \\(G\\) независимое множество \\(Q_1\\) максимального размера. Тогда \\(|Q_1|\\le n\\). Из максимальности следует, что каждая вершина из \\(V\\setminus Q_1\\) имеет хотя бы одного соседа в \\(Q_1\\): иначе такую вершину можно было бы добавить к \\(Q_1\\), не нарушив независимость.\n\nРазобьем \\(V\\setminus Q_1\\) на два множества. Пусть \\(W_1\\) состоит из вершин, имеющих ровно одного соседа в \\(Q_1\\), а \\(W_2\\) -- из вершин, имеющих не менее двух соседей в \\(Q_1\\). Докажем, что \\(|W_1|\\le 2n\\). Предположим противное: \\(|W_1|>2n\\). Каждой вершине из \\(W_1\\) сопоставим ее единственного соседа в \\(Q_1\\). Так как \\(|Q_1|\\le n\\), по принципу Дирихле найдется вершина \\(q\\in Q_1\\), смежная как минимум с тремя вершинами \\(x_1,x_2,x_3\\in W_1\\). Если бы какие-то две из них, скажем \\(x_i\\) и \\(x_j\\), не были смежны, то множество \\((Q_1\\setminus\\{q\\})\\cup\\{x_i,x_j\\}\\) было бы независимым: внутри \\(Q_1\\setminus\\{q\\}\\) ребер нет, вершины \\(x_i,x_j\\) не смежны, а с вершинами \\(Q_1\\setminus\\{q\\}\\) они не соединены, потому что их единственный сосед в \\(Q_1\\) равен \\(q\\). Это независимое множество имело бы размер \\(|Q_1|+1\\), противореча максимальности \\(Q_1\\). Значит, \\(x_1,x_2,x_3\\) попарно смежны, и вместе с \\(q\\) они образуют полный граф \\(K_4\\), все ребра которого являются единичными отрезками.\n\nНо четыре точки плоскости не могут быть попарно на расстоянии 1. Действительно, три попарно единичные точки образуют равносторонний треугольник. Точка, находящаяся на расстоянии 1 от двух его вершин, может быть только одной из двух вершин равносторонних треугольников на этой стороне: одна из них уже является третьей вершиной, а другая удалена от нее на расстояние \\(\\sqrt3\\), а не на 1. Противоречие доказывает \\(|W_1|\\le 2n\\).\n\nТеперь посчитаем ребра, идущие из \\(Q_1\\) в \\(V\\setminus Q_1\\). Их не меньше \\(|W_1|+2|W_2|=2|V\\setminus Q_1|-|W_1|\\). Так как \\(|V|=4n\\), \\(|Q_1|\\le n\\) и \\(|W_1|\\le 2n\\), получаем не менее \\(2(4n-|Q_1|)-2n\\ge 4n\\) таких ребер.\n\nУдалим вершины \\(Q_1\\) и рассмотрим оставшийся граф на множестве \\(V_1=V\\setminus Q_1\\). В нем также нет независимого множества размера \\(n+1\\), потому что всякое независимое множество остаточного графа было бы независимым и в \\(G\\). Выберем максимальное независимое множество \\(Q_2\\subset V_1\\). Тогда \\(|Q_2|\\le n\\), и каждая вершина из \\(V_1\\setminus Q_2\\) имеет соседа в \\(Q_2\\). Поэтому внутри остаточного графа есть не менее \\(|V_1|-|Q_2|=4n-|Q_1|-|Q_2|\\ge 2n\\) ребер между \\(Q_2\\) и \\(V_1\\setminus Q_2\\). Эти ребра не пересекаются с уже посчитанными ребрами, так как уже посчитанные ребра были инцидентны \\(Q_1\\), а теперь мы считаем только ребра внутри \\(V_1\\).\n\nПовторим тот же обычный шаг еще раз. Удалим \\(Q_2\\), положим \\(V_2=V_1\\setminus Q_2\\) и выберем максимальное независимое множество \\(Q_3\\subset V_2\\). Тогда \\(|Q_3|\\le n\\), и каждая вершина из \\(V_2\\setminus Q_3\\) имеет соседа в \\(Q_3\\). Значит, есть еще не менее \\(|V_2|-|Q_3|=4n-|Q_1|-|Q_2|-|Q_3|\\ge n\\) новых ребер, опять не совпадающих с ранее посчитанными.\n\nИтак, общее число ребер не меньше \\(4n+2n+n=7n\\). Эти ребра и есть проведенные единичные отрезки, значит всего проведено не менее \\(7n\\) отрезков.",
