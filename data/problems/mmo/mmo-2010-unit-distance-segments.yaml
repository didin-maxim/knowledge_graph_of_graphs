  "solutions": [
    {
      "id": "sol-official-summary",
      "title": "Официальное решение, кратко",
      "text": "Пусть V -- отмеченные точки, E -- пары, соединённые отрезками. Из условия alpha(G)<=n. Берут максимальное независимое Q1, затем аналогично независимые множества в остаточных графах, получая сначала 6n рёбер. Для 7n первый шаг уточняется: если слишком много вершин имеет ровно одного соседа в Q1, то у некоторой q из Q1 есть три таких соседа; максимальность Q1 заставляет их попарно соединяться, что даёт K4 единичных расстояний на плоскости, невозможный геометрически.",
