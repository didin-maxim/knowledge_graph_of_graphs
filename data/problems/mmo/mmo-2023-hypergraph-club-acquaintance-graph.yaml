  "solutions": [
    {
      "id": "sol-official-hypergraph-club",
      "title": "Оценка и конструкция на 11 школьниках",
      "text": "Ответ: 11. Сначала докажем, что меньше 11 школьников быть не могло. Для каждого школьника посчитаем, сколько заседаний он посетил, и выберем школьника A, у которого это число максимально; обозначим его через k. Каждое из 100 заседаний посетил хотя бы один школьник, поэтому общее число посещений всех школьников по всем заседаниям не меньше 100. С другой стороны, по выбору A каждый из n школьников посетил не более k заседаний, значит общее число посещений не больше nk. Следовательно, nk >= 100, то есть k >= 100/n. По условию у школьника A число знакомых не меньше числа посещенных им заседаний, значит у A есть по крайней мере k знакомых. Вместе с самим A это дает по крайней мере k + 1 различных школьников, поэтому n >= k + 1. Совмещая это с k >= 100/n, получаем n >= 100/n + 1. При n <= 10 правая часть строго больше n, поскольку 100/n + 1 >= 11, а значит такое n невозможно. Следовательно, n >= 11. Теперь построим пример при n = 11. Пронумеруем школьников числами 1, 2, ..., 11. Первое заседание посетят все 11 школьников. Оставшиеся 99 заседаний разобьем на 11 групп по 9 заседаний. Для каждого i от 1 до 11 все 9 заседаний i-й группы посетит только школьник i. Тогда каждое из 100 заседаний непусто. Каждый школьник посетил ровно 10 заседаний: одно общее и 9 своих одиночных. На первом заседании каждый школьник познакомился со всеми остальными 10 школьниками, а одиночные заседания новых знакомств не добавляют. Поэтому у каждого школьника ровно 10 знакомых и ровно 10 посещенных заседаний, так что требуемое условие выполнено. Значит n = 11 достижимо, а по нижней оценке это минимальное значение.",
