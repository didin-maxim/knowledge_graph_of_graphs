      "id": "idea-alpha-and-coloring",
      "title": "Независимые множества и две точные раскраски",
      "text": "Нижняя оценка получается из \\(\\alpha(G)\\le n\\) для графа на тройках из \\([n]\\): независимое семейство троек переводится в ортонормальную над \\(\\mathbb F_2\\) систему векторов инцидентности. Верхняя оценка для \\(n=2^k\\) достигается двумя конструкциями: индукцией с разбиением множества пополам и 1-факторизациями полных графов, а также двоичным кодированием элементов и цветом \\(\\{a+b,a+c,b+c\\}\\) над \\(\\mathbb F_2^k\\).",
