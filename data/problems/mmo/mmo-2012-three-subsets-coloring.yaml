    {
      "id": "sol-official-summary",
      "title": "Полное доказательство нижней оценки и двух конструкций",
      "text": "Ответ: \\((2^k-1)(2^k-2)/6\\). Докажем это в более общем обозначении. Пусть \\(n=2^k\\), а \\(G\\) - граф на всех тройках элементов множества \\([n]\\), где ребро означает пересечение ровно в одном элементе. Число вершин равно \\(\\binom n3\\). Если граф правильно раскрашен, то каждый цветовой класс является независимым множеством, поэтому \\(\\chi(G)\\ge |V(G)|/\\alpha(G)\\). Докажем, что \\(\\alpha(G)\\le n\\). Пусть \\(M_1,\\ldots,M_s\\) - независимое множество вершин, то есть любые две различные тройки \\(M_i,M_j\\) не пересекаются ровно в одном элементе. Запишем для каждой тройки её вектор инцидентности \\(x_i\\in\\mathbb F_2^n\\). Тогда \\(x_i\\cdot x_i=3\\equiv 1\\pmod 2\\), а при \\(i\\ne j\\) пересечение \\(M_i\\cap M_j\\) имеет размер 0 или 2, значит \\(x_i\\cdot x_j=0\\) в \\(\\mathbb F_2\\). Если \\(c_1x_1+\\cdots+c_sx_s=0\\) над \\(\\mathbb F_2\\), то скалярное умножение на \\(x_j\\) даёт \\(c_j=0\\). Следовательно, \\(x_1,\\ldots,x_s\\) линейно независимы, и \\(s\\le n\\). Поэтому \\(\\chi(G)\\ge \\binom n3/n=(n-1)(n-2)/6\\).\n\nПервая конструкция раскраски доказывается индукцией по \\(k\\). Для \\(k=1\\) вершин нет, а для \\(k=2\\) все четыре тройки в \\([4]\\) попарно пересекаются по двум элементам, так что одного цвета достаточно. Пусть уже построена правильная раскраска графа на тройках из множества размера \\(m=2^r\\) в \\((m-1)(m-2)/6\\) цветов. Рассмотрим множество размера \\(2m\\) и разобьём его на две равные части \\(A_1\\) и \\(A_2\\). Тройки, целиком лежащие в \\(A_1\\), и тройки, целиком лежащие в \\(A_2\\), раскрасим индуктивно одним и тем же набором старых цветов: тройка из \\(A_1\\) не имеет общих элементов с тройкой из \\(A_2\\), поэтому между такими вершинами нет ребра.\n\nОсталось раскрасить тройки, которые встречают обе части. Нам понадобится стандартное разложение всех пар элементов каждого \\(A_i\\) на \\(m-1\\) совершенных паросочетаний. Такое разложение есть для любого чётного \\(m\\): можно обозначить одну вершину символом \\(\\infty\\), остальные вершины элементами циклической группы \\(\\mathbb Z_{m-1}\\), и для каждого \\(t\\in\\mathbb Z_{m-1}\\) взять пары \\(\\{\\infty,t\\}\\) и \\(\\{t+r,t-r\\}\\) при \\(r=1,\\ldots,(m-2)/2\\); при изменении \\(t\\) каждая неупорядоченная пара появляется ровно один раз. Пусть \\(N_1,\\ldots,N_{m-1}\\) - такие паросочетания на \\(A_1\\), а \\(L_1,\\ldots,L_{m-1}\\) - такие паросочетания на \\(A_2\\). Для фиксированного \\(i\\) занумеруем пары \\(N_i\\) как \\(p_0,\\ldots,p_{m/2-1}\\), а пары \\(L_i\\) как \\(q_0,\\ldots,q_{m/2-1}\\). Для каждого сдвига \\(s\\in\\{0,\\ldots,m/2-1\\}\\) образуем цветовой класс \\(C(i,s)\\): в него входят все тройки, содержащиеся в одном из четырёхэлементных множеств \\(p_t\\cup q_{t+s}\\), где индексы берутся по модулю \\(m/2\\), и пересекающие обе части. Внутри одного такого четырёхэлементного множества любые две разные тройки имеют два общих элемента, а тройки из разных четырёхэлементных множеств не пересекаются, потому что эти множества образуют разбиение \\(A_1\\cup A_2\\). Значит, внутри \\(C(i,s)\\) нет рёбер.\n\nЭти классы покрывают все смешанные тройки. Действительно, если тройка содержит пару из \\(A_1\\) и один элемент из \\(A_2\\), то её пара из \\(A_1\\) лежит в единственном \\(N_i\\), а элемент из \\(A_2\\) лежит в единственной паре \\(q_u\\) из \\(L_i\\); подходящий сдвиг сопоставляет эту пару \\(q_u\\) с парой из \\(N_i\\). Случай, когда тройка содержит один элемент из \\(A_1\\) и пару из \\(A_2\\), разбирается так же, выбирая \\(i\\) по паре из \\(A_2\\). Поэтому для смешанных троек хватает \\((m-1)m/2\\) новых цветов. Общее число цветов равно \\((m-1)(m-2)/6+m(m-1)/2=(2m-1)(2m-2)/6\\). Индукция завершена.\n\nВторая конструкция даёт прямую раскраску. Отождествим элементы исходного множества с векторами пространства \\(\\mathbb F_2^k\\). Тройке \\(\\{a,b,c\\}\\) поставим в соответствие цвет \\(\\{a+b,a+c,b+c\\}\\). Здесь сложение выполняется покоординатно по модулю 2. Эти три вектора различны: например, из \\(a+b=a+c\\) следовало бы \\(b=c\\); ни один из них не равен нулю, поскольку \\(a,b,c\\) различны; кроме того, их сумма равна нулю. Значит, каждый цвет является тройкой различных ненулевых векторов с нулевой суммой.\n\nПроверим правильность раскраски. Предположим, две тройки имеют общий элемент и получили один и тот же цвет. Перенесём обе тройки на этот общий элемент, то есть прибавим ко всем их элементам один и тот же вектор; цвет от такого переноса не меняется, потому что \\((x+t)+(y+t)=x+y\\) в характеристике 2. Поэтому можно считать, что первая тройка равна \\(\\{0,u,v\\}\\). Её цвет равен \\(\\{u,v,u+v\\}\\). Вторая тройка с тем же цветом и с общим элементом 0 должна иметь вид \\(\\{0,r,s\\}\\), где \\(\\{r,s,r+s\\}=\\{u,v,u+v\\}\\). Тогда пара \\(\\{r,s\\}\\) является одной из \\(\\{u,v\\}\\), \\(\\{u,u+v\\}\\), \\(\\{v,u+v\\}\\). Соответственно вторая тройка совпадает с \\(\\{0,u,v\\}\\) или пересекает её в двух элементах. Следовательно, две разные тройки одного цвета не могут пересекаться ровно в одном элементе, то есть рёбер внутри цвета нет.\n\nОстаётся посчитать число цветов. Любой цвет - это неупорядоченная тройка \\(\\{x,y,z\\}\\) различных ненулевых векторов из \\(\\mathbb F_2^k\\), для которой \\(x+y+z=0\\). И наоборот, всякая такая тройка получается: если \\(x+y+z=0\\), то \\(x=y+z\\), и тройка \\(\\{0,y,z\\}\\) имеет цвет \\(\\{x,y,z\\}\\). Чтобы посчитать эти цвета, выберем упорядоченную пару различных ненулевых векторов \\((x,y)\\); тогда третий вектор \\(z=x+y\\) автоматически ненулевой и отличается от \\(x,y\\). Каждая неупорядоченная тройка считается шестью упорядоченными парами, поэтому цветов ровно \\((2^k-1)(2^k-2)/6\\). Это совпадает с нижней оценкой, значит найденное число цветов минимально.",
