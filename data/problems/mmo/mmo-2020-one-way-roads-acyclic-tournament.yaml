  "solutions": [
    {
      "id": "sol-official-induction",
      "title": "Индукция по степеням двойки",
      "text": "Переведем условие на язык турниров. Города считаем вершинами, а дорога между двумя городами задает направление ребра. Требование «покинув любой город, в него нельзя будет вернуться» означает отсутствие ориентированных циклов: если можно выйти из города и вернуться в него по направленным дорогам, то в получившемся замкнутом маршруте есть ориентированный цикл; обратно, ориентированный цикл сразу дает возвращение в начальный город. Поэтому достаточно получить ациклический турнир. Докажем более сильное утверждение: для любого \\(n\\ge 1\\) любой турнир на \\(2^n\\) вершинах можно сделать ациклическим не более чем за \\[F(n)=2^{n-2}(2^n-n-1)\\] разворотов ребер. При \\(n=1\\) вершин две, ориентированного цикла быть не может, и \\(F(1)=0\\). Лемма. Пусть в турнире \\(2k\\) вершин. Выберем \\(k\\) вершин с наибольшими исходящими степенями и назовем это множество \\(A\\). Тогда суммарная исходящая степень вершин из \\(A\\) не меньше \\(k^2\\). Доказательство леммы. Предположим, что сумма исходящих степеней вершин из \\(A\\) меньше \\(k^2\\). Тогда среди выбранных вершин есть вершина исходящей степени не больше \\(k-1\\); иначе все \\(k\\) выбранных вершин имели бы исходящую степень хотя бы \\(k\\), и сумма была бы не меньше \\(k^2\\). Так как в \\(A\\) выбраны вершины с наибольшими исходящими степенями, каждая из оставшихся \\(k\\) вершин тоже имеет исходящую степень не больше \\(k-1\\). Значит, сумма всех исходящих степеней в турнире меньше \\(k^2+k(k-1)=2k^2-k\\). Но сумма исходящих степеней равна числу ребер турнира, то есть \\(\\binom{2k}{2}=k(2k-1)=2k^2-k\\). Противоречие доказывает лемму. Теперь докажем индукционный переход от \\(2^n\\) к \\(2^{n+1}\\) вершинам. В турнире на \\(2^{n+1}\\) вершинах применим лемму при \\(k=2^n\\): пусть \\(A\\) — половина вершин с наибольшими исходящими степенями, а \\(B\\) — остальные вершины. Из вершин \\(A\\) суммарно выходит не меньше \\(2^{2n}\\) ребер. Внутри \\(A\\) ровно \\(\\binom{2^n}{2}=2^{n-1}(2^n-1)\\) ребер, поэтому из \\(A\\) в \\(B\\) идет не меньше \\(2^{2n}-2^{n-1}(2^n-1)=2^{n-1}(2^n+1)\\) ребер. Между \\(A\\) и \\(B\\) всего \\(2^n\\cdot 2^n=2^{2n}\\) ребер, значит, в обратную сторону, из \\(B\\) в \\(A\\), направлено не больше \\(2^{2n}-2^{n-1}(2^n+1)=2^{n-1}(2^n-1)\\) ребер. Развернем все эти ребра; после этого каждое ребро между частями направлено из \\(A\\) в \\(B\\). По предположению индукции внутри \\(A\\) можно сделать турнир ациклическим не более чем за \\(F(n)\\) разворотов, и то же самое внутри \\(B\\). Эти развороты не меняют ребра между частями. Когда обе части стали ациклическими, возьмем порядок вершин: сначала ациклический порядок в \\(A\\), затем ациклический порядок в \\(B\\). Внутри частей все ребра идут вперед по выбранным порядкам, а между частями все ребра идут из \\(A\\) в \\(B\\), тоже вперед. Значит, весь турнир ациклический. Число разворотов при переходе не превосходит \\[2F(n)+2^{n-1}(2^n-1)=2^{n-1}(2^n-n-1)+2^{n-1}(2^n-1)=2^{n-1}(2^{n+1}-n-2)=F(n+1).\\] Индукция завершена. В исходной задаче \\(32=2^5\\), поэтому достаточно не более чем \\(F(5)=2^3(32-5-1)=208\\) разворотов. С 1 июня по 31 декабря 2021 года включительно есть 214 дней, так что \\(208\\le 214\\), и министр успеет добиться требуемого к 2022 году.",
