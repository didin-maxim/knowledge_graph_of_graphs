  "solutions": [
    {
      "id": "sol-official-induction-degree",
      "title": "Официальная индукция с разбором большой и малой степени",
      "text": "Переведем условие на язык графов. Участники будут вершинами простого графа \\(G\\), а знакомые пары - ребрами. Тогда кружок из условия - это максимальная по включению клика размера хотя бы \\(2\\): ее вершины попарно соединены, а условие про любого другого участника ровно означает, что к этой клике нельзя добавить еще одну вершину. Рассадка по аудиториям - это раскраска вершин; нужно, чтобы ни одна максимальная клика размера хотя бы \\(2\\) не оказалась одноцветной.\n\nДокажем более сильное утверждение: для любого натурального \\(k\\) любой граф не более чем на \\(k^2\\) вершинах можно раскрасить не более чем в \\(2k\\) цветов так, чтобы ни одна максимальная клика размера хотя бы \\(2\\) не была одноцветной. Тогда исходная задача получается при \\(k=45\\), потому что \\(2018\\le 2025=45^2\\), а цветов будет \\(90\\).\n\nДокажем утверждение индукцией по \\(k\\). При \\(k=1\\) и \\(k=2\\) имеем \\(k^2\\le 2k\\), поэтому можно дать каждой вершине свой цвет; тогда клика из двух и более вершин не может быть одноцветной.\n\nПусть теперь \\(k\\ge 3\\), и утверждение уже доказано для \\(k-1\\). Рассмотрим граф \\(G\\) с \\(n\\le k^2\\) вершинами. Выберем вершину \\(v\\) максимальной степени и обозначим ее степень через \\(d\\). Разберем два случая.\n\nСначала пусть \\(d\\ge 2k-2\\). Посадим, то есть покрасим, вершину \\(v\\) в первый цвет, всех ее соседей - во второй цвет, а оставшиеся вершины образуют множество \\(U\\). Их не больше\n\\[\n n-1-d\\le k^2-1-(2k-2)=(k-1)^2.\n\\]\nПо индукционному предположению граф, индуцированный на \\(U\\), можно раскрасить еще в \\(2(k-1)\\) цветов так, чтобы в нем не было одноцветных максимальных клик размера хотя бы \\(2\\). Всего использовано \\(1+1+2(k-1)=2k\\) цветов.\n\nПроверим, что при такой раскраске не появилась запрещенная одноцветная максимальная клика исходного графа. В первом цвете сидит только \\(v\\), а кружки имеют размер хотя бы \\(2\\). Во втором цвете находятся только соседи \\(v\\); если бы некоторая клика \\(C\\) целиком лежала среди этих соседей, то \\(C\\cup\\{v\\}\\) тоже была бы кликой, значит \\(C\\) не могла быть максимальной кликой исходного графа. Наконец, если максимальная клика исходного графа целиком лежит в \\(U\\), то она максимальна и в индуцированном графе на \\(U\\): иначе ее можно было бы увеличить вершиной из \\(U\\), а значит и в исходном графе. Поэтому индукционная раскраска не делает ее одноцветной.\n\nОстается случай \\(d<2k-2\\). Тогда у каждой вершины степень не больше \\(d\\), так как \\(v\\) был выбран максимальной степени, и \\(d+1\\le 2k-1\\le 2k\\). Раскрасим граф жадно в \\(d+1\\) цветов: перебираем вершины в любом порядке и, когда красим очередную вершину, смотрим на цвета уже покрашенных ее соседей. Таких соседей не больше \\(d\\), а цветов \\(d+1\\), значит всегда есть цвет, не занятый ни одним уже покрашенным соседом. Получается правильная обычная раскраска графа, то есть концы каждого ребра имеют разные цвета. Следовательно, внутри одного цвета вообще нет ребер, а значит там не может целиком лежать клика размера хотя бы \\(2\\).\n\nВ обоих случаях построена раскраска в не более чем \\(2k\\) цветов без одноцветных максимальных клик размера хотя бы \\(2\\). Индукция завершена, и при \\(k=45\\) это дает требуемую рассадку по \\(90\\) аудиториям.",
