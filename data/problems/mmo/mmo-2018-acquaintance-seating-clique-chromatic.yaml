  "solutions": [
    {
      "id": "sol-official-induction-degree",
      "title": "Официальная индукция с разбором большой и малой степени",
      "text": "Официальное решение доказывает более сильное индукционное утверждение: не более k^2 участников можно рассадить по 2k аудиториям так, чтобы ни один кружок не оказался целиком в одной аудитории. При k=45 это покрывает 2018 участников, поскольку 2018 <= 45^2. Выберем участника v максимальной степени знакомства d. Если d >= 2k-2, посадим v отдельно, всех знакомых v - в другую аудиторию, а оставшихся не более (k-1)^2 участников рассадим по индукции в 2(k-1) аудиториях. Знакомые v не могут содержать кружок, так как v знаком со всеми ними. Если d < 2(k-1), то d+1 <= 2k аудиторий хватает жадно: перебираем участников по одному и сажаем каждого в аудиторию, где нет его знакомых. Комментарий источника явно указывает, что это задача о кликовом хроматическом числе.",
