        "id": "stmt-original",
        "title": "Участники олимпиады и кружки",
        "text": "На олимпиаде 2018 участников; некоторые пары участников знакомы. Множество попарно знакомых участников называется кружком, если каждый другой участник не знаком хотя бы с одним членом этого множества. Докажите, что всех участников можно рассадить по 90 аудиториям так, чтобы ни в одной аудитории не оказались все члены какого-либо кружка.",
