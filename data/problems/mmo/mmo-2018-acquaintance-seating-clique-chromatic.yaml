    {
      "id": "idea-rooms-as-clique-coloring",
      "title": "Аудитории как цвета",
      "text": "Официальный комментарий говорит, что задача относится к кликовому хроматическому числу графа: участники являются вершинами, пары знакомых - ребрами, а кружок - максимальной кликой. Рассадка по аудиториям становится раскраской вершин, при которой каждая существенная максимальная клика не является одноцветной.",
