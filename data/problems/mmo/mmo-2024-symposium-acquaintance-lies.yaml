  "solutions": [
    {
      "id": "sol-official-count-yes",
      "title": "Подсчет положительных ответов по типам участников",
      "text": "Ответ: 99. Назовем участников двух типов: правдолюбы всегда отвечают правду, лжецы всегда отвечают неправду. Пусть лжецов n, тогда правдолюбов 100 - n. По условию оба типа непусты, поэтому 1 <= n <= 99. Рассмотрим одну неупорядоченную пару, состоящую из лжеца L и правдолюба P. Если L и P знакомы, то P на вопрос про L отвечает \"да\", а L на вопрос про P лжет и отвечает \"нет\"; значит от этой пары получается ровно один ответ \"да\". Если L и P незнакомы, то P отвечает \"нет\", а L лжет и отвечает \"да\"; снова получается ровно один ответ \"да\". Итак, каждая смешанная пара лжец-правдолюб дает ровно один положительный ответ независимо от графа знакомств. Таких смешанных пар ровно n(100 - n). Пары одного типа не могут уменьшить это число: от двух правдолюбов получается либо два ответа \"да\" при знакомстве, либо ноль при незнакомстве; от двух лжецов получается либо ноль ответов \"да\" при знакомстве, либо два при незнакомстве. Следовательно, общее число ответов \"да\" всегда не меньше n(100 - n). При 1 <= n <= 99 выражение n(100 - n) минимально на концах: при n = 1 и n = 99 оно равно 99, а при 2 <= n <= 98 оно не меньше 2 * 98 = 196. Значит в любой допустимой ситуации есть хотя бы 99 ответов \"да\". Осталось показать, что 99 достижимо. Возьмем 99 лжецов и 1 правдолюба и сделаем всех участников попарно знакомыми. Тогда единственный правдолюб отвечает \"да\" на вопросы про всех 99 лжецов. Каждый лжец, поскольку он знаком со всеми остальными, на любой вопрос должен солгать и отвечает \"нет\". Значит всего получено ровно 99 ответов \"да\". Это совпадает с нижней оценкой, поэтому минимум равен 99. Симметричный пример также получается заменой графа знакомств на дополнительный граф и одновременной сменой типов участников: можно взять 1 лжеца, 99 правдолюбов и пустой граф знакомств; тогда ровно 99 ответов \"да\" дает единственный лжец. Эта проверка показывает, что дополнение графа и обмен ролей не меняют подсчитанное число положительных ответов.",
