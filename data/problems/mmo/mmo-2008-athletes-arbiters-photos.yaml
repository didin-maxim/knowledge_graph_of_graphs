      "id": "sol-official-summary",
      "title": "Официальное решение, кратко",
      "text": "Ответ: двое. Решение вводит 'подозрительных' людей и сравнивает число людей, с которыми они сфотографированы. Любой подозрительный имеет ровно 20 таких людей. Выбрав подозрительного X и допустив, что он спортсмен, получаем человека Y, присутствующего на всех фотографиях с X; пара X,Y и есть единственная возможная неоднозначность. Второе решение сравнивает две допустимые интерпретации разбиения людей на игроков и арбитров и показывает, что они могут отличаться только двумя людьми.",
