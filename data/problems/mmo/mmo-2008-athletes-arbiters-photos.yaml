  "solutions": [
    {
      "id": "sol-official-summary",
      "title": "Официальное решение через подозрительных людей",
      "text": "Ответ: 2.\n\nБудем говорить, что человек сфотографирован с другим человеком, если они вместе есть хотя бы на одной фотографии. Назовем человека подозрительным, если по стопке фотографий нельзя однозначно определить, спортсмен он или арбитр.\n\nСначала докажем верхнюю оценку. В любой допустимой расшифровке стопки арбитр фотографируется только со спортсменами, поэтому он может быть сфотографирован не более чем с 20 людьми. Спортсмен же фотографируется со всеми остальными 19 спортсменами: с каждым из них у него была игра и после нее была общая фотография. Кроме того, хотя бы один арбитр судил его игры, значит спортсмен сфотографирован не менее чем с 20 людьми.\n\nЕсли человек подозрителен, то существуют допустимые расшифровки, в одной из которых он спортсмен, а в другой арбитр. Поэтому число людей, с которыми он сфотографирован, одновременно не меньше 20 и не больше 20, то есть равно 20.\n\nРассмотрим теперь спортсмена P, который сфотографирован ровно с 20 людьми. Он уже сфотографирован со всеми 19 другими спортсменами. Все арбитры, судившие его 19 игр, тоже входят в число людей, с которыми он сфотографирован. Если таких арбитров было бы хотя бы двое, получилось бы не меньше 21 разных людей. Значит все 19 игр спортсмена P судил один и тот же арбитр.\n\nВозьмем любого подозрительного человека X. Так как его можно считать спортсменом в некоторой допустимой расшифровке, предыдущий абзац показывает, что на всех 19 фотографиях матчей X присутствует один и тот же человек Y. Люди X и Y вместе встречаются на 19 фотографиях. Два спортсмена могли вместе попасть только на одну фотографию, после своего единственного матча, а два арбитра вместе вообще не фотографируются. Следовательно, из пары X, Y ровно один является спортсменом, а другой арбитром. Поэтому третий человек на каждой из этих 19 фотографий однозначно является спортсменом.\n\nТак по стопке определяются 19 спортсменов: это третьи люди на фотографиях, где вместе стоят X и Y. Двадцатый спортсмен должен быть кем-то из пары X, Y. Все остальные 9 людей, не входящие в эти 19 и не равные X или Y, тогда однозначно арбитры. Значит неопределенность может остаться только внутри пары X, Y. Если бы статус одного из них тоже определялся, то статус другого определялся бы автоматически, потому что в паре ровно один спортсмен и ровно один арбитр. Но X был выбран подозрительным, поэтому именно X и Y являются двумя подозрительными людьми, и больше подозрительных быть не может.\n\nОсталось показать, что два подозрительных человека действительно возможны. Обозначим спортсменов A_1, A_2, ..., A_20, а арбитров R_1, R_2, ..., R_10. Пусть R_1 судит все 19 матчей спортсмена A_1 и не судит других матчей. Все матчи между A_2, ..., A_20 распределим между арбитрами R_2, ..., R_10 так, чтобы каждый из них получил хотя бы один матч; это возможно, потому что таких матчей 171. После каждого матча, как обычно, делаем фотографию двух игроков и арбитра.\n\nВ получившейся стопке можно поменять ролями A_1 и R_1: считать R_1 спортсменом, A_1 арбитром, а всех остальных людей оставить в прежних ролях. Фотографии матчей нового спортсмена R_1 с A_2, ..., A_20 - это ровно прежние фотографии с A_1, R_1 и соответствующим A_i, и на них новым арбитром является A_1. Матчи между A_2, ..., A_20 по-прежнему судят арбитры R_2, ..., R_10. Значит обе расшифровки допустимы, и по фотографиям нельзя отличить A_1 от R_1. По доказанной верхней оценке других подозрительных людей при этом нет. Следовательно, могло быть ровно 2 таких человека.",
