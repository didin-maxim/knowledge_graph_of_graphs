    {
      "id": "idea-swap-one-athlete-one-arbiter",
      "title": "Поменять местами спортсмена и его единственного арбитра",
      "text": "Для достижимости двух неоднозначных людей достаточно устроить так, чтобы один арбитр судил все 19 матчей одного спортсмена и не судил других матчей. Тогда этого спортсмена и этого арбитра можно поменять ролями, а вся стопка фотографий останется совместимой с условиями.",
