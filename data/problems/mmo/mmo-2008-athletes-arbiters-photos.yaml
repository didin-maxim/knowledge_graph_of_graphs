      "id": "idea-degree-20-ambiguity",
      "title": "Подозрительные люди имеют степень 20",
      "text": "В официальном решении человек, чей статус не определяется, должен появляться на фотографиях ровно с 20 людьми: у арбитра не больше 20 соседей, у спортсмена не меньше 20. Если такой спортсмен имеет ровно 20 соседей, все его 19 матчей судил один и тот же арбитр, что оставляет только пару взаимозаменяемых статусов.",
