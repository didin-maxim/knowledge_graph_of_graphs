    "graph_theory": [
      {
        "id": "stmt-graph",
        "title": "Граф совместного появления на фотографиях",
        "text": "Рассмотрим граф совместного появления людей на фотографиях: вершины -- люди, а ребро означает, что два человека есть вместе хотя бы на одной фотографии; кратности фотографий пары также существенны в решении. Игрок смежен со всеми 19 другими игроками и хотя бы одним арбитром, а арбитр смежен только с игроками. Нужно найти максимум вершин, чей класс в разбиении на игроков и арбитров не восстанавливается однозначно.",
