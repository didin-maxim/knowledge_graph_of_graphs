    }
  ],
  "solutions": [
    {
      "id": "sol-official-counting",
      "title": "Официальный подсчет после выбора максимального множества попарно общающихся людей",
      "text": "В официальном решении выбирается множество B из k людей, любые двое из которых могут поговорить без посредника. Для любого человека X вне B максимальность B дает человека X' из B, тройка языков которого не пересекается с тройкой X. Человек из B, который может говорить с X, должен иметь общий язык и с X, и с X', поэтому таких людей в B не больше 3*3*n. Значит, у X есть по крайней мере k-9n непересекающихся с ним троек внутри B. Суммируя по всем X вне B, получаем не меньше (m-k)(k-9n) >= (m/2)(2n)=mn пар людей, которые не могут поговорить без посредника. Комментарий источника затем явно переформулирует задачу как нижнюю оценку числа ребер в подграфе графа Кнезера при r=3.",
