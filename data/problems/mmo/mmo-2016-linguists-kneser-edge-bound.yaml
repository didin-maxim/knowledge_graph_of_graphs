        "title": "Подграф графа Кнезера на тройках",
        "text": "Пусть G - подграф графа Кнезера, вершинами которого являются 3-элементные подмножества множества {1,...,n}, а ребра соединяют непересекающиеся тройки. В графе G ровно m вершин, а его число независимости равно alpha(G)=k, где 11n <= k <= m/2. Докажите, что в G не меньше mn ребер.",
