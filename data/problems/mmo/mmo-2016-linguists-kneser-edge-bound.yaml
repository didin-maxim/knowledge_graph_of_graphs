        "id": "stmt-original",
        "title": "Страна лингвистов",
        "text": "В стране лингвистов есть n языков и m человек. Каждый человек знает ровно 3 языка, причем разные люди знают разные тройки языков. Наибольшее число людей, любые двое из которых могут поговорить без посредника, равно k. Известно, что 11n <= k <= m/2. Докажите, что найдется не менее mn пар людей, которые не могут поговорить без посредника.",
