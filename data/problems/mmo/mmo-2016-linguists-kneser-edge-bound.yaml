  "solutions": [
    {
      "id": "sol-official-counting",
      "title": "Официальный подсчет после выбора максимального множества попарно общающихся людей",
      "text": "Выберем множество \\(B\\) из \\(k\\) людей, любые двое из которых могут поговорить без посредника. Такое множество существует по определению \\(k\\), и оно максимально по включению: если бы к нему можно было добавить еще одного человека, то получилась бы компания из \\(k+1\\) попарно общающихся людей.\n\nРассмотрим произвольного человека \\(X\\), не вошедшего в \\(B\\), и обозначим через \\(A\\) тройку языков, которые знает \\(X\\). По максимальности \\(B\\) человек \\(X\\) не может поговорить хотя бы с одним человеком \\(X'\\in B\\); иначе \\(X\\) можно было бы добавить к \\(B\\). Пусть \\(C\\) - тройка языков человека \\(X'\\). Тогда \\(A\\cap C=\\varnothing\\).\n\nОценим сверху число людей \\(Y\\in B\\), которые могут поговорить с \\(X\\). Пусть \\(D\\) - тройка языков такого человека \\(Y\\). Так как \\(Y\\) говорит с \\(X\\), тройка \\(D\\) содержит некоторый язык \\(a\\in A\\). Кроме того, \\(Y\\) и \\(X'\\) оба лежат в \\(B\\), а любые два человека из \\(B\\) могут поговорить, значит \\(D\\) содержит некоторый язык \\(c\\in C\\). Итак, тройка \\(D\\) содержит одну из \\(3\\cdot 3\\) пар \\((a,c)\\), где \\(a\\in A\\), \\(c\\in C\\). Для фиксированной такой пары возможных троек \\(D\\) не больше \\(n\\): третий язык можно выбрать не более чем \\(n\\) способами, а разные люди по условию знают разные тройки языков. Следовательно, людей из \\(B\\), которые могут поговорить с \\(X\\), не больше \\(9n\\).\n\nВ множестве \\(B\\) всего \\(k\\) человек, поэтому с выбранным \\(X\\) не могут поговорить по крайней мере \\(k-9n\\) человек из \\(B\\). Это верно для каждого из \\(m-k\\) людей вне \\(B\\). Каждая посчитанная пара имеет один конец вне \\(B\\), а другой в \\(B\\), поэтому при суммировании по всем \\(X\\notin B\\) ни одна пара не считается дважды. Значит, число пар людей, которые не могут поговорить без посредника, не меньше\n\\[\n(m-k)(k-9n).\n\\]\nИз условий \\(k\\le m/2\\) и \\(k\\ge 11n\\) получаем \\(m-k\\ge m/2\\) и \\(k-9n\\ge 2n\\). Поэтому\n\\[\n(m-k)(k-9n)\\ge \\frac m2\\cdot 2n=mn.\n\\]\nТем самым найдется по крайней мере \\(mn\\) пар людей, которые не могут поговорить без посредника.\n\nТа же аргументация в графовой формулировке выглядит так: вершины - выбранные тройки языков, ребро соединяет непересекающиеся тройки, а множество \\(B\\) является независимым множеством размера \\(k\\). Для каждой вершины вне \\(B\\) найдено не меньше \\(k-9n\\) ребер в \\(B\\), поэтому в соответствующем подграфе кнезеровского графа не меньше \\(mn\\) ребер.",
