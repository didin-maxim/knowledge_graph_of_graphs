  "ideas": [
    {
      "id": "idea-kneser-language-triples",
      "title": "Люди как вершины графа Кнезера",
      "text": "Официальный комментарий отождествляет каждого лингвиста с тройкой языков, которые он знает. Два человека, которые не могут поговорить без посредника, соответствуют непересекающимся тройкам, то есть ребру графа Кнезера K(n,3). Наибольшее множество попарно общающихся людей становится независимым множеством в этом графе.",
      "tags": [
        "graph_model",
