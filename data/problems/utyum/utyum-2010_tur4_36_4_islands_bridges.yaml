        "title": "Оригинальная формулировка",
        "text": "По кругу расположены n (n > 2) островов, на одном из них стоит замок. Между любыми двумя соседними\nостровами построены два моста.\n\nНайдите количество маршрутов, начинающихся и заканчивающихся на острове с замком и проходящих по\nкаждому мосту ровно один раз.",
