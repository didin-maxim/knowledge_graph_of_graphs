  "solutions": [
    {
      "id": "sol-official",
      "title": "Решение",
      "text": "Доказательство разбивает все искомые эйлеровы обходы на два типа.\n\nПервый тип: маршрут дважды обходит весь круг в одном и том же направлении. Для каждого из двух\nнаправлений при первом переходе между соседними островами можно независимо выбрать один из двух мостов,\nпоэтому таких маршрутов получается по 2^n в каждом направлении, всего 2^(n+1).\n\nВторой тип: маршрут в некоторой вершине разворачивается, затем делает полный круг с другой стороны,\nснова разворачивается и возвращается в замок. Для каждого фиксированного острова разворота и каждого\nнаправления снова остается по 2^n выборов мостов, то есть получается n * 2^(n+1) маршрутов.\n\nСкладывая оба случая, получаем общее число маршрутов:\n\n2^(n+1) + n * 2^(n+1) = 2^(n+1)(n + 1).",
