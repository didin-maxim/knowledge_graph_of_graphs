  "solutions": [
    {
      "id": "sol-official",
      "title": "Решение",
      "text": "Ответ: \\(\\binom n2-\\left\\lceil\\frac{n-1}{2}\\right\\rceil\\).\n\nРассмотрим дополнительный граф. Вершина исходного графа соединена со всеми остальными тогда и только тогда, когда она изолирована в дополнении. По условию в исходном графе не может быть двух смежных универсальных вершин; при \\(n\\ge2\\) это значит, что в дополнении изолированной может быть не более одна вершина.\n\nЗначит, в дополнительном графе как минимум \\(n-1\\) вершин должны иметь положительную степень. Чтобы покрыть рёбрами \\(n-1\\) вершин, нужно не меньше \\(\\left\\lceil\\frac{n-1}{2}\\right\\rceil\\) рёбер. Следовательно, в исходном графе не больше \\(\\binom n2-\\left\\lceil\\frac{n-1}{2}\\right\\rceil\\) рёбер.\n\nОценка достигается: в дополнении возьмём паросочетание, покрывающее \\(n\\) вершин при чётном \\(n\\) и \\(n-1\\) вершин при нечётном \\(n\\). В исходном графе удалены ровно рёбра этого паросочетания. Тогда универсальных вершин нет при чётном \\(n\\), а при нечётном \\(n\\) есть ровно одна универсальная вершина, так что запрещённой пары не возникает.",
