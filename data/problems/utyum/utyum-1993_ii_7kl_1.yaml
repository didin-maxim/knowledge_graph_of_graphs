        "title": "Оригинальная формулировка",
        "text": "Шеф секретной службы составил следующую инструкцию взаимодействия слежки для своих семи главных агентов:\n001 следит за тем, кто следит за 002, 002 — за тем, кто следит за 003, ..., 007 следит за тем, кто следит за 001.\nНо вдруг пришёл приказ взять на службу ещё агента 008. Сможет ли шеф составить аналогичную инструкцию и для восьми агентов?",
