      "id": "sol-official",
      "title": "Официальное решение",
      "text": "Рассмотрим соответствующий ориентированный граф. Так как каждый следит ровно за одним, граф распадается на циклы.\nПо условию граф связный, значит цикл один, то есть получаем восьмиугольник, в вершинах которого должны стоять числа 1, ..., 8 через одну.\nЭто невозможно, следовательно, для восьми агентов аналогичную инструкцию составить нельзя.",
