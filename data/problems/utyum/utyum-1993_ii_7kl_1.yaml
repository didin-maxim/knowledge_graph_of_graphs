  "solutions": [
    {
      "id": "sol-official",
      "title": "Решение",
      "text": "Пусть \\(p(i)\\) — номер агента, за которым следит агент \\(i\\). Фраза «\\(i\\) следит за тем, кто следит за \\(i+1\\)» означает, что \\(p(i)\\) — единственный агент, для которого \\(p(p(i))=i+1\\). Значит, \\(p\\) является перестановкой агентов и для всех номеров выполнено \\(p^2(i)=i+1\\) по циклу.\n\nДля семи агентов это возможно: можно взять \\(p(i)=i+4\\) по модулю 7, тогда \\(p^2(i)=i+8=i+1\\).\n\nПредположим, что аналогичная инструкция существует для восьми агентов. Тогда перестановка \\(p^2\\) должна быть циклом \\((1,2,3,4,5,6,7,8)\\). Но квадрат любого цикла чётной длины распадается на два цикла: если \\(p\\) имеет цикл чётной длины, его квадрат отдельно переставляет вершины через одну, а если цикл нечётной длины, его квадрат остаётся циклом той же нечётной длины. Следовательно, квадрат перестановки не может быть одним циклом чётной длины 8. Противоречие. Значит, для восьми агентов такую инструкцию составить нельзя.",
