        "title": "Оригинальная формулировка",
        "text": "Архипелаг состоит из 1000 островов, некоторые пары которых соединены мостами, причём от любого острова\nможно добраться по мостам до любого другого.\n\nИзвестно, что для любых четырёх островов A, B, C, D таких, что есть мосты AB, BC, CD,\nтакже существует мост AC или мост BD.\n\nДокажите, что найдётся остров, соединённый мостами со всеми остальными.",
