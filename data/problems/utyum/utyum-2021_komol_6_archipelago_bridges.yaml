  "solutions": [
    {
      "id": "sol-official",
      "title": "Официальное решение",
      "text": "В официальном решении рассматривается граф, вершинами которого являются острова, а рёбрами — мосты.\n\nВыбирается вершина B наибольшей степени. Предположим, что она соединена не со всеми вершинами графа.\nТак как граф связен, существует путь B-C-D, где B соединена с C, C соединена с D, но B не соединена с D.\n\nТеперь для любой вершины A, соединённой с B, можно применить условие задачи к пути A-B-C-D.\nПоскольку ребра BD нет, условие вынуждает существование ребра AC. Значит, C соединена со всеми соседями B,\nа кроме того ещё и с D. Это делает степень C строго больше степени B, что противоречит выбору B.\n\nСледовательно, вершина наибольшей степени обязана быть соединена со всеми остальными вершинами.",
