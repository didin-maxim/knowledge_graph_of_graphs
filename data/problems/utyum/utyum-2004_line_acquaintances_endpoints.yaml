      "id": "sol-official",
      "title": "Официальное решение",
      "text": "Пусть каждый школьник даст по рублю каждому своему знакомому, стоящему слева от него.\n\nТогда крайний слева школьник получит столько рублей, сколько у него знакомых, потому что все его знакомые стоят справа. Крайний справа, наоборот, отдаст столько рублей, сколько у него знакомых, потому что все его знакомые стоят слева.\n\nРассмотрим любого внутреннего школьника. По условию у него поровну знакомых слева и справа, значит, он отдаст столько же рублей, сколько получит. Следовательно, суммарный баланс всех внутренних школьников равен нулю.\n\nНо сумма всех денежных потоков по всей шеренге тоже равна нулю. Значит, выигрыш крайнего слева равен по модулю проигрышу крайнего справа. Иными словами, число знакомых у двух крайних школьников одинаково.",
