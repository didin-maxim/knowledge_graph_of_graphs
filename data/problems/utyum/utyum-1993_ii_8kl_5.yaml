      "id": "sol-official",
      "title": "Решение",
      "text": "Ответ: \\(N-1\\).\n\nСначала докажем нижнюю оценку. Условие означает, что между любыми двумя городами можно добраться по пути длины не больше двух: если города соединены дорогой, путь уже есть, а если не соединены, то есть третий город, соединённый с ними обоими. Значит, граф дорог связен. В связном графе на \\(N\\) вершинах рёбер не меньше \\(N-1\\): например, если идти из одной вершины и каждый раз добавлять новую достижимую вершину, для появления каждой из остальных \\(N-1\\) вершин нужно хотя бы одно ребро, ведущее к уже построенной части.\n\nОстаётся показать, что эта оценка достижима. Возьмём один центральный город и соединим его дорогами со всеми остальными городами, а других дорог не будем проводить. Получится звезда: в ней ровно \\(N-1\\) дорог. Любые два не соединённых напрямую города являются двумя нецентральными городами, и центральный город соединён с ними обоими. Поэтому условие выполнено.\n\nСледовательно, минимальное возможное число дорог равно \\(N-1\\).",
