        "title": "Оригинальная формулировка",
        "text": "В некоторой стране N > 1 городов. Между некоторыми из них проложены дороги.\nИзвестно, что если два города не соединены между собой, то найдётся город, который соединён дорогой с ними обоими.\nКакое минимальное количество дорог может быть в этой стране?",
