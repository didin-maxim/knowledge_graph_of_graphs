  "solutions": [
    {
      "id": "sol-official",
      "title": "Официальное решение",
      "text": "Ответ: 3997000.\n\nВ официальном решении сначала строится пример: выбирают 1000 попарно непересекающихся рёбер, на них ставят 1,\nа на остальных рёбрах ставят 2. Тогда сумма равна 3997000, и условие на треугольники выполняется.\n\nДля оценки снизу вершина называется плохой, если из неё выходит более одного ребра веса 1. Если плохих вершин нет,\nто единичных рёбер не больше 1000, и искомая нижняя оценка сразу получается.\n\nЕсли плохая вершина A есть, берут ребро AB веса 1. Для любого треугольника ABC, где ещё одно ребро тоже имеет вес 1,\nтретье ребро обязано иметь вес 3, иначе сумма в треугольнике была бы меньше 5. Тогда пару рёбер весов 1 и 3 можно\nзаменить двумя рёбрами веса 2 без изменения общей суммы и без нарушения условия на треугольники, причём число плохих\nвершин уменьшается. Повторяя процесс, уничтожают все плохие вершины и приходят к предыдущему случаю.",
