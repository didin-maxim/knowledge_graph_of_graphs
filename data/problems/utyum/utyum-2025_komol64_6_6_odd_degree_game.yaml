        "title": "Оригинальная формулировка",
        "text": "Петя отмечает 99 точек на окружности и соединяет некоторые пары точек отрезками так, чтобы из каждой точки выходил хотя бы один отрезок.\n\nПосле этого Вася может стереть несколько проведённых отрезков.\n\nЗатем Петя платит Васе по одному рублю за каждую точку, из которой выходит нечётное число оставшихся отрезков.\n\nКакую наибольшую сумму Вася может гарантированно заработать независимо от действий Пети?",
