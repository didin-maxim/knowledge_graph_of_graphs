      "id": "sol-official",
      "title": "Решение",
      "text": "Доказательство рассматривает граф на 99 вершинах.\n\nВерхняя оценка: Петя может разбить вершины на 33 тройки и в каждой сделать маленькую звезду из двух рёбер. Тогда в каждой тройке при любом удалении останется хотя бы одна вершина чётной степени, так что нечётных степеней будет не более 66.\n\nНижняя оценка: Вася удаляет рёбра, которые не являются единственными ни у одного из своих концов. Когда таких рёбер не останется, каждой вершине степени больше 1 можно сопоставить хотя бы две листовые вершины. Значит, вершин степени больше 1 не более трети, а вершин степени 1 — не менее 66.\n\nСледовательно, Вася всегда может гарантировать 66 рублей.",
