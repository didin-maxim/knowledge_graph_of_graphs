  "solutions": [
    {
      "id": "sol-official",
      "title": "Решение",
      "text": "Ответ: \\(2q\\).\n\nВерхняя оценка: можно разбить вершины на \\(q\\) троек и в каждой сделать маленькую звезду из двух рёбер. В любой остовный подграф каждой такой тройки вносит не более две вершины нечётной степени, потому что число вершин нечётной степени в любом графе чётно. Поэтому больше \\(2q\\) нечётных вершин гарантировать нельзя.\n\nНижняя оценка: будем удалять рёбра, которые не являются единственными ни у одного из своих концов. Когда таких рёбер не останется, получим остовный подграф без изолированных вершин. Каждой вершине степени больше 1 можно сопоставить хотя бы две соседние листовые вершины: каждое инцидентное ей ребро должно быть единственным у другого конца. Значит, вершин степени больше 1 не более \\(q\\), а листьев, то есть вершин степени 1, не менее \\(2q\\). Все эти листья имеют нечётную степень.\n\nСледовательно, всегда можно гарантировать \\(2q\\) вершин нечётной степени, и эта оценка точна.",
