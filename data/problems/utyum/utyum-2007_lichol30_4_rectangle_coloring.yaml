        "text": "Рассмотрим граф смежности клеток прямоугольной решётки: вершины соответствуют клеткам, а ребро соединяет две клетки с общей стороной. Вершины раскрашены в два цвета, причём вершин каждого цвета поровну; среди граничных вершин и среди угловых вершин каждого цвета тоже поровну. Докажите, что число рёбер, соединяющих две белые вершины, равно числу рёбер, соединяющих две голубые вершины.",
