  "solutions": [
    {
      "id": "sol-official",
      "title": "Решение",
      "text": "Покрасим стороны внешней границы прямоугольника. Назовём окрашенными только те стороны клеток, которые лежат на внешней границе; все общие стороны двух соседних клеток остаются неокрашенными.\n\nУ угловой клетки две окрашенные стороны, у граничной неугловой клетки одна, у внутренней клетки ни одной. По условию среди всех граничных клеток белых и голубых поровну, и среди угловых клеток белых и голубых поровну. Значит, после вычитания угловых клеток среди граничных неугловых клеток белых и голубых тоже поровну. Поэтому суммарное число окрашенных сторон, инцидентных белым клеткам, равно суммарному числу окрашенных сторон, инцидентных голубым клеткам.\n\nКаждая клетка имеет четыре стороны. Так как белых и голубых клеток поровну, общее число сторон, посчитанных с инцидентностью к белым клеткам, равно такому же общему числу для голубых клеток. Вычитая из этих равных величин равные суммы окрашенных граничных сторон, получаем, что суммарное число неокрашенных сторон у белых клеток равно суммарному числу неокрашенных сторон у голубых клеток.\n\nОбозначим через \\(x\\) число неокрашенных сторон между двумя белыми клетками, через \\(y\\) число неокрашенных сторон между двумя голубыми клетками, а через \\(z\\) число неокрашенных сторон между клетками разных цветов. В сумме неокрашенных сторон у белых клеток сторона типа белая-белая считается дважды, сторона типа белая-голубая считается один раз, а сторона типа голубая-голубая не считается. Поэтому эта сумма равна \\(2x+z\\). Для голубых клеток та же сумма равна \\(2y+z\\). Эти две суммы равны, значит \\(2x+z=2y+z\\), откуда \\(x=y\\).\n\nСледовательно, сторон клеток, разделяющих два белых квадрата, столько же, сколько сторон клеток, разделяющих два голубых квадрата.",
