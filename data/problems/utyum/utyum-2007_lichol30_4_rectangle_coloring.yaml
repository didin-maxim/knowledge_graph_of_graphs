  "solutions": [
    {
      "id": "sol-official",
      "title": "Официальное решение",
      "text": "Покрасим стороны внешней границы прямоугольника. Тогда у угловых клеток окажется по две окрашенные стороны, а у остальных приграничных клеток по одной.\n\nПо условию и среди угловых, и среди прочих приграничных клеток белых и голубых поровну. Значит, суммарное число окрашенных сторон у белых клеток равно суммарному числу окрашенных сторон у голубых клеток. Так как белых и голубых клеток поровну, то и число неокрашенных сторон у белых клеток равно числу неокрашенных сторон у голубых.\n\nКаждая внутренняя сторона между двумя белыми клетками учитывается дважды среди неокрашенных сторон белых клеток, каждая сторона между белой и голубой клеткой учитывается один раз; сторона между двумя голубыми клетками не учитывается. Аналогично для голубых клеток.\n\nТак как общее число неокрашенных сторон у белых и голубых клеток одинаково, количество сторон между двумя белыми клетками равно количеству сторон между двумя голубыми клетками.",
