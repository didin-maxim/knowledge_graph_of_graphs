        "id": "stmt-original",
        "title": "Оригинальная формулировка",
        "text": "Клетки прямоугольника раскрашены в белый и голубой цвета, причём белых и голубых клеток поровну. Среди клеток, примыкающих к сторонам прямоугольника, белых и голубых поровну, среди угловых клеток прямоугольника тоже поровну. Докажите, что сторон клеток, разделяющих два белых квадрата, столько же, сколько сторон клеток, разделяющих два голубых квадрата.",
