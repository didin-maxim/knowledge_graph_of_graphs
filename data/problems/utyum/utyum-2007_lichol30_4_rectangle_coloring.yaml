      "id": "idea-boundary-adjusted-degree-count",
      "title": "Подсчёт степеней с учётом границы",
      "text": "Если добавить внешние стороны границы в подсчёт, то суммарное число инцидентных сторон по белым клеткам равно соответствующей сумме по синим клеткам. Так как два цветовых класса имеют одинаковый размер, вычитание общего вклада степеней клеток оставляет равное число внутренних одноцветных соседств.",
