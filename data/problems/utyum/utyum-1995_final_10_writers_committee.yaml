        "id": "stmt-graph-directed",
        "title": "Формулировка через ориентированный граф",
        "text": "Пусть \\(D\\) — ориентированный граф на 22 вершинах, в котором исходящая степень каждой вершины равна 3. Докажите, что \\(D\\) содержит независимое множество из 4 вершин, то есть множество из 4 вершин, между любыми двумя из которых нет ориентированного ребра ни в одну сторону.",
