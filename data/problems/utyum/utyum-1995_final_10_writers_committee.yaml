        "title": "Оригинальная формулировка",
        "text": "22 школьника участвовали в съезде юных писателей. После съезда каждый из них прочитал произведения трёх юных писателей, побывавших на съезде.\n\nДокажите, что из делегатов съезда можно составить комиссию из 4 человек так, что в комиссии никто не читал произведения остальных её членов.",
