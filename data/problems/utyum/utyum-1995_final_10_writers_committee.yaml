  "solutions": [
    {
      "id": "sol-official",
      "title": "Официальное решение",
      "text": "Рассмотрим ориентированный граф: вершины соответствуют школьникам, а стрелка из A в B означает, что A прочитал произведения B. Тогда из каждой вершины выходит ровно 3 ребра.\n\nВсего прочтений 22 * 3 = 66. Поэтому по принципу Дирихле найдётся школьник A, в которого входит не более 3 рёбер, то есть его произведения прочитали не более трёх других участников.\n\nВключим A в комиссию и удалим из рассмотрения:\n- тех, кого читал A;\n- тех, кто читал A.\n\nТаких участников не более 6, значит после удаления вместе с A остаётся не менее 15 человек.\n\nВ оставшемся подграфе снова средняя полустепень исхода равна 3, поэтому найдётся школьник B, которого среди оставшихся читали не более 3 человек. Добавим B в комиссию и снова удалим всех, кто связан с ним чтением в любую сторону. После этого останется не менее 8 человек.\n\nПовторяем тот же шаг и выбираем C. После удаления всех его соседей останется хотя бы один участник D.\n\nПо построению между любыми двумя выбранными вершинами A, B, C, D нет рёбер ни в одном направлении. Значит, никто из членов комиссии не читал произведения остальных её членов.",
