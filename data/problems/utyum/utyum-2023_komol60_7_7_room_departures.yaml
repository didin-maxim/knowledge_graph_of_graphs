  "solutions": [
    {
      "id": "sol-official",
      "title": "Решение",
      "text": "Ответ: 51 человек.\n\nРассмотрим граф знакомств: люди — вершины, знакомства — рёбра. Если из текущего графа удаляется вершина степени d, то степень любой другой вершины до следующего удаления не увеличивается. Кроме того, в момент удаления все остальные степени были не больше d - 2. Значит, степени последовательно выходящих людей убывают как минимум на 2.\n\nПервая удаляемая вершина имеет степень не больше 98. Поэтому степени выходящих людей не превосходят\n\n  98, 96, 94, ..., 4, 2.\n\nНо вершину степени 2 удалить уже невозможно. Действительно, чтобы она подходила по условию, степени всех остальных вершин должны быть не больше 0; однако у двух её соседей степень хотя бы 1. Вершины степени 1 или 0 тем более не могут быть больше всех остальных степеней хотя бы на 2. Следовательно, выйти могут не более 48 человек, и остаться должно не менее 99 - 48 = 51 человека.\n\nПокажем, что 51 человек действительно может остаться. Пронумеруем людей числами 1, 2, ..., 99. Для каждого k от 1 до 48 соединим человека k со всеми людьми с номерами от 2k + 1 до 99; других знакомств нет. Иными словами, два человека i < j знакомы тогда и только тогда, когда j >= 2i + 1.\n\nДокажем, что люди 1, 2, ..., 48 будут выходить именно в этом порядке. Пусть уже вышли люди 1, ..., k - 1, где 1 <= k <= 48. Среди присутствующих человек k не знаком ровно с k следующими людьми k + 1, ..., 2k, поэтому его степень равна\n\n  99 - 2k.\n\nВозьмём любого другого присутствующего человека j из первых 48, то есть k < j <= 48. Среди присутствующих он не знаком с человеком j - 1 и со всеми людьми j + 1, ..., 2j; это как минимум k + 2 незнакомых среди остальных присутствующих. Поэтому его степень не больше\n\n  (99 - k) - (k + 2) = 97 - 2k,\n\nто есть как минимум на 2 меньше степени человека k. Если же j >= 49, то его степень среди присутствующих тем более мала: он может быть знаком только с некоторыми людьми меньших номеров и, возможно, с немногими большими, и непосредственно из определения видно, что она не превосходит 49 - k < 97 - 2k.\n\nЗначит, на каждом из первых 48 шагов человек k имеет степень хотя бы на 2 больше степени любого другого присутствующего, и он может выйти. После ухода людей 1, ..., 48 остаются люди 49, ..., 99. Между ними нет рёбер, потому что для любых 49 <= i < j <= 99 не выполняется j >= 2i + 1. Все оставшиеся степени равны 0, так что подходящего человека больше нет.\n\nИтак, нижняя оценка 51 достигается, значит минимально возможное число оставшихся людей равно 51.",
