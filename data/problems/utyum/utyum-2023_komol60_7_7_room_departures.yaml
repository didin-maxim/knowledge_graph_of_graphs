        "title": "Оригинальная формулировка",
        "text": "В комнате находятся 99 человек, и знакомства взаимны.\n\nКаждую минуту из комнаты выходит человек, у которого число знакомых среди присутствующих хотя бы на 2 больше, чем у каждого из остальных.\n\nЧерез несколько минут такого человека не нашлось. Какое минимальное количество людей могло остаться к этому моменту?",
