      "id": "sol-official",
      "title": "Официальное решение",
      "text": "Официальное решение рассматривает граф знакомств на 99 вершинах.\n\nПри удалении вершины степени остальных вершин не увеличиваются, поэтому степени последовательно выходящих людей убывают как минимум на 2. Значит, возможные степени выходящих не превосходят 98, 96, 94, ..., 2.\n\nУдалить вершину степени 2 на последнем таком шаге невозможно: если ещё есть рёбра, то найдутся вершины степени не меньше 1, и требуемый разрыв по степеням уже не выполнится.\n\nОтсюда выходит, что удалить можно не более 48 человек, значит остаться должно не менее 51 человека.\n\nПример на 51 человека строится явным графом.",
