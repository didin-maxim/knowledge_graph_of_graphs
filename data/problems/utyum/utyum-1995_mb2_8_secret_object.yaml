        "text": "Секретный объект представляет собой 100-угольник, образованный сторонами коридоров. Каждый коридор может быть освещён или затемнён. В каждой вершине расположен выключатель, который меняет на противоположные состояния двух сходящихся в этой вершине коридоров.\n\nВначале весь объект затемнён. Сторож находится в одной из вершин и хочет, переключая свет и двигаясь только по освещённым коридорам, перейти в пятидесятую по счёту вершину и снова затемнить объект.\n\nУдастся ли ему это и почему?",
