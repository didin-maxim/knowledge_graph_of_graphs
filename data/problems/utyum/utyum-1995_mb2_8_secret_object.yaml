      "id": "sol-official",
      "title": "Официальное решение",
      "text": "Да, удастся.\n\nСторож сначала включает свет в двух соседних с ним коридорах. После этого он идёт по часовой стрелке до конца освещённого участка, снова переключает выключатель в текущей вершине и тем самым \"переносит\" освещённую пару коридоров дальше по циклу.\n\nПовторяя этот приём, он каждый раз сдвигает освещённый фрагмент на одну вершину. После завершения полного круга один раз ему придётся пройти подряд через два освещённых коридора, а затем снова переключить свет и продолжить тот же процесс.\n\nСделав так 49,5 круга, сторож окажется в противоположной вершине. При этом два соседних с ней коридора будут освещены, и он сможет последним переключением снова погасить свет во всём объекте.",
