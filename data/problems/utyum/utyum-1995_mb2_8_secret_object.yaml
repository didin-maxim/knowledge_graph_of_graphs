  "solutions": [
    {
      "id": "sol-official",
      "title": "Решение",
      "text": "Да, удастся. Занумеруем вершины цикла как v_0,v_1,\\dots,v_99 по часовой стрелке; сторож начинает в v_0, а нужная противоположная вершина есть v_50. Он будет ходить против часовой стрелки, то есть в порядке v_0,v_99,v_98,\\dots.\n\nБудем следить не за всеми коридорами отдельно, а за чётностью числа нажатий в вершинах. Пусть вершина называется нечётной, если её выключатель уже нажимали нечётное число раз. Тогда коридор между двумя соседними вершинами освещён ровно тогда, когда одна из этих двух вершин нечётная, а другая чётная: каждое нажатие меняет состояние ровно двух коридоров, выходящих из нажатой вершины. Поэтому, чтобы проверить возможность очередного шага, достаточно проверить, что у концов нужного ребра разные чётности.\n\nОпишем 49 полных обходов от v_0 обратно к v_0. На k-м полном обходе, где k=1,2,\\dots,49, сторож идёт против часовой стрелки по маршруту\nv_0,v_99,v_98,\\dots,v_1,v_0.\nПеред каждым переходом он нажимает выключатель в текущей вершине, но ровно один раз за этот обход делает исключение: в вершине v_k он не нажимает выключатель, а сразу проходит дальше. Иными словами, на k-м обходе пропускается только v_k.\n\nДокажем по индукции, что каждый такой переход действительно идёт по освещённому коридору, и одновременно опишем состояние после k-го полного обхода. После чётного k нечётными являются ровно вершины v_1,v_2,\\dots,v_k. После нечётного k нечётными являются ровно v_0 и вершины v_{k+1},v_{k+2},\\dots,v_99. Это верно при k=1: сторож нажимает все вершины полного обхода, кроме v_1, причём v_0 нажимается один раз, а v_2,\\dots,v_99 тоже по одному разу.\n\nПусть утверждение верно после k-1 обходов. Если k нечётно, то перед k-м обходом нечётны v_1,\\dots,v_{k-1}. Сторож сначала нажимает v_0, делая её нечётной, и может перейти в v_99. Далее при движении от v_j к v_{j-1}: для j>k он нажимает чётную v_j и делает её нечётной, тогда как v_{j-1} ещё чётна; в v_k он не нажимает выключатель, и ребро к v_{k-1} освещено, потому что v_k чётна, а v_{k-1} нечётна; для j<k он нажимает нечётную v_j и делает её чётной, тогда как следующая вершина v_{j-1} ещё нечётна (а при j=1 нечётной остаётся v_0). Значит, весь обход допустим, а в конце нечётными становятся ровно v_0,v_{k+1},\\dots,v_99.\n\nСлучай чётного k такой же с заменой чётностей: перед обходом нечётны v_0 и v_k,v_{k+1},\\dots,v_99. После нажатия v_0 можно перейти в v_99; для j>k нажатие делает v_j чётной, а v_{j-1} ещё нечётна; в v_k нажатия нет, и ребро к v_{k-1} освещено; для j<k нажатие делает v_j нечётной, а v_{j-1} ещё чётна. В конце нечётными являются ровно v_1,\\dots,v_k. Индукция доказана.\n\nПосле 49-го полного обхода сторож снова находится в v_0, а нечётными являются v_0,v_50,v_51,\\dots,v_99. Осталось сделать половину обхода до v_50. Сторож нажимает v_0, затем идёт против часовой стрелки через v_99,v_98,\\dots,v_50; в каждой из вершин v_99,v_98,\\dots,v_50 он также нажимает выключатель перед тем, как продолжить, а в v_50 это последнее нажатие уже не требует дальнейшего движения. Каждый переход разрешён: после нажатия текущая вершина становится чётной, а следующая ещё нечётна. Последним нажатием в v_50 она тоже становится чётной.\n\nИтак, сторож оказался в v_50, и все вершины нажаты чётное число раз. Значит, у каждого коридора его два конца имеют одинаковую чётность, поэтому ни один коридор не освещён. Объект снова затемнён.",
