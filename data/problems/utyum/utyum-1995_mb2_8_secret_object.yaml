        "title": "Графовая формулировка",
        "text": "Рассматривается цикл C_100, каждое ребро которого может быть включено или выключено. Операция в вершине меняет состояние двух инцидентных ей рёбер. Изначально все рёбра выключены. Можно ли, двигаясь только по включённым рёбрам, пройти из одной заданной вершины в противоположную и затем снова выключить все рёбра?",
