  "solutions": [
    {
      "id": "sol-parametric",
      "title": "Параметрическое решение",
      "text": "Ответ: n(n-1) - floor(n/2).\n\nСначала построим пример с такой суммой. Выберем в K_n паросочетание максимального размера, то есть floor(n/2) попарно непересекающихся рёбер. На этих рёбрах запишем 1, а на всех остальных рёбрах запишем 2. Тогда каждый треугольник содержит не более одного ребра веса 1: два ребра из паросочетания не могут иметь общую вершину. Поэтому сумма весов в каждом треугольнике равна либо 6, либо 5, так что условие выполнено. Общая сумма равна 2*C(n,2) - floor(n/2) = n(n-1) - floor(n/2).\n\nДокажем, что меньшая сумма невозможна. Назовём вершину плохой, если из неё выходит больше одного ребра веса 1. Если плохих вершин нет, то рёбра веса 1 образуют паросочетание: никакие два из них не имеют общей вершины. Следовательно, таких рёбер не больше floor(n/2). Все остальные рёбра имеют вес хотя бы 2, поэтому сумма всех весов не меньше 2*C(n,2) - floor(n/2) = n(n-1) - floor(n/2).\n\nОстаётся показать, что любую допустимую расстановку весов можно без изменения общей суммы привести к расстановке без плохих вершин. Пусть A — плохая вершина, и выберем ребро AB веса 1. Рассмотрим все вершины C, отличные от A и B, для которых хотя бы одно из рёбер AC, BC имеет вес 1. Так как вес AB равен 1, из условия для треугольника ABC следует, что сумма весов AC и BC не меньше 4. Поэтому если одно из рёбер AC, BC имеет вес 1, то второе обязательно имеет вес 3. Для каждой такой вершины C заменим веса на рёбрах AC и BC с пары 1, 3 на пару 2, 2. Ребро AB не меняем, а для остальных вершин никаких изменений не делаем.\n\nПроверим, что после этой одновременной замены все треугольные ограничения сохраняются. Треугольник ABC для выбранной вершины C имел веса 1, 1, 3, а стал иметь веса 1, 2, 2, поэтому его сумма осталась равной 5. Треугольники, не содержащие ни A, ни B, вообще не изменились. Рассмотрим треугольник AXY, где X и Y отличны от A и B; случай BXY полностью аналогичен. После замены каждое ребро из A в вершину, отличную от B, имеет вес не меньше 2: если оно участвовало в замене, оно стало равным 2, а если не участвовало, оно не могло иметь вес 1 по выбору заменяемых вершин. Поэтому в треугольнике AXY два ребра, выходящие из A, имеют веса не меньше 2, а третье ребро XY имеет вес не меньше 1. Значит, новая сумма в таком треугольнике не меньше 2+2+1 = 5. Так же доказывается условие для треугольников BXY. Других типов затронутых треугольников нет, поэтому допустимость сохраняется.\n\nТеперь проверим, что число плохих вершин строго уменьшается. После замены из A не выходит ни одного ребра веса 1, кроме AB: все другие рёбра веса 1, выходившие из A, были заменены на 2. То же верно для B. У любой другой вершины число инцидентных рёбер веса 1 не увеличивается, потому что замена только переводит веса 1 и 3 в веса 2 и 2 и не создаёт новых единиц. Следовательно, A перестаёт быть плохой, новых плохих вершин не появляется, а общее число плохих вершин уменьшается.\n\nПовторяя этот шаг, мы за конечное число операций получим допустимую расстановку с той же общей суммой и без плохих вершин. Для неё нижняя оценка уже доказана, значит та же нижняя оценка верна и для исходной расстановки. Вместе с примером это даёт минимум n(n-1) - floor(n/2).\n\nДля n = 2000 ответ равен 2000*1999 - 1000 = 3997000. Для n = 2019 ответ равен 2019*2018 - 1009 = 4073333.",
