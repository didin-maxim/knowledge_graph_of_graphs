  "solutions": [
    {
      "id": "sol-parametric",
      "title": "Параметрическое решение",
      "text": "Ответ: n(n-1) - floor(n/2).\n\nПример. Выберем в K_n паросочетание максимального размера, то есть floor(n/2) попарно непересекающихся рёбер. На этих рёбрах запишем 1, а на всех остальных рёбрах запишем 2. Тогда каждый треугольник содержит не более одного ребра веса 1, поэтому сумма весов в нём равна либо 6, либо 5. Общая сумма равна 2*C(n,2) - floor(n/2) = n(n-1) - floor(n/2).\n\nОценка снизу в официальном решении получается локальным выравниванием. Вершина называется плохой, если из неё выходит больше одного ребра веса 1. Если плохих вершин нет, то рёбра веса 1 образуют паросочетание; значит, их не больше floor(n/2), и сумма не меньше n(n-1) - floor(n/2).\n\nЕсли плохая вершина есть, возьмём два выходящих из неё ребра веса 1. Третье ребро соответствующего треугольника обязано иметь вес 3, иначе сумма в этом треугольнике была бы меньше 5. Далее локальный шаг из официального решения заменяет пару весов 1 и 3 на 2 и 2, сохраняя общую сумму и условие на треугольники, но уменьшая число плохих вершин. После конечного числа шагов получается раскладка той же суммы без плохих вершин, и предыдущий абзац даёт нижнюю оценку.\n\nДля n = 2000 ответ равен 2000*1999 - 1000 = 3997000. Для n = 2019 ответ равен 2019*2018 - 1009 = 4073333.",
