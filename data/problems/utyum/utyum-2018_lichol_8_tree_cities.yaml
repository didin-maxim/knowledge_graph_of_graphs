  "solutions": [
    {
      "id": "sol-official",
      "title": "Индукция по дереву: полное доминирование двумя третями",
      "text": "Назовём множество \\(S\\) вершин хорошим, если у каждой вершины дерева есть сосед из \\(S\\). Это относится и к самим вершинам из \\(S\\): каждый выбранный город тоже должен иметь соседний выбранный город.\n\nДокажем более сильную лемму. В каждом дереве с \\(N\\ge3\\) вершинами есть хорошее множество размера не больше \\(2N/3\\). Для \\(N=1500\\) это даёт не больше \\(1000\\) городов; если выбрано меньше \\(1000\\), можно добавить произвольные деревни, потому что добавление городов не нарушает условие.\n\nДоказательство идёт индукцией по \\(N\\). При \\(N=3\\) дерево — путь длины два, и достаточно выбрать две соседние вершины. При \\(N>3\\) возьмём длиннейший путь \\(v_1v_2\\ldots v_k\\). Тогда \\(v_1\\) — лист, а каждый сосед \\(v_2\\), кроме \\(v_3\\), тоже лист.\n\nЕсли у \\(v_2\\) есть хотя бы два листовых соседа, удалим \\(v_2\\) и всех его листовых соседей. К хорошему множеству оставшегося дерева добавим \\(v_2\\) и один удалённый лист. Удалённые листья доминируются вершиной \\(v_2\\), сама \\(v_2\\) доминируется выбранным листом, а \\(v_3\\), если она есть, доминируется \\(v_2\\). Удалено не меньше трёх вершин и добавлено две, поэтому оценка \\(2/3\\) сохраняется; малые остатки из одной вершины или одного ребра проверяются напрямую тем же выбором, при необходимости с добавлением \\(v_3\\).\n\nЕсли у \\(v_2\\) ровно один листовой сосед, то \\(\\deg v_2=2\\). При \\(\\deg v_3=2\\) удалим \\(v_1,v_2,v_3\\), применим индукцию к остатку и добавим \\(v_2,v_3\\). Эти две выбранные соседние вершины доминируют друг друга, а \\(v_1\\) доминируется \\(v_2\\); снова добавлено две вершины вместо трёх удалённых.\n\nОстаётся случай \\(\\deg v_3>2\\). Рассмотрим все ветви из \\(v_3\\), кроме ветви к \\(v_4\\). По максимальности пути каждая такая ветвь имеет длину не больше двух. Удалим \\(v_3\\) вместе с этими короткими ветвями. В удалённом фрагменте выберем \\(v_3\\), \\(v_2\\), а для каждой дополнительной ветви длины два — вершину этой ветви, соседнюю с \\(v_3\\). Тогда все удалённые вершины доминированы: листья рядом с \\(v_3\\) видят \\(v_3\\), листья в ветвях длины два видят выбранную промежуточную вершину, а \\(v_2\\) и \\(v_3\\) доминируют друг друга. Подсчёт по ветвям показывает, что выбранная часть не превышает двух третей удалённого фрагмента.\n\nИндукция завершена. Для дерева с \\(1500\\) вершинами получаем хорошее множество размера не больше \\(2\\cdot1500/3=1000\\). Если в нём меньше \\(1000\\) вершин, добавим произвольные деревни до ровно \\(1000\\); свойство сохранится.",
