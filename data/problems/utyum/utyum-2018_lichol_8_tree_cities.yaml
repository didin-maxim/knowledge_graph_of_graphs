  "solutions": [
    {
      "id": "sol-official",
      "title": "Решение",
      "text": "В Доказательство граф деревень и дорог сразу рассматривается как дерево.\n\nДалее доказывается более общий шаг: в дереве с n >= 3 вершинами можно выделить связный фрагмент так,\nчтобы среди выделенных вершин доля объявленных городами была не больше 2/3, каждая выделенная вершина\nбыла смежна с городом, а после удаления выделенных вершин оставшийся граф оставался связным.\n\nДля этого берут самый длинный путь A...B и анализируют вершины возле листа B. Если предпоследняя вершина X\nимеет несколько висячих соседей, то выделяют X вместе с этими листьями и объявляют городами X и B. В противном\nслучае переходят на шаг выше по диаметральному пути и разбирают ещё один локальный случай.\n\nПовторяя такую процедуру, получают, что суммарно городами можно объявить не более 2*1500/3 = 1000 вершин.\nЕсли городов получилось меньше 1000, их дополняют произвольными деревнями.",
