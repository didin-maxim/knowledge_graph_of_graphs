        "title": "Оригинальная формулировка",
        "text": "В стране 1500 деревень, некоторые пары деревень соединены дорогами. Известно, что между любыми двумя\nдеревнями существует единственный путь по этим дорогам.\n\nДокажите, что 1000 деревень можно назвать городами так, чтобы из любого населённого пункта\nвыходила хотя бы одна дорога в город.",
