        "title": "Оригинальная формулировка",
        "text": "В стране 2025 городов. Некоторые пары городов, но не все, соединены двусторонними авиалиниями.\n\nОказалось, что для любых двух городов без прямого авиасообщения сумма количеств исходящих из них авиалиний равна одному и тому же числу k.\n\nКакие значения может принимать k?",
