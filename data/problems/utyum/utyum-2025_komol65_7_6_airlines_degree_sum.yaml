    {
      "id": "sol-official",
      "title": "Решение",
      "text": "Ответ: все чётные k от 0 до 4046 и все нечётные k от 2023 до 4045.\n\nРассмотрим дополнительный граф H: его рёбрами будут как раз пары городов без прямого авиасообщения. Если в H степени вершин равны d_H(u) и d_H(v), то в исходном графе степени этих вершин равны 2024 - d_H(u) и 2024 - d_H(v). Поэтому для каждого ребра uv графа H выполнено\nk = 4048 - (d_H(u) + d_H(v)).\nЗначит, в H сумма степеней концов любого ребра равна одному и тому же числу S = 4048 - k.\n\nПосмотрим, какие S возможны. Очевидно, 2 <= S <= 4048. Если S нечётно, то в H нет нечётного цикла: вдоль пути степени вершин вынужденно чередуются как a, S-a, a, S-a, ... . Поэтому каждая компонента H, содержащая ребро, двудольна; в одной её доле все степени равны a, в другой — S-a. Тогда в первой доле не меньше S-a вершин, а во второй не меньше a вершин, значит такая компонента содержит не меньше S вершин. Всего вершин 2025, следовательно, при нечётном S необходимо S <= 2025. Это даёт для нечётного k условие k = 4048 - S >= 2023.\n\nОстаётся показать, что все найденные значения действительно достигаются. Если S нечётно и 3 <= S <= 2025, берём в H полный двудольный граф K_{1,S-1} и добавляем остальные вершины изолированными. На каждом ребре сумма степеней равна S.\n\nЕсли S чётно, положим r = S/2. При чётном r возьмём r-регулярный граф H на всех 2025 вершинах; его можно построить, расположив вершины по кругу и соединив каждую с r/2 ближайшими вершинами с каждой стороны. При нечётном r возьмём r-регулярный граф на 2024 вершинах и одну изолированную вершину; на чётном числе вершин такой граф строится так же, только дополнительно каждая вершина соединяется с противоположной. Во всех этих случаях на каждом ребре H сумма степеней равна S, а значит в исходном графе получается k = 4048 - S.\n\nИтак, допустимы ровно все чётные k от 0 до 4046 и все нечётные k от 2023 до 4045.",
