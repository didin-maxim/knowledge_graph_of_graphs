  "solutions": [
    {
      "id": "sol-official",
      "title": "Решение",
      "text": "Ответ: все чётные \\(k\\) от \\(0\\) до \\(2n-4\\) и все нечётные \\(k\\) от \\(n-2\\) до \\(2n-5\\).\n\nРассмотрим дополнительный граф \\(H\\): его рёбрами будут как раз пары вершин, несмежные в исходном графе. Если в \\(H\\) степени вершин равны \\(d_H(u)\\) и \\(d_H(v)\\), то в исходном графе степени этих вершин равны \\(n-1-d_H(u)\\) и \\(n-1-d_H(v)\\). Поэтому для каждого ребра \\(uv\\) графа \\(H\\) выполнено\n\\[\nk=2n-2-(d_H(u)+d_H(v)).\n\\]\nЗначит, в \\(H\\) сумма степеней концов любого ребра равна одному и тому же числу \\(S=2n-2-k\\).\n\nПосмотрим, какие \\(S\\) возможны. Очевидно, \\(2\\le S\\le 2n-2\\). Если \\(S\\) нечётно, то в \\(H\\) нет нечётного цикла: вдоль пути степени вершин вынужденно чередуются как \\(a,S-a,a,S-a,\\ldots\\). Поэтому каждая компонента \\(H\\), содержащая ребро, двудольна; в одной её доле все степени равны \\(a\\), в другой — \\(S-a\\). Тогда в первой доле не меньше \\(S-a\\) вершин, а во второй не меньше \\(a\\) вершин, значит такая компонента содержит не меньше \\(S\\) вершин. Всего вершин \\(n\\), следовательно, при нечётном \\(S\\) необходимо \\(S\\le n\\). Это даёт для нечётного \\(k\\) условие \\(k=2n-2-S\\ge n-2\\).\n\nОстаётся показать, что все найденные значения действительно достигаются. Если \\(S\\) нечётно и \\(3\\le S\\le n\\), берём в \\(H\\) полный двудольный граф \\(K_{1,S-1}\\) и добавляем остальные вершины изолированными. На каждом ребре сумма степеней равна \\(S\\).\n\nЕсли \\(S\\) чётно, положим \\(r=S/2\\). При чётном \\(r\\) возьмём \\(r\\)-регулярный граф \\(H\\) на всех \\(n\\) вершинах; его можно построить, расположив вершины по кругу и соединив каждую с \\(r/2\\) ближайшими вершинами с каждой стороны. При нечётном \\(r\\) возьмём \\(r\\)-регулярный граф на \\(n-1\\) вершинах и одну изолированную вершину; на чётном числе вершин такой граф строится так же, только дополнительно каждая вершина соединяется с противоположной. Во всех этих случаях на каждом ребре \\(H\\) сумма степеней равна \\(S\\), а значит в исходном графе получается \\(k=2n-2-S\\).\n\nИтак, допустимы ровно все чётные \\(k\\) от \\(0\\) до \\(2n-4\\) и все нечётные \\(k\\) от \\(n-2\\) до \\(2n-5\\).",
