        "id": "stmt-graph",
        "title": "Постоянная сумма степеней несмежных пар",
        "text": "Пусть \\(n\\ge3\\) — нечётное число. Дан простой неполный граф на \\(n\\) вершинах. Для любых двух несмежных вершин сумма их степеней равна одному и тому же числу \\(k\\). Какие значения может принимать \\(k\\)?",
