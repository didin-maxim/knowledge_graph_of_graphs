      "id": "sol-official",
      "title": "Официальное решение",
      "text": "В официальном решении вводится граф авиалиний, а k выражается через суммы степеней несмежных вершин.\n\nСначала доказывается, что нечётное k меньше 2023 невозможно: у двух несмежных вершин тогда найдётся третья вершина, тоже несмежная с ними, и по чётности возникнет противоречие.\n\nДальше для всех допустимых значений строятся примеры:\nдля чётных k от 0 до 4046 — специальный граф со столицей и двумя долями;\nдля нечётных k от 2023 до 4045 — почти полный граф, в котором одна вершина не соединена с заранее выбранным набором городов.\n\nВ итоге получаются все чётные k от 0 до 4046 и все нечётные k от 2023 до 4045.",
