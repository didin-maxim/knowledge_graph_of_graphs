  "solutions": [
    {
      "id": "sol-official",
      "title": "Решение",
      "text": "Ответ: 2695.\n\nВ Доказательство сначала строится пример на 2695 людях. Всех разбивают на четыре группы размеров\n674, 674, 674 и 673. Люди внутри одной группы попарно не знакомы, а люди из разных групп попарно знакомы.\nТогда у каждого человека не меньше 2021 знакомого, а пятёрки попарно знакомых не существует.\n\nДля оценки снизу предполагают, что людей не более 2694. Тогда у каждого человека не более 672 незнакомых.\nДальше жадно строят группу попарно знакомых людей. Каждый новый выбранный человек вместе со своими незнакомыми\nзапрещает не более 673 человек. После выбора четырёх человек запрещённых всё ещё меньше, чем всего людей,\nпоэтому можно выбрать пятого. Получается пятёрка попарно знакомых, что противоречит условию.\n\nЗначит, минимально возможное n равно 2695.",
