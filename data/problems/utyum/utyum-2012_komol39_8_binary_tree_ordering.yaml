  "solutions": [
    {
      "id": "sol-official",
      "title": "Официальное решение",
      "text": "Ответ: не всегда.\n\nПостроим контрпример. Возьмём полное двоичное дерево глубины 18: есть корень, у него два сына, у каждого невисячего узла по два сына, и последний уровень имеет 2^18 вершин. Всего в таком дереве 2^19 - 1 = 524287 вершин, поэтому до 20122012 детей можно добрать изолированными вершинами. Степень каждой вершины получившегося графа не превосходит 3.\n\nПредположим, что всех детей удалось поставить в ряд так, что между любыми двумя друзьями стоит не более 2012 человек. Тогда позиции двух смежных вершин в ряду отличаются не более чем на 2013. Если корень стоит на позиции p, то любая вершина 18-го уровня, соединённая с корнем путём из 18 рёбер, должна стоять на расстоянии не более 18·2013 от p. Значит, все вершины 18-го уровня должны попасть в отрезок из не более чем 2·18·2013 + 1 = 72469 позиций.\n\nНо на 18-м уровне 2^18 = 262144 вершины, а 262144 > 72469. Противоречие. Следовательно, требуемое расположение существует не всегда.",
