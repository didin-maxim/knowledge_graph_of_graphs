  "solutions": [
    {
      "id": "sol-official",
      "title": "Official solution",
      "text": "Ответ: не всегда.\n\nВ официальном решении строится контрпример. Берется граф знакомств в виде большого двоичного дерева:\nодин ребенок знаком с двумя, каждый из них — еще с двумя новыми, и так далее, пока не будут охвачены все дети.\nУ каждого ребенка в таком примере не более трех друзей, так что условие выполнено.\n\nОднако на k-м уровне такого дерева уже 2^k детей. Если пытаться расположить всех в ряд так, чтобы любые друзья были\nна расстоянии не более 2012, то каждый следующий уровень должен располагаться сравнительно близко к предыдущему.\nПри достаточно большом числе уровней это невозможно: крайние ветви разрастаются слишком быстро, и хотя бы одна пара\nсоседних по дереву вершин неизбежно окажется в ряду слишком далеко друг от друга.\n\nЗначит, требуемое расположение существует не всегда.",
      "idea_ids": [],
      "standard_idea_ids": [],
      "status": "ai_checked",
      "definition_ids": [
        "tree"
      ]
    }
