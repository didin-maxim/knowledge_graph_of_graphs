      "id": "sol-official",
      "title": "Официальное решение",
      "text": "Ответ: 4073333.\n\nОфициальное решение полностью повторяет идею задачи для 2000 вершин. Пример достигается, если выбрать\n1009 попарно непересекающихся рёбер, поставить на них 1, а на все остальные рёбра — 2.\n\nДля нижней оценки снова вводятся плохие вершины — вершины, из которых выходит больше одного ребра веса 1.\nЕсли их нет, то единичных рёбер не больше 1009, и отсюда сразу следует нужная оценка.\n\nЕсли плохая вершина есть, то рассматривается ребро AB веса 1. В любом треугольнике ABC наличие ещё одного\nребра веса 1 вынуждает третье ребро иметь вес 3. Поэтому пару рёбер весов 1 и 3 заменяют двумя рёбрами веса 2,\nсохраняя общую сумму и условие на все треугольники, но уменьшая число плохих вершин. После конечного числа таких\nшагов приходят к случаю без плохих вершин и получают минимальную сумму 4073333.",
