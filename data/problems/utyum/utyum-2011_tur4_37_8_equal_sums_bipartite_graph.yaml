    {
      "id": "sol-official",
      "title": "Решение",
      "text": "Ответ: 66.\n\nПусть исходная общая сумма каждой строки и каждого столбца равна S. Построим двудольный граф: одна доля — 50 строк, другая — 50 столбцов, а изменённой клетке соответствует ребро между её строкой и её столбцом. Если число в клетке изменили на d, то вес этого ребра равен d. Тогда новая сумма в каждой строке или столбце равна S плюс сумма весов инцидентных рёбер. Значит, надо сделать попарно различными именно эти 100 весовых сумм вершин, а не степени вершин.\n\nДокажем нижнюю оценку. Рассмотрим граф, состоящий только из изменённых клеток, и его компоненты связности. Компонента из двух вершин невозможна: это одна строка и один столбец, соединённые единственным изменённым числом, поэтому обе соответствующие суммы изменятся на одно и то же d и останутся равными. Изолированная вершина может быть не более одной, иначе две неизменённые строки или столбца также имели бы одинаковую сумму S. Поэтому среди 100 вершин нет компонент размера 2 и есть не более одной компоненты размера 1. Число компонент тогда не превосходит 1 + 99/3 = 34. Если в графе m рёбер и c компонент, то в каждой компоненте с v вершинами есть не менее v - 1 рёбер, поэтому m >= 100 - c >= 66.\n\nОсталось показать, что 66 изменений достаточно. Оставим один столбец изолированным. Остальные 49 столбцов и 50 строк разобьём на 33 тройки: 17 троек вида «две строки и один столбец» и 16 троек вида «одна строка и два столбца». В каждой тройке изменим две клетки, соединяя единственную вершину одной доли с двумя вершинами другой доли. Всего получится 2 * 33 = 66 изменённых клеток.\n\nНазначим всем 66 изменённым клеткам разные веса 10^1, 10^2, ..., 10^66 и просто прибавим соответствующий вес к числу в этой клетке. В одной тройке вершины получают прибавки 10^a, 10^b и 10^a + 10^b. Поскольку все показатели a, b во всех тройках различны, десятичные записи этих 99 положительных прибавок различны; изолированный столбец имеет прибавку 0. Следовательно, все 100 новых сумм равны S плюс попарно различные прибавки. Значит, минимальное число изменяемых чисел равно 66.",
