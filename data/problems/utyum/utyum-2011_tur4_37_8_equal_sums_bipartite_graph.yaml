      "id": "sol-official",
      "title": "Официальное решение",
      "text": "Официальное решение переводит задачу в язык двудольного графа.\n\nРассматриваются 50 вершин-строк и 50 вершин-столбцов. Если меняется число в клетке на пересечении строки i и столбца j,\nто между соответствующими вершинами проводится ребро. Тогда степени вершин равны количествам измененных клеток в\nсоответствующих строках и столбцах, а именно эти количества и определяют, насколько изменятся суммы.\n\nНужно добиться, чтобы все 100 степеней были попарно различны. В двудольном графе сумма степеней в долях одинакова,\nпоэтому набор степеней должен быть ровно 0, 1, 2, ..., 99. Тогда общее число ребер равно\n(0 + 1 + ... + 99) / 2 = 2475.\n\nОстается показать, что такой двудольный граф существует. В решении он строится явно: вершинам в одной доле дают степени\n0, 2, 4, ..., 98, а в другой — 1, 3, 5, ..., 99, после чего ребра добавляют жадно по убыванию степеней.\nЗначит, минимальное число изменяемых клеток равно 2475.",
