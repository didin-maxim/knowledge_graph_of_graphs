      "id": "sol-official",
      "title": "Официальное решение",
      "text": "В официальном решении рассматривается граф знакомств.\n\nПредположим, что могло остаться не более двух человек. Рассмотрим момент, когда осталось ровно три человека A, B, C, и пусть A имеет больше всех знакомых.\n\nЕсли у A только один знакомый, то кто-то из B и C тоже имеет одного знакомого, и A уже не выделяется. Значит, у A два знакомых.\n\nПусть D ушёл непосредственно перед A. Тогда у D на момент ухода должно быть не меньше трёх знакомых, в частности A, B и C. Но тогда и у A было как минимум три знакомых, противоречие.\n\nСледовательно, меньше трёх человек остаться не может. Пример на три человека строится явным графом знакомств.",
