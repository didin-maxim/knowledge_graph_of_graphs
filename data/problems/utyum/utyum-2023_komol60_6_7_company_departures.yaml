      "id": "sol-official",
      "title": "Решение",
      "text": "В доказательстве рассматривается граф знакомств.\n\nПредположим, что могло остаться не более двух человек. Рассмотрим момент, когда осталось ровно три человека A, B, C, и пусть A имеет больше всех знакомых.\n\nЕсли у A только один знакомый, то кто-то из B и C тоже имеет одного знакомого, и A уже не выделяется. Значит, у A два знакомых.\n\nПусть D ушёл непосредственно перед A. Тогда у D на момент ухода должно быть не меньше трёх знакомых, в частности A, B и C. Но тогда и у A было как минимум три знакомых, противоречие.\n\nСледовательно, меньше трёх человек остаться не может. Пример на три человека строится явным графом знакомств.\n\nПример точности: занумеруем вершины 1, ..., 100; вершины 1, 2, 3 образуют треугольник, а каждую вершину i >= 4 соединим со всеми вершинами меньших номеров. Тогда 100 — единственная вершина максимальной степени, после её удаления такой вершиной становится 99, затем 98 и так далее до 4. В конце остаётся треугольник, где все степени равны 2, поэтому процесс останавливается ровно на трёх вершинах.",
