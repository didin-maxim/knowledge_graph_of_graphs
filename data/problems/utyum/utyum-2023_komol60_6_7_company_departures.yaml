        "title": "Оригинальная формулировка",
        "text": "В компании из 100 человек некоторые знакомы друг с другом.\n\nКаждую минуту из компании уходит человек, который имеет знакомых строго больше, чем любой из оставшихся.\n\nЧерез несколько минут такого человека не нашлось. Какое наименьшее количество людей могло остаться к этому моменту?",
