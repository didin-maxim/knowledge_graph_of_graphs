      "id": "sol-official",
      "title": "Официальное решение",
      "text": "В официальном решении рассматривается звезда: центральная вершина, n листьев и n рёбер.\n\nОтвет доказывается индукцией по n. Для n + 1 последняя запись обязана быть названием некоторой улицы.\n\nЕсли удалить эту последнюю улицу и соответствующую периферийную площадь, то остаётся корректный реестр для случая n.\n\nДальше независимо выбираются:\nпериферийная площадь, которую считаем выделенной;\nреестр меньшего города;\nместо вставки выделенной площади;\nи в конец добавляется улица.\n\nЭто даёт формулу 2^n (n!)^2.",
