  "solutions": [
    {
      "id": "sol-official",
      "title": "Решение",
      "text": "Ответ: \\(2^n(n!)^2\\).\n\nБудем доказывать формулу индукцией по \\(n\\). При \\(n=0\\) в реестре есть только центральная площадь, поэтому способ один, и формула даёт \\(1\\).\n\nПереход от \\(n\\) к \\(n+1\\). Рассмотрим корректный реестр для города с \\(n+1\\) периферийными площадями. Последняя запись не может быть площадью: каждая периферийная площадь имеет свою улицу, которая должна стоять правее неё, а центральная площадь должна стоять левее всех улиц. Значит, последняя запись — название некоторой улицы. Эта улица соединяет центр с некоторой периферийной площадью \\(p\\).\n\nУдалим из реестра последнюю улицу и площадь \\(p\\). Оставшиеся записи образуют корректный реестр для звезды с \\(n\\) периферийными площадями: для каждой оставшейся улицы оба её конца по-прежнему стоят левее неё.\n\nТеперь восстановим исходный реестр из меньшего. Нужно выбрать удалённую периферийную площадь \\(p\\): есть \\(n+1\\) вариантов. Затем выбрать корректный реестр для остальных \\(n\\) лучей: по предположению индукции есть \\(2^n(n!)^2\\) вариантов. После этого вставить название площади \\(p\\) в любое место до последней добавляемой улицы. В меньшем реестре \\(2n+1\\) запись, а новая улица будет поставлена в самый конец; площадь \\(p\\) можно вставить в любую из \\(2n+2\\) позиций перед этим концом. Наконец, в конец ставится улица, соединяющая \\(p\\) с центром.\n\nТак получаются все корректные реестры, причём единственным образом: по последней улице однозначно восстанавливается удалённая периферийная площадь. Поэтому число способов для \\(n+1\\) равно\n\\[\n(n+1)\\cdot 2^n(n!)^2\\cdot(2n+2)=2^{n+1}((n+1)!)^2.\n\\]\nИндукция завершена.",
