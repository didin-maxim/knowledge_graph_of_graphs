        "title": "Оригинальная формулировка",
        "text": "В Ёжгороде есть центральная площадь, n периферийных площадей и n улиц, каждая из которых соединяет центральную площадь с одной из периферийных.\n\nМэр хочет записать в строку названия всех площадей и улиц так, чтобы название каждой улицы стояло правее названий обеих площадей, которые она соединяет.\n\nСколькими способами можно составить такой реестр?",
