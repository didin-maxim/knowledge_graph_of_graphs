  "solutions": [
    {
      "id": "sol-official",
      "title": "Official solution",
      "text": "Рассмотрим граф незнакомства: вершины соответствуют участникам турнира, а рёбра соединяют пары незнакомых.\n\nЕсли в этом графе есть треугольник ABC, то для любых ещё двух участников D и E в пятёрке ABCDE рёбра DE и по крайней мере четыре рёбра между {D,E} и {A,B,C} отсутствуют, иначе нельзя было бы получить две тройки попарно знакомых. Отсюда число пар знакомых уже не меньше 97*96/2 + 2*97 = 4850.\n\nПоэтому можно считать, что треугольников в графе незнакомства нет. Покажем также, что в нём нет пути длины 4: иначе пять вершин такого пути дали бы пятёрку, в которой нельзя выбрать две тройки попарно знакомых. Аналогично цикл длины 4 образует отдельную компоненту связности.\n\nЗначит, каждая компонента графа незнакомства либо является деревом, либо циклом длины 4. В обоих случаях число рёбер в компоненте не превосходит числа её вершин, поэтому всего рёбер не больше 100.\n\nТогда пар знакомых не меньше, чем C(100,2) - 100 = 4950 - 100 = 4850.",
