        "id": "stmt-original",
        "title": "Оригинальная формулировка",
        "text": "Некоторые из 2017 городов страны соединены прямыми двусторонними авиарейсами так, что из каждого города\nможно добраться до любого другого. Нужно выбрать k стратегически значимых городов так, чтобы из любого города,\nвключая стратегически значимые, ровно за один перелёт можно было попасть в стратегически значимый город.\n\nПри каком наименьшем k это наверняка можно сделать?",
        "source_id": "src-utyum-2018_lichol_6_strategic_cities-official",
