  "solutions": [
    {
      "id": "sol-official",
      "title": "Решение",
      "text": "Ответ: k = 1344.\n\nВ Доказательство вводится граф городов и авиарейсов. Сначала строится пример на 2017 вершинах,\nгде меньше чем 1344 вершинами не обойтись: берётся центральная вершина A и 672 цепочки длины 3 вида\nA-B_k-C_k-D_k. В каждой тройке B_k, C_k, D_k хотя бы две вершины должны быть стратегическими, откуда\nполучается нижняя оценка 1344.\n\nДля верхней оценки доказывается, что достаточно рассматривать дерево, натянутое на все вершины связного графа.\nЗатем повторяется та же локальная процедура, что и в задаче про деревни и города: из дерева последовательно\nудаляются небольшие куски, в которых доля стратегических вершин не превышает 2/3, а каждая удаляемая вершина\nимеет соседа среди выбранных стратегических.\n\nВ результате для n = 2017 достаточно не более 2*2017/3 = 1344 стратегических вершин, и эта оценка точна.",
      "idea_ids": [],
