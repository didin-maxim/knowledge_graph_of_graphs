  "solutions": [
    {
      "id": "sol-official",
      "title": "Решение",
      "text": "Ответ: \\(k=1344\\).\n\nСначала уточним перевод на язык графов. Города - вершины, авиарейсы - рёбра. Нужно выбрать множество \\(S\\) вершин так, чтобы у каждой вершины был сосед из \\(S\\). Важно, что выбранная вершина тоже должна иметь выбранного соседа: попасть в стратегический город надо ровно за один перелёт, а не за ноль перелётов.\n\nНижняя оценка. Построим связный граф на 2017 вершинах: возьмём центральную вершину \\(A\\) и для каждого \\(i=1,\\ldots,672\\) добавим путь \\(A-B_i-C_i-D_i\\). Всего вершин \\(1+3\\cdot672=2017\\). Рассмотрим любой подходящий набор \\(S\\). Вершина \\(D_i\\) имеет единственного соседа \\(C_i\\), значит обязательно \\(C_i\\in S\\). Но тогда сама вершина \\(C_i\\), будучи выбранной или нет, должна иметь выбранного соседа; её соседи - только \\(B_i\\) и \\(D_i\\), поэтому хотя бы одна из вершин \\(B_i,D_i\\) тоже должна лежать в \\(S\\). Значит для каждого \\(i\\) из тройки \\(B_i,C_i,D_i\\) выбраны как минимум две вершины. Таких троек 672, поэтому \\(|S|\\ge2\\cdot672=1344\\). Следовательно, меньшего \\(k\\) гарантировать нельзя.\n\nВерхняя оценка. Нам понадобится стандартная лемма: в каждом дереве на \\(n\\ge3\\) вершинах есть множество \\(S\\) размера не больше \\(\\lfloor2n/3\\rfloor\\), такое что у каждой вершины дерева есть сосед из \\(S\\). Лемма доказывается индукцией по \\(n\\): берут конец длиннейшего пути и срезают около него маленький висячий фрагмент. Если у предпоследней вершины есть хотя бы два листа, эти листы удаляют, а при восстановлении добавляют одну их общую соседнюю вершину; если же конец пути идёт цепочкой, удаляют три подряд идущие вершины у конца и при восстановлении добавляют две соседние вершины. В обоих случаях все удалённые вершины получают выбранного соседа, связь с оставшимся деревом контролируется граничной вершиной, а расход не превосходит две выбранные вершины на три удалённые. Базы \\(n=3,4\\) проверяются напрямую выбором двух соседних вершин. Поэтому после всех шагов получается не больше \\(\\lfloor2n/3\\rfloor\\) выбранных вершин.\n\nТеперь пусть дан произвольный связный граф \\(G\\) на 2017 вершинах. Возьмём в нём остовное дерево \\(T\\). По лемме в \\(T\\) есть множество \\(S\\) размера не больше\n\\[\n\\left\\lfloor {2\\cdot2017\\over3}\\right\\rfloor=1344.\n\\]\nУ каждой вершины есть сосед из \\(S\\) уже в дереве \\(T\\), а все рёбра дерева являются рёбрами исходного графа \\(G\\). Значит то же множество \\(S\\) подходит и для исходной сети авиарейсов. Нижняя и верхняя оценки совпали, поэтому минимальное гарантированное значение равно \\(1344\\).",
