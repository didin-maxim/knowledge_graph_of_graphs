        "title": "Графовая формулировка",
        "text": "Дан связный граф на 2017 вершинах. Нужно выбрать k вершин так, чтобы каждая вершина графа либо сама вошла в этот набор, либо была смежна с одной из выбранных. При каком наименьшем k это всегда возможно?",
