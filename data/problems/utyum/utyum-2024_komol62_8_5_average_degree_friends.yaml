  "solutions": [
    {
      "id": "sol-official",
      "title": "Решение",
      "text": "Рассмотрим граф дружбы. Пусть у \\(i\\)-й вершины степень равна \\(n_i\\), а \\(s_i\\) — среднее арифметическое степеней её соседей. По условию изолированных вершин нет, поэтому все \\(n_i>0\\).\n\nОбозначим через \\(M\\) среднюю степень всех вершин графа. Тогда\n\\[\nM=\\frac{\\sum_i n_i}{N}=\\frac{2E}{N},\n\\]\nгде \\(N\\) — число вершин, а \\(E\\) — число рёбер.\n\nПредположим, что для каждой вершины \\(s_i<M\\). Умножим эти неравенства на положительные числа \\(n_i\\) и сложим:\n\\[\n\\sum_i n_i s_i < M\\sum_i n_i=\\frac{2E}{N}\\cdot 2E.\n\\]\nС другой стороны, распишем левую часть по рёбрам. Для вершины \\(i\\) величина \\(n_i s_i\\) равна сумме степеней всех её соседей. Поэтому каждое ребро \\(it\\) даёт в общую сумму два вклада: \\(n_t\\) со стороны вершины \\(i\\) и \\(n_i\\) со стороны вершины \\(t\\). Значит,\n\\[\n\\sum_i n_i s_i=\\sum_{it\\in E}(n_i+n_t).\n\\]\nТеперь применим простую оценку: сумма степеней концов каждого ребра в среднем по рёбрам не может быть меньше средней степени по вершинам при весах степеней. Эквивалентно,\n\\[\n\\sum_{it\\in E}(n_i+n_t)=\\sum_i n_i^2 \\ge \\frac{(\\sum_i n_i)^2}{N}=\\frac{(2E)^2}{N},\n\\]\nгде последняя оценка — неравенство Коши.\n\nМы получили одновременно строгую верхнюю оценку \\(\\sum_i n_i s_i<(2E)^2/N\\) и нижнюю оценку \\(\\sum_i n_i s_i\\ge(2E)^2/N\\). Противоречие. Следовательно, найдётся вершина, для которой средняя степень соседей не меньше средней степени всего графа.",
