  "solutions": [
    {
      "id": "sol-official",
      "title": "Официальное решение",
      "text": "Пусть у i-го участника ni друзей, а si — среднее число друзей у его друзей.\n\nПредположим, что у каждого si строго меньше общего среднего. Тогда сумма всех таких средних, взятых с весами ni, должна быть меньше удвоенного числа рёбер графа дружбы.\n\nНо если перегруппировать сумму по рёбрам, то каждое ребро i-t даёт вклад nt/ni + ni/nt, а он не меньше 2.\n\nПоэтому суммарный вклад не меньше удвоенного числа рёбер. Получаем противоречие.",
