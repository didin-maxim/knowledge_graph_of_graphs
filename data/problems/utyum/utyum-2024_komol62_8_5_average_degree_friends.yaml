        "title": "Оригинальная формулировка",
        "text": "Некоторые участники турнира дружат между собой, причём у каждого есть хотя бы один друг.\n\nНа футболке каждого написано число его друзей.\n\nДокажите, что найдётся участник, для которого среднее арифметическое чисел на футболках его друзей не меньше, чем среднее арифметическое чисел на всех футболках.",
