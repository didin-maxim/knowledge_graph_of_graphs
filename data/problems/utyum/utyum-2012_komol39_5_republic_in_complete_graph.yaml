        "id": "stmt-original",
        "title": "Statement",
        "text": "В некоторой стране 100 городов. Любые два города этой страны соединены дорогой.\n\nОт этой страны отделилась независимая республика, причем количество дорог, соединяющих города этой республики, равно\nколичеству дорог, ведущих из республики в остальные города этой страны.\n\nСколько городов в отделившейся республике? Приведите все варианты и докажите, что других нет.",
