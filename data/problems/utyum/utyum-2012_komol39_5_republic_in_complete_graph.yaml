  "solutions": [
    {
      "id": "sol-official",
      "title": "Решение",
      "text": "Пусть в отделившейся республике x городов.\n\nТогда число дорог между ее городами равно x(x - 1) / 2, поскольку внутри республики получаем полный граф на x вершинах.\nЧисло дорог из республики во внешнюю часть равно x(100 - x).\n\nПо условию\n\nx(x - 1) / 2 = x(100 - x).\n\nТак как x > 0, сокращаем на x:\n\n(x - 1) / 2 = 100 - x.\n\nОтсюда 3x = 201, следовательно, x = 67.\n\nИтак, возможен только один ответ: 67 городов.",
