      "id": "sol-official",
      "title": "Решение",
      "text": "Ответ: 6.\n\nВ доказательстве сначала приводится пример на 6 людях: берутся вершины и ребра октаэдра. У каждой вершины степень 4,\nа любые две соседние вершины имеют ровно двух общих соседей.\n\nЗатем доказывается нижняя оценка. Очевидно, людей не меньше пяти. Но если бы их было ровно 5, то человек, знающий\nчетверых, знал бы всех остальных, то есть граф знакомств был бы полным. Тогда любые двое знакомых имели бы уже трех\nобщих знакомых, что противоречит условию.\n\nЗначит, минимальное число людей равно 6.",
