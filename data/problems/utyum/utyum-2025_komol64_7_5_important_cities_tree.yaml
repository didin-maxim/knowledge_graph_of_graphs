  "solutions": [
    {
      "id": "sol-official",
      "title": "Official solution",
      "text": "Рассматривается граф городов и дорог.\n\nОчевидно, нужно оставить как минимум n - 1 дорог, иначе граф не будет связным.\n\nОстаётся показать, что всегда можно дойти до n - 1. Для этого последовательно удаляются рёбра из циклов.\n\nЕсли какое-то ребро цикла нельзя удалить, то один его конец важный, а другой неважный. Если нельзя удалить ни одно ребро цикла, то важные и неважные вершины на цикле чередуются, и тогда удаление любого ребра всё равно сохраняет свойство: каждый неважный город остаётся соединён с важным.\n\nПосле последовательного удаления циклов получается дерево на n вершинах, то есть остаётся ровно n - 1 дорог.",
