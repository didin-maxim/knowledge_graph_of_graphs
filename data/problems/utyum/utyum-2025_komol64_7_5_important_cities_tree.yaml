        "id": "stmt-graph",
        "title": "Graph-theoretic formulation",
        "text": "Дан связный граф, в котором некоторые вершины объявлены важными, и каждая неважная вершина смежна хотя бы с одной важной. Нужно оставить как можно меньше рёбер так, чтобы граф остался связным и второе свойство тоже сохранилось. Найдите минимальное гарантированное число оставляемых рёбер.",
