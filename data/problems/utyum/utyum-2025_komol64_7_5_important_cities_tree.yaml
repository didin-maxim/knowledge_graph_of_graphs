        "id": "stmt-original",
        "title": "Statement",
        "text": "В стране n городов некоторые пары соединены дорогами с двусторонним движением. Некоторые города названы важными.\n\nИзвестно, что:\n1. из каждого города можно добраться до любого другого;\n2. каждый неважный город соединён дорогой с важным.\n\nДля какого наименьшего k всегда можно закрыть все дороги, кроме некоторых k, на ремонт так, чтобы оба условия сохранились?",
