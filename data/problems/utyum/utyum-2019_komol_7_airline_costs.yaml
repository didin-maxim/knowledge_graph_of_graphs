  "solutions": [
    {
      "id": "sol-official",
      "title": "Official solution",
      "text": "Официальное решение рассматривает полный граф городов с весами 10, 20, 30 на рёбрах.\n\nЕсли ребро AB имеет вес 10, то для любого третьего города C сумма весов AC и BC не меньше 50,\nиначе треугольник ABC дал бы цикл суммарной стоимости не более 50. Поэтому суммарный вклад всех\nтреугольников, содержащих AB, уже даёт сильную нижнюю оценку.\n\nЗатем вершины A и B удаляются. Если в оставшемся подграфе из 18 вершин больше нет рёбер веса 10,\nто нужная оценка получается сразу. Если ребро веса 10 ещё есть, то из условия на треугольники следует,\nчто рядом с ним возникает много рёбер веса 30; кроме того, из одной вершины не может выходить более одного\nребра веса 10. Эти ограничения снова дают суммарную стоимость больше 3970.\n\nТаким образом, сумма весов всех рёбер полного графа не меньше 3970.",
