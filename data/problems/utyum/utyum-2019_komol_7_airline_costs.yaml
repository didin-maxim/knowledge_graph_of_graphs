  "solutions": [
    {
      "id": "sol-official",
      "title": "Решение",
      "text": "Обозначим через L число рёбер стоимости 10, а через H число рёбер стоимости 30. Рёбра стоимости 20 пусть будут нейтральными. Всего в K_20 ровно 190 рёбер, поэтому суммарная стоимость всех рёбер равна\n20·190 + 10(H - L) = 3800 + 10(H - L).\nДостаточно доказать, что H - L >= 17.\n\nТак как цена 10 действительно встречается, L >= 1. Заметим сначала, что рёбра стоимости 10 не имеют общих концов: если AB и AC стоили бы по 10, то треугольник ABC имел бы стоимость не больше 10 + 10 + 30 = 50, что запрещено.\n\nПусть AB — ребро стоимости 10. Для любого третьего города C хотя бы одно из рёбер AC и BC должно иметь стоимость 30, иначе треугольник ABC стоил бы не больше 10 + 20 + 20 = 50. Если L = 1, то уже отсюда получаем H >= 18, значит H - L >= 17.\n\nЕсли L = 2, пусть рёбра стоимости 10 — это AB и CD. Для каждого из остальных 16 городов X нужно хотя бы одно дорогое ребро из X в пару {A,B} и хотя бы одно дорогое ребро из X в пару {C,D}; это даёт 32 различных дорогих ребра. Кроме того, среди четырёх рёбер AC, AD, BC, BD должно быть хотя бы два дорогих: иначе один из треугольников ABC, ABD, ACD, BCD имел бы стоимость меньше 60. Значит, H >= 34 и тем более H - L >= 17.\n\nНаконец, если L >= 3, посчитаем требования для всех дешёвых рёбер. Для каждого дешёвого ребра и каждого из 18 остальных городов требуется дорогое ребро к одному из его концов. Одно дорогое ребро может обслужить не более двух таких требований, потому что дешёвые рёбра попарно не имеют общих концов. Поэтому 18L <= 2H, то есть H >= 9L. При L >= 3 отсюда H - L >= 8L >= 24.\n\nВо всех случаях H - L >= 17, следовательно, общая стоимость не меньше 3800 + 170 = 3970.",
