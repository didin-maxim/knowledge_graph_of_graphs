        "id": "stmt-original",
        "title": "Statement",
        "text": "В стране 20 городов, и любые два города соединены прямой авиалинией. Стоимость каждого перелёта равна\n10, 20 или 30 тугриков, причём все три цены реально встречаются.\n\nИзвестно, что если вылететь из любого города и после трёх перелётов вернуться в него, то суммарно\nпридётся потратить не меньше 60 тугриков. Докажите, что сумма цен на всех авиалиниях не меньше 3970.",
