        "title": "Оригинальная формулировка",
        "text": "По кругу расставлено 100 красных и 100 синих точек. Петя и Вася ходят по очереди, начинает Петя.\nЗа ход можно соединить отрезком красную точку с синей, если они ещё не соединены.\n\nВыигрывает тот, кто первым получит цикл длины 4. Кто может обеспечить себе победу независимо от действий соперника?",
        "source_id": "src-utyum-2018_komol_7_red_blue_cycle_game-official",
