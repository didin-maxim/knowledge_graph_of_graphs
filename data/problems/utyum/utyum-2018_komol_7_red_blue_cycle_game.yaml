  "solutions": [
    {
      "id": "sol-official",
      "title": "Официальное решение",
      "text": "Ответ: Вася.\n\nВ официальном решении рассматривается двудольный граф, вершинами которого служат красные и синие точки,\nа проведённые отрезки являются рёбрами. Цикл длины 4 может появиться только тогда, когда игрок соединяет\nконцы уже существующей цепи длины 3. Значит, игрок, после хода которого возникает цепь длины 3, фактически\nпроиграл.\n\nПоэтому нельзя присоединять новые рёбра к концам цепи длины 2. Стратегия Васи такова: после каждого хода Пети\nон соединяет ту же красную точку с некоторой синей точкой, которая до этого ни с чем не была соединена.\nПосле каждой пары ходов число изолированных синих точек уменьшается на 2, и после 50 ходов Васи каждая синяя\nточка оказывается концом цепи длины 2. Следующим ходом Петя неизбежно создаёт цепь длины 3 и проигрывает.",
