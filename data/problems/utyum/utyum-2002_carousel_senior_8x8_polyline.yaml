  "solutions": [
    {
      "id": "sol-official",
      "title": "Official solution",
      "text": "Ответ: 80.\n\nРассмотрим граф вершин сетки 9x9 и раскрасим его вершины в шахматном порядке в два цвета. Тогда вершин одного цвета 41, другого 40.\n\nЛюбая ломаная, идущая по линиям сетки, проходит по рёбрам этого двудольного графа, поэтому её последовательные вершины чередуют цвета. Так как ломаная замкнута и не самопересекается, каждая её вершина используется не более одного раза, а число вершин каждого цвета на ней одинаково.\n\nСледовательно, на ломаной можно использовать не более 40 вершин каждого цвета, то есть не более 80 вершин всего. Значит, длина не превосходит 80.\n\nПример ломаной длины 80 существует, следовательно, искомый максимум равен 80.",
