  "solutions": [
    {
      "id": "sol-official",
      "title": "Решение",
      "text": "Доказательство сразу переформулирует задачу в терминах ориентированного графа G на 2007 вершинах.\n\nПервый способ: строится граф G' на том же множестве вершин, где ребро a -> b проводится тогда и\nтолько тогда, когда в исходном графе G существует путь из a в b. В G' между любыми двумя вершинами\nесть хотя бы одно ребро, поэтому в нем существует гамильтонов путь. Затем каждое ребро этого пути\nзаменяется соответствующим путем в исходном графе G. Получается маршрут, проходящий через все вершины.\nЕсли занумеровать вершины в порядке их первого появления на этом маршруте, то вершина с номером 1004\nдостижима из первых 1003 вершин и из нее достижимы последние 1003 вершины.\n\nВторой способ: доказывается лемма, что в любом множестве B вершин найдется вершина b, в которую можно\nпопасть из всех остальных вершин множества B. После этого берут произвольную вершину a. Если из a\nдостижимо менее 1003 вершин, рассматривают множество B вершин, недостижимых из a. В этом множестве\nболее 1004 вершин, и из всех них можно попасть в a. Выбирая вершину b из леммы, получают вершину,\nв которую можно попасть как минимум из 1003 вершин и из которой достижимо больше вершин, чем из a.\nПовторяя процесс, приходят к вершине, удовлетворяющей обоим требованиям.",
