        "title": "Оригинальная формулировка",
        "text": "В стране 2007 городов. Некоторые пары городов соединены дорогами с односторонним движением.\nИзвестно, что для любых двух городов A и B можно проехать либо из A в B, либо из B в A\n(а возможно, и в обоих направлениях), не нарушая правил дорожного движения; при этом маршрут\nможет проходить и через другие города.\n\nДокажите, что найдется город X такой, что из X можно попасть как минимум в 1003 других города\nи в X можно попасть как минимум из 1003 других городов.",
