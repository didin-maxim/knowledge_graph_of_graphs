      "id": "sol-official",
      "title": "Официальное решение",
      "text": "Назовем вершиной точку, где сходятся границы трех стран. По условию из каждой вершины выходит ровно одна закрытая граница.\n\nПредположим, что требуемый замкнутый маршрут существует. Он не пересекает закрытых границ, поэтому каждая закрытая граница либо целиком лежит внутри маршрута, либо целиком снаружи.\n\nТогда все вершины, находящиеся внутри маршрута, разбиваются на пары вершин, соединенных закрытыми границами. Значит, число внутренних вершин четно; обозначим его через k.\n\nМысленно заменим участки границ между вершинами нитями и разрежем каждую такую нить пополам. Из внутренних вершин выходит 3k половинок нитей. Из них ровно 19 ведут наружу, по одной в каждую из 19 стран, через которые маршрут проходит по одному разу.\n\nСледовательно, половинок нитей, получившихся из нитей, целиком лежащих внутри маршрута, будет 3k - 19. Но это число нечетно, тогда как такие половинки должны возникать парами.\n\nПолученное противоречие показывает, что описанный маршрут невозможен.",
