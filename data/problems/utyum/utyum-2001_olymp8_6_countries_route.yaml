        "id": "stmt-original",
        "title": "Оригинальная формулировка",
        "text": "Квадратный материк разделен на 19 стран в форме выпуклых многоугольников, причем нет точек, в которых сходились бы границы четырех или больше стран.\n\nИз всяких трех границ, сходящихся в одной точке, одна закрыта, а две открыты для проезда.\n\nДокажите, что невозможно объехать все эти страны, побывав в каждой по одному разу и вернуться в исходную страну.",
