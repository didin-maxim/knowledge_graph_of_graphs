  "solutions": [
    {
      "id": "sol-official",
      "title": "Official solution",
      "text": "Схема дорог образует дерево: сеть связна, и между любыми двумя городами существует ровно один путь.\n\nЗаметим, что если город A наиболее удалён от города B, то в A ведёт ровно одна дорога. Иначе, придя в A из B, можно было бы пройти ещё дальше по другой дороге, не возвращаясь назад, что противоречит максимальности расстояния от B до A. Такие города назовём окраинными.\n\nУдалим из схемы все окраинные города вместе с инцидентными им дорогами. Ни один центральный город при этом не исчезнет: окраинный город может быть центральным только в вырожденном случае из двух городов, а тогда трёх центральных городов быть не может.\n\nПосле удаления окраинных вершин оставшаяся сеть по-прежнему является деревом, а показатели провинциальности всех оставшихся городов уменьшаются на 1. Следовательно, множество центральных городов не меняется.\n\nПовторяя эту операцию, мы в конце концов сотрем все нецентральные города и получим дерево, состоящее только из центральных. Если бы центральных городов было три, то осталось бы дерево из трёх вершин, то есть путь длины 2. Но у такого дерева центральная вершина только одна, а две крайние являются окраинными.\n\nПолучено противоречие. Значит, трёх центральных городов быть не может.",
