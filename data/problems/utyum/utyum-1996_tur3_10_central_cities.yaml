        "id": "stmt-original",
        "title": "Statement",
        "text": "В некотором государстве города связаны между собой дорогами одинаковой длины так, что из любого города можно попасть в любой другой, но только одним путем.\n\nДля каждого города правительственная комиссия измерила все пути, ведущие из него в другие города, и длину самого протяженного из них назвала показателем провинциальности этого города.\n\nГорода с наименьшим показателем провинциальности были объявлены центральными. Таких городов оказалось три.\n\nДокажите, что комиссия ошиблась.",
