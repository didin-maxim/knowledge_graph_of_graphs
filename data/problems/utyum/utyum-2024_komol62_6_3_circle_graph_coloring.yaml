  "solutions": [
    {
      "id": "sol-official",
      "title": "Решение",
      "text": "Ответ отрицательный; построим пример, который удовлетворяет условию, но не красится в 5 цветов.\n\nРасположим 11 точек на окружности в циклическом порядке и соединим отрезками все пары точек, кроме соседних на окружности. Иначе говоря, единственные несоединённые пары — это пары соседних точек 11-цикла.\n\nПроверим условие задачи. Среди любых шести выбранных точек обязательно найдутся две соседние на окружности: если бы соседних не было, то выбранные точки образовывали бы независимое множество в цикле из 11 вершин, а в таком цикле можно выбрать без соседства не более пяти вершин. Эта соседняя пара как раз не соединена отрезком, значит условие про любые шесть точек выполнено.\n\nТеперь покажем, что правильная 5-раскраска невозможна. При раскраске 11 точек в 5 цветов по принципу Дирихле какой-то цвет получил бы не меньше трёх точек. Точки одного цвета не должны быть соединены отрезками, то есть эти три точки должны быть попарно несоединёнными в нашем графе. Но попарно несоединённые пары в нём — только соседние пары исходного 11-цикла, а трёх попарно соседних различных вершин в простом цикле нет. Эквивалентно, независимое множество построенного графа имеет размер не больше 2.\n\nЗначит, существует допустимое расположение отрезков, которое нельзя правильно окрасить в 5 цветов.",
