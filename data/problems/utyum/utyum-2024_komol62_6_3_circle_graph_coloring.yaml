        "title": "Оригинальная формулировка",
        "text": "На окружности выбрано 11 точек. Некоторые пары точек соединены отрезками.\n\nИзвестно, что среди любых шести точек найдутся две, не соединённые отрезком.\n\nВерно ли, что эти 11 точек всегда можно окрасить в 5 цветов так, чтобы никакой отрезок не соединял точки одного цвета?",
