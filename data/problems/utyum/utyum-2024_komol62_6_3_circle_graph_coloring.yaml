  "solutions": [
    {
      "id": "sol-official",
      "title": "Official solution",
      "text": "Официальное решение строит контрпример.\n\nСоединяются все пары точек, кроме соседних на окружности. Тогда среди любых шести точек действительно найдутся две соседние, а значит не соединённые.\n\nНо правильная раскраска в 5 цветов невозможна: по принципу Дирихле найдутся три точки одного цвета, а в построенном графе нет трёх попарно несмежных вершин.\n\nЗначит, ответ отрицательный.",
