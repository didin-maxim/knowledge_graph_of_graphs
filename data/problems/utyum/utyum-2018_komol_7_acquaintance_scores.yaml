  "solutions": [
    {
      "id": "sol-official",
      "title": "Официальное решение",
      "text": "Ответ: может.\n\nВ официальном решении приводится явная конструкция графа знакомств. Три мальчика с оценками 9 знакомы\nтолько с двумя девочками с оценками 10, а два мальчика с оценками 1 знакомы только с тремя девочками\nс оценками 2. Тогда у каждой девочки есть хотя бы два знакомых мальчика, у каждого мальчика — хотя бы\nдве знакомых девочки, и при этом каждый мальчик имеет оценку ниже оценок всех знакомых ему девочек.\n\nСредняя оценка мальчиков равна 5.8, а средняя оценка девочек равна 5.2, так что требуемая ситуация\nдействительно возможна.",
