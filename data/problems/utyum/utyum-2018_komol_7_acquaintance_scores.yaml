        "title": "Оригинальная формулировка",
        "text": "Группа из пяти мальчиков и пяти девочек сдавала тест, за который каждому ставилась оценка от 1 до 10.\nУ каждой девочки есть хотя бы два знакомых мальчика, а у каждого мальчика есть хотя бы две знакомых девочки.\nКаждый мальчик получил оценку ниже, чем каждая из знакомых ему девочек.\n\nМожет ли средняя оценка мальчиков оказаться выше, чем средняя оценка девочек?",
        "source_id": "src-utyum-2018_komol_7_acquaintance_scores-official",
