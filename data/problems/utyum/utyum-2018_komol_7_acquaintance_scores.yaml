        "id": "stmt-graph",
        "title": "Графовая формулировка",
        "text": "Дан двудольный граф между пятью мальчиками и пятью девочками; степень каждой вершины не меньше 2. Каждому участнику приписана оценка от 1 до 10, причём оценка каждого мальчика меньше оценки каждой смежной с ним девочки. Может ли средняя оценка мальчиков быть больше средней оценки девочек?",
