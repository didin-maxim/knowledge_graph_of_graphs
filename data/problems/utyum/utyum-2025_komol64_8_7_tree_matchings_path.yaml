      "id": "sol-official",
      "title": "Официальное решение",
      "text": "Официальное решение проводит индукцию по числу вершин и оценивает максимальное число толстых паросочетаний.\n\nИспользуется двудольность дерева: вершины разбиваются на две доли, и каждое толстое паросочетание занимает по n - 1 вершине в каждой доле.\n\nДалее анализируются возможные размеры долей и висячие вершины. В каждом случае число толстых паросочетаний не превосходит нужной биномиальной оценки.\n\nСлучай равенства приводит к крайне жёсткой структуре, и оказывается, что единственным деревом, достигающим оценки, является путь.\n\nДля 80 вершин это даёт требуемый вывод.",
