    {
      "id": "sol-official",
      "title": "Решение",
      "text": "Докажем более общее утверждение. В любом дереве на 2n вершинах число паросочетаний из n - 1 рёбер не превосходит C(n + 1, 2). Если n >= 3 и равенство достигается, то дерево является путём. Для n = 2 равенство дают два дерева на четырёх вершинах: путь P_4 и звезда K_{1,3}.\n\nПри n = 2 дерево на четырёх вершинах имеет три ребра, и паросочетание из одного ребра можно выбрать ровно тремя способами; это равно C(3, 2).\n\nПусть n >= 3, и утверждение уже доказано для меньших n. Рассмотрим дерево T на 2n вершинах и его двудольное разбиение V_1, V_2. Каждое паросочетание из n - 1 рёбер занимает ровно n - 1 вершин в каждой доле. Поэтому, если такие паросочетания существуют, размеры долей могут быть только n - 1 и n + 1 либо n и n.\n\nСначала пусть |V_1| = n + 1, |V_2| = n - 1. Тогда каждое нужное паросочетание оставляет непокрытыми две вершины из V_1. После выбора этих двух вершин оставшийся лес имеет не более одного совершенного паросочетания: в лесу оно, если существует, единственно, потому что лист обязан быть покрыт единственным ребром, и дальше можно удалять такие вынужденные рёбра. Значит, всего паросочетаний не больше C(n + 1, 2).\n\nПокажем, что при n >= 3 равенства в этом случае быть не может. В доле V_2 всего n - 1 вершин, а сумма их степеней равна числу рёбер дерева, то есть 2n - 1. Поэтому в V_2 есть вершина x степени не больше 2. Если бы равенство достигалось, то для любой пары вершин из V_1 существовало бы паросочетание, оставляющее непокрытой именно эту пару. Выберем пару, содержащую всех соседей x (если соседей меньше двух, добавим произвольные вершины из V_1). После удаления такой пары вершина x остаётся изолированной, и покрыть её паросочетанием невозможно. Противоречие. Случай |V_1| = n - 1, |V_2| = n + 1 симметричен.\n\nОстаётся случай |V_1| = |V_2| = n. Подвесим дерево за любую вершину и возьмём лист v на максимальной глубине; пусть u — его сосед. Считаем, что v лежит в V_1.\n\nЕсли у u есть ещё один висячий сосед w, то вершины v и w нельзя одновременно покрыть: обе соединены только с u. Значит, любое паросочетание оставляет непокрытой одну из вершин v, w и одну вершину из V_2, причём вершину u оставлять непокрытой нельзя, иначе обе v и w остались бы без пары. Для каждой пары непокрытых вершин паросочетание в лесу единственно, поэтому таких паросочетаний не больше 2(n - 1), а это строго меньше C(n + 1, 2) при n >= 3.\n\nПусть теперь других висячих соседей у u нет. Так как v выбран на максимальной глубине, у u нет и других сыновей: иначе под ними был бы лист не меньшей глубины, а если этот сын сам лист, мы попали бы в предыдущий случай. Следовательно, после удаления u и v остаётся дерево T' на 2n - 2 вершинах с равными долями.\n\nРазделим нужные паросочетания T на два типа. Первый тип не содержит вершину v; тогда v — непокрытая вершина из V_1, а в V_2 остаётся непокрытой ровно одна вершина. Её можно выбрать не более чем n способами, и для каждого выбора паросочетание, если существует, единственно. Поэтому паросочетаний первого типа не больше n.\n\nВторой тип содержит ребро uv. После удаления этого ребра остаётся паросочетание из n - 2 рёбер в дереве T'. По предположению индукции таких паросочетаний не больше C(n, 2). Итак,\n\n  число паросочетаний в T <= n + C(n, 2) = C(n + 1, 2).\n\nТеперь разберём случай равенства. Тогда паросочетаний первого типа ровно n, второго типа ровно C(n, 2), а для T' достигается равенство в индукционном утверждении. Так как доли T' равны, исключительный случай звезды K_{1,3} при n - 1 = 2 невозможен; значит, T' является путём. Обозначим его a_1a_2...a_{2n-2}.\n\nЕсли u присоединена к концу этого пути, то T само является путём. Предположим, что u присоединена к внутренней вершине пути. Тогда одна из вершин a_2 и a_{2n-3} лежит в доле V_2 дерева T. Если это a_2, то после удаления v и a_2 вершина a_1 становится изолированной, поэтому паросочетания, оставляющего непокрытыми именно v и a_2, не существует. Если это a_{2n-3}, то после удаления v и a_{2n-3} вершина a_{2n-2} становится изолированной. В обоих случаях паросочетаний первого типа меньше n, что противоречит равенству. Значит, u присоединена к концу пути, и T — путь.\n\nОбщее утверждение доказано. В исходной задаче 80 = 2 * 40, поэтому число толстых паросочетаний не превосходит\n\n  C(41, 2) = 820.\n\nПо условию их ровно 820, то есть достигается равенство при n = 40 >= 3. Следовательно, дерево T является путём.",
