        "id": "stmt-original",
        "title": "Оригинальная формулировка",
        "text": "В стране n городов, один из которых является столицей. Между некоторыми парами городов налажено авиасообщение.\n\nРасстояние между городами — это минимальное число перелётов, нужное для пути между ними.\n\nПравительство хочет закрыть часть авиалиний так, чтобы расстояние от столицы до любого города не изменилось. Известно, что число способов сделать это нечётно.\n\nДокажите, что нельзя стартовать из какого-то города, совершить нечётное число перелётов и вернуться в него.",
        "source_id": "src-utyum-2024_komol63_67_capital_flights_bipartite-official",
