        "title": "Графовая формулировка",
        "text": "Дан связный граф \\(G\\) с выделенной вершиной \\(r\\). Назовём подграф \\(H\\) на том же множестве вершин допустимым, если для каждой вершины \\(v\\) расстояние от \\(r\\) до \\(v\\) в \\(H\\) равно расстоянию от \\(r\\) до \\(v\\) в \\(G\\). Известно, что число допустимых подграфов нечётно. Докажите, что \\(G\\) не содержит циклов нечётной длины.",
