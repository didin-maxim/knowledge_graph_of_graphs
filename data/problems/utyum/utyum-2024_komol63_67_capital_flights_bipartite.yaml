        "title": "Графовая формулировка",
        "text": "Дан связный граф с выделенной вершиной-столицей. Рассматриваются подграфы, в которых расстояние от столицы до каждой вершины совпадает с расстоянием в исходном графе. Известно, что число таких подграфов нечётно. Докажите, что в исходном графе нет цикла нечётной длины.",
