  "solutions": [
    {
      "id": "sol-official",
      "title": "Решение",
      "text": "В доказательстве вводится граф авиалиний с выделенной вершиной-столицей.\n\nВершины разбиваются на ярусы по расстоянию от столицы. Рёбра могут идти либо внутри одного яруса, либо между соседними ярусами.\n\nЕсли бы существовало ребро внутри яруса, то включение или исключение этого ребра не влияло бы на сохранение расстояний от столицы. Тогда допустимые множества удаляемых рёбер разбивались бы на пары, и их число было бы чётным — противоречие.\n\nЗначит, рёбер внутри одного яруса нет. Тогда все рёбра идут между ярусами разной чётности, то есть граф двудольный и нечётных циклов в нём нет.\n\nУточнение: если ребро соединяет две вершины одного BFS-яруса, то ни один кратчайший путь от столицы не обязан использовать это ребро; переключение только этого ребра разбивает допустимые наборы удаляемых рёбер на пары.",
