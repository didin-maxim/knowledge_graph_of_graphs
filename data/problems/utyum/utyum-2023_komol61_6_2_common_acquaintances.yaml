      "id": "sol-official",
      "title": "Официальное решение",
      "text": "Предположим противное: найдутся пять человек, у которых не более пяти общих знакомых.\n\nТогда можно рассмотреть десятку, состоящую из этих пяти человек и всех их общих знакомых.\n\nПо условию у этой десятки есть ещё один общий знакомый среди остальных. Но тогда у исходных пяти человек нашёлся бы ещё один общий знакомый, сверх перечисленных.\n\nПолучается противоречие, значит у любых пяти человек действительно есть не менее шести общих знакомых.",
