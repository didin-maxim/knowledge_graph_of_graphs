      "id": "sol-official",
      "title": "Решение",
      "text": "Возьмём произвольных пять человек и обозначим это множество через \\(A\\). Нужно доказать, что вне \\(A\\) есть хотя бы шесть человек, знакомых со всеми людьми из \\(A\\).\n\nПредположим противное: общих знакомых у этой пятёрки не больше пяти. Обозначим множество всех этих общих знакомых через \\(B\\), где \\(|B|\\le5\\). Дополним множество \\(A\\cup B\\) до десяти человек: если в нём меньше десяти человек, добавим произвольных людей из компании, пока не получится десятка \\(D\\). Это можно сделать, потому что всего людей 100.\n\nПо условию у любых десяти человек есть общий знакомый среди остальных, значит у десятки \\(D\\) есть человек \\(x\\notin D\\), знакомый со всеми людьми из \\(D\\). В частности, \\(x\\) знаком со всеми пятью людьми из \\(A\\). Поэтому \\(x\\) является общим знакомым исходной пятёрки.\n\nНо все общие знакомые пятёрки \\(A\\) были включены в \\(B\\), а \\(B\\subset D\\). Получается, что \\(x\\in B\\subset D\\) и одновременно \\(x\\notin D\\), противоречие.\n\nЗначит, наше предположение неверно, и любые пять человек имеют не менее шести общих знакомых среди остальных.",
