        "title": "Оригинальная формулировка",
        "text": "В первый класс пришли 25 школьников. Некоторые дети знакомы друг с другом, а некоторые нет.\n\nИзвестно, что среди любых четырех школьников есть две непересекающиеся пары знакомых между собой.\n\nКакое наименьшее число пар знакомых школьников могло быть среди пришедших?",
