  "solutions": [
    {
      "id": "sol-official",
      "title": "Решение",
      "text": "Ответ: 275.\n\nВ Доказательство сначала выводится оценка снизу. Если бы какой-то школьник был незнаком хотя бы с тремя другими,\nто в четверке из него и этих троих не было бы двух непересекающихся знакомых пар. Значит, каждый школьник незнаком не\nболее чем с двумя другими. Тогда пар незнакомых не более 25, а всего пар школьников C(25,2) = 300, поэтому знакомых пар\nне меньше 300 - 25 = 275.\n\nЗатем приводится пример, достигающий этой оценки: 25 школьников сажают по кругу и знакомят всех, кроме соседей по\nкругу. Тогда у каждого ровно два незнакомых, а среди любых четырех школьников действительно найдутся две\nнепересекающиеся пары знакомых.\n\nСледовательно, минимальное число пар знакомых равно 275.",
