    {
      "id": "sol-official",
      "title": "Решение",
      "text": "Можно считать, что между каждой парой вершин проведено ровно одно ориентированное ребро: если какого-то ребра нет, добавим его в любом направлении. От добавления рёбер условие задачи не портится, поэтому достаточно доказать оценку для полученного турнира.\n\nДокажем утверждение индукцией по k. При k=1 условие означает, что у каждой вершины есть входящее ребро. Турнир на одной или двух вершинах таким свойством не обладает, значит n >= 3 = 2^(1+1)-1.\n\nПусть k>1, и пусть v — вершина максимальной исходящей степени. Обозначим через A множество вершин, из которых ребро идёт в v, а через B множество вершин, в которые ребро идёт из v. Тогда остальные вершины разбиты на A и B.\n\nСначала покажем, что |A| >= k. Если бы |A| <= k-1, можно было бы выбрать k вершин так, чтобы среди них были v и все вершины из A. По условию нашлась бы внешняя вершина u, из которой идут рёбра во все выбранные вершины, в частности в v. Тогда u должна лежать в A, но все вершины A уже выбраны, противоречие.\n\nТеперь проверим, что подтурнир на A удовлетворяет тому же условию с параметром k-1. Возьмём любые k-1 вершин C из A. Для k-множества C ∪ {v} по исходному условию существует вершина u вне C ∪ {v}, из которой идут рёбра во все вершины этого множества. Так как u -> v, вершина u лежит в A; при этом u не лежит в C. Значит, в подтурнире на A для любого (k-1)-множества C есть внешняя вершина из A, доминирующая C.\n\nПо предположению индукции |A| >= 2^k - 1. С другой стороны, у v максимальная исходящая степень, поэтому |B| не меньше средней исходящей степени турнира, равной (n-1)/2. Так как n = |A| + |B| + 1, из |B| >= (n-1)/2 следует |B| >= |A|. Поэтому\nn = |A| + |B| + 1 >= 2|A| + 1 >= 2(2^k - 1) + 1 = 2^(k+1) - 1.\n\nТребуемая нижняя оценка доказана.",
