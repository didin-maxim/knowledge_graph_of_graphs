        "title": "Оригинальная формулировка",
        "text": "Дан граф G на n вершинах и натуральное число k < n.\n\nРёбра графа ориентированы так, что для любого набора A из k вершин найдётся вершина v вне A, из которой во все вершины набора A идут ориентированные рёбра.\n\nДокажите, что n >= 2^(k+1) - 1.",
