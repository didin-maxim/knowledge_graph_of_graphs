  "solutions": [
    {
      "id": "sol-official",
      "title": "Официальное решение",
      "text": "В официальном решении можно считать граф полным: добавление ориентированных рёбер условие не портит.\n\nДалее проводится индукция по k.\n\nВыбирается вершина v с максимальной исходящей степенью. Множество остальных вершин разбивается на A — вершины, из которых рёбра идут в v, и B — вершины, в которые рёбра идут из v.\n\nПоказывается, что |A| > k - 1 и что множество A само удовлетворяет аналогичному условию уже для параметра k - 1.\n\nПо предположению индукции |A| >= 2^k - 1, а из максимальности степени также |B| >= (n - 1)/2. В итоге получается оценка n >= 2^(k+1) - 1.",
