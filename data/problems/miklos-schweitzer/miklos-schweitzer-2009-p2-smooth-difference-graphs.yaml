        "id": "stmt-graph",
        "title": "Графовая формулировка",
        "text": "Нужно понять, какие графы порядка \\(m\\) могут возникать как графы разностей на конечном множестве целых чисел, если разрешенные разности имеют простые делители только из фиксированного конечного набора. В частности, спрашивается о реализуемости полного графа и связного графа максимальной степени 2.",
