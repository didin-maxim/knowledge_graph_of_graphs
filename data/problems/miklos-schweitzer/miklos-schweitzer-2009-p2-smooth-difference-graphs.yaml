  "solutions": [
    {
      "id": "sol-komal-expanded-ai",
      "title": "Остатки по новому простому и путь из степенных сумм",
      "text": "Обозначим \\(P=p_1p_2\\cdots p_k\\).\n\n(i) Ответ отрицательный. Пусть \\(q\\) - простое число, не входящее в список \\(p_1,\\ldots,p_k\\). Если \\(|A|>q\\), то по принципу Дирихле среди элементов \\(A\\) найдутся два различных числа \\(a,b\\), сравнимых по модулю \\(q\\). Тогда \\(q\\mid a-b\\), а значит у ненулевой разности \\(a-b\\) есть простой делитель \\(q\\), которого нет среди разрешенных простых. Следовательно, \\(a-b\\notin S\\), и эти две вершины не соединены ребром. Поэтому для \\(m=q+1\\) граф \\(\\mathcal G(A)\\) не может быть полным ни при каком \\(A\\), так что полного графа для всех \\(m\\ge3\\) не существует.\n\n(ii) Ответ положительный. Для заданного \\(m\\) положим\n\\[\na_n=P+P^2+\\cdots+P^n\\qquad(1\\le n\\le m)\n\\]\nи возьмем \\(A=\\{a_1,a_2,\\ldots,a_m\\}\\). Для соседних индексов имеем \\(a_{n+1}-a_n=P^{n+1}\\in S\\), поэтому ребра \\(a_na_{n+1}\\) присутствуют.\n\nОсталось проверить, что других ребер нет. Если \\(N\\ge n+2\\), то\n\\[\na_N-a_n=P^{n+1}(1+P+\\cdots+P^{N-n-1}).\n\\]\nВторой множитель больше 1. При этом он не делится ни на одно из чисел \\(p_i\\), потому что \\(P\\equiv0\\pmod {p_i}\\), откуда \\(1+P+\\cdots+P^{N-n-1}\\equiv1\\pmod {p_i}\\). Значит, у этого множителя есть простой делитель, отличный от всех \\(p_1,\\ldots,p_k\\). Тогда и вся разность \\(a_N-a_n\\) имеет запрещенный простой делитель, следовательно, \\(a_N-a_n\\notin S\\).\n\nИтак, в \\(\\mathcal G(A)\\) есть ровно ребра между соседними элементами последовательности \\(a_1,a_2,\\ldots,a_m\\). Этот граф является путем на \\(m\\) вершинах, значит он связен, а все его степени не превосходят 2.",
