        "id": "stmt-original",
        "title": "Граф на множестве целых чисел",
        "text": "Пусть \\(p_1,\\ldots,p_k\\) - простые числа, а \\(S\\) - множество целых чисел, все простые делители которых принадлежат множеству \\(\\{p_1,\\ldots,p_k\\}\\). Для конечного множества целых чисел \\(A\\) обозначим через \\(\\mathcal G(A)\\) граф с вершинами из \\(A\\), где \\(a\\) и \\(b\\) соединены ребром тогда и только тогда, когда \\(a-b\\in S\\). Верно ли, что для каждого \\(m\\ge 3\\) существует \\(m\\)-элементное множество \\(A\\), для которого: (i) \\(\\mathcal G(A)\\) полон; (ii) \\(\\mathcal G(A)\\) связен, но все степени не превосходят 2?",
        "source_id": "src-miklos-schweitzer-2009-p2-official",
        "status": "needs_human_review",
