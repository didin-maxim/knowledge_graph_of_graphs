        "title": "Графовая формулировка",
        "text": "На каждой карточке задана правильная раскраска ребер полного графа \\(K_{17}\\) в \\(105=\\binom{15}{2}\\) цветов. Для каждого 15-элементного множества вершин хотя бы в одной из раскрасок индуцированный \\(K_{15}\\) должен быть радужным. Нужно определить минимальное число таких раскрасок.",
