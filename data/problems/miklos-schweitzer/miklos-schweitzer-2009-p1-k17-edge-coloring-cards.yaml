    {
      "id": "sol-ai-expanded-official-report",
      "title": "Ответ 34 через разбиение рёбер \\(K_{17}\\) на четырёхциклы",
      "text": "Ответ: \\(34\\).\n\nСначала построим колоду из 34 карточек. Пронумеруем вершины по модулю 17. Рёбра \\(K_{17}\\) разбиваются на 34 цикла длины 4. Действительно, возьмём два базовых цикла \\((1,2,10,8,1)\\) и \\((3,6,12,8,3)\\) в нумерации \\(1,\\ldots,17\\). Длины их восьми рёбер по окружности равны соответственно \\(1,8,2,7,3,6,4,5\\), то есть встречаются все возможные расстояния между двумя вершинами 17-угольника. Поэтому все 17 циклических сдвигов этих двух циклов дают попарно непересекающиеся по рёбрам четырёхциклы, покрывающие все \\(\\binom{17}{2}=136\\) рёбер.\n\nПусть один из этих циклов равен \\(C=(a,b,c,d,a)\\), а \\(X\\) -- множество остальных 13 вершин. Построим соответствующую карточку. Четыре ребра цикла \\(ab,bc,cd,da\\) покрасим цветом 1. Для каждой вершины \\(x\\in X\\) покрасим рёбра \\(ax\\) и \\(cx\\) одинаковым цветом, причём для разных \\(x\\) используем цвета \\(2,3,\\ldots,14\\). Аналогично рёбра \\(bx\\) и \\(dx\\) покрасим цветами \\(15,16,\\ldots,27\\). Все рёбра внутри \\(X\\) покрасим попарно различными цветами \\(28,29,\\ldots,105\\). Две диагонали \\(ac\\) и \\(bd\\) можно покрасить произвольно.\n\nЭта карточка делает радужными ровно нужные нам 15-вершинные множества, полученные удалением концов одного из четырёх рёбер цикла \\(C\\). Например, если удалить \\(a\\) и \\(b\\), то остаются вершины \\(X\\cup\\{c,d\\}\\): внутри \\(X\\) стоят цвета \\(28,\\ldots,105\\), рёбра из \\(c\\) в \\(X\\) имеют цвета \\(2,\\ldots,14\\), рёбра из \\(d\\) в \\(X\\) имеют цвета \\(15,\\ldots,27\\), а ребро \\(cd\\) имеет цвет 1. Значит, все \\(105\\) рёбер имеют разные цвета. Для удаления \\(b,c\\), \\(c,d\\) или \\(d,a\\) проверка такая же. Так как четырёхциклы разбивают все пары вершин, для любой пары удалённых вершин найдётся карточка, на которой оставшийся \\(K_{15}\\) радужен. Следовательно, 34 карточек достаточно.\n\nДокажем, что меньше нельзя. Зафиксируем одну карточку. Назовём ребро уникальным, если его цвет не встречается на этой карточке больше нигде. Если на карточке есть радужное 15-вершинное множество \\(S\\), то среди \\(105\\) рёбер внутри \\(S\\) все цвета различны. Вне \\(S\\) находится ровно \\(136-105=31\\) ребро, поэтому повториться вне \\(S\\) могут цвета не более чем у 31 ребра из \\(S\\). Значит, на карточке есть по крайней мере \\(105-31=74\\) уникальных ребра. Так как \\(74>\\binom{12}{2}\\), множество \\(V\\) всех концов уникальных рёбер имеет не меньше 13 вершин.\n\nЛюбое радужное 15-вершинное множество на этой карточке обязано содержать все вершины из \\(V\\). В самом деле, радужный \\(K_{15}\\) имеет \\(105\\) рёбер и использует \\(105\\) цветов, то есть каждый цвет встречается в нём ровно один раз; если цвет некоторого ребра уникален на всей карточке, то это ребро должно входить в этот \\(K_{15}\\).\n\nТеперь возможны три случая. Если \\(|V|=15\\), то радужное множество может быть только одним. Если \\(|V|=14\\), то к \\(V\\) можно добавить только одну из трёх оставшихся вершин, значит, радужных множеств не больше трёх. Остаётся \\(|V|=13\\). Тогда каждое радужное множество получается добавлением к \\(V\\) пары из четырёх оставшихся вершин. Если бы таких пар было хотя бы пять, то среди четырёх оставшихся вершин нашлись бы три вершины \\(x,y,z\\), любые две из которых вместе с \\(V\\) дают радужное множество. Тогда все рёбра внутри \\(V\\) и все рёбра из \\(x,y,z\\) в \\(V\\) имели бы попарно разные цвета: различие для каждой пары вершин из \\(x,y,z\\) следует из радужности соответствующего \\(V\\cup\\{x,y\\}\\), \\(V\\cup\\{x,z\\}\\) или \\(V\\cup\\{y,z\\}\\). Таких рёбер \\(\\binom{13}{2}+3\\cdot13=117\\), что больше числа цветов \\(105\\), противоречие.\n\nИтак, одна карточка может покрыть не более четырёх 15-вершинных множеств. Всего таких множеств \\(\\binom{17}{15}=\\binom{17}{2}=136\\), поэтому требуется не менее \\(136/4=34\\) карточек. Вместе с построением это даёт минимум \\(34\\).",
