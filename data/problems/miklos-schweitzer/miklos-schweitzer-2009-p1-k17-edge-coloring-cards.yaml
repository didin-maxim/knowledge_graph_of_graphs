        "title": "Колода раскрашенных 17-угольников",
        "text": "На каждой карточке изображен правильный 17-угольник со всеми сторонами и диагоналями; вершины занумерованы от 1 до 17. На каждой карточке все ребра раскрашены цветами \\(1,2,\\ldots,105\\). Требуется, чтобы для любых 15 вершин 17-угольника на хотя бы одной карточке все \\(105\\) ребер между этими 15 вершинами имели попарно различные цвета. Найдите минимальное число карточек в колоде.",
