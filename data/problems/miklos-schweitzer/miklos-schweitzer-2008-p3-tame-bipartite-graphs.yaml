        "id": "stmt-original",
        "title": "Условие",
        "text": "Двудольный граф с долями вершин \\(\\{x_1,\\ldots,x_n\\}\\) и \\(\\{y_1,\\ldots,y_n\\}\\), то есть с ребрами вида \\(x_i y_j\\), назовем ручным, если в нем нет пути \\(x_i y_j x_k y_\\ell\\), где \\(i,j,k,\\ell\\in\\{1,\\ldots,n\\}\\), \\(j<\\ell\\) и \\(i+j>k+\\ell\\). Найдите инфимум тех вещественных чисел \\(\\alpha\\), для которых существует константа \\(c=c(\\alpha)>0\\) такая, что для всех ручных графов \\(e\\le c n^\\alpha\\), где \\(e\\) - число ребер, а \\(n\\) - половина числа вершин.",
