  "solutions": [
    {
      "id": "sol-ai-small-large-edges",
      "title": "ИИ-решение: конструкция и оценка через малые и большие рёбра",
      "text": "Ответ: \\(3/2\\).\n\nСначала построим ручные графы с \\(\\Omega(n^{3/2})\\) рёбрами. Пусть \\(s=\\lfloor\\sqrt n\\rfloor\\). Соединим \\(x_i\\) с \\(y_j\\), если \\(1\\le i\\le s^2\\) и\n\\[\n\\left\\lfloor\\frac{i-1}{s}\\right\\rfloor\\equiv j-1\\pmod s.\n\\]\nДля каждого \\(y_j\\) получается ровно \\(s\\) соседей, значит \\(e=ns\\ge n^{3/2}-n\\). Проверим ручность. Если \\(x_i y_j x_k y_\\ell\\) -- путь в этом графе, то\n\\[\n\\left\\lfloor\\frac{i-1}{s}\\right\\rfloor=\\left\\lfloor\\frac{k-1}{s}\\right\\rfloor,\n\\qquad\nj\\equiv \\ell\\pmod s.\n\\]\nОтсюда \\(|i-k|<s\\), а если \\(j<\\ell\\), то \\(\\ell-j\\ge s\\). Поэтому \\(i-k<\\ell-j\\), то есть \\(i+j<k+\\ell\\). Запрещённого пути нет, граф ручной. Следовательно, для любого \\(\\alpha<3/2\\) не может существовать универсальная оценка \\(e\\le c n^\\alpha\\).\n\nТеперь докажем верхнюю оценку \\(O(n^{3/2})\\). Снова положим \\(s=\\lfloor\\sqrt n\\rfloor\\). Назовём ребро \\(x_k y_j\\) малым, если для любого ребра \\(x_i y_j\\) выполнено \\(i<k+s\\). Иначе назовём его большим. При фиксированном \\(y_j\\) малых рёбер не больше \\(s\\): если \\(M\\) -- максимальный индекс соседа \\(y_j\\), то малые рёбра могут идти только из строк \\(M-s+1,M-s+2,\\ldots,M\\). Значит, всего малых рёбер не больше \\(ns\\).\n\nОценим большие рёбра. Пусть \\(x_k y_j\\) -- большое ребро. Тогда существует ребро \\(x_i y_j\\) с \\(i\\ge k+s\\). Если у \\(x_k\\) есть ещё ребро \\(x_k y_\\ell\\) с \\(\\ell>j\\), то \\(x_i y_j x_k y_\\ell\\) является путём. Ручность графа даёт \\(i+j\\le k+\\ell\\), поэтому \\(\\ell-j\\ge i-k\\ge s\\). Значит, при фиксированном \\(x_k\\) индексы \\(j\\), для которых \\(x_k y_j\\) является большим ребром, попарно отличаются как минимум на \\(s\\). Таких индексов не больше \\(n/s+1\\). Следовательно, больших рёбер не больше \\(n(n/s+1)=n^2/s+n\\).\n\nИтак,\n\\[\ne\\le ns+\\frac{n^2}{s}+n=O(n^{3/2}).\n\\]\nНапример, при \\(n\\ge1\\) из \\(s=\\lfloor\\sqrt n\\rfloor\\) следует грубая оценка \\(e\\le4n^{3/2}\\). Поэтому для \\(\\alpha=3/2\\) уже существует подходящая константа, а вместе с построением снизу инфимум равен \\(3/2\\).",
      "idea_ids": [
        "idea-upper-and-construction"
      ],
