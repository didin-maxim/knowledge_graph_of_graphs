  "statements": {
    "original": [
      {
        "id": "stmt-original",
        "title": "Условие",
        "text": "Двудольный граф с долями вершин \\(\\{x_1,\\ldots,x_n\\}\\) и \\(\\{y_1,\\ldots,y_n\\}\\), то есть с ребрами вида \\(x_i y_j\\), назовем ручным, если в нем нет пути \\(x_i y_j x_k y_\\ell\\), где \\(i,j,k,\\ell\\in\\{1,\\ldots,n\\}\\), \\(j<\\ell\\) и \\(i+j>k+\\ell\\). Найдите инфимум тех вещественных чисел \\(\\alpha\\), для которых существует константа \\(c=c(\\alpha)>0\\) такая, что для всех ручных графов \\(e\\le c n^\\alpha\\), где \\(e\\) - число ребер, а \\(n\\) - половина числа вершин.",
        "source_id": "src-miklos-schweitzer-2008-p3-official",
        "status": "source_verified",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [
          "bipartite_graph",
          "path"
        ]
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "title": "Экстремальная формулировка",
        "text": "Определить точный показатель роста максимального числа ребер в упорядоченных двудольных графах на \\(n+n\\) вершинах, запрещающих специальный упорядоченный путь длины 3.",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [
          "bipartite_graph",
          "path"
        ],
        "distinct_from": [
          "stmt-original"
        ]
      }
    ],
    "olympiad_reformulations": []
  },
  "ideas": [
    {
      "id": "idea-ordered-forbidden-path",
      "title": "Читать запрет как условие монотонности соседств",
      "text": "Запрещенный путь говорит: если два ребра имеют общий промежуточный переход через \\(y_j\\) и \\(x_k\\), то при переходе к большему индексу \\(\\ell\\) нельзя получить слишком большой сдвиг суммы индексов. Это должно ограничивать форму множеств соседей в матрице смежности.",
      "tags": [
        "extremal_graph_theory",
        "forbidden_triangle"
      ],
      "status": "needs_human_review"
    },
    {
      "id": "idea-upper-and-construction",
      "title": "Нужны обе стороны для показателя",
      "text": "Так как требуется инфимум \\(\\alpha\\), задача просит не только верхнюю оценку на \\(e\\), но и семейство ручных графов с большим числом ребер, показывающее оптимальность показателя.",
      "tags": [
        "goal_exact_bound",
        "construction"
      ],
      "status": "needs_human_review"
    }
  ],
