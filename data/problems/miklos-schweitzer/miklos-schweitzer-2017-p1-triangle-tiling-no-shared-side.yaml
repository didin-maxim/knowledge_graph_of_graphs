        "id": "stmt-graph",
        "title": "Планарная модель",
        "text": "Постройте плоский граф, вершинами которого являются вершины всех треугольников и точки разбиения сторон, а ребрами - минимальные отрезки сторон треугольников между соседними такими вершинами. Нужно решить, может ли этот плоский граф быть графом разбиения квадрата на треугольные плитки, если ни одна полная сторона одной треугольной плитки не является полной стороной другой.",
