  "solutions": [
    {
      "id": "sol-goeritz-kirchhoff-parity",
      "title": "Через матрицу Гёрлица и теорему Кирхгофа",
      "text": "Обозначим \\(G=\\Gamma_B(D)\\). Будем считать \\(G\\) плоским мультиграфом; петли возможны, но они не входят ни в одно остовное дерево и не влияют на редуцированный лапласиан.\n\nПо матричной теореме Кирхгофа о деревьях число остовных деревьев \\(G\\) равно\n\\[\n\\tau(G)=\\det L^{\\ast},\n\\]\nгде \\(L^{\\ast}\\) - матрица, полученная из лапласиана \\(G\\) удалением одной строки и одного столбца.\n\nТеперь вспомним стандартный факт из теории диаграмм узлов. После выбора шахматной раскраски диаграмме соответствует знаковая матрица Гёрлица \\(Q^{\\ast}\\), тоже редуцированная удалением одной области, и\n\\[\n|\\det Q^{\\ast}|=\\det K,\n\\]\nгде \\(\\det K=|\\Delta_K(-1)|\\) - определитель узла. В матрице Гёрлица каждое ребро Tait-графа входит с коэффициентом \\(+1\\) или \\(-1\\) в зависимости от локального знака перекрестка. Поэтому по модулю \\(2\\) знаки исчезают, и \\(Q^{\\ast}\\) совпадает с редуцированным лапласианом \\(L^{\\ast}\\) графа \\(G\\):\n\\[\nQ^{\\ast}\\equiv L^{\\ast}\\pmod2.\n\\]\nСледовательно,\n\\[\n\\tau(G)=\\det L^{\\ast}\\equiv\\det Q^{\\ast}\\equiv\\det K\\pmod2.\n\\]\n\nОстается отметить, что определитель любого узла нечетен. Действительно, для нормированного многочлена Александера \\(\\Delta_K(t)\\) имеем \\(\\Delta_K(1)=\\pm1\\). По модулю \\(2\\) значения при \\(t=-1\\) и при \\(t=1\\) совпадают, потому что \\(-1\\equiv1\\pmod2\\). Значит\n\\[\n\\Delta_K(-1)\\equiv\\Delta_K(1)\\equiv1\\pmod2,\n\\]\nи \\(\\det K=|\\Delta_K(-1)|\\) нечетен.\n\nИз сравнения \\(\\tau(G)\\equiv\\det K\\pmod2\\) получаем, что \\(\\tau(\\Gamma_B(D))\\) нечетно для любой диаграммы узла.",
