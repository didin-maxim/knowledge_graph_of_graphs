    {
      "id": "sol-shank-theorem-one-line",
      "title": "Коротко через теорему Шенка",
      "text": "Рассмотрим \\(G=\\Gamma_B(D)\\) как Tait-граф шахматно раскрашенной диаграммы. Используем внешнюю теорему Шенка в форме, приведённой, например, в работе Jun Ge and Lianzhu Zhang, \"Determinant of links, spanning trees, and a theorem of Shank\", DOI: https://doi.org/10.1142/S0218216516410054 . Она утверждает: для диаграммы ссылки \\(L\\) число компонент \\(\\mu(L)\\) равно \\(1\\) тогда и только тогда, когда число остовных деревьев соответствующего Tait-графа нечётно.\n\nВ нашей задаче \\(L=K\\) — узел, то есть однокомпонентная ссылка, поэтому \\(\\mu(K)=1\\). Подставляя это в теорему Шенка, сразу получаем, что \\(\\tau(\\Gamma_B(D))\\), число остовных деревьев чёрного Tait-графа диаграммы, нечётно.\n\nЭто не самостоятельное доказательство задачи: весь нетривиальный шаг перенесён во внешнюю топологическую теорему Шенка. Для самодостаточного пути в карточке оставлено другое решение через матричную теорему Кирхгофа, матрицу Гёрлица и нечётность определителя узла; оно тоже использует тяжёлые внешние факты.",
