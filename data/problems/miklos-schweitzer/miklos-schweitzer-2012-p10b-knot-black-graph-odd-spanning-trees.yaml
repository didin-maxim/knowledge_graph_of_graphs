    {
      "id": "sol-shank-theorem-one-line",
      "title": "Коротко через теорему Шенка",
      "text": "Рассмотрим \\(G=\\Gamma_B(D)\\) как Tait-граф диаграммы. Теорема Шенка в топологической формулировке говорит: для диаграммы ссылки \\(L\\) число компонент \\(\\mu(L)\\) равно \\(1\\) тогда и только тогда, когда число остовных деревьев ее Tait-графа нечетно. В нашей задаче \\(L=K\\) - узел, то есть \\(\\mu(K)=1\\). Поэтому \\(\\tau(\\Gamma_B(D))\\) нечетно.\n\nЭто наиболее короткий найденный путь, но он полностью опирается на внешнюю теорему Шенка. Поэтому он годится как ссылка на известный результат, а не как самостоятельное школьное доказательство.",
