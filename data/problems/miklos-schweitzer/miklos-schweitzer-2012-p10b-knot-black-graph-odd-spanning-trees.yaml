    {
      "id": "idea-goeritz-mod-two",
      "title": "Матрица Гёрлица совпадает с лапласианом по модулю \\(2\\)",
      "text": "Знаки перекрестков в матрице Гёрлица равны \\(\\pm1\\), поэтому по модулю \\(2\\) они превращаются в обычные единичные веса ребер Tait-графа. Следовательно, редуцированная матрица Гёрлица и редуцированный лапласиан имеют одинаковый определитель по модулю \\(2\\).",
