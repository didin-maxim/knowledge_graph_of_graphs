  "ideas": [
    {
      "id": "idea-kirchhoff-reduced-laplacian",
      "title": "Теорема Кирхгофа считает остовные деревья",
      "text": "По матричной теореме о деревьях число \\(\\tau(G)\\) равно определителю любого редуцированного лапласиана Tait-графа \\(G\\). Петли можно игнорировать, так как они не участвуют в остовных деревьях и не дают вклада в лапласиан.",
      "tags": [
        "trees",
        "goal_counting"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-goeritz-mod-two",
      "title": "Матрица Гёрлица совпадает с лапласианом по модулю \\(2\\)",
      "text": "Знаки перекрестков в матрице Гёрлица равны \\(\\pm1\\), поэтому по модулю \\(2\\) они превращаются в обычные единичные веса ребер Tait-графа. Следовательно, редуцированная матрица Гёрлица и редуцированный лапласиан имеют одинаковый определитель по модулю \\(2\\). Это стандартный Goeritz/Tait-факт, а не школьная лемма.",
      "tags": [
        "planar_graphs",
        "invariant"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-knot-determinant-odd",
      "title": "Определитель узла нечетен",
      "text": "Определитель узла равен \\(|\\Delta_K(-1)|\\), где \\(\\Delta_K(t)\\) - нормированный многочлен Александера. Так как \\(-1\\equiv1\\pmod2\\) и \\(\\Delta_K(1)=\\pm1\\), этот определитель нечетен.",
      "tags": [
        "invariant",
        "goal_proof"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-shank-theorem",
      "title": "Теорема Шенка сразу дает паритет",
      "text": "Теорема Шенка в форме для Tait-графов утверждает: диаграмма ссылки имеет одну компоненту тогда и только тогда, когда число остовных деревьев ее Tait-графа нечетно. Так как узел - это однокомпонентная ссылка, задача следует немедленно. Полное доказательство этой теоремы является внешней теорией плоских графов/узлов.",
      "tags": [
        "trees",
        "invariant"
      ],
      "status": "ai_checked"
    }
