        "id": "stmt-original-p10b",
        "title": "Нечетное число остовных деревьев черного графа",
        "text": "Пусть \\(K\\) - узел, а \\(D\\) - любая его диаграмма. Раскрасим области дополнения диаграммы в шахматном порядке и построим черный граф \\(\\Gamma_B(D)\\): вершины соответствуют черным областям, а ребра соответствуют перекресткам, в которых две черные области имеют общую точку. Докажите, что граф \\(\\Gamma_B(D)\\) имеет нечетное число остовных деревьев.",
        "source_id": "src-miklos-schweitzer-2012-p10-official-eng",
