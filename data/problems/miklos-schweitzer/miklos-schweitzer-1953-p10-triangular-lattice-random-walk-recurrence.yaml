  "solutions": [
    {
      "id": "solution-return-series",
      "title": "Через вероятности возврата",
      "text": "Поместим треугольную решётку в комплексную плоскость и возьмём шесть допустимых шагов \\(1,\\omega,\\ldots,\\omega^5\\), где \\(\\omega=e^{\\pi i/3}\\). Пусть \\(P_n\\) — вероятность вернуться в начало после \\(n\\) шагов. В книге \\(P_n\\) записывается как постоянный член соответствующего тригонометрического многочлена, то есть как интеграл по двум углам. В окрестности нуля подынтегральная функция имеет гауссову нижнюю оценку, поэтому для некоторой положительной константы \\(c\\) выполнено \\(P_{2n}\\ge c/n\\). Следовательно, \\(\\sum_n P_n\\) расходится.\n\nОстаётся применить стандартный критерий возвратности: если \\(Q_n\\) — вероятность первого возврата на \\(n\\)-м шаге, то производящие функции удовлетворяют \\(P(z)=1/(1-Q(z))\\). Расходимость \\(\\sum_n P_n\\) при \\(z\\to1-\\) вынуждает \\(Q(z)\\to1\\), а значит сумма вероятностей первого возврата равна 1. Поэтому случайное блуждание на треугольной решётке возвращается в начальную вершину с вероятностью 1.",
      "tags": [
        "graph_model",
        "classical_lemma",
        "goal_proof"
      ],
      "status": "ai_checked",
      "standard_idea_ids": []
    }
