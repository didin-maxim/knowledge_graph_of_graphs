    {
      "id": "idea-recurrence-criterion",
      "title": "Возвратность равносильна расходимости суммы вероятностей возврата",
      "text": "Если \\(P_n\\) — вероятность оказаться в начальной вершине после \\(n\\) шагов, то для неотрицательных \\(P_n\\) стандартный критерий даёт: вероятность когда-нибудь вернуться равна 1 тогда и только тогда, когда \\(\\sum_n P_n\\) расходится.",
      "tags": [
        "classical_lemma",
        "goal_proof"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-two-dimensional-lower-bound",
      "title": "В двумерной решётке вероятность возврата имеет порядок не меньше \\(1/n\\)",
      "text": "Опубликованное решение кодирует шесть направлений комплексными числами \\(\\omega^0,\\ldots,\\omega^5\\), где \\(\\omega=e^{\\pi i/3}\\), и выражает \\(P_n\\) как постоянный член тригонометрического многочлена. Интегральная оценка снизу даёт \\(P_{2n}\\ge c/n\\), а гармонический ряд расходится.",
