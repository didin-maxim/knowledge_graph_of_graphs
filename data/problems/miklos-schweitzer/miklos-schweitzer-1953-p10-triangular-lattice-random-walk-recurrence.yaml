    {
      "id": "solution-return-series",
      "title": "Через вероятности возврата",
      "text": "Удобно записать вершины треугольной решётки как пары целых чисел \\((x,y)\\), а шесть возможных шагов как\n\\[\n(1,0),\\ (-1,0),\\ (0,1),\\ (0,-1),\\ (1,-1),\\ (-1,1).\n\\]\nПусть \\(P_m\\) — вероятность оказаться в начале после \\(m\\) шагов. Для \\(\\theta,\\phi\\in[-\\pi,\\pi]\\) характеристическая функция одного шага равна\n\\[\n\\chi(\\theta,\\phi)=\\frac{1}{3}\\bigl(\\cos\\theta+\\cos\\phi+\\cos(\\theta-\\phi)\\bigr).\n\\]\nПо формуле обращения Фурье для решётки \\(\\mathbb Z^2\\)\n\\[\nP_m=\\frac{1}{(2\\pi)^2}\\int_{-\\pi}^{\\pi}\\int_{-\\pi}^{\\pi}\\chi(\\theta,\\phi)^m\\,d\\theta\\,d\\phi .\n\\]\nДля чётных моментов подынтегральная функция неотрицательна, поэтому достаточно оценить интеграл снизу в малой окрестности нуля.\n\nВозьмём \\(\\rho>0\\) настолько малым, что при \\(|t|\\le2\\rho\\) выполнено \\(\\cos t\\ge1-t^2/2\\). Если \\(|\\theta|,|\\phi|\\le\\rho\\), то\n\\[\n\\chi(\\theta,\\phi)\n\\ge 1-\\frac{\\theta^2+\\phi^2+(\\theta-\\phi)^2}{6}\n\\ge 1-\\frac{\\theta^2+\\phi^2}{2}.\n\\]\nПоложим \\(D_n=\\{(\\theta,\\phi):\\theta^2+\\phi^2\\le 1/(4n)\\}\\). Для всех достаточно больших \\(n\\) этот круг лежит в квадрате \\([-\\rho,\\rho]^2\\), и на нём\n\\[\n\\chi(\\theta,\\phi)\\ge 1-\\frac{1}{8n}.\n\\]\nСледовательно,\n\\[\nP_{2n}\\ge\\frac{1}{(2\\pi)^2}\\int_{D_n}\\left(1-\\frac{1}{8n}\\right)^{2n}d\\theta d\\phi\n\\ge \\frac{c}{n}\n\\]\nс некоторой абсолютной константой \\(c>0\\). Для конечного числа малых \\(n\\) значение константы не важно. Значит, ряд \\(\\sum_{m\\ge0}P_m\\) расходится, поскольку уже подпоследовательность \\(\\sum_n P_{2n}\\) мажорирует гармонический ряд с положительным множителем.\n\nОстаётся связать это с вероятностью хотя бы одного возврата. Пусть \\(F_m\\) — вероятность первого возвращения в начало ровно на \\(m\\)-м шаге. Для \\(m\\ge1\\) всякое пребывание в начале на \\(m\\)-м шаге единственным образом раскладывается по моменту первого возврата, поэтому\n\\[\nP_m=\\sum_{k=1}^{m}F_kP_{m-k},\\qquad P_0=1.\n\\]\nДля \\(0\\le r<1\\) введём производящие функции\n\\[\nP(r)=\\sum_{m\\ge0}P_mr^m,\\qquad F(r)=\\sum_{m\\ge1}F_mr^m.\n\\]\nИз предыдущего свёрточного равенства получаем \\(P(r)=1+F(r)P(r)\\), то есть\n\\[\nP(r)=\\frac{1}{1-F(r)}.\n\\]\nТак как \\(\\sum_m P_m\\) расходится, по монотонной сходимости \\(P(r)\\to\\infty\\) при \\(r\\uparrow1\\). Поэтому \\(F(r)\\to1\\). Снова по монотонной сходимости \\(\\sum_{m\\ge1}F_m=1\\), а эта сумма и есть вероятность когда-нибудь вернуться в начальную вершину. Следовательно, случайное блуждание на треугольной решётке возвратно.",
