  "solutions": [
    {
      "id": "sol-ai-private-witnesses-official",
      "title": "ИИ-решение по официальному разбору: частные свидетели минимальности",
      "text": "Обозначим \\(x\\sim y\\), если выполнено хотя бы одно из отношений \\(x\\to y\\) или \\(y\\to x\\). Пусть \\(B=\\{b_1,\\ldots,b_m\\}\\). Докажем, что можно выбрать \\(m\\) попарно не связанных отношением элементов множества \\(A\\); тогда из условия сразу последует \\(m\\le k\\).\n\nЗафиксируем \\(i\\). Так как \\(B\\) минимально по включению, множество \\(B\\setminus\\{b_i\\}\\) уже не обладает требуемым свойством. Значит, либо существует элемент \\(c_i\\in A\\setminus B\\), который был доминирован только через \\(b_i\\), то есть \\(c_i\\sim b_i\\) и \\(c_i\\not\\sim b_j\\) при всех \\(j\\ne i\\), либо такого внешнего свидетеля нет, и тогда сам элемент \\(b_i\\) не доминируется множеством \\(B\\setminus\\{b_i\\}\\), то есть \\(b_i\\not\\sim b_j\\) при всех \\(j\\ne i\\). Перенумеруем элементы так, что первый случай имеет место ровно для \\(i=1,\\ldots,l\\).\n\nДля каждого \\(i\\le l\\) выберем такой внешний свидетель \\(c_i\\). Эти свидетели различны: если бы \\(c_i=c_j\\) при \\(i\\ne j\\), то этот элемент был бы связан и с \\(b_i\\), и с \\(b_j\\), что противоречит его частности. В паре \\(\\{b_i,c_i\\}\\) выберем элемент \\(x_i\\), в который входит стрелка из другого элемента пары; если стрелки есть в обе стороны, положим \\(x_i=b_i\\). Обозначим другой элемент пары через \\(y_i\\), так что всегда \\(y_i\\to x_i\\).\n\nПокажем, что при \\(i\\ne j\\le l\\) нет стрелки \\(x_i\\to x_j\\). Предположим противное. Тогда одновременно \\(x_i\\to x_j\\) и \\(y_j\\to x_j\\), причём \\(x_i\\ne y_j\\). По условию задачи элементы \\(x_i\\) и \\(y_j\\) должны быть связаны отношением \\(\\sim\\). Но тогда в тройке \\(x_i,x_j,y_j\\) любые два элемента связаны. Поскольку \\(\\{x_j,y_j\\}=\\{b_j,c_j\\}\\), это даёт противоречие: если \\(x_i=b_i\\), то получаем запрещённую связь \\(b_i\\sim c_j\\), а если \\(x_i=c_i\\), то получаем запрещённую связь \\(c_i\\sim b_j\\). Значит, \\(x_i\\not\\to x_j\\); меняя местами \\(i\\) и \\(j\\), получаем также \\(x_j\\not\\to x_i\\). Итак, элементы \\(x_1,\n\\ldots,x_l\\) попарно не связаны.\n\nДля индексов \\(i>l\\) уже доказано, что \\(b_i\\not\\sim b_j\\) при всех \\(j\\ne i\\). Кроме того, такой \\(b_i\\) не связан ни с одним \\(c_s\\) при \\(s\\le l\\), потому что каждый \\(c_s\\) является частным свидетелем для \\(b_s\\) и не связан с \\(b_i\\). Поэтому множество\n\\[\n\\{x_1,\\ldots,x_l,b_{l+1},\\ldots,b_m\\}\n\\]\nсостоит из \\(m\\) попарно не связанных отношением элементов. По предположению таких элементов в \\(A\\) не может быть больше \\(k\\), значит \\(|B|=m\\le k\\).",
