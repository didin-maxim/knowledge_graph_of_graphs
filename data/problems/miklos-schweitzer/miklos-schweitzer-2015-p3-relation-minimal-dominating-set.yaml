      "id": "idea-private-witnesses",
      "title": "Минимальность дает частные свидетели",
      "text": "Для каждого \\(b\\in B\\) минимальность должна дать вершину-свидетеля, которая теряет доминирование при удалении \\(b\\). Условие про общий образ затем должно заставить этих свидетелей быть попарно несмежными, что и дает оценку через \\(k\\).",
