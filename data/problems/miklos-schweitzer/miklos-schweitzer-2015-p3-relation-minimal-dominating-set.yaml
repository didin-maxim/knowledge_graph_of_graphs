        "id": "stmt-original",
        "title": "Бинарное отношение",
        "text": "Пусть \\(A\\) - конечное множество, а \\(\\to\\) - бинарное отношение на нем такое, что для любых \\(a,b,c\\in A\\), если \\(a\\ne b\\), \\(a\\to c\\) и \\(b\\to c\\), то либо \\(a\\to b\\), либо \\(b\\to a\\), либо оба отношения верны. Пусть \\(B\\subset A\\) минимально по включению среди множеств со свойством: для каждого \\(a\\in A\\setminus B\\) существует \\(b\\in B\\), такое что \\(a\\to b\\) или \\(b\\to a\\). Если в \\(A\\) есть не более \\(k\\) попарно не связанных отношением элементов, докажите, что \\(|B|\\le k\\).",
        "source_id": "src-miklos-schweitzer-2015-p3-official",
        "status": "needs_human_review",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": []
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "title": "Ориентированная графовая формулировка",
        "text": "Рассмотрим ориентированный граф отношения на \\(A\\), а неориентированную смежность зададим наличием хотя бы одной дуги между двумя вершинами. Условие говорит: любые две различные вершины, имеющие общую исходящую дугу в одну вершину, смежны между собой. Минимальное множество \\(B\\), доминирующее все остальные вершины по неориентированной смежности, должно иметь размер не больше числа независимости этого неориентированного графа.",
        "status": "ai_checked",
