        "id": "stmt-original",
        "title": "Бинарное отношение",
        "text": "Пусть \\(A\\) - конечное множество, а \\(\\to\\) - бинарное отношение на нем такое, что для любых \\(a,b,c\\in A\\), если \\(a\\ne b\\), \\(a\\to c\\) и \\(b\\to c\\), то либо \\(a\\to b\\), либо \\(b\\to a\\), либо оба отношения верны. Пусть \\(B\\subset A\\) минимально по включению среди множеств со свойством: для каждого \\(a\\in A\\setminus B\\) существует \\(b\\in B\\), такое что \\(a\\to b\\) или \\(b\\to a\\). Если в \\(A\\) есть не более \\(k\\) попарно не связанных отношением элементов, докажите, что \\(|B|\\le k\\).",
