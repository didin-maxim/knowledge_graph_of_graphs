  "solutions": [
    {
      "id": "sol-ai-cut-norm-counting-k4",
      "title": "ИИ-решение через cut-норму разности матриц смежности",
      "text": "Положим \\(\\varepsilon=1/1000\\). Для графа \\(G\\) обозначим через \\(A_G(x,y)\\) его матрицу смежности: \\(A_G(x,y)=1\\), если \\(xy\\) -- ребро, и \\(A_G(x,y)=0\\) иначе; на диагонали \\(A_G(x,x)=0\\). Пусть \\(D=A_{G_1}-A_{G_2}\\). Для \\(S\\subseteq V\\) запишем\n\\[\nq(S)=\\sum_{\\{x,y\\}\\subset S}D(x,y)=e_{G_1}(S)-e_{G_2}(S).\n\\]\nПо условию \\(|q(S)|\\le \\varepsilon n^2\\) для любого \\(S\\).\n\nСначала выведем из этого двудольную оценку. Для любых \\(X,Y\\subseteq V\\) положим\n\\[\nd(X,Y)=\\sum_{x\\in X,\\ y\\in Y}D(x,y),\n\\]\nгде пары из \\(X\\cap Y\\) считаются в обоих направлениях, а диагональ равна нулю. Тогда\n\\[\nd(X,Y)=q(X\\cup Y)-q(X\\setminus Y)-q(Y\\setminus X)+q(X\\cap Y).\n\\]\nЭто проверяется разбиением \\(X\\cup Y\\) на \\(X\\setminus Y\\), \\(Y\\setminus X\\) и \\(X\\cap Y\\): все слагаемые между первой и второй частью, между первой и пересечением, между второй и пересечением, а также два направления внутри пересечения появляются ровно по одному разу в правой части. Поэтому\n\\[\n|d(X,Y)|\\le 4\\varepsilon n^2. \\tag{1}\n\\]\nОтсюда следует и взвешенная версия: если \\(0\\le f,g\\le1\\) на \\(V\\), то\n\\[\n\\left|\\sum_{x,y\\in V}D(x,y)f(x)g(y)\\right|\\le4\\varepsilon n^2. \\tag{2}\n\\]\nДействительно, представим \\(f(x)=\\int_0^1 1_{f(x)\\ge a}\\,da\\) и \\(g(y)=\\int_0^1 1_{g(y)\\ge b}\\,db\\), после чего применим (1) к множествам \\(\\{x:f(x)\\ge a\\}\\) и \\(\\{y:g(y)\\ge b\\}\\) и проинтегрируем по \\(a,b\\).\n\nТеперь будем считать упорядоченные копии \\(K_4\\). Обозначим\n\\[\nh(G)=\\sum_{x_1,x_2,x_3,x_4\\in V}\\prod_{1\\le i<j\\le4}A_G(x_i,x_j).\n\\]\nЕсли среди \\(x_1,x_2,x_3,x_4\\) есть совпадение, один из множителей является диагональным и равен нулю; значит каждая неупорядоченная копия \\(K_4\\) считается ровно \\(24\\) раза, то есть \\(h(G)=24t(G)\\).\n\nЗафиксируем порядок шести рёбер \\(K_4\\). Разность \\(h(G_1)-h(G_2)\\) телескопируется по этим шести рёбрам: в каждом из шести слагаемых на одном ребре стоит множитель \\(D\\), а на остальных пяти рёбрах стоят множители \\(A_{G_1}\\) или \\(A_{G_2}\\). Оценим одно такое слагаемое. Пусть ребро с множителем \\(D\\) соединяет две переменные \\(u,v\\), а две остальные переменные равны \\(a,b\\). При фиксированных \\(a,b\\) произведение пяти остальных множителей имеет вид\n\\[\nc(a,b)F_{a,b}(u)H_{a,b}(v),\n\\]\nгде \\(0\\le c(a,b),F_{a,b},H_{a,b}\\le1\\): две оставшиеся рёберные функции, инцидентные \\(u\\), зависят только от \\(u\\), две функции, инцидентные \\(v\\), зависят только от \\(v\\), а ребро \\(ab\\) даёт общий коэффициент. Поэтому по (2) внутренняя сумма по \\(u,v\\) по модулю не превосходит \\(4\\varepsilon n^2\\). Суммируя по \\(a,b\\), получаем, что каждое из шести телескопических слагаемых по модулю не больше \\(4\\varepsilon n^4\\).\n\nСледовательно,\n\\[\n|h(G_1)-h(G_2)|\\le6\\cdot4\\varepsilon n^4=24\\varepsilon n^4.\n\\]\nДелим на \\(24\\), поскольку \\(h(G)=24t(G)\\), и получаем\n\\[\n|t(G_1)-t(G_2)|\\le \\varepsilon n^4=\\frac{n^4}{1000}.\n\\]\nЧто и требовалось доказать.",
