        "title": "Условие",
        "text": "Обозначим через \\(t(G)\\) число полных четырехвершинников в графе \\(G\\), а через \\(e_G(S)\\) - число ребер, натянутых множеством вершин \\(S\\). Пусть \\(G_1,G_2\\) - два простых графа на общем множестве вершин \\(V\\), \\(|V|=n\\), и для любого \\(S\\subseteq V\\) выполнено \\(|e_{G_1}(S)-e_{G_2}(S)|\\le n^2/1000\\). Докажите, что \\(|t(G_1)-t(G_2)|\\le n^4/1000\\).",
