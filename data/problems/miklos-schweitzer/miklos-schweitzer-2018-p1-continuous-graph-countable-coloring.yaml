  "ideas": [
    {
      "id": "idea-local-independent-ball",
      "title": "Окрестность вершины независима",
      "text": "Так как \\(f(x,x)\\notin S\\), замкнутость \\(S\\) и непрерывность \\(f\\) дают малую окрестность \\(U\\) точки \\(x\\), в которой \\(f(u,v)\\notin S\\) для всех \\(u,v\\in U\\). Значит внутри \\(U\\) нет ребер.",
      "tags": [
        "coloring",
        "graph_model"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-countable-base-colors",
      "title": "Цвета - элементы счетной базы",
      "text": "У \\(\\mathbb R^n\\) есть счетная база. Каждой вершине можно назначить один базисный шар, который содержит ее и лежит в независимой окрестности; вершины с одинаковым назначенным шаром попарно несмежны.",
      "tags": [
        "coloring",
        "goal_bound"
      ],
      "status": "ai_checked"
    }
