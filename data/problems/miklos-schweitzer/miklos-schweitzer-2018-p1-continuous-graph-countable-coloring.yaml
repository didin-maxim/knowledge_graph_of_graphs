        "id": "stmt-original",
        "title": "Условие",
        "text": "Пусть \\(S\\subset \\mathbb R\\) - замкнутое множество, а \\(f:\\mathbb R^{2n}\\to\\mathbb R\\) - непрерывная функция. Определим граф \\(G\\) так: точка \\(x\\in\\mathbb R^n\\) является вершиной тогда и только тогда, когда \\(f(x,x)\\notin S\\). Две вершины \\(x\\) и \\(y\\) соединены ребром тогда и только тогда, когда \\(f(x,y)\\in S\\) или \\(f(y,x)\\in S\\). Докажите, что хроматическое число \\(G\\) счетно.",
        "source_id": "src-miklos-schweitzer-2018-p1-official",
