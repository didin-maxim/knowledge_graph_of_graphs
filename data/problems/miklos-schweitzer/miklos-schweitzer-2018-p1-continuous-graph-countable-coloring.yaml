  "solutions": [
    {
      "id": "sol-countable-base",
      "title": "Раскраска счетной базой",
      "text": "Пусть \\(x\\) - вершина графа. Тогда \\(f(x,x)\\notin S\\). Так как \\(S\\) замкнуто, его дополнение открыто, поэтому существует окрестность \\(W\\) числа \\(f(x,x)\\), не пересекающаяся с \\(S\\). По непрерывности отображения \\((u,v)\\mapsto f(u,v)\\) найдется окрестность \\(U_x\\) точки \\(x\\) такая, что для всех \\(u,v\\in U_x\\) выполнено \\(f(u,v)\\in W\\), а значит \\(f(u,v)\\notin S\\). Следовательно, любые две вершины из \\(U_x\\) не соединены ребром: условие ребра не выполняется ни в одном направлении.\n\nВозьмем счетную базу \\(\\mathcal B\\) пространства \\(\\mathbb R^n\\), например шары с рациональными центрами и рациональными радиусами. Для каждой вершины \\(x\\) выберем базисный элемент \\(B(x)\\in\\mathcal B\\) такой, что \\(x\\in B(x)\\subset U_x\\). Покрасим вершину \\(x\\) цветом \\(B(x)\\). Цветов не больше счетного числа. Если две вершины \\(x,y\\) получили один и тот же цвет \\(B\\), то \\(x,y\\in B\\subset U_x\\), а \\(U_x\\) независимо, значит ребра \\(xy\\) нет. Раскраска правильная, поэтому хроматическое число графа счетно.",
