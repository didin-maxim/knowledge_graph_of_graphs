      "id": "idea-root-triangle",
      "title": "Фиксировать сторону и корневой треугольник",
      "text": "Выберите сторону \\(AB\\). В любой триангуляции есть единственный треугольник с этой стороной; его третья вершина \\(C_k\\) разбивает многоугольник на две независимые меньшие задачи. Так возникает свертка для чисел триангуляций.",
