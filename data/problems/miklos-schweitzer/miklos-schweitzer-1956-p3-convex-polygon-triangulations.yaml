  "solutions": [
    {
      "id": "sol-catalan-and-boundary",
      "title": "Рекурсии и производящая функция",
      "text": "Обозначим через \\(a_n\\) число всех триангуляций выпуклого \\(n\\)-угольника и положим \\(a_2=1\\). Если фиксировать сторону \\(AB\\) и выбирать третью вершину \\(C_k\\) треугольника, содержащего \\(AB\\), то две оставшиеся части имеют \\(k+1\\) и \\(n-k\\) сторон. Поэтому \\(a_n=\\sum_{k=1}^{n-2} a_{k+1}a_{n-k}\\). Это стандартная рекурсия Каталана, откуда \\(a_n=\\frac{1}{n-1}\\binom{2n-4}{n-2}\\). Для второго подсчета введем \\(u_n\\): число триангуляций \\(n\\)-угольника с выделенной базой, в которых каждый треугольник имеет сторону исходного многоугольника, отличную от базы. Тогда \\(u_3=1\\), а при \\(n\\ge4\\) у базы можно удалить один из двух крайних треугольников, получая \\(u_n=2u_{n-1}\\), значит \\(u_n=2^{n-3}\\). Возвращаясь к исходному \\(n\\)-угольнику и суммируя по третьей вершине корневого треугольника при фиксированной стороне, получаем для \\(n\\ge4\\) число специальных триангуляций \\(n\\cdot 2^{n-5}\\); для \\(n=3\\) оно равно \\(1\\).",
