        "double_counting"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-boundary-touching",
      "title": "Удалять крайний треугольник",
      "text": "Для специального условия удобно сначала считать триангуляции многоугольника с выделенной базой, где каждый треугольник имеет сторону исходного многоугольника, отличную от базы. У базы ровно два возможных крайних треугольника; удаление одного из них уменьшает число сторон на один и дает рекурсию \\(u_n=2u_{n-1}\\).",
