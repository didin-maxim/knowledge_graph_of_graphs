        "title": "Условие",
        "text": "Триангуляцией выпуклого замкнутого многоугольника называется разбиение его на треугольники диагоналями, не пересекающимися во внутренних точках. Найдите число всех триангуляций выпуклого \\(n\\)-угольника, а также число тех триангуляций, в которых каждый треугольник имеет хотя бы одну сторону, общую с данным \\(n\\)-угольником.",
