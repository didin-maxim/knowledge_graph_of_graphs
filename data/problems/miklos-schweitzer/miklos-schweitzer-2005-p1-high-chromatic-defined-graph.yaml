    },
    {
      "id": "idea-interval-disagreement",
      "title": "Использовать интервальный характер смежности",
      "text": "Смежность требует, чтобы две функции совпадали вне промежутка между \\(i\\) и \\(j\\) и различались внутри него. Это похоже на кодирование вложенных интервалов: длинная последовательность индексов должна порождать конфликт с любой фиксированной палитрой цветов.",
