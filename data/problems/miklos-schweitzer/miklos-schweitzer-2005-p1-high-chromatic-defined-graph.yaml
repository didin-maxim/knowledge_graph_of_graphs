  "ideas": [
    {
      "id": "idea-assume-c-coloring",
      "title": "Предположить ограниченную раскраску и искать повторяющийся шаблон",
      "text": "Если \\(G(a,b)\\) раскрашен в \\(c\\) цветов, то при больших \\(a,b\\) множество функций \\([a]\\to[b]\\) должно содержать много одноцветных или регулярно окрашенных конфигураций. Ребро задается сравнением функций только на интервале между индексами, поэтому вероятны аргументы типа Рамсея или компактности.",
      "tags": [
