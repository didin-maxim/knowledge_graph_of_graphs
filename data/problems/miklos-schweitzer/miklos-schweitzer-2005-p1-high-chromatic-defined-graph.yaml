        "text": "Для \\(a,b\\in\\mathbb N\\) пусть \\(G(a,b)\\) -- простой неориентированный граф с вершинами \\((i,f)\\), где \\(i\\in[a]\\) и \\(f:[a]\\to[b]\\); вершины \\((i,f)\\) и \\((j,g)\\) смежны тогда и только тогда, когда \\(i\\ne j\\), функции \\(f,g\\) различаются ровно на индексах \\(k\\), строго лежащих между \\(i\\) и \\(j\\), и совпадают на всех остальных \\(k\\). Тогда \\(\\sup_{a,b}\\chi(G(a,b))=\\infty\\).",
