        "title": "Условие",
        "text": "Обозначим \\([n]=\\{1,2,\\ldots,n\\}\\). Для произвольных \\(a,b\\in\\mathbb N\\) определим неориентированный граф \\(G(a,b)\\): его вершины имеют вид \\((i,f)\\), где \\(i\\in[a]\\), а \\(f:[a]\\to[b]\\). Две вершины \\((i,f)\\) и \\((j,g)\\) соединены ребром тогда и только тогда, когда \\(i\\ne j\\), причем \\(f(k)\\ne g(k)\\) выполняется ровно для тех \\(k\\), которые строго лежат между \\(i\\) и \\(j\\), а для всех остальных \\(k\\) выполнено \\(f(k)=g(k)\\). Докажите, что для любого \\(c\\in\\mathbb N\\) существуют \\(a,b\\in\\mathbb N\\), для которых вершины \\(G(a,b)\\) нельзя правильно раскрасить в \\(c\\) цветов.",
