      "id": "sol-finite-ramsey-injective-words",
      "title": "Решение через канонизацию инъективных слов по Рамсею",
      "text": "Докажем более явно: для каждого числа цветов \\(c\\) построим подходящие \\(a,b\\).\n\nПоложим \\(a=c+1\\) и \\(N=2a\\). По конечной теореме Рамсея выберем такое \\(b\\), что при любой раскраске всех \\(a\\)-элементных подмножеств множества \\([b]\\) в не более чем \\(c^{a\\cdot a!}\\) цветов найдется одноцветное \\(N\\)-элементное подмножество. Покажем, что граф \\(G(a,b)\\) не допускает правильной раскраски в \\(c\\) цветов.\n\nПредположим противное, и пусть \\(\\gamma(i,f)\\in[c]\\) -- правильная раскраска вершин \\(G(a,b)\\). Каждому \\(a\\)-элементному множеству \\(S=\\{s_1<\\cdots<s_a\\}\\subset[b]\\) сопоставим его таблицу цветов: для каждой перестановки \\(\\pi\\) множества \\([a]\\) и каждого индекса \\(r\\in[a]\\) записываем цвет вершины \\((r,f_{S,\\pi})\\), где \\(f_{S,\\pi}(k)=s_{\\pi(k)}\\). Таких таблиц не больше \\(c^{a\\cdot a!}\\), поэтому по выбору \\(b\\) существует множество \\(B\\subset[b]\\), \\(|B|=2a\\), на котором эта таблица одинакова для всех \\(a\\)-элементных подмножеств.\n\nРассмотрим в этой общей таблице только тождественную перестановку. Из одноцветности по Рамсею следует, что для каждого \\(r\\in[a]\\) есть цвет \\(q_r\\), не зависящий от выбора строго возрастающей функции \\(f:[a]\\to B\\), такой что \\(\\gamma(r,f)=q_r\\). Действительно, всякая такая \\(f\\) получается из своего образа \\(S\\) тождественной перестановкой: если \\(S=\\{s_1<\\cdots<s_a\\}\\), то \\(f(k)=s_k\\).\n\nДля любой строго возрастающей \\(f:[a]\\to B\\) вершины \\((r,f)\\) и \\((r+1,f)\\) смежны: между \\(r\\) и \\(r+1\\) нет целых индексов, а функции полностью совпадают. Значит правильность раскраски дает \\(q_r\\ne q_{r+1}\\) для всех \\(r=1,\\ldots,a-1\\). Но последовательность \\(q_1,\\ldots,q_a\\) имеет длину \\(a=c+1\\) и принимает только \\(c\\) значений; следовательно, найдутся \\(i<j\\) с \\(q_i=q_j\\). Из уже доказанного неравенства соседних членов автоматически \\(j\\ge i+2\\).\n\nЗапишем \\(B=\\{\\beta_1<\\beta_2<\\cdots<\\beta_{2a}\\}\\). Определим две строго возрастающие функции \\(f,g:[a]\\to B\\) так:\n\\[\nf(k)=\\beta_{2k-1}\\quad\\text{для всех }k,\n\\]\nа\n\\[\ng(k)=\\begin{cases}\n\\beta_{2k},& i<k<j,\\\\\n\\beta_{2k-1},& \\text{иначе.}\n\\end{cases}\n\\]\nОбе функции строго возрастают. Кроме того, они совпадают при всех \\(k\\), не лежащих строго между \\(i\\) и \\(j\\), и различаются при всех \\(k\\), строго лежащих между \\(i\\) и \\(j\\). Поэтому вершины \\((i,f)\\) и \\((j,g)\\) соединены ребром в \\(G(a,b)\\).\n\nС другой стороны, по выбору цветов \\(q_r\\) имеем\n\\[\n\\gamma(i,f)=q_i=q_j=\\gamma(j,g),\n\\]\nто есть найденное ребро монохромно. Это противоречит правильности \\(c\\)-раскраски. Следовательно, для выбранных \\(a,b\\) граф \\(G(a,b)\\) нельзя правильно раскрасить в \\(c\\) цветов, что и требовалось.",
