        "id": "stmt-original",
        "title": "Черный граф диаграммы узла",
        "text": "Пусть \\(K\\) - узел в трехмерном пространстве, а \\(D\\) - его диаграмма. Раскрасим дополнение диаграммы в шахматном порядке в черный и белый цвета. Черным графом \\(\\Gamma_B(D)\\) называется граф, вершины которого соответствуют черным областям, а ребро соединяет две вершины, если соответствующие черные области имеют общую точку. (a) Определите все узлы, имеющие диаграмму \\(D\\), для которой \\(\\Gamma_B(D)\\) имеет не более 3 остовных деревьев. (b) Докажите, что для любого узла и любой диаграммы \\(D\\) граф \\(\\Gamma_B(D)\\) имеет нечетное число остовных деревьев.",
        "source_id": "src-miklos-schweitzer-2012-p10-official",
