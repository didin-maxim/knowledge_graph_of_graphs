    {
      "id": "solution-ai-shank-small-tait-graphs",
      "title": "ИИ-решение через теорему Шенка и малые Tait-графы",
      "text": "Будем рассматривать \\(G=\\Gamma_B(D)\\) как плоский мультиграф; петли возможны, но они не входят ни в одно остовное дерево. Используем стандартную теорему Шенка: если \\(G\\) является Tait-графом связной диаграммы ссылки \\(L\\), то число компонент \\(L\\) равно 1 тогда и только тогда, когда \\(\\tau(G)\\), число остовных деревьев \\(G\\), нечетно. Так как в задаче \\(L=K\\) - узел, у ссылки ровно одна компонента, значит \\(\\tau(\\Gamma_B(D))\\) нечетно. Это доказывает пункт (b). Теперь пусть \\(\\tau(G)\\le 3\\). По уже доказанной нечетности \\(\\tau(G)=1\\) или \\(\\tau(G)=3\\). Сначала разберем графовую классификацию. Удаление петель не меняет \\(\\tau\\). Если \\(e\\) - мост, то каждое остовное дерево обязано содержать \\(e\\), а число остовных деревьев всего графа равно произведению чисел остовных деревьев блоков по разные стороны от моста. Поэтому при \\(\\tau=1\\) после удаления петель не остается ни одного цикла: граф является деревом. При \\(\\tau=3\\) после удаления петель и всех мостовых древовидных придатков остается ровно один нетривиальный блок с тремя остовными деревьями. Такой блок может быть только треугольником или графом из двух вершин, соединенных тремя параллельными ребрами. Действительно, если в 2-реберно-связном блоке есть ребро \\(e\\), то по формуле удаления-стягивания \\(\\tau(H)=\\tau(H-e)+\\tau(H/e)\\). Оба слагаемых положительны, пока \\(e\\) не является петлей или мостом; перебор минимальных возможностей при сумме 3 дает либо цикл длины 3, либо три параллельных ребра между двумя вершинами. Любое удлинение пути в theta-графе или появление второго независимого цикла дает уже не менее 4 остовных деревьев. Вернемся к диаграмме узла. Петля или мост в Tait-графе соответствует отсекаемому, то есть отсекаемому перекрёстку диаграммы; его можно убрать ходом Рейдемейстера I или обратной элементарной развязкой без изменения типа узла. Поэтому все древесные придатки и петли из описанной графовой классификации не влияют на тип узла. Если \\(\\tau=1\\), после их удаления остается диаграмма без существенных перекрестков, значит это тривиальный узел. Если \\(\\tau=3\\), существенная часть диаграммы имеет один из двух двойственных Tait-графов: треугольник или три параллельных ребра. Это одну и ту же трёхперекрёстковую схему скручивания. С учетом знаков перекрестков он является замыканием двухниточной косы \\(\\sigma_1^m\\), где \\(m=\\pm 3\\) или \\(m=\\pm 1\\): при \\(|m|=3\\) получается правый или левый трилистник, а при \\(|m|=1\\) получается тривиальный узел. Следовательно, все узлы, имеющие диаграмму с не более чем тремя остовными деревьями черного графа, - это тривиальный узел и два хиральных трилистника; если зеркальные трилистники не различаются принятой конвенцией, это просто 'трилистник'.",
