      "title": "Теорема Шенка для Tait-графа",
      "text": "Для Tait-графа связной диаграммы ссылки число компонент ссылки имеет чисто графовое отражение: диаграмма задает один узел тогда и только тогда, когда число остовных деревьев Tait-графа нечетно. После этого случай не более трех деревьев сводится к классификации связных мультиграфов с 1 или 3 остовными деревьями.",
