  "solutions": [
    {
      "id": "sol-ai-published-segment-drawing",
      "title": "ИИ-решение по опубликованному разбору через отрезки между точками граней",
      "text": "Обозначим через \\(K_Z\\) выпуклое множество, сопоставленное вершине \\(Z\\) триангуляции. Для каждой треугольной грани \\(\\Delta\\) выберем точку \\(P_\\Delta\\), принадлежащую трем множествам при вершинах \\(\\Delta\\). Если \\(\\varepsilon\\) -- ребро триангуляции, а \\(\\Delta_1,\\Delta_2\\) -- две грани, прилегающие к нему, поставим ребру \\(\\varepsilon\\) в соответствие отрезок \\(e_\\varepsilon=P_{\\Delta_1}P_{\\Delta_2}\\) на плоскости.\n\nВажное наблюдение: если ребро \\(\\varepsilon\\) выходит из вершины \\(Z\\), то оба его прилегающих треугольника содержат \\(Z\\), поэтому оба конца отрезка \\(e_\\varepsilon\\) лежат в \\(K_Z\\). По выпуклости весь отрезок \\(e_\\varepsilon\\) лежит в \\(K_Z\\).\n\nЕсли для некоторой грани \\(\\Delta\\) и вершины \\(Z\\), не лежащей на \\(\\Delta\\), выполнено \\(P_\\Delta\\in K_Z\\), то \\(P_\\Delta\\) является общей точкой четырех множеств: трех множеств при вершинах \\(\\Delta\\) и множества \\(K_Z\\). Поэтому дальше считаем, что такого случая нет. Тогда все точки \\(P_\\Delta\\) различны. Кроме того, если отрезки, соответствующие двум непересекающимся ребрам \\(\\varepsilon_1\\) и \\(\\varepsilon_2\\), имеют общую точку \\(Q\\), то \\(Q\\) лежит в четырех множествах при концах этих двух ребер, и мы снова закончили. Значит, можно считать, что отрезки непересекающихся ребер не пересекаются.\n\nВыберем среди всех точек \\(P_\\Delta\\) вершину их выпуклой оболочки; пусть это \\(P=P_\\Delta\\). Обозначим вершины грани \\(\\Delta\\) через \\(Z_1,Z_2,Z_3\\). Пусть \\(\\varepsilon_i\\) -- сторона \\(\\Delta\\), противоположная \\(Z_i\\), пусть \\(\\Delta_i\\) -- вторая грань, прилегающая к \\(\\varepsilon_i\\), и \\(P_i=P_{\\Delta_i}\\). Тогда трем сторонам \\(\\Delta\\) соответствуют отрезки \\(PP_1,PP_2,PP_3\\). Так как \\(P\\) -- вершина выпуклой оболочки, эти три отрезка выходят из \\(P\\) в один угол меньше \\(180^\\circ\\); перенумеруем так, что луч \\(PP_2\\) расположен между лучами \\(PP_1\\) и \\(PP_3\\).\n\nПосмотрим на все ребра триангуляции, выходящие из \\(Z_2\\), кроме двух сторон \\(\\varepsilon_1\\) и \\(\\varepsilon_3\\) грани \\(\\Delta\\). В циклическом порядке вокруг \\(Z_2\\) соответствующие им отрезки образуют ломаную, соединяющую \\(P_1\\) с \\(P_3\\). Все звенья этой ломаной лежат в \\(K_{Z_2}\\), потому что соответствующие ребра выходят из \\(Z_2\\). Эти ребра не имеют общих концов с \\(\\varepsilon_2\\), значит по нашему предположению их отрезки не пересекают отрезок \\(PP_2\\).\n\nЛоманая соединяет стороны угла \\(P_1PP_3\\), а луч \\(PP_2\\) проходит внутри этого угла. Поэтому ломаная пересекает луч \\(PP_2\\). Так как она не пересекает сам отрезок \\(PP_2\\), точка пересечения \\(R\\) лежит на продолжении луча за точкой \\(P_2\\). Следовательно, \\(P_2\\) лежит на отрезке \\(PR\\). Но \\(P\\in K_{Z_2}\\), а \\(R\\) лежит на ломаной, содержащейся в \\(K_{Z_2}\\); из выпуклости \\(K_{Z_2}\\) получаем \\(P_2\\in K_{Z_2}\\).\n\nС другой стороны, \\(P_2=P_{\\Delta_2}\\) по выбору принадлежит трем множествам при вершинах грани \\(\\Delta_2\\). Эта грань прилегает к стороне \\(\\varepsilon_2\\), противоположной \\(Z_2\\), поэтому \\(Z_2\\) не является ее вершиной. Значит, \\(P_2\\) является общей точкой множеств при трех вершинах \\(\\Delta_2\\) и множества \\(K_{Z_2}\\), то есть найдены четыре требуемые вершины.",
