        "title": "Выпуклые множества на вершинах триангуляции",
        "text": "Каждой вершине заданной триангуляции двумерной сферы сопоставлено выпуклое подмножество плоскости. Предположим, что три выпуклых множества, соответствующие трем вершинам любой двумерной грани триангуляции, имеют общую точку. Докажите, что существуют четыре вершины, для которых соответствующие выпуклые множества имеют общую точку.",
