  "solutions": [
    {
      "id": "sol-strip-induction",
      "title": "Решение через внешнюю теорему о горизонтальных хордах",
      "text": "Используем внешнюю топологическую теорему о горизонтальных хордах: если непрерывная плоская кривая соединяет точки \\(A\\) и \\(B\\), то для каждого положительного целого \\(k\\) на этой кривой найдутся две точки \\(C,D\\), такие что \\(\\overrightarrow{AB}=k\\overrightarrow{CD}\\). Для графиков функций это классическая теорема Леви об универсальной хорде; в плоской форме для кривых это именно тот топологический шаг, который не разворачивается в официальном источнике.\n\nПусть \\(p\\cap(p+v)\\ne\\varnothing\\). Тогда существуют две точки \\(A,A+v\\) на \\(p\\). Возьмем на \\(p\\) подломаную \\(q\\), идущую от \\(A\\) до \\(A+v\\). Она является непрерывной простой плоской кривой с концами, различающимися на \\(v\\). Применяя внешнюю теорему к кривой \\(q\\) и числу \\(n\\), получаем точки \\(C,D\\in q\\) с \\(\\overrightarrow{CD}=v/n\\). Тогда \\(D=C+v/n\\), то есть точка \\(D\\) лежит одновременно на \\(q\\) и на \\(q+v/n\\). Значит \\(q\\cap(q+v/n)\\ne\\varnothing\\), а значит и \\(p\\cap(p+v/n)\\ne\\varnothing\\).\n\nТеперь покажем, что другие положительные коэффициенты вообще не обязаны работать. Если \\(a>1\\), берем любую простую ломаную от \\((0,0)\\) до \\((1,0)\\), лежащую в полосе \\(0\\le x\\le1\\), и кладем \\(v=(1,0)\\). Тогда \\(p\\) пересекается с \\(p+v\\) в общей концевой точке, а \\(p\\) и \\(p+av\\) разнесены по проекции на ось \\(x\\).\n\nПусть теперь \\(0<a<1\\) и \\(a\\ne1/n\\). Рассмотрим функцию\n\\[\nf(x)=\\sin^2(\\pi x/a)-x\\sin^2(\\pi/a),\\qquad 0\\le x\\le1.\n\\]\nУ нее \\(f(0)=f(1)=0\\). Для \\(0\\le x\\le1-a\\) имеем\n\\[\nf(x+a)-f(x)=-a\\sin^2(\\pi/a)\\ne0,\n\\]\nпоскольку \\(a\\) не является обратным целым. Значит график \\(f\\) не имеет горизонтальной хорды длины \\(a\\). Более того, разность отделена от нуля положительной константой, поэтому можно заменить \\(f\\) достаточно близкой кусочно-линейной функцией \\(g\\) с \\(g(0)=g(1)=0\\), сохранив отсутствие горизонтальной хорды длины \\(a\\). График \\(g\\) - простая ломаная \\(p\\). При \\(v=(1,0)\\) она пересекается с \\(p+v\\) в общей концевой точке, а пересечение с \\(p+av\\) было бы ровно горизонтальной хордой длины \\(a\\), которой нет. Следовательно, аналогичное утверждение верно ровно для коэффициентов \\(a=1/n\\), \\(n\\in\\mathbb N\\).",
      "tags": [
