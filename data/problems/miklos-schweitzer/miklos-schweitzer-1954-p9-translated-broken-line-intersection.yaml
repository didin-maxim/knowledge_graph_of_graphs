      "id": "idea-strip-lemma",
      "title": "Внешняя теорема о горизонтальных хордах",
      "text": "Ключевой внешний факт можно брать в форме Horizontal Chord Theorem: если непрерывная плоская кривая соединяет точки \\(A\\) и \\(B\\), то для каждого положительного целого \\(k\\) на ней есть две точки \\(C,D\\), для которых \\(\\overrightarrow{AB}=k\\overrightarrow{CD}\\). Это именно топологический шаг, который в старом официальном плане был выражен через strip-лемму для параллельных сдвигов.",
