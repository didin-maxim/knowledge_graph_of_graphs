        "id": "stmt-graph",
        "title": "Геометрическая графовая формулировка",
        "text": "Простая плоская реализация графа-пути, пересекающая свой сдвиг на вектор \\(v\\), обязательно пересекает каждый промежуточный сдвиг на \\(v/n\\). Точная область коэффициентов такова: утверждение гарантированно верно для \\(a=1/n\\), а для положительных \\(a\\), у которых \\(1/a\\) не является положительным целым числом, существуют контрпримеры.",
