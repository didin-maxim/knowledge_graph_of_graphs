  "ideas": [
    {
      "id": "idea-reduce-to-finite-subpath",
      "title": "Оставить участок между соответствующими точками",
      "text": "Если точка \\(A'\\) лежит одновременно на \\(p\\) и на \\(p+v\\), то точка \\(A=A'-v\\) тоже лежит на \\(p\\). Достаточно рассматривать конечную часть ломаной от \\(A\\) до \\(A'\\), потому что именно она соединяет два соответствующих положения, отличающихся на \\(v\\).",
      "tags": [
        "graph_model",
        "extremal_choice"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-strip-lemma",
      "title": "Лемма о полосе между параллельными сдвигами",
      "text": "Ключевой шаг: если простая ломаная не пересекает два своих сдвига на сонаправленные параллельные векторы \\(v_1\\) и \\(v_2\\), то она не пересекает и сдвиг на \\(v_1+v_2\\). Доказательство использует бесконечную полосу, заметаемую одним сдвигом ломаной, и то, что пересекающий полосу кусок простой ломаной разделяет ее на две части.",
      "tags": [
        "planar_graphs",
        "connectivity"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-strip-induction",
      "title": "Доказательство через сложение малых сдвигов",
      "text": "Возьмем участок \\(q\\) исходной ломаной между точками \\(A\\) и \\(A+v\\). Предположим противное: \\(q\\) не пересекает \\(q+v/n\\). Применяя лемму о полосе к сонаправленным сдвигам, получаем последовательно, что \\(q\\) не пересекает \\(q+2v/n\\), затем \\(q+3v/n\\), и так далее до \\(q+v\\). Но конец \\(A+v\\) принадлежит и \\(q\\), и \\(q+v\\) в соответствующем положении, что дает противоречие. Значит, пересечение с \\(p+v/n\\) существует. Для коэффициентов, не равных обратному целому, книга приводит явную зигзагообразную ломаную-контрпример: она пересекает свой сдвиг на \\(v\\), но избегает сдвига на \\(av\\).",
      "tags": [
        "connectivity",
        "induction",
        "planar_graphs"
      ],
