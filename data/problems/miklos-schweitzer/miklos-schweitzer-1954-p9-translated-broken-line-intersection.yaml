  "ideas": [
    {
      "id": "idea-reduce-to-finite-subpath",
      "title": "Оставить участок между соответствующими точками",
      "text": "Если точка \\(A'\\) лежит одновременно на \\(p\\) и на \\(p+v\\), то точка \\(A=A'-v\\) тоже лежит на \\(p\\). Достаточно рассматривать конечную часть ломаной от \\(A\\) до \\(A'\\), потому что именно она соединяет два соответствующих положения, отличающихся на \\(v\\).",
      "tags": [
        "graph_model",
        "extremal_choice"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-strip-lemma",
      "title": "Лемма о полосе между параллельными сдвигами",
      "text": "Ключевой шаг: если простая ломаная не пересекает два своих сдвига на сонаправленные параллельные векторы \\(v_1\\) и \\(v_2\\), то она не пересекает и сдвиг на \\(v_1+v_2\\). Доказательство использует бесконечную полосу, заметаемую одним сдвигом ломаной, и то, что пересекающий полосу кусок простой ломаной разделяет ее на две части.",
      "tags": [
        "planar_graphs",
        "connectivity"
      ],
      "status": "needs_human_review"
    }
  ],
  "solutions": [
    {
      "id": "sol-strip-induction",
      "title": "Доказательство через сложение малых сдвигов",
      "text": "Текущий текст является планом, а не самодостаточным решением. Из пересечения \\(p\\) с \\(p+v\\) выбирается участок \\(q\\) исходной ломаной между точками \\(A\\) и \\(A+v\\). Далее нужен ключевой топологический шаг: если простая ломаная \\(q\\) не пересекает свой сдвиг на \\(v/n\\), то по лемме о полосе она последовательно не пересекает сдвиги на \\(2v/n,3v/n,\\ldots,v\\). Последний вывод противоречит тому, что конец \\(A+v\\) лежит на соответствующем участке. Для коэффициентов, не равных обратному целому, источник ссылается на зигзагообразный контрпример с рисунком.\n\nрешение пока не найдено",
      "tags": [
        "connectivity",
        "induction",
        "planar_graphs"
      ],
      "status": "needs_human_review",
      "review_notes": "High-reasoning pass 2026-05-17: карточку нельзя честно повысить до полного решения. Для первой части всё ещё не развёрнут локальный Jordan/strip-довод: нужно доказать, что из непересечения простой ломаной со сдвигами на два сонаправленных вектора следует непересечение со сдвигом на их сумму. Контрпример для коэффициентов, отличных от \\(1/n\\), также должен быть записан локально, без ссылки на рисунок источника.",
      "source_id": "src-miklos-schweitzer-1954-p9-old-book",
