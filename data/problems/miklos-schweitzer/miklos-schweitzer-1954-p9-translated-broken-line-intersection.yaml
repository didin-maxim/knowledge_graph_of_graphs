        "id": "stmt-original",
        "title": "Условие",
        "text": "Пусть \\(p\\) - связная незамкнутая ломаная без самопересечений на плоскости, а \\(v\\ne0\\) - вектор. Докажите: если \\(p\\) имеет общую точку со своим сдвигом \\(p+v\\), то для каждого положительного целого \\(n\\) ломаная \\(p\\) имеет общую точку и со сдвигом \\(p+v/n\\). Верно ли аналогичное утверждение для других положительных коэффициентов \\(a\\), то есть для сдвига \\(p+av\\)?",
        "source_id": "src-miklos-schweitzer-1954-p9-old-book",
