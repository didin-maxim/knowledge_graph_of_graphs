        "id": "stmt-graph-complete",
        "title": "Клика в графе целочисленных разностей",
        "text": "Зафиксирован конечный набор простых чисел \\(p_1,\\ldots,p_k\\). Между двумя целыми числами проводится ребро, если их ненулевая разность имеет только эти простые делители. Может ли этот бесконечный граф содержать клики любого конечного размера \\(m\\ge3\\)?",
