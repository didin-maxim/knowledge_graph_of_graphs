        "id": "stmt-complete-part",
        "title": "Полная часть исходной задачи",
        "text": "Пусть \\(p_1,\\ldots,p_k\\) - фиксированные простые числа, а \\(S\\) - множество ненулевых целых чисел, все простые делители которых принадлежат множеству \\(\\{p_1,\\ldots,p_k\\}\\). Для конечного множества целых чисел \\(A\\) построим граф \\(\\mathcal G(A)\\) с вершинами из \\(A\\), где две различные вершины \\(a,b\\) соединены ребром тогда и только тогда, когда \\(a-b\\in S\\). Верно ли, что для каждого \\(m\\ge3\\) можно выбрать \\(m\\)-элементное множество \\(A\\), для которого \\(\\mathcal G(A)\\) является полным графом?",
