      "id": "idea-new-prime-residues",
      "title": "Новый простой ограничивает размер клики",
      "text": "Если взять простой \\(q\\), которого нет среди разрешенных, то в полной реализации нельзя иметь две вершины с одинаковым остатком по модулю \\(q\\): их разность делилась бы на запрещенный простой \\(q\\). Значит, клика имеет не больше \\(q\\) вершин.",
