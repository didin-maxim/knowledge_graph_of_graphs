  "solutions": [
    {
      "id": "sol-new-prime-pigeonhole",
      "title": "Остатки по простому вне списка",
      "text": "Ответ отрицательный.\n\nВыберем простое число \\(q\\), отличное от всех \\(p_1,\\ldots,p_k\\). Такое простое существует, потому что простых чисел бесконечно много. Рассмотрим любое множество \\(A\\) из \\(q+1\\) целых чисел. По принципу Дирихле среди этих \\(q+1\\) чисел найдутся два различных элемента \\(a,b\\), сравнимых по модулю \\(q\\).\n\nТогда \\(q\\mid a-b\\), причем \\(a-b\\ne0\\). Следовательно, у разности \\(a-b\\) есть простой делитель \\(q\\), которого нет в разрешенном наборе \\(\\{p_1,\\ldots,p_k\\}\\). Поэтому \\(a-b\\notin S\\), и вершины \\(a\\) и \\(b\\) не соединены ребром в \\(\\mathcal G(A)\\).\n\nИтак, ни одно \\((q+1)\\)-элементное множество \\(A\\) не дает полный граф \\(\\mathcal G(A)\\). Значит, утверждение о существовании полного графа для каждого \\(m\\ge3\\) ложно.",
