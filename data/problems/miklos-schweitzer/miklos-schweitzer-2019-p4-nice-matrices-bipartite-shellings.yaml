      "id": "idea-local-minima-vs-components",
      "title": "Локальные минимумы отвечают компонентам префикса",
      "text": "Если у некоторого начального набора ребер есть несколько компонент, минимальное ребро в каждой компоненте дает клетку, минимальную и в своей строке, и в своем столбце относительно всего порядка. Поэтому единственность такой клетки тесно связана со связностью всех начальных префиксов.",
