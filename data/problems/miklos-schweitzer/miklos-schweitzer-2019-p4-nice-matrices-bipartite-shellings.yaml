        "id": "stmt-original",
        "title": "Хорошие матрицы",
        "text": "\\(n\\times m\\)-матрица называется хорошей, если она содержит каждое целое число от \\(1\\) до \\(mn\\) ровно один раз и \\(1\\) является единственным элементом, который одновременно минимален в своей строке и в своем столбце. Докажите, что число хороших \\(n\\times m\\)-матриц равно \\(\\frac{(mn)!\\,n!\\,m!}{(n+m-1)!}\\).",
        "source_id": "src-miklos-schweitzer-2019-p4-official",
