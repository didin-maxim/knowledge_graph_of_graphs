  "solutions": [
    {
      "id": "sol-geupel-block-probability",
      "title": "Опубликованное решение через блочную рекурсию",
      "text": "Будем пользоваться эквивалентной формой условия: матрица хороша тогда и только тогда, когда каждая клетка, кроме клетки с числом \\(1\\), имеет меньший элемент в той же строке или в том же столбце.\n\nЗафиксируем целые \\(s,t\\), где \\(0\\le s<n\\) и \\(0\\le t<m\\). Разобьем таблицу на четыре блока: \\(A\\) размера \\(s\\times t\\) в левом верхнем углу, \\(B\\) размера \\(s\\times(m-t)\\) справа сверху, \\(C\\) размера \\((n-s)\\times t\\) слева снизу и \\(D\\) размера \\((n-s)\\times(m-t)\\) справа снизу. Пусть \\(N=(n-s)(m-t)\\). Заполним \\(D\\) числами \\(1,2,\\ldots,N\\) так, чтобы сам блок \\(D\\) был хорошей матрицей, а остальные клетки случайно и равновероятно заполним числами \\(N+1,N+2,\\ldots,mn\\). Обозначим через \\(P(s,t)\\) вероятность того, что полученная \\(n\\times m\\)-матрица хороша. Эта вероятность не зависит от конкретного хорошего заполнения \\(D\\), потому что важны только сравнения чисел в общих строках и столбцах.\n\nЕсли \\(s=0\\) или \\(t=0\\), то \\(P(s,t)=1\\): всякая внешняя клетка имеет в своей строке или в своем столбце клетку блока \\(D\\) с меньшим числом, а внутри \\(D\\) условие уже выполнено.\n\nПусть теперь \\(s,t>0\\). Рассмотрим число \\(N+1\\), то есть наименьшее число вне \\(D\\). Если оно попало в блок \\(A\\), то оно минимально и в своей строке, и в своем столбце: в этих строке и столбце нет клеток блока \\(D\\), а все остальные внешние числа больше \\(N+1\\). Тогда возник бы второй такой элемент, отличный от \\(1\\), и матрица не была бы хорошей. Значит, для хорошей матрицы число \\(N+1\\) обязано лежать в \\(B\\) или в \\(C\\).\n\nСреди внешних клеток их всего \\(mn-N=ms+nt-st\\). Поэтому вероятность события \\(N+1\\in B\\) равна \\(s(m-t)/(ms+nt-st)\\), а вероятность события \\(N+1\\in C\\) равна \\((n-s)t/(ms+nt-st)\\). Если \\(N+1\\in B\\), то строка, в которой оно стоит, становится безопасной: каждая другая клетка этой строки имеет меньший элемент в той же строке, а само \\(N+1\\) имеет меньший элемент в своем столбце внутри \\(D\\). Эту строку можно перенести из верхней группы в нижнюю; оставшаяся задача имеет параметры \\((s-1,t)\\). Аналогично, если \\(N+1\\in C\\), можно перенести соответствующий столбец из левой группы в правую, и остается задача с параметрами \\((s,t-1)\\). Условные распределения оставшихся относительных порядков равномерны, поэтому\n\\[\nP(s,t)=\\frac{s(m-t)}{ms+nt-st}P(s-1,t)+\\frac{(n-s)t}{ms+nt-st}P(s,t-1).\\tag{1}\n\\]\n\nДокажем по индукции по \\(s+t\\), что\n\\[\nP(s,t)=\\frac{(m+n-1-s)!(m+n-1-t)!}{(m+n-1)!(m+n-1-s-t)!}.\\tag{2}\n\\]\nБаза \\(s=0\\) или \\(t=0\\) уже совпадает с этой формулой. Подставим индукционное предположение в правую часть (1). Получаем общий множитель\n\\[\n\\frac{(m+n-1-s)!(m+n-1-t)!}{(m+n-1)!(m+n-s-t)!}\\cdot\\frac{1}{ms+nt-st}\n\\]\nи в скобках числитель\n\\[\ns(m-t)(m+n-s)+(n-s)t(m+n-t).\n\\]\nНо\n\\[\ns(m-t)(m+n-s)+(n-s)t(m+n-t)=(ms+nt-st)(m+n-s-t).\n\\]\nПосле сокращения получается ровно формула (2).\n\nТеперь вернемся к исходному подсчету. Благодаря перестановкам строк и столбцов число хороших матриц с \\(1\\) в любой фиксированной клетке одинаково. Поэтому доля хороших матриц среди всех \\((mn)!\\) заполнений равна вероятности быть хорошей при условии, что \\(1\\) стоит, например, в правом нижнем углу. Это как раз \\(P(n-1,m-1)\\): нижне-правый блок \\(D\\) состоит из одной клетки с числом \\(1\\). По формуле (2)\n\\[\nP(n-1,m-1)=\\frac{m!n!}{(m+n-1)!}.\n\\]\nСледовательно, число хороших \\(n\\times m\\)-матриц равно\n\\[\n(mn)!P(n-1,m-1)=\\frac{(mn)!\\,m!\\,n!}{(m+n-1)!},\n\\]\nчто и требовалось доказать.",
