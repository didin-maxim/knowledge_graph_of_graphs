    },
    {
      "id": "idea-conditioning-recurrence",
      "title": "Рекурсия по положению следующего числа",
      "text": "Если нижне-правый блок уже хорош и содержит все самые маленькие числа, то следующий минимальный внешний элемент не может лежать в верхне-левом блоке. Условившись, что он лежит в верхне-правом или нижне-левом блоке, мы уменьшаем число новых строк или новых столбцов.",
