        "id": "stmt-graph",
        "title": "Шеллинги \\(K_{n,m}\\)",
        "text": "Рассмотрим полный двудольный граф \\(K_{n,m}\\), где строки и столбцы матрицы являются долями, а клетка \\((i,j)\\) соответствует ребру между строкой \\(i\\) и столбцом \\(j\\). Упорядочение клеток по возрастанию записанных чисел дает упорядочение ребер. Хорошие матрицы соответствуют таким упорядочениям, у которых каждый начальный набор ребер индуцирует связный подграф на своих непустых вершинах. Нужно получить формулу для числа таких упорядочений.",
