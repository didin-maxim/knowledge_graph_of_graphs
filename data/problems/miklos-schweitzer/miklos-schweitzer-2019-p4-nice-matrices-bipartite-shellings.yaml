    {
      "id": "idea-safe-blocks",
      "title": "Клетка безопасна, если в ее строке или столбце уже есть меньшая",
      "text": "Эквивалентная форма условия: всякая клетка, кроме клетки с \\(1\\), должна иметь меньший элемент в той же строке или в том же столбце. Поэтому при блочном разбиении клетки в верхне-правом и нижне-левом блоках автоматически безопасны из-за малого нижне-правого блока.",
