  "solutions": [
    {
      "id": "sol-shelling-reference",
      "title": "Через известную формулу для шеллингов \\(K_{n,m}\\)",
      "text": "Свяжем клетку \\((i,j)\\) с ребром между \\(i\\)-й строкой и \\(j\\)-м столбцом в \\(K_{n,m}\\). Заполнение матрицы числами \\(1,2,\\ldots,mn\\) эквивалентно линейному порядку всех ребер. Условие хорошей матрицы можно читать как условие на начальные префиксы этого порядка: появление отдельной компоненты в префиксе создает собственное минимальное ребро, минимальное одновременно в своей строке и в своем столбце; наоборот, такая дополнительная клетка отделяет компоненту в подходящем начальном префиксе. Поэтому хорошие матрицы считаются тем же числом, что и связные упорядочения ребер полного двудольного графа.\n\nДля полного двудольного графа известная формула Стэнли - Гао - Пэна для числа связных упорядочений ребер дает ровно\n\\[\n\\frac{(mn)!\\,n!\\,m!}{(n+m-1)!}.\n\\]\nТем самым получается требуемое число матриц.",
