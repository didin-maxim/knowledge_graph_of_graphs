        "title": "Двудольная формулировка",
        "text": "Дан двудольный граф с левыми вершинами \\(r_1,\\ldots,r_{2n}\\) и правыми вершинами \\(c_1,\\ldots,c_{2n}\\), где \\(r_i\\) соединена с \\(c_k\\) тогда и только тогда, когда \\(i\\equiv k\\pmod n\\). Найти число совершенных паросочетаний этого графа.",
