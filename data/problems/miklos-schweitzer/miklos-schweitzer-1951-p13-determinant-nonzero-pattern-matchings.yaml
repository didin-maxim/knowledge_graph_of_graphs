  "ideas": [
    {
      "id": "idea-determinant-terms-are-matchings",
      "title": "Член детерминанта выбирает по одному ребру в каждой строке и каждом столбце",
      "text": "Ненулевой член разложения соответствует перестановке \\(\\sigma\\), для которой все выбранные элементы \\(a_{i,\\sigma(i)}\\) ненулевые. В двудольном графе это ровно совершенное паросочетание между строками и столбцами.",
      "tags": [
        "matching",
        "graph_model"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-residue-components",
      "title": "Разбить граф по остаткам по модулю n",
      "text": "Для каждого остатка \\(s\\pmod n\\) есть две строки и два столбца с этим остатком, и между ними проведены все четыре ребра. Поэтому весь граф распадается в дизъюнктное объединение \\(n\\) копий \\(K_{2,2}\\).",
      "tags": [
        "matching",
        "double_counting"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "solution-components",
      "title": "Подсчёт по компонентам",
      "text": "Перейдём к двудольному графу строк и столбцов. Условие \\(i-k\\equiv0\\pmod n\\) означает, что строка может быть сопоставлена только со столбцами того же остатка по модулю \\(n\\). Для каждого остатка есть ровно две строки и два столбца, а допустимые рёбра образуют \\(K_{2,2}\\). Совершенное паросочетание в \\(K_{2,2}\\) можно выбрать двумя способами. Компоненты независимы, поэтому общее число совершенных паросочетаний, а значит и ненулевых членов детерминанта, равно \\(2^n\\).",
      "tags": [
        "matching",
        "graph_model",
        "goal_counting"
      ],
      "status": "ai_checked",
      "standard_idea_ids": [
        "double_counting"
      ]
    }
  ],
