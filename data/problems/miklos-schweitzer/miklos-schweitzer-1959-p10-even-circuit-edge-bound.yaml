  "ideas": [
    {
      "id": "idea-maximal-forest",
      "title": "Вынести все лишние рёбра за максимальный лес",
      "text": "В максимальном ациклическом подграфе на \\(2n+1\\) вершинах не больше \\(2n\\) рёбер. Поэтому при \\(3n+k\\) рёбрах, где \\(k\\ge 1\\), вне выбранного леса остаётся хотя бы \\(n+k\\) рёбер, и каждое из них замыкает свой фундаментальный цикл.",
      "tags": [
        "trees",
        "extremal_choice",
        "goal_bound"
      ],
      "status": "source_verified"
    },
    {
      "id": "idea-two-overlapping-cycles",
      "title": "Два пересекающихся фундаментальных цикла дают чётный цикл",
      "text": "Если бы все полученные циклы были попарно реберно непересекающимися, они потребовали бы слишком много рёбер. Значит, два цикла имеют общее ребро. Между двумя подходящими общими вершинами возникают три простых цикла с длинами \\(a_1+a_2\\), \\(a_1+b_1\\), \\(a_2+b_1\\); сумма этих трёх чисел чётна, поэтому хотя бы один из циклов имеет чётную длину.",
      "tags": [
        "extremal_graph_theory",
        "parity_coloring",
        "goal_existence"
      ],
      "status": "source_verified"
    },
    {
      "id": "idea-sharpness",
      "title": "Острота: веер из треугольников",
      "text": "Контрпример для \\(3n\\) рёбер получается из \\(n\\) треугольников с одной общей вершиной и без других общих вершин. В нём \\(2n+1\\) вершина и \\(3n\\) рёбер, а каждый простой цикл является одним из треугольников.",
      "tags": [
        "construction",
        "forbidden_triangle",
        "goal_construction"
      ],
      "status": "source_verified"
    }
  ],
  "solutions": [
    {
      "id": "sol-official-forest-cycles",
      "title": "Решение через максимальный лес и пересекающиеся циклы",
      "type": "official_solution_adapted",
      "source_id": "src-miklos-schweitzer-1959-p10-old-book",
      "text": "Петли исключаются смыслом задачи: если их разрешить, появляются ложные контрпримеры. Если две вершины соединены двумя разными рёбрами, то эти два ребра уже образуют чётный контур длины 2. Поэтому достаточно рассмотреть простой граф.\n\nПусть в графе \\(2n+1\\) вершин и \\(3n+k\\) рёбер, где \\(k\\ge 1\\). Возьмём максимальное множество рёбер \\(B\\), не содержащее циклов, то есть максимальный лес. В любом лесу на \\(2n+1\\) вершинах не больше \\(2n\\) рёбер, значит, вне \\(B\\) лежит не меньше \\(n+k\\) рёбер. По максимальности \\(B\\) каждое такое ребро вместе с рёбрами леса замыкает простой цикл.\n\nЭтих циклов не меньше \\(n+k\\). Если бы они не имели общих рёбер, то, поскольку граф простой и каждый цикл имеет длину хотя бы 3, они вместе содержали бы не меньше \\(3n+3k\\) рёбер. Но весь граф содержит только \\(3n+k\\) рёбер, противоречие. Следовательно, два из этих циклов имеют общее ребро.\n\nВыберем два таких цикла. В одном из них есть ребро, которого нет в другом; идя от него по циклу в обе стороны до первых вершин второго цикла, получаем две вершины \\(A\\) и \\(B\\). Дуга первого цикла между \\(A\\) и \\(B\\) и две дуги второго цикла между теми же вершинами образуют три простых цикла. Если длины двух дуг второго цикла равны \\(a_1\\) и \\(a_2\\), а длина выбранной дуги первого цикла равна \\(b_1\\), то длины трёх циклов равны \\(a_1+a_2\\), \\(a_1+b_1\\), \\(a_2+b_1\\). Их сумма равна \\(2(a_1+a_2+b_1)\\), поэтому не все три числа нечётны; один из этих циклов чётный.\n\nДля остроты оценки возьмём \\(n\\) треугольников, имеющих ровно одну общую вершину и больше не пересекающихся. Тогда вершин \\(1+2n=2n+1\\), рёбер \\(3n\\), а все простые циклы - именно эти треугольники, так что чётного цикла нет.",
      "tags": [
