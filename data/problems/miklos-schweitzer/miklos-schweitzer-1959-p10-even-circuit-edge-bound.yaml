        "title": "Условие",
        "text": "Докажите, что если граф с \\(2n+1\\) вершинами имеет не менее \\(3n+1\\) рёбер, то в нём есть контур чётной длины. Докажите также, что утверждение уже неверно для \\(3n\\) рёбер. В книге под контуром понимается замкнутая самонепересекающаяся линия, то есть простой цикл.",
