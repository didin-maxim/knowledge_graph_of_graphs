        "title": "Двухцветная раскраска ребер",
        "text": "Пусть \\(G\\) - простой граф с \\(n\\) вершинами и минимальной степенью \\(\\delta(G)\\ge 3n/4\\). Докажите, что при любой раскраске ребер графа \\(G\\) в два цвета существует связный подграф с по крайней мере \\(\\delta(G)+1\\) вершинами, все ребра которого имеют один цвет.",
