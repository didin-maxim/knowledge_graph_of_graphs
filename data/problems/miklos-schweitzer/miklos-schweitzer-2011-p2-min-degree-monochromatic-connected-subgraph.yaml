  "solutions": [
    {
      "id": "sol-cut-degree",
      "title": "Разрез и общие синие соседи",
      "text": "Если красные ребра содержат связный остовный подграф, то утверждение очевидно. Иначе вершины можно разбить на две непустые части \\(A,B\\) так, что все ребра между ними, если они есть, синие. Пусть \\(|A|\\le n/2\\), возьмем \\(x\\in A\\). Все соседи \\(x\\) в \\(B\\) соединены с \\(x\\) синими ребрами. Если \\(y\\in A\\) - сосед \\(x\\), то у каждой из вершин \\(x,y\\) не меньше \\(\\delta(G)-(|A|-1)\\) соседей в \\(B\\). Эти два множества соседей пересекаются, потому что их суммарный размер больше \\(|B|\\) при \\(\\delta(G)\\ge 3n/4\\) и \\(|A|\\le n/2\\). Значит, \\(x\\) и \\(y\\) связаны синим путем длины 2 через общую вершину из \\(B\\). Следовательно, вершина \\(x\\) и все ее соседи лежат в одной синей компоненте. Их не меньше \\(1+d(x)\\ge \\delta(G)+1\\), что и требовалось.",
