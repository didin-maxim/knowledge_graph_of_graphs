      "id": "idea-if-one-color-disconnected",
      "title": "Если один цвет не связен, все ребра разреза имеют второй цвет",
      "text": "Если красный граф не содержит остовной связной компоненты, то есть разбиение \\(V=A\\cup B\\) без красных ребер между частями. Все ребра разреза синие. Для вершины из меньшей части высокая минимальная степень заставляет ее и всех ее соседей попасть в одну синюю компоненту.",
