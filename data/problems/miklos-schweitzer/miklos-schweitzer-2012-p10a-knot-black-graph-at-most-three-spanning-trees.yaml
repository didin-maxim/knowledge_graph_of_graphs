      "text": "Петли, мосты и древесные придатки Tait-графа соответствуют отсекаемым перекрёсткам диаграммы и могут быть сняты без изменения типа узла. Нетривиальное ядро с тремя ребрами дает трехперекрестковую двухниточную диаграмму скручивания: это трилистник при трех одинаковых знаках и тривиальный узел иначе.",
