      "title": "Классифицировать связные мультиграфы с \\(1\\) или \\(3\\) остовными деревьями",
      "text": "Петли не участвуют в остовных деревьях, мосты входят во все остовные деревья, а блоки дают произведение чисел остовных деревьев. При \\(\\tau=3\\) остается ровно один нетривиальный блок: треугольник или три параллельных ребра между двумя вершинами.",
