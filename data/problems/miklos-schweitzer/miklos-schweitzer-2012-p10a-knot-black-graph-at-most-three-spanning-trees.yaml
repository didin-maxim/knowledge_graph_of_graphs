        "id": "stmt-original-p10a",
        "title": "Черный граф с не более чем тремя остовными деревьями",
        "text": "Пусть \\(K\\) - узел, а \\(D\\) - его диаграмма. Раскрасим области дополнения диаграммы в шахматном порядке и построим черный граф \\(\\Gamma_B(D)\\): его вершины соответствуют черным областям, а каждое пересечение диаграммы дает ребро между двумя черными областями, имеющими в этом пересечении общую точку. Определите все узлы, имеющие такую диаграмму \\(D\\), что \\(\\Gamma_B(D)\\) имеет не более \\(3\\) остовных деревьев.",
