    {
      "id": "idea-tait-core-to-knot-type",
      "title": "Tait-ядро с тремя ребрами дает трехперекрестковый shadow",
      "text": "Петли, мосты и древесные придатки Tait-графа соответствуют nugatory-перекресткам диаграммы и могут быть сняты без изменения типа узла. Нетривиальное ядро с тремя ребрами дает трехперекрестковую двухниточную twist-диаграмму: это трилистник при трех одинаковых знаках и тривиальный узел иначе.",
