  "solutions": [
    {
      "id": "sol-small-tait-graphs-classification",
      "title": "Классификация через малые Tait-графы с внешними фактами о узлах",
      "text": "Ответ: тривиальный узел и два хиральных трилистника; если зеркальные узлы в принятой конвенции не различаются, то это тривиальный узел и трилистник.\n\nОбозначим \\(G=\\Gamma_B(D)\\), а через \\(\\tau(G)\\) - число его остовных деревьев. В карточке `miklos-schweitzer-2012-p10b-knot-black-graph-odd-spanning-trees` доказано, что для любой диаграммы узла \\(\\tau(G)\\) нечетно. Поэтому из условия \\(\\tau(G)\\le 3\\) следует \\(\\tau(G)=1\\) или \\(\\tau(G)=3\\).\n\nСначала нужна чисто графовая классификация. Петли можно удалить: они не входят ни в одно остовное дерево. Каждый мост входит во всякое остовное дерево. Более общо, если связный граф разложен по мостам и точкам сочленения на блоки, то число его остовных деревьев равно произведению чисел остовных деревьев нетривиальных блоков; деревообразные части дают множитель \\(1\\).\n\nЕсли \\(\\tau(G)=1\\), то после удаления петель все ребра являются мостами, то есть существенная часть графа - дерево. Если \\(\\tau(G)=3\\), то, поскольку \\(3\\) простое, после удаления петель и всех древесных частей остается ровно один блок \\(H\\) с \\(\\tau(H)=3\\). Покажем, что \\(H\\) - либо треугольник, либо две вершины с тремя параллельными ребрами. Возьмем остовное дерево \\(T\\) блока \\(H\\). Каждое ребро \\(e\\notin T\\) вместе с \\(T\\) образует фундаментальный цикл; заменяя на этом цикле одно ребро дерева на \\(e\\), получаем остовные деревья. Если вне \\(T\\) только одно ребро, то \\(H\\) уницикличен, а \\(\\tau(H)\\) равно длине единственного цикла, значит цикл имеет длину \\(3\\). Если вне \\(T\\) хотя бы два ребра, то для \\(\\tau(H)=3\\) возможны только два таких ребра, и оба должны образовывать с одним и тем же ребром дерева циклы длины \\(2\\); иначе уже получается не менее четырех различных остовных деревьев. Значит, \\(H\\) состоит из двух вершин и трех параллельных ребер.\n\nТеперь вернемся к диаграмме узла. Петля или мост в Tait-графе соответствует отсекаемому перекрёстку диаграммы: через этот перекресток проходит окружность на сфере диаграммы, не пересекающая диаграмму в других точках. Такой перекресток можно удалить ходом Рейдемейстера I или обратным элементарным упрощением без изменения типа узла. Поэтому древесные придатки и петли в описанной графовой классификации не меняют тип узла.\n\nПри \\(\\tau(G)=1\\) после снятия всех отсекаемых перекрёстков диаграмма не имеет существенных перекрестков, значит задает тривиальный узел. При \\(\\tau(G)=3\\) остается один из двух двойственных Tait-графов с тремя ребрами: треугольник или три параллельных ребра. Оба описывают одну и ту же трёхперекрёстковую схему скручивания. С учетом знаков перекрестков это замыкание двухниточной косы \\(\\sigma_1^{\\varepsilon_1}\\sigma_1^{\\varepsilon_2}\\sigma_1^{\\varepsilon_3}\\), где \\(\\varepsilon_i=\\pm1\\). Если все знаки одинаковы, получается правый или левый трилистник. Если знаки не все одинаковы, сумма показателей равна \\(\\pm1\\), и после одного хода Рейдемейстера II остается одно перекрещивание, то есть тривиальный узел.\n\nОбратно, тривиальный узел имеет диаграмму без перекрестков, и ее черный граф имеет одно остовное дерево. Стандартная трёхперекрёстковая диаграмма правого или левого трилистника имеет Tait-граф треугольник, а у треугольника ровно \\(3\\) остовных дерева. Следовательно, список полон.",
