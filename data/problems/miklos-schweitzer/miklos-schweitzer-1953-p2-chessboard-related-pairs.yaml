  "solutions": [
    {
      "id": "solution-extrema",
      "title": "Оценки и конструкции",
      "text": "Ответ: минимум равен \\(128\\), максимум равен \\(256\\).\n\nПусть в \\(i\\)-й строке стоит \\(w_i\\) белых фигур, а в \\(j\\)-м столбце стоит \\(c_j\\) белых фигур. Тогда в этой строке число связанных разноцветных пар равно\n\\[\nw_i(8-w_i),\n\\]\nпотому что каждую белую фигуру можно соединить с каждой чёрной фигурой той же строки. Аналогично столбец \\(j\\) даёт \\(c_j(8-c_j)\\) пар. Каждая связанная пара лежит либо в одной строке, либо в одном столбце, но не в обоих сразу, потому что две разные фигуры не могут стоять в одной клетке. Поэтому общее число связанных пар равно\n\\[\nE=\\sum_{i=1}^8 w_i(8-w_i)+\\sum_{j=1}^8 c_j(8-c_j).\n\\]\n\nМаксимум получается сразу. Для любого \\(x\\in\\{0,1,\\ldots,8\\}\\) имеем \\(x(8-x)\\le 16\\), причём равенство достигается только при \\(x=4\\). Значит, строки дают не больше \\(8\\cdot16=128\\) пар и столбцы дают не больше \\(128\\) пар, всего не больше \\(256\\). Шахматная раскраска клеток в белый и чёрный цвета достигает этой оценки: в каждой строке и каждом столбце по 4 белые и 4 чёрные фигуры. Следовательно, максимум равен \\(256\\).\n\nТеперь докажем нижнюю оценку. Заменим белую фигуру числом \\(+1\\), а чёрную - числом \\(-1\\). Пусть\n\\[\nR_i=\\sum_{j=1}^8 a_{ij},\n\\qquad\nC_j=\\sum_{i=1}^8 a_{ij}\n\\]\n- суммы чисел в строках и столбцах. Так как белых и чёрных фигур поровну, сумма всех \\(a_{ij}\\) равна 0. Кроме того,\n\\[\nR_i=2w_i-8,\n\\qquad\nC_j=2c_j-8.\n\\]\nОтсюда\n\\[\nw_i(8-w_i)=\\frac{64-R_i^2}{4},\n\\qquad\nc_j(8-c_j)=\\frac{64-C_j^2}{4}.\n\\]\nЗначит\n\\[\nE=256-\\frac14\\left(\\sum_i R_i^2+\\sum_j C_j^2\\right).\n\\]\nЧтобы получить \\(E\\ge128\\), достаточно доказать\n\\[\n\\sum_i R_i^2+\\sum_j C_j^2\\le512.\n\\]\n\nЭто следует из простой оценки суммы квадратов. Рассмотрим числа\n\\[\nb_{ij}=a_{ij}-\\frac{R_i}{8}-\\frac{C_j}{8}.\n\\]\nСумма квадратов \\(\\sum b_{ij}^2\\) неотрицательна. Раскроем её. Так как \\(\\sum_j a_{ij}=R_i\\), \\(\\sum_i a_{ij}=C_j\\), а \\(\\sum_i R_i=\\sum_j C_j=0\\), получаем\n\\[\n\\sum_{i,j} b_{ij}^2\n=64-\\frac18\\left(\\sum_i R_i^2+\\sum_j C_j^2\\right).\n\\]\nЛевая часть неотрицательна, поэтому действительно\n\\[\n\\sum_i R_i^2+\\sum_j C_j^2\\le 64\\cdot8=512.\n\\]\nСледовательно,\n\\[\nE\\ge256-\\frac{512}{4}=128.\n\\]\n\nОценка \\(128\\) достижима: покрасим первые четыре строки полностью в белый цвет, а последние четыре строки полностью в чёрный. В строках разноцветных пар нет, а в каждом из 8 столбцов стоят 4 белые и 4 чёрные фигуры, то есть каждый столбец даёт \\(4\\cdot4=16\\) связанных пар. Всего получается \\(8\\cdot16=128\\).\n\nИтак, минимальное возможное число связанных пар равно \\(128\\), а максимальное равно \\(256\\).",
