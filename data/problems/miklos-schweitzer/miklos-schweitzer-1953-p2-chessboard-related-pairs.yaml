  "solutions": [
    {
      "id": "solution-extrema",
      "title": "Оценки и конструкции",
      "text": "Для максимума: в каждой строке при \\(x\\) белых фигурах возникает \\(x(8-x)\\le16\\) разноцветных пар в этой строке, значит все строки дают не больше \\(8\\cdot16=128\\). Столбцы дают ещё не больше 128, итого максимум не превосходит 256. Шахматная раскраска с 32 белыми и 32 чёрными клетками даёт в каждой строке и каждом столбце по четыре фигуры каждого цвета, поэтому достигает 256.\n\nДля минимума удобно пользоваться обобщением из решения книги на доску \\(2k\\times2k\\). Для фиксированного столбца суммируем по его \\(2k\\) фигурам число связанных с ними фигур противоположного цвета. Перестановками строк и обменами разноцветных фигур можно свести конфигурацию к случаю, где этот столбцовый вклад не больше исходного и равен как минимум \\(2k^2\\); следовательно каждый столбец даёт вклад не меньше \\(2k^2\\). Сумма по \\(2k\\) столбцам равна удвоенному числу связанных пар, поэтому пар не меньше \\(2k^3\\). При \\(k=4\\) это 128. Конструкция с четырьмя полностью белыми строками и четырьмя полностью чёрными строками даёт ровно \\(8\\cdot4\\cdot4=128\\) пар, все они столбцовые. Значит минимум равен 128, максимум равен 256.",
      "tags": [
        "degree_counting",
        "double_counting",
        "goal_exact_bound"
      ],
      "status": "ai_checked",
      "standard_idea_ids": [
        "double_counting"
      ]
    }
