  "solutions": [
    {
      "id": "sol-ai-koebe-radius-shift",
      "title": "ИИ-решение по официальному разбору: круговая упаковка и сдвиг радиусов",
      "text": "Зафиксируем двудольное разбиение графа \\(G=(S,T;E)\\). По теореме Кёбе-Андреева-Тёрстона о круговых упаковках всякий конечный планарный граф является контактным графом попарно непересекающихся замкнутых кругов. Значит, вершине \\(v\\) можно сопоставить круг с центром \\(p_v\\) и радиусом \\(r_v>0\\) так, что для любых разных \\(u,v\\) расстояние \\(d(u,v)=|p_u p_v|\\) удовлетворяет \\(d(u,v)\\ge r_u+r_v\\), причем равенство имеет место тогда и только тогда, когда \\(uv\\in E\\). Выберем число \\(R\\) больше всех радиусов \\(r_s\\), \\(s\\in S\\), и настолько большим, что для любых двух разных вершин будет выполнено \\(\\rho_u+\\rho_v>d(u,v)\\), где ниже определены новые радиусы. Это возможно, потому что пар вершин конечное число; например, достаточно взять \\(R\\) не меньше максимального расстояния между центрами и больше всех нужных радиусов. Теперь оставим центры прежними, но зададим новые окружности так: для \\(s\\in S\\) положим \\(\\rho_s=R-r_s\\), а для \\(t\\in T\\) положим \\(\\rho_t=R+r_t\\). Все \\(\\rho_s\\) положительны по выбору \\(R\\). Рассмотрим две разные вершины \\(u,v\\). Всегда имеем \\(|\\rho_u-\\rho_v|\\le r_u+r_v\\le d(u,v)\\). Если \\(uv\\in E\\), то вершины лежат в разных долях, поэтому \\(|\\rho_u-\\rho_v|=r_u+r_v=d(u,v)\\). Следовательно, соответствующие новые окружности касаются внутренним образом. Если же \\(uv\\notin E\\), то из свойства исходной упаковки следует \\(r_u+r_v<d(u,v)\\), а значит \\(|\\rho_u-\\rho_v|<d(u,v)\\). С другой стороны, по выбору \\(R\\) выполнено \\(d(u,v)<\\rho_u+\\rho_v\\). Двойное неравенство \\(|\\rho_u-\\rho_v|<d(u,v)<\\rho_u+\\rho_v\\) является точным критерием того, что две окружности пересекаются в двух точках. Поэтому все смежные пары дают касание, а все различные несмежные пары - две точки пересечения, что и требовалось.",
