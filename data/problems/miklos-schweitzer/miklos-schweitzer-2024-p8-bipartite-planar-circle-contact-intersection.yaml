      "title": "Сдвиг радиусов после круговой упаковки",
      "text": "Сначала представляем планарный граф как контактный граф попарно непересекающихся кругов. Затем для одной доли заменяем радиусы \\(r_v\\) на \\(R-r_v\\), а для другой - на \\(R+r_v\\). Тогда старое касание превращается во внутреннее касание новых окружностей, а при достаточно большом \\(R\\) все не смежные пары имеют две точки пересечения.",
