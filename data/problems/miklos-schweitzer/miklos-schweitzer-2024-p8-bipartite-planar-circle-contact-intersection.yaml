        "text": "Докажите, что для любого конечного двудольного планарного графа каждой вершине можно сопоставить окружность так, чтобы все окружности лежали в одной плоскости, окружности, соответствующие любым двум смежным вершинам, касались друг друга, а окружности, соответствующие любым двум различным несмежным вершинам, пересекались в двух точках.",
