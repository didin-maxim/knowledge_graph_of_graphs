        "title": "Условие",
        "text": "Пусть \\(G\\) - простой \\(k\\)-реберно-связный граф на \\(n\\) вершинах, а \\(u\\) и \\(v\\) - две различные вершины \\(G\\). Докажите, что существуют \\(k\\) попарно реберно-непересекающихся путей из \\(u\\) в \\(v\\), каждый из которых имеет не более \\(20n/k\\) ребер.",
