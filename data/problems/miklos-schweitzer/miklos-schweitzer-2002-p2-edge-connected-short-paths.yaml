  "solutions": [
    {
      "id": "sol-short-length-menger-galil-yu",
      "title": "Применение короткой формы теоремы Менгера Галиля--Ю",
      "text": "Используем короткую форму теоремы Менгера Галиля--Ю как внешний инструмент: если в простом \\(N\\)-вершинном графе есть \\(q\\) попарно реберно-непересекающихся путей между \\(a\\) и \\(b\\), а \\(\\delta(H)\\ge q\\), то эти \\(q\\) путей можно выбрать так, что каждый имеет длину не больше \\(20N/q\\). В этой карточке этот результат не считается школьной леммой: известное доказательство использует поток минимальной стоимости, двойственность и специальный подсчет по уровням.\n\nОстается проверить только редукцию. Так как \\(G\\) является \\(k\\)-реберно-связным, каждый разрез, отделяющий \\(u\\) от \\(v\\), содержит хотя бы \\(k\\) ребер. По обычной реберной форме теоремы Менгера существуют \\(k\\) попарно реберно-непересекающихся \\(u\\)-\\(v\\)-путей. Кроме того, \\(\\delta(G)\\ge k\\): иначе разрез, отделяющий вершину степени меньше \\(k\\) от остального графа, содержал бы меньше \\(k\\) ребер.\n\nПрименяем теорему Галиля--Ю к \\(H=G\\), \\(a=u\\), \\(b=v\\), \\(q=k\\), \\(N=n\\). Получаем \\(k\\) попарно реберно-непересекающихся \\(u\\)-\\(v\\)-путей, каждый длины не больше \\(20n/k\\).",
