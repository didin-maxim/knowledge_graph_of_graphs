      "id": "idea-menger-plus-length-control",
      "title": "Усилить теорему Менгера контролем длины",
      "text": "Обычная теорема Менгера дает \\(k\\) реберно-непересекающихся путей. Содержание задачи в том, что при простоте графа и \\(k\\)-реберной связности можно выбрать такую упаковку без длинных хвостов: если слишком много выбранных путей длинные, их внутренние слои создают слишком много различных вершин или допускают замену более короткими путями.",
