        "title": "Графовая формулировка",
        "text": "В любом простом \\(k\\)-реберно-связном \\(n\\)-вершинном графе для любой пары различных вершин \\(u,v\\) можно упаковать \\(k\\) реберно-непересекающихся \\(u\\)-\\(v\\)-путей с равномерной верхней оценкой длины \\(O(n/k)\\), причем в задаче требуется явная константа 20.",
