      "id": "idea-short-length-menger",
      "title": "Короткая форма теоремы Менгера",
      "text": "Нужное утверждение является прямым следствием короткой формы теоремы Менгера Галиля--Ю: если в простом \\(N\\)-вершинном графе между двумя вершинами есть \\(q\\) реберно-непересекающихся путей и минимальная степень графа не меньше \\(q\\), то эти \\(q\\) путей можно выбрать так, что каждый имеет длину не больше \\(20N/q\\). В данной задаче \\(q=k\\), существование \\(k\\) путей дает реберная форма Менгера, а минимальная степень не меньше \\(k\\) следует из \\(k\\)-реберной связности.",
