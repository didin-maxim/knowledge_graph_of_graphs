    },
    {
      "id": "idea-cut-expansion",
      "title": "Использовать нижнюю оценку на каждый разделяющий разрез",
      "text": "Для множества вершин, отделяющего \\(u\\) от \\(v\\), из \\(k\\)-реберной связности следует как минимум \\(k\\) ребер через разрез. Слоевые или потоковые доказательства должны превращать это локальное условие на разрезы в упаковку коротких путей.",
