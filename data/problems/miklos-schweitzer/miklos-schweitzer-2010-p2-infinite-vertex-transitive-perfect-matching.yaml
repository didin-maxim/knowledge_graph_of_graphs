  "solutions": [
    {
      "id": "sol-ai-infinite-transitive-matching-theorem",
      "title": "ИИ-решение через бесконечную теорему о паросочетании в вершинно-транзитивном графе",
      "text": "Воспользуемся известной бесконечной версией теоремы Годсила--Ройла: каждый счётный бесконечный связный вершинно-транзитивный граф имеет совершенное паросочетание. Для локально конечного случая, достаточного здесь, схема доказательства такова.\n\nПаросочетание называют сильно максимальным, если его нельзя улучшить конечной симметрической разностью; эквивалентно, в локально конечном графе нет увеличивающего чередующегося пути. Теорема Аарони гарантирует существование сильно максимального паросочетания. Вершина называется критической, если она покрыта каждым сильно максимальным паросочетанием. Это свойство сохраняется автоморфизмами, поэтому в вершинно-транзитивном графе либо все вершины критичны, либо ни одна. В первом случае любое сильно максимальное паросочетание уже совершенно.\n\nРассмотрим второй случай, когда критических вершин нет. Нужный шаг доказывается индукцией по длине пути между двумя различными вершинами \\(u\\) и \\(v\\): если внутренние вершины пути некритичны, то не существует сильно максимального паросочетания, пропускающего одновременно \\(u\\) и \\(v\\). Для ребра \\(uv\\) это ясно: добавление ребра улучшило бы паросочетание. В шаге индукции берём внутреннюю вершину \\(y\\). Так как \\(y\\) некритична, есть сильно максимальное паросочетание \\(M_y\\), пропускающее \\(y\\). По индукции ни одно сильно максимальное паросочетание не пропускает одновременно \\(u,y\\) или \\(y,v\\), значит \\(M_y\\) покрывает \\(u\\) и \\(v\\). Если бы существовало сильно максимальное паросочетание \\(N\\), пропускающее \\(u\\) и \\(v\\), то в симметрической разности \\(N\\triangle M_y\\) чередующиеся компоненты вынудили бы одну компоненту-путь соединять \\(u\\) с \\(y\\), а другую -- \\(y\\) с \\(v\\); одна вершина \\(y\\) не может быть концом двух разных компонент. Противоречие. Следовательно, всякое сильно максимальное паросочетание пропускает не более одной вершины.\n\nПусть теперь \\(T\\) -- произвольное конечное множество вершин. Возьмём сильно максимальное паросочетание \\(M\\). Если оно пропускает вершину \\(x\\), то из бесконечности и вершинной транзитивности можно автоморфизмом перенести \\(x\\) в вершину вне \\(T\\). Образ \\(M\\) покрывает все вершины из \\(T\\). Итак, для каждого конечного \\(T\\) существует паросочетание, покрывающее \\(T\\).\n\nОстаётся применить компактность. Выберем возрастающие конечные множества \\(B_1\\subset B_2\\subset\\cdots\\), объединение которых равно \\(V(G)\\), и для каждого \\(n\\) паросочетание, покрывающее \\(B_n\\). Так как граф локально конечен, на каждом конечном множестве есть лишь конечное число возможных ограничений паросочетаний. Диагональным выбором подпоследовательностей получаем предельное паросочетание, которое покрывает каждое \\(B_k\\), а значит, все вершины графа.\n\nНаш граф \\(G\\) счётен, бесконечен, связен и вершинно-транзитивен; условие \\(d\\)-регулярности дополнительно даёт локальную конечность. Следовательно, описанная теорема применима к \\(G\\), и в \\(G\\) существует совершенное паросочетание.",
