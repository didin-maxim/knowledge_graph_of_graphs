  "ideas": [
    {
      "id": "idea-propagate-line-through-triangles",
      "title": "Коллинеарность распространяется по связным цветовым классам",
      "text": "Если два цвета уже задают прямую, то связность прообразов должна позволить через треугольники протащить ограничение на третий цвет. Главная трудность - аккуратно показать, что любой новый цвет связан цепочкой треугольников с уже выбранными двумя цветами.",
