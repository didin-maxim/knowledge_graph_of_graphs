        "title": "Отображение ребер в евклидово пространство",
        "text": "Пусть \\(K=(V,E)\\) - конечный простой полный граф, а \\(d\\) - положительное целое число. Пусть \\(\\varphi:E\\to\\mathbb R^d\\) - отображение множества ребер в евклидово пространство, такое что прообраз любой точки из образа задает связный граф на всем множестве вершин \\(V\\), а точки, сопоставленные ребрам любого треугольника в \\(K\\), коллинеарны. Докажите, что образ \\(\\varphi\\) лежит на одной прямой.",
