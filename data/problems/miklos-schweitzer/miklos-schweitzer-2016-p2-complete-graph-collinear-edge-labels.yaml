  "solutions": [
    {
      "id": "sol-ai-gallai-reduction",
      "title": "ИИ-решение через лемму Галлаи о раскрасках без радужных треугольников",
      "text": "Докажем от противного, что образ \\(\\varphi\\) не может содержать три неколлинеарные точки.\n\nНам понадобится стандартная лемма Галлаи в следующей форме: если ребра полного графа раскрашены так, что нет треугольника с тремя попарно различными цветами, и каждый использованный цвет задает связный остовный подграф, то использовано не больше двух цветов. Действительно, по теореме Галлаи о раскрасках без радужных треугольников вершины можно нетривиально разбить на блоки так, что между разными блоками встречаются только два цвета, а все ребра между каждой парой блоков одноцветны. Тогда всякий третий цвет может встречаться только внутри одного или нескольких блоков и не имеет ребер между блоками; поэтому его цветовой подграф не может быть связным на всем множестве вершин. Значит, при связности всех цветовых классов третьего цвета быть не может.\n\nПредположим теперь, что множество \\(P=\\varphi(E)\\) не лежит на одной прямой. Выберем две точки \\(A,B\\in P\\) и точку \\(C\\in P\\), не лежащую на прямой \\(\\ell=AB\\). Перекрасим ребра полного графа в три абстрактных цвета: красный, если \\(\\varphi(e)=A\\); синий, если \\(\\varphi(e)\\in \\ell\\setminus\\{A\\}\\); зеленый, если \\(\\varphi(e)\\notin\\ell\\). Все три абстрактных цвета действительно используются: красный есть на прообразе \\(A\\), синий - на прообразе \\(B\\), зеленый - на прообразе \\(C\\).\n\nКаждый абстрактный цвет задает связный остовный подграф. Например, красный класс - это исходный прообраз точки \\(A\\), он связен по условию; синий и зеленый классы являются объединениями непустых исходных цветовых классов, каждый из которых сам связен на том же множестве вершин, значит, их объединения тоже связны.\n\nПокажем, что в новой трехцветной раскраске нет радужного треугольника. Возьмем любой треугольник исходного полного графа. По условию три точки, сопоставленные его ребрам, лежат на некоторой прямой \\(m\\). Если \\(m=\\ell\\), то все три абстрактных цвета среди красного и синего. Если \\(m\\ne\\ell\\), то прямые \\(m\\) и \\(\\ell\\) имеют не больше одной общей точки; следовательно, среди трех точек на \\(m\\) не могут одновременно встретиться точка \\(A\\), другая точка прямой \\(\\ell\\) и точка вне \\(\\ell\\). Значит, снова используются не все три абстрактных цвета.\n\nМы получили раскраску ребер полного графа тремя использованными цветами без радужных треугольников, причем каждый цветовой класс связен. Это противоречит лемме Галлаи. Поэтому предположение было неверным, и весь образ \\(\\varphi(E)\\) лежит на одной прямой.",
