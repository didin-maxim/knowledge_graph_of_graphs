        "title": "Отрезки и кривые",
        "text": "В плоскости даны \\(n\\) отрезков, каждый из которых вертикален или горизонтален; отрезки могут пересекаться. Кроме того, даны \\(m\\) кривых, выходящих из начала координат, попарно непересекающихся за исключением общего начального конца, причем каждая кривая пересекает ровно два отрезка, а разные кривые пересекают разные пары отрезков. Докажите, что \\(m=O(n)\\).",
