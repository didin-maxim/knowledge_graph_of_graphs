  "solutions": [
    {
      "id": "sol-official-planar",
      "title": "Сведение к плоским графам",
      "text": "Сначала устраним вырожденности малым возмущением: можно считать, что начало координат не лежит на отрезке, параллельные отрезки не лежат на одной прямой, а конец одного отрезка не лежит внутри другого. Это не меняет пары отрезков, пересекаемые каждой кривой.\n\nЕсли рассматривать только кривые, пересекающие два горизонтальных отрезка, то горизонтальные отрезки образуют попарно непересекающееся семейство. Стянем каждый такой отрезок в вершину, а каждую кривую оставим как ребро между двумя соответствующими вершинами. Так как кривые попарно не пересекаются вне начала и разные кривые задают разные пары отрезков, получается простой плоский граф; значит таких кривых \\(O(n)\\). То же верно для пар вертикальных отрезков.\n\nОстается случай, когда кривая пересекает один горизонтальный и один вертикальный отрезок. Возьмем малую жорданову кривую вокруг начала координат, которую каждая данная кривая пересекает один раз, и удалим ее внутренность. Полученную область отождествим с северным полушарием сферы и нарисуем на ней кривые вместе с горизонтальными отрезками. На южном полушарии нарисуем те же кривые вместе с вертикальными отрезками. Каждая исходная кривая теперь служит общей дугой, связывающей горизонтальный объект на одной половине с вертикальным объектом на другой, а пересечения не возникают сверх уже разрешенных. После стягивания отрезков снова получается плоский граф с \\(O(n)\\) вершинами, следовательно, и таких кривых \\(O(n)\\).\n\nСуммируя три типа кривых - горизонтальная-горизонтальная, вертикальная-вертикальная и смешанная, получаем \\(m=O(n)\\).",
