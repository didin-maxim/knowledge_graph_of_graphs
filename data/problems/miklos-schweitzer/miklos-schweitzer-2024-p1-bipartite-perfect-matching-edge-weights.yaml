      "text": "Минимальные ребра у вершин \\(S\\) и максимальные ребра у вершин \\(T\\) должны быть двумя совершенными паросочетаниями, возможно совпадающими. Задача состоит в том, чтобы выбрать их и затем продолжить выбор до полного строгого порядка на ребрах.",
