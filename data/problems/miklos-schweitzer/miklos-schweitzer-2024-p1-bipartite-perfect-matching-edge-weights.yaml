        "text": "Пусть \\(G=(S,T;E)\\) - конечный двудольный граф, имеющий совершенное паросочетание. Докажите, что существует инъективная весовая функция \\(w:E\\to\\mathbb R\\) со следующими свойствами. (1) Если \\(e_s\\) обозначает ребро минимального веса среди ребер, инцидентных \\(s\\in S\\), то множество \\(\\{e_s:s\\in S\\}\\) является совершенным паросочетанием в \\(G\\). (2) Если \\(e_t\\) обозначает ребро максимального веса среди ребер, инцидентных \\(t\\in T\\), то множество \\(\\{e_t:t\\in T\\}\\) является совершенным паросочетанием в \\(G\\).",
