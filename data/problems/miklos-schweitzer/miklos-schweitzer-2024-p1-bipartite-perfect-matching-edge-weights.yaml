        "title": "Эквивалентно об упорядочении ребер",
        "text": "Нужно линейно упорядочить ребра двудольного графа так, чтобы первые ребра в звездах вершин доли \\(S\\) образовывали совершенное паросочетание, а последние ребра в звездах вершин доли \\(T\\) тоже образовывали совершенное паросочетание.",
