  "solutions": [
    {
      "id": "sol-ai-official-induction-alternating-cycle",
      "title": "ИИ-решение по официальному разбору: индукция и чередующийся цикл",
      "text": "Достаточно построить строгий порядок на рёбрах; затем можно заменить его любыми попарно различными вещественными весами в этом порядке. Докажем утверждение индукцией по \\(n=|S|=|T|\\).\n\nСначала нужна лемма. Пусть в двудольном графе \\(H=(S,T;E)\\) существует ровно одно совершенное паросочетание \\(M\\). Тогда рёбра \\(M\\) можно занумеровать как \\((s_1,t_1),\\ldots,(s_n,t_n)\\) так, что при \\(i>j\\) ребра \\(s_i t_j\\) нет. Докажем это индукцией по \\(n\\). Если в доле \\(T\\) есть вершина степени 1, возьмём её за \\(t_n\\), удалим её вместе с единственным соседом \\(s_n\\) и применим индукцию к оставшемуся графу. Если же все вершины доли \\(T\\) имеют степень хотя бы 2, то для каждого \\(t\\in T\\) можно выбрать инцидентное ребро, не лежащее в \\(M\\). Направим выбранные рёбра из \\(T\\) в \\(S\\), а рёбра \\(M\\) из \\(S\\) в \\(T\\). Из любой вершины \\(T\\) можно бесконечно идти по направленным рёбрам, поэтому в конечном графе возникнет направленный цикл; он автоматически чередуется между рёбрами из \\(M\\) и вне \\(M\\). Переключение вдоль этого цикла даёт другое совершенное паросочетание. Противоречие, значит вершина степени 1 существовала, и лемма доказана.\n\nТеперь рассмотрим сам граф \\(G\\). Если совершенное паросочетание в \\(G\\) единственно, применим лемму и обозначим его рёбра через \\((s_i,t_i)\\). Положим вес ребра \\(s_i t_i\\) равным \\(i\\). Всякое другое ребро может иметь вид только \\(s_i t_j\\) при \\(i<j\\); назначим ему произвольный новый вес строго между \\(i\\) и \\(j\\). Тогда у вершины \\(s_i\\) ребро \\(s_i t_i\\) легче всех остальных инцидентных ей рёбер, а у вершины \\(t_j\\) ребро \\(s_j t_j\\) тяжелее всех остальных инцидентных ей рёбер. Поэтому оба требуемых множества рёбер совпадают с единственным совершенным паросочетанием.\n\nОстался случай, когда в \\(G\\) есть два различных совершенных паросочетания. Их симметрическая разность содержит чередующийся цикл \\(C\\). Удалим все вершины \\(C\\) и получим граф \\(G'=(S',T';E')\\), который всё ещё имеет совершенное паросочетание. По индукционному предположению на \\(E'\\) уже есть подходящие попарно различные веса. Выберем числа \\(m<M\\) так, чтобы все эти веса лежали между \\(m\\) и \\(M\\); если \\(G'\\) пуст, просто возьмём любые \\(m<M\\).\n\nЦикл \\(C\\) распадается на два совершенных паросочетания своих вершин. Одно из них назовём нижним и дадим его рёбрам попарно различные веса меньше \\(m-1\\), а другое назовём верхним и дадим его рёбрам попарно различные веса больше \\(M+1\\). Все остальные рёбра между вершинами \\(C\\), если они есть, получат попарно различные веса между \\(m\\) и \\(M\\). Рёбрам, соединяющим вершину из \\(S'\\) с вершиной из \\(T\\cap V(C)\\), дадим попарно различные веса между \\(M\\) и \\(M+1\\). Рёбрам, соединяющим вершину из \\(S\\cap V(C)\\) с вершиной из \\(T'\\), дадим попарно различные веса между \\(m-1\\) и \\(m\\). Все интервалы выбраны непересекающимися или открытыми относительно уже использованных весов, поэтому инъективность легко сохранить.\n\nПроверим свойства. Для вершины \\(s\\in S'\\) новые рёбра, ведущие из неё в \\(C\\), имеют веса больше \\(M\\), а старый минимальный выбор внутри \\(G'\\) имеет вес меньше \\(M\\); значит минимум у \\(s\\) не меняется. Для вершины \\(t\\in T'\\) новые рёбра из \\(C\\) имеют веса меньше \\(m\\), а старый максимальный выбор внутри \\(G'\\) имеет вес больше \\(m\\); значит максимум у \\(t\\) не меняется. Для вершины \\(s\\in S\\cap V(C)\\) единственное инцидентное ей ребро нижнего паросочетания имеет вес меньше всех остальных возможных рёбер, а для вершины \\(t\\in T\\cap V(C)\\) единственное инцидентное ей ребро верхнего паросочетания имеет вес больше всех остальных возможных рёбер. Следовательно, минимальные рёбра в звёздах вершин доли \\(S\\) составляют объединение старого минимального паросочетания в \\(G'\\) и нижнего паросочетания цикла \\(C\\), то есть совершенное паросочетание в \\(G\\). Аналогично максимальные рёбра в звёздах вершин доли \\(T\\) составляют объединение старого максимального паросочетания в \\(G'\\) и верхнего паросочетания цикла \\(C\\), тоже совершенное паросочетание. Индукция завершена.",
