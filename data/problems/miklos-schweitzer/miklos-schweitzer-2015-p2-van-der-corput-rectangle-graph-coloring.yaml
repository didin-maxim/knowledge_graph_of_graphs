      "id": "idea-dyadic-levels",
      "title": "Сравнить первый и последний отличающиеся биты",
      "text": "Если вершину \\((n,x_n)\\) кодировать двоичной записью \\(n\\), то порядок по первой координате задаётся первым отличающимся битом слева, а порядок по второй координате - последним отличающимся битом справа. Это позволяет перечислить все возможные пары, которые вообще могут быть рёбрами, и увидеть, что разность их первых координат не делится на \\(7\\).",
