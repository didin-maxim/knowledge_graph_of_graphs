    {
      "id": "idea-dyadic-levels",
      "title": "Использовать двоичную структуру последовательности",
      "text": "Точки Ван дер Корпута имеют жесткую dyadic-структуру: близость по первой координате и порядок по второй кодируются двоичными разрядами. Вероятная раскраска должна зависеть от нескольких старших/младших разрядов так, чтобы ребра прямоугольной видимости не соединяли одинаковые классы.",
