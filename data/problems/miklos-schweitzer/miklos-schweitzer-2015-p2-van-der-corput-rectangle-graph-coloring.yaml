        "id": "stmt-original",
        "title": "Прямоугольники и последовательность Ван дер Корпута",
        "text": "Пусть \\(x_n\\) - последовательность Ван дер Корпута: если двоичная запись \\(n\\) равна \\(\\sum a_i2^i\\), то \\(x_n=\\sum a_i2^{-i-1}\\). Пусть \\(V\\) - множество точек плоскости вида \\((n,x_n)\\). Определим граф \\(G\\) с множеством вершин \\(V\\): две точки \\(p,q\\) соединены ребром, если существует осепараллельный прямоугольник \\(R\\), для которого \\(R\\cap V=\\{p,q\\}\\). Докажите, что хроматическое число \\(G\\) конечно.",
        "source_id": "src-miklos-schweitzer-2015-p2-official",
        "status": "needs_human_review",
        "self_contained": {
          "status": "ai_checked"
        },
