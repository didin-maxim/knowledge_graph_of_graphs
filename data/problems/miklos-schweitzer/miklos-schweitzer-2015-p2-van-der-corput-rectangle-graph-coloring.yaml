  "solutions": [
    {
      "id": "sol-ai-official-mod-7-coloring",
      "title": "ИИ-адаптация официального решения: раскраска по модулю 7",
      "text": "Кодируем вершину \\((n,x_n)\\) бесконечной влево двоичной последовательностью \\((a_i)_{i\\ge 0}\\), где \\(n=\\sum a_i2^i\\); слева дописываем сколько угодно нулей. В такой записи первая координата сравнивается по первому отличающемуся биту слева: больше то число, у которого в этом месте стоит \\(1\\). Вторая координата \\(x_n=\\sum a_i2^{-i-1}\\) сравнивается по последнему отличающемуся биту справа: больше то \\(x_n\\), у которого в этом месте стоит \\(1\\).\n\nДве вершины не соединены ребром тогда и только тогда, когда существует третья вершина, лежащая между ними и по первой, и по второй координате. Действительно, если такая вершина есть, всякий осепараллельный прямоугольник, содержащий две данные вершины, содержит и её. Обратно, если такой вершины нет, маленькое расширение прямоугольника с противоположными углами в этих двух точках содержит из \\(V\\) только эти две точки.\n\nВозьмём две разные кодовые последовательности. Если их первый и последний отличающиеся биты совпадают, пара имеет вид \\(\\alpha0\\omega\\) и \\(\\alpha1\\omega\\), где \\(\\omega\\) - конечный хвост. Если эти биты различны, то пара имеет один из видов \\(\\alpha0\\kappa0\\omega,\\alpha1\\kappa'1\\omega\\) или \\(\\alpha0\\kappa1\\omega,\\alpha1\\kappa'0\\omega\\), где \\(\\kappa\\) и \\(\\kappa'\\) имеют одинаковую длину \\(\\ell\\).\n\nТеперь отсеем пары, которые точно не являются рёбрами. Пара \\(\\alpha00\\omega,\\alpha11\\omega\\) не является ребром, потому что \\(\\alpha01\\omega\\) лежит между ними в обоих порядках. Пара \\(\\alpha0\\kappa0\\omega,\\alpha1\\kappa'1\\omega\\) не является ребром, если \\(\\kappa\\ne1^\\ell\\): свидетелем служит \\(\\alpha01^\\ell0\\omega\\). Она также не является ребром, если \\(\\kappa'\\ne0^\\ell\\): свидетелем служит \\(\\alpha10^\\ell1\\omega\\). Наконец, для пары \\(\\alpha0\\kappa1\\omega,\\alpha1\\kappa'0\\omega\\) аналогично: если \\(\\kappa,\\kappa'\\ne0^\\ell\\), то свидетелем служит \\(\\alpha10^\\ell1\\omega\\), а если \\(\\kappa,\\kappa'\\ne1^\\ell\\), то свидетелем служит \\(\\alpha01^\\ell0\\omega\\).\n\nЗначит, возможные рёбра встречаются только среди следующих типов:\n\\[\n\\alpha0\\omega,\\alpha1\\omega;\\qquad\n\\alpha01^\\ell0\\omega,\\alpha10^\\ell1\\omega\\ (\\ell>0);\\qquad\n\\alpha00^\\ell1\\omega,\\alpha11^\\ell0\\omega;\\qquad\n\\alpha01^\\ell1\\omega,\\alpha10^\\ell0\\omega.\n\\]\nПусть \\(|\\omega|=s\\). Тогда разность первых координат в этих случаях соответственно имеет вид \\(2^s\\), \\(3\\cdot2^s\\), \\((2^{\\ell+2}-3)2^s\\) или снова \\(2^s\\). Ни одно из этих чисел не делится на \\(7\\): степени двойки не делятся на \\(7\\), а \\(2^m\\) по модулю \\(7\\) принимает только значения \\(1,2,4\\), поэтому \\(2^m-3\\not\\equiv0\\pmod7\\).\n\nСледовательно, если покрасить вершину \\((n,x_n)\\) в цвет \\(n\\bmod 7\\), то концы любого возможного ребра получат разные цвета. Это правильная раскраска графа \\(G\\) в семь цветов, значит, \\(\\chi(G)\\le7\\), в частности хроматическое число конечно.",
