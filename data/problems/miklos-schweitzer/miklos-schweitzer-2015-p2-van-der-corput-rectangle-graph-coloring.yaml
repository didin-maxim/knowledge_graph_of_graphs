    "graph_theory": [
      {
        "id": "stmt-graph",
        "title": "Геометрический граф",
        "text": "На бесконечном множестве точек \\((n,x_n)\\) задан граф прямоугольной видимости: ребро означает, что пара точек может быть отделена осепараллельным прямоугольником от всех остальных точек множества. Нужно доказать ограниченность хроматического числа этого бесконечного графа абсолютной константой.",
