  "solutions": [
    {
      "id": "sol-gyarfas-simonsovits",
      "title": "Компонента размера не меньше хроматического числа",
      "text": "Используем стандартную лемму: в любой раскраске ребер графа в два цвета существует одноцветная связная компонента, содержащая не меньше \\(\\chi(G)\\) вершин. Действительно, если все одноцветные компоненты меньше \\(\\chi(G)\\), то сжатие компонент одного цвета и рассмотрение пересечений с компонентами другого цвета дает правильную вершинную раскраску с меньшим числом цветов; это противоречит определению хроматического числа. Поэтому есть одноцветная компонента \\(C\\) с \\(|C|\\ge k\\). В связном графе \\(C\\) выберем любые \\(k\\) вершин и минимальный связный подграф, который их содержит; из него удалением циклов получаем одноцветное дерево с \\(k\\) вершинами.",
