  "solutions": [
    {
      "id": "sol-bialostocki-gyarfas-konig-components",
      "title": "Двудольный мультиграф красных и синих компонент",
      "text": "Случай \\(k=1\\) тривиален: любая вершина является деревом на одной вершине. Далее считаем \\(k\\ge 2\\).\n\nРассмотрим красный подграф, состоящий из всех вершин \\(G\\) и только красных ребер, и синий подграф, состоящий из всех вершин \\(G\\) и только синих ребер. Пусть \\(R_1,R_2,\\ldots\\) - красные компоненты связности, а \\(B_1,B_2,\\ldots\\) - синие компоненты связности. Построим вспомогательный двудольный мультиграф \\(H\\): в одной доле стоят все красные компоненты \\(R_i\\), в другой - все синие компоненты \\(B_j\\), а каждой вершине \\(v\\in V(G)\\) соответствует ребро \\(e_v\\), соединяющее ту красную компоненту и ту синюю компоненту, которым принадлежит \\(v\\). Если несколько вершин лежат в одной и той же паре компонент, в \\(H\\) появляются параллельные ребра, что разрешено.\n\nСтепень вершины \\(R_i\\) в \\(H\\) равна \\(|R_i|\\), потому что ровно вершины красной компоненты \\(R_i\\) дают ребра, инцидентные \\(R_i\\). Аналогично степень вершины \\(B_j\\) равна \\(|B_j|\\). Предположим от противного, что каждая одноцветная компонента имеет не более \\(k-1\\) вершин. Тогда максимальная степень \\(\\Delta(H)\\le k-1\\).\n\nПо теореме Кёнига о рёберной раскраске двудольного мультиграфа ребра \\(H\\) можно правильно раскрасить в \\(\\Delta(H)\\le k-1\\) цветов: любые два ребра с общим концом получают разные цвета. Перенесем эту раскраску обратно на вершины \\(G\\): вершине \\(v\\) дадим цвет ребра \\(e_v\\). Это правильная раскраска вершин исходного графа. В самом деле, если \\(uv\\) - красное ребро в \\(G\\), то \\(u\\) и \\(v\\) лежат в одной красной компоненте, значит ребра \\(e_u\\) и \\(e_v\\) имеют общий конец \\(R_i\\) в \\(H\\) и потому окрашены различно. Для синего ребра рассуждение такое же через общий конец \\(B_j\\). Следовательно, \\(G\\) можно правильно раскрасить не более чем в \\(k-1\\) цветов, что противоречит \\(\\chi(G)=k\\).\n\nЗначит, некоторая красная или синяя компонента \\(C\\) содержит хотя бы \\(k\\) вершин. Возьмем остовное дерево этой компоненты; все его ребра имеют один цвет. Если в нем больше \\(k\\) вершин, будем удалять листья, пока не останется ровно \\(k\\) вершин. После удаления листа дерево остается деревом, а цвет всех оставшихся ребер не меняется. Получаем одноцветное дерево на \\(k\\) вершинах.",
