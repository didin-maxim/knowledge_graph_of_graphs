  "ideas": [
    {
      "id": "idea-components-color-vertices",
      "title": "Малые одноцветные компоненты дали бы правильную раскраску вершин",
      "text": "Если каждая одноцветная компонента имеет меньше \\(k\\) вершин, можно попытаться закодировать вершину парой ее красной и синей компонент и получить раскраску исходного графа менее чем в \\(k\\) цветов. Противоречие с \\(\\chi(G)=k\\) заставляет одну компоненту иметь хотя бы \\(k\\) вершин.",
