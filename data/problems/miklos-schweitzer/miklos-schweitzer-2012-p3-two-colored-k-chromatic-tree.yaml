  "ideas": [
    {
      "id": "idea-components-as-bipartite-multigraph",
      "title": "Одноцветные компоненты становятся вершинами двудольного мультиграфа",
      "text": "Вершину исходного графа можно рассматривать как ребро между ее красной и синей компонентами. Если все одноцветные компоненты имеют меньше \\(k\\) вершин, то этот двудольный мультиграф имеет максимальную степень меньше \\(k\\); по теореме Кёнига его ребра раскрашиваются в меньше чем \\(k\\) цветов. Такая раскраска ребер дает правильную раскраску вершин исходного графа, противореча \\(\\chi(G)=k\\).",
      "tags": [
