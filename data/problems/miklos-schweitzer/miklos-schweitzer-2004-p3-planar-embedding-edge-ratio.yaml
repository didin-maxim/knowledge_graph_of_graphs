  "solutions": [
    {
      "id": "sol-borrazzo-frati-nested-triangles",
      "title": "Вложенные треугольники с линейным ростом периметра",
      "text": "Решение основано на конструкции из статьи Borrazzo--Frati о планарном отношении длин рёбер.\n\nДля прямолинейного плоского рисунка \\(\\Gamma\\) обозначим через \\(\\rho(\\Gamma)\\) отношение длины самого длинного ребра к длине самого короткого. Достаточно построить для каждого \\(n\\) планарный граф, у которого во всяком таком рисунке \\(\\rho(\\Gamma)\\ge cn\\).\n\nСначала построим плоские графы \\(H_k\\) на \\(3k\\) вершинах с выделенной внешней гранью. Граф \\(H_1\\) -- это треугольник \\(C_1=a_1b_1c_1\\). Пусть уже построен \\(H_{i-1}\\), внешняя грань которого ограничена треугольником \\(C_{i-1}=a_{i-1}b_{i-1}c_{i-1}\\). Тогда \\(H_i\\) получается так: берём новый внешний треугольник \\(C_i=a_i b_i c_i\\), помещаем \\(H_{i-1}\\) внутрь него и добавляем шесть рёбер \\(a_i a_{i-1}\\), \\(a_i b_{i-1}\\), \\(a_i c_{i-1}\\), \\(b_i b_{i-1}\\), \\(b_i c_{i-1}\\), \\(c_i c_{i-1}\\). Этот граф планарен и имеет \\(3i\\) вершин.\n\nДокажем, что в любом прямолинейном плоском рисунке \\(H_k\\), уважающем это вложение и имеющем \\(C_k\\) внешней гранью, отношение длин рёбер не меньше постоянной, умноженной на \\(k\\). Нормируем рисунок так, чтобы самое короткое ребро имело длину \\(1\\). Пусть \\(\\Delta_i\\) -- геометрический треугольник, изображающий цикл \\(C_i\\), а \\(p(\\Delta_i)\\) -- его периметр. Мы докажем индукцией, что \\(p(\\Delta_i)\\ge 0.3 i\\). Для \\(i=1\\) это верно, потому что все три стороны являются рёбрами и имеют длину хотя бы \\(1\\).\n\nНужны две геометрические леммы. Пусть \\(\\Delta=abc\\), а точка \\(d\\) лежит вне \\(\\Delta\\), причём точка \\(a\\) лежит внутри треугольника \\(bcd\\) или на одной из сторон \\(bd\\), \\(cd\\). Тогда \\(p(bcd)>p(abc)\\). Если \\(a\\) лежит на \\(bd\\) или \\(cd\\), это сразу следует из неравенства треугольника. Если \\(a\\) лежит внутри \\(bcd\\), пусть прямая \\(ab\\) пересекает \\(cd\\) в точке \\(x\\). Тогда \\(|ax|+|cx|>|ac|\\), значит \\(p(bcx)>p(abc)\\), а из \\(|bd|+|dx|>|bx|\\) следует \\(p(bcd)>p(bcx)\\).\n\nВторая лемма усиливает первую: если дополнительно \\(|ad|\\ge1\\) и угол при \\(a\\) в \\(abc\\) не больше \\(90^\\circ\\), то \\(p(bcd)>p(abc)+1\\). Когда \\(a\\) лежит на \\(bd\\) или \\(cd\\), тупость внешнего смежного угла даёт, что новая сторона, заменяющая старую, длиннее старой, а отрезок \\(ad\\) добавляет хотя бы \\(1\\). В случае, когда \\(a\\) внутри \\(bcd\\), обозначим через \\(x\\) и \\(y\\) пересечения прямых \\(ab\\), \\(ac\\) со сторонами \\(cd\\), \\(bd\\). Из угла \\(\\angle a\\le90^\\circ\\) следует \\(|cx|>|ca|\\) и \\(|by|>|ba|\\), поэтому прирост периметра больше, чем \\(|dx|+|dy|\\). Проведём через \\(x\\) прямую, параллельную \\(ac\\), и пусть она пересекает \\(bd\\) в точке \\(z\\). Из подобия и тупого угла при \\(x\\) получается \\(|dx|>|xz|>|ay|\\), а аналогично \\(|dy|>|ax|\\). Вместе с неравенствами треугольника для путей от \\(a\\) к \\(d\\) через \\(x\\) и через \\(y\\) это даёт \\(|dx|+|dy|>1\\). Значит периметр вырос больше чем на \\(1\\).\n\nПереходим к шагу индукции. Рассмотрим переход от \\(\\Delta_{i-1}=a_{i-1}b_{i-1}c_{i-1}\\) к \\(\\Delta_i=a_i b_i c_i\\). Внутри рисунка последовательно возникают треугольники \\(a_i b_{i-1}c_{i-1}\\), затем \\(a_i b_i c_{i-1}\\), затем \\(a_i b_i c_i\\). По первой лемме периметр на каждом из этих расширений строго возрастает. Если на одном из первых двух расширений применима вторая лемма, то прирост уже больше \\(1\\), и тем более больше \\(0.3\\).\n\nОстаётся случай, когда соответствующие два угла тупые. Повернём рисунок так, чтобы \\(b_{i-1}c_{i-1}\\) была горизонтальна, \\(b_{i-1}\\) лежала справа от \\(c_{i-1}\\), а \\(a_{i-1}\\) -- выше. Пусть \\(p_i\\) -- точка пересечения прямых \\(a_{i-1}b_{i-1}\\) и \\(c_{i-1}a_i\\), а \\(q_i\\) -- точка пересечения прямых \\(a_{i-1}c_{i-1}\\) и \\(b_{i-1}a_i\\). Если \\(|a_iq_i|\\ge0.4\\), то первая лемма, применённая к треугольнику \\(b_{i-1}c_{i-1}q_i\\), и тупой угол при \\(q_i\\) дают \\(p(a_i b_{i-1}c_{i-1})>p(\\Delta_{i-1})+0.4\\). Если же \\(|a_iq_i|<0.4\\), то должно быть \\(|a_ip_i|\\ge0.4\\): иначе из подобия вспомогательных треугольников следовало бы \\(|a_{i-1}q_i|<|a_ip_i|<0.4\\), а тогда \\(|a_{i-1}a_i|<|a_{i-1}q_i|+|q_i a_i|<0.8\\), что невозможно, поскольку \\(a_{i-1}a_i\\) -- ребро и все рёбра имеют длину хотя бы \\(1\\).\n\nВ последнем случае положим \\(x=|b_{i-1}a_i|\\), \\(y=|a_ip_i|\\), \\(z=|b_{i-1}p_i|\\). Имеем \\(x\\ge1\\), \\(y\\ge0.4\\). Из того, что угол при \\(a_i\\) в треугольнике \\(b_{i-1}a_ip_i\\) острый, следует \\(z<\\sqrt{x^2+y^2}\\). Поэтому прирост периметра больше \\(x+y-z>x+y-\\sqrt{x^2+y^2}\\). Эта величина возрастает по \\(x\\) и по \\(y\\) при положительных \\(x,y\\), значит при \\(x\\ge1\\), \\(y\\ge0.4\\) она больше \\(1.4-\\sqrt{1.16}>0.32\\). Во всех случаях \\(p(\\Delta_i)>p(\\Delta_{i-1})+0.3\\), и индукция доказана.\n\nСледовательно, \\(p(\\Delta_k)\\ge0.3k\\), так что одна из трёх сторон внешнего треугольника \\(C_k\\) имеет длину хотя бы \\(0.1k\\). Минимальная длина ребра равна \\(1\\), поэтому \\(\\rho(\\Gamma)\\ge0.1k\\).\n\nТеперь снимем условие о заранее заданной внешней грани. Возьмём граф \\(K_4\\) с вершинами \\(a,b,c,d\\) и две копии \\(H_k'\\), \\(H_k''\\). Отождествим внешний цикл первой копии с треугольником \\(abc\\), а внешний цикл второй копии -- с треугольником \\(abd\\). Полученный планарный граф \\(G_k\\) имеет \\(4+(3k-3)+(3k-3)=6k-2\\) вершин. В любом плоском рисунке \\(G_k\\) хотя бы одна из двух копий \\(H_k'\\), \\(H_k''\\) расположена по ту сторону своего граничного треугольника, где этот треугольник является внешней границей копии: иначе две копии вместе с четырьмя вершинами \\(K_4\\) требовали бы несовместимого расположения относительно общих треугольников \\(abc\\) и \\(abd\\). Для этой копии применима уже доказанная оценка, значит \\(\\rho(\\Gamma)\\ge0.1k\\).\n\nИтак, для бесконечного семейства с \\(N=6k-2\\) вершинами получена оценка \\(\\rho(\\Gamma)\\ge c_0N\\) с некоторой абсолютной \\(c_0>0\\). Для произвольного \\(n\\ge3\\) берём максимальное \\(k\\), для которого \\(6k-2\\le n\\), строим \\(G_k\\) и добавляем \\(n-(6k-2)\\) изолированных вершин. Изолированные вершины не влияют на длины рёбер и планарность, а всякое прямолинейное плоское вложение нового графа ограничивается на вложение \\(G_k\\). При \\(n\\) достаточно большом \\(k\\ge n/12\\), а для конечного числа малых \\(n\\) можно уменьшить константу и взять, например, путь из двух рёбер с добавленными изолированными вершинами. Поэтому существует абсолютная константа \\(c>0\\), такая что для каждого \\(n\\ge3\\) найденный \\(n\\)-вершинный планарный граф имеет в любом прямолинейном плоском вложении два ребра с отношением длин не меньше \\(cn\\).",
