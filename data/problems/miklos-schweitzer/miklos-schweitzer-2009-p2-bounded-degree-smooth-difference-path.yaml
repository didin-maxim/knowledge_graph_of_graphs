        "id": "stmt-bounded-degree-part",
        "title": "Связная часть исходной задачи",
        "text": "Пусть \\(p_1,\\ldots,p_k\\) - фиксированные простые числа, \\(P=p_1p_2\\cdots p_k\\), а \\(S\\) - множество ненулевых целых чисел, все простые делители которых принадлежат множеству \\(\\{p_1,\\ldots,p_k\\}\\). Для конечного множества целых чисел \\(A\\) построим граф \\(\\mathcal G(A)\\) с вершинами из \\(A\\), где две различные вершины \\(a,b\\) соединены ребром тогда и только тогда, когда \\(a-b\\in S\\). Докажите, что для каждого \\(m\\ge3\\) существует \\(m\\)-элементное множество \\(A\\), для которого \\(\\mathcal G(A)\\) связен и все его степени не превосходят \\(2\\).",
