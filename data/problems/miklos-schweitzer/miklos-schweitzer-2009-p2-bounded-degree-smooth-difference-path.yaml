  "ideas": [
    {
      "id": "idea-power-sum-path",
      "title": "Соседние разности - степени произведения разрешенных простых",
      "text": "Если положить \\(a_n=P+P^2+\\cdots+P^n\\), то соседняя разность равна \\(P^{n+1}\\) и разрешена. А дальняя разность содержит множитель \\(1+P+\\cdots+P^r\\), который сравним с \\(1\\) по каждому \\(p_i\\), поэтому имеет новый простой делитель.",
      "tags": [
        "graph_model",
        "construction",
        "degree_counting"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-power-sum-induced-path",
      "title": "Путь из сумм степеней \\(P\\)",
      "text": "Зафиксируем \\(m\\ge3\\) и положим\n\\[\na_n=P+P^2+\\cdots+P^n\\qquad(1\\le n\\le m).\n\\]\nВозьмем \\(A=\\{a_1,a_2,\\ldots,a_m\\}\\). Эти числа различны, так как последовательность строго возрастает.\n\nДля соседних индексов имеем\n\\[\na_{n+1}-a_n=P^{n+1}.\n\\]\nВсе простые делители числа \\(P^{n+1}\\) лежат среди \\(p_1,\\ldots,p_k\\), поэтому \\(a_n\\) и \\(a_{n+1}\\) соединены ребром в \\(\\mathcal G(A)\\).\n\nПокажем, что других ребер нет. Пусть \\(N\\ge n+2\\). Тогда\n\\[\na_N-a_n=P^{n+1}(1+P+\\cdots+P^{N-n-1}).\n\\]\nВторой множитель больше \\(1\\). При этом для каждого \\(i\\) выполнено \\(P\\equiv0\\pmod {p_i}\\), значит\n\\[\n1+P+\\cdots+P^{N-n-1}\\equiv1\\pmod {p_i}.\n\\]\nСледовательно, этот второй множитель не делится ни на одно из чисел \\(p_i\\). Так как он больше \\(1\\), у него есть некоторый простой делитель; этот делитель не равен ни одному из \\(p_1,\\ldots,p_k\\). Поэтому разность \\(a_N-a_n\\) имеет запрещенный простой делитель и не принадлежит \\(S\\).\n\nЗначит, ребра в \\(\\mathcal G(A)\\) идут ровно между соседними членами последовательности \\(a_1,a_2,\\ldots,a_m\\). Полученный граф является путем на \\(m\\) вершинах. В частности, он связен, а степени его вершин равны \\(1,2,\\ldots,2,1\\) и не превосходят \\(2\\).",
      "idea_ids": [
        "idea-power-sum-path"
      ],
