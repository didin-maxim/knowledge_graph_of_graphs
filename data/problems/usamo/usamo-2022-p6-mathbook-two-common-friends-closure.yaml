    {
      "id": "idea-minimal-saturated-pieces",
      "title": "В минимальном насыщенном примере куски должны быть почти `K_4`-типовыми",
      "text": "Нижняя оценка удобно доказывается не по произвольному порядку добавления рёбер, а по специальному алгоритму: каждое исходное ребро сначала является своей кликой `K_2` и получает свою метку; когда найден `C_4` с разными метками сторон, соответствующие клики сливаются. Индукция по слияниям показывает, что клика на `m` вершинах всегда несёт не меньше `3m/2-2` исходных рёбер.",
