      {
        "id": "stmt-original",
        "title": "Mathbook",
        "text": "На социальной сети Mathbook есть `2022` пользователя, некоторые пары уже дружат. В дальнейшем новая дружба может появиться только между двумя пользователями, у которых уже есть по крайней мере два общих друга. Каково наименьшее число исходных дружб, которое гарантирует, что в конце все пользователи смогут стать попарно друзьями?",
        "source_id": "src-usamo-2022-p6-aops-wiki",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": []
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Для графа `G` на `n` вершинах разрешено добавлять ребро `uv`, если вершины `u,v` имеют по крайней мере двух общих соседей. Эквивалентно: если в `G` есть цикл `C_4`, можно дополнить его до `K_4`. Требуется минимальное `e(G)`, при котором таким процессом можно получить `K_n`.",
