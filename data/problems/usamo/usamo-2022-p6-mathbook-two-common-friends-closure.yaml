      "title": "Конструкция из `C_4`, делящих общее ребро",
      "text": "Для чётного `n` можно взять ребро `ab` и `n/2-1` циклов `a-u_i-v_i-b-a`. После дополнения каждого такого `C_4` до `K_4` все вершины, кроме `a,b`, уже смежны с `a` и `b`, поэтому любые две ещё несмежные вершины имеют общих соседей `a,b` и могут быть соединены.",
