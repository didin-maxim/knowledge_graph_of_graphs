  "solutions": [
    {
      "id": "sol-c4-closure-extremal",
      "title": "Замыкание по `C_4` и экстремальная конструкция",
      "text": "Для общего `n` ответ равен `ceil(3n/2)-2`, а значит при `n=2022` получаем `3031`. Разрешённая операция эквивалентна дополнению некоторого `C_4` до `K_4`: если в цикле `x-p-y-q-x` отсутствует диагональ `xy`, то у `x,y` есть два общих соседа `p,q`, и это ребро можно добавить.\n\nСначала построим пример. Пусть `n` чётно. Возьмём вершины `a,b`, ребро `ab` и для каждой пары новых вершин `u_i,v_i`, где `i=1,...,n/2-1`, добавим рёбра `a u_i`, `u_i v_i`, `v_i b`. Получились циклы `a-u_i-v_i-b-a`, имеющие общее ребро `ab`; всего рёбер `1+3(n/2-1)=3n/2-2`. Для каждого `i` дополняем этот цикл до клики на `a,b,u_i,v_i`, добавляя `a v_i` и `b u_i`. После этого каждая вершина, кроме `a,b`, смежна и с `a`, и с `b`; поэтому любые две вершины из разных пар `u_i,v_i` имеют двух общих соседей `a,b`, и мы можем по очереди добавить все оставшиеся рёбра между ними. Так получается `K_n`. Если `n` нечётно, строим такую же конструкцию на `n-1` вершинах и добавляем вершину `c`, соединённую с `a,b`. После замыкания чётной части вершина `c` имеет с любой другой вершиной общих соседей `a,b`, значит тоже соединяется со всеми. Число рёбер тогда равно `3(n-1)/2-2+2=(3n-1)/2=ceil(3n/2)-2`.\n\nДокажем нижнюю границу по схеме Evan Chen. Рассмотрим любой исходный граф `G`, из которого можно получить `K_n`. Будем выполнять специальный алгоритм замыкания; он может добавлять только разрешённые рёбра, а дополнительные разрешённые добавления не мешают дальнейшему процессу. Алгоритм хранит набор клик `C` и метку `L(e)` для каждого уже имеющегося ребра `e`: метка является одной из клик, содержащих это ребро. Изначально каждое исходное ребро `e` образует свою клику `K_2`, а метка `e` указывает на неё.\n\nПока есть цикл `C_4=a b c d a`, у четырёх сторон которого не все метки одинаковы, берём все различные метки этих сторон, то есть от двух до четырёх клик, и пусть `V` будет объединением их вершин. Сначала добавляем диагонали `ac` и `bd`, затем соединяем каждую вершину из `V\\{a,b,c,d}` со всеми четырьмя вершинами `a,b,c,d`, а потом достраиваем весь `V` до клики. Все эти добавления разрешены: после диагоналей вершины `a,b,c,d` уже образуют `K_4`; любая вершина из одной из сливаемых клик смежна с двумя соседними вершинами исходного цикла, а после появления диагоналей получает двух общих соседей с каждой из остальных вершин цикла; наконец, две внешние вершины из `V` после этого имеют по крайней мере две общие вершины среди `a,b,c,d`. Затем заменяем выбранные клики одной кликой на `V`; все рёбра, чьи метки были среди выбранных, а также все новые рёбра получают новую метку. Остальные старые рёбра сохраняют свои метки.\n\nАлгоритм останавливается, когда у каждого `C_4` все четыре стороны имеют одну метку. Тогда новых разрешённых рёбер уже нет: если несмежные `x,y` имели бы двух общих соседей `p,q`, то `x-p-y-q-x` был бы таким `C_4`; одинаковая метка всех его сторон означала бы, что одна клика содержит `x,p,y,q`, а значит уже содержит ребро `xy`, противоречие. Поэтому если исходный `G` действительно дозамыкается до `K_n`, наш алгоритм обязан в конце иметь единственную клику `K_n`.\n\nОсталось посчитать, сколько исходных рёбер несёт такая клика. Для клики `K` из текущего набора обозначим через `theta(K)` число исходных рёбер графа `G`, которые сейчас имеют метку `K`; новые рёбра не считаем. Докажем индукцией по шагам алгоритма, что всегда `theta(K) >= 3|K|/2-2`. В начале `K` есть одно исходное ребро, так что `theta(K)=1` и `|K|=2`.\n\nПусть на очередном шаге слились `t` клик, где `t` равно `2`, `3` или `4`, и их размеры равны `s_1,...,s_t`. Новое значение `theta` равно сумме старых, поэтому по индукции оно не меньше `3(s_1+...+s_t)/2-2t`. Размер новой клики равен размеру объединения, то есть сумме размеров минус повторно посчитанные вершины среди `a,b,c,d`. Если слились четыре разные метки, каждая из вершин `a,b,c,d` лежит в двух сторонах цикла, значит повторов как минимум `4`, и `|K| <= s_1+...+s_4-4`; тогда `theta(K) >= 3|K|/2-2`. Если слились три метки, среди четырёх сторон цикла одна метка повторяется, и как минимум три из вершин `a,b,c,d` всё равно посчитаны повторно; поскольку `3 > 8/3`, из `theta(K) >= 3(s_1+s_2+s_3)/2-6` следует даже строгая оценка `theta(K) > 3|K|/2-2`. Если слились две метки, повторов среди `a,b,c,d` как минимум два; тогда `theta(K) >= 3(s_1+s_2)/2-4`, а из `2 > 4/3` снова следует `theta(K) > 3|K|/2-2`.\n\nВ конце, если граф замыкается до полного, имеется клика `K_n`, поэтому число исходных рёбер равно `theta(K_n) >= 3n/2-2`. Так как число рёбер целое, оно не меньше `ceil(3n/2)-2`. Вместе с конструкцией это даёт точный ответ.",
