  "ideas": [
    {
      "id": "idea-shared-edge-c4-construction",
      "title": "Конструкция из `C_4`, делящих общее ребро",
      "text": "Для чётного `n` можно взять ребро `ab` и `n/2-1` циклов `C_4`, каждый из которых использует `ab` как общее ребро. После последовательного дополнения этих `C_4` до `K_4` граф начинает быстро схлопываться в полный.",
      "tags": [
        "extremal_choice",
        "double_counting"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-minimal-saturated-pieces",
      "title": "В минимальном насыщенном примере куски должны быть почти `K_4`-типовыми",
      "text": "Если граф уже может дозамкнуться до полного, то полезно смотреть на этапы, где появляется новая связь. Такое ребро рождается только из `C_4`, то есть процесс всегда работает через четырёхвершинные куски. Это заставляет минимальную конфигурацию иметь не меньше `ceil(3n/2)-2` рёбер.",
      "tags": [
        "extremal_choice",
        "double_counting"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-c4-closure-extremal",
      "title": "Замыкание по `C_4` и экстремальная конструкция",
      "text": "Для общего `n` ответ равен `ceil(3n/2)-2`, а значит при `n=2022` получаем `3031`. Разрешённая операция — это завершение `C_4` до `K_4`, потому что две несмежные вершины цикла длины 4 имеют двух общих соседей. Для верхней границы при чётном `n` берём вершины `a,b` и строим `n/2-1` копий `C_4`, имеющих общее ребро `ab`; число рёбер равно `1+3(n/2-1)=3n/2-2`. Последовательно дополняя каждую такую четвёрку до `K_4`, мы сначала делаем кликами все четырёхвершинные блоки, затем быстро соединяем новые вершины с уже построенной плотной частью и в итоге получаем `K_n`. Для нечётного `n` добавляем ещё одну вершину, смежную с `a,b`, и получаем `ceil(3n/2)-2`. Нижняя граница в заметках Evan Chen идёт через анализ минимального графа, который ещё способен дозамкнуться: любая первая полезная операция использует `C_4`, а значит новые вершины можно присоединять лишь блоками, стоящими не дешевле чем в конструкции выше; это даёт ту же оценку снизу `ceil(3n/2)-2`.",
