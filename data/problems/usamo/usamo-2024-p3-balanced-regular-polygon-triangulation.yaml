    {
      "id": "idea-necessity-via-algebraic-integrality",
      "title": "Необходимость оказывается не графовой, а алгебраической",
      "text": "После записи площадей через корни из единицы условие balanced сводится к тому, что `n/m` должно быть algebraic integer; для рационального числа это эквивалентно делимости `m | n`.",
      "tags": [],
