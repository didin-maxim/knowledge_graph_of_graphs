      "id": "idea-fan-triangulation-when-m-divides-n",
      "title": "Если `m | n`, достаточно веерной triagulation",
      "text": "В fan triangulation от одной вершины длины и площади треугольников периодичны по модулю `n`; при proper divisor `m | n` можно раскрасить треугольники циклически по остаткам modulo `m`. Добавление двух вырожденных нулевых треугольников делает сумму по каждому цвету полной геометрической прогрессией, поэтому суммы площадей совпадают.",
