      "id": "idea-fan-triangulation-when-m-divides-n",
      "title": "Если `m | n`, достаточно веерной triagulation",
      "text": "В fan triangulation от одной вершины длины и площади треугольников периодичны по модулю `n`; при `m | n` можно разбить их на `m` циклических классов с одинаковой суммой площадей.",
