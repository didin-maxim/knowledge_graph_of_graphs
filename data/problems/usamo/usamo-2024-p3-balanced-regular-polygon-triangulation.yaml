  "solutions": [
    {
      "id": "sol-fan-and-integrality",
      "title": "Веерная конструкция и критерий собственный делитель",
      "text": "Ответ: такие триангуляции существуют тогда и только тогда, когда `m` является собственным делителем `n`. Условие «собственным» необходимо уже потому, что все настоящие треугольники имеют положительную площадь, так что при равных ненулевых суммах каждый цвет должен появиться, а значит `m <= n-2 < n`. Достаточность проще всего получить на веерной триангуляции правильного `n`-угольника из одной вершины. Пусть вершины равны `1, ω, ..., ω^{n-1}`, где `ω = экспонента(2*pi*i/n)`, а веерные треугольники имеют вид `(1, ω^j, ω^{j+1})`, `1 <= j <= n-2`. Если `m | n` и `m < n`, красим треугольник с номером `j` по остатку `j mod m`. Для вычисления суммы удобно также добавить вырожденные треугольники при `j=0` и `j=n-1`, их площадь равна нулю. Ориентированная площадь треугольника `(1, ω^a, ω^b)` равна `T(a,b)=((ω^a-1)(ω^b-1)(ω^{-b}-ω^{-a}))/(4i)`. Тогда для фиксированного остатка `r mod m` сумма `T(j,j+1)` по всем `0 <= j < n`, `j == r mod m`, после раскрытия превращается в одну и ту же постоянную часть плюс суммы `sum ω^j` и `sum ω^{-1-j}` по полной прогрессии с шагом `m`; эти две суммы равны нулю, потому что `m` собственно делит `n`. Поэтому суммарная площадь каждого цвета равна `(n/m)(ω-ω^{-1})/(4i)`, независимо от `r`. Для необходимости рассмотрим любую сбалансированную триангуляцию. Та же формула площади показывает, что для любых вершин `ω^k, ω^{k+a}, ω^{k+b}` число `4iT(a,b)=(ω^a-1)(ω^b-1)(ω^{-b}-ω^{-a})` является алгебраическим целым числом, поскольку корни из единицы являются алгебраических целых чисел и это свойство замкнуто относительно сложения и умножения. Следовательно, `4i`, умноженное на сумму площадей одного цвета тоже алгебраическим целым числом. Но эта сумма равна ровно `1/m` площади всего правильного `n`-угольника, то есть `S=(n/m)(ω-ω^{-1})/(4i)`. В циклотомическом поле `Q(ω)` используем стандартный факт `O_{Q(ω)} = Z[ω]`: если `q=n/m` не целое, то `q(ω-ω^{-1})`, а после умножения на `ω` и `q(ω^2-1)`, имеет нецелые координаты в степенном базисе `Z[ω]` (малые случаи уже покрыты ограничением `m <= n-2`). Поэтому `4iS` не могло быть алгебраическим целым числом если `m` не делит `n`. Значит `n/m` является рациональным алгебраическим целым числом, то есть обычным целым, и `m | n`. Совместно с `m < n` получаем ровно собственные делители `n`. Поэтому графовая роль здесь существенна для постановки и для удобной модели triangulation как внешнепланарного графа, но центральная техника решения в действительности алгебраическая.",
