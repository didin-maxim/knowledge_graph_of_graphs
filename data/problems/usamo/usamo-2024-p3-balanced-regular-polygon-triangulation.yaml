      "id": "idea-fan-triangulation-when-m-divides-n",
      "title": "Если `m | n`, достаточно веерной триангуляции",
      "text": "В веерной триангуляции от одной вершины длины и площади треугольников периодичны по модулю `n`; при собственный делитель `m | n` можно раскрасить треугольники циклически по остаткам по модулю `m`. Добавление двух вырожденных нулевых треугольников делает сумму по каждому цвету полной геометрической прогрессией, поэтому суммы площадей совпадают.",
