    {
      "id": "idea-necessity-via-algebraic-integrality",
      "title": "Необходимость оказывается не графовой, а алгебраической",
      "text": "После записи площадей через корни из единицы каждая цветовая сумма, умноженная на `4i`, является суммой алгебраических целых чисел. Но равная доля площади правильного `n`-угольника равна `(n/m)(omega-omega^{-1})/(4i)`; в циклотомическом поле это возможно только если рациональное число `n/m` является алгебраическим целым числом, то есть обычным целым.",
