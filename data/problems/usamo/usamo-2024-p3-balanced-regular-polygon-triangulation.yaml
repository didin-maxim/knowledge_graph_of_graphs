  "solutions": [
    {
      "id": "sol-fan-and-integrality",
      "title": "Веерная конструкция и критерий proper divisor",
      "text": "Ответ: такие триангуляции существуют тогда и только тогда, когда `m` является собственным делителем `n`. Условие «собственным» необходимо уже потому, что все настоящие треугольники имеют положительную площадь, так что при равных ненулевых суммах каждый цвет должен появиться, а значит `m <= n-2 < n`. Достаточность проще всего получить на веерной триангуляции правильного `n`-угольника из одной вершины. Пусть вершины равны `1, omega, ..., omega^{n-1}`, где `omega = exp(2*pi*i/n)`, а веерные треугольники имеют вид `(1, omega^j, omega^{j+1})`, `1 <= j <= n-2`. Если `m | n` и `m < n`, красим треугольник с номером `j` по остатку `j mod m`. Для вычисления суммы удобно также добавить вырожденные треугольники при `j=0` и `j=n-1`, их площадь равна нулю. Signed area треугольника `(1, omega^a, omega^b)` равна `T(a,b)=((omega^a-1)(omega^b-1)(omega^{-b}-omega^{-a}))/(4i)`. Тогда для фиксированного остатка `r mod m` сумма `T(j,j+1)` по всем `0 <= j < n`, `j == r mod m`, после раскрытия превращается в одну и ту же постоянную часть плюс суммы `sum omega^j` и `sum omega^{-1-j}` по полной прогрессии с шагом `m`; эти две суммы равны нулю, потому что `m` собственно делит `n`. Поэтому суммарная площадь каждого цвета равна `(n/m)(omega-omega^{-1})/(4i)`, независимо от `r`. Для необходимости рассмотрим любую balanced triangulation. Та же формула площади показывает, что для любых вершин `omega^k, omega^{k+a}, omega^{k+b}` число `4iT(a,b)=(omega^a-1)(omega^b-1)(omega^{-b}-omega^{-a})` является algebraic integer, поскольку корни из единицы являются algebraic integers и это свойство замкнуто относительно сложения и умножения. Следовательно, `4i` times сумма площадей одного цвета тоже algebraic integer. Но эта сумма равна ровно `1/m` площади всего правильного `n`-угольника, то есть `S=(n/m)(omega-omega^{-1})/(4i)`. В cyclotomic field `Q(omega)` используем стандартный факт `O_{Q(omega)} = Z[omega]`: если `q=n/m` не целое, то `q(omega-omega^{-1})`, а после умножения на `omega` и `q(omega^2-1)`, имеет нецелые координаты в power basis of `Z[omega]` (малые случаи уже покрыты ограничением `m <= n-2`). Поэтому `4iS` не могло быть algebraic integer при `m` not dividing `n`. Значит `n/m` является рациональным algebraic integer, то есть обычным целым, и `m | n`. Совместно с `m < n` получаем ровно собственные делители `n`. Поэтому графовая роль здесь существенна для постановки и для удобной модели triangulation как внешнепланарного графа, но центральная техника решения в действительности алгебраическая.",
