    {
      "id": "idea-necessity-via-algebraic-integrality",
      "title": "Необходимость оказывается не графовой, а алгебраической",
      "text": "После записи площадей через корни из единицы каждая цветовая сумма, умноженная на `4i`, является суммой algebraic integers. Но равная доля площади правильного `n`-угольника равна `(n/m)(omega-omega^{-1})/(4i)`; в cyclotomic field это возможно только если рациональное число `n/m` является algebraic integer, то есть обычным целым.",
