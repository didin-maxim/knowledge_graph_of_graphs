        "id": "stmt-original",
        "title": "Оригинальная формулировка",
        "text": "Для положительного целого `m` триангуляция правильного `n`-угольника называется `m`-balanced, если её `n-2` треугольников можно раскрасить в `m` цветов так, чтобы суммы площадей треугольников каждого цвета были одинаковы. Для каких `n >= 3` такая триангуляция существует?",
        "source_id": "src-usamo-2024-p3-aops-wiki",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": []
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Триангуляция выпуклого \\(n\\)-угольника задаёт максимальный внешнепланарный граф на его вершинах. Требуется понять, когда треугольные грани этого внешнепланарного графа можно разбить на \\(m\\) классов с одинаковой суммой площадей.",
