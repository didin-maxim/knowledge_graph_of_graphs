  "solutions": [
    {
      "id": "sol-fan-and-integrality",
      "title": "Веерная конструкция и критерий `m | n`",
      "text": "Ответ: такие триангуляции существуют тогда и только тогда, когда \\(m\\) делит \\(n\\). Достаточность проще всего получить на веерной триангуляции правильного \\(n\\)-угольника из одной вершины. Её \\(n-2\\) треугольников удобно индексировать шагами по дуге, и при \\(m\\mid n\\) можно раскрасить их по классам остатков так, что суммарные площади каждого цвета совпадут. Необходимость в решении Эвана Чена уже почти не использует графовую структуру триангуляции как таковую: площади всех возможных треугольников выражаются через корни из единицы, и из равенства сумм по цветам выводится, что рациональное число \\(n/m\\) обязано быть алгебраическим целым. Это возможно только при \\(m\\mid n\\). Поэтому графовая роль здесь существенна для постановки и для удобной модели триангуляции как внешнепланарного графа, но центральная техника решения в действительности алгебраическая.",
