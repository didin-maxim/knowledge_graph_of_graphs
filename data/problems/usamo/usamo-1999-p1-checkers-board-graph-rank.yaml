        "title": "Связная доминирующая конфигурация шашек",
        "text": "На доске \\(n x n\\) расставлены шашки так, что: а) каждая пустая клетка имеет общую сторону с занятой; б) любые две занятые клетки можно соединить цепочкой занятых клеток, в которой соседние клетки имеют общую сторону. Докажите, что шашек не меньше \\((n^2-2)/3\\).",
