    {
      "id": "sol-circuit-rank-bound",
      "title": "AoPS-версия через цикломатический ранг",
      "text": "Пусть `x` — число шашек, а `G` — граф занятых клеток: две вершины соединены ребром, если соответствующие занятые клетки имеют общую сторону. По условию `G` связен.\n\nОценим сверху число клеток, которые заняты или имеют общую сторону с занятой. Если считать вклад каждой шашки отдельно, то одна шашка может покрыть не более пяти клеток: свою клетку и четыре соседние по стороне. Такой грубый счёт даёт `5x`, но он завышает ответ, когда две занятые клетки соседствуют. Действительно, если занятые клетки `u` и `v` имеют общую сторону, то при подсчёте от `u` клетка `v` уже считается, и при подсчёте от `v` клетка `u` тоже уже считается; эти две стороны не могут отвечать за новые пустые клетки. Поэтому из суммы `5x` можно вычесть по одному за каждую инцидентность занятой клетки с занятым соседом. Таких инцидентностей ровно `sum deg(v)`. Значит число хороших клеток не превосходит `5x - sum deg(v)`.\n\nТак как все клетки доски хороши, имеем `n^2 <= 5x - sum deg(v)`. Осталось использовать связность `G`. Для связного графа на `x` вершинах можно записать `|E(G)|=x-1+R`, где `R>=0` — цикломатический ранг, то есть число рёбер сверх остовного дерева. Тогда `sum deg(v)=2|E(G)|=2x-2+2R`. Подставляя, получаем\n\n`n^2 <= 5x-(2x-2+2R)=3x+2-2R`.\n\nСледовательно, `3x >= n^2-2+2R >= n^2-2`, и потому `x >= (n^2-2)/3`. Более того, эта версия даёт чуть более сильную оценку `x >= (n^2-2+2R)/3`.",
      "idea_ids": [
        "idea-circuit-rank-version"
      ],
      "standard_idea_ids": [
        "double_counting"
      ],
