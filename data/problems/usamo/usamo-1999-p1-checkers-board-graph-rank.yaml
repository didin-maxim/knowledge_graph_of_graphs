  "solutions": [
    {
      "id": "sol-good-squares-in-connected-order",
      "title": "Подсчёт хороших клеток",
      "text": "Назовём клетку хорошей, если она либо занята, либо имеет общую сторону с занятой. По условию каждая клетка доски хорошая: занятые клетки хороши по определению, а каждая пустая клетка соседствует с занятой. Значит всего хороших клеток ровно `n^2`.\n\nОбозначим число шашек через `k` и рассмотрим граф, вершинами которого являются занятые клетки, а рёбра соединяют занятые клетки с общей стороной. По условию этот граф связен. Поэтому его вершины можно упорядочить как `v_1,...,v_k` так, что при `i>1` вершина `v_i` имеет соседа среди `v_1,...,v_{i-1}`. Например, можно взять любое остовное дерево этого графа и перечислять вершины в порядке их первого появления при обходе от корня.\n\nТеперь мысленно ставим шашки именно в таком порядке и считаем, сколько новых хороших клеток может появиться на каждом шаге. Первая шашка делает хорошими не более пяти клеток: свою клетку и максимум четыре клетки, имеющие с ней общую сторону. Пусть теперь ставится не первая шашка `v_i`. Её собственная клетка уже была хорошей до постановки, потому что `v_i` соседствует с одной из ранее поставленных шашек. Кроме того, среди четырёх соседних по стороне клеток по крайней мере одна уже является ранее занятой клеткой, значит эта соседняя клетка тоже не является новой хорошей клеткой. Следовательно, `v_i` может добавить только остальные, не более трёх, соседние клетки.\n\nПосле постановки всех `k` шашек число хороших клеток поэтому не превосходит `5+3(k-1)=3k+2`. Но все `n^2` клеток хороши, так что `n^2 <= 3k+2`. Отсюда `k >= (n^2-2)/3`, что и требовалось доказать.",
      "idea_ids": [
        "idea-reinsert-checkers-in-connected-order"
      ],
      "standard_idea_ids": [
