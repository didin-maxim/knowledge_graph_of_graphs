      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "В графе клеток доски `n x n` вершинами являются все клетки, а рёбра соединяют клетки с общей стороной. Выбрано множество вершин `S` такое, что индуцированный подграф на `S` связен, а каждая вершина всей доски либо принадлежит `S`, либо смежна с вершиной из `S`. Докажите, что `|S| >= (n^2-2)/3`.",
