    {
      "id": "sol-john-scholes-connected-induction",
      "title": "Джон Скоулз: индукция по связному множеству клеток",
      "text": "Архивное решение John Scholes строит прямую индукцию по числу занятых клеток `k`. Утверждается, что если `k` чёрных клеток образуют связное множество, то чёрных или соседних с чёрными клеток не больше `3k+2`. База `k=1` очевидна. Для перехода нужно удалить одну чёрную клетку так, чтобы остальные `k-1` клеток остались связны; в графовом языке это выбор вершины, удаление которой не разрушает связность. Scholes предлагает взять две клетки `A,B` на максимальном расстоянии в графе занятых клеток и заметить, что удаление любой из них не может разорвать связность: иначе нашлась бы клетка, путь к которой из другой крайней вершины обязан проходить через удалённую, что дало бы путь длиннее диаметрального. После удаления такой клетки по предположению индукции остаётся не более `3(k-1)+2` хороших клеток, а возвращённая клетка добавляет не более трёх новых. Значит всего не больше `3k+2`, откуда снова следует `k >= (n^2-2)/3`.",
