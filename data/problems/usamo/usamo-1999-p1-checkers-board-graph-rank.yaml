    {
      "id": "sol-john-scholes-connected-induction",
      "title": "Джон Скоулз: индукция по связному множеству клеток",
      "text": "Докажем более общее утверждение: если `k` занятых клеток образуют связное множество, то занятых или соседних с занятыми клеток не больше `3k+2`. После этого исходная задача сразу следует, потому что по условию все `n^2` клеток доски заняты или соседствуют с занятой.\n\nПроведём индукцию по `k`. При `k=1` одна шашка делает хорошими не более пяти клеток: свою клетку и четыре соседние по стороне. Это равно `3*1+2`, так что база верна.\n\nПусть `k>1`. Рассмотрим граф занятых клеток и выберем две его вершины `A` и `B`, расстояние между которыми максимально. Утверждаем, что удаление `A` не разрушает связность оставшегося графа. Действительно, если после удаления `A` оставшиеся вершины распались бы на несколько компонент, то все пути из `B` в любую вершину компоненты, не содержащей `B`, должны были бы проходить через `A`. В частности, взяв соседа `C` вершины `A` в такой другой компоненте, получаем `dist(B,C)=dist(B,A)+1`, что больше максимального расстояния между `A` и `B`. Это невозможно. Значит занятые клетки, кроме `A`, всё ещё связны.\n\nПо предположению индукции для оставшихся `k-1` занятых клеток число хороших клеток не превосходит `3(k-1)+2`. Вернём клетку `A`. Так как `A` была соседней с оставшимся связным множеством, сама клетка `A` уже была хорошей до возвращения. Кроме того, один из её соседей уже занят, поэтому из четырёх соседних по стороне клеток не более трёх могут стать новыми хорошими клетками. Итак, возвращение `A` добавляет не более трёх новых хороших клеток.\n\nПолучаем верхнюю оценку `3(k-1)+2+3=3k+2`. Индукция доказана. В исходной задаче хороших клеток `n^2`, поэтому `n^2 <= 3k+2`, откуда `k >= (n^2-2)/3`.",
