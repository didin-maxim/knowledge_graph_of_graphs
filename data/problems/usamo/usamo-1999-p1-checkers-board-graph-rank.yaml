      "id": "sol-good-squares-in-connected-order",
      "title": "Подсчёт хороших клеток",
      "text": "Назовём клетку хорошей, если она либо занята, либо имеет общую сторону с занятой. По условию все `n^2` клеток хорошие. Обозначим число шашек через `k`. Из связности графа занятых клеток можно упорядочить их так, что каждая шашка, кроме первой, соседствует с уже поставленной. Если мысленно ставить шашки в этом порядке, первая делает хорошими не более 5 клеток: себя и максимум четырёх соседей. Каждая следующая шашка сама уже хорошая и имеет хотя бы одного занятого соседа, поэтому может сделать хорошими не более трёх новых клеток. Значит после постановки всех шашек число хороших клеток не превосходит `5+3(k-1)=3k+2`. Следовательно, `n^2 <= 3k+2`, откуда `k >= (n^2-2)/3`.",
      "idea_ids": [
        "idea-reinsert-checkers-in-connected-order"
      ],
      "standard_idea_ids": [
        "extremal_choice"
      ],
      "status": "ai_checked",
