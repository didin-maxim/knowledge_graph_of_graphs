    {
      "id": "sol-circuit-rank-bound",
      "title": "AoPS-версия через цикломатический ранг",
      "text": "Пусть `x` — число шашек, а `G` — граф занятых клеток. Каждая вершина теоретически могла бы отвечать за 5 клеток доски, но если у вершины есть занятые соседи, то соответствующие стороны уже не дают новых пустых клеток. Поэтому число покрытых или соседних клеток не превосходит `5x - sum deg(v)`. Так как граф связен, `sum deg(v)=2|E|=2x-2+2R`, где `R` — circuit rank. Получаем `n^2 <= 5x-(2x-2+2R)=3x+2-2R`, значит `x >= (n^2-2+2R)/3 >= (n^2-2)/3`.",
      "idea_ids": [
        "idea-circuit-rank-version"
      ],
      "standard_idea_ids": [
        "double_counting"
      ],
      "status": "ai_checked",
      "definition_ids": [
