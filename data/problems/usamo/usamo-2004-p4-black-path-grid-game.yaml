        "id": "stmt-graph",
        "text": "Пусть \\(Q\\) — королевский граф доски `6 x 6`: его вершины — клетки, а рёбра соединяют клетки, имеющие общую сторону или вершину. Алиса и Боб по очереди назначают вершинам попарно различные рациональные веса; первой ходит Алиса. После того как все вершины получили веса, в каждом из шести горизонтальных слоёв оставляют только вершину максимального веса. Алиса выигрывает, если оставленные шесть вершин содержат путь графа \\(Q\\), соединяющий верхний и нижний слои. Если такого пути нет, выигрывает Боб. Определите, у кого есть выигрышная стратегия.",
