  "solutions": [
    {
      "id": "sol-bob-useless-squares",
      "title": "Стратегия Боба через бесполезные клетки",
      "text": "Боб заранее выбирает в каждой строке по три бесполезные клетки. Если Алиса пишет число в бесполезной клетке, Боб на следующем ходу пишет большее число в небесполезной клетке той же строки; если Алиса играет в небесполезную клетку, Боб пишет меньшее число в бесполезной клетке той же строки. Поэтому никакая бесполезная клетка не сможет стать максимумом своей строки. Теперь Боб выбирает бесполезные клетки зигзагообразным барьером, например `(1,1),(2,1),(2,2),(3,2),(3,3),(4,3),(4,4),(5,4),(5,5),(6,5),(6,6)`. Так как все эти клетки гарантированно не чёрные, чёрные клетки не могут образовать связный путь от верхней стороны к нижней. Значит выигрывает Боб.",
