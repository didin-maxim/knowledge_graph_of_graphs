    {
      "id": "sol-bob-shifted-row-pairing",
      "title": "Та же стратегия в форме парной защиты строк",
      "text": "Выигрышная стратегия Боба состоит не в выборе чисел по абсолютной величине, а в заранее заданных парах клеток. В каждой строке он объявляет запрещёнными три клетки: в строках `1,2` это столбцы `1,2,3`, в строке `3` — `2,3,4`, в строке `4` — `3,4,5`, в строках `5,6` — `4,5,6`. Каждую запрещённую клетку он парует с одной незапрещённой клеткой той же строки. Если Алиса играет в запрещённую клетку пары, Боб отвечает большим рациональным числом в её незапрещённой паре; если Алиса играет в незапрещённую клетку, Боб отвечает меньшим рациональным числом в запрещённой. Поэтому в каждой паре запрещённая клетка меньше незапрещённой и не может стать максимумом строки.\n\nСреди запрещённых клеток содержится лестница `(1,1)`, `(2,1),(2,2)`, `(3,2),(3,3)`, `(4,3),(4,4)`, `(5,4),(5,5)`, `(6,5),(6,6)`. Любой путь чёрных клеток сверху вниз должен проходить по одной чёрной клетке в каждой строке; если их столбцы равны `c_1,...,c_6`, то соседство по стороне или вершине требует `|c_{r+1}-c_r|<=1`. Избегая лестницы, получаем последовательно `c_1>=2`, затем `c_2>=3`, `c_3>=4`, `c_4>=5`, `c_5>=6`; после этого в шестой строке путь должен иметь `c_6>=5`, но столбцы `5` и `6` там запрещены. Противоречие. Значит, Боб гарантирует отсутствие чёрного верх-низ пути.",
