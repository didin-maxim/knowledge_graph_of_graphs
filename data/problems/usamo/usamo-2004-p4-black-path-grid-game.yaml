        "title": "Игра на таблице 6x6",
        "text": "Алиса и Боб по очереди вписывают в пустые клетки таблицы `6 x 6` попарно различные рациональные числа; первой ходит Алиса. После заполнения таблицы в каждой строке закрашивается в чёрный цвет клетка с максимальным числом. Алиса выигрывает, если затем может провести путь из чёрных клеток от верхней стороны таблицы до нижней, переходя между клетками, имеющими общую сторону или вершину. Если такого пути нет, выигрывает Боб. Докажите, у кого есть выигрышная стратегия.",
