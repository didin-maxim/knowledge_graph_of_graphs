  "solutions": [
    {
      "id": "sol-bob-useless-squares",
      "title": "Выигрышная стратегия Боба через запрещённые клетки",
      "text": "Покажем, что выигрывает Боб.\n\nБоб заранее объявляет запрещёнными следующие клетки. В строке `1` это столбцы `1,2,3`; в строке `2` — `1,2,3`; в строке `3` — `2,3,4`; в строке `4` — `3,4,5`; в строке `5` — `4,5,6`; в строке `6` — `4,5,6`. В каждой строке он произвольно разбивает три запрещённые и три незапрещённые клетки на пары, каждая пара лежит в одной строке и содержит одну запрещённую и одну незапрещённую клетку.\n\nСтратегия Боба такова. Если Алиса пишет число `x` в одной клетке некоторой пары, Боб немедленно пишет число в другой клетке этой пары. Если клетка Алисы была запрещённой, Боб выбирает рациональное число больше `x`; если клетка Алисы была незапрещённой, Боб выбирает рациональное число меньше `x`. Это всегда возможно, потому что между рациональными числами нет ближайших соседей и занято лишь конечное число значений. В итоге в каждой паре число в незапрещённой клетке больше числа в запрещённой. Поэтому ни одна запрещённая клетка не может быть максимумом своей строки: в той же строке у неё есть парная незапрещённая клетка с большим числом.\n\nОстаётся доказать, что незапрещённые клетки не могут содержать путь сверху вниз. Уже подмножество запрещённых клеток\n`(1,1)`, `(2,1),(2,2)`, `(3,2),(3,3)`, `(4,3),(4,4)`, `(5,4),(5,5)`, `(6,5),(6,6)` образует лестничный барьер. Действительно, поскольку после игры в каждой строке ровно одна чёрная клетка, верх-низ путь из чёрных клеток должен проходить через строки `1,2,...,6` по порядку; если его клетка в строке `r` стоит в столбце `c_r`, то соседство по стороне или вершине даёт `|c_{r+1}-c_r|<=1`.\n\nЕсли путь избегает барьера, то из строки `1` он обязан начать со столбца `c_1>=2`. Тогда в строке `2` из-за условия соседства `c_2>=1`, но столбцы `1` и `2` запрещены, значит `c_2>=3`. Далее та же индукция даёт `c_3>=4`, `c_4>=5`, `c_5>=6`. При переходе в строку `6` получаем `c_6>=5`, а в шестой строке оба столбца `5` и `6` запрещены; противоречие. Значит, чёрного пути от верхней стороны к нижней нет, и Боб выигрывает.",
