      ]
    },
    {
      "id": "sol-bob-shifted-row-pairing",
      "title": "Вторая AoPS-стратегия: парные строки со сдвигом",
      "text": "Ещё одна стратегия сообщества Боба из AoPS не строит общий барьер заранее, а жёстко связывает ходы в двух строках. Если Алиса пишет число в одной из первых двух строк, Боб отвечает в другой строке, но в столбце, сдвинутом на `3` по модулю `6`; если ход Алисы оказался максимумом своей строки, то и ответ Боба станет максимумом своей строки, а если нет, то оба хода не дадут чёрную клетку. Значит чёрные клетки в строках `1` и `2` обязательно окажутся на расстоянии двух столбцов друг от друга и не смогут соприкасаться даже по вершине. Для строк `3,4,5,6` Боб просто отвечает внутри того же блока строк, так что никакой путь сверху вниз не сможет пройти через разрыв между первыми двумя строками. Это другая графовая перспектива той же победы Боба: вместо явного разделяющее множество строится инвариант, запрещающий локальное соединение между двумя верхними слоями.",
