        "id": "stmt-original",
        "title": "Оригинальная формулировка",
        "text": "Шахматным многоугольником назовём многоугольник, стороны которого лежат на прямых `x=a` или `y=b`, где `a,b` — целые; его внутренность разбивается этими прямыми на единичные клетки шахматной раскраски. Домино-разбиение такого многоугольника — это точное покрытие неперекрывающимися прямоугольниками `1x2` и `2x1`. Зафиксируем раскраску так, что в рассматриваемом `2x2`-блоке нижняя левая клетка может быть названа чёрной или белой. Запрещены два цветных локальных рисунка: две вертикальные домино в `2x2`-блоке, когда нижняя левая клетка чёрная, и две горизонтальные домино в `2x2`-блоке, когда нижняя левая клетка белая. Назовём разбиение изящное, если ни один из этих двух рисунков в нём не встречается. Докажите: a) если шахматный многоугольник можно замостить домино, то это можно сделать изящным образом; b) такое изящное разбиение единственно.",
