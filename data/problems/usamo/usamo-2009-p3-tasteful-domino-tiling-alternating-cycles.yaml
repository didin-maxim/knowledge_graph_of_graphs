    {
      "id": "sol-community-overlay-boundary",
      "title": "Версия сообщества: наложение двух разбиений и крайний цикл",
      "text": "В разборе сообщества Shen-Fu Tsai часть (b) формулируется почти целиком на языке графа наложения двух домино-разбиений. Предполагая существование двух «хороших» разбиений, автор раскрашивает домино двух разбиений в разные цвета и рассматривает компоненты их объединения. Так как в каждой внутренней клетке встречается по одному домино каждого цвета, каждая компонента является циклом. Дальше берётся крайняя компонента и анализируется её граничный угол; именно он заставляет цикл сделать локальный поворот, несовместимый с ограничениями «хорошего» разбиения. Это даёт ту же единственность, но в более явно графовой форме: ключевой объект — не просто плиточная картинка, а разложение симметрической разности двух совершенных паросочетаний на чередующиеся циклы.",
