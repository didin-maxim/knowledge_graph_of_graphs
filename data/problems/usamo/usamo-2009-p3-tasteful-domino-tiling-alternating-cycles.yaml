    {
      "id": "sol-community-overlay-boundary",
      "title": "Версия сообщества: наложение двух разбиений и крайний цикл",
      "text": "В версии сообщества удобно отделить чисто графовый каркас от локальной проверки. Наложим два предполагаемых изящных разбиения `T` и `M` и покрасим их домино в два цвета. Общие домино можно отбросить; в оставшейся симметрической разности каждая клетка инцидентна ровно двум домино, одному из `T` и одному из `M`. Поэтому каждая компонента — чётный цикл, а вдоль него цвета домино чередуются. Цикл длины `2` невозможен: это ровно один `2x2`-квадрат, замощённый вертикально в одном разбиении и горизонтально в другом, а из двух таких цветных картинок одна является запрещённой. Возьмём любую оставшуюся компоненту-цикл `C` и область `R`, которую она окружает. На нижней строке `R` есть горизонтальный участок цикла. Среди горизонтальных домино этой нижней строки появляется `WB`-домино; если горизонтальный участок единственный, то две вертикальные домино, с которыми он чередуется, заставляют тот же вывод, иначе одно из соседних горизонтальных домино имеет белую клетку слева. Смотрим на то из двух разбиений, которому принадлежит это `WB`-домино. Локальный угол теперь полностью жёсткий: две клетки над `WB`-домино не могут быть замощены одной горизонтальной домино, потому что возникнет запрещённая горизонтальная пара в `2x2`; не могут быть замощены и двумя вертикальными домино, потому что возникнет запрещённая вертикальная пара. Значит выше находится новое горизонтальное `WB`-домино. Поднимая это рассуждение строка за строкой, неизбежно доходим до `WB`-домино на верхней границе области `R`, то есть до домино самого цикла, над которым область уже кончается. Теперь обходим цикл так, чтобы `R` оставалась слева. На нижнем `WB`-домино направление обхода согласуется с направлением от белой клетки к чёрной, и из-за чередования такая ориентация сохраняется на всех домино выбранного разбиения. Но верхнее граничное `WB`-домино при обходе с внутренностью слева должно проходиться справа налево, следовательно, от чёрной клетки к белой. Это противоречие и есть недостающий локальный анализ границы и угла: наличие чередующегося цикла вынуждает один из двух запрещённых `2x2`-рисунков или невозможную ориентацию, поэтому два разных изящных разбиения существовать не могут.",
