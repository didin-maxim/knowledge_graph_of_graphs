  "statements": {
    "original": [
      {
        "id": "stmt-original",
        "title": "Оригинальная формулировка",
        "text": "Шахматным многоугольником назовём многоугольник, стороны которого лежат на прямых `x=a` или `y=b`, где `a,b` — целые; его внутренность разбивается этими прямыми на единичные клетки шахматной раскраски. Домино-разбиение такого многоугольника — это точное покрытие неперекрывающимися прямоугольниками `1x2` и `2x1`. Назовём разбиение tasteful, если в нём не встречаются два запрещённых локальных рисунка из условия. Докажите: a) если шахматный многоугольник можно замостить домино, то это можно сделать tasteful-образом; b) такое tasteful-разбиение единственно.",
        "source_id": "src-usamo-2009-p3-aops-wiki",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": []
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Рассмотрим двудольный grid-граф клеток шахматного многоугольника; каждое домино-разбиение задаёт совершенное паросочетание. Для tasteful-разбиения `T` и любого другого разбиения `M` симметрическая разность `T Δ M` распадается на попарно непересекающиеся чётные чередующиеся циклы. Докажите, что существует ровно одно совершенное паросочетание, для которого запрещённые локальные конфигурации не возникают.",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [
          "bipartite_graph",
          "matching",
          "cycle"
        ]
      }
    ],
