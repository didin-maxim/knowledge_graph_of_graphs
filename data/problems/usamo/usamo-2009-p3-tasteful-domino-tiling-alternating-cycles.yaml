  "ideas": [
    {
      "id": "idea-peel-corner-domino-inductively",
      "title": "Хорошее разбиение строится снятием вынужденного углового домино",
      "text": "У шахматного многоугольника всегда найдётся крайняя клетка, возле которой любое tasteful-разбиение обязано содержать конкретное домино. Удалив его, мы уменьшаем площадь и продолжаем индукцию.",
      "tags": [
        "induction"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-symmetric-difference-gives-alternating-cycles",
      "title": "Наложение двух разбиений даёт чередующиеся циклы",
      "text": "Если сравнить tasteful-разбиение с любым другим, то в каждой клетке участвует ровно одно домино каждого цвета, так что симметрическая разность образует `2`-регулярный двуцветный граф и потому распадается на чётные alternating cycles.",
      "tags": [
        "matching"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-boundary-forces-distasteful-corner-on-cycle",
      "title": "Каждый такой цикл порождает запрещённый локальный рисунок",
      "text": "Рассматривая самую левую или нижнюю точку компоненты симметрической разности, получаем вынужденный локальный поворот. Он неизбежно реализует один из запрещённых паттернов, значит при tasteful-разбиении ни одного чередующегося цикла быть не может.",
      "tags": [
        "extremal_choice"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-induction-plus-alternating-cycles",
      "title": "Индукция для существования и alternating cycles для единственности",
      "text": "Докажем сначала существование хорошего разбиения индукцией по числу клеток. Возьмём клетку на верхней границе с максимальной абсциссой. Если её нельзя покрыть единственным домино, не создающим немедленно запрещённый узор, то около неё уже возникает один из disхорошее паттернов, чего хорошее разбиение допустить не может. Значит крайнее домино фактически вынуждено; удаляем его и применяем индукцию к оставшемуся шахматному многоугольнику. Для единственности пусть `T` — хорошее разбиение, а `M` — любое другое. Смотрим на симметрическую разность двух наборов домино. Каждая клетка, где разбиения различаются, принадлежит ровно одному домино из `T` и одному из `M`, поэтому объединение таких домино образует `2`-регулярный граф на клетках, состоящий из попарно непересекающихся чётных чередующихся циклов. Если хотя бы один цикл есть, рассмотрим его крайнюю левую нижнюю клетку. Локальная геометрия цикла в этой точке вынуждает один из двух запрещённых рисунков: либо два параллельных домино в квадрате `2x2`, либо соответствующий `3x2`-паттерн. Это противоречит хорошее-свойству `T`. Следовательно, симметрическая разность пуста и `M=T`. Значит хорошее разбиение существует и единственно.",
