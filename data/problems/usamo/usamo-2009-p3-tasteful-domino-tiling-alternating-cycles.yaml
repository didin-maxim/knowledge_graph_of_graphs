    {
      "id": "sol-induction-plus-alternating-cycles",
      "title": "Индукция для существования и чередующиеся циклы для единственности",
      "text": "Докажем сначала существование изящного разбиения индукцией по числу домино. Среди самых левых клеток многоугольника выберем нижнюю и назовём её `L`; это граничный угол, поэтому у `L` нет клеток слева и снизу. Пусть для начала `L` чёрная. Возьмём какое-нибудь домино-разбиение и удалим домино `D`, покрывающее `L`. Остаток снова является шахматным многоугольником и замощается на одно домино меньше, значит по индукции его можно замостить изящным образом. Если `D` горизонтально, возвращение `D` не создаёт запрещённый рисунок: вертикальный запрещённый блок не использует `D`, а горизонтальный запрещённый блок с `D` потребовал бы клеток ниже `L`. Если `D` вертикально, единственная возможная новая неприятность — вертикальное домино непосредственно справа от `D`; тогда эти две вертикальные домино образуют `2x2`-квадрат, и мы поворачиваем их в две горизонтальные домино. После такого поворота исходный многоугольник имеет разбиение, где `L` покрыта горизонтально; теперь удаляем именно это горизонтальное домино, применяем индукцию к остатку и возвращаем его, что по предыдущему случаю безопасно. Если `L` белая, рассуждение симметрично: сначала безопасным является вертикальное домино, а горизонтальное может быть плохим только вместе с горизонтальным домино прямо над ним; поворот этого `2x2`-блока сводит дело к безопасному вертикальному случаю. Так существование доказано. Для единственности пусть `T` и `M` — два изящного разбиения. Рассмотрим граф клеток: вершины — клетки многоугольника, а каждое домино даёт ребро между двумя соседними клетками. В симметрической разности `T Δ M` каждая участвующая клетка имеет степень `2`, по одному ребру из каждого разбиения, поэтому `T Δ M` распадается на непересекающиеся чётные циклы, в которых рёбра из `T` и `M` чередуются. Если циклов нет, то `T=M`; предположим, что есть цикл `C`. Пусть `R` — область, ограниченная этим циклом вместе с внутренностью. На самой нижней строке `R` цикл содержит горизонтальное домино. Если на этой строке есть два или больше горизонтальных домино, одно из них является `WB`-домино, то есть имеет белую клетку слева и чёрную справа. Если горизонтальное домино там одно, его пересекают две соседние вертикальные домино другого разбиения; так как оба разбиения изящное, локальная проверка того же `2x2`-блока снова даёт на нижней строке `WB`-домино в одном из двух разбиений. Зафиксируем разбиение, которому принадлежит это `WB`-домино. Две клетки прямо над ним лежат в `R`: иначе цикл уже выходил бы через верхнюю сторону нижнего домино. Эти две верхние клетки не могут быть покрыты одним горизонтальным домино, потому что вместе с нижним `WB`-домино получился бы запрещённый горизонтальный рисунок; они не могут быть покрыты и двумя вертикальными домино, потому что это запрещённый вертикальный рисунок. Значит хотя бы одна из верхних клеток покрыта горизонтальным домино, выступающим влево или вправо, и на следующей строке снова появляется горизонтальное `WB`-домино того же разбиения. Повторяя подъём, получаем `WB`-домино на границе `R`, над которым уже не обе клетки принадлежат `R`; это домино лежит на самом цикле `C`. Обойдём `C` так, чтобы область `R` оставалась слева, и направим каждое домино выбранного разбиения от белой клетки к чёрной. Нижнее `WB`-домино задаёт такой обход согласованно. Но граничное `WB`-домино с внешней клеткой сверху при обходе с внутренностью слева проходится справа налево, то есть от чёрной клетки к белой. Противоречие. Следовательно, `T Δ M` пусто и изящное разбиение единственно.",
