  "ideas": [
    {
      "id": "idea-each-color-has-large-matching",
      "title": "У каждого цвета отдельно есть большое matching",
      "text": "Если в amber-графе не было бы matching размера `a`, то по Кёнигу существовало бы vertex cover размера `a-1`, а значит amber-рёбер было бы не больше `(a-1)(a+b+1)=a^2+ab-b-1`, что противоречит условию. Аналогично bronze-граф содержит matching размера `b`.",
      "tags": [
        "matching"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-resolve-conflicts-by-empty-row-column",
      "title": "Конфликты между двумя matchings можно выдавливать через пустые строку и столбец",
      "text": "После выбора amber-matching размера `a` и bronze-matching размера `b` конфликтующие клетки можно последовательно устранять: пока есть общая строка или столбец двух разных цветов, остаются пустые строка и столбец, а клетка на их пересечении позволяет сделать обмен и уменьшить число конфликтов.",
