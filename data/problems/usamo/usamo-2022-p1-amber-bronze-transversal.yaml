    {
      "id": "sol-konig-short-and-uncrossing",
      "title": "Коротко через теорему Кёнига и тот же обмен",
      "text": "Положим \\(n=a+b+1\\) и переведём доску в двудольный граф: строки являются левой долей, столбцы — правой, а каждая клетка задаёт ребро между своей строкой и своим столбцом.\n\nСначала докажем, что отдельно у каждого цвета есть достаточно большое паросочетание. Рассмотрим янтарный подграф. Если бы его максимальное паросочетание имело размер не больше \\(a-1\\), то по теореме Кёнига все янтарные рёбра можно было бы покрыть не более чем \\(a-1\\) вершинами двудольного графа, то есть некоторыми строками и столбцами. Одна строка или один столбец содержит не больше \\(n\\) клеток, поэтому такое покрытие содержало бы не больше \\((a-1)n\\) янтарных клеток. Но\n\\[\n(a-1)n=(a-1)(a+b+1)=a^2+ab-b-1,\n\\]\nчто строго меньше заданной нижней оценки \\(a^2+ab-b\\). Противоречие. Значит, существует янтарное паросочетание \\(M_A\\) размера \\(a\\). Тем же рассуждением для бронзового подграфа получаем бронзовое паросочетание \\(M_B\\) размера \\(b\\), потому что\n\\[\n(b-1)n=b^2+ab-a-1.\n\\]\n\nТеперь среди всех пар \\((M_A,M_B)\\), где \\(|M_A|=a\\), \\(|M_B|=b\\), выберем пару с минимальным числом конфликтов. Конфликтом называем ситуацию, когда янтарное и бронзовое ребро имеют общий конец, то есть выбранные клетки лежат в одной строке или одном столбце.\n\nЕсли конфликтов нет, мы уже нашли нужные клетки. Предположим, что конфликт есть. Всего в двух паросочетаниях выбрано \\(a+b=n-1\\) янтарных и бронзовых клеток. Поэтому они используют не более \\(n-1\\) строк и не более \\(n-1\\) столбцов. Значит, существует строка, не занятая ни одной выбранной клеткой, и существует столбец, не занятый ни одной выбранной клеткой. Рассмотрим клетку на их пересечении.\n\nЭта клетка либо янтарная, либо бронзовая. Пусть сначала она янтарная. Добавим её к \\(M_A\\). Так как её строка и столбец были пустыми для обоих паросочетаний, добавление не создаёт ни конфликта с \\(M_B\\), ни внутреннего пересечения внутри \\(M_A\\). Но теперь в \\(M_A\\) на одно ребро больше, чем нужно. Поскольку по предположению был хотя бы один конфликт, существует янтарное ребро из старого \\(M_A\\), конфликтующее с некоторым бронзовым ребром из \\(M_B\\). Удалим такое янтарное ребро. Размер \\(M_A\\) снова равен \\(a\\), паросочетание остаётся паросочетанием, новых конфликтов нет, а по крайней мере один старый конфликт исчез. Это противоречит минимальности выбранной пары.\n\nЕсли клетка на пересечении пустой строки и пустого столбца бронзовая, проводится полностью симметричный обмен в \\(M_B\\): добавляем эту бронзовую клетку и удаляем старое бронзовое ребро, конфликтующее с янтарным. Снова число конфликтов уменьшается.\n\nОба случая невозможны, значит минимальная пара паросочетаний не имела конфликтов. Её рёбра соответствуют \\(a\\) янтарным и \\(b\\) бронзовым клеткам, никакие две из которых не лежат в одной строке или одном столбце.",
