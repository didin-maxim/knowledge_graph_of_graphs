      {
        "id": "stmt-original",
        "title": "Amber and Bronze",
        "text": "Пусть \\(a,b\\) — положительные целые числа. Клетки доски \\((a+b+1)\\times(a+b+1)\\) окрашены в янтарный и бронзовый цвета так, что янтарных клеток не меньше \\(a^2+ab-b\\), а бронзовых клеток не меньше \\(b^2+ab-a\\). Докажите, что можно выбрать \\(a\\) янтарных клеток и \\(b\\) бронзовых клеток так, чтобы никакие две из выбранных \\(a+b\\) клеток не лежали в одной строке или одном столбце.",
        "source_id": "src-usamo-2022-p1-aops-wiki",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": []
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Рассмотрим двудольный граф \\(K_{n,n}\\), где \\(n=a+b+1\\), а строки и столбцы являются двумя долями. Янтарная клетка — янтарное ребро между соответствующей строкой и столбцом, бронзовая клетка — бронзовое ребро. Требуется найти набор из \\(a\\) янтарных рёбер и \\(b\\) бронзовых рёбер, которые попарно не имеют общих концов.",
        "status": "ai_checked",
