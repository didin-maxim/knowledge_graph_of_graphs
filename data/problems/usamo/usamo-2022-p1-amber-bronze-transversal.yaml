      "id": "sol-konig-short-and-uncrossing",
      "title": "Коротко через теорему Кёнига и тот же обмен",
      "text": "Положим \\(n=a+b+1\\). В янтарном двудольном графе строк и столбцов, если бы максимальное паросочетание имело размер не больше \\(a-1\\), то по теореме Кёнига все янтарные рёбра покрывались бы \\(a-1\\) вершинами. Каждая такая вершина покрывает не больше \\(n\\) рёбер, поэтому янтарных клеток было бы не больше \\((a-1)n=a^2+ab-b-1\\), противоречие. Значит, есть янтарное паросочетание размера \\(a\\). Так же есть бронзовое паросочетание размера \\(b\\).\n\nВыберем пару таких паросочетаний с минимальным числом общих строк и столбцов. Если конфликт есть, то среди \\(n\\) строк и \\(n\\) столбцов найдутся пустая строка и пустой столбец. Клетка на их пересечении имеет один из двух цветов. Добавим её в паросочетание этого цвета и удалим из него ребро, конфликтующее с ребром другого цвета. Новая клетка стоит в пустых строке и столбце, поэтому новых конфликтов не создаёт, а старых становится меньше. Это противоречит минимальности. Значит, конфликтов нет, и выбранные клетки дают требуемую трансверсаль.",
