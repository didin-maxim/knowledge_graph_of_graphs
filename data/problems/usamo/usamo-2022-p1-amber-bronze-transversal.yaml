      "id": "idea-each-color-has-large-matching",
      "title": "У каждого цвета отдельно есть большое matching",
      "text": "Если в янтарном графе не было бы паросочетания размера (a), то по теореме Кёнига существовало бы вершинное покрытие размера (a-1), а значит янтарных рёбер было бы не больше ((a-1)(a+b+1)=a^2+ab-b-1), что противоречит условию. Тот же подсчет для бронзового графа с параметром (b) дает паросочетание размера (b).",
