    {
      "id": "sol-hall-matchings-and-uncrossing",
      "title": "Два больших паросочетания и их разведение",
      "text": "Положим \\(n=a+b+1\\). Сначала работаем с янтарными клетками. В двудольном графе строк и столбцов янтарные клетки образуют подграф \\(G_A\\). По лемме о числе рёбер в двудольном графе, если бы в \\(G_A\\) не было паросочетания размера \\(a\\), то янтарных рёбер было бы не больше \\((a-1)n=(a-1)(a+b+1)=a^2+ab-b-1\\), что противоречит условию. Значит, \\(G_A\\) имеет паросочетание \\(M_A\\) размера \\(a\\). Для бронзового подграфа \\(G_B\\) тот же аргумент с числом \\(b\\) дает паросочетание \\(M_B\\) размера \\(b\\).\n\nТеперь выберем такую пару \\((M_A,M_B)\\), у которой число конфликтов — общих строк или столбцов между янтарными и бронзовыми рёбрами — минимально. Если конфликтов нет, задача решена. Иначе, поскольку суммарно используется только \\(a+b=n-1\\) строк и \\(a+b=n-1\\) столбцов, существуют пустые строка и столбец. Клетка на их пересечении имеет один из двух цветов; пусть для определенности она янтарная. Добавим её в \\(M_A\\). Так как конфликт есть, в \\(M_A\\) есть янтарное ребро, имеющее общий конец с бронзовым ребром из \\(M_B\\); удалим одно такое ребро. Новая янтарная клетка стоит в прежде пустых строке и столбце, поэтому не создает новых конфликтов, а удаленное ребро устраняет по крайней мере один старый конфликт. Размер янтарного паросочетания остается равным \\(a\\), а число конфликтов уменьшается. Если пустое пересечение бронзовое, тот же обмен проводится в \\(M_B\\). Это противоречит минимальности числа конфликтов. Следовательно, существует пара непересекающихся паросочетаний: \\(a\\) янтарных рёбер и \\(b\\) бронзовых рёбер без общих концов.",
