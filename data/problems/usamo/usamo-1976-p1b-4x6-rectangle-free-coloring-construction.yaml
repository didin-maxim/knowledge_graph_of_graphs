      "id": "idea-columns-as-two-subsets",
      "title": "Взять столбцы как все пары строк",
      "text": "Если каждый столбец имеет ровно две черные клетки и эти пары пробегают все двухэлементные подмножества четырех строк, то любая пара строк встречается вместе черной ровно в одном столбце. То же верно для белого цвета, потому что дополнения к этим парам снова пробегают все пары строк.",
