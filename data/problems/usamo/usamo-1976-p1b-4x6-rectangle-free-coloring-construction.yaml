  "solutions": [
    {
      "id": "sol-all-two-subsets-construction",
      "title": "Шесть столбцов, соответствующих всем парам строк",
      "text": "Занумеруем строки числами `1,2,3,4`. Шесть столбцов обозначим парами строк `12,13,14,23,24,34`. В столбце `ij` покрасим клетки строк `i` и `j` в черный цвет, а две остальные клетки - в белый. Например, столбец `12` имеет черные клетки в строках `1` и `2`, а белые в строках `3` и `4`.\n\nПроверим, что монохроматического прямоугольника нет. Черный прямоугольник с двумя фиксированными строками `r,s` существовал бы тогда и только тогда, когда есть два разных столбца, в которых обе клетки строк `r` и `s` черные. Но столбец с такой парой черных строк ровно один, а именно `rs`. Значит, черного прямоугольника нет.\n\nБелый прямоугольник с двумя фиксированными строками `r,s` существовал бы тогда и только тогда, когда есть два разных столбца, в которых обе клетки строк `r` и `s` белые. В нашей конструкции это означает, что черная пара соответствующего столбца равна дополнению к `{r,s}` в множестве `{1,2,3,4}`. Такое дополнение тоже единственно, поэтому и белого прямоугольника нет. Следовательно, описанная раскраска доски `4x6` удовлетворяет требованию.",
