        "id": "stmt-original",
        "title": "Конференция и две столовые",
        "text": "На конференции любые два математика либо друзья, либо нет. Во время еды каждый участник выбирает одну из двух больших столовых, причём хочет сидеть в комнате, где число его друзей чётно. Докажите, что число способов разбить участников между двумя комнатами является степенью двойки.",
