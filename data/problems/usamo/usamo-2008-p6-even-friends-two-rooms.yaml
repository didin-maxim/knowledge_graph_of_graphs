        "id": "stmt-original",
        "title": "Конференция и две столовые",
        "text": "На конференции любые два математика либо друзья, либо нет. Во время еды каждый участник выбирает одну из двух больших столовых, причём хочет сидеть в комнате, где число его друзей чётно. Докажите, что число способов разбить участников между двумя комнатами является степенью двойки.",
        "source_id": "src-usamo-2008-p6-aops-wiki",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": []
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Пусть дан граф дружбы `G`. Требуется посчитать число разбиений `V(G)=V_0 \\sqcup V_1`, для которых у каждой вершины число соседей в её собственной доле чётно. Докажите, что это число равно `2^k` для некоторого `k`.",
        "status": "ai_checked",
