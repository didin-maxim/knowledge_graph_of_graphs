    {
      "id": "sol-good-configurations-as-group",
      "title": "AoPS-альтернатива: хорошие конфигурации образуют `2`-группу",
      "text": "Сначала напомним, почему хотя бы одно хорошее разбиение существует. Закодируем выбор комнаты для вершины `v` числом `x_v` из поля `F_2`. Условие «у `v` чётное число друзей в своей комнате» имеет вид\n\n`sum_{u~v}(1+x_u+x_v)=0`.\n\nЭто линейная система над `F_2`. Как в матричном решении выше, её правая часть ортогональна ядру симметричной матрицы системы, поэтому система совместна. Значит можно зафиксировать одно хорошее разбиение `P`.\n\nТеперь для любого другого разбиения `Q` запишем множество `S(Q)` участников, которые перешли в другую комнату по сравнению с `P`. Такое множество будем называть допустимым приказом, если после переключения всех участников из `S(Q)` снова получается хорошее разбиение. Нам нужно доказать, что допустимых приказов степень двойки.\n\nПусть `p_v` — номер комнаты вершины `v` в зафиксированном хорошем разбиении `P`, а `s_v` — индикатор того, что вершину `v` приказано переключить. После переключения номер комнаты становится `p_v+s_v`. Для фиксированной вершины `v` новое условие чётности равно\n\n`sum_{u~v}(1+p_u+s_u+p_v+s_v)=0`.\n\nТак как разбиение `P` уже хорошее, сумма `sum_{u~v}(1+p_u+p_v)` равна нулю. Значит для приказа остаётся однородное линейное условие\n\n`sum_{u~v}s_u + d(v)s_v = 0`\n\nнад `F_2`, где `d(v)` — степень вершины `v` по модулю `2`. Итак, допустимые приказы — это ровно решения системы однородных линейных уравнений по переменным `s_v`.\n\nСледовательно, если два приказа `S_1` и `S_2` допустимы, то их симметрическая разность тоже допустима: это просто сумма двух решений однородной системы над `F_2`. Пустой приказ допустим, потому что исходное разбиение `P` хорошее. Поэтому все допустимые приказы образуют векторное пространство над `F_2` относительно операции симметрической разности.\n\nЛюбое конечное векторное пространство над `F_2` имеет `2^k` элементов, где `k` — его размерность. При этом отображение `Q -> S(Q)` взаимно однозначно: зная, кого переключить относительно фиксированного `P`, мы однозначно восстанавливаем разбиение `Q`. Значит число хороших разбиений равно числу допустимых приказов, то есть является степенью двойки.",
