  "solutions": [
    {
      "id": "sol-adjacency-matrix-over-f2",
      "title": "Линейная алгебра над F_2",
      "text": "Рассмотрим граф дружбы `G` и обозначим через `f(v) in F_2` номер комнаты вершины `v`. Для вершины `v` число друзей в той же комнате равно по модулю 2 сумме `sum_{u~v} (1+f(u)+f(v))`. Значит требование «это число чётно» превращается в линейное уравнение вида `Af = b` над `F_2`, где `A` строится из матрицы смежности графа и, при необходимости, диагональных поправок от степеней. Следовательно, множество допустимых разбиений либо пусто, либо является аффинным подпространством пространства `F_2^{V}`. Но пустым оно не является: AoPS-решение показывает это, при необходимости добавляя лист и используя симметричность матрицы, чтобы убедиться, что правая часть лежит в столбцовом пространстве. Поэтому число решений равно `2^k` для некоторого `k`.",
      "idea_ids": [
        "idea-affine-solution-space-over-f2"
      ],
      "standard_idea_ids": [],
      "status": "ai_checked",
      "definition_ids": [
        "simple_graph",
        "degree"
      ]
    },
    {
      "id": "sol-good-configurations-as-group",
      "title": "AoPS-альтернатива: хорошие конфигурации образуют `2`-группу",
      "text": "Зафиксируем одно хорошее разбиение участников по двум комнатам. Для любого другого хорошего разбиения запишем приказ каждому участнику: остаться или перейти в другую комнату. Такие приказы можно складывать по модулю `2`, то есть выполнять один за другим. AoPS-наблюдение состоит в том, что множество приказов, переводящих хорошую конфигурацию снова в хорошую, замкнуто относительно этого сложения: для каждой вершины условие чётности на числе друзей, которые переключаются относительно неё, ведёт себя линейно по модулю `2`. Значит все допустимые переходы образуют абелеву `2`-группу, а потому их число равно `2^k`. Это то же явление, что и в линейно-алгебраическом решении, но выраженное более комбинаторно: пространство решений не выписывается как ядро матрицы, а распознаётся как группа симметрий одной хорошей конфигурации.",
      "idea_ids": [
        "idea-orders-form-abelian-group"
      ],
      "standard_idea_ids": [],
      "status": "ai_checked",
      "definition_ids": [
        "simple_graph",
        "degree"
      ]
    },
    {
      "id": "sol-existence-by-switching-odd-vertex",
      "title": "Count-версия AoPS-индукции с переключением соседей",
      "text": "Усилим переключающую индукцию до счёта. Если в графе есть вершина `v` нечётной степени, удалим её и у всех пар вершин из `N(v)` переключим наличие ребра; пусть полученный граф равен `H`. Хорошее разбиение `H` единственным образом продолжается до хорошего разбиения исходного графа: так как `deg(v)` нечётна, среди двух комнат ровно в одной число соседей `v` чётно, и туда надо посадить `v`. Проверка для соседей `v` обратима: переключение рёбер внутри `N(v)` ровно компенсирует добавление вершины `v`, а для остальных вершин условие не меняется. Поэтому число хороших разбиений не меняется при таком шаге. Повторяя шаг, приходим к графу, где все степени чётны. В таком графе условие «у каждой вершины чётно много соседей в своей комнате» эквивалентно тому, что каждая вершина имеет чётное число соседей по другую сторону разбиения. Множества вершин, задающие одну из комнат и удовлетворяющие этому условию, замкнуты относительно симметрической разности, потому что паритет числа рёбер из фиксированной вершины через разрез складывается по модулю `2`. Значит эти множества образуют векторное пространство над `F_2`, и их число равно `2^k`. Так как все предыдущие переключающие шаги сохраняли число разбиений, исходное число тоже является степенью двойки.",
      "idea_ids": [
