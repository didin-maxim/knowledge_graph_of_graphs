    {
      "id": "sol-adjacency-matrix-over-f2",
      "title": "Линейная алгебра над F_2",
      "text": "Рассмотрим граф дружбы `G` и будем считать номер комнаты вершины `v` элементом `x_v` поля `F_2`. Для вершины `v` условие чётности числа друзей в той же комнате равно\n\n\\[\n\\sum_{u\\sim v}(1+x_u+x_v)=0 \\pmod 2.\n\\]\n\nЕсли `d(v)` — степень вершины, это линейная система `Bx=d` над `F_2`, где `d` — вектор степеней по модулю 2, внедиагональные элементы `B` равны матрице смежности, а диагональный элемент `B_{vv}` равен `d(v)` по модулю 2.\n\nОсталось проверить, что система совместна. Матрица `B` симметрична. Для любой строки сумма элементов равна `d(v)+d(v)=0`, значит вектор всех единиц лежит в ядре `B`; но важнее следующее: если `y` лежит в ядре `B`, то\n\\[\n0=y^TBy=\\sum_v d(v)y_v+2\\sum_{uv\\in E}y_uy_v=\\sum_v d(v)y_v\n\\]\nв `F_2`. Значит правая часть `d` ортогональна всему ядру `B`, а для симметричной матрицы это ровно условие принадлежности `d` её столбцовому пространству. Следовательно, хотя бы одно допустимое разбиение существует.\n\nМножество всех решений линейной системы либо пусто, либо является аффинным подпространством; мы только что доказали, что оно не пусто. Поэтому число допустимых разбиений равно `2^k` для некоторого `k`.",
