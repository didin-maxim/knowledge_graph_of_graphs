        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": []
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Пусть дан граф дружбы `G`. Требуется посчитать число разбиений `V(G)=V_0 \\sqcup V_1`, для которых у каждой вершины число соседей в её собственной доле чётно. Докажите, что это число равно `2^k` для некоторого `k`.",
