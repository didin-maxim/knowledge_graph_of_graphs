  "solutions": [
    {
      "id": "sol-red-black-imbalance",
      "title": "Красно-чёрный дисбаланс",
      "text": "Окрасим точки `S_n` красным и чёрным по строкам: каждая строка начинается и заканчивается красной, а цвета внутри строки чередуются. Тогда красных точек ровно на `2n` больше, чем чёрных. Единственное место, где две соседние точки могут оказаться обе красными, — это `n` специальных пар в двух средних строках. Предположим, что существует разбиение на `m<n` путей. Разрежем каждый путь везде, где подряд идут две красные точки; таких разрезов не больше `n`, так что получится не более `m+n` путей, на каждом из которых цвета уже строго чередуются. В любом чередующемся пути красных не больше чем на 1 больше, чем чёрных. Следовательно, общий избыток красных над чёрными не превосходит `m+n`. Но этот избыток равен `2n`, значит `2n <= m+n`, откуда `m >= n`, противоречие.",
      "idea_ids": [
        "idea-checkerboard-with-middle-defect"
      ],
      "standard_idea_ids": [
        "alternating_paths"
      ],
      "status": "ai_checked",
      "definition_ids": [
        "path"
      ]
    },
    {
      "id": "sol-complement-trim-induction",
      "title": "AoPS-альтернатива через дополнение и стягивание к `S_{n-1}`",
      "text": "Альтернативное AoPS-решение формулирует разбиение на `m` путей как подграф `H_n` решёточного графа на `S_n`, в котором каждая вершина имеет степень не больше `2`, а число рёбер равно `|S_n|-m`. Если бы существовало разбиение `S_{n+1}` меньше чем на `n+1` путей, то такой подграф `H_{n+1}` имел бы слишком много рёбер. Тогда удобно рассмотреть дополнение `F_{n+1}` внутри полного решёточного графа `G_{n+1}`. У внутренних вершин в `F_{n+1}` остаётся степень как минимум `2`, а внешняя ромбическая оболочка даёт лишь ограниченное число внешне-внутренних рёбер. Удаляя внешние вершины и затем ещё небольшое число рёбер, можно получить на внутреннем ромбе ровно подграф типа `H_n`, который снова задаёт разбиение `S_n` на слишком малое число путей. Это запускает индукцию вниз по `n` и приводит к невозможному случаю `S_1`. По сути, решение использует уже не цветовой дисбаланс, а контроль над тем, сколько рёбер должен содержать path cover и как этот счёт ведёт себя при переходе от `S_{n+1}` к `S_n`.",
