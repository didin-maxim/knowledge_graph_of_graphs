  "solutions": [
    {
      "id": "sol-red-black-imbalance",
      "title": "Красно-чёрный дисбаланс",
      "text": "Окрасим точки `S_n` красным и чёрным по горизонтальным строкам так, чтобы в каждой строке цвета чередовались, а первая и последняя точки строки были красными. Каждая строка множества `S_n` имеет нечётную длину, поэтому в каждой строке красных точек на одну больше, чем чёрных. Всего строк `2n`, значит во всём `S_n` красных точек ровно на `2n` больше, чем чёрных.\n\nПосмотрим, где две соседние точки могут оказаться обе красными. По горизонтали цвета чередуются, значит таких пар нет. Между соседними горизонтальными строками цвета тоже чередуются с противоположной фазой, кроме перехода между двумя средними строками `y=-1` и `y=0`. В этих двух строках лежит по `2n-1` точек, и вертикальных красно-красных соседств между ними ровно `n`: они соответствуют красным позициям в одной строке. Других красно-красных соседних пар нет.\n\nПусть теперь `S_n` разбито на `m` путей. Разрежем каждый путь во всех местах, где он проходит по красно-красному соседству. Таких рёбер в решётке всего `n`, поэтому после всех разрезов получится не более `m+n` путей. В каждом новом пути уже нет двух соседних красных точек. Следовательно, в таком пути красных точек не может быть больше, чем чёрных, более чем на `1`: между любыми двумя красными вдоль пути стоит хотя бы одна чёрная, кроме возможной одной лишней красной на конце.\n\nСуммируя по всем полученным путям, получаем, что общий избыток красных точек над чёрными не превосходит числа этих путей, то есть не превосходит `m+n`. Но ранее этот избыток был равен `2n`. Поэтому `2n <= m+n`, откуда `m>=n`. Значит, разбить точки `S_n` менее чем на `n` путей невозможно.",
