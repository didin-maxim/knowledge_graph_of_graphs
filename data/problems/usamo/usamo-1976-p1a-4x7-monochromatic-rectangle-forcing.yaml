  "solutions": [
    {
      "id": "sol-column-row-pair-double-counting",
      "title": "Подсчет одноцветных пар строк по столбцам",
      "text": "Предположим, что монохроматического прямоугольника нет. В каждом столбце посмотрим на пары строк, в которых две клетки этого столбца имеют один цвет. Если в столбце `k` черных клеток, то таких пар равно `C(k,2)+C(4-k,2)`. При `k=0,1,2,3,4` это число соответственно равно `6,3,2,3,6`, поэтому в каждом столбце есть как минимум `2` одноцветные пары строк.\n\nНа семи столбцах получаем не меньше `14` объектов вида `(пара строк, цвет, столбец)`, где в данном столбце две клетки выбранных строк имеют указанный цвет. С другой стороны, если для одной и той же пары строк и одного и того же цвета нашлись бы два разных столбца, то четыре клетки на пересечении этих двух строк и двух столбцов образовали бы монохроматический прямоугольник. Значит, при нашем предположении каждая из `C(4,2) * 2 = 12` пар `(пара строк, цвет)` может встретиться не более одного раза. Это противоречит нижней оценке `14`. Следовательно, монохроматический прямоугольник обязательно существует.",
