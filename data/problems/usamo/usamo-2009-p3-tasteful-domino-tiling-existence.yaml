  "solutions": [
    {
      "id": "sol-corner-induction",
      "title": "Индукция по числу домино",
      "text": "Докажем утверждение индукцией по числу домино в разбиении. База при пустом многоугольнике очевидна. Среди самых левых клеток данного многоугольника выберем нижнюю и назовём её `L`; у неё нет соседей слева и снизу.\n\nСначала пусть `L` чёрная. Возьмём любое домино-разбиение и посмотрим на домино `D`, покрывающее `L`. Если `D` горизонтально, удалим его. Остаток снова является шахматным многоугольником и замощается домино, поэтому по индукции он имеет изящное разбиение. Возвращение горизонтального `D` не создаёт запрещённого рисунка: вертикальный запрещённый `2x2`-блок не использует `D`, а горизонтальный запрещённый блок с `D` потребовал бы две клетки ниже `L`, которых нет.\n\nОстаётся случай, когда `D` вертикально. Если после возвращения `D` к изящное-разбиению остатка запрета не возникает, всё готово. Если запрет возникает, он может быть только таким: справа от `D` стоит второе вертикальное домино, и вместе они образуют `2x2`-квадрат с чёрной нижней левой клеткой. Повернём эти две вертикальные домино в две горизонтальные. Теперь получено домино-разбиение исходного многоугольника, где `L` покрыта горизонтально. Удаляем именно это горизонтальное домино, применяем индукцию к остатку и возвращаем его; как уже доказано, это безопасно.\n\nЕсли `L` белая, рассуждение симметрично с заменой горизонтального и вертикального направлений. Для белой `L` безопасным сразу является вертикальное домино. Если `L` покрыта горизонтально и это приводит к запрещённой паре горизонтальных домино в `2x2`-блоке над ним, поворачиваем этот блок в две вертикальные домино, после чего сводимся к безопасному вертикальному случаю. Следовательно, любой замощаемый шахматный многоугольник имеет изящное разбиение.",
