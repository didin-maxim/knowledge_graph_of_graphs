        "id": "stmt-existence",
        "title": "Существование изящного разбиения",
        "text": "Шахматным многоугольником назовём многоугольник, стороны которого лежат на прямых `x=a` или `y=b`, где `a,b` — целые; его внутренность разбивается этими прямыми на единичные клетки шахматной раскраски. Домино-разбиение такого многоугольника — это точное покрытие неперекрывающимися прямоугольниками `1x2` и `2x1`. В каждом `2x2`-блоке запрещены два цветных локальных рисунка: две вертикальные домино, если нижняя левая клетка блока чёрная, и две горизонтальные домино, если нижняя левая клетка блока белая. Назовём разбиение изящное, если ни один из этих двух рисунков в нём не встречается. Докажите, что если шахматный многоугольник можно замостить домино, то его можно замостить изящным образом.",
        "source_id": "src-usamo-2009-p3-aops-wiki",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": []
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph-existence",
        "text": "Дан конечный связный клеточный подграф квадратной решётки, соответствующий шахматному многоугольнику: вершины — единичные клетки, а рёбра соединяют клетки с общей стороной. Клетки раскрашены шахматно. Совершенное паросочетание этого графа назовём аккуратным, если ни в одном `2 x 2`-блоке оно не содержит две вертикальные пары при чёрной нижней левой клетке и не содержит две горизонтальные пары при белой нижней левой клетке. Докажите, что если в графе существует совершенное паросочетание, то существует аккуратное совершенное паросочетание.",
