  "solutions": [
    {
      "id": "sol-gabriel-planar-bound",
      "title": "Полное решение: выбор S и сведение к двум леммам о графе Габриэля",
      "text": "Выигрывает Алиса. Она выбирает произвольные разные точки \\(P,Q\\) и берёт \\(\\mathcal S\\) равным множеству всех точек, лежащих строго вне замкнутого диска с диаметром \\(PQ\\). Рассмотрим пару городов \\(A,B\\). Для третьего города \\(C\\) существование \\(R\\in\\mathcal S\\), при котором \\(\\triangle PQR\\) прямо подобен \\(\\triangle ABC\\) или \\(\\triangle BAC\\), означает ровно, что при одном из двух прямых подобий, переводящих упорядоченную пару \\((P,Q)\\) в \\((A,B)\\) или \\((B,A)\\), точка \\(R\\) переходит в \\(C\\). Так как прямое подобие переводит замкнутый диск с диаметром \\(PQ\\) в замкнутый диск с диаметром \\(AB\\), выбранное \\(\\mathcal S\\) даёт такое условие: для каждого третьего города \\(C\\) точка \\(C\\) лежит строго вне замкнутого диска с диаметром \\(AB\\).\n\nИными словами, построенная сеть является графом Габриэля множества городов: ребро \\(AB\\) проводится ровно тогда, когда замкнутый диаметральный диск \\(AB\\) пуст от других городов. Теперь применяем две отдельные леммы из базы. Первая говорит, что граф Габриэля такого множества городов связен, потому что расстояния между любыми двумя городами больше \\(1\\). Вторая говорит, что его рёбра, нарисованные прямолинейными отрезками, не пересекаются внутренними точками, потому что никакие три города не коллинеарны. Значит, при любом допустимом расположении городов Бобом сеть связна и без пересечений дорог. Это ровно условие выигрыша Алисы.",
