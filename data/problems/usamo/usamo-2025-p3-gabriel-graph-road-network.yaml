        "title": "Оригинальная формулировка",
        "text": "Алиса выбирает две точки `P,Q` и множество `S` на плоскости; затем Боб ставит бесконечно много городов так, что расстояние между любыми двумя городами больше 1 и никакие три не коллинеарны. После этого Алиса соединяет две города дорогой тогда и только тогда, когда существует точка из `S`, равноудалённая от этих двух городов и не ближе ни к одному другому городу. Нужно подобрать `S`, чтобы в построенной сети дорог обязательно нашёлся город степени не больше 5.",
