        "id": "stmt-original",
        "title": "Оригинальная формулировка",
        "text": "Алиса выбирает две точки `P,Q` и множество `S` на плоскости; затем Боб ставит бесконечно много городов так, что расстояние между любыми двумя городами больше `1` и никакие три не коллинеарны. После этого каждая пара городов `A,B` соединяется дорогой по отрезку `AB` тогда и только тогда, когда для каждого третьего города `C` существует точка `R` из `S`, для которой треугольник `PQR` прямо подобен одному из треугольников `ABC` или `BAC`. Нужно подобрать `P,Q,S`, чтобы в построенной сети между любыми двумя городами можно было проехать по конечной цепочке дорог и никакие две дороги не пересекались внутренними точками.",
        "source_id": "src-usamo-2025-p3-aops-wiki",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": []
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Пусть `X` — бесконечное множество точек плоскости, попарные расстояния между которыми больше `1`, и никакие три точки из `X` не лежат на одной прямой. В графе Габриэля на множестве `X` вершинами являются точки из `X`, а две вершины `A,B` смежны тогда и только тогда, когда замкнутый диск с диаметром `AB` не содержит точек из `X`, отличных от `A` и `B`. Докажите, что этот граф связен и что его рёбра можно нарисовать прямолинейными отрезками без пересечений внутренних точек.",
