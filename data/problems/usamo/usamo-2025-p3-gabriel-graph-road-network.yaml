        "id": "stmt-original",
        "title": "Оригинальная формулировка",
        "text": "Алиса выбирает две точки `P,Q` и множество `S` на плоскости; затем Боб ставит бесконечно много городов так, что расстояние между любыми двумя городами больше `1` и никакие три не коллинеарны. После этого каждая пара городов `A,B` соединяется дорогой по отрезку `AB` тогда и только тогда, когда для каждого третьего города `C` существует точка `R` из `S`, для которой треугольник `PQR` прямо подобен одному из треугольников `ABC` или `BAC`. Алиса выигрывает, если ей удаётся заранее подобрать `P,Q,S` так, что при любом допустимом расположении городов Бобом в построенной сети между любыми двумя городами можно проехать по конечной цепочке дорог и никакие две дороги не пересекаются внутренними точками; иначе выигрывает Боб. Докажите, что Алиса может выиграть.",
