  "solutions": [
    {
      "id": "sol-gabriel-planar-bound",
      "title": "Полное решение: выбор S, связность и планарность Gabriel graph",
      "text": "Выигрывает Alice. Она выбирает произвольные разные точки \\(P,Q\\) и берёт \\(\\mathcal S\\) равным множеству всех точек, лежащих строго вне диска с диаметром \\(PQ\\). Рассмотрим пару городов \\(A,B\\). Для третьего города \\(C\\) существование \\(R\\in\\mathcal S\\), при котором \\(\\triangle PQR\\) прямо подобен \\(\\triangle ABC\\) или \\(\\triangle BAC\\), означает ровно, что при одном из двух прямых подобий, переводящих упорядоченную пару \\((P,Q)\\) в \\((A,B)\\) или \\((B,A)\\), точка \\(R\\) переходит в \\(C\\). Так как прямое подобие переводит диск с диаметром \\(PQ\\) в диск с диаметром \\(AB\\), выбранное \\(\\mathcal S\\) даёт такое условие: для каждого третьего города \\(C\\) точка \\(C\\) лежит строго вне диска с диаметром \\(AB\\). Иными словами, построенная сеть есть Gabriel graph множества городов: ребро \\(AB\\) проводится ровно тогда, когда замкнутый диаметральный диск \\(AB\\) пуст от других городов.\n\nДокажем связность этого графа. Предположим, что есть города \\(p,q\\) в разных компонентах. Тогда \\(pq\\) не ребро, значит в замкнутом диске с диаметром \\(pq\\) есть город \\(r\\). Он не может лежать одновременно в компонентах \\(p\\) и \\(q\\), поэтому хотя бы одна из пар \\((p,r)\\), \\((r,q)\\) снова соединяет разные компоненты; назовём её \\((u,v)\\), а второй отрезок от \\(r\\) к одному из концов \\(pq\\) назовём \\(w\\). Так как расстояния между любыми двумя городами больше \\(1\\), из прямоугольного или тупоугольного треугольника с наибольшей стороной \\(pq\\) получаем \\(uv^2\\le pq^2-w^2<pq^2-1\\). Повторяя рассуждение, строим пары городов из разных компонент с квадратами расстояний, каждый раз уменьшающимися хотя бы на \\(1\\), что невозможно бесконечно при неотрицательных квадратах расстояний. Значит граф связен, то есть между любыми двумя городами есть конечная цепочка дорог.\n\nДокажем планарность. Если два ребра \\(AC\\) и \\(BD\\) пересекаются внутренними точками, то \\(A,B,C,D\\) образуют выпуклый четырёхугольник. В нём есть угол не меньше \\(90^\\circ\\); без ограничения общности пусть это угол \\(BAD\\). Тогда точка \\(A\\) лежит в замкнутом диске с диаметром \\(BD\\), по теореме Фалеса, и ребро \\(BD\\) не должно было быть проведено. Противоречие. Следовательно дороги не пересекаются. Связность и отсутствие пересечений — именно два условия победы Alice, поэтому выбранное множество \\(\\mathcal S\\) является выигрышным.",
