  "solutions": [
    {
      "id": "sol-gabriel-planar-bound",
      "title": "Распознавание графа Габриэля и планарность",
      "text": "Решение AoPS прямо отмечает, что при подходящем выборе \\(S\\) построенная дорожная сеть есть граф Габриэля множества городов. Для графа Габриэля известно и геометрически легко видно, что он планарен: если два ребра пересекались бы, то один из диаметровых дисков не был бы пуст. Кроме того, такой граф связен. После этого задача фактически становится стандартной: в любом конечном простом планарном графе средняя степень меньше 6, поскольку \\(e\\le 3v-6\\). Значит, в каждом конечном участке есть вершина степени не больше 5; это и даёт требуемый город малой степени. Содержательная графовая часть здесь не в вычислениях, а в правильном распознавании объекта: после перехода к графу Габриэля вся задача сводится к планарности и обычной оценке числа рёбер.",
