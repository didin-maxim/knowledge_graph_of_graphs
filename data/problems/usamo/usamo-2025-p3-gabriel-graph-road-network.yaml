  "solutions": [
    {
      "id": "sol-gabriel-planar-bound",
      "title": "Полное решение: выбор S, связность и планарность Gabriel graph",
      "text": "Выигрывает Alice. Она выбирает произвольные разные точки \\(P,Q\\) и берёт \\(\\mathcal S\\) равным множеству всех точек, лежащих строго вне диска с диаметром \\(PQ\\). При прямом подобии, переводящем \\(P,Q\\) в два города \\(A,B\\), точка \\(R\\) переходит в соответствующую точку относительно отрезка \\(AB\\). Поэтому условие из задачи для пары \\(A,B\\) становится таким: для каждого третьего города \\(C\\) точка \\(C\\) лежит вне замкнутого диска с диаметром \\(AB\\). Иными словами, построенная сеть есть Gabriel graph множества городов: ребро \\(AB\\) проводится ровно тогда, когда диаметральный диск \\(AB\\) пуст от других городов.\n\nДокажем связность этого графа. Предположим, что есть города \\(p,q\\) в разных компонентах. Тогда \\(pq\\) не ребро, значит внутри диска с диаметром \\(pq\\) есть город \\(r\\). Он не может лежать одновременно в компонентах \\(p\\) и \\(q\\), поэтому одна из пар, скажем \\(p,r\\), снова соединяет разные компоненты. Так как расстояния между любыми двумя городами больше \\(1\\), из прямоугольного треугольника с гипотенузой \\(pq\\) получаем \\(pr^2\\le pq^2-1\\) или аналогично для выбранной новой пары. Повторяя рассуждение, строим пары городов из разных компонент с квадратами расстояний, каждый раз уменьшающимися хотя бы на \\(1\\), что невозможно бесконечно при неотрицательных квадратах расстояний. Значит граф связен.\n\nДокажем планарность. Если два ребра \\(AC\\) и \\(BD\\) пересекаются внутренними точками, то \\(A,B,C,D\\) образуют выпуклый четырёхугольник. В нём есть угол не меньше \\(90^\\circ\\); без ограничения общности пусть это угол \\(BAD\\). Тогда точка \\(A\\) лежит в замкнутом диске с диаметром \\(BD\\), по теореме Фалеса, и ребро \\(BD\\) не должно было быть проведено. Противоречие. Следовательно дороги не пересекаются, а вместе со связностью это ровно условие победы Alice.",
