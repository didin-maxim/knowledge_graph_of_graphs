      "title": "Связность и планарность Bob-графа",
      "text": "Связность доказывается бесконечным спуском по квадратам расстояний: если две компоненты разделены, точка внутри диаметрального диска даёт новую пару из разных компонент на расстоянии с квадратом меньше как минимум на 1. Планарность следует из того, что при пересечении двух рёбер один конец лежит в диаметральном диске другого ребра.",
