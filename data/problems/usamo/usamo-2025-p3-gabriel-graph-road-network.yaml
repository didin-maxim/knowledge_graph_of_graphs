        "text": "Бесконечное множество точек плоскости имеет попарные расстояния больше `1`, и никакие три точки не лежат на одной прямой. В графе Габриэля этого множества две точки соединены ребром тогда и только тогда, когда замкнутый диск с диаметром на отрезке между ними не содержит других точек множества. Докажите, что этот граф связен и что его рёбра можно нарисовать прямолинейными отрезками без пересечений внутренних точек.",
