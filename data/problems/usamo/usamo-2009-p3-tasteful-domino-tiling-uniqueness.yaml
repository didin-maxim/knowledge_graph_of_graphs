        "id": "stmt-uniqueness",
        "title": "Единственность изящного разбиения",
        "text": "Шахматным многоугольником назовём многоугольник, стороны которого лежат на прямых `x=a` или `y=b`, где `a,b` — целые; его внутренность разбивается этими прямыми на единичные клетки шахматной раскраски. Домино-разбиение такого многоугольника — это точное покрытие неперекрывающимися прямоугольниками `1x2` и `2x1`. В каждом `2x2`-блоке запрещены два цветных локальных рисунка: две вертикальные домино, если нижняя левая клетка блока чёрная, и две горизонтальные домино, если нижняя левая клетка блока белая. Назовём разбиение изящное, если ни один из этих двух рисунков в нём не встречается. Докажите, что у каждого шахматного многоугольника существует не более одного изящное-домино-разбиения.",
        "source_id": "src-usamo-2009-p3-aops-wiki",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": []
      }
    ],
    "graph_theory": [
