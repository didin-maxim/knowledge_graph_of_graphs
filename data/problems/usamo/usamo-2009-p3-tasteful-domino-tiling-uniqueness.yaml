  "solutions": [
    {
      "id": "sol-alternating-cycle-obstruction",
      "title": "Запрет чередующегося цикла",
      "text": "Предположим, что существуют два разных изящного разбиения `T` и `M`. Рассмотрим граф на клетках многоугольника, где каждое домино даёт ребро между двумя соседними клетками. В симметрической разности `T Δ M` каждая участвующая клетка имеет степень `2`: к ней инцидентно одно домино из `T` и одно домино из `M`. Следовательно, `T Δ M` распадается на непересекающиеся чётные циклы, в которых рёбра из `T` и `M` чередуются. Возьмём один такой цикл `C`, а через `R` обозначим область, ограниченную `C` вместе с внутренностью.\n\nНа самой нижней строке области `R` цикл содержит горизонтальное домино. Если таких горизонтальных домино на этой строке несколько, среди них есть домино типа `WB`, то есть с белой клеткой слева и чёрной справа. Если горизонтальное домино на нижней строке единственное, то две соседние вертикальные домино другого разбиения, с которыми оно чередуется, и локальная изящное-проверка того же `2x2`-блока снова дают горизонтальное `WB`-домино на нижней строке в одном из двух разбиений. Зафиксируем разбиение, которому принадлежит найденное `WB`-домино.\n\nДве клетки прямо над этим `WB`-домино лежат в `R`; иначе цикл уже выходил бы через верхнюю сторону нижнего домино. Эти две клетки не могут быть покрыты одним горизонтальным домино выбранного разбиения, потому что вместе с нижним `WB`-домино получилась бы запрещённая пара горизонтальных домино в `2x2`-блоке. Они также не могут быть покрыты двумя вертикальными домино, потому что тогда возникла бы запрещённая пара вертикальных домино. Значит хотя бы одна из этих верхних клеток покрыта горизонтальным домино, выступающим влево или вправо, и на следующей строке возникает новое горизонтальное `WB`-домино того же выбранного разбиения.\n\nПовторяя этот подъём, мы неизбежно доходим до `WB`-домино на верхней границе области `R`, над которым уже не обе клетки принадлежат `R`; это домино лежит на самом цикле `C`. Теперь обойдём `C` так, чтобы область `R` оставалась слева, и ориентируем каждое домино выбранного разбиения от белой клетки к чёрной. На нижнем `WB`-домино направление обхода согласуется с этой ориентацией. Из-за чередования вдоль цикла такая согласованность сохраняется для всех домино выбранного разбиения на `C`. Но верхнее граничное `WB`-домино при обходе с внутренностью слева проходится справа налево, то есть от чёрной клетки к белой. Противоречие.\n\nЗначит чередующегося цикла в `T Δ M` быть не может, поэтому симметрическая разность пуста и `T=M`. Следовательно, изящное разбиение, если оно существует, единственно.",
