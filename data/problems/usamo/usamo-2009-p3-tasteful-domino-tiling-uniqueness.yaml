      "text": "Если два совершенных паросочетания различны, то после удаления общих домино каждая оставшаяся клетка имеет степень `2`: одно ребро из первого разбиения и одно из второго. Поэтому появляется хотя бы один чётный цикл с чередованием разбиений.",
