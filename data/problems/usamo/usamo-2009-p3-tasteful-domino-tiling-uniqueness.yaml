      "title": "Нижний `WB`-домино вынуждает подъём к верхней границе",
      "text": "На нижней строке области, ограниченной чередующимся циклом, можно найти горизонтальное домино с белой клеткой слева. Изящное условие запрещает оба простых покрытия пары клеток над ним, поэтому такой же объект вынужденно появляется строкой выше.",
