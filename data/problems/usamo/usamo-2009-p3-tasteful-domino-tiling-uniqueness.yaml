        "id": "stmt-graph-uniqueness",
        "text": "Пусть \\(G\\) — конечный связный индуцированный подграф квадратной решётки с раскраской вершин по чётности координат. Совершенное паросочетание \\(M\\) назовём допустимым, если для каждого единичного \\(4\\)-цикла выполнены два запрета: при чёрной нижней левой вершине \\(M\\) не содержит обе вертикальные стороны цикла, а при белой нижней левой вершине \\(M\\) не содержит обе горизонтальные стороны цикла. Докажите, что в \\(G\\) существует не более одного допустимого совершенного паросочетания.",
