  "solutions": [
    {
      "id": "sol-special-square-digraph",
      "title": "Deferred: схемы добавлены, но общая перекладка красных домино не доказана",
      "text": "Deferred. Проверенные источники подтверждают ответ \\(\\{1,2,\\ldots,((n-1)/2)^2\\}\\cup\\{((n+1)/2)^2\\}\\) и верхнюю оценку. Графовая часть переносится надёжно: пустая клетка остаётся в одном классе чётности; для special squares дуга идёт из покрытой special square в клетку, на которую указывает домино; всякий цикл такого графа должен окружать пустую клетку; поэтому компонента \\(T\\) пустой клетки является деревом, все дуги в ней направлены к пустой клетке, и \\(k(C)=|V(T)|\\). Также проверено, что если красный, то есть нечётно-нечётный, класс даёт больше \\(((n-1)/2)^2\\), то компонента вынужденно содержит все \\(((n+1)/2)^2\\) красных клеток. Для нижней конструкции источники используют один и тот же рисунок-алгоритм: при \\(n=2m+1\\) чётно-чётные клетки идут змейкой; чтобы получить \\(1\\le k\\le m^2\\), оставляют пустой первый конец змейки, первые \\(k\\) синих вершин образуют компоненту \\(T\\), после \\(k\\)-й вершины путь блокируется красным домино, а остаток синей змейки направляется к внешнему концу доски. В приложенных схемах это правило проверено как полная домино-конфигурация для \\(n=7\\) и всех \\(k=9,8,\\ldots,1\\), а отдельная схема показывает общий разрез змейки для произвольного \\(m\\). Однако источники не выписывают доказанный общий алгоритм перекладки всех оставшихся красных домино после каждого разреза; текущий генератор нашёл такие покрытия алгоритмом паросочетания для проверенных малых размеров, но это ещё не заменяет математическое доказательство для всех \\(m,k\\). Поэтому карточка честно остаётся не public_ready.",
      "examples": [
        {
          "type": "image",
          "title": "Все малые значения при n=7",
          "path": "assets/examples/usamo-2023-p3/n7-small-k-blue-snake.png",
          "alt": "Девять домино-конфигураций на доске 7 на 7 для k=9,8,...,1",
          "caption": "Панели читаются слева направо, сверху вниз: \\(k=9,8,\\ldots,1\\). Чёрные стрелки показывают синюю компоненту пустой клетки; серые стрелки лежат вне неё. Каждая панель является полной домино-конфигурацией на \\(7\\times7\\), поэтому по рисунку восстанавливаются все домино и проверяется \\(k(C)=k\\) для всех \\(1\\le k\\le9=((7-1)/2)^2\\)."
        },
        {
          "type": "image",
          "title": "Общий разрез синей змейки",
          "path": "assets/examples/usamo-2023-p3/blue-snake-cut-schematic.png",
          "alt": "Схема разреза синей змейки после k-й чётно-чётной клетки",
          "caption": "Схема фиксирует правило из Evan Chen notes, Holden Mui proposal и draft USAMO report для \\(n=2m+1\\): чётно-чётные клетки обходятся змейкой; выбор разреза после \\(k\\)-й клетки даёт ровно \\(k\\) синих вершин в компоненте пустой клетки. Красный кружок отмечает белую клетку разреза, которую должно занять блокирующее красное домино. Эта схема покрывает все \\(1\\le k\\le m^2\\) на уровне синего орграфа, но не доказывает сама по себе существование общей красной перекладки."
        },
        {
          "type": "image",
          "title": "Исключительное большое значение",
          "path": "assets/examples/usamo-2023-p3/n7-red-spanning-snake.png",
          "alt": "Красная змейка на доске 7 на 7 с компонентой размера 16",
          "caption": "Пример для \\(n=7\\), где красные нечётно-нечётные клетки образуют spanning snake, пустая клетка находится на конце, и \\(k(C)=16=((7+1)/2)^2\\). Для общего \\(n=2m+1\\) тот же snake-рисунок на \\((m+1)\\times(m+1)\\) красных клетках даёт исключительное значение \\((m+1)^2\\)."
        }
