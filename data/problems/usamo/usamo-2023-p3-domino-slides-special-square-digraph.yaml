  "solutions": [
    {
      "id": "sol-special-square-digraph",
      "title": "Ориентированный граф особых клеток и двойственная конструкция",
      "text": "Пусть \\(n=2m+1\\), а строки и столбцы занумерованы числами \\(1,\\ldots,n\\). Назовём красными клетки с двумя нечётными координатами, синими - клетки с двумя чётными координатами, а остальные клетки белыми. Каждое домино покрывает одну клетку с чётной суммой координат и одну с нечётной, а на доске нечётного размера клеток с чётной суммой на одну больше; поэтому пустая клетка всегда имеет чётную сумму координат, то есть бывает только красной или синей. После любого сдвига пустая клетка переходит на расстояние \\(2\\) по строке или столбцу, значит её класс чётности координат не меняется.\n\nЗафиксируем конфигурацию \\(C\\) и рассмотрим special squares: пустую клетку и все клетки того же класса чётности. Для каждой покрытой special square \\(s\\) смотрим на домино, которое её покрывает. Если продолжение этого домино через соседнюю белую клетку попадает в другую special square \\(t\\) внутри доски, проводим дугу \\(s\\to t\\); если продолжение выходит за доску, дуги нет. При сдвиге домино вдоль такой пары special squares меняется только направление соответствующей дуги.\n\nПусть \\(T\\) - слабая компонента этого орграфа, содержащая пустую клетку. Вершина, соответствующая пустой клетке, не имеет исходящей дуги, а каждая другая вершина имеет не более одной исходящей дуги. Поэтому в \\(T\\) не больше \\(|V(T)|-1\\) рёбер. Но \\(T\\) связна, значит рёбер ровно \\(|V(T)|-1\\), и \\(T\\) является деревом. В этом дереве все дуги направлены к пустой клетке: если взять ближайшую к пустой клетке дугу, направленную от неё, то ребро из её хвоста к предыдущей вершине на пути к пустой клетке тоже должно иметь тот же хвост, иначе была бы более близкая дуга, направленная от пустой клетки; это дало бы две исходящие дуги из одной вершины. Следовательно, достижимые конфигурации получаются ровно выбором новой вершины-стока в дереве \\(T\\) и разворотом дуг на пути к старому стоку. Значит \\(k(C)=|V(T)|\\).\n\nНам ещё понадобится стандартная паритетная лемма из решения. Если в графе special squares есть цикл, то, соединяя центры его клеток через центры соответствующих белых клеток, получаем замкнутую ломаную. По формуле Пика, или эквивалентной индукции по клеточной области, число единичных клеток строго внутри неё нечётно. Домино не пересекают эту ломаную, поэтому все внутренние клетки не могут быть покрыты домино попарно; значит внутри такого цикла обязана лежать пустая клетка.\n\nОтсюда сразу \\(k(C)\\le (m+1)^2\\). Более того, если \\(k(C)>m^2\\), то пустая клетка лежит в красном классе. В дереве \\(T\\) тогда есть красная граничная клетка; передвинув пустую клетку в неё внутри того же дерева, считаем пустую клетку граничной. Любая красная клетка вне \\(T\\), следуя по дугам, либо дошла бы до \\(T\\), либо попала бы в цикл. Цикл невозможен, потому что он должен окружать граничную пустую клетку. Значит все красные клетки лежат в \\(T\\), и тогда \\(k(C)=(m+1)^2\\). Поэтому других значений больше \\(m^2\\) нет.\n\nОсталось построить все значения. Нам понадобится простой двойственный факт. Рассмотрим прямоугольную решётку красных клеток: её вершины - \\((m+1)^2\\) красных клеток, а её рёбра - белые клетки между соседними красными клетками. Синие клетки являются внутренними гранями этой решётки. Если в плоском связном графе рёбра, выбранные в двойственном графе, образуют остовное дерево двойственного графа, то невыбранные первичные рёбра образуют остовное дерево первичного графа: иначе первичный цикл или разрез дал бы соответственно двойственный разрез или цикл, несовместимый с деревом; число рёбер также равно \\(|V|-1\\).\n\nСначала построим малые значения \\(1\\le k\\le m^2\\). Обойдём все \\(m^2\\) синих клеток змейкой \\(b_1,b_2,\\ldots,b_{m^2}\\): идём по нижнему синему ряду слева направо, по следующему справа налево, и так далее до верхнего ряда. Пусть \\(e_i\\) - белая клетка между соседними синими клетками \\(b_i,b_{i+1}\\), а \\(e_0\\) - граничная белая клетка, через которую последняя синяя клетка \\(b_{m^2}\\) смотрит наружу. В двойственном графе красной решётки рёбра \\(e_1,\\ldots,e_{m^2-1},e_0\\) образуют путь через все внутренние грани и внешнюю грань, то есть остовное дерево. Поэтому, если удалить из красной решётки все эти рёбра, оставшиеся белые клетки образуют остовное дерево \\(H_0\\) на красных клетках.\n\nДля заданного \\(k<m^2\\) оставим белую клетку \\(e_k\\) свободной для красной части, а для \\(k=m^2\\) оставим свободной \\(e_0\\). Поставим пустую клетку в \\(b_1\\). Для \\(2\\le i\\le k\\) кладём синее домино на \\(b_i\\) и \\(e_{i-1}\\), так что его дуга ведёт в \\(b_{i-1}\\). Для \\(k+1\\le i<m^2\\) кладём синее домино на \\(b_i\\) и \\(e_i\\), так что его дуга ведёт в \\(b_{i+1}\\). Если \\(k<m^2\\), последнюю синюю клетку \\(b_{m^2}\\) покрываем домино с граничной белой клеткой \\(e_0\\), направленным наружу. Синие клетки теперь покрыты все, кроме \\(b_1\\), и в синем орграфе компонента пустой клетки состоит ровно из пути \\(b_k\\to b_{k-1}\\to\\cdots\\to b_1\\); ребро после \\(b_k\\) отсутствует.\n\nПокроем остальные клетки красными домино. После предыдущего абзаца доступные белые клетки красной решётки - это рёбра графа \\(H_0\\) плюс одно добавленное ребро: \\(e_k\\) при \\(k<m^2\\) или \\(e_0\\) при \\(k=m^2\\). Значит они образуют связный граф с ровно одним циклом. Ориентируем этот единственный цикл циклически, а все деревья, прикреплённые к циклу, ориентируем от цикла наружу. Тогда в каждую красную вершину входит ровно одно ребро. Для каждого такого ориентированного ребра кладём красное домино на соответствующую белую клетку и на красную клетку, в которую ребро входит. Так все красные клетки и все оставшиеся белые клетки покрыты ровно по одному разу. Получена максимальная конфигурация, и по уже описанному синему пути для неё \\(k(C)=k\\).\n\nНаконец построим исключительное значение \\((m+1)^2\\). Возьмём в красной решётке любой змеиный гамильтонов путь по всем красным клеткам, оставим первый его конец пустым, а каждую следующую красную клетку покроем домино с белой клеткой предыдущего ребра пути, направив дугу к предыдущей красной клетке. Эти красные дуги дают дерево на всех красных клетках, поэтому красная компонента пустой клетки имеет \\((m+1)^2\\) вершин. Оставшиеся белые клетки являются рёбрами двойственного дерева, соединяющего все синие грани и внешнюю грань. Укореним это двойственное дерево во внешней грани и направим рёбра от неё; для каждой синей клетки берём единственное входящее в неё двойственное ребро и кладём синее домино на эту синюю клетку и соответствующую белую клетку. Так заполняется вся доска, кроме красной пустой клетки, и достигается \\(k(C)=(m+1)^2\\).\n\nИтак, множество возможных значений равно \\(\\{1,2,\\ldots,m^2\\}\\cup\\{(m+1)^2\\}=\\{1,2,\\ldots,((n-1)/2)^2\\}\\cup\\{((n+1)/2)^2\\}\\).",
      "examples": [
