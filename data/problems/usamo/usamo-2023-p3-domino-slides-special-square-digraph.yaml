        "text": "Пусть `n` — нечётное положительное число, а доска `n x n` покрыта домино `1 x 2` и `2 x 1` во всех клетках, кроме одной. Разрешён ход: сдвинуть домино в пустую клетку без поворота. Для фиксированной конфигурации отметим клетки той же чётности координат, что и пустая; для каждой отмеченной клетки, покрытой домино, проведём дугу в отмеченную клетку, лежащую за вторым концом этого домино. Пусть `T` — слабая компонента полученного орграфа, содержащая пустую клетку. Докажите, что число достижимых максимальных конфигураций равно `|V(T)|`, и найдите все возможные значения этого числа при всех начальных конфигурациях.",
