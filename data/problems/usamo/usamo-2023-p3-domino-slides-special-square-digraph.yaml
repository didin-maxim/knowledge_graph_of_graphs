      "id": "idea-special-squares-parity-class",
      "title": "Двигаться может только пустая клетка в фиксированном классе чётности",
      "text": "После каждого сдвига новая пустая клетка находится на расстоянии `2` по строке или столбцу от старой, поэтому её чётности координат не меняются. Значит существенными являются только special squares той же parity class, что и исходная пустая клетка.",
