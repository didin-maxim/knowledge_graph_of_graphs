        "id": "stmt-original",
        "title": "Maximal Grid-Aligned Configuration",
        "text": "Рассмотрим доску `n x n` для нечётного положительного `n`. Максимальной конфигурацией домино назовём набор из `(n^2-1)/2` неперекрывающихся домино `1x2` или `2x1`, покрывающий все клетки, кроме одной. Разрешено сдвинуть домино в пустую клетку, не поворачивая его; после этого снова получается максимальная конфигурация с другой пустой клеткой. Пусть `k(C)` — число различных максимальных конфигураций, которые можно получить из `C` последовательностью таких ходов. Найдите все возможные значения `k(C)` в зависимости от `n`.",
