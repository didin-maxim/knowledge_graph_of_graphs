      "id": "idea-empty-component-is-tree",
      "title": "Компонента пустой клетки ациклична",
      "text": "Если в ориентированном графе special squares возник бы цикл, не отделяющий пустую клетку, то он окружал бы область с нечётным числом клеток, что противоречит паритетному/Pick-type анализу домино внутри цикла. Поэтому компонента пустой клетки не содержит циклов и является деревом.",
