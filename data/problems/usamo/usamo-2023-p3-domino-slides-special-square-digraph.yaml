  "solutions": [
    {
      "id": "sol-special-square-digraph",
      "title": "Частично восстановленное графовое решение",
      "text": "Ответ должен быть таким: `k(C)` может принимать все значения из множества `{1,2,...,((n-1)/2)^2} U {((n+1)/2)^2}`. Зафиксируем конфигурацию `C` и пустую клетку. Назовём special squares клетки той же чётности координат, что и пустая клетка. Каждое домино, лежащее на special square, покрывает ещё одну клетку и тем самым естественно «указывает» на следующую special square; это задаёт ориентированный граф `G(C)` на множестве special squares. В случае odd-odd для всех special squares, кроме пустой, есть ровно одно исходящее ребро. Ключевое утверждение из notes Evan Chen: любая связная компонента `G`, не содержащая пустую клетку внутри цикла, ациклична; для цикла это доказывается анализом области, которую он ограничивает, через паритет и Pick's theorem. Поэтому компонента `T`, содержащая пустую клетку, является деревом. Дальше ход домино просто переворачивает одно ребро вдоль этого дерева, а достижимые конфигурации получаются ровно выбором вершины дерева, которая играет роль sink, то есть пустой клетки. Следовательно, `k(C)=|V(T)|`. Если пустая клетка имеет odd-odd coordinates, то максимум достигается, когда `T` охватывает все special squares, и тогда `k(C)=((n+1)/2)^2`; явная row-snake конструкция такого spanning tree записана в карточке USAJMO 2023 P3. Если `T` не является spanning tree, циклы зажимают её внутрь и получается более сильная оценка `k(C)<=((n-3)/2)^2`. Во втором случае, когда special squares имеют even-even coordinates, аналогичный граф всё ещё даёт дерево `T`, но полная реализация каждого размера `|V(T)|` от `1` до `((n-1)/2)^2` в доступных источниках дана через snake-картинки и локальные модификации без полного текстового алгоритма. Поэтому верхняя оценка и идея классификации восстановлены, но конструктивная часть всех малых значений пока не самодостаточна.",
      "idea_ids": [
