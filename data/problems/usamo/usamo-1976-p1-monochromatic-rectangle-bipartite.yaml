  "solutions": [
    {
      "id": "sol-column-pair-double-counting",
      "title": "Подсчёт по парам столбцов",
      "text": "Для каждой строки посмотрим на пары столбцов, в которых клетки этой строки имеют одинаковый цвет. В строке длины `7` хотя бы 4 клетки одного цвета, поэтому таких пар не меньше `C(4,2)=6`. На четырёх строках получаем не меньше `24` одноцветных пар вида `(строка, пара столбцов, цвет)`. Но самих пар столбцов всего `C(7,2)=21`. Значит найдутся две разные строки и одна и та же пара столбцов, в которых цвет совпадает. Четыре соответствующие клетки образуют искомый прямоугольник. Для части б) дадим явную раскраску `4x6`: занумеруем строки `1,2,3,4`, а шесть столбцов сопоставим парам строк `12,13,14,23,24,34`; в столбце `ij` покрасим клетки строк `i` и `j` в чёрный, а две остальные — в белый. У любых двух столбцов соответствующие пары строк имеют ровно одну общую строку, поэтому в этих двух столбцах есть ровно одна пара чёрных клеток в одной строке и ровно одна пара белых клеток в одной строке. Значит, нельзя выбрать две строки и два столбца, в которых все четыре угловые клетки одного цвета.",
