      "id": "idea-count-same-color-column-pairs",
      "title": "Считать одноцветные пары столбцов по строкам",
      "text": "В каждой строке из 7 клеток хотя бы 4 имеют один цвет, значит в этой строке есть хотя бы `C(4,2)=6` одноцветных пар столбцов. Если суммарно таких пар слишком много, две строки дадут одну и ту же пару столбцов в одном цвете.",
