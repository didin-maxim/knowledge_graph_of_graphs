        "text": "а) Каждая клетка доски `4x7` окрашена в чёрный или белый цвет. Докажите, что найдётся прямоугольник, стороны которого идут по линиям сетки, а четыре угловые клетки имеют один и тот же цвет. б) Постройте раскраску доски `4x6`, для которой такого прямоугольника нет.",
