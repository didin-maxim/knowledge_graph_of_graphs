  "ideas": [
    {
      "id": "idea-three-local-states-at-a-cubic-vertex",
      "title": "У кубической вершины слишком мало локальных состояний",
      "text": "Правило обхода полностью задаётся локальным выбором пары соседних полурёбер в вершине. В вершине степени 3 таких конфигураций только три, поэтому четвёртый вход заставил бы повторить уже встречавшееся локальное состояние.",
      "tags": [
