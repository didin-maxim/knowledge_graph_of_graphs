  "solutions": [
    {
      "id": "sol-local-state-bound-and-prism",
      "title": "Локальная детерминированность и пятиугольная призма",
      "text": "Ответ равен 3. Будем рассматривать не только вершины, а ориентированные повороты \\(a\\to b\\to c\\): посетительница входит в \\(b\\) по ребру \\(ab\\) и выходит по ребру \\(bc\\). В кубической вершине всего шесть таких ориентированных поворотов. Один поворот однозначно восстанавливает весь бесконечно продолженный обход вперёд и назад, потому что известно, каким должен быть следующий поворот налево или направо, и так же однозначно восстанавливается предыдущий поворот. Поэтому в периоде обхода один и тот же ориентированный поворот не встречается дважды. Более того, два противоположных поворота \\(a\\to b\\to c\\) и \\(c\\to b\\to a\\) не могут встретиться в одном и том же обходе. Действительно, если продолжить из них траектории по правилу чередования, получатся два участка одной и той же траектории, идущие вдоль одной локальной полосы в противоположных направлениях; из-за планарности и фиксированного выбора левого/правого поворота эти два участка дальше разделены и не могут снова согласованно встретиться. Значит для каждой из трёх неориентированных пар рёбер, проходящих через данную вершину, обход может использовать не больше одного из двух направлений. Следовательно, в одну вершину можно войти не более трёх раз. Оценка достигается на графе пятиугольной призмы. Пусть внешняя грань имеет вершины \\(u_0,u_1,u_2,u_3,u_4\\), внутренняя грань — \\(v_0,v_1,v_2,v_3,v_4\\), и добавлены рёбра \\(u_iv_i\\) для всех \\(i\\) по модулю 5; циклический порядок рёбер берём от стандартного плоского вложения призмы. Если стартовать в \\(u_0\\) и первым пройти ребро \\(u_0v_0\\), то при последовательных поворотах налево, направо, налево, направо, ... получается замкнутый обход \\(u_0,v_0,v_4,v_3,u_3,u_2,u_1,v_1,v_0,v_4,u_4,u_3,u_2,v_2,v_1,v_0,u_0\\). Вершина \\(v_0\\) встречается как входная три раза, поэтому максимум действительно равен 3.",
