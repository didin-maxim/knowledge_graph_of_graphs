    },
    {
      "id": "idea-pentagonal-prism-construction",
      "title": "Пятиугольная призма достигает оценки",
      "text": "В графе пятиугольной призмы можно выбрать старт и первое ребро так, чтобы alternating-turn walk трижды входил в одну и ту же вершину; это показывает точность верхней оценки.",
