  "solutions": [
    {
      "id": "sol-local-state-bound-and-prism",
      "title": "Локальная детерминированность и пятиугольная призма",
      "text": "Ответ равен 3.\n\nСначала докажем верхнюю оценку. Рассмотрим не только посещённые вершины, а ориентированные повороты \\(a\\to b\\to c\\): посетительница входит в \\(b\\) по ребру \\(ab\\) и выходит по ребру \\(bc\\). В кубической вершине есть ровно шесть таких поворотов, по два для каждой неупорядоченной пары инцидентных рёбер.\n\nОдин ориентированный поворот однозначно задаёт весь бесконечно продолженный обход вперёд и назад. Действительно, по циклическому порядку трёх рёбер вокруг \\(b\\) мы знаем, был ли поворот \\(a\\to b\\to c\\) левым или правым; значит следующий поворот обязан быть противоположного типа, а предыдущий тоже восстанавливается единственным образом. Поэтому в одном периоде обхода один и тот же ориентированный поворот не может встретиться дважды: если бы он повторился, детерминированность заставила бы весь участок между двумя появлениями уже быть полным периодом.\n\nОсталось улучшить грубую оценку 6 до 3. Покажем, что два противоположных поворота \\(a\\to b\\to c\\) и \\(c\\to b\\to a\\) не могут лежать в одном и том же обходе. Если продолжить из них траектории по правилу чередования, то они идут по одной и той же узкой полосе плоского вложения, но в противоположных направлениях: на каждом следующем узле правило ``следующий поворот противоположен предыдущему'' отправляет второй участок вдоль той же локальной стороны, что и первый, только обратно. В плоском графе такие две направленные полосы не могут иметь первого нового общего узла: до этого момента они ограничивали бы две непересекающиеся дуги одной области, а в первом общем узле должны были бы войти в одну и ту же локальную щель с противоположных сторон, что потребовало бы пересечения троп между узлами. Это противоречит планарности. Значит из двух противоположных направлений каждой пары рёбер через фиксированную вершину обход использует не более одного.\n\nЧерез вершину степени 3 проходят ровно три неупорядоченные пары инцидентных рёбер. Каждый вход в эту вершину вместе со следующим выходом выбирает одну из этих трёх пар, и только что доказано, что для каждой пары возможен не более один вход в данном обходе. Следовательно, в одну вершину можно войти не более трёх раз.\n\nОценка достигается на графе пятиугольной призмы. Пусть внешняя грань имеет вершины \\(u_0,u_1,u_2,u_3,u_4\\), внутренняя грань -- \\(v_0,v_1,v_2,v_3,v_4\\), и добавлены рёбра \\(u_iv_i\\) для всех \\(i\\) по модулю 5; циклический порядок рёбер берём от стандартного плоского вложения призмы. Если стартовать в \\(u_0\\) и первым пройти ребро \\(u_0v_0\\), то при последовательных поворотах налево, направо, налево, направо, ... получается замкнутый обход\n\\[\nu_0,v_0,v_4,v_3,u_3,u_2,u_1,v_1,v_0,v_4,u_4,u_3,u_2,v_2,v_1,v_0,u_0.\n\\]\nВершина \\(v_0\\) является входной три раза: при переходах \\(u_0\\to v_0\\), \\(v_1\\to v_0\\) и снова \\(v_1\\to v_0\\) в конце обхода. Поэтому максимум действительно равен 3.",
