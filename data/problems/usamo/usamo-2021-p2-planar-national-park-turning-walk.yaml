        "id": "stmt-original",
        "title": "Оригинальная формулировка",
        "text": "Парк состоит из нескольких троп, пересекающихся только в узлах. Каждая тропа соединяет два разных узла, в каждом узле сходятся ровно три тропы, и кратных троп между двумя узлами нет. Посетительница выбирает стартовый узел и первую тропу, а затем в каждом следующем узле поочерёдно поворачивает налево, направо, налево, направо и так далее, пока не вернётся в стартовый узел. Какое наибольшее число раз она может войти в один и тот же узел?",
        "source_id": "src-usamo-2021-p2-aops-wiki",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": []
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Пусть дан простой связный кубический планарный граф с фиксированным cyclic order рёбер вокруг каждой вершины. Рассматривается замкнутый обход, который после стартового ребра в каждой вершине использует правило чередующихся поворотов left, right, left, .... Требуется найти максимальное число входов в одну вершину.",
