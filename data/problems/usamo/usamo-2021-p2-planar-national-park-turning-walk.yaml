  "solutions": [
    {
      "id": "sol-local-state-bound-and-prism",
      "title": "Локальная детерминированность и пятиугольная призма",
      "text": "Ответ равен 3. Верхняя оценка идёт из локальной структуры кубической вершины. Когда обход входит в вершину, он использует одну из трёх инцидентных троп как входную, а затем по правилу «налево/направо» обязан выйти по одной из двух остальных. Для фиксированного планарного вложения это эквивалентно выбору одного из трёх локальных переходов через вершину; после повторения такого локального состояния дальнейшее движение уже периодически повторяет тот же участок обхода, так что четвёртый существенно новый вход невозможен. Поэтому ни в одну вершину нельзя войти более трёх раз. Точность достигается на пятиугольной призме: Эрик Шен явно указывает, что эта конструкция даёт замкнутый обход с чередованием поворотов, в котором некоторая вершина посещается три раза.",
