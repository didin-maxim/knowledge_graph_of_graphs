  "ideas": [
    {
      "id": "idea-edge-degree-sum",
      "title": "Квадраты степеней считаются по рёбрам",
      "text": "Сумму \\(\\sum d_i^2\\) можно переписать как \\(\\sum_{uv\\in E}(d_u+d_v)\\). В графе без треугольников для каждого ребра \\(uv\\) выполнено \\(d_u+d_v\\le n\\), потому что у смежных вершин нет общего соседа.",
      "tags": [
        "degree_counting",
        "forbidden_triangle"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-max-degree-edge-bound",
      "title": "Окрестность максимальной вершины независима",
      "text": "Если граф треугольников не содержит, то соседи вершины максимальной степени не соединены между собой. Поэтому каждое ребро, кроме рёбер из этой вершины, имеет хотя бы один конец вне её замкнутой окрестности. Внешних вершин \\(n-\\Delta-1\\), степень каждой не больше \\(\\Delta\\), так что таких рёбер не больше \\((n-\\Delta-1)\\Delta\\).",
      "tags": [
        "extremal_graph_theory"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-official-contrapositive",
      "title": "Решение от противного для графа без треугольников",
      "text": "Докажем контрапозицию. Пусть \\(G\\) не содержит треугольников. Обозначим через \\(m\\) число рёбер.\n\nСначала оценим сумму квадратов степеней через рёбра. Каждая вершина \\(i\\) встречается ровно в \\(d_i\\) инцидентных рёбрах, и каждый раз вносит вклад \\(d_i\\). Поэтому\n\\[\n\\sum_{i=1}^n d_i^2=\\sum_{uv\\in E}(d_u+d_v).\n\\]\nЕсли \\(uv\\) — ребро, то в графе без треугольников у \\(u\\) и \\(v\\) нет общего соседа: общий сосед вместе с \\(u\\) и \\(v\\) дал бы треугольник. Значит, множества \\(N(u)\\setminus\\{v\\}\\) и \\(N(v)\\setminus\\{u\\}\\) не пересекаются и лежат среди остальных \\(n-2\\) вершин. Отсюда\n\\[\n(d_u-1)+(d_v-1)\\le n-2,\n\\]\nто есть \\(d_u+d_v\\le n\\). Следовательно,\n\\[\n\\sum_{i=1}^n d_i^2\\le mn.\n\\]\n\nТеперь оценим \\(m\\). Возьмём вершину \\(x\\) степени \\(\\Delta\\). Её \\(\\Delta\\) соседей попарно не смежны: иначе вместе с \\(x\\) они образовали бы треугольник. Значит, кроме \\(\\Delta\\) рёбер, выходящих из \\(x\\), каждое ребро графа имеет хотя бы один конец вне множества \\(\\{x\\}\\cup N(x)\\): рёбер между вершинами из \\(N(x)\\) нет, а других рёбер внутри \\(\\{x\\}\\cup N(x)\\) кроме рёбер из \\(x\\) тоже нет. Внешних вершин ровно \\(n-\\Delta-1\\), и степень каждой из них не превосходит \\(\\Delta\\). Поэтому число рёбер, не инцидентных \\(x\\), не больше суммы степеней внешних вершин, то есть не больше \\((n-\\Delta-1)\\Delta\\). Значит,\n\\[\nm\\le \\Delta+(n-\\Delta-1)\\Delta=\\Delta(n-\\Delta).\n\\]\nСовмещая две оценки, получаем\n\\[\n\\sum_{i=1}^n d_i^2\\le mn\\le n\\Delta(n-\\Delta).\n\\]\nИтак, любой граф без треугольников удовлетворяет противоположному нестрогому неравенству. Следовательно, если \\(\\sum d_i^2>n\\Delta(n-\\Delta)\\), треугольник в \\(G\\) обязательно существует.",
