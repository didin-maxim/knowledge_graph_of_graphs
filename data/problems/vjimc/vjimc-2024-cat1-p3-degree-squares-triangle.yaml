        "text": "Пусть \\(G\\) - простой неориентированный граф на \\(n\\) вершинах. Обозначим через \\(d_i\\) степень его \\(i\\)-й вершины, \\(i=1,\\ldots,n\\), и пусть \\(\\Delta=\\max_i d_i\\). Докажите, что если\n\\[\n\\sum_{i=1}^n d_i^2>n\\Delta(n-\\Delta),\n\\]\nто граф \\(G\\) содержит треугольник.",
