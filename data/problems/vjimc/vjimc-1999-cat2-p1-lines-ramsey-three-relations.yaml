  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Решение через раскраску полного графа",
      "text": "Ответ: \\(k=9\\).\n\nСначала построим пример из восьми прямых. Возьмём куб \\(ABCDA'B'C'D'\\). Пусть \\(K,L,M,N\\) — середины рёбер \\(A'B'\\), \\(B'C'\\), \\(C'D'\\), \\(D'A'\\) соответственно. Рассмотрим восемь прямых \\(AB,BC,CD,DA,KL,LM,MN,NK\\). Первые четыре лежат в нижней грани куба и образуют стороны квадрата; последние четыре лежат в параллельной верхней грани и образуют стороны меньшего квадрата. В каждом из этих двух квадратов есть ровно две пары параллельных сторон, поэтому трёх попарно параллельных прямых нет. Три попарно пересекающиеся прямые тоже невозможны: если все три лежат в одной из двух плоскостей, то среди трёх сторон квадрата найдётся пара противоположных параллельных сторон; если же выбраны прямые из обеих плоскостей, то хотя бы одна пара лежит в разных параллельных плоскостях и не пересекается. Наконец, три попарно скрещивающиеся прямые невозможны, потому что среди трёх выбранных прямых хотя бы две лежат в одной из двух плоскостей, а две прямые в одной плоскости не являются скрещивающимися. Значит, \\(k>8\\).\n\nДокажем вспомогательную лемму. Пусть даны пять попарно непараллельных прямых. Тогда добавление любой шестой прямой даёт либо три попарно пересекающиеся прямые, либо три попарно скрещивающиеся прямые.\n\nЕсли среди пяти прямых уже есть такая тройка, всё доказано. Иначе окрасим ребро между двумя из этих пяти прямых в цвет \\(I\\), если они пересекаются, и в цвет \\(S\\), если они скрещиваются. В двуцветной раскраске \\(K_5\\) без одноцветного треугольника каждая вершина имеет степень ровно \\(2\\) в каждом цвете: степень хотя бы \\(3\\) в одном цвете сразу дала бы одноцветный треугольник либо в этом цвете, либо в другом цвете на трёх соседях. Поэтому рёбра каждого цвета образуют цикл \\(C_5\\). Обозначим прямые так, что пары \\(l_0l_1,l_1l_2,l_2l_3,l_3l_4,l_4l_0\\) пересекаются, а остальные пары среди них скрещиваются.\n\nПусть \\(m\\) — шестая прямая. Если \\(m\\) не параллельна ни одной из пяти прямых, то на шести прямых остаются только цвета \\(I\\) и \\(S\\). Среди пяти рёбер из вершины \\(m\\) хотя бы три имеют один цвет; если между какими-то двумя их концами ребро того же цвета, получаем одноцветный треугольник, а если все три ребра между концами другого цвета, получаем одноцветный треугольник другого цвета. Значит, остаётся случай, когда \\(m\\) параллельна одной из пяти прямых, скажем \\(l_0\\).\n\nЧтобы не было одноцветного треугольника цветов \\(I\\) и \\(S\\), прямая \\(m\\) должна пересекать обе прямые \\(l_1\\) и \\(l_4\\). Действительно, так как \\(l_1\\) и \\(l_4\\) скрещиваются, хотя бы одно из рёбер \\(ml_1,ml_4\\) должно иметь цвет \\(I\\). Если, например, \\(m\\) пересекает \\(l_1\\), то из пересечения \\(l_1\\) с \\(l_2\\) следует, что \\(m\\) скрещивается с \\(l_2\\); из скрещивания \\(l_2\\) с \\(l_4\\) следует, что \\(m\\) пересекает \\(l_4\\). При начале с \\(l_4\\) те же два шага дают пересечение \\(m\\) с \\(l_1\\).\n\nТеперь получаем геометрическое противоречие. Прямые \\(l_0\\) и \\(l_1\\) пересекаются, поэтому задают плоскость \\(\\Pi_1\\); поскольку \\(m\\parallel l_0\\) и \\(m\\) пересекает \\(l_1\\), прямая \\(m\\) лежит в \\(\\Pi_1\\). По той же причине прямые \\(l_0\\) и \\(l_4\\) задают плоскость \\(\\Pi_4\\), содержащую \\(m\\). Если \\(\\Pi_1\\ne\\Pi_4\\), их пересечение равно \\(l_0\\), что невозможно для отличной от \\(l_0\\) прямой \\(m\\), параллельной \\(l_0\\). Значит, \\(\\Pi_1=\\Pi_4\\), но тогда \\(l_1\\) и \\(l_4\\) лежат в одной плоскости и не параллельны, следовательно, пересекаются; это противоречит тому, что они скрещиваются. Лемма доказана.\n\nОсталось применить лемму к девяти прямым. Если среди них есть три попарно параллельные, утверждение уже выполнено. Иначе каждый класс параллельных прямых содержит не более двух прямых, поэтому из девяти прямых можно выбрать по одной прямой из разных классов и получить как минимум пять попарно непараллельных прямых. Так как всего прямых девять, к выбранной пятёрке можно добавить ещё одну из оставшихся прямых. По лемме эти шесть прямых содержат три попарно пересекающиеся или три попарно скрещивающиеся прямые. Следовательно, среди любых девяти прямых обязательно есть одна из требуемых троек. Вместе с примером на восьми прямых это даёт \\(k=9\\).",
