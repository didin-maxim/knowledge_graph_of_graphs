  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Решение через раскраску полного графа",
      "text": "Ответ: \\(k=9\\).\n\nСначала укажем, почему \\(k\\) не может быть меньше. Рассмотрим куб \\(ABCDA'B'C'D'\\). Возьмём четыре прямые, содержащие рёбра \\(AB,BC,CD,DA\\), и ещё четыре прямые через середины рёбер \\(A'B',B'C',C'D',D'A'\\), расположенные как стороны меньшего квадрата в верхней грани. В этой конфигурации можно проверить непосредственно: нет трёх попарно параллельных прямых, нет трёх прямых, проходящих через одну точку, и нет трёх попарно скрещивающихся прямых. Значит, \\(k>8\\).\n\nТеперь докажем, что любые девять прямых уже дают нужную тройку. Построим полный граф на выбранных прямых. Ребро окрашиваем в цвет \\(P\\), если прямые параллельны, в цвет \\(I\\), если они пересекаются, и в цвет \\(S\\), если они скрещиваются. Одноцветный треугольник в этом графе как раз означает одну из трёх требуемых троек прямых.\n\nПусть такого треугольника нет. Тогда, в частности, среди параллельных рёбер нет треугольника: ни одно направление не встречается три раза. Поэтому из девяти прямых можно выбрать не меньше пяти попарно непараллельных прямых. На этих пяти вершинах остаются только два цвета, \\(I\\) и \\(S\\). Если среди них есть одноцветный треугольник, всё доказано. Если нет, то двухцветная раскраска \\(K_5\\) имеет экстремальный вид: рёбра каждого цвета образуют 5-цикл.\n\nДобавим к такой пятёрке ещё одну прямую, не параллельную выбранным представителям, если она есть. Рёбра от неё к пятёрке окрашены только в цвета \\(I\\) и \\(S\\); в экстремальной раскраске \\(K_5\\) любая новая вершина создаёт одноцветный треугольник. Если же шести попарно непараллельных прямых выбрать нельзя, то девять прямых распадаются на пары параллельных направлений и один оставшийся представитель; тот же разбор представителей направлений снова приводит к одноцветному треугольнику либо к трём параллельным прямым. Противоречие. Следовательно, среди любых девяти прямых есть требуемая тройка.",
