  "ideas": [
    {
      "id": "idea-maximal-support-clique",
      "title": "В максимуме положительные вершины попарно смежны",
      "text": "Выбираем максимум суммы по рёбрам, а среди максимумов - конфигурацию с наибольшим числом нулевых весов. Если две положительные несмежные вершины есть, можно перенести вес с меньшей на большую; линейность по этому переносу либо улучшает сумму, либо даёт максимум с ещё одним нулём.",
      "tags": [
