  "solutions": [
    {
      "id": "sol-official-planar-extremal",
      "title": "Решение через планарный скелет и экстремальный выбор",
      "text": "Рассмотрим граф \\(G=(V,E)\\), вершины и рёбра которого - вершины и рёбра многогранника. Этот граф можно нарисовать на сфере, а значит и на плоскости, без пересечения рёбер.\n\nОбозначим веса через \\(a_v\\). Нужно оценить\n\\[\nF(a)=\\sum_{uv\\in E} a_u a_v\n\\]\nпри условиях \\(a_v\\ge 0\\) и \\(\\sum_v a_v=1\\). Множество всех таких наборов весов компактно, а \\(F\\) непрерывна, поэтому максимум достигается. Выберем среди всех максимальных наборов такой, где число нулевых весов максимально.\n\nПокажем, что любые две вершины с положительными весами смежны. Пусть это не так: \\(x\\) и \\(y\\) не соединены ребром, но \\(a_x>0\\), \\(a_y>0\\). Без ограничения общности \\(a_x\\le a_y\\). Перенесём величину \\(t\\) веса из \\(x\\) в \\(y\\): заменим \\(a_x\\) на \\(a_x-t\\), \\(a_y\\) на \\(a_y+t\\), остальные веса не меняем. Так как ребра \\(xy\\) нет, выражение \\(F\\) как функция от \\(t\\) линейно на отрезке \\([0,a_x]\\). При \\(t=0\\) оно имеет максимум относительно малых допустимых изменений, значит эта линейная функция постоянна на всём отрезке. Тогда при \\(t=a_x\\) значение \\(F\\) остаётся максимальным, но вес в вершине \\(x\\) становится нулём. Это противоречит выбору максимума с наибольшим числом нулей. Следовательно, все вершины с положительными весами попарно смежны.\n\nЗначит, положительные вершины индуцируют полный подграф графа \\(G\\). Полный граф \\(K_5\\) непланарен, поэтому в планарном графе не может быть пяти попарно смежных вершин. Следовательно, положительных весов не больше четырёх. Обозначим их \\(a,b,c,d\\), добавив нули, если положительных весов меньше. Тогда сумма по рёбрам не превосходит суммы по всем парам этих четырёх чисел:\n\\[\nF(a)\\le ab+ac+ad+bc+bd+cd.\n\\]\nТак как \\(a+b+c+d=1\\), имеем\n\\[\nab+ac+ad+bc+bd+cd=\\frac{(a+b+c+d)^2-(a^2+b^2+c^2+d^2)}2.\n\\]\nЭта величина максимальна, когда сумма квадратов минимальна. По неравенству Коши\n\\[\na^2+b^2+c^2+d^2\\ge \\frac{(a+b+c+d)^2}{4}=\\frac14.\n\\]\nОтсюда\n\\[\nF(a)\\le \\frac{1-1/4}{2}=\\frac38.\n\\]\nТребуемая оценка доказана.",
