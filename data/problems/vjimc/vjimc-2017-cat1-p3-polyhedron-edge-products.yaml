        "extremal_graph_theory"
      ],
      "status": "needs_human_review"
    },
    {
      "id": "idea-planar-clique-four",
      "title": "Планарность оставляет не более четырёх положительных весов",
      "text": "Положительные вершины образуют полный подграф, а в планарном графе полный подграф имеет не более четырёх вершин. После этого остаётся чистое неравенство для четырёх неотрицательных чисел с суммой 1.",
      "tags": [
        "planar_graphs"
      ],
