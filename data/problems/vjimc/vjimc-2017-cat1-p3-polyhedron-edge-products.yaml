  "solutions": [
    {
      "id": "sol-official-planar-extremal",
      "title": "Решение через планарный скелет и экстремальный выбор",
      "text": "Рассмотрим граф \\(G=(V,E)\\), вершины и рёбра которого - это вершины и рёбра многогранника \\(P\\). Скелет выпуклого многогранника можно нарисовать на сфере без пересечений рёбер, а значит и на плоскости; поэтому \\(G\\) является планарным простым графом.\n\nОбозначим вес вершины \\(v\\) через \\(a_v\\). Нужно доказать, что\n\\[\nF(a)=\\sum_{uv\\in E}a_u a_v\\le \\frac38\n\\]\nпри условиях \\(a_v\\ge 0\\) и \\(\\sum_{v\\in V}a_v=1\\). Множество всех таких наборов весов компактно, а \\(F\\) непрерывна, поэтому максимум достигается. Среди всех максимальных наборов выберем такой, в котором число нулевых весов максимально.\n\nДокажем, что в выбранном наборе любые две вершины с положительными весами смежны. Предположим противное: вершины \\(x\\) и \\(y\\) не соединены ребром, но \\(a_x>0\\) и \\(a_y>0\\). Будем переносить вес между ними, сохраняя сумму весов: для \\(t\\in[-a_y,a_x]\\) заменим\n\\[\na_x\\mapsto a_x-t,\\qquad a_y\\mapsto a_y+t,\n\\]\nа все остальные веса оставим прежними. Так как ребра \\(xy\\) нет, вклад рёбер, инцидентных \\(x\\) или \\(y\\), зависит от \\(t\\) линейно; значит и всё значение \\(F\\) является линейной функцией от \\(t\\) на отрезке \\([-a_y,a_x]\\).\n\nПри \\(t=0\\) эта линейная функция имеет максимум на всём допустимом отрезке, потому что исходный набор был глобально максимальным. Линейная функция, имеющая максимум во внутренней точке отрезка, постоянна. Поэтому при \\(t=a_x\\) значение \\(F\\) остаётся тем же максимальным, но вес вершины \\(x\\) становится нулём. Мы получили максимальный набор с большим числом нулевых весов, что противоречит выбору набора. Следовательно, все вершины положительного веса попарно смежны.\n\nИтак, положительный носитель весов образует клику в планарном графе \\(G\\). В планарном графе нет клики из пяти вершин, поскольку \\(K_5\\) непланарен. Значит, положительных весов не больше четырёх. Обозначим эти веса через \\(a,b,c,d\\), добавив нули, если положительных весов меньше четырёх. Тогда \\(a+b+c+d=1\\), а сумма по рёбрам не превосходит суммы по всем парам этих четырёх чисел:\n\\[\nF(a)\n\\le ab+ac+ad+bc+bd+cd.\n\\]\nОстаётся оценить правую часть. Имеем\n\\[\nab+ac+ad+bc+bd+cd\n=\\frac{(a+b+c+d)^2-(a^2+b^2+c^2+d^2)}2.\n\\]\nПо неравенству Коши\n\\[\na^2+b^2+c^2+d^2\\ge \\frac{(a+b+c+d)^2}{4}=\\frac14.\n\\]\nСледовательно,\n\\[\nF(a)\\le \\frac{1-1/4}{2}=\\frac38.\n\\]\nТребуемая оценка доказана.",
