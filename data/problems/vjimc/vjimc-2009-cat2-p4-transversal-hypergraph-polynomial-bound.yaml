      "title": "Каждому ребру сопоставляется квадратсвободный многочлен",
      "text": "Переименуем части каждого разбиения так, чтобы вершина \\(1\\) лежала в первой части. Для ребра \\(A_i\\) берём произведение сумм переменных по остальным частям. Получаются однородные квадратсвободные многочлены степени \\(m-1\\) от \\(n-1\\) переменных.",
