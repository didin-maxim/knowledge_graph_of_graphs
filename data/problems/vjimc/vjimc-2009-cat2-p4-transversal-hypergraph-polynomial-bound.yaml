        "title": "Условие",
        "text": "Пусть \\(k,m,n\\) - положительные целые числа, \\(1\\le m\\le n\\), и \\(S=\\{1,2,\\ldots,n\\}\\). Пусть \\(A_1,A_2,…,A_k\\) - \\(m\\)-элементные подмножества \\(S\\) со следующим свойством: для каждого \\(i=1,…,k\\) существует разбиение \\(S=S_{1,i}\\cup S_{2,i}\\cup\\cdots\\cup S_{m,i}\\) на попарно непересекающиеся части такое, что \\(A_i\\) имеет ровно один общий элемент с каждой частью этого разбиения, а каждое \\(A_j\\), \\(j\\ne i\\), не пересекается хотя бы с одной частью этого разбиения. Докажите, что \\(k\\le \\binom{n-1}{m-1}\\).",
