  "ideas": [
    {
      "id": "idea-polynomial-for-each-edge",
      "title": "Каждому ребру сопоставляется квадратсвободный многочлен",
      "text": "Переименуем части каждого разбиения так, чтобы вершина \\(1\\) лежала в первой части. Для ребра \\(A_i\\) берём произведение сумм переменных по остальным частям. Получаются однородные квадратсвободные многочлены степени \\(m-1\\) от \\(n-1\\) переменных.",
      "tags": [
        "graph_model"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-odd-even-evaluation-matrix",
      "title": "Матрица значений имеет нечётную диагональ и чётные внедиагональные элементы",
      "text": "На характеристическом векторе собственного ребра многочлен равен \\(1\\). На характеристическом векторе чужого ребра произведение либо равно нулю, либо содержит чётный множитель; значит, по модулю 2 матрица значений является единичной.",
      "tags": [
        "extremal_graph_theory"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Полиномиальный метод и линейная независимость",
      "text": "Для каждого \\(i\\) переименуем части разбиения так, чтобы \\(1\\in S_{1,i}\\). Рассмотрим переменные \\(x_2,…,x_n\\) и сопоставим ребру \\(A_i\\) многочлен\n\\[\nP_i(x_2,…,x_n)=\\prod_{\\ell=2}^{m}\\left(\\sum_{s\\in S_{\\ell,i}}x_s\\right),\n\\]\nгде переменной \\(x_1\\) нет. Так как части разбиения попарно не пересекаются, при раскрытии скобок в \\(P_i\\) возникают только квадратсвободные мономы степени \\(m-1\\). Пространство таких многочленов от переменных \\(x_2,…,x_n\\) имеет размерность \\(\\binom{n-1}{m-1}\\). Поэтому достаточно доказать, что многочлены \\(P_1,…,P_k\\) линейно независимы.\n\nДля каждого ребра \\(A_j\\) возьмём его характеристический вектор \\(\\chi_j\\) на координатах \\(2,…,n\\). Посмотрим на матрицу \\(M=(P_i(\\chi_j))_{i,j=1}^k\\). Если \\(j=i\\), то ребро \\(A_i\\) имеет ровно один элемент в каждой части разбиения; кроме первой части, этот элемент не равен \\(1\\), поэтому\n\\[\nP_i(\\chi_i)=\\prod_{\\ell=2}^{m}|A_i\\cap S_{\\ell,i}|=1.\n\\]\n\nПусть теперь \\(j\\ne i\\). По условию ребро \\(A_j\\) не пересекает хотя бы одну часть разбиения, соответствующего \\(i\\). Если это одна из частей \\(S_{\\ell,i}\\) при \\(\\ell\\ge2\\), то один множитель в \\(P_i(\\chi_j)\\) равен нулю. Если же \\(A_j\\) пропускает только первую часть, то все его \\(m\\) элементов лежат в остальных \\(m-1\\) частях; следовательно, хотя бы в одной из этих частей лежат два элемента \\(A_j\\), и соответствующий множитель чётен. В обоих случаях \\(P_i(\\chi_j)\\) чётно.\n\nИтак, матрица \\(M\\) по модулю \\(2\\) совпадает с единичной матрицей: диагональные элементы нечётны, внедиагональные чётны. Поэтому её определитель нечётен, в частности не равен нулю. Если бы многочлены \\(P_i\\) были линейно зависимы, то строки матрицы их значений в точках \\(\\chi_j\\) тоже были бы линейно зависимы, что невозможно. Значит, многочлены независимы, и их число не превосходит размерности пространства:\n\\[\nk\\le \\binom{n-1}{m-1}.\n\\]",
      "idea_ids": [
        "idea-polynomial-for-each-edge",
        "idea-odd-even-evaluation-matrix"
      ],
