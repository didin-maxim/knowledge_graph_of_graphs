  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Полиномиальный метод и линейная независимость",
      "text": "Сначала разберём крайний случай \\(m=1\\). Тогда единственное возможное разбиение состоит из одной части \\(S\\). Если бы при фиксированном \\(i\\) существовало другое множество \\(A_j\\), то по условию оно должно было бы не пересекаться с этой единственной частью, то есть с самим \\(S\\), что невозможно, так как \\(A_j\\) непусто. Значит, \\(k=1=\\binom{n-1}{0}\\), и требуемая оценка верна.\n\nДалее считаем, что \\(m\\ge2\\). Для каждого \\(i\\) переименуем части соответствующего разбиения так, чтобы \\(1\\in S_{1,i}\\). Рассмотрим переменные \\(x_2,…,x_n\\) и сопоставим ребру \\(A_i\\) многочлен\n\\[\nP_i(x_2,…,x_n)=\\prod_{\\ell=2}^{m}\\left(\\sum_{s\\in S_{\\ell,i}}x_s\\right),\n\\]\nгде переменной \\(x_1\\) нет. Так как части разбиения попарно не пересекаются, при раскрытии скобок в \\(P_i\\) возникают только квадратсвободные мономы степени \\(m-1\\): из разных множителей нельзя выбрать одну и ту же переменную. Такие мономы взаимно однозначно соответствуют \\((m-1)\\)-элементным подмножествам множества \\(\\{2,\\ldots,n\\}\\), поэтому пространство всех однородных квадратсвободных многочленов степени \\(m-1\\) от переменных \\(x_2,…,x_n\\) имеет размерность \\(\\binom{n-1}{m-1}\\). Достаточно доказать, что многочлены \\(P_1,…,P_k\\) линейно независимы.\n\nДля каждого ребра \\(A_j\\) возьмём его характеристический вектор \\(\\chi_j\\) на координатах \\(2,…,n\\): координата \\(s\\) равна \\(1\\), если \\(s\\in A_j\\), и равна \\(0\\) иначе. Посмотрим на матрицу значений \\(M=(P_i(\\chi_j))_{i,j=1}^k\\). Если \\(j=i\\), то ребро \\(A_i\\) имеет ровно один элемент в каждой части своего разбиения. В каждой части \\(S_{\\ell,i}\\) при \\(\\ell\\ge2\\) этот единственный элемент не равен \\(1\\), потому что \\(1\\in S_{1,i}\\), поэтому\n\\[\nP_i(\\chi_i)=\\prod_{\\ell=2}^{m}|A_i\\cap S_{\\ell,i}|=1.\n\\]\n\nПусть теперь \\(j\\ne i\\). По условию ребро \\(A_j\\) не пересекает хотя бы одну часть разбиения, соответствующего \\(i\\). Если это одна из частей \\(S_{\\ell,i}\\) при \\(\\ell\\ge2\\), то соответствующий множитель в \\(P_i(\\chi_j)\\) равен нулю. Остаётся случай, когда \\(A_j\\) пересекает каждую из частей \\(S_{2,i},\\ldots,S_{m,i}\\), но не пересекает \\(S_{1,i}\\). Тогда все \\(m\\) элементов множества \\(A_j\\) лежат в \\(m-1\\) непустых пересечениях \\(A_j\\cap S_{\\ell,i}\\), \\(\\ell=2,\\ldots,m\\). По принципу Дирихле одно из этих пересечений содержит хотя бы два элемента; так как всего элементов ровно \\(m\\), это пересечение содержит ровно два элемента, а остальные содержат по одному. Значит, в произведении \\(P_i(\\chi_j)=\\prod_{\\ell=2}^{m}|A_j\\cap S_{\\ell,i}|\\) есть чётный множитель. В обоих случаях \\(P_i(\\chi_j)\\) чётно.\n\nИтак, матрица \\(M\\) по модулю \\(2\\) совпадает с единичной матрицей: диагональные элементы нечётны, внедиагональные чётны. Поэтому \\(\\det M\\equiv1\\pmod 2\\), в частности \\(\\det M\\ne0\\), и матрица \\(M\\) невырождена над \\(\\mathbb R\\). Если бы многочлены \\(P_i\\) были линейно зависимы над \\(\\mathbb R\\), то после подстановки точек \\(\\chi_1,\\ldots,\\chi_k\\) строки матрицы их значений тоже были бы линейно зависимы. Это противоречит невырожденности \\(M\\). Следовательно, \\(P_1,\\ldots,P_k\\) линейно независимы, а их число не превосходит размерности пространства, в котором они лежат:\n\\[\nk\\le \\binom{n-1}{m-1}.\n\\]",
