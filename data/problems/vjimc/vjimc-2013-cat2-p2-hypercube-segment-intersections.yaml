  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Координатный подсчёт центров граней",
      "text": "Ответ:\n\\[\n3^n-2^n-n2^{n-1}.\n\\]\nЗададим вершины куба двоичными векторами \\((\\varepsilon_1,…,\\varepsilon_n)\\), где \\(\\varepsilon_i\\in\\{0,1\\}\\). Середина любого отрезка между двумя вершинами имеет координаты из множества \\(\\{0,1/2,1\\}\\): координата равна \\(0\\) или \\(1\\), если у концов отрезка она совпадает, и равна \\(1/2\\), если концы в этой координате различаются.\n\nЕсли два разных отрезка между вершинами имеют общую внутреннюю точку, то эта точка является центром некоторой грани куба: в фиксированных координатах она имеет значения \\(0\\) или \\(1\\), а в координатах, где меняются концы соответствующей диагонали грани, имеет значение \\(1/2\\). Поэтому всякая такая точка задаётся вектором из \\(\\{0,1/2,1\\}^n\\).\n\nТочек с нулём половинных координат считать нельзя: это ровно \\(2^n\\) вершин куба. Точка с ровно одной координатой \\(1/2\\) является серединой ребра одномерной грани; через неё проходит только один отрезок между вершинами этой грани, поэтому она не является точкой пересечения двух различных отрезков. Таких точек \\(n2^{n-1}\\): выбираем половинную координату и значения остальных координат.\n\nОсталось проверить, что каждая точка с хотя бы двумя половинными координатами действительно получается как пересечение. Пусть множество половинных координат равно \\(H\\), \\(|H|\\ge2\\), а остальные координаты фиксированы как \\(0\\) или \\(1\\). Это центр \\(|H|\\)-мерной грани куба. В такой грани есть как минимум две разные диагонали, соединяющие противоположные вершины, и все они проходят через центр грани. Следовательно, центр является общей внутренней точкой двух отрезков между вершинами куба.\n\nЗначит, нужно посчитать все тернарные векторы с не менее чем двумя координатами \\(1/2\\). Их число равно\n\\[\n3^n-2^n-n2^{n-1},\n\\]\nчто и требовалось.",
