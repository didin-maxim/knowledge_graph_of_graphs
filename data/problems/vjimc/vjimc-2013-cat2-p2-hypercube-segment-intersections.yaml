      "id": "idea-intersections-are-face-centers",
      "title": "Пересечения являются центрами граней размерности не меньше двух",
      "text": "Если два разных отрезка между вершинами гиперкуба имеют общую внутреннюю точку, то их множества меняющихся координат совпадают. Если параметры точки на двух отрезках не равны \\(1/2\\), совпадение координат заставляет эти отрезки быть одним и тем же; значит настоящее пересечение двух разных отрезков происходит в их общей середине, то есть в центре грани размерности не меньше двух.",
