      "id": "idea-intersections-are-face-centers",
      "title": "Пересечения являются центрами граней размерности не меньше двух",
      "text": "Координаты вершины гиперкуба равны \\(0\\) или \\(1\\). Если точка лежит внутри отрезка между двумя вершинами и одновременно является пересечением двух таких отрезков, то каждая её координата равна \\(0\\), \\(1\\) или \\(1/2\\); причём координат \\(1/2\\) должно быть не меньше двух.",
      "tags": [
