  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Координатный подсчёт центров граней",
      "text": "Ответ:\n\\[\n3^n-2^n-n2^{n-1}.\n\\]\nЗададим вершины куба двоичными векторами \\((\\varepsilon_1,\\ldots,\\varepsilon_n)\\), где \\(\\varepsilon_i\\in\\{0,1\\}\\). Докажем сначала, какие точки вообще могут быть пересечениями двух разных отрезков между вершинами.\n\nПусть отрезки \\(AB\\) и \\(CD\\) имеют общую внутреннюю точку \\(P\\). Запишем\n\\[\nP=(1-s)A+sB=(1-t)C+tD,\n\\]\nгде \\(0<s,t<1\\). Рассмотрим одну координату. Если в этой координате концы \\(A\\) и \\(B\\) совпадают, то соответствующая координата \\(P\\) равна \\(0\\) или \\(1\\); значит, и концы \\(C,D\\) в этой координате тоже должны совпадать с тем же значением. Если же концы \\(A,B\\) различаются, то координата \\(P\\) строго между \\(0\\) и \\(1\\), поэтому концы \\(C,D\\) в этой координате тоже различаются. Итак, два отрезка меняют ровно один и тот же набор координат \\(H\\).\n\nВ координатах из \\(H\\) значение координаты \\(P\\) равно либо \\(s\\), либо \\(1-s\\) при движении по \\(AB\\), и либо \\(t\\), либо \\(1-t\\) при движении по \\(CD\\). Если тип сравнения один и тот же во всех меняющихся координатах, то есть \\(CD\\) везде идёт как \\(AB\\) или везде в обратном направлении, то пара концов \\(C,D\\) совпадает с парой \\(A,B\\), а значит это тот же отрезок. Поскольку отрезки разные, остаётся случай, когда есть координаты двух типов; тогда одновременно получается \\(t=s\\) и \\(t=1-s\\). Следовательно, \\(s=t=1/2\\). Значит, любая общая внутренняя точка двух разных отрезков является общей серединой этих отрезков.\n\nОтсюда координаты всякой такой точки принадлежат множеству \\(\\{0,1/2,1\\}\\): в координатах вне \\(H\\) стоят фиксированные \\(0\\) или \\(1\\), а в координатах из \\(H\\) стоит \\(1/2\\). Более того, \\(|H|\\ge2\\), потому что при \\(|H|=1\\) есть только один отрезок между двумя вершинами соответствующего ребра куба.\n\nОсталось проверить обратное. Пусть дана точка из \\(\\{0,1/2,1\\}^n\\) с множеством половинных координат \\(H\\), где \\(|H|\\ge2\\), а остальные координаты фиксированы как \\(0\\) или \\(1\\). Это центр \\(|H|\\)-мерной грани гиперкуба. В такой грани есть как минимум две разные диагонали, соединяющие противоположные вершины, и все они проходят через центр грани. Поэтому эта точка действительно является общей внутренней точкой двух отрезков между вершинами куба.\n\nЗначит, надо посчитать все тернарные векторы с не менее чем двумя координатами \\(1/2\\). Всего векторов из \\(\\{0,1/2,1\\}^n\\) равно \\(3^n\\). Исключаем \\(2^n\\) векторов без половинных координат, то есть сами вершины куба, и \\(n2^{n-1}\\) векторов с ровно одной половинной координатой: выбираем эту координату и значения остальных \\(n-1\\) координат. Получаем\n\\[\n3^n-2^n-n2^{n-1},\n\\]\nчто и требовалось.",
      "idea_ids": [
        "idea-intersections-are-face-centers",
        "idea-count-ternary-vectors"
      ],
