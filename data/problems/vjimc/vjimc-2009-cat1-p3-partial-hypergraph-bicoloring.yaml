  "ideas": [
    {
      "id": "idea-nullspace-vector",
      "title": "Ненулевое решение системы инцидентности",
      "text": "Запишем по одному уравнению \\(\\sum_{j\\in A_i}x_j=0\\) для каждого гиперребра. Уравнений меньше, чем переменных, поэтому существует ненулевой вещественный вектор, зануляющий сумму на каждом ребре.",
      "tags": [
        "graph_model"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-signs-give-bicoloring",
      "title": "Знаки координат дают нужную частичную раскраску",
      "text": "Положительные координаты красим в красный цвет, отрицательные - в синий, нулевые оставляем нераскрашенными. Нулевая сумма на ребре не позволяет ему содержать только один знак.",
      "tags": [
        "coloring"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Решение через ядро матрицы инцидентности",
      "text": "Рассмотрим вещественные переменные \\(x_1,\\ldots,x_n\\), соответствующие элементам множества \\(S\\), и систему из \\(k\\) линейных уравнений\n\\[\n\\sum_{j\\in A_i}x_j=0,\\qquad i=1,\\ldots,k.\n\\]\nТак как \\(k<n\\), эта однородная система имеет ненулевое решение \\((x_1,\\ldots,x_n)\\). Значит, хотя бы одна координата отлична от нуля.\n\nТеперь строим раскраску по знакам: если \\(x_j>0\\), красим \\(j\\) в красный цвет; если \\(x_j<0\\), красим \\(j\\) в синий; если \\(x_j=0\\), оставляем \\(j\\) нераскрашенным. Раскраска нетривиальна, потому что решение ненулевое.\n\nПроверим условие для произвольного \\(A_i\\). Если все координаты \\(x_j\\) при \\(j\\in A_i\\) равны нулю, то множество \\(A_i\\) полностью не раскрашено. Иначе среди них есть ненулевая координата. Если, например, есть положительная координата и нет отрицательных, то сумма \\(\\sum_{j\\in A_i}x_j\\) была бы положительной, так как остальные слагаемые неотрицательны. Это противоречит уравнению для \\(A_i\\). Поэтому вместе с положительной координатой должна быть отрицательная. Точно так же наличие отрицательной координаты влечёт наличие положительной. Следовательно, всякое непусто раскрашенное \\(A_i\\) содержит оба цвета. Это и требовалось доказать.",
      "idea_ids": [
        "idea-nullspace-vector",
        "idea-signs-give-bicoloring"
      ],
      "standard_idea_ids": [],
