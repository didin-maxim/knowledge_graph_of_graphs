        "id": "stmt-original",
        "title": "Условие",
        "text": "Пусть \\(k\\) и \\(n\\) - положительные целые числа, причём \\(k\\le n-1\\). Пусть \\(S=\\{1,2,\\ldots,n\\}\\), а \\(A_1,A_2,\\ldots,A_k\\) - непустые подмножества \\(S\\). Докажите, что можно раскрасить некоторые элементы \\(S\\) в два цвета, красный и синий, так, чтобы выполнялись условия: каждый элемент либо не раскрашен, либо раскрашен в красный или синий цвет; хотя бы один элемент раскрашен; каждое множество \\(A_i\\) либо полностью не раскрашено, либо содержит хотя бы один красный и хотя бы один синий элемент.",
