  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Решение через ядро матрицы инцидентности",
      "text": "Занумеруем элементы \\(S\\) числами \\(1,2,\\ldots,n\\) и рассмотрим вещественные неизвестные \\(x_1,\\ldots,x_n\\). Для каждого множества \\(A_i\\) запишем одно линейное уравнение\n\\[\n\\sum_{j\\in A_i} x_j=0,\\qquad i=1,2,\\ldots,k.\n\\]\nИначе говоря, берётся матрица инцидентности этого семейства множеств: в \\(i\\)-й строке стоят единицы на позициях \\(j\\in A_i\\) и нули на остальных позициях. Нам нужен ненулевой вектор \\(x\\), лежащий в ядре этой матрицы.\n\nДокажем, что такой вектор существует. Ранг матрицы не превосходит числа её строк, то есть не больше \\(k\\). По условию \\(k\\le n-1\\), значит \\(k<n\\), и размерность ядра равна \\(n-\\operatorname{rank} M\\ge n-k>0\\). Следовательно, существует решение \\((x_1,\\ldots,x_n)\\), не равное нулевому вектору. В частности, хотя бы одна координата этого решения отлична от нуля.\n\nТеперь построим частичную раскраску по знакам координат. Если \\(x_j>0\\), красим элемент \\(j\\) в красный цвет; если \\(x_j<0\\), красим его в синий цвет; если \\(x_j=0\\), оставляем элемент \\(j\\) нераскрашенным. Так как выбранный вектор ненулевой, по крайней мере один элемент получает цвет, то есть раскраска нетривиальна.\n\nОсталось проверить условие для произвольного \\(A_i\\). Если для всех \\(j\\in A_i\\) выполнено \\(x_j=0\\), то ни один элемент \\(A_i\\) не раскрашен, и это один из разрешённых случаев. Пусть теперь среди элементов \\(A_i\\) есть раскрашенный элемент. Если в \\(A_i\\) есть красный элемент, то в сумме \\(\\sum_{j\\in A_i}x_j\\) есть положительное слагаемое. Если при этом синих элементов в \\(A_i\\) нет, то все остальные слагаемые неотрицательны, а хотя бы одно положительно, поэтому вся сумма была бы положительной. Это противоречит уравнению \\(\\sum_{j\\in A_i}x_j=0\\). Значит, вместе с красным элементом в \\(A_i\\) обязательно есть и синий.\n\nТочно так же, если в \\(A_i\\) есть синий элемент и нет красных, то все слагаемые в сумме были бы неположительными, причём хотя бы одно отрицательным, поэтому сумма была бы отрицательной, что снова невозможно. Следовательно, каждое множество \\(A_i\\), которое содержит хотя бы один раскрашенный элемент, содержит элементы обоих цветов. Это ровно требуемая раскраска.",
