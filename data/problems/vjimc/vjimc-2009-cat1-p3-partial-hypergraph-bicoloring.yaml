    },
    {
      "id": "idea-signs-give-bicoloring",
      "title": "Знаки координат дают нужную частичную раскраску",
      "text": "Положительные координаты красим в красный цвет, отрицательные - в синий, нулевые оставляем нераскрашенными. Нулевая сумма на каждом гиперребре запрещает ситуацию, когда среди его раскрашенных вершин есть только один цвет.",
