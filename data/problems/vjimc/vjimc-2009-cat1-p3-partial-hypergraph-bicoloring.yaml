      "id": "idea-nullspace-vector",
      "title": "Ненулевой вектор в ядре матрицы инцидентности",
      "text": "Запишем для каждого множества \\(A_i\\) уравнение \\(\\sum_{j\\in A_i}x_j=0\\). Это однородная система из \\(k<n\\) линейных уравнений с \\(n\\) неизвестными, поэтому по теореме о ранге и размерности ядра у неё есть ненулевое вещественное решение.",
