        "id": "stmt-graph",
        "title": "Графовая формулировка",
        "text": "В полном ориентированном взвешенном графе без петель вес дуги \\(i\\to j\\) равен \\(a_{i,j}\\). Докажите, что вершины можно разбить на две части так, чтобы суммарный вес дуг, идущих между частями в обе стороны, был не меньше половины суммарного веса всех дуг.",
