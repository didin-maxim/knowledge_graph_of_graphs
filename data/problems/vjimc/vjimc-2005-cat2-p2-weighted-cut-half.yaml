        "id": "stmt-original",
        "title": "Условие",
        "text": "Пусть \\((a_{i,j})_{i,j=1}^n\\) - вещественная матрица, причём \\(a_{i,i}=0\\) для всех \\(i\\). Докажите, что существует множество индексов \\(J\\subset\\{1,2,\\ldots,n\\}\\), для которого\n\\[\n\\sum_{i\\in J,\\ j\\notin J}a_{i,j}+\\sum_{i\\notin J,\\ j\\in J}a_{i,j}\\ge \\frac12\\sum_{i,j=1}^n a_{i,j}.\n\\]",
        "source_id": "src-vjimc-2005-cat2-p2-official",
