  "solutions": [
    {
      "id": "sol-maximal-cut",
      "title": "Максимальный разрез и перенос одной вершины",
      "text": "Для \\(I\\subset\\{1,\\ldots,n\\}\\) обозначим через \\(F(I)\\) сумму всех элементов матрицы, стоящих по разные стороны разреза:\n\\[\nF(I)=\\sum_{i\\in I,j\\notin I}a_{i,j}+\\sum_{i\\notin I,j\\in I}a_{i,j}.\n\\]\nТаких множеств \\(I\\) конечное число, поэтому можно выбрать множество \\(J\\), на котором \\(F\\) максимально.\n\nПусть \\(k\\in J\\). Если удалить \\(k\\) из \\(J\\), значение \\(F\\) не возрастёт. Поэтому\n\\[\n0\\le F(J)-F(J\\setminus\\{k\\})=\\sum_{j\\notin J}a_{k,j}+\\sum_{i\\notin J}a_{i,k}-\\sum_{j\\in J}a_{k,j}-\\sum_{i\\in J}a_{i,k}.\n\\]\nПросуммируем эти неравенства по всем \\(k\\in J\\). Слагаемые, отвечающие парам по разные стороны разреза, вместе дают ровно \\(F(J)\\). Каждое слагаемое \\(a_{i,j}\\) с \\(i,j\\in J\\) появляется дважды: один раз при \\(k=i\\) и один раз при \\(k=j\\). Так как \\(a_{i,i}=0\\), диагональ ничего не добавляет. Значит,\n\\[\n0\\le F(J)-2\\sum_{i\\in J,j\\in J}a_{i,j},\n\\]\nто есть\n\\[\n\\sum_{i\\in J,j\\in J}a_{i,j}\\le \\frac12F(J).\n\\]\nТеперь рассмотрим вершину \\(k\\notin J\\). Добавление \\(k\\) к \\(J\\) не увеличивает \\(F\\), и\n\\[\n0\\le F(J)-F(J\\cup\\{k\\})=\\sum_{j\\in J}a_{k,j}+\\sum_{i\\in J}a_{i,k}-\\sum_{j\\notin J}a_{k,j}-\\sum_{i\\notin J}a_{i,k}.\n\\]\nСуммируя это по всем \\(k\\notin J\\), получаем: слагаемые между частями снова дают \\(F(J)\\), а каждое слагаемое внутри дополнения к \\(J\\) считается дважды. Поэтому\n\\[\n\\sum_{i\\notin J,j\\notin J}a_{i,j}\\le \\frac12F(J).\n\\]\nТеперь полная сумма всех элементов матрицы равна сумме трёх частей: внутри \\(J\\), внутри дополнения и между частями. Поэтому\n\\[\n\\sum_{i,j}a_{i,j}\\le \\frac12F(J)+\\frac12F(J)+F(J)=2F(J).\n\\]\nСледовательно, \\(F(J)\\ge\\frac12\\sum_{i,j}a_{i,j}\\), что и требовалось доказать. Заметим, что в рассуждении не используется неотрицательность весов: нужна только конечность семейства подмножеств и условие \\(a_{i,i}=0\\).",
