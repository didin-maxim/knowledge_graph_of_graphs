  "solutions": [
    {
      "id": "sol-maximal-cut",
      "title": "Максимальный разрез и перенос одной вершины",
      "text": "Для \\(I\\subset\\{1,\\ldots,n\\}\\) обозначим через \\(F(I)\\) сумму всех элементов матрицы, стоящих по разные стороны разреза:\n\\[\nF(I)=\\sum_{i\\in I,j\\notin I}a_{i,j}+\\sum_{i\\notin I,j\\in I}a_{i,j}.\n\\]\nВыберем множество \\(J\\), на котором \\(F\\) максимально.\n\nПусть \\(k\\in J\\). Если удалить \\(k\\) из \\(J\\), значение \\(F\\) не возрастёт. Поэтому\n\\[\n0\\le F(J)-F(J\\setminus\\{k\\})=\\sum_{j\\notin J}a_{k,j}+\\sum_{i\\notin J}a_{i,k}-\\sum_{j\\in J}a_{k,j}-\\sum_{i\\in J}a_{i,k}.\n\\]\nСуммируя по всем \\(k\\in J\\), получаем\n\\[\n\\sum_{i\\in J,j\\in J}a_{i,j}\\le \\frac12F(J).\n\\]\nАналогично, если \\(k\\notin J\\), то добавление \\(k\\) к \\(J\\) не увеличивает \\(F\\), и после суммирования по всем таким \\(k\\) выходит\n\\[\n\\sum_{i\\notin J,j\\notin J}a_{i,j}\\le \\frac12F(J).\n\\]\nТеперь полная сумма всех элементов матрицы равна сумме трёх частей: внутри \\(J\\), внутри дополнения и между частями. Поэтому\n\\[\n\\sum_{i,j}a_{i,j}\\le \\frac12F(J)+\\frac12F(J)+F(J)=2F(J).\n\\]\nСледовательно, \\(F(J)\\ge\\frac12\\sum_{i,j}a_{i,j}\\), что и требовалось доказать.",
      "idea_ids": [
        "idea-maximal-cut-local-optimum"
      ],
      "standard_idea_ids": [
        "extremal_choice"
      ],
      "status": "needs_human_review"
    }
  ],
