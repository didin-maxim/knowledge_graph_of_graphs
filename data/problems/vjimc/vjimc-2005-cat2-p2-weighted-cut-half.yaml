  "ideas": [
    {
      "id": "idea-maximal-cut-local-optimum",
      "title": "Берём разрез максимального веса",
      "text": "Если перенести одну вершину через максимальный разрез, вес не может увеличиться. Эти локальные неравенства для всех вершин дают оценки на веса внутри обеих частей.",
