  "solutions": [
    {
      "id": "sol-official-state-graph",
      "title": "Решение через инварианты и граф малых состояний",
      "text": "Пусть после некоторого хода в коробке лежат \\(r\\), \\(g\\), \\(b\\) красных, зелёных и синих камней. Рассмотрим две величины по модулю 3:\n\\[\nN=r+g+b,\\qquad D=r+2g.\n\\]\nУдаление трёх камней одного цвета не меняет ни \\(N\\), ни \\(D\\) по модулю 3. При замене двух разных цветов двумя камнями третьего цвета изменения \\(D\\) равны соответственно \\(-3\\), \\(3\\) или \\(0\\), а \\(N\\) вообще не меняется. Значит, оба остатка инвариантны.\n\nВ начале \\(N=31+41+59=131\\equiv 2\\pmod 3\\) и \\(D=31+2\\cdot 41=113\\equiv 2\\pmod 3\\). Если игра закончилась, то два из чисел \\(r,g,b\\) равны нулю. Синий финал дал бы \\(D\\equiv 0\\), зелёный финал дал бы \\(D\\equiv 2N\\equiv 1\\), и оба варианта невозможны. Красный финал возможен по остаткам: тогда \\(r\\equiv 2\\pmod 3\\). Поэтому, если игра заканчивается, выигрывает только красный. Значит, красный стремится завершить игру, а два других игрока стремятся играть бесконечно.\n\nПокажем стратегию красного, если он не ходит первым. Когда наступает ход красного, он удаляет три камня какого-нибудь цвета, если это возможно, а если уже может завершить игру, завершает её. После каждого такого хода общее число камней уменьшается на 3. Поэтому рано или поздно, перед ходом красного или сразу после него, игра попадает в область, где всего 2 или 5 камней, потому что общий остаток всегда равен 2.\n\nПри \\(r+g+b=2\\) или \\(5\\) и инвариантах \\(N\\equiv D\\equiv 2\\pmod 3\\) возможны только следующие упорядоченные состояния:\n\\[\n(0,1,1),\\ (2,0,0),\\ (0,1,4),\\ (0,4,1),\\ (1,2,2),\\ (2,0,3),\\ (2,3,0),\\ (3,1,1),\\ (5,0,0).\n\\]\nЗдесь \\((2,0,0)\\) и \\((5,0,0)\\) уже являются красным финалом или ведут к нему удалением трёх красных камней. Остальные переходы этого малого графа, которые важны для стратегии, таковы:\n\\[\n(0,1,1)\\to(2,0,0),\n\\]\n\\[\n(0,1,4)\\to(0,1,1)\\text{ или }(2,0,3),\\qquad\n(0,4,1)\\to(0,1,1)\\text{ или }(2,3,0),\n\\]\n\\[\n(2,0,3)\\to(2,0,0)\\text{ или }(1,2,2),\\qquad\n(2,3,0)\\to(2,0,0)\\text{ или }(1,2,2),\n\\]\n\\[\n(3,1,1)\\to(0,1,1),\\ (2,0,3),\\ (2,3,0)\\text{ или }(5,0,0),\n\\]\n\\[\n(1,2,2)\\to(0,1,4),\\ (0,4,1)\\text{ или }(3,1,1).\n\\]\nЭта таблица - официальный граф состояний, записанный без рисунка: ребро означает один допустимый ход.\n\nТеперь разберём стратегические следствия таблицы по вершинам. Если красный ходит из \\((0,1,1)\\), он заменяет зелёный и синий камни двумя красными и получает финал \\((2,0,0)\\). Из \\((2,0,3)\\) он удаляет три синих камня, из \\((2,3,0)\\) удаляет три зелёных камня, а из \\((3,1,1)\\) заменяет зелёный и синий камни двумя красными и получает финал \\((5,0,0)\\). Из \\((0,1,4)\\) красный удаляет три синих камня и переводит игру в \\((0,1,1)\\); из \\((0,4,1)\\) он удаляет три зелёных камня и снова переводит игру в \\((0,1,1)\\). В состоянии \\((0,1,1)\\) у следующего игрока единственный ход ведёт в красный финал \\((2,0,0)\\), поэтому эти две позиции тоже проиграны для зелёного и синего.\n\nЕдинственная малая позиция, где красный на своём ходе не может сразу или за один вынужденный ответ навязать красный финал, - это \\((1,2,2)\\). Из неё любой ход красного ведёт в одну из трёх позиций \\((0,1,4)\\), \\((0,4,1)\\), \\((3,1,1)\\), и два других игрока могут вернуть игру в \\((1,2,2)\\) за свои следующие два хода:\n\\[\n(1,2,2)\\to(0,1,4)\\to(2,0,3)\\to(1,2,2),\n\\]\n\\[\n(1,2,2)\\to(0,4,1)\\to(2,3,0)\\to(1,2,2),\n\\]\n\\[\n(1,2,2)\\to(3,1,1)\\to(2,0,3)\\to(1,2,2).\n\\]\nЗначит, если каждый раз при попадании в \\((1,2,2)\\) ходит красный, зелёный и синий могут поддерживать бесконечную игру.\n\nОсталось определить, чей ход будет в этой вершине. Начальные остатки равны \\((31,41,59)\\equiv(1,2,2)\\pmod 3\\). Ходы первого типа не меняют упорядоченный вектор остатков. Для ходов второго типа среди остатков, совместимых с \\(N\\equiv D\\equiv2\\pmod3\\), возможны только три вершины \\((1,2,2)\\), \\((0,1,1)\\), \\((2,0,0)\\), и каждый ход второго типа переводит их по циклу\n\\[\n(1,2,2)\\to(0,1,1)\\to(2,0,0)\\to(1,2,2).\n\\]\nПоэтому число ходов второго типа между двумя появлениями остатка \\((1,2,2)\\) кратно \\(3\\). Фактическая малая позиция \\((1,2,2)\\) имеет ровно \\(5\\) камней; чтобы дойти от \\(131\\) камня до \\(5\\) камней, нужно удалить \\(126\\) камней, то есть сделать ровно \\(42\\) хода первого типа. Это число тоже кратно \\(3\\). Следовательно, к моменту появления ключевой позиции \\((1,2,2)\\) общее число сделанных ходов кратно \\(3\\), и ходит тот же игрок, который начинал игру.\n\nЕсли первым ходил красный, то в \\((1,2,2)\\) снова ходит красный, и два других игрока могут бесконечно возвращать игру в эту позицию; при оптимальной игре партия не закончится. Если первым ходил зелёный или синий, то в \\((1,2,2)\\) ходит не красный. Какой бы ход он ни сделал, дальше возможны только два случая: либо следующий ход уже принадлежит красному в одной из позиций \\((0,1,4)\\), \\((0,4,1)\\), \\((3,1,1)\\), либо перед красным ещё ходит второй некрасный игрок и переводит игру в одну из позиций \\((0,1,1)\\), \\((2,0,3)\\), \\((2,3,0)\\), \\((3,1,1)\\) или сразу в красный финал. Все перечисленные позиции выигрышны для красного по разобранным выше ходам. Значит, при первом ходе зелёного или синего победит красный, а при первом ходе красного игра бесконечна.",
