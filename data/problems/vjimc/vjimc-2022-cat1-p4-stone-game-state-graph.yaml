  "solutions": [
    {
      "id": "sol-official-state-graph",
      "title": "Решение через инварианты и граф малых состояний",
      "text": "Пусть после некоторого хода в коробке лежат \\(r\\), \\(g\\), \\(b\\) красных, зелёных и синих камней. Рассмотрим две величины по модулю 3:\n\\[\nN=r+g+b,\\qquad D=r+2g.\n\\]\nУдаление трёх камней одного цвета не меняет ни \\(N\\), ни \\(D\\) по модулю 3. При замене двух разных цветов двумя камнями третьего цвета изменения \\(D\\) равны соответственно \\(-3\\), \\(3\\) или \\(0\\), а \\(N\\) вообще не меняется. Значит, оба остатка инвариантны.\n\nВ начале \\(N=31+41+59=131\\equiv 2\\pmod 3\\) и \\(D=31+2\\cdot 41=113\\equiv 2\\pmod 3\\). Если игра закончилась, то два из чисел \\(r,g,b\\) равны нулю. Синий финал дал бы \\(D\\equiv 0\\), зелёный финал дал бы \\(D\\equiv 2N\\equiv 1\\), и оба варианта невозможны. Красный финал возможен по остаткам: тогда \\(r\\equiv 2\\pmod 3\\). Поэтому, если игра заканчивается, выигрывает только красный. Значит, красный стремится завершить игру, а два других игрока стремятся играть бесконечно.\n\nПокажем стратегию красного, если он не ходит первым. Когда наступает ход красного, он удаляет три камня какого-нибудь цвета, если это возможно, а если уже может завершить игру, завершает её. После каждого такого хода общее число камней уменьшается на 3. Поэтому рано или поздно, перед ходом красного или сразу после него, игра попадает в область, где всего 2 или 5 камней, потому что общий остаток всегда равен 2.\n\nПри \\(r+g+b=2\\) или \\(5\\) и инвариантах \\(N\\equiv D\\equiv 2\\pmod 3\\) возможны только следующие упорядоченные состояния:\n\\[\n(0,1,1),\\ (2,0,0),\\ (0,1,4),\\ (0,4,1),\\ (1,2,2),\\ (2,0,3),\\ (2,3,0),\\ (3,1,1),\\ (5,0,0).\n\\]\nЗдесь \\((2,0,0)\\) и \\((5,0,0)\\) уже являются красным финалом или ведут к нему удалением трёх красных камней. Остальные переходы этого малого графа, которые важны для стратегии, таковы:\n\\[\n(0,1,1)\\to(2,0,0),\n\\]\n\\[\n(0,1,4)\\to(0,1,1)\\text{ или }(2,0,3),\\qquad\n(0,4,1)\\to(0,1,1)\\text{ или }(2,3,0),\n\\]\n\\[\n(2,0,3)\\to(2,0,0)\\text{ или }(1,2,2),\\qquad\n(2,3,0)\\to(2,0,0)\\text{ или }(1,2,2),\n\\]\n\\[\n(3,1,1)\\to(0,1,1),\\ (2,0,3),\\ (2,3,0)\\text{ или }(5,0,0),\n\\]\n\\[\n(1,2,2)\\to(0,1,4),\\ (0,4,1)\\text{ или }(3,1,1).\n\\]\nЭта таблица - официальный граф состояний, записанный без рисунка: ребро означает один допустимый ход.\n\nИз таблицы видно, что на своём ходе красный немедленно выигрывает из \\((0,1,1)\\), \\((2,0,3)\\), \\((2,3,0)\\) и \\((3,1,1)\\); из \\((0,1,4)\\) или \\((0,4,1)\\) он переводит игру в \\((0,1,1)\\), откуда следующие некрасные ходы уже не спасают от красного финала. Единственная позиция, в которой красный не может сразу навязать завершение, - \\((1,2,2)\\). Если ход красного начинается в \\((1,2,2)\\), то он обязан перейти в одну из трёх соседних вершин. Два других игрока могут за следующие два хода вернуть игру в \\((1,2,2)\\): например,\n\\[\n(1,2,2)\\to(0,1,4)\\to(2,0,3)\\to(1,2,2),\n\\]\nи аналогично для двух других выходов. Поэтому если каждый раз в вершине \\((1,2,2)\\) ходит красный, зелёный и синий могут поддерживать бесконечную игру.\n\nОсталось понять, чей ход будет в этой вершине. Начальные остатки равны \\((31,41,59)\\equiv(1,2,2)\\pmod 3\\). Ходы первого типа не меняют упорядоченный вектор остатков, а в графе остатков каждый возврат из \\((1,2,2)\\) в \\((1,2,2)\\) ходами второго типа имеет длину, кратную 3. Чтобы дойти от 131 камня до 5 камней, нужно ровно \\(42\\) удаления трёх камней, то есть число ходов первого типа кратно 3. Число ходов второго типа к моменту возврата в остаточное состояние \\((1,2,2)\\) тоже кратно 3. Следовательно, в ключевой позиции \\((1,2,2)\\) ходит тот же игрок, который начинал игру.\n\nЕсли первым ходил красный, то в \\((1,2,2)\\) снова ходит красный, и два других игрока могут бесконечно возвращать игру в эту позицию; при оптимальной игре партия не закончится. Если первым ходил зелёный или синий, то в \\((1,2,2)\\) ходит не красный. После его хода и ответа второго некрасного игрока красный получает одну из выигрышных малых позиций и завершает игру. Значит, при первом ходе зелёного или синего победит красный, а при первом ходе красного игра бесконечна.",
