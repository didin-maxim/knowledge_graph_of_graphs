        "title": "Условие",
        "text": "В коробке лежат соответственно \\(31\\), \\(41\\) и \\(59\\) камней красного, зелёного и синего цветов. Три игрока в футболках этих трёх цветов ходят по очереди. За ход игрок либо удаляет из коробки три камня одного цвета, либо заменяет два камня разных цветов двумя камнями третьего цвета. Игра заканчивается, когда все камни в коробке имеют один цвет; победителем считается игрок, цвет футболки которого совпадает с этим цветом. Если игроки играют оптимально, можно ли определить, закончится ли игра и кто выиграет, в зависимости от того, кто ходит первым?",
