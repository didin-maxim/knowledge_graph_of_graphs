  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Различающие раскраски циклов",
      "text": "Ответ: \\(3\\) цвета при \\(n=3,4,5\\) и \\(2\\) цвета при \\(n\\ge 6\\).\n\nОдин цвет невозможен при любом \\(n\\ge3\\), потому что все ключи тогда выглядят одинаково. Докажем, что для \\(n=3,4,5\\) двух цветов тоже мало. Для двуцветной раскраски достаточно рассмотреть множество вершин одного цвета; если оно больше половины цикла, поменяем названия цветов и рассмотрим дополнительное множество. Поэтому можно считать, что отмеченных вершин не больше \\(\\lfloor n/2\\rfloor\\).\n\nПри \\(n=3\\) отмеченное множество либо пусто, либо состоит из одной вершины; в обоих случаях есть отражение, сохраняющее раскраску. При \\(n=4\\) отмеченных вершин \\(0,1\\) или \\(2\\). Для \\(0\\) или \\(1\\) отмеченной вершины снова есть отражение, а две отмеченные вершины либо соседние, либо противоположные; в первом случае раскраску сохраняет отражение через середины двух противоположных ребер, во втором - поворот на \\(180^\\circ\\). При \\(n=5\\) отмеченных вершин \\(0,1\\) или \\(2\\). Случаи \\(0\\) и \\(1\\) симметричны, а две вершины пятиугольника находятся на расстоянии \\(1\\) или \\(2\\), и в обоих случаях существует отражение, сохраняющее эту пару. Значит, для \\(n=3,4,5\\) нужны как минимум три цвета.\n\nТри цвета для этих малых циклов достаточны. Для \\(C_3\\) покрасим все вершины в разные цвета. Для \\(C_4\\) подойдет раскраска \\((1,2,3,1)\\) по циклическому порядку: вершины цветов \\(2\\) и \\(3\\) единственны и соседни, поэтому любая сохраняющая цвет симметрия фиксирует соседнюю пару и является тождественной. Для \\(C_5\\) подойдет раскраска \\((1,2,3,2,2)\\): вершины цветов \\(1\\) и \\(3\\) единственны, а нетривиальная симметрия пятиугольника не может фиксировать две различные вершины, значит сохраняющая цвет симметрия тождественна.\n\nОсталось построить двуцветную раскраску при \\(n\\ge6\\). Пронумеруем вершины цикла по порядку \\(v_1,\\ldots,v_n\\). Покрасим \\(v_1,v_{n-2},v_{n-1}\\) в красный цвет, а все остальные вершины - в синий. В красном подграфе есть одна изолированная вершина \\(v_1\\) и одно ребро \\(v_{n-2}v_{n-1}\\), поэтому любая сохраняющая цвета симметрия обязана зафиксировать \\(v_1\\) и множество \\(\\{v_{n-2},v_{n-1}\\}\\). Но графовые расстояния от \\(v_1\\) до \\(v_{n-1}\\) и \\(v_{n-2}\\) равны соответственно \\(2\\) и \\(3\\), так что фиксируются и \\(v_{n-1}\\), и \\(v_{n-2}\\). После фиксации трех вершин цикла нет нетривиального поворота или отражения, сохраняющего всю раскраску. Значит, два цвета достаточны для всех \\(n\\ge6\\), и ответ доказан.",
