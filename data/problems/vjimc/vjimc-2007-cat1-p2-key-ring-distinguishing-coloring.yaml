  "ideas": [
    {
      "id": "idea-small-cycles-have-binary-symmetry",
      "title": "Малые циклы не имеют асимметричной двуцветной раскраски",
      "text": "Для \\(n=3,4,5\\) любая раскраска цикла двумя цветами допускает нетривиальный поворот или отражение, сохраняющие цвета. Это проверяется коротким разбором возможных расположений вершин одного цвета.",
