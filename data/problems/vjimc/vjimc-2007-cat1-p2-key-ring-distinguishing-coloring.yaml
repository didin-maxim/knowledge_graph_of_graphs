        "title": "Условие",
        "text": "У Алисы есть круглое кольцо с \\(n\\) ключами, \\(n\\ge 3\\). Когда она достает его из кармана, она не знает, было ли кольцо повернуто и/или перевернуто. Единственный способ различать ключи - раскрасить каждый ключ в некоторый цвет. Каково минимальное число цветов, необходимое для этого?",
