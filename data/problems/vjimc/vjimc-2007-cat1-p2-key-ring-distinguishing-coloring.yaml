  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Различающие раскраски циклов",
      "text": "Ответ: \\(3\\) цвета при \\(n=3,4,5\\) и \\(2\\) цвета при \\(n\\ge 6\\).\n\nОдин цвет невозможен при любом \\(n\\ge3\\), потому что все ключи тогда выглядят одинаково. Для \\(n=3\\) двух цветов также мало: две вершины одного цвета можно поменять отражением, а если две вершины имеют первый цвет, то аналогично меняются две вершины второго случая после переименования цветов.\n\nДля \\(n=4\\) зафиксируем одну вершину \\(v_1\\). С точностью до отражения и переименования цветов возможны только несколько двуцветных картин: все остальные вершины одного цвета; ровно одна из них цвета \\(v_1\\); вершина, противоположная \\(v_1\\), цвета \\(v_1\\). В каждом случае есть нетривиальная симметрия квадрата, сохраняющая цвета: либо отражение, меняющее две соседние вершины, либо поворот/отражение, меняющие пары одинаково окрашенных вершин. Значит, нужны три цвета; они очевидно достаточны, например если три вершины имеют разные цвета.\n\nДля \\(n=5\\) официальный разбор аналогичен. Если среди четырех вершин, отличных от \\(v_1\\), все одного цвета, отражение относительно оси через \\(v_1\\) сохраняет раскраску. Если там есть вершина цвета \\(v_1\\), то с точностью до отражения она стоит на расстоянии \\(1\\) или \\(2\\) от \\(v_1\\); в обоих случаях остается отражение, меняющее две неразличимые вершины. Поэтому двух цветов мало. Три цвета достаточны, например раскраска \\(v_1,v_2,v_3,v_4,v_5\\) цветами \\(1,2,3,2,2\\) не имеет нетривиальной сохраняющей цвет симметрии: вершина цвета \\(1\\) единственна, вершина цвета \\(3\\) единственна, а три вершины цвета \\(2\\) имеют разные положения относительно этих двух.\n\nОсталось построить двуцветную раскраску при \\(n\\ge6\\). Пронумеруем вершины цикла по порядку \\(v_1,\\ldots,v_n\\). Покрасим \\(v_1,v_{n-2},v_{n-1}\\) в красный цвет, а все остальные вершины - в синий. В красном подграфе есть одна изолированная вершина \\(v_1\\) и одно ребро \\(v_{n-2}v_{n-1}\\), поэтому любая сохраняющая цвета симметрия обязана зафиксировать \\(v_1\\) и множество \\(\\{v_{n-2},v_{n-1}\\}\\). Но расстояния от \\(v_1\\) до этих двух вершин равны соответственно \\(2\\) и \\(1\\), так что фиксируются и \\(v_{n-2}\\), и \\(v_{n-1}\\). После фиксации трех таких вершин на цикле нет нетривиального поворота или отражения, сохраняющего всю раскраску. Значит, два цвета достаточны для всех \\(n\\ge6\\), и ответ доказан.",
      "idea_ids": [
