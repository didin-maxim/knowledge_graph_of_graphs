  "ideas": [
    {
      "id": "idea-small-cycles-have-binary-symmetry",
      "title": "Малые циклы не имеют асимметричной двуцветной раскраски",
      "text": "Для \\(n=3,4,5\\) любая раскраска цикла двумя цветами допускает нетривиальный поворот или отражение, сохраняющие цвета. Достаточно смотреть на меньший цветовой класс: в треугольнике он пуст или состоит из одной вершины; в квадрате две отмеченные вершины либо соседние, либо противоположные; в пятиугольнике две отмеченные вершины также лежат на расстоянии \\(1\\) или \\(2\\). Во всех этих случаях есть нетривиальная симметрия, сохраняющая отмеченное множество.",
      "tags": [
        "graph_symmetry",
        "coloring"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-isolated-vertex-and-marked-edge",
      "title": "Изолированная отмеченная вершина и отмеченное ребро фиксируют цикл",
      "text": "При \\(n\\ge 6\\) достаточно отметить одним цветом вершину \\(v_1\\) и соседние вершины \\(v_{n-2},v_{n-1}\\), а остальные вершины покрасить вторым цветом. Одна отмеченная вершина изолирована среди отмеченных, а две другие образуют отмеченное ребро; расстояния от изолированной вершины различают концы этого ребра и затем все остальные вершины.",
      "tags": [
        "construction",
        "graph_symmetry"
      ],
      "status": "ai_checked"
    }
