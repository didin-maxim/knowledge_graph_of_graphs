    {
      "id": "idea-isolated-vertex-and-marked-edge",
      "title": "Изолированная отмеченная вершина и отмеченное ребро фиксируют цикл",
      "text": "При \\(n\\ge 6\\) достаточно отметить одним цветом вершину \\(v_1\\) и соседние вершины \\(v_{n-2},v_{n-1}\\), а остальные вершины покрасить вторым цветом. Одна отмеченная вершина изолирована среди отмеченных, а две другие образуют отмеченное ребро; расстояния от изолированной вершины различают концы этого ребра и затем все остальные вершины.",
