  "solutions": [
    {
      "id": "sol-de-bruijn-euler-cycle",
      "title": "Эйлеров цикл в графе де Брёйна",
      "text": "Ответ: да. При \\(l=1\\) достаточно записать все \\(k\\) букв по одному разу. Пусть \\(l\\ge2\\).\n\nПостроим ориентированный граф. Его вершинами будут все слова длины \\(l-1\\). Каждому слову \\(a_1\\ldots a_l\\) длины \\(l\\) сопоставим ребро из \\(a_1\\ldots a_{l-1}\\) в \\(a_2\\ldots a_l\\). Тогда пройти по ребру означает дописать последнюю букву.\n\nУ каждой вершины ровно \\(k\\) исходящих рёбер и ровно \\(k\\) входящих: можно свободно выбрать дописываемую букву справа или слева. Граф сильно связен: чтобы перейти от \\(a_1\\ldots a_{l-1}\\) к \\(b_1\\ldots b_{l-1}\\), достаточно последовательно дописать \\(b_1,b_2,\\ldots,b_{l-1}\\).\n\nЗначит, в этом конечном ориентированном графе есть эйлеров цикл. Запишем сначала слово, соответствующее стартовой вершине, а затем при каждом переходе по эйлерову циклу будем дописывать последнюю букву нового ребра. Каждое ребро графа пройдено ровно один раз, то есть каждое слово длины \\(l\\) встречается ровно один раз по окружности.",
