      "id": "idea-balanced-strongly-connected",
      "title": "Граф де Брёйна сбалансирован и сильно связен",
      "text": "Из каждой вершины выходит \\(k\\) рёбер и входит \\(k\\) рёбер. Кроме того, из любого слова длины \\(l-1\\) можно перейти к любому другому, последовательно дописывая его буквы.",
