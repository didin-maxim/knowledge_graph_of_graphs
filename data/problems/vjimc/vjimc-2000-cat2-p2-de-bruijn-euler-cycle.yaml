        "id": "stmt-original",
        "title": "Условие",
        "text": "Последовательность \\(AAABABBB\\), записанная по окружности, содержит каждое слово длины \\(3\\) над алфавитом \\(\\{A,B\\}\\) ровно один раз. Решите, можно ли для алфавита из \\(k\\) букв записать по окружности такую последовательность, чтобы каждое слово длины \\(l\\) над этим алфавитом встречалось ровно один раз.",
