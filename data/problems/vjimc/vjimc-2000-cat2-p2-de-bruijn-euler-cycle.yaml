  "solutions": [
    {
      "id": "sol-de-bruijn-euler-cycle",
      "title": "Эйлеров цикл в графе де Брёйна",
      "text": "Ответ: да. При \\(l=1\\) достаточно записать все \\(k\\) букв по одному разу. Пусть \\(l\\ge2\\).\n\nПостроим ориентированный граф. Его вершинами будут все слова длины \\(l-1\\). Каждому слову \\(a_1\\ldots a_l\\) длины \\(l\\) сопоставим ребро из \\(a_1\\ldots a_{l-1}\\) в \\(a_2\\ldots a_l\\). Тогда пройти по ребру означает дописать последнюю букву.\n\nУ каждой вершины ровно \\(k\\) исходящих рёбер и ровно \\(k\\) входящих: можно свободно выбрать дописываемую букву справа или слева. Граф сильно связен: чтобы перейти от \\(a_1\\ldots a_{l-1}\\) к \\(b_1\\ldots b_{l-1}\\), достаточно последовательно дописать \\(b_1,b_2,\\ldots,b_{l-1}\\).\n\nПо критерию эйлерова цикла для конечного ориентированного графа, сильная связность вместе с равенством входящей и исходящей степеней в каждой вершине даёт эйлеров цикл. Запишем сначала слово, соответствующее стартовой вершине, а затем при каждом переходе по эйлерову циклу будем дописывать последнюю букву нового ребра. Так как цикл возвращается в стартовую вершину, последние \\(l-1\\) букв полученной линейной записи повторяют начальное слово; удалим этот дублирующий хвост и оставшиеся \\(k^l\\) букв запишем по окружности.\n\nТеперь каждое ребро графа соответствует ровно одному слову длины \\(l\\): если ребро идёт из \\(a_1\\ldots a_{l-1}\\) в \\(a_2\\ldots a_l\\), то при проходе по нему в записи появляется окно \\(a_1\\ldots a_l\\). Эйлеров цикл проходит каждое ребро ровно один раз, а циклическое склеивание концов учитывает те окна, которые пересекают место разреза. Поэтому каждое слово длины \\(l\\) встречается по окружности ровно один раз.",
