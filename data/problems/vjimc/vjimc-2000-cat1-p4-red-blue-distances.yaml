  "solutions": [
    {
      "id": "sol-distance-class-counting",
      "title": "Подсчёт по каждому циклическому расстоянию",
      "text": "Достаточно доказать равенство числа красно-красных и сине-синих пар для каждого фиксированного расстояния между вершинами правильного \\(2n\\)-угольника.\n\nЗафиксируем шаг \\(m\\), \\(1\\le m\\le n\\). Соединим две вершины ребром, если между ними ровно \\(m\\) шагов по окружности. При \\(m<n\\) этот граф распадается на циклы. Рассмотрим один такой цикл. Пусть на нём \\(r\\) красных и \\(b\\) синих вершин, а \\(c\\) - число переходов красный-синий при обходе. Если \\(R\\) - число красно-красных рёбер этого цикла, а \\(B\\) - число сине-синих, то при подсчёте концов одноцветных рёбер имеем \\(2R+c=2r\\) и \\(2B+c=2b\\). Значит, \\(R-B=r-b\\).\n\nПросуммируем это равенство по всем циклам разложения для выбранного шага \\(m\\). Суммарно красных вершин столько же, сколько синих, а именно \\(n\\), поэтому суммарно \\(R=B\\). Итак, число красных пар на расстоянии \\(m\\) равно числу синих пар на расстоянии \\(m\\).\n\nЕсли \\(m=n\\), вершины разбиваются на пары противоположных. Так как всего красных и синих поровну, число красно-красных противоположных пар равно числу сине-синих противоположных пар. Следовательно, равенство верно для каждого расстояния, а значит совпадают и отсортированные последовательности расстояний.",
      "idea_ids": [
        "idea-step-cycles"
      ],
      "standard_idea_ids": [
        "double_counting"
      ],
      "status": "needs_human_review"
    }
  ],
