      "id": "idea-step-cycles",
      "title": "Фиксированный шаг разбивает вершины на циклы",
      "text": "Если соединить вершины, отстоящие на \\(m\\) шагов, получится объединение циклов. На каждом таком цикле число переходов между цветами связывает число красно-красных и сине-синих соседних пар.",
