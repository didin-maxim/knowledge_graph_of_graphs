  "solutions": [
    {
      "id": "sol-distance-class-counting",
      "title": "Подсчёт по каждому циклическому расстоянию",
      "text": "Достаточно доказать равенство числа красно-красных и сине-синих пар для каждого фиксированного евклидова расстояния между вершинами правильного \\(2n\\)-угольника. Эти расстояния взаимно однозначно соответствуют циклическим шагам \\(m=1,2,\\ldots,n\\): хорда длины шага \\(m\\) строго растёт при \\(1\\le m\\le n\\).\n\nЗафиксируем шаг \\(m\\), \\(1\\le m<n\\). Соединим две вершины ребром, если между ними ровно \\(m\\) шагов по окружности. У каждой вершины в этом графе два соседа: на \\(m\\) шагов вперёд и на \\(m\\) шагов назад. Поэтому граф распадается на циклы, а его рёбра в точности соответствуют неупорядоченным парам вершин на циклическом расстоянии \\(m\\).\n\nРассмотрим один такой цикл. Пусть на нём \\(r\\) красных и \\(b\\) синих вершин, а \\(c\\) - число рёбер с концами разных цветов. Если \\(R\\) - число красно-красных рёбер этого цикла, а \\(B\\) - число сине-синих, то подсчёт концов рёбер, инцидентных красным вершинам, даёт \\(2R+c=2r\\): красно-красное ребро даёт два красных конца, а разноцветное - один. Подсчёт концов рёбер, инцидентных синим вершинам, даёт \\(2B+c=2b\\). Вычитая, получаем \\(R-B=r-b\\).\n\nПросуммируем это равенство по всем циклам разложения для выбранного шага \\(m<n\\). Суммарно красных вершин столько же, сколько синих, а именно \\(n\\), поэтому суммарно \\(R-B=0\\), то есть суммарно \\(R=B\\). Значит, число красных пар на расстоянии \\(m\\) равно числу синих пар на расстоянии \\(m\\).\n\nОстаётся диаметр, то есть \\(m=n\\). Вершины разбиваются на \\(n\\) противоположных пар. Пусть среди них \\(x\\) красно-красных, \\(y\\) сине-синих и \\(z\\) разноцветных. Подсчёт красных и синих вершин в этих парах даёт \\(2x+z=n\\) и \\(2y+z=n\\), откуда \\(x=y\\). Следовательно, равенство верно и для диаметра.\n\nДля каждого возможного расстояния число красно-красных пар равно числу сине-синих пар. Значит, в двух списках расстояний каждая длина встречается одинаковое число раз, а потому отсортированные последовательности совпадают.",
