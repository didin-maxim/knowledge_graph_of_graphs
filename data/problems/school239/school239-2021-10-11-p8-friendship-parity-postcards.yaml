  "solutions": [
    {
      "id": "sol-ai-f2-cauchy-binet",
      "title": "ИИ-решение: паросочетания и матрица смежности над F2",
      "text": "Обозначим через \\(O\\) множество жителей с нечётным числом друзей. Каждый допустимый способ рассылки задаётся так: выбирается множество отправителей \\(R\\), причём \\(O\\subseteq R\\), а затем каждому \\(v\\in R\\) инъективно сопоставляется один из его друзей-получателей. Инъективность здесь ровно означает, что никто не получает больше одной открытки. Встречные открытки между двумя друзьями разрешены: в двудольной модели это два разных ребра между левой и правой копиями этих двух вершин.\n\nЗафиксируем множество \\(R\\) и найдём по модулю 2 число способов выбрать получателей для всех отправителей из \\(R\\). Пусть \\(A\\) — матрица смежности графа друзей над полем \\(F_2\\). Если получатели образуют множество \\(C\\) размера \\(|R|\\), то число биекций из \\(R\\) в \\(C\\), выбирающих только рёбра графа, по модулю 2 равно перманенту матрицы \\(A[R,C]\\). Над \\(F_2\\) знак перестановки не важен, поэтому перманент равен детерминанту. Значит искомый паритет равен\n\\[\\sum_{|C|=|R|}\\det A[R,C].\\]\nТак как значения детерминантов лежат в \\(F_2\\), это то же самое, что сумма квадратов этих детерминантов. По формуле Коши-Бине и симметричности \\(A\\) получаем\n\\[\\sum_{|C|=|R|}\\det A[R,C]^2=\\det\\bigl((A^2)[R,R]\\bigr).\\]\n\nОсталось использовать условие задачи. Элемент \\((A^2)_{uv}\\) над \\(F_2\\) равен чётности числа общих соседей вершин \\(u\\) и \\(v\\), если \\(u\\ne v\\), и чётности степени вершины \\(u\\), если \\(u=v\\). Поэтому по условию все внедиагональные элементы \\(A^2\\) равны нулю, а на диагонали стоят единицы ровно в строках вершин из \\(O\\). Иными словами, \\(A^2\\) — диагональная матрица с единицами на вершинах нечётной степени и нулями на вершинах чётной степени.\n\nСледовательно, \\(\\det((A^2)[R,R])=1\\) тогда и только тогда, когда все вершины из \\(R\\) имеют нечётную степень; если в \\(R\\) есть хотя бы одна вершина чётной степени, этот определитель равен нулю. Но в общей задаче всегда требуется \\(O\\subseteq R\\). Поэтому по модулю 2 ненулевой вклад даёт только одно множество отправителей, а именно \\(R=O\\), и его вклад равен \\(1\\). Значит общее число способов рассылки сравнимо с \\(1\\) по модулю 2, то есть нечётно.",
