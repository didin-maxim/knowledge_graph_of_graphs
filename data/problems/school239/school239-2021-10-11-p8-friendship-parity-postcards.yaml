      "text": "У любых двух жителей города чётное количество общих друзей в этом городе. На День города некоторые жители посылают открытки друзьям. Каждый житель с нечётным числом друзей посылает ровно одну открытку, каждый другой — не более одной открытки. При этом каждый получает не более одной открытки. Докажите, что количество способов, которыми это может произойти, нечётно.",
