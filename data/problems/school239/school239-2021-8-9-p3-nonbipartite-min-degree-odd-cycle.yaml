  "solutions": [
    {
      "id": "sol-ai-shortest-cycle-and-blow-up",
      "title": "ИИ-решение: кратчайший нечётный цикл и точная конструкция",
      "text": "Ответ: \\(k=159\\).\n\nСначала докажем, что в любом подходящем графе есть нечётный цикл длины не больше 159. Пусть \\(C\\) — кратчайший нечётный цикл в графе, а его длина равна \\(g\\). Если \\(g=3\\), то нужная оценка очевидна, поэтому далее считаем, что \\(g\\ge5\\).\n\nУ цикла \\(C\\) нет хорд: любая хорда разбила бы \\(C\\) на два меньших цикла, и один из них был бы нечётным. Кроме того, никакая вершина \\(x\\notin V(C)\\) не может быть смежна с тремя вершинами цикла \\(C\\). Действительно, три соседа \\(x\\) разбивают \\(C\\) на три дуги. Так как длина \\(C\\) нечётна, одна из этих дуг имеет нечётную длину. Если эта дуга состоит из одного ребра, то вместе с \\(x\\) получается треугольник, что противоречит \\(g\\ge5\\). Если её длина больше 1, то эта дуга вместе с двумя рёбрами к \\(x\\) даёт нечётный цикл короче \\(C\\) (случай равенства длине \\(C\\) возможен только когда две остальные дуги имеют длину 1, но тогда снова есть треугольник с вершиной \\(x\\)). Противоречие.\n\nКаждая вершина цикла \\(C\\) имеет степень не меньше 3. Два её ребра уже лежат на \\(C\\), хорд нет, значит из каждой вершины \\(C\\) выходит хотя бы одно ребро во внешнюю вершину. Таких рёбер не меньше \\(g\\), а каждая внешняя вершина инцидентна не более чем двум из них. Поэтому вне \\(C\\) есть хотя бы \\(\\lceil g/2\\rceil\\) вершин. Следовательно, \\(239\\ge g+\\lceil g/2\\rceil\\). Так как \\(g\\) нечётно, получаем \\(239\\ge (3g+1)/2\\), откуда \\(g\\le159\\).\n\nОсталось построить пример, в котором кратчайший нечётный цикл имеет длину ровно 159. Возьмём цикл \\(D=C_{159}\\). В графе на тех же вершинах, где соединены вершины \\(D\\), находящиеся на расстоянии 2 по циклу, снова получается цикл длины 159; выберем в нём независимое множество \\(S\\) из 79 вершин. Теперь каждую вершину \\(D\\) из \\(S\\) заменим на одноэлементное независимое множество, а каждую из остальных 80 вершин — на двухэлементное независимое множество. Между двумя множествами проведём все рёбра тогда и только тогда, когда соответствующие вершины были соседними в \\(D\\).\n\nВ построенном графе \\(79+2\\cdot80=239\\) вершин. Степень любой вершины равна сумме размеров двух соседних множеств. Эти два соседних множества не могут оба быть одноэлементными, потому что соответствующие вершины цикла \\(D\\) находятся на расстоянии 2 и множество \\(S\\) независимо. Значит, каждая степень не меньше \\(1+2=3\\). Граф недвудолен, поскольку, выбрав по одной вершине из каждого множества, получаем цикл длины 159.\n\nПокажем, что более коротких нечётных циклов нет. Любой цикл построенного графа при проекции на \\(D\\) превращается в замкнутый маршрут той же длины по циклу \\(C_{159}\\). Если такой маршрут имеет длину \\(L<159\\), то, записав каждый шаг как \\(+1\\) или \\(-1\\) по циклу, получаем сумму, сравнимую с 0 по модулю 159 и по модулю меньшую 159. Значит, эта сумма равна 0, то есть шагов \\(+1\\) и \\(-1\\) поровну, а \\(L\\) чётно. Поэтому нечётного цикла длины меньше 159 нет. Итак, гарантированная граница 159 точна.",
