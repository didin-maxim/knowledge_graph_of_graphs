      "id": "idea-empty-disk-graph",
      "title": "Граф пар, покрываемых пустым кругом",
      "text": "Хотя исходная формулировка геометрическая, её можно рассматривать как задачу о совершенном паросочетании в графе, где рёбрами являются пары точек, покрываемые пустым кругом. Удобно взять не весь этот граф, а триангуляцию Делоне: каждое её ребро уже имеет пустой круг, а известная теорема Делленкура даёт совершенное паросочетание при чётном числе вершин.",
