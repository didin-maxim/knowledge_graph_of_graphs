        "title": "Условие",
        "text": "На плоскости дано 2n точек. Никакие три из них не лежат на одной прямой и никакие четыре не лежат на одной окружности. Докажите, что можно разбить эти точки на n пар и покрыть каждую пару точек кругом, не содержащим других данных точек.",
