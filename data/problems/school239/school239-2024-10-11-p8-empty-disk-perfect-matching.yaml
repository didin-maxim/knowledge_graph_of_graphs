  "solutions": [
    {
      "id": "sol-ai-delaunay-tutte",
      "title": "ИИ-решение через триангуляцию Делоне и теорему Татта",
      "text": "Построим на данных \\(2n\\) точках триангуляцию Делоне \\(T\\). Из-за условия общего положения её можно понимать так: ребро \\(pq\\) входит в \\(T\\), если существует замкнутый круг, на границе которого лежат только \\(p\\) и \\(q\\), а внутри и на границе нет других данных точек. Поэтому любое ребро триангуляции Делоне является допустимой парой для исходной задачи.\n\nВоспользуемся стандартным результатом Делленкура: триангуляция Делоне конечного множества точек общего положения на плоскости является 1-жёсткой. То есть для любого множества вершин \\(S\\) граф \\(T-S\\) имеет не больше \\(|S|\\) компонент связности. Тогда для любого \\(S\\) число нечётных компонент графа \\(T-S\\) тем более не превосходит \\(|S|\\). При \\(S=\\varnothing\\) нечётных компонент нет, потому что \\(T\\) связен и имеет \\(2n\\) вершин.\n\nПо теореме Татта это ровно условие существования совершенного паросочетания в графе \\(T\\). Значит, вершины \\(T\\), то есть исходные точки, можно разбить на \\(n\\) пар, соответствующих рёбрам \\(T\\). Для каждого выбранного ребра \\(pq\\) по определению триангуляции Делоне есть пустой круг, содержащий \\(p\\) и \\(q\\) и не содержащий других данных точек. Эти \\(n\\) кругов и дают требуемое покрытие пар.",
