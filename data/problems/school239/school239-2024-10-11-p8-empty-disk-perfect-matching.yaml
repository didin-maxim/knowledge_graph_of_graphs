      "id": "sol-ai-delaunay-tutte",
      "title": "ИИ-решение через триангуляцию Делоне и теорему Татта",
      "text": "Построим на данных \\(2n\\) точках триангуляцию Делоне \\(T\\). Из-за условий общего положения триангуляция невырождена: никакие четыре точки не лежат на одной окружности, поэтому ребро \\(pq\\) входит в \\(T\\) тогда и только тогда, когда существует замкнутый круг, на границе которого лежат \\(p\\) и \\(q\\), а внутри и на границе нет других данных точек. Значит, каждое ребро \\(T\\) уже является допустимой парой для исходной задачи.\n\nДальше используется внешний тяжёлый факт: теорема Делленкура о 1-жёсткости триангуляций Делоне. В нужной нам форме она утверждает, что для любой триангуляции Делоне конечного множества точек общего положения и любого множества вершин \\(S\\) граф \\(T-S\\) имеет не больше \\(|S|\\) компонент связности. Ссылка для проверки факта: M. B. Dillencourt, «Toughness and Delaunay Triangulations», Discrete & Computational Geometry 5 (1990), 575-601; страница EUDML: https://eudml.org/doc/131137. Внутри этой карточки теорема не доказывается, потому что её доказательство существенно выходит за рамки олимпиадного решения.\n\nИз 1-жёсткости сразу следует условие Татта. Действительно, для любого \\(S\\) число нечётных компонент графа \\(T-S\\) не больше общего числа компонент графа \\(T-S\\), а оно не превосходит \\(|S|\\). При \\(S=\\varnothing\\) всё также хорошо: граф \\(T\\) связен и имеет чётное число \\(2n\\) вершин, поэтому единственная компонента не является нечётной в смысле условия Татта.\n\nПо теореме Татта граф имеет совершенное паросочетание тогда и только тогда, когда для каждого \\(S\\) число нечётных компонент после удаления \\(S\\) не превосходит \\(|S|\\). Поэтому в \\(T\\) есть совершенное паросочетание. Его \\(n\\) рёбер разбивают все исходные точки на пары. Для каждой выбранной пары \\(pq\\), поскольку \\(pq\\) является ребром триангуляции Делоне, существует пустой круг, содержащий \\(p\\) и \\(q\\) и не содержащий других данных точек. Эти пары и соответствующие пустые круги дают требуемое разбиение.",
