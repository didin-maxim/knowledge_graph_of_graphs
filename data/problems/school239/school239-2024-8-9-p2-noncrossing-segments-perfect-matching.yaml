  "solutions": [
    {
      "id": "sol-ai-apollonian-counterexample",
      "title": "ИИ-решение: контрпример через триангуляцию с большой независимой долей",
      "text": "Ответ отрицательный. Построим пример на \\(16\\) точках.\n\nВозьмём треугольник \\(AB C_0\\). Внутри треугольника \\(AB C_0\\) поставим точку \\(C_1\\) и соединим её с \\(A,B,C_0\\). Затем внутри нового треугольника \\(AB C_1\\) поставим точку \\(C_2\\) и соединим её с \\(A,B,C_1\\). Так же последовательно построим точки \\(C_3\\) и \\(C_4\\), каждый раз помещая \\(C_i\\) внутрь треугольника \\(AB C_{i-1}\\) и соединяя с его тремя вершинами. После этого есть \\(7\\) старых точек: \\(A,B,C_0,C_1,C_2,C_3,C_4\\). Полученный рисунок разбивает исходный треугольник на \\(9\\) маленьких треугольных областей.\n\nТеперь в каждую из этих \\(9\\) треугольных областей поместим по одной новой точке и соединим её ровно с тремя вершинами области, в которой она лежит. Новые точки можно выбрать так, чтобы никакие три из всех \\(16\\) точек не лежали на одной прямой: на каждом шаге достаточно избегать конечного числа запрещённых прямых.\n\nПроведённые отрезки не пересекаются по внутренним точкам, а весь рисунок является триангуляцией выпуклого треугольника \\(AB C_0\\). Поэтому любой непроведённый отрезок с концами в двух данных точках пересекает какое-то проведённое ребро во внутренней точке: если бы он не пересекал рёбер, он целиком лежал бы в одной треугольной области, но в одной такой области среди данных точек есть только её три вершины, а все отрезки между ними уже проведены.\n\nОсталось проверить, что совершенного паросочетания нет. Девять точек, добавленных на втором этапе, попарно не соединены рёбрами: каждая лежит в своей маленькой треугольной области и соединена только со старыми вершинами этой области. Значит, в любом паросочетании каждая из этих \\(9\\) новых точек должна быть спарена с одной из \\(7\\) старых точек. Но разные рёбра паросочетания не могут иметь общий конец, так что для покрытия девяти новых точек потребовалось бы не меньше девяти разных старых точек. Старых точек только семь. Противоречие.\n\nСледовательно, не всегда можно выбрать \\(n\\) проведённых отрезков без общих концов.",
