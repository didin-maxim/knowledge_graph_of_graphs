        "text": "На плоскости дано 2n точек, никакие три из которых не лежат на одной прямой. Они соединены не пересекающимися по внутренним точкам отрезками так, что любой отрезок с концами в двух данных точках будет пересекать какой-то из проведённых во внутренней точке. Верно ли, что всегда можно выбрать n проведённых отрезков, не имеющих общих концов?",
