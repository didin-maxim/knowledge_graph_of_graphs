        "id": "stmt-original",
        "title": "Клуб и языки",
        "text": "В клубе `2k+1` человек, и каждый владеет одними и теми же `k` языками. Каждая пара участников разговаривает ровно на одном из этих языков. Предположим, что не существует трёх участников, которые между собой всегда говорят на одном и том же языке. Обозначим через `A` число троек участников, у которых три попарных разговора идут на трёх разных языках. Найдите максимально возможное значение `A`.",
