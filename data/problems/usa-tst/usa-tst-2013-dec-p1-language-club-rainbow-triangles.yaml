      "id": "idea-count-two-color-triangles",
      "title": "Нерадужные треугольники считаются по вершинам",
      "text": "Если одноцветных треугольников нет, то любой нерадужный треугольник использует ровно два цвета и единственным образом отмечается вершиной, в которой сходятся два ребра одного цвета.",
