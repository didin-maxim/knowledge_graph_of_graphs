  "solutions": [
    {
      "id": "sol-count-local-repeats",
      "title": "Локальный счёт и разложение на гамильтоновы циклы",
      "text": "Переведём задачу в язык раскраски рёбер `K_{2k+1}`. Общее число треугольников равно `C(2k+1,3)`. Пусть для вершины `v` число рёбер цвета `c`, выходящих из `v`, равно `d_c(v)`. Так как одноцветных треугольников нет, каждый нерадужный треугольник использует ровно два цвета и единственным образом считается в сумме `Σ_v Σ_c C(d_c(v),2)`: он отмечается вершиной, в которой два инцидентных ребра имеют одинаковый цвет. Следовательно, `A = C(2k+1,3) - Σ_v Σ_c C(d_c(v),2)`. Для фиксированной вершины `v` выполнено `Σ_c d_c(v)=2k`. По выпуклости функции `x -> C(x,2)` эта сумма минимальна тогда и только тогда, когда все `d_c(v)` равны `2`; минимальное значение равно `k`. Поэтому `A <= C(2k+1,3) - (2k+1)k = 2k(2k+1)(k-2)/3`. Осталось показать достижимость. Полный граф `K_{2k+1}` можно разложить на `k` гамильтоновых циклов; окрасим каждый цикл в свой цвет. Тогда у каждой вершины в каждом цвете степень `2`, одноцветных треугольников нет, и во всех предыдущих неравенствах достигается равенство. Значит максимум равен `2k(2k+1)(k-2)/3`.",
