        "id": "stmt-original",
        "title": "Система подмножеств",
        "text": "Пусть `n>1`. Для положительного `m` обозначим через `S_m` множество `{1,2,...,mn}`. Предположим, что существует семейство `T` из `2n` различных `m`-элементных подмножеств множества `S_m` со свойствами: любые два множества из `T` пересекаются не более чем по одному элементу, а каждый элемент из `S_m` содержится ровно в двух множествах семейства `T`. Найдите наибольшее возможное значение `m` в зависимости от `n`.",
        "source_id": "src-usa-tst-2005-aops-community",
        "status": "ai_checked",
        "self_contained": {
