  "solutions": [
    {
      "id": "sol-regular-graph-bound",
      "title": "Через простой регулярный граф",
      "text": "Построим граф `G` на `2n` вершинах: вершины соответствуют множествам семейства `T`, а каждому элементу `x` из `S_m` сопоставим ребро между двумя множествами, содержащими `x`. Условие «каждый элемент содержится ровно в двух множествах» гарантирует, что такое ребро определено корректно. Условие «любые два множества пересекаются не более чем по одному элементу» означает, что между двумя вершинами не может появиться более одного ребра, то есть граф простой. Каждое множество содержит ровно `m` элементов, значит степень каждой вершины равна `m`; следовательно, `G` — простой `m`-регулярный граф на `2n` вершинах. В простом графе на `2n` вершинах степень любой вершины не превосходит `2n-1`, поэтому `m<=2n-1`. Оценка точна: берём полный граф `K_{2n}`. Его `n(2n-1)` рёбер можно занумеровать числами `1,2,...,n(2n-1)` и каждой вершине сопоставить множество номеров инцидентных ей рёбер. Получаем ровно `2n` множеств размера `2n-1`; каждый номер входит ровно в два множества, а любые два множества пересекаются ровно по одному номеру. Значит, максимум равен `2n-1`.",
