        "text": "Рассмотрим простой граф на `2n` вершинах, где вершины соответствуют множествам из `T`, а каждый элемент из `S_m` даёт ребро между двумя множествами, в которые он входит. Тогда задача эквивалентна вопросу о наибольшей возможной степени `m` простого `m`-регулярного графа на `2n` вершинах.",
