    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Пусть дан конечный неориентированный граф, в котором каждое ребро имеет вес `1` или `2`, а у каждой вершины сумма весов инцидентных рёбер нечётна. Докажите, что рёбра можно ориентировать так, чтобы для каждой вершины абсолютная величина `|in(v)-out(v)|` была равна `1`, где `in(v)` и `out(v)` — суммы весов входящих и выходящих рёбер.",
