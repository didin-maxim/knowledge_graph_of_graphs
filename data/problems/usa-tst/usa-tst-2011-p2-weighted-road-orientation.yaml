      "text": "В каждой вершине число инцидентных рёбер веса `1` нечётно. Если число рёбер веса `2` в вершине чётно, оставляем один конец ребра веса `1` свободным, а остальные концы спариваем по равным весам. Если число рёбер веса `2` нечётно, спариваем один конец веса `1` с одним концом веса `2`, а все остальные концы снова спариваем по равным весам. После таких локальных спариваний исходные рёбра становятся звеньями вспомогательных цепочек и циклических цепочек; ориентация каждой такой цепочки даёт нулевой вклад от равных пар и вклад `1` по модулю от единственного дефекта в каждой вершине.",
