  "solutions": [
    {
      "id": "sol-eulerian-augmentation",
      "title": "Подразбиение и эйлеровы циклы",
      "text": "Сначала заменим каждое ребро веса `2` путём из двух рёбер веса `1`, добавив новую промежуточную вершину степени `2`. Для исходных вершин сумма инцидентных весов была нечётной, а для новых промежуточных вершин степень равна `2`, то есть чётна. Теперь добавим ещё одну вершину `s` и соединим её одним новым ребром веса `1` с каждой исходной вершиной. После этого степени всех вершин в полученном неориентированном графе чётны, значит каждая компонента раскладывается на циклы. Ориентируем каждый цикл по обходу. Тогда у каждой вершины, отличной от `s`, среди старых рёбер суммарный вход равен суммарному выходу; единственный возможный дисбаланс создаёт лишь добавленное ребро из `s`, поэтому абсолютная величина разности равна `1`. У промежуточной вершины одно ребро входит и одно выходит, так что после стягивания её обратно получаем корректную ориентацию исходного ребра веса `2`. Удаляя вершину `s` и стягивая все подразделённые рёбра, получаем требуемую ориентацию исходного взвешенного графа.",
      "idea_ids": [
        "idea-make-everything-even"
      ],
      "standard_idea_ids": [],
      "status": "ai_checked",
      "definition_ids": [
        "cycle",
        "directed_graph"
      ]
    },
    {
      "id": "sol-mse-auxiliary-vertex-euler-tour",
      "title": "MSE: вспомогательная вершина и эйлеров обход",
      "text": "Форумная версия удобно формулирует более общий принцип: в любом мультиграфе можно ориентировать рёбра так, чтобы у каждой вершины модуль разности между outdegree и indegree не превосходил `1`. Для нашей задачи сначала заменим каждое ребро веса `2` двумя параллельными рёбрами веса `1` между теми же вершинами. Тогда взвешенная степень каждой исходной вершины становится обычной степенью в мультиграфе и по условию остаётся нечётной. Далее добавим новую вершину `x` и соединим её с каждой вершиной графа одним ребром. Все степени станут чётными, значит в каждой компоненте есть эйлеров цикл; ориентируем рёбра вдоль этих обходов. После удаления вершины `x` у каждой старой вершины баланс по старым рёбрам нарушается только за счёт единственного ребра, инцидентного `x`, поэтому модуль дисбаланса равен `1`. Наконец, каждую пару параллельных рёбер, возникшую из ребра веса `2`, можно снова считать одним ребром веса `2`: его вклад в вход или выход равен сумме вкладов двух копий. Так получается требуемая ориентация исходного взвешенного графа.",
