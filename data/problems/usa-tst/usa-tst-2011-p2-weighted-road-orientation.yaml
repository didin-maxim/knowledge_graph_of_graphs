        "id": "stmt-original",
        "title": "Дороги в стране Onewaynia",
        "text": "Некоторые пары городов соединены дорогами. Каждая дорога имеет пропускную способность `1` или `2`. Известно, что для каждого города сумма пропускных способностей всех дорог, инцидентных этому городу, нечётна. Докажите, что можно выбрать направление на каждой дороге так, чтобы для каждого города абсолютная величина разности между суммарной пропускной способностью входящих и выходящих дорог была равна `1`.",
        "source_id": "src-usa-tst-2011-aops-community",
        "status": "ai_checked",
        "self_contained": {
