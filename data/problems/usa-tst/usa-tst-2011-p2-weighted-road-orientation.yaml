      "id": "sol-eulerian-augmentation",
      "title": "Локальные спаривания концов рёбер и ориентация полученных маршрутов",
      "text": "Обозначим через `d_1(v)` число рёбер веса `1`, инцидентных вершине `v`, а через `d_2(v)` число рёбер веса `2`, инцидентных `v`. Так как сумма весов инцидентных рёбер равна `d_1(v)+2d_2(v)` и нечётна, число `d_1(v)` нечётно для каждой вершины. Теперь в каждой вершине отдельно разобьём инцидентные концы рёбер на пары, иногда оставляя один конец непарным. Если `d_2(v)` чётно, то спарим все концы рёбер веса `2` между собой, спарим все, кроме одного, концы рёбер веса `1` между собой, а один конец ребра веса `1` оставим свободным. Это возможно, потому что `d_2(v)` чётно, а `d_1(v)-1` тоже чётно. Если же `d_2(v)` нечётно, то выберем один конец ребра веса `2` и один конец ребра веса `1` и спарим их друг с другом; все оставшиеся концы веса `2` спарим между собой, и все оставшиеся концы веса `1` тоже спарим между собой. Это возможно, потому что теперь `d_2(v)-1` и `d_1(v)-1` чётны. Итак, в каждой вершине появился ровно один особый объект: либо свободный конец ребра веса `1`, либо смешанная пара из концов весов `1` и `2`; все остальные пары состоят из равных весов. Построим вспомогательный граф, вершинами которого служат исходные рёбра, а локальная пара концов в некоторой вершине исходного графа соединяет две соответствующие вершины вспомогательного графа. У каждой вершины вспомогательного графа степень не больше `2`, а свободные концы дают концы его цепей. Поэтому компоненты вспомогательного графа являются цепями или циклами. Ориентируем исходные рёбра вдоль каждой такой цепи произвольно от одного конца к другому, а вдоль каждого такого цикла — произвольно по кругу. Это задаёт направление каждому исходному ребру, причём ребро веса `2` остаётся одним неделимым ребром веса `2`, а не двумя копиями. Проверим баланс в вершине `v`. Если через `v` проходит пара концов рёбер одинакового веса, то одно из этих двух рёбер входит в `v`, а другое выходит из `v`, поэтому их вклады в `in(v)-out(v)` взаимно уничтожаются. Следовательно, все равновесные пары дают суммарный вклад `0`. Если в `v` был свободный конец, то это конец ребра веса `1`, и соответствующее ребро либо входит в `v`, либо выходит из `v`; его вклад равен соответственно `1` или `-1`. Если в `v` была смешанная пара весов `1` и `2`, то одно из двух рёбер входит в `v`, а другое выходит из `v`; вклад этой пары равен `2-1=1` или `1-2=-1`. Других ненулевых вкладов в вершине нет. Поэтому для каждой вершины величина `in(v)-out(v)` равна либо `1`, либо `-1`, а значит `|in(v)-out(v)|=1`. Требуемая ориентация построена.",
