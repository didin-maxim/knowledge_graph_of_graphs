      "id": "sol-mse-auxiliary-vertex-euler-tour",
      "title": "MSE: вспомогательная вершина и эйлеров обход",
      "text": "Форумная версия удобно формулирует более общий принцип: в любом мультиграфе можно ориентировать рёбра так, чтобы у каждой вершины модуль разности между исходящей и входящей степенями не превосходил `1`. Для нашей задачи сначала заменим каждое ребро веса `2` двумя параллельными рёбрами веса `1` между теми же вершинами. Тогда взвешенная степень каждой исходной вершины становится обычной степенью в мультиграфе и по условию остаётся нечётной. Далее добавим новую вершину `x` и соединим её с каждой вершиной графа одним ребром. Все степени станут чётными, значит в каждой компоненте есть эйлеров цикл; ориентируем рёбра вдоль этих обходов. После удаления вершины `x` у каждой старой вершины баланс по старым рёбрам нарушается только за счёт единственного ребра, инцидентного `x`, поэтому модуль дисбаланса равен `1`. Наконец, каждую пару параллельных рёбер, возникшую из ребра веса `2`, можно снова считать одним ребром веса `2`: его вклад в вход или выход равен сумме вкладов двух копий. Так получается требуемая ориентация исходного взвешенного графа.",
