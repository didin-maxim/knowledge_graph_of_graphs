      "title": "Довести задачу до эйлерова случая",
      "text": "Рёбра веса `2` удобно разбить на два последовательных ребра веса `1`, а затем добавить новую вершину, соединённую со всеми исходными вершинами. После этого все степени становятся чётными, и граф можно ориентировать по циклам.",
