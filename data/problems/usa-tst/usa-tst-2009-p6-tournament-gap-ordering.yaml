  "solutions": [
    {
      "id": "sol-components-hamiltonian-cycle",
      "title": "Сильные компоненты и циклы всех длин в сильном турнире",
      "text": "Перейдём к турниру `T`: вершины — игроки, а ребро `x->y` означает, что `x` победил `y`.\n\nСначала докажем используемую лемму. Если турнир сильно связен и содержит цикл `C=u_0->u_1->...->u_{k-1}->u_0` длины `k<n`, то в нём есть цикл длины `k+1`. Действительно, если найдётся вершина `v` вне `C`, для которой есть и ребро из `C` в `v`, и ребро из `v` в `C`, то при обходе цикла найдётся соседняя пара `u_i,u_{i+1}` с `u_i->v` и `v->u_{i+1}`; заменяем ребро `u_i->u_{i+1}` на два ребра через `v`. Иначе каждая внешняя вершина либо принимает все рёбра из `C`, либо посылает все рёбра в `C`. Обозначим через `V` первый класс, через `W` второй. В сильном турнире оба класса непусты, и не может быть так, что все рёбра между ними идут из `W` в `V`; иначе из `V` нельзя было бы добраться до `C`. Значит, есть ребро `v->w` с `v` из `V` и `w` из `W`. Тогда `u_0->u_1->...->u_{k-2}->v->w->u_0` — цикл длины `k+1`. Так как сильный нетранзитивный турнир содержит треугольник, повторяя этот шаг, получаем циклы всех длин от `3` до числа вершин компоненты.\n\nТеперь рассмотрим сильные компоненты турнира `T`. Если некоторая компонента имела бы размер хотя бы `M+1`, по лемме в ней был бы цикл `x_0->x_1->...->x_M->x_0` длины `M+1`. Но путь `x_0->x_1->...->x_M` имеет длину `M`, поэтому условие требует ребро `x_0->x_M`, что невозможно, поскольку в турнире между `x_0` и `x_M` уже есть ребро `x_M->x_0`. Следовательно, каждая сильная компонента имеет не больше `M` вершин.\n\nКонденсация турнира ациклична, а между двумя разными сильными компонентами все рёбра направлены в одну сторону; иначе компоненты лежали бы в одном сильном классе. Поэтому компоненты можно линейно упорядочить как `C_1,...,C_t` так, что при `i<j` каждое ребро между `C_i` и `C_j` направлено из `C_j` в `C_i`.\n\nЗапишем вершины компонент подряд в этом порядке. Внутри компоненты размера меньше `M` порядок произволен: две её вершины не могут оказаться на расстоянии хотя бы `M-1`. Если компонента имеет ровно `M` вершин, она сильно связна, значит по лемме содержит гамильтонов цикл `u_1->u_2->...->u_M->u_1`; в такой компоненте записываем вершины именно как `u_1,...,u_M`. Тогда единственная внутренняя пара на расстоянии `M-1` — это `u_1,u_M`, и нужное направление `u_M->u_1` есть.\n\nОстаётся проверить пары из разных компонент. Если вершина получила больший номер и находится в более поздней компоненте, то она побеждает любую вершину более ранней компоненты по выбранному порядку конденсации. Значит, для всех `a>=b+M-1` игрок с номером `a` действительно победил игрока с номером `b`.",
