  "solutions": [
    {
      "id": "sol-components-hamiltonian-cycle",
      "title": "Сильные компоненты и гамильтоновы циклы",
      "text": "Рассмотрим турнир `T`, соответствующий результатам игр. Разобьём его на сильные компоненты связности `C_1,...,C_t` и упорядочим их так, чтобы при `i<j` каждая вершина из `C_j` побеждала каждую вершину из `C_i`; в турнире это возможно, потому что конденсация ациклична и потому линейна. Покажем, что каждая компонента имеет размер не больше `M`. Действительно, сильный турнир на `s` вершинах содержит ориентированный цикл любой длины от `3` до `s`; в частности, при `s>=M+1` внутри компоненты был бы цикл `x_0->x_1->...->x_M->x_0`, а путь `x_0->x_1->...->x_M` длины `M` противоречил бы условию, поскольку обратное ребро `x_M->x_0` уже есть. Теперь пронумеруем вершины компонент подряд. Если `|C_i|<M`, порядок внутри `C_i` не важен: две вершины одной компоненты не могут оказаться на расстоянии `M-1`. Если `|C_i|=M`, то, поскольку `C_i` сильносвязна, в ней есть гамильтонов цикл `u_1->u_2->...->u_M->u_1`; нумеруем вершины именно в этом порядке. Тогда единственная внутренняя пара на расстоянии `M-1` — это `(u_1,u_M)`, и нужное ребро `u_M->u_1` есть. Наконец, если две вершины лежат в разных компонентах и более поздняя получила больший номер, то она побеждает более раннюю по определению порядка компонент. Следовательно, после такой нумерации для всех `a>=b+M-1` игрок `a` действительно победил игрока `b`.",
      "idea_ids": [
