    {
      "id": "sol-mse-tournament-components",
      "title": "MSE: решение через компоненты турнира",
      "text": "Форумная версия раскладывает решение на две стандартные леммы о турнирах. Первая: сильные компоненты турнира линейно упорядочиваются, и все рёбра между двумя компонентами направлены в одну сторону; это ровно наблюдение из ответа Misha Lavrov о циклах и сильных компонентах турнира. Вторая: сильный турнир на `s` вершинах содержит циклы всех длин от `3` до `s`; в ответе bof это используется как индуктивная схема выращивания циклов. После этих двух лемм задача решается почти автоматически: компоненты размера больше `M` запрещены, компоненты размера `<M` можно располагать произвольно, а компоненту размера `M` надо просто выписать вдоль гамильтонова цикла. Внешний порядок задаёт конденсация, внутренний — цикл длины `M`, и тем самым все пары вершин с разницей номеров хотя бы `M-1` получают верное направление.",
