        "title": "Шахматный турнир",
        "text": "Пусть `N>M>1`. В круговом шахматном турнире каждая пара игроков сыграла ровно одну партию без ничьих. Известно, что для любой последовательности из `M+1` различных игроков `P_0,P_1,...,P_M`, в которой `P_{i-1}` победил `P_i` для всех `i=1,...,M`, игрок `P_0` также победил `P_M`. Докажите, что игроков можно занумеровать числами `1,2,...,N` так, что если `a>=b+M-1`, то игрок `a` победил игрока `b`.",
