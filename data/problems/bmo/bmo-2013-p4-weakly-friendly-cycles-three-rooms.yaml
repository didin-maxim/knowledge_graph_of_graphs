  "solutions": [
    {
      "id": "sol-nonfriend-graph-induced-path",
      "title": "Решение через граф недружбы",
      "text": "Построим граф \\(G\\): вершины - участники, а ребро означает, что соответствующие два участника не дружат. Тогда слабо-дружественный цикл из условия - это ровно индуцированный цикл в \\(G\\). Требуется доказать, что \\(G\\) можно правильно раскрасить в три цвета: вершины одного цвета затем станут одной комнатой, и внутри такой комнаты ребер графа \\(G\\), то есть пар недрузей, не будет.\n\nСначала докажем лемму: в каждом непустом графе \\(G\\), удовлетворяющем условию задачи, есть вершина степени не больше \\(2\\). Предположим противное: пусть все степени не меньше \\(3\\). Возьмем в \\(G\\) длиннейший индуцированный путь\n\\[\nP=u_0u_1\\ldots u_k.\n\\]\nТак как путь индуцированный, вершина \\(u_0\\) среди вершин пути смежна только с \\(u_1\\). Но степень \\(u_0\\) не меньше \\(3\\), значит у нее есть два соседа \\(v\\) и \\(w\\), не лежащие на \\(P\\).\n\nПо максимальности пути каждый из \\(v,w\\) должен иметь соседа среди \\(u_1,\\ldots,u_k\\): иначе, например, \\(v,u_0,u_1,\\ldots,u_k\\) был бы более длинным индуцированным путем. Пусть \\(u_i\\) - первый по порядку сосед \\(v\\) на пути после \\(u_0\\), а \\(u_j\\) - первый такой сосед \\(w\\); переобозначим \\(v,w\\), если нужно, так, чтобы \\(i\\ge j\\).\n\nТогда вершины \\(u_0,u_1,\\ldots,u_i,v\\) образуют индуцированный цикл: внутри пути нет хорд, а выбор минимального \\(i\\) запрещает ребра от \\(v\\) к \\(u_1,\\ldots,u_{i-1}\\). Вершина \\(w\\) не принадлежит этому циклу, но смежна с двумя его вершинами, а именно с \\(u_0\\) и \\(u_j\\). Это противоречит условию задачи для индуцированного цикла. Лемма доказана.\n\nТеперь докажем 3-раскрашиваемость индукцией по числу вершин. Для \\(|V(G)|\\le 3\\) утверждение очевидно. В общем случае по лемме есть вершина \\(x\\) степени не больше \\(2\\). Граф \\(G-x\\) тоже удовлетворяет тому же условию: любой его индуцированный цикл и любая внешняя вершина являются такими же объектами в исходном графе. По индукционному предположению \\(G-x\\) правильно раскрашивается в три цвета. Вершина \\(x\\) имеет не более двух соседей, значит среди трех цветов найдется цвет, не использованный на ее соседях; покрасим \\(x\\) в него. Получаем правильную 3-раскраску всего \\(G\\).\n\nНаконец, рассадим участников по комнатам согласно трем цветам. Если два участника оказались в одной комнате, то в правильной раскраске между ними нет ребра графа \\(G\\), то есть они не являются недрузьями. Следовательно, они дружат, что и требовалось.",
