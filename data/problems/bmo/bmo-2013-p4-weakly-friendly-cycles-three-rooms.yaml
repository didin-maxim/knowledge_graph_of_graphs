        "id": "stmt-original",
        "title": "Условие",
        "text": "В математическом соревновании некоторые участники дружат; дружба взаимна. Назовем различных участников \\(A_1,A_2,\\ldots,A_n\\), где \\(n\\ge 3\\), слабо-дружественным циклом, если \\(A_i\\) не дружит с \\(A_{i+1}\\) при всех \\(1\\le i\\le n\\), где \\(A_{n+1}=A_1\\), и среди участников этого цикла нет других пар недрузей. Предположим, что выполнено следующее свойство: для любого участника \\(C\\) и любого слабо-дружественного цикла \\(\\mathcal S\\), не содержащего \\(C\\), в \\(\\mathcal S\\) есть не более одного участника \\(D\\), который не дружит с \\(C\\). Докажите, что всех участников можно рассадить по трем комнатам так, чтобы любые два участника в одной комнате дружили.",
