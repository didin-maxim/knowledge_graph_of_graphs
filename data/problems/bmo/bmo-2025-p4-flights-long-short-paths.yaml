  "ideas": [
    {
      "id": "idea-longest-path-cycle",
      "title": "Наидлиннейший путь замыкается в гамильтонов цикл",
      "text": "Берём наидлиннейший путь между двумя вершинами и сравниваем его с непересекающимся коротким путём. Это вынуждает наличие ребра между концами длинного пути; затем любой внешний сосед дал бы более длинный путь, значит найденный цикл уже проходит через все вершины графа.",
      "tags": [
        "connectivity"
      ],
      "status": "needs_human_review"
    },
    {
      "id": "idea-distance-set-closure",
      "title": "Множество допустимых расстояний по циклу замкнуто",
      "text": "После гамильтонова цикла все хорды классифицируются по циклическому расстоянию. Из специальных длинных путей следует, что вместе с двумя из чисел \\(a,b,a+b-1\\) в множество допустимых расстояний попадает и третье; это замыкание приводит только к трём вариантам: цикл, полный граф или при чётном \\(n\\) полный двудольный граф.",
      "tags": [
        "hamiltonian_cycles"
      ],
      "status": "needs_human_review"
    }
  ],
  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Сжатое официальное решение",
      "text": "Интерпретируем сеть авиарейсов как связный граф. Сначала проверяется, что \\(K_n\\), цикл \\(C_n\\) и при чётном \\(n\\) граф \\(K_{n/2,n/2}\\) действительно удовлетворяют условию. Для обратного направления берётся наидлиннейший путь \\(V_1V_2\\dots V_p\\). Поскольку для его концов существует внутренне непересекающийся короткий путь, этот короткий путь вместе с длинным вынуждает ребро \\(V_1V_p\\); иначе можно было бы удлинить путь. Затем любой сосед вершины цикла вне самого цикла снова дал бы путь большей длины, поэтому полученный цикл уже гамильтонов. После этого перенумеровываем вершины по циклу и рассматриваем множество расстояний \\(S\\), для которых в графе есть все хорды данного циклического расстояния. Из специальной перестановки вершин в длинном пути получается правило замыкания: если два из чисел \\(a,b,a+b-1\\) лежат в \\(S\\), то и третье тоже. Если \\(2\\in S\\), то по индукции в \\(S\\) попадают все расстояния, и граф полон. Если \\(2\\notin S\\), то соседние расстояния одновременно встречаться не могут. Тогда либо \\(S=\\{1,n-1\\}\\), что даёт цикл, либо в \\(S\\) есть некоторое \\(t\\in[3,n-3]\\), откуда тем же правилом следуют все нечётные расстояния; значит \\(n\\) чётно и граф есть \\(K_{n/2,n/2}\\). Поэтому возможны ровно \\(F=n\\), \\(F=n(n-1)/2\\) и при чётном \\(n\\) ещё \\(F=n^2/4\\).",
