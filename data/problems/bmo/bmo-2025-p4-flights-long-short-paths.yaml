        "id": "stmt-original",
        "title": "Условие",
        "text": "В стране есть \\(n\\ge 100\\) городов; некоторые пары соединены двусторонними прямыми авиарейсами. Для двух городов \\(A,B\\) путь - это последовательность различных городов от \\(A\\) до \\(B\\), в которой соседние города соединены рейсом. Длинным путём называется путь между \\(A\\) и \\(B\\), содержащий максимально возможное число городов, а коротким - путь с минимально возможным числом городов. Предполагается, что для любой пары \\(A,B\\) существуют длинный и короткий пути, не имеющие общих внутренних городов. Пусть \\(F\\) - число авиалиний. Найдите все возможные значения \\(F\\) в зависимости от \\(n\\).",
        "source_id": "src-bmo-2025-official",
