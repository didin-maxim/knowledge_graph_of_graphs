  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Развёрнутое официальное решение",
      "text": "Интерпретируем сеть авиарейсов как простой неориентированный граф \\(G\\). Сначала проверим три семейства. В \\(K_n\\) коротким путём между двумя вершинами служит ребро, а длинный путь можно выбрать любым гамильтоновым путём с теми же концами. В цикле \\(C_n\\) между двумя вершинами есть два пути по двум дугам цикла; более короткая и более длинная дуга не имеют общих внутренних вершин. В \\(K_{m,m}\\), где \\(n=2m\\), для вершин из разных долей короткий путь - ребро, а длинный путь можно взять гамильтоновым. Для вершин из одной доли длинный путь имеет \\(2m-1\\) вершин и пропускает некоторую вершину другой доли; короткий путь через эту пропущенную вершину внутренне не пересекается с длинным. Значит эти графы подходят. Докажем обратное. Граф связен, потому что между любой парой вершин есть путь. Возьмём путь \\(P=V_1V_2\\dots V_p\\) максимальной длины среди всех простых путей графа. Для пары \\(V_1,V_p\\) этот путь является длинным. По условию существует короткий \\(V_1\\)-\\(V_p\\)-путь, внутренне не пересекающийся с \\(P\\). Если ребра \\(V_1V_p\\) нет, то короткий путь содержит внутреннюю вершину \\(X\\), не лежащую на \\(P\\), и начинается ребром \\(V_1X\\); тогда \\(XV_1V_2\\dots V_p\\) длиннее \\(P\\), противоречие. Поэтому \\(V_1V_p\\in E(G)\\), и \\(V_1\\dots V_pV_1\\) - цикл. Если вне этого цикла есть вершина \\(A\\), то из связности у неё есть сосед \\(V_i\\) на цикле; обход \\(A,V_i,V_{i+1},\\dots,V_{i-1}\\) даёт путь длины \\(p+1\\), снова противоречие. Значит цикл гамильтонов, и далее пишем его вершины как \\(V_1,\\dots,V_n\\) по модулю \\(n\\). Если в графе есть ребро \\(V_iV_j\\), то есть и ребро \\(V_{i+1}V_{j+1}\\): действительно, путь \\(V_{i+1}V_{i+2}\\dots V_jV_iV_{i-1}\\dots V_{j+1}\\) проходит через все \\(n\\) вершин, а значит является длинным между концами; внутренне непересекающийся короткий путь между этими концами не может иметь внутренних вершин, поэтому обязан быть ребром. Повторяя сдвиг, получаем, что если есть одно ребро данного циклического расстояния, то есть все рёбра этого расстояния. Пусть \\(S\\subseteq\\{1,\\dots,n-1\\}\\) - множество расстояний, для которых все такие рёбра есть в графе. Тогда \\(1,n-1\\in S\\). Для положительных \\(a,b\\) с \\(a+b\\le n-1\\) рассмотрим гамильтонов порядок \\(V_1,V_{a+b},V_{a+b-1},\\dots,V_{a+1},V_{a+b+1},V_{a+b+2},\\dots,V_n,V_a,V_{a-1},\\dots,V_2\\). Расстояния между соседними вершинами в нём равны только \\(1,a,b,a+b-1\\). Если любые два из чисел \\(a,b,a+b-1\\) лежат в \\(S\\), то все соседние пары этого порядка соединены рёбрами, кроме, возможно, пары концов. Получается гамильтонов путь; как выше, условие задачи заставляет соединить его концы, а их расстояние равно третьему числу. Поэтому вместе с любыми двумя из \\(a,b,a+b-1\\) в \\(S\\) лежит и третье. Если \\(2\\in S\\), то из \\(1,2\\in S\\) и правила с \\((a,b)=(r,2)\\) индуктивно получаем \\(3,4,\\dots,n-1\\in S\\); граф полный. Пусть теперь \\(2\\notin S\\). Тогда \\(n-2\\notin S\\) тоже. Если бы два соседних числа \\(r,r+1\\) из диапазона \\(1,\\dots,n-2\\) лежали в \\(S\\), то правило с \\((a,b)=(r,2)\\) дало бы \\(2\\in S\\), противоречие; значит в \\(S\\) нет соседних чисел. Если \\(S=\\{1,n-1\\}\\), граф есть \\(C_n\\). Иначе возьмём \\(t\\in S\\), \\(3\\le t\\le n-3\\). Порядок \\(V_t,V_{t-1},\\dots,V_2,V_{t+2},V_{t+1},V_1,V_n,\\dots,V_{t+3}\\) снова является гамильтоновым путём, потому что его соседние расстояния равны \\(1\\) или \\(t\\). Поэтому его концы должны быть соединены, то есть \\(3\\in S\\). Теперь из \\(1,3\\in S\\) правило с \\((a,b)=(r,3)\\) даёт по индукции все нечётные расстояния. Так как соседних чисел в \\(S\\) нет, чётных расстояний в \\(S\\) быть не может; кроме того \\(n-1\\in S\\), значит \\(n\\) чётно. Тогда \\(S\\) состоит ровно из нечётных расстояний, а это полный двудольный граф с долями вершин чётной и нечётной нумерации, то есть \\(K_{n/2,n/2}\\). Следовательно, возможны только \\(F=n\\), \\(F=n(n-1)/2\\), а при чётном \\(n\\) ещё \\(F=n^2/4\\), и все эти значения уже реализованы.",
