        "title": "Условие",
        "text": "Плоскость разбита на единичные квадраты двумя семействами параллельных прямых, образующими бесконечную решетку. Каждый единичный квадрат окрашен в один из 1201 цветов так, что ни один прямоугольник периметра 100 не содержит двух квадратов одного цвета. Докажите, что ни один прямоугольник размера \\(1\\times 1201\\) или \\(1201\\times 1\\) не содержит двух квадратов одного цвета. Здесь предполагается, что стороны всех прямоугольников лежат на прямых решетки.",
