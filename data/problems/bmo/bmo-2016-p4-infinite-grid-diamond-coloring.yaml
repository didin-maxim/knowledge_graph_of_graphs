  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Расширенное решение через замощение алмазами",
      "text": "Будем отождествлять единичную клетку с целочисленной точкой, являющейся ее центром. Для точки \\(a\\) обозначим через \\(D(a)=\\{b\\in\\mathbb Z^2: |b-a|_1\\le 24\\}\\) алмаз радиуса 24.\n\nЕсли две клетки с центрами \\(u\\) и \\(v\\) лежат в одном таком алмазе, то \\(|u-v|_1\\le 48\\). Минимальный прямоугольник решетки, содержащий эти клетки, имеет сумму сторон не больше \\(|u-v|_1+2\\le 50\\), поэтому его можно поместить в прямоугольник периметра 100. Значит, в одном алмазе нет двух клеток одного цвета. Но в алмазе ровно \\(1+4(1+2+\\dots+24)=1201\\) клеток, то есть столько же, сколько цветов, поэтому каждый алмаз содержит каждый цвет ровно один раз.\n\nЗафиксируем один цвет, например зеленый, и пусть \\(A\\) — множество центров зеленых клеток. Алмазы \\(D(a)\\), \\(a\\in A\\), покрывают всю решетку: для любой клетки \\(b\\) алмаз \\(D(b)\\) содержит зеленую клетку \\(a\\), откуда \\(b\\in D(a)\\). Два таких алмаза не пересекаются, потому что из \\(b\\in D(a_1)\\cap D(a_2)\\) следовало бы, что \\(a_1\\) и \\(a_2\\) лежат в одном алмазе \\(D(b)\\), где не бывает двух зеленых клеток. Итак, центры одного цвета дают однослойное замощение решетки алмазами радиуса 24.\n\nОпишем это замощение. Возьмем один алмаз. Клетки сразу за одной его стороной образуют диагональ длины 25; закрыть ее без перекрытий может только один соседний алмаз, приставленный всей стороной. Иначе около конца диагонали останется незакрытая клетка или соседний алмаз зайдет внутрь уже занятого. Поэтому соседние центры отличаются, с точностью до поворота и отражения, на векторы \\((25,24)\\) и \\((24,-25)\\). После выбора ориентации у одного соседа все дальнейшие приставления вынуждены: несовместимый выбор вокруг общей вершины четырех алмазов немедленно дает зазор или перекрытие. Индукцией по расстоянию от исходного алмаза получаем, что все центры одного цвета имеют вид \\(a_0+m(25,24)+n(24,-25)\\), \\(m,n\\in\\mathbb Z\\), после возможного поворота или отражения всей картины. Обратно, такая решетка центров действительно задает однослойное замощение, так как ее фундаментальная площадь равна \\(|25\\cdot(-25)-24\\cdot24|=1201\\), а каждый алмаз содержит 1201 клетку.\n\nВ этой решетке центров наименьший ненулевой горизонтальный вектор равен \\((1201,0)\\): действительно, \\(25(25,24)+24(24,-25)=(1201,0)\\), а из \\(m(25,24)+n(24,-25)=(t,0)\\) следует \\(24m=25n\\), значит \\(m=25s\\), \\(n=24s\\) и \\(t=1201s\\). Тот же вычислительный аргумент после поворота на \\(90^\\circ\\) показывает, что наименьший ненулевой вертикальный вектор имеет длину 1201. Следовательно, две зеленые клетки в одной строке или одном столбце могут отстоять друг от друга только на расстояние, кратное 1201. В прямоугольнике \\(1\\times1201\\) или \\(1201\\times1\\) расстояние между двумя клетками вдоль строки или столбца меньше 1201, поэтому двух зеленых клеток там нет. То же рассуждение верно для каждого цвета, значит все 1201 клеток такого прямоугольника имеют попарно различные цвета.",
