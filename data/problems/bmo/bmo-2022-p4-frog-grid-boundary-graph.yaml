  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Решение через граф границ",
      "text": "Ответ равен \\(\\dfrac{(n+1)^2}{4}+1\\).\n\nРассмотрим граф границ \\(G\\). Его вершины - \\((n+1)^2\\) узлов решетки, являющихся углами клеток. Две соседние по решетке вершины соединяем ребром тогда и только тогда, когда соответствующий отрезок является общей стороной двух клеток разных цветов. Обозначим через \\(N\\) число нетривиальных, то есть содержащих хотя бы одно ребро, компонент графа \\(G\\).\n\nКомпоненты графа границ разделяют монохроматические области. Если начать с одной области и добавлять нетривиальные компоненты границы по одной, каждая новая компонента может увеличить число областей не более чем на 1. Поэтому число монохроматических областей не превосходит \\(N+1\\), а одной лягушки в каждой такой области всегда достаточно.\n\nОценим \\(N\\). В угловых вершинах решетки степень в \\(G\\) равна 0. В неугловой вершине на границе доски степень равна 0 или 1. Во внутренней вершине степень четна, то есть равна 0, 2 или 4: при обходе четырех прилегающих клеток цвет меняется четное число раз.\n\nПокажем, что нетривиальные компоненты графа \\(G\\) вместе содержат не меньше \\(4N-4\\) вершин. Если компонента не содержит граничных вершин, то все ее вершины имеют степень 2 или 4; в квадратной решетке нет треугольников, значит такая компонента содержит не меньше четырех вершин. Если компонента содержит граничную вершину, то ее концы на границе имеют степень 1, а все внутренние вершины имеют степень 2 или 4. Компонента с менее чем четырьмя вершинами может возникнуть только возле угла доски: иначе два граничных конца нельзя соединить одним или двумя ребрами решетки, не нарушив четность степени во внутренней вершине. Таких исключительных компонент не больше четырех, по одной возле каждого угла. Следовательно, по сравнению с оценкой по четыре вершины на компоненту можно потерять не больше четырех вершин, то есть всего занято не менее \\(4N-4\\) вершин.\n\nКроме того, четыре угловые вершины решетки имеют степень 0 и не входят ни в одну нетривиальную компоненту. Поэтому общее число вершин решетки не меньше\n\\[\n(4N-4)+4=4N.\n\\]\nОтсюда\n\\[\nN\\le \\frac{(n+1)^2}{4}.\n\\]\nЗначит, в любой раскраске достаточно\n\\[\n\\frac{(n+1)^2}{4}+1\n\\]\nлягушек.\n\nОсталось привести раскраску, для которой меньше нельзя. Пусть \\(n=2m+1\\), и пронумеруем клетки парами \\((x,y)\\), где \\(x,y\\in\\{0,1,\\ldots,2m\\}\\). Покрасим в красный цвет клетки, у которых обе координаты четны, а все остальные клетки покрасим в синий. Красных клеток ровно \\((m+1)^2=(n+1)^2/4\\), и никакие две из них не имеют общей вершины, значит каждая красная клетка образует отдельную компоненту доступности. Все синие клетки образуют одну компоненту: между ними можно двигаться по клеткам, имеющим общую вершину, обходя изолированные красные клетки. Поэтому компонент доступности ровно \\((n+1)^2/4+1\\), и столько лягушек действительно необходимо.",
