        "id": "stmt-graph-boundary",
        "text": "Пусть \\(n\\ge 3\\) нечётно. Клетки доски \\(n\\times n\\) окрашены в красный и синий цвета. Рассмотрим граф \\(B\\) на всех \\((n+1)^2\\) вершинах решётки, образующих углы клеток. Две соседние по решётке вершины соединены ребром тогда и только тогда, когда общая сторона между ними разделяет две клетки разных цветов. Нетривиальной компонентой графа \\(B\\) назовём компоненту, содержащую хотя бы одно ребро. Найдите наибольшее возможное число нетривиальных компонент графа \\(B\\), а значит и наибольшее возможное число \\(k\\), для которого в любой раскраске достаточно поставить по одной лягушке в каждую монохроматическую область.",
