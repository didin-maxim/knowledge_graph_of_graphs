      "id": "idea-boundary-components",
      "title": "Граф границ считает монохроматические области",
      "text": "Границы между красными и синими клетками образуют граф на вершинах решётки. Каждая его нетривиальная компонента добавляет одну новую монохроматическую область, поэтому число областей равно числу нетривиальных компонент плюс один.",
