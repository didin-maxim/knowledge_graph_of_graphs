        "id": "stmt-original",
        "title": "Условие",
        "text": "Дана доска \\(n\\times n\\) из единичных клеток, где \\(n\\ge 3\\) нечётно. Каждая клетка окрашена в красный или синий цвет. Лягушка может перепрыгнуть из клетки в клетку тогда и только тогда, когда клетки одного цвета и имеют общую вершину. После раскраски нужно поставить \\(k\\) лягушек так, чтобы из клеток с лягушками по разрешённым прыжкам можно было добраться до любой клетки доски. Найдите наименьшее \\(k\\), которое гарантированно достаточно при любой раскраске.",
        "source_id": "src-bmo-2022-official",
