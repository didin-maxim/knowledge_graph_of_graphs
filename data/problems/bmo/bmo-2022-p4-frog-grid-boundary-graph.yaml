  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Решение через граф границ",
      "text": "Ответ: \\(\\dfrac{(n+1)^2}{4}+1\\).\n\nБудем считать не отдельные клетки, а компоненты достижимости: одну лягушку надо поставить в каждую компоненту графа, где вершины - клетки, а рёбра соединяют одноцветные клетки с общей вершиной. Поэтому нужно найти наибольшее возможное число таких одноцветных компонент.\n\nПостроим граф границ \\(H\\). Его вершины - \\((n+1)^2\\) узлов решётки, то есть углы клеток. Ребро графа \\(H\\) - единичный отрезок, являющийся общей стороной двух клеток разных цветов. Внешнюю границу доски в \\(H\\) не включаем. Пусть \\(N\\) - число нетривиальных компонент \\(H\\), то есть компонент, содержащих хотя бы одно ребро.\n\nСначала свяжем \\(N\\) с числом одноцветных областей. Если границ разных цветов нет, вся доска является одной областью в смысле ходов лягушки: любые две клетки можно соединить цепочкой соседних по стороне клеток, а такие клетки тем более имеют общую вершину. Теперь добавим компоненты графа границ по одной. Одна связная компонента границы может разрезать уже существующую область не более чем на две части, поэтому увеличивает число одноцветных областей не более чем на 1. Значит, число компонент достижимости клеток не превосходит \\(N+1\\). Это именно та величина, которую надо ограничить сверху.\n\nОценим \\(N\\). Степени вершин графа \\(H\\) имеют специальный вид. У четырёх углов доски степень 0, потому что через угол доски не проходит общая сторона двух клеток. У неугловой вершины на внешней стороне степень равна 0 или 1: из неё внутрь доски выходит только один возможный граничный отрезок. У внутренней вершины степень равна 0, 2 или 4. Действительно, вокруг такой вершины лежат четыре клетки; при обходе этих четырёх клеток по кругу цвет меняется чётное число раз, и именно число смен цвета равно степени вершины в \\(H\\).\n\nДокажем ключевую оценку: все нетривиальные компоненты \\(H\\) вместе содержат не меньше \\(4N-4\\) вершин. Компонента без вершин на внешней стороне доски имеет все степени чётными и не содержит вершин степени 1. Если она нетривиальна, то в ней есть цикл; в квадратной решётке самый короткий цикл имеет длину 4, значит такая компонента содержит хотя бы 4 вершины.\n\nПусть теперь компонента касается внешней стороны доски. Вершины степени 1 в ней могут быть только на внешней стороне, а число таких вершин чётно. Если компонента содержит меньше четырёх вершин, то она не может содержать цикл и должна быть путём из трёх вершин: две концевые вершины лежат на внешней стороне, а средняя вершина внутренняя. Такой путь возможен только около угла доски: он состоит из двух внутренних сторон одной угловой клетки, выходящих к двум соседним сторонам доски. Вдали от угла две граничные вершины на расстоянии 2 или меньше лежали бы на одной стороне доски, и путь между ними вместе с отрезком внешней стороны ограничивал бы область без клеток или заставлял бы в некоторой внутренней вершине появиться нечётную степень, что невозможно. Следовательно, компонент с менее чем четырьмя вершинами не больше четырёх - по одной около каждого угла, и каждая из них имеет ровно 3 вершины.\n\nИтак, если бы каждая нетривиальная компонента давала по 4 вершины, получилось бы \\(4N\\). Четыре исключительные угловые компоненты могут уменьшить этот счёт суммарно не более чем на 4, поэтому нетривиальные компоненты содержат не меньше \\(4N-4\\) вершин. Кроме того, четыре угловые вершины самой решётки имеют степень 0 и не входят ни в одну нетривиальную компоненту. Поэтому общее число узлов решётки удовлетворяет\n\\[\n(n+1)^2 \\ge (4N-4)+4=4N.\n\\]\nОтсюда\n\\[\nN\\le \\frac{(n+1)^2}{4}.\n\\]\nСледовательно, при любой раскраске достаточно не более чем\n\\[\nN+1\\le \\frac{(n+1)^2}{4}+1\n\\]\nлягушек.\n\nОсталось показать, что меньше гарантировать нельзя. Пусть \\(n=2m+1\\). Пронумеруем клетки парами \\((x,y)\\), где \\(x,y\\in\\{0,1,\\ldots,2m\\}\\). Покрасим в красный цвет ровно клетки, у которых обе координаты чётны, а все остальные клетки - в синий. Красных клеток \\((m+1)^2=(n+1)^2/4\\). Никакие две красные клетки не имеют общей вершины: по крайней мере по одной координате они отличаются на 2 или больше. Значит, каждая красная клетка образует отдельную компоненту достижимости.\n\nВсе синие клетки образуют одну компоненту. Действительно, каждая синяя клетка имеет хотя бы одну нечётную координату. По клеткам с фиксированной нечётной строкой можно двигаться вдоль всей строки, а по клеткам с фиксированным нечётным столбцом - вдоль всего столбца; эти строки и столбцы пересекаются и соединяют все синие клетки в одну сеть ходов через общую сторону, а значит и через общую вершину. Поэтому в этой раскраске компонент ровно\n\\[\n\\frac{(n+1)^2}{4}+1.\n\\]\nСтолько лягушек действительно необходимо, и ответ доказан.",
