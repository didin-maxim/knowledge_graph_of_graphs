      "id": "idea-degree-bounding",
      "title": "Оценка числа компонент по степеням вершин",
      "text": "У угловых вершин степень 0, у граничных - 0 или 1, у внутренних - 0, 2 или 4. Отсюда каждая нетривиальная компонента содержит как минимум четыре вершины, кроме не более чем четырёх угловых исключений, и получается оценка на число компонент.",
