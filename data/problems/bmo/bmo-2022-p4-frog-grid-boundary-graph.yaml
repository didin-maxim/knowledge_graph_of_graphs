  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Сжатое официальное решение",
      "text": "Строим граф \\(G\\) на всех \\((n+1)^2\\) вершинах решётки. Две вершины соединяем, если они соседние по решётке и разделяют две клетки разных цветов. Тогда нетривиальные компоненты \\(G\\) в точности являются границами между монохроматическими областями, а каждая такая компонента при добавлении увеличивает число областей на 1. Значит число областей, а значит и минимальное число лягушек, равно \\(N+1\\), где \\(N\\) - число нетривиальных компонент \\(G\\). По локальному анализу степеней: углы имеют степень 0, вершины на границе - 0 или 1, внутренние - 0, 2 или 4; каждая нетривиальная компонента содержит не менее четырёх вершин, кроме не более чем четырёх компонент вокруг углов, которые могут содержать по три. Отсюда \\(4N-4+4\\le (n+1)^2\\), то есть \\(N\\le (n+1)^2/4\\). Следовательно, всегда достаточно \\((n+1)^2/4+1\\) лягушек. Равенство достигается шахматно-подобной конструкцией: красными делаются клетки с обеими чётными координатами, остальные синие.",
