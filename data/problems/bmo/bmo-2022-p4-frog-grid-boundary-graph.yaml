        "text": "Официальное решение строит граф на вершинах решётки: ребро проводится вдоль стороны клетки тогда и только тогда, когда по разные стороны от неё стоят клетки разных цветов. Компоненты этого графа кодируют границы монохроматических областей, а число нужных лягушек равно числу таких компонент плюс один.",
