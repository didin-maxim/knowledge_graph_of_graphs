    {
      "id": "sol-official-compressed",
      "title": "Решение через граф границ",
      "text": "Ответ равен \\(\\dfrac{(n+1)^2}{4}+1\\).\n\nРассмотрим граф границ \\(G\\). Его вершины - \\((n+1)^2\\) узлов решетки, являющихся углами клеток. Две соседние по решетке вершины соединяем ребром тогда и только тогда, когда соответствующий отрезок является общей стороной двух клеток разных цветов. Обозначим через \\(N\\) число нетривиальных, то есть содержащих хотя бы одно ребро, компонент графа \\(G\\).\n\nКомпоненты графа границ разделяют доску на монохроматические области. Две клетки одного цвета, лежащие в одной такой области, достижимы друг из друга прыжками через общую сторону или вершину: внутри области можно пройти от клетки к клетке, не пересекая границу разных цветов. Поэтому одной лягушки в каждой монохроматической области достаточно. Если начать с доски без внутренних границ, а затем добавлять нетривиальные компоненты графа границ по одной, каждая новая компонента может разрезать уже имеющуюся область не более чем на две части, то есть увеличить число областей не более чем на 1. Следовательно, число монохроматических областей не превосходит \\(N+1\\).\n\nОценим \\(N\\). В угловых вершинах решетки степень в \\(G\\) равна 0, потому что через угол доски не проходит общая сторона двух клеток. В неугловой вершине на границе доски степень равна 0 или 1. Во внутренней вершине степень четна, то есть равна 0, 2 или 4: при обходе четырех прилегающих клеток по кругу цвет меняется четное число раз.\n\nПокажем, что нетривиальные компоненты графа \\(G\\) вместе содержат не меньше \\(4N-4\\) вершин. Если компонента не содержит граничных вершин, то все ее вершины имеют степень 2 или 4. Такая компонента содержит цикл, а в квадратной решетке нет циклов длины 3, значит в ней не меньше четырех вершин.\n\nТеперь пусть компонента имеет граничные вершины. Все её граничные вершины степени 1 являются концами путей, а внутренние вершины имеют чётную степень. Компонента с одной, двумя или тремя вершинами может быть только коротким путём между двумя граничными вершинами; иначе появилась бы внутренняя вершина нечётной степени или цикл длины меньше 4. Такой короткий путь между двумя сторонами доски возможен только в окрестности одного из четырёх углов: вдали от угла две граничные вершины на расстоянии 1 или 2 по решётке лежат на одной стороне, а путь между ними вместе с отрезком границы заключал бы область без клеток или заставлял бы цвет меняться нечётное число раз у внутренней вершины. Поэтому исключительных компонент, где меньше четырёх вершин, не больше четырёх, по одной возле каждого угла. По сравнению с грубой оценкой \\(4\\) вершины на компоненту каждая такая исключительная компонента может уменьшить общий счёт не более чем на 1, значит всего нетривиальные компоненты содержат не менее \\(4N-4\\) вершин.\n\nКроме того, четыре угловые вершины решетки имеют степень 0 и не входят ни в одну нетривиальную компоненту. Поэтому общее число вершин решетки не меньше\n\\[\n(4N-4)+4=4N.\n\\]\nОтсюда\n\\[\nN\\le \\frac{(n+1)^2}{4}.\n\\]\nЗначит, в любой раскраске достаточно\n\\[\n\\frac{(n+1)^2}{4}+1\n\\]\nлягушек.\n\nОсталось привести раскраску, для которой меньше нельзя. Пусть \\(n=2m+1\\), и пронумеруем клетки парами \\((x,y)\\), где \\(x,y\\in\\{0,1,\\ldots,2m\\}\\). Покрасим в красный цвет клетки, у которых обе координаты четны, а все остальные клетки покрасим в синий. Красных клеток ровно \\((m+1)^2=(n+1)^2/4\\), и никакие две из них не имеют общей вершины, значит каждая красная клетка образует отдельную компоненту доступности. Все синие клетки образуют одну компоненту: между соседними красными клетками всегда есть синяя клетка, а вдоль строк и столбцов с нечётной координатой можно соединять все синие клетки ходами через общую сторону или вершину. Поэтому компонент доступности ровно \\((n+1)^2/4+1\\), и столько лягушек действительно необходимо.",
