  "ideas": [
    {
      "id": "idea-boundary-components",
      "title": "Граф границ считает монохроматические области",
      "text": "Границы между красными и синими клетками образуют граф на вершинах решётки. Каждая его нетривиальная компонента добавляет одну новую монохроматическую область, поэтому число областей равно числу нетривиальных компонент плюс один.",
      "tags": [
        "connectivity"
      ],
      "status": "needs_human_review"
    },
    {
      "id": "idea-degree-bounding",
      "title": "Оценка числа компонент по степеням вершин",
      "text": "У угловых вершин степень 0, у граничных - 0 или 1, у внутренних - 0, 2 или 4. Отсюда каждая нетривиальная компонента содержит как минимум четыре вершины, кроме не более чем четырёх угловых исключений, и получается оценка на число компонент.",
      "tags": [
        "double_counting"
      ],
      "status": "needs_human_review"
    }
  ],
  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Сжатое официальное решение",
      "text": "Строим граф \\(G\\) на всех \\((n+1)^2\\) вершинах решётки. Две вершины соединяем, если они соседни по решётке и разделяют две клетки разных цветов. Тогда нетривиальные компоненты \\(G\\) в точности являются границами между монохроматическими областями, а каждая такая компонента при добавлении увеличивает число областей на 1. Значит число областей, а значит и минимальное число лягушек, равно \\(N+1\\), где \\(N\\) - число нетривиальных компонент \\(G\\). По локальному анализу степеней: углы имеют степень 0, вершины на границе - 0 или 1, внутренние - 0, 2 или 4; каждая нетривиальная компонента содержит не менее четырёх вершин, кроме не более чем четырёх компонент вокруг углов, которые могут содержать по три. Отсюда \\(4N-4+4\\le (n+1)^2\\), то есть \\(N\\le (n+1)^2/4\\). Следовательно, всегда достаточно \\((n+1)^2/4+1\\) лягушек. Равенство достигается шахматно-подобной конструкцией: красными делаются клетки с обеими чётными координатами, остальные синие.",
