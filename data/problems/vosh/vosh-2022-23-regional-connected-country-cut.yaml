        "id": "stmt-original",
        "title": "11.10",
        "text": "В стране \\(2n\\) городов, где \\(n\\) — натуральное число. Некоторые города соединены двусторонними беспосадочными авиалиниями, причём из любого города можно попасть в любой другой, возможно с пересадками. Президент хочет разделить страну на две области и включить каждый город в одну из двух областей. При этом авиалинии разделятся на \\(k\\) межобластных и \\(m\\) внутриобластных. Докажите, что президент может добиться неравенства \\(k-m\\ge n\\).",
