  "solutions": [
    {
      "id": "sol-induction-two-vertices",
      "title": "Индукция по числу пар вершин",
      "text": "Будем доказывать графовую формулировку индукцией по \\(n\\). При \\(n=1\\) связный граф на двух вершинах имеет одно ребро, и разные цвета его концов дают разность \\(1\\).\n\nПусть \\(n>1\\). Нам понадобится структурное утверждение: в любом связном графе хотя бы с тремя вершинами либо есть две смежные вершины, после удаления которых граф остаётся связным, либо есть две висячие вершины.\n\nСначала покажем, как из этого следует индукционный переход. Если найдены две смежные вершины \\(u,v\\), удаление которых сохраняет связность, то по индукции раскрасим остальные \\(2n-2\\) вершин так, чтобы разность между числом разноцветных и одноцветных рёбер была не меньше \\(n-1\\). Зафиксируем эту раскраску и рассмотрим только вклад рёбер, инцидентных \\(u\\) или \\(v\\), включая ребро \\(uv\\). Если красный и синий цвета обозначить числами \\(1\\) и \\(-1\\), то вклад ребра в разность равен минусу произведения цветов его концов. При фиксированной раскраске остальных вершин локальный вклад имеет вид\n\\[\nF(x,y)=-xy-Ax-By,\n\\]\nгде \\(x\\) и \\(y\\) — цвета \\(u\\) и \\(v\\), а \\(A\\), \\(B\\) — суммы цветов уже покрашенных соседей \\(u\\) и \\(v\\) соответственно. Среднее значение \\(F(x,y)\\) по четырём выборам \\(x,y\\in\\{1,-1\\}\\) равно \\(0\\). При этом все четыре значения не могут быть нулевыми: например, сумма значений при \\((x,y)=(1,1)\\) и \\((-1,-1)\\) равна \\(-2\\). Значит, среди четырёх докрасок есть положительный целый вклад, то есть вклад не меньше \\(1\\). Поэтому после добавления \\(u,v\\) разность становится не меньше \\((n-1)+1=n\\).\n\nЕсли же есть две висячие вершины, удалим их. Оставшийся граф связен, если исходный граф имеет больше двух вершин. По индукции красим его, а каждую висячую вершину красим в цвет, отличный от цвета её единственного соседа. Каждая из двух висячих вершин добавляет одно разноцветное ребро, поэтому разность тем более становится не меньше \\(n\\).\n\nОсталось доказать структурное утверждение. Возьмём остовное дерево исходного графа и подвесим его за любую невисячую вершину. Пусть \\(u\\) — вершина максимальной глубины, у которой есть дети; тогда все дети \\(v_1,\\dots,v_s\\) являются листьями этого остовного дерева.\n\nЕсли среди детей \\(u\\) есть две вершины, соединённые ребром исходного графа, то удаление этой смежной пары сохраняет связность: в остовном дереве исчезают только два листа. Если среди детей есть две вершины, которые висячие уже в исходном графе, получаем вторую альтернативу.\n\nОстаётся случай, когда среди детей \\(u\\) нет смежной пары и не более одного ребёнка является висячей вершиной исходного графа. Пусть возможный висячий ребёнок — \\(v_1\\). Для каждого \\(v_i\\) при \\(i\\ge2\\) выберем в исходном графе соседа, отличного от \\(u\\): такой сосед есть, потому что \\(v_i\\) не висячая. Этот сосед не может быть другим ребёнком \\(u\\), так как между детьми нет рёбер. Переподвесим каждую ветвь \\(v_i\\), \\(i\\ge2\\), к выбранному соседу. После этого вершины \\(u\\) и \\(v_1\\) можно удалить, и полученное дерево на оставшихся вершинах останется связным. Значит, в исходном графе есть две вершины, удаление которых сохраняет связность. Структурное утверждение и индукция доказаны.",
