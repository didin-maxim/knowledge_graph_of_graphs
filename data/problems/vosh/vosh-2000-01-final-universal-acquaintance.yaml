  "ideas": [
    {
      "id": "idea-grow-large-clique",
      "title": "Наращивание большой клики",
      "text": "Если уже есть k попарно знакомых людей при k<=n, то по условию найдётся новый человек, знакомый со всеми ними. Так строится клика из n+1 человек, а затем один из них оказывается знаком со всеми остальными.",
      "tags": [
        "ramsey_theory"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-complement-dominating-set",
      "title": "Доминирующее множество в дополнительном графе",
      "text": "Если универсальной вершины нет, то в дополнительном графе нет изолированных вершин. Тогда можно выбрать не более половины вершин, которые доминируют весь дополнительный граф; это даёт запрещённый набор из n человек.",
      "tags": [
        "extremal_choice"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-clique-extension",
      "title": "Опубликованное решение через попарно знакомых",
      "text": "Сначала построим \\(n+1\\) попарно знакомых людей. Двое знакомых существуют: иначе для любых \\(n\\) человек не нашлось бы человека, знакомого со всеми ними. Если уже построены \\(k\\le n\\) попарно знакомых, то по условию найдётся человек вне этой группы, знакомый со всеми её членами, и группу можно увеличить. Получим \\(n+1\\) попарно знакомых людей \\(A_1,\\ldots,A_{n+1}\\). Остальных людей ровно n. По условию существует человек, отличный от этих n, знакомый со всеми ними; он принадлежит множеству \\(A_1,\\ldots,A_{n+1}\\). Но внутри этого множества все попарно знакомы, значит этот человек знаком вообще со всеми.",
      "idea_ids": [
        "idea-grow-large-clique"
      ],
      "standard_idea_ids": [
        "induction",
        "pigeonhole_principle"
      ],
      "status": "ai_checked"
    },
    {
      "id": "sol-complement-domination",
      "title": "Через дополнительный граф",
      "text": "Рассмотрим дополнительный граф H: две вершины соединены в H, если соответствующие люди незнакомы. Нужно доказать, что в H есть изолированная вершина. Предположим противное: изолированных вершин в H нет. Возьмём в каждой компоненте H остовное дерево. В каждом таком дереве хотя бы две вершины; раскрасим его доли в два цвета и выберем меньшую долю. Объединение выбранных долей по всем компонентам имеет размер не больше половины общего числа вершин, то есть не больше n, и доминирует H: выбранные вершины доминируют сами себя, а каждая невыбранная вершина имеет соседа в выбранной доле своего дерева. Дополним это множество D произвольными вершинами до размера n. По условию для этих n людей найдётся человек x вне D, знакомый со всеми людьми из D; значит, в H у x нет соседей в D. Но D доминирует H, поэтому такая вершина x невозможна. Противоречие.",
      "idea_ids": [
        "idea-complement-dominating-set"
      ],
