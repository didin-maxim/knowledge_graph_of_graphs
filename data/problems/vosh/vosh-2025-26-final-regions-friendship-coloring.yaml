  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Сжатое официальное решение",
      "text": "Рассмотрим граф дружбы G. Регионы дают исходную раскраску вершин в n цветов; условие задачи означает, что в каждом простом цикле никакой цвет не занимает более половины вершин. Назовём такую раскраску приятной. Нужно построить правильную n-раскраску. Достаточно показать, что для любых двух цветов A и B можно перекрасить все вершины этих цветов снова в A и B так, чтобы оба цвета стали правильными, а приятность сохранилась. Рассмотрим индуцированный подграф H на вершинах цветов A и B. Любой простой цикл в H имеет не более половины вершин цвета A и не более половины цвета B, значит цветов на нём поровну и цикл чётный. Следовательно, H двудолен и его вершины можно правильно раскрасить в A и B. После такой перекраски оба цвета становятся правильными. Остаётся проверить сохранение приятности. Для любого простого цикла C в исходном графе условие могло испортиться только для цветов A или B; скажем, для A. Но в новой раскраске вершины цвета A на цикле не соседствуют, поэтому каждой такой вершине можно сопоставить следующую за ней по циклу вершину. Эти сопоставленные вершины различны и не имеют цвета A, так что вершин цвета A не больше половины длины цикла. Повторяя процедуру для разных пар цветов, поочерёдно делаем каждый цвет правильным и получаем правильную n-раскраску.",
