      "id": "idea-two-colors-give-bipartite-subgraph",
      "title": "Два цвета образуют двудольный подграф",
      "text": "Если смотреть только на вершины двух цветов A и B, то любой простой цикл в этом подграфе содержит не более половины вершин цвета A и не более половины вершин цвета B. Значит, на таком цикле цветов A и B поровну, так что цикл чётный. Следовательно, весь подграф двудолен.",
