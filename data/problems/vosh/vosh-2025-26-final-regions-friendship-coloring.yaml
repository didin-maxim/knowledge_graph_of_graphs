        "text": "На олимпиаду приехало несколько участников из n регионов, некоторые из них дружат (дружба всегда взаимна). Выяснилось, что для произвольной рассадки нескольких (хотя бы трёх) участников за круглым столом, при которой любые два соседа дружат, участников из каждого региона за столом окажется не более половины общего числа детей за столом. Докажите, что участников можно рассадить по n кабинетам так, чтобы любые два друга оказались в разных кабинетах.",
