  "solutions": [
    {
      "id": "sol-minimal-odd-cycle",
      "title": "Минимальный нечётный цикл",
      "text": "Переведём условие на язык графов: k-разбиваемость означает правильную k-раскраску. Так как граф не 3-раскрашиваем, он содержит нечётный цикл. Возьмём нечётный цикл C минимальной длины. У него нет хорд, иначе хорда разбила бы его на два меньших цикла, один из которых нечётный. Кроме того, любая вершина вне C смежна не более чем с двумя вершинами C: при трёх соседях либо возник бы меньший нечётный цикл, либо, в случае треугольника C, появилась бы клика из четырёх вершин. Пусть A — вершины C, а B — все остальные вершины. Подграф на A не двудолен. Если бы в B не было рёбер, то C можно было бы раскрасить тремя цветами так, чтобы только одна вершина получила третий цвет, а каждую вершину из B можно было бы покрасить в цвет, отличный от цветов её не более чем двух соседей на C. Получилась бы 3-раскраска всего графа, противоречие. Значит, в B есть ребро.",
