  "solutions": [
    {
      "id": "sol-rainbow-cycle-threshold",
      "title": "Порог через разноцветные циклы в \\(K_{n,n}\\)",
      "text": "Сначала построим раскраску в \\(2n-1\\) цветов без нужной четвёрки. Занумеруем строки числами \\(0,2,4,\\ldots,2n-2\\), а столбцы числами \\(1,3,5,\\ldots,2n-1\\). Последовательно красим все клетки строки или столбца с номером \\(0,1,\\ldots,2n-1\\) в цвет этого номера, каждый раз перекрашивая уже окрашенные клетки. В итоговой раскраске цвет 0 исчезает, а остальные \\(2n-1\\) цветов встречаются. Любые две строки и два столбца задают четыре клетки; среди этих четырёх линий есть линия, покрашенная последней, и две её клетки имеют одинаковый цвет. Значит, четырёх попарно разных цветов там нет.\n\nДокажем, что \\(2n\\) цветов всегда достаточно. Построим двудольный граф: одна доля соответствует строкам, другая - столбцам, а клетка становится ребром между своей строкой и своим столбцом, окрашенным в цвет клетки. Нужно найти разноцветный цикл длины 4.\n\nВыберем по одному ребру каждого цвета. Получился подграф на \\(2n\\) вершинах с не менее чем \\(2n\\) рёбрами, поэтому в нём есть цикл. Поскольку выбранные рёбра имеют разные цвета, в исходном графе есть хотя бы один разноцветный цикл.\n\nВозьмём среди всех разноцветных циклов кратчайший и запишем его как \\(a_1b_1a_2b_2\\ldots a_sb_sa_1\\), где \\(a_i\\) - вершины строковой доли, а \\(b_i\\) - вершины столбцовой доли. Если \\(s=2\\), это искомый четырёхцикл. Пусть \\(s>2\\). Рассмотрим ребро \\(a_1b_2\\), которое существует в полном двудольном графе. Если его цвет отличен от цветов трёх рёбер \\(a_1b_1\\), \\(b_1a_2\\), \\(a_2b_2\\), то \\(a_1b_1a_2b_2a_1\\) - разноцветный четырёхцикл. Иначе цвет ребра \\(a_1b_2\\) совпадает с одним из этих трёх цветов и потому не встречается на остальных рёбрах исходного разноцветного цикла; тогда цикл \\(a_1b_2a_3b_3\\ldots a_sb_sa_1\\) разноцветен и короче, что противоречит выбору. Значит, кратчайший разноцветный цикл имеет длину 4. Ответ: \\(k=2n\\).",
