        "id": "stmt-original",
        "title": "10.8",
        "text": "Дано натуральное число \\(n\\ge 2\\). Рассмотрим все покраски клеток доски \\(n\\times n\\) в \\(k\\) цветов такие, что каждая клетка покрашена ровно в один цвет, и все \\(k\\) цветов встречаются. При каком наименьшем \\(k\\) в любой такой покраске найдутся четыре окрашенные в четыре разных цвета клетки, расположенные в пересечении двух строк и двух столбцов?",
