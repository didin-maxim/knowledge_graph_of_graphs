        "id": "stmt-original",
        "title": "Фишки на доске 50×50",
        "text": "Петя поставил на доску 50×50 несколько фишек, в каждую клетку — не больше одной. Докажите, что Вася может поставить на свободные поля этой же доски не более 99 новых фишек, возможно ни одной, так, чтобы по-прежнему в каждой клетке стояло не больше одной фишки, а в каждой строке и каждом столбце оказалось чётное количество фишек.",
        "source_id": "src-problems-64633",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [],
        "distinct_from": [
