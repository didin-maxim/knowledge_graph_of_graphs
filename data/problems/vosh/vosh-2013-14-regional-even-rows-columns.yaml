  "ideas": [
    {
      "id": "idea-t-join-in-complement",
      "title": "T-соединение в дополнительном двудольном графе",
      "text": "Свободные клетки образуют дополнительный двудольный граф. Нужно выбрать в нём рёбра с заданным множеством нечётных вершин; это делается по деревьям компонент, а число выбранных рёбер не превосходит 99.",
