    "graph_hint_reformulations": [
      {
        "id": "stmt-graph-complement",
        "text": "Пусть \\(N\\) — положительное чётное число, а \\(G\\) — двудольный граф с долями \\(R\\) и \\(C\\), где \\(|R|=|C|=N\\). Обозначим через \\(H\\) его дополнение в полном двудольном графе \\(K_{N,N}\\). Пусть \\(T\\) — множество вершин, имеющих нечётную степень в \\(G\\); так как степень каждой вершины в \\(K_{N,N}\\) чётна, это то же самое множество вершин нечётной степени и в \\(H\\). Докажите, что в графе \\(H\\) существует подграф не более чем с \\(2N-1\\) рёбрами, множество вершин нечётной степени которого равно \\(T\\).",
