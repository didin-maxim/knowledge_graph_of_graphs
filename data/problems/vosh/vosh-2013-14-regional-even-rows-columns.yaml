  "solutions": [
    {
      "id": "sol-complement-forest-tjoin",
      "title": "Лес в графе свободных клеток",
      "text": "Построим двудольный граф: вершины одной доли — строки, другой — столбцы, а уже стоящие фишки — выбранные рёбра. Рассмотрим граф свободных клеток, то есть дополнение до полного двудольного графа \\(K_{50,50}\\). Так как степень каждой вершины в \\(K_{50,50}\\) равна 50, чётность степени вершины в графе свободных клеток совпадает с чётностью числа уже стоящих фишек в соответствующей строке или столбце. В каждой компоненте графа свободных клеток число вершин нечётной степени чётно. Возьмём в каждой нетривиальной компоненте остовное дерево и выберем в нём набор рёбер, у которого нечётные степени ровно в тех вершинах, где сейчас число фишек нечётно; это можно сделать, попарно соединяя такие вершины путями в дереве и беря симметрическую разность путей. Добавление соответствующих фишек исправит все чётности. Выбранных рёбер не больше, чем рёбер в лесу на 100 вершинах, то есть не больше 99.",
