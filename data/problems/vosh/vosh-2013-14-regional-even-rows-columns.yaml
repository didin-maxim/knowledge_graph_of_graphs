    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Пусть \\(N\\) — положительное чётное число. В двудольном графе с долями R и C, где \\(|R|=|C|=N\\), некоторые рёбра уже выбраны. Докажите, что можно добавить не более \\(2N-1\\) ещё не выбранных рёбер так, чтобы степень каждой вершины в получившемся выбранном подграфе была чётной.",
