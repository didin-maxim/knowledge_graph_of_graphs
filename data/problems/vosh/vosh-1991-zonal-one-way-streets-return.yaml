        "title": "Город с односторонними улицами",
        "text": "Город в форме многоугольника разделен улицами на кварталы-многоугольники. В вершинах многоугольников находятся площади. Каждая улица соединяет две площади и не проходит через другие площади. На каждой улице введено одностороннее движение так, что: а) на каждую площадь можно приехать; б) с каждой площади можно уехать; в) весь город можно объехать вдоль его границы. Доказать, что в городе имеется квартал, который можно объехать по улицам, его ограничивающим.",
