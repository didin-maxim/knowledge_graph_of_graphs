  "solutions": [
    {
      "id": "sol-ai-minimal-directed-cycle",
      "title": "ИИ-решение через минимальный ориентированный цикл",
      "text": "Рассмотрим граф города: площади - вершины, улицы - ориентированные ребра, кварталы - внутренние грани. Граница всего города по условию является ориентированным циклом, поэтому в графе есть хотя бы один ориентированный цикл. Выберем среди всех ориентированных циклов такой цикл \\(C\\), внутри которого находится минимальное число кварталов.\n\nДокажем, что \\(C\\) ограничивает один квартал. Предположим обратное. Удалим из внутренности \\(C\\) сами ребра цикла, оставив все вершины и ребра, лежащие строго внутри \\(C\\), а также внутренние ребра, инцидентные вершинам \\(C\\). Полученный граф внутри \\(C\\) не содержит ориентированных циклов: иначе такой цикл лежал бы внутри \\(C\\) и окружал бы меньше кварталов, чем \\(C\\), что противоречит выбору \\(C\\).\n\nКроме того, внутри \\(C\\) не может быть направленного пути из одной вершины цикла \\(C\\) в другую вершину цикла \\(C\\). Действительно, если есть путь из \\(A\\) в \\(B\\), то вместе с той дугой цикла \\(C\\), которая идет по направлению от \\(B\\) к \\(A\\), он образует ориентированный цикл, лежащий строго внутри \\(C\\) и снова окружающий меньше кварталов.\n\nТак как \\(C\\) не является границей одного квартала, внутри него есть хотя бы одна компонента оставшегося графа. Из многоугольности кварталов такая компонента прикреплена к циклу \\(C\\) как минимум в двух вершинах: иначе граница некоторого квартала проходила бы через одну и ту же площадь дважды и не была бы многоугольником. Рассмотрим одну такую компоненту. Она ациклична, значит в ней есть источник и сток. Источник не может быть внутренней вершиной, потому что тогда в исходном городе на эту площадь нельзя было бы приехать. Следовательно, все источники этой компоненты лежат на \\(C\\). Аналогично все ее стоки лежат на \\(C\\), иначе из внутренней вершины-стока нельзя было бы уехать.\n\nВозьмем источник этой компоненты и пойдем по направленным ребрам, пока это возможно; поскольку ориентированных циклов нет, путь закончится в стоке. Мы получили направленный путь внутри \\(C\\) из одной вершины цикла \\(C\\) в другую. Эти вершины различны, так как путь непустой и компонента ациклична. Но выше мы доказали, что такого пути быть не может. Противоречие показывает, что выбранный минимальный ориентированный цикл \\(C\\) действительно является границей одного квартала. Значит этот квартал можно объехать по ограничивающим его улицам.",
