      {
        "id": "stmt-original",
        "title": "Рейсы разных авиакомпаний",
        "text": "В некоторой стране между городами существует авиационное сообщение. В стране \\(2k+1\\) авиакомпания, причем первая осуществляет один рейс, вторая - два рейса и т. д. Каждый рейс связывает между собой два города. В стране существует закон, согласно которому из каждого города не может выполняться более одного рейса каждой авиакомпании. Компании решили по-новому поделить между собой все рейсы так, чтобы каждая авиакомпания осуществляла одинаковое число рейсов. Докажите, что это можно сделать, не нарушая закона.",
        "source_id": "src-kvant-digital-1992-10-vseros-math",
        "status": "source_verified",
        "self_contained": {
