  "ideas": [
    {
      "id": "idea-airlines-edge-coloring",
      "title": "Авиакомпании как цвета ребер",
      "text": "Города являются вершинами, рейсы - ребрами, а авиакомпании - цветами. Закон о не более чем одном рейсе каждой авиакомпании из города означает правильность реберной раскраски: у одной вершины нет двух инцидентных ребер одного цвета.",
      "tags": [
        "graph_model",
        "coloring"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-two-color-alternating-path",
      "title": "Выравнивание двух цветов по чередующейся цепи",
      "text": "Если один цвет встречается чаще другого, то в подграфе из ребер этих двух цветов компоненты являются чередующимися путями или циклами. Циклы содержат поровну ребер двух цветов, поэтому избыток одного цвета обнаруживается на пути; обмен цветов на таком пути уменьшает дисбаланс на 1.",
      "tags": [
        "coloring",
        "augmenting_path"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-kvant-m1367-two-color-exchange",
      "title": "Опубликованное решение М1367 через двухцветные цепи",
      "text": "Всего рейсов \\(1+2+\\cdots+(2k+1)=(2k+1)(k+1)\\), значит в новой раскладке каждая авиакомпания должна получить по \\(k+1\\) рейсу. Пока есть авиакомпания \\(A\\) с числом рейсов больше \\(k+1\\) и авиакомпания \\(B\\) с числом рейсов меньше \\(k+1\\), рассмотрим только рейсы этих двух компаний.\n\nИзобразим рейсы \\(A\\) красными ребрами, а рейсы \\(B\\) синими. Из-за закона в каждой вершине выходит не более одного красного и не более одного синего ребра, поэтому двухцветный подграф распадается на чередующиеся циклы и цепи. В каждом цикле красных и синих ребер поровну. Так как у \\(A\\) ребер больше, чем у \\(B\\), существует цепь, в которой красных ребер на одно больше, чем синих. Поменяем на этой цепи красный и синий цвета местами. Правильность раскраски сохраняется: в вершинах цепи по-прежнему инцидентно не более одного ребра каждого из двух цветов, а остальные цвета не затронуты. При этом число рейсов \\(A\\) уменьшается на 1, а число рейсов \\(B\\) увеличивается на 1.\n\nПовторяя такой обмен, каждый раз уменьшаем суммарный избыток компаний, у которых больше \\(k+1\\) рейсов. Процесс конечен, и в конце у всех \\(2k+1\\) компаний ровно по \\(k+1\\) рейсу; закон при всех обменах сохранялся.",
