    "graph_theory": [
      {
        "id": "stmt-graph",
        "title": "Графовая формулировка",
        "text": "Пусть ребра конечного мультиграфа без петель правильно раскрашены в \\(2k+1\\) цветов: в каждой вершине любые два инцидентных ребра имеют разные цвета, а цвет \\(i\\) встречается ровно \\(i\\) раз. Докажите, что эти же ребра можно правильно перекрасить теми же \\(2k+1\\) цветами так, чтобы каждый цвет встречался ровно \\(k+1\\) раз.",
