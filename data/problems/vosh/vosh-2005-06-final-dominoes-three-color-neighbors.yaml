        "id": "stmt-original",
        "title": "Квадрат 3000 на 3000 разбит на доминошки",
        "text": "Квадрат \\(3000\\times3000\\) произвольным образом разбит на доминошки, то есть прямоугольники \\(1\\times2\\) клетки. Докажите, что доминошки можно раскрасить в три цвета так, чтобы доминошек каждого цвета было поровну и у каждой доминошки было не более двух соседей ее цвета. Доминошки считаются соседними, если они содержат клетки, соседние по стороне.",
        "source_id": "src-vosh-1993-2006-mccme-book",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": []
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "title": "Раскраска графа соседства доминошек",
        "text": "Пусть \\(G\\) — граф соседства доминошек произвольного разбиения доски \\(3000\\times3000\\): вершины \\(G\\) соответствуют доминошкам, а две вершины соединены, если соответствующие доминошки имеют соседние по стороне клетки. Докажите, что вершины \\(G\\) можно раскрасить в три цвета с равными размерами цветовых классов так, чтобы у каждой вершины было не более двух соседей своего цвета.",
