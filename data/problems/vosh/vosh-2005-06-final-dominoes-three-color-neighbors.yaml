      "id": "idea-color-by-black-cell",
      "title": "Красить доминошку по ее черной клетке",
      "text": "В шахматной раскраске каждая доминошка содержит ровно одну черную клетку. Если периодически раскрасить черные клетки в три цвета поровну и цвет доминошки взять по ее черной клетке, баланс цветов будет автоматическим.",
