  "solutions": [
    {
      "id": "sol-two-color-component-count",
      "title": "Двухцветные компоненты и двойной счет",
      "text": "Рассмотрим граф дружбы: вершины соответствуют детям, ребра - парам друзей. Имеющаяся раскраска футболок является правильной 7-раскраской графа, а 100 детей, которые не хотят менять цвет, считаем фиксированными вершинами.\n\nПредположим, что требуемая перекраска невозможна. Для любой пары цветов \\(i<j\\) рассмотрим подграф \\(G_{ij}\\), порожденный вершинами этих двух цветов. Пусть \\(c_{ij}\\), \\(v_{ij}\\), \\(e_{ij}\\) - соответственно число его компонент связности, вершин и ребер. Если бы \\(c_{ij}>100\\), то одна из компонент \\(G_{ij}\\) не содержала бы фиксированных вершин. Тогда в этой компоненте можно было бы поменять цвета \\(i\\) и \\(j\\) местами: внутри компоненты правильность сохраняется, к вершинам других цветов конфликтов не появляется, а фиксированные вершины не меняются. Это дало бы допустимую нетривиальную перекраску, противоречие. Значит, \\(c_{ij}\\le 100\\) для всех пар цветов.\n\nВ каждой компоненте связности с \\(x\\) вершинами есть хотя бы \\(x-1\\) ребро, поэтому \\(e_{ij}\\ge v_{ij}-c_{ij}\\ge v_{ij}-100\\). Просуммируем эти неравенства по всем \\(\\binom{7}{2}=21\\) парам цветов. Каждая вершина исходного графа входит ровно в 6 двухцветных подграфов, значит \\(\\sum v_{ij}=6\\cdot 10000=60000\\). Каждое ребро соединяет вершины разных цветов и поэтому входит ровно в один двухцветный подграф. Так как граф 11-регулярен на 10000 вершинах, ребер в нем \\(11\\cdot10000/2=55000\\), то есть \\(\\sum e_{ij}=55000\\).\n\nИз неравенств получаем \\(55000=\\sum e_{ij}\\ge \\sum v_{ij}-21\\cdot100=60000-2100=57900\\), что невозможно. Противоречие показывает, что допустимая нетривиальная перекраска существует.",
