  "solutions": [
    {
      "id": "sol-double-counting-triples",
      "title": "Двойной счёт троек",
      "text": "Для пары бюрократов из двух комиссий и бюрократа из третьей скажем, что пара похожа для третьего, если он знаком с обоими членами пары или незнаком с обоими. Просуммируем по всем парам из разных комиссий число людей из третьей комиссии, для которых эта пара похожа. В каждой тройке из трёх разных комиссий есть либо две связи знакомства, либо две связи незнакомства, поэтому хотя бы одна пара в этой тройке похожа для третьего участника. Значит, сумма не меньше \\(100^3\\). Всего пар комиссий и пар людей в них \\(3\\cdot100^2\\), поэтому для какой-то пары число похожих людей в третьей комиссии не меньше \\(100^3/(3\\cdot100^2)>33\\), то есть хотя бы 34. Среди этих 34 людей хотя бы 17 относятся к одному из двух типов: знакомы с обоими или незнакомы с обоими.",
