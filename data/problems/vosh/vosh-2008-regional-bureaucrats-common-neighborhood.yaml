      "id": "idea-count-similar-pairs-in-triples",
      "title": "Счёт похожих пар в тройках",
      "text": "В каждой тройке из разных комиссий найдётся пара, которая для третьего участника выглядит одинаково: он либо знаком с обоими, либо незнаком с обоими. Двойной счёт таких вкладов даёт большую общую окрестность или общую неокрестность.",
