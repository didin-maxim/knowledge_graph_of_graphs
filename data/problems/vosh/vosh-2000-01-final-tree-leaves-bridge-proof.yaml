      "title": "Максимизировать сумму расстояний в парах листьев",
      "text": "Разобьем листья на пары так, чтобы сумма расстояний между листьями в парах была максимальной. Если после добавления таких ребер старое ребро осталось мостом, две пары листьев по разные стороны разреза можно перепарить крест-накрест и увеличить сумму расстояний.",
