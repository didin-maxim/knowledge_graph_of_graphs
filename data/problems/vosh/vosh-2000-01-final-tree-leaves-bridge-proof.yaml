  "solutions": [
    {
      "id": "sol-max-distance-pairing",
      "title": "Официальное решение через максимальную сумму расстояний",
      "text": "Построим граф городов и дорог. Условие о единственном простом пути между любыми двумя городами означает, что это дерево; города степени 1 являются листьями. Обозначим листья через \\(A_1,\\ldots,A_{100}\\). Среди всех разбиений этих 100 листьев на 50 пар выберем такое, при котором сумма расстояний между листьями в парах максимальна. Добавим новые ребра между листьями каждой выбранной пары.\n\nДокажем, что после этого удаление любого ребра не нарушает связность. Новое ребро не может быть мостом, потому что его концы уже соединены старым путем в дереве. Предположим, что мостом осталось старое ребро \\(BC\\). После его удаления дерево распадается на две части. Каждая часть содержит хотя бы один лист исходного дерева. Кроме того, если новое ребро соединяло бы листья из разных частей, то оно сразу связывало бы эти части; значит все новые ребра целиком лежат внутри одной из двух частей. Поэтому в каждой части есть хотя бы одна выбранная пара листьев: пусть в одной части это \\(A_i,A_j\\), а в другой \\(A_k,A_m\\).\n\nВ дереве путь между листьями из разных частей обязан проходить через удаленное ребро \\(BC\\), а пути внутри одной части через него не проходят. Поэтому при перепаривании этих четырех листьев крест-накрест выполняется строгое неравенство \\(d(A_i,A_j)+d(A_k,A_m)<d(A_i,A_k)+d(A_j,A_m)\\). Тогда сумма расстояний в парах увеличилась бы, что противоречит выбору максимального разбиения. Значит старого моста тоже нет, и после удаления любой одной дороги граф остается связным.",
      "idea_ids": [
