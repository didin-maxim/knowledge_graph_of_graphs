        "id": "stmt-original",
        "title": "Страна с единственными путями между городами",
        "text": "В стране несколько городов, некоторые пары городов соединены дорогами, причем между любыми двумя городами существует единственный несамопересекающийся путь по дорогам. Известно, что в стране ровно 100 городов, из которых выходит по одной дороге. Докажите, что можно построить 50 новых дорог так, что после этого даже при закрытии любой дороги можно будет из любого города попасть в любой другой.",
