  "solutions": [
    {
      "id": "sol-exchange-rooted-forests",
      "title": "Обмен между соседними оптимальными сетями",
      "text": "Будем называть допустимые выборы k-сетями. Сначала опишем их структуру. Забудем ориентации выбранных дорог k-сети. Полученный неориентированный граф имеет не более k компонент, потому что в каждой компоненте есть выделенный город, достижимый из всех её вершин. С другой стороны, в графе N вершин и N - k рёбер, поэтому компонент не меньше k. Значит, компонент ровно k, каждая компонента является деревом, в каждой есть ровно один выделенный город, а все ориентированные рёбра в этой компоненте направлены к нему. В частности, из каждой невыделенной вершины выходит ровно одно выбранное ребро, а из выделенной — ни одного.\n\nДокажем ключевой шаг. Возьмём произвольную оптимальную (k+1)-сеть A с выделенными городами y_0, y_1, ..., y_k и произвольную оптимальную k-сеть B с выделенными городами x_1, ..., x_k. Среди городов y_0, ..., y_k выберем y_0 так, чтобы ни из одного x_i в сети A нельзя было доехать до y_0; такой выбор возможен, потому что k городов x_i лежат не более чем в k компонентах леса A, а корней y_0, ..., y_k всего k+1.\n\nПусть U — множество вершин, из которых в A можно доехать до y_0. Обозначим через \\(\\alpha\\) множество рёбер A, выходящих из U, а через \\(\\beta\\) — множество рёбер B, выходящих из U. В сети A множество U является деревом с корнем y_0, поэтому \\(|\\alpha|=|U|-1\\). В сети B ни одна вершина из U не является выделенной: если бы некоторый x_i лежал в U, то из него в A можно было бы доехать до y_0. Поэтому из каждой вершины U в сети B выходит ровно одно ребро, и \\(|\\beta|=|U|\\).\n\nРассмотрим D=(A\\setminus\\alpha)\\cup\\beta. В D ровно N-k рёбер, и из каждой вершины, кроме y_1, ..., y_k, выходит ровно одно ребро. Из вершины вне U путь по D ведёт как в A к одному из y_1, ..., y_k. Из вершины в U первый шаг по D берётся из \\(\\beta\\); далее путь либо выходит из U и затем доходит до одного из y_1, ..., y_k, либо остаётся внутри U навсегда. Последнее означало бы цикл среди рёбер \\(\\beta\\), невозможный в лесу B. Значит, D — допустимая k-сеть с корнями y_1, ..., y_k.\n\nАналогично C=(B\\setminus\\beta)\\cup\\alpha имеет N-k-1 рёбер и является допустимой (k+1)-сетью с корнями x_1, ..., x_k, y_0: если путь попадает в U, то по рёбрам \\(\\alpha\\) доходит до y_0, а если не попадает, то как в B доходит до одного из x_i. Суммарная стоимость C и D равна суммарной стоимости A и B. Так как A и B были оптимальны в своих классах, обе новые сети тоже оптимальны. Значит, из любой оптимальной (k+1)-сети можно удалить один выделенный город и получить оптимальную k-сеть с оставшимися выделенными городами.\n\nТеперь начнём с единственной N-сети, где выделены все города и рёбер нет, и будем применять доказанный шаг для k=N-1,N-2,...,1. Удаляя выделенные города по одному, получаем порядок удаления; пронумеруем города в обратном порядке. Тогда для каждого k остаётся оптимальная k-сеть с выделенными городами 1,2,...,k.",
