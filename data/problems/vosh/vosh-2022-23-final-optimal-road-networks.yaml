  "ideas": [
    {
      "id": "idea-k-network-is-rooted-forest",
      "title": "Любая допустимая k-сеть является корневым лесом",
      "text": "Если забыть ориентации, выбранные N - k рёбер дают ровно k компонент: не больше, потому что из каждой компоненты достижим выделенный город, и не меньше, потому что рёбер всего N - k. Поэтому каждая компонента — дерево с одним корнем, а все рёбра ориентированы к нему.",
