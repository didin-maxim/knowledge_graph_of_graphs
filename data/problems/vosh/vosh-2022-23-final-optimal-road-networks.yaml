        "trees"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-exchange-reachable-set",
      "title": "Обмен рёбрами из области притяжения нового корня",
      "text": "Сравниваются оптимальные k- и (k+1)-сети. Для множества вершин, которые в (k+1)-сети ведут к выбранному удаляемому корню, меняются исходящие из этого множества рёбра между двумя сетями. Получаются снова допустимые сети, а сумма стоимостей сохраняется, значит оптимальность не теряется.",
