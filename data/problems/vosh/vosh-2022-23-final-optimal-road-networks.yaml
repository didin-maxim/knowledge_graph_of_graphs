        "id": "stmt-original",
        "title": "k-оптимальная система городов и дорог",
        "text": "В стране N городов. В ней действует N(N - 1) дорог с односторонним движением: по одной дороге из X в Y для каждой упорядоченной пары городов X \\ne Y. У каждой дороги есть цена её обслуживания. Для данного k = 1, ..., N рассмотрим все способы выделить k городов и N - k дорог так, чтобы из каждого города можно было попасть в какой-то выделенный город, пользуясь только выделенными дорогами. Такую систему городов и дорог с наименьшей суммарной стоимостью обслуживания назовём k-оптимальной. Докажите, что города можно пронумеровать от 1 до N так, что при каждом k = 1, 2, ..., N существует k-оптимальная система дорог с выделенными городами 1, 2, ..., k.",
