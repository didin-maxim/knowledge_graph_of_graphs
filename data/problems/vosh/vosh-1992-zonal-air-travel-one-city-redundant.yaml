  "solutions": [
    {
      "id": "sol-published-unreachable-set",
      "title": "Множество городов, недостижимых из выбранного",
      "text": "Выберем город \\(A\\), из которого нельзя, перелетая из города в город, побывать во всех городах страны. Пусть \\(S\\) - множество городов, в которые нельзя попасть из \\(A\\). По условию это множество непусто. При этом \\(A\\notin S\\), так что \\(S\\) не совпадает со всем множеством городов.\n\nДокажем, что именно эти города могут отделиться. Предположим противное: из некоторого города \\(B\\), не входящего в \\(S\\), есть прямой авиарейс в город \\(C\\in S\\). Так как \\(B\\notin S\\), из \\(A\\) можно попасть в \\(B\\). Тогда, долетев из \\(A\\) до \\(B\\), а затем одним рейсом из \\(B\\) в \\(C\\), мы попали бы из \\(A\\) в город \\(C\\). Это противоречит определению множества \\(S\\).\n\nЗначит, ни в один город из \\(S\\) нельзя попасть прямым рейсом из города вне \\(S\\). Тем более туда нельзя попасть и цепочкой авиаперелетов из оставшейся части: первый момент входа такой цепочки в \\(S\\) дал бы прямой рейс из города вне \\(S\\) в город из \\(S\\). Следовательно, множество \\(S\\) можно объявить отделившейся частью.",
