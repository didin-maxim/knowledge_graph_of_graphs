        "title": "Отделившаяся часть городов",
        "text": "В стране несколько городов. Между некоторыми из них в одном направлении летают самолеты. Известно, что существует город, вылетев из которого нельзя, перелетая из города в город, побывать в каждом городе страны. Докажите, что часть городов может отделиться так, что ни в один из отделившихся городов нельзя будет попасть с помощью авиаперелетов ни из какого города оставшейся части.",
