  "solutions": [
    {
      "id": "sol-induction-good-graphs",
      "title": "Индукция по числу троек",
      "text": "Построим пример. Возьмём вершину \\(A\\), а остальные \\(99\\) вершин разобьём на \\(33\\) тройки и внутри каждой тройки проведём все три ребра. Затем соединим \\(A\\) со всеми остальными вершинами. Рёбер получилось \\(33\\cdot3+99=198\\). Если удалить \\(A\\), остаются исходные треугольники; если удалить другую вершину \\(B\\), то в её тройке можно заменить \\(B\\) на \\(A\\), а остальные тройки оставить прежними. Значит 198 достижимо.\n\nДокажем нижнюю оценку в общей форме. Пусть граф на \\(3k+1\\) вершинах хорош, то есть после удаления любой вершины оставшиеся вершины разбиваются на \\(k\\) треугольников. Докажем индукцией по \\(k\\), что в нём не меньше \\(6k\\) рёбер. При \\(k=1\\) после удаления любой вершины три оставшиеся должны образовывать треугольник, значит весь граф есть \\(K_4\\), и рёбер 6.\n\nПусть \\(k>1\\). Если степень каждой вершины хотя бы 4, то по лемме о рукопожатиях число рёбер не меньше \\((3k+1)\\cdot4/2=6k+2>6k\\). Иначе найдётся вершина \\(A\\) степени не более 3. У неё не может быть степени 0 или 1: если удалить вершину, отличную от \\(A\\), то \\(A\\) должна попасть в треугольник и иметь среди оставшихся хотя бы двух соседей. Значит степень \\(A\\) хотя бы 2. Если соседей ровно два, удалим одного из них; тогда у \\(A\\) останется только один сосед и она не сможет лежать в треугольнике. Поэтому степень \\(A\\) равна 3; обозначим её соседей через \\(B,C,D\\).\n\nПри удалении \\(B\\) вершина \\(A\\) должна попасть в треугольник с двумя своими оставшимися соседями, то есть \\(C\\) и \\(D\\) соединены. Аналогично, удаляя \\(C\\) и \\(D\\), получаем рёбра \\(BD\\) и \\(BC\\). Следовательно, вершины \\(A,B,C,D\\) образуют \\(K_4\\).\n\nПостроим новый граф: удалим \\(A,B,C,D\\), добавим одну вершину \\(X\\) и соединим \\(X\\) со всеми вершинами, которые в исходном графе были соединены хотя бы с одной из \\(B,C,D\\). Рёбра внутри \\(K_4\\) исчезли, поэтому число рёбер уменьшилось как минимум на 6. Покажем, что новый граф хорош на \\(3(k-1)+1\\) вершинах. Если удалена вершина \\(Y\\ne X\\), то в исходном графе после удаления \\(Y\\) есть разбиение на треугольники. В этом разбиении вершина \\(A\\) лежит в треугольнике вместе с двумя из \\(B,C,D\\); третья вершина из \\(B,C,D\\) лежит в некотором другом треугольнике. Удалим треугольник с \\(A\\) и заменим в другом треугольнике эту третью вершину на \\(X\\). По определению \\(X\\) смежна с двумя другими вершинами этого треугольника, поэтому получаем разбиение нового графа без \\(Y\\) на \\(k-1\\) треугольников. Если же удалён \\(X\\), рассмотрим исходный граф после удаления \\(D\\). Тогда \\(A\\), имея только соседей \\(B,C,D\\), обязана лежать в треугольнике с \\(B\\) и \\(C\\); удалив этот треугольник из разбиения, получаем нужное разбиение нового графа без \\(X\\).\n\nПо индукции новый граф имеет не меньше \\(6(k-1)\\) рёбер. Исходный имел как минимум на 6 рёбер больше, значит в нём не меньше \\(6k\\) рёбер. При \\(k=33\\) получаем нижнюю оценку \\(198\\), совпадающую с конструкцией.",
