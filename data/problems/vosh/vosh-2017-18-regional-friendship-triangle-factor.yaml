    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Назовём простой граф на \\(3k+1\\) вершинах хорошим, если после удаления любой вершины остальные \\(3k\\) вершин можно разбить на \\(k\\) троек, каждая из которых порождает треугольник. Докажите, что в хорошем графе не меньше \\(6k\\) рёбер, и что эта оценка достижима. В частности, при \\(k=33\\) минимум равен 198.",
