        "id": "stmt-original",
        "title": "11.9",
        "text": "В компании 100 детей, некоторые дети дружат, причём дружба всегда взаимна. Известно, что при выделении любого ребёнка оставшихся 99 детей можно разбить на 33 группы по три человека так, чтобы в каждой группе все трое попарно дружили. Найдите наименьшее возможное количество пар дружащих детей.",
        "source_id": "src-vosh-2017-18-regional-day2-official",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [],
        "distinct_from": [
          "stmt-graph"
        ]
