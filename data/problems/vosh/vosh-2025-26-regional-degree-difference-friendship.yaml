  "solutions": [
    {
      "id": "sol-degree-layers",
      "title": "Слои по степеням",
      "text": "Ответ: \\(1013\\cdot1012\\).\n\nОбозначим \\(k=1013\\), так что всего вершин \\(2k\\). Пример с \\(k(k-1)\\) рёбрами устроен так: одна вершина изолирована, остальные вершины разбиты на два множества \\(X\\) и \\(Y\\) размеров \\(k\\) и \\(k-1\\), и каждая вершина из \\(X\\) соединена со всеми вершинами из \\(Y\\). Тогда степени вершин из \\(X\\) равны \\(k-1\\), степени вершин из \\(Y\\) равны \\(k\\), поэтому условие выполнено, а число рёбер равно \\(k(k-1)\\).\n\nДокажем верхнюю оценку. Для каждого \\(i\\) пусть \\(X_i\\) — множество вершин степени \\(i\\). По условию любое ребро соединяет вершины из двух соседних слоёв \\(X_{i-1}\\) и \\(X_i\\). Пусть \\(m\\) — максимальная степень вершины.\n\nЕсли \\(m\\le k-1\\), то сумма степеней не превосходит \\((k-1)\\cdot 2k\\), поэтому \\(|E|\\le k(k-1)\\).\n\nЕсли \\(m\\ge k+1\\), возьмём вершину \\(A\\) степени \\(m\\). Все её соседи лежат в \\(X_{m-1}\\), значит \\(|X_{m-1}|\\ge m\\). Любая вершина \\(B\\in X_{m-1}\\) имеет \\(m-1\\) соседей, и все они лежат в \\(X_m\\cup X_{m-2}\\). Поэтому вместе слои \\(X_{m-1}\\), \\(X_m\\) и \\(X_{m-2}\\) содержат как минимум \\(m+(m-1)>2k\\) вершин, что невозможно. Значит, этот случай не бывает.\n\nОстаётся \\(m=k\\). Разобьём слои на две группы: \\(Y=X_k\\cup X_{k-2}\\cup X_{k-4}\\cup\\cdots\\) и \\(Z=X_{k-1}\\cup X_{k-3}\\cup X_{k-5}\\cup\\cdots\\). Каждое ребро идёт между \\(Y\\) и \\(Z\\). Считая рёбра по концам в \\(Y\\), получаем \\(|E|\\le k|Y|\\); считая по концам в \\(Z\\), получаем \\(|E|\\le (k-1)|Z|\\). Если \\(|Y|\\le k-1\\), то \\(|E|\\le k(k-1)\\). Если же \\(|Y|\\ge k\\), то \\(|Z|=2k-|Y|\\le k\\), и \\(|E|\\le (k-1)k\\). Во всех случаях больше \\(k(k-1)\\) рёбер быть не может.",
