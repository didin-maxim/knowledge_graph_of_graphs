        "text": "В большой компании у каждого человека ровно 100 знакомых в этой же компании; знакомство взаимно. У любого человека среди его 100 знакомых есть хотя бы одна пара людей, не знакомых друг с другом. При каком наибольшем \\(k\\) можно утверждать, что найдётся человек, среди 100 знакомых которого найдутся хотя бы \\(k\\) различных пар людей, в каждой из которых люди не знакомы друг с другом? Один человек может входить в несколько таких пар.",
