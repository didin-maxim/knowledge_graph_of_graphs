  "solutions": [
    {
      "id": "sol-official-neighborhood-intersection",
      "title": "Окрестности двух незнакомых людей",
      "text": "Ответ: \\(k=50\\).\n\nСначала покажем, что больше гарантировать нельзя. Рассмотрим 102 человека, разбитых на 51 пару. Люди внутри каждой пары не знакомы, а любые двое из разных пар знакомы. Тогда у каждого человека ровно 100 знакомых: это все люди, кроме него самого и его напарника. Среди этих 100 знакомых ровно 50 пар незнакомых людей, а именно оставшиеся 50 исходных пар. Значит, \\(k\\ge 51\\) не гарантируется.\n\nДокажем, что 50 гарантируется. Переведём условие в граф: вершины — люди, синие рёбра — знакомства, красные рёбра — незнакомства. Из каждой вершины выходит ровно 100 синих рёбер. Пусть \\(N(v)\\) — множество синих соседей вершины \\(v\\). По условию в каждом \\(N(v)\\) есть хотя бы одно красное ребро.\n\nПредположим противное: в каждом множестве \\(N(v)\\) не более 49 красных рёбер. Возьмём произвольную вершину \\(v\\). В \\(N(v)\\) найдутся две вершины \\(u_1,u_2\\), соединённые красным ребром. У вершины \\(u_1\\) ровно 100 синих соседей; один из них — \\(v\\), а \\(u_2\\) с ней не соединён синим ребром, поэтому среди 100 синих соседей \\(u_1\\) есть вершина \\(w\\), не лежащая в \\(N(v)\\cup\\{v\\}\\). Тогда \\(v\\) и \\(w\\) соединены красным ребром, но их синие окрестности пересекаются хотя бы по вершине \\(u_1\\).\n\nПусть \\(P=N(v)\\cap N(w)\\), \\(|P|=t\\), где \\(1\\le t\\le 100\\). Пусть \\(Q=N(v)\\setminus P\\), \\(R=N(w)\\setminus P\\). Обозначим через \\(a\\) число красных рёбер внутри \\(P\\), через \\(b\\) число красных рёбер между \\(P\\) и \\(Q\\), а через \\(c\\) число красных рёбер между \\(P\\) и \\(R\\).\n\nРассмотрим вершину \\(p\\in P\\). В множестве \\(P\\cup Q\\cup R\\) всего \\(200-t\\) вершин. Из \\(p\\) идут синие рёбра в \\(v\\) и \\(w\\), а всего синих рёбер из \\(p\\) ровно 100, значит внутри \\(P\\cup Q\\cup R\\) у неё не более 98 синих соседей. Поэтому из \\(p\\) идёт не менее \\((200-t)-1-98=101-t\\) красных рёбер к другим вершинам этого множества. Суммируя по всем \\(p\\in P\\), получаем \\(2a+b+c\\ge t(101-t)\\).\n\nС другой стороны, в \\(N(v)=P\\cup Q\\) есть по предположению не более 49 красных рёбер, значит \\(a+b\\le 49\\). Аналогично из \\(N(w)=P\\cup R\\) получаем \\(a+c\\le 49\\). Следовательно, \\(2a+b+c\\le 98\\). Но \\(t(101-t)\\ge 100\\) для всех целых \\(t\\) от 1 до 100, потому что минимум на этом отрезке достигается на концах. Противоречие. Значит, в некоторой окрестности есть хотя бы 50 красных рёбер, то есть хотя бы 50 пар незнакомых людей.",
