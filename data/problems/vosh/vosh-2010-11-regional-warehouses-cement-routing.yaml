  "solutions": [
    {
      "id": "sol-induction-leaf-routing",
      "title": "Индукция по числу складов",
      "text": "Сначала покажем, что \\(n-1\\) ходов в общем случае необходимы. Возьмём любую связную схему, поместим весь цемент в одну вершину \\(s\\), а в требуемом распределении зададим положительное количество цемента в каждой вершине. Тогда в каждую из остальных \\(n-1\\) вершин цемент должен хотя бы один раз зайти по некоторому ребру. Эти последние заходы происходят в разных рейсах, значит меньше \\(n-1\\) рейсов не хватит.\n\nДокажем достаточность индукцией по \\(n\\). При \\(n=1\\) делать ничего не нужно. Пусть \\(n>1\\). Так как граф связен, существует маршрут, проходящий через все вершины. Выберем вершину \\(a\\), которая впервые появляется на таком маршруте позже всех остальных. После удаления \\(a\\) оставшийся граф остаётся связным: для любой другой вершины участок маршрута до её первого появления проходит только через вершины, впервые появившиеся раньше \\(a\\), и даёт связь внутри оставшегося графа.\n\nЕсли \\(x_a\\ge y_a\\), перевезём из \\(a\\) в любую соседнюю вершину \\(x_a-y_a\\) единиц цемента, если разность положительна; если она равна нулю, этот рейс можно считать неиспользованным. После этого вершина \\(a\\) уже имеет нужное количество цемента. В оставшемся связном графе на \\(n-1\\) вершинах суммарный начальный вес равен суммарному требуемому, поэтому по индукции план для остальных вершин выполняется не более чем за \\(n-2\\) рейса. Всего получается не более \\(n-1\\) рейсов.\n\nЕсли \\(x_a<y_a\\), применим уже доказанный случай избытка к обратной задаче: стартовым распределением считаем \\((y_v)\\), а требуемым — \\((x_v)\\). Для вершины \\(a\\) в этой обратной задаче есть избыток \\(y_a-x_a\\), значит распределение \\((x_v)\\) можно получить из \\((y_v)\\) не более чем за \\(n-1\\) рейсов. Развернув эти рейсы в обратном порядке и по обратным направлениям, получаем требуемый план из \\((x_v)\\) в \\((y_v)\\). Следовательно, \\(n-1\\) рейсов всегда достаточно, а для \\(n=2011\\) ответ равен \\(2010\\).",
