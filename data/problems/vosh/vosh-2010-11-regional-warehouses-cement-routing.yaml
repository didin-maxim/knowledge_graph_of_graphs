        ]
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Пусть \\(G\\) — связный простой граф на \\(n\\) вершинах. В вершинах заданы начальные неотрицательные веса \\(x_v\\) и требуемые неотрицательные веса \\(y_v\\), причём \\(\\sum_v x_v=\\sum_v y_v\\). За один ход можно перенести произвольный неотрицательный вес вдоль одного ребра. Докажите, что для любых \\(x_v\\), \\(y_v\\) и любого связного \\(G\\) достаточно \\(n-1\\) ходов, и что в общем случае меньшего числа ходов гарантировать нельзя.",
        "source_id": "src-vosh-2010-11-regional-day1-official",
