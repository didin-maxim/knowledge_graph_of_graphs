        "id": "stmt-original",
        "title": "11.4",
        "text": "2011 складов соединены дорогами так, что от любого склада можно проехать к любому другому, возможно, проехав по нескольким дорогам. На складах находится по \\(x_1,\\ldots,x_{2011}\\) кг цемента соответственно. За один рейс можно провезти с произвольного склада на другой склад по соединяющей их дороге произвольное количество цемента. В итоге на складах по плану должно оказаться по \\(y_1,\\ldots,y_{2011}\\) кг цемента соответственно, причём \\(x_1+\\cdots+x_{2011}=y_1+\\cdots+y_{2011}\\). За какое минимальное количество рейсов можно выполнить план при любых значениях чисел \\(x_i\\), \\(y_i\\) и любой схеме дорог?",
        "source_id": "src-vosh-2010-11-regional-day1-official",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [],
        "distinct_from": [
