        "id": "stmt-original",
        "title": "Оригинальная формулировка",
        "text": "Рассмотрим доску \\(n x n\\) для нечётного положительного \\(n\\). Максимальная конфигурация, выровненная по клеткам состоит из \\((n^2-1)/2\\) домино \\(1 \\times 2\\) или \\(2 \\times 1\\), покрывающих все клетки, кроме одной. Разрешено сдвинуть домино в пустую клетку, не поворачивая его; после этого снова получается максимальная конфигурация с другой пустой клеткой. Пусть \\(k(C)\\) — число различных максимальных конфигураций, достижимых из \\(C\\) последовательностью таких ходов. Найдите максимальное возможное значение \\(k(C)\\) в зависимости от \\(n\\).",
