  "solutions": [
    {
      "id": "sol-directed-graph-and-spanning-tree-bound",
      "title": "Ориентированный граф специальных клеток и максимум по остовному дереву",
      "text": "Рассмотрим специальные клетки той же чётности координат, что и пустая клетка. Каждое домино, лежащее на такой клетке, естественно указывает на следующую специальную клетку в своём направлении; это задаёт ориентированный граф \\(G(C)\\). Пусть \\(T\\) — слабо связная компонента, содержащая пустую клетку. Так как у каждой вершины исходящая степень не больше 1, любой неориентированный цикл в \\(T\\) превращается в ориентированный цикл: на цикле ровно столько рёбер, сколько вершин, и у каждой вершины может быть не более одного исходящего ребра. В компоненте с пустой клеткой такого ориентированного цикла быть не может, поскольку пустая клетка имеет исходящую степень 0, а в конечном функциональном графе слабая компонента содержит либо сток, либо ориентированный цикл. Следовательно, \\(T\\) — дерево. Теперь любой ход домино соответствует изменению положения стока внутри этого дерева, а достижимые конфигурации получаются ровно выбором вершины \\(T\\) в качестве новой пустой клетки; значит, \\(k(C)=|V(T)|\\). Поэтому максимум \\(k(C)\\) не превосходит общего числа специальных клеток, то есть \\(((n+1)/2)^2\\). Осталось самодостаточно построить конфигурацию, где \\(T\\) проходит через все такие клетки. Пусть \\(n=2m+1\\), и специальные клетки — клетки с нечётными координатами. Обозначим их \\(R_{i,j}=(2i-1,2j-1)\\), где \\(1\\le i,j\\le m+1\\). Проведём через все \\(R_{i,j}\\) змейку: в первой строке слева направо, затем вниз по правому краю, во второй строке справа налево, затем вниз по левому краю, и так далее. Конечную клетку змейки оставим пустой. Для каждой другой клетки \\(R_{i,j}\\) поставим домино из неё в сторону следующей клетки змейки; оно покрывает \\(R_{i,j}\\) и промежуточную клетку между двумя соседними специальными клетками. После этого в каждой нечётной строке уже покрыты все клетки, кроме конечной пустой специальной клетки. В каждой чётной строке один крайний промежуточный квадрат покрыт вертикальным домино змейки; остальные нечётные клетки этой строки попарно покрываем горизонтальными домино с соседними чётно-чётными клетками: если вертикальный переход змейки стоит справа, кладём такие домино вправо, а если слева — влево. Так покрываются все оставшиеся клетки без пересечений. В полученной конфигурации граф \\(T\\) является путём через все \\(((n+1)/2)^2\\) специальные клетки, поэтому \\(k(C)=((n+1)/2)^2\\). Значит, максимальное возможное значение равно \\(((n+1)/2)^2\\).",
