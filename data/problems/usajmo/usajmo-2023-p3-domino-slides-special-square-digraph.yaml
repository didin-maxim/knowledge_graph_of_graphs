    {
      "id": "idea-empty-component-is-tree",
      "title": "Компонента пустой клетки образует дерево",
      "text": "В построенном digraph каждая special square имеет outdegree не больше `1`, а пустая клетка имеет outdegree `0`. Любой цикл был бы directed cycle, но тогда он не мог бы лежать в компоненте пустой клетки. Значит соответствующая weakly connected component ациклична и потому является деревом.",
