      "title": "Пустая клетка всё время остаётся в одном классе чётности",
      "text": "После каждого сдвига новая пустая клетка отстоит от старой на `2` по строке или столбцу, так что имеет ту же parity class. Поэтому рассматривать нужно только special squares этого класса.",
