    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Зафиксируем класс чётности пустой клетки и назовём специальными клетки той же чётности координат. Для каждой специальной клетки \\(s\\), занятой домино, проведём ориентированное ребро из \\(s\\) в следующую специальную клетку, куда это домино указывает. Тогда конфигурация задаёт ориентированный граф на множестве специальных клеток; компонента, содержащая пустую клетку, управляет всеми достижимыми положениями пустой клетки.",
