    {
      "id": "idea-empty-component-is-tree",
      "title": "Компонента пустой клетки образует дерево",
      "text": "В построенном орграфе каждая специальная клетка имеет исходящую степень не больше 1, а пустая клетка имеет исходящую степень 0. Любой цикл был бы ориентированным циклом, но тогда он не мог бы лежать в компоненте пустой клетки. Значит соответствующая слабо связная компонента ациклична.",
