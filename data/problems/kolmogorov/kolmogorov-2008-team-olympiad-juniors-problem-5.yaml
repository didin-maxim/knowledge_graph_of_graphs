        "title": "Оригинальная формулировка",
        "text": "В парламенте 2008 депутатов. Каждый состоит ровно в одной из трех фракций, и у каждого есть ровно два друга. Если два депутата дружат, то они состоят в разных фракциях. Докажите, что найдутся две фракции, суммарное число депутатов в которых не меньше числа депутатов в третьей.",
