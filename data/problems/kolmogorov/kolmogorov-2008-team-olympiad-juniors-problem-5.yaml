      "id": "sol-official-compressed",
      "title": "Решение через циклы 2-регулярного графа",
      "text": "Построим граф: депутаты становятся вершинами, дружбы — ребрами, а принадлежность к фракциям — 3-раскраской вершин. Так как у каждого депутата ровно два друга, каждая вершина графа имеет степень 2, то есть каждая компонента является циклом.\n\nДостаточно доказать, что размер любой одной фракции не превосходит суммарного размера двух остальных. Зафиксируем фракцию `X`. В каждом цикле вершины из `X` не стоят рядом, потому что друзья состоят в разных фракциях. Значит, на цикле длины `m` вершин цвета `X` не больше `m/2`: после каждой такой вершины идет вершина не из `X`, и эти следующие вершины различны. Поэтому в каждом цикле число вершин из `X` не превосходит числа вершин из двух других фракций вместе.\n\nСложив это неравенство по всем циклам графа, получаем `|X| <= 2008 - |X|`. Так можно сделать для каждой из трех фракций. Следовательно, любая фракция имеет размер не больше суммы двух остальных, а значит найдутся две фракции, суммарное число депутатов в которых не меньше числа депутатов в третьей.",
