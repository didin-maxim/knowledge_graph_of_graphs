  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Официальное решение, сжатое изложение",
      "text": "В официальном решении депутаты становятся вершинами графа, дружбы — ребрами, а принадлежность к фракциям — 3-раскраской вершин. Так как у каждого ровно два друга, граф 2-регулярен, то есть состоит из циклов.\n\nПоскольку соседние вершины имеют разные цвета, каждый цикл должен быть раскрашен в три цвета по кругу. Значит, длина каждого цикла делится на 3. Тогда общее число вершин графа также должно делиться на 3.\n\nНо `2008` на 3 не делится. Полученное противоречие показывает, что исходная конфигурация невозможна, а значит требуемое утверждение верно.",
