        "title": "Оригинальная формулировка",
        "text": "На балу присутствуют 2015 пар, каждая состоит из мальчика и девочки. Каждый участник знаком со своим партнером и еще хотя бы с одним человеком противоположного пола. Нужно раскрасить всех участников в три цвета так, чтобы у каждого было хотя бы два знакомых разных цветов.",
