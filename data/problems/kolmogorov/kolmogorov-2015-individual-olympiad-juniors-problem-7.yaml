      "title": "Набросок, требующий восстановления",
      "text": "Решение пока не найдено в проверяемом виде.\n\nСтарый набросок предлагал обозначить пары через `M_1D_1, ..., M_2015D_2015`, затем для каждого мальчика `M_i` выбрать другую девочку, с которой он знаком, и провести ребро между соответствующими вершинами `D_i` и `D_j`. После этого предполагалось правильно раскрасить полученный граф девочек в три цвета, а каждого мальчика покрасить в цвет его партнерши.\n\nТакой текст действительно объясняет, почему каждый мальчик получил бы знакомых двух разных цветов: его партнерша имеет цвет вершины `D_i`, а выбранная им девочка `D_j` имеет другой цвет. Но в наброске не закрыт симметричный шаг для девочек. Из того, что у вершины `D_i` есть ребро, построенное по знакомству ее партнера `M_i` с другой девочкой, не следует, что сама девочка `D_i` знакома с мальчиком из пары другого цвета. Поэтому фраза «то же верно для девочек» скрывает существенный непроверенный переход.\n\nНужно сверить официальное решение или восстановить другую конструкцию, которая одновременно контролирует знакомства мальчиков и девочек. До этого данный текст нельзя считать полным доказательством.",
