  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Официальное решение, сжатое изложение",
      "text": "Обозначим пары через M1D1, ..., M2015D2015. Для каждой девочки Di выбирают другую девочку, знакомую с ее партнером Mi. Так получается граф на вершинах D1, ..., D2015 с 2015 ребрами. Достаточно правильно раскрасить этот граф в три цвета, а мальчиков покрасить в цвета их партнерш: тогда у каждого мальчика есть знакомые как минимум двух других цветов, и то же верно для девочек. Далее рассматривают компоненту связности построенного графа. Если в ней есть вершина степени 1, ее удаляют и потом докрашивают обратно. После удаления всех таких вершин остается граф минимальной степени 2, а поскольку число ребер равно числу вершин, каждая оставшаяся компонента является простым циклом. Простой цикл легко 3-раскрасить, после чего восстановленные вершины тоже докрашиваются.",
