      "id": "idea-graph-role",
      "title": "Графовая роль",
      "text": "Удобно сжать каждую пару в одну вершину и провести ориентированную дугу \\(i\\to j\\), если мальчик из пары \\(i\\) знаком с девочкой из пары \\(j\\). Исходящие дуги помогут раскрасить девочек, а входящие дуги, то есть исходящие в обратном орграфе, помогут независимо раскрасить мальчиков.",
