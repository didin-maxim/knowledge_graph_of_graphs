  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Полное решение через ориентированный граф пар",
      "text": "Обозначим пары через \\((M_i,D_i)\\), где \\(M_i\\) - мальчик, \\(D_i\\) - его партнёрша, \\(i=1,\\ldots,2015\\). Построим ориентированный граф \\(Q\\) на вершинах \\(1,\\ldots,2015\\). Проведём дугу \\(i\\to j\\), если \\(i\\ne j\\) и мальчик \\(M_i\\) знаком с девочкой \\(D_j\\). Так как каждый мальчик знаком, кроме партнёрши, ещё хотя бы с одной девочкой, из каждой вершины \\(Q\\) выходит хотя бы одна дуга. Так как каждая девочка \\(D_j\\) знакома, кроме партнёра \\(M_j\\), ещё хотя бы с одним мальчиком \\(M_i\\), в каждую вершину \\(j\\) входит хотя бы одна дуга.\n\nДокажем простую лемму. Если в конечном ориентированном графе из каждой вершины выходит хотя бы одна дуга, то его вершины можно раскрасить в три цвета так, что у каждой вершины есть исходящий сосед другого цвета. Действительно, выберем из каждой вершины ровно одну исходящую дугу. Получится функциональный орграф: двигаясь по выбранным дугам из любой вершины, мы рано или поздно попадём на направленный цикл, а все остальные вершины образуют деревья, направленные к таким циклам. Каждый направленный цикл правильно раскрасим тремя цветами, чтобы соседние на цикле вершины имели разные цвета. Затем идём от циклов назад по деревьям: если цвет выбранного следующего соседа вершины уже известен, красим саму вершину в любой из двух других цветов. Тогда каждая вершина отличается по цвету от своего выбранного исходящего соседа.\n\nПрименим лемму к \\(Q\\) и получим раскраску девочек: девочка \\(D_i\\) получает цвет \\(a_i\\), причём для каждого \\(i\\) существует дуга \\(i\\to j\\) с \\(a_i\\ne a_j\\). Поэтому мальчик \\(M_i\\) знаком с двумя девочками разных цветов: со своей партнёршей \\(D_i\\) цвета \\(a_i\\) и с девочкой \\(D_j\\) цвета \\(a_j\\).\n\nТеперь применим ту же лемму к обратному орграфу \\(Q^{\\mathrm{rev}}\\). В нём из каждой вершины выходит хотя бы одна дуга, потому что в \\(Q\\) в каждую вершину входит хотя бы одна дуга. Получим раскраску мальчиков: мальчик \\(M_i\\) получает цвет \\(b_i\\), причём для каждого \\(i\\) существует дуга \\(j\\to i\\) в исходном графе \\(Q\\) с \\(b_i\\ne b_j\\). Такая дуга означает, что мальчик \\(M_j\\) знаком с девочкой \\(D_i\\), то есть девочка \\(D_i\\) знакома с мальчиком \\(M_j\\). Следовательно, девочка \\(D_i\\) знакома с двумя мальчиками разных цветов: со своим партнёром \\(M_i\\) цвета \\(b_i\\) и с мальчиком \\(M_j\\) цвета \\(b_j\\).\n\nМы получили одну 3-раскраску всех участников: цвета девочек заданы числами \\(a_i\\), цвета мальчиков - числами \\(b_i\\). Проверка выше показывает, что у каждого мальчика есть две знакомые девочки разных цветов, а у каждой девочки есть два знакомых мальчика разных цветов. Значит требуемая раскраска существует.",
