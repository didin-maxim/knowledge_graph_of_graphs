  "solutions": [
    {
      "id": "sol-ai-two-connected-diameter",
      "title": "ИИ-решение через 2-связность и диаметральные вершины",
      "text": "По условию расстояние между любыми двумя вершинами не превосходит \\(d\\), а для каждой вершины есть вершина на расстоянии \\(d\\). Значит, граф связен, его диаметр равен \\(d\\), и эксцентриситет каждой вершины равен \\(d\\).\n\nСначала докажем, что в графе нет точки сочленения. Предположим, что вершина \\(c\\) является точкой сочленения. Так как эксцентриситет \\(c\\) равен \\(d\\), найдётся вершина \\(x\\), для которой \\(\\rho(c,x)=d\\). Пусть \\(C\\) — компонента графа без вершины \\(c\\), содержащая \\(x\\). Поскольку \\(c\\) — точка сочленения, есть другая компонента; возьмём в ней вершину \\(y\\). Любой путь из \\(x\\) в \\(y\\) обязан проходить через \\(c\\), поэтому\n\\[\n\\rho(x,y)=\\rho(x,c)+\\rho(c,y)>d.\n\\]\nЭто противоречит условию, что все расстояния не превосходят \\(d\\). Следовательно, точек сочленения нет.\n\nТеперь используем стандартную лемму о 2-связных графах, то есть частный случай теоремы Менгера: в связном графе без точек сочленения между любыми двумя различными вершинами существуют два пути, не имеющие общих внутренних вершин. Выберем вершины \\(u,v\\) на расстоянии \\(d\\). По лемме существуют два внутренне непересекающихся пути из \\(u\\) в \\(v\\); обозначим их \\(P\\) и \\(Q\\). Каждый из них имеет длину не меньше \\(d\\), потому что \\(\\rho(u,v)=d\\).\n\nОбъединение путей \\(P\\) и \\(Q\\) образует простой цикл: идём из \\(u\\) в \\(v\\) по одному пути и возвращаемся из \\(v\\) в \\(u\\) по другому, а внутренних повторов вершин нет. Длина этого цикла равна \\(|P|+|Q|\\ge d+d=2d\\). Значит, в графе есть простой цикл, содержащий не менее \\(2d\\) вершин.",
