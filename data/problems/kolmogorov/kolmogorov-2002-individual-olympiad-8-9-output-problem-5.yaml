      "id": "sol-official-compressed",
      "title": "Доказательство через разноцветный цикл",
      "text": "Достаточно доказать существование разноцветного цикла.\nДля этого в графе оставим по одному ребру каждого цвета и сотрем остальные ребра.\nПолучится граф на `n` вершинах с как минимум `n` ребрами.\nЕсли последовательно удалять вершины степени меньше двух, не могут исчезнуть все вершины: всякий лес на `n` вершинах имеет не более `n - 1` ребер, а значит граф с `n` ребрами содержит цикл.\nПоэтому в конце остается подграф, где у каждой вершины степень не меньше двух, и в нем есть цикл.\nЭтот цикл состоит из ребер разных цветов, потому что мы оставляли не более одного ребра каждого цвета.\n\nВыберем разноцветный цикл минимальной длины.\nЕсли его длина больше 3, возьмем диагональ между двумя несоседними вершинами цикла.\nЭта диагональ вместе с двумя дугами исходного цикла образует два меньших цикла.\nЦвет диагонали может совпасть не более чем с одним ребром исходного цикла, потому что все ребра цикла разных цветов.\nЗначит, хотя бы на одной из двух дуг цвет диагонали не встречается; эта дуга вместе с диагональю дает меньший разноцветный цикл.\nПолученное противоречие минимальности показывает, что минимальный разноцветный цикл имеет длину 3.\nЗначит, существует разноцветный треугольник.",
