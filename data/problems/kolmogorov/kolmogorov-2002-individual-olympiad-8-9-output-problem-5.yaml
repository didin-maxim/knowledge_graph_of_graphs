  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Official solution, compressed",
      "text": "В официальном тексте приведены два разных решения.\n\nПервое решение.\nДостаточно доказать существование разноцветного цикла.\nДля этого в графе оставляют по одному ребру каждого цвета и стирают остальные ребра.\nПолучается граф на `n` вершинах с `n` ребрами.\nЗатем последовательно удаляют вершины степени меньше двух.\nВ конце остается подграф, где у каждой вершины степень не меньше двух, а значит в нем есть цикл.\nЭтот цикл состоит из ребер разных цветов.\nЕсли длина цикла больше 3, то диагональ между двумя его вершинами либо сразу дает разноцветный треугольник, либо позволяет сократить цикл.\nПовторяя сокращение, получают разноцветный треугольник.\n\nВторое решение.\nПрименяется индукция по `n`.\nУдаляют одну вершину `A` и смотрят на полный граф на оставшихся `n - 1` вершинах.\nЕсли там уже используется не меньше `n - 1` цветов, индукция сразу дает искомый треугольник.\nИначе среди ребер, выходящих из `A`, найдутся два ребра цветов, не встречающихся в оставшемся графе.\nТогда вместе с любым ребром между их концами получается разноцветный треугольник.",
