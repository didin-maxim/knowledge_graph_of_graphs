      "id": "sol-official-compressed",
      "title": "Краткое самодостаточное доказательство",
      "text": "Предположим противное: после удаления любой вершины граф перестает быть сильно связным. Среди всех графов вида `G-v` выберем сильно связную компоненту `K` максимального размера; пусть она лежит в `G-a`. Сожмем `K` в одну вершину `k`. Так как исходный граф `G` сильно связен, в сжатом графе есть направленный цикл, проходящий через `k` и `a`: достаточно взять пути `k -> a` и `a -> k` и объединить их. Поднимая этот цикл обратно, получаем сильно связный подграф, содержащий `K` и `a`.\n\nЕсли некоторая вершина `b` вне `K` не лежит на этом цикле, то в `G-b` тот же поднятый цикл показывает, что `K` и `a` находятся в одной сильно связной компоненте. Она больше `K`, что противоречит выбору `K`. Значит, все вершины вне `K` лежат на выбранном цикле. Поскольку `G-a` не сильно связен, кроме `a` вне `K` есть еще хотя бы одна вершина.\n\nИдем по циклу от `k` и обозначим через `c,d` первые две встреченные вершины вне `K`. На цикле есть ребро `c -> d`, а все остальные внешние вершины, если они есть, встречаются уже после `d` до возвращения в `K`. Из `c` выходит как минимум два ребра, поэтому, так как между двумя вершинами есть не более одного ребра, существует ребро `c -> e` с `e != d`. Если `e` лежит в `K`, то в `G-d` вершина `c` достигает `K` сразу. Если `e` вне `K`, то `e` тоже лежит на цикле после `d`, и путь по циклу от `e` к `K` не проходит через `d`. В обоих случаях в `G-d` вершина `c` достигает `K`; обратно, начальный участок цикла от `K` до `c` также обходит `d`. Поэтому в `G-d` есть сильно связная компонента, содержащая `K` и `c`, снова больше `K`. Противоречие доказывает, что некоторая вершина удаляется без потери сильной связности.",
      "idea_ids": [
