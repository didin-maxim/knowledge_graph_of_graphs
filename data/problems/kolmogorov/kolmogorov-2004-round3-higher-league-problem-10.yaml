        "title": "Оригинальная формулировка",
        "text": "В сильно связном ориентированном графе любые две вершины соединены не более чем одним\nребром, и из каждой вершины выходит хотя бы два ребра.\n\nДокажите, что можно удалить одну вершину вместе со всеми входящими в нее и исходящими\nиз нее ребрами так, чтобы оставшийся граф остался сильно связным.",
