    {
      "id": "sol-official-expanded",
      "title": "Expanded official solution",
      "text": "Assume the contrary: for every vertex `v`, the graph `G-v` is not strongly connected. Choose a vertex `a` and a strongly connected component `K` of `G-a` with maximum possible size among all components of all graphs obtained from `G` by deleting one vertex.\n\nContract `K` to one vertex `k`. The contracted graph is still strongly connected, so it contains a directed cycle through `k` and `a`. Lift this cycle back to `G`: inside `K` we may move between any two vertices, so the vertices of `K` together with the vertices of the lifted cycle form a strongly connected subgraph.\n\nIf some vertex `b` outside `K` were not on this cycle, then after deleting `b` the same lifted cycle would still show that `K` and `a` lie in one strongly connected component. This component would contain all vertices of `K` and also `a`, hence would be larger than `K`, contradicting the choice of `K`. Therefore every vertex outside `K` lies on the cycle.\n\nSince `G-a` is not strongly connected, there is at least one vertex outside `K` other than `a`; hence the cycle has at least two vertices outside `K`. Go along the cycle from `k` and let `c,d` be the first two outside vertices encountered. Thus the cycle uses the edge `c -> d`, and every outside vertex different from `c` and `d` occurs after `d` before the cycle returns to `k`.\n\nBy hypothesis at least two edges leave `c`. As there is at most one edge between any two vertices, the second outgoing edge from `c` goes to some vertex `e != d`. If `e` lies in `K`, then in `G-d` the vertex `c` reaches `K` directly; if `e` lies outside `K`, then `e` is on the chosen cycle after `d`, so following the cycle from `e` back to `K` avoids `d`. In either case `c` reaches `K` in `G-d`. Conversely, the initial part of the cycle from `K` to `c` avoids `d`, so `K` reaches `c` in `G-d`. Together with the strong connectivity of `K`, this means that `G-d` has a strongly connected component containing `K` and `c`, again larger than `K`. This final contradiction proves that some vertex can be deleted without destroying strong connectivity.",
