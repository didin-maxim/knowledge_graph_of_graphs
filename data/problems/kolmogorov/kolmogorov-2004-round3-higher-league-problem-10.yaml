      "id": "sol-official-compressed",
      "title": "Официальное решение, сжатое изложение",
      "text": "Решение начинается с предположения противного: удаление любой вершины разрушает сильную\nсвязность. Для вершины `a` выбирается максимальная по числу вершин компонента сильной\nсвязности `K` графа `G-a`.\n\nЗатем подробно исследуются ребра между `K` и остальной частью графа. Из максимальности\nкомпоненты и сильной связности исходного графа выводятся жесткие ограничения на то, как\nмогут быть устроены входящие и исходящие ребра у вершин вне `K`.\n\nЭти ограничения несовместимы с условием, что из каждой вершины выходит не меньше двух\nребер. Получается противоречие, значит существует вершина, удаление которой не нарушает\nсильную связность.",
      "idea_ids": [
        "idea-graph-role"
      ],
