    {
      "id": "sol-official-expanded",
      "title": "Расширенное проверенное решение",
      "text": "Предположим противное: для каждой вершины `v` граф `G-v` не является сильно связным. Выберите вершину `a` и сильно связную компоненту `K` графа `G-a` с максимально возможным числом вершин среди всех компонентов всех графов, полученных из `G` удалением одной вершины.\n\nСожмем `K` в одну вершину `k`. Полученный орграф по-прежнему сильно связен, поэтому в нем есть направленный цикл, проходящий через `k` и `a`. Поднимем этот цикл обратно в `G`: внутри `K` можно пройти из любой вершины в любую, поэтому вершины `K` вместе с вершинами поднятого цикла образуют сильно связный подграф.\n\nЕсли бы какая-то вершина `b` вне `K` не попала на этот цикл, то после удаления `b` тот же поднятый цикл показывал бы, что `K` и `a` лежат в одной сильно связной компоненте графа `G-b`. Эта компонента содержала бы все вершины `K` и еще вершину `a`, то есть была бы больше `K`, вопреки выбору `K`. Значит каждая вершина вне `K` лежит на выбранном цикле.\n\nТак как `G-a` не является сильно связным, вне `K` есть хотя бы одна вершина, отличная от `a`; следовательно, на цикле есть по крайней мере две вершины вне `K`. Идем по циклу от `k` и пусть `c,d` будут первыми двумя встреченными внешними вершинами. Тогда на цикле используется ребро `c -> d`, а каждая внешняя вершина, отличная от `c` и `d`, встречается после `d`, прежде чем цикл возвращается к `k`.\n\nИз `c` выходит по крайней мере два ребра. Поскольку между любыми двумя вершинами существует не более одного ребра, второе ребро из `c` идет в некоторую вершину `e != d`. Если `e` лежит в `K`, то в `G-d` вершина `c` напрямую достигает `K`. Если `e` лежит вне `K`, то `e` находится на выбранном цикле после `d`, поэтому, двигаясь по циклу от `e` обратно к `K`, мы тоже избегаем `d`. В любом случае в `G-d` вершина `c` достигает `K`. Обратно, начальная часть цикла от `K` до `c` обходит `d`, поэтому в `G-d` множество `K` достигает `c`. Вместе с сильной связностью `K` это означает, что в `G-d` есть сильно связная компонента, содержащая `K` и `c`, то есть снова большая, чем `K`. Это противоречит максимальности `K` и доказывает, что некоторую вершину можно удалить, сохранив сильную связность.",
