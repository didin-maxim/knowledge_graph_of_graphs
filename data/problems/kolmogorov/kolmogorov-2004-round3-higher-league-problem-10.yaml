    {
      "id": "sol-official-expanded",
      "title": "Развёрнутое официальное решение",
      "text": "Предположим противное: для каждой вершины `v` граф `G-v` не является сильно связным. Выберите вершину `a` и сильно связную компоненту `K` графа `G-a` с максимально возможным размером среди всех компонентов всех графов, полученных из `G` удалением одной вершины.\n\nСвяжите `K` с одной вершиной `k`. Сжатый граф по-прежнему сильно связен, поэтому он содержит направленный цикл через `k` и `a`. Поднимите этот цикл обратно в G: внутри K мы можем перемещаться между любыми двумя вершинами, поэтому вершины K вместе с вершинами поднятого цикла образуют сильно связный подграф.\n\nЕсли бы какая-то вершина `b` вне `K` не попала в этот цикл, то после удаления `b` тот же поднятый цикл все равно показал бы, что `K` и `a` лежат в одной сильно связной компоненте. Этот компонент будет содержать все вершины «K», а также «a», следовательно, будет больше, чем «K», что противоречит выбору «K». Следовательно, каждая вершина вне `K` лежит на цикле.\n\nПоскольку `G-a` не является сильно связным, вне `K` есть хотя бы одна вершина, отличная от `a`; следовательно, цикл имеет по крайней мере две вершины вне `K`. Идите по циклу от «k» и пусть «c, d» будут первыми двумя встреченными внешними вершинами. Таким образом, в цикле используется ребро `c -> d`, и каждая внешняя вершина, отличная от `c` и `d`, встречается после `d`, прежде чем цикл возвращается к `k`.\n\nПо условию, по крайней мере два ребра выходят из `c`. Поскольку между любыми двумя вершинами существует не более одного ребра, второе ребро, исходящее из `c`, идет в некоторую вершину `e != d`. Если `e` лежит в `K`, то в `G-d` вершина `c` напрямую достигает `K`; если `e` лежит за пределами `K`, то `e` находится в выбранном цикле после `d`, поэтому следование циклу от `e` обратно к `K` позволяет избежать `d`. В любом случае «с» достигает «К» в «Б-г». И наоборот, начальная часть цикла от «K» до «c» обходит «d», поэтому «K» достигает «c» в «G-d». Вместе с сильной связностью «K» это означает, что «Б-г» имеет сильно связный компонент, содержащий «K» и «c», опять-таки больший, чем «K». Это последнее противоречие доказывает, что некоторые вершины можно удалить, не нарушив при этом прочную связность.",
