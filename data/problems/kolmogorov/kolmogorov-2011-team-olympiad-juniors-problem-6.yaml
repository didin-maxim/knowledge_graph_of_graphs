        "id": "stmt-original",
        "title": "Original statement",
        "text": "Поверхность куба `15 x 15 x 15` разбита на клетки `1 x 1`. Муравей бегает по диагоналям клеток, нигде не поворачивая назад. Он не может бывать внутри одной клетки более одного раза, но может несколько раз проходить одну вершину.\n\nКакое наибольшее число центров клеток он может посетить?",
