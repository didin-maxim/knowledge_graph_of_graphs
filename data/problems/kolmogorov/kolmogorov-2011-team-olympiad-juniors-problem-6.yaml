  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Полное решение через диагональный граф",
      "text": "Ответ: `1335`.\n\nРаскрасим вершины разбиения поверхности куба в шахматном порядке. Каждая диагональ клетки соединяет две вершины одного цвета. Поэтому весь маршрут муравья, начавшись с диагонали с белыми концами или с диагонали с черными концами, дальше идет только по диагоналям того же цвета. Достаточно рассмотреть один из двух одинаково устроенных графов: его вершины — белые вершины разбиения, а ребра — белые диагонали всех клеток. Каждому ребру соответствует ровно один центр клетки, так что число посещенных центров равно числу пройденных ребер.\n\nВ этом графе всего `6 * 15^2 = 1350` ребер. Нечетные степени имеют ровно четыре вершины: это четыре вершины куба данного цвета. Действительно, обычная внутренняя для грани вершина и неугловая вершина ребра куба инцидентны четырем клеткам, а вершина куба инцидентна трем клеткам.\n\nДокажем верхнюю оценку. Пусть муравей прошел некоторый маршрут, то есть некоторый путь без повторения ребер в выбранном диагональном графе. Удалим из графа все пройденные ребра. Граф пройденных ребер имеет либо ноль, либо две вершины нечетной степени, поэтому после удаления ребер из исходных четырех нечетных вершин останется хотя бы две нечетные вершины. В каждой компоненте связности число нечетных вершин четно, значит, какие-то две нечетные вершины лежат в одной компоненте оставшегося графа.\n\nЛюбые две различные вершины куба одного цвета отличаются ровно по двум координатам, и в каждой из этих координат расстояние равно `15`. За один шаг по диагонали клетки каждая координата меняется не более чем на `1`, поэтому путь между такими двумя вершинами имеет длину не меньше `15`. Следовательно, в оставшемся графе есть не менее `15` ребер. Значит, муравей не мог пройти больше `1350 - 15 = 1335` ребер, то есть не мог посетить больше `1335` центров клеток.\n\nОсталось показать, что `1335` достижимо. Возьмем одну грань куба и удалим из выбранного цветового графа `15` ребер, образующих диагональный путь по этой грани между двумя противоположными вершинами куба данного цвета. Концы этого пути были двумя из четырех нечетных вершин, поэтому после удаления этих `15` ребер они становятся четными, внутренние вершины пути сохраняют четность, а две остальные вершины куба данного цвета остаются единственными нечетными вершинами.\n\nОставшийся граф связен. На выбранной грани удалена только одна диагональная цепочка: все остальные ее вершины либо соединяются с границей этой грани диагональными шагами, не использующими удаленные ребра, либо являются внутренними вершинами удаленной цепочки и имеют оставшиеся диагональные ребра в другую сторону. Сама граница и все остальные грани по-прежнему соединены между собой через соседние грани куба. Поэтому удаление этой одной цепочки не отрывает ни одной части графа.\n\nИтак, оставшийся граф связен и имеет ровно две вершины нечетной степени. В нем существует эйлеров маршрут, проходящий по всем его `1350 - 15 = 1335` ребрам ровно по одному разу. Такой маршрут соответствует движению муравья по диагоналям клеток без повторного посещения внутренности клетки, значит, муравей может посетить `1335` центров.",
