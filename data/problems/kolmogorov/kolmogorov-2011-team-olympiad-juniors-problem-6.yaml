      "id": "sol-official-compressed",
      "title": "??????????? ???????, ?????? ???????",
      "text": "Ответ: `1335`.\n\nКак и в старшей задаче, официальное решение строит граф белых вершин: вершины клеток красят в шахматном порядке, и каждая допустимая диагональ становится ребром между белыми вершинами. Максимальный маршрут муравья интерпретируется как маршрут по ребрам этого графа.\n\nДля оценки сверху стирают ребра максимального маршрута. В оставшемся белом графе появляются вершины нечетной степени; две из них лежат в одной компоненте связности, а соединяющий их путь имеет длину не менее `15`. Значит, хотя бы `15` ребер белого графа не используются, поэтому посещено не более `6(15^2) - 15 = 1335` центров клеток.\n\nДля достижения оценки удаляют по одной диагонали на каждой грани так, чтобы оставшийся белый граф был связен и имел ровно две вершины нечетной степени. Тогда в нем существует эйлеров маршрут, проходящий по всем оставшимся ребрам, то есть через `1335` центров клеток.",
