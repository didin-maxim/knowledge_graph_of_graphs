  "ideas": [
    {
      "id": "idea-cut-by-firing-threshold",
      "title": "Разделить вершины по числу выстрелов",
      "text": "Если одна из вершин ребра стреляла чаще другой, разбиваем вершины на две части по порогу этого меньшего числа выстрелов. Тогда через каждое ребро между частями в более активную часть должен был перейти положительный чистый поток фишек.",
