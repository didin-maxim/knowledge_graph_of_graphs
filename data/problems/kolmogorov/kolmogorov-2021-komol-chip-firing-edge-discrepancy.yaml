      {
        "id": "stmt-original",
        "text": "В простом графе без петель есть смежные вершины \\(u\\) и \\(v\\), а на вершинах графа размещено \\(N\\) фишек. Вершина может сработать, если на ней не меньше фишек, чем её степень: при этом она отправляет по одной фишке каждому соседу; в каждый момент срабатывает не более одной вершины. Докажите, что в любой момент числа срабатываний вершин \\(u\\) и \\(v\\) отличаются не более чем на \\(N\\).",
