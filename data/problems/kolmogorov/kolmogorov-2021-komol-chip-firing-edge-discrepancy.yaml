  "solutions": [
    {
      "id": "sol-cut-flow",
      "title": "Чистый перенос через разрез",
      "text": "Зафиксируем момент времени и обозначим через \\(f(x)\\) число выстрелов вершины \\(x\\). Если \\(f(u)=f(v)\\), то доказывать нечего; пусть \\(f(u)<f(v)\\). Разобьём вершины на две части: \\(U=\\{x\\colon f(x)\\le f(u)\\}\\) и \\(V=\\{x\\colon f(x)>f(u)\\}\\). Тогда \\(u\\in U\\), \\(v\\in V\\), так что ребро \\(uv\\) пересекает этот разрез. Рассмотрим любое ребро \\(ab\\) с \\(a\\in U\\), \\(b\\in V\\). По нему из \\(a\\) в \\(b\\) было отправлено \\(f(a)\\) фишек, а из \\(b\\) в \\(a\\) — \\(f(b)\\) фишек; так как \\(f(a)\\le f(u)<f(b)\\), чистый перенос по этому ребру идёт из \\(V\\) в \\(U\\), то есть в \\(V\\) в итоге прибыло \\(f(b)-f(a)>0\\) фишек меньше, чем ушло. Эквивалентно, если считать переносы со знаком в сторону \\(V\\), то каждое ребро разреза даёт в \\(V\\) положительный вклад. Суммарный чистый приток в \\(V\\) по всем рёбрам разреза не может превышать \\(N\\), потому что во всём графе изначально всего \\(N\\) фишек. Значит, и по одному ребру \\(uv\\) этот вклад не превосходит \\(N\\). Но вклад по ребру \\(uv\\) равен \\(f(v)-f(u)\\), откуда \\(f(v)-f(u)\\le N\\).",
