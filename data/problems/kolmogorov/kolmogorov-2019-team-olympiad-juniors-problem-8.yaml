      "title": "Graph-theory role in kolmogorov-2019-team-olympiad-juniors-problem-8",
      "text": "Граф фигурирует прямо в условии: речь идет об ориентированном графе, степенях вершин и ориентированных циклах. Официальное решение целиком опирается на графовые операции и понятия: встречные ребра, стягивание ребра, входящие степени и поиск циклов.",
