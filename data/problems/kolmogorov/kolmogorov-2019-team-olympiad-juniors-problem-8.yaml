      "title": "Минимальная входящая степень и два 3-цикла",
      "text": "После исключения ребер без предка минимальная входящая степень не может быть 0, 1 или 2; из среднего значения 3 следует регулярность по входящим степеням. Тогда входящие соседи любой вершины образуют ориентированный 3-цикл, а тот же локальный аргумент через входящие соседи исходящих соседей дает 3-цикл на исходящих соседях.",
