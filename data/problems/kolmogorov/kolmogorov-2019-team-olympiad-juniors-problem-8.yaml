  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Official solution, compressed",
      "text": "Решение проводится индукцией по числу вершин.\n\n1. Если в графе есть встречные ребра `v -> w` и `w -> v`, то они уже образуют цикл длины 2. В графе без вершин `v, w` из каждой вершины по-прежнему выходит хотя бы одно ребро, значит там существует еще один цикл. Поэтому в минимальном контрпримере встречных ребер нет.\n\n2. Если существует ребро `u -> v`, у которого нет \"предка\" (то есть вершины, из которой выходят ребра и в `u`, и в `v`), то ребро можно стянуть: удалить `u` и `v`, заменить их новой вершиной и получить ориентированный граф на `n-1` вершинах, в котором у каждой вершины исходящая степень снова равна 3. По предположению индукции в стянутом графе есть два непересекающихся цикла; каждый цикл, проходящий через новую вершину, легко поднимается обратно в исходный граф. Значит, такой контрпример тоже невозможен.\n\n3. Остается случай, когда у каждого ребра есть предок. Берется вершина минимальной входящей степени. Степени 0, 1 и 2 невозможны: в каждом из этих случаев находится ребро без предка или встречная пара ребер, что уже исключено. Значит, минимальная входящая степень равна 3, и тогда все вершины имеют входящую степень 3.\n\n4. Пусть в вершину `x` входят ребра из `u, v, w`. Предки этих трех ребер лежат среди `u, v, w`, поэтому в индуцированном подграфе на `u, v, w` в каждую вершину входит хотя бы одно ребро. Так как встречных ребер нет, вершины `u, v, w` образуют ориентированный 3-цикл. Аналогично, вершины, в которые ведут ребра из `x`, тоже образуют ориентированный 3-цикл. Эти два цикла не пересекаются, поскольку встречные ребра запрещены. Получаем противоречие.\n\nСледовательно, в исходном графе обязательно существуют два непересекающихся ориентированных цикла.",
