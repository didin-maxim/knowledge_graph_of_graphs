      "title": "Стягивание ребра без общего предка",
      "text": "В минимальном контрпримере любое ребро должно иметь общего входящего предка. Если у ребра `u -> v` такого предка нет, то можно слить `u` и `v`: исходящие степени сохраняются, а циклы из меньшего графа поднимаются обратно заменой прохода через новую вершину на проход через `v` или через `u -> v`.",
