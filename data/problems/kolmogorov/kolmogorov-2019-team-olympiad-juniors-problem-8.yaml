  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Самодостаточное решение",
      "text": "Докажем утверждение от противного. Выберем контрпример `G` с наименьшим числом вершин. Будем считать исходящую степень с учетом петель; между двумя фиксированными вершинами в одном направлении нет кратных ребер.\n\nСначала исключим короткие циклы. Если в `G` есть петля в вершине `v`, то эта петля уже является циклом. После удаления `v` каждая оставшаяся вершина теряет не более одной исходящей стрелки, поэтому у каждой из них остается хотя бы одна исходящая стрелка. В конечном ориентированном графе, где из каждой вершины выходит хотя бы одна стрелка, есть ориентированный цикл: достаточно идти по исходящим стрелкам, пока вершина не повторится. Этот цикл не проходит через `v`, что дает два непересекающихся цикла. Значит, петель в минимальном контрпримере нет.\n\nЕсли есть встречные ребра `v -> w` и `w -> v`, то они образуют цикл длины 2. Удалим `v` и `w`; любая другая вершина потеряет не более двух исходящих стрелок, значит у нее останется хотя бы одна исходящая стрелка. Снова получаем второй цикл вне `v, w`. Следовательно, встречных ребер в `G` тоже нет.\n\nНазовем предком ребра `u -> v` такую вершину `x`, из которой выходят обе стрелки `x -> u` и `x -> v`. Покажем, что в минимальном контрпримере каждое ребро имеет предка. Предположим наоборот, что у ребра `u -> v` предка нет. Стянем это ребро так: удалим `u` и `v`, добавим новую вершину `t`; всякое ребро из внешней вершины в `u` или в `v` заменим ребром в `t`, а исходящие ребра из `t` проведем ровно в те вершины, в которые шли исходящие ребра из `v`.\n\nПолученный граф `G'` имеет на одну вершину меньше и снова удовлетворяет условию. Действительно, внешняя вершина не могла иметь одновременно стрелки в `u` и в `v`, иначе она была бы предком ребра `u -> v`; поэтому при замене не возникают две одинаковые стрелки из нее в `t`, и ее исходящая степень остается равной 3. У вершины `t` исходящих стрелок ровно 3, потому что у `v` было три исходящих стрелки, а стрелок `v -> v` и `v -> u` нет: петли и встречные ребра уже исключены.\n\nПо минимальности `G` в графе `G'` есть два непересекающихся ориентированных цикла. Если цикл не проходит через `t`, он без изменений является циклом в `G`. Если цикл проходит через `t`, рассмотрим его фрагмент `a -> t -> b`. Ребро `t -> b` пришло из ребра `v -> b`; ребро `a -> t` пришло либо из `a -> v`, либо из `a -> u`. В первом случае заменяем фрагмент на `a -> v -> b`, во втором на `a -> u -> v -> b`. Так цикл поднимается в `G`. Так как из двух непересекающихся циклов в `G'` через `t` проходит не более одного, после поднятия они остаются непересекающимися. Противоречие. Значит, каждое ребро `G` имеет предка.\n\nПусть `d^-(y)` обозначает входящую степень вершины `y`, а `x` - вершина минимальной входящей степени. Сумма входящих степеней равна сумме исходящих степеней, то есть `3|V(G)|`, поэтому средняя входящая степень равна 3 и `d^-(x) <= 3`.\n\nЕсли `d^-(x) = 0`, то любое ребро, исходящее из `x`, не имеет предка: предок должен был бы иметь стрелку в `x`. Если `d^-(x) = 1`, пусть единственное входящее ребро есть `u -> x`. Его предок должен иметь стрелку в `x`, значит это может быть только `u`; но тогда потребовалась бы петля `u -> u`, которой нет. Если `d^-(x) = 2`, пусть в `x` входят ровно `u -> x` и `w -> x`. Предком ребра `u -> x` может быть только `w`, поэтому должно быть ребро `w -> u`. Аналогично предком ребра `w -> x` может быть только `u`, поэтому должно быть ребро `u -> w`. Получились встречные ребра между `u` и `w`, что уже исключено. Все три случая невозможны.\n\nОстается `d^-(x) = 3`. Так как минимальная входящая степень равна средней, входящая степень каждой вершины равна 3. Возьмем любую вершину `z` и обозначим ее входящих соседей через `a, b, c`. Для ребра `a -> z` его предок обязан быть одним из `a, b, c`, потому что только они входят в `z`; самим `a` он быть не может из-за отсутствия петли. Значит, в индуцированном подграфе на `{a,b,c}` в вершину `a` входит ребро из другой вершины этого множества. То же верно для `b` и `c`. Итак, внутри `{a,b,c}` каждая вершина имеет входящую степень хотя бы 1. Между тремя вершинами нет встречных ребер, поэтому возможно не более трех внутренних ребер; следовательно, внутренних ребер ровно три, и они образуют ориентированный 3-цикл.\n\nПрименим это к выбранной вершине `x`. Ее входящие соседи образуют ориентированный 3-цикл `C_in`. Теперь докажем, что исходящие соседи `x` тоже образуют ориентированный 3-цикл, не ссылаясь на обращение всех ребер. Пусть `y` - исходящий сосед `x`, то есть есть ребро `x -> y`. Входящие соседи вершины `y` образуют ориентированный 3-цикл и среди них есть `x`. В этом 3-цикле из `x` выходит ребро в одного из двух других входящих соседей `y`; обозначим его через `s`. Тогда `x -> s` и `s -> y`, значит `s` является исходящим соседом `x` и дает входящее ребро в `y` внутри множества исходящих соседей `x`. Так каждый исходящий сосед `x` имеет входящее ребро от другого исходящего соседа `x`. Как и выше, три исходящих соседа `x` образуют ориентированный 3-цикл `C_out`.\n\nЦиклы `C_in` и `C_out` не имеют общих вершин: общая вершина `r` давала бы одновременно ребра `r -> x` и `x -> r`, то есть встречные ребра. Мы нашли два непересекающихся ориентированных цикла в `G`, противоречие выбору контрпримера.\n\nСледовательно, в любом таком ориентированном графе существуют два ориентированных цикла, не пересекающихся по вершинам.",
