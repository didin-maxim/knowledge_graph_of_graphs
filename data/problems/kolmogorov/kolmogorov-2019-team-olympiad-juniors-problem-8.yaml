        "title": "Оригинальная формулировка",
        "text": "В ориентированном графе исходящая степень каждой вершины равна 3. Петли и встречные ребра разрешены и считаются циклами; между любыми двумя вершинами может быть не более одного ребра каждого направления. Докажите, что в таком графе существуют два ориентированных цикла, не пересекающихся по вершинам.",
