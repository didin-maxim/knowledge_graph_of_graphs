  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Официальное решение, сжатое изложение",
      "text": "В решении вводятся два графа: G — граф связей между шпионами и H — граф связей между опергруппами. Изолированные вершины H соответствуют компонентам связности G из одной вершины, а остальные компоненты H отвечают неодноэлементным компонентам G. Поэтому задачу сводят к случаю, когда G связен. Далее вершины H отождествляют с соответствующими подмножествами вершин G. Одноэлементные опергруппы рассматриваются как специальные вершины-уникумы, и задача сводится к тому, чтобы распознать их в графе H. Показывается, что вершина степени 1 в H соответствует множеству G\\\\{v}, где v не является точкой сочленения в G; таким образом можно найти один уникум. После этого по соседству и расстоянию 2 в H разбивают все опергруппы на несколько классов в зависимости от того, содержат ли они v и его соседей в G, и по этим классам восстанавливают соседство в G. Удаляя найденную вершину и повторяя процедуру, восстанавливают весь граф шпионских связей.",
