        "text": "В некоторой стране есть несколько шпионов, некоторые пары соединены секретными каналами связи. Непустая группа A называется опергруппой, если любой шпион из A может передать сообщение любому другому, возможно через посредников из A. Две опергруппы считаются связанными, если они не пересекаются, а их объединение тоже является опергруппой. Резидент составил схему связей между опергруппами, но без указания их составов. Нужно доказать, что по этой схеме контрразведка может восстановить исходную схему связей между шпионами.",
