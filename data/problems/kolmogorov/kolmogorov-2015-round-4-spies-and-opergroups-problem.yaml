    {
      "id": "sol-official-restored",
      "title": "Восстановление графа по графу опергрупп",
      "text": "Перейдём на язык графов. Пусть \\(G\\) - неизвестный граф шпионов. Вершинами графа \\(H\\) являются все непустые множества \\(X\\subseteq V(G)\\), для которых индуцированный подграф \\(G[X]\\) связен; две такие вершины \\(X,Y\\) соединены в \\(H\\), если \\(X\\cap Y=\\varnothing\\) и \\(G[X\\cup Y]\\) связен. Нужно показать, что из одного только графа \\(H\\) восстанавливается \\(G\\).\n\nСначала отделим компоненты. Если \\(C\\) - компонента связности \\(G\\), то вершина \\(C\\) в \\(H\\) изолирована: всякая непустая опергруппа, не пересекающая \\(C\\), лежит в другой компоненте \\(G\\), а непустая опергруппа внутри \\(C\\) пересекается с \\(C\\) или не даёт большего связного объединения. Обратно, если опергруппа \\(X\\) не равна целой компоненте \\(G\\), то в той же компоненте есть вершина вне \\(X\\), ближайшая к \\(X\\); она или соответствующая начальная часть пути даёт опергруппу, связанную с \\(X\\) в \\(H\\). Поэтому изолированные вершины \\(H\\) - ровно целые компоненты \\(G\\). Одноэлементные компоненты \\(G\\) дают только одну изолированную вершину в \\(H\\), а каждая неодноэлементная компонента \\(G\\) даёт ещё одну не изолированную компоненту графа \\(H\\), состоящую из всех её собственных непустых связных подмножеств. Значит, задача сводится к восстановлению одной связной компоненты \\(G\\); дальше считаем, что \\(G\\) связен и \\(|V(G)|\\ge 2\\). Изолированную вершину \\(H\\), соответствующую всему \\(V(G)\\), будем обозначать тем же символом \\(G\\).\n\nОдноэлементные опергруппы назовём уникумами. Если мы узнаем все уникумы, то восстановим \\(G\\): две вершины \\(x,y\\) исходного графа смежны тогда и только тогда, когда соответствующие уникумы \\(\\{x\\},\\{y\\}\\) соединены ребром в \\(H\\). Поэтому достаточно распознать уникумы в \\(H\\).\n\nНайдём хотя бы один уникум. Рассмотрим вершину \\(X\\) степени 1 в неизолированной части \\(H\\). Такая вершина существует: в любом связном графе с хотя бы двумя вершинами есть вершина \\(v\\), не являющаяся точкой сочленения, например конец максимального простого пути; тогда \\(G-\\{v\\}\\) связен и как вершина \\(H\\) смежен только с \\(\\{v\\}\\). Докажем обратное. Пусть \\(X\\) имеет степень 1 в \\(H\\). Если вне \\(X\\) есть две разные вершины \\(u\\) и \\(w\\), то, поскольку \\(G\\) связен, найдётся вершина \\(u\\notin X\\), имеющая соседа в \\(X\\). Возьмём другую вершину \\(w\\notin X\\). На пути от \\(w\\) к \\(X\\) до первого входа в \\(X\\) лежит непустая связная опергруппа \\(Y\\), не пересекающая \\(X\\), и \\(X\\cup Y\\) связно; кроме того, одноэлементная вершина \\(\\{u\\}\\) или начальная часть пути от \\(u\\) к \\(X\\) даёт ещё одного соседа \\(X\\). Получаются по крайней мере два соседа, противоречие. Значит, вне \\(X\\) ровно одна вершина \\(v\\), то есть \\(X=G-\\{v\\}\\), и \\(G-\\{v\\}\\) связен. Единственный сосед \\(X\\) в \\(H\\) - это \\(\\{v\\}\\), поэтому мы нашли уникум.\n\nТеперь покажем, как по найденному уникуму \\(\\{v\\}\\) определить все опергруппы, содержащие \\(v\\). Обозначим через \\(N\\) множество соседей \\(v\\) в \\(G\\). Само множество \\(N\\) нам не известно как множество вершин \\(G\\), но следующие классы можно выделить только по графу \\(H\\). Рассмотрим все вершины \\(H\\), кроме \\(\\{v\\}\\) и полной вершины \\(G\\), и разобьём их на пять типов:\n\\(A\\): содержат \\(N\\cup\\{v\\}\\);\n\\(M\\): содержат всё \\(N\\), но не содержат \\(v\\);\n\\(U\\): содержат \\(v\\), но не содержат всё \\(N\\);\n\\(S\\): не содержат \\(v\\), не содержат всё \\(N\\), но пересекают \\(N\\);\n\\(Q\\): не пересекают \\(N\\).\n\nВершины типов \\(U,S,Q\\) - ровно те, которые соединены с \\(\\{v\\}\\) путём длины 2 в \\(H\\). Действительно, если \\(X\\in U\\), выберем \\(n\\in N\\setminus X\\); тогда \\(\\{v\\}-\\{n\\}-X\\) есть путь длины 2. Если \\(X\\in S\\), то \\(X\\) содержит некоторого соседа \\(v\\), но не всех; выберем \\(n\\in N\\setminus X\\). Так как \\(G-\\{v\\}\\) связен, существует путь от \\(n\\) к \\(X\\) внутри \\(G-\\{v\\}\\); его часть до первого попадания в \\(X\\) даёт промежуточную опергруппу \\(Y\\), смежную и с \\(\\{v\\}\\), и с \\(X\\). Если \\(X\\in Q\\), берём путь от \\(v\\) к \\(X\\); после \\(v\\) он сначала попадает в \\(N\\), а часть пути до первого попадания в \\(X\\) снова даёт нужную промежуточную опергруппу. Обратно, если \\(X\\in A\\cup M\\), то любой сосед \\(\\{v\\}\\) в \\(H\\) должен содержать хотя бы одну вершину из \\(N\\), а \\(X\\) содержит всё \\(N\\); значит, такой промежуточный сосед не может не пересекаться с \\(X\\). Поэтому из \\(H\\) распознаётся объединение \\(A\\cup M\\). Внутри него класс \\(M\\) состоит ровно из вершин, смежных с \\(\\{v\\}\\), а класс \\(A\\) - из несмежных с \\(\\{v\\}\\).\n\nОсталось разделить \\(U,S,Q\\). Класс \\(Q\\) - это ровно оставшиеся вершины, которые смежны хотя бы с одной вершиной из \\(A\\). Если \\(X\\in Q\\), возьмём путь от \\(v\\) к \\(X\\) и добавим к \\(N\\cup\\{v\\}\\) его начальную часть до первого ребра, входящего в \\(X\\); получим связную опергруппу из \\(A\\), не пересекающую \\(X\\) и смежную с \\(X\\). Если же \\(X\\in U\\), то оно содержит \\(v\\), а всякая вершина из \\(A\\) тоже содержит \\(v\\), так что смежности быть не может. Если \\(X\\in S\\), то оно содержит хотя бы одну вершину из \\(N\\), а всякая вершина из \\(A\\) содержит всё \\(N\\), значит, опять нет непересечения. Наконец, из оставшихся двух классов \\(S\\) и \\(U\\) класс \\(S\\) состоит ровно из вершин, смежных с \\(\\{v\\}\\), а \\(U\\) - из несмежных, потому что вершины из \\(S\\) не содержат \\(v\\) и пересекают \\(N\\), а вершины из \\(U\\) содержат \\(v\\).\n\nИтак, по одному найденному уникуму \\(\\{v\\}\\) мы выделили все вершины \\(H\\), соответствующие опергруппам, содержащим \\(v\\): это \\(\\{v\\}\\), все вершины из \\(A\\), все вершины из \\(U\\), а также полная вершина \\(G\\). Удалим их из рассмотрения. Оставшиеся вершины и рёбра между ними - это в точности граф опергрупп для связного графа \\(G-\\{v\\}\\), поскольку связность любого множества, не содержащего \\(v\\), проверяется внутри индуцированного подграфа без \\(v\\). Граф \\(G-\\{v\\}\\) связен по выбору \\(v\\), поэтому можно повторить тот же шаг.\n\nПовторяя процедуру, мы последовательно находим все уникумы. После этого исходная схема связей между шпионами восстанавливается как индуцированный на уникумах подграф графа \\(H\\). Это и доказывает требуемое.",
