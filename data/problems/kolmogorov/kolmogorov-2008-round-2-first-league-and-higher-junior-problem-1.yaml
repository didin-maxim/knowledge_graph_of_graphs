  "ideas": [
    {
      "id": "idea-graph-role",
      "title": "Graph-theory role in kolmogorov-2008-round-2-first-league-and-higher-junior-problem-1",
      "text": "Граф прямо присутствует в условии: задача сформулирована про колесо `W_n`. Официальное решение полностью использует связность цветных подграфов и структуру этого графа.",
      "tags": [],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Official solution, compressed",
      "text": "Ответ: `2(2^n - 2)`.\n\nВ официальном решении отмечают, что в каждом цвете должен получиться остов, а значит в одном цвете можно выбрать произвольное непустое собственное множество спиц колеса. После выбора цветов спиц раскраска ребер внешнего цикла определяется однозначно: каждое ребро цикла должно соединять вершины, чьи спицы окрашены в разные цвета, иначе один из цветных подграфов распадется.\n\nТаким образом, допустимы все раскраски спиц, кроме двух одноцветных. Таких раскрасок `2^n - 2`, и еще есть выбор, какой цвет считается первым. Итого получаем `2(2^n - 2)`.",
