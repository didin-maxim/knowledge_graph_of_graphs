      "id": "sol-official-compressed",
      "title": "Подсчет раскрасок колеса",
      "text": "Ответ: `2(2^n - 2)`.\n\nВ каждом цвете должен получиться связный граф на `n+1` вершинах. Всего в колесе `2n` рёбер, поэтому каждый цвет должен получить хотя бы `n` рёбер, а значит ровно `n`; каждая цветная сеть является деревом. В частности, у каждого цвета должна быть хотя бы одна спица, иначе центр был бы изолирован.\n\nЗафиксируем любую неодноцветную раскраску спиц. Если подряд идёт максимальный блок спиц одного цвета, то рёбра обода внутри этого блока вынужденно получают другой цвет: иначе в первом цвете появился бы цикл через центр. Для каждого такого блока ровно одно из двух граничных рёбер должно иметь другой цвет, чтобы вершины блока подключились к дереву другого цвета; оба граничных ребра другого цвета взять нельзя, иначе в другом цвете возникнет цикл. Выбор одного граничного ребра для первого блока однозначно задаёт все остальные граничные рёбра по кругу, и есть ровно два таких выбора.\n\nИтак, спицы можно раскрасить `2^n - 2` способами, исключая две одноцветные раскраски, и для каждой из них есть ровно два способа докрасить обод. Получаем `2(2^n - 2)`.",
