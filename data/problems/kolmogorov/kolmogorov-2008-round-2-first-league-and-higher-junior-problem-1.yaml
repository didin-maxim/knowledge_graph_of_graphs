        "text": "Рассматривается колесо `W_n`: цикл из `n` вершин и еще одна центральная вершина, соединенная со всеми вершинами цикла. Сколькими способами можно покрасить ребра в два цвета так, чтобы в каждом цвете получился связный граф?",
