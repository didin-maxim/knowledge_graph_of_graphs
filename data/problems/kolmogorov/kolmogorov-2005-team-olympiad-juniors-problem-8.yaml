  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Проверенное самодостаточное решение",
      "text": "Пусть у графа `G` ровно `2k` вершин. Построим вспомогательный граф `H`, вершинами которого будут все остовные деревья графа `G`. Два остовных дерева `T1` и `T2` соединим ребром тогда и только тогда, когда они отличаются заменой одного ребра.\n\nРассмотрим фиксированное остовное дерево `T` и ребро `e` этого дерева. После удаления `e` дерево распадается на две компоненты `U` и `V`. Так как степени всех вершин графа `G` четны, число ребер графа `G`, соединяющих `U` и `V`, четно. Одним из них является `e`, поэтому других ребер между `U` и `V` нечетное число. Заменяя `e` на любое из этих ребер, получаем остовные деревья, соседние с `T` в графе `H`.\n\nТо же верно для каждого ребра дерева `T`. В самом дереве `T` число ребер равно `2k-1`, то есть оно нечетно. Значит, степень вершины `T` в графе `H` тоже нечетна.\n\nСледовательно, в графе `H` каждая вершина имеет нечетную степень. По лемме о рукопожатиях число вершин такого графа четно. Но вершины `H` и есть остовные деревья графа `G`, поэтому их количество четно.",
