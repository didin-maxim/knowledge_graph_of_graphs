        "title": "Оригинальная формулировка",
        "text": "Известно, что каждая вершина графа с четным числом вершин имеет четную степень. Докажите, что количество остовных деревьев в этом графе четно.\n\nОстовное дерево понимается как подграф, содержащий все вершины исходного графа и являющийся деревом.",
