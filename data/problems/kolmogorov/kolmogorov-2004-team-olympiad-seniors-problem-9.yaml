      "id": "sol-official-compressed",
      "title": "Разбор, требующий проверки",
      "text": "Пусть данные важные ребра равны `ab` и `ac`, а максимальный размер пустого\nподграфа исходного графа равен `k`. Так как `ab` важно, существует множество\nвершин `B` мощности `k+1`, в котором ребро `ab` является единственным. Аналогично,\nтак как `ac` важно, существует множество `C` мощности `k+1`, в котором ребро `ac`\nявляется единственным.\n\nОставим в графе только вершины из `B ∪ C`. После этого свойства множеств `B`\nи `C` не исчезнут, а все вершины из `(B ∩ C) \\\\ {a}` станут изолированными,\nпотому что в `B` и в `C` у них не было соседей. Такие вершины можно удалить,\nодновременно уменьшая и `k`, и размеры `B`, `C` на одну и ту же величину.\n\nВ итоге получаем граф на `2k+1` вершинах, разбитых на два пустых множества\n`B \\\\ {a}` и `C \\\\ {a}` мощности `k` и общую вершину `a`, причем единственные\nвнутренние ребра в множествах `B` и `C` уже устранены.\n\nЕсли бы в этом графе не было нечетного цикла, он был бы двудольным. Но любой\nдвудольный граф на `2k+1` вершинах содержит независимое множество мощности\n`k+1` (берем большую долю двудольного разбиения). Это противоречит определению\n`k` как максимального размера пустого подграфа.\n\nСледовательно, в графе обязательно существует нечетный цикл.",
