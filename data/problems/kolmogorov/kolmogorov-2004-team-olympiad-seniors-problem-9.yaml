      "id": "sol-official-compressed",
      "title": "Доказательство через двудольность и паросочетания",
      "text": "Докажем утверждение от противного. Предположим, что в графе нет нечетного цикла. Тогда граф двудолен: в каждой компоненте выберем вершину и разобьем остальные вершины по четности расстояния от нее; ребро внутри одного слоя четности вместе с двумя кратчайшими путями к выбранной вершине дало бы нечетный замкнутый маршрут, из которого выделяется нечетный цикл.\n\nПусть `alpha(H)` — размер наибольшего независимого множества графа `H`, а `tau(H)` — размер наименьшего вершинного покрытия, то есть множества вершин, касающегося каждого ребра. Для любого графа на `n` вершинах верно `alpha(H)+tau(H)=n`: дополнение к независимому множеству является вершинным покрытием, и наоборот.\n\nНапомним также нужную двудольную лемму Кёнига и докажем ее. В двудольном графе с долями `X,Y` размер наибольшего паросочетания равен размеру наименьшего вершинного покрытия. Действительно, возьмем максимальное паросочетание `M`. От всех непокрытых `M` вершин доли `X` отметим вершины, достижимые чередующимися путями: из `X` идем по ребрам не из `M`, из `Y` — по ребрам из `M`. Пусть `Z` — множество отмеченных вершин. Непокрытая вершина доли `Y` не может быть отмечена, иначе был бы увеличивающий путь и `M` не было бы максимальным. Множество `K=(X \\ Z) ∪ (Y ∩ Z)` покрывает все ребра: если ребро из отмеченной вершины `X` вело бы в неотмеченную вершину `Y`, то по правилу чередующегося обхода эта вершина `Y` тоже отметилась бы; для ребра из `M` это следует из того, что отмеченная вершина `X`, покрытая `M`, приходит по своему единственному ребру из `M` от уже отмеченной вершины `Y`. Каждое ребро из `M` имеет ровно один конец в `K`, значит `|K|=|M|`. Любое вершинное покрытие содержит хотя бы один конец каждого ребра любого паросочетания, поэтому не может быть меньше `|M|`; значит `K` минимально.\n\nТеперь пусть `e` — важное ребро исходного двудольного графа `G`. По определению `alpha(G-e)>alpha(G)`. Число вершин не меняется, поэтому из равенства `alpha+tau=n` получаем `tau(G-e)<tau(G)`. Оба графа `G` и `G-e` двудольны, значит по доказанной лемме их числа вершинного покрытия равны размерам максимальных паросочетаний. Следовательно, после удаления `e` размер максимального паросочетания уменьшается.\n\nОтсюда `e` принадлежит каждому максимальному паросочетанию графа `G`: если бы существовало максимальное паросочетание, не содержащее `e`, оно осталось бы паросочетанием того же размера и в `G-e`, что противоречит уменьшению максимального размера.\n\nПрименим это к двум важным ребрам, имеющим общую вершину. Каждое из них должно принадлежать каждому максимальному паросочетанию `G`. Но паросочетание не может содержать два ребра с общим концом. Противоречие показывает, что исходный граф не может быть двудольным. А граф не является двудольным тогда и только тогда, когда в нем есть нечетный цикл. Утверждение доказано.",
