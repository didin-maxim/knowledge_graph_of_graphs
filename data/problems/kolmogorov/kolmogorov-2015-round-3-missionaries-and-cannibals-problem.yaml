        "title": "Оригинальная формулировка",
        "text": "На лодке, вмещающей только двух человек, через реку переправилась группа миссионеров и каннибалов, причем миссионеров было на одного больше. Каждый раз туда плыли двое, обратно один. Ни на одном берегу миссионеров никогда не было меньше, чем каннибалов, и каннибалы не оставались без присмотра миссионеров. Могло ли получиться, что каждые двое, которые когда-либо переправлялись вместе, в итоге совершили одинаковое число рейсов?",
