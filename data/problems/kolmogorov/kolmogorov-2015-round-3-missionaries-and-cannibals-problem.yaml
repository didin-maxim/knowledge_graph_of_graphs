      "id": "sol-official-compressed",
      "title": "Самодостаточное решение",
      "text": "Ответ: не могло.\n\nСначала уточним, кто может плыть вдвоем в направлении «туда». Пусть на исходном берегу в некоторый момент находятся `m` миссионеров и `c` каннибалов. Всего миссионеров на одного больше, чем каннибалов. Условие безопасности на исходном берегу дает `m >= c`, а условие безопасности на другом берегу, где находятся остальные люди, дает `c + 1 >= m`. Значит, всегда `m-c` равно либо `0`, либо `1`.\n\nЕсли бы туда поплыли два миссионера, то на исходном берегу разность `m-c` уменьшилась бы на `2` и стала бы отрицательной; там каннибалов оказалось бы больше, чем миссионеров. Если бы туда поплыли два каннибала, то разность `m-c` увеличилась бы на `2`, и тогда на другом берегу каннибалов стало бы больше, чем миссионеров. Поэтому каждый рейс туда вдвоем обязательно состоит из одного миссионера и одного каннибала.\n\nДля каждого человека число рейсов туда на единицу больше числа рейсов обратно, потому что все в итоге переправились с исходного берега на другой. Поэтому равенство общего числа рейсов у двух людей равносильно равенству числа их рейсов туда.\n\nПостроим мультиграф: вершинами будут все люди, а каждый совместный рейс туда дадим ребром между двумя его пассажирами. По предыдущему абзацу этот граф двудолен: одно ребро всегда соединяет миссионера и каннибала. Степень вершины равна числу рейсов туда соответствующего человека. По условию, если два человека когда-либо плыли вместе, то они совершили одинаковое число рейсов; значит, концы каждого ребра имеют равные степени. Тогда в каждой связной компоненте все вершины имеют одну и ту же степень: равенство степеней передается вдоль пути.\n\nВ компоненте, содержащей хотя бы одно ребро, эта общая степень положительна. Пусть в такой компоненте `p` миссионеров и `q` каннибалов, а общая степень равна `d > 0`. Сумма степеней миссионеров в компоненте равна `dp`, сумма степеней каннибалов равна `dq`. Но в двудольном графе обе эти суммы считают одно и то же число ребер компоненты, поэтому `dp=dq`, откуда `p=q`.\n\nИзолированных вершин быть не может: каждый человек хотя бы один раз плыл туда, значит имеет положительную степень. Следовательно, в каждой компоненте миссионеров столько же, сколько каннибалов, и во всей группе их должно быть поровну. Это противоречит условию, что миссионеров было на одного больше.",
