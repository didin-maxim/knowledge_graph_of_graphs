      "id": "sol-official-compressed",
      "title": "Самодостаточное решение",
      "text": "Ответ: не могло. Сначала показывается, что вдвоем могут плыть только миссионер и каннибал: два миссионера или два каннибала приводят к нарушению условий на одном из берегов. Если персонажи совершают одинаковое число рейсов вообще, то и число рейсов туда у них одинаково. Построим граф: персонажи будут его вершинами, а совместные рейсы туда — ребрами. Получается двудольный граф с долями \"миссионеры\" и \"каннибалы\", возможно с кратными ребрами. В каждой компоненте связности степени всех вершин одинаковы, причем в компоненте есть хотя бы одно ребро. Тогда суммы степеней в обеих долях совпадают, а потому кратны числу вершин в каждой доле. Отсюда в каждой компоненте число миссионеров равно числу каннибалов, значит и во всей группе их поровну, что противоречит условию, что миссионеров было на одного больше.",
