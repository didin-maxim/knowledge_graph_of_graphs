  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Официальное решение, сжатое изложение",
      "text": "Ответ: `1`.\n\nПусть регион `M` дает минимум автобусной мобильности, а регион `N` — минимум железнодорожной. Разобьем множество городов на четыре части:\n\n- `X = M ∩ N`,\n- `Y = M \\\\ X`,\n- `Z = N \\\\ X`,\n- `T` — города вне `M ∪ N`.\n\nИх мощности обозначим через `a, b, c, d`. Тогда маршруты между `T` и `X`, а также между `Y` и `Z`, обязательно дают вклад хотя бы в одну из двух мобильностей, поэтому\n\n`A + B >= (ad + bc) / 1009`.\n\nДалее разбираются случаи.\n\n1. Если все `a, b, c, d` ненулевые, то `ad + bc >= (a + d - 1) + (b + c - 1) = 2016`, значит\n   `A + B >= 2016 / 1009 > 1`.\n\n2. Если `c = 0` или `b = 0`, то из условия на размеры регионов получается `d >= 1009`, откуда снова `A + B >= 1`.\n\n3. Если `bc != 0`, но `ad = 0`, то маршруты между `Y` и `Z` дают вклад не меньше `min(b, c) >= 1`, поэтому `A + B >= 1`.\n\nПример на достижимость: один город `X` соединен со всеми только железнодорожными маршрутами, а другой город `Y` соединен со всеми, кроме `X`, только автобусными. Тогда автобусная мобильность региона `{X}` равна `0`, а железнодорожная мобильность региона `{Y}` равна `1`. Следовательно, минимально возможное значение равно `1`.",
