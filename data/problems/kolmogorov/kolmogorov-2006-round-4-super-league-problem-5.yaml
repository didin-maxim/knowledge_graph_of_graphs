      "id": "sol-official-compressed",
      "title": "Official solution, compressed",
      "text": "Официальное решение сопоставляет любой триангуляции дерево: вершины этого дерева соответствуют треугольникам, а ребра — парам соседних треугольников. Степени всех вершин такого дерева не превосходят 3.\n\nДлины сторон каждого треугольника однозначно определяются размерами компонент связности, возникающих после удаления соответствующей вершины дерева. Поэтому число различных треугольников оценивается через возможные типы вершин в этом дереве.\n\nЗатем отдельно оценивают вклад висячих вершин, вершин степени 2 и степени 3. Полученная верхняя оценка достигается на явной конструкции, так что максимум найден.",
