  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Официальное решение, развернутое изложение",
      "text": "Ответ: `floor((3n - 7) / 4)`.\n\nПусть дано некоторое разбиение правильного `n`-угольника на треугольники. Построим дерево смежности треугольников: его вершины соответствуют треугольникам, а две вершины соединены ребром, если соответствующие треугольники имеют общую диагональ. Это действительно дерево: треугольников `n - 2`, диагоналей `n - 3`, граф смежности связен, а циклов в нем быть не может. Степень каждой вершины не превосходит `3`.\n\nОбозначим `N = n - 2`, то есть `N` - число вершин этого дерева. Для вершины `v` дерева посмотрим на компоненты, которые получаются после удаления `v`. Если степень `v` меньше `3`, добавим недостающие компоненты нулевого размера. Тогда три числа `a, b, c`, равные размерам этих компонент, удовлетворяют `a + b + c = N - 1`, а соответствующий треугольник имеет стороны, стягивающие соответственно `a + 1`, `b + 1`, `c + 1` сторон исходного многоугольника. Поэтому форма треугольника однозначно определяется неупорядоченной тройкой `a + 1, b + 1, c + 1`.\n\nПусть в дереве `l` вершин степени `1`, `m` вершин степени `2` и `t` вершин степени `3`. Из суммы степеней получаем\n`l + 2m + 3t = 2(N - 1)`, откуда `l = t + 2` и `m = N - 2t - 2`.\n\nВсе висячие вершины дают один и тот же тип треугольника: две стороны являются сторонами исходного многоугольника, а третья стягивает `N = n - 2` сторон. Вершина степени `2` дает тип вида `(1, k, n - 1 - k)`, поэтому различных типов среди вершин степени `2` не больше `floor((n - 3) / 2) = floor((N - 1) / 2)`. Вершин степени `3` всего `t`, значит они дают не больше `t` новых типов. Следовательно, для любого `t`\n\n`D <= 1 + t + min(N - 2t - 2, floor((N - 1) / 2))`,\n\nгде `D` - число попарно различных треугольников. Максимум правой части по целым `t >= 0` равен `floor((3N - 1) / 4) = floor((3n - 7) / 4)`. Например, если `F = floor((N - 1) / 2)`, то максимум достигается при `t` около `(N - 2 - F) / 2`; прямая проверка двух соседних целых значений дает именно эту формулу.\n\nОсталось показать, что оценка достижима. Возьмем целое `t`, при котором достигается указанный максимум. Построим дерево так: берем путь `x_1, x_2, ..., x_{N - t}` и к каждой из вершин `x_2, x_3, ..., x_{t+1}` подвешиваем по одному новому листу. Это дерево имеет ровно `N` вершин, `t` вершин степени `3`, `N - 2t - 2` вершин степени `2` и `t + 2` листа.\n\nПосчитаем типы треугольников для этого дерева. Все листья дают один общий тип. Для подвешенной вершины `x_i`, где `2 <= i <= t + 1`, размеры трех компонент после удаления равны `1`, `2i - 3` и `N - 2i + 1`, поэтому получается тип `(2, 2i - 2, N - 2i + 2)`; при выбранных `i` эти типы попарно различны. Для неподвешенных внутренних вершин пути типы имеют вид `(1, k, N + 1 - k)` при последовательных значениях `k = 2t + 2, 2t + 3, ..., N - 1`; среди них ровно `min(N - 2t - 2, floor((N - 1) / 2))` различных типов. Типы степени `2` не совпадают с типами степени `3`, потому что в первых есть сторона длины `1`, а во вторых все три стороны имеют длину не меньше `2`. Поэтому построенное дерево дает ровно\n\n`1 + t + min(N - 2t - 2, floor((N - 1) / 2)) = floor((3N - 1) / 4)`\n\nразличных типов.\n\nНаконец, любое дерево с максимальной степенью не больше `3` реализуется как дерево смежности некоторой триангуляции выпуклого многоугольника: удаляем лист дерева, по индукции строим триангуляцию для оставшегося дерева, а затем приклеиваем к стороне треугольника, соответствующей соседней вершине листа, новое ухо. Значит, построенное дерево реализуется триангуляцией правильного `n`-угольника, и верхняя оценка достижима. Максимальное число попарно различных треугольников равно `floor((3n - 7) / 4)`.",
