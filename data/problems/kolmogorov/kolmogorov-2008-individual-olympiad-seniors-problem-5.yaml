  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Самодостаточное доказательство через раскраску ребер гиперкуба",
      "text": "Сначала используем стандартную жадную раскраску вершин: граф максимальной степени 1000 имеет правильную раскраску в 1001 цвет, потому что при раскрашивании каждой вершины ее соседи запрещают не более 1000 цветов.\n\nВложим эти 1001 цвет вершины в 1024 двоичные строки длины 10. Покрасим ребро `uv` исходного графа в цвет первой координаты, в которой различаются две двоичные строки, сопоставленные цветам вершин `u` и `v`. Цвета концов различны, поэтому такая координата всегда существует. Так получается один из 10 цветов ребер.\n\nДля фиксированной координаты `i` каждое ребро цвета `i` соединяет вершины, у которых сопоставленные двоичные строки различаются в координате `i`. Поэтому подграф, образованный цветом `i`, двудолен: одна доля состоит из вершин, у которых в сопоставленной строке `i`-й бит равен 0, а другая — из вершин, у которых в сопоставленной строке `i`-й бит равен 1.\n\nТак как каждый одноцветный подграф двудолен, ни один одноцветный подграф не содержит нечетного цикла. Значит, ребра всегда можно раскрасить в 10 цветов с требуемым свойством.",
