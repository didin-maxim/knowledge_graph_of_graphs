  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Официальное решение, сжатое изложение",
      "text": "В официальном решении сначала доказывается вспомогательный факт: существует раскраска ребер полного графа на `2^n` вершинах в `n` цветов так, что подграф каждого цвета двудолен. Для этого вершины полного графа нумеруют двоичными строками длины `n`, а ребро между двумя строками красят по первому разряду, в котором они различаются. Ребра одного фиксированного цвета соединяют только строки с разными значениями этого разряда, поэтому образуют двудольный граф.\n\nЗатем вершины исходного графа правильно красят в `1001` цвет, что возможно жадно, так как максимальная степень равна 1000. Эти `1001` цветов вкладывают в вершины вспомогательного полного графа на `1024 = 2^10` вершинах. Каждому ребру исходного графа присваивают цвет ребра между соответствующими цветами его концов во вспомогательном полном графе.\n\nЕсли бы в исходном графе появился одноцветный нечетный цикл, то последовательность цветов его вершин дала бы замкнутый нечетный обход в одном двудольном цветном подграфе вспомогательного полного графа. Это невозможно. Следовательно, одноцветных нечетных циклов в построенной раскраске нет.",
