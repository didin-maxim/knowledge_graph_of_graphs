      "id": "sol-official-restored",
      "title": "Минимальный содержащий круг",
      "text": "Пусть \\(T\\) — наше дерево.\n\nЛемма. Рассмотрим произвольную замкнутую ломаную с концами в наших точках. Пусть длина её ребра \\(AB\\) строго меньше длин всех остальных её рёбер. Тогда ребро \\(AB\\) не принадлежит \\(T\\).\n\nДоказательство. Предположим противное. Тогда после удаления \\(AB\\) дерево распадается на две компоненты. Одно из рёбер ломаной, отличное от \\(AB\\), соединяет эти две компоненты. Заменив \\(AB\\) на это ребро, мы увеличим сумму длин рёбер дерева, что невозможно.\n\n\nРассмотрим круг \\(K\\) наименьшего радиуса, содержащий данное множество точек \\(S\\); пусть \\(O\\) — его центр. Считаем, что радиус \\(K\\) равен \\(1\\). Тогда на границе круга \\(K\\) либо лежат две противоположные точке из \\(S\\), либо три точки, образующие остроугольный  треугольник; назовём эти две или три точки базовыми и обозначим их \\(B_1,B_2(,B_3)\\).\n\nМы утверждаем, что все построенные круги содержат \\(O\\). Пусть это не так, и в дереве есть ребро \\(XY\\) такое, что \\(\\angle XOY\\) острый. Мы найдём ломаную, в которой \\(XY\\) — ребро строго наименьшей длины, а вершинами её будут являться \\(X\\), \\(Y\\) и базовые точки. С этой целью введём граф \\(G\\) на этих (не более чем пяти)  точках: ребро будем проводить, если оно длиннее \\(XY\\). Мы докажем, что \\(G\\) связен, откуда и следует требуемое. Из теоремы косинусов получаем, что \\(XY<\\sqrt2\\).\n\nОтождествим каждую точку с вектором, ведущим из \\(O\\) в неё; скалярное произведение будем обозначать точкой. Существуют такие положительные \\(\\alpha_i\\), что \\(\\sum_i \\alpha_iB_i=0\\). Умножая на это равенство \\(X\\), видим, что какое-то из произведений вида \\(X\\cdot B_i\\) неположительно. Напомним, что \\(X \\cdot Y>0\\); тогда\n\\[\n(X-B_i)^2=X^2+1-2X\\cdot B_i>X^2+Y^2-2X\\cdot Y=(X-Y)^2,\n\\]\nто есть ребро \\(XB_i\\) лежит в \\(G\\). Применив тот же довод к вектору \\(Y\\), получаем базовую точку \\(B_j\\), для которой \\(YB_j>XY\\); значит, ребро \\(YB_j\\) лежит в \\(G\\).\n\nОсталось доказать, что подграф на базовых вершинах связен. Если их две, это очевидно, ибо \\(B_1B_2=2>XY\\). Если их три, то в остроугольном треугольнике \\(B_1B_2B_3\\)  максимум один угол не превосходит \\(45^\\circ\\), то есть максимум одна сторона не длиннее \\(\\sqrt2\\). Остальные две стороны будут в нашем графе, откуда и следует требуемое.",
