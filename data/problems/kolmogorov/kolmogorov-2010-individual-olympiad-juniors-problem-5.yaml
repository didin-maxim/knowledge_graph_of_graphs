      "id": "sol-official-compressed",
      "title": "Полное решение",
      "text": "Ответ: `792` часа.\n\nОбозначим города вершинами графа, а временем между двумя городами будем считать время кратчайшего пути между ними. По условию для любых двух городов это время не превосходит `8` часов.\n\nСначала докажем, что `792` часов всегда достаточно. В полном графе на 100 вершинах было бы `100 * 99 / 2 = 4950` ребер, а дорог всего 1000, поэтому найдутся два города, между которыми нет прямой дороги. Обозначим их `x1` и `x3`. Возьмем кратчайший путь из `x1` в `x3`; так как прямой дороги нет, этот путь проходит хотя бы через один промежуточный город. Назовем первый такой промежуточный город `x2`. Тогда сумма времен пути от `x1` до `x2` и от `x2` до `x3` равна времени кратчайшего пути от `x1` до `x3`, а значит, не превосходит `8` часов.\n\nОстальные 97 городов занумеруем произвольно как `x4, x5, ..., x100`. Премьер-министр едет по маршруту\n`x1 -> x2 -> x3 -> x4 -> ... -> x100 -> x1`,\nкаждый раз выбирая кратчайший путь между соседними указанными городами. На два первых перехода вместе уходит не более `8` часов. После этого остается еще 98 переходов: от `x3` к `x4`, ..., от `x99` к `x100` и от `x100` к `x1`; каждый из них занимает не более `8` часов. Поэтому все путешествие занимает не более\n`8 + 98 * 8 = 99 * 8 = 792`\nчасов.\n\nОсталось показать, что меньшего гарантировать нельзя. Рассмотрим такую страну. Есть центральный город `c` и 99 остальных городов. Каждый из этих 99 городов соединен с `c` дорогой длиной 4 часа. Кроме того, между некоторыми парами нецентральных городов проведены дороги длиной 8 часов так, чтобы всего дорог стало ровно 1000; это возможно, потому что кроме 99 дорог к центру надо добавить 901 дорогу, а пар нецентральных городов `99 * 98 / 2 = 4851`. Между любыми двумя нецентральными городами можно добраться через центр за 8 часов, так что условие задачи выполнено.\n\nВ этой стране расстояние между любыми двумя нецентральными городами равно 8 часов: прямые добавленные дороги тоже имеют длину 8, а путь через центр имеет длину `4 + 4 = 8`. Возьмем любой замкнутый объезд и выпишем в циклическом порядке все моменты, когда маршрут находится в нецентральном городе. Таких моментов не меньше 99, потому что все нецентральные города должны быть посещены. Участок маршрута между двумя соседними выписанными моментами идет от одного нецентрального города к нецентральному городу; даже если это один и тот же город, такой участок не может стоить меньше 8 часов в рассматриваемой сети, а для разных нецентральных городов кратчайшее расстояние тоже равно 8. Значит, суммарное время объезда не меньше `99 * 8 = 792` часов.\n\nИтак, `792` часа всегда достаточно, и в приведенном примере быстрее гарантированно объехать все города и вернуться в исходный нельзя.",
