  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Официальное решение, сжатое изложение",
      "text": "Ответ: `99 * 8 = 792` часа.\n\nРассматривается граф городов и дорог. Поскольку граф на 100 вершинах и 1000 ребрах не является полным, найдутся два города, кратчайший путь между которыми проходит через промежуточный город. Пусть, например, кратчайший путь от `x1` к `x3` идет через `x2`.\n\nТогда можно построить цикл `x1 -> x2 -> x3 -> ... -> x100`, в котором каждый переход требует не более 8 часов. Всего таких переходов 99, значит, весь объезд можно гарантировать за `99 * 8` часов.\n\nОценка точна: если все города соединены с одним центральным городом дорогами по 4 часа, а между остальными парами дорог либо нет, либо они имеют длину 8 часов, то лучше гарантированно сделать нельзя.",
