        "id": "stmt-original",
        "title": "Оригинальная формулировка",
        "text": "В стране 100 городов и 1000 дорог; каждая дорога соединяет ровно два города. Известно, что из любого города можно добраться в любой другой не более чем за 8 часов.\n\nПремьер-министр хочет объехать все города и вернуться в исходный. За какое минимальное время он гарантированно может это сделать?",
        "source_id": "src-kolmogorov-2010-official",
        "status": "ai_checked",
