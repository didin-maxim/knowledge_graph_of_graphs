      {
        "id": "stmt-original",
        "text": "Вершины ориентированного графа — числа \\(0,1,\\ldots,2020\\) на окружности. Из каждой вершины \\(i\\) проведены ориентированные рёбра в \\(i+1,i+2,\\ldots,i+101\\) по модулю 2021. Раскрасьте рёбра в как можно меньшее число цветов так, чтобы для каждой упорядоченной пары вершин существовал ориентированный путь, рёбра которого имеют попарно различные цвета. Найдите минимальное число цветов.",
        "source_id": "src-kolmogorov-2021-official",
        "status": "ai_checked",
