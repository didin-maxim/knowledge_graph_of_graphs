  "ideas": [
    {
      "id": "idea-2020-needs-20-jumps",
      "title": "Чтобы пройти на 2020 вперёд, нужно хотя бы 20 ребер",
      "text": "Любой ориентированный путь состоит не более чем из стольких рёбер, сколько использовано цветов, а каждое ребро прибавляет по кругу не более 101. Чтобы попасть из вершины в предыдущую, суммарный прирост должен быть не меньше 2020.",
      "tags": [
        "extremal_choice"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-color-by-tail-mod-20",
      "title": "Красить по остатку хвоста по модулю 20",
      "text": "Если нумеровать вершины остатками по модулю 2021 и красить любое исходящее ребро из вершины \\(i\\) цветом \\(i \\bmod 20\\), то последовательные прыжки на 101 сдвигают цвет на 1 по модулю 20. Разложение \\(d=101q+r\\) даёт радужный путь длины \\(q\\) или \\(q+1\\).",
      "tags": [
        "coloring"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-mod-20-coloring",
      "title": "Ответ 20",
      "text": "Ответ равен \\(20\\). Нижняя оценка: рассмотрим две соседние по кругу вершины так, чтобы из первой во вторую надо было пройти суммарный сдвиг \\(2020\\) против часовой стрелки. Любой радужный путь использует не более одного ребра каждого цвета, то есть если цветов \\(k\\), то в таком пути не более \\(k\\) рёбер. Каждое ребро сдвигает не более чем на \\(101\\), поэтому суммарный сдвиг не превосходит \\(101k\\). Чтобы получить сдвиг \\(2020\\), необходимо \\(101k\\ge 2020\\), откуда \\(k\\ge 20\\). Верхняя оценка: занумеруем вершины числами \\(0,1,\\dots,2020\\) по кругу и покрасим каждое ребро \\(i\\to i+d\\), где \\(1\\le d\\le 101\\), цветом \\(i \\bmod 20\\). Для любой пары вершин нужно получить нужный сдвиг \\(s\\in\\{0,1,\\dots,2020\\}\\). Представим \\(s=101q+r\\), где \\(0\\le q\\le 19\\) и \\(0\\le r\\le 100\\). Если \\(r=0\\), идём \\(q\\) раз по ребру длины \\(101\\). Если \\(r>0\\), идём \\(q\\) раз по ребру длины \\(101\\), а затем один раз по ребру длины \\(r\\). Такой путь существует, потому что все длины от 1 до 101 разрешены. Цвета его рёбер равны \\(i,i+1,\\dots,i+q\\pmod{20}\\), то есть попарно различны, поскольку используется не более 20 рёбер. Значит, 20 цветов достаточно.",
