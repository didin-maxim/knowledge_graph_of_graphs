        "title": "Оригинальная формулировка",
        "text": "Назовем граф `a`-хорошим, если в нем нет 100 попарно соединенных вершин и степень каждой вершины не превосходит `a`.\n\nПусть натуральные числа `d >= 100` и `k` таковы, что вершины любого `d`-хорошего графа можно правильно раскрасить в `k` цветов. Докажите, что вершины любого `(d^2 - 2)`-хорошего графа можно правильно раскрасить в `(d - 1)k` цветов.",
