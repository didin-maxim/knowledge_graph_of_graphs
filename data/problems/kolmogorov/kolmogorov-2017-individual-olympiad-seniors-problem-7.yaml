  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Official solution, compressed",
      "text": "Ключевая лемма: если каждый `a`-хороший граф красится в `x` цветов, а каждый `b`-хороший — в `y` цветов, то каждый `(a+b+1)`-хороший граф красится в `x+y` цветов.\n\nДоказательство леммы. Нужно разбить вершины любого `(a+b+1)`-хорошего графа на два множества `A` и `B` так, чтобы в индуцированном подграфе на `A` максимальная степень была не больше `a`, а на `B` — не больше `b`. Для разбиения `A ∪ B` вводится цена\n\n`b * e(A) + a * e(B)`,\n\nгде `e(A)` и `e(B)` — числа ребер внутри соответствующих частей. Берется разбиение минимальной цены.\n\nЕсли в `A` найдется вершина `v`, имеющая хотя бы `a+1` соседей внутри `A`, то, поскольку общая степень `v` не превосходит `a+b+1`, в `B` у нее не более `b` соседей. Переброс `v` из `A` в `B` уменьшает цену хотя бы на\n\n`b(a+1) - ab = b > 0`,\n\nчто противоречит минимальности. Аналогично разбирается `B`. Следовательно, нужное разбиение существует, а затем части раскрашиваются независимо в `x` и `y` цветов.\n\nТеперь применим лемму индуктивно. Из условия известно, что любой `d`-хороший граф красится в `k` цветов. Отсюда следует, что любой `(n(d+1)-1)`-хороший граф красится в `nk` цветов. Действительно, переход получается применением леммы к параметрам `a=(n-1)(d+1)-1` и `b=d`.\n\nПри `n=d-1` получаем, что любой `((d-1)(d+1)-1) = d^2-2`-хороший граф раскрашивается в `(d-1)k` цветов, что и требовалось.",
