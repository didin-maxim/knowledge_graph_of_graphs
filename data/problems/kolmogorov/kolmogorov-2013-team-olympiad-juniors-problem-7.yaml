  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Полное решение",
      "text": "Возьмем правильную раскраску подграфа на `B ∪ C` в `n` цветов. Один из этих цветов назовем первым, а через `D` обозначим множество вершин из `B`, которые получили первый цвет.\n\nТеперь воспользуемся тем, что подграф на `A ∪ B` можно правильно раскрасить в `k` цветов. Тогда его индуцированный подграф на `A ∪ D` тоже можно правильно раскрасить в `k` цветов: достаточно ограничить любую правильную `k`-раскраску `A ∪ B` на вершины `A ∪ D`. Для этой новой раскраски используем палитру из первого старого цвета и еще `k-1` совершенно новых цветов, не встречавшихся в раскраске `B ∪ C`.\n\nЗададим итоговую раскраску так. Вершины из `A ∪ D` красим только что выбранной правильной `k`-раскраской. Все остальные вершины, то есть вершины из `(B ∪ C) \\ D`, оставляем в их старых цветах из раскраски `B ∪ C`. Всего использовано `n` старых цветов и `k-1` новых, то есть `k+n-1` цвет.\n\nПроверим, что конфликтов нет. Внутри `A ∪ D` конфликтов нет по построению новой `k`-раскраски. Внутри `(B ∪ C) \\ D` конфликтов нет, потому что мы только удалили часть вершин из правильной раскраски `B ∪ C`. Между `A` и `C` ребер нет по условию задачи. Между `A` и `B \\ D` также нет цветового конфликта: вершины `B \\ D` сохранили старые цвета, отличные от первого, а вершины `A` используют только первый цвет и новые цвета. Новые цвета нигде вне `A ∪ D` не встречаются.\n\nОстается проверить ребра между `D` и `C`. Если вершина из `C` имеет первый старый цвет, то она не смежна с вершинами из `D`, потому что в исходной правильной раскраске `B ∪ C` все вершины цвета `1` образовывали независимое множество. Если вершина из `C` имеет другой старый цвет, то она не конфликтует с вершиной из `D`, окрашенной первым или новым цветом. Значит, итоговая раскраска правильная, и весь граф раскрашен в `k+n-1` цвет.",
