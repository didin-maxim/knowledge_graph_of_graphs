        "id": "stmt-original",
        "title": "Оригинальная формулировка",
        "text": "Вершины графа разбиты на три множества `A`, `B`, `C` так, что вершины из `A` не связаны рёбрами с вершинами из `C`.\n\nИзвестно, что `A ∪ B` можно правильно раскрасить в `k` цветов, а `B ∪ C` — в `n` цветов. Докажите, что весь граф можно правильно раскрасить в `k+n-1` цвет.",
        "source_id": "src-kolmogorov-2013-official",
