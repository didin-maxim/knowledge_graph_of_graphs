  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Официальное решение, сжатое изложение",
      "text": "Раскрасим `B ∪ C` в `n` цветов и назовём один из этих цветов первым. Пусть `D` — множество всех вершин из `B`, покрашенных в первый цвет.\n\nТеперь раскрасим `A ∪ D` в `k` цветов, использовав в качестве одного из них тот же первый цвет, а остальные `k-1` цветов взяв отличными от уже использованных в раскраске `B ∪ C`.\n\nУ вершин, не входящих в `A ∪ D`, сохраним прежнюю раскраску. Полученная раскраска корректна: вершины из `A ∪ D` не соединены рёбрами с вершинами из `C`, покрашенными в первый цвет. Для вершин из `D` это следует из правильности исходной раскраски `B ∪ C`, а для вершин из `A` — из условия, что между `A` и `C` нет рёбер.\n\nЗначит, весь граф удалось правильно раскрасить в `k+n-1` цвет.",
