  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Официальное решение, сжатое изложение",
      "text": "Решение ведется индукцией по числу вершин. Если в графе есть точка сочленения, его разбивают на два индуцированных подграфа с общей вершиной и раскрашивают их по индукции, согласовав цвет общей вершины. Если граф разделяется удалением двух вершин x и y, его разбивают на два подграфа с общими вершинами x и y и при необходимости добавляют ребро xy. Показывается, что условие про не более чем три простых цикла через каждое ребро сохраняется, после чего оба подграфа раскрашиваются по индукции и раскраски склеиваются. В оставшемся случае граф не имеет ни точек сочленения, ни разделяющих пар вершин, поэтому все степени не меньше трех. Тогда в нем находится подразбиение K4, но в таком подразбиении какое-то ребро входит как минимум в четыре различных простых цикла, что противоречит условию. Значит, предыдущие случаи исчерпывают все варианты, и 3-раскраска существует.",
