  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Подробное решение",
      "text": "Докажем утверждение индукцией по числу вершин. Несвязный граф раскрашивается по компонентам, поэтому далее можно считать граф H связным. База для графов не более чем с тремя вершинами очевидна.\n\nЕсли в H есть точка сочленения a, то H разбивается на два меньших индуцированных подграфа H1 и H2 с единственной общей вершиной a. Каждый из них удовлетворяет тому же условию о циклах, потому что любой его простой цикл является простым циклом в H. По предположению индукции H1 и H2 правильно 3-раскрашиваются; переставив названия цветов в одной раскраске, добиваемся, чтобы цвет a совпал, и склеиваем раскраски.\n\nТеперь пусть H не имеет точек сочленения, но существуют две вершины x и y, такие что H - {x,y} несвязен. Разобьем компоненты H - {x,y} на две непустые группы и обозначим через H1' и H2' индуцированные подграфы на вершинах этих групп вместе с x и y. Так как в H нет точек сочленения, в каждом из H1' и H2' есть путь из x в y. Если ребра xy не было, добавим его в оба графа; получим H1 и H2. Докажем, что H1 и H2 тоже удовлетворяют условию задачи. Допустим, например, что в H1 есть ребро e, через которое проходят четыре различных простых цикла. Если все эти циклы уже лежат в H, получаем прямое противоречие. Иначе некоторые из них используют добавленное ребро xy. Заменим в каждом таком цикле ребро xy одним и тем же путем из x в y внутри H2'. Получатся четыре различных простых цикла графа H. Если e != xy, все они проходят через e; если e = xy, все они проходят через любое фиксированное ребро выбранного пути в H2'. В обоих случаях нарушается условие задачи. Значит, H1 и H2 допустимы. По индукции раскрасим их в три цвета. В обоих графах вершины x и y смежны, поэтому имеют разные цвета; перестановкой цветов можно сделать цвета x и y одинаковыми в двух раскрасках, после чего раскраски склеиваются в правильную раскраску H.\n\nОсталось рассмотреть случай, когда H не имеет ни точек сочленения, ни разделяющих пар вершин. Тогда каждая вершина имеет степень не меньше 3: вершина степени 1 дала бы точку сочленения, а вершина степени 2 после удаления двух своих соседей отделилась бы от остального графа. Следовательно, в H есть цикл длины хотя бы 4: возьмем максимальный простой путь, и у его конца есть по крайней мере три соседа на этом пути, так что самый дальний из них замыкает цикл длины не меньше 4.\n\nПусть C - такой цикл, а a и b - две несоседние вершины C. Так как {a,b} не является разделяющей парой, граф H - {a,b} связен. После удаления a и b цикл C распадается на две дуги, поэтому в H - {a,b} есть путь P, соединяющий эти дуги; выберем его так, чтобы внутренние вершины не лежали на C, и обозначим его концы через c и d. Вершины c и d не соседние на C. Снова пользуясь тем, что {c,d} не разделяет граф, получаем путь Q в H - {c,d}, соединяющий две дуги, на которые c и d делят C; выбираем Q с внутренними вершинами вне C и обозначаем его концы через u и v.\n\nЕсли внутренние части P и Q не пересекаются, то объединение C, P и Q является подразбиением K4 с ветвящимися вершинами c,d,u,v: четыре пути идут по дугам цикла C, а еще два - это P и Q. Если же P и Q пересекаются, пусть z - первая при движении по Q от u точка пересечения с P. Тогда дуги C вместе с отрезком Q от u до z и двумя частями P от z до c и d дают подразбиение K4 с ветвящимися вершинами c,d,u,z.\n\nВ любом подразбиении K4 каждое ребро, лежащее на пути, соответствующем одному ребру K4, входит в четыре простых цикла: в K4 данное ребро лежит в двух треугольниках и в двух четырехвершинных циклах, и эти циклы поднимаются до простых циклов подразбиения. Это противоречит условию, что через каждое ребро проходит не более трех простых циклов. Последний случай невозможен, а во всех остальных случаях индукция уже построила правильную 3-раскраску.",
