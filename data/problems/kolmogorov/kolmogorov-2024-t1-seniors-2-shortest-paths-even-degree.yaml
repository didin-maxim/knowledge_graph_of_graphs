  "solutions": [
    {
      "id": "sol-even-degree-exact",
      "title": "Точный ответ \\(2m^t\\)",
      "text": "Ответ: \\(2m^t\\).\n\nСначала докажем верхнюю оценку самодостаточно. Оставим в графе только рёбра, лежащие на кратчайших путях из \\(x\\) в \\(y\\), и разобьём вершины на слои \\(L_i=\\{v:\\operatorname{dist}(x,v)=i\\}\\), \\(0\\le i\\le t\\). Параллельные рёбра считаем различными. Для вершины \\(v\\in L_i\\) обозначим через \\(a(v)\\) число рёбер из \\(L_{i-1}\\) в \\(v\\), а через \\(b(v)\\) число рёбер из \\(v\\) в \\(L_{i+1}\\). Тогда для внутренних слоёв \\(a(v)+b(v)\\le2m\\), поэтому \\(a(v)b(v)\\le m^2\\).\n\nПусть всего кратчайших путей \\(N\\), и выберем один равновероятно. Энтропия выбранного пути равна \\(\\log N\\). При чтении слева направо следующий шаг из вершины \\(v\\) имеет не более \\(b(v)\\) вариантов, а при чтении справа налево предыдущий шаг имеет не более \\(a(v)\\) вариантов. Складывая две оценки цепного правила для энтропии, получаем\n\\[2\\log N\\le \\log b(x)+\\log a(y)+\\mathbb E\\sum_{i=1}^{t-1}\\log(a(X_i)b(X_i)).\\]\nЗдесь \\(b(x)\\le2m\\), \\(a(y)\\le2m\\), а каждое внутреннее произведение не больше \\(m^2\\). Следовательно,\n\\[2\\log N\\le2\\log(2m)+2(t-1)\\log m,\\]\nто есть \\(N\\le2m^t\\).\n\nОсталось построить пример. Возьмём две внутренне непересекающиеся цепочки длины \\(t\\) от \\(x\\) к \\(y\\). Если \\(t=1\\), это просто две параллельные группы рёбер между \\(x\\) и \\(y\\). Каждое ребро каждой цепочки заменим на \\(m\\) параллельных рёбер. У концов степень равна \\(2m\\), у внутренних вершин — тоже \\(2m\\), расстояние между \\(x\\) и \\(y\\) равно \\(t\\). На каждой из двух цепочек можно независимо выбрать одно из \\(m\\) параллельных рёбер на каждом шаге, значит каждая цепочка даёт \\(m^t\\) кратчайших путей. Всего получается \\(2m^t\\) кратчайших путей. Верхняя оценка и пример совпали, поэтому максимум равен \\(2m^t\\).",
