        "text": "Пусть \\(N\\) — положительное нечетное число. Вершины гиперкуба \\(\\{0,1\\}^N\\) окрашены в красный и синий цвета. Для каждого непустого множества координат \\(S\\) рассмотрим совершенное паросочетание, соединяющее каждую вершину с вершиной, полученной изменением ровно координат из \\(S\\). Обязательно ли существует такое \\(S\\), что в этом паросочетании число рёбер с одноцветными концами отличается от числа рёбер с разноцветными концами?",
