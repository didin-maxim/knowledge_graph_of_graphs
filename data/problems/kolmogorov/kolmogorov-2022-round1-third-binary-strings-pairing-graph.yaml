  "solutions": [
    {
      "id": "sol-official-restored",
      "title": "Сумма по всем сдвигам",
      "text": "Ответ: да.\n\nЗаменим красный цвет числом 1, а синий числом -1. Для двоичной строки x обозначим это число через f(x). Если выбран непустой набор позиций s, то разность между числом одноцветных и разноцветных пар равна половине суммы\n\\[\n  A_s=\\sum_x f(x)f(x+s),\n\\]\nгде сложение x+s означает одновременный переворот выбранных битов, а сумма берётся по всем двоичным строкам длины 99. Достаточно доказать, что для некоторого ненулевого s величина A_s не равна нулю.\n\nПросуммируем A_s по всем 2^{99} векторам s, включая нулевой. Получим\n\\[\n  \\sum_s A_s=\\sum_s\\sum_x f(x)f(x+s)=\\left(\\sum_x f(x)\\right)^2.\n\\]\nЕсли бы все A_s при ненулевых s были равны нулю, то эта сумма равнялась бы A_0=2^{99}. Но \\(\\left(\\sum_x f(x)\\right)^2\\) является квадратом целого числа, а 2^{99} не является полным квадратом. Противоречие.\n\nЗначит, существует непустой набор позиций s, для которого A_s\\ne0; для соответствующего разбиения число одноцветных пар отличается от числа разноцветных.",
