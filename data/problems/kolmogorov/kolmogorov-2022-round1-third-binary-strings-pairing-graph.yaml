        "title": "Оригинальная формулировка",
        "text": "На доске записаны все двоичные строки длины 99, каждая красным или синим цветом. Затем выбирается непустое множество позиций, и строки разбиваются на пары так, что две строки в каждой паре отличаются ровно в выбранных позициях. Обязательно ли можно выбрать позиции так, чтобы число одноцветных пар отличалось от числа разноцветных пар?",
