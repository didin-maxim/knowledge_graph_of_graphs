        "id": "stmt-original",
        "title": "Оригинальная формулировка",
        "text": "По окружности расположены `n` площадей, каждая соединена дорогой с двумя соседними. В центре расположена еще одна площадь, соединенная дорогами со всеми остальными. Нужно выбрать `n` дорог так, чтобы между любыми двумя площадями можно было пройти по выбранным дорогам. Докажите, что число таких проектов равно `F_{2n+1} + F_{2n-1} - 2`.",
