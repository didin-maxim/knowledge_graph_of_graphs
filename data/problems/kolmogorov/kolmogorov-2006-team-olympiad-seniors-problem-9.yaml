  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Развернутое решение через лапы и рекурренцию",
      "text": "Будем считать площади вершинами графа. Внешние площади образуют цикл из `n` вершин, а центральная площадь соединена со всеми внешними; это граф-колесо `W_n` с `n + 1` вершинами. Если выбрать `n` дорог так, чтобы по ним можно было пройти между любыми двумя площадями, то выбранный связный граф имеет `n + 1` вершину и `n` ребер, а значит является деревом. Поэтому нужно посчитать остовные деревья графа `W_n`.\n\nСначала посчитаем остовные деревья в графе-лапе `L_m`: это путь `A_1A_2...A_m` и дополнительная вершина `O`, соединенная со всеми `A_i`. Обозначим число таких деревьев через `T_m`. Докажем, что `T_m = F_{2m}`.\n\nДля дерева в `L_m` посмотрим на наибольшее `k`, для которого ребра пути `A_1A_2, A_2A_3, ..., A_{k-1}A_k` входят в дерево, а ребро `A_kA_{k+1}` не входит; при `k = m` последнего условия нет. Тогда блок `A_1, ..., A_k` должен быть присоединен к `O` ровно одним из `k` ребер `OA_i`: без такого ребра он был бы отделен, а с двумя возник бы цикл. Оставшаяся часть независимо является остовным деревом лапы `L_{m-k}`. Поэтому\n\n`T_m = F_{2m-2} + 2F_{2m-4} + ... + (m-1)F_2 + m`.\n\nИндукцией по `m` это равно `F_{2m}`. Действительно, для меньшего `m` уже есть\n`F_{2m-2} = F_{2m-4} + 2F_{2m-6} + ... + (m-2)F_2 + (m-1)`,\nи после подстановки получаем\n`T_m = F_{2m-2} + F_{2m-2} + F_{2m-4} + ... + F_2 + 1 = F_{2m-2} + F_{2m-1} = F_{2m}`.\n\nВернемся к колесу. Возьмем остовное дерево в `W_n` и удалим из него все ребра, выходящие из центральной вершины. Внешние вершины разобьются на связные отрезки цикла. Посчитаем деревья по размеру `k` отрезка, содержащего фиксированную вершину `A_1`.\n\nЕсли `1 <= k <= n - 1`, то выбрать этот отрезок из `k` последовательных внешних вершин, содержащий `A_1`, можно `k` способами. Внутри него надо выбрать ровно одно из `k` ребер к центру, а на оставшихся `n-k` внешних вершинах остается лапа `L_{n-k}`. Это дает `k^2 F_{2n-2k}` деревьев. Если `k = n`, то нужно выбрать одно из `n` ребер цикла, которое не входит в дерево, и одно из `n` ребер к центру; получаем `n^2` деревьев. Следовательно, искомое число `G_n` равно\n\n`G_n = F_{2n-2} + 2^2F_{2n-4} + 3^2F_{2n-6} + ... + (n-1)^2F_2 + n^2`.\n\nОсталось упростить эту сумму. Покажем, что `G_n = F_{2n-1} + F_{2n+1} - 2`. Для `n = 3` и `n = 4` это проверяется прямой подстановкой в последнюю формулу. При `n > 4` используем тождество `F_{r+4} - 3F_{r+2} + F_r = 0`, которое сразу следует из рекуррентного определения чисел Фибоначчи. Тогда в разности `G_n - 3G_{n-1} + G_{n-2}` все внутренние слагаемые сокращаются, а крайние дают\n\n`3(n-2)^2 + (n-1)^2 + n^2 - 3(n-2)^2 - 3(n-1)^2 + (n-2)^2 = 2`.\n\nТа же рекурренция с той же правой частью выполняется для `H_n = F_{2n-1} + F_{2n+1} - 2`, потому что каждое из чисел `F_{2n-1}` и `F_{2n+1}` удовлетворяет однородной рекурренции `X_n - 3X_{n-1} + X_{n-2} = 0`, а постоянное `-2` дает вклад `2`. При совпадающих начальных значениях `n = 3, 4` получаем `G_n = H_n` для всех `n >= 3`.\n\nЗначит число способов выбрать дороги действительно равно `F_{2n+1} + F_{2n-1} - 2`.",
