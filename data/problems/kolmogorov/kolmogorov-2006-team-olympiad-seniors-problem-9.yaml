      "id": "sol-official-compressed",
      "title": "Официальное решение, сжатое изложение",
      "text": "Официальное решение прямо переводит задачу на граф «колесо» `W_n`. Искомые проекты — это остовные деревья этого графа.\n\nДля подсчета вводят вспомогательный граф «лапа» `L_n`, получаемый из пути длины `n` добавлением вершины, соединенной со всеми вершинами пути. Доказывается лемма: число остовных деревьев в `L_n` равно `F_{2n}`.\n\nПосле этого колесо разбивают на два естественных случая и выражают число его остовных деревьев через соседние значения для «лапы». В итоге получается формула\n`F_{2n+1} + F_{2n-1} - 2`.",
