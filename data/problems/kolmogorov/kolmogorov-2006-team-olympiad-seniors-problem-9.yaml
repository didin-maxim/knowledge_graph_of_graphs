        "title": "Оригинальная формулировка",
        "text": "По окружности расположены `n >= 3` площадей, каждая соединена дорогой с двумя соседними. В центре расположена еще одна площадь, соединенная дорогами со всеми остальными. Нужно выбрать `n` дорог так, чтобы между любыми двумя площадями можно было пройти по выбранным дорогам. Докажите, что число таких проектов равно `F_{2n+1} + F_{2n-1} - 2`, где `F_1 = F_2 = 1` и `F_{m+2} = F_m + F_{m+1}`.",
