  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Развернутое решение через число остовных деревьев колеса",
      "text": "Будем считать площади вершинами графа. Внешние площади образуют цикл из `n` вершин, а центральная площадь соединена со всеми внешними; это граф-колесо `W_n` с `n + 1` вершинами. Если выбрать `n` дорог так, чтобы по ним можно было пройти между любыми двумя площадями, то выбранный связный граф имеет `n + 1` вершин и `n` ребер, а значит является деревом. Поэтому нужно посчитать остовные деревья графа `W_n`.\n\nВоспользуемся матричной теоремой о деревьях. Удалим из лапласиана графа строку и столбец, соответствующие центральной вершине. Останется матрица `A` размера `n \\times n`: на диагонали стоят числа `3`, а в двух соседних по циклу позициях каждой строки стоят `-1`, включая угловые позиции, соответствующие ребру между первой и последней внешними вершинами. Тогда число нужных проектов равно `det A`.\n\nПусть `\\zeta` -- первообразный корень степени `n` из единицы. Для `k = 0, 1, ..., n-1` вектор `(1, \\zeta^k, \\zeta^{2k}, ..., \\zeta^{(n-1)k})` является собственным вектором матрицы `A` с собственным значением\n`3 - \\zeta^k - \\zeta^{-k}`.\nСледовательно,\n`det A = \\prod_{k=0}^{n-1} (3 - \\zeta^k - \\zeta^{-k})`.\n\nОбозначим через `\\alpha` и `\\beta` корни уравнения `x^2 - 3x + 1 = 0`. Тогда `\\alpha + \\beta = 3`, `\\alpha\\beta = 1`, и для любого `z`\n`3 - z - z^{-1} = -z^{-1}(z - \\alpha)(z - \\beta)`.\nПодставляя `z = \\zeta^k` и перемножая по всем `k`, получаем\n`det A = - (\\alpha^n - 1)(\\beta^n - 1) = \\alpha^n + \\beta^n - 2`, потому что `\\alpha\\beta = 1`.\n\nТеперь `\\alpha = \\varphi^2`, `\\beta = \\psi^2`, где `\\varphi = (1 + \\sqrt5)/2`, `\\psi = (1 - \\sqrt5)/2`. Поэтому `\\alpha^n + \\beta^n = \\varphi^{2n} + \\psi^{2n} = L_{2n}`, где `L_m` -- числа Люка. Из стандартной связи `L_m = F_{m-1} + F_{m+1}` следует\n`det A = L_{2n} - 2 = F_{2n-1} + F_{2n+1} - 2`.\n\nЗначит число способов выбрать дороги действительно равно `F_{2n+1} + F_{2n-1} - 2`.",
