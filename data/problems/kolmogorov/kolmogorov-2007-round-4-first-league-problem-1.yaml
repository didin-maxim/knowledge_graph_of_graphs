  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "??????????? ???????, ?????? ???????",
      "text": "В официальном решении берут простой нечетный цикл `C = a_1...a_n` исходного графа и работают в сильно связной ориентации этого графа.\n\nПроходя по циклу `C`, для каждого ребра `a_i a_{i+1}` смотрят, совпадает ли его ориентация с направлением обхода. Если да, его просто включают в строящуюся цепь. Если нет, то по сильной связности существует ориентированный путь из `a_i` в `a_{i+1}`.\n\nЕсли такой путь имеет четную длину, то вместе с обратным ребром цикла он сразу дает ориентированный цикл нечетной длины. Если же путь нечетный, его присоединяют к текущей конструкции и переходят к следующей вершине цикла. В итоге после обхода всего `C` получается ориентированный цикл нечетной длины.",
