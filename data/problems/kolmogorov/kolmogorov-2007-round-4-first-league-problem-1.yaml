      "id": "sol-official-compressed",
      "title": "Самодостаточное доказательство существования нечетного ориентированного цикла",
      "text": "Пусть `C = a_1 a_2 ... a_m a_1` — простой нечетный цикл в исходном неориентированном графе, причем индексы читаются по модулю `m`. Работаем в данной сильно связной ориентации.\n\nДля каждого ребра `a_i a_{i+1}` цикла `C` поступим так. Если оно ориентировано как `a_i -> a_{i+1}`, запишем этот однореберный ориентированный путь. Если оно ориентировано как `a_{i+1} -> a_i`, то из сильной связности существует ориентированный путь `P_i` из `a_i` в `a_{i+1}`. Выберем `P_i` кратчайшим среди таких путей. Тогда в `P_i` нет повторяющихся вершин, и вместе с обратным ребром `a_{i+1} -> a_i` он образует ориентированный цикл.\n\nЕсли один из таких заменяющих путей `P_i` имеет четную длину, то `P_i` вместе с ребром `a_{i+1} -> a_i` дает нечетный ориентированный цикл, и все доказано. Иначе каждый заменяющий путь для обратно ориентированного ребра имеет нечетную длину, а каждое прямо ориентированное ребро, записанное как путь из одного ребра, тоже имеет нечетную длину.\n\nСклеим записанные ориентированные пути из `a_1` в `a_2`, из `a_2` в `a_3` и так далее до пути из `a_m` в `a_1`. Получится замкнутый ориентированный обход, длина которого равна сумме `m` нечетных чисел. Так как `m` нечетно, этот замкнутый ориентированный обход имеет нечетную длину.\n\nКаждый замкнутый ориентированный обход раскладывается на ориентированные циклы: можно разрезать его в повторяющейся вершине и продолжить по индукции. Если бы все циклы в таком разложении были четными, общая длина обхода была бы четной. Значит, хотя бы один ориентированный цикл в разложении нечетен. Это и дает требуемый нечетный ориентированный цикл.",
