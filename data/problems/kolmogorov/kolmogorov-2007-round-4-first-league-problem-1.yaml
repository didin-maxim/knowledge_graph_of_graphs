  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Self-contained odd directed cycle proof",
      "text": "Let C = a_1 a_2 ... a_m a_1 be a simple odd cycle in the original undirected graph, with indices read modulo m. Work in the given strongly connected orientation.\n\nFor each edge a_i a_{i+1} of C, do the following. If it is oriented a_i -> a_{i+1}, record this one-edge directed path. If it is oriented a_{i+1} -> a_i, strong connectivity gives a directed path P_i from a_i to a_{i+1}. Choose P_i shortest among such paths. Then P_i has no repeated vertex, and together with the reverse edge a_{i+1} -> a_i it forms a directed cycle.\n\nIf one of those replacement paths P_i has even length, then P_i plus the edge a_{i+1} -> a_i is an odd directed cycle, and we are done. Otherwise every replacement path used for a backward edge has odd length, while every forward edge recorded as a one-edge path also has odd length.\n\nConcatenate the recorded directed paths from a_1 to a_2, from a_2 to a_3, and so on up to a_m to a_1. This is a closed directed walk whose length is a sum of m odd numbers. Since m is odd, the closed directed walk has odd length.\n\nEvery closed directed walk decomposes into directed cycles by cutting at a repeated vertex and continuing inductively. If all cycles in this decomposition were even, the total walk length would be even. Hence at least one directed cycle in the decomposition is odd. This gives the required odd directed cycle.",
