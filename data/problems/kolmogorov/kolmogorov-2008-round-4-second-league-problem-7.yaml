  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Решение через сумму степеней",
      "text": "Так как граф связен и имеет 999 ребер при 1000 вершинах, он является деревом. Пусть в большей республике `R` городов, а в меньшей `B` городов, где `R >= B`.\n\nПредположим, что в большей республике нет листьев. Тогда каждая вершина этой доли имеет степень не меньше 2, и сумма степеней вершин большей доли не меньше `2R`.\n\nНо граф двудолен, поэтому сумма степеней вершин каждой доли равна числу ребер, то есть `999`. С другой стороны, `999 = R + B - 1`, а из `R >= B` следует `999 < 2R`, что дает противоречие. Значит, в большей республике есть вершина степени 1.",
