        "title": "Оригинальная формулировка",
        "text": "В стране 1000 городов соединены 999 дорогами, причем из любого города можно добраться в любой другой. Все города разбиты на две республики, причем в одной республике городов не меньше, чем в другой, и каждая дорога соединяет города разных республик. Докажите, что в большей республике есть город, из которого выходит только одна дорога.",
