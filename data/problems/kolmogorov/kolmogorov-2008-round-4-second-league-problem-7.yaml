      "id": "sol-official-compressed",
      "title": "Решение через сумму степеней",
      "text": "Рассмотрим города как вершины, а дороги как ребра. Граф связен и имеет `1000` вершин и `999` ребер, поэтому это дерево: в связном графе с `v` вершинами не меньше `v-1` ребер, а если бы был цикл, можно было бы удалить ребро цикла, не нарушив связности, и получить связный граф с меньшим числом ребер.\n\nПусть в большей республике `R` городов, а в меньшей `B` городов; тогда `R >= B` и `R+B=1000`. Каждая дорога соединяет города разных республик, значит граф двудолен с долями этих республик. В двудольном графе каждое ребро имеет ровно один конец в каждой доле, поэтому сумма степеней вершин большей доли равна общему числу ребер, то есть `999`.\n\nПредположим, что в большей республике нет города степени `1`. Степени не могут быть нулевыми, потому что граф связен и вершин больше одной. Значит, каждая вершина большей доли имеет степень хотя бы `2`, и сумма степеней этой доли не меньше `2R`.\n\nПолучаем `999 >= 2R`. Но из `R >= B` следует `2R >= R+B = 1000`, то есть `2R` не меньше `1000`. Это невозможно одновременно с `999 >= 2R`. Противоречие показывает, что в большей республике обязательно есть город степени `1`, то есть город, из которого выходит ровно одна дорога.",
