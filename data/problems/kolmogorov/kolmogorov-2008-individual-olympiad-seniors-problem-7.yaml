        "title": "Оригинальная формулировка",
        "text": "Сумма телесных углов при вершинах выпуклого многогранника равна π. Докажите, что существует замкнутый маршрут по его ребрам, проходящий через каждую его вершину ровно один раз. Телесный угол как величина многогранного угла измеряется площадью фигуры, высекаемой этим многогранным углом на единичной сфере; площадь всей единичной сферы равна 4π.",
