      "id": "sol-official-compressed",
      "title": "Official solution, compressed",
      "text": "Официальное решение рассматривает граф многогранника. Выбирают направление проектирования так, чтобы ни одна грань не была параллельна плоскости проекции, и проецируют многогранник на плоскость.\n\nТогда внешняя граница проекции проходит через все вершины: иначе часть многогранника закрывала бы другую часть, что противоречит выпуклости и треугольности граней. Следовательно, вершины на границе проекции образуют цикл, проходящий через каждую вершину ровно один раз.\n\nЭтот цикл и дает искомый замкнутый маршрут по ребрам многогранника.",
