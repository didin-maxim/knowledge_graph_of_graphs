  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Решение через проекцию",
      "text": "Обозначим многогранник через M, а его вершины через A. Для каждой вершины перенесем многогранный угол M при A в общий центр O единичной сферы. Пусть S_A — та часть сферы, которая попадает внутрь этого угла. По определению площадь S_A равна телесному углу при A, поэтому сумма площадей всех S_A равна π.\n\nРассмотрим также центрально-симметричные области -S_A. Суммарная площадь всех отмеченных областей S_A и -S_A, считая с кратностями, равна 2π, а площадь всей сферы равна 4π. Значит, найдется точка T сферы, не принадлежащая ни одной из этих областей; кроме того, ее можно выбрать так, чтобы прямая OT не была параллельна ни одной грани многогранника, потому что таких запрещенных направлений только конечное число больших окружностей.\n\nСпроектируем M на плоскость, перпендикулярную OT. Докажем, что проекция каждой вершины A является вершиной полученного выпуклого многоугольника. Проведем через A прямую, параллельную OT. Если эта прямая пересекает M по ненулевому отрезку с концом A, то одно из направлений OT или TO лежит внутри многогранного угла при A; на сфере это означало бы, что T принадлежит S_A или -S_A. Наш выбор T это исключает. Поэтому прямая имеет с M только точку A. Тогда через нее можно провести опорную плоскость к многогранному углу при A, пересекающую M только в A; после проекции соответствующая опорная прямая показывает, что проекция A является вершиной контура.\n\nИтак, все вершины M попали в вершины контура проекции. Соседние вершины контура проекции соединены проекцией некоторого ребра M: вертикальная опорная плоскость над стороной контура содержит отрезок между соответствующими вершинами многогранника; она не может содержать целую грань, так как OT не параллельна граням, значит этот отрезок является ребром. Следовательно, обход контура проекции поднимается в замкнутый путь по ребрам M, проходящий через все вершины ровно один раз. Это и есть требуемый маршрут.",
