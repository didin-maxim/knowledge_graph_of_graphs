      "id": "sol-robbins-critical",
      "title": "Минимально 2-связный граф и минимально сильная ориентация",
      "text": "Используем внешнюю теорему Дирака-Пламмера-Геллера: если конечный 2-вершинно-связный граф минимально 2-связен, то его рёбра можно ориентировать так, что получится минимально сильно связный орграф, то есть орграф сильно связен, но после удаления любой его дуги сильная связность пропадает. Кроме того, по характеристике Дирака-Пламмера 2-вершинно-связный граф минимально 2-связен тогда и только тогда, когда ни один его цикл не имеет хорды.\n\nВ нашей задаче условие, что удаление любой вершины оставляет граф связным, является именно 2-вершинной связностью в стандартном невырожденном смысле. Второе условие говорит, что каждый простой цикл не имеет хорд. Значит, по характеристике Дирака-Пламмера граф \\(G\\) минимально 2-связен.\n\nТеперь применяем сформулированную внешнюю теорему. Она даёт ориентацию всех рёбер \\(G\\), при которой полученный ориентированный граф сильно связен и минимален по этому свойству. Минимальность означает ровно требуемое в задаче: если удалить любое ориентированное ребро, сильная связность разрушится. Следовательно, нужная ориентация существует.",
