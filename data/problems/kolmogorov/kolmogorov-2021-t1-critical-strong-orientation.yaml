        "text": "Пусть \\(G\\) — связный граф, такой что удаление любой вершины оставляет граф связным, а каждый простой цикл не имеет хорд. Докажите, что рёбра \\(G\\) можно ориентировать так, чтобы получившийся орграф был сильно связным, но удаление любого ребра разрушало сильную связность.",
