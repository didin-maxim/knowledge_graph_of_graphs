  "solutions": [
    {
      "id": "sol-robbins-critical",
      "title": "Роббинс и мост после удаления ребра",
      "text": "Если бы ребро \\(e=ab\\) было мостом, то после удаления вершины \\(a\\) граф распался бы на как минимум две компоненты: одна содержит \\(b\\), другая — вершины по другую сторону моста. Это противоречит условию. Значит, мостов нет, и по теореме Роббинса граф допускает сильную ориентацию. Остаётся показать критичность по каждому ребру. Возьмём ребро \\(e\\). Так как мостов нет, ребро \\(e\\) лежит на некотором цикле \\(C\\). Условие задачи запрещает хорды у любого простого цикла, а потому никакое другое ребро вне \\(C\\) не может соединять две вершины \\(C\\). Из этого следует, что любое ребро цикла \\(C\\), в частности \\(e\\), лежит только на этом цикле. После удаления \\(e\\) остальные рёбра цикла \\(C\\) уже не лежат ни на каком цикле, то есть становятся мостами графа \\(G-e\\). Следовательно, граф \\(G-e\\) имеет мост и потому не допускает сильной ориентации. Значит, в выбранной по Роббинсу сильной ориентации удаление любого ребра разрушает сильную связность.",
