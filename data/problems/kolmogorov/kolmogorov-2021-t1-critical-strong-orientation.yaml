    {
      "id": "idea-robbins-plus-minimal-bridgeless",
      "title": "Сначала сильная ориентация, потом минимальность по мостам",
      "text": "По теореме Роббинса достаточно доказать, что в графе нет мостов. После этого нужно заметить, что условие об отсутствии хорд в циклах делает каждый цикл «единственным» носителем своих рёбер, поэтому удаление любого ребра создаёт мост и сильная связность становится невозможной.",
