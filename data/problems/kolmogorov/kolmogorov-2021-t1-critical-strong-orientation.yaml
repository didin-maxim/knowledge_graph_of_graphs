  "ideas": [
    {
      "id": "idea-robbins-plus-minimal-bridgeless",
      "title": "Сначала сильная ориентация, потом минимальность по мостам",
      "text": "По теореме Роббинса достаточно доказать, что в графе нет мостов; это действительно следует из условия об удалении любой вершины. Для критичности сильной ориентации нужен отдельный шаг: для каждого ребра \\(e\\) граф \\(G-e\\) должен иметь мост. Простая ссылка на отсутствие хорд у всех циклов этот шаг не доказывает без дополнительного условия или уточнения формулировки.",
