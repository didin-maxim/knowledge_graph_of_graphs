  "solutions": [
    {
      "id": "sol-robbins-critical",
      "title": "Роббинс и требуемый мост после удаления ребра",
      "text": "Из условия об удалении любой вершины следует, что в \\(G\\) нет мостов: иначе удаление подходящего конца моста отделило бы одну сторону от другой. Поэтому по теореме Роббинса граф допускает сильную ориентацию. Далее применим точный критерий: если для каждого ребра \\(e\\) граф \\(G-e\\) имеет мост, то любая сильная ориентация \\(G\\) будет критической, потому что граф с мостом не допускает сильной ориентации.\n\nИменно этот последний мостовой шаг нуждается в проверке для исходной формулировки. Утверждение «каждый простой цикл не имеет хорд» само по себе не гарантирует, что \\(G-e\\) имеет мост для каждого ребра \\(e\\): существуют 2-вершинно-связные графы, все простые циклы которых индуцированы, но после удаления некоторого ребра граф остается без мостов. Поэтому текущий текст следует рассматривать как разбор зависимостей решения, а не как завершенное доказательство без дополнительного уточнения условия.",
