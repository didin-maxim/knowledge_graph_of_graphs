        "id": "stmt-original",
        "title": "Original statement",
        "text": "В стране 100 городов расположены по кругу, а столица соединена дорогами со всеми этими городами. Каждую дорогу нужно передать одной из двух фирм так, чтобы дороги каждой фирмы позволяли проехать между любыми двумя городами. Сколькими способами это можно сделать?",
