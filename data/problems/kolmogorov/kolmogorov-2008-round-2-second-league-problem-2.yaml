      "id": "sol-official-compressed",
      "title": "Подсчет раскрасок колеса на 100 городах",
      "text": "Ответ: `2(2^100 - 2)`.\n\nВ каждом цвете должен получиться связный граф на `101` вершинах. Всего в колесе `200` рёбер, поэтому каждый цвет должен получить хотя бы `100` рёбер, а значит ровно `n`; каждая цветная сеть является деревом. В частности, у каждого цвета должна быть хотя бы одна спица, иначе центр был бы изолирован.\n\nЗафиксируем любую неодноцветную раскраску спиц. Разобьём циклическую последовательность спиц на максимальные подряд идущие блоки одного цвета. Пусть таких блоков `b`; они чередуются по цвету, поэтому `b` чётно. Если две соседние спицы `Ov_i` и `Ov_{i+1}` принадлежат одному цвету, то ребро обода `v_i v_{i+1}` не может иметь тот же цвет: иначе вместе с двумя спицами оно образовало бы цикл в цветной сети, а эта сеть уже обязана быть деревом. Значит, все внутренние рёбра обода каждого блока вынужденно получают противоположный цвет.\n\nОсталось определить `b` граничных рёбер обода между соседними блоками. Рассмотрим красный блок спиц. В синей сети вершины этого блока имеют только внутренние синие рёбра обода, поэтому для связи с центром хотя бы одно из двух граничных рёбер блока должно быть синим. Аналогично каждый синий блок требует хотя бы одно красное граничное ребро. Каждое граничное ребро лежит между красным и синим блоком и своим цветом может удовлетворить требование ровно одного из этих двух блоков. Требований всего `b`, и граничных рёбер тоже `b`; следовательно, у каждого блока ровно одно граничное ребро имеет цвет, противоположный цвету его спиц.\n\nПосле выбора цвета одного граничного ребра все остальные граничные рёбра определяются однозначно при обходе по кругу: для каждого следующего блока надо сделать ровно одно из двух соседних граничных рёбер противоположным его спицам. Есть ровно два возможных начальных выбора, и оба согласованы после полного обхода, потому что число блоков чётно.\n\nПроверим обратное. Если граничные рёбра выбраны по этому правилу, то для каждого цвета вершины блоков противоположных спиц соединены между собой внутренними рёбрами обода и через единственное подходящее граничное ребро подключаются к соседнему блоку собственных спиц, а тот соединён с центром. Значит, каждая из двух цветных сетей связна. Итак, спицы можно раскрасить `2^100 - 2` способами, исключая две одноцветные раскраски, и для каждой из них есть ровно два способа докрасить обод. Получаем `2(2^100 - 2)`.",
