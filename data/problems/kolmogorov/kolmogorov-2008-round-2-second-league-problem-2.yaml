      "id": "sol-official-compressed",
      "title": "??????????? ???????, ?????? ???????",
      "text": "Официальное решение замечает, что дорожная сеть есть колесо: 100 городов на ободе и столица в центре. Поэтому задача эквивалентна раскраске ребер колеса в два цвета так, чтобы оба цветных подграфа были связны.\n\nКак и в общей задаче про колесо, раскраска полностью определяется выбором цветов у спиц. Нельзя покрасить все спицы в один цвет, иначе второй цвет не будет связным. Для любого другого выбора ребра обода раскрашиваются единственным образом.\n\nПоэтому число способов равно `2(2^100 - 2)`.",
