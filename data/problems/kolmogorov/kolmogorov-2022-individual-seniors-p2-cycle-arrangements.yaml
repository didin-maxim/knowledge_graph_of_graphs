      "id": "sol-official-restored",
      "title": "Официальное решение, восстановлено из исходников",
      "text": "Докажем, что количество неэквивалентных расстановок равняется количеству перестановок $(a_1,a_2,\\ldots,a_n)$ чисел от 1 до $n$.\nДля этого построим между ними взаимно однозначное соответствие.\\footnote{\nдля знатоков сразу скажем: описанное в условии конструкция --- описание записи перестановки в виде произведения циклов}\n\nПусть имеется некоторая перестановка\n$(a_1,a_2,\\ldots,a_n)$ чисел от 1 до $n$. Рассмотрим ориентированный граф, вершинами которого являются числа от 1 до $n$, и проведём ребро из вершины $k$ в вершину $a_k$. Из каждого числа ведёт ровно одна стрелочка, а также в каждое число ведёт одна стрелочка. Значит, числа разбиваются на циклы --- это и будет расстановка чисел по кругам.\n\nЛегко видеть, что это соответствие обратимо:\nесли у нас имеется некоторая расстановка чисел по кругам, то она получилась из перестановки, в которой число $k$ переходит в число $a_k$, следующее за числом $k$ по часовой стрелке в его круге.\n\nТаким образом, количество неэквивалентных расстановок равняется количеству перестановок чисел от 1 до $n$, то есть $n!$.\n}",
