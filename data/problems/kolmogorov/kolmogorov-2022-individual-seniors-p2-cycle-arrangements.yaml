      "id": "sol-official-restored",
      "title": "Биекция с перестановками",
      "text": "Докажем, что неэквивалентные расстановки находятся во взаимно однозначном соответствии с перестановками чисел `1,2,...,n`.\n\nПусть дана перестановка `a_1,a_2,...,a_n`. Построим ориентированный граф на числах `1,2,...,n`, проведя стрелку из `k` в `a_k`. Из каждой вершины выходит ровно одна стрелка и в каждую вершину входит ровно одна стрелка, поэтому граф распадается на направленные циклы. Если забыть направление обхода записи и порядок самих циклов, получаем ровно расстановку чисел по кругам в смысле условия.\n\nОбратно, если дана расстановка чисел по кругам, выберем на каждом круге направление обхода по часовой стрелке и зададим перестановку: число `k` переходит в следующее после него число на том же круге. Поворот круга и перестановка кругов эту перестановку не меняют.\n\nЗначит, число неэквивалентных расстановок равно числу перестановок `n` элементов, то есть `n!`. Поэтому наибольшее число попарно неэквивалентных расстановок, которое можно выбрать, равно `n!`.",
