        "title": "Original statement",
        "text": "Пусть `A` — вершина графа, все вершины которого имеют степень 1000. Известно, что вершины графа можно правильно раскрасить в 1000 цветов. Докажите, что это можно сделать так, чтобы соседи вершины `A` были окрашены хотя бы в 500 различных цветов.",
