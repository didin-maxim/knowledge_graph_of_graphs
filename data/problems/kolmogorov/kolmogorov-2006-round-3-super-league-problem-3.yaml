  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "??????????? ???????, ?????? ???????",
      "text": "Официальное решение идет от противного. Предполагают, что у соседей вершины `A` использовано не более 499 цветов, и фиксируют одну такую раскраску.\n\nДалее рассматривают индуцированные подграфы на двух выбранных цветах и анализируют их компоненты связности. Если компоненту можно локально перекрасить, не ухудшая правильность раскраски, то число цветов в окрестности `A` удается увеличить, что противоречит выбранности.\n\nВ итоге получается сильно ограниченная структура соответствующей компоненты: она должна быть объединением путей, и эти пути вынуждены проходить через слишком много специально выбранных соседей `A`. Подсчет и анализ степеней приводят к противоречию.\n\nСледовательно, существует правильная раскраска, в которой среди соседей `A` не менее 500 различных цветов.",
