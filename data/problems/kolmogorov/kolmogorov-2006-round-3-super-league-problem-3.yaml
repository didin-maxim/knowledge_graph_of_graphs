  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Развернутое решение через цепи Кемпе",
      "text": "Предположим противное: в любой правильной 1000-раскраске соседи вершины \\(A\\) окрашены не более чем в \\(499\\) цветов. Среди всех таких раскрасок выберем раскраску, в которой число цветов на соседях \\(A\\) максимально. Переименуем цвета так, что сама вершина \\(A\\) имеет цвет \\(1\\). Тогда цвет \\(1\\) не встречается среди соседей \\(A\\), а кроме него среди цветов \\(2,\\ldots,1000\\) отсутствуют по крайней мере \\(500\\) цветов.\n\nТак как у \\(A\\) ровно \\(1000\\) соседей, раскрашенных не более чем в \\(499\\) цветов, некоторый цвет встречается среди них хотя бы три раза. Назовем этот цвет цветом \\(2\\), а соседей \\(A\\) цвета \\(2\\) обозначим \\(B_1,\\ldots,B_k\\), где \\(k\\ge3\\). Выберем три цвета, отсутствующие среди соседей \\(A\\), и назовем их \\(501,502,503\\).\n\nСначала зафиксируем один отсутствующий цвет \\(t\\in\\{501,502,503\\}\\) и рассмотрим подграф, порожденный вершинами цветов \\(2\\) и \\(t\\). Если две вершины из \\(B_1,\\ldots,B_k\\) лежали бы в разных компонентах этого двухцветного подграфа, то можно было бы поменять цвета \\(2\\) и \\(t\\) во всей компоненте, содержащей некоторые, но не все вершины \\(B_i\\). Правильность раскраски при таком обмене сохраняется. В окрестности \\(A\\) появился бы цвет \\(t\\), а цвет \\(2\\) не исчез бы, потому что не все \\(B_i\\) были перекрашены. Это увеличило бы число цветов среди соседей \\(A\\), противореча выбору раскраски. Значит для каждого такого \\(t\\) все \\(B_i\\) лежат в одной компоненте; обозначим ее через \\(H_t\\).\n\nНам понадобится стандартная минимизационная зачистка этой компоненты. Будем выполнять только такие перекраски, которые не меняют число цветов в окрестности \\(A\\), а если после них какие-то \\(B_i\\) разделятся по разным \\((2,t)\\)-компонентам, сразу применим описанный выше обмен и получим противоречие. Поэтому можно считать, что \\(H_t\\) минимальна по числу вершин. Если вершина \\(C\\in H_t\\), не равная ни одной из \\(B_i\\), не видит среди своих соседей какой-то цвет, то перекрасим \\(C\\) в этот цвет. Раскраска останется правильной, а вершина \\(C\\) выйдет из двухцветной компоненты. Если все \\(B_i\\) после этого все еще соединены, компонента стала меньше, что противоречит минимальности; если не соединены, предыдущий обмен цветов увеличивает число цветов вокруг \\(A\\). Следовательно, каждая такая вершина \\(C\\) видит среди своих соседей все цвета, отличные от ее собственного.\n\nОтсюда у любой вершины \\(C\\in H_t\\setminus\\{B_1,\\ldots,B_k\\}\\) степень внутри \\(H_t\\) не больше \\(2\\). Действительно, если у нее было бы хотя бы три соседа второго цвета из пары \\(2,t\\), то один и тот же цвет встретился бы среди соседей \\(C\\) как минимум трижды. Чтобы при степени \\(1000\\) увидеть все остальные \\(999\\) цветов, можно позволить только одно повторение; два лишних повторения уже заставляют какой-то цвет отсутствовать, что только что запрещено.\n\nТакже можно считать, что у \\(B_1\\) ровно по одному соседу цветов \\(501,502,503\\). Если для выбранного отсутствующего цвета таких соседей у \\(B_1\\) больше одного, то из-за степени \\(1000\\) у \\(B_1\\) отсутствует некоторый цвет, уже встречающийся среди соседей \\(A\\); перекраска \\(B_1\\) в этот цвет не уменьшает числа цветов около \\(A\\) и либо уменьшает соответствующую минимальную компоненту, либо разрывает ее и дает увеличивающий обмен. Повторяя эту локальную операцию, приходим к указанному виду.\n\nТеперь возьмем \\(H_{501}\\). Вершина \\(B_1\\) имеет в ней степень \\(1\\), а все остальные вершины, кроме отмеченных \\(B_i\\), имеют степень не больше \\(2\\). Поэтому путь, выходящий из \\(B_1\\) по единственному ребру компоненты \\(H_{501}\\), вынужден последовательно пройти через все вершины \\(B_2,\\ldots,B_k\\); иначе в первой точке, где оставшаяся часть компоненты ответвляется или где путь можно оборвать, та же перекраска внутренней вершины разорвала бы компоненту и позволила бы добавить цвет \\(501\\) в окрестность \\(A\\). Итак, после перенумерации \\(B_2,\\ldots,B_k\\) этот путь проходит через них в некотором порядке.\n\nРассмотрим вершину \\(B_i\\), которая является внутренней на этом пути, то есть не является его последней отмеченной вершиной. У нее на пути есть два соседа цвета \\(501\\). Если среди соседей \\(B_i\\) повторялся бы еще какой-нибудь цвет или отсутствовал бы какой-нибудь цвет, то, перекрасив \\(B_i\\) в отсутствующий допустимый цвет, мы разорвали бы путь: цвет \\(2\\) около \\(A\\) остался бы на других вершинах \\(B_j\\), а затем обмен цветов в одной из получившихся \\((2,501)\\)-компонент добавил бы цвет \\(501\\). Значит у каждой внутренней вершины этого пути единственный повторяющийся цвет в ее окрестности -- это \\(501\\).\n\nТочно такой же аргумент применим к цветам \\(502\\) и \\(503\\). Для каждого из трех цветов получается путь, выходящий из \\(B_1\\) и проходящий через все остальные \\(B_i\\); каждая внутренняя отмеченная вершина соответствующего пути имеет повтор только этого цвета.\n\nВ одном таком пути среди вершин \\(B_2,\\ldots,B_k\\) внутренними являются все, кроме последней, то есть \\(k-2\\) вершин. Для трех путей получаем \\(3(k-2)\\) внутренних появлений на множестве из \\(k-1\\) вершин \\(B_2,\\ldots,B_k\\). Так как \\(k\\ge3\\), имеем \\(3(k-2)>k-1\\). По принципу Дирихле некоторая вершина \\(B_i\\) является внутренней сразу для двух из трех путей. Тогда среди ее соседей повторяются два разных цвета из \\(501,502,503\\), что противоречит предыдущему абзацу: внутренняя вершина каждого пути может иметь только один повторяющийся цвет, именно цвет этого пути.\n\nПротиворечие показывает, что исходное предположение неверно. Следовательно, существует правильная 1000-раскраска, в которой соседи вершины \\(A\\) окрашены хотя бы в \\(500\\) различных цветов.",
