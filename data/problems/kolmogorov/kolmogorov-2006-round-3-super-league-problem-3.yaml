  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Официальное решение, развернутое изложение",
      "text": "Предположим противное: в любой правильной раскраске в `1000` цветов среди соседей вершины `A` встречается не более `499` цветов. Возьмем такую раскраску. Перенумеруем цвета так, чтобы вершина `A` имела цвет `1`, среди ее соседей встречались только цвета `2, 3, ..., 500`, а цвета `501, 502, ...` среди соседей `A` не встречались.\n\nПо принципу Дирихле среди `1000` соседей вершины `A`, окрашенных не более чем в `499` цветов, найдется цвет, встречающийся хотя бы три раза. Перенумеруем использованные у соседей цвета так, чтобы это был цвет `2`; пусть соседи цвета `2` равны `B_1, ..., B_k`, где `k >= 3`.\n\nБудем пользоваться следующим простым наблюдением. Если некоторую вершину `B_i` можно перекрасить в цвет, отсутствующий среди ее соседей и не равный цвету `1`, то правильность раскраски сохранится. Если новый цвет был одним из цветов `501, 502, ...`, то в окрестности `A` появится новый цвет; при этом цвет `2` в окрестности `A` не исчезнет, поскольку `k >= 3`. Значит, в выбранной контрпримерной раскраске такая улучшающая перекраска невозможна. Далее, как в официальном решении, выбираем контрпример после всех сокращающих локальных перекрасок; тогда можно считать, что у вершины `B_1` ровно по одному соседу каждого из цветов `501`, `502` и `503`. Иначе та же операция либо сразу добавляет отсутствующий цвет в окрестность `A`, либо уменьшает соответствующую двухцветную компоненту, не ухудшая выбранную раскраску.\n\nРассмотрим индуцированный подграф на вершинах цветов `2` и `501`. Все вершины `B_1, ..., B_k` лежат в одной компоненте связности этого двухцветного подграфа: если бы некоторая собственная непустая часть этих вершин лежала в другой компоненте, то, поменяв в этой компоненте цвета `2` и `501`, мы добавили бы цвет `501` в окрестность `A`, но не потеряли бы цвет `2` там, что противоречит выбору раскраски. Обозначим эту компоненту через `H`.\n\nПокажем, что `H` можно считать минимальной относительно локальных перекрасок. Пусть `C` - вершина из `H`, отличная от `B_1, ..., B_k`. Если в `H` степень вершины `C` не меньше `3`, то среди соседей `C` один и тот же цвет встречается по крайней мере трижды; так как всего у `C` ровно `1000` соседей и `999` допустимых для них цветов, у `C` отсутствует сосед некоторого цвета, в который можно перекрасить `C`. Такая перекраска удаляет `C` из компоненты цветов `2` и `501` и не уменьшает число цветов в окрестности `A`; повторяя ее, получаем, что все вершины `H`, отличные от `B_1, ..., B_k`, имеют степень в `H` не больше `2`. Кроме того, у каждой из них среди соседей присутствуют все допустимые цвета: иначе ее также можно было бы перекрасить и уменьшить компоненту.\n\nТак как у `B_1` в `H` ровно один сосед цвета `501`, из `B_1` выходит путь в компоненте `H`. Эта компонента связна и содержит все `B_2, ..., B_k`, поэтому этот путь проходит через все эти вершины; пусть он встречает их в некотором порядке. Рассмотрим любую вершину `B_i`, где `2 <= i <= k-1`, лежащую внутри этого пути. У нее на пути есть два соседа цвета `501`. Если бы среди остальных соседей `B_i` еще какой-нибудь цвет тоже повторялся или какой-нибудь допустимый цвет отсутствовал, то, как выше, можно было бы локальной перекраской разорвать путь и тем самым получить компоненту, уже не содержащую всех вершин `B_1, ..., B_k`; последующая перестановка цветов в одной из частей дала бы новый цвет `501` в окрестности `A` без потери цвета `2`. Значит, для каждой внутренней вершины такого пути цвет `501` - единственный повторяющийся среди цветов ее соседей.\n\nТот же аргумент применим к индуцированным подграфам на цветах `2` и `502`, а также на цветах `2` и `503`. Для каждого из трех цветов `501`, `502`, `503` получается путь, выходящий из `B_1` и проходящий через все остальные вершины `B_2, ..., B_k`; на каждом таком пути все вершины `B_2, ..., B_k`, кроме последней, являются внутренними и потому имеют соответствующий цвет повторяющимся среди соседей.\n\nДля каждого из трех путей среди вершин `B_2, ..., B_k` есть не более одной вершины, которая не является внутренней. Так как `k >= 3`, то среди `B_2, ..., B_k` найдется вершина, внутренняя хотя бы для двух из этих трех путей. У этой вершины среди соседей повторяются два различных цвета из множества `{501, 502, 503}`. Но выше для внутренней вершины пути цвета `501` было доказано, что кроме цвета `501` никакой другой цвет среди ее соседей повторяться не может; аналогично для цветов `502` и `503`. Противоречие.\n\nСледовательно, исходное предположение неверно. Значит, существует правильная раскраска графа в `1000` цветов, при которой соседи вершины `A` окрашены не менее чем в `500` различных цветов.",
