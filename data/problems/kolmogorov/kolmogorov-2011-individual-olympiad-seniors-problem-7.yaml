        "title": "Original statement",
        "text": "Пусть `G` — связный граф, имеющий хотя бы три вершины. Определим `G^3` как граф на тех же вершинах, в котором соединены ребрами вершины, находящиеся в `G` на расстоянии не более трех.\n\nДокажите, что в графе `G^3` есть гамильтонов цикл.",
