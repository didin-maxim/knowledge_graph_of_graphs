  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Complete solution via a tree traversal",
      "text": "It is enough to prove the result for trees. Indeed, every connected graph `G` has a spanning tree `T`. If two vertices are at distance at most `3` in `T`, then they are also at distance at most `3` in `G`; hence every Hamiltonian cycle in `T^3` is also a Hamiltonian cycle in `G^3`.\n\nWe prove that `T^3` is Hamiltonian for every tree `T` with at least three vertices. Root `T` at a vertex `r` and make the usual depth-first closed walk `W` that traverses every edge of `T` exactly twice, starting and ending at `r`.\n\nFrom the occurrences of each vertex in `W`, choose exactly one occurrence as follows. If the vertex has even distance from `r`, choose its first occurrence in `W`; if it has odd distance from `r`, choose its last occurrence in `W`. For the root, choose the initial occurrence. Now list the vertices in the cyclic order in which their chosen occurrences appear along `W`. Each vertex appears exactly once in this list.\n\nIt remains to check that consecutive vertices in this cyclic list are adjacent in `T^3`. Let the next chosen occurrence after the chosen occurrence of a vertex `v` belong to a vertex `u`. We show that the part of `W` from `v` to `u` has length at most `3`; then the distance from `v` to `u` in `T` is at most `3`.\n\nIf `v` has even depth and its first occurrence was chosen, then the walk either goes next to an odd-depth leaf child, whose only occurrence is chosen, or goes to an odd-depth child and then to an even-depth grandchild, whose first occurrence is chosen. If there is no unvisited child of `v`, the walk returns to the odd-depth parent of `v`; either this is the parent's last occurrence and is chosen, or the walk next enters the parent's next child, which has even depth and is chosen at its first occurrence. In all cases the next chosen occurrence is reached within at most two tree-edges.\n\nIf `v` has odd depth and its last occurrence was chosen, then the walk returns to the even-depth parent of `v`. If that parent has a next unvisited child, then either that child is an odd-depth leaf and its occurrence is chosen, or one more step reaches an even-depth grandchild chosen at its first occurrence. If the parent has no next child, the walk goes up to the odd-depth grandparent; either this is the grandparent's last occurrence and is chosen, or the walk next enters the grandparent's next child, which has even depth and is chosen at its first occurrence. Thus the next chosen occurrence is reached within at most three tree-edges. The cyclic transition from the last chosen occurrence back to the initial occurrence of `r` is covered by the same closed-walk argument.\n\nTherefore every two consecutive vertices in the constructed cyclic order have distance at most `3` in `T`, so they are adjacent in `T^3`. This cyclic order is a Hamiltonian cycle of `T^3`, and hence also of `G^3`. The proof is complete.",
