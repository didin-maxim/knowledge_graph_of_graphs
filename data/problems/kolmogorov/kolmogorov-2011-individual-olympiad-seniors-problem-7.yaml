      "id": "sol-official-compressed",
      "title": "??????????? ???????, ?????? ???????",
      "text": "Достаточно рассмотреть случай, когда `G` — дерево: если утверждение верно для остовного дерева, то оно верно и для исходного графа.\n\nДоказательство ведется индукцией по числу вершин. В графе `G^3` длиной ребра называют расстояние между его концами в исходном дереве, так что возможны ребра длин `1`, `2` и `3`.\n\nЕсли в дереве есть вершина, смежная хотя бы с двумя листьями, то одну новую висячую вершину можно вставить в уже построенный гамильтонов цикл меньшего дерева, заменив участок `u-v1-u'` на `u-v1-v2-u'`.\n\nВ противном случае берут вершину степени не меньше `3`, у которой висит путь `v1, ..., vk`, удаляют этот путь и по предположению индукции получают гамильтонов цикл в `T^3`. В этом цикле находится ребро, соединяющее разные компоненты графа `T - w`; его заменяют на специальный проход через вершины удаленного пути. Все новые ребра имеют длину не более `3`, значит, действительно принадлежат `G^3`.\n\nТак индуктивно строится гамильтонов цикл в `G^3`.",
