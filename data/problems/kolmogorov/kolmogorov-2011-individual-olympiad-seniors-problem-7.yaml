    {
      "id": "sol-official-compressed",
      "title": "Полное решение через обход дерева",
      "text": "Достаточно доказать результат для деревьев. Действительно, каждый связный граф G имеет остовное дерево T. Если две вершины находятся на расстоянии не более «3» в «T», то они также находятся на расстоянии не более «3» в «G»; следовательно, каждый гамильтонов цикл в ``T^3`` также является гамильтоновым циклом в ``G^3``.\n\nМы доказываем, что ``T^3`` является гамильтоновым для любого дерева `T`, имеющего хотя бы три вершины. Укорените `T` в вершине `r` и выполните обычный замкнутый обход `W` в глубину, который пересекает каждое ребро `T` ровно дважды, начиная и заканчивая в `r`.\n\nИз вхождений каждой вершины в `W` выберите ровно одно вхождение следующим образом. Если вершина находится на четном расстоянии от «r», выберите ее первое вхождение в «W»; если он имеет нечетное расстояние от `r`, выберите его последнее вхождение в `W`. В качестве корня выберите начальное вхождение. Теперь перечислите вершины в циклическом порядке, в котором выбранные ими вхождения появляются вдоль `W`. Каждая вершина появляется в этом списке ровно один раз.\n\nОсталось проверить, что последовательные вершины в этом циклическом списке смежны в ``T^3``. Пусть следующее выбранное вхождение после выбранного вхождения вершины `v` принадлежит вершине `u`. Мы показываем, что часть `W` от `v` до `u` имеет длину не более `3`; тогда расстояние от `v` до `u` в `T` не превышает `3`.\n\nЕсли `v` имеет четную глубину и было выбрано его первое вхождение, то обход либо идет к дочернему листу нечетной глубины, чье единственное вхождение выбрано, либо идет к дочернему элементу нечетной глубины, а затем к внуку четной глубины, чье первое вхождение выбрано. Если нет непосещенного дочернего элемента `v`, обход возвращается к родительскому элементу `v` с нечетной глубиной; либо это последнее вхождение родителя и оно выбирается, либо следующий обход входит в следующий дочерний элемент родителя, который имеет четную глубину и выбирается при первом появлении. Во всех случаях следующее выбранное вхождение достигается не более чем в пределах двух ребер дерева.\n\nЕсли `v` имеет нечетную глубину и было выбрано его последнее вхождение, то обход возвращается к родительскому элементу `v` с четной глубиной. Если у этого родителя есть следующий непосещенный дочерний элемент, то либо этот дочерний элемент является листом нечетной глубины и выбирается его вхождение, либо еще один шаг достигает внука четной глубины, выбранного при его первом появлении. Если у родителя нет следующего дочернего элемента, обход идет до дедушки и бабушки нечетной глубины; либо это последнее появление прародителя и оно выбирается, либо следующая прогулка входит в следующий дочерний элемент прародителя, который имеет четную глубину и выбирается при первом появлении. Таким образом, следующее выбранное вхождение достигается не более чем за три ребра дерева. Циклический переход от последнего выбранного вхождения обратно к начальному вхождению `r` покрывается тем же аргументом замкнутого обхода.\n\nСледовательно, каждые две последовательные вершины в построенном циклическом порядке имеют расстояние не более `3` в `T`, поэтому они смежны в ``T^3``. Этот циклический порядок является гамильтоновым циклом ``T^3`` и, следовательно, также ``G^3``. Доказательство завершено.",
