        "id": "stmt-original",
        "title": "Оригинальная формулировка",
        "text": "За один ход разрешается выбрать лист дерева, удалить ребро, которым он был присоединен, и присоединить этот лист к другой вершине. Каково наибольшее возможное число ходов, необходимое, чтобы из одного дерева на `n` вершинах получить другое дерево на тех же вершинах?",
        "source_id": "src-kolmogorov-2008-official",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [
          "tree"
        ]
      }
    ],
    "graph_theory": [],
    "olympiad_reformulations": []
  },
  "ideas": [
    {
      "id": "idea-graph-role",
      "title": "Графовая роль",
      "text": "В условии явно фигурирует дерево, то есть специальный вид графа. Официальное решение опирается на структуру деревьев, листья и операции переподвешивания.",
      "tags": [],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Официальное решение, сжатое изложение",
      "text": "Ответ: `n - 3`.\n\nНижняя оценка получается на примере пути и звезды: чтобы превратить путь в звезду, нужно переподвесить все внутренние вершины пути, кроме двух крайних и будущего центра, то есть требуется `n - 3` ходов.\n\nДля верхней оценки в официальном решении выбирают в первом дереве путь длины 2 и показывают, что можно последовательно переставлять листья так, чтобы сохранить этот общий фрагмент и постепенно привести дерево к нужному виду. Иначе говоря, любое дерево можно за не более чем `n - 3` операций превратить в звезду, а из звезды — в любое другое дерево.\n\nСледовательно, максимальное необходимое число ходов равно `n - 3`.",
