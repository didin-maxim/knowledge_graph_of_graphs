  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Развёрнутое решение через сохранение трёхвершинного фрагмента",
      "text": "Ответ: `n - 3` при `n >= 3`.\n\nСначала докажем, что иногда `n - 3` ходов действительно нужны. Возьмём путь на `n` вершинах и звезду на `n` вершинах. У пути ровно два листа, а у звезды `n - 1` листьев. За один ход число листьев может увеличиться не более чем на 1: выбранный лист после переподвешивания остаётся листом; его старый сосед может стать новым листом, если его степень уменьшилась до 1; у новой вершины присоединения степень увеличивается, поэтому листом она не становится, а если была листом, то перестаёт им быть. Значит, чтобы увеличить число листьев с 2 до `n - 1`, требуется как минимум `n - 3` ходов.\n\nТеперь докажем, что `n - 3` ходов всегда достаточно. Зафиксируем начальное дерево `T` и целевое дерево `S`. Выберем в `T` какой-нибудь путь из трёх вершин; такой путь есть при `n >= 3`. В целевом дереве `S` тоже выберем путь из трёх вершин и будем считать выбранный путь в текущем дереве его уже построенной копией. Дальше будем постепенно расширять построенную часть.\n\nПоддерживаем связное поддерево `F` целевого дерева `S`, уже построенное в текущем дереве. Сначала `F` состоит из выбранного пути длины 2, то есть из трёх вершин. Если `F` ещё не всё дерево `S`, то в `S` есть вершина `x` вне `F`, смежная с некоторой вершиной `y` из `F`: достаточно взять первую вершину за пределами `F` на пути из `F` к любой ещё не построенной вершине. В текущем дереве вне уже построенной копии `F` тоже есть лист, не принадлежащий `F`: рассмотрим любую компоненту, оставшуюся после удаления вершин `F`; в конечном дереве у такой компоненты есть лист, и он не лежит в `F`.\n\nВозьмём такой внешний лист текущего дерева и переподвесим его к вершине, соответствующей `y`. После этого объявим его вершиной, соответствующей `x`. Построенная часть снова является точной копией связного поддерева целевого дерева, теперь уже с одной новой вершиной. При этом старые рёбра внутри построенной части не менялись, потому что мы двигали лист вне неё.\n\nПовторяя этот шаг, мы каждый раз увеличиваем построенную часть на одну вершину. Начали с трёх вершин, поэтому нужно не более `n - 3` переподвешиваний. В конце построенная часть совпадает со всем целевым деревом `S`, значит начальное дерево можно превратить в целевое не более чем за `n - 3` ходов.\n\nНижняя и верхняя оценки совпали, следовательно наибольшее возможное необходимое число ходов равно `n - 3`.",
