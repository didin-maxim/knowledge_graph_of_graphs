        "id": "stmt-original",
        "title": "Оригинальная формулировка",
        "text": "Степени всех вершин графа `G` меньше `3n/2 - 1` (`n > 2`), причем среди любых `n + 1` вершин есть две несмежных.\nНазовем блоком множество из `n` попарно смежных вершин графа `G`.\nИзвестно, что любые два блока имеют общую вершину.\n\nДокажите, что все блоки имеют общую вершину.",
