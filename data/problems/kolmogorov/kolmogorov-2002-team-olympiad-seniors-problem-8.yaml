      "id": "idea-graph-role",
      "title": "Графовая роль",
      "text": "В условии явно фигурирует граф, степени вершин, смежность и полные подграфы размера `n`.\nОфициальное решение целиком работает внутри теории графов: использует дополнительный граф, клики, пересечения блоков и лемму Холла.",
      "tags": [],
