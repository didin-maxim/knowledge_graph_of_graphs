    {
      "id": "sol-official-full",
      "title": "Полное решение по официальному разбору",
      "text": "Обозначим через \\(\\Delta\\) максимальную степень графа \\(G\\) и положим \\(k=\\Delta-n\\). Из условия \\(\\Delta<3n/2-1\\) следует \\(2(k+1)<n\\). Кроме того, в \\(G\\) нет клики размера \\(n+1\\), потому что среди любых \\(n+1\\) вершин есть две несмежные.\n\nСначала докажем лемму Дольникова в дополнительной форме. Пусть \\(Q\\) -- граф на \\(2m-1\\) вершинах, и после удаления любой вершины в \\(Q\\) остается независимое множество размера \\(m\\). Тогда в \\(Q\\) есть независимое множество размера \\(m+1\\). Предположим противное и выберем контрпример с минимальным \\(m\\). Возьмем независимое множество \\(X\\) размера \\(m\\), а остальные вершины обозначим \\(Y\\), так что \\(|Y|=m-1\\). Назовем множество \\(A\\subseteq Y\\) плохим, если \\(|A|>|N_X(A)|\\), и выберем максимальное по включению плохое \\(A\\); пусть \\(|A|=a\\). Если бы для некоторого \\(C\\subseteq Y\\setminus A\\) выполнялось \\(|N_{X\\setminus N_X(A)}(C)|<|C|\\), то \\(A\\cup C\\) было бы плохим, что противоречит максимальности \\(A\\). Поэтому по лемме Холла вершины \\(Y\\setminus A\\) можно попарно различно сопоставить их соседям из \\(X\\setminus N_X(A)\\). Пусть \\(B\\) -- несопоставленные вершины из \\(X\\). Тогда \\(|B|=a+1\\), причем \\(N_X(A)\\subseteq B\\).\n\nРассмотрим подграф \\(Q[A\\cup B]\\). Вне \\(A\\cup B\\) остались ровно \\(m-a-1\\) сопоставленных пар, и в каждой паре ее две вершины смежны, поэтому любое независимое множество берет оттуда не более одной вершины из каждой пары. Значит, после удаления любой вершины из \\(A\\cup B\\) независимое множество размера \\(m\\), существующее по условию, содержит не менее \\(a+1\\) вершин внутри \\(A\\cup B\\). Итак, в \\(Q[A\\cup B]\\) после удаления любой вершины остается независимое множество размера \\(a+1\\). Если \\(a+1<m\\), то по минимальности \\(m\\) граф \\(Q[A\\cup B]\\) содержит независимое множество размера \\(a+2\\); добавив к нему все вершины \\(X\\setminus B\\), получим в \\(Q\\) независимое множество размера \\(m+1\\), поскольку \\(X\\setminus B\\) не смежно ни с \\(A\\), ни с \\(B\\). Если же \\(a+1=m\\), то \\(A=Y\\), и из плохости \\(A\\) найдется вершина \\(x\\in X\\), не смежная ни с одной вершиной из \\(Y\\). Удалив \\(x\\), находим независимое множество размера \\(m\\), а затем добавляем к нему \\(x\\); снова получаем независимое множество размера \\(m+1\\). Лемма доказана.\n\nТеперь докажем вторую лемму. Пусть \\(L\\) -- непустое пересечение нескольких блоков графа \\(G\\). Тогда \\(|L|\\ge n-k-1\\). Действительно, пусть \\(T\\) -- объединение всех блоков, содержащих \\(L\\). Любая вершина из \\(L\\) смежна со всеми остальными вершинами из \\(T\\), поэтому \\(|T|\\le \\Delta+1\\le n+k+1\\). Положим \\(r=n-|L|\\). Если \\(v\\in T\\setminus L\\), то существует блок, содержащий \\(L\\), но не содержащий \\(v\\); значит, после удаления любой вершины из \\(G[T\\setminus L]\\) остается клика размера \\(r\\). При этом в \\(G[T\\setminus L]\\) нет клики размера \\(r+1\\), иначе вместе с \\(L\\) она дала бы клику размера \\(n+1\\) в \\(G\\). Поэтому из предыдущей леммы, примененной к дополнительному графу (а при числе вершин меньше \\(2r-1\\) можно добавить изолированные в \\(G[T\\setminus L]\\) фиктивные вершины), следует \\(|T\\setminus L|\\ge 2r\\). Совмещая это с верхней оценкой на \\(|T|\\), получаем\n\\[\n2(n-|L|)\\le |T\\setminus L|\\le n+k+1-|L|,\n\\]\nоткуда \\(|L|\\ge n-k-1\\).\n\nЗавершим доказательство. Зафиксируем блок \\(H\\). Будем по одному добавлять все блоки, пересекающие \\(H\\), и следить за их общим пересечением. Сначала оно равно \\(H\\) и непусто. Предположим, что после нескольких шагов текущее пересечение \\(I\\) непусто. По второй лемме \\(|I|\\ge n-k-1\\). Для следующего блока \\(B\\), пересекающего \\(H\\), та же лемма, примененная к пересечению \\(B\\cap H\\), дает \\(|B\\cap H|\\ge n-k-1\\). Оба множества \\(I\\) и \\(B\\cap H\\) лежат в \\(H\\), а\n\\[\n2(n-k-1)>n=|H|.\n\\]\nСледовательно, они имеют общую вершину, то есть \\(B\\cap I\\ne\\varnothing\\), и общее пересечение не исчезает. По условию любые два блока пересекаются, значит, каждый блок пересекает выбранный \\(H\\). После добавления всех блоков их общее пересечение остается непустым. Это и требовалось доказать.",
