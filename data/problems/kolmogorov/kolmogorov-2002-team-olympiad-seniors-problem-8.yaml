  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Официальное решение, сжатое изложение",
      "text": "В официальном решении вводятся две леммы.\n\nЛемма 1: если в графе на `2n - 1` вершинах после удаления любой вершины остается полный подграф на `n` вершинах, то и в исходном графе есть полный подграф на `n + 1` вершинах.\nДоказательство проводится через дополнительный граф, лемму Холла и минимальный контрпример.\n\nЛемма 2: если `L` — непустое пересечение нескольких блоков графа `G`, то `L` содержит не менее `n - k - 1` вершин, где `k` определяется из оценки на степени.\nДля этого рассматривают объединение всех блоков, содержащих `L`, и применяют Лемму 1 к подходящему индуцированному подграфу.\n\nДалее фиксируют один блок `H` и рассматривают пересечение всех блоков, имеющих с ним непустое пересечение.\nПока пересечение непусто, по Лемме 2 оно достаточно велико.\nПоэтому любой следующий блок, пересекающий `H`, обязан пересечь и текущее общее пересечение.\nЗначит, при последовательном добавлении всех блоков, пересекающих `H`, общее пересечение не исчезает.\n\nОтсюда следует, что все блоки графа имеют общую вершину.",
