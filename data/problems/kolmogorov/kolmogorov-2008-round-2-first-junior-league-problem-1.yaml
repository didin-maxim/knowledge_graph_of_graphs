  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Official solution, compressed",
      "text": "Это тот же граф-колесо, только с 10 вершинами на ободе. Официальное решение повторяет рассуждение общей задачи: каждая фирма должна получить связный остов, поэтому все определяется выбором цветов у спиц, кроме двух одноцветных вариантов.\n\nПосле выбора цветов спиц ребра на внешнем цикле должны быть раскрашены единственным возможным образом, иначе один из цветных подграфов потеряет связность.\n\nВ итоге число способов равно `2(2^10 - 2)`.",
