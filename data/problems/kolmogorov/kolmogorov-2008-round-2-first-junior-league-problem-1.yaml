    {
      "id": "sol-official-compressed",
      "title": "Подсчет раскрасок колеса",
      "text": "Обозначим столицу через `O`, а 10 городов на ободе через `v_1, ..., v_10` по кругу. Назовем дороги `Ov_i` спицами, а дороги `v_i v_{i+1}` (индексы по модулю 10) ребрами обода.\n\nВсего в графе 20 дорог. Дороги каждой фирмы должны связывать все 11 городов, значит каждая фирма должна получить хотя бы 10 дорог. Поэтому каждая фирма получает ровно 10 дорог, и ее сеть является деревом на всех 11 вершинах. В частности, у каждой фирмы должна быть хотя бы одна спица: без спицы столица `O` была бы изолирована в сети этой фирмы. Значит, раскраска спиц не может быть одноцветной.\n\nЗафиксируем любую раскраску 10 спиц, в которой есть обе фирмы. Посмотрим, как после этого вынуждаются ребра обода. Если две соседние спицы `Ov_i` и `Ov_{i+1}` принадлежат одной фирме, то ребро `v_i v_{i+1}` не может принадлежать той же фирме: иначе вместе с двумя спицами оно образовало бы цикл, а цветная сеть этой фирмы должна быть деревом. Поэтому все ребра внутри каждого максимального подряд идущего блока одинаково окрашенных спиц вынужденно получают цвет другой фирмы.\n\nОстаются только граничные ребра между соседними блоками разных цветов. Рассмотрим, например, максимальный блок спиц первой фирмы. В сети второй фирмы вершины этого блока не имеют спиц ко второй фирме, а внутренние ребра блока уже окрашены во вторую фирму. Чтобы эти вершины были связаны со столицей в сети второй фирмы, хотя бы одно из двух граничных ребер блока должно принадлежать второй фирме. Но оба граничных ребра не могут принадлежать второй фирме: тогда в сети второй фирмы появился бы цикл, идущий по этому блоку и через соседнюю часть сети второй фирмы. Значит, у каждого блока ровно одно из двух граничных ребер имеет цвет, противоположный цвету спиц блока.\n\nВыбор цвета одного граничного ребра после этого однозначно задает все остальные граничные ребра по кругу: у каждого следующего блока второе граничное ребро обязано быть выбранным так, чтобы у блока было ровно одно внешнее ребро цвета другой фирмы. Возможны ровно два согласованных варианта, соответствующие двум выборам для первого граничного ребра.\n\nОсталось посчитать. Спицы можно раскрасить двумя фирмами `2^10` способами, но две одноцветные раскраски запрещены, так как одна фирма не получила бы ни одной спицы и не смогла бы соединить столицу с остальными городами. Для каждой из `2^10 - 2` допустимых раскрасок спиц есть ровно два способа докрасить обод. Поэтому число способов равно `2(2^10 - 2) = 2044`.\n\nПроверим, что все эти раскраски действительно работают. Для каждой фирмы ее сеть имеет ровно 10 ребер. По построению каждый блок спиц другой фирмы присоединен к данной фирме ровно одним граничным ребром, а внутри такого блока все ребра обода имеют цвет данной фирмы; блоки собственных спиц уже соединены со столицей своими спицами. Значит, от столицы можно добраться до каждой вершины по дорогам каждой фирмы. При 10 ребрах на 11 вершинах такая связная сеть автоматически является деревом, так что дополнительных препятствий нет.",
