  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Официальное решение, сжатое изложение",
      "text": "Официальное решение сначала строит дерево соседства клеток: выбирают белую клетку как корень, на следующий ярус ставят соседние с ней черные клетки, затем соседние с ними белые и так далее.\n\nИз корня в следующий ярус выходит не более 4 ребер, из любой другой вершины — не более 3. Отсюда получается нужная структурная оценка: при почти максимальном числе черных клеток каждая белая клетка должна граничить как минимум с тремя черными.\n\nДалее идет индукция по числу белых клеток. В дереве рассматривают путь максимальной длины; его предпоследняя белая вершина оказывается смежной с тремя висячими черными клетками. Эти четыре клетки образуют нужную фигурку `T`-тетрамино. Удалив ее, применяют предположение индукции к оставшейся фигуре.",
