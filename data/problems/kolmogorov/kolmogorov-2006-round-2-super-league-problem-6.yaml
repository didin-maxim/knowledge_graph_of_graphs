      "id": "sol-official-compressed",
      "title": "Полное решение через остовное дерево",
      "text": "Покажем, что фигура разбивается на `T`-тетрамино: такие четырехклеточные фигурки состоят из одной белой клетки и трех черных клеток, примыкающих к ней по сторонам. Все такие фигурки одинаковы с точностью до поворота.\n\nРассмотрим граф соседства клеток данной фигуры: вершины — клетки фигуры, ребро соединяет две клетки с общей стороной. Этот граф связен и двудолен по шахматной раскраске. Пусть в фигуре `W` белых и `B` черных клеток; по условию `B = 3W`. Возьмем любое остовное дерево `T` этого графа. В нем `4W` вершин и `4W - 1` ребер. Каждое ребро дерева инцидентно ровно одной белой вершине, поэтому сумма степеней всех белых вершин в дереве равна `4W - 1`. Но у любой клетки на шахматной доске не больше четырех соседей, значит степень каждой белой вершины в `T` не больше 4. Следовательно, ровно одна белая вершина имеет степень 3, а все остальные белые вершины имеют степень 4. В частности, белых листьев в `T` нет, так что все листья дерева черные.\n\nДокажем утверждение индукцией по `W`. При `W = 1` имеем `B = 3`; связность заставляет все три черные клетки примыкать к единственной белой, то есть вся фигура уже является `T`-тетрамино.\n\nПусть `W > 1`. Возьмем в дереве `T` путь максимальной длины. Его концы — листья, а значит черные вершины. Рассмотрим белые вершины, соседние с двумя концами этого пути. Если бы обе они имели степень 3, то из единственности белой вершины степени 3 они совпали бы; тогда максимальный путь имел бы вид черная — белая — черная, что возможно только при `W = 1`, вопреки предположению. Значит, хотя бы у одного конца пути соседняя с ним белая вершина `x` имеет степень 4.\n\nУ вершины `x` ровно один сосед лежит на выбранном пути в сторону остального дерева. Все остальные соседи `x` обязаны быть листьями: если от такого соседа продолжалась бы ветвь, путь можно было бы удлинить, начав с ее конца. Поэтому три остальных соседа `x` — висячие черные вершины. Клетка `x` вместе с этими тремя черными клетками образует `T`-тетрамино.\n\nУдалим это `T`-тетрамино. В дереве мы удалили вершину `x` и три висячих черных вершины, а компоненту, содержащую четвертого соседа `x`, не разорвали; значит оставшиеся клетки, если они есть, все еще связны. Число белых клеток уменьшилось на 1, число черных — на 3, поэтому соотношение `B = 3W` для остатка сохраняется. По предположению индукции остаток разбивается на `T`-тетрамино. Добавляя удаленную фигурку, получаем требуемое разбиение всей фигуры на одинаковые связные фигурки из четырех клеток.",
