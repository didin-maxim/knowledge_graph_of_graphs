  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Official solution, compressed",
      "text": "В решении выделяются рисунки, на которых получился связный граф. Это в точности те случаи,\nкогда была удалена висячая вершина. Их общая часть восстанавливает дерево после удаления\nвсех листьев.\n\nЗатем вводится периферийная вершина: вершина исходного дерева, у которой все соседи,\nкроме одного, висячие. Такие вершины распознаются по рисункам однозначно, а число\nприкрепленных к ним листьев читается из набора компонент.\n\nПосле этого дерево восстанавливается рекурсивно: по восстановленному \"скелету\" без листьев\nпоследовательно возвращаются все периферийные вершины и их висячие соседи. Так Игорь\nоднозначно восстанавливает исходное дерево.",
