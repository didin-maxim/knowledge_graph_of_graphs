  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Полное решение по официальной идее",
      "text": "Будем считать, что Игорю дано мультимножество карточек: для каждой вершины дерева \\(T\\) дана\nнеименованная копия графа \\(T-v\\). Восстановить дерево значит восстановить его с точностью до изоморфизма.\n\nСначала разберём малые и звёздные случаи. Число вершин \\(T\\) известно: оно равно числу карточек, а каждая карточка\nимеет на одну вершину меньше. Если \\(T\\) имеет одну вершину или одно ребро, это сразу видно по карточкам. Если\nсреди связных карточек есть звезда, то исходное дерево в этом случае восстанавливается единственно: такая карточка\nимеет вид \\(T-l\\), где \\(l\\) — лист, и вернуть \\(l\\) можно только к центру звезды. Прикрепление нового листа к любому\nстарому листу создало бы в исходном дереве вершину степени 2. Поэтому эта карточка даёт исходную звезду. Далее\nсчитаем, что \\(T\\) не является звездой; тогда в \\(T\\) есть хотя бы две нелистовые вершины.\n\nДля дерева верно простое наблюдение: если удалить вершину \\(v\\), то оставшиеся компоненты соответствуют соседям\nвершины \\(v\\), поэтому число компонент графа \\(T-v\\) равно \\(\\deg_T v\\). Значит, связные карточки — это ровно\nкарточки, полученные удалением листьев исходного дерева. Это свойство зависит только от самой карточки, так что Игорь\nможет выделить все такие карточки без знания имён вершин.\n\nНазовём на связной карточке допустимой такую вершину, которая не является листом этой карточки и имеет ровно одного\nсоседа, не являющегося листом этой карточки. Это чисто внутреннее свойство неименованного графа. Такие вершины на\nкарточках действительно есть: возьмём в дереве, полученном из \\(T\\) удалением всех листьев, любой лист; в исходном\nдереве он смежен ровно с одной нелистовой вершиной и, так как степеней 2 в \\(T\\) нет, имеет хотя бы два листа-соседа.\n\nИгорь рассматривает все допустимые вершины на всех связных карточках и выбирает одну из них с наименьшей степенью\nна своей карточке. Пусть выбранная вершина на карточке \\(C\\) имеет степень \\(d\\). Так как \\(C\\) связна, она равна\n\\(T-l\\) для некоторого листа \\(l\\) исходного дерева. Обозначим через \\(x\\) вершину дерева \\(T\\), соответствующую\nвыбранной вершине карточки.\n\nВ дереве \\(T\\) вершина \\(x\\) тоже имеет ровно одного нелистового соседа. Действительно, при переходе от \\(T\\) к\nсвязной карточке удаляется только один лист. Если какой-то листовой сосед \\(x\\) на карточке был бы нелистом в \\(T\\),\nто он получил бы единственного дополнительного соседа \\(l\\) и имел бы в \\(T\\) степень 2, что запрещено. Поэтому\nнелистовые соседи \\(x\\) на карточке и в \\(T\\) одни и те же, за исключением невозможного добавления листа. Пусть в\n\\(T\\) у вершины \\(x\\) было \\(a\\) листовых соседей. Тогда \\(a\\ge 2\\), потому что\n\\(x\\) имеет ещё одного нелистового соседа и в \\(T\\) нет вершин степени 2.\n\nПокажем ключевой шаг: удалённый лист \\(l\\) был смежен именно с \\(x\\). Если бы это было не так, то степень \\(x\\)\nна карточке \\(C\\) была бы \\(a+1\\). Но если удалить из \\(T\\) любой лист, смежный с \\(x\\), получится другая связная\nкарточка, на которой та же вершина \\(x\\) снова допустима, но уже имеет степень \\(a\\). Это меньше \\(a+1\\), что\nпротиворечит выбору вершины минимальной степени. Следовательно, \\(l\\) действительно был одним из листьев, смежных с\n\\(x\\), а степень выбранной вершины на карточке равна \\(a\\).\n\nТеперь восстановление очевидно и однозначно: к выбранной вершине \\(x\\) на карточке \\(C\\) надо добавить новый лист.\nТак как \\(C=T-l\\) и только что доказано, что \\(l\\) был листом, смежным с \\(x\\), полученный граф изоморфен\nисходному дереву \\(T\\).\n\nВсе использованные операции — выделение связных карточек, распознавание листьев и допустимых вершин внутри карточки,\nсравнение степеней и добавление листа к выбранной вершине — зависят только от неименованного мультимножества рисунков.\nЗначит, два неизоморфных дерева без вершин степени 2 не могут дать один и тот же набор карточек, и Игорь может\nвосстановить Сашино дерево.",
