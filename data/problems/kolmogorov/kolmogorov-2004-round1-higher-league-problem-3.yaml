        "id": "stmt-original",
        "title": "Original statement",
        "text": "Саша нарисовал дерево, в котором нет вершин степени 2. Для каждой вершины он отдельно\nнарисовал граф, получающийся после удаления этой вершины вместе со всеми инцидентными ей\nребрами, и передал все эти рисунки Игорю.\n\nДокажите, что по этим рисункам Игорь может восстановить исходное дерево.",
