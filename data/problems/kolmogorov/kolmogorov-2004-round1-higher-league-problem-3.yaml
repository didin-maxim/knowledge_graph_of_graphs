  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Расширенное проверенное решение",
      "text": "Будем называть данные Игорю графы карточками. Сначала Игорь отделяет те карточки, на\nкоторых получился связный граф. Если из дерева удалить вершину, то число компонент\nполучившегося графа равно степени удаленной вершины; поэтому связные карточки получаются\nровно при удалении листьев. Обозначим через \\(L\\) множество листьев исходного дерева \\(T\\).\n\nКаждая связная карточка имеет вид \\(T-l\\), где \\(l\\in L\\). Во всех таких карточках присутствует\nодна и та же часть дерева: дерево \\(T_0=T-L\\), полученное после удаления всех листьев. Остальные\nвершины связных карточек -- это листья, кроме одного удаленного листа. Поэтому, сравнивая все\nсвязные карточки, Игорь восстанавливает \\(T_0\\). Если \\(T\\) состоит из одной вершины или из\nодного ребра, это сразу видно из числа и вида карточек, и дерево уже восстановлено; далее\nсчитаем, что \\(T_0\\) непусто.\n\nРассмотрим вершину \\(v\\) дерева \\(T_0\\), которая является листом в \\(T_0\\). В исходном дереве\nу нее есть ровно один сосед, не являющийся листом исходного дерева; все остальные ее соседи\nв \\(T\\) являются листьями. Назовем такую вершину периферийной. Такие вершины распознаются\nпо восстановленному \\(T_0\\): это именно листья дерева \\(T_0\\).\n\nПусть к периферийной вершине \\(v\\) в исходном дереве было прикреплено \\(a\\) листьев. Тогда\nпри удалении самой вершины \\(v\\) карточка распадается на \\(a+1\\) компонент: отдельно стоят\nэти \\(a\\) листьев, а еще одна компонента содержит остальную часть дерева. Обратно, если\nкарточка имеет такую большую компоненту и несколько одноточечных компонент, причем большая\nкомпонента получается из уже восстановленного скелета удалением листа \\(v\\) из \\(T_0\\), то она\nсоответствует удалению именно этой периферийной вершины. Значит, по набору карточек Игорь\nоднозначно узнает, сколько листьев было прикреплено к каждому листу \\(T_0\\).\n\nТеперь можно восстановить дерево снаружи внутрь. Игорь добавляет к каждому листу \\(T_0\\)\nнайденное число листьев исходного дерева. После этого внешний слой считается восстановленным.\nЕсли удалить из текущего скелета его листья, то следующими периферийными вершинами станут\nлистья нового скелета. Для такой вершины карточка, полученная ее удалением из \\(T\\), распадается\nна компоненты, среди которых уже восстановленные внешние ветви распознаются по своему виду, а\nоставшаяся большая компонента задает еще не восстановленную внутреннюю часть. Поэтому тот же\nподсчет компонент показывает, какие уже восстановленные ветви надо прикрепить к этой вершине\nи сколько листьев было прикреплено к ней непосредственно.\n\nТак Игорь повторяет один и тот же шаг: по текущему скелету выбирает его листья, находит среди\nкарточек удаления соответствующих вершин, прикрепляет к ним все распознанные внешние ветви,\nа затем переходит к скелету без этих листьев. Процесс конечен, потому что на каждом шаге число\nвершин скелета уменьшается. Когда скелет становится одной вершиной или одним ребром, оставшаяся\nцентральная часть и все уже найденные внешние ветви соединяются единственным возможным образом.\nВсе операции на каждом шаге определяются только набором карточек, поэтому два разных исходных\nдерева не могли бы дать один и тот же набор рисунков. Следовательно, Игорь может однозначно\nвосстановить исходное дерево.",
