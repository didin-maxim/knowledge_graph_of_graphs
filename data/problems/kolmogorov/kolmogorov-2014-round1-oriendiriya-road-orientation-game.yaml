      "id": "idea-ordered-blocks",
      "title": "Ordered block invariant",
      "text": "Второй игрок может поддерживать упорядоченное разбиение городов на блоки: все дороги между разными блоками уже ориентированы от более раннего блока к более позднему, а внутри блоков дорог с направлением нет. После хода первого внутри блока второй отделяет конец новой стрелки в отдельный следующий блок.",
