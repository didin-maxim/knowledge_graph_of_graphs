  "solutions": [
    {
      "id": "sol-second-player-block-strategy",
      "title": "Стратегия второго через упорядоченные блоки",
      "text": "Выигрывает второй министр.\n\nПосле каждого своего хода он будет поддерживать такой инвариант. Все города разбиты на упорядоченные блоки \\(B_1,\\ldots,B_s\\). Если города лежат в разных блоках, то дорога между ними уже ориентирована из более раннего блока в более поздний. Если города лежат в одном блоке, то дорога между ними еще не ориентирована.\n\nВ начале есть один блок из всех 100 городов, поэтому инвариант выполнен.\n\nПусть перед ходом первого инвариант выполнен. Все дороги между разными блоками уже ориентированы, значит первый может выбрать только дорогу внутри некоторого блока \\(B\\). Пусть он ориентировал дорогу \\(x\\to y\\), где \\(x,y\\in B\\) и \\(|B|=m\\). Эта стрелка сама по себе не создает ориентированного цикла: внутри \\(B\\) до нее не было ориентированных дорог, а все дороги из внешних блоков идут относительно всего блока \\(B\\) в одном направлении.\n\nОтвет второго такой. Он заменяет блок \\(B\\) двумя соседними блоками \\(B\\setminus\\{y\\}\\) и \\(\\{y\\}\\), оставляя их на месте старого блока в этом порядке. Дорога \\(x\\to y\\) уже ориентирована первым. Второй дополнительно ориентирует все дороги \\(z y\\), где \\(z\\in B\\setminus\\{x,y\\}\\), в направлении \\(z\\to y\\). Таких дорог ровно \\(m-2\\), а так как \\(m\\le 100\\), их не больше 98; если \\(m=2\\), второму достаточно ориентировать 0 дорог, что разрешено условием.\n\nПосле этого все дороги между новыми блоками снова направлены слева направо, внутри каждого блока ориентированных дорог нет, а остальные блоки не менялись. Инвариант восстановлен.\n\nПока есть неориентированная дорога, она лежит внутри какого-то блока, и первый делает очередной ход именно там. Когда игра закончится, внутри блоков уже не останется неориентированных дорог, значит все блоки одноэлементны. Итоговая ориентация тогда идет по одному линейному порядку городов и не содержит ориентированных циклов. Поэтому при правильной игре выигрывает второй министр.",
