        "id": "stmt-original",
        "title": "Original statement",
        "text": "В стране Ориентирия 100 городов, каждые два города соединены дорогой с двусторонним движением. Два министра играют в игру. Первый каждым своим ходом вводит одностороннее движение на любой еще не ориентированной дороге. Второй каждым своим ходом вводит одностороннее движение на любом количестве от 0 до 98 еще не ориентированных дорог. Игра заканчивается, когда все дороги ориентированы. Первый министр выигрывает, если найдется такой город, что из него можно выехать по какой-нибудь дороге и, соблюдая правила движения, вернуться обратно. Иначе выигрывает второй министр. Какой министр выигрывает при правильной игре? (Жюри)",
