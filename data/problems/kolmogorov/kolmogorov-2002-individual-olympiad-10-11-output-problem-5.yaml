        "title": "Оригинальная формулировка",
        "text": "Ребра полного графа с `n` вершинами покрашены в несколько цветов так, что каждый цвет встречается не более `n - 2` раз.\n\nДокажите, что есть три вершины, все ребра между которыми покрашены в различные цвета.",
