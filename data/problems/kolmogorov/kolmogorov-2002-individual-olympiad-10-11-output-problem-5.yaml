      "id": "sol-official-compressed",
      "title": "Доказательство через максимальный цветовой пучок",
      "text": "Предположим противное: нет треугольника, у которого все три ребра имеют разные цвета. Тогда в каждом треугольнике среди трех ребер найдутся два одноцветных.\n\nВыберем вершину `A` и цвет так, чтобы из `A` выходило как можно больше ребер одного цвета. Обозначим этот цвет через `1`, а концы соответствующих ребер через `B_1, ..., B_k`; значит, ребра `AB_1, ..., AB_k` имеют цвет `1`, и ни из какой вершины не выходит больше чем `k` ребер одного цвета.\n\nРассмотрим любую вершину `C`, не входящую в множество `{B_1, ..., B_k}` и отличную от `A`. Ребро `AC` имеет некоторый цвет `i`, отличный от `1`, потому что все соседи, соединенные с `A` цветом `1`, уже перечислены как `B_j`. Для каждого `j` посмотрим на треугольник `A C B_j`. В нем ребра `AB_j` и `AC` имеют цвета `1` и `i`. Если бы ребро `CB_j` имело третий цвет, отличный и от `1`, и от `i`, получился бы разноцветный треугольник. Значит, каждое ребро `CB_j` имеет цвет либо `1`, либо `i`.\n\nНе может случиться, что все `k` ребер `CB_1, ..., CB_k` имеют цвет `i`: тогда из вершины `C` выходили бы `k+1` ребер цвета `i` — эти `k` ребер плюс ребро `CA`, — что противоречит максимальному выбору вершины `A` и цвета `1`. Следовательно, для каждой такой вершины `C` существует хотя бы одно ребро из `C` к некоторому `B_j`, окрашенное в цвет `1`.\n\nТеперь посчитаем ребра цвета `1`. Уже есть `k` ребер `AB_j`. Кроме того, для каждой из остальных `n-1-k` вершин `C` мы нашли хотя бы одно ребро цвета `1`, инцидентное этой вершине и некоторой вершине `B_j`. Эти найденные ребра различны, потому что имеют разные концы `C`. Поэтому всего ребер цвета `1` не меньше `k+(n-1-k)=n-1`.\n\nЭто противоречит условию, по которому каждый цвет встречается не более `n-2` раз. Значит, наше предположение неверно, и в полном графе существует треугольник с тремя попарно различными цветами ребер.",
