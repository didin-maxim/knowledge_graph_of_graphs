  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Официальное решение, сжатое изложение",
      "text": "В официальном тексте приведены два математически разных решения.\n\nРешение 1.\nПредполагают противное: в каждом треугольнике есть два одноцветных ребра.\nВыбирают вершину `A`, из которой выходит максимальное число ребер одного цвета, скажем цвета 1.\nПусть это ребра к вершинам `B_1, ..., B_k`.\nДля любой другой вершины `C_i`, соединенной с `A` ребром цвета `i`, каждое ребро от `C_i` к вершинам `B_j` должно иметь цвет 1 или `i`, иначе возник бы разноцветный треугольник.\nЕсли все такие ребра цвета `i`, то из `C_i` выходит еще больше ребер цвета `i`, чем из `A` цвета 1, что невозможно.\nЗначит, из каждой такой вершины выходит хотя бы одно ребро цвета 1, и в сумме получается не меньше `n - 1` ребер цвета 1, противоречие.\n\nРешение 2.\nСнова предполагают, что разноцветного треугольника нет.\nТогда для каждого цвета одноцветные ребра образуют несвязный граф: иначе было бы слишком много ребер этого цвета.\nСреди всех компонент связности всех цветов выбирают максимальную компоненту `F`.\nБерут вершину `A` вне `F`.\nАнализ цветов ребер между `A` и вершинами из `F` показывает, что существует компонентa другого цвета, строго большая, чем `F`, что противоречит максимальности.\n\nСледовательно, разноцветный треугольник существует.",
