      "id": "sol-official-compressed",
      "title": "Доказательство через максимальный цветовой пучок",
      "text": "Предположим противное: в каждом треугольнике есть два одноцветных ребра.\nВыберем вершину `A`, из которой выходит максимальное число ребер одного цвета, скажем цвета 1.\nПусть это ребра к вершинам `B_1, ..., B_k`.\nДля любой другой вершины `C_i`, соединенной с `A` ребром цвета `i`, каждое ребро от `C_i` к вершинам `B_j` должно иметь цвет 1 или `i`, иначе возник бы разноцветный треугольник.\nЕсли все такие ребра цвета `i`, то из `C_i` выходит еще больше ребер цвета `i`, чем из `A` цвета 1, что невозможно.\nЗначит, из каждой такой вершины выходит хотя бы одно ребро цвета 1, и в сумме получается не меньше `n - 1` ребер цвета 1, противоречие условию, что каждый цвет встречается не более `n - 2` раз.\n\nСледовательно, разноцветный треугольник существует.",
