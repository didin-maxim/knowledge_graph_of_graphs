    {
      "id": "sol-official-compressed",
      "title": "Расширенное проверенное решение",
      "text": "Достаточно доказать, что в графе нет нечетных циклов: граф двудолен тогда и только тогда, когда он не содержит нечетного цикла. Предположим противное и выберем нечетный цикл `C` минимальной длины `n`. Так как треугольников нет, `n >= 5`. Кроме того, у `C` нет хорд: хорда разбила бы нечетный цикл на два цикла, из которых один нечетен и имеет меньшую длину.\n\nСначала разберем случай `n = 5`. Пусть `C` имеет 5 вершин. Любая вершина вне `C` может быть смежна не более чем с двумя вершинами `C`: если она смежна с тремя вершинами пятерки, среди этих трех найдутся две соседние на `C`, и вместе с внешней вершиной они дадут треугольник. Поэтому число ребер между `C` и остальными 95 вершинами не больше `95 * 2`. Внутри самого цикла 5 ребер, и они дают вклад `10` в сумму степеней вершин цикла. Следовательно, сумма степеней пяти вершин `C` не превосходит `10 + 95 * 2 = 200`, а значит одна из них имеет степень не больше `40`. Это противоречит условию, по которому степень каждой вершины больше `40`.\n\nТеперь пусть `n = 7`. Сумма степеней семи вершин цикла больше `7 * 40 = 280`. Внутренние ребра цикла дают вклад `14`, значит ребер из вершин `C` во внешние 93 вершины больше `280 - 14 = 266`. Если бы каждая внешняя вершина была смежна не более чем с двумя вершинами `C`, таких ребер было бы не больше `93 * 2 = 186`, что невозможно. Значит, найдется внешняя вершина `x`, смежная хотя бы с тремя вершинами семицикла.\n\nЕсли среди этих соседей `x` на `C` есть две соседние вершины, то вместе с `x` они образуют треугольник. Иначе три выбранные вершины на семицикле попарно не соседние. Три промежутка между ними вдоль цикла тогда имеют длины не меньше 2 и в сумме дают 7, поэтому один из промежутков равен 3. Две соответствующие вершины соединены на `C` путем длины 3; добавляя к нему два ребра от них к `x`, получаем цикл длины 5. Это противоречит минимальности нечетного цикла `C`.\n\nОсталось рассмотреть `n >= 9`. Докажем вспомогательный факт: любые две вершины графа соединены путем длины не больше 3. Действительно, пусть вершины `u` и `v` не соединены таким путем. Тогда они не смежны, не имеют общего соседа, и между множествами `N(u)` и `N(v)` нет ребер. Эти множества не пересекаются, а их размеры больше 40. Возьмем вершину `a` из `N(u)`. Из-за отсутствия треугольников она не смежна ни с одной другой вершиной из `N(u)`, а из-за отсутствия пути `u-a-b-v` длины 3 она не смежна ни с одной вершиной из `N(v)`. Поэтому все соседи `a`, кроме, возможно, самой вершины `u`, лежат вне множества `{u, v} \\cup N(u) \\cup N(v)`. Таких внешних вершин меньше `100 - 2 - 40 - 40 = 18`, так что `deg(a) < 1 + 18 = 19`, тем более `deg(a) <= 40`. Противоречие с условием. Вспомогательный факт доказан.\n\nВыберем на цикле `C` две вершины `p` и `q`, расстояние между которыми вдоль одного из направлений цикла равно 4. По вспомогательному факту между ними существует путь `P` длины `1`, `2` или `3`. Путь `P` не совпадает с этой дугой длины 4. Если длина `P` нечетна, то путь `P` вместе с дугой `C` длины 4 образует нечетный замкнутый маршрут длины не больше 7, а значит содержит нечетный цикл меньшей длины, чем `n`. Если длина `P` четна, то используем другую дугу цикла, длина которой равна `n - 4`; она нечетна, и вместе с `P` дает нечетный замкнутый маршрут длины `n - 4 + |P| < n`. В обоих случаях получаем нечетный цикл короче `C`, снова противоречие минимальности.\n\nВсе возможные длины минимального нечетного цикла привели к противоречию. Следовательно, нечетных циклов в графе нет, а значит граф двудолен.",
