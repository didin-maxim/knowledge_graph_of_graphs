  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Официальное решение, сжатое изложение",
      "text": "Официальное решение сводит задачу к отсутствию нечетных циклов. Предположим, что в графе есть нечетный цикл минимальной длины `n`.\n\nПри `n = 5` каждая из остальных 95 вершин может быть соединена не более чем с двумя вершинами цикла, иначе появился бы треугольник. Тогда сумма степеней вершин цикла не превышает `10 + 95 * 2 = 200`, и какая-то вершина цикла имела бы степень не больше 40, что противоречит условию.\n\nПри `n = 7` среди остальных вершин найдется вершина, соединенная хотя бы с тремя вершинами цикла; тогда легко возникает либо треугольник, либо цикл длины 5. При `n >= 9` используют тот факт, что любые две вершины графа соединяются путем длины не больше 3, и это позволяет разрезать исходный цикл на два меньших, один из которых нечетен. Получаем противоречие с минимальностью.\n\nСледовательно, нечетных циклов нет, значит граф двудолен.",
