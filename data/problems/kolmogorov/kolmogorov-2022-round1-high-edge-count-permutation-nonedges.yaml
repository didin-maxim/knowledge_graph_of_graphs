      "id": "idea-two-vertex-deletion",
      "title": "Удаление двух вершин и продолжение перестановки",
      "text": "В разреженном графе либо есть изолированная вершина, которую удобно поменять с вершиной максимальной степени, либо есть две древесные компоненты, из которых можно удалить по листу. После индукции на оставшемся графе перестановку продолжают на две удалённые вершины: в случае листьев достаточно выбрать между фиксацией и перестановкой этих двух листьев.",
