      "id": "idea-complement-packing",
      "title": "Дополнение и упаковка графа с самим собой",
      "text": "Если перейти к дополнительному графу \\(H\\), то не-рёбра исходного графа становятся рёбрами \\(H\\). Условие означает, что всякая перестановка переводит хотя бы одно ребро \\(H\\) снова в ребро \\(H\\). Поэтому верхняя оценка сводится к лемме: любой граф на \\(n\\) вершинах с не более чем \\(n-2\\) рёбрами можно переставить так, чтобы его образ был реберно не пересекающимся с ним самим.",
