    {
      "id": "sol-official-restored",
      "title": "Требует полного разбора",
      "text": "Сначала приведём пример графа с \\(C_n^2-(n-1)\\) рёбрами, для которого выполнено условие. Пусть \\(G\\) это граф, в котором есть одна изолированная вершина \\(u\\), а любая пара из оставшихся вершин соединена ребром. Тогда если \\(\\sigma(u) = w \\neq u\\) и \\(\\sigma(v) = u\\) для некоторой вершины \\(v\\), то вершины \\(u\\) и \\(v\\), а также вершины \\(\\sigma(u) = w\\) и \\(\\sigma(v) = u\\) не соединены ребром. Если же \\(\\sigma(u) = u\\), то для любой \\(v\\) вершины \\(u\\) и \\(v\\), а также вершины \\(\\sigma(u) = u\\) и \\(\\sigma(v)\\) не соединены ребром.\n\nТеперь докажем, что для любого графа с хотя бы \\(C_n^2-(n-1)+1\\) рёбрами существует перестановка \\(\\sigma\\), не удовлетворяющая условию. Пусть \\(G\\) это антиграф данного в задаче графа. То есть в \\(G\\) проведены всё рёбра, которых не было в первоначальном графе, и удалены все рёбра, которые были. В первоначальном графе было хотя бы \\(C_n^2-(n-1)+1\\) рёбер, откуда следует, что в \\(G\\) не более \\(n-2\\) рёбер. Докажем индукцией по количеству вершин (\\(n\\)), что существует перестановка \\(\\sigma\\) на вершинах \\(G\\) такая, то ни для какого ребра \\((u,v)\\) между вершинами \\(\\sigma(u)\\) и \\(\\sigma(v)\\) нет ребра. Из этого будет следовать оценка.\n\nБаза для \\(n = 2\\) и \\(n = 3\\) очевидна. Докажем переход. Разберём два случая. Если в \\(G\\) есть изолированная вершина \\(u\\), то рассмотрим вершину наибольшей степени \\(v\\). Так как степень вершины \\(v\\) максимальна, то граф \\(G - u - v\\)  содержит \\(n-2\\) вершины и не более \\(n-4\\) ребра при \\(n \\geq 4\\). По предположению индукции для полученного графа существует перестановка \\(\\sigma\\), не удовлетворяющая условию задачи.  Положим \\(\\sigma(u) = v\\), а \\(\\sigma(v) = u\\). Нетрудно видеть, что перестановка \\(\\sigma\\) на графе \\(G\\) также не подходит под условие задачи.\n\nПусть в \\(G\\) нет изолированных вершин. Так как в \\(G\\) не более \\(n-2\\) рёбра, то \\(G\\) состоит из нескольких компонент связности, не менее двух из которых являются деревьями. Путь \\(u\\) и \\(v\\) это две висячие вершины двух разных деревьев. граф \\(G - u - v\\)  содержит \\(n-2\\) вершины и не более \\(n-4\\) ребра при \\(n \\geq 4\\). По предположению индукции для полученного графа существует перестановка \\(\\sigma\\), не удовлетворяющая условию задачи. Нетрудно убедиться, что в зависимости от значений перестановки \\(\\sigma\\) на соседних вершинах с \\(u\\) и \\(v\\), её можно продолжить или \\(\\sigma(u) = u\\) и \\(\\sigma(v) = v\\), или \\(\\sigma(u) = v\\) и \\(\\sigma(v) = u\\) так, чтобы \\(\\sigma\\) не удовлетворяла условию задачи.",
