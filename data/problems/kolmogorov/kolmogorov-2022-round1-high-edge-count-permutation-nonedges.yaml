  "solutions": [
    {
      "id": "sol-official-restored",
      "title": "Ответ: \\(\\binom n2-(n-1)\\)",
      "text": "Ответ равен\n\\[\n\\binom n2-(n-1)=\\binom{n-1}{2}.\n\\]\n\nСначала построим пример. Возьмём граф \\(F\\), состоящий из клики на \\(n-1\\) вершинах и одной изолированной вершины \\(a\\). В нём ровно \\(\\binom{n-1}{2}=\\binom n2-(n-1)\\) рёбер. Проверим условие. Пусть \\(\\sigma\\) -- произвольная перестановка вершин. Если \\(\\sigma(a)=a\\), то для любой вершины \\(x\\ne a\\) пара \\(a,x\\) несмежна и её образ \\(a,\\sigma(x)\\) тоже несмежен. Если же \\(\\sigma(a)=b\\ne a\\), возьмём \\(x=\\sigma^{-1}(a)\\). Тогда \\(x\\ne a\\), поэтому \\(a,x\\) несмежны, а их образы \\(b,a\\) также несмежны, так как \\(a\\) изолирована. Значит такое число рёбер достижимо.\n\nДокажем, что больше рёбер быть не может. Пусть \\(F\\) -- исходный граф, а \\(H=\\overline F\\) -- его дополнительный граф на тех же вершинах. Тогда не-рёбра \\(F\\) являются рёбрами \\(H\\). Условие задачи можно переписать так: для любой перестановки \\(\\sigma\\) существует ребро \\(uv\\) графа \\(H\\), для которого \\(\\sigma(u)\\sigma(v)\\) тоже является ребром \\(H\\). Иными словами, ни одна переставленная копия \\(H\\) не может быть реберно не пересекающейся с самим \\(H\\).\n\nНам нужна следующая лемма.\n\nЛемма. Если простой граф \\(H\\) на \\(n\\ge2\\) вершинах имеет не более \\(n-2\\) рёбер, то существует перестановка \\(\\pi\\) его вершин такая, что образ любого ребра \\(H\\) не является ребром \\(H\\).\n\nДокажем лемму индукцией по \\(n\\). При \\(n=2\\) рёбер нет, и всё очевидно. При \\(n=3\\) в графе не более одного ребра; если ребро есть, меняем один его конец с изолированной вершиной, и это ребро переходит в не-ребро.\n\nПусть теперь \\(n\\ge4\\), и лемма доказана для меньших чисел вершин. Сначала рассмотрим случай, когда в \\(H\\) есть изолированная вершина \\(u\\). Выберем вершину \\(v\\) максимальной степени \\(\\Delta\\). Покажем, что после удаления \\(u\\) и \\(v\\) остаётся не более \\(n-4\\) рёбер. Если \\(\\Delta\\ge2\\), то это сразу следует из оценки\n\\[\ne(H-u-v)=e(H)-\\Delta\\le (n-2)-2=n-4.\n\\]\nЕсли же \\(\\Delta\\le1\\), то \\(H\\) является объединением паросочетания и изолированных вершин. Все рёбра лежат среди остальных \\(n-1\\) вершин, поэтому при \\(\\Delta=1\\)\n\\[\ne(H-u-v)=e(H)-1\\le \\left\\lfloor\\frac{n-1}{2}\\right\\rfloor-1\\le n-4,\n\\]\nа при \\(\\Delta=0\\) рёбер вообще нет. Значит к графу \\(H-u-v\\), имеющему \\(n-2\\) вершины, применимо предположение индукции. Получим перестановку \\(\\tau\\) его вершин, переводящую все его рёбра в не-рёбра. Продолжим её на весь \\(H\\), положив \\(\\pi(u)=v\\), \\(\\pi(v)=u\\), а на остальных вершинах \\(\\pi=\\tau\\). Рёбра внутри \\(H-u-v\\) остаются хорошими по индукции. Рёбер, инцидентных \\(u\\), нет. Любое ребро \\(vx\\), инцидентное \\(v\\), переходит в пару \\(u,\\tau(x)\\), а она не является ребром, потому что \\(u\\) изолирована. Поэтому в этом случае лемма доказана.\n\nОстаётся случай, когда изолированных вершин в \\(H\\) нет. Разложим \\(H\\) на компоненты связности. Пусть древесных компонент \\(t\\). В недревесной компоненте число рёбер не меньше числа вершин, а в древесной -- ровно на 1 меньше. Поэтому\n\\[\ne(H)\\ge n-t.\n\\]\nТак как \\(e(H)\\le n-2\\), получаем \\(t\\ge2\\). Значит существуют две различные древесные компоненты. Выберем в них листья \\(u\\) и \\(v\\); пусть \\(x\\) и \\(y\\) -- их единственные соседи соответственно. После удаления \\(u\\) и \\(v\\) исчезают ровно два ребра, поэтому в оставшемся графе не более \\(n-4\\) рёбер. По предположению индукции на графе \\(H-u-v\\) существует перестановка \\(\\tau\\), переводящая все его рёбра в не-рёбра.\n\nТеперь надо аккуратно продолжить \\(\\tau\\) на \\(u\\) и \\(v\\). Если положить \\(\\pi(u)=u\\), \\(\\pi(v)=v\\), то новые рёбра надо проверять только для \\(ux\\) и \\(vy\\). Ребро \\(ux\\) перейдёт в \\(u,\\tau(x)\\) и останется ребром только в случае \\(\\tau(x)=x\\); аналогично \\(vy\\) плохо только при \\(\\tau(y)=y\\). Поэтому если \\(\\tau(x)\\ne x\\) и \\(\\tau(y)\\ne y\\), продолжение с фиксацией \\(u,v\\) подходит.\n\nЕсли же хотя бы одно из равенств \\(\\tau(x)=x\\), \\(\\tau(y)=y\\) выполнено, используем другое продолжение: положим \\(\\pi(u)=v\\), \\(\\pi(v)=u\\). Тогда ребро \\(ux\\) переходит в \\(v,\\tau(x)\\) и может остаться ребром только при \\(\\tau(x)=y\\), а ребро \\(vy\\) переходит в \\(u,\\tau(y)\\) и может остаться ребром только при \\(\\tau(y)=x\\). Но если, например, \\(\\tau(x)=x\\), то \\(\\tau(x)\\ne y\\), а инъективность \\(\\tau\\) запрещает \\(\\tau(y)=x\\). Аналогично, если \\(\\tau(y)=y\\), то невозможны обе плохие альтернативы. Значит продолжение с перестановкой \\(u\\) и \\(v\\) подходит. Лемма доказана.\n\nВернёмся к исходной задаче. Если бы в \\(F\\) было хотя бы\n\\[\n\\binom n2-(n-1)+1\n\\]\nребро, то в дополнительном графе \\(H\\) было бы не более \\(n-2\\) рёбер. По лемме нашлась бы перестановка \\(\\pi\\), переводящая каждое ребро \\(H\\) в не-ребро \\(H\\). В терминах исходного графа это означает: для каждой несмежной в \\(F\\) пары \\(u,v\\) пара \\(\\pi(u),\\pi(v)\\) уже смежна в \\(F\\). Такая перестановка нарушает условие задачи. Следовательно, больше чем \\(\\binom n2-(n-1)\\) рёбер быть не может, а пример выше показывает, что этот максимум достигается.",
