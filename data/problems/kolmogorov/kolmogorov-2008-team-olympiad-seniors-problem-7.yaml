    {
      "id": "sol-double-counting-expanded",
      "title": "Полное решение двойным подсчетом",
      "text": "Переформулируем задачу так: ребра полного графа `K_21` раскрашены в четыре цвета, и нужно доказать существование одноцветного цикла длины 4.\n\nДля каждой вершины `v` обозначим через `d_1(v), d_2(v), d_3(v), d_4(v)` числа ребер четырех цветов, выходящих из `v`. Их сумма равна 20. Число одноцветных путей длины 2 с серединой в `v` равно\n`C(d_1(v),2)+C(d_2(v),2)+C(d_3(v),2)+C(d_4(v),2)`.\nЭта сумма минимальна, когда четыре числа как можно равнее; поскольку сумма равна 20, минимум равен `4*C(5,2)=40`. Значит во всем графе не меньше `21*40=840` одноцветных двухзвенных путей, где фиксированы середина пути, пара концов и цвет.\n\nПредположим, что одноцветного цикла длины 4 нет. Тогда для любых двух вершин `x,y` и любого цвета не может существовать двух разных вершин `u,w`, соединенных с обеими вершинами `x,y` ребрами этого цвета: иначе `x-u-y-w-x` был бы одноцветным циклом длины 4. Поэтому для каждой неупорядоченной пары концов и каждого цвета существует не более одного такого центра. Всего пар концов `C(21,2)=210`, цветов 4, значит одноцветных двухзвенных путей не больше `210*4=840`.\n\nОбе оценки дают ровно 840. Следовательно, в каждой вершине должна достигаться нижняя граница, то есть из каждой вершины выходит ровно по 5 ребер каждого цвета. Но тогда в каждом из четырех цветовых графов все 21 вершины имеют степень 5, что невозможно: сумма степеней была бы `21*5=105`, нечетное число, а сумма степеней любого графа равна удвоенному числу ребер.\n\nПолученное противоречие показывает, что одноцветный цикл длины 4 обязательно существует. В исходных терминах это и есть четыре города, которые можно облететь по циклу авиалиниями одной компании.",
