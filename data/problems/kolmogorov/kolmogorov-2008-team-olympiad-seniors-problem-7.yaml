      "title": "??????????? ???????, ?????? ???????",
      "text": "Официальное решение рассматривает полный граф на 21 вершине с раскраской ребер в 4 цвета. Из одной вершины выходит 20 ребер, значит хотя бы 5 из них имеют один цвет; рассматривают соответствующие 5 соседей.\n\nЕсли среди этих 5 вершин есть ребро того же цвета, то вместе с исходной вершиной получается одноцветный треугольник, из которого затем извлекают нужную конфигурацию. Если же такого ребра нет, то между 5 вершинами остаются только три цвета, и подсчет одноцветных двушаговых путей показывает, что среди них возникает одноцветный цикл длины 4.\n\nСледовательно, в любой 4-раскраске ребер полного графа `K_21` обязательно есть одноцветный цикл из четырех вершин.",
