        "title": "Оригинальная формулировка",
        "text": "`999` команд сыграли двухкруговой турнир по волейболу: каждая сыграла с каждой матч дома и матч в гостях.\n\nКаждая команда выиграла ровно половину своих домашних матчей и ровно половину гостевых.\n\nДокажите, что какая-то из команд дважды обыграла какую-то другую.",
