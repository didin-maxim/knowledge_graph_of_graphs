      "id": "sol-official-compressed",
      "title": "Самодостаточное решение",
      "text": "Предположим противное: ни одна команда не обыграла другую дважды.\n\nТогда для каждой пары команд возможны только два типа поведения:\nлибо обе команды выиграли домашние матчи,\nлибо обе команды выиграли гостевые матчи.\n\nСоединим ребром те пары команд, в которых обе команды победили друг друга дома.\n\nПолучим граф на `999` вершинах. Так как каждая команда выиграла ровно половину домашних матчей, степень каждой вершины этого графа равна `499`.\n\nНо сумма степеней графа должна быть четной, а здесь она равна `999 * 499`, что нечетно. Это противоречит лемме о рукопожатиях.\n\nСледовательно, найдется пара команд, одна из которых выиграла у другой оба матча.",
