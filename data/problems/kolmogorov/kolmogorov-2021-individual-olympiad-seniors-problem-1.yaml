  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Самодостаточное решение",
      "text": "Предположим противное: ни одна команда не обыграла другую дважды. Рассмотрим две произвольные команды `X` и `Y`. Они сыграли два матча: один на площадке `X`, другой на площадке `Y`. По нашему предположению не может быть так, что `X` выиграла оба матча, и не может быть так, что `Y` выиграла оба матча. Значит, победы в этой паре разделились поровну: либо обе команды выиграли свои домашние матчи, либо обе команды выиграли свои гостевые матчи.\n\nПостроим простой граф на `999` вершинах-командах. Соединим две команды ребром тогда и только тогда, когда в их паре обе команды выиграли домашние матчи. Для фиксированной команды ее степень в этом графе равна числу ее домашних побед: каждое ребро, выходящее из вершины, соответствует сопернику, которого эта команда победила дома, а если команда победила дома данного соперника, то по предыдущему абзацу соперник тоже победил дома, значит соответствующее ребро действительно есть.\n\nКаждая команда сыграла дома с `998` соперниками и выиграла ровно половину домашних матчей, то есть `499`. Следовательно, в построенном графе каждая из `999` вершин имеет степень `499`.\n\nНо сумма степеней любого конечного неориентированного графа равна удвоенному числу ребер, поэтому должна быть четной. Здесь сумма степеней равна `999 * 499`, а это произведение двух нечетных чисел, то есть нечетное число. Получили противоречие.\n\nЗначит, исходное предположение неверно, и найдутся две команды, одна из которых обыграла другую в обоих матчах.",
