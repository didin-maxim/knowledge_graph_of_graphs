        "id": "stmt-original",
        "title": "Оригинальная формулировка",
        "text": "Дети привезли в лагерь по гаджету. Гаджет, привезенный ребенком `i`, получил номер `i`.\n\nКаждый ребенок упорядочил все гаджеты от более желанного к менее желанному. Воспитатель хочет предложить перестановку `sigma`, по которой ребенку `i` достанется гаджет `sigma(i)`.\n\nГруппа детей `A` может заблокировать предложение, если дети из `A` могут перераспределить между собой гаджеты, привезенные ими самими, так, чтобы каждый получил гаджет не хуже, чем в предложении `sigma`, и хотя бы один ребенок получил бы другой гаджет, чем в `sigma`.\n\nДокажите, что существует не более одного предложения воспитателя, которое не может заблокировать ни одна группа детей.",
        "source_id": "src-kolmogorov-2021-official",
