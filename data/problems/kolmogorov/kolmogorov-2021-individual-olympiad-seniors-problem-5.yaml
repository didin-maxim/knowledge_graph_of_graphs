  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Официальное решение, сжатое изложение",
      "text": "В официальном решении строится ориентированный граф на детях.\n\nИз вершины `i` проводят ребро в вершину `j`, если гаджет `j` нравится ребенку `i` больше всего среди всех доступных.\n\nВ любом конечном ориентированном графе есть цикл; выберем такой цикл `C_1` и предложим каждому ребенку из него гаджет следующего по циклу ребенка. После этого детей цикла убирают и повторяют ту же процедуру на оставшихся детях. Так получается последовательность циклов `C_1, C_2, ...` и предложение `sigma`.\n\nРассмотрим любое другое предложение `sigma'`. Пусть `B` — множество детей, для которых `sigma(i) != sigma'(i)`. Выберем ребенка из `B`, принадлежащего циклу с минимальным номером `C_k`.\n\nТогда все более ранние циклы получили в `sigma` и `sigma'` те же гаджеты, а дети из `C_k` в `sigma` уже получили свои лучшие оставшиеся гаджеты. Значит, дети цикла `C_k` могут внутри себя организовать перераспределение не хуже, чем `sigma'`, причем хотя бы для одного ребенка оно будет отличаться от `sigma'`.\n\nСледовательно, цикл `C_k` блокирует `sigma'`. Значит, никакое предложение, отличное от `sigma`, не может быть неблокируемым. Поэтому такое предложение не более чем одно.",
