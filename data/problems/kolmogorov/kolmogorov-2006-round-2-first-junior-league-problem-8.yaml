      "id": "sol-official-compressed",
      "title": "Официальное решение, сжатое изложение",
      "text": "Ответ: `3n + 1`.\n\nВ официальном решении на клетках строят дерево: выбирают белую клетку в качестве корня, на следующий ярус помещают соседние с ней черные, затем соседние с ними белые клетки и так далее.\n\nИз корня может выходить не более 4 ребер, а из любой другой вершины дерева — не более 3. Так как цвета по ярусам чередуются, при `n` черных клетках число белых клеток не превосходит `3n + 1`.\n\nЭта оценка достигается на подходящей ветвящейся конструкции, поэтому максимум равен `3n + 1`.",
