    {
      "id": "sol-official-compressed",
      "title": "Проверенное самодостаточное решение",
      "text": "Ответ: `3n + 1`.\n\nРассмотрим граф клеток фигуры: вершинами являются клетки, а ребро соединяет две клетки с общей стороной. Фигура связна, значит этот граф связен. Выберем в нем остовное дерево и укореним его в некоторой белой клетке, если белые клетки есть. Если белых клеток нет, оценка очевидна.\n\nВ шахматной раскраске соседние по стороне клетки имеют разные цвета, поэтому уровни укорененного дерева чередуются по цвету. У корневой белой клетки может быть не более `4` сыновей-черных клеток. У любой другой черной клетки один сосед в дереве уже является ее отцом-белой клеткой, а всего у клетки на доске не более `4` соседей; значит, у такой черной клетки не более `3` сыновей-белых клеток. То же верно и для черных сыновей корня: у каждого из них уже есть отец, поэтому белых сыновей не больше `3`.\n\nКаждая белая клетка, кроме корня, является сыном некоторой черной клетки. Черных клеток всего `n`, и каждая из них может дать не более `3` белых сыновей. Поэтому число белых клеток не превосходит `1+3n`.\n\nПокажем, что эта оценка достижима. При `n=1` берем одну черную клетку и все четыре соседние с ней белые клетки; получается связная фигура с `4=3n+1` белыми клетками. При `n >= 2` расположим `n` черных клеток в одной горизонтальной цепочке через одну клетку, а между соседними черными клетками включим белую клетку-связку. Таких связок `n-1`. К каждой внутренней черной клетке добавим две вертикальные соседние белые клетки, а к двум крайним черным клеткам добавим по три белые клетки, не лежащие между черными. Все эти клетки различны, и вся фигура связна через горизонтальную цепочку.\n\nЧисло белых клеток в этой конструкции равно `(n-1)+2(n-2)+6=3n+1`. Следовательно, максимум действительно равен `3n+1`.",
