  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Проверенное самодостаточное решение",
      "text": "Ответ: `3n + 1`.\n\nПостроим дерево на клетках: выберем белую клетку корнем, поместим соседние с ней черные клетки на следующий уровень, затем соседние с ними белые клетки и продолжим так же.\n\nИз корня может выходить не более 4 ребер, а из любой другой вершины дерева — не более 3. Так как цвета по ярусам чередуются, при `n` черных клетках число белых клеток не превосходит `3n + 1`.\n\nОценка достигается так. Расположим `n` чёрных клеток через одну в горизонтальной цепочке, а между соседними чёрными клетками включим белую клетку-связку. Таких связок `n-1`. К каждой внутренней чёрной клетке добавим две боковые белые клетки, а к двум крайним — по три боковые белые клетки. Получится связная фигура с `n` чёрными и `(n-1)+2(n-2)+6=3n+1` белыми клетками. Поэтому максимум равен `3n + 1`.",
