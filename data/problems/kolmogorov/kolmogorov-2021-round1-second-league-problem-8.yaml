  "ideas": [
    {
      "id": "idea-graph-role",
      "title": "Графовая роль",
      "text": "Граф прямо фигурирует в условии: это полный двудольный граф с раскраской ребер.\nОфициальное решение работает через компоненты связности цветовых подграфов, деревья, циклы и подсчет избытка ребер.",
      "tags": [],
