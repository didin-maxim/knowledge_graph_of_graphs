        "title": "Оригинальная формулировка",
        "text": "Дан полный двудольный граф, в каждой доле которого по \\(n\\) вершин. Каждое ребро этого графа покрашено в один из \\(n^2 - 2n + 2\\) цветов, причем в каждый цвет покрашено хотя бы одно ребро.\n\nДокажите, что найдутся две вершины графа, между которыми существует не более одного одноцветного простого пути.",
