  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Официальное решение, сжатое изложение",
      "text": "Для каждого цвета рассматривают подграф, состоящий из ребер этого цвета, и разбивают его на компоненты связности. Учитываются только компоненты, содержащие более одной вершины.\n\nПусть всего получилось `m` таких цветовых компонент `G_1, ..., G_m`. Для компоненты `G_i` обозначим через `v_i` число ее вершин, через `e_i` — число ребер, а через `c_i = e_i - v_i + 1` ее цикломатический избыток.\n\nТак как цветов не меньше `n^2 - 2n + 2`, а всего ребер в полном двудольном графе `n^2`, получаем\n`sum c_i <= 2n - 2`.\n\nТеперь фиксируют вершину `p` и предполагают противное: для любой другой вершины `q` существует как минимум два одноцветных простых пути из `p` в `q`.\n\nЦветовые компоненты, содержащие `p`, делят на деревья и недеревья. Все остальные вершины классифицируют по тому, в скольких таких компонентах они лежат: в двух деревьях, в одном дереве и одном недереве, или только в недеревьях.\n\nИз этого получается нижняя оценка на `sum c_i`, которая оказывается не меньше `2n - 1`, что противоречит предыдущей верхней оценке `2n - 2`.\n\nЗначит, существует пара вершин, между которыми не более одного одноцветного простого пути.",
