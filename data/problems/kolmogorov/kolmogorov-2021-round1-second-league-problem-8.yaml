  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Подсчёт цветовых компонент",
      "text": "Рассмотрим отдельно каждый цвет. Подграф, состоящий из ребер этого цвета, разобьем на компоненты связности и оставим только нетривиальные компоненты, то есть содержащие хотя бы одно ребро. Пусть все такие компоненты по всем цветам равны `G_1, ..., G_m`. Для компоненты `G_i` обозначим через `v_i` число ее вершин, через `e_i` число ее ребер и положим\n\\[\n  c_i=e_i-1.\n\\]\nТак как каждый цвет встречается хотя бы на одном ребре, число нетривиальных цветовых компонент не меньше числа цветов:\n\\[\n  m\\ge n^2-2n+2.\n\\]\nС другой стороны, каждое ребро исходного полного двудольного графа попадает ровно в одну из этих компонент, поэтому `sum e_i=n^2`. Отсюда\n\\[\n  \\sum_{i=1}^m c_i=\\sum_{i=1}^m(e_i-1)=n^2-m\\le 2n-2. \\tag{1}\n\\]\n\nПредположим противное: между любыми двумя различными вершинами существует как минимум два одноцветных простых пути. Зафиксируем вершину `p`. Пусть `p` входит ровно в компоненты `G_1, ..., G_s`; среди них первые `k` являются деревьями, а компоненты `G_{k+1}, ..., G_s` содержат цикл.\n\nДля дерева `G_i`, содержащего `p`, имеем `e_i=v_i-1`, значит `c_i=v_i-2`. Для недеревянной связной компоненты `G_i` имеем `e_i>=v_i`, значит `c_i>=v_i-1`. Величина `v_i-1` здесь равна числу вершин, отличных от `p`, которые лежат в этой компоненте вместе с `p`.\n\nРазделим остальные `2n-1` вершин на три категории. Пусть `a` - число вершин, лежащих вместе с `p` хотя бы в двух компонентах-деревьях. Пусть `b` - число вершин, лежащих вместе с `p` ровно в одной компоненте-дереве и хотя бы в одной недеревянной компоненте. Пусть `d` - число вершин, не лежащих вместе с `p` ни в одной компоненте-дереве, но лежащих хотя бы в одной недеревянной компоненте.\n\nЭти три категории действительно покрывают все вершины, отличные от `p`. В самом деле, если для вершины `q` есть два одноцветных пути из `p` в `q` разных цветов, то `q` лежит вместе с `p` в двух цветовых компонентах. Если же два таких пути одного цвета, их объединение содержит цикл, поэтому соответствующая цветовая компонента не является деревом. Значит, вершина `q` не может лежать вместе с `p` только в одной компоненте-дереве и ни в одной недеревянной компоненте, а также не может не лежать ни в какой компоненте вместе с `p`. Поэтому\n\\[\n  a+b+d=2n-1. \\tag{2}\n\\]\n\nПосчитаем инцидентности вершин с компонентами, содержащими `p`. По компонентам-деревьям получаем\n\\[\n  \\sum_{i=1}^k (v_i-1)\\ge 2a+b, \\tag{3}\n\\]\nпотому что вершины первой категории учитываются хотя бы дважды, вершины второй - один раз. По недеревянным компонентам получаем\n\\[\n  \\sum_{i=k+1}^s (v_i-1)\\ge b+d, \\tag{4}\n\\]\nпотому что каждая вершина второй и третьей категорий лежит хотя бы в одной такой компоненте.\n\nЕще нам нужно неравенство `k<=a+b`. Действительно, в каждом из `k` деревьев, содержащих `p`, выберем ребро, инцидентное `p`. Эти ребра различны, а их вторые концы тоже различны, поскольку исходный граф простой. Каждый такой второй конец лежит вместе с `p` в компоненте-дереве; по доказанному выше покрытию он обязан попасть в первую или вторую категорию. Значит, таких вершин не меньше `k`, то есть\n\\[\n  k\\le a+b. \\tag{5}\n\\]\n\nТеперь оцениваем сумму `c_i` снизу, отбросив неотрицательные вклады компонент, не содержащих `p`:\n\\[\n\\begin{aligned}\n  \\sum_{i=1}^m c_i\n  &\\ge \\sum_{i=1}^s c_i \\\\\n  &\\ge \\sum_{i=1}^k (v_i-2)+\\sum_{i=k+1}^s (v_i-1) \\\\\n  &= \\sum_{i=1}^k (v_i-1)-k+\\sum_{i=k+1}^s (v_i-1) \\\\\n  &\\ge (2a+b-k)+(b+d) \\\\\n  &\\ge a+b+d=2n-1,\n\\end{aligned}\n\\]\nгде использованы (3), (4), (5) и (2). Это противоречит верхней оценке (1), согласно которой `sum c_i<=2n-2`.\n\nСледовательно, предположение неверно. Значит, найдутся две вершины, между которыми существует не более одного одноцветного простого пути.",
