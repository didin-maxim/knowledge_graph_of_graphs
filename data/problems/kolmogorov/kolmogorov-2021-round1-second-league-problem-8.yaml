      "title": "Считать избыток цветовых компонент",
      "text": "Для каждого цвета разбиваем одноцветный подграф на нетривиальные компоненты и считаем величины `c_i=e_i-1`. Много цветов дает верхнюю оценку на сумму этих величин, а предположение о двух одноцветных путях от фиксированной вершины ко всем остальным дает более сильную нижнюю оценку через компоненты-деревья и компоненты с циклом.",
