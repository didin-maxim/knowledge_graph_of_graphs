    {
      "id": "sol-official-expanded",
      "title": "Эйлеров подсчёт и индукционная конструкция",
      "text": "Ответ: \\(0\\) при \\(n=1\\), \\(1\\) при \\(n=2\\), и \\(3n-6\\) при \\(n\\ge3\\).\n\nСначала докажем верхнюю оценку. Рассмотрим плоский граф \\(G\\), вершинами которого являются все отмеченные точки, а рёбрами — все проведённые отрезки и четыре стороны квадрата. Из условия, что никакие три отмеченные точки не лежат на одной прямой, следует, что отмеченная точка не может лежать внутри стороны какого-либо многоугольника разбиения. Поэтому каждая отмеченная точка действительно является вершиной графа \\(G\\).\n\nПусть \\(V\\) и \\(E\\) — числа вершин и рёбер графа \\(G\\), где в \\(E\\) включены четыре стороны исходного квадрата. Внутренних граней у графа ровно \\(n\\), поэтому для разбиения диска формула Эйлера имеет вид\n\\[\nV-E+n=1. \\tag{1}\n\\]\n\nРазберём степени вершин. Если отмеченная точка лежит внутри квадрата и имеет степень \\(d\\), то \\(d\\) рёбер, выходящих из неё, разбивают полный угол \\(360^\\circ\\) на \\(d\\) углов многоугольников разбиения. Каждый такой угол меньше \\(180^\\circ\\), потому что все многоугольники выпуклы и трёх отмеченных точек на одной прямой нет. Значит, \\(d\\ge3\\).\n\nУ вершины исходного квадрата степень всегда не меньше 2, потому что к ней прилегают две стороны квадрата. Покажем, что при \\(n>2\\) степень 2 может иметь не более одна вершина квадрата. Если степень 2 имеют две соседние вершины \\(A\\) и \\(B\\), то многоугольник, содержащий сторону \\(AB\\), обязан также идти из \\(A\\) по второй стороне квадрата и из \\(B\\) по второй стороне квадрата. Следовательно, он содержит все четыре вершины квадрата. Выпуклое подмножество квадрата, содержащее все четыре его вершины, совпадает со всем квадратом; значит, тогда \\(n=1\\), что противоречит \\(n>2\\).\n\nПусть теперь степень 2 имеют две противоположные вершины, например \\(A\\) и \\(C\\), а остальные вершины квадрата — \\(B\\) и \\(D\\). Многоугольник при вершине \\(A\\) содержит стороны \\(AB\\) и \\(AD\\). Чтобы он был выпуклым, его граничный путь от \\(B\\) до \\(D\\) должен быть прямым отрезком \\(BD\\); иначе выпуклая область, содержащая \\(A,B,D\\), должна была бы содержать весь треугольник \\(ABD\\), и ломаная граница от \\(B\\) до \\(D\\) оказалась бы внутренней. Точно так же многоугольник при \\(C\\) лежит по другую сторону того же отрезка \\(BD\\). Значит, разбиение состоит только из двух треугольников, и \\(n=2\\). При \\(n>2\\) это невозможно.\n\nИтак, при \\(n>2\\) все вершины графа, кроме, возможно, одной угловой вершины квадрата, имеют степень не меньше 3, а возможная исключительная вершина имеет степень 2. Поэтому\n\\[\n2E\\ge 3(V-1)+2=3V-1. \\tag{2}\n\\]\nИз (2) получаем \\(V\\le(2E+1)/3\\). Подставляя это в (1), имеем\n\\[\n1=V-E+n\\le {2E+1\\over 3}-E+n=n+{1-E\\over 3}.\n\\]\nОтсюда \\(E\\le 3n-2\\). Четыре из этих рёбер — стороны квадрата, а не проведённые отрезки, поэтому число проведённых отрезков не превосходит\n\\[\nE-4\\le 3n-6.\n\\]\nЭто доказывает верхнюю оценку для \\(n\\ge3\\).\n\nДля \\(n=1\\) отрезков быть не может: один выпуклый многоугольник — это весь квадрат. Для \\(n=2\\) общая граница двух выпуклых многоугольников не может быть ломаной с внутренней вершиной: в такой вершине два угла, принадлежащие двум многоугольникам, в сумме дают \\(360^\\circ\\), и один из них был бы не меньше \\(180^\\circ\\). Значит, общая граница — один отрезок, и максимум равен 1; он достигается диагональю квадрата.\n\nОсталось построить примеры для всех \\(n\\ge3\\). Для \\(n=3\\) возьмём квадрат \\(ABCD\\) с координатами \\(A=(0,0)\\), \\(B=(1,0)\\), \\(C=(1,1)\\), \\(D=(0,1)\\) и внутреннюю точку \\(O=(11/20,2/5)\\). Проведём \\(OA,OB,OC\\). Получаются треугольники \\(AOB\\), \\(BOC\\) и четырёхугольник \\(AOCD\\); последний выпукл, потому что при обходе \\(A,O,C,D\\) все повороты имеют один знак, что сразу проверяется подстановкой указанных координат. Никакие три из пяти отмеченных точек не лежат на одной прямой. Итак, квадрат разбит на 3 выпуклых многоугольника, проведено ровно 3 отрезка, а внутренняя вершина \\(O\\) имеет степень 3.\n\nТеперь опишем шаг индукции. Пусть уже есть пример с \\(m\\ge3\\) многоугольниками, \\(3m-6\\) проведёнными отрезками и некоторой внутренней вершиной \\(O\\) степени 3. Пусть из \\(O\\) выходят отрезки к трём соседним вершинам \\(X,Y,Z\\). Удалим точку \\(O\\) и три отрезка \\(OX,OY,OZ\\). Вместо неё возьмём очень маленький треугольник \\(O_XO_YO_Z\\) около прежнего положения \\(O\\), причём вершины \\(O_X,O_Y,O_Z\\) лежат соответственно на старых направлениях к \\(X,Y,Z\\). Проведём три укороченных отрезка \\(XO_X,YO_Y,ZO_Z\\) и три стороны маленького треугольника.\n\nЕсли треугольник выбран достаточно малым, то каждый из трёх старых многоугольников при вершине \\(O\\) просто отсекается маленькой стороной и остаётся выпуклым; дополнительно появляется один новый выпуклый треугольник. Число многоугольников увеличивается на 1. Число проведённых отрезков меняется так: три старых отрезка удалены, шесть новых проведены, то есть добавилось ровно 3 отрезка. Поэтому из \\(3m-6\\) получается \\(3m-3=3(m+1)-6\\). Новые вершины маленького треугольника имеют степень 3, так что шаг можно повторять. Положение маленького треугольника можно выбрать общим, чтобы никакие три отмеченные точки не стали коллинеарными.\n\nИндукция даёт пример с \\(3n-6\\) проведёнными отрезками для любого \\(n\\ge3\\). Верхняя оценка и конструкции вместе доказывают ответ.",
