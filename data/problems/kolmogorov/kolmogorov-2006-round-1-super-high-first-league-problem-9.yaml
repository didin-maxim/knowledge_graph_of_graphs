      "id": "sol-official-compressed",
      "title": "Проверенное самодостаточное решение",
      "text": "Ответ: `0` при `n = 1`, `1` при `n = 2`, `3n - 6` при `n >= 3`.\n\nПостроим граф, ребрами которого будут проведенные отрезки и стороны квадрата. Все внутренние вершины этого графа имеют степень не меньше 3. Для вершин самого квадрата также получают почти ту же нижнюю оценку на степени: иначе при `n > 2` возник бы невыпуклый многоугольник или слишком малое число частей.\n\nПосле этого для числа вершин `V`, ребер `E` и граней `F = n` используют неравенство `2E >= 3V - 1` и формулу Эйлера `1 = V - E + F`. Из них выводится оценка `E <= 3n - 2`, а затем вычитаются 4 стороны квадрата. Получается верхняя граница `3n - 6`.\n\nПример на `3n - 6` строится по индукции, добавляя треугольник вместо внутренней вершины степени 3.",
