        "title": "Оригинальная формулировка",
        "text": "Внутри квадрата отмечено несколько точек, вместе с вершинами квадрата. Некоторые пары отмеченных точек соединены непересекающимися отрезками так, что квадрат разбился на `n` выпуклых многоугольников без отмеченных точек внутри. Найдите максимальное возможное количество проведенных отрезков.",
