      {
        "id": "stmt-original",
        "text": "Пусть \\(m\\) и \\(t\\) — положительные целые числа. Рассмотрим мультиграф, максимальная степень которого не превосходит \\(2m\\). Две вершины \\(x\\) и \\(y\\) находятся на расстоянии \\(t\\). Каково наибольшее возможное число путей длины \\(t\\) из \\(x\\) в \\(y\\)?",
