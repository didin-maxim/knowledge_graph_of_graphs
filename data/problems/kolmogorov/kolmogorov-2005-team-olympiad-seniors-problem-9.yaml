      "id": "sol-official-compressed",
      "title": "Проверенное самодостаточное решение",
      "text": "Обозначим через `T(G)` множество остовных деревьев графа `G`, а через `M(G)` множество его остовных подграфов, имеющих ровно один цикл.\n\nВозьмем любое остовное дерево `T`. Так как число вершин четно, у дерева нечетное число ребер. Поскольку общее число ребер графа тоже четно, вне `T` остается нечетное число ребер. Если добавить к `T` любое из этих ребер, получится остовный подграф с единственным циклом, то есть элемент множества `M(G)`. Значит, каждому дереву соответствует нечетное число элементов из `M(G)`.\n\nТеперь возьмем любой граф `H` из `M(G)` и рассмотрим его единственный цикл `Z`. Удаляя из `Z` одно ребро, мы получаем остовные деревья, из которых мог получиться `H`. Так как исходный граф двудолен, цикл `Z` имеет четную длину, следовательно, у `H` четное число таких \"предков\".\n\nПодсчитав число пар вида `(остовное дерево, одноцикловый остовный граф)`, где второй получается добавлением одного ребра к первому, двумя способами, получаем, что число остовных деревьев должно быть четным.",
