  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Официальное решение, сжатое изложение",
      "text": "Ответ: `n - 1`.\n\nПример дает звезда: одна вершина соединена со всеми остальными, а других ребер нет. Тогда при добавлении любого недостающего ребра между двумя листьями возникает треугольник с центром звезды.\n\nПокажем, что меньше `n - 1` ребер быть не может. Если в графе на `n` вершинах меньше `n - 1` ребра, то он несвязен. Тогда можно добавить ребро между вершинами из разных компонент связности, и никакого треугольника не появится. Противоречие.",
