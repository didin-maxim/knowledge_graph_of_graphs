      "title": "Graph-theory role in kolmogorov-2012-individual-olympiad-seniors-problem-1",
      "text": "Граф прямо задан в условии: вершины, ребра и треугольники являются объектами задачи. Официальное решение использует связность графа и пример со звездой.",
