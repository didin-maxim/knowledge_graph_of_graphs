      "id": "sol-official-compressed",
      "title": "Полное решение",
      "text": "Ответ: `n - 1`.\n\nСначала покажем, что это число достижимо. Возьмем звезду на `n` вершинах: одна вершина является центром и соединена со всеми остальными, а между остальными вершинами ребер нет. Если добавить любое недостающее ребро, то оно соединит две вершины-листа. Обе они уже соединены с центром звезды, поэтому новое ребро вместе с двумя ребрами к центру образует треугольник, содержащий добавленное ребро. Значит, `n - 1` ребра действительно могут хватить.\n\nТеперь докажем, что меньше быть не может. Всякий связный граф на `n` вершинах имеет не менее `n - 1` ребра: например, если из него удалить ребра циклов, пока циклов не останется, получится дерево на тех же `n` вершинах, а в дереве ровно `n - 1` ребро. Следовательно, граф с меньшим числом ребер обязательно несвязен.\n\nПусть исходный граф несвязен. Возьмем две вершины из разных компонент связности и добавим между ними ребро. Чтобы это новое ребро входило в треугольник, должна существовать третья вершина, соединенная с обеими выбранными вершинами. Но тогда до добавления ребра эти две вершины уже лежали бы в одной компоненте связности через эту третью вершину, что невозможно. Значит, при добавлении такого ребра треугольник не появляется. Это противоречит условию задачи.\n\nИтак, любой подходящий граф имеет хотя бы `n - 1` ребро, а пример со звездой показывает, что эта оценка точна.",
