  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Official solution, compressed",
      "text": "Ответ: `99`.\n\nПример на достижимость: выберем столицу, присвоим всем дорогам из столицы цену 1, а всем дорогам между двумя нестоличными городами — цену 1000. Тогда до закрытия дорог любой самый дешевый путь стоит не более 2. Если закрыть все 99 дорог, выходящих из столицы, то из столицы пути исчезают, а между двумя нестоличными городами минимальная цена возрастает до 1000.\n\nОценка снизу: предположим, что закрыто меньше 99 дорог. Рассмотрим граф, вершины которого — города, а ребра — закрытые дороги. Такой граф с 100 вершинами и менее чем 99 ребрами не может быть связным. Значит, вершины можно разбить на два непустых множества `A` и `B` так, что ни одно ребро между `A` и `B` не закрыто.\n\nПусть `ab` — самая дешевая из дорог между `A` и `B`. Любой маршрут из `a` в `b` обязан хотя бы один раз пересечь границу между `A` и `B`, то есть содержать некоторую дорогу между этими частями. Но по выбору `ab` никакая такая дорога не дешевле прямой дороги `ab`. Следовательно, и до, и после закрытия дорог кратчайший путь из `a` в `b` — это сама дорога `ab`, так что его цена не изменилась. Противоречие.\n\nЗначит, требуется как минимум 99 закрытых дорог, и это значение достигается.",
