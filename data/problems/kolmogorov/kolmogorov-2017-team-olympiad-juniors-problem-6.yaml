        "id": "stmt-original",
        "title": "Original statement",
        "text": "В стране 100 городов, каждые два из которых соединены дорогой с положительной стоимостью проезда. Власти закрыли `k` дорог на ремонт, и после этого для любой пары городов самый дешевый маршрут между ними либо подорожал, либо вовсе исчез.\n\nПри каком наименьшем `k` это возможно?",
