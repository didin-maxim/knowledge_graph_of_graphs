      "id": "sol-official-compressed",
      "title": "Решение через длиннейший путь",
      "text": "Предположим противное: степень каждой вершины графа не меньше 3. Рассмотрим одну связную компоненту графа. В ней тоже степени всех вершин не меньше 3, поэтому достаточно получить противоречие внутри этой компоненты.\n\nВыберем в этой компоненте простой путь максимальной длины и обозначим его `v_1, v_2, ..., v_k`. Все соседи вершины `v_k` лежат на этом пути: если бы у `v_k` был сосед вне пути, путь можно было бы продолжить, что противоречило бы максимальности.\n\nТак как `deg(v_k) >= 3`, у вершины `v_k` есть по крайней мере три соседа среди вершин пути. Пусть два соседних среди них вдоль пути соседа имеют номера `i < j`, а следующий после них имеет номер `l`, так что `v_i`, `v_j`, `v_l` смежны с `v_k` и между `v_i` и `v_j`, а также между `v_j` и `v_l` на пути нет других соседей `v_k`.\n\nТогда ребро `v_kv_j` и отрезок пути от `v_i` до `v_j` вместе с ребром `v_kv_i` образуют цикл. Ребро `v_kv_j`, отрезок пути от `v_j` до `v_l` и ребро `v_kv_l` образуют второй цикл по той же причине: это замкнутый обход без повторения вершин, кроме начала и конца. Эти два цикла имеют общее ребро `v_kv_j`. Других общих ребер у них нет: соответствующие отрезки длиннейшего пути не пересекаются по ребрам, а остальные ребра циклов различны.\n\nПолучились два цикла, имеющие ровно одно общее ребро, что запрещено условием. Противоречие показывает, что в графе обязательно есть вершина степени не больше 2.",
