  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Официальное решение, сжатое изложение",
      "text": "Официальное решение идет по индукции по числу вершин графа.\n\nЕсли граф несвязен, утверждение доказывают отдельно для каждой компоненты. Если граф имеет точку сочленения, то индукцию применяют к блокам, в одном из них находится вершина степени не больше 2, и ее степень в исходном графе также не превосходит 2.\n\nОстается случай, когда граф связен и не имеет точек сочленения. Предположим противное: степени всех вершин хотя бы 3. Рассмотрим максимальный простой путь `v_1...v_k`. Так как конец `v_k` не является точкой сочленения, после удаления `v_k` граф остается связным, поэтому у `v_k` есть как минимум два соседа на этом пути. Отсюда возникают два цикла, проходящие по разным хордам к пути и имеющие ровно одно общее ребро, что противоречит условию.\n\nЗначит, вершина степени не больше 2 существует.",
