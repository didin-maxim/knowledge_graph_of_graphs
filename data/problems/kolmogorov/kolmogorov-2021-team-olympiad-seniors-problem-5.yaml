      "id": "idea-graph-role",
      "title": "Графовая роль",
      "text": "В условии явно задан неориентированный граф дорог с требованием связности выбранного подмножества вершин и контроля его внешней границы.\nОфициальное решение полностью графовое: работает с вершинами, соседями, стягиванием вершины и инъективной кодировкой связных подграфов с фиксированной границей.",
