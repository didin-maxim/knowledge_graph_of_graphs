        "id": "stmt-original",
        "title": "Оригинальная формулировка",
        "text": "В стране несколько городов, один из которых — Москва. Некоторые пары городов соединены двусторонними дорогами.\n\nМэр хочет объединить Москву еще с `n` городами в большую Москву так, чтобы:\n1. между любыми двумя городами большой Москвы можно было проехать по дорогам, не попадая в города вне нее;\n2. было ровно `k` городов вне большой Москвы, соединенных хотя бы одной дорогой с большой Москвой.\n\nДокажите, что есть не более `C_{n+k}^k` способов совершить такое объединение.",
