  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Самодостаточное решение",
      "text": "Приведем графовую оценку через включение или исключение соседа Москвы.\n\nВ первом решении все города большой Москвы красят в красный цвет, а все внешние соседние города — в зеленый. После этого строится инъективное отображение из допустимых выборов большой Москвы в последовательности из `n` красных и `k` зеленых символов.\n\nДля этого вершины, соседние с Москвой, последовательно выписываются в порядке номеров, а затем по очереди раскрываются соседи уже выписанных красных вершин. Полученная цветная последовательность однозначно восстанавливает исходный выбор, так что число вариантов не превосходит числа таких последовательностей, то есть `C_{n+k}^k`.\n\nВо втором решении проводится индукция по `n + k`. Рассматривается сосед Москвы `X`.\n\nЕсли `X` включают в большую Москву, то `X` и Москву стягивают в одну вершину и переходят к задаче с `n - 1` красной вершиной и тем же числом внешних соседей.\n\nЕсли `X` не включают, то вершину `X` удаляют, и число внешних соседей уменьшается на `1`.\n\nПо индукционному предположению получается оценка\n`C_{n+k-1}^k + C_{n+k-1}^{k-1} = C_{n+k}^k`.",
