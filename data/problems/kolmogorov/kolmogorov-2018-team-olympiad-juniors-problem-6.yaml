  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Самодостаточное решение",
      "text": "Ответ: `1`.\n\nПусть регион `M` дает минимум автобусной мобильности, а регион `N` — минимум железнодорожной. Разобьем множество городов на четыре части:\n\n- `X = M ∩ N`,\n- `Y = M \\\\ X`,\n- `Z = N \\\\ X`,\n- `T` — города вне `M ∪ N`.\n\nОбозначим мощности этих частей через `a, b, c, d`. Тогда маршруты между `T` и `X`, а также между `Y` и `Z`, обязательно учитываются хотя бы в одной из двух мобильностей. Поэтому в сумме учитывается не меньше `ad + bc` маршрутов, и\n\n`A + B >= (ad + bc) / 10`,\n\nтак как в `M` и `N` не более 10 городов.\n\nДальше разбираются случаи по нулевым и ненулевым значениям `a, b, c, d`.\n\n1. Если все `a, b, c, d` ненулевые, то `ad + bc >= (a + d - 1) + (b + c - 1) >= 18`, откуда `A + B > 1`.\n\n2. Если `c = 0` или `b = 0`, то из ограничения на размер региона получается `d >= 10`, и снова `A + B >= 1`.\n\n3. Если `bc != 0`, но `ad = 0`, то один из наборов пуст, и маршруты между `Y` и `Z` дают вклад не меньше `min(b, c) >= 1`, значит `A + B >= 1`.\n\nПример на достижимость: взять город `X`, соединенный со всеми только железнодорожными маршрутами, и город `Y`, соединенный со всеми, кроме `X`, только автобусными. Тогда автобусная мобильность одноэлементного региона `{X}` равна `0`, а железнодорожная мобильность региона `{Y}` равна `1`. Значит, `A + B = 1`.",
