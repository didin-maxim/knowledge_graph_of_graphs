      "title": "Графовая роль",
      "text": "Условие напрямую задает полный граф на городах с двуцветной раскраской ребер. Официальное решение работает через разрезы по подмножествам вершин (`M`, `N`, `X`, `Y`, `Z`, `T`) и подсчет числа ребер двух цветов, пересекающих эти разрезы.",
