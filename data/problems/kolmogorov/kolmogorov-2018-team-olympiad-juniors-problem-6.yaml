        "id": "stmt-original",
        "title": "Оригинальная формулировка",
        "text": "В государстве 20 городов, каждые два из которых соединены либо автобусным, либо железнодорожным маршрутом. Регион — любое непустое множество не более чем из 10 городов.\n\nАвтобусная мобильность региона — это число автобусных маршрутов, ведущих из региона наружу, деленное на число городов в регионе. Железнодорожная мобильность определяется аналогично.\n\nПусть `A` — наименьшая автобусная мобильность среди всех регионов, а `B` — наименьшая железнодорожная мобильность. Найдите наименьшее возможное значение `A + B`.",
