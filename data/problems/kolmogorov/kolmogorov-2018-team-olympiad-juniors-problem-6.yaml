  "solutions": [
    {
      "id": "sol-official-full",
      "title": "Полное решение по официальной схеме",
      "text": "Ответ: `1`.\n\nПусть всего городов `20 = 2m`, где `m = 10`. Выберем регион `M`, на котором достигается минимум автобусной мобильности, и регион `N`, на котором достигается минимум железнодорожной мобильности. Обозначим через `R` число автобусных маршрутов из `M` наружу, а через `S` число железнодорожных маршрутов из `N` наружу. Тогда\n\n`A = R / |M|`, `B = S / |N|`, причем `1 <= |M|, |N| <= m`.\n\nРазобьем все города на четыре части:\n\n- `X = M ∩ N`,\n- `Y = M \\\\ N`,\n- `Z = N \\\\ M`,\n- `T = V \\\\ (M ∪ N)`.\n\nПусть `|X| = a`, `|Y| = b`, `|Z| = c`, `|T| = d`. Рассмотрим ребро между `X` и `T`. Если оно автобусное, то оно идет из `M` наружу и входит в `R`; если железнодорожное, то оно идет из `N` наружу и входит в `S`. Точно так же любое ребро между `Y` и `Z` входит в `R`, если оно автобусное, и входит в `S`, если оно железнодорожное. Поэтому\n\n`R + S >= ad + bc`.\n\nТак как `|M| = a + b <= m` и `|N| = a + c <= m`, получаем\n\n`A + B = R/|M| + S/|N| >= (R + S)/m >= (ad + bc)/m`.\n\nОсталось доказать, что во всех случаях отсюда или из более точного учета следует `A + B >= 1`.\n\n1. Если все четыре числа `a, b, c, d` положительны, то `ad >= a + d - 1` и `bc >= b + c - 1`. Поэтому\n\n`ad + bc >= (a + d - 1) + (b + c - 1) = a + b + c + d - 2 = 18 > 10`,\n\nи значит `A + B > 1`.\n\n2. Пусть `c = 0`. Тогда `N = X`, поэтому `a = |N| > 0`. Из `|M| = a + b <= 10` и `a + b + d = 20` следует `d >= 10`. Тогда `ad + bc = ad >= 10`, откуда `A + B >= 1`. Случай `b = 0` аналогичен.\n\n3. Остается случай `bc > 0` и `ad = 0`. Если `a > 0`, то из `ad = 0` следует `d = 0`, и тогда\n\n`20 = a + b + c < 2a + b + c = |M| + |N| <= 20`,\n\nпротиворечие. Значит, `a = 0`. Тогда `M = Y`, `N = Z`, `b > 0`, `c > 0`. Все `bc` ребер между `Y` и `Z` учитываются в `A + B`: автобусное ребро дает вклад `1/b`, железнодорожное — вклад `1/c`. Каждый из этих вкладов не меньше `1/max(b,c)`, поэтому суммарный вклад только таких ребер не меньше\n\n`bc / max(b,c) = min(b,c) >= 1`.\n\nИтак, для любой раскраски маршрутов всегда `A + B >= 1`.\n\nПокажем достижимость. Возьмем город `x` и соединим его со всеми остальными только железнодорожными маршрутами. Возьмем другой город `y` и все маршруты из `y` во все города, кроме `x`, сделаем автобусными; остальные маршруты можно выбрать произвольно. Тогда автобусная мобильность региона `{x}` равна `0`, а железнодорожная мобильность региона `{y}` равна `1`. Следовательно, для этой конструкции `A + B <= 1`, а по уже доказанной нижней оценке `A + B = 1`.",
