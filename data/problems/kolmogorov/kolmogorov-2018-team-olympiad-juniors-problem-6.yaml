    {
      "id": "idea-graph-role",
      "title": "Два минимальных разреза",
      "text": "Выбираются регионы `M` и `N`, на которых достигаются минимумы автобусной и железнодорожной мобильностей. Разбиение вершин на `X = M ∩ N`, `Y = M \\\\ N`, `Z = N \\\\ M`, `T = V \\\\ (M ∪ N)` позволяет посчитать ребра между `X` и `T`, а также между `Y` и `Z`: каждое такое ребро обязательно попадает в автобусный разрез `M` или в железнодорожный разрез `N`. Последний малый случай закрывается не только числом таких ребер, но и их весами `1/|M|` и `1/|N|` в сумме мобильностей.",
