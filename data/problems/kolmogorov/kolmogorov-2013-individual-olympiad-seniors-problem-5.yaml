        "id": "stmt-original",
        "title": "Оригинальная формулировка",
        "text": "Дано дерево `T` с `n > 2` вершинами, в котором степени всех вершин меньше `n-1`. Пусть `A` — множество его висячих вершин.\n\nДобавим к дереву `T` рёбра некоторого цикла, проходящего по всем вершинам множества `A` ровно по одному разу и не проходящего через остальные вершины. Докажите, что вершины полученного графа можно правильно раскрасить в три цвета.",
        "source_id": "src-kolmogorov-2013-official",
