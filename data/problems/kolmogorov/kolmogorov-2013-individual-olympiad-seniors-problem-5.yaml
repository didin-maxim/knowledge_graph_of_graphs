      "id": "sol-official-compressed",
      "title": "Полное решение",
      "text": "Обозначим добавленный цикл на множестве листьев `A` через `C`. Так как дерево не является звездой: в нём нет вершины степени `n-1`, то не все листья имеют одного и того же соседа.\n\nВыберем лист `a` и обозначим через `v` его единственного соседа в дереве `T`. Вершина `v` не является листом. Назовём особыми те листья дерева, которые смежны с `v`; в частности, `a` особый. Не все листья особые, потому что иначе `v` была бы смежна со всеми остальными `n-1` вершинами дерева, что запрещено условием.\n\nУдалим из `T` вершину `v` и все листья дерева. Оставшийся граф является лесом, поэтому его можно правильно раскрасить в два цвета, скажем в цвета `1` и `2`. При этом каждая неудалённая вершина, смежная в `T` с каким-нибудь листом, уже получила один из этих двух цветов. Вершину `v` покрасим в цвет `3`.\n\nОсталось раскрасить листья, то есть вершины цикла `C`. На цикле есть особая вершина, после которой при некотором направлении обхода идёт неособая: действительно, множество особых листьев непусто и не совпадает со всем множеством `A`. Начнём обход с такой пары. Пусть `x` — эта первая неособая вершина, а перед ней на цикле стоит особая вершина `s`. Покрасим `x` в цвет `3`. Это допустимо, потому что сосед `x` в дереве не равен `v` и уже имеет цвет `1` или `2`.\n\nДалее идём по циклу от `x` в сторону, противоположную `s`, и красим каждый следующий ещё неокрашенный лист `y`. У листа `y` есть ровно один сосед в дереве. Если `y` особый, этот сосед равен `v` и имеет цвет `3`; если `y` неособый, его сосед в дереве уже окрашен в цвет `1` или `2`. Кроме того, предыдущая вершина цикла уже окрашена. Поэтому среди трёх цветов всегда найдётся цвет, отличный и от цвета предыдущей вершины цикла, и от цвета древесного соседа листа `y`; красим `y` в такой цвет. Так все листья, кроме начальной особой вершины `s`, получают цвета, и все уже рассмотренные рёбра дерева и цикла окрашены правильно.\n\nТеперь покрасим оставшуюся вершину `s`. Её древесный сосед `v` имеет цвет `3`, а её сосед по циклу `x` тоже имеет цвет `3`. Другой сосед `s` по циклу уже окрашен в один из трёх цветов. Выберем для `s` один из цветов `1` или `2`, отличный от цвета этого второго циклического соседа; это возможно. Тогда `s` отличается по цвету от обоих соседей на цикле и от своего древесного соседа `v`.\n\nВсе рёбра полученного графа принадлежат либо дереву `T`, либо циклу `C`. На рёбрах между неудалёнными вершинами правильность даёт двухцветная раскраска леса; рёбра от `v` к особым листьям и к неудалённым вершинам идут из цвета `3` в цвета `1` или `2`; все остальные рёбра к листьям и все рёбра цикла были проверены при построении. Значит, полученный граф правильно раскрашен в три цвета.",
