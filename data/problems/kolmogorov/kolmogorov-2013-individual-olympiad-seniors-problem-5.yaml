  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Официальное решение, сжатое изложение",
      "text": "Выделим в дереве вершину, смежную с какой-нибудь висячей вершиной; она не является висячей. Все висячие вершины, смежные с ней, назовём особыми. Не все висячие вершины особые, потому что степени всех вершин меньше `n-1`.\n\nЕсли удалить из исходного дерева выделенную вершину и все висячие вершины, то останется дерево, а значит, его можно раскрасить в два цвета. Выделенную вершину покрасим в третий цвет.\n\nТеперь надо раскрасить висячие вершины, обходя добавленный цикл. В этом цикле найдётся особая вершина, за которой идёт не особая. Эту не особую вершину красим в третий цвет, а затем каждую следующую вершину цикла красим в любой цвет, отличный и от цвета предыдущей вершины цикла, и от цвета вершины дерева, с которой она смежна вне цикла.\n\nВ конце приходим к первой особой вершине. Две из трёх её соседних вершин уже покрашены в третий цвет, поэтому ей можно подобрать один из двух остальных цветов. Получается правильная 3-раскраска всего графа.",
