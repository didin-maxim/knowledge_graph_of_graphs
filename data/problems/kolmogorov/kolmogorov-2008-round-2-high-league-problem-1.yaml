    {
      "id": "sol-official-compressed",
      "title": "Решение через сортировку игроков по местам",
      "text": "Будем считать игроков вершинами полного ориентированного графа турнира: для каждой пары игроков проводим стрелку от победителя личной встречи к проигравшему. Таблица результатов задает такой турнир на уже известных игроках. Искомое распределение мест — это некоторая нумерация этих `n` вершин местами от `1` до `n`; вопрос к жюри сравнивает номера двух выбранных вершин.\n\nДостаточная стратегия не требует угадывать эту нумерацию сразу. Нужно просто отсортировать игроков по их местам, используя разрешенные вопросы как обычные сравнения. Например, применим сортировку слиянием. Разобьем игроков на две почти равные группы, рекурсивно упорядочим каждую группу, а затем сольем два уже упорядоченных списка. При слиянии каждый вопрос сравнивает первых еще не поставленных игроков из двух списков; игрок, занявший более высокое место, записывается следующим. Если один список закончился, оставшиеся игроки второго списка дописываются без вопросов.\n\nДля слияния двух списков общей длины `m` требуется не более `m - 1` вопросов. Поэтому на каждом уровне рекурсии суммарно задается не более `n` вопросов, а уровней не больше `ceil(log_2 n)`. Значит, в худшем случае достаточно не более `n ceil(log_2 n)` вопросов. Более точная стандартная оценка для сортировки слиянием также дает число порядка `n log_2 n`.\n\nИнформационная оценка объясняет, почему этот порядок правильный. До вопросов, если не использовать дополнительных ограничений на места, возможны `n!` разных нумераций игроков. После `k` вопросов есть не более `2^k` различных последовательностей ответов, значит для гарантированного различения всех вариантов необходимо `2^k >= n!`, то есть `k >= ceil(log_2(n!))`. Следовательно, найденная стратегия имеет оптимальный порядок величины.",
