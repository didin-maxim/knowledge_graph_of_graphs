  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Официальное решение, сжатое изложение",
      "text": "В официальном решении результаты турнира переводятся на язык ориентированного графа: игроки становятся вершинами, а для каждой пары проводится ориентированное ребро от победителя к проигравшему. Получается полный ориентированный граф с помеченными вершинами.\n\nОдин вопрос сравнения двух мест делит множество возможных нумераций вершин не более чем пополам. Изначально возможны все `n!` нумераций, поэтому после `k` вопросов можно различить не более `2^k` вариантов.\n\nОтсюда достаточно взять `k`, для которого `2^k >= n!`, то есть `k >= ceil(log_2(n!))`. Далее в решении используется оценка `log_2(n!) <= n log_2 n`, так что числа вопросов порядка `n log_2 n` хватает.",
