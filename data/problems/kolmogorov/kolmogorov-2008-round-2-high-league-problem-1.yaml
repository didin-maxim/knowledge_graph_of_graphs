        "title": "Оригинальная формулировка",
        "text": "В круговом теннисном турнире участвуют `n` игроков. Нужно по таблице результатов однозначно определить, какой игрок занял какое место. За один вопрос разрешается спросить про сравнение мест двух игроков. Сколько вопросов достаточно в худшем случае?",
