    {
      "id": "sol-official-restored",
      "title": "Конечный процесс с выбранными и хорошими вершинами",
      "text": "Построим на множестве \\(A\\) двуцветный ориентированный граф. Для различных вершин \\(b,a\\in A\\) проведём синюю стрелку \\(b\\to a\\), если \\(b\\) делится на \\(a\\), и красную стрелку \\(b\\to a\\), если \\(a+1\\) делится на \\(b+1\\). Оба отношения транзитивны: для синих стрелок это обычная транзитивность делимости, а для красных из \\(x\\to y\\) и \\(y\\to z\\) следует, что \\(z+1\\) делится на \\(y+1\\), а \\(y+1\\) делится на \\(x+1\\), значит \\(z+1\\) делится на \\(x+1\\).\n\nНужно выбрать такое множество вершин \\(B\\), что между различными вершинами \\(B\\) нет ни синих, ни красных стрелок, а каждая вершина вне \\(B\\) получает из \\(B\\) хотя бы одну стрелку одного из двух цветов. Тогда условия задачи будут выполнены: отсутствие синих стрелок между двумя выбранными числами означает, что ни одно из них не делит другое, отсутствие красных означает то же для чисел, увеличенных на 1, а входящая стрелка из \\(b\\in B\\) в \\(a\\) даёт ровно одно из требуемых покрывающих условий.\n\nБудем делить вершины на три непересекающиеся группы: исходные, выбранные и хорошие. Вначале все вершины исходные. Перенесём в выбранные все исходные вершины, в которые не входит ни одна синяя стрелка из исходных. После этого каждая оставшаяся исходная вершина получает синюю стрелку из некоторой выбранной вершины: действительно, двигаясь по входящим синим стрелкам, то есть к числам из \\(A\\), кратным текущему, мы из-за конечности \\(A\\) приходим к вершине, в которую уже не входит синяя стрелка, а транзитивность даёт синюю стрелку от неё к исходной вершине. Кроме того, между выбранными нет синих стрелок, потому что конец такой стрелки имел бы входящую синюю стрелку и не был бы выбран.\n\nТеперь будем поддерживать несколько инвариантов. Во-первых, между выбранными вершинами нет синих стрелок. Во-вторых, ни одна исходная вершина не имеет синей стрелки в выбранную: это верно сразу после первого выбора, а дальше при переносе выбранных в хорошие сохраняется; когда мы добавляем новые выбранные вершины, они будут браться только среди тех исходных вершин, в которые синие стрелки приходят лишь из хороших, так что старая выбранная вершина не может получить синюю стрелку из новой. В-третьих, каждая хорошая вершина имеет красную стрелку из некоторой выбранной.\n\nЕсли между выбранными вершинами нет красных стрелок, то при условии, что каждая исходная вершина покрыта синей стрелкой из выбранных, мы уже закончили. Иначе перенесём из выбранных в хорошие все выбранные вершины, в которые входит красная стрелка из другой выбранной вершины. После этого между оставшимися выбранными нет красных стрелок. Проверим третий инвариант. Пусть вершина \\(v\\) была перенесена в хорошие, потому что была красная стрелка \\(u\\to v\\) из выбранной вершины \\(u\\). Если \\(u\\) осталась выбранной, всё ясно. Если \\(u\\) тоже перенесена, то в неё входила красная стрелка из ещё одной выбранной вершины. Продолжая так назад, мы не можем идти бесконечно: вдоль красной стрелки \\(x\\to y\\) для различных вершин число \\(x+1\\) строго меньше числа \\(y+1\\). Значит, цепочка заканчивается выбранной вершиной \\(w\\), которая не была перенесена, и по транзитивности красных стрелок имеем \\(w\\to v\\). Старые хорошие вершины также остаются покрытыми: если раньше была красная стрелка \\(s\\to g\\), а \\(s\\) перенесена в хорошие, то той же цепочкой и транзитивностью заменяем \\(s\\) на оставшуюся выбранную вершину.\n\nПосле переноса в хорошие некоторые исходные вершины могли потерять синее покрытие из выбранных. Добавим в выбранные все исходные вершины, в которые все входящие синие стрелки идут только из хороших вершин. Синие стрелки между выбранными после этого не появляются. Для старых выбранных это следует из второго инварианта: исходные вершины не посылают в них синих стрелок. Если синяя стрелка шла бы из старой выбранной вершины или из другой добавляемой исходной вершины в новую выбранную, то эта новая вершина имела бы входящую синюю стрелку не из хорошей вершины, что запрещено её выбором.\n\nПосле такого добавления каждая оставшаяся исходная вершина снова покрыта синей стрелкой из выбранных. В самом деле, если исходная вершина \\(a\\) не покрыта, возьмём среди исходных вершин, из которых по синей стрелке можно попасть в \\(a\\), вершину \\(c\\), в которую не входит синяя стрелка из другой такой исходной вершины. Если в \\(c\\) входила бы синяя стрелка из выбранной, то по транзитивности она входила бы и в \\(a\\), чего нет. По выбору \\(c\\) в неё не входит нужная синяя стрелка из исходной вершины. Значит, все входящие в \\(c\\) синие стрелки идут только из хороших, и \\(c\\) была добавлена в выбранные; тогда \\(c\\to a\\) синяя, противоречие.\n\nПовторяем две операции: убираем в хорошие концы красных стрелок между выбранными, затем добавляем из исходных вершины, в которые синие стрелки приходят только из хороших. Каждый раз, когда вторая операция непуста, число исходных вершин уменьшается. Так как \\(A\\) конечно, наступит момент, когда после удаления красных конфликтов добавить из исходных уже нечего.\n\nДокажем, что в этот момент каждая исходная вершина покрыта синей стрелкой из выбранных. Предположим противное и возьмём исходную вершину \\(a\\), в которую не идёт синяя стрелка из выбранных. Из построения до последнего удаления красных конфликтов каждая исходная вершина была покрыта синей стрелкой из тогдашних выбранных; значит, теперь вершина \\(a\\) покрывается синей стрелкой хотя бы из хорошей вершины или из исходной вершины, которая сама ведёт синей стрелкой к \\(a\\). Рассмотрим среди исходных вершин, из которых по синей стрелке можно попасть в \\(a\\), такую вершину \\(c\\), в которую не входит синяя стрелка из другой исходной вершины с тем же свойством; она существует по конечности. В \\(c\\) не входит синяя стрелка из выбранной вершины, иначе по транзитивности выбранная вершина посылала бы синюю стрелку в \\(a\\). По выбору \\(c\\) в неё не входит и синяя стрелка из исходной вершины. Следовательно, все входящие в \\(c\\) синие стрелки идут только из хороших вершин, и \\(c\\) должна была быть добавлена в выбранные на последнем шаге. Противоречие.\n\nИтак, в момент остановки выбранные вершины попарно не соединены ни синими, ни красными стрелками; каждая исходная вершина получает синюю стрелку из выбранных; каждая хорошая вершина получает красную стрелку из выбранных. Берём \\(B\\) равным множеству выбранных вершин. Для самой выбранной вершины \\(a\\in B\\) можно взять \\(b=a\\), потому что \\(a\\) делится на \\(a\\). Для исходных и хороших вершин покрывающая стрелка даёт соответственно одно из двух условий задачи. Поэтому найденное множество \\(B\\) удовлетворяет всем требованиям.",
