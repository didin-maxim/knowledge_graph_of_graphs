  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Official solution, compressed",
      "text": "В официальном решении рассматривается двуцветный ориентированный граф на множестве A. Из вершины b в вершину a проводится синяя стрелка, если b делится на a, и красная стрелка, если a+1 делится на b+1. Нужно выбрать независимое множество вершин B, из которого в каждую вершину A\\\\B ведет хотя бы одна стрелка. Далее вершины делят на три группы: исходные, выбранные и хорошие. Сначала в выбранные помещают вершины, в которые не входит ни одна синяя стрелка; тогда по транзитивности синих стрелок каждая оставшаяся исходная вершина получает синюю стрелку из выбранной. Если внутри выбранных есть красные стрелки, их концы переносят в хорошие. Затем в выбранные добавляют исходные вершины, в которые синие стрелки приходят только из хороших вершин, и снова убирают в хорошие концы красных стрелок между выбранными. Из-за транзитивности синего и красного отношений процесс заканчивается, когда множество исходных вершин перестает уменьшаться. В этот момент между выбранными нет запрещенных стрелок нужного типа, а каждая невыбранная вершина покрывается стрелкой из выбранной, что и дает требуемое множество B.",
