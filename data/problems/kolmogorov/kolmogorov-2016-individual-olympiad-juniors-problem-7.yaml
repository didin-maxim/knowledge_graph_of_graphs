        "title": "Оригинальная формулировка",
        "text": "Для любого конечного множества A натуральных чисел требуется выбрать подмножество B со свойствами: для любых различных b1, b2 из B ни одно из чисел b1, b2 не делится на другое, и ни одно из чисел b1+1, b2+1 не делится на другое; кроме того, для каждого a из A найдется b из B такое, что либо b делится на a, либо a+1 делится на b+1.",
