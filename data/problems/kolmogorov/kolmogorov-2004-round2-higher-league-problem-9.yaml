  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Официальное решение, сжатое изложение",
      "text": "Официальное решение идет от противного. Предполагается, что для некоторой длины `m`\nлюбая арифметическая прогрессия этой длины содержит хотя бы одно ребро графа.\n\nТогда, рассматривая графы `G_n` на первых `n` числах и подсчитывая число прогрессий,\nавторы показывают, что в таком случае для любого `k` в графе должен возникать полный\nдвудольный подграф `K_{k,k}`. Идея состоит в последовательном уплотнении множества ребер:\nесли прогрессий слишком много и каждая содержит ребро, то найдутся большие наборы вершин\nс одинаковыми соседями.\n\nНо уже `K_{2,2}` содержит 4-цикл, что противоречит условию. Следовательно, найдется\nарифметическая прогрессия длины 5 без смежных вершин.",
