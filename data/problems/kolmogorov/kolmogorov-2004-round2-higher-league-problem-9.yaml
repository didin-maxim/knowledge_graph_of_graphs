      "id": "sol-official-compressed",
      "title": "Полное решение через двойной счет прогрессий",
      "text": "Пусть `N = 10^5`, а `E` — число ребер графа. Предположим противное: каждая арифметическая прогрессия\n`a, a + d, a + 2d, a + 3d, a + 4d`, где `d >= 1` и `a + 4d <= N`, содержит хотя бы одну пару вершин,\nсоединенных ребром.\n\nСначала посчитаем такие прогрессии. Для фиксированного `d` есть `N - 4d` вариантов начала, поэтому при\n`q = floor((N - 1)/4) = 24999` их число равно\n`P = sum_{d=1}^q (N - 4d) = qN - 2q(q+1) = 1249950000`.\n\nТеперь оценим, сколько прогрессий может покрывать одно ребро. Пусть ребро соединяет вершины с номерами\n`x < y`. Если оно лежит в 5-членной прогрессии, то числа `x` и `y` занимают в ней две из пяти позиций.\nЭти позиции можно выбрать `binom(5,2) = 10` способами. После выбора позиций общий шаг прогрессии, если он\nсуществует, уже однозначно равен `(y-x)/(j-i)`, а начало тоже однозначно. Значит одно ребро содержится не\nболее чем в `10` таких прогрессиях.\n\nПо предположению каждая из `P` прогрессий содержит ребро, а каждое ребро отвечает не более чем за `10`\nпрогрессий. Следовательно,\n`E >= P/10 = 124995000`.\n\nОсталось воспользоваться запретом 4-циклов. В графе без циклов длины `4` любые две различные вершины имеют\nне более одного общего соседа: два общих соседа сразу дали бы 4-цикл. Поэтому число неупорядоченных путей\nдлины `2` не превосходит числа пар их концов:\n`sum_v binom(deg v, 2) <= binom(N,2)`.\nС другой стороны, функция `t(t-1)/2` выпукла, и при среднем значении степени `x = 2E/N` по неравенству\nЙенсена\n`sum_v binom(deg v, 2) >= N binom(x,2) = N*x*(x-1)/2`.\nЗначит `x(x-1) <= N-1 = 99999`. Отсюда `x < 317`, поскольку `317*316 > 99999`, и потому\n`E = Nx/2 < 100000*317/2 = 15850000`.\n\nПолучили одновременно `E >= 124995000` и `E < 15850000`, что невозможно. Противоречие доказывает, что\nсуществует 5-членная арифметическая прогрессия, внутри которой нет ни одного ребра графа.",
