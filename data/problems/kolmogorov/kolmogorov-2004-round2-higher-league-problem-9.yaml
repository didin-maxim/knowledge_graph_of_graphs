        "title": "Оригинальная формулировка",
        "text": "Вершины графа занумерованы натуральными числами от `1` до `10^5`, причем каждое число\nвстречается ровно один раз. Известно, что в этом графе нет циклов длины 4.\n\nДокажите, что существует арифметическая прогрессия из пяти натуральных чисел, не\nпревосходящих `10^5`, такая, что никакие две вершины с номерами из этой прогрессии\nне соединены ребром.",
