  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Official solution, compressed",
      "text": "Официальное решение переводит условие в язык ориентированных графов:\nгорода становятся вершинами, дороги - дугами. Получаем сильно связный орграф, в котором\nудаление любой дуги разрушает сильную связность.\n\nСначала строится пример с 197 дорогами: берутся вершины `A`, `B`, `C_1, ..., C_98` и\nнаправленные треугольники `A -> C_i -> B -> A` для всех `i`. Такой орграф сильно связен,\nа каждая дуга в нем существенна.\n\nДля оценки сверху доказывается лемма: если сильно связный орграф на `k` вершинах имеет\nхотя бы `2k-1` дуг, то одну дугу можно удалить без потери сильной связности. После этого\nрассматривается минимальный ориентированный цикл и производится сжатие/склейка его вершин,\nчто уменьшает число вершин и позволяет применить лемму к меньшему орграфу. Из этого\nвыводится верхняя граница `197`.\n\nСледовательно, максимальное число дорог равно `197`.",
