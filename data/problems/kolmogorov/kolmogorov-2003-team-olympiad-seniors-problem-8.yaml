  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Официальное решение, развернутое изложение",
      "text": "Переведем условие на язык ориентированных графов. Города будем считать вершинами, а дороги - дугами. Так как любые два города соединены не более чем одной дорогой, между двумя вершинами нет ни параллельных дуг, ни двух противоположно направленных дуг. Условие достижимости означает, что граф сильно связен, а условие про закрытие любой дороги означает, что после удаления любой дуги сильная связность исчезает. Иными словами, перед нами минимальный по дугам сильно связный ориентированный граф на `100` вершинах.\n\nПостроим пример. Возьмем вершины `A`, `B`, `C_1, ..., C_98` и проведем дуги\n`A -> C_i`, `C_i -> B` для всех `i = 1, ..., 98`, а также одну дугу `B -> A`. Всего дуг\n`98 + 98 + 1 = 197`. Из любой вершины можно добраться до любой другой: из `A` попадаем в любой `C_i`, затем в `B`, из `B` попадаем в `A`, а из `C_i` путь идет через `B` и `A`. Каждая дуга существенна: без дуги `A -> C_i` нельзя попасть из `A` в `C_i`, без дуги `C_i -> B` нельзя выйти из `C_i`, а без дуги `B -> A` нельзя попасть из `B` в `A`. Значит, `197` дорог достижимы.\n\nДокажем, что больше быть не может. Пусть `G` - любой минимальный сильно связный ориентированный граф без противоположных пар дуг, имеющий `n` вершин и `m` дуг. Докажем оценку `m <= 2n - 3`.\n\nСначала выберем в `G` какой-нибудь ориентированный цикл `C` длины `k`. Так как противоположных пар дуг нет, `k >= 3`. Будем строить сильно связный подграф `H`. Сначала положим `H = C`. Если `H` содержит еще не все вершины графа, то из сильной связности `G` найдется путь из вершины `H` в вершину вне `H` и затем путь обратно в `H`. На объединении этих двух путей есть направленный путь, который начинается в `H`, заканчивается в `H`, а все его внутренние вершины лежат вне `H`: берем первый момент выхода из `H` и первый последующий момент возвращения в `H`. Добавим этот путь к `H`. После добавления сильная связность сохраняется: старые вершины уже были взаимно достижимы внутри `H`, до новых внутренних вершин можно дойти от начальной вершины добавленного пути, а из них можно продолжить путь до его конечной вершины и вернуться в старую часть.\n\nКаждый такой добавленный путь имеет длину не меньше `2`, потому что содержит хотя бы одну новую внутреннюю вершину. Если он имеет `l` дуг, то он добавляет ровно `l - 1` новых вершин. Продолжаем процесс, пока все `n` вершин не окажутся в `H`. Пусть добавлено `t` таких путей. Тогда\n`n = k + sum(l_j - 1)`, поэтому `t <= sum(l_j - 1) = n - k`. Число дуг в построенном подграфе равно\n`k + sum l_j = k + sum(l_j - 1) + t = n + t <= n + (n - k) = 2n - k <= 2n - 3`.\n\nОсталось заметить, что этот подграф на всех вершинах на самом деле совпадает с `G` по дугам. Если бы в `G` была дуга, не вошедшая в `H`, то после ее удаления подграф `H` все равно оставался бы сильно связным на всех вершинах. Значит, и весь граф без этой дуги оставался бы сильно связным, что противоречит существенности каждой дуги. Следовательно, `m` равно числу дуг в `H`, и потому `m <= 2n - 3`.\n\nПри `n = 100` получаем `m <= 2 * 100 - 3 = 197`. Построенный выше пример имеет ровно `197` дуг, поэтому максимальное возможное число дорог равно `197`.",
