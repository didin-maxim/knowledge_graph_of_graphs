        "title": "Оригинальная формулировка",
        "text": "В стране 100 городов некоторые пары городов соединены дорогой с односторонним движением.\nИз любого города можно доехать до любого другого, но после закрытия любой одной дороги\nэто свойство нарушается. Любые два города соединены не более чем одной дорогой.\n\nНайдите наибольшее возможное число дорог.",
