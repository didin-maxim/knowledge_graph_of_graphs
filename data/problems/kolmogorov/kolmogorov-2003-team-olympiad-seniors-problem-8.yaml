  "ideas": [
    {
      "id": "idea-graph-role",
      "title": "Graph-theory role in kolmogorov-2003-team-olympiad-seniors-problem-8",
      "text": "Граф явно присутствует в условии через ориентированную дорожную сеть, а официальное решение\nцеликом сформулировано как утверждение о сильно связном орграфе и его дугах.",
