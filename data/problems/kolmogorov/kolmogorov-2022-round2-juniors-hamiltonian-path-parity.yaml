        "title": "Оригинальная формулировка",
        "text": "Каждое ребро полного графа на 100 вершинах окрашено в красный или синий цвет. Простой путь называется гамильтоновым, если он проходит через каждую вершину ровно один раз. Пусть \\(a\\) — число гамильтоновых путей, использующих только красные рёбра, а \\(b\\) — число гамильтоновых путей, использующих только синие рёбра. Докажите, что \\(a-b\\) делится на 4.",
