  "solutions": [
    {
      "id": "sol-official-restored",
      "title": "Помеченные синие цепочки",
      "text": "Так как каждый путь можно пройти в двух направлениях, то \\(a\\) и \\(b\\) — чётны. Обозначим через \\(A\\) и \\(B\\) количество красных и синих гамильтоновых путей в предположении, что пути, проходящие по одному и тому же набору рёбер, но в обратном порядке, мы считаем совпадающими. Тогда обозначим \\(2A=a\\), \\(2B=b\\) и покажем, \\(A-B\\) — чётно.\n\nНазовём помеченным гамильтоновым путём гамильтонов путь, некоторые (возможно, ни одно) синие рёбра которого являются помеченными. Обозначим через \\(V\\) общее количество помеченных гамильтоновых путей.\n\nОбозначим через \\(G_i\\) множество гамильтоновых путей, содержащих ровно \\(i\\) синих рёбер. Тогда для любого пути \\(g\\in G_i\\) мы можем \\(2^i\\) способами пометить несколько синих рёбер и получить помеченный гамильтонов путь. А так как каждый помеченный гамильтонов путь таким образом мы получим ровно один раз, то верно равенство \\(|G_0|+2|G_1|+\\ldots + 2^{99} |G_{99}|=V\\). Отсюда следует, что \\(|G_0|-V=A-V\\) — чётно.\n\nЕсли в гамильтоновом пути пометить несколько синих рёбер, то они будут образовывать несколько цепочек. Теперь будем действовать наоборот: пометим несколько цепочек синих рёбер и поймём, сколько существует гамильтоновых путей, через них проходящих.\n\nПусть после пометок синих рёбер образовалось \\(n\\) компонент связности, и из них \\(m\\) состоят хотя бы из двух вершин. Тогда, чтобы получить гамильтонов путь, мы должны упорядочить компоненты связности (\\(n!\\) способов), выбрать, в каком направлении мы проходим каждую из цепочек (\\(2^m\\) способов) и разделить на 2, так как каждый гамильтонов путь мы подсчитаем дважды.\nТаким образом, обозначив через \\(H_{n,m}\\) количество способов пометить \\(m\\) синих цепочек так, чтобы образовалось \\(n\\) компонент связности, мы получаем равенство\n\\[\n\\sum_{m\\leq n} 2^{m-1} n! H_{n,m} = V.\n\\]\n(В этом суммировании \\(m\\) пробегает от 0 до 100, а \\(n\\) от 1 до 100.)\n\nТак как число \\(2^{m-1} n!\\) является нечётным только при \\(m=n=1\\), то мы получаем, что  \\(H_{1,1}-V=B-V\\) — чётно. А раз \\(A-V\\) и \\(B-V\\) — чётны, то и \\(A-B\\) — чётно.",
