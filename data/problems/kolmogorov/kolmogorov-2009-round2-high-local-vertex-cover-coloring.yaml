  "solutions": [
    {
      "id": "sol-corrected-size-assumption",
      "title": "Полное решение исправленной формулировки",
      "text": "Сначала перепишем условие на языке независимых множеств. В множестве \\(S\\) из \\(2d+2\\) вершин выбранные \\(d\\) вершин покрывают все рёбра тогда и только тогда, когда остальные \\(d+2\\) вершин попарно несмежны. Значит, каждый индуцированный подграф на \\(2d+2\\) вершинах содержит независимое множество размера \\(d+2\\).\n\nНам понадобится лемма Дольникова в чуть расширенной форме. Пусть \\(H\\) — граф на \\(q\\le 2m-1\\) вершинах, и после удаления любой вершины в оставшемся графе есть независимое множество размера \\(m\\). Тогда в \\(H\\) есть независимое множество размера \\(m+1\\). Достаточно доказать случай \\(q=2m-1\\): если \\(q<2m-1\\), добавим к \\(H\\) новые вершины, смежные со всеми старыми вершинами и друг с другом, пока всего не станет \\(2m-1\\) вершин. Условие после удаления вершины сохранится, а независимое множество размера \\(m+1\\) в расширенном графе не может содержать новую вершину, потому что новая вершина смежна со всеми остальными.\n\nДокажем теперь случай \\(q=2m-1\\). Предположим противное и возьмем контрпример с минимальным \\(m\\). В нем есть независимое множество \\(X\\) размера \\(m\\); остальные вершины обозначим \\(Y\\), тогда \\(|Y|=m-1\\). Если бы для любого \\(A\\subseteq Y\\) выполнялось \\(|N_X(A)|\\ge |A|\\), то по теореме Холла вершины \\(Y\\) можно было бы сопоставить различным соседям из \\(X\\). Удалим единственную несопоставленную вершину из \\(X\\). В оставшемся графе из каждой сопоставленной смежной пары можно взять в независимое множество не более одной вершины, значит независимое множество имело бы размер не больше \\(m-1\\), противоречие. Поэтому существует множество \\(A\\subseteq Y\\), для которого \\(|A|>|N_X(A)|\\); выберем такое \\(A\\) максимальным по включению и положим \\(|A|=a\\).\n\nИз максимальности \\(A\\) следует, что для каждого \\(C\\subseteq Y\\setminus A\\) выполнено \\(|N_{X\\setminus N_X(A)}(C)|\\ge |C|\\), иначе \\(A\\cup C\\) тоже было бы плохим. По Холлу вершины \\(Y\\setminus A\\) можно сопоставить их различным соседям в \\(X\\setminus N_X(A)\\). Пусть \\(B\\) — несопоставленные вершины из \\(X\\). Тогда \\(|B|=a+1\\), причем \\(N_X(A)\\subseteq B\\). Вне \\(A\\cup B\\) осталось ровно \\(m-a-1\\) сопоставленных смежных пар. После удаления любой вершины из \\(A\\cup B\\) независимое множество размера \\(m\\), существующее по условию леммы, вынуждено брать внутри \\(A\\cup B\\) не меньше \\(a+1\\) вершин. Значит, в графе на \\(A\\cup B\\), где \\(|A\\cup B|=2a+1=2(a+1)-1\\), после удаления любой вершины есть независимое множество размера \\(a+1\\). Если \\(a+1<m\\), минимальность \\(m\\) дает в \\(A\\cup B\\) независимое множество размера \\(a+2\\); добавив к нему все вершины \\(X\\setminus B\\), получаем независимое множество размера \\(m+1\\) в исходном графе. Если же \\(a+1=m\\), то \\(A=Y\\), а из \\(|A|>|N_X(A)|\\) найдется вершина \\(x\\in X\\), не смежная ни с одной вершиной из \\(Y\\); независимое множество размера \\(m\\) после удаления \\(x\\) вместе с \\(x\\) снова дает размер \\(m+1\\). Противоречие доказывает лемму.\n\nТеперь докажем индукцией по \\(|S|\\), что для каждого множества вершин \\(S\\) размера хотя бы \\(2d+2\\) в индуцированном графе \\(G[S]\\) есть независимое множество размера \\(|S|-d\\). При \\(|S|=2d+2\\) это ровно локальное условие. Пусть \\(|S|=t\\ge 2d+3\\), и утверждение уже доказано для меньших множеств. После удаления любой вершины из \\(S\\) остается \\(t-1\\) вершина, поэтому по предположению индукции там есть независимое множество размера \\(t-1-d\\). Положим \\(m=t-1-d\\). Так как \\(t\\ge 2d+3\\), имеем \\(t\\le 2m-1\\). По расширенной лемме Дольникова в \\(G[S]\\) есть независимое множество размера \\(m+1=t-d\\). Индукционный шаг доказан.\n\nПрименим это к \\(S=V(G)\\). Здесь используется добавленное в исправленной формулировке условие \\(|V(G)|\\ge 2d+2\\). Получаем независимое множество \\(I\\) размера не меньше \\(|V(G)|-d\\). Тогда дополнение \\(C=V(G)\\setminus I\\) имеет размер не больше \\(d\\) и покрывает все рёбра графа: иначе ребро с обоими концами в \\(I\\) нарушило бы независимость \\(I\\). Покрасим все вершины из \\(I\\) одним цветом, а вершины из \\(C\\) — попарно различными новыми цветами. Использовано не больше \\(d+1\\) цвета, а значит тем более не больше \\(d+2\\) цветов. Это доказывает исправленную формулировку.",
