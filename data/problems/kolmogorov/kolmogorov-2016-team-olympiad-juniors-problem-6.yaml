    {
      "id": "sol-official-compressed",
      "title": "Самодостаточное доказательство официального решения",
      "text": "Ответ: 12.\n\nПостроим вспомогательный граф G. Его вершины — вершины 2017-угольника; две разные вершины соединены ребром, если на меньшей из двух дуг между ними лежит не больше 9 других вершин. Иначе говоря, ребро соединяет вершины, расстояние между которыми по циклу не превосходит 10. Ход Васи возможен ровно вдоль ребра этого графа, если число в конечной вершине больше числа в начальной.\n\nСначала докажем, что Петя может занумеровать вершины так, чтобы Вася не посетил больше 12 вершин. Для этого достаточно правильно раскрасить G в 12 цветов, занумерованных 0,1,...,11, а затем поставить меньшие числа во все вершины цвета 0, после них — во все вершины цвета 1, и так далее до цвета 11. Так как концы каждого ребра имеют разные цвета, любой ход меняет цвет. Кроме того, при такой нумерации ход может идти только из меньшего цвета в больший: если цвет B меньше цвета A, то все числа в цвете B меньше всех чисел в цвете A. Значит, вдоль маршрута Васи цвета строго возрастают, и он может побывать не более чем в одной вершине каждого из 12 цветов.\n\nОсталось явно дать правильную 12-раскраску G. Пронумеруем вершины многоугольника по кругу числами 1,2,...,2017. Вершины с номерами от 1 до 48 покрасим в цвет, равный остатку их номера при делении на 12. Каждую вершину с номером a >= 49 покрасим в цвет, равный остатку a-4 при делении на 11; это один из цветов 0,1,...,10.\n\nПроверим, что эта раскраска правильная. Внутри блока 1,...,48 одинаковые цвета повторяются через 12 позиций, поэтому две вершины одного цвета там не могут находиться на расстоянии не больше 10 по циклу. Внутри блока 49,...,2017 одинаковые цвета повторяются через 11 позиций, поэтому и там расстояние между ближайшими одноцветными вершинами по обходу равно 11, а ребра G соединяют только расстояния не больше 10. На стыке 48|49 последние 10 цветов первого блока — это цвета вершин 39,...,48, то есть 3,4,...,11,0, а первые 10 цветов второго блока — это цвета вершин 49,...,58, то есть 1,2,...,10; совпадение возможно только с разницей не меньше 11 позиций, например 39 и 51 или 48 и 59. На стыке 2017|1 аналогично: последние цвета второго блока перед вершиной 2017 идут по модулю 11, а первые вершины 1,...,10 имеют цвета 1,...,10; ближайшие совпадения снова разделены по циклу расстоянием 11, например вершины 2016 и 10, тогда как вершина 2017 имеет цвет 0, а вершины 1,...,10 цветов 1,...,10. Значит, одноцветные вершины не соединены ребром, и верхняя оценка 12 доказана.\n\nТеперь докажем, что при любой нумерации Вася гарантированно может посетить хотя бы 12 вершин. Зафиксируем произвольную расстановку чисел. Для каждой вершины v обозначим через L(v) максимальное число вершин в возрастающей цепочке ходов, которую Вася может пройти, начав с v. Это число определено, потому что при каждом ходе номер строго увеличивается, значит, циклов ходов быть не может.\n\nЕсли две вершины A и B соединены ребром в G, то L(A) и L(B) различны. Действительно, числа в A и B различны. Если число в B больше числа в A, то Вася может сходить из A в B, а затем пройти максимальную цепочку из B, поэтому L(A) >= L(B)+1. Если же число в A больше числа в B, то тем же рассуждением L(B) >= L(A)+1. В обоих случаях равенство L(A)=L(B) невозможно. Следовательно, значения L задают правильную раскраску графа G: соседние вершины получают разные значения.\n\nПредположим противное: все L(v) не больше 11. Тогда среди 2017 вершин найдется не меньше ceil(2017/11)=184 вершин с одним и тем же значением L. Никакие две из них не соединены ребром G. Но в цикле из 2017 вершин нельзя выбрать 184 вершины так, чтобы любые две выбранные были на циклическом расстоянии хотя бы 11. В самом деле, если идти по кругу от каждой выбранной вершины к следующей выбранной, то каждый из 184 промежутков должен содержать не меньше 11 ребер; сумма промежутков была бы не меньше 184*11=2024, что больше 2017. Противоречие.\n\nЗначит, для некоторой вершины L(v) >= 12. Вася ставит фишку в эту вершину и проходит соответствующую возрастающую цепочку, посещая не меньше 12 вершин. Вместе с построенной Петей нумерацией, ограничивающей любой маршрут 12 вершинами, получаем точный ответ 12.",
