      "id": "sol-official-compressed",
      "title": "Официальное решение, сжатое изложение",
      "text": "Ответ: 12. В официальном решении для верхней оценки вводится граф G на вершинах 2017-угольника: две вершины соединяются ребром, если между ними не больше 9 промежуточных вершин. Затем показывается, что этот граф можно правильно раскрасить в 12 цветов, и Петя может расставить числа по цветам так, чтобы Вася никогда не возвращался к меньшему цвету; значит, он посетит не более 12 вершин. Для нижней оценки каждой вершине сопоставляют максимальную длину возрастающей цепочки, начинающейся в ней. Соседние в графе вершины не могут получить одно и то же значение, иначе из одной цепочки можно было бы удлинить другую. Если бы все значения были не больше 11, по принципу Дирихле нашлись бы две близкие вершины с одинаковым значением, что невозможно. Значит, существует вершина, из которой достижима цепочка длины не меньше 12.",
