        "title": "Оригинальная формулировка",
        "text": "Петя как-то занумеровал вершины правильного 2017-угольника числами от 1 до 2017. Вася первым ходом ставит фишку в какую-то из вершин. Каждым последующим ходом он может передвинуть фишку из вершины A в вершину B, если между ними не больше 9 других вершин и число в B больше числа в A. Какое наибольшее количество вершин гарантированно сможет посетить Вася, как бы Петя ни нумеровал вершины?",
