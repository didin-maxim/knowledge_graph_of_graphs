        "title": "Оригинальная формулировка",
        "text": "Петя занумеровал вершины правильного 2017-угольника числами от 1 до 2017. Вася сначала ставит фишку в одну из вершин. После этого он может ходить из вершины A в вершину B, если между ними в многоугольнике не больше 9 других вершин и число в B больше числа в A. Требуется найти наибольшее количество вершин, которое Вася гарантированно сможет посетить при любой нумерации.",
