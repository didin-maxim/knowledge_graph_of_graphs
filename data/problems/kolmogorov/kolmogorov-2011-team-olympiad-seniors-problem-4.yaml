        "title": "Оригинальная формулировка",
        "text": "Поверхность куба `11 x 11 x 11` разбита на клетки `1 x 1`. Муравей бегает по диагоналям клеток, нигде не поворачивая назад. Он не может бывать внутри одной клетки более одного раза, но может несколько раз проходить одну вершину.\n\nМожет ли он посетить центры `720` клеток?",
