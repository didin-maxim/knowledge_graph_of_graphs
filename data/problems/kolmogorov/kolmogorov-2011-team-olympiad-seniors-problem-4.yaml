      "id": "sol-official-compressed",
      "title": "Полное решение",
      "text": "Ответ: нет.\n\nПокрасим все вершины клеточной поверхности куба в шахматном порядке. Каждая диагональ клетки соединяет две вершины одного цвета. Поэтому, начав движение по диагонали с концами некоторого цвета, муравей дальше всегда остается в графе этого же цвета: вершины графа — вершины клеток выбранного цвета, а ребра — диагонали клеток с концами этого цвета. Каждое ребро такого графа соответствует ровно одной клетке, и проход по нему означает посещение центра этой клетки.\n\nРассмотрим, например, граф белых вершин; для черного графа рассуждение такое же. В нем `6 * 11^2 = 726` ребер, по одному на каждую клетку поверхности. Все вершины, кроме углов куба выбранного цвета, имеют четную степень `4`, а четыре угла выбранного цвета имеют степень `3`: у обычной вершины сходятся четыре клетки поверхности, а у угла куба — три.\n\nПусть муравей выбрал маршрут максимальной возможной длины в этом графе. Это маршрут без повторения ребер, потому что одну и ту же клетку нельзя пересекать дважды. Если один из концов максимального маршрута не является углом куба, то степень этой вершины во всем графе четна, а в уже пройденных ребрах она нечетна. Значит, из нее выходит хотя бы одно еще не использованное ребро, по которому маршрут можно было бы продолжить, противоречие максимальности. Замкнутый максимальный маршрут тоже невозможен, если он не использует все ребра: так как весь цветовой граф связен, от какой-то вершины маршрута выходило бы неиспользованное ребро, и, начав запись замкнутого маршрута с этой вершины, мы снова продолжили бы его. Следовательно, максимальный маршрут имеет два различных конца, и оба они являются углами куба выбранного цвета.\n\nСотрем все ребра максимального маршрута. В оставшемся графе нечетными будут ровно два других угла куба выбранного цвета: у двух концов маршрута нечетность степени изменилась, а у остальных вершин — нет. Эти две нечетные вершины лежат в одной компоненте связности оставшегося графа, поскольку в каждой компоненте число нечетных вершин четно. Поэтому в оставшемся графе есть путь между этими двумя углами.\n\nЛюбые два угла куба одного цвета отличаются по двум координатам на `11`; в частности, хотя бы одна координата должна измениться на `11`. За один ход по диагонали клетки каждая координата меняется не более чем на `1`, значит, любой путь между такими углами содержит не менее `11` ребер. Все эти ребра остались неиспользованными максимальным маршрутом, то есть не менее `11` центров клеток не посещены.\n\nВсего на поверхности `6 * 11^2 = 726` клеток. Следовательно, муравей может посетить не более `726 - 11 = 715` центров клеток. Число `720` больше `715`, поэтому посетить центры `720` клеток невозможно.",
