      "id": "idea-graph-role",
      "title": "Графовая роль",
      "text": "Хотя в условии граф не назван напрямую, официальное решение существенно строит граф белых вершин, анализирует степени вершин, компоненты связности и пути в этом графе. Без этой графовой конструкции решение не работает.",
