  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Официальное решение, сжатое изложение",
      "text": "Ответ: нет.\n\nВ официальном решении вершины клеток красят в шахматном порядке. Тогда каждая диагональ соединяет две вершины одного цвета, и весь маршрут муравья можно рассматривать внутри графа белых вершин, где диагонали клеток становятся ребрами.\n\nРассматривают максимальный маршрут муравья и стирают все использованные им ребра. В оставшемся белом графе по крайней мере у двух белых вершин остается нечетная степень, причем две такие вершины лежат в одной компоненте связности. Соединяющий их путь в этой компоненте имеет длину не менее `11`, значит, остается как минимум `11` непосещенных центров клеток.\n\nСледовательно, муравей может посетить не более `6(11^2) - 11 = 715` центров клеток, и число `720` недостижимо.",
