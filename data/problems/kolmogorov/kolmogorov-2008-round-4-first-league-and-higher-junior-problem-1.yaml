  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Решение через сумму степеней красных вершин",
      "text": "Если дерево состоит из одной вершины, утверждение очевидно в принятом для этой задачи смысле: единственная вершина красная и является концевой. Далее считаем, что в дереве хотя бы две вершины.\n\nОбозначим через `R` число красных вершин, а через `B` число синих вершин. По условию `R>=B`. Так как смежные вершины имеют разные цвета, каждое ребро дерева имеет один красный и один синий конец. Поэтому сумма степеней всех красных вершин равна числу рёбер дерева.\n\nВ дереве на `R+B` вершинах ровно `R+B-1` рёбер. Значит, сумма степеней красных вершин равна `R+B-1`.\n\nПредположим, что красной висячей вершины нет. В нетривиальном дереве изолированных вершин нет, поэтому каждая красная вершина имеет степень хотя бы `2`. Тогда сумма степеней красных вершин не меньше `2R`.\n\nС другой стороны, из `R>=B` следует `R+B-1<=2R-1`. Получаем цепочку `2R<=R+B-1<=2R-1`, невозможную для целых чисел. Противоречие доказывает, что в дереве обязательно есть висячая вершина, покрашенная в красный цвет.",
