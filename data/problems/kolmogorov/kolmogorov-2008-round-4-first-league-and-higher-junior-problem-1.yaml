      "id": "sol-official-compressed",
      "title": "Решение через сумму степеней",
      "text": "Рассмотрим дерево как двудольный граф по данной раскраске вершин. Пусть, вопреки утверждению, каждая красная вершина имеет степень не меньше 2. Тогда сумма степеней красных вершин не меньше `2R`, где `R` — число красных вершин.\n\nКаждое ребро дерева соединяет вершины разных цветов, поэтому сумма степеней красных вершин равна числу ребер. Если `B` — число синих вершин, то в дереве всего `R+B-1` ребер. Значит, `2R <= R+B-1`, откуда `R <= B-1`, что противоречит условию `R >= B`.\n\nСледовательно, среди красных вершин обязательно есть лист.",
