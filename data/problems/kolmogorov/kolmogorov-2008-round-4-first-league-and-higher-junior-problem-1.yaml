  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Официальное решение, сжатое изложение",
      "text": "В официальном решении дерево рассматривают как двудольный граф по раскраске вершин. Пусть, вопреки утверждению, каждый красный вершина имеет степень не меньше 2. Тогда сумма степеней красных вершин не меньше удвоенного числа красных вершин.\n\nНо в двудольном графе сумма степеней красных вершин равна сумме степеней синих, а в дереве она равна числу ребер, то есть `R + B - 1`, где `R` и `B` — числа красных и синих вершин. Из предположения `R >= B` и неравенства для степеней получается противоречие.\n\nСледовательно, среди красных вершин обязательно есть лист.",
