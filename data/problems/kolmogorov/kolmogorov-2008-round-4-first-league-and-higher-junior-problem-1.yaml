      "id": "idea-red-part-degree-sum",
      "title": "Сумма степеней красной доли равна числу рёбер дерева",
      "text": "Так как смежные вершины имеют разные цвета, каждое ребро имеет ровно один красный конец. Поэтому сумма степеней красных вершин равна числу всех рёбер дерева. Если красных листьев нет, эта же сумма должна быть не меньше удвоенного числа красных вершин, что противоречит условию R>=B.",
