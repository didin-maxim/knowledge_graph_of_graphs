      "title": "Набросок, требующий сверки условия",
      "text": "Решение пока не найдено в проверяемом виде.\n\nСтарый набросок доказывал утверждение при дополнительном условии, что каждое ребро дерева соединяет вершины разных цветов. Тогда дерево действительно является двудольным с красной и синей долями: если красных вершин `R`, синих `B` и красных листьев нет, то сумма степеней красных вершин не меньше `2R`. С другой стороны, эта сумма равна числу ребер дерева, то есть `R+B-1`, и из `R >= B` получается противоречие `2R <= R+B-1 <= 2R-1`.\n\nОднако в текущей формулировке карточки не сказано, что соседние вершины имеют разные цвета. Без этой фразы приведенный подсчет неприменим, а сама формулировка требует сверки с официальным источником.",
