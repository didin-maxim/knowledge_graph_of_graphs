    {
      "id": "sol-ai-longest-chain-counting",
      "title": "ИИ-решение: стратегия первого через длинную цепочку",
      "text": "Выигрывает первый игрок.\n\nБудем называть цепочкой ориентированный путь \\(v_1\\to v_2\\to\\cdots\\to v_k\\), составленный из уже ориентированных ребер. Если второй игрок когда-либо сам создал ориентированный цикл, то этот цикл останется до конца игры и первый уже выигрывает. Поэтому дальше считаем, что после ходов второго ориентированных циклов нет.\n\nСначала докажем лемму: после хода второго, если самая длинная цепочка имеет меньше 2014 вершин, первый может одним ходом получить более длинную цепочку. Пусть \\(v_1\\to v_2\\to\\cdots\\to v_k\\) — одна из самых длинных цепочек, и пусть \\(a\\) — вершина вне нее. Если ребро между \\(a\\) и \\(v_1\\) еще не ориентировано, первый направляет его как \\(a\\to v_1\\) и удлиняет цепочку слева; если оно уже направлено \\(a\\to v_1\\), такая более длинная цепочка уже была бы. Значит, когда удлинить слева нельзя, обязательно стоит стрелка \\(v_1\\to a\\). Аналогично, когда удлинить справа нельзя, ребро между \\(a\\) и \\(v_k\\) обязательно направлено как \\(a\\to v_k\\).\n\nРассмотрим индексы \\(i\\), для которых ребро между \\(v_i\\) и \\(a\\) не направлено из \\(a\\) в \\(v_i\\). Такой индекс есть, потому что \\(v_1\\to a\\), а \\(i=k\\) не подходит, потому что \\(a\\to v_k\\). Возьмем наибольший такой индекс \\(i\\). Тогда ребро между \\(a\\) и \\(v_{i+1}\\) уже направлено как \\(a\\to v_{i+1}\\). Если бы ребро между \\(v_i\\) и \\(a\\) уже было направлено как \\(v_i\\to a\\), цепочка \\(v_1\\to\\cdots\\to v_i\\to a\\to v_{i+1}\\to\\cdots\\to v_k\\) уже была бы длиннее исходной. Значит, это ребро еще свободно, и первый направляет его как \\(v_i\\to a\\), вставляя \\(a\\) в цепочку. Лемма доказана.\n\nИз леммы следует индукцией, что после 2002-го хода первого существует цепочка хотя бы на 2003 вершинах. Пусть после ответного хода второго такая цепочка равна \\(v_1\\to v_2\\to\\cdots\\to v_{2003}\\) или длиннее. Если между двумя ее вершинами \\(v_i\\) и \\(v_j\\), где \\(i<j\\), осталось неориентированное ребро, то на следующем ходу первый направит его как \\(v_j\\to v_i\\) и получит ориентированный цикл\n\\(v_i\\to v_{i+1}\\to\\cdots\\to v_j\\to v_i\\).\n\nЗначит, чтобы еще не проиграть, второй к этому моменту должен был добиться, что все ребра между выбранными 2003 вершинами уже ориентированы. Таких ребер \\(\\binom{2003}{2}=2005003\\). Но за первые 2002 раунда всего могло быть ориентировано не более\n\\(2002+1000\\cdot2002=2004002\\) ребер: 2002 ребра первым игроком и не более 1000 ребер после каждого из 2002 ходов вторым. Это меньше, чем \\(2005003\\). Следовательно, среди вершин цепочки остается свободная хорда, и следующим ходом первый замыкает ориентированный цикл. Поэтому при правильной игре выигрывает первый игрок.",
