      "id": "sol-official-compressed",
      "title": "Самодостаточное доказательство через препятствие к эйлерову обходу",
      "text": "Пусть `c` — город Центральный, а `H` — граф, образованный всеми дорогами, не инцидентными `c`. Так как во всем дорожном графе есть эйлеров цикл, этот граф связен, и степень каждой его вершины четна. Условие, что любой циклический маршрут проходит через `c`, эквивалентно тому, что `H` не содержит циклов, то есть является лесом.\n\nСначала предположим, что `H` содержит цикл `Z`. Удалим ребра `Z`. В оставшемся графе все степени по-прежнему четны, а компонента, содержащая `c`, имеет эйлеров цикл, проходящий ровно по ее ребрам. Если турист сначала пройдет именно этот цикл, он вернется в `c`, но все неиспользованные ребра лежат вне текущей компоненты после удаления `Z`; в частности, из `c` уже нельзя попасть к ребрам цикла `Z` по неиспользованной дороге. Такой маршрут нельзя продолжить до полного эйлерова обхода исходного графа. Значит, требуемое свойство нарушается всякий раз, когда есть цикл, не проходящий через `c`.\n\nТеперь предположим, что `H` — лес. Рассмотрим любой маршрут `P`, который начинается в `c` и не проходит ни по одной дороге дважды. Пусть `x` — его текущий конец; удалим ребра `P` из исходного графа. В неиспользованном графе каждая вершина, кроме, возможно, `c` и `x`, имеет четную степень; если `x` не совпадает с `c`, то `c` и `x` — две вершины нечетной степени, а если `x = c`, то все неиспользованные степени четны.\n\nВозьмем любую связную компоненту неиспользованных ребер, не содержащую `x`. Если она содержит `c`, то обязательно `x != c`, и в этой компоненте ровно одна вершина нечетной степени, что невозможно по лемме о рукопожатиях. Значит, такая компонента не содержит `c`. Тогда все ее вершины имеют четную неиспользованную степень, а сама она является непустым подграфом леса `H`, если в ней есть хоть одно ребро. Но всякий непустой лес содержит вершину степени 1 в этой компоненте, противоречие четности всех степеней. Следовательно, компонента не может содержать ребер.\n\nЗначит, каждое неиспользованное ребро лежит в компоненте, содержащей текущий конец `x`. Если неиспользованные ребра еще остались, то у `x` положительная неиспользованная степень, и маршрут можно продолжить на одно неиспользованное ребро. Повторяя это, турист продолжает исходный маршрут, пока неиспользованных ребер не останется. Итоговый маршрут является эйлеровым циклом. Следовательно, любой начальный маршрут из `c` можно продолжить тогда и только тогда, когда каждый цикл дорожного графа проходит через `c`.",
