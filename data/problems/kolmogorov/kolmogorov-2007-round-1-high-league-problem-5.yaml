  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Официальное решение, сжатое изложение",
      "text": "Официальное решение сразу переводит задачу на язык графов. Граф дорог эйлеров: он связен и все степени его вершин четны.\n\nТребуется доказать, что любой путь, начинающийся в вершине `Центральный`, продолжается до эйлерова цикла тогда и только тогда, когда подграф, образованный ребрами, не проходящими через `Центральный`, является лесом.\n\nЕсли в периферийной части есть цикл, его можно удалить и обойти только оставшуюся эйлерову компоненту с центральной вершиной, после чего удаленный цикл останется необойденным. Если же периферийный подграф ацикличен, то после любого начального пути необойденные периферийные ребра образуют лес с четными степенями, а значит пусты.\n\nОтсюда и получается эквивалентность из условия.",
