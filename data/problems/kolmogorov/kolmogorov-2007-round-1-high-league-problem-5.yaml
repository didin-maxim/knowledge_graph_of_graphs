      "id": "sol-official-compressed",
      "title": "Self-contained Euler-tour obstruction proof",
      "text": "Let c be the Central city and let H be the graph formed by all roads not incident with c. Since the whole road graph has an Eulerian circuit, it is connected and every vertex has even degree.\n\nFirst suppose H contains a cycle Z. Delete the edges of Z. The remaining graph still has all degrees even, and the component containing c has an Eulerian circuit using exactly its edges. That circuit avoids every edge of Z, so a traveler who chooses that circuit first cannot be forced to complete an Eulerian tour of the original graph. Hence the required property fails whenever there is a cycle avoiding c.\n\nNow suppose H is a forest. Consider any trail P that starts at c and uses no road twice. Let x be its current endpoint, and remove the edges of P from the original graph. In the unused graph, every vertex except possibly c and x has even degree; if x is not c, then c and x are the two odd-degree vertices, and if x is c then every unused degree is even.\n\nTake any connected component of unused edges that does not contain x. If it contains c while x is not c, then it has exactly one odd-degree vertex, impossible by the handshaking lemma. Otherwise all its vertices have even unused degree. In either case, such a component cannot contain an edge: because it is a subgraph of the forest H unless it contains c, and after removing c-free peripheral edges every nonempty forest has a vertex of degree 1. The same leaf-degree contradiction applies to every c-free component with all degrees even.\n\nThus every unused edge lies in the component containing the current endpoint x. If unused edges remain, x has positive unused degree and the trail can be extended by one unused edge. Repeating this, the traveler extends the original trail until no unused edge remains. The final trail is an Eulerian circuit. Therefore every initial trail from c can be extended exactly when every cycle of the road graph passes through c.",
