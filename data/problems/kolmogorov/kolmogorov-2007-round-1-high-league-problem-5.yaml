      "id": "sol-official-compressed",
      "title": "Самодостаточное доказательство через препятствие к эйлерову обходу",
      "text": "Пусть `c` — город Центральный, а `H` — граф, образованный всеми дорогами, не инцидентными `c`. Так как во всем дорожном графе есть эйлеров цикл, этот граф связен, и степень каждой его вершины четна.\n\nСначала предположим, что `H` содержит цикл `Z`. Удалим ребра `Z`. В оставшемся графе все степени по-прежнему четны, а компонента, содержащая `c`, имеет эйлеров цикл, проходящий ровно по ее ребрам. Этот цикл не использует ни одного ребра из `Z`, поэтому турист, сначала выбравший такой обход, не обязан завершить эйлеров обход исходного графа. Значит, требуемое свойство нарушается всякий раз, когда есть цикл, не проходящий через `c`.\n\nТеперь предположим, что `H` — лес. Рассмотрим любой маршрут `P`, который начинается в `c` и не проходит ни по одной дороге дважды. Пусть `x` — его текущий конец; удалим ребра `P` из исходного графа. В неиспользованном графе каждая вершина, кроме, возможно, `c` и `x`, имеет четную степень; если `x` не совпадает с `c`, то `c` и `x` — две вершины нечетной степени, а если `x = c`, то все неиспользованные степени четны.\n\nВозьмем любую связную компоненту неиспользованных ребер, не содержащую `x`. Если она содержит `c`, а `x` не совпадает с `c`, то в ней ровно одна вершина нечетной степени, что невозможно по лемме о рукопожатиях. В противном случае все ее вершины имеют четную неиспользованную степень. В любом случае такая компонента не может содержать ребро: если она не содержит `c`, то является подграфом леса `H`, а после удаления периферийных ребер, не связанных с `c`, в каждом непустом лесу найдется вершина степени 1. То же противоречие со степенью листа применимо к каждой компоненте без `c`, в которой все степени четны.\n\nЗначит, каждое неиспользованное ребро лежит в компоненте, содержащей текущий конец `x`. Если неиспользованные ребра еще остались, то у `x` положительная неиспользованная степень, и маршрут можно продолжить на одно неиспользованное ребро. Повторяя это, турист продолжает исходный маршрут, пока неиспользованных ребер не останется. Итоговый маршрут является эйлеровым циклом. Следовательно, любой начальный маршрут из `c` можно продолжить тогда и только тогда, когда каждый цикл дорожного графа проходит через `c`.",
