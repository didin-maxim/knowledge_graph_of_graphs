        "title": "Оригинальная формулировка",
        "text": "В стране некоторые города соединены дорогами. Известно, что существует замкнутый маршрут, проходящий по каждой дороге ровно один раз. Турист выехал из города Центральный и проехал по некоторому пути без повторения дорог. Докажите, что он всегда может продолжить путь до полного эйлерова обхода тогда и только тогда, когда любой циклический маршрут проходит через Центральный.",
