  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Self-contained exchange recoloring proof",
      "text": "Take any proper coloring `alpha` in which every color class has at least two vertices. Also take a proper coloring `beta` in exactly `k` colors; it exists because `chi(G)=k`.\n\nCall a color of the current `beta`-coloring protected if it contains one whole color class of `alpha`. Such a color has at least two vertices. Moreover, once a color is protected, it stays protected in the process below, because later moves recolor whole `alpha`-classes different from the one already protecting it.\n\nIf every `beta`-color has at least two vertices, we are done. Otherwise let color `c` be represented by the single vertex `v`. Let `A` be the `alpha`-color class containing `v`. Since `A` is independent and has at least two vertices, recolor all vertices of `A` with color `c`, leaving all other vertices with their current `beta`-colors. The new coloring is proper: the class of color `c` is exactly the independent set `A`, and every other color class only lost vertices from its previous independent class.\n\nNo color can become empty after this operation. If that happened, the resulting proper coloring would use at most `k-1` nonempty colors, contradicting `chi(G)=k`. Thus we still have a proper coloring in exactly `k` colors. The color `c` is now protected by the whole set `A`, so it will never again be a singleton.\n\nRepeat this operation while a singleton color exists. At each step one previously unprotected singleton color becomes protected, and protected colors never become singleton; hence after at most `k` steps no singleton color remains. The final coloring is proper, uses exactly `k` colors, and every color is used at least twice.",
