      "title": "Официальное решение, сжатое изложение",
      "text": "Официальное решение фиксирует базовую правильную раскраску, где каждый цвет встречается хотя бы дважды, и отдельно рассматривает произвольную правильную раскраску в `k` цветов.\n\nЕсли в этой `k`-раскраске есть цвет, представленный одной вершиной, то всю соответствующую цветовую группу из базовой раскраски перекрашивают в этот цвет. После этого полученный цвет уже не станет одноэлементным на следующих шагах.\n\nПовторяя процесс, последовательно устраняют все «плохие» цвета, состоящие из одной вершины. В конце получается правильная раскраска в `k` цветов, где каждый цвет используется не менее двух раз.",
