      "id": "sol-official-compressed",
      "title": "Самодостаточное доказательство через обменную перекраску",
      "text": "Возьмем любую правильную раскраску `alpha`, в которой каждый цветовой класс содержит хотя бы две вершины. Также возьмем правильную раскраску `beta` ровно в `k` цветов; она существует, поскольку `chi(G)=k`.\n\nНазовем цвет текущей `beta`-раскраски защищенным, если он содержит целый цветовой класс раскраски `alpha`. В таком цвете есть хотя бы две вершины. Более того, однажды защищенный цвет остается защищенным в описанном ниже процессе, потому что дальнейшие ходы перекрашивают целые `alpha`-классы, отличные от того, который уже его защищает.\n\nЕсли каждый цвет `beta` встречается хотя бы в двух вершинах, все доказано. Иначе пусть цвет `c` представлен единственной вершиной `v`. Пусть `A` — цветовой класс раскраски `alpha`, содержащий `v`. Так как множество `A` независимо и содержит хотя бы две вершины, перекрасим все вершины из `A` в цвет `c`, оставив всем остальным вершинам их текущие `beta`-цвета. Новая раскраска правильна: класс цвета `c` — это ровно независимое множество `A`, а каждый другой цветовой класс только потерял вершины из своего прежнего независимого класса.\n\nПосле этой операции ни один цвет не может исчезнуть. Если бы это произошло, получившаяся правильная раскраска использовала бы не более `k-1` непустых цветов, что противоречит `chi(G)=k`. Значит, у нас по-прежнему есть правильная раскраска ровно в `k` цветов. Цвет `c` теперь защищен всем множеством `A`, поэтому он больше никогда не станет одноэлементным.\n\nПовторяем эту операцию, пока существует одноэлементный цвет. На каждом шаге один ранее незащищенный одноэлементный цвет становится защищенным, а защищенные цвета больше не становятся одноэлементными; значит, не более чем через `k` шагов одноэлементных цветов не останется. Итоговая раскраска правильна, использует ровно `k` цветов, и каждый цвет встречается хотя бы дважды.",
