      "id": "sol-official-compressed",
      "title": "Официальное решение, сжатое изложение",
      "text": "Пусть единственное разбиение на независимые множества равно `V_1, ..., V_5`. Для каждой пары индексов `i, j` рассматривают индуцированный подграф `G_{i,j}` на `V_i ∪ V_j`.\n\nСначала в официальном решении доказывают, что каждый такой `G_{i,j}` связен. Иначе можно было бы взять одну компоненту связности и поменять внутри нее классы `V_i` и `V_j`, получив другое допустимое разбиение на 5 независимых множеств, что противоречит единственности.\n\nЗначит, в каждом `G_{i,j}` не меньше `|V_i| + |V_j| - 1` ребер. Складывая эти 10 оценок и замечая, что каждое ребро исходного графа считается ровно трижды, получают итоговую нижнюю границу `|E(G)| >= 4n - 10`.",
