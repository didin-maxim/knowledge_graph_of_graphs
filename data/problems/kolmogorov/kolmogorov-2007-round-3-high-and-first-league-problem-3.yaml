      "id": "sol-official-compressed",
      "title": "Решение через связность двух цветовых классов",
      "text": "Пусть единственное разбиение на независимые множества равно `V_1, ..., V_5`. Для каждой пары индексов `i, j` рассмотрим индуцированный подграф `G_{i,j}` на `V_i ∪ V_j`.\n\nПокажем, что каждый такой `G_{i,j}` связен. Иначе можно взять одну компоненту связности и поменять внутри нее классы `V_i` и `V_j`. Независимость всех пяти классов сохранится, потому что ребер из выбранной компоненты в остальные вершины `V_i ∪ V_j` нет, а остальные три класса не меняются. Получится другое допустимое разбиение на 5 независимых множеств, что противоречит единственности.\n\nЗначит, в каждом `G_{i,j}` не меньше `|V_i| + |V_j| - 1` ребер. Складывая эти 10 оценок, получаем сумму правых частей `4(|V_1|+...+|V_5|)-10 = 4n-10`: каждая вершина входит ровно в четыре пары цветовых классов. Каждое ребро исходного графа лежит между двумя разными классами, поэтому считается ровно в одном из графов `G_{i,j}`. Следовательно, `|E(G)| >= 4n - 10`.",
