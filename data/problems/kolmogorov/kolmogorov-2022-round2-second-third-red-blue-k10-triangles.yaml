  "solutions": [
    {
      "id": "sol-official-restored",
      "title": "Степени красного графа",
      "text": "Пусть \\(N\\) — точка с нечетным количеством отрезков, \\(B_1\\), \\(B_2\\), \\(\\ldots\\), \\(B_9\\) — 9 оставшихся точек.\nПусть \\(x_i\\) — количество красных отрезков с концом \\(B_i\\) (\\(1\\leq i\\leq 9\\)).\nНе умаляя общности \\(0\\le x_1<x_2<\\cdots<x_9\\le 9\\).\nДокажем, что \\(x_9 = 9\\). Если \\(x_9 \\leq 8\\), то \\(x_1 = 0\\).\nНо тогда точек с нечетным количеством выходящих из них отрезков нечетно (\\(N\\) и \\(B_2\\), \\(B_4\\), \\(B_6\\), \\(B_8\\)).\n\nТаким образом, \\(B_9\\) соединена со всеми остальными 9 точками красным отрезком.\nЭто означает, что \\(x_i=i\\) для \\(1 \\leq  i \\leq 9\\).\nТо есть, \\(B_9\\) соединена (далее будем считать только красные отрезки) со всеми, включая \\(N\\). А \\(B_1\\) только с \\(B_9\\).\nТогда \\(B_8\\) соединена со всеми, кроме \\(B_1\\), \\(B_2\\) только \\(B_9\\) и \\(B_8\\), и т.д.\n\nПолучаем, что все вершины разбиваются на множества\n\\(A = \\{N, B_5, B_6, B_7, B_8, B_9 \\}\\) и \\(B = \\{B_1, B_2, B_3, B_4 \\}\\), для которых\nлюбые две точки из \\(A\\) соединены, никакие две точки из \\(B\\) не соединены,\nи для каждой точки \\(B_i\\in B\\) выходит в \\(A\\) ровно \\(i\\) отрезков.\n\nПоэтому количество треугольников равно \\(\\binom{6}{3}+\\binom{2}{2}+\\binom{3}{2}+\\binom{4}{2}=30\\).",
