  "solutions": [
    {
      "id": "sol-official-restored",
      "title": "Ответ: не существуют",
      "text": "Предположим противное: существуют граф \\(G\\), у которого степени всех вершин чётны, и положительное целое \\(n\\), такие что для любых вершин \\(u,v\\) число маршрутов длины \\(n\\) из \\(u\\) в \\(v\\) нечётно. Для вершин \\(x,y\\) обозначим это число через \\(f_m(x,y)\\); все сравнения ниже будут по модулю \\(2\\).\n\nСначала покажем, что \\(n\\) не может быть нечётным. Зафиксируем вершину \\(v\\) и рассмотрим все замкнутые маршруты длины \\(n\\) из \\(v\\) в \\(v\\), то есть последовательности\n\\[\nv=x_0,x_1,\\ldots,x_n=v,\n\\]\nгде соседние члены соединены ребром. Разворот\n\\[\nx_0,x_1,\\ldots,x_n \\mapsto x_n,x_{n-1},\\ldots,x_0\n\\]\nявляется инволюцией на множестве таких маршрутов. Все маршруты, не переходящие в себя, разбиваются на пары и не влияют на чётность общего числа. Если же маршрут неподвижен при развороте, то \\(x_i=x_{n-i}\\) для всех \\(i\\). При нечётном \\(n=2r+1\\) это даёт \\(x_r=x_{r+1}\\), что невозможно в простом графе без петель, потому что соседние вершины маршрута должны быть соединены ребром. Значит, неподвижных точек нет, и \\(f_n(v,v)\\) чётно, противореча условию. Поэтому \\(n\\) чётно; пусть \\(n=2k\\), где \\(k\\ge1\\).\n\nСнова зафиксируем вершину \\(v\\). Та же инволюция разворота показывает, что чётность числа замкнутых маршрутов длины \\(2k\\) из \\(v\\) в \\(v\\) равна чётности числа её неподвижных точек. Неподвижные точки имеют вид\n\\[\nv=x_0,x_1,\\ldots,x_k,x_{k-1},\\ldots,x_0=v.\n\\]\nИначе говоря, они находятся во взаимно однозначном соответствии с произвольными маршрутами длины \\(k\\), начинающимися в \\(v\\): нужно выбрать первую половину \\(v=x_0,x_1,\\ldots,x_k\\), а вторая половина затем однозначно восстанавливается обратным проходом. Следовательно,\n\\[\nf_{2k}(v,v)\\equiv \\sum_u f_k(v,u).\n\\]\nПо предположению левая часть нечётна, значит число всех маршрутов длины \\(k\\), начинающихся в \\(v\\), нечётно.\n\nНо это невозможно при чётных степенях. Действительно, для любого \\(m\\ge1\\) число всех маршрутов длины \\(m\\), начинающихся в \\(v\\), равно\n\\[\n\\sum_w f_{m-1}(v,w)\\deg w:\n\\]\nмы выбираем первые \\(m-1\\) шагов до вершины \\(w\\), а затем одно из \\(\\deg w\\) рёбер для последнего шага. Каждое \\(\\deg w\\) чётно, поэтому вся сумма чётна. Применяя это к \\(m=k\\), получаем противоречие с нечётностью \\(\\sum_u f_k(v,u)\\). Значит, требуемых графа и числа \\(n\\) не существует.",
