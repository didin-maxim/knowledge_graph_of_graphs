      "id": "idea-graph-role",
      "title": "Разворот закрытого маршрута и чётные степени",
      "text": "Если все маршруты длины \\(n\\) между фиксированными концами считаются нечётно, то закрытые маршруты из вершины в себя можно считать по неподвижным точкам разворота. При чётном \\(n=2k\\) эти неподвижные точки равны первым половинам длины \\(k\\), но число всех таких половин из любой вершины чётно, потому что последний шаг выбирается из вершины чётной степени.",
