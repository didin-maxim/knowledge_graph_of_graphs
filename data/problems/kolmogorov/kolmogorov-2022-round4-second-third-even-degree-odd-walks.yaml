      "id": "sol-official-restored",
      "title": "Четность числа маршрутов",
      "text": "Через \\(N(v)\\) будем обозначать множество всех вершин, смежных с \\(v\\). Обозначим через \\(f_n(u,v)\\) количество доходов длины \\(n\\), начинающихся в \\(u\\) и кончающихся в \\(v\\). Все равенства будут означать сравнения по модулю \\(2\\).\n\nЗафиксируем вершину \\(v\\) и рассмотрим доходы длины \\(d\\), ведущие из \\(v\\) в \\(v\\). На этих доходах существует инволюция — разворот дохода задом наперёд. Все доходы разбиваются на пары, кроме тех, которые переходят сами в себя. Значит, \\(f_d(v,v)\\) сравнимо с количеством неподвижных точек инволюции, которые мы назовём 2-доходами. По предположению, количество \\(B(v)\\) таких 2-доходов нечётно; в частности, они есть.\n\n2-доход заключается в доходе длины \\(d/2\\) из \\(v\\) в какую-то вершину \\(u\\), пройденном последовательно в двух направлениях; в частности, мы уже понимаем, что \\(d\\) чётно. Итак, \\(B(v)=\\sum_u f_{d/2}(v,u)\\).\nНо все доходы длины \\(d/2\\), выходящие из \\(v\\), разбиваются на группы доходов, отличающихся лишь последним ребром, и в каждой группе число доходов чётно (ибо все степени чётны). Значит, и \\(N(v)\\) чётно — противоречие.",
