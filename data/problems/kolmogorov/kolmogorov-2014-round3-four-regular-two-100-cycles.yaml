    {
      "id": "sol-structural-classification-square-cycle",
      "title": "Структурная классификация 4-регулярных треугольных графов",
      "text": "Будем пользоваться следующей структурной леммой Pfender--Royle для простых 4-регулярных графов, в которых каждое ребро лежит в треугольнике: такой связный граф либо является квадратом цикла \\(C_n^2\\), либо получается из линейного мультиграфа \\(L(M)\\) некоторого кубического мультиграфа \\(M\\) последовательной заменой некоторых треугольников на копии \\(K_{1,1,3}\\) так, что в итоге все кратные рёбра исчезают. Здесь \\(C_n^2\\) означает граф на вершинах \\(0,1,\\ldots,n-1\\), где соединены вершины, отличающиеся по модулю \\(n\\) на \\(1\\) или \\(2\\); а \\(K_{1,1,3}\\) — полный трёхдольный граф с долями размеров \\(1,1,3\\).\n\nПрименим эту лемму к нашему графу \\(G\\). Сначала покажем, что в \\(G\\) не могла появиться замена треугольника на \\(K_{1,1,3}\\). В такой копии обозначим две одновершинные доли через \\(a,b\\), а трёхвершинную долю через \\(X\\). Внутри \\(K_{1,1,3}\\) вершины \\(a\\) и \\(b\\) смежны друг с другом и с каждой вершиной из \\(X\\); значит, их степень уже равна 4. Поэтому в исходном 4-регулярном графе у \\(a\\) и \\(b\\) нет соседей вне этой копии. Если удалить три вершины множества \\(X\\), то оставшиеся вершины \\(a,b\\) образуют отдельную компоненту. Так как в нашем графе 200 вершин, вне \\(\\{a,b\\}\\cup X\\) есть ещё вершины, и граф после удаления этих трёх вершин стал бы несвязным. Это противоречит условию задачи. Следовательно, замен типа \\(K_{1,1,3}\\) не было.\n\nОстаются две возможности: либо \\(G=C_n^2\\), либо \\(G\\) является линейным мультиграфом кубического мультиграфа \\(M\\). Во втором случае вершины \\(L(M)\\) соответствуют рёбрам \\(M\\), то есть \\(|V(G)|=|E(M)|\\). Если \\(M\\) кубический, то сумма степеней в \\(M\\) равна \\(3|V(M)|=2|E(M)|\\), откуда \\(|E(M)|\\) делится на 3. Но \\(|V(G)|=200\\), а 200 на 3 не делится. Значит, линейный случай невозможен.\n\nИтак, \\(G=C_{200}^2\\). Пронумеруем вершины по модулю 200: \\(0,1,\\ldots,199\\), причём в квадрате цикла соединены вершины с разностью \\(\\pm1\\) или \\(\\pm2\\). Тогда все чётные вершины\n\\[\n0,2,4,\\ldots,198\n\\]\nобразуют простой цикл длины 100, потому что соседние в этом списке вершины отличаются на 2 по модулю 200. Аналогично все нечётные вершины\n\\[\n1,3,5,\\ldots,199\n\\]\nобразуют второй простой цикл длины 100. Эти два цикла не имеют общих вершин. Что и требовалось доказать.",
