      "id": "idea-classify-quartic-triangle-graphs",
      "title": "Свести граф к квадрату цикла",
      "text": "Ключевой структурный шаг: простой 4-регулярный граф, в котором каждое ребро лежит в треугольнике, либо является квадратом цикла, либо получается из линейного мультиграфа кубического мультиграфа заменами треугольников на \\(K_{1,1,3}\\). Условие 4-вершинной связности запрещает такие замены, а число 200 не подходит для линейного графа кубического мультиграфа.",
