    {
      "id": "idea-zigzag-equality-cases",
      "title": "Равенство заставляет зигзаг",
      "text": "Равенство в рекуррентной оценке возможно только тогда, когда после удаления уха остаётся экстремальная триангуляция, а после удаления уха с двумя соседями оставшаяся часть уже замкнута диагональю и тоже экстремальна. Это ровно рекурсивное описание зигзагообразных триангуляций.",
