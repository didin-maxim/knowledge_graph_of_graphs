        "id": "stmt-original",
        "title": "Original statement",
        "text": "Триангуляцией выпуклого `n`-угольника называется разбиение его на треугольники непересекающимися диагоналями.\n\nАнтикликой триангуляции назовем подмножество вершин многоугольника, никакие две из которых не соединены стороной или диагональю.\n\nСаша подсчитал, что в любой триангуляции `100`-угольника хотя бы `M` антиклик, причем есть триангуляции, в которых их ровно `M`.\n\nСколько триангуляций содержат ровно `M` антиклик?",
