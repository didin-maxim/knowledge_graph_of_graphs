      "title": "Набросок, требующий восстановления",
      "text": "Решение пока не найдено в проверяемом виде.\n\nСтарый набросок утверждал ответ `100` и ссылался на индукцию по числу вершин: минимальное число антиклик якобы достигается ровно на зигзагообразных триангуляциях. В нем вводилось число `z_n` антиклик в зигзаге, выбирался треугольник, прилегающий к двум сторонам многоугольника, и антиклики делились на не содержащие и содержащие выделенную вершину. После этого без полного разбора заявлялась рекуррентная оценка `z_n >= z_{n-1}+z_{n-3}` и утверждалось, что равенство возможно только для зигзагов.\n\nЭтот текст слишком сжат для поля `solutions[]`: не доказано, что выбранный разрез действительно дает нужные две независимые нижние оценки для произвольной триангуляции; не разобраны случаи равенства; не объяснено строго, почему все минимальные триангуляции и только они являются зигзагами; финальный подсчет зигзагов в `100`-угольнике также дан без проверки двойного счета.\n\nДо сверки с официальным решением или полного восстановления индукции карточка должна оставаться на ручной проверке.",
