      "id": "idea-graph-role",
      "title": "Graph-theory role in kolmogorov-2021-round1-second-league-problem-10",
      "text": "В условии явно вводится антиклика триангуляции: это независимое множество в графе, образованном сторонами и диагоналями триангуляции.\nОфициальное решение минимизирует число таких независимых множеств по классам триангуляций.",
