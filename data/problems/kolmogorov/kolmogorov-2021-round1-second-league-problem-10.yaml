        "id": "stmt-original",
        "title": "Оригинальная формулировка",
        "text": "Триангуляцией выпуклого \\(n\\)-угольника называется разбиение его на треугольники непересекающимися диагоналями.\n\nАнтикликой триангуляции назовём подмножество вершин многоугольника, никакие две из которых не соединены стороной или диагональю.\n\nСаша подсчитал, что в любой триангуляции \\(100\\)-угольника хотя бы \\(M\\) антиклик, причём есть триангуляции, в которых их ровно \\(M\\). Сколько триангуляций содержат ровно \\(M\\) антиклик?",
        "source_id": "src-kolmogorov-2021-official",
