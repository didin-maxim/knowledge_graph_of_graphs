      "id": "idea-ear-recurrence-independent-sets",
      "title": "Удаление уха даёт рекуррентную нижнюю оценку",
      "text": "В любой триангуляции есть ухо. Независимые множества либо не содержат вершину уха, либо содержат её и тогда не содержат двух соседей уха. Поэтому минимум числа антиклик не меньше суммы минимумов для \\((n-1)\\)- и \\((n-3)\\)-угольников.",
