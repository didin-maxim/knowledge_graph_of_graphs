  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Официальное решение, развёрнутое",
      "text": "Ответ: \\(100\\).\n\nБудем считать антиклики независимыми множествами вершин графа триангуляции. Если в принятой конвенции пустое множество не называют антикликой, все числа ниже уменьшаются на 1, но экстремальные триангуляции не меняются.\n\nНазовём зигзагом такую триангуляцию, которая получается последовательным отрезанием ушей попеременно с двух концов одной ломаной: после выбора начальной вершины и первого направления все остальные диагонали вынуждены. Пусть \\(z_n\\) — число антиклик в зигзаг-триангуляции \\(n\\)-угольника. Нам понадобится не явная формула для \\(z_n\\), а рекуррентное свойство\n\\[\nz_n=z_{n-1}+z_{n-3}.\n\\]\nОно следует из того же разбиения антиклик, которое сейчас будет использовано для произвольной триангуляции.\n\nДокажем по индукции более сильное утверждение: среди всех триангуляций \\(n\\)-угольника минимум числа антиклик равен \\(z_n\\), и равенство достигается только на зигзаг-триангуляциях. Базы \\(n=3,4,5\\) непосредственны: для этих значений все триангуляции, с точностью до поворота и отражения, являются зигзагами, а число антиклик одинаково для всех вариантов.\n\nПусть \\(n\\ge6\\), и рассмотрим произвольную триангуляцию \\(P\\) с вершинами \\(A_1,A_2,\\ldots,A_n\\) по кругу. В любой триангуляции есть ухо, то есть треугольник, две стороны которого являются сторонами исходного многоугольника. Переименуем вершины так, чтобы ухом был треугольник \\(A_{n-1}A_nA_1\\).\n\nРазделим антиклики на два типа. Антиклики, не содержащие \\(A_n\\), — это ровно антиклики триангуляции \\((n-1)\\)-угольника \\(A_1A_2\\ldots A_{n-1}\\), полученной удалением уха. По индукционному предположению таких антиклик не меньше \\(z_{n-1}\\), причём равенство возможно только если эта меньшая триангуляция является зигзагом.\n\nЕсли антиклика содержит \\(A_n\\), то она не содержит соседние вершины \\(A_1\\) и \\(A_{n-1}\\). Остальные её вершины выбираются среди \\(A_2,A_3,\\ldots,A_{n-2}\\) и должны быть независимыми в индуцированном внешнепланарном графе на этих вершинах. Если в этом графе не хватает каких-то диагоналей до триангуляции многоугольника \\(A_2A_3\\ldots A_{n-2}\\), добавление недостающих непересекающихся диагоналей может только уменьшить число независимых множеств. Значит, вариантов этого типа не меньше \\(z_{n-3}\\). Равенство возможно только в двух случаях одновременно: диагональ \\(A_2A_{n-2}\\) уже проведена, так что оставшиеся вершины действительно образуют триангулированный \\((n-3)\\)-угольник, и эта триангуляция является зигзагом.\n\nИтак, любая триангуляция имеет не меньше\n\\[\nz_{n-1}+z_{n-3}=z_n\n\\]\nантиклик. Более того, равенство требует, чтобы после удаления \\(A_n\\) получался зигзаг на \\(A_1,\\ldots,A_{n-1}\\), а после удаления \\(A_1,A_n,A_{n-1}\\) — зигзаг на \\(A_2,\\ldots,A_{n-2}\\) с диагональю \\(A_2A_{n-2}\\). Эти два условия совместимы ровно так, как устроен следующий шаг зигзага: в четырёхугольнике \\(A_1A_2A_{n-2}A_{n-1}\\) выбирается одна из двух диагоналей, и вместе с ухом \\(A_{n-1}A_nA_1\\) это однозначно продолжает меньший зигзаг до зигзага \\(n\\)-угольника. Обратно, у зигзага это разбиение даёт ровно \\(z_{n-1}+z_{n-3}\\) антиклик, поэтому он действительно экстремален. Индукция завершена.\n\nОсталось посчитать зигзаг-триангуляции \\(100\\)-угольника. Зигзаг можно задавать так: выбрать один конец его определяющей ломаной, выбрать начальную вершину многоугольника и выбрать первое направление обхода — по часовой стрелке или против. После этого вся ломаная и все диагонали определяются однозначно. Получается \\(2\\cdot100\\) описаний, но каждая зигзаг-ломаная посчитана дважды, по одному разу от каждого конца. Поэтому число экстремальных триангуляций равно\n\\[\n\\frac{2\\cdot100}{2}=100.\n\\]\nСледовательно, ровно \\(100\\) триангуляций \\(100\\)-угольника содержат минимально возможное число \\(M\\) антиклик.",
