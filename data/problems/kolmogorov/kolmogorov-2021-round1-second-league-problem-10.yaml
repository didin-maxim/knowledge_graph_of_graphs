  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Official solution, compressed",
      "text": "Ответ: `100`.\n\nВ официальном решении доказывают по индукции, что минимальное число антиклик достигается ровно на триангуляциях типа «зигзаг».\n\nПусть `z_n` — число антиклик в зигзагообразной триангуляции `n`-угольника. В произвольной триангуляции выбирают треугольник, прилегающий к двум сторонам многоугольника.\n\nТогда антиклики делятся на два типа:\n1. не содержащие выделенную вершину;\n2. содержащие ее.\n\nПервых не меньше `z_{n-1}`, а вторых не меньше `z_{n-3}`. Отсюда получается рекуррентная оценка снизу `z_n >= z_{n-1} + z_{n-3}`.\n\nРавенство возможно только если соответствующие меньшие многоугольники сами триангулированы зигзагообразно и нужная диагональ присутствует. Значит, минимум достигается только на зигзагах.\n\nОстается посчитать число зигзагообразных триангуляций `100`-угольника. Такая триангуляция однозначно задается выбором вершины, с которой начинается ломаная зигзага, и выбором первого направления. После учета двойного счета получается `100`.",
