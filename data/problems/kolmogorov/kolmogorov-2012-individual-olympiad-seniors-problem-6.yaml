      "title": "Графовая роль",
      "text": "В официальном решении задача переводится в ориентированный граф на узлах уличной сетки. Существенны именно графовые понятия: ориентированные ребра, входящие и исходящие степени, удаление ребер и существование маршрута через все оставшиеся ребра.",
