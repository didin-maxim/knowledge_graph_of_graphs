  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Полное решение",
      "text": "Ответ: `100(2n^2 - 2n + 4)`.\n\nБудем считать, что сторона квартала равна `1`, стартовая вершина имеет координаты `(0,0)`, а противоположный угол — `(n,n)`. Так как обе улицы из старта направлены наружу, можно выбрать координаты так, что горизонтальные улицы с четным `y` направлены вправо, с нечетным `y` — влево, вертикальные улицы с четным `x` направлены вверх, а с нечетным `x` — вниз. Всего в сетке `n(n+1)` горизонтальных и `n(n+1)` вертикальных единичных отрезков, то есть `2n(n+1)` ориентированных ребер.\n\nОценим снизу число ребер, которые любой допустимый маршрут не пройдет. Для каждого `k = 0,1,...,2n-1` рассмотрим диагональную прямую `x + y = k + 1/2`. Она отделяет `(0,0)` от `(n,n)`, поэтому путь из старта в финиш пересекает ее нечетное число раз. При этом сама прямая пересекает четное число единичных отрезков: поровну горизонтальных и вертикальных. Значит, среди отрезков, пересекаемых этой прямой, хотя бы один не пройден. Разные такие диагонали пересекают разные единичные отрезки, поэтому уже получаем не менее `2n` непройденных ребер.\n\nТеперь усилим подсчет. Пусть `k` четно и `2 <= k <= n-2`, и рассмотрим ту же прямую `x + y = k + 1/2`. Под ней лежат вершины `(a,k-a)`, где `0 <= a <= k`; из каждой такой вершины выходят два пересекающих прямую отрезка. Из-за чередования направлений при четном `a` оба эти отрезка направлены от стороны старта к стороне финиша, а при нечетном `a` — обратно. Поэтому пересекающих прямую ребер первого типа `k+2`, второго типа `k`. В любом маршруте из области старта в область финиша число использованных ребер первого типа должно быть ровно на `1` больше числа использованных ребер второго типа. Но граничные вершины `(k,0)` и `(0,k)` имеют только по одному входящему ребру, следовательно, в каждой из них нельзя использовать оба выходящих через диагональ ребра; значит, использовано не более `k` ребер первого типа. Тогда ребер второго типа использовано не более `k-1`, и данная диагональ пересекает как минимум `3` непройденных ребра. Таких диагоналей `(n-2)/2`, каждая дает еще два непройденных ребра сверх уже учтенного одного, то есть дополнительно `n-2` ребра. Для диагоналей `x + y = k - 1/2`, где `k` четно и `n+1 <= k <= 2n-2`, тот же подсчет применяется после отражения сетки относительно центра квадрата; он дает еще `n-2` непройденных ребра. Итак, любой маршрут оставляет не менее `2n + 2(n-2) = 4n-4` ребер.\n\nОсталось показать, что эта оценка достижима. Удалим из ориентированной сетки следующие единичные отрезки, причем запись пути означает удаление всех его последовательных единичных сторон. Сначала удалим отрезки `(n,2k-1)-(n,2k)` при `1 <= k <= n/2` и отрезки `(2k,0)-(2k+1,0)` при `1 <= k <= (n-2)/2`; это `n-1` ребро. Затем удалим пути `(2k,n)-(2k,n-1)-(2k+1,n-1)-(2k+1,n)` при `1 <= k <= (n-2)/2` и пути `(0,2k-1)-(1,2k-1)-(1,2k)-(0,2k)` при `2 <= k <= (n-2)/2`; всего в этих путях `3n-9` ребер. Наконец, удалим пути `(0,0)-(0,1)`, `(1,0)-(1,1)-(1,2)-(0,2)` и `(0,n-1)-(1,n-1)-(1,n)`, содержащие вместе еще `6` ребер. Общее число удаленных ребер равно `(n-1)+(3n-9)+6 = 4n-4`.\n\nПроверим, что по всем оставшимся ребрам можно пройти одним маршрутом. В каждой внутренней вершине исходной сетки было по два входящих и два исходящих ребра; перечисленное удаление либо не затрагивает вершину, либо удаляет из нее одинаковое число входящих и исходящих ребер. На границе та же непосредственная проверка по списку удалений дает баланс входящих и исходящих ребер во всех вершинах, кроме старта и финиша; у `(0,0)` остается на одно исходящее ребро больше, чем входящих, а у `(n,n)` — на одно входящее больше, чем исходящих. Оставшийся неориентированный граф связен: удаленные трехзвенные куски лежат вдоль границы и каждый обходится оставшейся стороной соответствующего маленького квадрата или соседними ребрами сетки; одиночные удаленные граничные ребра также имеют обход через соседний квадрат. Поэтому по критерию Эйлера для ориентированного графа существует эйлеров путь из `(0,0)` в `(n,n)`, проходящий по каждому оставшемуся ребру ровно один раз.\n\nЗначит, можно пройти `2n(n+1) - (4n-4) = 2n^2 - 2n + 4` единичных сторон кварталов. Каждая такая сторона имеет длину `100`, поэтому максимальное расстояние равно `100(2n^2 - 2n + 4)`.",
