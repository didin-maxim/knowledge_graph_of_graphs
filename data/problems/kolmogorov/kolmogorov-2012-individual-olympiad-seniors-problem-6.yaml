  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Официальное решение, сжатое изложение",
      "text": "Ответ: `100(2n^2 - 2n + 4)`.\n\nРассмотрим сетку единичных отрезков и ориентируем каждый отрезок по направлению движения на соответствующей улице. Тогда задача превращается в задачу об ориентированном графе: нужно найти максимальную длину допустимого маршрута из стартовой вершины в финишную, не проходя по одному ребру дважды.\n\nВ официальном решении сначала оценивают снизу число непройденных ребер. Для этого рассматривают семейства диагональных прямых `x + y = k + 1/2` и подсчитывают, сколько ориентированных единичных отрезков их пересекает. Из-за чередования направлений на соседних улицах и условий входа-выхода через такие сечения получается, что хотя бы `4n - 4` ребер неизбежно останутся непройденными.\n\nЗатем приводится конструкция, где удаляют ровно `4n - 4` ориентированных ребра и коротких ориентированных пути так, что у внутренних вершин сохраняется баланс входящих и исходящих ребер, а на границе остаются нужные степени для существования требуемого маршрута. Значит, можно пройти по всем остальным ребрам, то есть по `2n(n + 1) - (4n - 4) = 2n^2 - 2n + 4` единичным отрезкам, что и дает искомое расстояние.",
