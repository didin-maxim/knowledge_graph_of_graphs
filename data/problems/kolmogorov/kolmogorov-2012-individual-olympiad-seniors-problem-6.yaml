        "id": "stmt-original",
        "title": "Оригинальная формулировка",
        "text": "Город Сугробск представляет собой квадрат со стороной `100n`, разбитый прямыми улицами на `n^2` одинаковых кварталов, где `n` — четное натуральное число, большее `2`.\n\nНа каждой из `2n + 2` улиц, идущих по сторонам кварталов от края до края города, введено одностороннее движение, причем на соседних параллельных улицах направления противоположны. В одном из углов города расположен автопарк, и обе выходящие из него улицы направлены от автопарка. Снегоуборочная машина выезжает из автопарка и едет по разрешенным направлениям, очищая каждую пройденную сторону квартала не более одного раза, пока впервые не попадет в противоположный угол города.\n\nКакое наибольшее расстояние она может проехать?",
