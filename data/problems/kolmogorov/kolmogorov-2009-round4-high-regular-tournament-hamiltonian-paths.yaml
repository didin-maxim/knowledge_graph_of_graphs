      "id": "idea-arc-pancyclicity-to-many-paths",
      "title": "Покрыть каждую дугу гамильтоновым циклом",
      "text": "Если в регулярном турнире каждая дуга лежит в некотором гамильтоновом цикле, то двойной подсчет пар (дуга, гамильтонов цикл, содержащий эту дугу) дает много различных гамильтоновых циклов. Каждый такой цикл затем дает столько гамильтоновых путей, сколько в нем дуг.",
