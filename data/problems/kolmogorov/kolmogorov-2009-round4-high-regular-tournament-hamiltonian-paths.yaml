      "id": "sol-ai-busch-strong-tournament-bound",
      "title": "ИИ-решение через нижнюю оценку для сильных турниров",
      "text": "Сначала проверим, что данный турнир T сильно связен. Предположим противное и рассмотрим конденсацию T по компонентам сильной связности. В турнире между двумя различными компонентами все рёбра направлены в одну сторону, поэтому компоненты можно линейно упорядочить так, что все рёбра между более ранней и более поздней компонентой идут вперёд. Пусть A — первая компонента, B — последняя. У вершины из A нет входящих рёбер извне A, значит её входящая степень не превосходит |A|-1. Но в нашем регулярном турнире на 2009 вершинах входящая степень каждой вершины равна 1004, поэтому |A|>=1005. Аналогично у вершины из B нет исходящих рёбер вне B, значит |B|-1>=1004 и |B|>=1005. Компоненты A и B различны и не пересекаются, что невозможно, так как всего вершин 2009. Значит T сильно связен.\n\nТеперь используем внешнюю теорему Arthur H. Busch: любой сильный турнир порядка n имеет не менее 5^((n-1)/3) различных гамильтоновых ориентированных путей; точная нижняя оценка в случае n≡2 (mod 3) равна 9*5^((n-5)/3). Для n=2009 получаем как минимум 9*5^668 гамильтоновых путей, а это заведомо больше 2500. Следовательно, в исходном турнире есть не менее 2500 гамильтоновых ориентированных путей.",
