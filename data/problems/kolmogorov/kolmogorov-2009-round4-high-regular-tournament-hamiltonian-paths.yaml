  "solutions": [
    {
      "id": "sol-alspach-arc-pancyclicity",
      "title": "Через теорему Алспача об арк-панцикличности регулярных турниров",
      "text": "Используем внешнюю теорему Алспача: в каждом регулярном турнире каждая дуга содержится в направленном цикле любой длины от 3 до числа вершин турнира. В частности, каждая дуга нашего турнира лежит в некотором направленном гамильтоновом цикле.\n\nВ турнире 2009 вершин, из каждой выходит 1004 дуги, поэтому всего дуг \\(2009\\cdot1004\\). Сосчитаем пары \\((e,C)\\), где \\(e\\) - дуга турнира, а \\(C\\) - направленный гамильтонов цикл, содержащий \\(e\\). По теореме Алспача для каждой дуги есть хотя бы один такой цикл, значит число пар не меньше \\(2009\\cdot1004\\). С другой стороны, каждый гамильтонов цикл содержит ровно 2009 дуг, поэтому число различных гамильтоновых циклов не меньше\n\\[\n\\frac{2009\\cdot1004}{2009}=1004.\n\\]\n\nТеперь из каждого направленного гамильтонова цикла получаем 2009 направленных гамильтоновых путей: достаточно удалить из цикла одну из его дуг. Эти пути, полученные из разных циклов, не совпадают. Действительно, направленный гамильтонов путь определяет возможный замыкающий цикл однозначно: нужно добавить дугу из его последней вершины в первую, если она направлена именно так. Поэтому один и тот же путь не может получиться удалением дуги из двух разных гамильтоновых циклов.\n\nСледовательно, число направленных гамильтоновых путей не меньше \\(1004\\cdot2009\\), что заведомо больше 2500. Требуемая оценка доказана.",
