  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Самодостаточное доказательство через разбиение четырех цветов",
      "text": "Граф максимальной степени 3 можно правильно раскрасить в 4 цвета жадным алгоритмом: упорядочим вершины произвольно и будем красить их по одной; когда красится очередная вершина, ее уже покрашенные соседи запрещают не более трех цветов.\n\nВозьмем такую правильную раскраску вершин цветами 1, 2, 3, 4. Отнесем ребро к первой авиакомпании, если цвета его концов равны 1-2, 2-3, 3-4 или 4-1. Отнесем ребро ко второй авиакомпании, если цвета его концов равны 1-3 или 2-4. Каждое ребро соединяет вершины разных цветов, поэтому попадает ровно в один из этих двух списков.\n\nГраф первой авиакомпании двудолен с долями `{1,3}` и `{2,4}`: каждое разрешенное ребро первой авиакомпании соединяет цвет из первой доли с цветом из второй. Граф второй авиакомпании двудолен с долями `{1,2}` и `{3,4}`: каждое разрешенное ребро второй авиакомпании также идет между двумя долями.\n\nВ двудольном графе нет нечетного цикла. Следовательно, ни одна из двух сетей авиакомпаний не содержит нечетного цикла, что и требовалось.",
