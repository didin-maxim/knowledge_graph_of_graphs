      "id": "sol-official-compressed",
      "title": "??????????? ???????, ?????? ???????",
      "text": "Официальное решение сначала правильно раскрашивает вершины графа в 4 цвета. Это можно сделать, поскольку граф 3-регулярен и имеет максимальную степень 3.\n\nЗатем одну авиакомпанию наделяют ребрами типов `1-2`, `2-3`, `3-4`, `4-1`, а вторую — ребрами типов `1-3` и `2-4`. В каждом из этих двух подграфов вершины естественно разбиваются на две доли, поэтому оба подграфа двудольны.\n\nСледовательно, ни у одной компании не может возникнуть нечетный цикл.",
