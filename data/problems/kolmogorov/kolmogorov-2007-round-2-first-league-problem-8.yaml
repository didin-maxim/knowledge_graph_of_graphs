      "id": "sol-official-compressed",
      "title": "Официальное решение, сжатое изложение",
      "text": "Официальное решение предполагает, что такое разрезание существует, и внутри каждой фигурки проводит вспомогательные синие отрезки. Эти отрезки объединяются в непересекающиеся циклы.\n\nРассматривают внутренний цикл без других циклов внутри него. Затем по внутренним вершинам клеточной сетки строят желтый граф смежности. Этот граф оказывается связным и ацикличным, то есть деревом.\n\nДалее используется паритетный подсчет: число внутренних вершин цикла четно, число ребер в желтом дереве нечетно, а суммарное число выходящих из отмеченных вершин ребер одновременно должно иметь и другую четность. Получается противоречие.\n\nСледовательно, требуемого разрезания не существует.",
