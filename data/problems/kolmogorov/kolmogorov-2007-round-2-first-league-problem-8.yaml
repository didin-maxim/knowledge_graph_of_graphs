  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Официальное решение, развернутое изложение",
      "text": "Ответ: нельзя.\n\nПредположим противное: некоторый клетчатый прямоугольник удалось разрезать на такие фигурки. В каждой фигурке соединим синими отрезками центр ее полной клетки с серединами диагоналей в двух треугольных половинках. При переходе через стороны фигурок эти синие отрезки продолжают друг друга, поэтому все они распадаются на непересекающиеся замкнутые циклы. Объединение фигурок, соответствующих одному синему циклу, состоит из целых клеток, и через каждую клетку проходит ровно один такой цикл.\n\nВыберем синий цикл, внутри которого нет других синих циклов. Тогда внутри него нет ни одной целой клетки разбиения: иначе через эту клетку проходил бы еще один синий цикл, лежащий внутри выбранного.\n\nРаскрасим клетчатую плоскость в шахматном порядке так, чтобы черные клетки, пересекаемые выбранным циклом как целые клетки фигурок, были целыми, а белые клетки были разрезанными. В белых клетках рассмотрим диагонали, лежащие на границах фигурок: диагонали из левого верхнего угла назовем главными, а из правого верхнего угла побочными. Если идти по синему циклу, то пересекаемые им главные и побочные диагонали чередуются. Поэтому число пересеченных диагоналей четно, а длина синего цикла делится на 4, так как между двумя соседними пересеченными диагоналями лежат два синих отрезка.\n\nТеперь раскрасим все белые клетки плоскости в красный и зеленый цвета в шахматном порядке. Соседние вдоль синего цикла диагонали направлены по-разному и лежат в белых клетках, имеющих общую вершину. Значит, все главные диагонали выбранного цикла лежат, скажем, в красных клетках, а все побочные — в зеленых. В каждой белой клетке, через которую выбранный цикл не проходит, тоже проведем диагональ соответствующего цвета: в красной — главную, в зеленой — побочную. Тогда каждая вершина клеточной сетки является концом ровно одной из проведенных диагоналей.\n\nОтметим все вершины клеточной сетки, лежащие строго внутри выбранного синего цикла, и соединим желтым ребром любые две отмеченные вершины, соседние по стороне клетки. Полученный желтый граф связен: любые две внутренние вершины можно соединять путями по ребрам сетки внутри выбранной области. В нем нет циклов, потому что цикл желтых ребер ограничивал бы область, содержащую хотя бы одну клетку, а внутри выбранного синего цикла целых клеток нет. Следовательно, желтый граф — дерево.\n\nКаждая проведенная диагональ, пересекающая выбранный синий цикл, имеет один конец внутри цикла, а другой вне его. Так как синий цикл пересекает четное число диагоналей, число отмеченных внутренних вершин четно. Поэтому в желтом дереве число ребер на единицу меньше числа вершин и, значит, нечетно.\n\nПодсчитаем теперь для всех отмеченных вершин количество выходящих из них ребер клеточной сетки. Желтые ребра учитываются дважды, поэтому дают число, равное удвоенному нечетному числу: оно сравнимо с 2 по модулю 4. Все остальные учтенные ребра выходят наружу из отмеченного множества и пересекают синие отрезки выбранного цикла; наоборот, каждый синий отрезок пересекает ровно одно такое ребро сетки. Число этих наружных ребер равно длине синего цикла, то есть кратно 4. Значит, общий подсчет должен быть сравним с 2 по модулю 4.\n\nНо у каждой отмеченной вершины клеточной сетки ровно четыре инцидентных ребра сетки, поэтому тот же общий подсчет обязан делиться на 4. Противоречие. Следовательно, требуемого разрезания клетчатого прямоугольника не существует.",
