      "id": "sol-official-restored",
      "title": "Индукция по числу цветов",
      "text": "Докажем индукцией по \\(d\\), что, если натуральные числа раскрашены в \\(d\\) цветов, то найдётся подобная последовательность. База при \\(d=1\\) очевидна.\n\nПусть найдётся \\(N\\) такое, что на любом отрезке длины \\(N\\) встретится \\(d\\)-й цвет. Тогда все числа \\(d\\)-го цвета, сдвинутые на один влево, образуют требуемую последовательность (для любого \\(n\\) надо взять \\(x = 1\\)). Иначе найдутся сколь угодно большие отрезки раскраски без \\(d\\)-го цвета. Рассмотрим бесконечное ориентированное ``дерево'', в котором на \\(k\\)-ом уровне будет \\((d-1)^k\\) вершин, каждая из которых соответствует раскраске \\(k\\) элементов в \\(d-1\\) цвет. Для каждого отрезка последовательных чисел длины \\(k\\), среди которых нет чисел \\(d\\)-го цвета, проведём ребро от вершины, соответствующей раскраске первых \\(k-1\\) числа, к вершине, соответствующей раскраске всех \\(k\\) чисел. В полученном графе степень каждой вершины конечная, а вершин, до которых можно добраться из корня — бесконечное количество, так как найдутся сколь угодно большие отрезки раскраски без \\(d\\)-го цвета. Следовательно, по теореме Кёнига, в этом графе существует бесконечный путь, по которому можно построить раскраску натуральных чисел в \\(d-1\\) цвет. По индукционному предположению в новой раскраске существует бесконечная последовательность \\(\\{a_i\\}\\), удовлетворяющая условию задачи. А так как для любого отрезка чисел в новой раскраске существует отрезок чисел в старой раскраске, который покрашен точно так же, то последовательность  \\(\\{a_i\\}\\) также удовлетворяет условию задачи для первоначальной раскраски. Переход доказан.",
