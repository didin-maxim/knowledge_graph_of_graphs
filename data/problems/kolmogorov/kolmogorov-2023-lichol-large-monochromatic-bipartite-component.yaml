      "id": "idea-densest-color-degree-sum",
      "title": "Выбрать самый плотный цвет и посмотреть на ребро",
      "text": "По принципу Дирихле один цвет встречается хотя бы \\(kmn\\) раз. В графе этого цвета либо уже есть ребро с суммой степеней хотя бы \\(m+n\\), либо сумма \\(\\deg(a)+\\deg(b)\\) по всем рёбрам оказывается одновременно строго меньше и не меньше \\(|E|(m+n)\\).",
