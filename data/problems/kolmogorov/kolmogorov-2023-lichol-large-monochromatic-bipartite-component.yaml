  "solutions": [
    {
      "id": "sol-degree-sum-component",
      "title": "Одноцветный подграф максимальной плотности",
      "text": "По принципу Дирихле существует цвет, встречающийся не менее чем на \\(km\\cdot kn/k = kmn\\) рёбрах. Оставим только рёбра этого цвета и обозначим полученный двудольный граф через \\(G\\), его доли — через \\(A\\) и \\(B\\). Если найдётся ребро \\(ab\\in E(G)\\) такое, что \\(\\deg(a)+\\deg(b)\\ge m+n\\), то компонента связности, содержащая \\(a\\) и \\(b\\), уже имеет хотя бы \\(m+n\\) вершин. Предположим противное: для каждого ребра \\(ab\\) выполнено \\(\\deg(a)+\\deg(b)<m+n\\). Тогда, суммируя по всем рёбрам, получаем \\(\\sum_{ab\\in E(G)}(\\deg(a)+\\deg(b))<|E(G)|(m+n)\\). С другой стороны, эта же сумма равна \\(\\sum_{a\\in A}\\deg(a)^2+\\sum_{b\\in B}\\deg(b)^2\\), а по неравенству Коши это не меньше \\(|E(G)|^2/(km)+|E(G)|^2/(kn)\\). Так как \\(|E(G)|\\ge kmn\\), отсюда следует нижняя оценка \\(|E(G)|(m+n)\\), противоречащая предыдущему строгому неравенству. Следовательно, нужное ребро, а значит и нужная компонента, существуют.",
