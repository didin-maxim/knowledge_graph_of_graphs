      "id": "sol-ai-bondy-pancyclic-theorem",
      "title": "ИИ-решение через теорему Бонди о панцикличности",
      "text": "Используем теорему Бонди: если простой гамильтонов граф на \\(n\\) вершинах имеет не меньше \\(n^2/4\\) рёбер, то он панцикличен, то есть содержит циклы всех длин от \\(3\\) до \\(n\\), либо является полным двудольным графом \\(K_{n/2,n/2}\\).\n\nВ нашей задаче \\(n=100\\), поэтому \\(n^2/4=2500\\). По условию в графе больше \\(2500\\) рёбер и есть гамильтонов цикл. Значит, теорема Бонди применима. Исключительный случай невозможен: граф \\(K_{50,50}\\) имеет ровно \\(50\\cdot 50=2500\\) рёбер, а у нас рёбер строго больше.\n\nСледовательно, граф панцикличен и содержит простые циклы всех длин \\(3,4,…,100\\). В частности, для каждого \\(k=3,4,…,99\\) в нём есть простой цикл ровно на \\(k\\) вершинах, что и требовалось доказать.",
