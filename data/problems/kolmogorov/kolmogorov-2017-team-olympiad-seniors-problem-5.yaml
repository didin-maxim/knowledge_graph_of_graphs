  "ideas": [
    {
      "id": "idea-graph-role",
      "title": "Графовая роль",
      "text": "Официальное решение существенно использует модель взвешенного графа: вершины — города, ребра — авиарейсы, а опубликованные значения — это кратчайшие расстояния. Ключевой шаг — разбиение множества вершин по отношению к концам измененного ребра и анализ кратчайших путей.",
      "tags": [],
