        "title": "Оригинальная формулировка",
        "text": "В стране `N` городов некоторые пары соединены двусторонними авиарейсами с ценой более 1000 рублей, причем из любого города можно добраться до любого другого. Для каждой пары городов компания публикует минимальную цену пути между ними и суммирует все эти значения.\n\nПосле уменьшения цены одного рейса на 1000 рублей нужно доказать, что итоговая сумма всех попарных минимальных цен изменится не более чем на `250N^2`.",
