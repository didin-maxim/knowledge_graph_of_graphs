  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Официальное решение, сжатое изложение",
      "text": "Пусть удешевлен рейс `XY`. Разобьем все города на два множества:\n\n- `A` — города, из которых после изменения дешевле добраться до `X`, чем до `Y` (включая `X`);\n- `B` — города, из которых добраться до `Y` не дороже, чем до `X` (включая `Y`).\n\nСначала заметим, что кратчайший путь между двумя городами из одного множества не может использовать ребро `XY`. Например, если `U, V` лежат в `A` и кратчайший путь из `U` в `V` идет через `X -> Y`, то выгоднее было бы из `X` сразу лететь к `V` кратчайшим путем без захода в `Y`, потому что цена ребра `XY` все еще положительна. Аналогично для двух городов из `B`.\n\nЗначит, уменьшиться могли только расстояния между парами городов из разных множеств. Если `|A| = a`, то таких пар ровно `a(N-a)`, а это не больше `N^2/4`.\n\nДля любой пары из разных множеств новый кратчайший путь использует удешевленное ребро `XY` не более одного раза, поэтому цена такой пары могла уменьшиться не более чем на 1000 рублей.\n\nИтак, полное изменение суммы не превосходит\n\n`1000 * N^2 / 4 = 250N^2`.",
