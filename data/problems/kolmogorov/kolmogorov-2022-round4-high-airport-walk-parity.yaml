  "solutions": [
    {
      "id": "sol-official-restored",
      "title": "Официальное решение, восстановлено из исходников",
      "text": "Введём граф аэропортов и авиарейсов. Через $N(v)$ будем обозначать множество всех вершин, смежных с $v$. Обозначим через $f_n(u,v)$ количество туров длины $n$, начинающихся в $u$ и кончающихся в $v$. Все \\emph{равенства} будут означать сравнения по модулю $2$. Заметим, что\n$$\n  f_{n+1}(u,v)=\\sum_{w\\in N(v)} f_n(u,w),\n  \\eqno(*)\n$$\nибо каждый тур длины $n+1$, ведущий  из $u$ в $v$, на $n$-м шаге приходит в какого-то соседа $w$ вершины~$v$.\n\nПредположим, что $f_d(u,v)=1$ при всех $u,v$. Обозначим через $\\deg v$ степень вершины $v$. Из формулы $(*)$ получаем, что $f_{d+1}(u,v)=\\deg v$. Аналогично, $f_d(u,v)=f_d(v,u)=\\deg u$. Значит, все степени имеют одинаковую чётность, и возникает два случая.\n\n\\textit{Случай 1.} Пусть все степени чётны. Зафиксируем вершину $v$ и рассмотрим туры длины $d$, ведущие из $v$ в $v$. На этих турах существует инволюция --- разворот тура задом наперёд. Все туры разбиваются на пары, кроме тех, которые переходят сами в себя. Значит, $f_d(v,v)$ сравнимо с количеством неподвижных точек инволюции, которые мы назовём \\emph{2-турами}. По предположению, количество $B(v)$ таких 2-туров нечётно; в частности, они есть.\n\n2-тур заключается в туре длины $d/2$ из $v$ в какую-то вершину $u$, пройденном последовательно в двух направлениях; в частности, мы уже понимаем, что $d$ чётно. Итак, $B(v)=\\sum_u f_{d/2}(v,u)$.\nНо все туры длины $d/2$, выходящие из $v$, разбиваются на группы туров, отличающихся лишь последним ребром, и в каждой группе число туров чётно (ибо все степени чётны). Значит, и $N(v)$ чётно --- противоречие.\n\n\\textit{Случай 2.} Пусть все степени нечётны; тогда количество вершин чётно. Формула~$(*)$ теперь даёт $f_{d+1}(u,v)=1$. Аналогично получаем $1=f_{d+1}(u,v)=f_{d+2}(u,v)=\\dots=f_{2d}(u,v)$.\n\nС другой стороны, выделяя в каждом туре длины $2d$ среднюю вершину $w$, получаем формулу\n$$\n  f_{2d}(u,v)=\\sum_w f_d(u,w)f_d(w,v)=\\sum_w1=0,\n$$\nибо вершин чётное число. Противоречие.\n\n\\r Доказано, что все степени одной чётности --- 4 балла.\n\n\\r Разбор одной из двух чётностей --- 2 балла (суммируется с предыдущим).\n\n\\r Формула $(*)$ и подобные ей отдельно не оцениваются.\n}",
