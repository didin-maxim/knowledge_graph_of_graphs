        "title": "Оригинальная формулировка",
        "text": "В стране несколько аэропортов, между некоторыми парами есть двусторонние рейсы. Туристическая компания предлагает все маршруты, состоящие из \\(d\\) последовательных перелётов; маршрут может посещать город или использовать рейс несколько раз. Компания утверждает, что для любых двух, не обязательно различных, городов число маршрутов, начинающихся в первом и заканчивающихся во втором, нечётно. Может ли это быть верно при некотором \\(d\\)?",
