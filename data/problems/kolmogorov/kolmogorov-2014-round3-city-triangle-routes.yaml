  "solutions": [
    {
      "id": "sol-neighborhood-matching-count",
      "title": "Окрестность каждой вершины вынуждает паросочетание",
      "text": "Переведём условие на язык графов: города — вершины, дороги — рёбра. Граф 8-регулярный, и каждое ребро лежит хотя бы в одном треугольнике. Предположим противное: каждая вершина лежит не более чем в четырёх треугольниках.\n\nВозьмём произвольную вершину \\(v\\) и рассмотрим её 8 соседей. Треугольники, проходящие через \\(v\\), взаимно однозначно соответствуют рёбрам между соседями \\(v\\): если два соседа соединены ребром, они вместе с \\(v\\) дают треугольник, и наоборот. Поэтому между 8 соседями вершины \\(v\\) есть не более 4 рёбер.\n\nС другой стороны, каждое ребро \\(vu\\), выходящее из \\(v\\), лежит в некотором треугольнике \\(vuw\\). Значит, сосед \\(u\\) соединён ребром с каким-то другим соседом \\(w\\) вершины \\(v\\). Следовательно, в графе на 8 соседях вершины \\(v\\) нет изолированных вершин. Но граф на 8 вершинах без изолированных вершин имеет хотя бы 4 ребра. Значит, у него ровно 4 ребра, и эти 4 ребра образуют паросочетание.\n\nИтак, для каждой вершины \\(v\\) число треугольников, проходящих через \\(v\\), равно ровно 4. Тогда сумма по всем вершинам числа треугольников через вершину равна \\(2014\\cdot 4=8056\\). Но каждый треугольник при таком подсчёте считается ровно три раза, по числу своих вершин. Следовательно, \\(8056\\) должно делиться на 3, что неверно. Противоречие. Значит, существует город, входящий хотя бы в пять циклических маршрутов по трём городам.",
