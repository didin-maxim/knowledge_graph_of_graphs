  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Официальное решение, сжатое изложение",
      "text": "Ответ: в `k+n-1` цвет.\n\nВерхняя оценка совпадает с решением юниорской задачи: раскрашиваем `B ∪ C` в `n` цветов, фиксируем один цвет, берём множество `D` вершин из `B` этого цвета и затем раскрашиваем `A ∪ D` в `k` цветов, используя тот же цвет и ещё `k-1` новых.\n\nДля нижней оценки строится специальный граф. Берутся `kn` вершин множества `B` в виде прямоугольной таблицы из `n` строк и `k` столбцов. Ниже добавляется строка из `k` вершин — это `A`, слева столбец из `n` вершин — это `C`.\n\nВнутри `B` соединяются ребром любые две вершины, не лежащие в одной строке и не лежащие в одном столбце. Внутри `A` и внутри `C` берутся полные графы. Кроме того, вершина из `A` соединяется со всеми вершинами `B`, не лежащими с ней в одном столбце, а вершина из `C` — со всеми вершинами `B`, не лежащими с ней в одной строке.\n\nТогда `A ∪ B` раскрашивается в `k` цветов по столбцам, а `B ∪ C` — в `n` цветов по строкам. Остаётся показать, что весь граф нельзя раскрасить в `k+n-2` цвета. В официальном решении это делается подсчётом общих цветов, отмеченных строк и столбцов и выбором в `B` клики из `m` попарно смежных вершин, что даёт противоречие. Значит, минимум равен `k+n-1`.",
