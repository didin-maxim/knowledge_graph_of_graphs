  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Полное решение",
      "text": "Ответ: в `k+n-1` цвет.\n\nСначала докажем верхнюю оценку. Возьмём правильную раскраску подграфа `B ∪ C` в `n` цветов и обозначим через `D` множество вершин из `B`, получивших первый цвет. Подграф `A ∪ D` является подграфом `A ∪ B`, поэтому его можно правильно раскрасить в `k` цветов; используем для него цвета `1,2,...,k`.\n\nТеперь вершины из `B \\ D` оставим в цветах раскраски `B ∪ C`, но сдвинем их: если вершина имела цвет `i > 1`, дадим ей цвет `k+i-1`. Вершины из `C` первого цвета покрасим в цвет `k`, а вершины из `C` цвета `i > 1` — в цвет `k+i-1`. Всего использовано `k+n-1` цветов. Проверим корректность. Внутри `A ∪ D` всё правильно по выбранной `k`-раскраске. Внутри `(B \\ D) ∪ C` всё правильно, потому что это та же раскраска `B ∪ C` с переименованными цветами, кроме того что первый цвет `C` стал цветом `k`; вершин из `B \\ D` первого цвета нет. Между `A` и `C` рёбер нет, а вершины из `D` не соединены с вершинами из `C` первого цвета, поскольку в исходной раскраске `B ∪ C` они имели один и тот же цвет. Значит, весь граф всегда раскрашивается в `k+n-1` цвет.\n\nОсталось показать, что меньше гарантировать нельзя. Построим пример. Возьмём `kn` вершин множества `B` как клетки таблицы из `n` строк и `k` столбцов; обозначим клетку в строке `i` и столбце `j` через `b_{ij}`. Добавим к каждому столбцу по вершине `a_j`; эти `k` вершин образуют множество `A` и попарно соединены, то есть `A` — клика. Добавим к каждой строке по вершине `c_i`; эти `n` вершин образуют множество `C` и тоже попарно соединены. Рёбер между `A` и `C` нет.\n\nВнутри `B` соединим две клетки тогда и только тогда, когда они лежат в разных строках и в разных столбцах. Вершину `a_j` соединим со всеми клетками `B`, кроме клеток столбца `j`; вершину `c_i` соединим со всеми клетками `B`, кроме клеток строки `i`.\n\nПодграф `A ∪ B` раскрашивается в `k` цветов по столбцам: цвет `j` получают `a_j` и все клетки столбца `j`. Две клетки одного столбца не соединены, а `a_j` не соединена с клетками своего столбца. Подграф `B ∪ C` раскрашивается в `n` цветов по строкам: цвет `i` получают `c_i` и все клетки строки `i`; две клетки одной строки не соединены, а `c_i` не соединена с клетками своей строки.\n\nДокажем, что весь построенный граф нельзя раскрасить в `k+n-2` цветов. Предположим, что такая раскраска есть. Так как `A` — клика размера `k`, на `A` использованы `k` различных цветов; так как `C` — клика размера `n`, на `C` использованы `n` различных цветов. Пусть `m` — число цветов, которые встречаются и на `A`, и на `C`. Тогда на `A ∪ C` использовано `k+n-m` цветов, поэтому из предположения о `k+n-2` цветах следует `m ≥ 2`, а вне цветов, уже использованных на `A ∪ C`, осталось не более `m-2` цветов.\n\nРассмотрим общие цвета. Для каждого такого цвета есть ровно одна вершина `a_j` этого цвета и ровно одна вершина `c_i` этого цвета. Перенумеруем эти пары как `(a_{j_1},c_{i_1}),...,(a_{j_m},c_{i_m})` по общим цветам и рассмотрим `m` клеток `b_{i_1j_2}, b_{i_2j_3}, ..., b_{i_mj_1}` (индексы циклические). Они лежат в попарно разных строках и попарно разных столбцах, значит, образуют клику в `B`.\n\nПокажем, что ни одна из этих клеток не может получить цвет, уже встречающийся на `A ∪ C`. Например, клетка `b_{i_sj_{s+1}}` не соединена только с вершинами `a_{j_{s+1}}` и `c_{i_s}` среди вершин `A ∪ C`. Но цвет `a_{j_{s+1}}` встречается также на вершине `c_{i_{s+1}}`, а она лежит в другой строке и потому соединена с `b_{i_sj_{s+1}}`; цвет `c_{i_s}` встречается также на вершине `a_{j_s}`, а она лежит в другом столбце и потому соединена с `b_{i_sj_{s+1}}`. Все остальные вершины `A ∪ C` также смежны с этой клеткой. Следовательно, каждая из выбранных `m` клеток должна иметь цвет вне `A ∪ C`.\n\nНо выбранные клетки образуют клику размера `m`, значит, им нужны `m` различных новых цветов, тогда как новых цветов было не более `m-2`. Противоречие. Поэтому построенный граф требует как минимум `k+n-1` цветов, и минимальное гарантированное число равно `k+n-1`.",
