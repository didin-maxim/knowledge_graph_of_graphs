        "title": "Оригинальная формулировка",
        "text": "Вершины графа разбиты на три множества `A`, `B`, `C` так, что вершины из `A` не связаны рёбрами с вершинами из `C`.\n\nИзвестно, что `A ∪ B` можно правильно раскрасить в `k` цветов, а `B ∪ C` — в `n` цветов. В какое минимальное количество цветов можно с гарантией правильно раскрасить все вершины этого графа?",
