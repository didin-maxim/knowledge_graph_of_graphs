        "title": "Original statement",
        "text": "Пусть `1 < m < n-1`. В компании из `n` человек некоторые знакомы друг с другом, причем среди любых `m` человек одно и то же количество пар знакомых. Сколько пар знакомых может быть среди всех `n` человек?",
