  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Развернутое решение",
      "text": "Ответ: `n(n-1)/2`.\n\nРассмотрим граф знакомств: вершины — люди, ребра — пары знакомых. По условию число ребер в любом индуцированном подграфе на `m` вершинах одно и то же. Обозначим это число через `q`.\n\nВозьмем двух различных людей `x` и `y` и любое множество `S` из `m-1` остальных людей. В двух группах `S \\cup {x}` и `S \\cup {y}` по `m` человек, поэтому в них по `q` пар знакомых. Пары внутри самого `S` в этих двух подсчетах одинаковы, значит, число знакомых у `x` среди людей из `S` равно числу знакомых у `y` среди людей из `S`.\n\nПоложим `k=m-1`. Тогда `1 <= k <= n-3`. Итак, для любых разных `x,y` сумма величин `a_z`, где `a_z=1`, если `x` знаком с `z`, и `a_z=-1`, если только `y` знаком с `z` (а если оба знакомы или оба не знакомы с `z`, то `a_z=0`), равна нулю по любому `k`-элементному множеству `S` из остальных вершин. Отсюда все `a_z` равны между собой: при `k=1` это сразу следует из одноэлементных множеств, а при `k>1` можно сравнить два таких множества, отличающихся только одной вершиной. Но сумма по любому `k`-множеству равна нулю, значит, это общее значение равно нулю. Поэтому для любых трех различных людей `x,y,z` человек `z` либо знаком с обоими `x,y`, либо не знаком ни с одним из них.\n\nТеперь покажем, что все пары людей имеют один и тот же статус. Так как `m<n-1`, имеем `n>=4`, и для любой пары `a,b` можно выбрать третьего человека `c`. Применив предыдущий вывод к тройке `a,b,c`, получаем, что знакомство `a` с `b` имеет тот же статус, что и знакомство `c` с `b`. Перенося так статус через общую вершину, видим, что все пары в компании либо знакомы, либо все не знакомы.\n\nВ условии сказано, что в компании есть знакомые друг с другом люди. Следовательно, невозможен случай, когда знакомых пар нет. Значит, знакомы все со всеми, и общее число пар знакомых равно числу всех пар людей: `C(n,2)=n(n-1)/2`.",
