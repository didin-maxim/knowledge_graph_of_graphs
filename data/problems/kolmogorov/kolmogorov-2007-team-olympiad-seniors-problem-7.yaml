  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Развернутое решение",
      "text": "Ответ в формулировке карточки: \\(\\binom n2=n(n-1)/2\\). Если фразу ``некоторые знакомы друг с другом'' не понимать как существование хотя бы одной знакомой пары, то дополнительно возможен пустой граф и ответ был бы \\(0\\) или \\(\\binom n2\\).\n\nРассмотрим граф знакомств: вершины -- люди, рёбра -- пары знакомых. По условию число рёбер в любом индуцированном подграфе на \\(m\\) вершинах одно и то же; обозначим это число через \\(q\\).\n\nВозьмём двух различных людей \\(x\\) и \\(y\\) и любое множество \\(S\\) из \\(m-1\\) остальных людей. В двух группах \\(S\\cup\\{x\\}\\) и \\(S\\cup\\{y\\}\\) по \\(m\\) человек, поэтому в них по \\(q\\) пар знакомых. Пары внутри самого \\(S\\) в этих двух подсчётах одинаковы; значит, число знакомых у \\(x\\) среди людей из \\(S\\) равно числу знакомых у \\(y\\) среди людей из \\(S\\).\n\nПоложим \\(k=m-1\\). Из \\(1<m<n-1\\) следует \\(1\\le k\\le n-3\\), так что после выбора \\(x,y\\) остаётся достаточно вершин для сравнения \\(k\\)-подмножеств. Для каждой оставшейся вершины \\(z\\) зададим\n\\[\na_z=\n\\begin{cases}\n1,& \\text{если }x\\text{ знаком с }z\\text{, а }y\\text{ не знаком с }z,\\\\\n-1,& \\text{если }y\\text{ знаком с }z\\text{, а }x\\text{ не знаком с }z,\\\\\n0,& \\text{если статусы знакомств с }x\\text{ и }y\\text{ одинаковы.}\n\\end{cases}\n\\]\nТолько что доказанное равенство означает, что сумма \\(\\sum_{z\\in S}a_z\\) равна нулю для любого \\(k\\)-элементного множества \\(S\\) из остальных вершин.\n\nОтсюда все числа \\(a_z\\) равны. При \\(k=1\\) это немедленно следует из одноэлементных множеств. При \\(k>1\\) берём две вершины \\(u,v\\) и дополняем их одним и тем же множеством \\(R\\) размера \\(k-1\\), не содержащим \\(u,v\\); это возможно, потому что всего остальных вершин \\(n-2\\), а \\(k\\le n-3\\). Сравнение сумм по \\(R\\cup\\{u\\}\\) и \\(R\\cup\\{v\\}\\) даёт \\(a_u=a_v\\). Но сумма по любому \\(k\\)-множеству равна нулю, значит общее значение всех \\(a_z\\) равно нулю.\n\nИтак, для любых трёх различных людей \\(x,y,z\\) вершина \\(z\\) имеет одинаковый статус относительно \\(x\\) и \\(y\\): она либо знакома с обоими, либо не знакома ни с одним из них. Теперь возьмём любые две пары людей. Так как \\(n\\ge4\\), любые два ребра полного графа пар можно связать цепочкой пар, в которой соседние пары имеют общую вершину; например, статус пары \\(ab\\) совпадает со статусом \\(cb\\), а затем со статусом \\(cd\\), где \\(c,d\\) выбираются отличными от нужных вершин. Предыдущее свойство переносит статус через общую вершину, поэтому все пары людей имеют один и тот же статус.\n\nСледовательно, граф знакомств либо пустой, либо полный. В условии карточки сказано, что знакомые друг с другом люди есть; пустой граф исключён. Значит, знакомы все со всеми, и число знакомых пар равно \\(\\binom n2=n(n-1)/2\\).",
