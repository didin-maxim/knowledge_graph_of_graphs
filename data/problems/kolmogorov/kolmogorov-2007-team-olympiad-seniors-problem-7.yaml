      "id": "sol-official-compressed",
      "title": "??????????? ???????, ?????? ???????",
      "text": "Ответ: `n(n-1)/2`, то есть знакомы должны быть все со всеми.\n\nВ официальном решении рассматривают произвольную группу из `m+1` человек и замечают, что каждый ее участник имеет одно и то же число знакомых внутри этой группы: иначе после удаления разных людей число пар знакомых среди оставшихся `m` менялось бы.\n\nПредположим теперь, что существуют двое незнакомых. Тогда можно выбрать группу `L` из `m+1` человек, где есть и такая незнакомая пара, и какая-то знакомая пара. Замена одного человека на внешнего человека `C` приводит к новой группе `M`; сравнение степеней внутри `L` и `M` показывает, что `C` должен иметь те же знакомства внутри `L`, что и замененный человек.\n\nПовторяя рассуждение с другой заменой, получают невозможное изменение суммарных степеней. Значит, незнакомых пар нет, и весь граф знакомств полный.",
