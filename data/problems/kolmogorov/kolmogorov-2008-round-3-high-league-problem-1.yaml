  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Официальное решение, сжатое изложение",
      "text": "Ответ: `5000`.\n\nДля нижней оценки официальное решение замечает, что каждая вершина должна иметь степень не меньше 3: при меньшей степени нельзя обеспечить гамильтонов путь с произвольными концами. Тогда сумма степеней не меньше `3 * 3332 + 4`, откуда число ребер не меньше 5000.\n\nДля верхней оценки строится конкретный пример на 3333 вершинах с 5000 ребрами: берется прямоугольная решетка `2 x 1666` и добавляется специальная вершина, соединенная с двумя угловыми. В полученном графе между любыми двумя вершинами можно выписать гамильтонов путь.\n\nЗначит, минимальное число ребер действительно равно `5000`.",
