      "id": "sol-official-compressed",
      "title": "Развернутое решение",
      "text": "Ответ: `5000`.\n\nСначала докажем нижнюю оценку. Возьмем любые две смежные вершины `a` и `b`. По условию есть гамильтонов путь с концами `a` и `b`; добавив ребро `ab`, получаем гамильтонов цикл. Значит, степень каждой вершины не меньше `2`.\n\nПокажем, что вершины степени `2` тоже невозможны. Пусть `v` - такая вершина, а ее соседи на найденном гамильтоновом цикле равны `x` и `y`. По условию существует гамильтонов путь с концами `x` и `y`. В этом пути вершина `v` не является концом, поэтому обе соседние с ней в пути вершины должны быть ее соседями в графе, то есть это `x` и `y`. Но тогда путь имеет вид `x-v-y` в соответствующем месте; поскольку `x` и `y` - концы всего пути, других вершин в нем быть не может. Это противоречит тому, что вершин `3333`. Следовательно, минимальная степень графа не меньше `3`.\n\nТогда сумма степеней не меньше `3 * 3333 = 9999`. Она четна, поэтому на самом деле не меньше `10000`, и число ребер не меньше `5000`.\n\nОсталось построить пример. Возьмем лестницу из двух горизонтальных рядов по `1666` вершин: верхние вершины обозначим `u_1, ..., u_1666`, нижние - `v_1, ..., v_1666`; проведем все горизонтальные ребра `u_i u_{i+1}`, `v_i v_{i+1}` и все вертикальные ребра `u_i v_i`. Добавим особую вершину `A` и соединим ее с четырьмя углами `u_1, v_1, u_1666, v_1666`. Вершин получилось `2 * 1666 + 1 = 3333`, а ребер `2 * 1665 + 1666 + 4 = 5000`.\n\nПроверим гамильтонову связность этого графа. Сначала пусть обе заданные вершины `B` и `C` лежат на лестнице; если нужно, отразим рисунок так, чтобы `B` была не правее `C`. Идем из `B` змейкой по полосе между столбцами `B` и `C`: если между соответствующими вертикалями есть `k > 0` клеток, то делаем `k - 1` шагов вправо, один вертикальный шаг и `k - 1` шагов влево; при `k = 0` эта начальная часть пуста. Из полученной вершины продолжаем такую же змейку влево до левого края лестницы. Из вершины, соседней с `C` по вертикали, ведем вторую змейку вправо до правого края. Две змейки покрывают все вершины лестницы ровно по одному разу и оканчиваются в углах; соединяем их через особую вершину `A`, которая смежна с обоими углами. Получается гамильтонов путь с концами `B` и `C`.\n\nТеперь пусть один конец равен `A`, а другой конец `B` лежит на лестнице. Отразим рисунок при необходимости и пусть слева от столбца `B` находится `k` клеток. Начиная из `B`, сначала обходим левую часть: делаем `k` шагов вправо, один вертикальный шаг и `k` шагов влево. После этого идем змейкой вправо по оставшейся части лестницы до правого угла и последним шагом приходим в `A`. Такой путь также проходит по всем вершинам ровно один раз.\n\nИтак, построенный граф удовлетворяет условию и имеет `5000` ребер. Вместе с нижней оценкой это дает искомый минимум.",
