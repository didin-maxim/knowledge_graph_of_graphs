      "id": "sol-official-compressed",
      "title": "Проверенное самодостаточное решение",
      "text": "Нам достаточно следующих трехзначных простых блоков без цифры `1`:\n`337, 373, 379, 733, 739, 773, 797, 937, 977, 997`.\nКаждое из них непосредственно проверяется как простое, и ниже мы будем строить запись так, чтобы все ее трехзначные фрагменты попадали в этот список.\n\nПостроим ориентированный граф состояний. Его вершинами будут двузначные окончания, которые встречаются в перечисленных блоках. Из вершины `ab` проведем стрелку в вершину `bc`, если трехзначное число `abc` входит в список допустимых блоков. Тогда бесконечный путь в этом графе ровно соответствует бесконечной десятичной записи: каждая новая стрелка добавляет одну следующую цифру, а каждый блок из трех подряд идущих цифр оказывается одним из разрешенных простых чисел.\n\nВ графе есть два ориентированных цикла с общей начальной вершиной:\n`33 -> 37 -> 73 -> 33`, что соответствует блокам `337, 373, 733`, и\n`33 -> 37 -> 79 -> 97 -> 77 -> 73 -> 33`, что соответствует блокам `337, 379, 797, 977, 773, 733`.\nТеперь будем из вершины `33` каждый раз проходить один из этих двух циклов, выбирая их непериодически, например по последовательности длин блоков, которая не становится периодической. Полученная бесконечная десятичная дробь не содержит цифры `1`, и любой ее трехзначный фрагмент лежит внутри одного из выбранных циклов или проходит через общую вершину `33`; в обоих случаях он входит в список простых блоков.\n\nОсталось объяснить иррациональность. Десятичная запись рационального числа с некоторого места периодична. Если же последовательность выбора короткого и длинного цикла непериодична, то и вся построенная десятичная запись непериодична: возвращения в состояние `33` разбивают ее на блоки двух разных длин, и периодическая запись давала бы периодическую последовательность этих блоков. Значит, построенное число иррационально.",
