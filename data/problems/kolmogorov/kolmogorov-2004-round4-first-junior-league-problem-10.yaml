      "title": "??????????? ???????, ?????? ???????",
      "text": "В официальном решении выписываются допустимые трехзначные простые блоки:\n`337, 373, 379, 733, 739, 773, 797, 937, 977, 997`.\n\nПосле этого строится граф Уфнаровского на двузначных состояниях: вершина задает две\nпоследние цифры, а ребро означает, что к ним можно приписать следующую цифру так, чтобы\nполучился допустимый трехзначный простой блок.\n\nВ этом графе находятся два ориентированных цикла, например\n`33 -> 37 -> 73 -> 33` и `33 -> 37 -> 79 -> 97 -> 77 -> 73 -> 33`.\nЕсли обходить эти циклы непериодически, получается бесконечная десятичная запись без\nединиц, в которой каждый блок из трех подряд идущих цифр прост. Непериодичность гарантирует\nиррациональность числа.",
