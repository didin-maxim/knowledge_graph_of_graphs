  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Официальное решение, сжатое изложение",
      "text": "Построим ориентированный граф `T`, вершины которого соответствуют городам, а дуги — авиарейсам. Это турнир. Пусть `w` — столица, а `A` и `B` — подграфы, соответствующие двум республикам.\n\nИспользуем лемму о склейке. Если `P` и `Q` — два непересекающихся ориентированных пути в турнире, то существует путь `R` на всех вершинах этих двух путей, в котором вершины `P` идут в своем прежнем порядке и вершины `Q` тоже идут в своем прежнем порядке. Лемма доказывается индукцией: очередную вершину второго пути вставляют в уже построенный путь перед первой вершиной, в которую из нее идет дуга; если такой вершины нет, вставляют в конец. Пустой путь разрешен.\n\nВозьмем произвольный гамильтонов путь `P` в `A` и произвольный гамильтонов путь `Q` в `B`. Оба проходят через `w`, поэтому их можно записать как `P = P1 w P2` и `Q = Q1 w Q2`, где некоторые части могут быть пустыми. По лемме склеим `P1` с `Q1`, получив путь `R1`, и склеим `P2` с `Q2`, получив путь `R2`.\n\nЕсли `R1` непуст, его последняя вершина является последней вершиной одного из путей `P1`, `Q1`, а из этой вершины есть дуга в `w`, потому что она непосредственно предшествовала `w` в соответствующем республиканском пути. Аналогично, если `R2` непуст, из `w` есть дуга в первую вершину `R2`. Поэтому `R = R1 w R2` — гамильтонов путь всего графа `T`.\n\nРазным парам республиканских путей соответствуют разные построенные глобальные пути: из глобального пути, сохраняющего порядки в `A` и `B`, его ограничения на вершины `A` и `B` восстанавливают исходные `P` и `Q`. Значит, пары гамильтоновых путей республик инъективно отображаются в гамильтоновы пути всей страны, откуда `N >= N1 * N2`.",
