  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Official solution, compressed",
      "text": "Официальное решение строит ориентированный граф `T`, вершины которого соответствуют городам, а дуги — авиарейсам. Пусть `w` — столица, а `A` и `B` — подграфы, соответствующие двум республикам.\n\nДоказывается лемма о склейке двух непересекающихся ориентированных путей `P` и `Q` в полном ориентированном графе: можно построить путь `R` на вершинах этих двух путей, в котором вершины `P` и `Q` сохраняют свой порядок.\n\nТеперь берутся любые гамильтоновы пути `P` в графе `A` и `Q` в графе `B`. Каждый из них проходит через столицу `w`, поэтому их можно записать в виде `P = P1 w P2` и `Q = Q1 w Q2`. По лемме существуют склейки `R1` для `P1` и `Q1` и `R2` для `P2` и `Q2`, после чего путь `R = R1 w R2` становится гамильтоновым путем во всей стране.\n\nЗначит, каждому гамильтонову пути во всей стране соответствует пара гамильтоновых путей в республиках, и число глобальных маршрутов не превосходит `N1 * N2`.",
