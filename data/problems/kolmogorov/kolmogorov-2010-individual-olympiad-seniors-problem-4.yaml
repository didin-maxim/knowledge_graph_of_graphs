        "id": "stmt-original",
        "title": "Оригинальная формулировка",
        "text": "Каждые два города страны Гельбии соединены односторонним авиарейсом. Страна разбита на две республики с общей столицей: каждый город, кроме столицы, принадлежит ровно одной из республик, а столица принадлежит обеим.\n\nПусть `N` — число маршрутов, проходящих по всем городам всей страны ровно по одному разу и не возвращающихся в исходный город. Аналогично определены числа `N1` и `N2` для двух республик.\n\nДокажите, что `N >= N1 * N2`.",
