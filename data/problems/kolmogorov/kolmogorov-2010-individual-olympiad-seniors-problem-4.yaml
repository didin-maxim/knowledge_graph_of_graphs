      "title": "Graph-theory role in kolmogorov-2010-individual-olympiad-seniors-problem-4",
      "text": "В официальном решении задача целиком переводится на язык ориентированных графов, гамильтоновых путей и склейки путей в турнире. Эта графовая модель является основной, а не факультативной.",
