  "statements": {
    "original": [
      {
        "id": "stmt-original",
        "text": "Дан прямоугольник \\(20\\times12\\), разбитый на единичные клетки. Пусть \\(A\\) и \\(B\\) — концы стороны длины \\(20\\), и нужно попасть из клетки, прилегающей к вершине \\(A\\), в клетку, прилегающую к вершине \\(B\\) вдоль этой стороны. Разрешено переходить из одной клетки в другую, если расстояние между центрами этих клеток равно \\(\\sqrt r\\). Докажите, что такой переход невозможен для любого целого \\(r\\), делящегося на \\(2\\) или на \\(3\\).",
        "source_id": "src-secondary-imo-1996-shortlist",
        "status": "needs_human_review",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [],
        "title": "Условие: режим r делится на 2 или 3",
        "distinct_from": [
          "stmt-graph"
        ]
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Рассмотрим граф, вершинами которого являются клетки доски \\(20\\times12\\), пронумерованные центрами \\((x,y)\\), где \\(1\\le x\\le20\\), \\(1\\le y\\le12\\). Две вершины соединены ребром, если евклидово расстояние между центрами соответствующих клеток равно \\(\\sqrt r\\). Докажите, что для каждого положительного целого \\(r\\), делящегося на \\(2\\) или на \\(3\\), вершины \\((1,1)\\) и \\((20,1)\\) лежат в разных компонентах этого графа.",
        "source_id": "src-secondary-imo-1996-shortlist",
