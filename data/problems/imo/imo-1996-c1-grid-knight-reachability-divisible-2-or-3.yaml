  "ideas": [
    {
      "id": "idea-residue-obstruction",
      "title": "Инвариант остатка для всех ходов",
      "text": "Если \\(2\\mid r\\), любой допустимый вектор хода сохраняет \\(x+y\\pmod2\\). Если \\(3\\mid r\\), обе координаты каждого допустимого вектора кратны \\(3\\), поэтому сохраняются координаты по модулю \\(3\\).",
      "tags": [
        "coloring"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-modular-obstruction",
      "title": "Модульная раскраска разделяет старт и цель",
      "text": "Будем считать центры клеток точками целочисленной решётки; стартовая клетка имеет координаты \\((1,1)\\), а целевая — \\((20,1)\\). Каждый допустимый ход задаётся вектором \\((a,b)\\) с \\(a^2+b^2=r\\), причём после хода обе координаты остаются в пределах доски. Если \\(2\\mid r\\), то \\(a^2+b^2\\equiv0\\pmod2\\), откуда \\(a\\) и \\(b\\) имеют одну чётность. Значит \\(a+b\\) чётно, и величина \\(x+y\\pmod2\\) не меняется при любом ходе. Но для \\((1,1)\\) она равна \\(0\\), а для \\((20,1)\\) равна \\(1\\), поэтому путь невозможен. Если \\(3\\mid r\\), то квадраты по модулю \\(3\\) равны только \\(0\\) или \\(1\\), и равенство \\(a^2+b^2\\equiv0\\pmod3\\) возможно лишь при \\(a\\equiv b\\equiv0\\pmod3\\). Следовательно, каждый ход сохраняет обе координаты по модулю \\(3\\). У клеток \\((1,1)\\) и \\((20,1)\\) первые координаты различны по модулю \\(3\\), так что они лежат в разных компонентах графа ходов.",
