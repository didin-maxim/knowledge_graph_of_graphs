      "id": "sol-official-compressed",
      "title": "Сжатое официальное решение",
      "text": "Официальное решение сразу переформулирует задачу на языке графов. Дана графовая степень: 1010 вершин степени 1009 и 1009 вершин степени 1010. Операция выбирает путь \\(B-A-C\\), где \\(BC\\) отсутствует, удаляет \\(AB,AC\\) и добавляет \\(BC\\), то есть уменьшает число рёбер на 1. Сначала доказывается связность исходного графа. Затем анализируется, как операция действует на компоненты и степени: пока есть вершина степени хотя бы 2, можно выбрать подходящих соседей и выполнить операцию, не разрушая нужных инвариантов. Повторяя, уменьшаем число рёбер до графа, все компоненты которого имеют размер не больше 2, то есть степени всех вершин не превосходят 1.",
