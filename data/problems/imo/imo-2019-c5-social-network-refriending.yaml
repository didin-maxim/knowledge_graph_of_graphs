        "text": "Пусть \\(m\\ge 1\\), и пусть \\(G\\) - простой граф на \\(2m+1\\) вершинах, в котором \\(m+1\\) вершин имеют степень \\(m\\), а \\(m\\) вершин имеют степень \\(m+1\\). Разрешена операция пере-дружбы: если вершина \\(A\\) смежна с двумя различными вершинами \\(B\\) и \\(C\\), не смежными друг с другом, то можно удалить ребра \\(AB\\) и \\(AC\\) и добавить ребро \\(BC\\). Докажите, что после конечного числа таких операций можно получить граф, в котором степень каждой вершины не превосходит 1.",
