  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Полное доказательство через инвариант компонент",
      "text": "Перейдем к языку графов: пользователи - вершины, дружбы - ребра. Операция удаляет два ребра \\(AB,AC\\) и добавляет одно ребро \\(BC\\), где \\(B\\) и \\(C\\) раньше не были смежны. Поэтому при каждой операции число ребер уменьшается на 1, а четности степеней всех вершин не меняются: у \\(A\\) степень уменьшается на 2, а у \\(B\\) и \\(C\\) одна инцидентная связь теряется и одна приобретается.\n\nСначала заметим, что исходный граф связен. Действительно, для любых двух вершин сумма их степеней не меньше \\(1009+1009=2018\\). Если две вершины не смежны и не имеют общего соседа, то все их соседи лежали бы среди остальных \\(2017\\) вершин и были бы различны, что невозможно. Значит любые две вершины либо соединены ребром, либо имеют общего соседа. Кроме того, исходный граф не полон, а вершины степени 1009 имеют нечетную степень. Значит исходный граф удовлетворяет условию \\((*)\\): каждая компонента связности с хотя бы тремя вершинами не является полным графом и содержит вершину нечетной степени.\n\nДокажем ключевое утверждение. Если граф удовлетворяет \\((*)\\) и в нем есть вершина степени хотя бы 2, то можно выполнить одну пере-дружбу так, чтобы новый граф снова удовлетворял \\((*)\\). Возьмем компоненту \\(H\\), содержащую вершину степени хотя бы 2. Тогда в \\(H\\) как минимум три вершины, и по \\((*)\\) эта компонента не полна. Нам понадобится вершина \\(A\\) в \\(H\\), у которой есть два несмежных соседа. Такая вершина существует: возьмем максимальный полный подграф \\(K\\) компоненты \\(H\\). Так как \\(H\\) связна и не полна, некоторая вершина \\(A\\in K\\) имеет соседа \\(C\\notin K\\); по максимальности \\(K\\) вершина \\(C\\) не смежна хотя бы с одной вершиной \\(B\\in K\\). Тогда \\(B\\) и \\(C\\) - несмежные соседи \\(A\\).\n\nУдалим теперь вершину \\(A\\) из \\(H\\). Оставшийся граф распадается на компоненты \\(H_1,\\ldots,H_k\\), причем \\(A\\) соединена хотя бы с одной вершиной каждой из них. Разберем случаи.\n\n1. Пусть \\(k\\ge 2\\), и к некоторой компоненте \\(H_i\\) из \\(A\\) идет хотя бы два ребра. Выберем соседа \\(B\\in H_i\\) вершины \\(A\\) и соседа \\(C\\) вершины \\(A\\) в другой компоненте \\(H_j\\). Вершины \\(B\\) и \\(C\\) не смежны. После удаления \\(AB,AC\\) и добавления \\(BC\\) компонента \\(H\\) остается связной: у \\(A\\) еще есть связь с \\(H_i\\), а ребро \\(BC\\) соединяет \\(H_i\\) с \\(H_j\\). Четности степеней сохранились, значит нечетная вершина осталась; полным графом эта компонента стать не могла, потому что число ребер уменьшилось.\n\n2. Пусть \\(k\\ge 2\\), и к каждой \\(H_i\\) из \\(A\\) идет ровно одно ребро. Рассмотрим подграф, индуцированный \\(H_i\\) и вершиной \\(A\\). В нем степень \\(A\\) равна 1, поэтому, поскольку число вершин нечетной степени в любом графе четно, внутри \\(H_i\\) есть вершина нечетной степени; ее степень в исходном графе та же. Выберем любых двух соседей \\(B,C\\) вершины \\(A\\) из разных компонент и выполним пере-дружбу. Получаются две компоненты вместо \\(H\\). Каждая новая компонента, если в ней хотя бы три вершины, содержит одну из прежних \\(H_i\\), а значит содержит вершину нечетной степени. Такая компонента также не полна: либо она содержит вершину \\(A\\), которая не соединена со всеми вершинами соответствующих \\(H_i\\), либо она составлена из по крайней мере двух старых компонент, между которыми добавлено только одно ребро.\n\n3. Пусть \\(k=1\\), и из \\(A\\) в единственную компоненту \\(H_1\\) идет хотя бы три ребра. По выбору \\(A\\) у нее есть два несмежных соседа \\(B,C\\). Выполним пере-дружбу с этими вершинами. Связность не нарушится, потому что у \\(A\\) останется еще один сосед в \\(H_1\\); далее, как в первом случае, четность дает нечетную вершину, а уменьшение числа ребер не позволяет получить полный граф.\n\n4. Остался случай \\(k=1\\), и у \\(A\\) ровно два соседа \\(B,C\\) в \\(H_1\\). Они не смежны. Если удалить \\(AB,AC\\) и добавить \\(BC\\), то \\(A\\) станет изолированной, а остальные вершины образуют вторую компоненту. В ней есть вершина нечетной степени, так как четности степеней всех вершин сохранились, а степень \\(A\\) была и осталась четной. Если эта вторая компонента не полна, все хорошо. Если же она стала полным графом хотя бы на трех вершинах, то до добавления \\(BC\\) граф \\(H_1\\) был полным графом без ребра \\(BC\\). В \\(H_1\\) есть третья вершина \\(D\\); более того, вершин в \\(H_1\\) хотя бы 4, иначе исходная компонента была бы циклом длины 4 и не имела бы вершин нечетной степени, что противоречит \\((*)\\). Тогда вместо предыдущей операции сделаем другую: удалим \\(BA\\) и \\(BD\\), добавим \\(AD\\). Здесь \\(A\\) и \\(D\\) не были смежны, а связность сохраняется: \\(A\\) остается связана с \\(C\\), вершина \\(D\\) соединяется с \\(A\\), а оставшаяся часть \\(H_1\\) не распадается. Поэтому снова применим рассуждение первого случая.\n\nКлючевое утверждение доказано. Теперь начинаем с исходного графа и повторяем описанную операцию, пока существует вершина степени хотя бы 2. На каждом шаге условие \\((*)\\) сохраняется, а число ребер уменьшается на 1, поэтому процесс не может продолжаться бесконечно. Когда он остановится, вершин степени хотя бы 2 уже нет, то есть степень каждой вершины не превосходит 1. Это и требовалось доказать.",
