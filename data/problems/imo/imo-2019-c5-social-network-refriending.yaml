        "title": "Условие",
        "text": "В некоторой социальной сети 2019 пользователей; дружба является симметричным отношением. Изначально у 1010 человек по 1009 друзей, а у 1009 человек по 1010 друзей. Можно многократно выполнять такую операцию: если \\(A\\) дружит с \\(B\\) и \\(C\\), а \\(B\\) и \\(C\\) не дружат, то дружбы \\(AB\\) и \\(AC\\) исчезают, а дружба \\(BC\\) появляется. Докажите, что независимо от начальных дружб существует последовательность таких операций, после которой у каждого пользователя не более одного друга.",
