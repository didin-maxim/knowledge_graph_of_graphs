      {
        "id": "stmt-graph",
        "text": "Пусть \\(G\\) — простой граф на 2019 вершинах, в котором 1010 вершин имеют степень 1009, а 1009 вершин имеют степень 1010. Разрешена следующая операция: если \\(B-A-C\\) — путь длины 2 и ребро \\(BC\\) отсутствует, то удалить рёбра \\(AB\\) и \\(AC\\) и добавить ребро \\(BC\\). Докажите, что после конечного числа таких операций можно получить граф, в котором степень каждой вершины не превосходит 1.",
