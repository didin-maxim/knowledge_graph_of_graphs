        "title": "Условие",
        "text": "В социальной сети 2019 пользователей; дружба симметрична. У 1010 человек по 1009 друзей, у 1009 человек по 1010 друзей. Можно многократно выполнять операцию: если \\(A\\) дружит с \\(B\\) и \\(C\\), а \\(B\\) и \\(C\\) не дружат, то дружбы \\(AB,AC\\) исчезают, а \\(BC\\) появляется. Докажите, что можно прийти к состоянию, где у каждого пользователя не более одного друга.",
