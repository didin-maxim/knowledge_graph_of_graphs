      {
        "id": "stmt-original",
        "text": "Для конечного графа \\(G\\) пусть \\(f(G)\\) — число треугольников, а \\(g(G)\\) — число тетраэдров, то есть копий \\(K_4\\), образованных рёбрами \\(G\\). Найдите наименьшую константу \\(c\\), такую что \\(g(G)^3\\le c f(G)^4\\) для любого графа \\(G\\).",
