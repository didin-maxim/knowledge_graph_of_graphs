  "solutions": [
    {
      "id": "sol-secondary-sketch",
      "title": "Сжатый графовый разбор",
      "text": "Для полного графа \\(K_n\\) имеем \\(f=\\binom n3\\), \\(g=\\binom n4\\), и отношение \\(g^3/f^4\\) стремится к \\(3/32\\), поэтому \\(c\\) не может быть меньше \\(3/32\\). Верхняя оценка доказывается через стандартное сравнение чисел клик: суммируют по вершинам и рёбрам числа треугольников и тетраэдров, применяя выпуклость/Гёльдера к локальным количествам общих соседей. В результате получается \\(g(G)^3\\le (3/32)f(G)^4\\). Карточка фиксирует графовую суть; перед публичной версией стоит восстановить полный официальный вывод неравенства.",
