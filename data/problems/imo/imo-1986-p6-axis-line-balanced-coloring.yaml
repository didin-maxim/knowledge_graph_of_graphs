      "id": "sol-graph-review",
      "title": "Сжатое графовое решение",
      "text": "Создадим двудольный граф: слева все занятые горизонтали, справа все занятые вертикали, а точка (x,y) даёт ребро между своей горизонталью и вертикалью. Достаточно раскрасить рёбра графа в два цвета так, чтобы у каждой вершины разность чисел инцидентных рёбер двух цветов была не больше 1. В каждой компоненте добавим при необходимости фиктивные рёбра, чтобы все степени стали чётными, разложим на эйлеровы циклы и покрасим рёбра каждого цикла попеременно. После удаления фиктивных рёбер баланс в каждой вершине нарушается не более чем на 1. Возвращаясь к точкам, получаем требуемую раскраску.",
