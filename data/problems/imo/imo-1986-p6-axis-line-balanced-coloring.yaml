  "statements": {
    "original": [
      {
        "id": "stmt-original",
        "text": "Дано конечное множество точек с целыми координатами на плоскости. Можно ли раскрасить часть точек в красный цвет, а остальные в белый так, чтобы на каждой прямой, параллельной одной из координатных осей, числа красных и белых точек отличались не более чем на 1?",
        "status": "needs_human_review",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [],
        "distinct_from": [
          "stmt-graph"
        ],
        "title": "Условие",
        "source_id": "src-imomath-imo-1986"
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Построим двудольный граф: строки и столбцы — вершины, каждая точка — ребро между своей строкой и своим столбцом. Нужно 2-раскрасить рёбра так, чтобы в каждой вершине числа двух цветов отличались не более чем на 1.",
        "status": "needs_human_review",
