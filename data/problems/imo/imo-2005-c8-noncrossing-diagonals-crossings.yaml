  "solutions": [
    {
      "id": "sol-reviewed-web",
      "title": "Полное решение по IMO Compendium",
      "text": "Ответ: \\(\\left\\lceil 3(n-3)^2/4\\right\\rceil\\). Назовём одну раскраску зелёной, другую красной. Для зелёной диагонали \\(d\\) пусть \\(C_d\\) — число красных диагоналей, пересекающих \\(d\\). Нужно оценить \\(\\sum C_d\\) по всем зелёным диагоналям. Возьмём две непересекающиеся зелёные диагонали \\(d_i,d_j\\). Пусть часть многоугольника между ними имеет \\(m\\) вершин. Красная диагональ, пересекающая обе эти зелёные диагонали, должна иметь один конец в этой части и другой конец вне её; таких диагоналей не больше \\(n-m-1\\). Остальные красные диагонали, которые могут пересекать хотя бы одну из \\(d_i,d_j\\), дают не больше \\(m-2\\) дополнительных пересечений: внутри части красные диагонали не пересекаются друг с другом и каждая из них может выйти через границу не более одного раза относительно пары \\(d_i,d_j\\). Поэтому \\(C_{d_i}+C_{d_j}\\le 2(n-m-1)+(m-2)=2n-m-4\\). Теперь упорядочим зелёные диагонали парами. В любой триангуляции есть две ушные диагонали, отсекающие два треугольника; назовём их \\(d_1,d_2\\). Удалим эти два треугольника и в оставшемся \\((n-2)\\)-угольнике снова выберем две ушные диагонали \\(d_3,d_4\\), и так далее, пока не останется треугольник или четырёхугольник. Если \\(n-3=2r+e\\), где \\(e\\in\\{0,1\\}\\), то для \\(k\\)-й пары область между \\(d_{2k-1}\\) и \\(d_{2k}\\) имеет по крайней мере \\(n-2k\\) вершин, значит \\(C_{d_{2k-1}}+C_{d_{2k}}\\le n+2k-4\\). Если осталась непарная диагональ, то она пересекает не больше \\(n-3\\) красных диагоналей. Суммируя, получаем \\(\\sum C_d\\le \\sum_{k=1}^{r}(n+2k-4)+e(n-3)=3r^2+e(3r+1)=\\left\\lceil 3(n-3)^2/4\\right\\rceil\\). Осталось показать достижимость. Обозначим вершины многоугольника \\(A_1,A_2,\\ldots,A_n\\) по порядку и положим \\(l=\\lfloor n/2\\rfloor+1\\). Покрасим зелёным диагонали \\(A_1A_i\\) при \\(3\\le i\\le l\\) и \\(A_lA_j\\) при \\(l+2\\le j\\le n\\). Покрасим красным диагонали \\(A_2A_i\\) при \\(l+1\\le i\\le n\\) и \\(A_{l+1}A_j\\) при \\(3\\le j\\le l-1\\). В каждом цвете это две веерные непересекающиеся семьи, всего ровно \\(n-3\\) диагоналей каждого цвета. Прямой подсчёт пересечений даёт \\((l-2)(n-l)+\\frac{(l-2)(l-3)}2+\\frac{(n-l-1)(n-l)}2+(n-l-1)(l-3)=\\left\\lceil 3(n-3)^2/4\\right\\rceil\\). Значит найденная верхняя оценка точна.",
