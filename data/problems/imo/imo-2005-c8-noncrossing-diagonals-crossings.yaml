        "id": "stmt-graph",
        "text": "Вершины выпуклого \\(n\\)-угольника считаются вершинами циклически упорядоченного множества. Выбраны два максимальных плоских графа на этом множестве вершин, каждый из которых содержит все стороны многоугольника и все его внутренние области являются треугольниками. Найдите максимально возможное число точек внутреннего пересечения между рёбрами первого графа и рёбрами второго графа, не являющимися сторонами многоугольника.",
