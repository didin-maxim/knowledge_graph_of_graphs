  "statements": {
    "original": [
      {
        "id": "stmt-original",
        "text": "В выпуклом n-угольнике некоторые n-3 диагонали окрашены в чёрный цвет, а другие n-3 диагонали — в красный. Диагонали одного цвета не пересекаются строго внутри многоугольника, хотя могут иметь общую вершину. Найти максимальное число внутренних точек пересечения диагоналей разных цветов.",
        "status": "needs_human_review",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [],
        "distinct_from": [
          "stmt-graph"
        ],
        "source_id": "src-secondary-imo-2005-shortlist",
        "title": "Условие"
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Вершины выпуклого \\(n\\)-угольника считаются вершинами циклически упорядоченного множества. Выбраны два максимальных плоских графа на этом множестве вершин, каждый из которых содержит все стороны многоугольника и все его внутренние области являются треугольниками. Найдите максимально возможное число точек внутреннего пересечения между рёбрами первого графа и рёбрами второго графа, не являющимися сторонами многоугольника.",
        "status": "needs_human_review",
