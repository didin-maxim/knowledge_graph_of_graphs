  "ideas": [
    {
      "id": "idea-pair-ears",
      "title": "Попарное снятие ушных диагоналей",
      "text": "В любой триангуляции есть две диагонали, отсекающие треугольники; их последовательно объединяют в пары, уменьшая оставшийся многоугольник.",
      "tags": [
        "planar_graphs"
      ],
      "status": "needs_human_review"
    },
    {
      "id": "idea-crossing-sum-bound",
      "title": "Оценка суммы пересечений по парам",
      "text": "Для двух зелёных диагоналей оценивается сумма чисел красных пересечений через размер части многоугольника между ними.",
      "tags": [
        "double_counting"
      ],
      "status": "needs_human_review"
    }
  ],
  "solutions": [
    {
      "id": "sol-reviewed-web",
      "title": "Сжатое решение после web review",
      "text": "Ответ: ceil(3(n-3)^2/4). Пусть C_d — число пересечений красных диагоналей с зелёной диагональю d. Для двух зелёных диагоналей d_i,d_j, между которыми лежит часть многоугольника с m вершинами, красных диагоналей, пересекающих обе, не больше n-m-1, а остальные relevant диагонали пересекают не более одной из них; отсюда C_{d_i}+C_{d_j} <= 2n-m-4. Затем зелёные диагонали упорядочивают попарно: сначала две ушные диагонали, отсекающие два треугольника, затем две такие же в оставшемся (n-2)-угольнике, и так далее. Для k-й пары соответствующий m не меньше n-2k, поэтому сумма по парам даёт верхнюю оценку ceil(3(n-3)^2/4). Конструкция из официального решения берёт две веерные семьи диагоналей одного цвета и две веерные семьи другого цвета около четырёх подходящих вершин; она достигает этой оценки.",
