  "solutions": [
    {
      "id": "sol-explicit-r73-path",
      "title": "Явный маршрут",
      "text": "Для \\(r=73=8^2+3^2\\) допустимы ходы типа \\((\\pm8,\\pm3)\\) и \\((\\pm3,\\pm8)\\). Явный путь от \\((1,1)\\) к \\((20,1)\\) таков: \\((1,1)\\to(4,9)\\to(7,1)\\to(10,9)\\to(2,6)\\to(10,3)\\to(13,11)\\to(16,3)\\to(19,11)\\to(11,8)\\to(19,5)\\to(11,2)\\to(14,10)\\to(17,2)\\to(20,10)\\to(12,7)\\to(4,4)\\to(7,12)\\to(10,4)\\to(13,12)\\to(16,4)\\to(8,1)\\to(11,9)\\to(14,1)\\to(17,9)\\to(20,1)\\). Все перечисленные точки лежат на доске, а разность соседних точек каждый раз равна одному из допустимых векторов \\((\\pm8,\\pm3)\\), \\((\\pm3,\\pm8)\\). Поэтому это путь в графе ходов, и переход при \\(r=73\\) возможен.",
