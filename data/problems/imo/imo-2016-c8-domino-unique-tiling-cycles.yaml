  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Официальное решение через диагональные циклы",
      "text": "Ответ: \\(2n\\). Сначала построим пример. Пронумеруем строки и столбцы числами \\(1,2,\\ldots,2n\\), а клетку в строке \\(i\\) и столбце \\(j\\) обозначим \\((i,j)\\). Для каждого \\(i=1,2,\\ldots,n\\) отметим клетки \\((i,i)\\) и \\((i,i+1)\\). Покажем, что допустимое разбиение существует и единственно. Две диагонали доски делят ее на четыре области. Домино, покрывающее клетку \\((1,1)\\), вынуждено быть вертикальным: горизонтальное домино заняло бы также отмеченную клетку \\((1,2)\\). Тогда домино, покрывающее \\((2,2)\\), тоже вынуждено быть вертикальным, затем так же последовательно вынуждаются вертикальные домино через \\((3,3),\\ldots,(n,n)\\). Индукцией получаем, что все домино в левой области стоят вертикально. Поворотная симметрия дает, что в нижней области все домино горизонтальны, и аналогично в остальных двух областях. Поэтому разбиение действительно существует и единственно. Теперь докажем, что меньшего числа отмеченных клеток недостаточно. Пусть отмечено \\(k<2n\\) клеток и пусть существует допустимое разбиение \\(P\\). Достаточно построить другое допустимое разбиение. Обозначим через \\(d\\) главную диагональ доски. Построим двухцветный граф, вершинами которого являются клетки доски. Соединим две вершины красным ребром, если соответствующие клетки покрыты одним домино в \\(P\\). Соединим две вершины синим ребром, если их отражения относительно \\(d\\) соединены красным ребром. Между двумя вершинами могут одновременно идти красное и синее ребра. У каждой вершины красная степень и синяя степень равны \\(1\\), поэтому граф распадается на циклы, в каждом из которых цвета ребер чередуются; цикл длины \\(2\\) тоже допускается, если одни и те же две вершины соединены ребрами обоих цветов. Рассмотрим клетку \\(c\\) на диагонали \\(d\\). Ее красное и синее ребра симметричны относительно \\(d\\), значит они ведут из \\(c\\) в разные клетки; следовательно, \\(c\\) лежит на чередующемся цикле \\(C(c)\\) длины не меньше \\(4\\). Пройдем по этому циклу от \\(c=c_0\\) до первой следующей клетки \\(c_m\\), лежащей на \\(d\\). Эта клетка отлична от \\(c\\). Отраженный относительно \\(d\\) путь также лежит в построенном графе, и вместе эти два пути образуют весь цикл \\(C(c)\\). Значит, каждый такой цикл содержит ровно две клетки главной диагонали. Все \\(2n\\) диагональных клеток поэтому разбиваются на \\(n\\) циклов \\(C_1,C_2,\\ldots,C_n\\), каждый из которых имеет длину хотя бы \\(4\\). Так как отмеченных клеток меньше \\(2n\\), по принципу Дирихле среди этих \\(n\\) циклов есть цикл, содержащий не более одной отмеченной клетки. Изменим разбиение \\(P\\) вдоль этого цикла: удалим все домино, соответствующие красным ребрам цикла, и положим вместо них домино, соответствующие его синим ребрам. Синие ребра также соединяют соседние клетки, поскольку они получены отражением домино, а чередование цветов гарантирует, что все вершины цикла снова покрыты ровно по одному разу. Вне цикла разбиение не меняется. Цикл имеет длину не меньше \\(4\\), поэтому новое разбиение \\(P'\\) отлично от \\(P\\). При этом ни одно новое домино не содержит две отмеченные клетки: внутри выбранного цикла отмечена не более чем одна клетка, а вне цикла домино остались прежними и уже были допустимы. Получили второе допустимое разбиение, противоречащее единственности. Следовательно, \\(k\\ge2n\\), а построенный пример дает \\(k=2n\\).",
