      "id": "sol-official-compressed",
      "title": "Сжатое официальное решение",
      "text": "Официальное решение даёт конструкцию и нижнюю оценку. Для нижней оценки фиксируем допустимое домино-разбиение \\(P\\) и отражаем его относительно главной диагонали. Строим граф на клетках: красное ребро соединяет клетки одного домино из \\(P\\), синее — клетки, которые стали парой после отражения. У каждой вершины красная и синяя степень равны 1, поэтому граф распадается на чередующиеся циклы. Если найти цикл, не заблокированный отмеченными клетками, то вдоль него можно заменить красные домино синими и получить другое допустимое разбиение, противореча единственности. Анализ циклов, проходящих через диагональ, даёт требуемую нижнюю оценку, а явная расстановка отмеченных клеток показывает её достижимость.",
