        "text": "Для положительного \\(n\\) найдите наименьшее \\(k\\), для которого можно отметить \\(k\\) клеток доски \\(2n\\times2n\\) так, чтобы существовало единственное разбиение доски на домино \\(1\\times2\\) и \\(2\\times1\\), причём ни одно домино не содержит две отмеченные клетки.",
