  "ideas": [
    {
      "id": "idea-fold-cycle",
      "title": "Сложить C_8 по симметрии",
      "text": "По расстоянию от S противоположные вершины имеют одинаковое число путей, поэтому задача сводится к линейной рекурсии на четырёх состояниях.",
      "tags": [
        "graph_symmetry"
      ],
      "status": "needs_human_review"
    },
    {
      "id": "idea-characteristic-roots",
      "title": "Рекурсия для чётных длин",
      "text": "Для b_n=a_{2n} получается линейная рекурсия с корнями 2+sqrt(2) и 2-sqrt(2).",
      "tags": [
        "double_counting"
      ],
      "status": "needs_human_review"
    }
  ],
  "solutions": [
    {
      "id": "sol-graph-review",
      "title": "Сжатое графовое решение",
      "text": "Нечётная длина невозможна, потому что C_8 двудолен и S,F лежат в одной доле: a_{2n-1}=0. Для чётных длин сложим вершины цикла по симметрии относительно оси SF и будем считать числа путей в зависимости от расстояния до S. Переходы между четырьмя расстояниями дают линейную систему; исключая промежуточные состояния, получаем для b_n=a_{2n} рекурсию b_n=4b_{n-1}-2b_{n-2} с начальными значениями b_1=0, b_2=2. Поэтому b_n=((2+sqrt(2))^{n-1}-(2-sqrt(2))^{n-1})/sqrt(2).",
      "idea_ids": [
