        "id": "stmt-graph",
        "text": "В цикле \\(C_8\\) выбраны две противоположные вершины \\(S\\) и \\(F\\). Для каждого \\(n\\ge 0\\) обозначим через \\(a_n\\) число маршрутов длины \\(n\\) из \\(S\\) в \\(F\\), то есть число последовательностей из \\(n\\) рёбер, по которым можно пройти из \\(S\\) в \\(F\\). Докажите указанную в задаче формулу для \\(a_n\\).",
