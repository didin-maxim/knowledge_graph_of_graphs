  "statements": {
    "original": [
      {
        "id": "stmt-original",
        "text": "В регулярном восьмиугольнике фишка стартует из вершины S и каждую секунду переходит в одну из двух соседних вершин. Процесс заканчивается в противоположной вершине F. Пусть a_n — число различных путей длительности n из S в F. Докажите заданную формулу для a_n.",
        "status": "needs_human_review",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [],
        "distinct_from": [
          "stmt-graph"
        ],
        "title": "Условие",
        "source_id": "src-imomath-imo-1979"
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Это подсчёт числа прогулок длины n между противоположными вершинами в цикле C_8.",
        "status": "needs_human_review",
        "self_contained": {
          "status": "ai_checked"
        },
