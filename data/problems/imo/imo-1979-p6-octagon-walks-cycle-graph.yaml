        "text": "В регулярном восьмиугольнике фишка стартует из вершины S и каждую секунду переходит в одну из двух соседних вершин. Процесс заканчивается в противоположной вершине F. Пусть aₙ — число различных путей длительности n из S в F. Докажите заданную формулу для aₙ.",
