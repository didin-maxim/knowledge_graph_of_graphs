  "solutions": [
    {
      "id": "sol-graph-review",
      "title": "Сжатое графовое решение",
      "text": "Нечётная длина невозможна, потому что \\(C_8\\) двудолен, а вершины \\(S\\) и \\(F\\) лежат в одной доле, так что \\(a_{2n-1}=0\\). Для чётной длины удобно пронумеровать вершины цикла остатками по модулю 8 так, чтобы \\(S=0\\), \\(F=4\\), а каждый ход менял номер на \\(\\pm1\\). После \\(2n\\) ходов мы попадём в \\(F\\) тогда и только тогда, когда разность между числом ходов по часовой стрелке и против неё сравнима с 4 по модулю 8. Если ходов по часовой стрелке было \\(r\\), то против неё было \\(2n-r\\), и условие имеет вид \\(r-(2n-r)=2r-2n\\equiv4\\pmod8\\), то есть \\(r\\equiv n+2\\pmod4\\). Поэтому\n\\[\na_{2n}=\\sum_{k\\in\\mathbb Z}\\binom{2n}{n+2+4k}.\n\\]\nОстаётся вычислить эту сумму. По фильтру корней из единицы\n\\[\n\\sum_{k}\\binom{2n}{n+2+4k}=\\frac18\\sum_{j=0}^7 \\zeta^{-j(n+2)}(1+\\zeta^j)^{2n},\\qquad \\zeta=e^{2\\pi i/8}.\n\\]\nПосле попарного объединения слагаемых получаем\n\\[\na_{2n}=2^{2n-2}-2^{n-1}.\n\\]\nИтак,\n\\[\na_m=\\begin{cases}\n0,& m\\text{ нечётно},\\\\\n2^{m-2}-2^{m/2-1},& m\\text{ чётно}.\n\\end{cases}\n\\]\nЭто и есть требуемая формула.",
      "idea_ids": [
        "idea-fold-cycle",
        "idea-characteristic-roots"
      ],
