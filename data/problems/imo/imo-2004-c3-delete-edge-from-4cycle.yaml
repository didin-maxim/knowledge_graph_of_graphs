  "solutions": [
    {
      "id": "sol-reviewed-secondary",
      "title": "Полное решение: инвариант небипартитности и явное удаление",
      "text": "Ответ: \\(n\\). Сначала докажем нижнюю оценку. Если из связного небипартитного графа \\(G\\) удалить ребро \\(AB\\), лежащее в 4-цикле \\(ABCD\\), то связность не теряется: в оставшемся графе концы \\(A,B\\) соединены путём \\(A-D-C-B\\). Небипартитность тоже не теряется. Действительно, если бы \\(G-AB\\) был двудольным, то из пути \\(A-D-C-B\\) следовало бы, что \\(A\\) и \\(B\\) лежат в разных долях, а значит добавление ребра \\(AB\\) сохраняло бы двудольность; это противоречит небипартитности \\(G\\). Исходный \\(K_n\\) связен и небипартитен, поэтому любой полученный граф связен и содержит цикл, а значит имеет не менее \\(n\\) рёбер.\n\nОсталось показать достижимость. Обозначим вершины \\(V_1,\\ldots,V_n\\). Сначала для всех \\(3\\le i<j<n\\) удалим ребро \\(V_iV_j\\) из 4-цикла \\(V_2V_iV_jV_nV_2\\). Все остальные три ребра этого цикла к моменту удаления ещё есть: рёбра с концом \\(V_2\\) или \\(V_n\\) пока не трогаются. После этого среди вершин \\(V_3,\\ldots,V_{n-1}\\) не осталось рёбер, но все рёбра \\(V_1V_i,V_2V_i,V_iV_n\\) ещё присутствуют. Теперь для каждого \\(i=3,\\ldots,n-1\\) удаляем \\(V_2V_i\\) из 4-цикла \\(V_1V_iV_2V_nV_1\\), а затем удаляем \\(V_iV_n\\) из 4-цикла \\(V_1V_iV_nV_2V_1\\). Эти циклы корректны, потому что рёбра \\(V_1V_i,V_1V_n,V_1V_2,V_2V_n\\) не удаляются, а второе удаление для данного \\(i\\) не использует уже удалённое ребро \\(V_2V_i\\). В итоге остаются ровно рёбра \\(V_1V_i\\) при \\(2\\le i\\le n\\) и ребро \\(V_2V_n\\), всего \\(n\\) рёбер.",
      "idea_ids": [
