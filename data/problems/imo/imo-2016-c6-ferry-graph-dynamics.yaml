        ]
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Пусть \\(G\\) — связный простой граф на \\(n\\ge 3\\) вершинах. Разрешена следующая операция над ребром \\(xy\\): удалить ребро \\(xy\\), а затем для каждой вершины, смежной ровно с одной из вершин \\(x,y\\), изменить инцидентность к этим вершинам так, чтобы после операции она стала смежна с другой из вершин \\(x,y\\) и не смежна с прежней. Известно, что для любого разбиения множества вершин на две непустые части в некоторый момент процесса применяется операция к ребру, соединяющему эти части. Докажите, что через конечное число шагов появится вершина степени \\(n-1\\).",
