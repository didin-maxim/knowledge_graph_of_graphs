      "id": "sol-official-compressed",
      "title": "Сжатое официальное решение",
      "text": "Рассмотрим граф маршрутов. Операция закрытия ребра \\(XY\\) фактически переносит различия в окрестностях \\(X\\) и \\(Y\\): вершины, смежные ровно с одним концом, становятся смежными с обоими. Официальное решение выбирает пару вершин с максимальным числом общих соседей и показывает, что если ни одна вершина ещё не универсальна, то условие о будущих закрытиях рёбер через любой разрез позволит найти операцию, увеличивающую этот максимум. Так как максимум ограничен \\(n-2\\), процесс не может продолжаться без появления вершины, смежной со всеми остальными.",
