  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Развёрнутое решение через двудольную сеть",
      "text": "Назовём две непустые группы островов \\(A\\) и \\(B\\) сетью, если каждый остров из \\(A\\) соединён маршрутом с каждым островом из \\(B\\). Идея в том, чтобы поддерживать такую сеть на всё большем множестве островов.\n\nСначала выберем любой существующий маршрут \\(AB\\). Так как исходный граф связен и \\(n\\ge 3\\), хотя бы один из островов \\(A\\) или \\(B\\) имеет ещё одного соседа; без ограничения общности пусть есть остров \\(C\\), соединённый с \\(A\\). Тогда множества \\(\\{A\\}\\) и \\(\\{B,C\\}\\) образуют сеть на трёх островах.\n\nТеперь предположим, что некоторое множество островов \\(U\\) уже разбито на две непустые доли \\(A\\) и \\(B\\), образующие сеть, причём \\(3\\le |U|<n\\). Сначала покажем, что это свойство можно сохранять, пока мы работаем только внутри \\(U\\). Единственный способ разрушить сеть на \\(U\\) — закрыть поперечный маршрут между некоторыми \\(a\\in A\\) и \\(b\\in B\\). Тогда положим\n\\[\nA'=\\{a,b\\},\\qquad B'=U\\setminus\\{a,b\\}.\n\\]\nМножество \\(B'\\) непусто, потому что \\(|U|\\ge 3\\). Возьмём вершину \\(x\\in A\\setminus\\{a\\}\\). До операции она была соединена с \\(b\\). Если до закрытия ребра \\(ab\\) вершина \\(x\\) не была соединена с \\(a\\), то после операции маршрут \\(xa\\) добавится, потому что \\(x\\) была соединена ровно с одной из вершин \\(a,b\\). Значит, после операции \\(x\\) соединена и с \\(a\\), и с \\(b\\). Точно так же любая вершина из \\(B\\setminus\\{b\\}\\) после операции соединена и с \\(a\\), и с \\(b\\). Следовательно, после закрытия ребра \\(ab\\) множества \\(A'\\) и \\(B'\\) снова образуют сеть на том же множестве \\(U\\).\n\nЗначит, пока рассматриваются только острова из \\(U\\), мы всегда можем переразбить их так, чтобы получить сеть. Так как \\(|U|<n\\), рассмотрим разрез \\(U\\mid (V\\setminus U)\\). По условию задачи через некоторое время будет закрыт маршрут, пересекающий этот разрез. Пусть закрывается маршрут \\(aD\\), где \\(a\\in A\\), а \\(D\\notin U\\). Тогда каждая вершина \\(b\\in B\\) до операции была соединена с \\(a\\). Если она уже была соединена с \\(D\\), то ничего делать не нужно; если нет, то после закрытия \\(aD\\) маршрут \\(bD\\) добавится, потому что \\(b\\) была соединена ровно с одной из вершин \\(a,D\\). Следовательно, после этой операции остров \\(D\\) соединён со всеми вершинами из \\(B\\), и множества \\(A\\cup\\{D\\}\\) и \\(B\\) образуют сеть на множестве \\(U\\cup\\{D\\}\\). Таким образом, мы можем увеличивать \\(|U|\\) на 1, пока не охватим все \\(n\\) островов.\n\nИтак, в некоторый момент все острова разбиты на две непустые доли \\(A\\) и \\(B\\), образующие сеть. Рассмотрим первое последующее закрытие поперечного маршрута \\(ab\\) между \\(a\\in A\\) и \\(b\\in B\\). Как и выше, после этой операции множества\n\\[\nA' = \\{a,b\\},\\qquad B' = V\\setminus\\{a,b\\}\n\\]\nобразуют сеть. Теперь применим условие задачи к разрезу \\(A'\\mid B'\\). Через некоторое время закроется маршрут между этими частями; без ограничения общности пусть это маршрут \\(ac\\), где \\(c\\in B'\\). Так как \\(A'\\) и \\(B'\\) образуют сеть, до закрытия ребра \\(ac\\) вершина \\(b\\) была соединена с \\(c\\), но не была соединена с \\(a\\). Значит, при закрытии \\(ac\\) маршрут \\(ab\\) добавится. После этой операции вершина \\(b\\) соединена с \\(a\\) и со всеми вершинами из \\(B'\\), то есть со всеми остальными островами. Следовательно, возник остров, соединённый маршрутами со всеми другими.",
