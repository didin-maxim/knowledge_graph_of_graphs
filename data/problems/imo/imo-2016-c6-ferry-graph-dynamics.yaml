        "text": "Есть \\(n\\ge3\\) островов и некоторые двусторонние паромные маршруты; граф маршрутов связен. Каждый год компания закрывает один маршрут \\(XY\\), а затем для каждого острова, соединённого ровно с одним из \\(X,Y\\), открывает маршрут к другому из них. Известно, что для любого разбиения островов на две непустые группы когда-нибудь будет закрыт маршрут между этими группами. Докажите, что через некоторое число лет появится остров, соединённый маршрутами со всеми остальными.",
