  "statements": {
    "original": [
      {
        "id": "stmt-original",
        "text": "Даны 10 точек общего положения на плоскости; каждый отрезок между парой точек окрашен в один из k цветов. Требуется, чтобы для любых k из 10 точек среди отрезков с концами в этих k точках нашлись k отрезков попарно разных цветов. Найти все k, 1 <= k <= 10, для которых это возможно.",
        "status": "needs_human_review",
