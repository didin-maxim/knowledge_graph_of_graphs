    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Это задача о раскраске рёбер полного графа K10. Для каждого k нужно, чтобы любой индуцированный K_k содержал k рёбер разных цветов; существенная часть решения для k=4 использует локальные степени цвета и R(3,3)=6.",
