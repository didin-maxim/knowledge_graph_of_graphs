  "solutions": [
    {
      "id": "sol-reviewed-web",
      "title": "Сжатое решение после web review",
      "text": "Ответ: возможны все k, кроме k=4; нетривиальна проверка k=5 и невозможность k=4, остальные значения следуют проще из монотонных/элементарных соображений. Для k=5 строится явная 5-раскраска рёбер K10: каждый цвет задаётся несколькими кликами-группами так, что любые пять вершин содержат ребро каждого из пяти цветов. Для k=4 предположим, что раскраска четырьмя цветами существует. В одной вершине не может быть четырёх рёбер одного цвета, иначе вместе с подходящим ребром среди четырёх соседей получаются четыре ребра одного цвета на четырёх вершинах. Значит для некоторого цвета из вершины выходят ровно три ребра AB, AC, AD. Тогда BC, BD, CD не имеют этого цвета. На оставшихся шести вершинах по R(3,3)=6 есть либо треугольник этого цвета, либо треугольник без этого цвета. В обоих случаях, добавляя A или одну из B,C,D, получаем четыре вершины, где невозможно иметь четыре разных цвета.",
