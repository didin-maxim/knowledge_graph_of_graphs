    },
    {
      "id": "idea-four-color-ramsey-obstruction",
      "title": "Запрет четырёх цветов через R(3,3)",
      "text": "Если четыре цвета работали бы для любых четырёх вершин, то анализ цветовых степеней в одной вершине и Ramsey R(3,3)=6 дают одноцветный или безданногоцветный треугольник, что приводит к противоречию.",
