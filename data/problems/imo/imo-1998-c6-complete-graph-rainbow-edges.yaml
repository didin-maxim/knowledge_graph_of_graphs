      "id": "idea-five-color-construction",
      "title": "Пятицветная конструкция через разбиения",
      "text": "Для каждого цвета задаются группы вершин, внутри которых все рёбра имеют этот цвет; из любых пяти вершин две попадают в одну группу каждого цвета.",
