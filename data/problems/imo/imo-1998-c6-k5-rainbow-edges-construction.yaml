        "title": "Графовая формулировка",
        "text": "Постройте 5-раскраску рёбер \\(K_{10}\\), в которой любые 5 вершин индуцируют подграф, содержащий рёбра всех 5 цветов. Иными словами, каждые 5 вершин должны содержать 5 попарно разноцветных рёбер.",
