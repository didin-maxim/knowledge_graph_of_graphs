  "ideas": [
    {
      "id": "idea-five-color-partitions",
      "title": "Для каждого цвета разбить вершины на четыре группы",
      "text": "Если для каждого цвета вершины разбиты на четыре группы и все рёбра внутри групп имеют этот цвет, то любые пять вершин по принципу Дирихле содержат ребро этого цвета. Достаточно подобрать пять таких разбиений, чтобы каждое ребро \\(K_{10}\\) попало ровно в один цвет.",
      "tags": [
        "coloring"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-k5-explicit-construction",
      "title": "Явная пятицветная раскраска",
      "text": "Занумеруем вершины числами \\(0,1,\\ldots,9\\). Зададим цвета списками рёбер: синие рёбра идут внутри \\(\\{0,2,5,9\\}\\) и ещё \\(13,48,67\\); зелёные идут внутри \\(\\{1,2,4,7\\}\\) и ещё \\(06,35,89\\); красные идут внутри \\(\\{3,4,6,9\\}\\) и ещё \\(01,28,57\\); жёлтые идут внутри \\(\\{1,5,6,8\\}\\) и ещё \\(04,23,79\\); белые идут внутри \\(\\{0,3,7,8\\}\\) и ещё \\(19,26,45\\). Здесь запись \\(13\\) означает ребро между вершинами 1 и 3.\n\nЭти пять списков попарно не пересекаются и вместе дают все 45 рёбер \\(K_{10}\\). Для каждого цвета перечисление задаёт разбиение десяти вершин на четыре группы: одну группу из четырёх вершин и три пары; все рёбра внутри этих групп имеют данный цвет. Поэтому любые пять вершин по принципу Дирихле содержат две вершины в одной из четырёх групп этого цвета, а значит содержат ребро этого цвета. Это верно для каждого из пяти цветов, следовательно любые пять вершин содержат рёбра всех пяти цветов.",
      "idea_ids": [
        "idea-five-color-partitions"
      ],
