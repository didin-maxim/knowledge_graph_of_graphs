        "id": "stmt-original-k5",
        "title": "Условие, случай k = 5",
        "text": "Даны 10 точек общего положения на плоскости. Нужно окрасить каждый отрезок между парой точек в один из 5 цветов так, чтобы для любых 5 из этих 10 точек среди отрезков с концами в выбранных точках нашлись 5 отрезков попарно различных цветов. Докажите, что такая раскраска существует.",
