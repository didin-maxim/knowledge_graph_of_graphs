      "id": "idea-one-factorization-large-k",
      "title": "Каждые шесть вершин пересекают каждое совершенное паросочетание",
      "text": "В совершенном паросочетании на 10 вершинах независимое множество имеет размер не больше 5. Значит, любые хотя бы 6 вершин содержат ребро каждого выбранного 1-фактора; раскрасив выбранные 1-факторы разными цветами, получаем все нужные цвета.",
