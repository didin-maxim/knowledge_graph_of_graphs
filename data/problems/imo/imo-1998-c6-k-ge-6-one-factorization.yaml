        "id": "stmt-original-k-ge-6",
        "title": "Условие, случаи k ≥ 6",
        "text": "Даны 10 точек общего положения на плоскости. Для каждого \\(k\\), \\(6\\le k\\le 10\\), требуется окрасить каждый отрезок между парой точек в один из \\(k\\) цветов так, чтобы для любых \\(k\\) из этих 10 точек среди отрезков с концами в выбранных точках нашлись \\(k\\) отрезков попарно различных цветов. Докажите, что такая раскраска существует.",
