  "solutions": [
    {
      "id": "sol-k-ge-6-one-factorization",
      "title": "Раскраска через 1-факторизацию",
      "text": "Возьмём 1-факторизацию \\(K_{10}\\), то есть разбиение всех его рёбер на 9 совершенных паросочетаний \\(F_1,\\ldots,F_9\\). Для \\(6\\le k\\le 9\\) покрасим рёбра \\(F_1,\\ldots,F_k\\) в разные цвета, а все остальные рёбра покрасим произвольно в один из этих \\(k\\) цветов. Любые \\(k\\) вершин, а значит любые не менее 6 вершин, содержат ребро каждого \\(F_i\\): иначе эти \\(k\\) вершин были бы независимым множеством в совершенном паросочетании \\(F_i\\), что невозможно, потому что из каждой пары паросочетания можно выбрать не более одной вершины, всего не более 5. Поэтому выбранные \\(k\\) вершин содержат все \\(k\\) цветов.\n\nДля \\(k=10\\) используем ту же 1-факторизацию: покрасим \\(F_1,\\ldots,F_9\\) в первые 9 цветов, а затем одно ребро, например из \\(F_1\\), перекрасим в десятый цвет. Единственное множество из 10 вершин есть весь \\(K_{10}\\), и в нём присутствуют все 10 цветов.",
