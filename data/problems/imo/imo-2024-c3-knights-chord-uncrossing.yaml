      "id": "sol-chord-uncrossing-induction",
      "title": "Пересечения хорд и индукция по потенциалу",
      "text": "Ответ: \\(\\frac{n(n-1)}2\\). Нижняя оценка достигается на рассадке, где каждый рыцарь сидит ровно напротив партнёра. Соединим партнёров хордами. Тогда любые две хорды пересекаются, а чтобы партнёры одной пары стали соседями, их хорда должна не пересекать ни одну другую. Один обмен соседних рыцарей может распутать не более одной пары пересекающихся хорд, поэтому нужно хотя бы \\(\\binom n2\\) обменов. Докажем достаточность. Поставим в центр стола точку-столб и для каждой хорды выберем сторону, на которой находится столб, если хорда проходит через центр. Хорда проходит перед рыцарем, если отделяет его от столба; длина хорды — число таких рыцарей. Для двух хорд есть три типа отношений: одна охватывает другую, они пересекаются, или они раздельны. Пусть \\(k,l,m\\) — числа пар этих трёх типов; тогда \\(k+l+m=\\binom n2\\). Лемма: за \\(2k+l\\) обменов можно посадить все пары рядом. Действительно, пока есть хорда положительной длины, смотрим на первого рыцаря перед ней. Либо обмен сразу уменьшает число пересечений, либо переводит вложенную пару в пересекающуюся и уменьшает \\(2k+l\\), либо мы продвигаемся дальше вдоль хорды и в конце снова находим уменьшающий обмен. Индукция по \\(2k+l\\) завершает лемму. Остаётся доказать \\(k\\le m\\). Возьмём хорду максимальной длины; если её пересекают \\(x\\) хорд и внутри неё лежат \\(y\\) хорд, то её длина равна \\(x+2y\\le n-1\\), поэтому хорд, раздельных с ней, не меньше \\(y\\). Удалив эту пару и применив индукцию к оставшимся хордам, получаем \\(k\\le m\\). Тогда \\(2k+l\\le k+l+m=\\binom n2\\), что и даёт нужное число обменов.",
