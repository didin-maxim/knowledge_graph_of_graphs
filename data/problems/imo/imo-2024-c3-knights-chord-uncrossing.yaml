    {
      "id": "sol-distance-and-walking-count",
      "title": "Суммарное расстояние и подсчёт проходов",
      "text": "Нижнюю оценку можно получить без пересечений: в противоположной рассадке партнёры каждой пары разделены \\(n-1\\) местами в любую сторону, значит суммарно по паре им нужно сделать не меньше \\(n-1\\) шагов, чтобы стать соседями. Всего это \\(n(n-1)\\) шагов рыцарей, а один обмен двигает двух рыцарей на один шаг, поэтому нужно не меньше \\(\\frac{n(n-1)}2\\) обменов. Для верхней оценки используем те же обозначения \\(k,l,m\\) для вложенных, пересекающихся и раздельных пар хорд. Представим, что каждый рыцарь непрерывно идёт к одной из двух середины дуг между ним и партнёром так, чтобы хорда пары отделяла пункт назначения от столба; пункты назначения немного сдвинем, чтобы они были различны. Для каждой пары хорд число взаимных проходов равно 2, если одна хорда охватывает другую, равно 1, если они пересекаются, и равно 0, если они раздельны. Значит, всего проходов \\(2k+l\\), и эти проходы можно реализовать как обмены соседних мест. Теперь докажем \\(k\\le m\\) вторым способом. Для хорды \\(C\\) пусть \\(k_C\\) — число хорд, охваченных \\(C\\). Сначала у каждой \\(C\\) есть хотя бы \\(k_C\\) раздельных с ней хорд. Затем выбираем среди таких хорд набор с минимальной суммой соответствующих \\(k_{C'}\\); если в нём есть хорда с \\(k_{C'}\\ge k_C\\), её можно заменить на хорду с меньшим параметром, противореча минимальности. Поэтому для каждой \\(C\\) число подходящих раздельных хорд не меньше \\(k_C\\). Суммируя по всем \\(C\\), получаем \\(k\\le m\\). Следовательно, \\(2k+l\\le\\binom n2\\), и этого числа обменов всегда достаточно.",
