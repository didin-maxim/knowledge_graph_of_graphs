        "id": "stmt-original",
        "title": "Партнёры за круглым столом",
        "text": "Пусть \\(n\\) — положительное целое число. За круглым столом сидят \\(2n\\) рыцарей, разбитых на \\(n\\) пар партнёров; каждая пара хочет пожать друг другу руки. Пара может пожать руки только тогда, когда партнёры сидят рядом. Каждую минуту одна пара соседних рыцарей меняется местами. Найдите минимальное число таких обменов, достаточное для того, чтобы независимо от начальной рассадки каждый рыцарь в некоторый момент смог пожать руку своему партнёру.",
