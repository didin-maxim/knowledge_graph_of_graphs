  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Сжатое официальное решение",
      "text": "Ответ: \\(\\lfloor\\log_2 n\\rfloor\\). Переформулируем: нужно раскрасить рёбра \\(K_n\\) в \\(k\\) цветов так, чтобы каждый гамильтонов путь содержал все цвета. Конструкция для \\(k=\\lfloor\\log_2 n\\rfloor\\) нумерует вершины и красит ребро по первому двоичному разряду, в котором номера различаются; при проходе через все вершины каждый разряд обязан где-то измениться, значит каждый цвет встречается. Для верхней оценки официальное решение показывает, что если цветов слишком много, то можно разбить вершины по одному цвету на части и рекурсивно построить гамильтонов путь, избегающий некоторого цвета. Это противоречит требованию, поэтому больше \\(\\lfloor\\log_2 n\\rfloor\\) цветов невозможно.",
