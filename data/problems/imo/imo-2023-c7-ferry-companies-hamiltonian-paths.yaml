  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Доказательство через бинарную раскраску рёбер",
      "text": "Ответ: \\(\\lfloor\\log_2 n\\rfloor\\). Переформулируем задачу так: рёбра \\(K_n\\) раскрашены в \\(k\\) цветов, и требуется, чтобы каждый гамильтонов путь содержал все \\(k\\) цветов. Назовём такую раскраску хорошей.\n\nСначала построим хорошую раскраску для \\(k=\\lfloor\\log_2 n\\rfloor\\). Занумеруем вершины \\(A_1,\\ldots,A_n\\). Вершине \\(A_j\\) припишем цвет \\(\\min(\\lfloor\\log_2 j\\rfloor+1,k)\\), а ребро \\(A_uA_v\\) при \\(u<v\\) покрасим в цвет вершины \\(A_u\\). Вершин последнего цвета не меньше \\(n/2+1\\), поэтому любой гамильтонов путь содержит ребро между двумя такими вершинами, а значит цвет \\(k\\). Для цвета \\(i<k\\) вершин цвета \\(i\\) ровно \\(2^{i-1}\\), а вершин более ранних цветов всего \\(2^{i-1}-1\\). Если бы гамильтонов путь не имел ребра цвета \\(i\\), то каждая вершина цвета \\(i\\) могла бы соседствовать в пути только с более ранней вершиной; разместить \\(2^{i-1}\\) таких вершин между \\(2^{i-1}-1\\) разделителями невозможно, тем более с учётом остальных вершин. Значит все цвета встречаются.\n\nДокажем верхнюю оценку. Пусть есть хорошая раскраска. Для вершины \\(v\\) обозначим через \\(d_i(v)\\) число инцидентных рёбер цвета \\(i\\), а через \\(m(v)=\\max_i d_i(v)\\). Нужна стандартная операция перекраски. Если ребро \\(AB\\) имеет цвет \\(i\\) и \\(d_i(A)+d_i(B)\\le n-1\\), то его можно перекрасить в любой другой цвет, не испортив хорошесть. Действительно, иначе после перекраски появился бы гамильтонов путь, в котором старое ребро \\(AB\\) было единственным ребром цвета \\(i\\). Запишем его как\n\\[\nA_s,\\ldots,A_1,A_0=A,B_0=B,B_1,\n\\ldots,B_t,\n\\]\nгде \\(s+t+2=n\\). Тогда, чтобы не получить путь без цвета \\(i\\) уже в старой раскраске, ребро \\(B_0A_s\\) должно иметь цвет \\(i\\), ребро \\(A_0B_t\\) должно иметь цвет \\(i\\); кроме того, для каждого \\(p<s\\) хотя бы одно из \\(B_0A_p\\), \\(A_0A_{p+1}\\) имеет цвет \\(i\\), а для каждого \\(q<t\\) хотя бы одно из \\(A_0B_q\\), \\(B_0B_{q+1}\\) имеет цвет \\(i\\). Эти требования дают как минимум \\((s+1)+(t+1)=n\\) различных вкладов в \\(d_i(A)+d_i(B)\\), противоречие.\n\nОтсюда следует более удобная локальная операция. Пусть ребро \\(AB\\) имеет цвет \\(j\\), \\(m(A)\\ge m(B)\\), а цвет \\(i\\ne j\\) достигает максимума в \\(A\\), то есть \\(d_i(A)=m(A)\\). Тогда перекраска \\(AB\\) в цвет \\(i\\) сохраняет хорошесть, потому что\n\\[\nd_j(A)+d_j(B)\\le (n-1-m(A))+m(B)\n\\le n-1.\n\\]\n\nТеперь рекурсивно приводим раскраску к слоистой форме. В любом непустом множестве вершин \\(S\\) выберем вершину \\(A\\) с максимальным \\(m(A)\\) внутри \\(S\\), и цвет \\(i\\), на котором этот максимум достигается. Последовательно перекрасим все рёбра от \\(A\\) к другим вершинам из \\(S\\) в цвет \\(i\\). После каждой такой операции \\(A\\) остаётся вершиной с максимальным \\(m\\) в текущем \\(S\\), а цвет \\(i\\) остаётся максимальным у \\(A\\), поэтому предыдущий абзац разрешает все перекраски. Затем удаляем \\(A\\) из \\(S\\) и повторяем. В итоге, не теряя хорошести, получаем порядок вершин \\(A_1,\\ldots,A_n\\) и цвета \\(c_1,\\ldots,c_n\\) такие, что для \\(u<v\\) ребро \\(A_uA_v\\) имеет цвет \\(c_u\\).\n\nОстаётся оценить число разных цветов в такой форме. Зафиксируем цвет \\(i\\). Если в каждом начальном отрезке \\(A_1,\\ldots,A_p\\) вершин цвета \\(i\\) не больше \\(p/2\\), то построим гамильтонов путь без цвета \\(i\\). Пусть \\(A_{x_1},\\ldots,A_{x_t}\\) — все вершины цвета \\(i\\) в порядке индексов, а \\(A_{y_1},\\ldots,A_{y_s}\\) — остальные вершины, тоже в порядке индексов. Из условия на префиксы следует \\(t\\le s\\) и \\(y_j<x_j\\) для всех \\(j\\le t\\). Тогда путь\n\\[\nA_{x_1},A_{y_1},A_{x_2},A_{y_2},\\ldots,A_{x_t},A_{y_t},A_{y_{t+1}},\\ldots,A_{y_s}\n\\]\nне содержит ребра цвета \\(i\\): каждое ребро между \\(x\\)- и \\(y\\)-вершиной получает цвет меньшего индекса, то есть некоторой \\(y\\)-вершины, а хвост состоит только из \\(y\\)-вершин. Противоречие хорошести. Значит для каждого цвета \\(i\\) существует минимальный \\(p_i\\), для которого среди \\(A_1,\\ldots,A_{p_i}\\) больше половины вершин цвета \\(i\\).\n\nУпорядочим цвета так, что \\(p_1<\\cdots<p_k\\). В префиксе длины \\(p_i\\) для каждого \\(j\\le i\\) таких вершин цвета \\(j\\) уже как минимум \\(\\lceil(p_j+1)/2\\rceil\\), поэтому\n\\[\np_i\\ge \\sum_{j=1}^i \\left\\lceil\\frac{p_j+1}{2}\\right\\rceil.\n\\]\nИндукция по \\(i\\) даёт \\(p_i\\ge 2^i-1\\). Следовательно \\(n\\ge p_k\\ge 2^k-1\\).\n\nСлучай равенства \\(n=2^k-1\\) тоже невозможен. Тогда все предыдущие неравенства должны быть равенствами: \\(p_i=2^i-1\\), и вершины цвета \\(i\\) образуют ровно блок \\(A_{2^{i-1}},A_{2^{i-1}+1},\\ldots,A_{2^i-1}\\). Но тогда гамильтонов путь\n\\[\nA_{2^{k-1}},A_1,A_{2^{k-1}+1},A_2,\\ldots,A_{2^k-1}\n\\]\nс очевидным чередованием всех вершин последнего блока и всех более ранних вершин не имеет ребра цвета \\(k\\): каждое его ребро получает цвет более ранней вершины. Противоречие. Значит \\(n\\ge 2^k\\), то есть \\(k\\le\\lfloor\\log_2 n\\rfloor\\).",
