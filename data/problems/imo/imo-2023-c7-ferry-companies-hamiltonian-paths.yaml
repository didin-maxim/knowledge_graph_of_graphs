        "id": "stmt-original",
        "title": "Условие",
        "text": "Архипелаг состоит из \\(n\\ge2\\) островов. Между каждой парой островов есть единственная двусторонняя паромная линия, принадлежащая одной из \\(k\\) компаний. Если любая одна компания закрывает все свои линии, путешественник уже не может, откуда бы он ни стартовал, посетить все острова ровно по одному разу. Найдите максимальное возможное \\(k\\).",
