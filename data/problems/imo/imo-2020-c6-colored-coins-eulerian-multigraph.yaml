  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "4-регулярный мультиграф цветов",
      "text": "Разобьём монеты на \\(2n\\) пар\n\\[\n\\{1,4n\\},\\{2,4n-1\\},\\ldots,\\{2n,2n+1\\}.\n\\]\nКаждая такая пара имеет одну и ту же суммарную массу \\(4n+1\\). Поэтому достаточно разделить сами пары на две группы так, чтобы в каждой группе каждая краска встретилась ровно два раза: тогда в каждой группе будет по \\(n\\) пар, а значит и одинаковый общий вес \\(n(4n+1)\\).\n\nПостроим мультиграф \\(G\\). Его вершины — цвета. Для каждой пары монет проведём ребро между цветами этих двух монет; если обе монеты одного цвета, это петля. Петля, как обычно, даёт вклад 2 в степень вершины, потому что в соответствующей паре находятся две монеты этого цвета. Так как каждого цвета ровно четыре монеты и каждая монета входит ровно в одну из построенных пар, степень каждой вершины графа равна 4.\n\nТеперь нужно раскрасить рёбра \\(G\\) в красный и синий цвета так, чтобы у каждой вершины красная степень и синяя степень были равны 2. Тогда красные рёбра зададут одну группу пар, а синие — другую: степень 2 у вершины-цвета означает ровно две монеты этого цвета в соответствующей группе, причём петля корректно считается дважды.\n\nРассмотрим любую связную компоненту \\(H\\) графа \\(G\\). Все степени в ней чётны, поэтому по критерию эйлерова цикла в \\(H\\) есть замкнутый обход, проходящий по каждому ребру компоненты ровно один раз. Если в компоненте \\(v\\) вершин, то сумма степеней равна \\(4v\\), значит число рёбер равно \\(2v\\), то есть оно чётно. Поэтому рёбра эйлерова цикла можно покрасить по ходу обхода попеременно в красный и синий цвета, и раскраска замкнётся согласованно.\n\nПроверим локальный баланс. В эйлеровом обходе каждый раз, когда обход проходит через вершину, два соседних в обходе инцидентных ребра получают разные цвета. Тем самым все инцидентные этой вершине рёбра разбиваются на пары «одно красное, одно синее»; для петли учитываются два её конца, как и в степени. Следовательно, в каждой вершине компоненты красная и синяя степени равны. Поскольку общая степень вершины равна 4, обе они равны 2.\n\nПроделав это независимо во всех компонентах, получаем требуемую двухцветную раскраску всех пар. Красные пары образуют один набор монет, синие — другой; в каждом наборе по две монеты каждого цвета. Кроме того, красная степень по всем \\(n\\) вершинам равна \\(2n\\), значит красных рёбер \\(n\\), и аналогично синих рёбер \\(n\\). Все пары имеют вес \\(4n+1\\), поэтому суммарные веса двух наборов одинаковы.",
