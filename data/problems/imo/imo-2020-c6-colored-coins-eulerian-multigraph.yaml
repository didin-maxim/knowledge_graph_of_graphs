      ],
      "status": "needs_human_review"
    },
    {
      "id": "idea-eulerian-multigraph",
      "title": "Мультиграф цветов",
      "text": "Цвета — вершины, пары монет — рёбра; все степени чётны, поэтому компоненты раскладываются на циклы.",
