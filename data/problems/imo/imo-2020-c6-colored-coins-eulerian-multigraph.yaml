  "ideas": [
    {
      "id": "idea-complementary-pairs",
      "title": "Пары с одинаковой суммой",
      "text": "Монеты разбиваются на пары весов \\(1+4n,2+(4n-1),\\ldots\\), каждая пара имеет одну и ту же сумму.",
      "tags": [
