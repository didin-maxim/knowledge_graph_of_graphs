        "id": "stmt-original",
        "title": "Условие",
        "text": "Даны \\(4n\\) монет весов \\(1,2,\\ldots,4n\\). Каждая монета окрашена в один из \\(n\\) цветов, причём каждого цвета ровно четыре монеты. Докажите, что монеты можно разбить на два набора равного суммарного веса так, чтобы в каждом наборе было по две монеты каждого цвета.",
