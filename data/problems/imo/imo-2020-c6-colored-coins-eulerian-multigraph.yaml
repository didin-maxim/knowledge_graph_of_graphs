    {
      "id": "sol-official-cycle-switching",
      "title": "Циклы на графе монет",
      "text": "Снова сначала фиксируем пары \\(\\{k,4n+1-k\\}\\), \\(k=1,\\ldots,2n\\); будем называть соответствующие рёбра чёрными. Теперь построим граф \\(\\Gamma\\), вершинами которого являются сами \\(4n\\) монет. Чёрное ребро соединяет две монеты одной из фиксированных пар.\n\nДля каждой цветовой четвёрки выберем произвольное разбиение её четырёх монет на две пары и соединим эти пары серыми рёбрами. У каждой монеты тогда ровно одно чёрное и ровно одно серое ребро, поэтому весь граф \\(\\Gamma\\) является объединением непересекающихся циклов, в которых чёрные и серые рёбра чередуются.\n\nСреди всех возможных выборов серых паросочетаний внутри цветовых четвёрок выберем такой, при котором число циклов минимально. Докажем, что в получившемся графе длина каждого цикла кратна 4. Так как рёбра в любом цикле чередуются, это равносильно тому, что число серых рёбер на каждом цикле чётно. Предположим, что есть цикл \\(C_1\\) с нечётным числом серых рёбер. Если бы для каждого цвета цикл содержал либо ноль, либо две серые пары этого цвета, число серых рёбер на \\(C_1\\) было бы чётным. Значит, для некоторого цвета \\(c\\) на \\(C_1\\) лежит ровно одно серое ребро, скажем \\((i,j)\\). Второе серое ребро того же цвета, скажем \\((k,\\ell)\\), лежит на другом цикле \\(C_2\\).\n\nЗаменим серые рёбра \\((i,j)\\) и \\((k,\\ell)\\) на \\((i,k)\\) и \\((j,\\ell)\\). Это снова допустимый выбор серых пар внутри той же цветовой четвёрки, а степени всех вершин по серым рёбрам остаются равными 1. При этом два прежних чередующихся цикла \\(C_1\\) и \\(C_2\\) сшиваются в один цикл, то есть общее число циклов уменьшается на 1. Это противоречит минимальности выбранного графа. Следовательно, все циклы имеют длину, кратную 4.\n\nТеперь в каждом цикле покрасим чёрные рёбра попеременно в красный и синий цвета. Это возможно, потому что число чёрных рёбер в цикле чётно. У каждого серого ребра две соседние с ним чёрные связи получают разные цвета. Поэтому в каждой цветовой четвёрке серые рёбра разбивают четыре монеты на две пары, и в каждой такой серой паре одна монета лежит на красном чёрном ребре, а другая — на синем. Значит, всего две монеты этого цвета попадут в красные пары и две — в синие.\n\nКрасные чёрные рёбра задают один набор исходных пар \\(\\{k,4n+1-k\\}\\), синие — другой. На каждом цикле красных и синих чёрных рёбер поровну, поэтому всего в двух наборах одинаковое число пар; поскольку каждая пара весит \\(4n+1\\), суммарные веса наборов равны. По предыдущему абзацу в каждом наборе ровно две монеты каждого цвета, что и требовалось.",
