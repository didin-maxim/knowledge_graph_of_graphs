  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Сжатое официальное решение",
      "text": "Сначала разбиваем монеты на \\(2n\\) пар с суммой \\(4n+1\\). Теперь достаточно разделить эти пары на две группы по \\(n\\) пар так, чтобы каждый цвет встретился по два раза в каждой группе. Строим мультиграф: вершины — цвета, а каждая пара монет даёт ребро между цветами этих двух монет, петля разрешена. У каждой вершины степень 4, потому что монет каждого цвета четыре. Значит, каждая компонента эйлерова и её рёбра можно пройти по циклам. Раскрашивая рёбра каждого цикла попеременно в два цвета, получаем разбиение пар на две группы; в каждой вершине поровну инцидентных рёбер каждого цвета. Поэтому каждая итоговая группа содержит по две монеты каждого цвета и имеет одинаковый вес.",
