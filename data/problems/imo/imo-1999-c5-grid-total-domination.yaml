  "ideas": [
    {
      "id": "idea-layer-coloring-lower-bound",
      "title": "Слоистая раскраска для нижней оценки",
      "text": "Доска раскрашивается слоями так, что каждая клетка соседствует ровно с двумя выделенными клетками цвета-свидетеля; один отмеченный сосед может покрыть не больше двух таких свидетелей.",
      "tags": [
        "coloring"
      ],
      "status": "needs_human_review"
    },
    {
      "id": "idea-alternating-construction",
      "title": "Конструкция через чередование в слоях",
      "text": "Отмечаются чередующиеся клетки в выбранных слоях; каждая клетка получает отмеченного соседа, и достигается нижняя оценка.",
      "tags": [
        "extremal_choice"
      ],
      "status": "needs_human_review"
    }
  ],
  "solutions": [
    {
      "id": "sol-reviewed-web",
      "title": "Сжатое решение после web review",
      "text": "Пусть n=2k. Ответ равен k(k+1)=n^2/4+n/2. Для нижней оценки используют специальную слоистую раскраску клеток-свидетелей: каждая клетка доски соседствует ровно с двумя такими клетками. Поэтому одна отмеченная клетка может обеспечить соседство не более чем для двух свидетелей, а число свидетелей равно 2k(k+1); нужно хотя бы k(k+1) отмеченных клеток. Конструкция достигает этой оценки: в каждом слое выбираются чередующиеся клетки так, чтобы каждая невыбранная и выбранная клетка имела выбранного соседа. В терминах графов это ровно построение минимального множества вершин, тотально доминирующего решёточный граф.",
