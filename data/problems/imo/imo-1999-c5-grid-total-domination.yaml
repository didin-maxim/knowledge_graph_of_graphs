          "stmt-graph"
        ],
        "source_id": "src-secondary-imo-1999-shortlist",
        "title": "Условие"
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Пусть \\(n\\) — чётное положительное число. Рассмотрим решёточный граф \\(P_n\\square P_n\\). Найдите минимальное число вершин в множестве \\(S\\subseteq V(P_n\\square P_n)\\), обладающем тем свойством, что каждая вершина графа имеет соседа в \\(S\\).",
