  "statements": {
    "original": [
      {
        "id": "stmt-original",
        "text": "Пусть n — чётное положительное число. На доске n x n нужно отметить минимальное число клеток так, чтобы каждая клетка, отмеченная или нет, имела отмеченную соседнюю по стороне клетку. Найти этот минимум.",
        "status": "needs_human_review",
        "self_contained": {
          "status": "ai_checked"
        },
