  "solutions": [
    {
      "id": "sol-reviewed-web",
      "title": "Диагональное доказательство",
      "text": "Пусть n=2k; ответ равен k(k+1)=n(n+2)/4. Занумеруем строки и столбцы числами 1,...,2k и покрасим доску в шахматном порядке: клетка (i,j) белая, если i+j чётно, и чёрная иначе.\n\nСначала докажем нижнюю оценку. Рассмотрим чёрные диагонали вида \\(i-j=d\\), где \\(d\\equiv1\\pmod 4\\). Таких диагоналей k, а их длины, в некотором порядке, равны 1,3,5,...,2k-1. Возьмём одну такую диагональ длины 2r-1. Клетки этой диагонали могут иметь отмеченных соседей только среди белых клеток, причём одна белая клетка соседствует не более чем с двумя клетками выбранной диагонали. Кроме того, из-за условия \\(d\\equiv1\\pmod 4\\) любая белая клетка может соседствовать с клетками не более одной из выбранных чёрных диагоналей. Поэтому для покрытия выбранных чёрных диагоналей нужно не менее \\(\\lceil(2r-1)/2\\rceil=r\\) отмеченных белых клеток. Суммируя по r=1,...,k, получаем, что белых отмеченных клеток не меньше 1+2+...+k=k(k+1)/2.\n\nДля второй половины нижней оценки рассмотрим белые диагонали вида \\(i+j=s\\), где \\(s\\equiv2\\pmod 4\\). Их длины также равны 1,3,5,...,2k-1 в некотором порядке, и одна чёрная клетка соседствует не более чем с двумя клетками одной такой диагонали и не может обслуживать две выбранные диагонали сразу. Значит, чёрных отмеченных клеток тоже не меньше k(k+1)/2. Всего необходимо хотя бы k(k+1) отмеченных клеток.\n\nОсталось построить столько клеток. Отметим белые клетки на диагоналях \\(i+j=s\\), \\(s\\equiv2\\pmod 4\\), через одну: если перечислить клетки такой диагонали сверху вниз, берём 1-ю, 3-ю, 5-ю и так далее. На диагонали длины 2r-1 отмечается ровно r клеток; всего белых отмеченных клеток k(k+1)/2. Непосредственно по соседним диагоналям видно, что каждая чёрная клетка имеет соседа среди этих отмеченных белых клеток: она лежит между двумя белыми диагоналями, и ровно одна из них имеет сумму координат 2 по модулю 4, а выбранное чередование попадает в один из двух её белых соседей.\n\nТеперь отметим чёрные клетки на диагоналях i-j=d, \\(d\\equiv1\\pmod 4\\), также через одну сверху вниз. Их тоже k(k+1)/2, и тем же рассуждением каждая белая клетка имеет отмеченного чёрного соседа. Следовательно, каждая клетка доски, отмеченная или нет, имеет отмеченную соседнюю по стороне клетку. Нижняя оценка и конструкция совпали, значит минимум равен k(k+1)=n(n+2)/4.",
