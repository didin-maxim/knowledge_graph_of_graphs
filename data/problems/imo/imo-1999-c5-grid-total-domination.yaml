      "id": "idea-layer-coloring-lower-bound",
      "title": "Слоистая раскраска для нижней оценки",
      "text": "Для нижней оценки отдельно считаются отмеченные клетки каждого шахматного цвета. В подходящем семействе попарно чередующихся диагоналей противоположного цвета один отмеченный сосед может покрыть не больше двух клеток-свидетелей, что даёт половину ответа для каждого цвета.",
