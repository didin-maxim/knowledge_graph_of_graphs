    "original": [
      {
        "id": "stmt-original",
        "text": "Два игрока по очереди играют на бесконечной квадратной решётке. Первый ставит \\(X\\) в пустую клетку, второй ставит \\(O\\) в пустую клетку. Первый выигрывает, если получает 11 подряд идущих \\(X\\) в одной строке, столбце или диагонали. Докажите, что второй может всегда помешать первому выиграть.",
