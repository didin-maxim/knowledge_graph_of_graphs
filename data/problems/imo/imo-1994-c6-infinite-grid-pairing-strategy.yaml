    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Нужно построить паросочетание на части клеток бесконечного решётчатого графа так, чтобы каждый отрезок из 11 последовательных клеток по горизонтали, вертикали или диагонали содержал пару. Тогда второй отвечает в парную клетку.",
