  "solutions": [
    {
      "id": "sol-reviewed-secondary",
      "title": "Сжатое решение после review",
      "text": "Решение строит периодический шаблон пар клеток на бесконечной решётке. В блоке \\(10\\times10\\) клетки разбиты на специальные пары так, что в каждой строке, каждом столбце и каждой достаточно длинной диагонали блока встречается целая пара; затем блок повторяется по всей плоскости. Стратегия второго: если первый ставит \\(X\\) в клетку пары, второй немедленно ставит \\(O\\) в другую клетку этой пары; остальные клетки шаблона можно игнорировать или обрабатывать согласно той же таблице. Тогда любой потенциальный отрезок из 11 клеток содержит обе клетки некоторой пары, а значит после хода второго не может состоять только из \\(X\\).",
