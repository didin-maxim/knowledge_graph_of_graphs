  "solutions": [
    {
      "id": "sol-reviewed-secondary",
      "title": "Полное решение: периодическая таблица пар",
      "text": "Второй использует парную стратегию. В одном блоке \\(10\\times10\\) зададим пары одинаковыми номерами; клетки `x` не входят в пары:\n```text\n x   1   2   3   4   5   6   6   7   x\n 8   8   1   2   3   4   5   9   7  10\n11  12  12   x  13  14  15   9  10  16\n11  17  18  18  13  14  15   x  16  19\n17  20   x  21  22  23  24  24  19  25\n20  26   x  21  23  22  27  27  25  28\n26  29   x   x   x   x  30  30  28  31\n29  32  33   x   x   x   x  34  34  31\n32  35  33  36  37  38  39  40  41  41\n x  35  42  42  36  37  38  39  40   x\n```\nПовторим этот блок периодически по всей бесконечной доске. В приведённой таблице каждая строка, каждый столбец и каждая диагональ длины хотя бы 5 внутри блока содержит целую пронумерованную пару; это проверяется непосредственно по таблице. Поэтому любые 11 соседних клеток в одном из четырёх направлений при разбиении на периодические блоки содержат пять подряд идущих клеток, лежащих в одном блоке в том же направлении, а значит содержат одну из заданных пар.\n\nСтратегия второго такова. Если первый ставит \\(X\\) в пронумерованную клетку, второй ставит \\(O\\) во вторую клетку той же пары. Если первый ставит \\(X\\) в клетку `x` или в клетку, чья пара уже занята, второй выбирает любую свободную клетку, не нарушая правила ответов на будущие ходы; таких клеток всегда бесконечно много. После каждого ответа второго ни одна полная пара не может состоять из двух \\(X\\). Но каждый возможный выигрышный отрезок из 11 клеток содержит полную пару, следовательно он не может быть полностью заполнен \\(X\\). Значит второй всегда предотвращает выигрыш первого.",
