  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Сжатое официальное решение",
      "text": "Для нижней оценки выбираем примерно половину требуемых разностей, например нечётные индексы, и строим граф на вершинах \\(S\\): для каждой выбранной разности добавляем ребро между соответствующими \\(x,y\\). Длины рёбер различны и равны числам Фибоначчи. Если бы возник цикл, взяли бы в нём самое длинное ребро. Сумма всех меньших выбранных чисел Фибоначчи строго меньше его длины, поэтому пройти от одного конца этого ребра к другому по остальным рёбрам невозможно. Значит, построенный граф — лес, и число его рёбер не превосходит \\(|S|-1\\). Это даёт нижнюю оценку. Верхняя конструкция берёт подходящие начальные суммы чисел Фибоначчи и достигает той же величины.",
