  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Решение через лес фибоначчиевых разностей",
      "text": "Ответ: \\(\\lceil n/2\\rceil+1\\). Пусть \\(d=\\lceil n/2\\rceil\\). Для нижней оценки выберем для каждого \\(k=1,\\ldots,d\\) пару элементов \\(x,y\\in S\\) с \\(x-y=F_{2k-1}\\); для \\(k=1\\) это допустимо, потому что \\(F_1=F_2\\), а разность \\(F_2\\) требуется условием. Построим граф на вершинах \\(S\\), добавив эти \\(d\\) рёбер. В нём нет цикла: если цикл есть, возьмём в нём самое длинное ребро длины \\(F_{2m+1}\\). Остальные рёбра цикла имеют различные длины из множества \\(F_1,F_3,\\ldots,F_{2m-1}\\), и потому сумма их длин не превосходит \\(F_1+F_3+\\cdots+F_{2m-1}=F_{2m}<F_{2m+1}\\). Но путь по остальным рёбрам должен соединять концы самого длинного ребра, что невозможно по неравенству треугольника на числовой прямой. Значит, граф является лесом, поэтому \\(d\\le |S|-1\\). Для достижения возьмём \\(S=\\{F_0,F_2,F_4,\\ldots,F_{2d}\\}\\). Тогда \\(F_{2k}=F_{2k}-F_0\\), а \\(F_{2k-1}=F_{2k}-F_{2k-2}\\), так что все разности \\(F_2,F_3,\\ldots,F_n\\) реализуются.",
