  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Официальное решение через лес фибоначчиевых разностей",
      "text": "Ответ: \\(\\lceil n/2\\rceil+1\\).\n\nПусть \\(d=\\lceil n/2\\rceil\\). Сначала докажем, что меньше чем \\(d+1\\) элементов быть не может. Возьмём произвольное множество \\(S\\), удовлетворяющее условию. Для каждого \\(r=1,2,\\ldots,d\\) выберем пару \\(x_r,y_r\\in S\\), для которой\n\\[\nx_r-y_r=F_{2r-1}.\n\\]\nТакую пару действительно можно выбрать: при \\(r=1\\) имеем \\(F_1=F_2\\), а разность \\(F_2\\) требуется условием; при \\(r\\ge2\\) индекс \\(2r-1\\) лежит между \\(3\\) и \\(2d-1\\), причём \\(2d-1\\le n\\), поэтому разность \\(F_{2r-1}\\) тоже требуется условием.\n\nПостроим граф \\(G\\) с множеством вершин \\(S\\), добавив для каждого \\(r\\) ребро между \\(x_r\\) и \\(y_r\\). Эти \\(d\\) рёбер различны. Действительно, их длины на числовой прямой равны \\(F_1,F_3,\\ldots,F_{2d-1}\\), а эти числа различны: \\(F_1=1\\), \\(F_3=2\\), и дальше последовательность строго возрастает.\n\nДокажем, что \\(G\\) не содержит циклов. Предположим обратное и рассмотрим произвольный цикл. Среди его рёбер выберем самое длинное; пусть его длина равна \\(F_{2m+1}\\). Удалив это ребро из цикла, получаем путь между теми же двумя вершинами. Каждое ребро этого пути имеет одну из меньших нечётных фибоначчиевых длин \\(F_1,F_3,\\ldots,F_{2m-1}\\), причём каждая такая длина может встретиться не более одного раза, потому что в граф мы добавляли ровно одно ребро каждой выбранной длины. Поэтому сумма длин рёбер пути не превосходит\n\\[\nF_1+F_3+\\cdots+F_{2m-1}.\n\\]\nДля полноты докажем нужное тождество. При \\(m=0\\) пустая сумма равна \\(0=F_0\\), а при \\(m\\ge1\\) из рекуррентности следует индукцией\n\\[\nF_1+F_3+\\cdots+F_{2m-1}=F_{2m}.\n\\]\nНапример, переход от \\(m\\) к \\(m+1\\) даёт \\(F_{2m}+F_{2m+1}=F_{2m+2}\\). Следовательно, сумма длин обходного пути не больше \\(F_{2m}<F_{2m+1}\\). Но на числовой прямой расстояние между концами самого длинного ребра равно \\(F_{2m+1}\\), а любой путь между этими концами должен иметь суммарную длину хотя бы это расстояние по неравенству треугольника. Получили противоречие. Значит, \\(G\\) является лесом.\n\nВ лесу на \\(|S|\\) вершинах не больше \\(|S|-1\\) рёбер, если \\(S\\ne\\varnothing\\). У нас рёбер \\(d\\), поэтому \\(d\\le |S|-1\\), то есть \\(|S|\\ge d+1=\\lceil n/2\\rceil+1\\).\n\nОсталось показать, что эта оценка достигается. Возьмём\n\\[\nS=\\{F_0,F_2,F_4,\\ldots,F_{2d}\\}.\n\\]\nВ этом множестве ровно \\(d+1\\) элемент. Если требуемый индекс чётный, \\(k=2r\\le n\\), то\n\\[\nF_k=F_{2r}=F_{2r}-F_0,\n\\]\nи обе точки лежат в \\(S\\). Если требуемый индекс нечётный, \\(k=2r+1\\le n\\), то \\(r\\ge1\\) и \\(2r+2\\le 2d\\); значит, оба числа \\(F_{2r+2}\\) и \\(F_{2r}\\) есть в \\(S\\), а\n\\[\nF_{2r+2}-F_{2r}=F_{2r+1}.\n\\]\nТем самым реализуются все разности \\(F_2,F_3,\\ldots,F_n\\). Минимальный размер множества равен \\(\\lceil n/2\\rceil+1\\).",
