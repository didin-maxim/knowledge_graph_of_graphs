        "id": "stmt-original",
        "title": "Условие",
        "text": "Дана бесконечная последовательность положительных целых чисел \\(a_i\\le2015\\). Для любых разных \\(i,j\\) выполнено \\(i+a_i\\ne j+a_j\\). Докажите, что существуют положительные целые \\(b,N\\), такие что для всех \\(n>m\\ge N\\) сумма \\(\\sum_{i=m+1}^n(a_i-b)\\) ограничена по модулю константой \\(1007^2\\).",
