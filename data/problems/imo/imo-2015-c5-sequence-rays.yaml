  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Сжатое официальное решение",
      "text": "Строим ориентированный граф на положительных целых числах, проводя стрелку \\(i\\to i+a_i\\). Условие \\(i+a_i\\ne j+a_j\\) означает, что входящая степень каждой вершины не больше 1; так как стрелки идут вправо и имеют длину не больше 2015, компоненты являются бесконечными лучами, начинающимися в вершинах без входящей стрелки. Таких стартовых вершин не больше 2015: иначе все соответствующие лучи пересекли бы один интервал длины 2015 в разных точках. Число лучей обозначается \\(b\\). Сравнивая количество стрелок, пересекающих большие отрезки, официальное решение получает, что сумма \\(\\sum(a_i-b)\\) на любом достаточно далёком отрезке ограничена универсальной константой.",
