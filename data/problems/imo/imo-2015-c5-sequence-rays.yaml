  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Развёрнутое решение через пул высот",
      "text": "Для каждого момента \\(t\\ge 0\\) рассмотрим пул шаров на высотах \\(i+a_i-t\\), где \\(i\\le t<i+a_i\\). Иначе говоря, шар соответствует стрелке \\(i\\to i+a_i\\), пересекающей вертикаль между \\(t\\) и \\(t+1\\). Так как \\(1\\le a_i\\le 2015\\), каждая такая высота лежит в диапазоне от 0 до 2014. Кроме того, условие \\(i+a_i\\ne j+a_j\\) при \\(i\\ne j\\) означает, что две разные стрелки никогда не заканчиваются в одной вершине, поэтому две разные высоты в одном и том же пуле не могут совпасть. Следовательно, в любой момент в пуле не более 2015 шаров.\n\nПереход от момента \\(t\\) к моменту \\(t+1\\) устроен так: если в пуле есть шар на высоте 0, он исчезает; затем добавляется новый шар на высоте \\(a_{t+1}-1\\); после этого все оставшиеся высоты уменьшаются на 1. Эквивалентно можно сказать так: сначала удаляется шар высоты 0, потом добавляется шар высоты \\(a_{t+1}\\), затем все высоты сдвигаются вниз на 1.\n\nОбозначим через \\(B_t\\) число шаров в пуле в момент \\(t\\). При переходе к следующему моменту мы удаляем не более одного шара и добавляем ровно один, поэтому \\(B_{t+1}\\ge B_t\\). Значит, последовательность \\(B_t\\) неубывает и ограничена сверху числом 2015; следовательно, существует момент \\(N\\), начиная с которого \\(B_t\\) постоянно равно некоторому максимуму \\(b\\). Для \\(t\\ge N\\) в пуле обязательно есть шар высоты 0: если бы его не было, на следующем шаге ничего бы не удалилось и число шаров увеличилось бы на 1, что противоречит максимальности \\(b\\).\n\nТеперь для \\(t\\ge N\\) обозначим через \\(S_t\\) сумму всех высот в пуле. Так как на каждом таком шаге удаляется ровно один шар высоты 0, добавляется шар высоты \\(a_{t+1}\\), а затем все \\(b\\) высот уменьшаются на 1, получаем\n\\[\nS_{t+1}=S_t+a_{t+1}-b.\n\\]\nСуммируя это равенство от \\(t=m\\) до \\(t=n-1\\), имеем\n\\[\n\\sum_{j=m+1}^n(a_j-b)=S_n-S_m\n\\]\nдля любых \\(n>m\\ge N\\).\n\nОстаётся оценить возможные значения \\(S_t\\). В пуле находятся \\(b\\) попарно различные целые высоты из множества \\(\\{0,1,\\dots,2014\\}\\). Поэтому\n\\[\n0+1+\\dots+(b-1)\\le S_t\\le 2014+2013+\\dots+(2015-b).\n\\]\nРазность между правой и левой частями равна\n\\[\n(2014+2013+\\dots+(2015-b))-(0+1+\\dots+(b-1))=b(2015-b).\n\\]\nОтсюда сразу следует грубая оценка \\(|S_n-S_m|\\le b(2015-b)\\). Но при \\(t\\ge N\\) высота 0 присутствует всегда, так что на самом деле наибольшая возможная сумма высот равна\n\\[\n0+2014+2013+\\dots+(2016-b),\n\\]\nа наименьшая — \\(0+1+2+\\dots+(b-1)\\). Поэтому разность между любыми двумя возможными значениями \\(S_t\\) не превосходит\n\\[\n(0+2014+2013+\\dots+(2016-b))-(0+1+2+\\dots+(b-1))=(b-1)(2015-b).\n\\]\nМаксимум выражения \\((b-1)(2015-b)\\) при целых \\(1\\le b\\le 2015\\) достигается при \\(b=1008\\) и равен \\(1007^2\\). Следовательно, для любых \\(n>m\\ge N\\)\n\\[\n\\left|\\sum_{j=m+1}^n(a_j-b)\\right|=|S_n-S_m|\\le 1007^2.\n\\]\nИтак, найдены положительные целые \\(b\\) и \\(N\\), для которых для всех \\(n>m\\ge N\\) выполнено\n\\[\n\\left|\\sum_{j=m+1}^n(a_j-b)\\right|\\le 1007^2.\n\\]",
