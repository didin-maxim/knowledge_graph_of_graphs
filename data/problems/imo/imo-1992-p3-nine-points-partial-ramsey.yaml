  "solutions": [
    {
      "id": "sol-aops-six-vertex-ramsey",
      "title": "AoPS: явная конструкция и сведение к K6",
      "text": "Ответ равен 33. Нижняя оценка на 32 окрашенных рёбрах строится очень явно: берём две четвёрки вершин \\(R_1,R_2,R_3,R_4\\) и \\(B_1,B_2,B_3,B_4\\), образующие два квадрата, и девятую вершину \\(X\\). Внутри первого квадрата красим стороны в красный, а диагонали оставляем неокрашенными; внутри второго квадрата по тому же правилу красим стороны в синий. Все рёбра от \\(X\\) к первой четвёрке красим в синий, а ко второй — в красный. Между \\(R_i\\) и \\(B_j\\) красим ребро в красный при одинаковой чётности индексов и в синий при разной. Тогда одноцветного треугольника нет: треугольники с вершиной \\(X\\) ломаются противоположным цветом или неокрашенным ребром, внутри квадратов нет подходящих диагоналей, а смешанные тройки разбиваются по чётности. Для верхней оценки заметим, что при 33 окрашенных рёбрах в \\(K_9\\) остаются только 3 неокрашенных ребра. Выберем по одной вершине на каждом из них и отбросим их. Среди оставшихся 6 вершин все рёбра окрашены. В любом двухцветно раскрашенном \\(K_6\\) есть одноцветный треугольник: из одной вершины выходят три ребра одного цвета; если среди их концов есть ребро того же цвета, всё готово, а иначе три конца образуют треугольник второго цвета. Значит, среди оставшихся вершин есть одноцветный треугольник.",
