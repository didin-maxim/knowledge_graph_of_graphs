  "solutions": [
    {
      "id": "sol-graph-review",
      "title": "Сжатое графовое решение",
      "text": "Ответ: 33. Нижний пример на 32 рёбрах строится из 5-цикловой Ramsey-раскраски K_5 без одноцветных треугольников, заменяя вершины на группы размеров 2,2,2,2,1 и раскрашивая междолевые рёбра по цвету соответствующего ребра C_5/дополнения, а внутри больших долей оставляя только безопасные рёбра. Для верхней оценки рассматривают красный и синий треугольник-свободные графы на 9 вершинах, покрывающие все окрашенные рёбра. Усиленная форма оценки Мантеля для пары таких графов даёт не более 32 рёбер без одноцветного треугольника; значит при 33 окрашенных рёбрах одноцветный треугольник неизбежен.",
