  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Сжатое официальное решение",
      "text": "Перейдём к графу запутанностей. Достаточно доказать лемму: если текущий граф правильно раскрашен в \\(n>1\\) цветов, то после конечной последовательности разрешённых операций можно получить граф, правильно раскрашенный в \\(n-1\\) цветов. Действительно, повторяя лемму, мы уменьшим число цветов до 1, а 1-раскрашиваемый граф не содержит рёбер. Докажем лемму. Сначала удаляем все доступные вершины нечётной степени; процесс конечный, и в оставшемся графе все степени чётны. Если он уже раскрашивается в \\(n-1\\) цветов, то всё готово. Иначе фиксируем правильную \\(n\\)-раскраску и выбираем непустой цветовой класс \\(C\\). Теперь удваиваем граф: берём две копии и добавляем ребро между каждой вершиной и её копией. После этого степень каждой вершины увеличивается на 1 и становится нечётной. При этом множество всех вершин класса \\(C\\) в обеих копиях остаётся независимым. Значит любую вершину из этого множества можно удалить, не меняя чётность у остальных вершин того же класса, потому что между ними нет рёбер. Удаляя все вершины класса \\(C\\) по одной, получаем граф, в котором остались только цвета \\(1,\\dots,n-1\\). Лемма доказана, а вместе с ней и исходная задача.",
