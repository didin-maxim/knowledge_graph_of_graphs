      "id": "sol-official-compressed",
      "title": "Полное доказательство через уменьшение числа цветов",
      "text": "Перейдём к графу запутанностей: имоны становятся вершинами, а пары запутанных имонов — рёбрами. Операция уничтожения имона есть удаление вершины нечётной степени, а операция удвоения есть замена графа двумя непересекающимися копиями с добавлением ребра между каждой вершиной и её копией. Достаточно доказать лемму: если текущий конечный граф правильно раскрашен в \\(n>1\\) цветов, то после конечной последовательности разрешённых операций можно получить граф, правильно раскрашиваемый в \\(n-1\\) цветов. Тогда исходный граф, имеющий не больше цветов, чем вершин, последовательным применением леммы приводится к 1-раскрашиваемому графу; в таком графе не может быть ребра, поскольку концы любого ребра должны иметь разные цвета. Докажем лемму. Сначала, пока возможно, удаляем любую вершину нечётной степени. Это законно, число вершин каждый раз уменьшается, поэтому процесс конечен. В оставшемся графе все степени чётны; кроме того, ограничение прежней правильной \\(n\\)-раскраски на оставшиеся вершины остаётся правильной \\(n\\)-раскраской. Если этот граф уже раскрашивается в \\(n-1\\) цветов, лемма доказана. Иначе зафиксируем его правильную раскраску цветами \\(1,2,\\dots,n\\) и применим операцию удвоения. Назовём одну копию старой, а другую новой. Старой вершине оставим её цвет \\(k\\), а копии вершины цвета \\(k\\) дадим цвет \\(k+1\\) по модулю \\(n\\), то есть после цвета \\(n\\) идёт цвет \\(1\\). Проверим, что это правильная \\(n\\)-раскраска удвоенного графа: рёбра внутри старой копии соединяют разные старые цвета; рёбра внутри новой копии тоже соединяют разные цвета, потому что ко всем цветам применён один и тот же циклический сдвиг; наконец, ребро между вершиной и её копией соединяет цвета \\(k\\) и \\(k+1\\), которые различны при \\(n>1\\). Перед удвоением все степени были чётны, а после удвоения степень каждой вершины равна прежней степени соответствующей вершины плюс 1, значит все степени стали нечётными. Теперь рассмотрим все вершины удвоенного графа, получившие цвет \\(n\\) в описанной раскраске. Они попарно не смежны, потому что раскраска правильная. Поэтому, удаляя такие вершины по одной, мы каждый раз удаляем вершину нечётной степени: из-за отсутствия рёбер между вершинами цвета \\(n\\) удаление уже выбранных вершин не меняет степени ещё не удалённых вершин того же цвета. После конечного числа удалений все вершины цвета \\(n\\) исчезнут, а на оставшемся графе сохранилась правильная раскраска только цветами \\(1,2,\\dots,n-1\\). Значит полученный граф раскрашивается в \\(n-1\\) цветов. Лемма доказана, а вместе с ней и исходная задача.",
