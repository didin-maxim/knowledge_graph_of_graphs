  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Сжатое официальное решение",
      "text": "Строим граф запутанностей. Доказывается лемма: если текущий граф имеет правильную раскраску в \\(n>1\\) цветов, то после конечной последовательности разрешённых операций можно получить граф, раскрашиваемый в \\(n-1\\) цветов. Сначала удаляют все возможные вершины нечётной степени. Затем удваивают граф: две копии и рёбра между соответствующими вершинами меняют чётности так, что один цветовой класс можно устранить, а оставшиеся классы переназначить. Повторяя лемму, уменьшаем число цветов до одного; граф, раскрашиваемый в один цвет, не имеет рёбер.",
