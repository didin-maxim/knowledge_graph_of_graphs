        "id": "stmt-original",
        "title": "Условие",
        "text": "Есть конечное семейство частиц-имонов; некоторые пары имонов связаны отношением запутанности. Разрешены операции: удалить имона, если он запутан с нечётным числом других, и удвоить всё семейство, создавая копии всех имонов с теми же взаимными запутанностями между копиями и с новой связью каждого имона со своей копией. Докажите, что можно прийти к состоянию, где никакие два имона не запутаны.",
