        "id": "stmt-graph",
        "text": "Дан конечный простой граф. Разрешены две операции: удалить вершину нечётной степени вместе со всеми инцидентными ей рёбрами; заменить граф двумя его непересекающимися копиями и добавить ребро между каждой вершиной первой копии и соответствующей вершиной второй. Докажите, что после конечного числа таких операций можно получить граф без рёбер.",
