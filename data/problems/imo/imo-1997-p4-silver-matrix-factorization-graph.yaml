    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Можно рассматривать появление символа в клетке \\((i,j)\\) как покрытие индексов \\(i\\) и \\(j\\), но опубликованные решения в основном используют паритетный подсчёт появлений символов, а не полноценную теорию паросочетаний.",
