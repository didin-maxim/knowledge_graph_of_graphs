        "id": "stmt-original",
        "text": "Матрица n x n с элементами из {1,2,...,2n-1} называется серебряной, если для каждого i объединение i-й строки и i-го столбца содержит все 2n-1 чисел. Докажите, что серебряных матриц нет при n=1997, и что они существуют для бесконечно многих n.",
        "status": "needs_human_review",
        "self_contained": {
          "status": "ai_checked"
        },
