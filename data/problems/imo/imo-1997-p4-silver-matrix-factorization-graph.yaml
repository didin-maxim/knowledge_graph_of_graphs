  "solutions": [
    {
      "id": "sol-graph-review",
      "title": "Сжатое графовое решение",
      "text": "Опубликованное решение начинается с подсчёта появлений символов. Если перечислить все элементы по строкам, а затем по столбцам, каждый элемент матрицы посчитан дважды, значит каждый символ встречается чётное число раз. С другой стороны, для каждого \\(i\\) объединение i-й строки и i-го столбца даёт полный набор \\(1,2,\\dots,2n-1\\); по всем \\(i\\) это \\(n\\) полных наборов плюс дополнительный вклад диагональных элементов. Если \\(n\\) нечётно, то каждый символ появляется нечётное число раз в \\(n\\) полных наборах, и диагональ может изменить чётность не более чем для \\(n\\) символов; при \\(2n-1>n\\) это невозможно. Поэтому при \\(n=1997\\) серебряной матрицы нет. Конструкция для бесконечно многих \\(n\\) задаётся рекурсивно/циклически для чётных размеров. Графовая трактовка как покрытия индексов возможна, но в найденных опубликованных решениях она не является основной.",
      "idea_ids": [
