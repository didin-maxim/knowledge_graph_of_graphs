  "solutions": [
    {
      "id": "sol-k-le-4-impossible",
      "title": "Доказательство невозможности для k ≤ 4",
      "text": "Для \\(k=1\\) выбранная одна вершина не содержит рёбер, а для \\(k=2\\) две выбранные вершины содержат только одно ребро, поэтому требование сразу невозможно. Пусть \\(k=3\\). Тогда каждые три вершины должны образовывать треугольник с тремя разными цветами. Значит, из любой вершины не могут выходить два ребра одного цвета: если \\(AB\\) и \\(AC\\) одного цвета, то треугольник \\(ABC\\) не радужный. Но из вершины выходят 9 рёбер, а цветов только 3, противоречие.\n\nОсталось исключить \\(k=4\\). Предположим, что подходящая 4-раскраска существует, и назовём один цвет синим. Из любой вершины не может выходить четыре синих ребра. В самом деле, если \\(AB,AC,AD,AE\\) синие, то среди \\(B,C,D,E\\) либо есть синее ребро, и тогда четыре вершины с \\(A\\) и концами этого ребра содержат четыре синих ребра и не могут содержать все четыре цвета, либо синего ребра среди \\(B,C,D,E\\) нет, и сами \\(B,C,D,E\\) не содержат синего цвета. Следовательно, в каждой вершине степень каждого цвета не больше 3.\n\nТак как из вершины выходит 9 рёбер четырёх цветов, для некоторой вершины \\(A\\) и некоторого цвета, пусть синего, выходят ровно три синих ребра \\(AB,AC,AD\\). Рёбра \\(BC,BD,CD\\) не синие, иначе четыре вершины \\(A,B,C,D\\) имели бы слишком много синих рёбер и не все четыре цвета. Рассмотрим шесть остальных вершин. По \\(R(3,3)=6\\) в раскраске их рёбер на синие и несиние есть либо несиний треугольник, либо синий треугольник. Несиний треугольник вместе с \\(A\\) даёт четыре вершины без синего ребра. Если же \\(E,F,G\\) образуют синий треугольник, то среди \\(B,C,D,E\\) должно быть синее ребро, а так как \\(BC,BD,CD\\) не синие, одно из \\(BE,CE,DE\\) синее. Тогда эта вершина вместе с \\(E,F,G\\) даёт четыре вершины с четырьмя синими рёбрами, а значит там не могут встретиться все четыре цвета. Противоречие.",
