      "id": "idea-small-k-basic-obstructions",
      "title": "Слишком мало рёбер при k = 1,2 и слишком мало цветов у звезды при k = 3",
      "text": "Для k = 1 и k = 2 в выбранных k вершинах меньше k рёбер. Для k = 3 каждое треугольное множество должно быть радужным; тогда в одной вершине никакие два инцидентных ребра не могут иметь один цвет, что невозможно при 9 рёбрах и 3 цветах.",
