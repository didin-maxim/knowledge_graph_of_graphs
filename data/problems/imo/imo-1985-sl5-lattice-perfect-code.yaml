  "solutions": [
    {
      "id": "sol-graph-review",
      "title": "Сжатое графовое решение",
      "text": "Положим S={(x,y,z): x+2y+3z ≡ 0 (mod 7)}. У шести соседей точки значение этой линейной формы отличается на ±1, ±2, ±3, то есть на все ненулевые остатки по модулю 7. Поэтому две соседние точки не могут обе лежать в S. Если же значение в точке равно r≠0, то среди шести изменений ±1,±2,±3 ровно одно равно -r mod 7; соответствующий сосед и только он лежит в S.",
