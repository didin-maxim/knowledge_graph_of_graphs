        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [],
        "distinct_from": [
          "stmt-graph"
        ],
        "title": "Условие",
        "source_id": "src-kalva-imo-1985-shortlist"
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Рассмотрим бесконечный граф с множеством вершин \\(\\mathbb Z^3\\), в котором две вершины соединены ребром тогда и только тогда, когда они отличаются ровно в одной координате на 1. Докажите, что существует множество вершин \\(S\\), являющееся совершенным кодом радиуса 1: никакие две вершины из \\(S\\) не смежны, и каждая вершина вне \\(S\\) имеет ровно одного соседа в \\(S\\).",
