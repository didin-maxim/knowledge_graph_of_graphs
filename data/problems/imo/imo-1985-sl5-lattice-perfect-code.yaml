  "solutions": [
    {
      "id": "sol-graph-review",
      "title": "Решение через линейную метку по модулю 7",
      "text": "Положим \\(S=\\{(x,y,z): x+2y+3z \\equiv 0 \\pmod 7\\}\\). Рассмотрим вершину \\((x,y,z)\\) кубической решётки и обозначим \\(L=x+2y+3z\\). При переходе к шести соседям \\((x\\pm1,y,z)\\), \\((x,y\\pm1,z)\\), \\((x,y,z\\pm1)\\) значение \\(L\\) меняется соответственно на \\(\\pm1,\\pm2,\\pm3\\), то есть на шесть различных ненулевых остатков по модулю 7. Поэтому если две вершины соседние, их значения \\(L\\) по модулю 7 различаются на ненулевой остаток, и они не могут обе лежать в \\(S\\); множество \\(S\\) независимо. Если же для вершины значение \\(L\\equiv r\\ne0\\pmod 7\\), то среди шести изменений \\(\\pm1,\\pm2,\\pm3\\) ровно одно сравнимо с \\(-r\\) по модулю 7. Ровно соответствующий сосед имеет метку \\(0\\) и лежит в \\(S\\), а остальные пять соседей в \\(S\\) не лежат. Значит построенное множество имеет требуемое свойство: вершины из \\(S\\) не соседствуют друг с другом, а каждая вершина вне \\(S\\) имеет ровно одного соседа в \\(S\\).",
