        "id": "stmt-original",
        "text": "В множестве всех целочисленных точек пространства две точки называются соседними, если две координаты совпадают, а третья отличается на 1. Докажите, что существует подмножество S, в котором никакие две соседние точки не лежат вместе, а каждая точка вне S имеет ровно одного соседа из S.",
