        "id": "stmt-graph-three-attempts",
        "text": "Рассмотрим решётчатый граф \\(2024\\times2023\\), вершины которого — клетки доски, а рёбра соединяют клетки с общей стороной. В каждой внутренней строке скрыта ровно одна запрещённая вершина, причём в каждом столбце запрещённых вершин не более одной. Игрок адаптивно выбирает пути, начинающиеся в первой строке; путь прерывается при первом попадании в запрещённую вершину, после чего игрок знает все посещённые безопасные вершины и найденную запрещённую вершину. Постройте стратегию, которая за три пути гарантирует достижение последней строки при любой скрытой конфигурации.",
