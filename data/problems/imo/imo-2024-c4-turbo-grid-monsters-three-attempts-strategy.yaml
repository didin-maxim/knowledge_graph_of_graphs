  "solutions": [
    {
      "id": "sol-three-attempt-strategy",
      "title": "Конструктивная стратегия за три попытки",
      "text": "В первой попытке Турбо идёт по пути \\((1,1),(2,1),(2,2),\\ldots,(2,2023)\\), тем самым находит монстра во второй строке. Пусть он стоит в \\((2,i)\\). Если \\(2\\le i\\le2022\\), то во второй и третьей попытках Турбо идёт по путям через \\((2,i-1),(3,i-1),(3,i),(4,i),\\ldots,(2024,i)\\) и через \\((2,i+1),(3,i+1),(3,i),(4,i),\\ldots,(2024,i)\\). В столбце \\(i\\) ниже монстров нет, потому что монстр этого столбца уже найден во второй строке. Единственные новые опасные точки перед выходом в безопасный столбец — \\((3,i-1)\\) и \\((3,i+1)\\); они лежат в одной строке, где монстр только один, поэтому хотя бы одна из двух попыток успешна. Если монстр второй строки стоит на краю, скажем в \\((2,1)\\), то во второй попытке Турбо идёт от \\((1,2)\\) по ломаной \\((2,2),(2,3),(3,3),(4,4),\\ldots,(2023,2023),(2024,2023)\\). Если монстра нет, он уже победил. Иначе пусть первый встреченный монстр — \\((r,c)\\), где по форме пути \\(c=r\\) или \\(c=r+1\\). В третьей попытке Турбо повторяет безопасную начальную часть до строки \\(r-1\\), затем проходит по строке \\(r\\) влево до первого столбца и дальше спускается по первому столбцу. Начальная часть безопасна, клетки строки \\(r\\) левее \\((r,c)\\) безопасны, потому что в строке \\(r\\) только один монстр, а первый столбец ниже безопасен, потому что его единственный монстр уже найден в \\((2,1)\\). Поэтому третья попытка достигает последней строки. Случай монстра в \\((2,2023)\\) симметричен.",
