        "id": "stmt-original-three-attempts",
        "title": "Улитка, доска и три попытки",
        "text": "Улитка Турбо играет на доске с \\(2024\\) строками и \\(2023\\) столбцами. В \\(2022\\) клетках спрятаны монстры. Сначала Турбо не знает, где они находятся, но знает, что ровно по одному монстру стоит в каждой строке, кроме первой и последней, и что в каждом столбце находится не более одного монстра. Турбо делает попытки пройти из первой строки в последнюю. В каждой попытке он выбирает любую клетку первой строки, а затем многократно переходит в соседнюю по стороне клетку; ему разрешено возвращаться в уже посещённые клетки. Если Турбо попадает в клетку с монстром, попытка заканчивается, и его возвращают в первую строку. Монстры не двигаются, а Турбо запоминает, в каких посещённых клетках есть монстры и в каких их нет. Если он достигает любой клетки последней строки, попытка заканчивается, и игра выиграна. Докажите, что у Турбо есть стратегия, гарантирующая победу не позже третьей попытки.",
