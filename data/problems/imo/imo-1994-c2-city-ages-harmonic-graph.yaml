        "id": "stmt-original",
        "text": "В городе возраст измеряется вещественными числами. Любые два жителя либо знакомы, либо нет; если не знакомы, то между ними есть цепочка знакомств. На переписи все мужчины называют свои возраста, и мужчин хотя бы один. Каждая женщина сообщает только, что её возраст равен среднему арифметическому возрастов всех её знакомых. Докажите, что этой информации достаточно, чтобы единственным образом определить возраста всех женщин.",
