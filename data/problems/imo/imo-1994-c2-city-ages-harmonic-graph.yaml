  "statements": {
    "original": [
      {
        "id": "stmt-original",
        "text": "В городе возраст измеряется вещественными числами. Любые два жителя либо знакомы, либо нет; если не знакомы, то между ними есть цепочка знакомств. На переписи все мужчины называют свои возраста, и мужчин хотя бы один. Каждая женщина сообщает только, что её возраст равен среднему арифметическому возрастов всех её знакомых. Докажите, что этой информации достаточно, чтобы единственным образом определить возраста всех женщин.",
        "source_id": "src-secondary-imo-1994-shortlist",
        "status": "needs_human_review",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [],
        "title": "Условие",
        "distinct_from": [
          "stmt-graph"
        ]
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Пусть \\(G\\) — связный граф, \\(B\\subseteq V(G)\\) — непустое множество граничных вершин, и на \\(B\\) заданы вещественные значения. Докажите, что существует не более одной функции \\(f:V(G)\\to\\mathbb R\\), совпадающей с заданными значениями на \\(B\\) и удовлетворяющей для каждой вершины \\(v\\in V(G)\\setminus B\\) условию дискретной гармоничности\n\\[\nf(v)=\\frac1{\\deg(v)}\\sum_{u\\sim v} f(u).\n\\]",
