  "solutions": [
    {
      "id": "sol-secondary-sketch",
      "title": "Сжатый графовый разбор",
      "text": "Предположим, что есть два набора возрастов женщин, совместимых с данными. Рассмотрим разность этих двух наборов, продолжив её нулём на всех мужских вершинах. В каждой женской вершине значение разности равно среднему значений соседей. Если где-то есть положительное значение, возьмём вершину с максимальной положительной разностью. Среднее соседних значений равно максимуму, значит все соседи тоже имеют этот максимум. По связности это значение распространяется вдоль цепочки до некоторого мужчины, где разность равна нулю, противоречие. Так же исключается отрицательный минимум. Следовательно, разность тождественно равна нулю, и возраста женщин определяются единственно.",
