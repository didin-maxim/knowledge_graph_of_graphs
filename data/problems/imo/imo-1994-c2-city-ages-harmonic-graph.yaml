  "solutions": [
    {
      "id": "sol-secondary-sketch",
      "title": "Полное решение через дискретный принцип максимума",
      "text": "Построим граф знакомств: вершины — жители города, ребро соединяет знакомых. По условию этот конечный граф связен, а множество мужских вершин непусто. Достаточно доказать единственность: пусть есть два набора женских возрастов, совместимых с одними и теми же известными мужскими возрастами и со всеми сообщениями женщин.\n\nРассмотрим разность \\(h\\) этих двух наборов, положив \\(h(v)=0\\) в каждой мужской вершине. Для женской вершины \\(v\\) оба набора удовлетворяют одному и тому же равенству\n\\[\nf(v)=\\frac1{\\deg(v)}\\sum_{u\\sim v} f(u),\n\\]\nпоэтому после вычитания\n\\[\nh(v)=\\frac1{\\deg(v)}\\sum_{u\\sim v} h(u).\n\\]\nТо есть \\(h\\) равна нулю на мужских вершинах и гармонична на женских.\n\nПредположим, что где-то \\(h>0\\), и пусть \\(M>0\\) — максимальное значение \\(h\\) на всех вершинах. Оно не может достигаться в мужской вершине, потому что там \\(h=0\\), значит выберем женскую вершину \\(v\\) с \\(h(v)=M\\). Все соседние значения не превосходят \\(M\\), а их среднее равно \\(M\\). Среднее чисел, каждое из которых не больше \\(M\\), равно \\(M\\) только тогда, когда все эти числа равны \\(M\\). Следовательно, каждый сосед \\(v\\) тоже имеет значение \\(M\\).\n\nТеперь возьмём путь от \\(v\\) к какой-нибудь мужской вершине; он существует по связности графа и непустоте множества мужчин. Двигаясь по этому пути, получаем индукцией: если текущая вершина женская и имеет значение \\(M\\), то следующая вершина пути, будучи её соседом, тоже имеет значение \\(M\\). Если на пути сразу или позже встретилась мужская вершина, она должна иметь значение \\(M\\), но на всех мужских вершинах \\(h=0\\). Это противоречит \\(M>0\\). Значит положительных значений у \\(h\\) нет.\n\nПрименяя тот же аргумент к функции \\(-h\\), получаем, что отрицательных значений у \\(h\\) тоже нет. Следовательно, \\(h\\equiv0\\), то есть два возможных набора женских возрастов совпадают. Поэтому данные переписи определяют возраста всех женщин единственным образом.",
