      "id": "idea-turan-min-degree",
      "title": "Большая минимальная степень позволяет наращивать клику",
      "text": "Если уже выбрана клика из \\(s\\le5\\) вершин, то у каждой ее вершины мало несоседей. Объединение этих множеств несоседей не покрывает все оставшиеся вершины, поэтому клику можно продолжить.",
