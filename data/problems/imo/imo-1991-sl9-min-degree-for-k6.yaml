        "id": "stmt-graph",
        "text": "Пусть \\(N\\) — натуральное число. Найдите наименьшее число \\(d_6(N)\\) со свойством: любой простой граф \\(G\\) на \\(N\\) вершинах с минимальной степенью \\(\\delta(G)\\ge d_6(N)\\) содержит клику \\(K_6\\). Для случая \\(N=1991\\) вычислите \\(d_6(1991)\\) и покажите, что эта граница точна.",
