  "solutions": [
    {
      "id": "sol-graph-review",
      "title": "Сжатое графовое решение",
      "text": "Если граф не содержит K_6, то по теореме Турана его плотность не превосходит плотность полного 5-дольного графа. В минимально-степенной форме удобно рассуждать так: в K_6-свободном экстремальном графе можно симметризовать несмежные вершины и прийти к полному 5-дольному графу; при 1991 вершине одна часть имеет размер не меньше ceil(1991/5)=399, поэтому в таком графе есть вершина степени не больше 1991-399=1592. Значит δ≥1593 гарантирует K_6. Граница точна: полный 5-дольный граф с размерами 399,398,398,398,398 имеет минимальную степень 1592 и не содержит шести попарно смежных вершин.",
