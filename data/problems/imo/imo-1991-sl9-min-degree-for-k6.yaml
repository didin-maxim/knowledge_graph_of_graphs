  "solutions": [
    {
      "id": "sol-graph-review",
      "title": "Школьное решение через общих соседей",
      "text": "Докажем сначала, что условие \\(\\delta(G)\\ge1593\\) гарантирует клику \\(K_6\\). У каждой вершины не больше \\(1990-1593=397\\) несоседей. Предположим, что уже выбрана клика \\(C\\) из \\(s<6\\) вершин. Число вершин вне \\(C\\), которые не соединены хотя бы с одной вершиной из \\(C\\), не превосходит \\(397s\\). Поэтому общих соседей всех вершин \\(C\\) вне самой \\(C\\) не меньше\n\\[\n1991-s-397s=1991-398s.\n\\]\nДля \\(s=1,2,3,4,5\\) это число положительно, а при \\(s=5\\) оно равно \\(1\\). Значит любую уже построенную клику размера меньше \\(6\\) можно продолжить ещё одной вершиной. Начиная с произвольной вершины, получаем шесть попарно смежных вершин.\n\nГраница точна. Разобьём 1991 вершину на пять частей размеров \\(399,398,398,398,398\\) и соединим ребром любые две вершины из разных частей, но не соединяем вершины внутри одной части. Это полный 5-дольный граф. В нём нет \\(K_6\\), потому что из каждой части можно взять не более одной вершины клики. Минимальная степень равна степени вершины из самой большой части, то есть \\(1991-399=1592\\). Следовательно, 1593 — наилучшая возможная граница.",
      "idea_ids": [
        "idea-turan-min-degree",
        "idea-balanced-construction"
      ],
      "standard_idea_ids": [
        "extremal_choice"
      ],
      "status": "ai_checked",
      "definition_ids": [
        "degree",
        "complete_graph"
      ]
    },
    {
      "id": "sol-short-turan-min-degree",
      "title": "Короткий внешний вариант через теорему Турана",
      "text": "Если граф не содержит \\(K_6\\), то по теореме Турана его число рёбер не превосходит числа рёбер полного 5-дольного графа с максимально равными долями. В частности, в минимально-степенной экстремальной картине одна доля при 1991 вершине имеет размер не меньше \\(\\lceil1991/5\\rceil=399\\), поэтому есть вершина степени не больше \\(1991-399=1592\\). Следовательно, минимальная степень \\(1593\\) гарантирует \\(K_6\\). Точность даёт полный 5-дольный граф с долями \\(399,398,398,398,398\\).",
