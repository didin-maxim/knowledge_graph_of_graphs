  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Официальное решение, развёрнутое",
      "text": "Ответ: все простые числа и все степени двойки.\n\nПримеры. Если \\(n=2^k\\), берём \\(P(x)=2x\\). Тогда образ \\(P^m\\) по модулю \\(2^k\\) состоит из кратных \\(2^m\\), пока \\(m\\le k\\), и из одного нуля после этого. Поэтому его размер равен \\(2^{k-m}\\) при \\(m\\le k\\) и равен 1 при \\(m>k\\), то есть \\(\\lceil2^k/2^m\\rceil\\). Если \\(n=p\\) простое, то для \\(p=2\\) пример уже есть, а для нечётного \\(p\\) зададим на представителях \\(0,1,\\ldots,p-1\\) функцию \\(f(x)=\\lfloor x/2\\rfloor\\). Любая функция на поле \\(\\mathbb F_p\\) задаётся многочленом по интерполяции Лагранжа, и коэффициенты можно поднять до целых. Тогда \\(f^m(x)=\\lfloor x/2^m\\rfloor\\), так что множество значений равно \\(\\{0,1,\\ldots,\\lfloor(p-1)/2^m\\rfloor\\}\\), а его размер равен \\(\\lfloor(p-1)/2^m\\rfloor+1=\\lceil p/2^m\\rceil\\).\n\nТеперь докажем невозможность остальных \\(n\\). Для модуля \\(q\\) обозначим через \\(I_m(q)\\) размер образа \\(P^m\\) на остатках по модулю \\(q\\). Для любого конечного отображения образы образуют убывающую цепочку. Если два соседних образа имеют одинаковый размер, то они равны, и дальше размер уже стабилен. В нашей задаче по модулю \\(n\\) размеры в конце становятся равными 1.\n\nСначала исключим наличие двух взаимно простых множителей. Пусть \\(n=ab\\), где \\((a,b)=1\\) и \\(a,b>1\\). По китайской теореме об остатках \\(I_m(ab)=I_m(a)I_m(b)\\). Оба множителя в конце должны стать равными 1. Возьмём первый \\(m\\), для которого \\(I_{m+1}(a)=1\\) или \\(I_{m+1}(b)=1\\), и пусть без ограничения общности \\(I_{m+1}(a)=1\\). Тогда по минимальности \\(I_m(a)>1\\) и \\(I_m(b)>1\\); кроме того, \\(I_{m+1}(b)<I_m(b)\\), иначе образ по модулю \\(b\\) стабилизировался бы больше чем в одной точке. Значит, \\(I_{m+1}(ab)=I_{m+1}(b)<I_m(b)\\le I_m(a)I_m(b)/2=I_m(ab)/2\\). Но требуемое правило даёт \\(I_{m+1}(ab)=\\lceil I_m(ab)/2\\rceil\\ge I_m(ab)/2\\), противоречие. Следовательно, \\(n\\) является степенью одного простого числа.\n\nОсталось исключить \\(n=p^k\\), где \\(p\\ge3\\) и \\(k\\ge2\\). Для класса \\(S_r=\\{x\\pmod {p^k}: x\\equiv r\\pmod p\\}\\) верно следующее наблюдение: образ \\(F(S_r)\\) под любым целочисленным многочленом \\(F\\) либо имеет полный размер \\(p^{k-1}\\), либо имеет размер не больше \\(p^{k-2}\\). Все значения лежат в одном классе по модулю \\(p\\). Если \\(F'(r)\\not\\equiv0\\pmod p\\), то отображение внутри этого класса локально обратимо: при записи \\(x=r+pt\\) первая ненулевая поправка равна \\(pF'(r)t\\), поэтому разные \\(t\\pmod {p^{k-1}}\\) дают все элементы класса. Если \\(F'(r)\\equiv0\\pmod p\\), то при изменении \\(x\\) на кратное \\(p\\) значение \\(F(x)\\) меняется на кратное \\(p^2\\), и значений не больше \\(p^{k-2}\\). Это применимо и к итерациям \\(P^i\\), потому что они тоже многочлены.\n\nВыберем первый момент \\(m\\), когда для всех \\(q\\) множества \\(P^m(S_q)\\) уже имеют размер не больше \\(p^{k-2}\\). Тогда для некоторого \\(r\\) ещё было \\(|P^{m-1}(S_r)|=p^{k-1}\\), но уже \\(|P^m(S_r)|\\le p^{k-2}\\). Положим \\(A=P^m(\\mathbb Z/p^k\\mathbb Z)\\setminus P^m(S_r)\\) и \\(a=|A|\\). Множество вне \\(P^{m-1}(S_r)\\) после применения \\(P\\) покрывает все точки \\(A\\), поэтому \\(|P^{m-1}(\\mathbb Z/p^k\\mathbb Z)|\\ge a+p^{k-1}\\). Также \\(|P^m(\\mathbb Z/p^k\\mathbb Z)|\\le a+p^{k-2}\\). Поскольку следующий размер есть половина предыдущего с округлением вверх, предыдущий размер не больше удвоенного следующего. Отсюда \\(a+p^{k-1}\\le2(a+p^{k-2})\\), то есть \\(a\\ge(p-2)p^{k-2}\\).\n\nРассмотрим теперь индуцированное отображение по модулю \\(p\\). Так как по модулю \\(p^k\\) все остатки в конце приходят в одну точку, по модулю \\(p\\) есть единственный предельный неподвижный остаток \\(t\\). В функциональном графе на \\(\\mathbb F_p\\) множество остатков, которые попадают в \\(t\\) не более чем за \\(i\\) шагов, строго растёт, пока не станет всем полем. Поэтому на шаге \\(m-1\\) либо все \\(p\\) остатков уже попадают в \\(t\\), либо таких остатков как минимум \\(m\\).\n\nЕсли к шагу \\(m-1\\) все остатки уже попадают в \\(t\\), то весь \\(P^{m-1}\\)-образ по модулю \\(p^k\\) лежит в одном классе \\(S_t\\). Но он содержит полное множество \\(P^{m-1}(S_r)\\) размера \\(p^{k-1}\\), значит равен этому классу, и вне него ничего нет; тогда \\(a=0\\), противоречие.\n\nИтак, есть множество \\(X\\) из хотя бы \\(m\\) остатков, которые за \\(m-1\\) шагов попадают в \\(t\\), но не все остатки обладают этим свойством. Пусть \\(Y\\) — объединение классов \\(S_x\\) по \\(x\\in X\\), а \\(Z\\) — объединение остальных классов. Тогда \\(P^{m-1}(Y)\\subset S_t\\). Поскольку \\(t\\) неподвижен по модулю \\(p\\), имеем \\(P(S_t)\\subset S_t\\); если бы \\(P(S_t)=S_t\\), полный класс \\(S_t\\) никогда не схлопнулся бы до одной точки, что невозможно. Значит, \\(P(S_t)\\) — собственный образ класса, и по наблюдению выше \\(|P(S_t)|\\le p^{k-2}\\). Поэтому \\(|P^m(Y)|\\le p^{k-2}\\). Для остальных не более чем \\(p-|X|\\) классов каждый образ после \\(m\\) шагов тоже имеет размер не больше \\(p^{k-2}\\). Поэтому \\(|P^m(\\mathbb Z/p^k\\mathbb Z)|\\le(p-m+1)p^{k-2}\\). Но \\(a\\) является собственной частью этого образа, а значит \\((p-2)p^{k-2}\\le a<|P^m(\\mathbb Z/p^k\\mathbb Z)|\\le(p-m+1)p^{k-2}\\). Получаем \\(m<3\\). Значит, уже \\(P^2(S_q)\\) мало для каждого класса, и \\(|P^2(\\mathbb Z/p^k\\mathbb Z)|\\le p\\cdot p^{k-2}=p^{k-1}\\). Это противоречит условию при \\(p\\ge5\\), потому что \\(\\lceil p^k/4\\rceil>p^{k-1}\\).\n\nОстаётся \\(p=3\\). Пусть \\(t\\) — единственный предельный неподвижный остаток по модулю 3. Если \\(P'(t)\\not\\equiv0\\pmod3\\), то \\(P\\) биективно переводит полный класс \\(S_t\\) в себя, и он никогда не схлопнется до одной точки. Поэтому \\(P'(t)\\equiv0\\pmod3\\). Тогда индукцией: элементы \\(P^i(S_t)\\) попарно сравнимы по модулю \\(3^{i+1}\\). База \\(i=0\\) очевидна. Если два аргумента сравнимы по модулю \\(3^{i+1}\\) и оба сравнимы с \\(t\\) по модулю 3, то их образы отличаются на их разность, умноженную на число, сравнимое с \\(P'(t)\\) по модулю 3, плюс более высокие степени разности; значит, новая разность делится на \\(3^{i+2}\\). При \\(i=k-1\\) получаем \\(|P^{k-1}(S_t)|=1\\). На трёх остатках по модулю 3 любой функциональный граф с единственным предельным неподвижным остатком приходит в него за два шага, поэтому \\(P^2\\) всего множества лежит в \\(S_t\\). Следовательно, \\(|P^{k+1}(\\mathbb Z/3^k\\mathbb Z)|\\le1\\). Но по условию это \\(\\lceil3^k/2^{k+1}\\rceil\\), а для \\(k\\ge2\\) это больше 1. Противоречие исключает и степени \\(3^k\\) при \\(k\\ge2\\).",
