      "id": "sol-two-attempt-adversary",
      "title": "Стратегия монстров против двух попыток",
      "text": "Пусть в первой попытке Турбо впервые достигает второй строки в клетке \\((2,i)\\). Расположение монстров, при котором монстр второй строки стоит именно в \\((2,i)\\), не противоречит условиям, поэтому первая попытка может закончиться сразу. Во второй попытке Турбо уже знает, что \\((2,i)\\) опасна, и если он впервые достигает третьей строки, то делает это в некоторой клетке \\((3,j)\\), придя из \\((2,j)\\), где \\(j\\ne i\\). Теперь можно поставить монстра третьей строки в \\((3,j)\\). Условия снова соблюдены: монстры в разных строках и в разных столбцах. Тогда и вторая попытка заканчивается неудачей. Значит, двух попыток недостаточно для гарантированной победы.",
