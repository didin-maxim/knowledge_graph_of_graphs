        "title": "Формулировка через слои расстояний",
        "text": "Введём обозначение сфер вокруг вершины: \\(L_i(x)=\\{y\\in V(G):\\operatorname{dist}(x,y)=i\\}\\). Пусть для любого центра \\(x\\) третья сфера \\(L_3(x)\\) имеет размер не больше \\(M\\). Докажите, что для любого выбора центра \\(x\\) четвёртая сфера \\(L_4(x)\\) содержит не более \\(\\left\\lfloor (M+1)^2/4\\right\\rfloor\\) вершин.",
