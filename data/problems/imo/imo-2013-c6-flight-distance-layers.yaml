    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Пусть \\(G\\) — связный неориентированный граф, а \\(M\\ge 1\\). Известно, что для любой вершины \\(x\\) число вершин, находящихся от \\(x\\) на расстоянии ровно 3, не превосходит \\(M\\). Докажите, что для любой вершины \\(x\\) число вершин на расстоянии ровно 4 от \\(x\\) не превосходит \\(\\left\\lfloor (M+1)^2/4\\right\\rfloor\\).",
