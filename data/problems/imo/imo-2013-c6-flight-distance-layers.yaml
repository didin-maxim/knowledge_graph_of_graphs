  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Полное доказательство через минимальное покрытие четвёртого слоя",
      "text": "Обозначим через \\(d(u,v)\\) расстояние между городами, а через \\(S_i(u)\\) множество городов на расстоянии ровно \\(i\\) от \\(u\\). Предположим противное: для некоторого города \\(x\\) множество \\(D=S_4(x)\\) имеет размер хотя бы \\(2551\\). Пусть \\(A=S_1(x)\\). Назовём подмножество \\(A'\\subseteq A\\) существенным, если каждый город из \\(D\\) достижим из \\(x\\) кратчайшим путём длины 4, проходящим через некоторый город из \\(A'\\); эквивалентно, \\(D\\subseteq\\bigcup_{a\\in A'}S_3(a)\\). Множество \\(A\\) существенно, поэтому выберем существенное подмножество \\(A^*\\) минимальной мощности \\(m\\). Так как \\(m(101-m)\\le50\\cdot51=2550<|D|\\), найдётся \\(a\\in A^*\\), для которого \\(|S_3(a)\\cap D|\\ge102-m\\). Из условия \\(|S_3(a)|\\le100\\), значит среди городов из \\(S_3(a)\\) не более \\(100-(102-m)=m-2\\) имеют расстояние от \\(x\\) не больше 3. Обозначим эти города через \\(T=\\{c\\in S_3(a): d(x,c)\\le3\\}\\); тогда \\(|T|\\le m-2\\). Получим противоречие, построив в \\(T\\) по крайней мере \\(m-1\\) различных городов. Рассмотрим \\(A_a=A^*\\setminus\\{a\\}\\). По минимальности \\(A^*\\), для каждого \\(y\\in A_a\\) существует город \\(d_y\\in D\\), к которому нельзя дойти из \\(x\\) кратчайшим путём длины 4 через элементы \\(A^*\\setminus\\{y\\}\\); иначе \\(y\\) можно было бы удалить из существенного множества. Зафиксируем кратчайший путь \\(x-y-b_y-c_y-d_y\\). Тогда \\(d(x,b_y)=2\\) и \\(d(x,c_y)=3\\). Все \\(2(m-1)\\) городов вида \\(b_y,c_y\\) попарно различны: никакой \\(b_y\\) не равен никакому \\(c_z\\), поскольку их расстояния от \\(x\\) равны 2 и 3; если \\(b_y=b_z\\) при \\(y\\ne z\\), то путь \\(x-y-b_z-c_z-d_z\\) длины 4 ведёт к \\(d_z\\) через \\(y\\), что запрещено выбором \\(d_z\\); если же \\(c_y=c_z\\), то путь \\(x-y-b_y-c_z-d_z\\) длины 4 ведёт к \\(d_z\\) через \\(y\\), что также запрещено выбором \\(d_z\\). Осталось показать, что для каждого \\(y\\in A_a\\) один из городов \\(b_y,c_y\\) лежит в \\(T\\). Действительно, \\(d(a,y)\\le2\\) по пути \\(a-x-y\\), а \\(d(a,d_y)\\ge d(x,d_y)-d(x,a)=3\\). При этом \\(d(a,d_y)\\ne3\\), потому что иначе \\(d_y\\) достигался бы из \\(x\\) путём длины 4 через \\(a\\), что запрещено выбором \\(d_y\\). Значит \\(d(a,d_y)>3\\). В последовательности расстояний \\(d(a,y), d(a,b_y), d(a,c_y), d(a,d_y)\\) соседние члены отличаются не более чем на 1; первый меньше 3, а последний больше 3. Поэтому один из промежуточных городов \\(b_y,c_y\\) находится на расстоянии 3 от \\(a\\). Так как оба имеют расстояние от \\(x\\) не больше 3, этот город лежит в \\(T\\). Для разных \\(y\\) полученные города различны по доказанной попарной различности \\(b_y,c_y\\), поэтому \\(|T|\\ge m-1\\), что противоречит \\(|T|\\le m-2\\). Следовательно, \\(|S_4(x)|\\le2550\\) для любого города \\(x\\).",
