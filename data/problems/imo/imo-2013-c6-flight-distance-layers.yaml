        "id": "stmt-original",
        "title": "Условие",
        "text": "В стране некоторые пары городов соединены прямыми двусторонними рейсами, и из любого города можно добраться в любой другой. Расстояние между городами — минимальное число рейсов. Известно, что от каждого города ровно на расстоянии 3 находится не более 100 городов. Докажите, что не существует города, от которого на расстоянии 4 находится более 2550 городов.",
