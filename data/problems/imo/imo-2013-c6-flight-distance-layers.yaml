    {
      "id": "sol-mse-neighbor-partition",
      "title": "MSE: подсчёт через разбиение по соседям стартовой вершины",
      "text": "Зафиксируем вершину \\(v\\) и обозначим её соседей через \\(v_1,\\dots,v_p\\). Для каждого \\(i\\) рассмотрим множество \\(V_i\\) вершин \\(w\\) на расстоянии 4 от \\(v\\), которые ещё не попали в более ранние группы и для которых существует путь длины 3 от \\(v_i\\) до \\(w\\), не проходящий через \\(v\\). Тогда каждая вершина четвёртого слоя попадает хотя бы в одну такую группу, так что \\(d_4(v)\\le \\sum_i |V_i|\\). Оставим только непустые группы, их число пусть равно \\(q\\), а размеры равны \\(n_1,\\dots,n_q\\). Для фиксированного \\(i\\) все вершины из \\(V_i\\) лежат на расстоянии 3 от \\(v_i\\). Кроме того, для каждого другого непустого класса \\(V_j\\) существует по крайней мере ещё одна вершина на расстоянии 3 от \\(v_i\\), отвечающая переходу к классу \\(V_j\\); поэтому \\(n_i+q-1\\le100\\). Значит \\(n_i\\le101-q\\) для всех \\(i\\), и потому \\(d_4(v)\\le\\sum_{i=1}^q n_i\\le q(101-q)\\). Квадратичная функция достигает максимума при \\(q=50\\) или \\(51\\), откуда \\(d_4(v)\\le2550\\). Следовательно, вершины с более чем 2550 вершинами на расстоянии 4 не существует.",
