        "text": "Введём обозначение сфер вокруг вершины: \\(L_i(x)=\\{y\\in V(G):\\operatorname{dist}(x,y)=i\\}\\). Условие говорит, что каждая третья сфера имеет размер не больше 100. Требуется получить универсальную оценку для следующей сферы: для любого выбора центра \\(x\\) четвёртая сфера \\(L_4(x)\\) содержит не более 2550 вершин.",
