        "title": "Условие",
        "text": "В ряд лежат \\(n\\) монет, каждая орлом или решкой вверх. Если сейчас ровно \\(k>0\\) монет орлом вверх, Гарри переворачивает \\(k\\)-ю монету; если орлов нет, процесс останавливается. Для начальной конфигурации \\(C\\) пусть \\(l(C)\\) — число шагов до остановки. Найдите среднее значение \\(l(C)\\) по всем \\(2^n\\) конфигурациям.",
