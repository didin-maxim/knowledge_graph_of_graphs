  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Решение через рекурсию графов состояний",
      "text": "Ответ: среднее равно \\(\\frac{n(n+1)}4\\). Рассмотрим ориентированный граф \\(G_n\\) на всех строках из \\(H,T\\) длины \\(n\\): из каждой нефинальной строки ведёт одно ребро в следующее состояние процесса, а \\(TT\\ldots T\\) является стоком. Тогда \\(l(C)\\) — длина пути от \\(C\\) до стока. Граф \\(G_n\\) строится из двух копий \\(G_{n-1}\\). В первой копии к каждой строке приписываем справа \\(T\\); переходы не меняются, поэтому среднее время там равно \\(E(n-1)\\). Во второй копии строку \\(s_1\\ldots s_{n-1}\\) заменяем на \\(\\overline{s}_{n-1}\\ldots\\overline{s}_1H\\). Эта замена также сохраняет структуру переходов до единственного соединяющего шага из \\(HH\\ldots H\\) в \\(HH\\ldots HT\\); после него остаётся пройти ещё \\(n-1\\) шагов, то есть вся вторая половина в среднем требует \\(E(n-1)+n\\) шагов. Поэтому \\(E(n)=\\frac12(E(n-1)+E(n-1)+n)=E(n-1)+\\frac n2\\), причём \\(E(0)=0\\). Суммируя, получаем \\(E(n)=\\frac12(1+2+\\cdots+n)=\\frac{n(n+1)}4\\). Эта рекурсия одновременно доказывает конечность процесса для всех начальных конфигураций.",
      "idea_ids": [
        "idea-state-digraph",
        "idea-recursive-copies"
      ],
