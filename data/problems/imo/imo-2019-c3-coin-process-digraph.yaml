  "solutions": [
    {
      "id": "sol-official-graph-recursion",
      "title": "Рекурсия графов состояний",
      "text": "Ответ равен\n\\[\n\\frac12(1+2+\\cdots+n)=\\frac{n(n+1)}4.\n\\]\nБудем писать \\(1\\) вместо \\(H\\) и \\(0\\) вместо \\(T\\). Пусть \\(G_n\\) — ориентированный граф на всех строках из \\(\\{0,1\\}^n\\): если в строке ровно \\(k>0\\) единиц, из неё ведёт ребро в строку, полученную переворачиванием \\(k\\)-го символа; строка \\(00\\ldots0\\) является стоком. Если из каждой вершины путь действительно доходит до стока, то длина этого пути в точности равна числу шагов процесса из соответствующей конфигурации.\n\nОбозначим через \\(E_n\\) среднее расстояние до стока в \\(G_n\\). Докажем одновременно конечность всех путей и рекурсию для \\(E_n\\). Для \\(n=0\\) есть одна пустая строка, уже являющаяся стоком, так что \\(E_0=0\\).\n\nПереход от \\(G_{n-1}\\) к \\(G_n\\) устроен так. Сначала возьмём копию \\(X\\): каждой строке \\(s=s_1\\ldots s_{n-1}\\) сопоставим строку \\(s0\\). Если в \\(s\\) ровно \\(k\\) единиц, то в \\(s0\\) тоже ровно \\(k\\) единиц, а при \\(k>0\\) переворачивается тот же \\(k\\)-й символ среди первых \\(n-1\\) мест. Значит, переходы внутри \\(X\\) полностью повторяют \\(G_{n-1}\\), и расстояние из \\(s0\\) до стока равно расстоянию из \\(s\\) в \\(G_{n-1}\\).\n\nВторую копию \\(Y\\) зададим иначе: строке \\(s=s_1\\ldots s_{n-1}\\) сопоставим\n\\[\n\\varphi(s)=\\overline{s}_{n-1}\\overline{s}_{n-2}\\cdots\\overline{s}_1 1,\n\\]\nгде \\(\\overline{0}=1\\), \\(\\overline{1}=0\\). Пусть в \\(s\\) ровно \\(k\\) единиц. Тогда в \\(\\varphi(s)\\) ровно \\((n-1-k)+1=n-k\\) единиц. Если \\(k>0\\), то ход из \\(\\varphi(s)\\) переворачивает позицию \\(n-k\\). Эта позиция соответствует позиции \\(k\\) в исходной строке \\(s\\) после обращения порядка и замены нулей на единицы, поэтому новый результат равен \\(\\varphi(s')\\), где \\(s'\\) получается из \\(s\\) ходом в \\(G_{n-1}\\). Следовательно, пока \\(s\\ne 00\\ldots0\\), переходы внутри \\(Y\\) тоже повторяют переходы \\(G_{n-1}\\).\n\nОстался единственный случай \\(s=00\\ldots0\\). Тогда \\(\\varphi(s)=11\\ldots1\\), в этой строке \\(n\\) единиц, и ход переворачивает последний символ:\n\\[\n11\\ldots1\\longrightarrow 11\\ldots10.\n\\]\nПолученная строка лежит в копии \\(X\\) и соответствует строке \\(11\\ldots1\\) длины \\(n-1\\), дополненной нулём. Из строки \\(11\\ldots1\\) длины \\(n-1\\) процесс за \\(n-1\\) шагов последовательно переворачивает последние \\(n-1,n-2,\\ldots,1\\) позиции и приходит в \\(00\\ldots0\\). Значит, после моста из \\(Y\\) в \\(X\\) остаётся ещё \\(n-1\\) шагов, а вместе с мостом добавляется ровно \\(n\\) шагов.\n\nИтак, для вершины \\(s0\\in X\\) расстояние равно \\(d_{n-1}(s)\\), а для вершины \\(\\varphi(s)\\in Y\\) расстояние равно \\(d_{n-1}(s)+n\\). По индукционному предположению все расстояния \\(d_{n-1}(s)\\) конечны, значит конечны и все расстояния в \\(G_n\\). Усредняя по двум половинам вершин, получаем\n\\[\nE_n=\\frac12\\bigl(E_{n-1}+(E_{n-1}+n)\\bigr)=E_{n-1}+\\frac n2.\n\\]\nТак как \\(E_0=0\\), суммирование даёт\n\\[\nE_n=\\frac12(1+2+\\cdots+n)=\\frac{n(n+1)}4.\n\\]\nЭто одновременно доказывает, что процесс всегда останавливается, и вычисляет требуемое среднее.",
