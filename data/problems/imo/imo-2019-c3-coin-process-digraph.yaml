        "id": "stmt-state-digraph",
        "title": "Функциональный граф двоичных строк",
        "text": "Для данного \\(n\\) рассмотрим ориентированный граф \\(G_n\\), вершинами которого являются все двоичные строки \\(x_1x_2\\ldots x_n\\) длины \\(n\\). Если строка \\(x\\) содержит ровно \\(k>0\\) единиц, проведём из \\(x\\) одно ориентированное ребро в строку, полученную заменой \\(k\\)-го символа строки \\(x\\) на противоположный. Нулевая строка \\(00\\ldots 0\\) является стоком. Для каждой вершины \\(x\\) пусть \\(d(x)\\) — длина ориентированного пути из \\(x\\) в \\(00\\ldots 0\\), если этот путь конечен. Докажите, что все эти пути конечны, и найдите среднее значение \\(d(x)\\) по всем \\(2^n\\) вершинам \\(G_n\\).",
