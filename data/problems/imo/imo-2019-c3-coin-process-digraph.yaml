    {
      "id": "sol-official-head-position-formula",
      "title": "Явная формула через позиции орлов",
      "text": "Дадим независимое решение, которое сразу выводит явную формулу для числа ходов. Пусть в некоторый момент на доске ровно \\(r\\) орлов, стоящих в позициях\n\\[\n1\\le c_1<c_2<\\cdots<c_r\\le n.\n\\]\nВыберем минимальный индекс \\(i\\), для которого \\(c_i\\ge r\\). Такой индекс существует, потому что всегда \\(c_r\\ge r\\).\n\nРассмотрим, что происходит дальше. Сначала Гарри переворачивает \\(r\\)-ю монету. Если \\(r<c_i\\), то эта монета не была орлом, значит число орлов увеличивается на один и следующим ходом переворачивается \\((r+1)\\)-я монета. Так продолжается до позиции \\(c_i\\). На позиции \\(c_i\\) стоит орёл, поэтому после её переворота число орлов начинает уменьшаться, и дальнейшие ходы идут назад: \\((c_i-1)\\)-я, \\((c_i-2)\\)-я, ..., \\(r\\)-я монета. Иными словами, этот блок ходов имеет вид\n\\[\nr, r+1, \\ldots, c_i, c_i-1, \\ldots, r\n\\]\nи содержит \\(2(c_i-r)+1\\) ходов.\n\nПосле окончания блока все монеты, кроме позиции \\(c_i\\), оказываются в тех же состояниях, что и до блока, а монета \\(c_i\\) стала решкой. Поэтому число орлов уменьшилось ровно на один, и множество оставшихся позиций орлов получается из \\(\\{c_1,\\ldots,c_r\\}\\) удалением \\(c_i\\). Повторяя этот аргумент, мы видим, что процесс обязательно закончится: каждый блок уменьшает число орлов на один.\n\nТеперь пусть начальная конфигурация имеет \\(k\\) орлов в позициях \\(c_1<\\cdots<c_k\\). Орлы будут удаляться в некотором порядке, но перед удалением первого орла их \\(k\\), перед удалением второго — \\(k-1\\), ..., перед удалением последнего — \\(1\\). Поэтому общее число ходов равно\n\\[\n\\sum_{j=1}^k \\bigl(2(c_{i_j}-(k+1-j))+1\\bigr),\n\\]\nгде \\(c_{i_1},\\ldots,c_{i_k}\\) — порядок удаления исходных орлов. Эта сумма не зависит от порядка удаления:\n\\[\n\\ell(C)=2\\sum_{j=1}^k c_j-2(1+2+\\cdots+k)+k=2\\sum_{j=1}^k c_j-k^2.\n\\]\n\nОстаётся усреднить эту формулу по всем \\(2^n\\) конфигурациям. При равномерном выборе конфигурации каждая позиция \\(m\\) является орлом с вероятностью \\(1/2\\), поэтому\n\\[\n\\mathbb E\\left[2\\sum_{j=1}^k c_j\\right]=2\\sum_{m=1}^n m\\cdot\\frac12=\\frac{n(n+1)}2.\n\\]\nЧисло орлов \\(k\\) имеет биномиальное распределение \\(\\mathrm{Bin}(n,1/2)\\). Значит,\n\\[\n\\mathbb E(k^2)=\\operatorname{Var}(k)+(\\mathbb E k)^2=\\frac n4+\\frac{n^2}{4}=\\frac{n(n+1)}4.\n\\]\nСледовательно,\n\\[\n\\mathbb E\\,\\ell(C)=\\frac{n(n+1)}2-\\frac{n(n+1)}4=\\frac{n(n+1)}4.\n\\]\nКак и требовалось, среднее число шагов равно \\(n(n+1)/4\\), а конечность процесса уже доказана блочным разбором.",
