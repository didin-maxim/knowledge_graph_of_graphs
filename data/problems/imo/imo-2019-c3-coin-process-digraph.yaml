  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Сжатое официальное решение",
      "text": "Строим ориентированный граф \\(G_n\\), вершины которого — строки из \\(H,T\\) длины \\(n\\), а ребро ведёт из каждой нефинальной строки к её следующему состоянию. Тогда \\(l(C)\\) — расстояние от вершины \\(C\\) до стока \\(TT\\ldots T\\). Главная рекурсия официального решения описывает \\(G_n\\) через две копии \\(G_{n-1}\\): в одной к строкам приписывается \\(T\\), в другой строки переворачиваются, разворачиваются и получают \\(H\\); затем добавляется одно соединяющее ребро. Это даёт рекуррентную формулу для суммы всех расстояний до стока, а значит и для среднего значения.",
