        "id": "stmt-original",
        "title": "Условие",
        "text": "В ряд лежат \\(n\\) монет, каждая орлом или решкой вверх. Если сейчас ровно \\(k>0\\) монет орлом вверх, Гарри переворачивает \\(k\\)-ю монету слева; если орлов нет, процесс останавливается. Например, при \\(n=3\\) процесс из \\(THT\\) имеет вид \\(THT\\to HHT\\to HTT\\to TTT\\) и занимает три шага. Для начальной конфигурации \\(C\\) пусть \\(\\ell(C)\\) — число шагов до остановки. Докажите, что \\(\\ell(C)\\) конечно для любой начальной конфигурации, и найдите среднее значение \\(\\ell(C)\\) по всем \\(2^n\\) конфигурациям.",
