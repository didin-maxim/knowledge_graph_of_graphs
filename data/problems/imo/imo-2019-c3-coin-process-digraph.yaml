  "statements": {
    "original": [
      {
        "id": "stmt-original",
        "title": "Условие",
        "text": "В ряд лежат \\(n\\) монет, каждая орлом или решкой вверх. Если сейчас ровно \\(k>0\\) монет орлом вверх, Гарри переворачивает \\(k\\)-ю монету; если орлов нет, процесс останавливается. Для начальной конфигурации \\(C\\) пусть \\(l(C)\\) — число шагов до остановки. Найдите среднее значение \\(l(C)\\) по всем \\(2^n\\) конфигурациям.",
        "source_id": "src-imo-2019-shortlist",
        "status": "needs_human_review",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": []
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-state-digraph",
        "text": "For a given $n$, consider the directed graph $G_n$ whose vertices are all binary strings $x_1x_2\\ldots x_n$ of length $n$. If a string $x$ contains exactly $k>0$ ones, draw one directed edge from $x$ to the string obtained by flipping the $k$-th symbol of $x$. The zero string $00\\ldots 0$ is a sink. For each vertex $x$, let $d(x)$ be the length of the directed path from $x$ to $00\\ldots 0$. Find the average value of $d(x)$ over all $2^n$ vertices of $G_n$.",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
