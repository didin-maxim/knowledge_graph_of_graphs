    "original": [
      {
        "id": "stmt-original",
        "text": "Доска \\(m\\times n\\) раскрашивается в чёрный и белый цвета. Пусть \\(N\\) — число раскрасок, в которых есть чёрный путь из левого края в правый, а \\(M\\) — число раскрасок, в которых есть два непересекающихся таких чёрных пути. Докажите, что \\(N^2\\ge M\\cdot2^{mn}\\).",
        "status": "needs_human_review",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [],
        "title": "Условие",
        "source_id": "src-secondary-imo-2005-shortlist",
