  ],
  "solutions": [
    {
      "id": "sol-reviewed-secondary",
      "title": "Сжатое решение после review",
      "text": "Для каждой раскраски с левым-правым чёрным проходом выбираем нижний проход \\(L\\): путь, над которым область максимальна. Такой путь единственен. Рассмотрим пару \\((A,B)\\), где \\(A\\) — раскраска с двумя непересекающимися чёрными проходами, а \\(B\\) — произвольная раскраска. В раскраске \\(A\\) берём нижний проход \\(L\\) и меняем между \\(A\\) и \\(B\\) все клетки, лежащие на \\(L\\) и выше него. После обмена обе полученные раскраски имеют чёрный левый-правый проход: одна сохраняет нижний путь, другая — второй, непересекающийся путь. По нижнему пути операция однозначно обратима, поэтому построена инъекция из множества размера \\(M2^{mn}\\) в множество пар раскрасок с проходом размера \\(N^2\\).",
