  "ideas": [
    {
      "id": "idea-lowest-path",
      "title": "Нижний чёрный путь",
      "text": "В каждой раскраске с проходом выбирается единственный нижний проход, максимизирующий область над ним.",
      "tags": [
        "connectivity"
      ],
      "status": "needs_human_review"
    },
    {
      "id": "idea-swap-injection",
      "title": "Инъекция обменом областей",
      "text": "Для пары раскрасок меняются местами клетки на пути и выше него, что переводит пару в две раскраски с проходом.",
