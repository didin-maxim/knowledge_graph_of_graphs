    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Рассматривается решётчатый граф клеток доски, где соседние по стороне клетки соединены ребром. Событие — наличие одного или двух непересекающихся чёрных путей между левым и правым краем.",
        "status": "needs_human_review",
