  "solutions": [
    {
      "id": "sol-reviewed-secondary",
      "title": "Инъекция через нижний чёрный путь",
      "text": "Будем называть хорошим чёрный путь, соединяющий левый край доски с правым. Достаточно построить инъекцию из множества пар \\((A,B)\\), где в раскраске \\(A\\) есть два непересекающихся хороших пути, а \\(B\\) - произвольная раскраска, в множество пар раскрасок, каждая из которых имеет хороший путь. Размер первого множества равен \\(M\\cdot2^{mn}\\), а размер второго равен \\(N^2\\).\n\nСначала зафиксируем, что такое нижний хороший путь. Любой хороший путь можно считать простым: если клетка встретилась дважды, удаляем замкнутую часть между двумя её появлениями. Для простого лево-правого пути \\(P\\) обозначим через \\(D(P)\\) множество клеток, состоящее из клеток самого \\(P\\) и всех клеток, которые лежат в компонентах доски без \\(P\\), соприкасающихся с нижним краем доски. Иными словами, \\(D(P)\\) - это путь и всё, что находится под ним.\n\nДокажем, что в любой раскраске с хорошим путём существует хороший путь \\(P\\), для которого \\(D(P)\\subseteq D(Q)\\) при любом хорошем пути \\(Q\\). Для двух хороших путей \\(P_1,P_2\\) рассмотрим множество чёрных клеток \\(P_1\\cup P_2\\). Оно соединяет левый край с правым. Если из нижнего края доски смотреть на границу этого множества, то верхняя граница нижней области проходит по клеткам из \\(P_1\\cup P_2\\) и содержит чёрный лево-правый путь \\(R\\), причём \\(D(R)\\subseteq D(P_1)\\cap D(P_2)\\). Это обычный нижний контур объединения двух лево-правых путей: при движении вдоль него соседние клетки имеют общую сторону, а перейти с нижней стороны на верхнюю без клетки из \\(P_1\\cup P_2\\) нельзя. Последовательно применяя эту операцию ко всем хорошим путям конечной раскраски, получаем хороший путь, лежащий не выше любого другого. Если таких путей несколько, выбираем один по заранее фиксированному лексикографическому правилу. Его и называем нижним.\n\nНам понадобится ещё одно следствие планарности. Если \\(Q\\) - хороший путь, не имеющий общих клеток с нижним путём \\(P\\), то \\(Q\\) целиком лежит либо под \\(P\\), либо над \\(P\\): иначе, двигаясь по связному пути \\(Q\\), пришлось бы перейти из нижней компоненты доски без \\(P\\) в верхнюю, а это невозможно без встречи с \\(P\\). Под \\(P\\) путь \\(Q\\) лежать не может, потому что нижний путь удовлетворяет \\(D(P)\\subseteq D(Q)\\). Значит всякий хороший путь, непересекающийся с \\(P\\), лежит над \\(P\\).\n\nТеперь строим отображение. Пусть дана пара \\((A,B)\\) из первого множества. В раскраске \\(A\\) выберем нижний хороший путь \\(P\\). Поменяем между раскрасками \\(A\\) и \\(B\\) цвета всех клеток из множества \\(D(P)\\), а все остальные клетки оставим на своих местах. Получим пару раскрасок \\((A',B')\\).\n\nВ раскраске \\(B'\\) путь \\(P\\) чёрный, потому что все его клетки пришли из \\(A\\). В раскраске \\(A'\\) тоже есть хороший путь. Действительно, в \\(A\\) были два непересекающихся хороших пути; один из них лежит ниже другого. Так как \\(P\\) лежит не выше нижнего из этой пары, верхний путь пары находится над \\(P\\), не затрагивается обменом и остаётся чёрным в \\(A'\\). Следовательно, \\((A',B')\\) действительно попадает во второе множество.\n\nОсталось доказать инъективность. В раскраске \\(B'\\) нижним хорошим путём снова является тот же \\(P\\). Действительно, все клетки из \\(D(P)\\) в \\(B'\\) окрашены так же, как в исходной раскраске \\(A\\). Если бы в \\(B'\\) существовал хороший путь \\(R\\), лежащий ниже \\(P\\), то он целиком лежал бы в \\(D(P)\\) и поэтому был бы хорошим путём уже в \\(A\\), что противоречит выбору \\(P\\) как нижнего пути в \\(A\\). А если есть несколько путей с тем же нижним контуром, то они тоже целиком лежат в \\(D(P)\\), где раскраски \\(A\\) и \\(B'\\) совпадают; фиксированное правило выбора поэтому выбирает тот же путь.\n\nЗначит по образу \\((A',B')\\) мы восстанавливаем \\(P\\) как нижний хороший путь второй раскраски, после чего снова меняем между двумя раскрасками все клетки из \\(D(P)\\). Это ровно возвращает исходную пару \\((A,B)\\). Построенное отображение инъективно, поэтому\n\\[\nM\\cdot2^{mn}\\le N^2,\n\\]\nчто и требовалось доказать.",
