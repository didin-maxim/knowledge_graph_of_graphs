    {
      "id": "sol-official-elementary-short-paths",
      "title": "Официальное элементарное решение через перестройку коротких путей",
      "text": "Будем писать \\(X\\to Y\\), если дорога между \\(X\\) и \\(Y\\) направлена от \\(X\\) к \\(Y\\). Сначала заметим простой факт: если есть маршрут из \\(X\\) в \\(Y\\), в котором вершины могли повторяться, то из него можно удалить циклы и получить простой путь из \\(X\\) в \\(Y\\). Поэтому при перестройках ниже достаточно строить маршруты; после удаления циклов они становятся допустимыми путями и не используют новых дорог.\n\nНазовём путь коротким, если он состоит из одной или двух дорог. Докажем лемму. Пусть \\(\\mathcal P\\) — разнообразная коллекция из \\(p\\) путей из \\(A\\) в \\(B\\). Тогда существует разнообразная коллекция из \\(A\\) в \\(B\\), содержащая не меньше \\(p\\) путей и все короткие пути из \\(A\\) в \\(B\\).\n\nЕсли существует дорога \\(A\\to B\\), но одноэлементного пути \\(A\\to B\\) нет в \\(\\mathcal P\\), то эта дорога вообще не используется ни одним путём из \\(A\\) в \\(B\\): иначе путь уже пришёл бы в конечную вершину \\(B\\). Значит, этот путь можно просто добавить.\n\nТеперь пусть \\(C\\) — город, для которого \\(A\\to C\\to B\\), но короткого пути \\(A\\to C\\to B\\) нет в коллекции. Рассмотрим пути коллекции, использующие дороги \\(A\\to C\\) или \\(C\\to B\\). Таких путей не больше двух: дорога \\(A\\to C\\) может быть только первой дорогой пути из \\(A\\), а дорога \\(C\\to B\\) — только последней дорогой пути в \\(B\\); из-за разнообразия каждая из двух дорог используется не более одного раза. Если таких путей не больше одного, удалим его, если он есть, и добавим короткий путь \\(A\\to C\\to B\\). Число путей не уменьшается, а разнообразие сохраняется.\n\nОстаётся случай, когда есть два пути вида \\(A\\to C\\rightsquigarrow B\\) и \\(A\\rightsquigarrow C\\to B\\). Заменим их на короткий путь \\(A\\to C\\to B\\) и маршрут \\(A\\rightsquigarrow C\\rightsquigarrow B\\), составленный из оставшихся частей старых путей. Если во втором маршруте возникли циклы, удалим их. Полученный путь использует только дороги старых двух путей, кроме \\(A\\to C\\) и \\(C\\to B\\), которые теперь заняты коротким путём. Поэтому разнообразие сохраняется, а число путей не уменьшается. Повторив операцию для всех таких \\(C\\), получаем лемму.\n\nТеперь докажем задачу. Достаточно рассмотреть случай \\(A\\to B\\); случай \\(B\\to A\\) получается тем же рассуждением после перестановки букв \\(A,B\\). Разобьём все города, кроме \\(A,B\\), на четыре класса:\n\\[\n\\mathcal I=\\{C: A\\to C\\leftarrow B\\},\\quad\n\\mathcal O=\\{C: A\\leftarrow C\\to B\\},\n\\]\n\\[\n\\mathcal A=\\{C: A\\to C\\to B\\},\\quad\n\\mathcal B=\\{C: A\\leftarrow C\\leftarrow B\\}.\n\\]\nПусть \\(a=d^+(A)\\), \\(b=d^+(B)\\). При \\(A\\to B\\) имеем\n\\[\na=|\\mathcal I|+|\\mathcal A|+1,\\qquad b=|\\mathcal I|+|\\mathcal B|,\n\\]\nто есть \\(b-a=|\\mathcal B|-|\\mathcal A|-1\\).\n\nВозьмём разнообразную коллекцию \\(\\mathcal P\\) из \\(N_{AB}\\) путей из \\(A\\) в \\(B\\) и по лемме заменим её коллекцией \\(\\mathcal P_1\\), содержащей не меньше \\(N_{AB}\\) путей и все короткие пути из \\(A\\) в \\(B\\). Таких коротких путей ровно \\(|\\mathcal A|+1\\): это путь \\(A\\to B\\) и пути \\(A\\to C\\to B\\) при \\(C\\in\\mathcal A\\).\n\nПути из \\(\\mathcal P_1\\) не используют дороги коротких путей из \\(B\\) в \\(A\\). Действительно, при \\(A\\to B\\) прямой дороги \\(B\\to A\\) нет, а двухреберные короткие пути из \\(B\\) в \\(A\\) имеют вид \\(B\\to C\\to A\\) для \\(C\\in\\mathcal B\\); путь из \\(A\\) в \\(B\\) не может выйти из уже достигнутого \\(B\\) и не может войти в уже покинутый \\(A\\). Кроме того, все дороги коротких путей из \\(A\\) в \\(B\\) уже заняты самими этими короткими путями, так что никакой другой путь коллекции их не использует.\n\nСледовательно, каждый не короткий путь из \\(\\mathcal P_1\\) имеет вид\n\\[\nA\\to C\\rightsquigarrow D\\to B,\n\\]\nгде \\(C\\in\\mathcal I\\), \\(D\\in\\mathcal O\\). В самом деле, первая дорога не может вести в \\(B\\) или в \\(\\mathcal A\\), потому что это была бы дорога короткого пути из \\(A\\) в \\(B\\); значит, она ведёт в \\(\\mathcal I\\). Аналогично последняя дорога в \\(B\\) не может выходить из \\(\\mathcal A\\), поэтому её начало лежит в \\(\\mathcal O\\).\n\nПостроим коллекцию \\(\\mathcal Q\\) путей из \\(B\\) в \\(A\\). Для каждого не короткого пути \\(A\\to C\\rightsquigarrow D\\to B\\) из \\(\\mathcal P_1\\) возьмём путь \\(B\\to C\\rightsquigarrow D\\to A\\): дороги \\(B\\to C\\) и \\(D\\to A\\) существуют именно потому, что \\(C\\in\\mathcal I\\), \\(D\\in\\mathcal O\\). Также добавим все короткие пути из \\(B\\) в \\(A\\), то есть \\(|\\mathcal B|\\) путей \\(B\\to C\\to A\\) при \\(C\\in\\mathcal B\\). Дороги в \\(\\mathcal Q\\) не пересекаются: средние части пришли из разнообразной коллекции \\(\\mathcal P_1\\), новые начальные и конечные дороги принадлежат разным классам вершин, а короткие пути из \\(B\\) в \\(A\\) ранее не использовались.\n\nПоэтому\n\\[\n|\\mathcal Q|=|\\mathcal P_1|-(|\\mathcal A|+1)+|\\mathcal B|\n\\ge N_{AB}+b-a.\n\\]\nОтсюда \\(N_{BA}\\ge N_{AB}+b-a\\). Применив тот же аргумент с переставленными \\(A\\) и \\(B\\), получаем \\(N_{AB}\\ge N_{BA}+a-b\\), то есть \\(N_{BA}\\le N_{AB}+b-a\\). Следовательно,\n\\[\nN_{BA}-N_{AB}=b-a=d^+(B)-d^+(A).\n\\]\nВ частности, \\(N_{AB}=N_{BA}\\) тогда и только тогда, когда \\(d^+(A)=d^+(B)\\).",
