        "text": "Пусть \\(T\\) — турнир на \\(n\\) вершинах. Для вершин \\(A,B\\) обозначим через \\(N_{AB}\\) максимальное число попарно рёберно-непересекающихся направленных путей из \\(A\\) в \\(B\\). Докажите, что \\(N_{AB}=N_{BA}\\) тогда и только тогда, когда \\(d^+(A)=d^+(B)\\).",
