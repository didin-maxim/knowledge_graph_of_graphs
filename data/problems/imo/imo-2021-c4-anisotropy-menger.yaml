  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Сжатое официальное решение",
      "text": "Первое решение строит пути явно, второе формулирует графовый механизм. Рассматриваем ориентированный полный граф. По теореме Менгера в рёберной форме максимальное число рёберно-непересекающихся путей из \\(s\\) в \\(t\\) равно минимуму числа рёбер, идущих из части \\(S\\) в часть \\(T\\), среди разрезов \\(s\\in S,t\\in T\\). Для турнира такой минимум можно оценить через исходящие степени \\(A\\) и \\(B\\). Анализ разрезов показывает, что разность \\(N_{AB}-N_{BA}\\) имеет тот же знак, что разность исходящих степеней. Поэтому равенство максимумов путей эквивалентно равенству исходящих степеней.",
