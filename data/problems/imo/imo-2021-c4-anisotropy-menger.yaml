        "text": "В королевстве \\(n\\) городов, и между каждой парой городов есть ровно одна направленная дорога. Путь не возвращается в уже посещённый город. Коллекция путей называется разнообразной, если ни одна дорога не входит в два пути. Для городов \\(A,B\\) пусть \\(N_{AB}\\) — максимальное число путей в разнообразной коллекции путей из \\(A\\) в \\(B\\), а \\(N_{BA}\\) определяется аналогично. Докажите, что \\(N_{AB}=N_{BA}\\) тогда и только тогда, когда исходящая степень \\(A\\) равна исходящей степени \\(B\\).",
