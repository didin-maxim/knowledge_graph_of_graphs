    {
      "id": "sol-official-compressed",
      "title": "Официальное решение через разрезы в турнире",
      "text": "Рассмотрим турнир как ориентированный граф. По рёберной форме теоремы Менгера число \\(N_{AB}\\) равно минимуму размера \\((A,B)\\)-разреза: разбиения вершин на \\(S_A\\sqcup T_A\\), где \\(A\\in S_A\\), \\(B\\in T_A\\), а считаются дуги из \\(S_A\\) в \\(T_A\\). Число \\(N_{BA}\\) тем же способом равно минимуму размера \\((B,A)\\)-разреза.\n\nОбозначим через \\(a=d^+(A)\\), \\(b=d^+(B)\\). Для произвольного \\((A,B)\\)-разреза \\((S_A,T_A)\\) построим парный \\((B,A)\\)-разрез\n\\[\nS_B=(S_A\\setminus\\{A\\})\\cup\\{B\\},\\qquad T_B=(T_A\\setminus\\{B\\})\\cup\\{A\\}.\n\\]\nПокажем, что его размер больше ровно на \\(b-a\\). Дуги, не инцидентные ни \\(A\\), ни \\(B\\), либо пересекают оба разреза, либо не пересекают ни один; пусть таких общих дуг \\(c\\). Пусть \\(a_S\\) и \\(a_T\\) — числа дуг из \\(A\\) соответственно в \\(S_A\\) и \\(T_A\\), так что \\(a_S+a_T=a\\). Пусть \\(b_S\\) и \\(b_T\\) — числа дуг из \\(B\\) соответственно в \\(S_B\\) и \\(T_B\\), так что \\(b_S+b_T=b\\).\n\nВ первом разрезе, кроме общих \\(c\\) дуг, есть дуги из \\(A\\) в \\(T_A\\), их \\(a_T\\), и дуги из \\(S_A\\setminus\\{A\\}\\) в \\(B\\). Последних ровно \\(|S_A|-1-b_S=|S_B|-1-b_S\\), потому что для каждой вершины из \\(S_A\\setminus\\{A\\}=S_B\\setminus\\{B\\}\\) в турнире ровно одна из двух дуг направлена между ней и \\(B\\). Значит\n\\[\ne(S_A,T_A)=c+a_T+(|S_B|-1-b_S).\n\\]\nВо втором разрезе, кроме тех же \\(c\\), есть дуги из \\(B\\) в \\(T_B\\), их \\(b_T\\), и дуги из \\(S_B\\setminus\\{B\\}\\) в \\(A\\). Последних \\(|S_A|-1-a_S\\). Поэтому\n\\[\ne(S_B,T_B)=c+b_T+(|S_A|-1-a_S).\n\\]\nТак как \\(|S_A|=|S_B|\\), вычитание даёт\n\\[\ne(S_B,T_B)-e(S_A,T_A)=(b_T+b_S)-(a_T+a_S)=b-a.\n\\]\n\nБерём минимальный \\((A,B)\\)-разрез. Из построения получаем \\(N_{BA}\\le N_{AB}+b-a\\). Применяя тот же аргумент в обратную сторону, получаем \\(N_{AB}\\le N_{BA}+a-b\\), то есть \\(N_{BA}\\ge N_{AB}+b-a\\). Следовательно\n\\[\nN_{BA}-N_{AB}=b-a.\n\\]\nИтак, разность максимальных чисел рёберно-непересекающихся путей имеет тот же знак, что и \\(d^+(B)-d^+(A)\\). В частности, \\(N_{AB}=N_{BA}\\) тогда и только тогда, когда \\(d^+(A)=d^+(B)\\).",
