        "title": "Операции с квадратами 2x2",
        "text": "Пусть \\(n\\) — положительное целое число. На доске \\(n\\times n\\) левая верхняя клетка сначала закрашена чёрным, а все остальные клетки белые. Разрешена такая операция: выбрать квадрат \\(2\\times2\\), в котором ровно одна клетка уже чёрная, и закрасить три остальные клетки этого квадрата чёрным. Определите все значения \\(n\\), при которых можно закрасить всю доску чёрным.",
