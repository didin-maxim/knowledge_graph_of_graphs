    {
      "id": "sol-directed-tromino-tree",
      "title": "Ориентированное дерево L-тромино",
      "text": "Снова конструкция для \\(n=2^k\\) получается индукцией по четырём четвертям. Для обратного направления будем считать каждую операцию укладкой L-тромино: три новые клетки образуют L, а уже чёрная клетка указывает, откуда эта L-фигура была присоединена. Нарисуем узел и стрелку для каждой операции, а также корневой узел в левом верхнем углу. Стрелки направлены от уже построенной части к новой, поэтому получается ориентированное дерево с корнем. Все его рёбра диагональны, откуда возникает фиксированная чётность допустимых L-тромино. В таком дереве невозможны две параллельные соседние стрелки: при одинаковом направлении соответствующие L-тромино пересекались бы, а при противоположном направлении неизбежное покрытие соседних клеток создало бы цикл. Невозможен и зигзаг из трёх стрелок: выбрав самый дальний от корня зигзаг, получаем по необходимости покрытия соседней клетки новый зигзаг ещё дальше либо запрещённую параллельную пару. Теперь красим узлы: корень отдельно, прочие узлы белые, если выходящая стрелка меняет направление относительно входящей, и чёрные иначе. Из запрета параллельных пар и зигзагов следует, что ребёнок чёрного узла белый, а каждый белый узел имеет ровно трёх чёрных детей. Значит, всё дерево разбивается на одинаковые группы, соответствующие блокам \\(2\\times2\\), и после замены каждой такой группы одной большой L-фигурой получается та же задача на доске \\(n/2\\times n/2\\). Поэтому при \\(n>1\\) число \\(n\\) чётно и можно повторять деление пополам до \\(1\\), то есть \\(n\\) — степень двойки.",
