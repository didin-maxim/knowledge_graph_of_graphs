  "solutions": [
    {
      "id": "sol-x-graph-halving",
      "title": "Дерево крестов и сжатие доски вдвое",
      "text": "Ответ: \\(n=2^k\\), где \\(k\\ge0\\). Для таких \\(n\\) конструкция идёт по индукции: для перехода от \\(2^m\\) к \\(2^{m+1}\\) делим доску на четыре четверти, закрашиваем левую верхнюю четверть, одной операцией закрашиваем центральный квадрат \\(2\\times2\\), а затем закрашиваем остальные четверти индукционно от клетки около центра. Докажем необходимость. Предположим, что вся доска закрашена. В каждом квадрате \\(2\\times2\\), где сделана операция, соединим крестом центры четырёх его клеток и назовём этот крест вершиной-объектом с координатами центра квадрата. Каждый новый крест, кроме первого, имеет общую клетку с уже построенной частью, поэтому граф крестов связен. Цикла быть не может: если взять самый поздний крест на цикле, то к моменту его операции он уже соединялся бы с прежней частью как минимум в двух клетках, значит операция закрасила бы не три новые клетки. Следовательно, граф крестов — дерево, покрывающее все клетки. Из связности и первого креста в точке \\((1,1)\\) следует, что все центры крестов имеют координаты одной чётности: \\(i\\equiv j\\pmod2\\). Поэтому \\(n\\) чётно, иначе нижняя левая угловая клетка не может быть покрыта. Разобьём доску на блоки \\(2\\times2\\). Клетки на границе заставляют все граничные блоки содержать нечётный крест. Если бы некоторый блок был пустым, то граница между пустыми и заполненными блоками дала бы замкнутый цикл из соседних крестов, противореча дереву. Значит, каждый блок заполнен. Сжимая каждый блок в одну клетку и заменяя кресты соответствующими точками, получаем такое же дерево для доски \\(n/2\\times n/2\\). Повторяя рассуждение, приходим к доске \\(1\\times1\\), так что исходное \\(n\\) было степенью двойки.",
