      "id": "idea-band-parity-invariant",
      "title": "Инвариант по полосам высоты 4",
      "text": "Разобьём строки на три полосы высоты \\(4\\) и рассмотрим паритет выражения \\(x-\\lceil y/4\\rceil\\). Каждый допустимый ход при \\(r=97\\) сохраняет этот паритет.",
