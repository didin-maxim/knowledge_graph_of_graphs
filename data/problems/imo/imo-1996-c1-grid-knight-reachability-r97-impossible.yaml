  "statements": {
    "original": [
      {
        "id": "stmt-original",
        "text": "Дан прямоугольник \\(20\\times12\\), разбитый на единичные клетки. Пусть \\(A\\) и \\(B\\) — концы стороны длины \\(20\\), и нужно попасть из клетки, прилегающей к вершине \\(A\\), в клетку, прилегающую к вершине \\(B\\) вдоль этой стороны. Разрешено переходить из одной клетки в другую, если расстояние между центрами этих клеток равно \\(\\sqrt{97}\\). Решите вопрос о возможности такого перехода.",
        "source_id": "src-secondary-imo-1996-shortlist",
        "status": "needs_human_review",
