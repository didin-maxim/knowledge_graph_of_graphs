  "solutions": [
    {
      "id": "sol-reviewed-secondary",
      "title": "Сжатое решение после проверки",
      "text": "Пусть общий кодегри любых двух вершин равен \\(\\lambda\\). Считаем тройки \\((a,b,c)\\), где \\(a\\) приветствовал и \\(b\\), и \\(c\\), а \\(b\\ne c\\). С одной стороны, для каждого из \\(12k\\) людей можно выбрать пару его \\(3k+6\\) соседей. С другой стороны, каждая пара людей имеет ровно \\(\\lambda\\) общих соседей. Поэтому \\(12k\\binom{3k+6}{2}=\\lambda\\binom{12k}{2}\\), откуда \\(\\lambda=(3k+5)(3k+6)/(12k-1)\\). Целочисленность даёт, что \\(12k-1\\) делит 525; совместимость с видом \\(12k-1\\) оставляет \\(12k-1=35\\), то есть \\(k=3\\). Значит, людей было \\(36\\).",
