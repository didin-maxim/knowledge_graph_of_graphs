  "solutions": [
    {
      "id": "sol-secondary-sketch",
      "title": "Сжатый графовый разбор",
      "text": "Запишем красный цвет как 1, синий как 0. Условие на каждый элементарный квадрат означает, что сумма четырёх значений в нём равна 2. Для двух соседних строк рассмотрим столбцы подряд. Из равенства сумм в соседних квадратах следует, что разности между строками постоянны по всем столбцам: либо строки совпадают, либо одна является дополнением другой. Если первая строка не одноцветна, то для каждого из \\(n-1\\) переходов к следующей строке можно независимо выбрать совпадение или дополнение. Одноцветные первые строки требуют отдельного учёта: они дают только две шахматные вертикальные схемы. Так получается стандартная формула подсчёта всех допустимых раскрасок; её нужно сверить перед публичной версией карточки.",
