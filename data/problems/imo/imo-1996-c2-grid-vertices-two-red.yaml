      {
        "id": "stmt-original",
        "text": "Квадрат \\((n-1)\\times(n-1)\\) разбит на единичные квадраты. Каждую из \\(n^2\\) вершин решётки нужно покрасить в красный или синий цвет. Найдите число раскрасок, при которых у каждого единичного квадрата ровно две красные вершины.",
