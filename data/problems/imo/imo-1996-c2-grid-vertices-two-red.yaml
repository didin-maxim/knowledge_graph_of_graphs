  "solutions": [
    {
      "id": "sol-secondary-sketch",
      "title": "Разбор по соседним строкам",
      "text": "Ответ: \\(2^{n+1}-2\\). Запишем красный цвет как \\(1\\), синий как \\(0\\), а \\(n\\) строк вершин решётки обозначим двоичными векторами длины \\(n\\). Сначала классифицируем все допустимые переходы от строки \\(r\\) к соседней строке \\(s\\). Положим \\(t_j=r_j+s_j\\), где \\(j=1,\\ldots,n\\). Для элементарного квадрата между столбцами \\(j\\) и \\(j+1\\) условие даёт \\(r_j+s_j+r_{j+1}+s_{j+1}=2\\), то есть \\(t_j+t_{j+1}=2\\). Отсюда рекуррентно \\(t_{j+1}=2-t_j\\). Если \\(t_1=1\\), то все \\(t_j=1\\), а значит в каждом столбце ровно одна из двух соседних вершин красная; поэтому \\(s\\) является дополнением строки \\(r\\). Если же \\(t_1=0\\) или \\(t_1=2\\), то значения \\(t_j\\) чередуются между \\(0\\) и \\(2\\). При \\(t_j=0\\) имеем \\(r_j=s_j=0\\), а при \\(t_j=2\\) имеем \\(r_j=s_j=1\\); значит \\(r=s\\), и эта общая строка обязана быть одной из двух шахматных строк \\(0101\\ldots\\) или \\(1010\\ldots\\). Итак, если текущая строка не шахматная, единственный допустимый следующий ряд — её дополнение; если текущая строка шахматная, следующий ряд может быть любой из двух шахматных строк, поскольку обе шахматные строки являются дополнениями друг друга и каждая из них также совместима сама с собой. Теперь считаем раскраски. Если первая строка не шахматная, её можно выбрать \\(2^n-2\\) способами, а после этого все остальные строки вынуждены чередоваться как \\(r,\\bar r,r,\\bar r,\\ldots\\). Это даёт \\(2^n-2\\) раскрасок. Если первая строка шахматная, то из предыдущей классификации каждая из \\(n\\) строк независимо выбирается одной из двух шахматных строк: любой соседний переход между ними допустим, и никакие другие строки в этом случае появиться не могут. Поэтому получаем \\(2^n\\) раскрасок. Эти два класса не пересекаются, так как в первом первая строка не шахматная, а во втором шахматная. Следовательно, общее число равно \\((2^n-2)+2^n=2^{n+1}-2\\).",
