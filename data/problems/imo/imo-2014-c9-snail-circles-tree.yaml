  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Полное доказательство через дерево нечётных областей",
      "text": "Пусть \\(\\mathcal C\\) — множество окружностей, \\(\\mathcal P\\) — множество их точек пересечения, а \\(\\mathcal R\\) — множество областей, на которые окружности делят плоскость, включая внешнюю область. Будем называть область нечётной, если она лежит внутри нечётного числа окружностей. Точку пересечения тоже назовём нечётной, если она лежит внутри нечётного числа окружностей, не считая две окружности, которые проходят через эту точку. Обозначим множества нечётных областей и нечётных точек через \\(\\mathcal R_{\\rm odd}\\) и \\(\\mathcal P_{\\rm odd}\\).\\n\\nСначала докажем подсчёт\\n\\[\\n|\\mathcal R_{\\rm odd}|-|\\mathcal P_{\\rm odd}|\\equiv n\\pmod 2.\\n\\]\\nДля окружности \\(c\\) обозначим через \\(R_c\\) число областей, лежащих внутри \\(c\\), через \\(P_c\\) число точек пересечения, лежащих внутри \\(c\\), через \\(X_c\\) число окружностей, пересекающих \\(c\\), а через \\(A_c\\) число дуг разбиения, лежащих внутри \\(c\\). Так как каждая область, лежащая внутри \\(t\\) окружностей, учитывается в сумме \\(\\sum_c R_c\\) ровно \\(t\\) раз, имеем \\(|\\mathcal R_{\\rm odd}|\\equiv\\sum_c R_c\\pmod2\\). Для точек пересечения тот же подсчёт по содержащим их окружностям даёт \\(|\\mathcal P_{\\rm odd}|\\equiv\\sum_c P_c\\pmod2\\). Рассмотрим планарный граф внутри окружности \\(c\\), считая внешность \\(c\\) одной дополнительной гранью. Формула Эйлера даёт\\n\\[\\n(R_c+1)+(P_c+2X_c)=(A_c+2X_c)+2,\\n\\]\\nто есть \\(R_c+P_c=A_c+1\\). С другой стороны, у каждой внутренней точки пересечения четыре конца внутренних дуг, а у каждой точки на самой \\(c\\) один конец внутренней дуги; поэтому \\(2A_c=4P_c+2X_c\\), откуда \\(A_c=2P_c+X_c\\). Следовательно, \\(R_c-P_c\\equiv X_c+1\\pmod2\\). После суммирования по всем \\(c\\) получаем\\n\\[\\n|\\mathcal R_{\\rm odd}|-|\\mathcal P_{\\rm odd}|\\equiv \\sum_c X_c+n\\equiv n\\pmod2,\\n\\]\\nпоскольку каждая пара пересекающихся окружностей входит в \\(\\sum_c X_c\\) дважды.\\n\\nТеперь опишем путь улитки как систему маленьких дуг в окрестностях точек пересечения: в каждой такой точке дуги соединяют те две локальные ветви, между которыми улитка переходит. По условию все эти дуги и оставшиеся части окружностей образуют одну простую замкнутую кривую \\(b\\), потому что путь улитки один и покрывает все окружности. Покажем, что нечётные области лежат внутри \\(b\\), а чётные — вне \\(b\\). Возьмём точку \\(x\\) внутри области и проведём из неё луч, не проходящий через точки пересечения и не касающийся окружностей. Точка \\(x\\) находится внутри \\(b\\) тогда и только тогда, когда луч пересекает \\(b\\) нечётное число раз. Для каждой окружности, содержащей \\(x\\) внутри, этот луч даёт один вклад по модулю 2; окружность, не содержащая \\(x\\), даёт ноль или два вклада. Значит, чётность числа пересечений луча с \\(b\\) равна чётности числа окружностей, внутри которых лежит область.\\n\\nРассмотрим точку пересечения \\(p\\) окружностей \\(c_1,c_2\\). В малой окрестности \\(p\\) сходятся четыре области. Пусть \\(r_1\\) лежит вне обеих \\(c_1,c_2\\), \\(r_2\\) лежит внутри обеих, а \\(r_3,r_4\\) лежат внутри ровно одной из них. Если сама точка \\(p\\) лежит внутри \\(k\\) других окружностей, то \\(r_1\\) и \\(r_2\\) лежат внутри \\(k\\) и \\(k+2\\) окружностей соответственно, а \\(r_3,r_4\\) — внутри \\(k+1\\) окружностей. Малые дуги пути в точке \\(p\\) соединяют именно области \\(r_1\\) и \\(r_2\\). Поэтому при нечётном \\(p\\) эта точка соединяет две нечётные области, а при чётном \\(p\\) — две чётные области.\\n\\nПостроим граф \\(G\\): его вершины — нечётные области, а каждое нечётное пересечение даёт ребро между двумя нечётными областями, которые оно соединяет. Так как нечётные области — ровно области внутри единственной кривой \\(b\\), граф \\(G\\) связен. Цикла в нём быть не может: цикл таких переходов отделил бы замкнутую часть границы и тем самым породил бы отдельную замкнутую орбиту улитки, противореча тому, что орбита одна. Следовательно, \\(G\\) — дерево. Его число вершин равно \\(|\\mathcal R_{\\rm odd}|\\), а число рёбер равно \\(|\\mathcal P_{\\rm odd}|\\), поэтому\\n\\[\\n|\\mathcal R_{\\rm odd}|-|\\mathcal P_{\\rm odd}|=1.\\n\\]\\nСравнивая это с доказанной выше конгруэнцией, получаем \\(n\\equiv1\\pmod2\\). Значит, \\(n\\) нечётно.",
