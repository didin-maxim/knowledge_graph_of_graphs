        "id": "stmt-original",
        "title": "Условие",
        "text": "На листе нарисованы \\(n\\) окружностей: любые две пересекаются в двух точках, и никакие три не проходят через одну точку. Улитка движется по окружностям: на пересечении переходит на другую окружность и меняет направление. Если её путь полностью покрывает все окружности, докажите, что \\(n\\) нечётно.",
