      "id": "sol-official-compressed",
      "title": "Сжатое официальное решение",
      "text": "Официальное решение рассматривает плоскую картину окружностей и области дополнения. Области классифицируются по чётности числа окружностей, внутри которых они лежат, а точки пересечения также делятся на два типа. Из условия, что траектория улитки одна и покрывает все дуги, следует связность специального графа нечётных областей: вершины — нечётные области, рёбра — нечётные точки пересечения, через которые области соединяются. Цикл в этом графе дал бы отдельную замкнутую часть траектории, поэтому граф является деревом. Тогда число его вершин на единицу больше числа рёбер. Сравнение этой формулы с подсчётом областей и пересечений окружностей даёт, что \\(n\\) нечётно.",
