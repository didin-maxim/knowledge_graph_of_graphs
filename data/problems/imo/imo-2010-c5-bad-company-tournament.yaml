        "id": "stmt-original",
        "title": "Условие",
        "text": "В турнире \\(n\\ge4\\) игроков каждая пара сыграла ровно один матч без ничьих. Плохой называется четвёрка игроков, где один проиграл трём остальным, а эти трое между собой образуют цикл побед. Если плохих четвёрок нет, докажите, что \\(\\sum_i (w_i-l_i)^3\\ge0\\), где \\(w_i,l_i\\) — числа побед и поражений игрока.",
