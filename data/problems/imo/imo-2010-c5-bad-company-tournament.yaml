    {
      "id": "sol-degree-sum-full",
      "title": "Полное решение подсчётом сумм степеней в турнире",
      "text": "Будем говорить, что в компании из нескольких игроков игрок является локальным чемпионом, если он победил всех остальных в этой компании, и локальным проигравшим, если он всем остальным проиграл. Для фиксированного \\(k\\) число пар вида «\\(k\\)-компания и её локальный чемпион» равно \\(\\sum_i \\binom{w_i}{k-1}\\), потому что к игроку \\(i\\) надо выбрать ещё \\(k-1\\) игроков из тех, кого он победил. Число локальных проигравших в \\(k\\)-компаниях равно \\(\\sum_i \\binom{l_i}{k-1}\\). При \\(k=2\\) оба числа равны числу матчей, поэтому \\(\\sum_i(w_i-l_i)=0\\). При \\(k=3\\) каждая тройка либо является циклом, и тогда не имеет ни локального чемпиона, ни локального проигравшего, либо транзитивна, и тогда имеет ровно одного того и другого; значит \\(\\sum_i\\binom{w_i}{2}=\\sum_i\\binom{l_i}{2}\\). При \\(k=4\\) условие задачи говорит, что всякая четвёрка с локальным проигравшим обязательно имеет локального чемпиона: если три победителя над ним образовали бы цикл, четвёрка была бы плохой, а если не цикл, среди этих троих есть победитель двух остальных, то есть локальный чемпион всей четвёрки. Поэтому \\(\\sum_i\\binom{w_i}{3}\\ge\\sum_i\\binom{l_i}{3}\\). Осталось связать эти три подсчёта с нужной суммой кубов. Для любых \\(x,y\\) верно тождество \\((x-y)^3=24\\left(\\binom{x}{3}-\\binom{y}{3}\\right)+24\\left(\\binom{x}{2}-\\binom{y}{2}\\right)+\\bigl(-3(x+y)^2+4\\bigr)(x-y)\\). Подставим \\(x=w_i\\), \\(y=l_i\\). Так как каждый игрок сыграл со всеми остальными, \\(w_i+l_i=n-1\\), последний коэффициент не зависит от \\(i\\). После суммирования по \\(i\\) получаем \\(\\sum_i(w_i-l_i)^3=24\\sum_i\\left(\\binom{w_i}{3}-\\binom{l_i}{3}\\right)+24\\sum_i\\left(\\binom{w_i}{2}-\\binom{l_i}{2}\\right)+\\bigl(-3(n-1)^2+4\\bigr)\\sum_i(w_i-l_i)\\). Второе и третье слагаемые равны нулю, а первое неотрицательно по оценке для четвёрок. Следовательно, \\(\\sum_i(w_i-l_i)^3\\ge0\\).",
