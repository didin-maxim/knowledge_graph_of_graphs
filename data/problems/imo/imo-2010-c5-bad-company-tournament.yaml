    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Пусть \\(T\\) — турнир на \\(n\\ge4\\) вершинах. Назовём плохой четвёркой множество из четырёх вершин, в котором одна вершина проигрывает трём остальным, а эти три вершины между собой образуют ориентированный цикл длины 3. Если в \\(T\\) нет плохих четвёрок, то докажите, что \\(\\sum_{v\\in V(T)} (d^+(v)-d^-(v))^3\\ge0\\).",
