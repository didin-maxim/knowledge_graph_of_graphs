      "id": "sol-official-compressed",
      "title": "Сжатое официальное решение",
      "text": "Переводим турнир в ориентированный полный граф. Запрет плохой четвёрки означает: если вершина проигрывает трём вершинам, то эти три не могут образовывать ориентированный цикл. Официальное решение доказывает утверждение индукцией по числу вершин, разбивая вершины относительно выбранного игрока на победителей и проигравших и используя, что внутри соответствующих частей сохраняется тот же запрет. При раскрытии суммы кубов \\((w_i-l_i)^3\\) вклад между частями контролируется степенями, а запрещённый цикл в тройке даёт нужный знак. В итоге сумма неотрицательна.",
