    {
      "id": "sol-official-compressed",
      "title": "Официальное решение через граф областей лабиринта",
      "text": "Для любой раскраски строим граф \\(G\\): вершины — области разбиения плоскости прямыми, рёбра — двери при пересечениях. Число областей равно \\(\\binom{n+1}{2}+1\\): при добавлении очередной прямой она пересекает предыдущие в \\(m-1\\) точках и разбивается ими на \\(m\\) отрезков-лучей, каждый из которых делит одну старую область на две. Дверей ровно \\(\\binom n2\\), по одной в каждой точке пересечения двух прямых. Если начать с графа без рёбер, у него столько компонент, сколько областей; добавление одного ребра уменьшает число компонент не более чем на 1. Поэтому при любой раскраске число компонент графа дверей не меньше \\(\\binom{n+1}{2}+1-\\binom n2=n+1\\). Поставив по одному рыцарю в разные компоненты, Моргана гарантирует \\(n+1\\) рыцарей, которые не смогут встретиться. Докажем, что больше гарантировать нельзя. Выберем координаты так, чтобы ни одна из прямых не была вертикальной или горизонтальной. Мерлин красит у каждой прямой западную сторону в красный цвет, а восточную — в синий. Каждой области припишем метку \\(r\\), равную числу прямых, для которых эта область лежит с восточной стороны; возможны только метки \\(0,1,\\ldots,n\\). Дверь при пересечении двух прямых соединяет две диагонально противоположные смешанные области: в одной область восточнее первой прямой и западнее второй, в другой наоборот. Поэтому сумма вкладов этих двух прямых в метку в обеих областях равна \\(1\\), а все остальные вклады одинаковы; значит каждая дверь сохраняет метку. Следовательно, разные метки лежат в разных компонентах. Осталось показать, что все области с одной и той же меткой связаны дверями. Для фиксированной метки \\(r\\) есть ровно одна область с этой меткой, неограниченная вверх: достаточно посмотреть на горизонтальную прямую очень высоко над всеми пересечениями; она пересекает данные прямые в некотором порядке и разбивает верхнюю часть плоскости на \\(n+1\\) промежутков с метками \\(0,1,\\ldots,n\\) в некотором порядке. Возьмём любую область с меткой \\(r\\). Если она не неограничена вверх, то, поскольку области выпуклы, у неё есть единственная верхняя вершина. В этой вершине две прямые образуют «крышу» области, и дверь ведёт через вершину в диагонально противоположную область выше; как уже отмечено, метка при этом не меняется. Повторяя такой переход, мы каждый раз поднимаемся в область, лежащую выше прежней верхней вершины, поэтому за конечное число шагов приходим в единственную неограниченную вверх область с меткой \\(r\\). Значит все области данной метки связаны между собой, а компонент ровно \\(n+1\\). При такой раскраске Моргана не может поставить больше одного невстречающегося рыцаря в одну компоненту, так что максимальная гарантированная величина равна \\(n+1\\).",
