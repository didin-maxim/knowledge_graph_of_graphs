        "id": "stmt-original",
        "title": "Условие",
        "text": "На плоскости проведены \\(n\\) прямых, никакие две не параллельны и никакие три не проходят через одну точку. У каждого пересечения есть дверь только в тех углах, где встречаются стороны разных цветов. Моргана ставит рыцарей в области так, что два рыцаря могут встретиться, если между их областями есть путь через двери. Найдите наибольшее число рыцарей, которых она может гарантированно расставить независимо от раскраски сторон прямых.",
