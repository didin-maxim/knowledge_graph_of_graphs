  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Сжатое официальное решение",
      "text": "Для любой раскраски строим граф \\(G\\): вершины — области разбиения плоскости прямыми, рёбра — двери при пересечениях. Известно, что \\(n\\) прямых дают \\(\\binom{n+1}{2}+1\\) областей, а дверей ровно \\(\\binom n2\\). Добавление каждого ребра уменьшает число компонент не более чем на 1, поэтому компонент в \\(G\\) не меньше \\(n+1\\). Поставив по одному рыцарю в каждую компоненту, Моргана гарантирует \\(n+1\\) невстречающихся рыцарей. Обратная конструкция раскраски из официального решения делает граф дверей имеющим ровно \\(n+1\\) компонент, поэтому больше гарантировать нельзя.",
