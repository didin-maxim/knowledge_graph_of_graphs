  "solutions": [
    {
      "id": "sol-graph-review",
      "title": "Сжатое графовое решение",
      "text": "Выберем ученика A. Среди 16 разговоров от A хотя бы 6 имеют одну тему, скажем первую; пусть это множество B. Если две вершины из B также говорили на первую тему, вместе с A они дают нужную тройку. Если нет, то все рёбра внутри B окрашены только двумя оставшимися цветами. В любом двухцветно раскрашенном K₆ есть одноцветный треугольник: из одной вершины выходят три ребра одного цвета; если среди их концов есть ребро того же цвета, всё готово, а иначе три конца образуют треугольник второго цвета. Значит в любом случае есть трое учеников, попарно говоривших на одну тему.",
      "idea_ids": [
