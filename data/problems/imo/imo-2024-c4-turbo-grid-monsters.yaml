  "solutions": [
    {
      "id": "sol-three-attempts",
      "title": "Ровно три попытки",
      "text": "Ответ: \\(3\\). Сначала докажем, что двух попыток недостаточно. Пусть \\((2,i)\\) — первая клетка второй строки, которую Турбо достиг в первой попытке. Возможно, именно там стоит монстр, тогда первая попытка сразу заканчивается. Во второй попытке пусть \\((3,j)\\) — первая достигнутая клетка третьей строки; Турбо пришёл в неё из \\((2,j)\\), причём \\(j\\ne i\\), потому что клетка \\((2,i)\\) уже известна как опасная. Монстра третьей строки можно поставить в \\((3,j)\\), и вторая попытка тоже завершится неудачей. Теперь дадим стратегию за три попытки. В первой попытке Турбо идёт по пути \\((1,1),(2,1),(2,2),\\ldots,(2,2023)\\), тем самым находит монстра во второй строке. Если он стоит в \\((2,i)\\), где \\(2\\le i\\le2022\\), то во второй и третьей попытках Турбо идёт по путям через \\((2,i-1),(3,i-1),(3,i),(4,i),\\ldots,(2024,i)\\) и через \\((2,i+1),(3,i+1),(3,i),(4,i),\\ldots,(2024,i)\\). В столбце \\(i\\) дальше монстров нет, потому что монстр этого столбца уже найден во второй строке, а две возможные опасные клетки \\((3,i-1)\\) и \\((3,i+1)\\) лежат в одной строке, поэтому монстром может быть не более одной из них; значит, одна из двух попыток успешна. Если монстр второй строки стоит на краю, скажем в \\((2,1)\\), то во второй попытке Турбо идёт от \\((1,2)\\) по ломаной \\((2,2),(2,3),(3,3),(4,4),\\ldots,(2023,2023),(2024,2023)\\). Если он не встретил монстра, всё готово. Иначе пусть первый встреченный монстр — \\((r,c)\\), где по форме пути \\(c=r\\) или \\(c=r+1\\). В третьей попытке Турбо повторяет безопасную начальную часть до строки \\(r-1\\), затем проходит по строке \\(r\\) влево до первого столбца и дальше спускается по первому столбцу. Начальная часть безопасна, потому что была пройдена до найденного монстра; клетки строки \\(r\\) левее \\((r,c)\\) безопасны, потому что в строке \\(r\\) только один монстр; первый столбец ниже безопасен, потому что его единственный монстр уже найден в \\((2,1)\\). Поэтому третья попытка достигает последней строки.",
