  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Сжатое официальное решение",
      "text": "Ключевая лемма официального решения: в любом графе \\(G\\) существует независимое множество размера не меньше \\(\\sum_{v\\in G}1/(d(v)+1)\\); она доказывается индукцией удалением вершины минимальной степени и её соседей. Далее для каждой возможной суммы рассматриваются хорды, соединяющие пары чисел с этой суммой. Внутри такого класса строится граф пересечений: вершины — хорды, рёбра — пересечения. Суммирование оценки по подходящим классам показывает, что хотя бы в одном классе независимое множество имеет размер не меньше 100. Его вершины и дают 100 попарно непересекающихся хорд с одинаковыми суммами.",
