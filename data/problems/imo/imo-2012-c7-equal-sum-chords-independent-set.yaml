    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Вершины полного графа \\(K_{2500}\\) расположены на окружности и помечены числами \\(1,2,\\ldots,2500\\). Докажите, что найдётся такое число \\(s\\), что среди хорд \\(ij\\) с условием \\(i+j=s\\) можно выбрать 100 попарно непересекающихся.",
        "status": "needs_human_review",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [],
        "distinct_from": [
          "stmt-original",
          "stmt-graph-intersection"
        ]
      },
      {
        "id": "stmt-graph-intersection",
        "text": "Для каждого числа \\(s\\in\\{3,4,\\ldots,4999\\}\\) рассмотрим все хорды \\(ij\\) окружности, где вершины помечены числами \\(1,2,\\ldots,2500\\) по кругу и \\(i+j=s\\). Построим граф \\(H_s\\), вершинами которого являются эти хорды, а две вершины смежны тогда и только тогда, когда соответствующие хорды пересекаются. Докажите, что найдётся такое \\(s\\), для которого граф \\(H_s\\) содержит независимое множество размера не меньше 100.",
