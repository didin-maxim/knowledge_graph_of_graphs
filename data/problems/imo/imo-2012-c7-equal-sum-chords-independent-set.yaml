  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Полное доказательство через независимое множество хорд",
      "text": "Используем лемму Каро--Вея в той форме, которая нужна здесь: если в графе \\(G\\) степень вершины \\(v\\) равна \\(d(v)\\), то в \\(G\\) есть независимое множество размера не меньше \\(f(G)=\\sum_{v\\in V(G)}1/(d(v)+1)\\). Докажем лемму индукцией по числу вершин. Выберем вершину \\(v_0\\) минимальной степени \\(d\\), удалим её вместе с соседями и получим граф \\(G'\\). По индукции в \\(G'\\) есть независимое множество размера хотя бы \\(f(G')\\); добавив к нему \\(v_0\\), получаем независимое множество в \\(G\\). При этом для оставшихся вершин степени в \\(G'\\) не больше прежних, а у \\(v_0\\) и её \\(d\\) соседей степени в \\(G\\) не меньше \\(d\\), поэтому \\(f(G')\\ge f(G)-\\sum_{i=0}^{d}1/(d(v_i)+1)\\ge f(G)-1\\). Значит полученное множество имеет размер хотя бы \\(f(G)\\). Теперь положим \\(N=2^{500}=2n\\), то есть \\(n=2^{499}\\). Раскрасим каждую хорду цветом, равным сумме чисел на её концах; цветов не больше \\(4n-3\\), от \\(3\\) до \\(4n-1\\). Для цвета \\(c\\) построим граф \\(G_c\\): его вершины — хорды цвета \\(c\\), а рёбра соединяют пересекающиеся хорды. Независимое множество в \\(G_c\\) ровно и есть набор попарно непересекающихся хорд с одинаковой суммой. Для хорды \\(l\\) обозначим через \\(m(l)\\) меньшее число данных точек на двух дугах между её концами. Для каждого \\(i=0,1,\\ldots,n-2\\) существует ровно \\(2n\\) хорд с \\(m(l)=i\\). Если хорда \\(l\\) имеет цвет \\(c\\) и \\(m(l)=i\\), то пересечь её могут только хорды цвета \\(c\\), у которых один конец лежит на выбранной меньшей дуге. На каждой из \\(i\\) внутренних точек этой дуги начинается не более одной хорды данного цвета, потому что второй конец однозначно определяется суммой \\(c\\). Поэтому степень \\(l\\) в соответствующем \\(G_c\\) не превосходит \\(i\\), и её вклад в \\(f(G_c)\\) не меньше \\(1/(i+1)\\). Суммируя по всем цветам и по всем хордам с \\(m(l)=0,1,\\ldots,n-2\\), получаем \\(\\sum_c f(G_c)\\ge \\sum_{i=0}^{n-2}2n/(i+1)=2n\\sum_{j=1}^{n-1}1/j\\). Так как цветов не больше \\(4n-3\\), для некоторого цвета \\(c\\) имеем \\(f(G_c)\\ge \\frac{2n}{4n-3}\\sum_{j=1}^{n-1}1/j>\\frac12\\sum_{j=1}^{n-1}1/j\\). Осталось численно оценить гармоническую сумму. Поскольку \\(n-1=2^{499}-1\\), она содержит первые \\(2^{400}\\) членов, и \\(\\sum_{j=1}^{n-1}1/j>1+\\sum_{r=1}^{400}\\sum_{j=2^{r-1}+1}^{2^r}1/j>1+400\\cdot\\frac12=201\\). Следовательно, для найденного цвета \\(f(G_c)>100\\), а по лемме в \\(G_c\\) есть независимое множество размера больше 100, в частности не меньше 100. Эти хорды попарно не пересекаются и имеют одинаковую сумму концов.",
