    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Рассмотрим лес корневых деревьев, в котором каждая вершина либо является листом, либо имеет ровно двух сыновей. Вершина \\(u\\) называется \\(k\\)-династической, если у неё есть два сына и у каждого из этих сыновей имеется не менее \\(k\\) потомков. Докажите, что если во всём лесе \\(n\\) вершин, то число \\(k\\)-династических вершин не превосходит \\(n/(k+2)\\).",
