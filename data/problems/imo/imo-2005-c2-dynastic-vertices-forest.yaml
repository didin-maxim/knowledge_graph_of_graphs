  "statements": {
    "original": [
      {
        "id": "stmt-original",
        "text": "Лес состоит из корневых деревьев. Каждая вершина либо лист, либо имеет ровно двух сыновей. Вершина \\(v\\) называется потомком вершины \\(u\\), если от \\(u\\) к \\(v\\) ведёт цепочка сыновей. Вершина называется династической, если у неё два сына и у каждого из этих сыновей есть хотя бы \\(k\\) потомков. Докажите, что если в лесу \\(n\\) вершин, то династических вершин не больше \\(n/(k+2)\\).",
        "source_id": "src-secondary-imo-2005-shortlist",
        "status": "needs_human_review",
