  "solutions": [
    {
      "id": "sol-secondary-sketch",
      "title": "Сжатый графовый разбор",
      "text": "Рассмотрим минимальную по включению династическую вершину, то есть такую, ниже которой нет другой династической вершины. У каждого из двух её сыновей есть не меньше \\(k\\) потомков, значит вместе с самой вершиной и двумя сыновьями в соответствующем фрагменте дерева находится не меньше \\(k+2\\) вершин, которые можно списать на эту династическую вершину так, чтобы они не понадобились для других минимальных династических вершин. Удаляя такие фрагменты или проводя эквивалентную индукцию по числу вершин леса, получаем, что каждому династическому узлу соответствует по крайней мере \\(k+2\\) различных вершин. Поэтому их число не превосходит \\(n/(k+2)\\).",
