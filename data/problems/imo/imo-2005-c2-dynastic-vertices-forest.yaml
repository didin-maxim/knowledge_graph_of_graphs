  "solutions": [
    {
      "id": "sol-secondary-sketch",
      "title": "Индукционный заряд по поддеревьям",
      "text": "Докажем немного более сильную индукционную оценку для одного корневого дерева. Для вершины \\(x\\) обозначим через \\(T_x\\) поддерево с корнем \\(x\\), через \\(|T_x|\\) число его вершин, а через \\(d(T_x)\\) число династических вершин внутри него. Положим\n\\[\nF(T_x)=|T_x|-(k+2)d(T_x).\n\\]\nУтверждаем, что для каждого поддерева \\(T_x\\)\n\\[\nF(T_x)\\ge \\min(|T_x|,k+1). \\tag{1}\n\\]\n\nДоказательство ведём индукцией по \\(|T_x|\\). Если \\(x\\) — лист, то \\(F(T_x)=1\\), и (1) очевидно. Пусть теперь у \\(x\\) есть два сына \\(a,b\\). По предположению индукции оценка (1) уже доказана для \\(T_a\\) и \\(T_b\\).\n\nЕсли \\(x\\) не династическая, то\n\\[\nF(T_x)=1+F(T_a)+F(T_b)\\ge 1+\\min(|T_a|,k+1)+\\min(|T_b|,k+1).\n\\]\nПравая часть не меньше \\(\n\\min(1+|T_a|+|T_b|,k+1)=\\min(|T_x|,k+1)\\), значит (1) выполнено.\n\nЕсли \\(x\\) династическая, то каждый из сыновей \\(a,b\\) имеет не менее \\(k\\) потомков, поэтому каждое из поддеревьев \\(T_a,T_b\\) содержит по крайней мере \\(k+1\\) вершин: самого сына и эти \\(k\\) его потомков. По индукционному предположению тогда \\(F(T_a)\\ge k+1\\) и \\(F(T_b)\\ge k+1\\). Следовательно,\n\\[\nF(T_x)=1+F(T_a)+F(T_b)-(k+2)\\ge 1+(k+1)+(k+1)-(k+2)=k+1,\n\\]\nчто снова даёт (1).\n\nТеперь применим (1) к каждому дереву исходного леса. Для дерева \\(T\\) получаем \\(|T|-(k+2)d(T)=F(T)\\ge 0\\). Суммируя по всем компонентам леса, имеем\n\\[\nn-(k+2)D\\ge 0,\n\\]\nгде \\(D\\) — общее число династических вершин во всём лесе. Значит, \\(D\\le n/(k+2)\\), что и требовалось доказать.",
