  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Доказательство через эйлеров мультиграф",
      "text": "Ответ: \\(2n-1\\). Верхняя оценка даётся, например, разрезанием на куски размеров \\(n,1,n,1,\\ldots,n,1,1\\): длинные куски кладутся как строки нужного остаточного вида, а единичные куски заполняют последнюю строку. Для нижней оценки удобно идти в обратную сторону. Стартуем с \\(n\\) строк-косков \\(k,k+1,\\ldots,k+n-1\\) по модулю \\(n\\), затем режем их на окончательные куски, из которых можно восстановить исходную полосу. Каждому куску \\(a,a+1,\\ldots,b-1\\) сопоставим ребро мультиграфа \\(\\Gamma\\) на вершинах \\(1,\\ldots,n\\), соединяющее остатки \\(a\\) и \\(b\\) по модулю \\(n\\). Куски, полученные из одной исходной строки \\(k,k+1,\\ldots,k+n-1\\), образуют цикл \\(\\gamma_k\\), проходящий через вершину \\(k\\). Так как все окончательные куски можно снова сложить в одну полосу, рёбра \\(\\Gamma\\) имеют эйлеров цикл, значит \\(\\Gamma\\) связен. Выберем по одному ребру из каждого цикла \\(\\gamma_k\\) и удалим их. Эти циклы не имеют общих рёбер, а удаление одного ребра из каждого такого строкового цикла не разрушает связность: внутри каждой строки остаётся путь между теми же остатками, а эйлеров обход исходной полосы по-прежнему связывает вершины через оставшиеся части. Полученный связный граф на \\(n\\) вершинах имеет не меньше \\(n-1\\) рёбер. До удаления было на \\(n\\) рёбер больше, поэтому исходных кусков не меньше \\((n-1)+n=2n-1\\).",
