  "ideas": [
    {
      "id": "idea-pieces-as-edges",
      "title": "Куски как рёбра",
      "text": "Каждый кусок с метками от \\(a\\) до \\(b-1\\) задаёт ребро из остатка \\(a\\) в остаток \\(b\\) по модулю \\(n\\).",
