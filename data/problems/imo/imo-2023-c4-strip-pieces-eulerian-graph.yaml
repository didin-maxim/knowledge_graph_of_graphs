        "text": "Пусть \\(n\\ge2\\). Полоска \\(1\\times n^2\\) состоит из клеток с метками \\(1,\\ldots,n^2\\). Нужно разрезать её на несколько отрезков из подряд идущих клеток и, не поворачивая и не отражая, перенести куски в квадрат \\(n\\times n\\) так, чтобы для метки \\(a_{ij}\\) в клетке строки \\(i\\), столбца \\(j\\), число \\(a_{ij}-(i+j-1)\\) делилось на \\(n\\). Найдите минимальное число кусков.",
