  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Сжатое официальное решение",
      "text": "Официальное решение разрезает задачу ещё раз: каждый получившийся кусок с метками \\(a,a+1,\\ldots,b-1\\) задаёт ребро в графе на вершинах \\(1,\\ldots,n\\), из остатка \\(a\\) в остаток \\(b\\) по модулю \\(n\\). Так как куски можно восстановить в одну исходную полоску, все рёбра графа допускают эйлеров цикл. Кроме того, куски, лежащие в строках квадрата, дают для каждого остатка специальный цикл. Связность эйлерова графа и необходимость покрыть все такие циклы заставляют иметь не меньше \\(2n-1\\) рёбер. Конструкция из \\(2n-1\\) кусков достигает этой границы, значит это минимум.",
