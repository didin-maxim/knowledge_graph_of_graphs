  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Доказательство через эйлеров мультиграф",
      "text": "Ответ: \\(2n-1\\).\n\nБудем работать с остатками по модулю \\(n\\). Удобно считать, что остатки - это \\(0,1,\\ldots,n-1\\), а в клетке \\((i,j)\\) должен стоять номер с остатком \\(i+j-1\\pmod n\\). В каждой строке требуемые остатки идут подряд и увеличиваются на 1 при переходе вправо.\n\nСначала построим разрезание на \\(2n-1\\) кусков. Отрежем от исходной полоски \\(n-1\\) длинных кусков длины \\(n\\), а между соседними длинными кусками - по одному одноклеточному куску; в конце останется ещё один одноклеточный кусок. Иными словами, длины кусков равны\n\\[\nn,1,n,1,\\ldots,n,1,\n\\]\nгде длинных кусков \\(n-1\\), а единичных кусков \\(n\\). Всего кусков \\((n-1)+n=2n-1\\).\n\nПервый длинный кусок имеет остатки \\(0,1,\\ldots,n-1\\), второй - \\(1,2,\\ldots,0\\), и так далее. Поэтому \\(n-1\\) длинных кусков можно положить в первые \\(n-1\\) строк: каждый из них заполняет целую строку с нужным начальным остатком. Оставшиеся \\(n\\) единичных кусков имеют все возможные остатки по одному разу, поэтому ими можно заполнить последнюю строку в нужном порядке. Это даёт верхнюю оценку \\(2n-1\\).\n\nДокажем теперь, что меньшего числа кусков быть не может. Рассмотрим любое допустимое разрезание и расположение кусков. Каждому куску сопоставим ориентированное ребро мультиграфа \\(\\Gamma\\) на вершинах \\(0,1,\\ldots,n-1\\). Если кусок начинается с числа, имеющего остаток \\(a\\), и сразу после его конца в исходной полоске шёл бы остаток \\(b\\), то проводим ребро \\(a\\to b\\). Например, кусок длины \\(\\ell\\) даёт ребро из \\(a\\) в \\(a+\\ell\\pmod n\\).\n\nПочему этот граф связан с исходной полоской? Если взять куски в их исходном порядке на полоске, то конец каждого ребра совпадает с началом следующего: после остатка \\(b-1\\) идёт остаток \\(b\\). Значит, все рёбра \\(\\Gamma\\) в исходном порядке образуют замкнутый эйлеров обход. В частности, если забыть направления, граф \\(\\Gamma\\) связен на всех вершинах, которые встречаются. А все \\(n\\) вершин встречаются, потому что каждая строка доски содержит все остатки.\n\nТеперь посмотрим на одну строку готового квадрата. В ней остатки идут циклически подряд:\n\\[\nr,r+1,\\ldots,r+n-1\\pmod n.\n\\]\nКуски, лежащие в этой строке, разбивают этот циклический ряд на дуги. Поэтому соответствующие им рёбра образуют цикл \\(\\gamma_r\\) в мультиграфе \\(\\Gamma\\), проходящий через вершину \\(r\\). Для разных строк эти циклы не имеют общих рёбер, потому что каждый кусок лежит ровно в одной строке.\n\nПусть всего кусков \\(m\\), то есть в \\(\\Gamma\\) ровно \\(m\\) рёбер. Возьмём в связном неориентированном графе, полученном из \\(\\Gamma\\) забыванием направлений, остовное дерево \\(T\\). Ни один из строковых циклов \\(\\gamma_r\\) не может целиком лежать в дереве: дерево не содержит циклов, а если \\(\\gamma_r\\) состоит из одной петли, петля тоже не может входить в дерево. Поэтому из каждого из \\(n\\) попарно рёберно непересекающихся циклов \\(\\gamma_r\\) можно выбрать по одному ребру, не принадлежащему \\(T\\).\n\nУдалим эти \\(n\\) выбранных рёбер. Остовное дерево \\(T\\) осталось целиком, значит оставшийся граф всё ещё связен и имеет \\(n\\) вершин. Любой связный граф на \\(n\\) вершинах содержит хотя бы \\(n-1\\) рёбер. Следовательно,\n\\[\nm-n\\ge n-1,\n\\]\nто есть\n\\[\nm\\ge 2n-1.\n\\]\nВерхняя и нижняя оценки совпали, поэтому минимальное число кусков равно \\(2n-1\\).",
