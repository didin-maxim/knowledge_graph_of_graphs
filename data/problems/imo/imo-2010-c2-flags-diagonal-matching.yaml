        "id": "stmt-original",
        "title": "Условие",
        "text": "На некоторой планете есть \\(2^N\\) стран, где \\(N\\ge 4\\). У каждой страны есть флаг ширины \\(N\\) и высоты \\(1\\), составленный из \\(N\\) единичных клеток; каждая клетка либо жёлтая, либо синяя. Никакие две страны не имеют одинаковых флагов. Назовём множество из \\(N\\) флагов разнообразным, если эти флаги можно расположить строками квадрата \\(N\\times N\\) так, чтобы все \\(N\\) клеток главной диагонали имели один и тот же цвет. Найдите наименьшее положительное целое число \\(M\\), при котором среди любых \\(M\\) различных флагов найдутся \\(N\\) флагов, образующих разнообразное множество.",
        "source_id": "src-imo-2010-shortlist",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [],
