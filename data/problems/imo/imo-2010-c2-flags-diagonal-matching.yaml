    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Рассмотрим двудольный граф между выбранными флагами и позициями \\(1,\\ldots,N\\); флаг соединён с позицией, если в этой позиции стоит нужный цвет. Разнообразное множество соответствует паросочетанию, покрывающему все позиции.",
