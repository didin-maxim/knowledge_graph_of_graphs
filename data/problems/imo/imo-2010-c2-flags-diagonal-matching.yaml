  "solutions": [
    {
      "id": "sol-hall-extremal-full",
      "title": "Полное решение через теорему Холла и экстремальный пример",
      "text": "Ответ: \\(M=2^{N-2}+1\\).\n\nСначала покажем, что меньшее число флагов не гарантирует разнообразного множества. Возьмём все флаги, у которых первая клетка жёлтая, а вторая синяя; остальные \\(N-2\\) клеток произвольны. Таких флагов ровно \\(2^{N-2}\\). Если из них составить квадрат \\(N\\times N\\), то строка, стоящая первой, даёт на главной диагонали жёлтую клетку, а строка, стоящая второй, даёт синюю клетку. Поэтому диагональ не может быть одноцветной. Значит, \\(M>2^{N-2}\\).\n\nДокажем обратную оценку. Возьмём произвольные \\(2^{N-2}+1\\) различных флагов. Обозначим через \\(V\\) множество позиций \\(1,\\ldots,N\\), а через \\(V'\\) множество этих флагов. Построим два двудольных графа с долями \\(V\\) и \\(V'\\): в графе \\(G_y\\) позиция \\(c\\) соединена с флагом \\(f\\), если в позиции \\(c\\) у флага \\(f\\) стоит жёлтая клетка; в графе \\(G_b\\) — если в этой позиции стоит синяя клетка. Если один из графов имеет паросочетание, покрывающее все вершины из \\(V\\), то соответствующие \\(N\\) флагов можно поставить строками так, чтобы флаг, сопоставленный позиции \\(c\\), стоял в строке \\(c\\). Тогда вся главная диагональ имеет выбранный цвет.\n\nПредположим противное: ни \\(G_y\\), ни \\(G_b\\) не имеют паросочетания, покрывающего \\(V\\). По теореме Холла существуют непустые множества позиций \\(S_y,S_b\\subset V\\), для которых\n\\[\n|N_y(S_y)|\\le |S_y|-1,\\qquad |N_b(S_b)|\\le |S_b|-1,\n\\]\nгде \\(N_y(S_y)\\) и \\(N_b(S_b)\\) — множества флагов, смежных хотя бы с одной позицией из соответствующего множества в жёлтом и синем графах. Эти множества позиций не равны всему \\(V\\): например, если бы \\(S_y=V\\), то вне \\(N_y(V)\\) мог бы лежать только полностью синий флаг, поэтому \\(|N_y(V)|\\ge (2^{N-2}+1)-1=2^{N-2}\\ge N\\), что противоречит \\(|N_y(V)|< N\\). Случай \\(S_b=V\\) разбирается так же, только единственным возможным флагом вне \\(N_b(V)\\) был бы полностью жёлтый.\n\nЕсли \\(S_y\\cap S_b\\ne\\varnothing\\), выберем позицию \\(c\\) из пересечения. Каждый флаг в позиции \\(c\\) либо жёлтый, либо синий, значит \\(N_y(S_y)\\cup N_b(S_b)=V'\\). Тогда\n\\[\n2^{N-2}+1=|V'|\\le |N_y(S_y)|+|N_b(S_b)|\\le |S_y|+|S_b|-2\\le 2N-4,\n\\]\nпоскольку оба множества \\(S_y,S_b\\) собственные. Но при \\(N\\ge4\\) имеем \\(2^{N-2}+1>2N-4\\), противоречие.\n\nОстаётся случай \\(S_y\\cap S_b=\\varnothing\\). Положим \\(y=|S_y|\\), \\(b=|S_b|\\), \\(c=y+b\\). Тогда \\(2\\le c\\le N\\). Рассмотрим флаги, не лежащие в \\(N_y(S_y)\\cup N_b(S_b)\\). У каждого такого флага все клетки в позициях из \\(S_y\\) синие, а все клетки в позициях из \\(S_b\\) жёлтые; свободными остаются только \\(N-c\\) позиций. Поэтому таких флагов не больше \\(2^{N-c}\\). С другой стороны,\n\\[\n|V'\\setminus (N_y(S_y)\\cup N_b(S_b))|\n\\ge 2^{N-2}+1-(y-1)-(b-1)=2^{N-2}+3-c.\n\\]\nСледовательно,\n\\[\n2^{N-c}\\ge 2^{N-2}+3-c.\n\\]\nЭто невозможно при \\(2\\le c\\le N\\): при \\(c=2\\) правая часть равна \\(2^{N-2}+1\\), а при \\(c\\ge3\\) разность\n\\(2^{N-2}+3-c-2^{N-c}=2^{N-c}(2^{c-2}-1)+3-c\\) положительна (для \\(c=3\\) она равна \\(2^{N-3}\\), а для \\(c\\ge4\\) достаточно заметить, что \\(2^{c-2}-1>c-3\\)). Получено противоречие.\n\nЗначит, хотя бы один из двух графов удовлетворяет условию Холла и имеет паросочетание, покрывающее все позиции. Это паросочетание даёт \\(N\\) флагов с одноцветной главной диагональю. Итак, минимальное число равно \\(2^{N-2}+1\\).",
