  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Сжатое официальное решение",
      "text": "Ответ: \\(2^N-1\\). Нижняя оценка получается удалением пары противоположных флагов: оставшееся семейство из \\(2^N-2\\) флагов не обязано содержать нужную диагональ. Для верхней оценки фиксируем цвет и строим двудольный граф: слева флаги, справа позиции, ребро означает, что в этой позиции флаг имеет данный цвет. Если для какого-то цвета выполнено условие Холла, то соответствующее паросочетание даёт \\(N\\) флагов и перестановку строк с одноцветной диагональю. Если условие Холла нарушено для обоих цветов, то две запрещающие группы позиций и флагов дают слишком мало различных флагов, что противоречит наличию \\(2^N-1\\) флагов.",
