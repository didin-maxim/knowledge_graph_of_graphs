  "statements": {
    "original": [
      {
        "id": "stmt-original",
        "title": "Условие",
        "text": "На планете есть \\(2^N\\) стран, и у каждой страны свой флаг из \\(N\\) клеток в ряд, каждая клетка жёлтая или синяя. Множество из \\(N\\) флагов называется разнообразным, если эти флаги можно расположить строками квадрата \\(N\\times N\\) так, чтобы все клетки главной диагонали имели один цвет. Найдите наименьшее \\(M\\), при котором среди любых \\(M\\) различных флагов найдётся разнообразное множество.",
        "source_id": "src-imo-2010-shortlist",
        "status": "needs_human_review",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [],
