  "solutions": [
    {
      "id": "sol-graph-review",
      "title": "Сжатое графовое решение",
      "text": "Пусть \\(v\\) — вершина максимальной степени в графе \\(G\\). Тогда\n\\[\n\\deg(v)\\ge \\frac{2q}{n},\n\\]\nпотому что максимальная степень не меньше средней степени. Рассмотрим все рёбра, инцидентные \\(v\\), и выпишем их в порядке возрастания меток:\n\\[\ne_1<e_2<\\dots<e_{\\deg(v)}.\n\\]\nЛюбые два соседних ребра в этом списке имеют общую вершину \\(v\\), а их метки строго возрастают. Значит последовательность\n\\[\ne_1,e_2,\\dots,e_{\\deg(v)}\n\\]\nуже является требуемой возрастающей цепью рёбер. Её длина равна \\(\\deg(v)\\), следовательно, не меньше \\(2q/n\\).",
