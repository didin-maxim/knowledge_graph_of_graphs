  "solutions": [
    {
      "id": "sol-graph-review",
      "title": "Сжатое графовое решение",
      "text": "Рассматриваем каждое ребро исходного графа как вершину линейного графа L(G); две такие вершины смежны, если соответствующие рёбра имеют общий конец. Направим каждое ребро L(G) от меньшей метки к большей. Требуется длинный ориентированный путь. Стандартное доказательство берёт для каждого ребра наибольшую длину возрастающей цепи, заканчивающейся в нём, и суммирует эти величины по инцидентным рёбрам у каждой вершины исходного графа. Из выпуклости/средней степени получается, что максимальная длина не меньше средней степени исходного графа, то есть 2q/n.",
