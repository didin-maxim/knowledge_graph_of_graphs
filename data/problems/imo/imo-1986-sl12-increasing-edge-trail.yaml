    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Пусть \\(G\\) — граф с \\(n\\) вершинами и \\(q\\) рёбрами, причём его рёбра помечены числами \\(1,2,\\ldots,q\\). Докажите, что в \\(G\\) существует последовательность не менее чем из \\(2q/n\\) различных рёбер, в которой метки строго возрастают и любые два соседних ребра последовательности имеют общую вершину.",
