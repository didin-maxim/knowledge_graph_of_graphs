        "id": "stmt-original",
        "text": "В графе n вершин и q рёбер; рёбра помечены числами 1,2,...,q. Докажите, что найдётся последовательность по крайней мере 2q/n рёбер, в которой метки возрастают, а соседние рёбра имеют общую вершину.",
