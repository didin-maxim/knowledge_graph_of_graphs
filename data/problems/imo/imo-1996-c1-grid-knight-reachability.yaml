        "path"
      ]
    },
    {
      "id": "sol-aops-band-invariant",
      "title": "AoPS: инвариант Tomas Diaz для случая r=97",
      "text": "Расположим центры клеток в целочисленных точках так, чтобы старт был в \\((1,1)\\), а цель в \\((20,1)\\). Для \\(r=97\\) допустимые ходы имеют вид \\((\\pm 9,\\pm 4)\\) или \\((\\pm 4,\\pm 9)\\). Рассмотрим множество клеток \\(S\\), для которых выполняется \\(x\\equiv \\lceil y/4\\rceil \\pmod 2\\). Стартовая клетка принадлежит \\(S\\). Если ход равен \\((\\pm9,\\pm4)\\), то паритет \\(x\\) меняется и одновременно номер полосы высоты 4, задаваемый \\(\\lceil y/4\\rceil\\), тоже меняется на 1, так что условие принадлежности \\(S\\) сохраняется. Если ход равен \\((\\pm4,\\pm9)\\), то на допустимых по высоте позициях паритет \\(x\\) не меняется, а \\(\\lceil y/4\\rceil\\) тоже сохраняет нужный паритет; недопустимые случаи просто выводят за пределы доски и не рассматриваются. Значит любой допустимый путь из стартовой клетки целиком лежит в \\(S\\). Но клетка \\((20,1)\\) не принадлежит \\(S\\), поскольку \\(20\\equiv0\\pmod2\\), а \\(\\lceil1/4\\rceil=1\\). Следовательно, при \\(r=97\\) дойти до цели невозможно.",
