  "solutions": [
    {
      "id": "sol-secondary-sketch",
      "title": "Сжатый графовый разбор",
      "text": "Будем считать центры клеток точками целочисленной решётки; тогда стартовая клетка имеет координаты \\((1,1)\\), а целевая — \\((20,1)\\). Каждый допустимый ход задаётся вектором \\((a,b)\\) с \\(a^2+b^2=r\\). Если \\(2\\mid r\\), то \\(a\\) и \\(b\\) одной чётности, поэтому величина \\(x+y\\pmod 2\\) не меняется. Но для стартовой клетки она равна 0, а для целевой равна 1, так что переход невозможен. Если \\(3\\mid r\\), то из квадратов по модулю 3 следует \\(a^2+b^2\\equiv0\\pmod3\\) только при \\(a\\equiv b\\equiv0\\pmod3\\). Значит каждый ход сохраняет обе координаты по модулю 3, а клетки \\((1,1)\\) и \\((20,1)\\) имеют разные первые координаты по модулю 3; снова переход невозможен. Для \\(r=73=8^2+3^2\\) допустимы ходы типа \\((\\pm8,\\pm3)\\) и \\((\\pm3,\\pm8)\\); явный путь от \\((1,1)\\) к \\((20,1)\\) таков: \\((1,1)\\to(4,9)\\to(7,1)\\to(10,9)\\to(2,6)\\to(10,3)\\to(13,11)\\to(16,3)\\to(19,11)\\to(11,8)\\to(19,5)\\to(11,2)\\to(14,10)\\to(17,2)\\to(20,10)\\to(12,7)\\to(4,4)\\to(7,12)\\to(10,4)\\to(13,12)\\to(16,4)\\to(8,1)\\to(11,9)\\to(14,1)\\to(17,9)\\to(20,1)\\). Для \\(r=97=9^2+4^2\\) рассмотрим множество клеток \\(S\\), для которых \\(x\\equiv\\lceil y/4\\rceil\\pmod2\\). Стартовая клетка принадлежит \\(S\\), а целевая нет. Ходы вида \\((\\pm9,\\pm4)\\) одновременно меняют паритет \\(x\\) и номер полосы высоты 4, а ходы \\((\\pm4,\\pm9)\\) на допустимых позициях не меняют нужный класс. Значит любой допустимый путь остаётся внутри \\(S\\), и переход к \\((20,1)\\) невозможен.",
      "idea_ids": [
        "idea-residue-obstruction",
        "idea-explicit-path"
      ],
      "standard_idea_ids": [],
      "status": "ai_checked",
      "definition_ids": [
