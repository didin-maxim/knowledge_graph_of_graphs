    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Построим граф, вершины которого — клетки доски, а ребро соединяет две клетки, если расстояние между их центрами равно \\(\\sqrt r\\). Задача спрашивает, лежат ли две угловые клетки в одной компоненте этого графа.",
