  "statements": {
    "original": [
      {
        "id": "stmt-original",
        "text": "Дан прямоугольник \\(20\\times12\\), разбитый на единичные клетки. Разрешено переходить из одной клетки в другую, если расстояние между центрами этих клеток равно \\(\\sqrt r\\). Нужно попасть из клетки у вершины \\(A\\) в клетку у вершины \\(B\\). Докажите, что это невозможно, если \\(r\\) делится на 2 или 3; докажите, что возможно при \\(r=73\\); решите вопрос для \\(r=97\\).",
        "source_id": "src-secondary-imo-1996-shortlist",
        "status": "needs_human_review",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [],
        "title": "Условие",
        "distinct_from": [
