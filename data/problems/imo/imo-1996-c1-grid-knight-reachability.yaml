  "solutions": [
    {
      "id": "sol-secondary-sketch",
      "title": "Сжатый графовый разбор",
      "text": "Центры клеток можно считать целочисленными точками. Допустимый ход имеет вектор \\((a,b)\\) с \\(a^2+b^2=r\\), если обе конечные клетки остаются внутри прямоугольника. Если \\(r\\) делится на 2, то \\(a,b\\) одной чётности, и сохраняется чётность суммы координат; если \\(r\\) делится на 3, то квадратичные остатки показывают, что оба смещения делятся на 3 или сохраняется соответствующая модульная раскраска. В обоих случаях угловые клетки оказываются в разных классах. Для \\(r=73=8^2+3^2\\) строится явная цепочка ходов типа \\((\\pm8,\\pm3)\\), \\((\\pm3,\\pm8)\\), соединяющая нужные углы внутри доски. Для \\(r=97=9^2+4^2\\) аналогичная проверка компонент графа ходов показывает ответ через достижимость в конечном графе.",
