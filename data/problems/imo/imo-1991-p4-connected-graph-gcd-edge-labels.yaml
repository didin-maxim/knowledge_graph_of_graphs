  "solutions": [
    {
      "id": "sol-aops-maximal-path-labeling",
      "title": "AoPS: алгоритмическая разметка по максимальным путям",
      "text": "Есть более конструктивный способ. Поддерживаем множество ещё не завершённых вершин \\(V\\) и каждый раз берём в индуцированном на \\(V\\) подграфе максимальный простой путь \\(P=(v_1,\\dots,v_n)\\). Пусть \\(u\\) — наименьшая ещё не использованная метка. Если у одного из концов пути есть необработанное продолжение, то рёбра пути метим числами \\(u,u+1,\\dots\\) так, чтобы каждая внутренняя вершина пути оказалась инцидентна двум последовательным числам. Тогда НОД этих двух меток равен 1, и такая вершина больше не требует внимания. После удаления обработанного пути повторяем процедуру. Когда в остатке уже нет рёбер между необработанными вершинами, остаются лишь изолированные относительно остатка вершины; если какая-то из них имеет полную степень хотя бы 2, достаточно назначить двум её ещё неразмеченным рёбрам соседние метки \\(u\\) и \\(u+1\\). Так постепенно каждая существенная вершина получает пару последовательных инцидентных номеров, а значит и общий НОД всех её инцидентных меток становится равным 1.",
      "idea_ids": [
        "idea-label-by-prime-obstruction",
        "idea-maximal-path-consecutive-labels"
      ],
