      "id": "idea-maximal-path-consecutive-labels",
      "title": "Максимальный путь с соседними метками",
      "text": "Если размечать рёбра длинного ещё не обработанного пути последовательными числами, то каждая внутренняя вершина этого пути автоматически получает две взаимно простые инцидентные метки.",
