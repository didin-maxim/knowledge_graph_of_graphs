  "solutions": [
    {
      "id": "sol-aops-maximal-path-labeling",
      "title": "Разметка последовательными метками вдоль максимальных маршрутов",
      "text": "Будем использовать числа \\(1,2,\\ldots,k\\) по порядку и поддерживать инвариант: после каждого законченного прохода всякая вершина, уже инцидентная хотя бы одному размеченному ребру, либо имеет степень \\(<2\\), либо среди её уже размеченных инцидентных рёбер есть пара взаимно простых меток. Первый проход начинаем из произвольной вершины \\(A\\): идём по ещё неразмеченным рёбрам, каждый раз выбирая любое неразмеченное ребро из текущей вершины, и метим пройденные рёбра числами \\(1,2,\\ldots\\), пока в текущей вершине не останется неразмеченных инцидентных рёбер. Вершина \\(A\\) хороша, потому что инцидентна ребру с меткой 1. Каждая вершина, через которую маршрут вошёл и сразу вышел, получила две последовательные метки. Если конечная вершина \\(B\\) имеет степень хотя бы 2, то либо она уже встречалась раньше на этом маршруте и тогда при одном из прежних проходов через неё получила две последовательные метки, либо \\(B=A\\) и ей инцидентна метка 1; иначе, если \\(B\\) встретилась впервые только последней, все её рёбра уже размечены, но из текущего маршрута ей инцидентно только последнее ребро, значит её степень равна 1. Поэтому инвариант верен после первого прохода. Далее, если ещё есть неразмеченные рёбра, связность графа даёт неразмеченное ребро, инцидентное уже размеченной области: иначе компонент неразмеченных рёбер был бы отделён от размеченных. Начинаем новый проход из такой уже хорошей вершины \\(C\\), снова идём по неразмеченным рёбрам до тупика и продолжаем нумерацию последовательными числами. Стартовая вершина \\(C\\) остаётся хорошей по инварианту; все новые внутренние вершины получают две последовательные метки. Конечная вершина либо уже была хорошей до прохода, либо, если она новая и имеет степень хотя бы 2, обязана была встретиться раньше в этом же проходе и при входе-выходе получила две последовательные метки; если она новая и встретилась только последней, то из-за отсутствия неразмеченных рёбер в конце её степень равна 1. Значит инвариант сохраняется. Каждый проход размечает хотя бы одно новое ребро, поэтому процесс закончится; к этому моменту все рёбра размечены, и у каждой вершины степени хотя бы 2 есть инцидентная пара меток с НОД 1. Следовательно, НОД всех меток, инцидентных этой вершине, также равен 1.",
