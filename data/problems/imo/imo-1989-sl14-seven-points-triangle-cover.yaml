  "solutions": [
    {
      "id": "sol-graph-review",
      "title": "Сжатое графовое решение",
      "text": "Пусть проведённые отрезки — рёбра графа \\(G\\) на 7 вершинах. Условие означает, что в \\(G\\) нет независимой тройки. В дополнении \\(H\\) это значит, что \\(H\\) не содержит треугольников. По теореме Мантеля \\(e(H)\\le\\lfloor 7^2/4\\rfloor=12\\), поэтому \\(e(G)\\ge21-12=9\\). Достижимость: взять \\(H=K_{3,4}\\); тогда дополнение состоит из двух клик \\(K_3\\) и \\(K_4\\) и имеет \\(3+6=9\\) рёбер. В любой тройке вершин дополнения \\(K_{3,4}\\) не может быть треугольника, значит в исходном графе каждая тройка содержит ребро.",
