      "text": "В однокруговом турнире без ничьих участвовали \\(n\\) команд: каждые две команды сыграли один матч, и в каждом матче одна из команд победила. После объявления всех результатов две лиги по очереди выбирают ещё не выбранную команду и принимают её к себе. Первой ходит Первая лига, пропускать ход нельзя. Межлиговыми называются матчи, участники которых попали в разные лиги. а) Пусть \\(n\\) чётно. Докажите, что Первая лига может гарантировать: её команды выиграли не менее половины межлиговых матчей. б) Для каких чётных \\(n\\) Первая лига при любых результатах турнира может гарантировать, что её команды выиграли строго больше половины межлиговых матчей?",
