    "id": "sol-official-balances-and-pairs", "title": "Баланс команды, жадная стратегия и правильный турнир",
    "text": "Для команды \\(v\\) обозначим через \\(s(v)\\) число её побед минус число поражений во всём турнире. Сумма всех балансов равна нулю, потому что каждый матч даёт победителю \\(+1\\), а проигравшему \\(-1\\).\n\nа) Пусть после распределения множества команд Первой и Второй лиг равны \\(A\\) и \\(B\\). В сумме \\(\\sum_{v\\in A}s(v)\\) вклады матчей между двумя командами из \\(A\\) взаимно уничтожаются. Остаются только межлиговые матчи, поэтому\n\\[\n\\sum_{v\\in A}s(v)=\\#\\{\\text{межлиговые победы Первой лиги}\\}-\\#\\{\\text{межлиговые победы Второй лиги}\\}.\\tag{1}\n\\]\nСтратегия Первой лиги: на каждом ходу выбирать среди оставшихся команд команду с наибольшим балансом. Объединим каждый её ход со следующим ходом Второй лиги. Если выбраны \\(a_i\\) и \\(b_i\\), то \\(s(a_i)\\ge s(b_i)\\), поскольку \\(b_i\\) ещё была доступна при выборе \\(a_i\\). Так как \\(n\\) чётно, все ходы разбиваются на такие пары. Суммируя, получаем \\(\\sum_{a\\in A}s(a)\\ge\\sum_{b\\in B}s(b)\\). Общая сумма равна нулю, следовательно, \\(\\sum_{a\\in A}s(a)\\ge0\\). По (1) Первая лига выиграла не меньше половины межлиговых матчей.\n\nб) Ответ: ровно \\(n\\equiv2\\pmod4\\). Пусть \\(n=2m\\). Каждая лига получает по \\(m\\) команд, поэтому межлиговых матчей ровно \\(m^2\\). Если \\(m\\) нечётно, это число нечётно, и ровно половина невозможна. Стратегия пункта а), гарантирующая не меньше половины, тем самым гарантирует строго больше. Это случай \\(n\\equiv2\\pmod4\\).\n\nПусть теперь \\(m\\) чётно, то есть \\(n\\equiv0\\pmod4\\). Построим результаты, при которых строгого большинства гарантировать нельзя. Возьмём правильный турнир на \\(2m+1\\) командах: занумеруем их по кругу, и пусть команда \\(i\\) побеждает следующие \\(m\\) команд. Каждая команда имеет \\(m\\) побед и \\(m\\) поражений. Удалим одну команду. Среди оставшихся \\(2m\\) команд ровно \\(m\\) команд, которые проиграли удалённой, потеряли одно поражение и имеют баланс \\(+1\\); остальные \\(m\\), которые её победили, потеряли одну победу и имеют баланс \\(-1\\).\n\nТак как \\(m\\) чётно, заранее разобьём команды баланса \\(+1\\) на пары и отдельно команды баланса \\(-1\\) на пары. Вторая лига отвечает на каждый ход Первой выбором партнёра только что выбранной команды. Из каждой пары одна команда попадает в каждую лигу. Поэтому обе лиги получают по \\(m/2\\) команд каждого баланса, и сумма балансов каждой лиги равна нулю. По (1) числа межлиговых побед лиг равны. Значит, при \\(n\\equiv0\\pmod4\\) Первая лига не может гарантировать строгое большинство.",
