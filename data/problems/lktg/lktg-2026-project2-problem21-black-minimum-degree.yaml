  "ideas": [{"id": "idea-star-exponential-weight", "title": "Экспоненциальные веса звёзд вершин", "text": "Звезде вершины присваивается вес \\(s^{d_W(v)-c d_B(v)}\\). При \\(c>q/p\\) можно выбрать \\(s>1\\) так, что жадный чёрный ход компенсирует рост потенциала от \\(q\\) белых рёбер.", "tags": ["potential_function", "degree_counting"], "status": "ai_checked"}],
  "solutions": [{
    "id": "sol-official-star-weight-potential", "title": "Весовая лемма для звёзд вершин",
    "text": "Докажем общий пункт б); пункт а) получится при \\(p=q=1\\). Выберем число \\(c>q/p\\), а затем \\(s>1\\) настолько близким к \\(1\\), чтобы\n\\[\ns^q-1\\le p(1-s^{-c}).\\tag{1}\n\\]\nТакое \\(s\\) существует: после деления на \\(s-1\\) левая и правая части при \\(s\\downarrow1\\) стремятся соответственно к \\(q\\) и \\(pc>q\\).\n\nДля каждой вершины \\(v\\) рассмотрим цель, состоящую из всех \\(n-1\\) инцидентных ей рёбер. Если к настоящему моменту среди этих рёбер \\(w_v\\) белых и \\(b_v\\) чёрных, дадим цели вес\n\\[\ns^{w_v-cb_v}.\n\\]\nПотенциал — сумма весов всех \\(n\\) целей. Опасностью свободного ребра \\(e\\) назовём\n\\[\nD(e)=(1-s^{-c})\\sum_{v:\\,e\\text{ входит в звезду }v}s^{w_v-cb_v}.\n\\]\nОкраска \\(e\\) в чёрный цвет умножает веса содержащих его целей на \\(s^{-c}\\), поэтому уменьшает потенциал ровно на \\(D(e)\\). Чингиз последовательно выбирает \\(p\\) рёбер наибольшей текущей опасности. Чёрные рёбра могут только уменьшать опасности. Если после его хода наибольшая опасность свободного ребра равна \\(D\\), то каждое выбранное ребро в момент выбора имело опасность не меньше \\(D\\), и потенциал уменьшился не менее чем на \\(pD\\).\n\nБелое ребро умножает соответствующие веса на \\(s\\). Перед последовательными выборами Беллы опасность любого свободного ребра не превосходит \\(D,sD,\\ldots,s^{q-1}D\\). Поэтому прирост потенциала не больше\n\\[\n\\frac{s-1}{1-s^{-c}}D(1+s+\\cdots+s^{q-1})=\\frac{s^q-1}{1-s^{-c}}D\\le pD\n\\]\nпо (1). Таким образом, за полный раунд потенциал не растёт. Если последний ход Чингиза неполон, он красит все оставшиеся рёбра и Белла уже не ходит; неполный ход Беллы лишь уменьшает прирост.\n\nНачальный потенциал равен \\(n\\). Поэтому в конце вес каждой отдельной звезды не превосходит \\(n\\):\n\\[\ns^{d_W(v)-c d_B(v)}\\le n.\n\\]\nВсе рёбра уже окрашены, так что \\(d_W(v)+d_B(v)=n-1\\). Следовательно,\n\\[\nd_B(v)\\ge\\frac{n-1-\\log_s n}{c+1}.\\tag{2}\n\\]\nТеперь выберем \\(c>q/p\\) настолько близко к \\(q/p\\), чтобы\n\\[\n\\frac1{c+1}>\\frac{p}{p+q}-\\frac{\\varepsilon}{2}.\n\\]\nПосле этого зафиксируем соответствующее \\(s\\) и возьмём \\(n\\) настолько большим, чтобы \\(\\log_s n/((c+1)(n-1))<\\varepsilon/2\\). Из (2) для каждой вершины получаем требуемое\n\\[\nd_B(v)\\ge\\left(\\frac{p}{p+q}-\\varepsilon\\right)(n-1).\n\\]\nПри \\(p=q=1\\) это даёт пункт а).",
