      "id": "stmt-original", "title": "Чёрная степень каждой вершины",
      "text": "Пусть \\(p,q\\ge1\\) — целые числа. Игра идёт по раундам на рёбрах \\(K_n\\): сначала Чингиз красит \\(p\\) свободных рёбер чёрным, затем Белла красит \\(q\\) свободных рёбер белым; при нехватке свободных рёбер игрок красит все оставшиеся. Через \\(B\\) обозначим итоговый граф чёрных рёбер, а через \\(\\delta(B)\\) — его минимальную степень. а) Докажите, что для каждого \\(\\varepsilon>0\\) при всех достаточно больших \\(n\\) Чингиз в игре \\(1:1\\) может гарантировать \\[\\delta(B)\\ge\\left(\\frac12-\\varepsilon\\right)(n-1).\\] б) Докажите, что для любых фиксированных \\(p,q\\ge1\\) и \\(\\varepsilon>0\\) при всех достаточно больших \\(n\\) Чингиз может гарантировать \\[\\delta(B)\\ge\\left(\\frac{p}{p+q}-\\varepsilon\\right)(n-1).\\]",
      "source_id": "src-lktg-2026-project2-problems-ru", "status": "source_verified",
