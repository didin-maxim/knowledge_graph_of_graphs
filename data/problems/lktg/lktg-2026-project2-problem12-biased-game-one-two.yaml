  "solutions": [
    {
      "id": "sol-official-complement-and-k4",
      "title": "Дополнение белого графа и стратегия на \\(K_4\\)",
      "text": "а) После окончания игры каждое ребро \\(K_n\\), не принадлежащее белому графу \\(W\\), окрашено чёрным. Множество вершин образует чёрную клику тогда и только тогда, когда никакие две его вершины не соединены белым ребром, то есть когда это множество независимо в \\(W\\). Поэтому \\(\\omega(\\text{чёрного графа})=\\alpha(W)\\).\n\nб) Пусть первое белое ребро равно \\(uv\\), а две остальные вершины обозначены \\(x,y\\). Чингиз сразу красит чёрным \\(xy\\) и любое другое свободное ребро. Теперь любое последующее белое ребро имеет общий конец с \\(uv\\), потому что единственное ребро, не имеющее с \\(uv\\) общего конца, уже чёрное.\n\nВсего в \\(K_4\\) шесть рёбер, а за полный раунд окрашиваются три, поэтому Белла делает ровно два хода. Её итоговый граф состоит из двух смежных рёбер и одной изолированной вершины. Следовательно, \\(\\omega(W)=2\\). В нём есть независимое множество из трёх вершин: из двух концов пути выбираем его концы и добавляем изолированную вершину, поэтому \\(\\alpha(W)=3\\). По пункту а) чёрная клика имеет размер 3, что строго больше 2; Чингиз выигрывает.",
