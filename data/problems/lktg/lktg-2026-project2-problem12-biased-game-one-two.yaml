        "id": "stmt-original",
        "title": "Смещённая игра Беллы и Чингиза",
        "text": "Пусть \\(n\\ge3\\). Белла и Чингиз играют на рёбрах полного графа \\(K_n\\); начинает Белла. В каждом раунде Белла красит одно свободное ребро белым, после чего Чингиз красит два свободных ребра чёрным, а если их осталось меньше двух — все оставшиеся. После окраски всех рёбер Чингиз выигрывает, если наибольшая чёрная клика строго больше наибольшей белой; иначе выигрывает Белла.\n\nа) Если \\(W\\) — граф белых рёбер, объясните равенство \\(\\omega(\\text{чёрного графа})=\\alpha(W)\\).\n\nб) При \\(n=4\\) постройте явную выигрышную стратегию Чингиза.",
