    {
      "id": "sol-official-parts-a-c",
      "title": "Официальные стратегии для закрытых подпунктов а–в",
      "text": "Во всех частях через \\(\\bar v\\) будем обозначать вершину, поставленную Чингизом в пару с \\(v\\).\n\nа) Чётное \\(n\\), \\(k=4\\). Сначала все вершины считаются свободными. Чингиз постепенно создаёт непересекающиеся пары \\(\\{x,\\bar x\\}\\) с чёрным ребром \\(x\\bar x\\). Четыре ребра между двумя парами назовём блоком. Некоторые блоки отмечаются; отмеченные блоки образуют граф \\(F\\) на множестве пар.\n\nНа белое ребро \\(xy\\) Чингиз отвечает так.\n\n1. Если \\(x,y\\) свободны, он выбирает ещё две свободные вершины \\(\\bar x,\\bar y\\), красит чёрным \\(x\\bar x,y\\bar y,\\bar x\\bar y\\), создаёт пары \\(X=\\{x,\\bar x\\}\\), \\(Y=\\{y,\\bar y\\}\\) и отмечает блок \\(XY\\).\n\n2. Если \\(x\\) уже входит в пару \\(X\\), а \\(y\\) свободна, он выбирает свободную \\(\\bar y\\), красит \\(y\\bar y,x\\bar y,\\bar x\\bar y\\), создаёт пару \\(Y\\), отмечает блок и ориентирует ребро \\(X\\to Y\\).\n\n3. Если обе вершины уже имеют пары, он красит все ещё свободные рёбра их блока. В неотмеченном блоке таких рёбер не больше трёх, в отмеченном — не больше двух.\n\nВ первых двух правилах занято не больше трёх чёрных рёбер. Если после создания пар остаются ровно две свободные вершины, четвёртым ребром Чингиз красит ребро между ними и объявляет их парой. Поэтому перед каждым ходом Беллы свободных вершин либо нет, либо хотя бы четыре; первое правило всегда выполнимо. Неиспользованные чёрные ходы делаются произвольно.\n\nГраф \\(F\\) — лес: первое правило добавляет ребро между двумя новыми вершинами, второе подвешивает новую вершину к старой, а пара, созданная дополнительным четвёртым ходом, изолирована. После партии доориентируем \\(F\\). В блоке первого правила первое белое ребро равно \\(xy\\), а \\(\\bar x\\bar y\\) чёрное; из двух остальных рёбер белым может стать не больше одного, потому что после такого хода правило 3 закрасит другое. Если \\(x\\bar y\\) чёрное, ориентируем \\(X\\to Y\\), иначе \\(Y\\to X\\). Тогда для каждого ориентированного отмеченного блока выполнено\n\\[\nX\\to Y,\\quad p\\in X,\\ q\\in Y,\\ pq\\text{ белое}\\quad\\Longrightarrow\\quad p\\bar q\\text{ чёрное}. \\tag{1}\n\\]\nДля блока второго правила это верно сразу, поскольку оба нужных ребра были окрашены чёрным.\n\nЕсли к концу остались свободные вершины, белых рёбер с их концами нет: иначе они уже получили бы пары. Следовательно, все инцидентные им рёбра чёрные; разобьём их на пары и добавим как изолированные вершины \\(F\\).\n\nПусть \\(C\\) — наибольшая белая клика, \\(|C|=s\\ge2\\). Она содержит не больше одной вершины каждой пары. Множество \\(\\bar C\\) противоположных вершин является чёрной кликой. В неотмеченном блоке после первого белого ребра все остальные стали чёрными. В отмеченном блоке Чингиз сразу красит ребро, противоположное первому белому, а правило 3 красит ребро, противоположное возможному второму белому.\n\nРассмотрим ориентированный подлес \\(F\\) на парах, представленных в \\(C\\), и выберем его источник \\(X\\). Пусть \\(c\\in C\\cap X\\). Для любого \\(q\\in C\\) ребро \\(c\\bar q\\) чёрное: для соседних пар это следует из (1) и выбора источника, для несоседних блок не отмечен и после белого \\(cq\\) все другие его рёбра чёрные. Также \\(c\\bar c\\) чёрное. Поэтому \\(\\bar C\\cup\\{c\\}\\) — чёрная клика размера \\(s+1\\), и Чингиз выигрывает.\n\nб) Чётное \\(n\\), \\(k=3\\). Пусть \\(n=2m\\). Чингиз снова создаёт противоположные пары, делая внутреннее ребро каждой пары чёрным. Блок назовём ранним, если первое белое ребро в нём появилось до создания обеих пар. Пока есть хотя бы четыре безымянные вершины, ответы таковы.\n\n1. На белое \\(uv\\) между двумя безымянными вершинами выбираются \\(\\bar u,\\bar v\\), а чёрными становятся \\(u\\bar u,\\bar u\\bar v,v\\bar v\\).\n\n2. Если \\(u\\) уже имеет пару, а \\(v\\) безымянна, выбирается \\(\\bar v\\), а чёрными становятся \\(\\bar u\\bar v,v\\bar v\\).\n\n3. Если обе пары созданы, после белого \\(uv\\) Чингиз красит все свободные среди трёх остальных рёбер блока \\(u\\bar v,\\bar uv,\\bar u\\bar v\\). Если их меньше трёх, квота дополняется произвольными свободными рёбрами.\n\nЕсли после раунда остаются ровно две безымянные вершины \\(x,y\\), далее на белое \\(xv\\) Чингиз красит свободные из \\(x\\bar v,yv,y\\bar v\\), а на белое \\(yv\\) — свободные из \\(xv,x\\bar v,y\\bar v\\). На \\(xy\\) специального ответа не нужно; между уже спаренными вершинами действует правило 3.\n\nРанние блоки образуют лес: ход между двумя безымянными вершинами создаёт отдельное ребро между двумя новыми парами, а ход между именованной и безымянной подвешивает новую пару к старой. В нераннем блоке белым бывает не больше одного ребра. В раннем первое белое ребро имеет чёрное противоположное, а после следующего белого хода правило 3 красит всё оставшееся; поэтому белых рёбер там не больше двух, и при двух они имеют общий конец.\n\nПусть белая клика \\(C\\) состоит из \\(s\\) спаренных вершин. Она берёт не больше одной вершины каждой пары, а \\(\\bar C\\) — чёрная клика, поскольку противоположное каждому белому ребру чёрное. Белое ребро между \\(C\\) и \\(\\bar C\\) возможно только в раннем блоке, соответствующем двум парам из \\(C\\), и в каждом таком блоке оно не более одно. Лес на этих \\(s\\) парах имеет не больше \\(s-1\\) рёбер, значит между \\(C\\) и \\(\\bar C\\) не больше \\(s-1\\) белых рёбер. Поэтому найдётся \\(v\\in C\\), не имеющая белых соседей в \\(\\bar C\\), и \\(\\bar C\\cup\\{v\\}\\) — чёрная клика размера \\(s+1\\).\n\nЕсли наибольшая белая клика содержит \\(x\\), но не \\(y\\), запишем её как \\(C\\cup\\{x\\}\\). По специальному правилу \\(y\\) чёрно соединена со всей \\(\\bar C\\) и с найденной вершиной \\(v\\), поэтому \\(\\bar C\\cup\\{v,y\\}\\) на одну вершину больше белой клики. Случай с \\(y\\) симметричен. Ребро \\(xy\\) не входит в белый треугольник: для каждой третьей вершины специальный ответ делает одну из двух связей чёрной. Если наибольшая белая клика состоит из \\(x,y\\), то до появления остаточной пары в спаренной части уже было белое ребро, и предыдущий лесной аргумент для \\(s=2\\) даёт чёрный треугольник. Значит, Чингиз всегда имеет строго большую клику.\n\nв) Нечётное \\(n\\), \\(k=3\\). Сначала Чингиз действует как в пункте б), создавая пары. Этот этап прекращается либо когда остаются три безымянные вершины и Белла впервые затрагивает одну из них, либо когда остаются пять безымянных вершин и Белла берёт ребро между двумя из них. Спаренную часть обозначим через \\(L\\).\n\nСлучай 1. Остались \\(a,b,c\\), а первый новый белый ход равен \\(av_0\\), где \\(v_0\\in L\\). Чингиз красит чёрным треугольник \\(abc\\). Затем на белое \\(dv\\), где \\(d\\in\\{a,b,c\\}\\), \\(v\\in L\\), он красит все свободные из \\(a\\bar v,b\\bar v,c\\bar v\\); внутри \\(L\\) действует правило 3 пункта б). Для начального ребра \\(av_0\\), если оно встретилось бы в предписанном ответе, его просто пропускают. Белая клика содержит не больше одной из \\(a,b,c\\). Если она равна \\(C\\cup\\{d\\}\\), где \\(C\\subset L\\), \\(|C|=s\\), то\n\\[\n(\\bar C\\setminus\\{v_0,\\bar v_0\\})\\cup\\{a,b,c\\}\n\\]\n— чёрная клика размера не меньше \\(s+2\\), то есть строго больше. Для клики внутри \\(L\\) работает пункт б).\n\nСлучай 2. Остались \\(a,b,c\\), а первый белый ход — \\(ab\\). Чингиз красит \\(ac,bc\\). Далее на \\(av\\) он красит свободные из \\(bv,b\\bar v,c\\bar v\\); на \\(bv\\) — из \\(av,a\\bar v,c\\bar v\\); на \\(cv\\) — из \\(a\\bar v,b\\bar v,c\\bar v\\). Внутри \\(L\\) действует прежнее правило. Если белая клика равна \\(C\\cup\\{a\\}\\), то \\(\\bar C\\cup\\{b,c\\}\\) — чёрная клика на одну вершину больше; для \\(b\\) рассуждение симметрично, а для \\(c\\) подходит \\(\\bar C\\cup\\{a,c\\}\\). Белая клика не может содержать одновременно \\(a,b\\) и вершину \\(L\\), что следует из первого специального ответа. Само ребро \\(ab\\) также не опасно. При \\(n\\ge7\\) до появления трёх остаточных вершин был обычный спаривающий ход, и лесной аргумент с \\(s=2\\) даёт чёрный треугольник внутри \\(L\\); при \\(n=5\\) возникает следующий случай.\n\nСлучай 3. Остались пять вершин. Концы первого белого ребра назовём \\(x,y\\), остальные — \\(a,b,c\\). Чингиз красит чёрным треугольник \\(abc\\). Далее: на белое ребро из \\(a,b,c\\) к \\(v\\in L\\) он красит свободные \\(a\\bar v,b\\bar v,c\\bar v\\); на \\(xv\\) или \\(yv\\) — три остальных ребра между \\(\\{x,y\\}\\) и \\(\\{v,\\bar v\\}\\). Если, например, Белла красит \\(ax\\), Чингиз красит свободные из \\(ay,by,cy\\); если позднее Белла берёт \\(bx\\) или \\(cx\\), он красит оставшееся из этих двух рёбер. Остальные варианты получаются переименованием; внутри \\(L\\) действует старое правило.\n\nБелая клика с не более чем одной особой вершиной разбирается как в пункте б), причём чёрный треугольник даёт запас для \\(a,b,c\\). Ребро \\(xy\\) не входит в белый треугольник. Если белая клика содержит две особые вершины, то после переименования она имеет вид \\(C\\cup\\{a,x\\}\\), и \\(\\bar C\\cup\\{b,c,y\\}\\) является чёрной кликой на одну вершину больше.\n\nПроверим легальность специальных ответов. Правило 3 берёт только свободные рёбра, а в раннем блоке после второго белого хода всё остальное уже чёрное. Если требуемое ребро от особой вершины к \\(\\bar v\\) раньше стало белым, ответ на тот прежний ход уже сделал нынешнее ребро к \\(v\\) чёрным. Аналогично, если одно из \\(ay,by,cy\\) стало белым раньше, симметричный ответ уже сделал \\(ax\\) чёрным, так что ход \\(ax\\) не мог бы возникнуть. Следовательно, белое ребро перекрашивать не требуется; уже чёрные предписанные рёбра не входят в квоту, а недостающие ходы добираются произвольно. Все случаи исчерпаны, и при каждом нечётном \\(n>3\\) Чингиз выигрывает.\n\nПодпункт г) с \\(k=2\\) открыт и в официальный раздел решений не входит.",
