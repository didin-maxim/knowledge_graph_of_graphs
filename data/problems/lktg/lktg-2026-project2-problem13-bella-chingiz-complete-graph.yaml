      "title": "ИИ-дополнение: монотонность по числу чёрных рёбер за ход",
      "text": "Докажем общую лемму. Пусть при квоте \\(k_0\\) у Чингиза есть выигрышная стратегия, а условие его победы сохраняется при добавлении чёрных и удалении белых рёбер. Тогда та же сторона выигрывает при любой квоте \\(k\\ge k_0\\).\n\nЧингиз ведёт воображаемую партию с квотой \\(k_0\\). До окончания реальной партии он поддерживает два инварианта: каждое воображаемое чёрное ребро чёрно и в реальности, а множества белых рёбер в двух партиях совпадают. Поэтому каждый реальный белый ход можно повторить в воображаемой партии: выбранное ребро не является там ни чёрным, ни белым. Затем воображаемая стратегия называет не более \\(k_0\\) свободных рёбер. Чингиз объявляет их чёрными в воображаемой партии и красит в реальной те из них, которые там ещё свободны. Ребро, уже чёрное в реальной партии, было одним из прежних лишних ходов Чингиза, поэтому повторно красить его не нужно. Оставшуюся часть реальной квоты до \\(k\\) он добирает произвольными свободными рёбрами; воображаемая партия пока считает эти подарочные рёбра свободными. Оба инварианта восстановлены.\n\nКогда реальная доска заполнится, продолжим только воображаемую партию до конца: Белла произвольно красит оставшиеся воображаемо свободные рёбра белым, а Чингиз отвечает своей стратегией. Все эти оставшиеся рёбра в реальности уже чёрные. Поэтому для итоговых графов имеем \\(B_{\\rm imag}\\subseteq B_{\\rm real}\\) и \\(W_{\\rm real}\\subseteq W_{\\rm imag}\\). Воображаемая стратегия даёт \\(\\omega(B_{\\rm imag})>\\omega(W_{\\rm imag})\\), откуда тем более \\(\\omega(B_{\\rm real})>\\omega(W_{\\rm real})\\). Лемма доказана.\n\nВ задаче ЮМТ \\(n=2024\\). Официальная стратегия пункта б проектной формулировки выигрывает при \\(k_0=3\\). По лемме Чингиз выигрывает при каждом \\(k\\ge3\\). Следовательно, ответ ЮМТ: все целые \\(k\\ge3\\).",
