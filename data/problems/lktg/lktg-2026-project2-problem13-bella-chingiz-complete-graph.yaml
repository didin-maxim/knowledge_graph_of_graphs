        "title": "Белла и Чингиз на полном графе",
        "text": "Пусть \\(n\\ge3\\) и \\(k\\ge1\\) — целые числа. Белла и Чингиз играют на полном графе \\(K_n\\); начинает Белла. В каждом раунде Белла красит одно свободное ребро белым. Если после этого свободные рёбра остались, Чингиз красит \\(k\\) из них чёрным, а если их меньше \\(k\\) — все оставшиеся. Игра заканчивается сразу после окраски последнего свободного ребра. Чингиз выигрывает тогда и только тогда, когда наибольшая чёрная клика строго больше наибольшей белой.\n\nа) Пусть \\(n>3\\) чётно и \\(k=4\\). Постройте явную выигрышную стратегию Чингиза.\n\nб) Пусть \\(n>3\\) чётно и \\(k=3\\). Постройте явную выигрышную стратегию Чингиза.\n\nв) Пусть \\(n>3\\) нечётно и \\(k=3\\). Постройте явную выигрышную стратегию Чингиза.\n\nг★) Докажите или опровергните: при \\(k=2\\) Чингиз имеет выигрышную стратегию для каждого чётного \\(n>3\\).\n\nПодпункт г) отмечен в официальном PDF как открытый. Официального решения для него нет, и настоящая карточка его не предлагает.",
