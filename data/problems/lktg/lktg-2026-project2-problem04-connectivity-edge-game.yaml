  "solutions": [
    {
      "id": "sol-problem04-complete",
      "title": "Полная классификация по модулю 4",
      "text": "Ответ: при \\(n\\equiv0,1\\pmod4\\) выигрывает Вася, а при \\(n\\equiv2,3\\pmod4\\) выигрывает Петя.\n\nМаксимальный граф, который ещё несвязен, состоит из двух полных компонент \\(K_a\\sqcup K_b\\), где \\(a+b=n\\). Действительно, при трёх или более компонентах можно безопасно соединить две из них, а при недостающем ребре внутри компоненты можно безопасно добавить это ребро. Число сделанных безопасных ходов в такой конечной позиции равно\n\\[\\binom a2+\\binom b2=\\binom n2-ab.\\]\nЕсли \\(n\\) нечётно, числа \\(a,b\\) имеют разную чётность, поэтому \\(ab\\) чётно и чётность числа безопасных ходов не зависит от разбиения. При \\(n\\equiv1\\pmod4\\) число \\(\\binom n2\\) чётно. Вася всегда выбирает безопасный ход: перед его ходом добавлено нечётное число рёбер, поэтому конечная позиция с чётным числом рёбер ещё не достигнута. Следовательно, связный граф первым вынужден сделать Петя и проигрывает. При \\(n\\equiv3\\pmod4\\) число \\(\\binom n2\\) нечётно; тем же рассуждением Петя всегда имеет безопасный ход, и проигрывает Вася.\n\nПусть теперь \\(n\\) чётно. В текущем несвязном графе обозначим через \\(O\\) число компонент нечётного порядка, а через \\(R\\) - суммарное число недостающих рёбер внутри компонент:\n\\[R=\\sum_C\\left(\\binom{|C|}{2}-e(C)\\right).\\]\nЧисло \\(O\\) чётно. Каждый безопасный ход имеет один из двух типов. Тип I соединяет две нечётные компоненты. Тогда \\(O\\) уменьшается на 2, а чётность \\(R\\) не меняется: при слиянии добавляется \\(|C||D|-1\\) новых недостающих внутренних рёбер, и это число чётно. Тип II - любой другой безопасный ход. Тогда \\(O\\) не меняется, а чётность \\(R\\) меняется. Для внутреннего ребра \\(R\\) уменьшается на 1; при слиянии, где хотя бы одна компонента чётна, число \\(|C||D|-1\\) нечётно.\n\nВыбранный игрок после каждого своего хода поддерживает инвариант\n\\[O\\equiv0\\pmod4,\\qquad R\\equiv0\\pmod2.\\]\nЕсли соперник сделал ход типа I, стало \\(O\\equiv2\\pmod4\\). Выбранный игрок соединяет ещё две нечётные компоненты. Такой ход безопасен: перед ходом соперника нечётных компонент было по меньшей мере четыре; после первого слияния остаётся созданная чётная компонента, поэтому второе слияние не может сделать весь граф связным. Если соперник сделал ход типа II, число \\(R\\) стало нечётным и, следовательно, положительным. Выбранный игрок добавляет любое недостающее ребро внутри одной компоненты. Оба ответа безопасны и восстанавливают инвариант.\n\nПри \\(n=4k\\) инвариант выполнен в пустом графе, и выбранным игроком является Вася: он начинает отвечать после первого хода Пети. При \\(n=4k+2\\) Петя первым ходом соединяет две изолированные вершины. Тогда \\(O\\) уменьшается с \\(4k+2\\) до \\(4k\\), а \\(R\\) остаётся чётным, поэтому после этого отвечает Петя. Выбранный игрок никогда не делает граф связным. Игра конечна, значит, связный граф первым вынужден сделать его соперник. Это даёт заявленную таблицу победителей.",
