  "solutions": [
    {
      "id": "sol-official-large-subset-density",
      "title": "Единая весовая стратегия для внутренних и двудольных срезов",
      "text": "Докажем пункт б); пункт а) является случаем \\(p=q=1\\). Сначала сформулируем и докажем используемую весовую лемму. Выберем \\(c>q/p\\), а затем \\(s>1\\) настолько близким к \\(1\\), чтобы\n\\[\ns^q-1\\le p(1-s^{-c}).\\tag{1}\n\\]\nЭто возможно, поскольку после деления на \\(s-1\\) обе части при \\(s\\downarrow1\\) стремятся к \\(q\\) и \\(pc>q\\).\n\nПусть каждой цели \\(A\\), состоящей из некоторого набора рёбер, дан коэффициент \\(a_A>0\\). Если в ней уже \\(w_A\\) белых и \\(b_A\\) чёрных рёбер, дадим ей вес \\(a_As^{w_A-cb_A}\\). Опасность свободного ребра определим как\n\\[\nD(e)=(1-s^{-c})\\sum_{A\\ni e}a_As^{w_A-cb_A}.\n\\]\nЧёрная окраска \\(e\\) уменьшает потенциал ровно на \\(D(e)\\). Чингиз последовательно выбирает \\(p\\) рёбер наибольшей текущей опасности. Если после его хода максимальная опасность равна \\(D\\), потеря потенциала не меньше \\(pD\\), поскольку чёрные рёбра только уменьшают опасности. За \\(q\\) белых рёбер прирост не превосходит\n\\[\n\\frac{s-1}{1-s^{-c}}D(1+s+\\cdots+s^{q-1})=\\frac{s^q-1}{1-s^{-c}}D\\le pD.\n\\]\nЗначит, потенциал не растёт. Неполный последний раунд обрабатывается так же: неполный чёрный ход забирает все свободные рёбра, а неполный белый ход даёт меньший прирост.\n\nТеперь выберем \\(c\\) настолько близко к \\(q/p\\), чтобы\n\\[\n\\frac1{c+1}>\\frac{p}{p+q}-\\frac{\\varepsilon}{2}.\n\\]\nЗафиксируем соответствующее \\(s\\). Возьмём постоянную \\(C\\) настолько большой, чтобы\n\\[\n\\frac{8}{(c+1)C\\log s}<\\frac{\\varepsilon}{2},\n\\]\nи положим \\(m=\\lceil C\\log n\\rceil\\).\n\nДля каждого множества \\(U\\) из \\(u\\ge m\\) вершин целью служат все рёбра внутри \\(U\\), а коэффициент равен \\(a_U=n^{-2u}\\). Начальный потенциал меньше единицы:\n\\[\n\\sum_{u=m}^n {n\\choose u}n^{-2u}\\le\\sum_{u=m}^{\\infty}n^{-u}<1.\n\\]\nПо доказанной лемме итоговый вес каждой отдельной цели меньше \\(1\\). Обозначив \\(M={u\\choose2}\\), получаем\n\\[\nn^{-2u}s^{M-(c+1)e_B(U)}<1,\n\\]\nпоскольку среди \\(M\\) рёбер внутри \\(U\\) ровно \\(e_B(U)\\) чёрных, а остальные белые. После логарифмирования\n\\[\n\\frac{e_B(U)}M>\\frac1{c+1}-\\frac{2u\\log_s n}{(c+1)M}=\\frac1{c+1}-\\frac{4\\log_s n}{(c+1)(u-1)}.\\tag{2}\n\\]\nПри достаточно больших \\(n\\) из \\(u\\ge m\\) следует \\(u-1\\ge(C/2)\\log n\\), поэтому последний член в (2) не превосходит \\(8/((c+1)C\\log s)<\\varepsilon/2\\). Вместе с выбором \\(c\\) это даёт\n\\[\ne_B(U)>\\left(\\frac{p}{p+q}-\\varepsilon\\right){u\\choose2}\n\\]\nодновременно для всех \\(U\\) размера не меньше \\(m\\). Тем самым доказан пункт б), а при \\(p=q=1\\) — пункт а).\n\nВариант для двух непересекающихся множеств. Для каждой упорядоченной пары непересекающихся множеств \\((X,Y)\\), где \\(|X|=x\\ge m\\) и \\(|Y|=y\\ge m\\), целью служат все \\(xy\\) рёбер между ними, а коэффициент равен \\(a_{X,Y}=n^{-2(x+y)}\\). Число пар данных размеров не превосходит \\(n^{x+y}\\), поэтому начальный потенциал меньше\n\\[\n\\sum_{x,y\\ge m}n^{-(x+y)}<1.\n\\]\nСледовательно, в конце вес каждой цели меньше \\(1\\):\n\\[\nn^{-2(x+y)}s^{xy-(c+1)e_B(X,Y)}<1.\n\\]\nОтсюда\n\\[\n\\frac{e_B(X,Y)}{xy}>\\frac1{c+1}-\\frac{2\\log_s n}{c+1}\\left(\\frac1x+\\frac1y\\right).\\tag{3}\n\\]\nПри \\(x,y\\ge m\\) и достаточно большом \\(n\\) последний член не превосходит \\(4/((c+1)C\\log s)<\\varepsilon/2\\). Вместе с выбором \\(c\\) формула (3) даёт\n\\[\ne_B(X,Y)>\\left(\\frac{p}{p+q}-\\varepsilon\\right)|X||Y|.\n\\]\nЭто доказывает б) одновременно для всех допустимых пар; случай \\(p=q=1\\) даёт а).",
