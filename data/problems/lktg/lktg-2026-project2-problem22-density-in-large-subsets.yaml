        "id": "stmt-original",
        "title": "Плотность внутри больших множеств",
        "text": "Пусть \\(p,q\\ge1\\) — целые числа. Игра идёт по раундам на рёбрах \\(K_n\\): сначала Чингиз красит \\(p\\) свободных рёбер чёрным, затем Белла красит \\(q\\) свободных рёбер белым; при нехватке свободных рёбер игрок красит все оставшиеся. Через \\(e_B(U)\\) обозначим число чёрных рёбер с обоими концами в \\(U\\). а) Докажите, что для каждого \\(\\varepsilon>0\\) существует постоянная \\(C=C(\\varepsilon)\\), для которой при всех достаточно больших \\(n\\) Чингиз в игре \\(1:1\\) может гарантировать \\[e_B(U)\\ge\\left(\\frac12-\\varepsilon\\right){|U|\\choose2}\\] для каждого множества \\(U\\), содержащего не менее \\(\\lceil C\\log n\\rceil\\) вершин. б) Докажите, что для любых фиксированных \\(p,q\\ge1\\) и \\(\\varepsilon>0\\) существует постоянная \\(C=C(p,q,\\varepsilon)\\), для которой при всех достаточно больших \\(n\\) Чингиз может гарантировать \\[e_B(U)\\ge\\left(\\frac{p}{p+q}-\\varepsilon\\right){|U|\\choose2}\\] для каждого множества \\(U\\), содержащего не менее \\(\\lceil C\\log n\\rceil\\) вершин.",
