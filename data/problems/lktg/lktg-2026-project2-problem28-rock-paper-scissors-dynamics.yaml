  "ideas": [
    {"id": "idea-tree-height-lift", "title": "На дереве остатки поднимаются в целые высоты", "text": "Отсутствие циклов позволяет однозначно выбрать целые представители цветов с малыми разностями на рёбрах. Для трёх состояний обновление становится распространением локального максимума.", "tags": ["trees", "modular_coloring"], "status": "ai_checked"},
    {"id": "idea-cycle-winding", "title": "Сумма поднятых разностей вдоль цикла сохраняется", "text": "Изменение вершины прибавляет единицу к одной ориентированной разности и вычитает из соседней, поэтому сумма по циклу телескопически инвариантна. Ненулевой оборот несовместим со стационарной расстановкой.", "tags": ["process_invariant", "dynamics"], "status": "ai_checked"}
  ],
  "solutions": [{
    "id": "sol-official-height-and-winding", "title": "Подъём высот на дереве и инвариант оборота на цикле",
    "text": "Обозначим три предмета через \\(A_0,A_1,A_2\\) по модулю \\(3\\) так, что \\(A_{i+1}\\) побеждает \\(A_i\\).\n\nа) Выберем корень дерева и любой целый представитель \\(h_0\\) цвета в корне. Двигаясь от корня, каждой вершине \\(v\\) сопоставим целое \\(h_0(v)\\), сравнимое с номером её предмета по модулю \\(3\\), так чтобы на каждом ребре \\(uv\\) выполнялось \\(h_0(v)-h_0(u)\\in\\{-1,0,1\\}\\). Для уже заданной высоты родителя подходящий представитель цвета ребёнка единственен. Противоречий нет, потому что в дереве нет циклов.\n\nЕсли у вершины \\(v\\) есть сосед высоты \\(h_t(v)+1\\), у него находится ровно предмет, побеждающий предмет в \\(v\\), и высота \\(v\\) увеличивается на \\(1\\). Если такого соседа нет, она не меняется. Поэтому\n\\[\nh_{t+1}(v)=\\max\\bigl(\\{h_t(v)\\}\\cup\\{h_t(u):u\\sim v\\}\\bigr).\\tag{1}\n\\]\nНовые высоты соседних вершин снова отличаются не более чем на \\(1\\): максимум в замкнутой окрестности одного конца ребра не может превосходить максимум в замкнутой окрестности другого более чем на \\(1\\). Значит, (1) действительно задаёт подъём следующей расстановки. По индукции\n\\[\nh_t(v)=\\max\\{h_0(u):d(u,v)\\le t\\}.\\tag{2}\n\\]\nПусть \\(M=\\max_u h_0(u)\\). Для каждого \\(v\\) шар достаточно большого радиуса содержит вершину высоты \\(M\\), поэтому по (2) все высоты в конечное время становятся равными \\(M\\). После этого все предметы одинаковы и изменения прекращаются.\n\nб) Ответ: \\(n-1\\). Пусть \\(Z=\\{u:h_0(u)=M\\}\\). Формула (2) показывает, что точное время стабилизации равно \\(T=\\max_v d(v,Z)\\), а в дереве на \\(n\\) вершинах оно не превосходит \\(n-1\\). Равенство достигается на пути \\(v_1v_2\\ldots v_n\\): положим \\(h_0(v_1)=\\cdots=h_0(v_{n-1})=0\\), \\(h_0(v_n)=1\\). Тогда граница между \\(A_0\\) и \\(A_1\\) сдвигается на одно ребро за минуту, и \\(v_1\\) изменится лишь на \\((n-1)\\)-й минуте.\n\nв) Поскольку связный граф не является деревом, он содержит простой цикл \\(C=v_0v_1\\ldots v_{\\ell-1}v_0\\). Для ориентированного ребра \\(v_iv_{i+1}\\) обозначим через \\(d_i(t)\\in\\{-1,0,1\\}\\) единственное число, сравнимое по модулю \\(3\\) с разностью номеров предметов в \\(v_{i+1}\\) и \\(v_i\\). Пусть \\(\\epsilon_i(t)=1\\), если предмет в \\(v_i\\) меняется на этой минуте, и \\(0\\) иначе. Тогда как равенство целых чисел\n\\[\nd_i(t+1)=d_i(t)+\\epsilon_{i+1}(t)-\\epsilon_i(t).\\tag{3}\n\\]\nПравая часть остаётся в \\(\\{-1,0,1\\}\\): если \\(d_i=1\\), вершина \\(v_i\\) видит побеждающий предмет и обязательно меняется, а при \\(d_i=-1\\) обязательно меняется \\(v_{i+1}\\); граничная разность не может выйти из интервала. Суммируя (3) по циклу, получаем инвариант \\(D(C)=\\sum_i d_i(t)\\).\n\nЕсли \\(\\ell=3\\), расположим по циклу \\(A_0,A_1,A_2\\). Если \\(\\ell\\ge4\\), расположим в \\(v_0,v_1,v_2,v_3\\) предметы \\(A_0,A_1,A_2,A_0\\), а в остальных вершинах цикла — \\(A_0\\); вне цикла предметы можно выбрать произвольно. В обоих случаях три последовательные разности равны \\(1\\), остальные — \\(0\\), поэтому \\(D(C)=3\\). В неподвижной расстановке концы каждого ребра имеют одинаковые предметы: если они различны, один предмет побеждает другой и проигравший должен измениться. Так как граф связен, неподвижная расстановка одноцветна и имеет \\(D(C)=0\\). Инвариант исключает остановку, следовательно, изменения идут бесконечно.\n\nг) Пусть \\(m=2r+1\\). На дереве снова поднимем номера предметов в целые высоты, требуя на каждом ребре \\(h(v)-h(u)\\in\\{-r,-r+1,\\ldots,r\\}\\). Представитель разности по модулю \\(m\\) в этом интервале единственен, а дерево позволяет согласованно определить все высоты. Вершина меняется ровно тогда, когда у неё есть сосед большей высоты, и при изменении её высота увеличивается на \\(1\\). После одновременного обновления разности на рёбрах остаются в том же интервале: если разность достигла \\(r\\), нижний конец обязательно меняется, а случай \\(-r\\) симметричен. Глобальный максимум \\(M\\) не меняется; все высоты не убывают и не превосходят \\(M\\). Поэтому целый потенциал \\(\\Phi=\\sum_v(M-h(v))\\) строго уменьшается в каждую минуту, когда есть изменение. Он неотрицателен, значит, процесс на дереве останавливается.\n\nЕсли граф содержит цикл, определим на его ориентированных рёбрах разности \\(d_i(t)\\in\\{-r,\\ldots,r\\}\\). Формула (3) остаётся верной как целочисленное равенство, и сумма \\(D(C)=\\sum_i d_i\\) сохраняется. Зададим на трёх последовательных рёбрах цикла разности \\(r,r,1\\), а на остальных — \\(0\\). Их сумма равна \\(2r+1=m\\), поэтому после обхода цикла накопленная разность равна нулю по модулю \\(m\\), и они задают согласованную расстановку предметов. Для неё \\(D(C)=m\\ne0\\). В стационарной расстановке концы каждого ребра равны, поскольку для двух различных предметов ровно один проигрывает другому и должен меняться; значит, \\(D(C)=0\\). Инвариант снова доказывает существование бесконечного процесса.",
