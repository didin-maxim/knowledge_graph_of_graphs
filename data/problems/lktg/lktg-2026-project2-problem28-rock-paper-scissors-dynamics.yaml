      "id": "stmt-original", "title": "Камень, ножницы, бумага на графе",
      "text": "Пусть \\(G\\) — конечный простой связный граф. В каждой его вершине находится камень, ножницы или бумага. Ножницы побеждают бумагу, бумага побеждает камень, камень побеждает ножницы. Каждую минуту предмет в вершине заменяется на побеждающий его предмет, если такой предмет есть хотя бы в одной соседней вершине. Если его нет, предмет не меняется. Все замены происходят одновременно и учитывают расстановку в начале минуты. а) Пусть \\(G\\) — дерево. Докажите, что при любой первоначальной расстановке через конечное число минут изменения прекратятся. б) Если дерево имеет \\(n\\) вершин, найдите наибольшее возможное число минут до стабилизации по всем деревьям и начальным расстановкам. в) Пусть \\(G\\) не является деревом. Докажите, что существует начальная расстановка с бесконечно долгими изменениями. г) Вместо трёх предметов рассмотрим нечётное число \\(m=2r+1\\ge3\\) предметов \\(A_0,A_1,\\ldots,A_{2r}\\), индексы по модулю \\(m\\). Предмет \\(A_i\\) проигрывает предметам \\(A_{i+1},\\ldots,A_{i+r}\\). За минуту \\(A_i\\) заменяется на \\(A_{i+1}\\), если хотя бы у одного соседа находится предмет, которому \\(A_i\\) проигрывает; иначе не меняется. Все замены одновременны. Докажите для этого правила утверждения пунктов а) и в).",
