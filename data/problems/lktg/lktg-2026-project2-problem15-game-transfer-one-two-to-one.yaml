        "id": "stmt-original",
        "title": "Связь игр \\(1:2\\) и \\(1:1\\)",
        "text": "Пусть \\(N\\ge r\\ge2\\). На рёбрах \\(K_N\\) Белла красит за раунд одно свободное ребро белым, затем Чингиз красит два свободных ребра чёрным; если свободных рёбер осталось меньше двух, он красит все оставшиеся. Белла выигрывает сразу после появления белой клики \\(K_r\\), а если все рёбра окрашены и её нет, выигрывает Чингиз. Предположим, что Белла имеет выигрышную стратегию в этой игре.\n\nДокажите, что при тех же правилах, но с одним чёрным ребром Чингиза за раунд, Белла может гарантировать белую клику \\(K_{r+1}\\) на каждом полном графе \\(K_M\\), где \\(M\\ge6N+1\\).",
