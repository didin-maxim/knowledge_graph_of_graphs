      "id": "sol-official-white-star-reduction",
      "title": "Белая звезда, независимое множество и симуляция",
      "text": "Выберем вершину \\(z\\). На первом этапе Белла всякий раз красит свободное ребро из \\(z\\) и продолжает, пока звезда не будет полностью окрашена. Из \\(M-1\\ge6N\\) рёбер звезды Чингиз за каждый раунд отнимает не больше одного, поэтому Белла получает множество \\(S\\) не менее чем из \\(3N\\) белых соседей \\(z\\). Обозначим \\(|S|=s\\). Во время этого этапа Чингиз сделал не больше \\(s\\) ходов, следовательно, в чёрном графе, порождённом \\(S\\), не больше \\(s\\) рёбер.\n\nДокажем вспомогательную оценку: в графе на \\(s\\) вершинах с \\(e\\) рёбрами существует независимое множество размера не меньше\n\\[\n\\frac{s^2}{2e+s}. \\tag{1}\n\\]\nВозьмём случайный порядок вершин и выберем вершину, если она стоит раньше всех своих соседей. Две смежные вершины не могут быть выбраны одновременно, поэтому выбранное множество независимо. Вершина степени \\(d\\) выбирается с вероятностью \\(1/(d+1)\\); среднее число выбранных вершин равно \\(\\sum_v1/(d(v)+1)\\). По неравенству Коши\n\\[\n\\left(\\sum_v(d(v)+1)\\right)\\left(\\sum_v\\frac1{d(v)+1}\\right)\\ge s^2.\n\\]\nПервая сумма равна \\(2e+s\\), откуда математическое ожидание не меньше правой части (1). Значит, хотя бы для одного порядка выбранное независимое множество имеет такой размер.\n\nВ нашем случае \\(e\\le s\\), поэтому внутри \\(S\\) есть независимое в чёрном графе множество размера не меньше \\(s^2/(3s)=s/3\\ge N\\). Выберем в нём ровно \\(N\\) вершин и обозначим их через \\(X\\). Между вершинами \\(X\\) пока нет чёрных рёбер.\n\nНа втором этапе Белла разыгрывает на \\(X\\) свою выигрышную стратегию из игры \\(1:2\\). Настоящий Чингиз за раунд красит одно ребро. Если оно лежит в \\(X\\) и ещё свободно воображаемо, Белла считает его первым из двух воображаемых чёрных рёбер. Если оно вне \\(X\\) или было мысленно окрашено раньше, настоящий ход считается пропуском во внутренней игре. После этого Белла мысленно красит произвольные свободные рёбра внутри \\(X\\), пока не наберутся два чёрных хода воображаемого раунда или пока доска не закончится.\n\nКаждое настоящее чёрное ребро внутри \\(X\\) учтено воображаемой игрой. Поэтому белое ребро, предписанное исходной выигрышной стратегией, свободно и в настоящей партии: воображаемая игра может иметь дополнительные чёрные рёбра, но не пропускает реальных. Следуя стратегии, Белла получает белый \\(K_r\\) внутри \\(X\\). Все его вершины с первого этапа бело соединены с \\(z\\), так что вместе с \\(z\\) они образуют белый \\(K_{r+1}\\).",
