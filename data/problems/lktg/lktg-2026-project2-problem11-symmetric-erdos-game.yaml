      {
        "id": "stmt-original",
        "title": "Симметричная игра Эрдёша",
        "text": "Пусть \\(n\\ge 3\\). На рёбрах \\(K_n\\) Красный и Синий по очереди выбирают по одному свободному ребру и красят его в свой цвет; начинает Красный. После окраски всех рёбер Красный выигрывает, если его наибольшая клика строго больше синей; при равенстве или меньшем размере выигрывает Синий. Обозначим графы красных и синих рёбер через \\(R\\) и \\(B\\).\n\nа) Докажите, что Красный всегда может гарантировать \\(\\omega(R)\\ge\\omega(B)\\).\n\nб) Докажите, что Синий всегда может гарантировать \\(\\omega(R)\\le\\omega(B)+1\\).\n\nв) Пусть вместо полного графа доской служит произвольный конечный граф \\(G\\) хотя бы с одним ребром. Докажите те же две гарантии. В частности, при правильной игре разность кликовых чисел равна 0 или 1.\n\nг) Предположим, что на \\(K_n\\) Красный может гарантировать строгую победу. Докажите, что на \\(K_{n+1}\\) Синий имеет выигрышную стратегию.\n\nд) При том же предположении докажите, что на \\(K_{n+2}\\) Синий имеет выигрышную стратегию.\n\nе) Пусть \\(n>100\\), и предположим, что на \\(K_n\\) Красный может гарантировать строгую победу. Докажите, что на \\(K_{n+3}\\) Синий имеет выигрышную стратегию.\n\nж★) Докажите или опровергните: существует натуральное \\(N\\), такое что для каждого \\(n\\ge N\\), если на \\(K_n\\) Красный может гарантировать строгую победу, то на \\(K_{n+4}\\) Синий имеет выигрышную стратегию.\n\nз★) Докажите или опровергните: для каждого \\(n\\ge 3\\) при правильной игре выигрывает Синий.\n\nПодпункты ж) и з) отмечены в официальном PDF звёздочкой как открытые. Решения для них в официальном сборнике нет; настоящая карточка не утверждает, что они решены.",
