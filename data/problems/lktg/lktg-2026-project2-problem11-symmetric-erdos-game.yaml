    {
      "id": "sol-official-parts-a-e",
      "title": "Решение закрытых подпунктов а–е",
      "text": "Будем пользоваться приёмом воображаемых рёбер. Если стратегия выигрывает даже после того, как несколько свободных рёбер заранее отданы противнику, то она выигрывает и в исходной игре: реальный ход противника по подаренному ребру считается пропуском в воображаемой партии, а освободившийся собственный ход можно сделать где угодно. Дополнительное ребро своего цвета не уменьшает собственную клику и не увеличивает клику соперника.\n\nа) Предположим, что Синий умеет при любой игре Красного обеспечить \\(\\omega(B)>\\omega(R)\\). Красный первым ходом красит произвольное ребро \\(e\\), затем меняет названия цветов и применяет эту же стратегию как второй игрок. В воображаемой партии настоящие синие рёбра играют роль рёбер первого игрока, а красные рёбра, кроме \\(e\\), — второго. Стратегия тогда обещает \\(\\omega(R-e)>\\omega(B)\\). Ребро \\(e\\) может лишь увеличить красное кликовое число, поэтому та же стратегия обещала бы победу обеим сторонам, что невозможно. Значит, Красный гарантирует \\(\\omega(R)\\ge\\omega(B)\\).\n\nб) Конечность дерева игры означает: либо Синий может обеспечить \\(\\omega(R)\\le\\omega(B)+1\\), либо Красный может обеспечить \\(\\omega(R)\\ge\\omega(B)+2\\). Допустим второе и обозначим предполагаемую стратегию Красного через \\(S\\), а её первый ход через \\(f\\). Пусть настоящий первый ход Красного — \\(e\\). Синий будет разыгрывать \\(S\\) с переставленными цветами.\n\nЕсли \\(e\\ne f\\), Синий красит \\(f\\) и далее буквально следует \\(S\\). Тогда стратегия, применённая к синим рёбрам и красным рёбрам без \\(e\\), дала бы\n\\[\n\\omega(B)\\ge\\omega(R-e)+2\\ge\\omega(R)+1,\n\\]\nпоскольку удаление одного ребра уменьшает кликовое число не более чем на один. Это несовместимо с обещанием \\(\\omega(R)\\ge\\omega(B)+2\\).\n\nЕсли \\(e=f\\), Синий делает произвольный свободный ход \\(g\\), не учитывает его и затем считает \\(e\\) первым синим ребром воображаемой партии. Настоящие красные ходы со второго играют роль ходов соперника стратегии, а настоящие синие ходы со второго — её ответов. Поэтому\n\\[\n\\omega((B-g)+e)\\ge\\omega(R-e)+2.\n\\]\nДобавление одного ребра увеличивает кликовое число не более чем на один, а удаление одного уменьшает не более чем на один. Левая часть не превосходит \\(\\omega(B)+1\\), правая не меньше \\(\\omega(R)+1\\), откуда \\(\\omega(B)\\ge\\omega(R)\\), снова противоречие. Если после \\(e\\) свободно не более одного ребра, нужная оценка очевидна, так что нехватки хода \\(g\\) нет. Следовательно, Синий гарантирует \\(\\omega(R)\\le\\omega(B)+1\\).\n\nв) В двух предыдущих доказательствах использовались только конечность игры и факт, что одно ребро меняет кликовое число не более чем на один. Поэтому они без изменений работают на любой конечной доске \\(G\\) хотя бы с одним ребром. Красный гарантирует разность не меньше нуля, Синий — не больше единицы; при правильной игре она равна 0 или 1.\n\nг) Пусть первый красный ход на \\(K_{n+1}\\) — \\(uv\\). Мысленно подарим Красному все остальные рёбра из \\(v\\). На остальных \\(n\\) вершинах остаётся чистая доска \\(K_n\\), и первым на ней ходит Синий. Он применяет выигрышную стратегию первого игрока, существующую по предположению. Красные ходы вне этой доски считаются пропусками; после заполнения внутренней доски Синий берёт любое свободное ребро. Если внутри \\(K_n\\) красное и синее кликовые числа равны \\(r\\) и \\(b\\), то \\(b\\ge r+1\\). В полном графе красная клика может дополнительно использовать универсальную красную вершину \\(v\\), синяя — нет. Поэтому \\(\\omega(R)=r+1\\le b=\\omega(B)\\), и по правилу задачи выигрывает Синий.\n\nд) Пусть Красный начал ребром \\(xy\\), а \\(H=K_{n+2}-\\{x,y\\}\\cong K_n\\). Первым ходом Синий начинает на \\(H\\) выигрышную стратегию первого игрока. На красный ход внутри \\(H\\) он отвечает по этой стратегии; на ход \\(xz\\), где \\(z\\in H\\), отвечает \\(yz\\), и наоборот. Ответ свободен, потому что два ребра пары \\(\\{xz,yz\\}\\) до этого могли окрашиваться только вместе. Лишний или уже не требующийся внутренний ответ заменяется произвольным свободным ходом, что корректно по приёму воображаемых рёбер. Внутри \\(H\\) получаем \\(b\\ge r+1\\). Красная клика размера хотя бы три не содержит одновременно \\(x\\) и \\(y\\): для любой третьей вершины одно из рёбер к ним синее. Значит, \\(\\omega(R)\\le r+1\\le b\\le\\omega(B)\\), и Синий выигрывает.\n\nе) Зафиксируем выигрышную стратегию \\(S\\) первого игрока на \\(K_n\\). Сначала опишем целевую позицию. Вершины разбиты на \\(H\\cong K_n\\) и особые \\(u,v_1,v_2\\). Внутри \\(H\\) Синий играет первым по \\(S\\) и имеет на один ход больше Красного; все рёбра из \\(u\\) в \\(H\\) красные, а \\(uv_1,uv_2\\) синие; ребро \\(v_1v_2\\) красное; общие красные соседи \\(v_1,v_2\\) в \\(H\\) лежат в множестве \\(T\\), где \\(|T|\\le3\\).\n\nИз этой позиции на красный ход внутри \\(H\\) Синий отвечает по \\(S\\), а на \\(v_1w\\) отвечает \\(v_2w\\) и наоборот; подаренные Красному рёбра учитываются как выше. Если внутренние кликовые числа равны \\(r,b\\), то \\(b\\ge r+1\\). Красная клика с не более чем одной особой вершиной имеет размер не больше \\(r+1\\). Клика с двумя особыми вершинами не содержит \\(u\\) вместе с \\(v_1\\) или \\(v_2\\), поэтому может состоять лишь из \\(v_1,v_2\\) и не более трёх их общих красных соседей. Следовательно,\n\\[\n\\omega(R)\\le\\max\\{r+1,5\\}.\n\\]\nДокажем нужную рамсеевскую оценку: в любой двухцветной раскраске \\(K_{70}\\) есть одноцветный \\(K_5\\). Вообще, среди \\(\\binom{a+b-2}{a-1}\\) вершин есть красный \\(K_a\\) или синий \\(K_b\\). Индукция по \\(a+b\\): у выбранной вершины либо не меньше \\(\\binom{a+b-3}{a-2}\\) соседей одного цвета, либо не меньше \\(\\binom{a+b-3}{a-1}\\) другого; применяем индукцию к соответствующему множеству соседей и добавляем выбранную вершину, когда цвет совпадает. Для \\(a=b=5\\) получаем \\(\\binom84=70\\). Так как \\(n>100\\), внутри \\(H\\) есть одноцветный \\(K_5\\). Если он синий, то \\(b\\ge5\\); если красный, то \\(r\\ge5\\), а значит \\(b\\ge r+1\\ge6\\). В любом случае \\(b\\ge5\\), и предыдущая оценка даёт \\(\\omega(R)\\le\\omega(B)\\).\n\nОсталось получить целевую позицию. Пусть первое красное ребро имеет конец \\(x\\). Синий красит \\(xy\\) с новым концом \\(y\\). После второго красного хода выберем вершину \\(z\\), не соединённую красным ни с \\(x\\), ни с \\(y\\), причём если уже есть красное ребро вне \\(\\{x,y\\}\\), возьмём подходящий его конец; таких рёбер пока не более одного, поэтому выбор возможен. Тогда внутри \\(H=K_{n+3}-\\{x,y,z\\}\\) окрашенных рёбер нет. Синий начинает там стратегию \\(S\\) и отвечает ею, пока Красный впервые не возьмёт ребро вне \\(H\\). После такого хода Синий берёт свободное ребро из \\(\\{xz,yz\\}\\), отличное от только что взятого. До этого оба были свободны, поэтому ход возможен. Вершину из \\(x,y\\), имеющую теперь две синие связи с остальными особыми вершинами, назовём \\(u\\), две другие — \\(v_1,v_2\\). Если Красный только что взял последнее ребро \\(H\\), Синий сразу делает тот же внешний ход; целевая позиция всё равно получена.\n\nК этому моменту Красный сделал не более трёх рёбер вне \\(H\\), поэтому все уже возникшие общие красные соседи \\(v_1,v_2\\) в \\(H\\) входят в некоторое \\(T\\) размера не более трёх. Мысленно подарим Красному недостающие рёбра из \\(u\\) в \\(H\\), оба ребра из каждой вершины \\(T\\) к \\(v_1,v_2\\) и ребро \\(v_1v_2\\). Ни одно из них не синее. Получена целевая позиция, которая, как доказано выше, выигрышна для Синего.\n\nПодпункты ж) и з) являются открытыми и в официальный раздел решений не входят.",
