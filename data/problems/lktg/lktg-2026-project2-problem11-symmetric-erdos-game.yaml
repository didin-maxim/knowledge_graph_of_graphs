      "title": "Кража стратегии с перестановкой цветов",
      "text": "Первый игрок после произвольного начального ребра может мысленно стать вторым игроком в партии с переставленными цветами. Цена лишнего ребра контролируется тем, что добавление или удаление одного ребра меняет кликовое число не более чем на единицу.",
