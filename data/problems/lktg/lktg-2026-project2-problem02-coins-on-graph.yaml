        "id": "stmt-problem02",
        "title": "Игра с монетами и непосещёнными вершинами",
        "text": "В каждой вершине конечного связного графа \\(G\\) лежит неотрицательное целое число монет. Петя выбирает стартовую вершину, ставит туда фишку, объявляет вершину посещённой и забирает все монеты из неё. После этого первым передвигает фишку Вася. За ход нужно перейти по ребру в ещё не посещённую вершину и забрать из неё все монеты. Игра заканчивается, когда очередной игрок не может сделать ход. Побеждает набравший больше монет; при равенстве объявляется ничья.\n\nа) Пусть \\(G\\) является путём. Докажите, что Петя может выбрать стартовую вершину и затем играть так, чтобы не проиграть.\n\nб) Докажите то же, если \\(G\\) - произвольное конечное дерево.\n\nв) Докажите то же, если \\(G\\) - цикл.\n\nг) Верно ли это для произвольного конечного связного графа \\(G\\)?",
