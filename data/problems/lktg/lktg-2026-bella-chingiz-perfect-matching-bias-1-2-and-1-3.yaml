        "title": "Версия 1:2",
        "text": "Пусть \\(n\\ge 2\\) — чётное число. Белла и Чингиз играют на рёбрах полного графа \\(K_n\\). До первого хода Чингиз красит в чёрный цвет рёбра некоторого совершенного паросочетания, то есть \\(n/2\\) попарно непересекающихся рёбер, покрывающих все вершины. Затем игра идёт по раундам. Белла красит одно свободное ребро белым, после чего Чингиз красит два свободных ребра чёрным; если свободных рёбер осталось меньше двух, он красит все оставшиеся. После окраски всех рёбер Чингиз выигрывает, если наибольшая чёрная клика строго больше наибольшей белой. Докажите, что Чингиз имеет выигрышную стратегию.",
