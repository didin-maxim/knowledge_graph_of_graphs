  "solutions": [
    {
      "id": "sol-ordered-perfect-matching",
      "title": "Единая стратегия для версий 1:2 и 1:3",
      "text": "Обозначим через \\(\\varphi(x)\\) партнёра вершины \\(x\\) в начальном чёрном совершенном паросочетании и линейно упорядочим его пары.\n\nПусть Белла покрасила ребро \\(xy\\), причём пара вершины \\(x\\) стоит раньше пары вершины \\(y\\). Чингиз красит чёрным рёбра\n\\[\\varphi(x)\\varphi(y)\\quad\\text{и}\\quad x\\varphi(y).\\]\nЕсли одно из них уже чёрное, освободившийся ход он делает произвольно. Оба предписанных ребра свободны или уже чёрны. Действительно, если Белла раньше покрасила \\(\\varphi(x)\\varphi(y)\\), то ответ Чингиза на тот ход уже включал бы \\(xy\\). Если она раньше покрасила \\(x\\varphi(y)\\), ответ на тот ход также включал бы \\(xy\\). В обоих случаях нынешнее ребро \\(xy\\) не могло бы быть свободным перед ходом Беллы. Значит, стратегия легальна.\n\nПусть \\(C\\) — произвольная белая клика размера \\(r\\). Она содержит не более одной вершины из каждой пары, потому что рёбра начального паросочетания чёрные. Выберем в \\(C\\) вершину \\(x\\), пара которой является самой ранней среди пар, представленных в \\(C\\), и положим\n\\[C'=\\{\\varphi(v):v\\in C\\}\\cup\\{x\\}.\\]\nДокажем, что \\(C'\\) — чёрная клика. Для любых различных \\(u,v\\in C\\) ребро \\(uv\\) белое, поэтому ответ на ход, когда оно стало белым, сделал ребро \\(\\varphi(u)\\varphi(v)\\) чёрным. Следовательно, все вершины множества \\(\\{\\varphi(v):v\\in C\\}\\) попарно соединены чёрными рёбрами. Если \\(v\\in C\\setminus\\{x\\}\\), то пара \\(x\\) стоит раньше пары \\(v\\), и ответ на белое ребро \\(xv\\) сделал \\(x\\varphi(v)\\) чёрным. Наконец, \\(x\\varphi(x)\\) — ребро начального чёрного паросочетания. Поэтому \\(C'\\) является чёрной кликой размера \\(r+1\\).\n\nМы сопоставили каждой белой клике размера \\(r\\) чёрную клику размера \\(r+1\\). В частности, для наибольшей белой клики получаем \\(\\omega(B)\\ge\\omega(W)+1\\), так что Чингиз выигрывает.\n\nВ версии 1:3 Чингиз делает те же два предписанных хода. Третье разрешённое чёрное ребро он выбирает произвольно; оно не может испортить уже доказанное неравенство кликовых чисел. Поэтому это не отдельная задача, а дословное усиление той же стратегии.",
