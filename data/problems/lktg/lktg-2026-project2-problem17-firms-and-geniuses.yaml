    "original": [
      {
        "id": "stmt-original",
        "title": "Фирмы нанимают программистов в графе знакомств",
        "text": "Вершины конечного простого графа — программисты, а рёбра означают знакомства. Фирмы Пети и Васи по очереди нанимают по одному программисту, ещё не нанятому ни одной фирмой; начинает фирма Пети. Первого программиста каждая фирма выбирает произвольно. Каждый следующий нанятый ею программист должен быть знаком хотя бы с одним программистом, уже работающим в этой фирме. Если фирма не может сделать ход, она прекращает набор, а другая продолжает по тем же правилам, пока может. Среди программистов заранее отмечены \\(r\\) гениев.\n\nа) Для \\(r=3\\) постройте граф, в котором фирма Васи гарантированно наймёт не меньше двух гениев.\n\nб) Для \\(r=4\\) постройте граф, в котором фирма Васи гарантированно наймёт не меньше трёх гениев.\n\nв) Для каждого \\(r\\ge2\\) постройте граф, в котором фирма Васи гарантированно наймёт не меньше \\(r-1\\) гениев.",
