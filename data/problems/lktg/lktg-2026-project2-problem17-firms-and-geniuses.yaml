  "solutions": [
    {
      "id": "sol-official-parts-a-c",
      "title": "Шестиугольник, пути длин 10–13 и общая координатная конструкция",
      "text": "а) Возьмём цикл\n\\[\ng_1-u_1-g_2-u_2-g_3-u_3-g_1\n\\]\nи объявим гениями \\(g_1,g_2,g_3\\). Если Петя первым нанял гения, например \\(g_1\\), Вася нанимает противоположную вершину \\(u_2\\). Следующий законный ход Пети — \\(u_1\\) или \\(u_3\\). В первом случае Вася берёт \\(g_2\\), во втором — \\(g_3\\). После этого набор по оставшимся дугам цикла вынужден, и второй из двух оставшихся гениев также достаётся Васе.\n\nЕсли Петя начал с обычной вершины, например \\(u_1\\), Вася берёт соседнего гения \\(g_1\\). Петя вынужден взять \\(g_2\\), затем Вася берёт \\(u_3\\), Петя — \\(u_2\\), Вася — \\(g_3\\). В обоих случаях Вася нанимает двух гениев.\n\nб) Это частный случай пункта в при \\(r=4\\): общая координатная конструкция, доказанная ниже, гарантирует Васе не меньше \\(r-1=3\\) гениев. Поэтому отдельной конструкции для этого пункта не требуется.\n\nв) Положим \\(L=r(r-1)\\). Программистами будут все векторы\n\\[\nx=(x_1,\\ldots,x_r),\\qquad x_i\\in\\mathbb Z_{\\ge0},\\qquad x_1+\\cdots+x_r=L.\n\\]\nДва программиста знакомы, если один вектор получается из другого увеличением одной координаты на 1 и уменьшением другой на 1. Гениями объявим\n\\[\nG_i=(0,\\ldots,0,L,0,\\ldots,0),\\qquad1\\le i\\le r,\n\\]\nгде \\(L\\) стоит в \\(i\\)-й координате. Граф конечен, и отмеченных гениев ровно \\(r\\).\n\nПусть первым Петя нанял \\(A=(A_1,\\ldots,A_r)\\). Некоторая координата, скажем \\(A_k\\), не меньше \\(L/r=r-1\\). Первым ходом Вася нанимает \\(B\\), где\n\\[\nB_i=A_i+1\\quad(i\\ne k),\\qquad B_k=A_k-(r-1).\n\\]\nКоординаты неотрицательны, их сумма равна \\(L\\), поэтому такой программист существует.\n\nДля каждой фирмы и каждого \\(i\\ne k\\) обозначим через \\(m_i\\) и \\(M_i\\) наибольшую \\(i\\)-ю координату среди уже нанятых Петей и Васей соответственно. Сразу после первого хода Васи \\(M_i>m_i\\) для всех \\(i\\ne k\\). Покажем, как Вася сохраняет эти неравенства.\n\nНовый работник Пети смежен с одним из прежних, поэтому у его вектора увеличилась ровно одна координата и только на единицу. После хода Пети не более одного строгого неравенства может стать равенством, и ни одно не меняет знак. Если возникло \\(m_i=M_i=d\\), у Васи уже есть работник \\(S\\) с \\(S_i=d\\). Число \\(d<L\\): при \\(d=L\\) единственная вершина с такой координатой — гений \\(G_i\\), который не может одновременно принадлежать обеим фирмам. Следовательно, у \\(S\\) есть положительная координата \\(S_j\\) при некотором \\(j\\ne i\\). Вася нанимает соседа\n\\[\nS'=S+e_i-e_j.\n\\]\nХод законен, а \\(S'\\) ещё свободен: его \\(i\\)-я координата равна \\(d+1\\), что больше обоих прежних максимумов. После хода снова \\(M_i>m_i\\); остальные максимумы Васи не уменьшаются, поскольку все ранее нанятые вершины остаются у фирмы.\n\nЕсли равенства нет, Вася выбирает любую координату \\(i\\ne k\\) с \\(M_i<L\\), берёт уже нанятую вершину \\(S\\) с \\(S_i=M_i\\) и тем же переносом единицы увеличивает \\(M_i\\). Положительная координата для уменьшения существует, так как \\(M_i<L\\), а новая вершина свободна по тому же аргументу максимума. Каждый ход Васи увеличивает сумму \\(\\sum_{i\\ne k}M_i\\) на единицу, пока все эти максимумы не станут равны \\(L\\). Вася не может застрять раньше; если Петя прекратит набор, Вася продолжит один.\n\nРавенство \\(M_i=L\\) означает, что Вася нанял единственную вершину с такой координатой, то есть гения \\(G_i\\). В итоге ему достаются все гении, кроме, быть может, \\(G_k\\): не меньше \\(r-1\\).",
