        "text": "Зафиксируем число \\(0<\\beta<2/3\\). Белла и Чингиз играют на рёбрах \\(K_n\\). Белла ходит первой и каждый раз красит одно свободное ребро белым; после каждого её хода Чингиз красит два свободных ребра чёрным. Если перед ходом Чингиза свободных рёбер меньше двух, он красит все оставшиеся. Через \\(B\\) и \\(W\\) обозначим итоговые графы. а) Докажите, что существуют постоянная \\(C=C(\\beta)\\) и число \\(n_0\\), такие, что при каждом \\(n\\ge n_0\\) Чингиз может одной стратегией одновременно гарантировать \\[\\omega(W)\\le\\lceil2\\log_3n\\rceil+1\\] и \\[e_B(U)\\ge\\beta{|U|\\choose2}\\] для каждого множества \\(U\\), содержащего не менее \\(\\lceil C\\log n\\rceil\\) вершин. б) Выведите, что при всех достаточно больших \\(n\\) выполнено \\(\\omega(B)>\\omega(W)\\).",
