    {
      "id": "sol-official-golden-ratio-game",
      "title": "Общая многотипная стратегия и количественная версия 1:2",
      "text": "Положим \\(A=p+1\\). Второе условие задачи эквивалентно неравенству \\(1/\\log(1+q/p)>2q/\\log A\\). По непрерывности выберем \\(\\rho<p/(p+q)\\) настолько близко к \\(p/(p+q)\\), чтобы\n\\[\n\\frac1{\\log(1/\\rho)}>\\frac{2q}{\\log A}.\\tag{1}\n\\]\nТак как \\(\\rho<p/(p+q)\\), имеем \\(q/p<1/\\rho-1\\). Выберем \\(c\\) между этими числами, затем \\(s>1\\) настолько близким к \\(1\\), чтобы\n\\[\ns^q-1\\le p(1-s^{-c}).\\tag{2}\n\\]\nЭто возможно, поскольку после деления на \\(s-1\\) пределы частей при \\(s\\downarrow1\\) равны \\(q\\) и \\(pc>q\\). Положим \\(\\Delta=1/(c+1)-\\rho>0\\), выберем \\(C\\) так, чтобы \\(8/((c+1)C\\log s)<\\Delta\\), и обозначим \\(k=\\lceil2q\\log_A n\\rceil+2\\), \\(m=\\lceil C\\log n\\rceil\\).\n\nДокажем нужную многотипную весовую лемму. Пусть чёрное ребро умножает вес цели типа \\(i\\) на \\(\\alpha_i\\in[0,1)\\), белое — на \\(\\beta_i>1\\), причём\n\\[\n\\beta_i^q-1\\le p(1-\\alpha_i).\\tag{3}\n\\]\nОпасность свободного ребра равна \\(D(e)=\\sum_{i,A\\ni e}(1-\\alpha_i)w_A\\). Чингиз последовательно выбирает \\(p\\) рёбер максимальной текущей опасности. Если после них максимальная опасность равна \\(D\\), потеря потенциала не меньше \\(pD\\).\n\nОценим следующий белый ход сразу. Если цель \\(A\\) типа \\(i\\) содержала \\(t\\) из выбранных Беллой рёбер, её прирост равен \\(w_A(\\beta_i^t-1)\\), где \\(w_A\\) — вес до хода Беллы. По выпуклости функции \\(x\\mapsto\\beta_i^x-1\\) на \\([0,q]\\)\n\\[\n\\beta_i^t-1\\le\\frac tq(\\beta_i^q-1)\\le\\frac{pt}{q}(1-\\alpha_i).\n\\]\nСуммируя по целям и затем по белым рёбрам, получаем прирост не больше \\((p/q)\\sum_eD(e)\\le pD\\), потому что до белого хода опасность каждого оставшегося ребра не превосходит \\(D\\), а Белла выбирает не более \\(q\\) рёбер. Следовательно, полный раунд не увеличивает потенциал; неполный последний раунд также безопасен.\n\nПрименим лемму к двум типам целей. Для каждого \\(k\\)-множества берём все его внутренние рёбра. Пока цель жива и имеет \\(r\\) свободных рёбер, её вес равен \\(A^{-r/q}\\); чёрное ребро умножает вес на \\(0\\), белое — на \\(A^{1/q}\\). Условие (3) здесь обращается в равенство \\((A^{1/q})^q-1=p\\). Для каждого \\(U\\), \\(|U|=u\\ge m\\), берём вес \\(n^{-2u}s^{e_W(U)-ce_B(U)}\\); множители равны \\(s^{-c}\\) и \\(s\\), а (3) совпадает с (2).\n\nБелла ходит первой. До её первых \\(q\\) белых рёбер сумма кликовых весов не превосходит\n\\[\n{n\\choose k}A^{-{k\\choose2}/q}\\le n^kA^{-k(k-1)/(2q)}\\le\\frac{A^{-1/q}}n,\n\\]\nа сумма весов целей второго типа не превосходит \\(\\sum_{u=m}^n{n\\choose u}n^{-2u}\\le1/(n-1)\\). Первый ход Беллы умножает эти суммы не более чем на \\(A\\) и \\(s^q\\). Поэтому после него общий потенциал не больше \\(A^{1-1/q}/n+s^q/(n-1)<1\\) при достаточно большом \\(n\\). Далее он остаётся меньше единицы.\n\nПолностью белая \\(k\\)-клика имела бы вес \\(1\\), следовательно,\n\\[\n\\omega(W)\\le k-1=\\lceil2q\\log_{p+1}n\\rceil+1.\\tag{4}\n\\]\nДля каждого \\(U\\), \\(u\\ge m\\), вес второй цели меньше \\(1\\), поэтому\n\\[\n\\frac{e_B(U)}{{u\\choose2}}>\\frac1{c+1}-\\frac{4\\log_s n}{(c+1)(u-1)}>\\rho\\tag{5}\n\\]\nпри достаточно большом \\(n\\), по выбору \\(C\\) и \\(\\Delta\\).\n\nПостроим чёрную клику. Начиная с \\(U_0=V\\), пока \\(|U_i|\\ge m\\), выбираем в \\(B[U_i]\\) вершину степени не меньше \\(\\rho(|U_i|-1)\\) и заменяем \\(U_i\\) множеством её соседей. Выбранные вершины попарно смежны. Если \\(r_i=|U_i|\\) и \\(a_0=\\rho/(1-\\rho)\\), то \\(r_{i+1}+a_0\\ge\\rho(r_i+a_0)\\). Поэтому\n\\[\n\\omega(B)\\ge\\left\\lfloor\\frac{\\log((n+a_0)/(m+a_0))}{\\log(1/\\rho)}\\right\\rfloor=\\frac{\\log n-\\log\\log n-O(1)}{\\log(1/\\rho)}.\\tag{6}\n\\]\nПо (1) коэффициент при \\(\\log n\\) в (6) строго больше \\(2q/\\log(p+1)\\), тогда как (4) имеет именно этот главный коэффициент. Запас линейного по \\(\\log n\\) члена сильнее потери \\(O(\\log\\log n)\\), поэтому для всех достаточно больших \\(n\\) имеем \\(\\omega(B)>\\omega(W)\\).\n\nНаконец, первое условие задачи формально следует из второго: \\((1+q/p)^{2q}\\ge(1+1/p)^2\\), так что \\(p+1>(1+1/p)^2\\). После умножения на \\(p^2\\) это равносильно \\((p+1)(p^2-p-1)>0\\), то есть \\(p>\\varphi\\). Золотое сечение является точной границей этого следствия при \\(q=1\\).\n\nКоличественная версия для игры 1:2.\n\nИспользуем многотипную весовую стратегию из общей части этого решения при \\(p=2\\), \\(q=1\\). Пусть заранее задано \\(0<\\beta<2/3\\). Выберем число \\(\\rho\\) так, чтобы\n\\[\\max\\{\\beta,1/\\sqrt3\\}<\\rho<2/3.\\]\nТогда \\(1/\\log(1/\\rho)>2/\\log3\\), поэтому выбор параметров \\(c,s,C\\) из общего доказательства одновременно запрещает белую клику размера \\(\\lceil2\\log_3n\\rceil+2\\) и обеспечивает \\(e_B(U)\\ge\\rho{|U|\\choose2}>\\beta{|U|\\choose2}\\) для каждого \\(|U|\\ge\\lceil C\\log n\\rceil\\). Это доказывает пункт а количественной формулировки.\n\nДля пункта б применяем построение вложенных чёрных окрестностей из заключительной части общего доказательства. Оно даёт чёрную клику размера не меньше \\((\\log n-\\log\\log n-O(1))/\\log(1/\\rho)\\). Выбор \\(\\rho>1/\\sqrt3\\) делает главный коэффициент строго больше \\(2/\\log3\\), тогда как белая клика имеет размер не больше \\(2\\log_3n+O(1)\\). Следовательно, при всех достаточно больших \\(n\\) выполнено \\(\\omega(B)>\\omega(W)\\).",
