        "title": "Игра \\(p:q\\) и золотое сечение",
        "text": "Пусть \\(\\varphi=(1+\\sqrt5)/2\\). Зафиксируем целые \\(p,q\\ge1\\), для которых \\[p>\\varphi,\\qquad p+1>\\left(1+\\frac qp\\right)^{2q}.\\] Белла и Чингиз играют на рёбрах \\(K_n\\). Белла ходит первой и каждый раз красит \\(q\\) свободных рёбер белым; после каждого её хода Чингиз красит \\(p\\) свободных рёбер чёрным. Если перед ходом игрока свободных рёбер меньше, чем ему разрешено покрасить, он красит все оставшиеся. Через \\(B\\) и \\(W\\) обозначим итоговые графы. Докажите, что при всех достаточно больших \\(n\\) Чингиз может гарантировать \\(\\omega(B)>\\omega(W)\\).",
