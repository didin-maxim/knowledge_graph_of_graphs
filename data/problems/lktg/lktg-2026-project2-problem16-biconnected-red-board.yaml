  "solutions": [
    {
      "id": "sol-official-k4-book",
      "title": "Книга из \\(K_4\\) и локальная стратегия Красного",
      "text": "Для \\(t\\ge2\\) построим граф \\(H_t\\) из \\(t\\) копий \\(K_4\\), имеющих ровно одно общее ребро \\(uv\\). В \\(i\\)-й копии две остальные вершины обозначим \\(a_i,b_i\\), а копию назовём страницей \\(C_i\\). Возьмём\n\\[\nt\\ge\\max\\left\\{2,\\left\\lceil\\frac{M-2}{2}\\right\\rceil\\right\\}.\n\\]\nТогда \\(|V(H_t)|=2+2t\\ge M\\).\n\nПроверим двусвязность. После удаления \\(u\\) вершина \\(v\\) соединяет все оставшиеся вершины; после удаления \\(v\\) ту же роль играет \\(u\\). После удаления одной из \\(a_i,b_i\\) общее ребро \\(uv\\) продолжает связывать все страницы. Значит, удаление любой вершины оставляет граф связным.\n\nТеперь стратегия. Первым ходом Красный красит \\(uv\\). Первый синий ход лежит в некоторой странице; назовём её \\(C_2\\). Красный выбирает другую, ещё не затронутую страницу \\(C_1\\), и вторым ходом красит противоположное ребро \\(a_1b_1\\).\n\nОпишем локальные ответы. В странице \\(C_2\\) уже есть первое синее ребро \\(e\\). Если \\(e=a_2b_2\\), Красный объявляет парами \\(\\{ua_2,ub_2\\}\\) и \\(\\{va_2,vb_2\\}\\). Если, например, \\(e=ua_2\\), пары равны \\(\\{a_2b_2,ub_2\\}\\) и \\(\\{va_2,vb_2\\}\\); остальные случаи симметричны. На синий ход в паре Красный, если нужно, берёт второе ребро пары.\n\nПусть Синий впервые входит в новую страницу \\(C_i\\). Если он красит \\(a_ib_i\\), Красный красит \\(ua_i\\), а рёбра \\(va_i,vb_i\\) объявляет парой и отвечает одним на другое. Если первый синий ход — луч, например \\(ua_i\\), Красный сразу красит \\(a_ib_i\\). После этого синий треугольник в странице невозможен. Все варианты получаются переименованием.\n\nОбязательный локальный ответ имеет приоритет. Если его нет, Красный работает в целевой странице \\(C_1\\). Её четыре луча разбиты на пары противоположных рёбер\n\\[\nP=\\{ua_1,vb_1\\},\\qquad Q=\\{ub_1,va_1\\}.\n\\]\nКрасный берёт свободное ребро из той пары, из которой у него ещё нет ребра. Когда обе пары представлены, свободным ходом можно красить, например, \\(a_ib_i\\) в нетронутой странице, сразу делая её безопасной для Синего.\n\nКрасный обязательно получит ребро из каждой пары \\(P,Q\\). Если Синий первым входит в такую пару, локального ответа в \\(C_1\\) нет и Красный сразу берёт другое её ребро. Если Синий избегает \\(C_1\\), то конечное число рёбер остальных страниц в конце концов исчерпается и ему придётся войти в \\(C_1\\). Любые два красных ребра, по одному из \\(P,Q\\), имеют общий конец; вместе с одним из уже красных противоположных рёбер \\(uv,a_1b_1\\) они образуют красный треугольник.\n\nОстаётся доказать, что синего треугольника нет. Всякий треугольник \\(H_t\\) целиком лежит в одной странице, поскольку вершины разных страниц, кроме \\(u,v\\), не смежны. В \\(C_1\\) оба противоположных ребра \\(uv,a_1b_1\\) красные. В \\(C_2\\) каждый возможный синий треугольник требует обоих рёбер одной из объявленных пар. В новой странице после первого синего луча ребро \\(a_ib_i\\) красное; после первого синего \\(a_ib_i\\) треугольник через \\(u\\) закрыт красным \\(ua_i\\), а треугольник через \\(v\\) требует оба ребра пары \\(\\{va_i,vb_i\\}\\). Треугольник через общее ребро \\(uv\\) невозможен, потому что оно красное. Таким образом, \\(\\omega(R)\\ge3\\), а \\(\\omega(B)\\le2\\), и Красный строго выигрывает.",
