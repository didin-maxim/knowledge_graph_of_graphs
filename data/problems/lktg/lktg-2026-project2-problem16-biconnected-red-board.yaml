        "id": "stmt-original",
        "title": "Двусвязная доска для Красного",
        "text": "Красный и Синий по очереди красят свободные рёбра заранее выбранного конечного графа \\(H\\), начинает Красный. После окраски всех рёбер Красный выигрывает, если его наибольшая клика строго больше синей; иначе выигрывает Синий.\n\nДля каждого натурального \\(M\\) постройте двусвязный граф \\(H\\) хотя бы на \\(M\\) вершинах, на котором Красный имеет выигрышную стратегию. Здесь двусвязность означает, что граф связен и остаётся связным после удаления любой одной вершины.",
