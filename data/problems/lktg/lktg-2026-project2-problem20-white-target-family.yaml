        "title": "Приложение к белым гамильтоновым циклам",
        "text": "Пусть \\(n\\ge3\\). В игре \\(p:q\\) на рёбрах \\(K_n\\) в каждом раунде сначала Чингиз красит \\(p\\) свободных рёбер чёрным, затем Белла красит \\(q\\) свободных рёбер белым; при нехватке свободных рёбер игрок красит все оставшиеся. Через \\(W\\) обозначим итоговый белый граф, а через \\(h(W)\\) — число его гамильтоновых циклов; циклы, отличающиеся только выбором начальной вершины или направлением обхода, считаются одинаковыми. а) Докажите, что в игре \\(1:1\\) Чингиз может гарантировать \\[h(W)\\le\\left\\lfloor\\frac{(n-1)!}{2^{n+1}}\\right\\rfloor.\\] б) Докажите, что в игре \\(p:q\\) Чингиз может гарантировать \\[h(W)\\le\\left\\lfloor\\frac{(n-1)!}{2(p+1)^{n/q}}\\right\\rfloor.\\] в) Выведите, что при \\((p+1)^{n/q}>(n-1)!/2\\) Чингиз может не допустить появления белого гамильтонова цикла.",
