  "solutions": [
    {
      "id": "sol-official-white-target-lemma",
      "title": "Общая весовая лемма и приложения к кликам и гамильтоновым циклам",
      "text": "Сначала докажем пункт б). Цель \\(F\\in\\mathcal F\\) назовём живой, пока ни одно её ребро не окрашено чёрным. Положим \\(\\lambda=(p+1)^{1/q}\\). Если в живой цели осталось \\(r(F)\\) свободных рёбер, дадим ей вес \\(w(F)=\\lambda^{-r(F)}\\); неживая цель имеет вес \\(0\\). Потенциалом назовём сумму весов целей, а опасностью свободного ребра — сумму весов всех живых целей, которые его содержат.\n\nНа своём ходу Чингиз последовательно выбирает \\(p\\) свободных рёбер максимальной текущей опасности, пересчитывая опасности после каждого выбора. Пусть опасности выбранных рёбер равны \\(d_1\\ge\\cdots\\ge d_p\\), а после хода Чингиза наибольшая опасность свободного ребра равна \\(d\\). Тогда \\(d\\le d_p\\), а окраска выбранных рёбер в чёрный цвет уничтожила все содержащие их живые цели и уменьшила потенциал на \\(d_1+\\cdots+d_p\\ge pd\\).\n\nКогда Белла красит свободное ребро белым, вес каждой содержащей его живой цели умножается на \\(\\lambda\\). Перед её \\(j\\)-м выбором опасность любого ребра не превосходит \\(\\lambda^{j-1}d\\), потому что каждый предыдущий белый выбор мог увеличить любой вес не более чем в \\(\\lambda\\) раз. Поэтому общий прирост потенциала за не более чем \\(q\\) белых рёбер не превосходит\n\\[\n(\\lambda-1)d(1+\\lambda+\\cdots+\\lambda^{q-1})=(\\lambda^q-1)d=pd.\n\\]\nСледовательно, полный раунд не увеличивает потенциал. Если последний ход Чингиза неполон, он забирает все оставшиеся рёбра и Белла уже не ходит. Если неполон последний ход Беллы, её прирост лишь меньше оценённого. Значит, итоговый потенциал не превосходит начального\n\\[\n\\sum_{F\\in\\mathcal F}\\lambda^{-|F|}=\\sum_{F\\in\\mathcal F}(p+1)^{-|F|/q}.\n\\]\nВ конце живая цель не имеет свободных рёбер, то есть целиком белая, и её вес равен \\(1\\); все остальные цели имеют вес \\(0\\). Поэтому \\(N_{\\mathcal F}\\) не превосходит целой части начального потенциала, что доказывает б). При \\(p=q=1\\) имеем \\(\\lambda=2\\), и формула превращается в утверждение а).\n\nПриложения к кликам и гамильтоновым циклам.\n\nДля каждого \\(k\\)-вершинного множества возьмём целью все \\({k\\choose2}\\) рёбер между его вершинами. Таких целей \\({n\\choose k}\\). Полученная общая оценка сразу даёт пункт б), а её специализация \\(p=q=1\\) — пункт а).\n\nДля пункта в) положим \\(k=\\lceil2q\\log_{p+1}n\\rceil+2\\). Тогда \\(k-1>2q\\log_{p+1}n\\), и\n\\[\n{n\\choose k}(p+1)^{-{k\\choose2}/q}\\le n^k(p+1)^{-k(k-1)/(2q)}<1.\n\\]\nЕсли \\(k\\le n\\), пункт б) показывает, что белой \\(k\\)-клики нет; если \\(k>n\\), это и так очевидно. Значит, \\(\\omega(W)\\le k-1=\\lceil2q\\log_{p+1}n\\rceil+1\\). При \\(p=q=1\\) получаем \\(\\omega(W)\\le\\lceil2\\log_2n\\rceil+1\\).\n\nВ \\(K_n\\) имеется \\((n-1)!/2\\) гамильтоновых циклов: фиксируем начальную вершину, упорядочиваем остальные \\(n-1\\) вершин и делим на \\(2\\), поскольку два направления обхода задают один цикл. Каждый цикл содержит \\(n\\) рёбер. В общем случае весовая оценка даёт\n\\[\nh(W)\\le\\left\\lfloor\\frac{(n-1)!}{2}(p+1)^{-n/q}\\right\\rfloor=\\left\\lfloor\\frac{(n-1)!}{2(p+1)^{n/q}}\\right\\rfloor,\n\\]\nчто доказывает б). При \\(p=q=1\\) знаменатель равен \\(2\\cdot2^n=2^{n+1}\\), и получаем а). Если \\((p+1)^{n/q}>(n-1)!/2\\), выражение под знаком пола меньше \\(1\\), поэтому \\(h(W)=0\\); это пункт в).",
