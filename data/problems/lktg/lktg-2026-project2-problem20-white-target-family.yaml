        "id": "stmt-white-cliques",
        "title": "Приложение к белым кликам",
        "text": "Пусть \\(p,q\\ge 1\\) — целые числа. Игра идёт по раундам на рёбрах \\(K_n\\). В каждом раунде сначала Чингиз красит \\(p\\) свободных рёбер чёрным, а затем Белла красит \\(q\\) свободных рёбер белым. Если перед ходом игрока свободных рёбер меньше, чем ему разрешено покрасить, он красит все оставшиеся. Через \\(W\\) обозначим итоговый граф белых рёбер. В игре \\(1:1\\) полагается \\(p=q=1\\). Для \\(2\\le k\\le n\\) через \\(N_k\\) обозначим число множеств из \\(k\\) вершин, все рёбра между которыми в конце игры белые. Логарифм без указанного основания является натуральным. а) В игре \\(1:1\\) докажите, что Чингиз может гарантировать \\[N_k\\le \\left\\lfloor {n\\choose k}2^{-{k\\choose 2}}\\right\\rfloor.\\] б) В игре \\(p:q\\) докажите, что Чингиз может гарантировать \\[N_k\\le \\left\\lfloor {n\\choose k}(p+1)^{-{k\\choose 2}/q}\\right\\rfloor.\\] в) Выведите соответственно оценки \\[\\omega(W)\\le \\lceil 2\\log_2 n\\rceil+1\\quad\\text{и}\\quad \\omega(W)\\le \\lceil 2q\\log_{p+1}n\\rceil+1.\\]",
