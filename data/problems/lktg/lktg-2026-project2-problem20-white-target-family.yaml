        "id": "stmt-original",
        "title": "Семейство белых целей",
        "text": "Пусть \\(p,q\\ge1\\) — целые числа. Игра идёт по раундам на рёбрах \\(K_n\\): сначала Чингиз красит \\(p\\) свободных рёбер чёрным, затем Белла красит \\(q\\) свободных рёбер белым; при нехватке свободных рёбер игрок красит все оставшиеся. Пусть \\(\\mathcal F\\) — произвольное семейство непустых наборов рёбер графа \\(K_n\\). Через \\(N_{\\mathcal F}\\) обозначим число наборов \\(F\\in\\mathcal F\\), все рёбра которых в конце игры белые. а) Докажите, что в игре \\(1:1\\) Чингиз может гарантировать \\[N_{\\mathcal F}\\le\\left\\lfloor\\sum_{F\\in\\mathcal F}2^{-|F|}\\right\\rfloor.\\] б) Докажите, что в игре \\(p:q\\) Чингиз может гарантировать \\[N_{\\mathcal F}\\le\\left\\lfloor\\sum_{F\\in\\mathcal F}(p+1)^{-|F|/q}\\right\\rfloor.\\]",
