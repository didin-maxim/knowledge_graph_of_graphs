        "id": "stmt-problem01",
        "title": "Игра по непосещённым вершинам и четыре варианта",
        "text": "В конечном графе \\(G\\) Петя выбирает вершину \\(s\\), ставит туда фишку и объявляет её посещённой. Затем Петя и Вася по очереди передвигают фишку по ребру в ещё не посещённую вершину; первым передвигает фишку Вася. Кто не может сделать ход, проигрывает.\n\nа) Докажите, что Вася выигрывает тогда и только тогда, когда в \\(G\\) существует совершенное паросочетание, то есть паросочетание, покрывающее все вершины графа. В частности, при нечётном \\(|V(G)|\\) Петя выигрывает.\n\nб) Изменим правила: каждый игрок может один раз за партию вместо передвижения фишки пропустить ход. Пропуск разрешён и тогда, когда передвинуть фишку невозможно. Докажите, что критерий пункта а не изменится.\n\nв) Теперь Петя выбирает две различные вершины \\(s\\) и \\(t\\), ставит в каждую из них по фишке и объявляет обе вершины посещёнными. За ход игрок выбирает одну из фишек и передвигает её по ребру в ещё не посещённую вершину; первым ходит Вася. Для каждого чётного \\(n\\ge 4\\) постройте связный граф \\(G\\) на \\(n\\) вершинах, имеющий совершенное паросочетание, и укажите два выбора пары \\(\\{s,t\\}\\), при одном из которых выигрывает Вася, а при другом - Петя.\n\nг) Предположим, что в \\(G\\) нет ни совершенного паросочетания, ни изолированных вершин. Докажите, что Петя выигрывает не менее чем при двух различных выборах начальной вершины \\(s\\).",
        "source_id": "src-lktg-2026-project2-problems-ru",
