  "solutions": [
    {
      "id": "sol-problem01-complete",
      "title": "Полное решение пунктов а-г",
      "text": "а) Пусть в \\(G\\) есть совершенное паросочетание \\(M\\). После выбора Пети Вася идёт из стартовой вершины \\(s\\) в её пару по \\(M\\). В дальнейшем, если Петя пришёл в вершину \\(v\\), Вася идёт из \\(v\\) в парную ей вершину \\(M(v)\\). Этот ход всегда допустим. Действительно, ранее посещённые вершины после каждого хода Васи разбиваются на целиком посещённые пары из \\(M\\); поэтому если бы \\(M(v)\\) уже была посещена, вместе с ней была бы посещена и \\(v\\), хотя Петя только что впервые пришёл в \\(v\\). Значит, после каждого хода Пети ответ Васи существует. Игра конечна, поэтому первым без хода останется Петя.\n\nТеперь пусть совершенного паросочетания нет. Возьмём паросочетание \\(M\\) с наибольшим числом рёбер и выберем стартом непокрытую им вершину \\(s\\). Петя отвечает на приход Васи в вершину \\(v\\) ходом \\(vM(v)\\). Проверим, что ответ всегда возможен. Пройденный путь начинается в непокрытой вершине \\(s\\); ходы Пети идут по рёбрам \\(M\\), а ходы Васи не принадлежат \\(M\\), поскольку парное ребро ведёт назад в уже посещённую вершину. Если бы очередная вершина \\(v\\) также не была покрыта \\(M\\), то рёбра всего пройденного пути чередовались бы между не принадлежащими \\(M\\) и принадлежащими \\(M\\), начиная и заканчивая ребром вне \\(M\\). Удалив из \\(M\\) рёбра пути, принадлежащие \\(M\\), и добавив остальные рёбра пути, мы получили бы паросочетание на одно ребро больше, что невозможно. Следовательно, \\(M(v)\\) существует. Она ещё не посещена: после её первого посещения Петя немедленно посетил бы и \\(v\\). Итак, Петя всегда отвечает, а первым застревает Вася. При нечётном числе вершин совершенного паросочетания быть не может, поэтому Петя выигрывает.\n\nб) Игрок, имеющий выигрышную стратегию из пункта а, следует ей до тех пор, пока соперник не пропустит ход. На этот пропуск он немедленно отвечает своим пропуском. Положение фишки и множество посещённых вершин не изменились, а после двух пропусков ход снова принадлежит тому же игроку, которому он принадлежал до них; далее продолжается исходная стратегия. Если соперник пропустил из-за отсутствия обычного хода, то после ответного пропуска он снова получает то же безвыходное положение, но второго пропуска у него уже нет. Поэтому критерий не меняется.\n\nв) Для каждого чётного \\(n\\ge4\\) возьмём путь \\(v_1v_2\\ldots v_n\\). У него есть совершенное паросочетание \\(v_1v_2,v_3v_4,\\ldots,v_{n-1}v_n\\). Если Петя ставит фишки в \\(v_1\\) и \\(v_n\\), остальные \\(n-2\\) вершин неизбежно посещаются по одной с двух концов. Число ходов чётно, последний ход делает Петя, после чего Вася остаётся без хода; выигрывает Петя. Если же Петя ставит фишки в \\(v_1\\) и \\(v_{n-1}\\), Вася первым ходом переводит вторую фишку в \\(v_{n-2}\\). Вершина \\(v_n\\) навсегда отрезана посещённой вершиной \\(v_{n-1}\\). Затем доступные вершины \\(v_2,\\ldots,v_{n-3}\\) неизбежно разбираются с двух концов. Вместе с первым ходом получается \\(1+(n-4)=n-3\\) ходов, то есть нечётное число; последний ход делает Вася. При \\(n=4\\) во втором случае после единственного хода Васи обычных ходов уже нет, так что рассуждение также работает.\n\nг) Возьмём максимальное паросочетание \\(M\\) и непокрытую им вершину \\(s\\). Она не изолирована, поэтому имеет соседа \\(v\\). Вершина \\(v\\) покрыта некоторым ребром \\(vw\\in M\\), иначе к \\(M\\) можно было бы добавить \\(sv\\). Заменим в \\(M\\) ребро \\(vw\\) на \\(sv\\). Получится другое максимальное паросочетание, в котором не покрыта вершина \\(w\\). Вершины \\(s\\) и \\(w\\) различны. По доказательству пункта а Петя выигрывает, начиная с любой вершины, непокрытой некоторым максимальным паросочетанием. Следовательно, ему подходят по меньшей мере два различных старта: \\(s\\) и \\(w\\).",
