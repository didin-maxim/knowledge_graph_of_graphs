        "id": "stmt-problem09",
        "title": "Шесть шагов к теореме об игре ориентированного цикла",
        "text": "На неориентированном графе \\(G\\) игроки Циклист и Ациклист по очереди выбирают ещё не ориентированное ребро и направляют его в любую сторону. Циклист выигрывает немедленно, как только появляется ориентированный цикл длины не менее 3; если все рёбра ориентированы и цикла нет, выигрывает Ациклист.\n\nСток - вершина, из которой не выходит ни одной стрелки; источник - вершина, в которую не входит ни одной стрелки. Через \\(v(H)\\) и \\(e(H)\\) обозначим число вершин и число рёбер графа \\(H\\). Конечный простой граф \\(H\\) назовём минимальным плотным ядром, если \\(v(H)\\ge3\\), \\(e(H)=2v(H)-2\\), но для каждого собственного подграфа \\(F\\subsetneq H\\) с \\(v(F)\\ge3\\) выполнено \\(e(F)\\le2v(F)-3\\).\n\nа) Докажите, что на любом конечном простом 4-регулярном графе Циклист, ходя первым, имеет выигрышную стратегию.\n\nб) Игра идёт на минимальном плотном ядре \\(H\\). Первым ходит Ациклист, вторым - Циклист. В этом пункте игроки ориентируют все рёбра \\(H\\), даже если ориентированный цикл появился раньше. Докажите, что Циклист может гарантировать, что итоговая ориентация \\(H\\) не имеет стоков.\n\nв) На минимальном плотном ядре \\(H\\) Циклист ходит первым. Докажите, что он может играть так, чтобы либо появился ориентированный цикл, либо после ориентации всех рёбер итоговая ориентация не имела стоков или не имела источников.\n\nг) Выведите теорему Боллобаша-Сабо: если конечный простой граф \\(G\\) имеет \\(N\\ge3\\) вершин и не менее \\(2N-2\\) рёбер, то Циклист, ходя первым, имеет выигрышную стратегию.\n\nд) Докажите, что на любом конечном простом 4-регулярном графе Циклист выигрывает независимо от того, кто сделал первый ход. Далее пусть простой граф с \\(N\\) вершинами клеточно вложен в замкнутую связную ориентируемую поверхность рода \\(g\\ge1\\), а граница каждой грани имеет длину 4. Найдите число его рёбер и докажите, что Циклист выигрывает при обоих порядках хода.\n\nе) Корневым шаром радиуса \\(R\\) назовём подграф, порождённый вершинами на расстоянии не более \\(R\\) от отмеченного центра. Для каждого \\(R\\ge0\\) постройте конечный простой граф \\(G_R\\) и вершину \\(v_R\\), для которых корневой шар радиуса \\(R\\) с центром \\(v_R\\) изоморфен корневому шару радиуса \\(R\\) квадратной решётки, но при каждом из двух порядков хода победитель на \\(G_R\\) противоположен победителю в соответствующей игре на бесконечной решётке. Все параметры конструкции укажите явно.",
