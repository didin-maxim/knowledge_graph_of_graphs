      "text": "Сначала докажем нужный результат о бесконечной квадратной решётке, не ссылаясь на другую карточку. Ациклист выигрывает при обоих порядках хода. Если начинает Циклист, эталонно направим все горизонтальные рёбра вправо, а все вертикальные вверх. В каждую вершину входят два эталонных ребра - слева и снизу; объединим их в пару. После хода Циклиста Ациклист берёт второе ребро пары и направляет его так же относительно общей вершины, как первое. Ориентированный цикл невозможен. Эталонная ориентация любого конечного цикла ациклична, поскольку вдоль стрелок растут координаты, поэтому на цикле есть эталонный сток. Два соседних с ним ребра составляют одну пару, но в игровом ориентированном цикле одно должно входить в сток, а другое выходить, тогда как стратегия направляет их одинаково. Цикл не может появиться непосредственно после хода Циклиста: перед ним эта пара либо нетронута и оба её ребра ещё не могли войти в цикл, либо закончена и уже несовместима с циклом. Аргумент применим на бесконечном графе, потому что любой победный цикл конечен.\n\nЕсли начинает Ациклист, первым ходом она направляет ребро \\((0,-1)(0,0)\\) вверх. Эталонно направим все вертикальные рёбра вверх, горизонтальные рёбра строки \\(y=0\\) - от начала координат, а горизонтальные рёбра остальных строк - вправо. Эта ориентация ациклична: цикл с вертикальным ребром невозможен из-за строгого роста \\(y\\), а в одной строке стрелки образуют направленные пути. В начало координат входит только эталонное ребро первого хода; в каждую другую вершину входят ровно два эталонных ребра. Ациклист связывает эти двойки в пары и после каждого хода Циклиста отвечает на втором ребре, направляя пару одинаково относительно центра. Единственное непарное ребро уже занято первым ходом. Предыдущая проверка исключает цикл. Итак, на бесконечной решётке при обоих порядках выигрывает Ациклист.\n\nТеперь для заданного \\(R\\ge0\\) положим \\(L=2R+3\\) и \\(G_R=C_L\\square C_L\\). Иными словами, \\(V(G_R)=(\\mathbb Z/L\\mathbb Z)^2\\), а две вершины соединены, если отличаются на \\(\\pm1\\) ровно в одной координате. Возьмём \\(v_R=(0,0)\\). Тогда \\(|V(G_R)|=L^2=(2R+3)^2\\) и \\(|E(G_R)|=2L^2=2(2R+3)^2\\). Поскольку \\(L\\ge3\\), граф прост и 4-регулярен. По пункту д Циклист выигрывает на нём при обоих порядках.\n\nКаждая вершина корневого шара радиуса \\(R\\) имеет единственного представителя \\((x,y)\\in\\mathbb Z^2\\) с \\(|x|+|y|\\le R\\). Два разных представителя не совпадают по модулю \\(L\\), поскольку абсолютная разность каждой их координаты не превосходит \\(2R<L\\). Лишнего ребра через шов тора также нет: для ложного соседства абсолютная разность одной координаты должна равняться \\(L-1=2R+2\\), тогда как для двух представителей шара она не превосходит \\(2R\\). Поэтому порождённые корневые шары радиуса \\(R\\) в \\(G_R\\) и квадратной решётке изоморфны. На бесконечной решётке при обоих порядках выигрывает Ациклист, а на конечном \\(G_R\\) - Циклист, что и требовалось.",
