        "id": "stmt-square-grids",
        "title": "Формулировки для бесконечной и прямоугольной квадратных решёток",
        "text": "На неориентированном графе \\(G\\) Циклист и Ациклист по очереди выбирают ещё не ориентированное ребро и направляют его в любую сторону. Циклист выигрывает немедленно, как только появляется ориентированный цикл длины не менее 3; если все рёбра ориентированы и цикла нет, выигрывает Ациклист. На бесконечном графе Циклист должен создать конечный цикл за конечное число ходов; если этого никогда не происходит, выигрывает Ациклист.\n\nа) На бесконечной квадратной решётке с вершинами \\((x,y)\\in\\mathbb Z^2\\) и рёбрами между вершинами на расстоянии 1 определите победителя, когда первым ходит Циклист и когда первым ходит Ациклист.\n\nб) Пусть \\(m,n\\ge1\\), а \\(P_m\\square P_n\\) - конечная прямоугольная решётка, где \\(P_k\\) обозначает путь на \\(k\\) вершинах. Докажите, что Ациклист выигрывает, если \\(m\\) и \\(n\\) одной чётности и начинает Циклист, а также если \\(m\\) и \\(n\\) разной чётности и начинает Ациклист.",
