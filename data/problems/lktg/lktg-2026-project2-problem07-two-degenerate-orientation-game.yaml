    {
      "id": "sol-problem07-complete",
      "title": "Полное решение пунктов а и б",
      "text": "а) Пусть граф 2-вырожден. Будем по одной удалять вершины, каждый раз выбирая в оставшемся графе вершину степени не больше 2. Получим порядок \\(v_1,v_2,\\ldots,v_n\\), где \\(v_i\\) удалена раньше \\(v_{i+1}\\). Каждое ребро направим от вершины, удалённой позже, к вершине, удалённой раньше. В вершину \\(v_i\\) входят только рёбра, соединявшие её в момент удаления с ещё не удалёнными вершинами, поэтому входящая степень не больше 2. Вдоль каждой стрелки индекс вершины уменьшается, так что ориентированного цикла нет.\n\nОбратно, пусть дана ациклическая ориентация, в которой входящая степень каждой вершины не больше 2. Возьмём любой непустой подграф и ограничим на него ориентацию; она остаётся ациклической. В конечном ациклическом ориентированном графе есть сток. Иначе из каждой вершины выходила бы стрелка, и, всё время двигаясь по стрелкам, мы в конечном графе повторили бы вершину и получили ориентированный цикл. У стока все рёбра рассматриваемого подграфа входят в него, поэтому его степень не больше 2. Следовательно, исходный граф 2-вырожден.\n\nб) Выберем эталонную ациклическую ориентацию \\(D\\) из пункта а. Для каждой вершины, в которую в \\(D\\) входят ровно два ребра, объединим эти рёбра в пару. Пары не пересекаются, потому что каждое ребро входит ровно в одну из своих вершин.\n\nКлючевое наблюдение: если в настоящей игре два ребра каждой такой пары направлены одинаково относительно их общей вершины - либо оба входят, либо оба выходят, - то ориентированного цикла нет. Действительно, предположим, что цикл появился. Ограничим эталонную ориентацию \\(D\\) на рёбра этого цикла. Она ациклична, поэтому на цикле есть сток: вершина, в которую в \\(D\\) входят оба соседних ребра цикла. Эти два ребра образуют выделенную пару. Но в настоящем ориентированном цикле одно из них входит в вершину, а другое выходит, что противоречит условию пары.\n\nЕсли \\(|E(G)|\\) чётно и начинает Циклист, число рёбер, не вошедших в выделенные пары, тоже чётно. Произвольно разобьём их на пары. После каждого хода Циклиста Ациклист берёт второе ребро той же пары. Для выделенной пары он выбирает направление так, чтобы оба ребра одинаково смотрели относительно общей вершины; для произвольной пары направление ответа неважно.\n\nЕсли \\(|E(G)|\\) нечётно и начинает Ациклист, среди непарных рёбер есть хотя бы одно, поскольку выделенные пары содержат чётное число рёбер. Первым ходом Ациклист ориентирует одно непарное ребро как угодно. После этого оставшиеся непарные рёбра разбиваются на пары, и далее действует то же правило ответа.\n\nОстаётся проверить, что Циклист не успеет замкнуть цикл своим ходом до ответа Ациклиста. Перед каждым его ходом любая выделенная пара либо не тронута, либо уже закончена и направлена одинаково относительно центра. Если новая стрелка замкнула цикл, возьмём сток эталонной ориентации \\(D\\) на этом цикле. Оба соседних с ним ребра образуют выделенную пару. Она не могла быть закончена раньше, потому что её направления несовместимы с циклом; она не могла быть и нетронутой, потому что оба её ребра уже входят в возникший цикл. Противоречие. После ответа Ациклиста парный инвариант снова выполнен. Значит, цикл не возникает ни после чьего хода, и Ациклист выигрывает.",
