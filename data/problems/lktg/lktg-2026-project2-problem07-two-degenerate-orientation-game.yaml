      {
        "id": "stmt-problem07",
        "title": "Ориентация 2-вырожденного графа и игра на его рёбрах",
        "text": "В игре на неориентированном графе \\(G\\) Циклист и Ациклист по очереди выбирают ещё не ориентированное ребро и направляют его в любую сторону. Циклист выигрывает немедленно, как только появляется ориентированный цикл длины не менее 3; если все рёбра ориентированы и такого цикла нет, выигрывает Ациклист.\n\nГраф называется 2-вырожденным, если в каждом его непустом подграфе есть вершина степени не больше 2.\n\nа) Докажите, что граф 2-вырожден тогда и только тогда, когда существует ациклическая ориентация всех его рёбер с входящей степенью каждой вершины не больше 2. В этом пункте игра не ведётся: нужно лишь ориентировать рёбра графа.\n\nб) Пусть \\(G\\) - конечный 2-вырожденный граф. Докажите, что Ациклист выигрывает, если \\(|E(G)|\\) чётно и начинает Циклист, а также если \\(|E(G)|\\) нечётно и начинает Ациклист.",
