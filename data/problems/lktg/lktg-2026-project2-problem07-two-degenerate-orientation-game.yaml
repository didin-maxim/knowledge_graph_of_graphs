    {
      "id": "sol-square-grid-pairing",
      "title": "Геометрическая реализация парной стратегии на решётке",
      "text": "а) На бесконечной квадратной решётке Ациклист выигрывает при обоих порядках хода.\n\nПусть начинает Циклист. В качестве эталонной ориентации \\(D\\) направим все горизонтальные рёбра вправо, а вертикальные вверх. В каждую вершину входят ровно два эталонных ребра - слева и снизу; объединим их в пару. После хода Циклиста Ациклист берёт второе ребро той же пары и направляет его так же относительно общей вершины, как первое. Ориентированный цикл невозможен: ограниченная на его рёбра эталонная ориентация ациклична, потому что вдоль каждой её стрелки растёт хотя бы одна координата. Поэтому на цикле есть эталонный сток, и два соседних с ним ребра составляют пару. В игровом ориентированном цикле одно из них входит в сток, а другое выходит, тогда как стратегия направляет их одинаково относительно центра. Цикл не может появиться и непосредственно после хода Циклиста: перед этим соответствующая структурная пара либо нетронута, либо уже закончена; в первом случае оба её ребра не могли оказаться в новом цикле, во втором их направления несовместимы с циклом. Бесконечность решётки не мешает доказательству, потому что любой победный цикл конечен.\n\nПусть начинает Ациклист. Первым ходом она направляет ребро \\((0,-1)(0,0)\\) вверх. Построим изменённую эталонную ориентацию: все вертикальные рёбра направлены вверх; на строке \\(y=0\\) горизонтальные рёбра направлены от начала координат; на остальных строках горизонтальные рёбра направлены вправо. Эта ориентация ациклична. Вдоль вертикальной стрелки координата \\(y\\) строго растёт, поэтому цикл не может содержать вертикальных рёбер; внутри каждой строки стрелки образуют направленные пути без циклов. В начало координат входит ровно одно эталонное ребро - уже ориентированное первым ходом. В каждую другую вершину входят ровно два ребра. Их Ациклист попарно связывает и далее отвечает по тому же правилу. Единственное непарное ребро уже занято первым ходом, поэтому ориентированный цикл не возникнет.\n\nб) В графе \\(P_m\\square P_n\\) число рёбер равно\n\\[m(n-1)+n(m-1)=2mn-m-n,\\]\nа значит, \\(|E(P_m\\square P_n)|\\equiv m+n\\pmod2\\). Дадим независимую парную стратегию. Мысленно направим все горизонтальные рёбра вправо, а вертикальные вверх. В каждой вершине, имеющей соседа слева и соседа снизу, объединим два приходящих от них ребра в структурную пару. Остальные рёбра пока оставим без пары.\n\nЕсли число рёбер чётно и начинает Циклист, оставшихся рёбер тоже чётное число; произвольно разобьём их на пары. Если число рёбер нечётно и начинает Ациклист, оставшихся рёбер нечётное и положительное число. Первым ходом Ациклист ориентирует одно из них как угодно, а остальные разбивает на пары. Далее после хода Циклиста она всегда берёт второе ребро той же пары. В структурной паре два ребра направляются одинаково относительно общей вершины; в произвольной паре направление ответа неважно.\n\nОриентированный цикл невозможен. В любом цикле решётки возьмём вершину с наибольшей суммой координат. Оба ребра цикла при этой вершине идут влево и вниз, то есть образуют структурную пару. Но в ориентированном цикле одно из них входит в вершину, а другое выходит, тогда как стратегия направляет их одинаково относительно вершины. Цикл не возникает и сразу после хода Циклиста по той же проверке нетронутой или уже законченной пары. Значит, Ациклист выигрывает. Чётность числа рёбер совпадает с чётностью \\(m+n\\): она чётна, когда \\(m,n\\) одной чётности, и нечётна, когда они разной чётности. Это даёт оба требуемых случая. При \\(m=n=1\\) рёбер нет, и Ациклист выигрывает автоматически.",
