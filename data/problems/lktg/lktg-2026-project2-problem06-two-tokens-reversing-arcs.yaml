        "id": "stmt-problem06",
        "title": "Достижение цели при развороте каждого пройденного ребра",
        "text": "На конечном ориентированном графе выбраны две различные вершины \\(A\\) и \\(B\\). В \\(A\\) стоит фишка Пети, в \\(B\\) - фишка Васи; из \\(A\\) в \\(B\\) существует ориентированный путь. При каждом передвижении фишка идёт по выходящей стрелке, после чего направление пройденного ребра немедленно меняется на противоположное. Фишки могут находиться в одной вершине; положение одной фишки никак не ограничивает движение другой. Петя хочет привести свою фишку в вершину \\(B\\).\n\nа) Сначала Вася совершает любое конечное число допустимых передвижений своей фишки, возможно ни одного, и после этого больше не ходит. Затем ходит только Петя. Докажите, что после любых ходов Васи Петя может попасть в \\(B\\).\n\nб) Теперь игроки ходят по очереди, начинает Петя. За ход игрок может либо пропустить ход, либо передвинуть свою фишку. Петя выигрывает, как только его фишка впервые попадает в \\(B\\); если этого никогда не происходит, выигрывает Вася. Существует ли исходный ориентированный граф, на котором Вася может помешать Пете выиграть?",
