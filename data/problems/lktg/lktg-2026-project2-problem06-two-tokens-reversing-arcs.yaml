  "solutions": [
    {
      "id": "sol-problem06-complete",
      "title": "Полное решение через два пути и целый потенциал",
      "text": "В каждый момент будем поддерживать два направленных пути к цели: \\(P\\) идёт от текущего положения фишки Пети до \\(B\\), а \\(Q\\) - от текущего положения фишки Васи до \\(B\\). Пути не имеют общих рёбер, хотя могут иметь общие вершины. Изначально \\(P\\) - данный в условии путь из \\(A\\) в \\(B\\), а \\(Q\\) - пустой путь из \\(B\\) в \\(B\\).\n\nОпишем перестройку. На своём ходу Петя проходит первое ребро \\(P\\); после разворота это ребро удаляется из \\(P\\). Если \\(P\\) стал пустым, Петя уже находится в \\(B\\). Пусть Вася прошёл по ребру \\(q\\to r\\), которое после хода стало \\(r\\to q\\). Если ребро \\(qr\\) не лежало ни в \\(P\\), ни в \\(Q\\), допишем \\(r\\to q\\) в начало \\(Q\\). Если \\(q\\to r\\) лежало в \\(Q\\), оно было первым ребром \\(Q\\), и мы удаляем его. Если \\(q\\to r\\) лежало в \\(P\\), представим\n\\[P=P_0+(q\\to r)+P_1\\]\nи заменим пути по правилу\n\\[P\\leftarrow P_0+Q,\\qquad Q\\leftarrow P_1.\\]\nЭто пересадка хвостов в вершине \\(q\\). Старые пути не имели общих рёбер, а перевёрнутое ребро из обоих новых маршрутов удалено, поэтому новые маршруты также не имеют общих рёбер. Если после склейки какая-либо вершина встречается дважды, вырежем заключённый между двумя появлениями направленный цикл. Так направленный маршрут превращается в простой направленный путь; концы, ориентация и отсутствие общих рёбер сохраняются. В первом случае возникающие циклы удаляются тем же способом. Значит, инвариант всегда можно поддержать.\n\nа) После каждого из конечного числа ходов Васи перестраиваем \\(P,Q\\) по этим правилам. Когда Вася остановился, путь \\(P\\) направлен из \\(A\\) в \\(B\\). Петя проходит его по порядку. После каждого хода разворачивается только уже пройденное и удалённое из \\(P\\) ребро, поэтому оставшийся хвост по-прежнему направлен к \\(B\\). Петя достигает цели.\n\nб) Ответ: такого исходного графа не существует; Петя выигрывает на любом допустимом графе. Петя никогда не пропускает ход, пока \\(P\\) непуст. Положим\n\\[S=|P|+|Q|+\\varepsilon,\\]\nгде \\(\\varepsilon=0\\) перед ходом Пети и \\(\\varepsilon=1\\) перед ходом Васи. На ходу Пети длина \\(P\\) уменьшается на 1, а \\(\\varepsilon\\) меняется с 0 на 1, поэтому \\(S\\) не меняется. После хода Васи \\(\\varepsilon\\) меняется с 1 на 0. Если он прошёл по ребру вне \\(P\\cup Q\\), длина \\(Q\\) выросла не более чем на 1, поэтому \\(S\\) не увеличилась. Если он прошёл по \\(Q\\), длина \\(Q\\) уменьшилась на 1. При пересадке хвостов из суммарной длины исчезло ребро \\(qr\\), поэтому\n\\[|P_{\\rm new}|+|Q_{\\rm new}|\\le |P_{\\rm old}|+|Q_{\\rm old}|-1.\\]\nЕсли Вася пропускает ход, пути не меняются, а \\(\\varepsilon\\) уменьшается на 1. Следовательно, \\(S\\) - неотрицательное целое число, которое не возрастает после каждого хода; во всех случаях, кроме прохода Васи по новому ребру вне обоих путей без потерь при удалении циклов, ход Васи строго уменьшает \\(S\\).\n\nПредположим, что партия бесконечна. Неотрицательная целая величина \\(S\\) не может строго уменьшаться бесконечно, поэтому с некоторого момента постоянна. Тогда каждый ход Васи обязан быть единственным случаем равенства: он проходит по ребру вне \\(P\\cup Q\\), добавляет к \\(Q\\) ровно одно ребро и при удалении циклов ничего не теряется. Такой ход не меняет \\(P\\). Но каждый ход Пети удаляет первое ребро \\(P\\). Следовательно, через конечное число ходов \\(P\\) станет пустым, и Петя попадёт в \\(B\\), противоречие. Значит, Петя обязательно выигрывает.\n\nПолучим также явную оценку. Пусть в исходном графе \\(n\\) вершин и \\(L_0=|P_0|\\le n-1\\). Рассмотрим \\(L=|P|+|Q|\\) перед ходами Пети. За полный раунд \\(L\\) не возрастает. Пока \\(L=k\\) и не уменьшается, Вася каждый раз попадает в случай равенства и не меняет \\(P\\), а Петя укорачивает \\(P\\) на одно ребро. Поэтому не более чем через \\(k\\) ходов Пети величина \\(L\\) уменьшится или Петя победит. Число ходов Пети не превосходит\n\\[L_0+(L_0-1)+\\cdots+1\\le\\frac{n(n-1)}2.\\]",
