  "solutions": [
    {
      "id": "sol-official-parts-a-d",
      "title": "Решение закрытых подпунктов а–д",
      "text": "Ходом Беллы всюду называется одно белое ребро.\n\nа) Построим конечное вспомогательное дерево с уровнями \\(0,1,\\ldots,r-1\\): на уровне 0 один корень, а из каждой вершины уровней до \\(r-2\\) выходит \\(b+1\\) ветвей. Белла постепенно сопоставляет некоторым вершинам дерева различные вершины \\(K_\\infty\\), называемые представителями, и поддерживает инвариант: представители любых двух занятых вершин, лежащих на одном пути от корня вниз, соединены белым ребром.\n\nКорень получает произвольного представителя. Для очередной попытки Белла выбирает новую вершину \\(u\\) бесконечного графа, не имеющую чёрных рёбер ни к одному уже выбранному представителю. Такая вершина существует, потому что к этому моменту выбрано и окрашено лишь конечное число вершин и рёбер. Затем Белла начинает в корне. Стоя в занятой вершине дерева \\(x\\), она красит белым ребро от \\(u\\) к представителю \\(x\\). Под \\(x\\) есть \\(b+1\\) ветвей, а ответ Чингиза содержит только \\(b\\) чёрных рёбер, поэтому хотя бы в одной ветви нет чёрного ребра от \\(u\\) к занятому представителю. Белла выбирает такую ветвь. Если её первый сын занят, она спускается в него и повторяет шаг; если нет, делает \\(u\\) его представителем и заканчивает попытку.\n\nНовый представитель бело соединён со всеми занятыми предками на выбранном пути, поэтому инвариант сохраняется. Старые чёрные ответы ведут в уже отброшенные ветви и не мешают дальнейшему спуску. Если Белла дошла до занятой вершины уровня \\(r-2\\), следующий белый ход соединяет новую вершину со всеми \\(r-1\\) представителями пути; вместе они образуют белый \\(K_r\\). Бесконечного числа неудачных попыток быть не может: каждая занимает новую вершину конечного вспомогательного дерева. Следовательно, Белла выигрывает.\n\nЧтобы занять вершину уровня \\(j\\), нужно \\(j\\) белых рёбер; на уровне \\(j\\) находится \\((b+1)^j\\) вершин. Даже если заняты все уровни \\(1,\\ldots,r-2\\), а затем один лист, получаем\n\\[\nT_b(r)\\le\\sum_{j=0}^{r-2}j(b+1)^j+(r-1),\n\\]\nчто, в частности, доказывает конечность.\n\nб) Верхняя оценка. Белла выбирает вершину \\(v\\) и последовательно проводит \\(b+2\\) белых рёбер \\(vx_1,\\ldots,vx_{b+2}\\). Каждую новую \\(x_i\\) она выбирает так, чтобы все рёбра от неё к ранее названным вершинам были свободны; это возможно, поскольку окрашено конечное число рёбер. После хода \\(vx_{b+2}\\) все \\(b+1\\) рёбер от \\(x_{b+2}\\) к \\(x_1,\\ldots,x_{b+1}\\) свободны и каждое завершает белый треугольник с \\(v\\). Чингиз закрашивает не более \\(b\\) из них, после чего Белла берёт оставшееся. Значит, \\(T_b(3)\\le b+3\\).\n\nНижняя оценка. Назовём свободное ребро опасным, если оно немедленно завершает белый треугольник. После каждого из первых \\(b+1\\) белых ходов Чингиз красит чёрным все новые опасные рёбра. После \\(t\\)-го белого ребра \\(uv\\) всякое новое опасное ребро образует треугольник вместе с \\(uv\\) и одним из прежних \\(t-1\\) белых рёбер; каждое прежнее ребро создаёт не больше одной новой опасности. Поэтому новых опасных рёбер не больше \\(t-1\\le b\\), и Чингиз успевает их закрыть. После ответа на \\((b+1)\\)-й ход опасных рёбер нет, так что \\((b+2)\\)-м ходом Белла ещё не выигрывает. Итак, \\(T_b(3)=b+3\\).\n\nДля в) и г) докажем весовую лемму. Пусть \\(X\\) — конечное множество игровых элементов, \\(\\mathcal F\\) — семейство непустых целей \\(A\\subseteq X\\). Белла берёт за ход один элемент, Чингиз — \\(b\\); Белла выигрывает, собрав целиком хотя бы одну цель. Положим \\(\\lambda=b+1\\). Доступной назовём цель без элемента Чингиза. Если в ней осталось \\(u(A)\\) свободных элементов, дадим ей вес \\(\\lambda^{-u(A)}\\); недоступная цель имеет вес 0. Пусть \\(\\Phi\\) — сумма весов.\n\nЛемма. Если до игры\n\\[\n\\sum_{A\\in\\mathcal F}\\lambda^{-|A|}<\\frac1\\lambda, \\tag{2}\n\\]\nто Чингиз не даст Белле собрать цель.\n\nДоказательство. Первый белый ход увеличивает вес каждой затронутой цели не более чем в \\(\\lambda\\) раз, поэтому после него \\(\\Phi<1\\). Далее для каждого свободного элемента сложим веса содержащих его доступных целей; Чингиз каждый раз берёт элемент с наибольшей такой суммой. Рассмотрим следующий белый элемент \\(x\\), и пусть после всех \\(b\\) чёрных выборов сумма весов доступных целей с \\(x\\) равна \\(L\\). Во время каждого выбора Чингиза элемент \\(x\\) был свободен, следовательно выбранный элемент имел сумму не меньше \\(L\\) и уничтожал цели суммарного веса не меньше \\(L\\). За \\(b\\) выборов потенциал уменьшился хотя бы на \\(bL\\). Белый ход \\(x\\) умножает веса сохранившихся целей с \\(x\\) на \\(\\lambda\\), увеличивая потенциал на \\((\\lambda-1)L=bL\\). Поэтому после белых ходов \\(\\Phi\\) не возрастает и остаётся меньше 1. Полностью собранная цель имела бы вес 1, что невозможно.\n\nДля защиты только в течение первых \\(t\\) белых ходов на \\(K_\\infty\\) достаточно конечного \\(K_N\\), где \\(N=2(b+1)t\\): за \\(t\\) раундов окрашивается не более \\((b+1)t\\) рёбер и встречается не более \\(N\\) их концов. Новым настоящим вершинам по мере появления присваиваются разные имена вершин \\(K_N\\); если конечная стратегия просит ребро с новым именем, ему сопоставляется новая вершина бесконечного графа. Так конечная защита переносится на первые \\(t\\) ходов.\n\nв) Нижняя оценка для \\(b=1\\). Положим \\(t=\\lfloor2^{r/2}\\rfloor-1\\), \\(N=4t<2^{r/2+2}\\). Цели — множества всех \\(\\binom r2\\) рёбер на каждом наборе из \\(r\\) вершин; их \\(\\binom Nr\\). При \\(\\lambda=2\\) условие (2) следует из\n\\[\n\\binom Nr<2^{\\binom r2-1}. \\tag{3}\n\\]\nТак как \\(\\binom Nr<N^r/r!<2^{r^2/2+2r}/r!\\), достаточно \\(r!>2^{5r/2+1}\\). Для \\(r=17\\) это верно: \\(17!=355687428096000>2^{43.5}\\). При переходе от \\(r\\) к \\(r+1\\) левая часть умножается на \\(r+1\\ge18\\), правая — на \\(2^{5/2}<6\\), поэтому неравенство сохраняется для всех \\(r\\ge17\\). Весовая лемма защищает первые \\(t\\) ходов, значит \\(T_1(r)\\ge t+1=\\lfloor2^{r/2}\\rfloor\\).\n\nВерхняя оценка получается из пункта а) при \\(b=1\\). Индукцией проверяется\n\\[\n\\sum_{j=0}^{r-2}j2^j=(r-3)2^{r-1}+2.\n\\]\nПоэтому \\(T_1(r)\\le(r-3)2^{r-1}+r+1\\).\n\nг) Нижняя оценка для \\(b=2\\). Положим \\(t=\\lfloor3^{r/2}\\rfloor-1\\), \\(N=6t<6\\cdot3^{r/2}\\). Теперь \\(\\lambda=3\\), и достаточно\n\\[\n\\binom Nr<3^{\\binom r2-1}. \\tag{4}\n\\]\nИз \\(\\binom Nr<N^r/r!<6^r3^{r^2/2}/r!\\) видно, что (4) следует из \\(r!>6^r3^{r/2+1}\\). При \\(r=30\\) прямое сравнение даёт\n\\[\n30!=265252859812191058636308480000000>6^{30}3^{16}=9516507342594806772904803434496.\n\\]\nПри увеличении \\(r\\) левая часть умножается на \\(r+1\\ge31\\), правая — на \\(6\\sqrt3<12\\), поэтому неравенство верно для всех \\(r\\ge30\\). Весовая лемма даёт \\(T_2(r)\\ge\\lfloor3^{r/2}\\rfloor\\).\n\nИз пункта а) при \\(b=2\\) следует даже\n\\[\nT_2(r)\\le\\sum_{j=0}^{r-2}j3^j+r-1,\n\\]\nа значит и заявленная оценка с \\(r+1\\). Кроме того,\n\\[\n\\sum_{j=0}^{r-2}j3^j\\le(r-2)\\sum_{j=0}^{r-2}3^j=\\frac{r-2}{2}(3^{r-1}-1).\n\\]\nПри \\(r\\ge2\\) последняя величина вместе с \\(r+1\\) меньше \\(r3^{r-1}\\), что завершает пункт г).\n\nд) Оценка Бека. Сначала докажем лемму о выборе половины. Пусть дан граф \\(F\\) на чётном числе вершин. Два игрока по очереди выбирают по одной ещё не выбранной вершине, начинает Первый. Тогда Первый может добиться, чтобы внутри выбранного им множества было не больше \\(e(F)/4\\) рёбер.\n\nСледим за рёбрами, ни один конец которых ещё не выбрал Второй. Если у такого ребра свободны \\(s\\) концов, даём ему вес \\(2^{-s}\\). Изначально общий вес равен \\(e(F)/4\\). Первый выбирает вершину с наименьшей суммой весов выходящих сохраняющихся рёбер; его ход удваивает веса этих рёбер и увеличивает общий вес ровно на найденную сумму. Затем Второй выбирает вершину и уничтожает все сохраняющиеся рёбра из неё. До хода Первого сумма у этой вершины была не меньше выбранного минимума, а после могла только возрасти, поэтому Второй уничтожает вес не меньше только что добавленного. После каждой пары ходов вес не растёт. В конце сохраняются рёбра с обоими концами у Первого, каждое веса 1, и их не больше \\(e(F)/4\\).\n\nПоложим \\(n=r+2\\) и выберем в \\(K_\\infty\\) множество \\(V_0\\) из \\(2^n\\) вершин. Белла построит вложенные множества \\(V_0\\supset V_1\\supset\\cdots\\) и вершины \\(u_1,u_2,\\ldots\\), причём \\(u_i\\) бело соединена со всем \\(V_i\\). Сначала она выбирает \\(u_1\\in V_0\\) и проводит лучи, пока не получит \\(s_1=2^{n-1}\\) белых соседей; это возможно, потому что из \\(u_1\\) к остальным выходит \\(2^n-1=2s_1-1\\) рёбер, а Чингиз между белыми ходами отнимает не больше одного. Эти соседи образуют \\(V_1\\).\n\nПусть \\(s_i=|V_i|\\), \\(e_i\\) — число чёрных рёбер внутри \\(V_i\\), \\(\\delta_i\\) — наименьшая чёрная степень в \\(V_i\\). На первом шаге \\(e_1\\le s_1\\), поэтому \\(\\delta_1\\le2e_1/s_1\\le2\\).\n\nЧтобы построить \\(V_i\\) из \\(V_{i-1}\\), выберем вершину \\(u_i\\) чёрной степени \\(\\delta_{i-1}\\), удалим её и всех её чёрных соседей, а из оставшихся возьмём наибольшее чётное множество \\(A\\). Все лучи из \\(u_i\\) в \\(A\\) свободны: чёрных нет по выбору, а белые рёбра прошлых шагов имели центры \\(u_j\\notin V_j\\), так что внутри текущего множества белых рёбер нет. На графе старых чёрных рёбер внутри \\(A\\) мысленно разыграем лемму о половине. Когда Первый выбирает \\(x\\), Белла красит \\(u_ix\\). Если Чингиз отвечает лучом \\(u_iy\\) к ещё не выбранной вершине \\(A\\), считаем, что Второй выбрал \\(y\\); иначе Второму отдаём любую свободную вершину. Предписанный Белле луч всегда свободен: вершина, луч к которой Чингиз уже занял, тогда же отдана Второму. Множество вершин Первого объявим \\(V_i\\). Тогда\n\\[\ns_i=\\left\\lfloor\\frac{s_{i-1}-1-\\delta_{i-1}}2\\right\\rfloor, \\tag{5}\n\\]\nа по лемме и с учётом не более одного нового чёрного ребра на белый ход\n\\[\ne_i\\le\\frac{e_{i-1}}4+s_i. \\tag{6}\n\\]\n\nДокажем индукцией, что при \\(1\\le i\\le n-4\\)\n\\[\n2^{n-i}-7\\le s_i\\le2^{n-i},\\qquad\\delta_i\\le5. \\tag{7}\n\\]\nБаза следует из определения \\(s_1\\) и оценки \\(\\delta_1\\). Пусть утверждение известно для \\(i-1\\), обозначим \\(x=2^{n-i}\\). Тогда \\(s_{i-1}\\ge2x-7\\), \\(\\delta_{i-1}\\le5\\), и (5), включая округление вниз, даёт \\(s_i\\ge((2x-7)-5-2)/2=x-7\\); верхняя оценка очевидна. Повторяя (6), получаем\n\\[\ne_i\\le s_i+\\frac{s_{i-1}}4+\\frac{s_{i-2}}{4^2}+\\cdots<s_i+x,\n\\]\nпоскольку \\(s_{i-k}\\le2^kx\\) и \\(\\sum_{k\\ge1}2^k/4^k=1\\). В рассматриваемом диапазоне \\(x\\ge16\\), \\(s_i\\ge x-7\\), поэтому средняя чёрная степень меньше\n\\[\n\\frac{2(s_i+x)}{s_i}\\le2+\\frac{2x}{x-7}\\le2+\\frac{32}{9}<6.\n\\]\nСледовательно, есть вершина чёрной степени не больше 5, то есть \\(\\delta_i\\le5\\). Индукция завершена.\n\nПри \\(i=n-4\\) имеем \\(|V_{n-4}|\\ge16-7=9\\) и \\(\\delta_{n-4}\\le5\\). Выберем \\(u_{n-3}\\) минимальной чёрной степени; после удаления её и не более пяти чёрных соседей остаётся вершина \\(u_{n-2}\\), причём ребро между ними свободно. Белла красит его белым. Вершины \\(u_1,\\ldots,u_{n-2}\\) образуют белую клику: при \\(j<k\\) вершина \\(u_k\\) лежала в \\(V_j\\), а \\(u_j\\) была бело соединена со всем \\(V_j\\); последнее ребро проведено отдельно. Размер клики равен \\(n-2=r\\).\n\nНа построение \\(V_i\\) ушло \\(s_i\\) ходов и ещё один ход в конце. По (7)\n\\[\n\\sum_{i=1}^{n-4}s_i+1\\le\\sum_{i=1}^{n-4}2^{n-i}+1<2^n=2^{r+2}.\n\\]\nПри \\(r=2\\) Белла выигрывает первым ходом, поэтому оценка \\(T_1(r)<2^{r+2}\\) доказана для всех \\(r\\ge2\\).\n\nПодпункт е) об улучшении асимптотического разрыва открыт; решения для него официальный PDF не приводит.",
