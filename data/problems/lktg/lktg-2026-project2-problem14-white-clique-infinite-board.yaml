        "title": "Белая клика на бесконечной доске",
        "text": "Пусть \\(b\\ge1\\) и \\(r\\ge2\\) — целые числа. На рёбрах счётного полного графа \\(K_\\infty\\) Белла и Чингиз играют по раундам: Белла красит одно свободное ребро белым, затем Чингиз красит \\(b\\) свободных рёбер чёрным. Белла выигрывает сразу после появления белой клики \\(K_r\\). Через \\(T_b(r)\\) обозначим наименьшее число ходов Беллы, за которое она может гарантировать победу.\n\nа) Докажите, что для всех \\(b\\ge1\\), \\(r\\ge2\\) Белла имеет выигрышную стратегию; в частности, \\(T_b(r)\\) конечно.\n\nб) Докажите, что \\(T_b(3)=b+3\\).\n\nв) При \\(r\\ge17\\) докажите\n\\[\n\\lfloor2^{r/2}\\rfloor\\le T_1(r)\\le(r-3)2^{r-1}+r+1.\n\\]\n\nг) При \\(r\\ge30\\) докажите\n\\[\n\\lfloor3^{r/2}\\rfloor\\le T_2(r)\\le\\sum_{j=0}^{r-2}j3^j+r+1<r3^{r-1}.\n\\]\n\nд) Докажите оценку Бека \\(T_1(r)<2^{r+2}\\).\n\nе★) Улучшите при больших \\(r\\) расхождение между лучшими известными оценками\n\\[\n2^{r/2}\\le T_1(r)\\le2r^7 2^{2r/3}.\n\\]\nВ официальном комментарии сказано, что верхняя оценка в е) принадлежит Гебауэру и сильнее оценки Бека, но её известное доказательство слишком техническое для проекта. Подпункт е) является открытым и решения в официальном сборнике не имеет.",
