      "id": "stmt-original", "title": "Белая клика и чёрные степени",
      "text": "В игре \\(p:1\\) каждого раунда Чингиз первым красит \\(p\\) свободных рёбер чёрным, а затем Белла красит одно свободное ребро белым. Если свободных рёбер не хватает, игрок красит все оставшиеся. Через \\(B\\) и \\(W\\) обозначим итоговые графы. а) Докажите, что для каждого \\(\\varepsilon>0\\) при всех достаточно больших \\(n\\) Чингиз в игре \\(1:1\\) может одной стратегией одновременно гарантировать \\[\\omega(W)\\le\\lceil2\\log_2n\\rceil+1\\quad\\text{и}\\quad\\delta(B)\\ge\\left(\\frac12-\\varepsilon\\right)(n-1).\\] б) Докажите, что для любых фиксированных \\(p\\ge1\\) и \\(\\varepsilon>0\\) при всех достаточно больших \\(n\\) Чингиз в игре \\(p:1\\) может одной стратегией одновременно гарантировать \\[\\omega(W)\\le\\lceil2\\log_{p+1}n\\rceil+1\\quad\\text{и}\\quad\\delta(B)\\ge\\left(\\frac{p}{p+1}-\\varepsilon\\right)(n-1).\\]",
