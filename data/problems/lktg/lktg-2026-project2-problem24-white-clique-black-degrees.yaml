    "id": "sol-official-combined-potential", "title": "Многотипная весовая лемма и две одновременные оценки",
    "text": "Докажем пункт б); пункт а) получится при \\(p=1\\). Сначала докажем весовую лемму для нескольких типов целей в игре \\(p:1\\). Пусть чёрное ребро цели типа \\(i\\) умножает её вес на \\(\\alpha_i\\in[0,1)\\), а белое — на \\(\\beta_i>1\\), причём \\(\\beta_i-1\\le p(1-\\alpha_i)\\). Потенциал — сумма весов всех целей, а опасность свободного ребра равна \\(D(e)=\\sum_{i,A\\ni e}(1-\\alpha_i)w_A\\). Чингиз последовательно выбирает \\(p\\) рёбер наибольшей текущей опасности. Чёрная окраска уменьшает потенциал ровно на опасность ребра и не увеличивает другие опасности. Если после его хода максимальная опасность равна \\(D\\), потеря потенциала не меньше \\(pD\\). Следующее белое ребро увеличивает потенциал не более чем на \\(\\sum_{i,A\\ni e}(\\beta_i-1)w_A\\le pD(e)\\le pD\\). Значит, потенциал не растёт; неполный последний раунд оценки не портит.\n\nПоложим \\(a=p+1\\), \\(t=\\lceil2\\log_a n\\rceil\\), \\(k=t+2\\). Первый тип целей — все \\(k\\)-вершинные множества. Пока такая цель не содержит чёрного ребра и в ней остаётся \\(r\\) свободных рёбер, её вес равен \\(a^{-r}\\); после чёрного ребра вес становится нулём. Здесь \\(\\alpha=0\\), \\(\\beta=a\\), и \\(\\beta-1=p(1-\\alpha)\\).\n\nВторой тип целей — звёзды вершин. Выберем \\(c>1/p\\), а затем \\(s>1\\) достаточно близким к \\(1\\), чтобы \\(s-1\\le p(1-s^{-c})\\). Звезде вершины \\(v\\) дадим вес \\(n^{-2}s^{d_W(v)-c d_B(v)}\\). Для этих целей \\(\\alpha=s^{-c}\\), \\(\\beta=s\\), так что условие леммы также выполнено.\n\nНачальный вес кликовых целей не превосходит\n\\[\n{n\\choose k}a^{-{k\\choose2}}\\le n^ka^{-k(k-1)/2}\\le\\frac1{an}.\n\\]\nПоследнее неравенство следует из \\(k-1\\ge2\\log_a n+1\\). Начальный вес всех звёзд равен \\(n\\cdot n^{-2}=1/n\\). Поэтому начальный потенциал не больше \\((1+1/a)/n<1\\) и по лемме не растёт.\n\nПолностью белая \\(k\\)-клика имела бы вес \\(1\\), что невозможно. Следовательно,\n\\[\n\\omega(W)\\le k-1=\\lceil2\\log_{p+1}n\\rceil+1.\n\\]\nДля каждой вершины в конце\n\\[\n n^{-2}s^{n-1-(c+1)d_B(v)}\\le\\frac{1+1/a}{n},\n\\]\nоткуда\n\\[\n d_B(v)\\ge\\frac{n-1-\\log_s((1+1/a)n)}{c+1}.\\tag{1}\n\\]\nВыберем \\(c\\) достаточно близко справа к \\(1/p\\), чтобы \\(1/(c+1)>p/(p+1)-\\varepsilon/2\\), а затем возьмём \\(n\\) настолько большим, чтобы логарифмический член в (1), делённый на \\((c+1)(n-1)\\), был меньше \\(\\varepsilon/2\\). Тогда \\(d_B(v)\\ge(p/(p+1)-\\varepsilon)(n-1)\\) для каждой вершины. Обе оценки получены одной и той же стратегией максимальной опасности. При \\(p=1\\) получаем пункт а).",
