      "id": "sol-greedy-distance-two-bound",
      "title": "Стандартная жадная оценка для сильной рёберной раскраски",
      "text": "Красим рёбра по одному в произвольном порядке. Когда очередь доходит до ребра \\(e=uv\\), запрещены только цвета, уже использованные на рёбрах расстояния не более 2 от \\(e\\), потому что именно такие рёбра не могут иметь общий цвет с \\(e\\). Рёбер, смежных с \\(e\\), не более \\(2\\cdot 11-2=20\\). Кроме того, со стороны \\(u\\) есть не более 10 других рёбер, инцидентных \\(u\\), и каждый их дальний конец даёт не более 10 дальнейших рёбер; это даёт не более \\(10\\cdot 10\\) рёбер расстояния 2 от \\(e\\) со стороны \\(u\\). Такая же оценка верна со стороны \\(v\\). Значит, рёбер на расстоянии ровно 2 от \\(e\\) не более \\(2\\cdot 10\\cdot 10=200\\), а всего запрещено не более \\(20+200=220\\) цветов. При 221 доступном цвете для \\(e\\) всегда есть свободный цвет. Продолжая жадно, раскрасим все рёбра. По построению каждый цветовой класс является индуцированным паросочетанием, что и требуется.",
