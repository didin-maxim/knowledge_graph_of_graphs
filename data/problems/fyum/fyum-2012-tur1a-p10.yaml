        "id": "stmt-graph-parameterized",
        "text": "For every graph G with maximum degree at most Delta, one can color E(G) with at most 2Delta^2-2Delta+1 colors so that any two edges of the same color are disjoint and no edge is adjacent to both of them. The FYUM statement is the case Delta=11.",
