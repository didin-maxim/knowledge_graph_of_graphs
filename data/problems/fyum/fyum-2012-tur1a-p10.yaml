  "solutions": [
    {
      "id": "sol-greedy-distance-two-bound",
      "title": "Standard greedy bound for strong edge-coloring",
      "text": "Color the edges one by one in an arbitrary order. When we come to an edge e = uv, the only forbidden colors are those already used on edges at distance at most 2 from e, because exactly those edges cannot share a color with e. There are at most 2*11 - 2 = 20 edges adjacent to e. Also, from the u-side there are at most 10 other edges incident with u, and each of their far endpoints contributes at most 10 further edges; this gives at most 10*10 edges at distance 2 from e on the u-side. The same bound holds on the v-side. Hence the number of edges at distance exactly 2 from e is at most 2*10*10 = 200, so in total at most 20 + 200 = 220 colors are forbidden. With 221 available colors there is always a free color for e. Continuing greedily, we color every edge. By construction, each color class is an induced matching, which is exactly the required condition.",
