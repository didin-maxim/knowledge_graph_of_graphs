        "title": "Оригинальная формулировка",
        "text": "Дан связный граф, который остается связным при удалении любого ребра,\n\nи в котором любые две вершины либо соединены ребром, либо имеют общего соседа.\n\nВерно ли, что ребра этого графа можно покрасить в четыре цвета так, чтобы \n\nмежду любыми двумя вершинами нашелся путь, все ребра в котором разного цвета?",
