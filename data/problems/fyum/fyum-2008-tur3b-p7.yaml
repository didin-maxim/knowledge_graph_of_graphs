      "id": "sol-official-archive",
      "title": "Архивное решение",
      "text": "Так как степень каждой вершины равна 10, максимальная степень графа не превосходит 10. Раскрасим вершины правильно в 11 цветов. Это можно сделать жадно: упорядочим вершины произвольно и будем красить их по очереди; когда красится очередная вершина, среди её уже окрашенных соседей занято не более 10 цветов, значит из 11 цветов всегда остаётся хотя бы один свободный.\n\nТеперь каждое ребро ориентируем от конца меньшего цвета к концу большего цвета. У соседних вершин цвета различны, потому что раскраска правильная, поэтому направление каждого ребра определено однозначно.\n\nРассмотрим любой ориентированный путь. При переходе по каждому его ребру цвет вершины строго увеличивается. Значит, на пути не может быть двух вершин одного цвета и всего на нём не больше 11 вершин. Следовательно, число рёбер в таком пути не превосходит 10, что и требовалось.",
