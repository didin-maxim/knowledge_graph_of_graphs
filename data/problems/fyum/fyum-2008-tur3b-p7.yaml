      "id": "sol-official-archive",
      "title": "Archive solution",
      "text": "Properly color the graph with 11 colors; this is possible because the maximum degree is 10. Orient every edge from the endpoint of smaller color to the endpoint of larger color. Along every directed path the colors strictly increase, so its length is at most 10.",
