      "id": "sol-official-archive",
      "title": "Архивное решение",
      "text": "Правильно раскрасим вершины графа в 11 цветов; это возможно, поскольку максимальная степень равна 10. Каждое ребро ориентируем от конца меньшего цвета к концу большего цвета. Вдоль любого ориентированного пути цвета строго возрастают, поэтому его длина не превосходит 10.",
