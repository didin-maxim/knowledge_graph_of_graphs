        "title": "Оригинальная формулировка",
        "text": "Дан двудольный граф $G$. Докажите, что ребра графа\n\n$G$ можно покрасить в 2 цвета таким образом, чтобы для\n\nлюбой вершины количества ребер разных цветов, выходящих\n\nиз этой вершины, отличались не более, чем на 1.",
