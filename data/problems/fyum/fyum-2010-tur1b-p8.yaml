  "solutions": [
    {
      "id": "sol-official-archive",
      "title": "Архивное решение",
      "text": "Это случай \\(k=2\\). Индукция идёт по числу рёбер. Чётные циклы можно раскрасить попеременно после индукционной раскраски остальной части, а деревья обрабатываются удалением ребра к листу и возвращением его в конце. В результате получается 2-раскраска, в которой при каждой вершине числа инцидентных рёбер двух цветов отличаются не более чем на 1.",
