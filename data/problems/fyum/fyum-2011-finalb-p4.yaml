  "solutions": [
    {
      "id": "sol-official-archive",
      "title": "Следствие из теоремы о двухблочных ориентированных путях",
      "text": "Рассмотрим требуемый путь как ориентированный гамильтонов путь в турнире на 200 вершинах. Его тип имеет ровно два блока: сначала 100 последовательных рёбер направлены против порядка обхода, затем 99 последовательных рёбер направлены по порядку обхода. В обзорной статье Банга-Йенсена — Гутина зафиксирован результат Б. Олспача — М. Розенфельда и Х. Дж. Стрейта: в каждом турнире реализуется любой ориентированный гамильтонов путь с двумя блоками. Применяя эту теорему к типу `(-1)^{100}(+1)^{99}`, получаем гамильтонов путь на всех 200 вершинах, то есть путь из 199 звеньев, у которого первые 100 рёбер ориентированы к началу, а следующие 99 — к концу.",
