    {
      "id": "sol-official-archive",
      "title": "Решение через первую сильную компоненту",
      "text": "Будем доказывать немного другую формулировку. Достаточно найти вершину \\(x\\) и два направленных пути, выходящих из \\(x\\), длины 100 и 99, которые не имеют общих вершин, кроме \\(x\\), и вместе покрывают все 200 вершин. Действительно, если длинная ветвь есть \\(x=a_0\\to a_1\\to\\cdots\\to a_{100}\\), а короткая \\(x=b_0\\to b_1\\to\\cdots\\to b_{99}\\), то положим \\(v_{100}=x\\), \\(v_{99}=a_1,\\ldots,v_0=a_{100}\\), \\(v_{101}=b_1,\\ldots,v_{199}=b_{99}\\). Тогда первые 100 рёбер направлены к началу записи, а следующие 99 -- к концу.\n\nИспользуем два стандартных факта о турнирах, оба с короткими доказательствами. Во-первых, каждый турнир имеет направленный гамильтонов путь: вставляем вершины по одной в уже построенный путь в первое место, где меняется направление, а если такого места нет, ставим новую вершину в начало или конец. Во-вторых, каждая сильная компонента турнира имеет направленный гамильтонов цикл. Для этого берём самый длинный направленный цикл \\(Z\\). Если вершина \\(x\\) вне \\(Z\\) имеет на цикле и вход, и выход, то при обходе \\(Z\\) найдутся соседние \\(u,v\\) с \\(u\\to x\\to v\\), и цикл удлиняется. Если таких вершин нет, то каждая внешняя вершина либо бьётся всеми вершинами \\(Z\\), либо сама бьёт все вершины \\(Z\\). Из сильной связности есть простой путь, выходящий из \\(Z\\) наружу и возвращающийся в \\(Z\\); вдоль него найдутся соседние внешние вершины \\(a\\to b\\), где \\(Z\\) бьёт \\(a\\), а \\(b\\) бьёт \\(Z\\). Тогда любое ребро \\(u\\to v\\) цикла можно заменить на \\(u\\to a\\to b\\to v\\), снова получив более длинный цикл. Противоречие.\n\nРазложим данный турнир на сильные компоненты. Между двумя компонентами все рёбра направлены в одну сторону, а компоненты можно упорядочить так, что все рёбра идут из более ранней компоненты в более позднюю. Пусть \\(C\\) -- первая компонента, \\(|C|=s\\), а \\(R\\) -- множество остальных вершин. Тогда каждая вершина \\(C\\) бьёт каждую вершину \\(R\\).\n\nЕсли \\(s\\le 100\\), возьмём направленный гамильтонов путь в \\(C\\), затем направленный гамильтонов путь в \\(R\\), и склеим их; получится путь \\(p_1\\to p_2\\to\\cdots\\to p_{200}\\). Вершина \\(p_{101}\\) лежит вне \\(C\\), поэтому \\(p_1\\to p_{101}\\). Тогда \\(p_1\\to p_2\\to\\cdots\\to p_{100}\\) -- ветвь длины 99, а \\(p_1\\to p_{101}\\to p_{102}\\to\\cdots\\to p_{200}\\) -- ветвь длины 100. Они покрывают все вершины.\n\nОстаётся случай \\(s\\ge 101\\). В компоненте \\(C\\) возьмём направленный гамильтонов цикл \\(c_0\\to c_1\\to\\cdots\\to c_{s-1}\\to c_0\\), индексы далее считаются по модулю \\(s\\). Сначала пусть \\(s=2d\\). Для пары противоположных вершин \\(c_i,c_{i+d}\\) одно из направлений верно; выберем начало так, что \\(c_i\\to c_{i+d}\\). Тогда внутри \\(C\\) есть две исходящие ветви из \\(c_i\\): одна идёт по циклу до \\(c_{i+d-1}\\) и имеет длину \\(d-1\\), другая идёт ребром \\(c_i\\to c_{i+d}\\), а затем по циклу до \\(c_{i-1}\\), и имеет длину \\(d\\). Так как \\(s\\le 200\\), имеем \\(d\\le 100\\). Пусть первая из этих двух ветвей должна дорасти до длины 99, а вторая -- до длины 100. Обеим не хватает ровно \\(100-d\\) вершин, всего \\(200-2d=|R|\\). Берём гамильтонов путь в турнире на \\(R\\) и делим его на две части таких размеров; поскольку \\(C\\) бьёт \\(R\\), эти части можно дописать к концам двух ветвей.\n\nТеперь пусть \\(s=2d+1\\). Если для некоторого \\(i\\) выполнено \\(c_i\\to c_{i+d+1}\\), то из \\(c_i\\) получаем две ветви длины \\(d\\): одна идёт по циклу до \\(c_{i+d}\\), другая идёт ребром \\(c_i\\to c_{i+d+1}\\), а затем по циклу до \\(c_{i-1}\\). До длин 100 и 99 им не хватает соответственно \\(100-d\\) и \\(99-d\\) вершин, а сумма как раз равна \\(199-2d=|R|\\); снова делим гамильтонов путь в \\(R\\) на две такие части и дописываем их.\n\nЕсли же рёбер вида \\(c_i\\to c_{i+d+1}\\) нет, то для всех \\(i\\) имеем \\(c_{i+d+1}\\to c_i\\), а значит, после переобозначения, \\(c_i\\to c_{i+d}\\) для всех \\(i\\). Тогда из \\(c_0\\) берём ветвь \\(c_0\\to c_d\\to c_{d+1}\\to\\cdots\\to c_{2d}\\) длины \\(d+1\\) и ветвь \\(c_0\\to c_1\\to\\cdots\\to c_{d-1}\\) длины \\(d-1\\). До длин 100 и 99 им не хватает \\(99-d\\) и \\(100-d\\) вершин; сумма снова равна \\(|R|\\), так что остаток дописывается тем же способом.\n\nВо всех случаях построены две исходящие ветви длины 100 и 99, покрывающие все вершины. Как объяснено в начале, из них сразу получается требуемый путь \\(v_0,v_1,\\ldots,v_{199}\\).",
