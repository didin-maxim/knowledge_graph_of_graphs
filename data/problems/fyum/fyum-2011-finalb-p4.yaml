      "id": "idea-two-block-oriented-hamiltonian-path-theorem",
      "title": "Нужный путь имеет два направленных блока",
      "text": "Требуемый гамильтонов путь состоит из двух максимальных направленных блоков: 100 рёбер ориентированы к началу пути, затем 99 рёбер ориентированы к концу. Известная теорема Alspach--Rosenfeld/Straight гарантирует в любом турнире реализацию любого такого двухблочного типа.",
