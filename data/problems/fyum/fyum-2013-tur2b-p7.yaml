        "id": "stmt-graph-parameterized",
        "text": "Let G be a 3-regular graph on 6m vertices. Then the number of 4-cycles in G is at most 9m. Equality is attained by the disjoint union of m copies of K_{3,3}. The FYUM problem is the case m=50.",
