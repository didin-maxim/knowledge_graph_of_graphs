  "solutions": [
    {
      "id": "sol-official-archive",
      "title": "Архивное решение",
      "text": "Зафиксируем вершину и любые два ребра, инцидентные ей. Эти два ребра могут вместе входить не более чем в два различных 4-цикла. Так как степень каждой вершины равна 3, есть только три неупорядоченные пары инцидентных рёбер, поэтому через фиксированную вершину проходит не более шести 4-циклов. Суммируя по всем 300 вершинам и деля на 4, поскольку каждый 4-цикл посчитан по одному разу в каждой из своих четырёх вершин, получаем верхнюю оценку \\(300\\cdot 6/4=450\\). Эта оценка достигается на несвязном объединении 50 копий \\(K_{3,3}\\): каждая копия содержит ровно 9 циклов длины 4, значит, всего циклов \\(50\\cdot 9=450\\).",
