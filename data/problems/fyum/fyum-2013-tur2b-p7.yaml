        ]
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph-parameterized",
        "text": "Пусть \\(G\\) — 3-регулярный граф на \\(6m\\) вершинах. Тогда число 4-циклов в \\(G\\) не превосходит \\(9m\\). Равенство достигается на несвязном объединении \\(m\\) копий \\(K_{3,3}\\). Задача FYUM — это случай \\(m=50\\).",
        "status": "ai_checked",
