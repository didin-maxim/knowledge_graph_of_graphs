  "solutions": [
    {
      "id": "sol-official-archive",
      "title": "Archive solution",
      "text": "Fix a vertex and any two edges incident to it. Those two edges can belong together to at most two distinct 4-cycles. Since every vertex has degree 3, there are only three unordered pairs of incident edges, so at most six 4-cycles pass through a given vertex. Summing over all 300 vertices and dividing by 4, because each 4-cycle is counted once at each of its four vertices, we get an upper bound 300*6/4 = 450. This bound is attained by the disjoint union of 50 copies of K_{3,3}: each copy contains exactly 9 cycles of length 4, hence the total number is 50*9 = 450.",
      "idea_ids": [],
      "standard_idea_ids": [],
      "status": "ai_checked"
    }
