        "title": "Оригинальная формулировка",
        "text": "В графе 300 вершин, и степень каждой вершины равна 3. Какое наибольшее возможное число циклов длины 4 может быть в таком графе?",
        "source_id": "src-fyum-2013-tur2b-p7-official",
        "status": "ai_checked",
