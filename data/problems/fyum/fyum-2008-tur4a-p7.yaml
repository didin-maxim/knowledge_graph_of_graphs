  "solutions": [
    {
      "id": "sol-official-archive",
      "title": "Архивное решение",
      "text": "Используем лемму о замыкании: если две несмежные вершины \\(u\\) и \\(v\\) удовлетворяют \\(\\deg(u)+\\deg(v)\\ge n\\), то добавление ребра \\(uv\\) не меняет гамильтоновость. Действительно, любой гамильтонов цикл, использующий \\(uv\\), можно перестроить без этого ребра. Добавим все такие рёбра. В замыкании условие на степени заставляет существовать гамильтонов цикл, значит, исходный граф тоже был гамильтоновым.",
