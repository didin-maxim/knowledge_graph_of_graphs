      "id": "sol-official-archive",
      "title": "Сведение к теореме Хватала о степенях",
      "text": "Это решение опирается на внешнюю теорему Хватала о гамильтоновых степенных последовательностях.\n\nТеорема Хватала. Пусть степени вершин \\(n\\)-вершинного графа равны\n\\(d_1\\le d_2\\le\\cdots\\le d_n\\). Если для каждого \\(i<n/2\\) выполнено\n\\[\nd_i>i \\quad\\text{или}\\quad d_{n-i}\\ge n-i,\n\\]\nто граф гамильтонов.\n\nПроверим, что условие задачи влечёт гипотезу этой теоремы. Зафиксируем \\(i<n/2\\). Если \\(d_i>i\\), первая альтернатива уже выполнена. Если же \\(d_i\\le i\\), то по условию задачи\n\\[\nd_i+d_{n-i}\\ge n,\n\\]\nа значит \\(d_{n-i}\\ge n-d_i\\ge n-i\\). Следовательно, альтернатива Хватала выполнена для каждого \\(i<n/2\\), и граф содержит гамильтонов цикл.\n\nКарточка не считается полной локальной записью доказательства, потому что сама теорема Хватала является существенным классическим внешним результатом. Обычное доказательство проходит через замыкание Бонди--Хватала: добавление ребра между двумя несмежными вершинами с суммой степеней не меньше \\(n\\) сохраняет гамильтоновость, а условие на степенную последовательность затем заставляет замыкание стать полным графом.",
