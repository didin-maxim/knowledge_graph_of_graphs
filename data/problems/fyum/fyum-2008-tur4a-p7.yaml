        "text": "В графе с $n\\geq 10$ вершинами степени \n\n равны $d_1\\leqslant d_2\\leq \\ldots \\leqslant d_n$.\n\nОказалось, что $d_i+d_{n-i}\\geq n$. Докажите, что в нем есть\n\nгамильтонов цикл.",
