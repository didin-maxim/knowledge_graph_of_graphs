      "id": "sol-official-archive",
      "title": "Архивное решение",
      "text": "Решение пока не найдено в самодостаточном виде.\n\nСтарый архивный набросок использовал лемму о замыкании Бонди--Хватала: если две несмежные вершины \\(u\\) и \\(v\\) удовлетворяют \\(\\deg(u)+\\deg(v)\\ge n\\), то добавление ребра \\(uv\\) не меняет гамильтоновость. После последовательного добавления всех таких рёбер нужно доказать, что условие на последовательность степеней \\(d_i+d_{n-i}\\ge n\\) заставляет замыкание быть гамильтоновым.\n\nЭтот последний шаг является по сути теоремой Хватала о гамильтоновых графах с заданной последовательностью степеней. В текущей карточке полное локальное доказательство этой теоремы не восстановлено, поэтому прежний текст был только ссылкой на внешний/стандартный результат, а не самостоятельным решением.",
