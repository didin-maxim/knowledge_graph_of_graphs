        "title": "Statement",
        "text": "В графе 1000 вершин, сумма их степеней больше чем 239000. Если две \n\nвершины не соединены ребром и сумма их степеней не меньше 478, \n\nто их можно соединить ребром. Докажите, что такими операциями можно \n\nполучить вершину, соединенную ребрами со всеми оставшимися 999 вершинами.",
