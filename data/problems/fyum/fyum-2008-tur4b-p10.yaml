      "id": "sol-official-archive",
      "title": "Архивное решение",
      "text": "Будем добавлять разрешённые рёбра, пока это возможно. Сумма степеней при добавлении рёбер только растёт, поэтому в конечном графе она всё ещё больше 239000. Достаточно доказать, что в конечном графе обязательно есть универсальная вершина.\n\nПредположим противное: процесс остановился, но вершины степени 999 нет. Если максимальная степень меньше 239, то сумма всех степеней не превосходит \\(1000\\cdot238=238000\\), что уже противоречит условию. Поэтому можно выбрать вершину \\(v\\) максимальной степени и записать \\(\\deg v=239+k\\), где \\(k\\ge0\\).\n\nТак как \\(v\\) не универсальна, у неё есть несосед \\(u\\). В остановившемся графе для любой несмежной пары сумма степеней меньше 478, иначе соответствующее ребро ещё можно было бы добавить. Поэтому\n\\[\n\\deg u < 478-(239+k)=239-k.\n\\]\nВ частности, если бы \\(k\\ge239\\), правая часть была бы неположительной, что невозможно для степени несоседа в этой оценке; значит \\(k<239\\).\n\nТеперь оценим сумму степеней всех 1000 вершин. Сама вершина \\(v\\) имеет степень \\(239+k\\). Её \\(239+k\\) соседей имеют степени не больше максимальной, то есть не больше \\(239+k\\). Остальные вершины, не смежные с \\(v\\), имеют степени не больше \\(238-k\\), потому что их степень целая и сумма с \\(\\deg v\\) строго меньше 478. Таких несоседей у \\(v\\) ровно\n\\[\n999-(239+k)=760-k.\n\\]\nСледовательно, сумма степеней не превосходит\n\\[\n(239+k)+(239+k)^2+(760-k)(238-k).\n\\]\nПри целых \\(0\\le k<239\\) эта величина не больше 239000; например, после раскрытия скобок получаем \\(2k^2-519k+238240\\), а на отрезке \\([0,238]\\) максимум достигается на одном из концов и меньше 239000.\n\nЭто противоречит тому, что сумма степеней конечного графа больше 239000. Значит, предположение было неверным, и после разрешённых операций можно получить вершину, соединённую со всеми остальными 999 вершинами.",
