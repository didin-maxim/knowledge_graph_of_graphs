  "solutions": [
    {
      "id": "sol-official-archive",
      "title": "Archive solution",
      "text": "Keep adding every allowed edge until the process stops. Assume no universal vertex appears. Let the maximum degree be 239+k. Then k<239. A neighbor of that vertex has degree at most 239+k, and a non-neighbor has degree at most 239-k-1, otherwise the missing edge could still be added. Summing degrees gives an upper bound at most 239000, contradicting the assumption.",
