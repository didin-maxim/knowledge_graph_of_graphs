      "title": "Архивное решение",
      "text": "Зафиксируем ребро \\(uv\\) и рассмотрим все гамильтоновы пути, которые начинаются в \\(u\\) и используют \\(uv\\) первым ребром. Эти пути станут вершинами вспомогательного графа. Два пути соединяются ребром, если один получается из другого стандартной локальной перестановкой. Вершины нечётной степени во вспомогательном графе в точности соответствуют гамильтоновым циклам через \\(uv\\). По лемме о рукопожатиях число вершин нечётной степени чётно. Следовательно, число гамильтоновых циклов через \\(uv\\) чётно.",
