      "id": "sol-official-archive",
      "title": "Архивное решение",
      "text": "Зафиксируем ребро \\(uv\\). Рассмотрим все гамильтоновы пути вида\n\\[\nP=(u=v_1, v=v_2, v_3,\\ldots, v_n),\n\\]\nто есть все гамильтоновы пути, которые начинаются с ребра \\(uv\\). Сделаем эти пути вершинами вспомогательного графа \\(X\\).\n\nОпишем рёбра графа \\(X\\). Пусть путь \\(P\\) заканчивается в вершине \\(z=v_n\\). Если \\(z\\) соединена ребром с некоторой внутренней вершиной \\(v_i\\), где \\(2\\le i\\le n-2\\), то из \\(P\\) можно получить новый гамильтонов путь\n\\[\n(u=v_1, v=v_2,\\ldots, v_i, z=v_n, v_{n-1},\\ldots, v_{i+1}).\n\\]\nОн снова начинается с \\(uv\\). Соединим в \\(X\\) два пути, связанные такой операцией. Эта операция обратима: применив её ещё раз к новому пути по тому же ребру \\(zv_i\\), мы вернёмся к исходному пути. Поэтому степень вершины \\(P\\) во вспомогательном графе равна числу таких допустимых выборов \\(v_i\\).\n\nПосчитаем эту степень по модулю 2. Все соседи конечной вершины \\(z\\) в исходном графе делятся на четыре типа: предыдущая вершина \\(v_{n-1}\\), начальная вершина \\(u=v_1\\), допустимые вершины \\(v_i\\) при \\(2\\le i\\le n-2\\), и недопустимых других вершин нет, потому что путь гамильтонов и уже содержит все вершины графа. Ребро \\(zv_{n-1}\\) всегда есть, оно не даёт нового пути. Ребро \\(zu\\), если оно есть, вместе с путём \\(P\\) образует гамильтонов цикл, проходящий через \\(uv\\), и оно тоже не входит в описанную операцию, потому что тогда первый блок пути не сохранялся бы. Следовательно,\n\\[\n\\deg_X(P)=\\deg_G(z)-1-\\varepsilon,\n\\]\nгде \\(\\varepsilon=1\\), если \\(zu\\in E(G)\\), и \\(\\varepsilon=0\\) иначе.\n\nПо условию \\(\\deg_G(z)\\) нечётна, значит \\(\\deg_G(z)-1\\) чётна. Поэтому \\(\\deg_X(P)\\) нечётна тогда и только тогда, когда \\(zu\\in E(G)\\), то есть тогда и только тогда, когда путь \\(P\\) замыкается ребром \\(zu\\) в гамильтонов цикл через фиксированное ребро \\(uv\\).\n\nОстаётся заметить, что каждому гамильтонову циклу через \\(uv\\) соответствует ровно один такой путь: идём по циклу от \\(u\\) сначала в \\(v\\), а затем по остальным вершинам до последней вершины \\(z\\), соединённой с \\(u\\). И наоборот, каждый путь с \\(zu\\in E(G)\\) даёт такой цикл. Значит, число гамильтоновых циклов через \\(uv\\) равно числу вершин нечётной степени во вспомогательном графе \\(X\\). По лемме о рукопожатиях число вершин нечётной степени в любом конечном графе чётно. Следовательно, через ребро \\(uv\\) проходит чётное число гамильтоновых циклов.",
