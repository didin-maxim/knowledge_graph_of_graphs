  "solutions": [
    {
      "id": "sol-official-archive",
      "title": "Archive solution",
      "text": "Возьмём максимальный ациклический подграф \\(H\\). Сохраним направления рёбер \\(H\\), а все остальные рёбра развернём, получив граф \\(G'\\). Новый граф ацикличен, потому что каждое развёрнутое ребро раньше замыкало ориентированный цикл вместе с рёбрами \\(H\\). Кроме того, каждое развёрнутое ребро можно заменить ориентированным путём в \\(H\\), поэтому длина длиннейшего ориентированного пути между любыми двумя вершинами не увеличивается. Это ровно то, что требовалось.",
