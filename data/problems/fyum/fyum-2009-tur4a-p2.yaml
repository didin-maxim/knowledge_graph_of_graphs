        "id": "stmt-original",
        "title": "Statement",
        "text": "Пусть $G$ --- ориентированный граф. Докажите, что существует такой\n\nациклический граф $G'$, отличающийся от $G$ только ориентацией\n\nнекоторых рёбер, что для любых двух вершин $a$ и $b$, если в $G'$ \n\nсуществует путь, соединяющий $a$ и $b$, то такой путь существует и в $G$, \n\nи длина максимального простого пути от $a$ до $b$ в графе $G'$ не\n\nпревосходит длины максимального простого пути от $a$ до $b$ в графе\n\n$G$.",
        "source_id": "src-fyum-2009-tur4a-p2-official",
