        "id": "stmt-original",
        "title": "Statement",
        "text": "Дан двудольный граф $G$ и натуральное число $k$. Докажите, что ребра\n\n$G$ можно окрасить в $k$ цветов таким образом, чтобы для любых двух\n\nцветов и любой вершины количество ребер этих двух цветов, выходящих\n\nиз этой вершины, отличались не более, чем на 1.",
