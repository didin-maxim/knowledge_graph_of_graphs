  "ideas": [],
  "solutions": [
    {
      "id": "sol-official-archive",
      "title": "Archive solution",
      "text": "First prove the claim for k=2 by induction on the number of edges. If the graph has a cycle, remove it, color the rest inductively, and color the even cycle alternately. If the graph is a tree, remove an edge leading to a leaf and then choose its color at the end. For general k, choose a coloring minimizing the number of same-color edge pairs at a vertex and show that then all color counts differ by at most 1.",
