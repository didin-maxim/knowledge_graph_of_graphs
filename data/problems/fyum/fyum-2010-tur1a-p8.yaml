      "id": "sol-official-archive",
      "title": "Архивное решение",
      "text": "Докажем немного более сильное утверждение для двудольных мультиграфов; для обычного графа оно сразу даёт требуемое.\n\nПусть доли графа равны \\(A\\) и \\(B\\). Достроим граф фиктивными рёбрами так, чтобы степень каждой вершины стала кратной \\(k\\). Для каждой исходной вершины \\(v\\) добавим к ней меньше \\(k\\) фиктивных рёбер до ближайшей степени, кратной \\(k\\); другие концы этих рёбер поместим в новые фиктивные вершины противоположной доли. Если после этого степени некоторых фиктивных вершин ещё не кратны \\(k\\), добавим между фиктивными вершинами двух долей ещё несколько фиктивных рёбер. Это возможно: сумма степеней в левой и правой долях всегда одинакова, поэтому недостающие остатки по модулю \\(k\\) в двух долях совпадают. Получим двудольный мультиграф \\(G'\\), содержащий исходный \\(G\\), в котором степень каждой вершины делится на \\(k\\).\n\nТеперь каждую вершину \\(v\\) степени \\(kq_v\\) разобьём на \\(q_v\\) копий и распределим инцидентные ей рёбра произвольно по этим копиям по \\(k\\) рёбер на копию. После такого разбиения получится \\(k\\)-регулярный двудольный мультиграф \\(H\\).\n\nНужен только следующий факт: всякий \\(k\\)-регулярный двудольный мультиграф имеет совершенное паросочетание. Докажем его напрямую. Возьмём максимальное паросочетание. Если оно не покрывает некоторую вершину \\(a\\) левой доли, рассмотрим все вершины, достижимые из \\(a\\) чередующимися путями: из левой доли идём по рёбрам, не входящим в паросочетание, а из правой доли возвращаемся только по рёбрам паросочетания. Пусть достижимые вершины левой доли образуют множество \\(S\\), а достижимые вершины правой доли -- множество \\(T\\). В \\(T\\) нет непокрытой вершины, иначе был бы увеличивающий путь и паросочетание не было бы максимальным. Кроме того, все соседи вершин из \\(S\\) лежат в \\(T\\), иначе к ним тоже можно было бы дойти. Каждая вершина из \\(T\\) сматчена с вершиной из \\(S\\), но вершина \\(a\\) не сматчена, поэтому \\(|T|<|S|\\). С другой стороны, из \\(S\\) выходит ровно \\(k|S|\\) рёбер, все они приходят в \\(T\\), а в вершины \\(T\\) может входить не больше \\(k|T|\\) рёбер. Получаем \\(k|S|\\le k|T|\\), противоречие. Значит, максимальное паросочетание покрывает всю левую долю; так как в \\(k\\)-регулярном двудольном графе доли имеют одинаковый размер, оно совершенное. Удалив это паросочетание, получаем \\((k-1)\\)-регулярный двудольный мультиграф; повторяя рассуждение, разбиваем все рёбра \\(H\\) на \\(k\\) совершенных паросочетаний. Покрасим эти паросочетания в \\(k\\) цветов.\n\nВернёмся от копий к исходным вершинам графа \\(G'\\). Каждая копия имеет ровно одно ребро каждого цвета, поэтому у всякой вершины \\(v\\) графа \\(G'\\) количество инцидентных рёбер каждого цвета одинаково и равно \\(q_v\\). Теперь удалим все фиктивные рёбра. У исходной вершины \\(v\\) было добавлено меньше \\(k\\) фиктивных рёбер, причём удаление одного фиктивного ребра уменьшает число рёбер ровно одного цвета на 1. Значит, после удаления фиктивных рёбер количества рёбер любых двух цветов, выходящих из \\(v\\), могут отличаться не более чем на 1. Ограничение этой раскраски на исходные рёбра \\(G\\) и есть требуемая раскраска.",
