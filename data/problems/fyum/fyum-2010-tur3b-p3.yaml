      "title": "Архивное решение",
      "text": "Предположим, что такой граф существует. Удалим все вершины одного цвета; оставшийся двухцветный граф не содержит циклов, значит, является лесом. Сделаем это для каждого из трёх цветов. Каждый из трёх полученных графов имеет не более \\(n-1\\) рёбер, поэтому исходный граф имеет не более \\(3n-3\\) рёбер. Но 6-регулярный граф на \\(n\\) вершинах имеет ровно \\(3n\\) рёбер. Противоречие.",
