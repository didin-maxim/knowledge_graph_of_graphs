        "id": "stmt-original",
        "title": "Statement",
        "text": "Существует ли такой граф, что степени всех его вершин равны 6, и \n\nего вершины можно покрасить в три цвета так, что любой простой цикл\n\nсодержит вершины всех трех цветов?",
        "source_id": "src-fyum-2010-tur3b-p3-official",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [
          "degree",
          "cycle"
        ]
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph-parameterized",
        "text": "Let G be a graph whose vertices are colored with three colors. If every cycle of G contains vertices of all three colors, then |E(G)| <= 3(|V(G)|-1). In particular, no 6-regular graph has such a 3-coloring.",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [
          "cycle",
          "degree"
        ],
        "distinct_from": [
