        ]
      }
    ],
    "olympiad_reformulations": []
  },
  "ideas": [],
  "solutions": [
    {
      "id": "sol-official-archive",
      "title": "Archive solution",
      "text": "Assume such a graph exists. Remove all vertices of one color; the remaining two-color graph has no cycles, hence it is a forest. Do this for each of the three colors. Each of the three resulting graphs has at most n-1 edges, so the original graph has at most 3n-3 edges. But a 6-regular graph on n vertices has exactly 3n edges. Contradiction.",
