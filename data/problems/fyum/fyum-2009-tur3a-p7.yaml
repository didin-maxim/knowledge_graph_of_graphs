        "title": "Оригинальная формулировка",
        "text": "Раскраска вершин связного графа G в несколько цветов называется t-периодической (t > 2), если для любого простого пути,\n\nсостоящего из t ребер, его концы — вершины одного цвета. В графе\n\nn вершин и более чем 2tn ребер. Докажите, что в любой\n\nt-периодической раскраске его вершин используется не более двух\n\nцветов.",
