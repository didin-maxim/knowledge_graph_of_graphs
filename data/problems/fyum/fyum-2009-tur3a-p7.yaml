  "solutions": [
    {
      "id": "sol-official-archive",
      "title": "Лемма Bondy--Simonovits с доказательством",
      "text": "Докажем нужную лемму. Пусть `G` связен и `e(G)>2t|V(G)|`. Сначала покажем, что в `G` есть theta-подграф: ребро `ab` и два внутренне непересекающихся `a-b` пути длины хотя бы `t`. Действительно, если есть вершина `x` степени меньше `2t`, то `G-x` всё ещё имеет больше `2t(|V(G)|-1)` рёбер, и можно индуктивно перейти к меньшему графу. Иначе минимальная степень не меньше `2t`. Возьмём самый длинный путь `x_0x_1...x_m`; все соседи `x_0` лежат на нём. Если их индексы `1=i_1<i_2<...<i_r`, то `r>=2t`; выберем соседа `b=x_{i_t}`. Тогда между `x_0` и `b` есть ребро, путь `x_0x_1...b` длины не меньше `t`, а также путь `x_0x_{i_r}x_{i_r-1}...b` длины не меньше `t`; эти два пути внутренне не пересекаются. Theta-подграф найден.\n\nРассмотрим теперь любую `t`-периодическую раскраску. На простом цикле длины `L>t` цвета повторяются при сдвиге на `t` вдоль цикла, поэтому зависят только от класса вершины по модулю `gcd(L,t)`. В найденном theta-подграфе пусть длинные ветви имеют длины `p` и `q`. Три его цикла имеют длины `p+1`, `q+1` и `p+q`, а общий период раскраски на всём theta-подграфе делит `gcd(p+1,q+1,p+q,t)`. Но `gcd(p+1,q+1,p+q)` делит `(p+1)+(q+1)-(p+q)=2`, значит на theta-подграфе используется не более двух цветов.\n\nОсталось перенести это на весь связный граф. Для любой вершины `v` вне theta-подграфа возьмём кратчайший путь от `v` до него, длины `r`, с концом `w` в theta-подграфе. Внутри theta-подграфа из `w` можно продолжить простой путь на любую длину от `0` до `t-1`: если `w` лежит на одном из циклов theta-подграфа длины не меньше `2t`, то идём по нему в подходящую сторону; если `w` является общей вершиной, идём вдоль одной из длинных ветвей. Выберем продолжение длины `s<t` так, чтобы `r+s` делилось на `t`. Тогда получился простой путь от `v` до некоторой вершины theta-подграфа длины, кратной `t`; разбивая его на отрезки длины `t`, получаем, что `v` имеет тот же цвет, что эта вершина theta-подграфа. Следовательно, во всём `G` цветов не больше двух. В задаче `|V(G)|=n` и `e(G)>2tn`, поэтому лемма применима напрямую.",
