  "ideas": [
    {
      "id": "idea-bondy-simonovits-periodic-coloring-lemma",
      "title": "Это точная лемма Bondy--Simonovits о t-периодических раскрасках",
      "text": "Лемма Bondy--Simonovits утверждает: если связный граф G удовлетворяет e(G)>2t|V(G)|, то любая t-периодическая раскраска его вершин использует не более двух цветов. Условие FYUM дословно имеет тот же численный вид.",
      "tags": [
