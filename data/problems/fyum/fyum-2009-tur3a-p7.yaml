        "title": "Оригинальная формулировка",
        "text": "Раскраска вершин связного графа $G$ в несколько цветов называется {\\it\n\n$t$-периодической} ($t>2$), если для любого простого пути,\n\nсостоящего из $t$ ребер, его концы -- вершины одного цвета. В графе\n\n$n$ вершин и более, чем $2tn$ ребер. Докажите, что в любой\n\n$t$-периодической раскраске его вершин используется не более двух\n\nцветов.",
