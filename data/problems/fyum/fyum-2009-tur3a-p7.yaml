      "id": "idea-density-theta-periodic-coloring",
      "title": "Плотность вынуждает theta-граф с двумя длинными ветвями",
      "text": "После удаления вершин малой степени остаётся подграф минимальной степени хотя бы \\(2t\\). Конец его длиннейшего пути имеет много соседей на этом же пути, что даёт theta-подграф из ребра и двух длинных внутренне непересекающихся путей. На таком theta-подграфе \\(t\\)-периодичность совместима с тремя циклами, поэтому число цветовых классов делит 2, а связность переносит это ограничение на весь граф.",
