    {
      "id": "sol-official-archive",
      "title": "Лемма Bondy--Simonovits с доказательством",
      "text": "Докажем более точную лемму, достаточную для задачи.\n\nЛемма. Если связный граф \\(G\\) имеет \\(v\\) вершин и больше \\(2tv\\) рёбер, где \\(t>2\\), то в \\(G\\) есть theta-подграф: две вершины \\(a,b\\), ребро \\(ab\\) и два внутренне непересекающихся \\(a-b\\)-пути длины хотя бы \\(t\\).\n\nДоказательство леммы. Удалим из графа вершину степени меньше \\(2t\\), если такая есть. При удалении вершины степени \\(d<2t\\) число рёбер становится больше\n\\[\n2t|V|-d>2t(|V|-1),\n\\]\nтак что то же неравенство сохраняется для оставшегося графа. Повторяя удаление, получаем непустой подграф с минимальной степенью хотя бы \\(2t\\).\n\nВ этом подграфе возьмём самый длинный простой путь\n\\[\nx_0x_1\\ldots x_m.\n\\]\nВсе соседи \\(x_0\\) лежат на этом пути, иначе путь можно было бы продолжить. Пусть эти соседи имеют индексы\n\\[\n1=i_1<i_2<\\cdots<i_r.\n\\]\nТак как степень \\(x_0\\) не меньше \\(2t\\), имеем \\(r\\ge 2t\\). Положим \\(a=x_0\\), \\(b=x_{i_t}\\). Тогда есть ребро \\(ab\\), есть путь\n\\[\nx_0x_1\\ldots x_{i_t}\n\\]\nдлины \\(i_t\\ge t\\), и есть путь\n\\[\nx_0x_{i_r}x_{i_r-1}\\ldots x_{i_t}\n\\]\nдлины \\(1+i_r-i_t\\ge t+1\\). Внутренние вершины этих двух путей не пересекаются. Лемма доказана.\n\nТеперь рассмотрим любую \\(t\\)-периодическую раскраску вершин исходного графа. Напомним, что это означает: концы любого простого пути из \\(t\\) рёбер имеют один цвет.\n\nСначала посмотрим на простой цикл длины \\(L>t\\). Двигаясь по циклу на \\(t\\) рёбер, мы всегда попадаем в вершину того же цвета. Значит, цвет вершины на цикле зависит только от её номера по модулю \\(\\gcd(L,t)\\).\n\nПрименим это к найденному theta-подграфу. Пусть две длинные ветви между \\(a\\) и \\(b\\) имеют длины \\(p\\) и \\(q\\). Три цикла theta-подграфа имеют длины\n\\[\np+1,\n\\qquad q+1,\n\\qquad p+q,\n\\]\nпоскольку третья ветвь - это одно ребро \\(ab\\). На всём theta-подграфе цветовая периодичность совместима сразу с этими тремя циклами и с шагом \\(t\\). Поэтому число возможных классов цветов делит\n\\[\n\\gcd(p+1,q+1,p+q,t).\n\\]\nНо\n\\[\n(p+1)+(q+1)-(p+q)=2,\n\\]\nзначит \\(\\gcd(p+1,q+1,p+q)\\) делит 2. Следовательно, на theta-подграфе используется не более двух цветов.\n\nОсталось перенести это на весь связный граф. Возьмём произвольную вершину \\(v\\), не лежащую в theta-подграфе, и кратчайший путь от \\(v\\) до theta-подграфа. Пусть его длина равна \\(r\\), а конец в theta-подграфе равен \\(w\\). Внутренние вершины этого кратчайшего пути не лежат в theta-подграфе, поэтому если продолжить путь внутри theta-подграфа, путь останется простым.\n\nВнутри theta-подграфа из любой вершины можно пройти простым путём любой длины от 0 до \\(t-1\\): если вершина лежит на одной из длинных ветвей, идём вдоль этой ветви или через соседнюю ветвь; если это \\(a\\) или \\(b\\), идём вдоль длинной ветви. Длины ветвей не меньше \\(t\\), так что нужного короткого продолжения всегда хватает. Выберем продолжение длины \\(s\\), где \\(0\\le s<t\\), так что \\(r+s\\) делится на \\(t\\). Тогда из \\(v\\) в некоторую вершину theta-подграфа есть простой путь длины, кратной \\(t\\). Разбивая его на отрезки по \\(t\\) рёбер, получаем, что \\(v\\) имеет тот же цвет, что эта вершина theta-подграфа.\n\nЗначит, каждая вершина графа имеет один из цветов, уже встречающихся на theta-подграфе. Там цветов не больше двух, следовательно, во всём графе в любой \\(t\\)-периодической раскраске используется не более двух цветов. В задаче \\(|V(G)|=n\\) и \\(e(G)>2tn\\), поэтому доказанная лемма применяется напрямую.",
