      "id": "idea-bondy-simonovits-periodic-coloring-lemma",
      "title": "Плотность вынуждает theta-граф с двумя длинными ветвями",
      "text": "Из условия e(G)>2t|V(G)| следует короткая лемма Bondy--Simonovits: в таком связном графе есть theta-подграф из ребра ab и двух внутренне непересекающихся a-b путей длины хотя бы t. На этом theta-подграфе t-периодическая раскраска имеет общий период, делящий 2, а связность переносит это ограничение на весь граф.",
