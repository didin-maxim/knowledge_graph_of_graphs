        "extremal_graph_theory"
      ],
      "status": "source_verified"
    }
  ],
  "solutions": [
    {
      "id": "sol-official-archive",
      "title": "Следствие из леммы Bondy--Simonovits",
      "text": "В статье Бонди — Симоновича «Циклы чётной длины в графах» дана следующая лемма: если `t` — положительное целое число, а `G` — связный граф, для которого `e(G)>2t v(G)`, то любая `t`-периодическая раскраска вершин `G` использует не более двух цветов. В нашей задаче граф связен, имеет `n` вершин и больше чем `2tn` рёбер, то есть ровно удовлетворяет неравенству `e(G)>2t v(G)`. Поэтому по этой лемме в любой `t`-периодической раскраске используется не более двух цветов.",
