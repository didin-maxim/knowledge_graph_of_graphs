      "id": "idea-subtree-size-parity-injection",
      "title": "Инъекция из чётных поддеревьев в нечётные",
      "text": "Если размер поддерева вершины чётен, то сумма размеров поддеревьев её сыновей нечётна, поэтому среди сыновей есть вершина с нечётным размером поддерева; выбор такого сына даёт инъекцию, потому что у каждой вершины дерева единственный отец.",
