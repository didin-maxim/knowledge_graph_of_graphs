        "title": "Оригинальная формулировка",
        "text": "Дано дерево с n ≥ 3 вершинами. (Напомним, что деревом называется \n\nсвязный граф без циклов). Одну из вершин назовем корнем дерева, а все ребра \n\nориентируем от корня. В каждой вершине напишем количество вершин, \n\nв которые из нее можно попасть (не считая саму эту вершину). Докажите, что \n\nсреди написанных чисел четных будет не меньше, чем нечетных.",
