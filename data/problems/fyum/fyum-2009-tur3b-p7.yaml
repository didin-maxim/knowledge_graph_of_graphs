        "title": "Оригинальная формулировка",
        "text": "Дано дерево с \\(n\\ge3\\) вершинами. Одну из вершин назовём корнем дерева, а все рёбра ориентируем от корня. В каждой вершине напишем количество вершин, в которые из неё можно попасть по ориентированным рёбрам, не считая саму эту вершину. Докажите, что среди написанных чисел чётных будет не меньше, чем нечётных.",
