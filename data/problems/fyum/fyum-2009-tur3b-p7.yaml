  "solutions": [
    {
      "id": "sol-official-archive",
      "title": "Полное решение через размеры поддеревьев",
      "text": "Для вершины v обозначим через s(v) число вершин в поддереве с корнем v, считая саму v. Тогда в вершине v написано число s(v)-1. Значит написанное число чётно ровно тогда, когда s(v) нечётно, а написанное число нечётно ровно тогда, когда s(v) чётно. Осталось доказать, что вершин с нечётным s(v) не меньше, чем вершин с чётным s(v). Для каждой вершины v с чётным s(v) выберем одного её сына u, у которого s(u) нечётно. Такой сын существует: сумма размеров поддеревьев всех сыновей равна s(v)-1, то есть нечётна, поэтому среди слагаемых есть нечётное. Разным вершинам v соответствуют разные выбранные сыновья, потому что у вершины дерева только один отец. Получилась инъекция из множества вершин с чётным s(v) в множество вершин с нечётным s(v). Следовательно, вершин с нечётным s(v) не меньше, чем с чётным s(v), то есть чётных написанных чисел не меньше, чем нечётных.",
