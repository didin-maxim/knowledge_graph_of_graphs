      "id": "sol-official-archive",
      "title": "Архивное решение",
      "text": "Докажем, что в любом конечном графе число доминирующих множеств нечётно; значит, графа с чётным числом таких множеств не существует.\n\nЕсли в графе нет вершин, то доминирующее множество ровно одно — пустое. Пусть теперь вершин хотя бы одна. Рассмотрим все непустые недоминирующие множества вершин и построим на них вспомогательный граф. Два таких множества \\(S\\) и \\(T\\) соединим ребром, если они не пересекаются и между ними нет рёбер исходного графа.\n\nНайдём степень вершины \\(S\\) во вспомогательном графе. Так как \\(S\\) недоминирующее, существует хотя бы одна вершина, которая не лежит в \\(S\\) и не смежна ни с одной вершиной из \\(S\\). Обозначим множество всех таких вершин через \\(U\\). Тогда \\(U\\) непусто. Ровно непустые подмножества \\(U\\) являются соседями \\(S\\) во вспомогательном графе: они не пересекаются с \\(S\\) и не имеют рёбер к \\(S\\), а любое множество с этими двумя свойствами целиком лежит в \\(U\\). Кроме того, каждое непустое подмножество \\(U\\) само недоминирующее, потому что ни одна вершина из непустого множества \\(S\\) не доминируется им.\n\nСледовательно, степень \\(S\\) равна \\(2^{|U|}-1\\), то есть нечётна. Все вершины вспомогательного графа имеют нечётную степень, а число вершин нечётной степени в любом графе чётно. Значит, число непустых недоминирующих множеств чётно.\n\nВсего подмножеств множества вершин чётное число, а пустое множество при непустом исходном графе не является доминирующим. Поэтому число доминирующих множеств равно: все подмножества минус пустое множество минус чётное число непустых недоминирующих множеств. Это нечётное число. Значит, ответ на вопрос задачи: нет, такого графа не существует.",
