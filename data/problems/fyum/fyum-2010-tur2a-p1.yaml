        "title": "Оригинальная формулировка",
        "text": "Множество $S$ вершин графа называется {\\it доминирующим}, если\n\nлюбая вершина графа, не входящая в $S$, смежна с какой-то вершиной\n\nиз $S$. Существует ли граф с четным числом доминирующих множеств?",
