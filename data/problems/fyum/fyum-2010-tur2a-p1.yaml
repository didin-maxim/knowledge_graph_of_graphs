      "id": "sol-official-archive",
      "title": "Архивное решение",
      "text": "Рассмотрим все непустые недоминирующие множества вершин и построим на них вспомогательный граф. Два таких множества соединяются ребром, если они не пересекаются и между ними нет рёбер исходного графа. Для каждой вершины этого вспомогательного графа степень нечётна; это напрямую проверяется по замыканию окрестности соответствующего множества. Значит, во вспомогательном графе чётное число вершин, то есть число непустых недоминирующих множеств чётно. Следовательно, число доминирующих множеств не может быть чётным.",
