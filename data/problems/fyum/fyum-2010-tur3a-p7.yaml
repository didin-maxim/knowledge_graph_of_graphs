        "id": "stmt-original",
        "title": "Оригинальная формулировка",
        "text": "В графе $G$ все вершины имеют степень 100. Вершины $G$ окрашены в\n\nпять цветов. Может ли так оказаться, что в каждом цикле встречаются\n\nвершины не менее, чем трех цветов?",
        "source_id": "src-fyum-2010-tur3a-p7-official",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [
          "degree",
          "cycle"
        ]
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph-parameterized",
        "text": "Пусть вершины графа \\(G\\) на \\(n\\) вершинах окрашены в \\(r\\) цветов. Предположим, что каждый цикл в \\(G\\) использует не менее трёх различных цветов. Тогда \\(|E(G)|\\le C(r,2)(n-1)\\). В частности, при \\(r=5\\) такая раскраска не может существовать в 100-регулярном графе.",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [
          "cycle"
        ],
        "distinct_from": [
          "stmt-original"
        ]
      }
    ],
    "olympiad_reformulations": []
  },
  "ideas": [],
  "solutions": [
    {
      "id": "sol-official-archive",
      "title": "Архивное решение",
      "text": "Рассмотрим подграф, порождённый любой парой цветов. Если бы он содержал цикл, этот цикл использовал бы только два цвета, что противоречит условию. Значит, каждый двухцветный подграф является лесом. Подсчёт рёбер в этих лесах даёт верхнюю оценку, несовместимую с тем, что степень каждой вершины равна 100. Поэтому такой раскраски не существует.",
