  "solutions": [
    {
      "id": "sol-official-archive",
      "title": "Архивное решение",
      "text": "Ответ: нет.\n\nОбозначим через \\(n_i\\) число вершин \\(i\\)-го цвета, где \\(i=1,\\dots,5\\), и пусть \\(n=|V(G)|\\). Для каждой пары различных цветов \\(i,j\\) рассмотрим подграф \\(G_{ij}\\), порождённый всеми вершинами этих двух цветов. Если бы в \\(G_{ij}\\) был цикл, то этот цикл в исходном графе имел бы вершины только двух цветов, что запрещено условием. Значит, каждый \\(G_{ij}\\) является лесом.\n\nВ лесу на \\(N\\) вершинах не больше \\(N-1\\) рёбер, если \\(N>0\\), и во всяком случае не больше \\(N\\) рёбер. Поэтому\n\\[\n|E(G_{ij})|\\le n_i+n_j.\n\\]\nСложим эти неравенства по всем \\(\\binom52=10\\) парам цветов. В правой части каждая вершина посчитана ровно в четырёх парах цветов, поэтому сумма правых частей равна \\(4n\\). Каждое ребро исходного графа посчитано в левой части хотя бы один раз: если концы ребра имеют разные цвета, оно входит в подграф ровно для этой пары цветов; если концы одного цвета \\(i\\), оно входит во все четыре подграфа \\(G_{ij}\\), где \\(j\\ne i\\). Следовательно,\n\\[\n|E(G)|\\le \\sum_{1\\le i<j\\le5}|E(G_{ij})|\\le 4n.\n\\]\nНо граф 100-регулярный, значит по лемме о рукопожатиях\n\\[\n2|E(G)|=100n,\n\\]\nто есть \\(|E(G)|=50n\\). Это противоречит оценке \\(|E(G)|\\le4n\\) при \\(n>0\\). Следовательно, такая раскраска невозможна.",
      "idea_ids": [],
      "standard_idea_ids": [],
      "status": "ai_checked"
    }
  ],
