        "id": "stmt-original",
        "title": "Statement",
        "text": "В графе $G$ все вершины имеют степень 100. Вершины $G$ окрашены в\n\nпять цветов. Может ли так оказаться, что в каждом цикле встречаются\n\nвершины не менее, чем трех цветов?",
        "source_id": "src-fyum-2010-tur3a-p7-official",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [
          "degree",
          "cycle"
        ]
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph-parameterized",
        "text": "Let G be a graph on n vertices whose vertices are colored with r colors. Suppose every cycle of G uses at least three different colors. Then |E(G)| <= C(r,2)(n-1). In particular, for r=5 such a coloring cannot exist in a 100-regular graph.",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [
          "cycle"
        ],
        "distinct_from": [
          "stmt-original"
        ]
      }
    ],
    "olympiad_reformulations": []
  },
  "ideas": [],
  "solutions": [
    {
      "id": "sol-official-archive",
      "title": "Archive solution",
      "text": "Look at the subgraph induced by any pair of colors. If it contained a cycle, that cycle would use only two colors, contradicting the hypothesis. So every two-color subgraph is a forest. Counting edges in these forests gives an upper bound incompatible with every vertex having degree 100. Therefore such a coloring does not exist.",
      "idea_ids": [],
      "standard_idea_ids": [],
      "status": "ai_checked"
    }
