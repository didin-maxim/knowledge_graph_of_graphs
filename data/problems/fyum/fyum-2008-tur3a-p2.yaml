        "text": "В графе 2008 вершин, и среди любых\n144 вершин найдутся две, соединенные ребром. Докажите,\nчто можно найти в этом графе 15 вершин и пронумеровать\nих числами от 1 до 15 так, что при всяком k от\n2 до 15 вершина с номером k соединена с вершиной\nс номером [k/2].",
