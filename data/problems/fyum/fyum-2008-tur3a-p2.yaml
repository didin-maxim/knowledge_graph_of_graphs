      "Original-source candidate: Tree-complete graph Ramsey numbers. Author note: Vaclav Chvatal. Link: https://doi.org/10.1002/jgt.3190010118",
      "Original-source note: This is exactly the tree-versus-clique Ramsey theorem R(T_n, K_k) = (n-1)(k-1) + 1. The FYUM task is the special case where the target tree is the 15-vertex tree encoded by the parent rule floor(k/2), and the official proof follows the standard inductive proof of Chvatal's theorem."
