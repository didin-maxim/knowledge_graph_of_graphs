      "id": "sol-official-archive",
      "title": "Архивное решение",
      "text": "Докажем более сильное утверждение: всякий граф на \\((n-1)(k-1)+1\\) вершинах содержит либо независимое множество размера \\(k\\), либо копию любого фиксированного дерева \\(T\\) на \\(n\\) вершинах. Индукция идёт по \\(n\\). Удалим из \\(T\\) лист и получим дерево \\(T'\\). В графе удаляем рёбра, пока не появится независимое множество \\(M\\) размера \\(k-1\\), но ещё нет независимого множества размера \\(k\\). По индукционному предположению граф без \\(M\\) содержит \\(T'\\); затем присоединяем подходящую вершину из \\(M\\) к соседу удалённого листа и восстанавливаем \\(T\\).",
