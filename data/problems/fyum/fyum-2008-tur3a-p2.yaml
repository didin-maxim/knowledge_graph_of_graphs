  "ideas": [],
  "solutions": [
    {
      "id": "sol-official-archive",
      "title": "Archive solution",
      "text": "Prove a stronger claim: every graph on (n-1)(k-1)+1 vertices contains either an independent set of size k or a copy of any fixed tree T on n vertices. Induct on n. Delete a leaf from T to get T-prime. Delete edges in the graph until an independent set M of size k-1 appears but not one of size k. By induction the graph without M contains T-prime; then attach one suitable vertex of M to the neighbor of the deleted leaf and recover T.",
