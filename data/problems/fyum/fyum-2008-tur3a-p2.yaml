    {
      "id": "sol-official-archive",
      "title": "Развёрнутое архивное решение через теорему Рэмзи для деревьев",
      "text": "Рассмотрим дерево \\(T\\) на вершинах \\(1,2,\\ldots,15\\), в котором для каждого \\(k=2,\\ldots,15\\) проведено ребро между \\(k\\) и \\(\\lfloor k/2\\rfloor\\). Если в данном графе найдётся копия этого дерева, то номера вершин этой копии сразу дадут требуемую нумерацию. Поэтому достаточно доказать, что такая копия действительно есть.\n\nДокажем лемму Рэмзи для деревьев. Пусть \\(T\\) - любое фиксированное дерево на \\(n\\) вершинах, \\(k\\ge 1\\). Тогда всякий граф \\(G\\) на \\((n-1)(k-1)+1\\) вершинах содержит либо копию \\(T\\), либо независимое множество из \\(k\\) вершин.\n\nДоказательство леммы ведём индукцией по паре \\((n,k)\\). При \\(n=1\\) копия дерева из одной вершины очевидна; при \\(k=1\\) независимое множество из одной вершины тоже очевидно. Пусть \\(n,k\\ge2\\), и лемма уже доказана для меньших значений.\n\nЕсли минимальная степень в \\(G\\) не меньше \\(n-1\\), то в \\(G\\) можно жадно вложить любое дерево на \\(n\\) вершинах: выбираем произвольную вершину для корня дерева и дальше, двигаясь от корня к листьям, каждый раз для очередной ещё не вложенной вершины дерева берём нового соседа образа её родителя. В момент выбора у образа родителя занято меньше \\(n-1\\) соседних вершин, а степень хотя бы \\(n-1\\), значит свободный сосед найдётся. Поэтому в этом случае есть копия \\(T\\).\n\nОстаётся случай, когда есть вершина \\(v\\) степени не больше \\(n-2\\). Тогда среди остальных вершин не соседей у \\(v\\) как минимум\n\\[\n((n-1)(k-1)+1)-1-(n-2)=(n-1)(k-2)+1\n\\]\nвершин. Возьмём из них любые \\((n-1)(k-2)+1\\) вершин и рассмотрим индуцированный подграф \\(H\\). По индукционному предположению, применённому к тем же \\(n\\) и к числу \\(k-1\\), в \\(H\\) есть либо копия \\(T\\), либо независимое множество из \\(k-1\\) вершин. В первом случае мы закончили. Во втором случае эти \\(k-1\\) вершин вместе с \\(v\\) образуют независимое множество из \\(k\\) вершин, потому что все вершины \\(H\\) выбраны среди не соседей \\(v\\). Лемма доказана.\n\nТеперь применим лемму к нашему дереву \\(T\\) на \\(n=15\\) вершинах и к \\(k=144\\). Порог равен\n\\[\n(15-1)(144-1)+1=14\\cdot143+1=2003.\n\\]\nВ условии сказано, что среди любых 144 вершин найдутся две соединённые ребром; значит в графе нет независимого множества из 144 вершин. Выберем любые 2003 вершины исходного графа и применим к индуцированному на них подграфу лемму. Независимого множества из 144 вершин там тоже нет, поэтому должна существовать копия дерева \\(T\\). Нумеруя её вершины так, как были пронумерованы вершины дерева \\(T\\), получаем требуемые 15 вершин.",
