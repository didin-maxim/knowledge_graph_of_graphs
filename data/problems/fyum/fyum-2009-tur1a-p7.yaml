        "title": "Оригинальная формулировка",
        "text": "Даны натуральные числа $n>m>1$. \n\nВ полном $n$-вершинном ориентированном графе нет циклов из $m+1$ вершины.\n\nДокажите, что вершины этого графа можно так занумеровать числами от 1 до \n\n$n$, что при любых $i$ и $k$, удовлетворяющих условию $i\\geq k+m-1$, \n\nребро направлено из $i$-ой вершины в $k$-ю.",
        "source_id": "src-fyum-2009-tur1a-p7-official",
        "status": "ai_checked",
