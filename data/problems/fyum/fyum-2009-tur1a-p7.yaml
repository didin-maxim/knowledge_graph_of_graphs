      "id": "sol-official-archive",
      "title": "Архивное решение",
      "text": "Разложим турнир на сильносвязные компоненты и упорядочим их топологически. Используются две леммы: сильносвязный турнир имеет цикл, проходящий через все его вершины, а из цикла длины \\(k\\) можно получить цикл длины \\(k-1\\). Поэтому ни одна компонента не может иметь более \\(m\\) вершин, иначе возник бы цикл длины \\(m+1\\). Нумеруем вершины блоками согласно порядку компонент. Тогда требуемые направления рёбер следуют из этого порядка.",
