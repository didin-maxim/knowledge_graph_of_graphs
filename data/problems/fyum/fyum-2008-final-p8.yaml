  "solutions": [
    {
      "id": "sol-official-archive",
      "title": "Полное решение через дополнение и три паросочетания",
      "text": "Пусть три данные клики исходного графа имеют множества вершин `A`, `B`, `C`. Перейдём к дополнительному графу `H`. Тогда `A`, `B`, `C` становятся независимыми долями, а один цвет в исходном графе должен быть независимым множеством, то есть кликой в `H`. Поскольку `H` трёхдольный, такая клика имеет размер не больше `3`.\n\nСначала докажем, что между любыми двумя долями, например `A` и `B`, в `H` есть совершенное паросочетание. Если его нет, то по теореме Холла найдётся множество `X` в `A`, для которого `|N_H(X)|<|X|`. Тогда в исходном графе все вершины из `X` соединены со всеми вершинами из `B\\N_H(X)`, а внутри `A` и внутри `B` все вершины и так попарно соединены. Значит, `X` вместе с `B\\N_H(X)` образует клику размера `|X|+n-|N_H(X)|>n`, что запрещено условием. Поэтому между каждой парой долей в `H` действительно есть совершенное паросочетание.\n\nВыберем три таких паросочетания: между `A` и `B`, между `B` и `C`, между `C` и `A`. Их объединение `F` имеет степень `2` в каждой вершине, поэтому распадается на циклы. На каждом цикле типы рёбер вынужденно повторяются по кругу как `AB`, `BC`, `CA` в некотором направлении. Поэтому длина каждого цикла равна `3r`.\n\nПокажем, что вершины цикла длины `3r` можно покрыть кликами графа `H` не более чем в целую часть `5r/3` цветов. При `r=1` цикл является треугольником `H`, и его три вершины дают один цвет. Если `3r` чётно, берём через одно рёбра цикла; получаем паросочетание, покрывающее все вершины, и нужно `3r/2` цветов, что не больше целой части `5r/3`. Если `3r` нечётно, то `r>=3`; покрываем все вершины, кроме одной, попарно рёбрами цикла, а оставшуюся вершину красим отдельно. Нужно `(3r+1)/2` цветов, и при нечётном `r>=3` это не больше целой части `5r/3`.\n\nСкладывая такие покрытия по всем циклам и пользуясь тем, что сумма соответствующих чисел `r` равна `n`, получаем не более целой части `5n/3` цветов. Каждая использованная одиночная вершина, пара или тройка является кликой в `H`, то есть независимым множеством в исходном графе. Значит, исходный граф правильно раскрашивается не более чем в `[5n/3]` цветов.",
