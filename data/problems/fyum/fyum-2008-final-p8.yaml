      "id": "sol-official-archive",
      "title": "Полное решение через дополнение и три паросочетания",
      "text": "Пусть три данные клики исходного графа имеют множества вершин A, B, C. Перейдём к дополнительному графу H. Тогда A, B, C становятся независимыми долями, а правильная раскраска исходного графа равносильна разбиению вершин на клики графа H размера 1, 2 или 3. Сначала докажем, что между любыми двумя долями, например A и B, в H есть совершенное паросочетание. Если его нет, то по теореме Холла найдётся множество X в A, для которого |N_H(X)|<|X|. Тогда в исходном графе все вершины из X соединены со всеми вершинами из B\\N_H(X), а внутри A и B все вершины и так попарно соединены. Значит X вместе с B\\N_H(X) образует клику размера |X|+n-|N_H(X)|>n, противоречие. Поэтому выберем в H три совершенных паросочетания между A и B, между B и C, между C и A. Их объединение F имеет степень 2 в каждой вершине, значит распадается на циклы. Так как рёбра идут только между разными долями и типы долей по циклу идут A-B-C-A-..., длина каждого цикла равна 3r. Покажем, что вершины такого цикла можно покрыть кликами H не более чем floor(5r/3) цветов. Если r=1, сам цикл является треугольником H и даёт один цвет. Если 3r чётно, берём через одно рёбра цикла и получаем паросочетание, покрывающее все вершины; нужно 3r/2 цветов, а это не больше floor(5r/3). Если 3r нечётно и r>=3, покрываем все вершины, кроме одной, попарно рёбрами цикла, а оставшуюся красим отдельно; нужно (3r+1)/2 цветов, что не больше floor(5r/3). Складывая эти покрытия по всем циклам и пользуясь тем, что сумма всех r равна n, получаем не более floor(5n/3) цветов. Каждая пара или тройка, использованная как цвет, является кликой в H, то есть независимым множеством в исходном графе. Значит исходный граф правильно раскрашивается в floor(5n/3) цветов.",
