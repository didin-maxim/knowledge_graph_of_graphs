    {
      "id": "sol-official-archive",
      "title": "Архивное решение",
      "text": "Сначала раскрасим каждый слой в \\(n\\) цветов произвольно, но правильно внутри слоя: поскольку слой является \\(n\\)-кликой, в нём должны встретиться все \\(n\\) цветов по одному разу. Среди всех таких послойных раскрасок выберем раскраску с минимальным числом плохих межслойных рёбер, то есть рёбер, концы которых получили один цвет.\n\nПредположим, что плохое ребро всё же есть. Пусть это ребро \\(xy\\), и оба его конца имеют цвет 1. Зафиксируем другой цвет \\(c\\) и рассмотрим подграф, порождённый вершинами цветов 1 и \\(c\\). В каждом слое в этом подграфе лежит не более двух вершин, поэтому всякий его простой цикл является важным циклом из условия задачи.\n\nЕсли в этом двухцветном подграфе вершины \\(x\\) и \\(y\\) соединены путём, не использующим ребро \\(xy\\), то такой путь имеет чётную длину: его концы одного цвета, а цвета вдоль пути чередуются. Вместе с ребром \\(xy\\) он даёт важный нечётный цикл, проходящий через \\(xy\\). Для разных цветов \\(c\\ne1\\) получаются разные циклы, потому что каждый из них использует вершины цвета \\(c\\). Но по условию ребро \\(xy\\) покрыто не более чем \\(n-2\\) важными нечётными циклами, а цветов \\(c\\ne1\\) всего \\(n-1\\). Значит, найдётся цвет \\(c\\), для которого в двухцветном подграфе вершины \\(x\\) и \\(y\\) не соединены путём после удаления ребра \\(xy\\).\n\nВозьмём компоненту этого двухцветного подграфа, содержащую \\(x\\), но не содержащую \\(y\\), если ребро \\(xy\\) удалить. Поменяем в этой компоненте цвета 1 и \\(c\\) местами. В каждом слое по-прежнему будет ровно по одной вершине каждого цвета: мы просто меняем два цвета на некоторой компоненте двухцветного подграфа, а если бы на границе возникло ребро к вершине цвета 1 или \\(c\\), оно тоже лежало бы в том же двухцветном подграфе и присоединило бы внешнюю вершину к компоненте.\n\nПо той же причине никакое межслойное ребро на границе компоненты не становится плохим: новый конфликт цвета 1 или \\(c\\) означал бы наличие двухцветного ребра из компоненты наружу. Внутри компоненты плохие рёбра сохраняют или теряют статус симметрично при перестановке цветов. Зато ребро \\(xy\\) после обмена уже не плохое, потому что цвет \\(x\\) изменился, а цвет \\(y\\) нет.\n\nИтак, мы получили послойную раскраску с меньшим числом плохих межслойных рёбер, что противоречит минимальному выбору. Следовательно, плохих рёбер не было вообще, и вершины графа правильно раскрашиваются в \\(n\\) цветов.",
