        "title": "Оригинальная формулировка",
        "text": "Вершины графа G разбиты на несколько n-клик, называемых слоями. Простой цикл этого графа будем называть важным, если\n\nэтот цикл содержит не более двух вершин из каждого слоя. Оказалось,\n\nчто каждое ребро, соединяющее вершины из разных слоев, покрыто не\n\nболее чем n-2 важными нечетными циклами. Докажите, что вершины\n\nэтого графа можно раскрасить в n цветов правильным образом.",
