          "cycle"
        ]
      }
    ],
    "graph_theory": [],
    "olympiad_reformulations": []
  },
  "ideas": [],
  "solutions": [
    {
      "id": "sol-official-archive",
      "title": "Archive solution",
      "text": "Choose a proper coloring with the minimum possible number of bad inter-layer edges. If a bad edge remains, look at the two-color subgraph relevant to its endpoints. Every cycle in that subgraph is important. The hypothesis implies that cycles through the chosen bad edge cannot be odd, so the subgraph is bipartite. Swapping the two colors on one component decreases the number of bad edges, a contradiction. Hence no bad edges remain and the graph is properly colored with n colors.",
