  },
  "ideas": [],
  "solutions": [
    {
      "id": "sol-official-archive",
      "title": "Архивное решение",
      "text": "Выберем правильную раскраску с минимальным возможным числом плохих рёбер между слоями. Если плохое ребро осталось, рассмотрим двухцветный подграф, соответствующий цветам его концов. Каждый цикл в этом подграфе является важным. Условие задачи показывает, что циклы через выбранное плохое ребро не могут быть нечётными, значит, подграф двудолен. Перестановка двух цветов в одной компоненте уменьшает число плохих рёбер, противоречие. Следовательно, плохих рёбер нет, и граф правильно раскрашен в \\(n\\) цветов.",
