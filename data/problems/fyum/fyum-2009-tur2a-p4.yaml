        "id": "stmt-original",
        "title": "Statement",
        "text": "Вершины графа $G$ разбиты на несколько $n$-клик, называемых {\\it\n\nслоями}. Простой цикл этого графа будем называть {\\it важным}, если\n\nэтот цикл содержит не более двух вершин из каждого слоя. Оказалось,\n\nчто каждое ребро, соединяющее вершины из разных слоев, покрыто не\n\nболее, чем $n-2$ важными нечетными циклами. Докажите, что вершины\n\nэтого графа можно раскрасить в $n$ цветов правильным образом.",
        "source_id": "src-fyum-2009-tur2a-p4-official",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [
