      "Original-source candidate: Standard lower bound for the chromatic index via matching size. Author note: standard edge-coloring principle; each color class is a matching. Link: https://en.wikipedia.org/wiki/Edge_coloring",
      "Original-source note: The FYUM problem is a concrete extremal instance of the general fact that every proper edge-coloring partitions the edge set into matchings, so the chromatic index is at least |E(G)| divided by the maximum matching size. The official solution is exactly that lower-bound argument."
