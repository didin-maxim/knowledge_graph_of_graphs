        "title": "Statement",
        "text": "Пусть в графе 2009 вершин, из которых 2008 имеют степень 200 и одна \n\nвершина степень 2. Докажите, что ребра этого графа нельзя раскрасить \n\nв 200 цветов так, чтобы одноцветные ребра не имели общих концов.",
