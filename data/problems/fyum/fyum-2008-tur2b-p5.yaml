      }
    ],
    "olympiad_reformulations": []
  },
  "ideas": [],
  "solutions": [
    {
      "id": "sol-official-archive",
      "title": "Archive solution",
      "text": "The graph has 1004*200+1 edges, so by the pigeonhole principle one color is used on at least 1005 edges. If edges of one color do not share endpoints, they form a matching of size 1005 and require 2010 endpoints. But the graph has only 2009 vertices. Contradiction.",
