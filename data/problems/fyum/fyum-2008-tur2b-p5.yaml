        "id": "stmt-graph-parameterized",
        "text": "Пусть \\(m,d\\) — положительные целые числа. Всякий граф на \\(2m+1\\) вершинах с более чем \\(md\\) рёбрами нельзя раскрасить в \\(d\\) цветов так, чтобы каждый цветовой класс был паросочетанием. В частности, если в графе на \\(2m+1\\) вершинах есть \\(2m\\) вершин степени \\(d\\) и одна вершина степени 2, то такая раскраска невозможна.",
