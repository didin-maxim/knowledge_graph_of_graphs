      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph-parameterized",
        "text": "Let m,d be positive integers. Any graph on 2m+1 vertices with more than md edges cannot have its edges colored with d colors in such a way that each color class is a matching. In particular, if a graph on 2m+1 vertices has 2m vertices of degree d and one vertex of degree 2, then such a coloring is impossible.",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [
          "matching"
        ],
        "distinct_from": [
