      "id": "sol-official-archive",
      "title": "Архивное решение",
      "text": "Посчитаем число рёбер по сумме степеней. Сумма степеней равна \\(2008\\cdot 200+2\\), поэтому число рёбер равно\n\\[\n\\frac{2008\\cdot 200+2}{2}=1004\\cdot 200+1.\n\\]\n\nПредположим, что требуемая раскраска в 200 цветов существует. Если бы каждый цвет встречался не более чем на 1004 рёбрах, всего было бы не больше \\(200\\cdot1004\\) рёбер, но у нас на одно ребро больше. Значит, по принципу Дирихле найдётся цвет, которым покрашено хотя бы 1005 рёбер.\n\nПо условию одноцветные рёбра не имеют общих концов, то есть рёбра этого цвета образуют паросочетание. Паросочетание из 1005 рёбер использует \\(2\\cdot1005=2010\\) различных вершин. Это невозможно, потому что во всём графе только 2009 вершин.\n\nПолученное противоречие доказывает, что такой 200-раскраски рёбер не существует.",
