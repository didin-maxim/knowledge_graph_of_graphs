      "title": "Минимальный контрпример и обход в нечётном графе",
      "text": "Условие FYUM требует сильную рёберную раскраску планарного графа с максимальной степенью d и обхватом 10d+100. Это следует из теоремы Chang--Montassier--Pecher--Raspaud при обхвате 10d+46; для самой задачи достаточно перенести более мягкий специальный случай: эйлерова лемма даёт длинную цепочку вершин степени 2, а запас длины позволяет построить нужную последовательность цветов как обход в нечётном графе на 2d-1 цветах.",
