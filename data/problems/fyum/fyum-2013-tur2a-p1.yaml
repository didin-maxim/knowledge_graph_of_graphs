  "solutions": [
    {
      "id": "sol-official-archive",
      "title": "Самодостаточный перенос специального случая теоремы о большом обхвате",
      "text": "Будем доказывать более удобную формулировку. Пусть \\(G\\) — планарный граф максимальной степени не больше \\(d\\), где \\(d>100\\), и обхвата не меньше \\(10d+100\\). Нужно сильно раскрасить его рёбра в \\(2d-1\\) цвет, то есть любые два ребра, имеющие общий конец или концы, соединённые ребром, должны получить разные цвета.\n\nСначала зафиксируем две леммы. Первая — стандартное следствие формулы Эйлера. Если планарный граф \\(H\\) имеет минимальную степень хотя бы \\(2\\) и обхват не меньше \\(5m+1\\), то в нём есть простой путь \\(v_0v_1\\ldots v_{m+1}\\), у которого все вершины \\(v_1,\\ldots,v_m\\) имеют степень \\(2\\) в \\(H\\). Действительно, если весь граф является циклом, всё очевидно. Иначе стянем каждый максимальный путь, внутренние вершины которого имеют степень \\(2\\), в одно ребро. Если ни один такой путь не содержит \\(m\\) подряд идущих вершин степени \\(2\\), то каждое новое ребро заменяет путь длины не больше \\(m\\). Поэтому цикл длины не больше \\(5\\) в стянутом графе дал бы в \\(H\\) цикл длины не больше \\(5m\\). Значит, петель и кратных рёбер в стянутом графе нет, а сам он планарен, имеет минимальную степень хотя бы \\(3\\) и обхват хотя бы \\(6\\). Но это невозможно: из подсчёта граней \\(2E\\ge 6F\\) и формулы Эйлера следует \\(E\\le 3V/2-3\\), тогда как минимальная степень \\(3\\) даёт \\(E\\ge 3V/2\\).\n\nВторая лемма отвечает за докраску длинного пути. Пусть \\(\\Omega\\) — множество из \\(2d-1\\) цветов. Рассмотрим граф \\(O_d\\): его вершины — все \\((d-1)\\)-элементные подмножества \\(\\Omega\\), а две вершины смежны, если эти подмножества не пересекаются. Ребро между \\(A\\) и \\(B\\) пометим единственным цветом из \\(\\Omega\\setminus(A\\cup B)\\). Эта пометка является сильной рёберной раскраской самого \\(O_d\\): у фиксированной вершины все инцидентные рёбра имеют разные метки, а если рёбра \\(AB\\) и \\(CD\\) находятся на расстоянии два через ребро \\(BC\\), то метка \\(AB\\) лежит в \\(C\\), а метка \\(CD\\) не лежит в \\(C\\).\n\nНам понадобится такой факт. Для любых вершин \\(S,T\\) графа \\(O_d\\), любого цвета \\(a\\notin S\\) и любого цвета \\(b\\notin T\\) существует обход \\(S=W_0,W_1,\\ldots,W_{2d+20}=T\\) в \\(O_d\\), у которого первое ребро имеет метку \\(a\\), последнее — метку \\(b\\), и никакие два соседних шага не идут по одному и тому же ребру. Действительно, цвет \\(a\\) однозначно задаёт соседа \\(S_1\\) вершины \\(S\\), а цвет \\(b\\) — соседа \\(T_1\\) вершины \\(T\\). Чтобы пройти от \\(S_1\\) к \\(T_1\\), будем менять элементы множества по одному: если два \\((d-1)\\)-множества \\(A,A'\\) отличаются заменой \\(p\\) на \\(q\\), то между ними есть двухшаговый путь в \\(O_d\\) через множество \\(\\Omega\\setminus(A\\cup A')\\). Так получается путь чётной длины \\(2r\\), где \\(r\\le d-1\\). Оставшуюся чётную длину \\(2d+18-2r\\) добираем замкнутым обходом через \\(T_1\\). Такой обход есть любой чётной длины хотя бы \\(20\\): в графе одноэлементных замен через фиксированное множество \\(X\\) есть циклы длин \\(3,4,5\\), например \\(X,X-p+s,X-p+t,X\\), \\(X,X-p+s,X-p-q+s+t,X-q+t,X\\) и \\(X,X-p+s,X-p-q+s+t,X-q+t,X-q+u,X\\). Их двухшаговые подъёмы дают в \\(O_d\\) замкнутые обходы длин \\(6,8,10\\), а из чисел \\(3,4,5\\) составляется любое число не меньше \\(3\\). Так как \\(d>100\\), вспомогательные элементы можно выбрать так, чтобы первый и последний шаг замкнутого обхода не совпали с двумя заранее заданными инцидентными рёбрами у \\(T_1\\). Вместе с первым и последним рёбрами получаем длину \\(2d+20\\).\n\nТеперь докажем утверждение задачи. Предположим противное и выберем контрпример \\(G\\) с минимальным числом вершин; изолированные вершины можно отбросить, а компоненты красить отдельно, так что \\(G\\) связен. В \\(G\\) нет вершины \\(v\\), смежной с \\(\\deg v-1\\) листьями. В самом деле, удалим один такой лист \\(u\\). По минимальности меньший граф уже раскрашен. Для ребра \\(uv\\) запрещены цвета остальных рёбер, выходящих из \\(v\\), и цвета рёбер, выходящих из единственного возможного не-листа, смежного с \\(v\\). Всего запрещено не более \\((\\deg v-1)+(d-1)\\le 2d-2\\) цветов, значит, один из \\(2d-1\\) цветов свободен.\n\nУдалим из \\(G\\) все листья и назовём полученный граф \\(H\\). Предыдущий абзац означает, что минимальная степень \\(H\\) не меньше \\(2\\); планарность и обхват сохраняются. Применим первую лемму при \\(m=2d+19\\), поскольку \\(10d+100\\ge 5(2d+19)+1\\). Получаем простой путь \\(v_0v_1\\ldots v_{2d+20}\\) такой, что все внутренние вершины \\(v_1,\\ldots,v_{2d+19}\\) имеют степень \\(2\\) в \\(H\\). В исходном графе к этим внутренним вершинам могут быть прикреплены только листья.\n\nУдалим из \\(G\\) все листья, прикреплённые к \\(v_1,\\ldots,v_{2d+19}\\), и удалим вершины \\(v_2,\\ldots,v_{2d+18}\\). Получившийся граф меньше \\(G\\). При необходимости временно добавим листья к \\(v_0\\) и \\(v_{2d+20}\\), чтобы обе эти вершины имели степень ровно \\(d\\); мы добавляем не больше \\(2d\\) вершин, а удалили уже \\(2d+17\\), поэтому граф всё равно меньше исходного. По минимальности он имеет сильную раскраску в \\(2d-1\\) цвет. Обозначим через \\(C(x)\\) множество цветов рёбер, инцидентных вершине \\(x\\), в этой временной раскраске. Тогда \\(|C(v_0)|=|C(v_{2d+20})|=d\\).\n\nПоложим \\(S_0=\\Omega\\setminus C(v_0)\\) и \\(S_{2d+20}=\\Omega\\setminus C(v_{2d+20})\\). Это вершины графа \\(O_d\\). Пусть \\(a\\) — цвет уже раскрашенного ребра \\(v_0v_1\\), а \\(b\\) — цвет уже раскрашенного ребра \\(v_{2d+19}v_{2d+20}\\). По второй лемме найдётся обход \\(W_0,W_1,\\ldots,W_{2d+20}\\) в \\(O_d\\), где \\(W_0=S_0\\), \\(W_{2d+20}=S_{2d+20}\\), первое ребро имеет метку \\(a\\), а последнее — метку \\(b\\).\n\nДокрасим удалённую часть. Ребро \\(v_{i-1}v_i\\) красим меткой ребра \\(W_{i-1}W_i\\). Это согласовано с уже имевшимися цветами на двух концах пути. Для каждого внутреннего \\(v_i\\) раскрасим все его листья различными ещё не использованными у \\(v_i\\) цветами из множества \\(\\Omega\\setminus W_i\\). Таких цветов хватает: множество \\(\\Omega\\setminus W_i\\) имеет размер \\(d\\), два цвета в нём уже заняты рёбрами пути, а листьев у \\(v_i\\) не больше \\(d-2\\).\n\nОсталось проверить запреты. У всех рёбер, инцидентных \\(v_i\\), цвета лежат в \\(\\Omega\\setminus W_i\\). Для соседних вершин обхода \\(W_i,W_{i+1}\\) пересечение множеств \\(\\Omega\\setminus W_i\\) и \\(\\Omega\\setminus W_{i+1}\\) состоит ровно из метки ребра \\(W_iW_{i+1}\\), и этот цвет используется только на общем ребре \\(v_iv_{i+1}\\). Кроме того, метки двух соседних рёбер обхода различны, потому что пометка рёбер \\(O_d\\) сильная. Значит, никакие два различных ребра, имеющие общий конец или концы в соседних вершинах пути, не получили одинаковый цвет. С прежней раскраской конфликтов тоже нет: у концов пути множества цветов были именно \\(\\Omega\\setminus W_0\\) и \\(\\Omega\\setminus W_{2d+20}\\), а первый и последний цвета обхода совпадают с уже раскрашенными крайними рёбрами.\n\nМы продолжили раскраску на весь \\(G\\), что противоречит выбору минимального контрпримера. Следовательно, требуемая сильная рёберная раскраска в \\(2d-1\\) цвет существует.",
