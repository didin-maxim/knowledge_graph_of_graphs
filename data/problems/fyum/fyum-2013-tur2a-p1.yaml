        "title": "Оригинальная формулировка",
        "text": "Дан планарный граф, в котором максимальная степень вершины равна `d > 100`, а длина минимального простого цикла равна `10d + 100`. Докажите, что ребра графа можно раскрасить в `2d - 1` цвет так, чтобы любые два ребра, имеющих либо общую вершину, либо смежные вершины, были разного цвета.",
