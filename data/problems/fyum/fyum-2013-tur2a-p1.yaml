        "text": "Пусть \\(G\\) — планарный граф с максимальной степенью \\(d>100\\) и обхватом не менее \\(10d+100\\). Определим \\(X_2(G)\\) как граф, вершинами которого являются рёбра \\(G\\), причём две вершины \\(X_2(G)\\) смежны, если соответствующие рёбра \\(G\\) имеют общий конец или имеют смежные концы в \\(G\\). Тогда \\(X_2(G)\\) правильно раскрашивается в \\(2d-1\\) цвет.",
