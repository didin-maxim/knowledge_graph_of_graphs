  "ideas": [
    {
      "id": "idea-reduce-to-large-girth-strong-edge-coloring-theorem",
      "title": "Задача является прямым следствием теоремы о большом обхвате",
      "text": "Условие FYUM требует сильную рёберную раскраску планарного графа с максимальной степенью d и обхватом 10d+100. Теорема Chang--Montassier--Pecher--Raspaud даёт такую раскраску уже при обхвате 10d+46, поэтому численный запас в условии полностью покрывает задачу.",
      "tags": [
        "coloring",
        "planar_graphs"
      ],
      "status": "source_verified"
    }
  ],
  "solutions": [
    {
      "id": "sol-official-archive",
      "title": "Следствие из теоремы Chang--Montassier--Pecher--Raspaud",
      "text": "Используем теорему 5 из препринта «Сильный хроматический индекс планарных графов большого обхвата»: если планарный граф имеет максимальную степень не больше \\(\\Delta\\) и обхват не меньше \\(10\\Delta+46\\), то его рёбра допускают сильную рёберную раскраску в \\(2\\Delta-1\\) цвет. В задаче максимальная степень равна \\(d>100\\), а длина минимального простого цикла равна \\(10d+100\\); в частности, обхват графа не меньше \\(10d+46\\). Подставляя \\(\\Delta=d\\) в эту теорему, сразу получаем сильную \\((2d-1)\\)-рёберную раскраску. Именно это и означает требование задачи: любые два ребра, имеющие общую вершину или соединяющие смежные вершины, получают разные цвета.",
