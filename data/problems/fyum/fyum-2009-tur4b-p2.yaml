        "id": "stmt-graph-transitive-tournament",
        "text": "Пусть \\(T\\) — ациклический турнир на \\(n^2+1\\) вершинах. Если каждое ребро \\(T\\) окрашено в красный или синий цвет, то \\(T\\) содержит одноцветный ориентированный путь с \\(n\\) рёбрами.",
