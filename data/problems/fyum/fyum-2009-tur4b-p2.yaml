      "id": "sol-official-archive",
      "title": "Архивное решение",
      "text": "Так как турнир ацикличен, его вершины можно занумеровать в топологическом порядке: каждое ориентированное ребро идёт от меньшего номера к большему.\n\nДля каждой вершины \\(v\\) обозначим через \\(r(v)\\) максимальную длину красного ориентированного пути, начинающегося в \\(v\\), а через \\(b(v)\\) — максимальную длину синего ориентированного пути, начинающегося в \\(v\\). Длины считаем в рёбрах.\n\nПокажем, что пары \\((r(v),b(v))\\) у разных вершин различны. Пусть \\(u\\) стоит раньше \\(v\\) в топологическом порядке. Тогда ребро между ними направлено из \\(u\\) в \\(v\\). Если это ребро красное, то к нему можно приписать длиннейший красный путь из \\(v\\), поэтому \\(r(u)\\ge r(v)+1\\). Если оно синее, то к синему ребру \\(uv\\) можно приписать длиннейший синий путь из \\(v\\), поэтому \\(b(u)\\ge b(v)+1\\). В обоих случаях пары для \\(u\\) и \\(v\\) не равны.\n\nПредположим теперь, что одноцветного ориентированного пути длины \\(n\\) нет. Тогда для каждой вершины оба числа \\(r(v)\\) и \\(b(v)\\) лежат среди \\(0,1,\\ldots,n-1\\). Возможных пар всего \\(n^2\\), а вершин \\(n^2+1\\), что противоречит только что доказанной различности пар.\n\nЗначит, хотя бы для одной вершины один из параметров не меньше \\(n\\), и существует красный или синий ориентированный путь из \\(n\\) рёбер.",
