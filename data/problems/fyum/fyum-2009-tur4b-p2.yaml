    "notes": [
      "Archive rationale: The statement explicitly uses a complete acyclic directed graph with a 2-color edge coloring.",
      "Original-source candidate: Gallai-Hasse-Roy-Vitaver style longest-path argument for colored transitive tournaments. Author note: theorem family of Tibor Gallai, Magnus Hasse, Bernard Roy, and Leslie G. Valiant/Vitaver tradition. Link: https://en.wikipedia.org/wiki/Gallai%E2%80%93Hasse%E2%80%93Roy%E2%80%93Vitaver_theorem",
      "Original-source note: The FYUM proof is the standard pair-labeling argument: each vertex gets the lengths of the longest red and blue directed paths starting there, and equal labels are impossible. This is the same method as the classical Gallai-Roy type proof and also an Erdos-Szekeres style monotone-sequence argument in disguise, so the transfer is direct in method."
