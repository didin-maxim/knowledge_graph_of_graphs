  "ideas": [],
  "solutions": [
    {
      "id": "sol-official-archive",
      "title": "Archive solution",
      "text": "After ordering the vertices linearly, assign to each vertex the lengths of the longest red and blue directed paths starting there. Two vertices cannot have the same pair of values, otherwise one of the paths could be extended. Since there are n^2+1 vertices, one of the parameters must reach n, giving a monochromatic directed path of length n.",
