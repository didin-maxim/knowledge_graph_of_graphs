      "title": "Архивное решение",
      "text": "Упорядочим вершины линейно и каждой вершине сопоставим длины длиннейших красного и синего ориентированных путей, начинающихся в ней. Две вершины не могут иметь одну и ту же пару значений, иначе один из путей можно было бы продолжить. Так как вершин \\(n^2+1\\), один из параметров должен достичь \\(n\\), что даёт одноцветный ориентированный путь длины \\(n\\).",
