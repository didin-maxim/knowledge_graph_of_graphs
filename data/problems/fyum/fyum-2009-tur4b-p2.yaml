        "title": "Statement",
        "text": "Пусть $G$ -- полный ориентированный граф без циклов на $n^2+1$ вершине. \n\nЕго ребра раскрашены в два цвета. Докажите, что найдется одноцветный путь,\n\nпроходящий по $n$ ребрам.",
