    {
      "id": "sol-official-archive",
      "title": "Максимальная система путей и сведение к меньшему модулю",
      "text": "Докажем утверждение индукцией по `n`; при `n=1` любой треугольник подходит. Все веса далее рассматриваются по модулю `n`, вес ребра `uv` обозначим `m(uv)`. Выберем максимальное `k` и последовательность различных вершин `S=(a_1,...,a_{3k})` такую, что между `a_1` и `a_{3k}` есть `k` простых путей по вершинам `S`, суммы которых дают попарно различные остатки. Множество этих остатков обозначим `A`. Если существует треугольник, у которого сумма двух ребер и вес третьего ребра имеют разную четность, начинаем построение с такого треугольника; это понадобится только в случае периода `2`. Если `k=n`, берем вершину `b` вне `S` и замыкаем каждый из `n` путей ребрами `ba_1` и `a_{3k}b`; добавленная сумма фиксирована, поэтому один из циклов имеет сумму `0 mod n`. Пусть теперь `k<n`. Возьмем любые три вершины `x,y,z` вне `S`. Если продолжить каждый старый путь ребром `a_{3k}x` и затем либо двумя ребрами `xy,yz`, либо одним ребром `xz`, то мы получим пути к `z`; их новые остатки отличаются на `m(xy)+m(yz)-m(xz)`. Максимальность `k` значит, что такое добавление не может дать `k+1` различных остатков, следовательно, `A` замкнуто относительно прибавления этого числа. Переставляя вершины тройки, аналогично получаем замкнутость относительно `m(xy)-m(yz)+m(xz)`, а значит и относительно `2m(xy)`. Пусть `t` — наименьший положительный период множества `A`: вместе с каждым `r in A` в `A` лежит `r+t`. Тогда `t` делит `n`, `t>1`, множество `A` является объединением классов по модулю `t`, и так как `A` не все `Z/nZ`, имеем `k<=n-n/t`. Кроме того, для любых внешних `x,y` число `2m(xy)` делится на `t`. Если `t` нечетно, то все ребра между вершинами вне `S` имеют веса, кратные `t`. Вне `S` осталось не меньше `1000n-3(n-n/t)>1000(n/t)` вершин; делим все эти веса на `t` и по индукции для модуля `n/t` получаем цикл, сумма которого в исходных весах делится на `n`. Если `t` четно и `t>2`, то все внешние ребра имеют веса, кратные `t/2`; поскольку `t>=4`, вне `S` осталось больше `1000(n/(t/2))` вершин. Деление весов на `t/2` и индукция для модуля `n/(t/2)` снова дают нужный цикл. Остался случай `t=2`. Тогда все остатки из `A` одной четности; по начальному выбору это возможно только если ни в одном треугольнике сумма двух ребер не отличается по четности от третьего, то есть сумма весов каждого треугольника четна. Зафиксируем вершину `v` и разобьем остальные вершины по четности `m(vu)`. Из четности треугольника `vxy` следует `m(xy)=m(vx)+m(vy) mod 2`, поэтому внутри каждого класса все ребра четные. Один из двух классов вместе, при необходимости, с `v` содержит хотя бы `500n=1000(n/2)` вершин. Ограничиваемся этой кликой, делим все ее веса на `2` и применяем индукцию к модулю `n/2`. Во всех случаях найден простой цикл с суммой, делящейся на `n`.",
