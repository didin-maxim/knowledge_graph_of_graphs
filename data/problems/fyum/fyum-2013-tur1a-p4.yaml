  "solutions": [
    {
      "id": "sol-official-archive",
      "title": "Максимальная система путей и сведение к меньшему модулю",
      "text": "Докажем утверждение индукцией по \\(n\\). При \\(n=1\\) подходит любой треугольник. Все веса далее рассматриваем по модулю \\(n\\); вес ребра \\(uv\\) обозначаем через \\(m(uv)\\).\n\nБудем выбирать две различные вершины \\(u,v\\), множество вершин \\(S\\), содержащее \\(u\\) и \\(v\\), и семейство простых путей из \\(u\\) в \\(v\\), проходящих только по вершинам \\(S\\), так что суммы этих путей дают \\(h\\) различных остатков по модулю \\(n\\), а \\(|S|\\le 3h\\). Если существует треугольник, в котором сумма двух рёбер отличается по чётности от третьего ребра, то начальная система состоит из двух путей между подходящей парой вершин этого треугольника, и далее мы рассматриваем только системы, у которых среди остатков есть обе чётности. Если такого треугольника нет, начинаем с любого одного ребра и дополнительных ограничений не накладываем. Среди разрешённых систем выберем систему с максимальным \\(h\\); множество полученных остатков обозначим через \\(A\\).\n\nЕсли \\(h=n\\), возьмём вершину \\(b\\notin S\\). Для каждого из \\(n\\) путей из \\(u\\) в \\(v\\) добавим рёбра \\(bu\\) и \\(vb\\). Добавленная сумма одна и та же, а старые суммы пробегают все остатки, поэтому один из полученных простых циклов имеет сумму \\(0\\) по модулю \\(n\\).\n\nПусть теперь \\(h<n\\). Возьмём любые три вершины \\(x,y,z\\notin S\\). Каждый старый путь из \\(u\\) в \\(v\\) можно продолжить до пути из \\(u\\) в \\(z\\) двумя способами: через рёбра \\(vx,xz\\) или через рёбра \\(vx,xy,yz\\). Новые множества остатков отличаются сдвигом\n\\[\nd=m(xy)+m(yz)-m(xz).\n\\]\nЕсли бы \\(A+d\\) не содержалось в \\(A\\), то среди этих продолженных путей нашлось бы \\(h+1\\) различных остатков, причём новое множество вершин имело бы размер не больше \\(3h+3=3(h+1)\\). Это противоречит максимальности \\(h\\). Значит, \\(A+d=A\\). Переставляя \\(x\\) и \\(y\\), получаем также период \\(m(xy)+m(xz)-m(yz)\\). Поэтому их сумма \\(2m(xy)\\) тоже является периодом множества \\(A\\) для любых внешних вершин \\(x,y\\).\n\nПусть \\(t\\) — наименьший положительный период множества \\(A\\) в \\(\\mathbb Z/n\\mathbb Z\\). Тогда \\(t\\mid n\\): действительно, все периоды образуют подгруппу циклической группы, а её наименьший положительный элемент делит \\(n\\). Так как \\(h<n\\), множество \\(A\\) не равно всей группе, значит \\(t>1\\). Кроме того, \\(A\\) является объединением классов по модулю \\(t\\), поэтому оно пропускает хотя бы один такой класс и\n\\[\nh=|A|\\le n-\\frac nt.\n\\]\nИз предыдущего абзаца следует, что для любых \\(x,y\\notin S\\) число \\(2m(xy)\\) делится на \\(t\\).\n\nЕсли \\(t\\) нечётно, то \\(2\\) обратимо по модулю \\(t\\), поэтому все рёбра между вершинами вне \\(S\\) имеют веса, кратные \\(t\\). Таких вершин не меньше\n\\[\n1000n-3h\\ge 1000n-3\\left(n-\\frac nt\\right)>1000\\cdot\\frac nt.\n\\]\nВыберем среди них \\(1000(n/t)\\) вершин, разделим все веса рёбер выбранной клики на \\(t\\) и применим индукционное предположение к модулю \\(n/t\\). Найденный цикл в исходных весах имеет сумму, делящуюся на \\(n\\).\n\nЕсли \\(t\\) чётно и \\(t>2\\), то из делимости \\(2m(xy)\\) на \\(t\\) следует делимость \\(m(xy)\\) на \\(t/2\\). Так как \\(t\\ge4\\), вне \\(S\\) осталось больше \\(1000\\cdot n/(t/2)\\) вершин. Выбираем нужную клику, делим её веса на \\(t/2\\) и по индукции для модуля \\(n/(t/2)\\) снова получаем цикл, сумма которого в исходном графе делится на \\(n\\).\n\nОстаётся случай \\(t=2\\). Тогда все остатки из \\(A\\) одной чётности. Если бы существовал треугольник, в котором сумма двух рёбер отличалась по чётности от третьего, мы начали бы с двух путей разных чётностей, и это свойство сохранилось бы при всех продолжениях, так что \\(A\\) не могло бы стать одночётным. Значит, для любого треугольника сумма его трёх рёбер чётна.\n\nЗафиксируем вершину \\(v\\) и разобьём остальные вершины на два класса по чётности \\(m(vu)\\). Для любых двух вершин \\(x,y\\) одного класса из чётности треугольника \\(vxy\\) получаем\n\\[\nm(xy)\\equiv m(vx)+m(vy)\\equiv 0\\pmod 2,\n\\]\nто есть все рёбра внутри каждого класса имеют чётный вес. Один из двух классов содержит хотя бы \\(500n=1000(n/2)\\) вершин. Ограничиваемся кликой на этих вершинах, делим все её веса на \\(2\\) и применяем индукцию к модулю \\(n/2\\). Во всех случаях найден простой цикл с суммой, делящейся на \\(n\\).",
