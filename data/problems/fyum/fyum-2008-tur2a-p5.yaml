  "solutions": [
    {
      "id": "sol-official-archive",
      "title": "Archive solution",
      "text": "Let the two parts be A and B. Assign to every number the letter A or B independently with probability 1/2. We want each vertex to contain at least one number whose letter matches the side of the bipartition. For a fixed vertex the failure probability is 2^{-n}; since the total number of vertices is less than 2^n, the total failure probability is less than 1. So a good assignment exists. Keep one suitable number in every vertex.",
