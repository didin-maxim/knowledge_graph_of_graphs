      "id": "sol-official-archive",
      "title": "Архивное решение",
      "text": "Пусть доли двудольного графа равны \\(A\\) и \\(B\\). Рассмотрим все числа, которые встречаются в списках вершин, и каждому такому числу независимо припишем одну из двух букв, \\(A\\) или \\(B\\), с вероятностью \\(1/2\\).\n\nНазовём вершину хорошей, если среди написанных в ней \\(n\\) различных чисел есть хотя бы одно число с буквой её доли. Для фиксированной вершины вероятность оказаться плохой равна \\(2^{-n}\\): все её \\(n\\) чисел должны получить противоположную букву. В графе всего \\(2^n-1\\) вершин, поэтому по оценке объединения вероятность того, что найдётся хотя бы одна плохая вершина, не превосходит\n\\[\n(2^n-1)\\cdot 2^{-n}<1.\n\\]\nЗначит, существует такое приписывание букв числам, при котором все вершины хорошие.\n\nЗафиксируем это приписывание. В каждой вершине доли \\(A\\) оставим одно из её чисел с буквой \\(A\\), а в каждой вершине доли \\(B\\) — одно из её чисел с буквой \\(B\\). Если две вершины соединены ребром, они лежат в разных долях, поэтому оставленные в них числа имеют разные буквы. Одно и то же число не может одновременно иметь две разные буквы, значит на концах любого ребра действительно стоят различные числа.",
