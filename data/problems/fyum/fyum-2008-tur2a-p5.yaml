      "title": "Архивное решение",
      "text": "Пусть доли двудольного графа равны \\(A\\) и \\(B\\). Каждому числу независимо припишем букву \\(A\\) или \\(B\\) с вероятностью \\(1/2\\). Нужно, чтобы в каждой вершине нашлось число, буква которого совпадает с долей этой вершины. Для фиксированной вершины вероятность неудачи равна \\(2^{-n}\\); поскольку всего вершин меньше \\(2^n\\), суммарная вероятность неудачи меньше 1. Следовательно, хорошее приписывание существует. В каждой вершине оставляем одно подходящее число.",
