    {
      "id": "sol-official-archive",
      "title": "Архивное решение",
      "text": "Докажем индукцией по числу вершин. Ключевая лемма, вынесенная отдельно в карточку `redei-odd-hamiltonian-paths-tournament`, утверждает, что изменение направления одного ребра \\(A\\to B\\) на \\(B\\to A\\) не меняет чётность числа гамильтоновых путей.\n\nПоясним паритетную редукцию. Гамильтоновы пути, не использующие пару \\(A,B\\) подряд, при перевороте ребра вообще не меняются. Меняются только пути, где \\(A\\) и \\(B\\) стоят подряд. Такие пути в одном турнире проходят через дугу \\(A\\to B\\), а в другом — через \\(B\\to A\\). Если стянуть этот соседний блок в одну вершину, то оставшаяся часть пути задаёт гамильтонов путь в турнире на \\(n-1\\) вершинах; по предположению индукции число таких путей нечётно. Поэтому число путей, потерянных при перевороте, и число путей, приобретённых при перевороте, имеют одинаковую чётность, а общая чётность не меняется.\n\nПосле этого последовательно меняем направления рёбер, пока турнир не станет транзитивным. В транзитивном турнире ровно один гамильтонов путь — порядок вершин от источника к стоку. Так как чётность на каждом перевороте сохранялась, в исходном турнире число гамильтоновых путей тоже нечётно.",
