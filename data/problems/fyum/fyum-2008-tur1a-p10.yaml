      "id": "sol-official-archive",
      "title": "Архивное решение",
      "text": "Докажем индукцией по числу вершин. Ключевая лемма утверждает, что изменение направления одного ребра \\(A\\to B\\) на \\(B\\to A\\) не меняет чётность числа гамильтоновых путей: пути, проходящие через \\(A\\to B\\) и через \\(B\\to A\\), сводятся к путям в графе без вершины \\(B\\). После этого последовательно меняем направления рёбер, пока не останется ровно один гамильтонов путь. Значит, исходное число гамильтоновых путей было нечётным.",
