      "id": "idea-two-choices-per-triangle",
      "title": "Каждый треугольник дает два варианта суммы участка",
      "text": "Для треугольника с ненулевой суммой по модулю p можно выбрать две вершины-концы так, что прямое ребро и путь через третью вершину имеют разные суммы. Несколько непересекающихся треугольников превращают задачу в выбор по одному элементу из двухэлементных множеств в Z/pZ.",
