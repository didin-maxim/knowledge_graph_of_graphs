  "solutions": [
    {
      "id": "sol-official-archive",
      "title": "Самодостаточное решение через непересекающиеся треугольники",
      "text": "Работаем по модулю `p`. Случай `p=2` разберем отдельно. Если есть треугольник с четной суммой весов, он и есть нужный цикл. Если все треугольники имеют нечетную сумму, то любые четыре вершины `a,b,c,d` дают четный цикл `abcd`: его сумма равна сумме треугольников `abc` и `acd` минус удвоенный вес диагонали `ac`, значит равна `0 mod 2`. Теперь пусть `p` нечетно. Выберем `p-1` попарно непересекающихся треугольников; вершин для этого достаточно. Если какой-то из них имеет сумму `0 mod p`, мы уже нашли цикл. Иначе в каждом выбранном треугольнике можно назвать вершины `u_i,x_i,v_i` так, что `m(u_ix_i)+m(x_iv_i) != m(u_iv_i)`. Действительно, если это равенство выполнялось бы для всех трех выборов средней вершины, то из трех равенств следовало бы, что все три веса равны `0 mod p`, а тогда сумма треугольника была бы нулевой. Для каждого `i` положим `A_i={m(u_ix_i)+m(x_iv_i), m(u_iv_i)}`; это двухэлементное подмножество поля `Z/pZ`. Используем простую лемму: если `B` — собственное подмножество `Z/pZ`, а `a!=b`, то `|B+{a,b}|>=|B|+1`. После вычитания `a` и деления на `b-a` это сводится к тому, что `B union (B+1)` больше `B`, иначе из `B=B+1` следовало бы `B=Z/pZ`. Поэтому последовательное сложение множеств `A_1,...,A_{p-1}` дает все поле `Z/pZ`. Соединим треугольники в один большой цикл фиксированными ребрами `v_i u_{i+1}` и `v_{p-1}u_1`. Сумма этих соединительных ребер равна некоторому фиксированному `C`. Так как `A_1+...+A_{p-1}=Z/pZ`, можно в каждом треугольнике выбрать либо прямое ребро `u_iv_i`, либо путь `u_i x_i v_i` так, чтобы сумма выбранных участков была `-C`. Вместе с соединительными ребрами они образуют простой цикл с суммой `0 mod p`.",
