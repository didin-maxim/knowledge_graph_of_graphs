    {
      "id": "idea-burr-erdos-spencer-triangle-tiling",
      "title": "Достаточно искать 100 одноцветных треугольников",
      "text": "Сто одноцветных треугольников одного цвета уже являются ста попарно непересекающимися нечётными циклами. Теорема Burr--Erdos--Spencer точно утверждает, что в любой 2-раскраске рёбер K_{5m} есть m попарно непересекающихся одноцветных треугольников одного цвета.",
