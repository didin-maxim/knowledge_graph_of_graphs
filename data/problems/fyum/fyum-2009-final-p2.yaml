    {
      "id": "idea-bowtie-induction-multiple-triangles",
      "title": "Индукция через красно-синюю бабочку",
      "text": "Если в раскраске есть красный треугольник и не пересекающийся с ним синий треугольник, то среди девяти рёбер между ними пять имеют один цвет. Эти пять рёбер дают два одноцветных треугольника разных цветов с общей вершиной; удаление такой бабочки оставляет ровно K_{5(m-1)} и запускает индукцию.",
