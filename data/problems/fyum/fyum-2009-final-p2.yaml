        "title": "Statement",
        "text": "Ребра полного графа на $n$ вершинах покрасили в красный и синий\n\nцвета. При каком наименьшем $n$ заведомо можно утверждать,\n\nчто найдутся либо 100 попарно непересекающихся красных нечетных простых\n\nциклов, либо 100 попарно непересекающихся синих нечетных простых циклов?",
