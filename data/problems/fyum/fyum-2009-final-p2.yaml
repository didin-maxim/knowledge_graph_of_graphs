  "solutions": [
    {
      "id": "sol-official-archive",
      "title": "Ответ через Ramsey theorem for multiple triangles",
      "text": "Ответ: `n=500`. Верхняя оценка следует из Theorem 2 Burr--Erdos--Spencer: для каждого `m>=2` Ramsey number графа `mK_3`, то есть объединения `m` попарно непересекающихся треугольников, равен `5m`. При `m=100` это означает, что любая красно-синяя раскраска рёбер `K_{500}` содержит либо 100 попарно непересекающихся красных треугольников, либо 100 попарно непересекающихся синих треугольников. Треугольник является нечётным простым циклом, поэтому требуемое свойство для `n=500` доказано. Для нижней оценки возьмём экстремальную раскраску из доказательства Burr--Erdos--Spencer. Разобьём `499=3*100-1+2*100-1+1` вершин на множества `A,B,C`, где `|A|=299`, `|B|=199`, `|C|=1`. Все рёбра внутри `A` красные, все рёбра внутри `B` синие, рёбра между `A` и `B` синие, рёбра между `A` и `C` синие, рёбра между `B` и `C` красные. Красный граф состоит из клики `A` и красной звезды с центром `C` и листьями в `B`; поэтому каждый красный нечётный цикл целиком лежит в `A`, и таких попарно непересекающихся циклов не больше `floor(299/3)=99`. Синий граф состоит из клики `B` и полного двудольного графа между `B` и `A union C`; в каждом синем нечётном цикле есть хотя бы одно ребро внутри `B`, а значит он использует не меньше двух вершин из `B`. Поэтому попарно непересекающихся синих нечётных циклов не больше `floor(199/2)=99`. Значит, на `499` вершинах требуемое свойство ещё не гарантировано, а минимальное `n` равно `500`.",
