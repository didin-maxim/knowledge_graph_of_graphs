      "id": "idea-burr-erdos-spencer-triangle-tiling",
      "title": "Достаточно искать 100 одноцветных треугольников",
      "text": "Сто одноцветных треугольников одного цвета уже являются ста попарно непересекающимися нечётными циклами. Нужная верхняя оценка является диагональным случаем теоремы Burr--Erdos--Spencer: в любой 2-раскраске рёбер K_{5m}, m>=2, есть m попарно непересекающихся одноцветных треугольников одного цвета.",
