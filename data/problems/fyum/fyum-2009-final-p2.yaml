  "solutions": [
    {
      "id": "sol-official-archive",
      "title": "Ответ через самодостаточную верхнюю оценку Burr--Erdos--Spencer",
      "text": "Ответ: `n=500`. Докажем нужную верхнюю оценку в виде леммы: при каждом `q>=2` любая красно-синяя раскраска рёбер `K_{5q}` содержит `q` попарно непересекающихся одноцветных треугольников одного цвета. Сначала докажем стандартный факт `R(3,3)=6`: у выбранной вершины среди пяти выходящих рёбер есть три одного цвета; если между тремя их концами есть ребро того же цвета, получаем треугольник, а иначе три конца сами образуют треугольник другого цвета. Теперь база `q=2`. Покажем, что в любой раскраске `K_{10}` есть два непересекающихся одноцветных треугольника одного цвета. Один из цветов, скажем красный, обладает свойством: после удаления любых двух вершин всё ещё остаётся красный треугольник. Иначе можно было бы удалить пару вершин, убивающую все красные треугольники, и пару, убивающую все синие; на оставшихся хотя бы шести вершинах по `R(3,3)=6` нашёлся бы одноцветный треугольник, противоречие. Если есть два непересекающихся красных треугольника, база доказана. Пусть их нет. Возьмём максимальную красную клику `C`; тогда `3<=|C|<=5`. Заметим, что если два красных треугольника имеют общее ребро, то две их остальные вершины тоже соединены красным ребром: удаляем общее ребро, по свойству находим красный треугольник вне этих двух вершин, и из запрета на два непересекающихся красных треугольника он обязан встретить обе старые тройки по их разным вершинам. Поэтому любая вершина вне `C` имеет красное ребро не более чем к одной вершине `C`; иначе она вместе с двумя вершинами `C` дала бы красный треугольник с общим ребром с треугольниками внутри `C`, а затем вошла бы в большую красную клику. Если `|C|<=4`, то вне `C` есть как минимум шесть вершин; среди них есть одноцветный треугольник, и он не может быть красным, значит он синий. Среди оставшихся вне `C` вершин есть синее ребро `xy`, иначе там был бы красный треугольник. Так как каждая из `x,y` имеет не более одного красного соседа в `C`, найдётся `z in C`, соединённая с обеими синим цветом; треугольник `xyz` синий и не пересекается с уже найденным синим треугольником. Если `|C|=5`, то на пяти вершинах вне `C` нет красного треугольника. Значит, синие рёбра там содержат паросочетание из двух рёбер. Действительно, если любые два синих ребра пересекаются, то либо есть синий треугольник, и две вершины вне него вместе с любой его вершиной дают красный треугольник, либо все синие рёбра имеют общий конец, и четыре остальные вершины дают красную клику. Для каждого из двух синих рёбер есть как минимум три вершины `C`, синие к обоим его концам; выбираем для двух рёбер разные такие вершины из `C` и получаем два непересекающихся синих треугольника. База доказана. Теперь индукция по `q>=3`. В `K_{5q}` есть одноцветный треугольник; пусть это красный треугольник `T`. Если на остальных `5q-3` вершинах нет синего треугольника, то жадно выбираем `q` красных треугольников: перед последним выбором остаётся не меньше `2q>=6` вершин, а синего треугольника нигде нет. Иначе есть синий треугольник `U`, не пересекающийся с `T`. Среди девяти рёбер между `T` и `U` не меньше пяти одного цвета. Если это красный цвет, то некоторая вершина `U` красно соединена с двумя вершинами `T`, и вместе с ними образует красный треугольник, имеющий общую вершину с синим `U`. Если это синий цвет, симметрично получаем синий треугольник с общей вершиной с красным `T`. Итак, есть бабочка: красный и синий треугольники с одной общей вершиной, всего на пяти вершинах. Удаляем её; на оставшихся `5(q-1)` вершинах по индукции есть `q-1` непересекающихся одноцветных треугольников одного цвета. Добавляя из бабочки треугольник того же цвета, получаем `q` треугольников. При `q=100` это даёт в `K_{500}` либо 100 красных, либо 100 синих попарно непересекающихся треугольников; каждый треугольник является нечётным простым циклом. Для нижней оценки возьмём экстремальную раскраску из доказательства Burr--Erdos--Spencer. Разобьём `499=3*100-1+2*100-1+1` вершин на множества `A,B,C`, где `|A|=299`, `|B|=199`, `|C|=1`. Все рёбра внутри `A` красные, все рёбра внутри `B` синие, рёбра между `A` и `B` синие, рёбра между `A` и `C` синие, рёбра между `B` и `C` красные. Красный граф состоит из клики `A` и красной звезды с центром `C` и листьями в `B`; поэтому каждый красный нечётный цикл целиком лежит в `A`, и таких попарно непересекающихся циклов не больше `\\lfloor 299/3\\rfloor=99`. Синий граф состоит из клики `B` и полного двудольного графа между `B` и `A\\cup C`; в каждом синем нечётном цикле есть хотя бы одно ребро внутри `B`, а значит он использует не меньше двух вершин из `B`. Поэтому попарно непересекающихся синих нечётных циклов не больше `\\lfloor 199/2\\rfloor=99`. Значит, на `499` вершинах требуемое свойство ещё не гарантировано, а минимальное `n` равно `500`.",
