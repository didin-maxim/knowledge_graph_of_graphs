      "id": "sol-ai-edge-count-and-explicit-cycles",
      "title": "Подсчёт рёбер и явные два обхода",
      "text": "Ответ: 16.\n\nНижняя оценка получается простым подсчётом. В решётке 8 на 8 всего \\(7\\cdot 8+8\\cdot 7=112\\) рёбер. Каждый замкнутый обход всех 64 вершин является гамильтоновым циклом и поэтому содержит ровно 64 ребра. Если два таких цикла имеют \\(x\\) общих рёбер, то их объединение содержит \\(64+64-x\\) различных рёбер, а оно не может содержать больше 112 рёбер всей решётки. Значит, \\(128-x\\le 112\\), откуда \\(x\\ge 16\\).\n\nОсталось показать, что 16 достижимо. Пронумеруем строки и столбцы узлов числами от 1 до 8. Первый цикл зададим следующей последовательностью вершин, после последней вершины снова идём в первую:\n\\[(1,1),(2,1),(2,2),(3,2),(3,1),(4,1),(4,2),(4,3),(3,3),(2,3),(2,4),(3,4),(4,4),(4,5),(5,5),(5,6),(5,7),(6,7),(6,6),(6,5),(7,5),(7,4),(7,3),(6,3),(6,4),(5,4),(5,3),(5,2),(5,1),(6,1),(6,2),(7,2),(7,1),(8,1),(8,2),(8,3),(8,4),(8,5),(8,6),(7,6),(7,7),(8,7),(8,8),(7,8),(6,8),(5,8),(4,8),(3,8),(2,8),(1,8),(1,7),(2,7),(3,7),(4,7),(4,6),(3,6),(3,5),(2,5),(2,6),(1,6),(1,5),(1,4),(1,3),(1,2)\\].\n\nВторой цикл зададим так же:\n\\[(1,1),(2,1),(3,1),(4,1),(5,1),(6,1),(7,1),(8,1),(8,2),(7,2),(7,3),(8,3),(8,4),(7,4),(6,4),(6,5),(5,5),(5,4),(4,4),(4,3),(5,3),(6,3),(6,2),(5,2),(4,2),(3,2),(3,3),(3,4),(3,5),(4,5),(4,6),(5,6),(6,6),(7,6),(7,5),(8,5),(8,6),(8,7),(8,8),(7,8),(7,7),(6,7),(6,8),(5,8),(5,7),(4,7),(4,8),(3,8),(3,7),(3,6),(2,6),(2,7),(2,8),(1,8),(1,7),(1,6),(1,5),(2,5),(2,4),(1,4),(1,3),(2,3),(2,2),(1,2)\\].\n\nВ каждой из двух строк выше соседние пары вершин отличаются ровно на 1 по одной координате, а последняя вершина смежна с первой; кроме того, каждая из 64 пар координат встречается ровно один раз. Поэтому это два допустимых замкнутых обхода.\n\nИх общие рёбра - ровно следующие 16 граничных сторон: \\((1,1)(1,2)\\), \\((1,3)(1,4)\\), \\((1,5)(1,6)\\), \\((1,7)(1,8)\\); \\((8,1)(8,2)\\), \\((8,3)(8,4)\\), \\((8,5)(8,6)\\), \\((8,7)(8,8)\\); \\((1,1)(2,1)\\), \\((3,1)(4,1)\\), \\((5,1)(6,1)\\), \\((7,1)(8,1)\\); \\((1,8)(2,8)\\), \\((3,8)(4,8)\\), \\((5,8)(6,8)\\), \\((7,8)(8,8)\\). Все остальные рёбра первого списка не встречаются во втором, что проверяется прямым сравнением соседних пар. Следовательно, нижняя оценка 16 точна.",
