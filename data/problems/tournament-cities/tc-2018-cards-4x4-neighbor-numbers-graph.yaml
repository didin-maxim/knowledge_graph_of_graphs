      "id": "idea-open-cards-functional-graph",
      "title": "Рёбра из открытых клеток к единственной неизвестной соседней",
      "text": "Если открыты второй и третий столбцы, то у каждой открытой клетки есть не более одной закрытой соседней по стороне клетки. Поэтому, когда у открытого числа не все соседние по значению числа уже открыты, недостающее соседнее число однозначно лежит в этой закрытой клетке.",
