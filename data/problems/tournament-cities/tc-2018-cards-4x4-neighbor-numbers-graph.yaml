  "solutions": [
    {
      "id": "sol-official-eight-middle-columns",
      "title": "Восемь карточек: два средних столбца",
      "text": "Ответ: \\(8\\). Сначала докажем, что меньше нельзя. Разобьём клетки таблицы на пары по схеме\n\\[\n\\begin{matrix}\n1&2&3&4\\\\\n2&1&4&3\\\\\n5&6&7&8\\\\\n6&5&8&7\n\\end{matrix}\n\\]\nгде одинаковые номера обозначают пару. Для каждой такой пары существуют две допустимые раскладки, которые отличаются только перестановкой двух чисел в этой паре. Для первых двух пар это, например,\n\\[\n\\begin{matrix}\n1&4&5&16\\\\2&3&6&15\\\\9&8&7&14\\\\10&11&12&13\n\\end{matrix}\n\\quad\\text{и}\\quad\n\\begin{matrix}\n3&4&5&16\\\\2&1&6&15\\\\9&8&7&14\\\\10&11&12&13\n\\end{matrix}\n\\]\nа также\n\\[\n\\begin{matrix}\n2&1&8&9\\\\3&4&7&10\\\\16&5&6&11\\\\15&14&13&12\n\\end{matrix}\n\\quad\\text{и}\\quad\n\\begin{matrix}\n2&3&8&9\\\\1&4&7&10\\\\16&5&6&11\\\\15&14&13&12\n\\end{matrix}.\n\\]\nОстальные пары получаются из этих примеров симметриями квадрата и заменой каждого числа \\(x\\) на \\(17-x\\). Значит, если в какой-то паре не открыта ни одна карточка, эти две раскладки невозможно различить; следовательно, надо открыть хотя бы по одной карточке из каждой из восьми пар.\n\nТеперь покажем, что \\(8\\) хватает. Откроем все карточки во втором и третьем столбцах. Так как соседние по значению числа лежат в соседних клетках решётки, чётности чисел чередуются при переходе через сторону. Поэтому по открытым клеткам мы узнаём, какая чётность стоит на каждом цвете шахматной раскраски всей таблицы.\n\nРассмотрим открытую клетку. Если для записанного в ней числа не все соседние по значению числа уже открыты, то недостающее число должно лежать в единственной закрытой соседней клетке: слева для второго столбца или справа для третьего. Тем самым мы сразу восстанавливаем все такие закрытые клетки.\n\nВ частности, если в угловую клетку ведёт такое указание, её число восстановлено. Если в угол указание не ведёт, то этот угол имеет только одну ещё закрытую соседнюю клетку и не может содержать внутреннее число \\(2,3,\\ldots,15\\), которому нужны две соседние по значению карточки. Значит, в углу стоит \\(1\\) или \\(16\\), а нужное из этих двух чисел определяется уже известной чётностью клетки.\n\nПосле восстановления углов повторим тот же шаг от углов: если у углового числа не все соседние по значению числа восстановлены, недостающее число стоит в единственной закрытой соседней клетке первого или четвёртого столбца. Остаются возможными только неугловые клетки крайних столбцов, в которые не пришло указание ни из среднего столбца, ни из угла. Такая клетка тоже не может содержать внутреннее число, иначе хотя бы одно из соседних по значению чисел заставило бы провести к ней указание. Следовательно, в ней стоит \\(1\\) или \\(16\\), и снова чётность однозначно выбирает число. Все клетки восстановлены.",
