        "title": "Карточки в таблице 4x4",
        "text": "16 карточек с целыми числами от 1 до 16 разложены лицевой стороной вниз в виде таблицы \\(4\\times4\\) так, что карточки, на которых записаны соседние числа, лежат рядом, соприкасаясь по стороне. Какое наименьшее число карточек нужно одновременно перевернуть, чтобы наверняка определить местоположение всех чисел, как бы ни были разложены карточки?",
