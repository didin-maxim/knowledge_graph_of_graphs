  "ideas": [
    {
      "id": "idea-two-shifted-bridge-families",
      "title": "Две сдвинутые системы перемычек",
      "text": "Добрый волшебник добавляет две циклически сдвинутые системы рёбер между столиками. После удаления половины новых рёбер в одной системе остаётся достаточно много перемычек; на нечётном цикле среди них обязательно найдутся две соседние, и они склеивают два старых цикла в один.",
