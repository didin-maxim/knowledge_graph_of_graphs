        "id": "stmt-original",
        "title": "Гномы за двумя столиками: нечётное n",
        "text": "Пусть \\(n>1\\) нечётно. За каждым из двух круглых столиков сидит по \\(n\\) гномов. Каждый гном дружит только со своими соседями по своему столику слева и справа. Добрый волшебник хочет, чтобы после его действий и любых действий злого волшебника всех \\(2n\\) гномов можно было рассадить за один круглый стол так, чтобы каждые два соседних гнома дружили между собой. Добрый волшебник может подружить \\(2n\\) пар гномов, а затем злой волшебник поссорит между собой \\(n\\) пар из этих \\(2n\\) новых пар. Докажите, что при нечётном \\(n\\) добрый волшебник может добиться желаемого, как бы ни действовал злой волшебник.",
        "source_id": "src-problems-66880",
        "status": "ai_checked",
