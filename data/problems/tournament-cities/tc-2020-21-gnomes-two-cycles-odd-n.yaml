  "solutions": [
    {
      "id": "sol-odd-bridge-strategy",
      "title": "Стратегия доброго волшебника",
      "text": "Обозначим гномов за двумя столиками через \\(A_1,\\ldots,A_n\\) и \\(B_1,\\ldots,B_n\\) в циклическом порядке, индексы считаем по модулю \\(n\\). Пусть \\(n=2k-1\\). Добрый волшебник добавляет рёбра \\(A_iB_i\\) и \\(A_iB_{i+1}\\) для всех \\(i\\). После того как злой волшебник удалит \\(n\\) из этих \\(2n\\) рёбер, в одной из двух систем останется хотя бы \\(k\\) рёбер. На нечётном цикле длины \\(2k-1\\) любые \\(k\\) выбранных позиций содержат две соседние. Значит, в одной системе уцелели две соседние перемычки. Разрезав оба исходных цикла в соответствующих местах и пройдя по двум уцелевшим перемычкам, получаем один цикл через все \\(2n\\) вершин. Поэтому при нечётном \\(n\\) добрый волшебник может гарантировать нужную рассадку.",
