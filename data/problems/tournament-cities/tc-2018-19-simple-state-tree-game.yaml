  "solutions": [
    {
      "id": "sol-petya-tree-invariant",
      "title": "Ориентация дерева к текущей вершине",
      "text": "Так как государство простое и связное, его граф дорог является деревом. Петя выбирает любое ребро uv, ориентирует все рёбра дерева по направлению к v и ставит туриста в u. Первым ходом турист проходит по ребру uv в v; теперь каждое ребро дерева направлено в сторону текущей вершины туриста.\n\nПусть после некоторого хода Пети все ориентированные пути в дереве ведут к текущей вершине x. Вася обязан развернуть одно ребро xy, инцидентное x. После этого у Пети есть ход по ребру x->y. Когда турист переходит в y, в дереве все пути оказываются направлены уже к y: в компоненте y после удаления xy направления и раньше вели к y, а из остальных вершин путь к y проходит через x->y. Значит, тот же инвариант восстановлен. Так продолжается бесконечно, поэтому Петя не проигрывает.",
