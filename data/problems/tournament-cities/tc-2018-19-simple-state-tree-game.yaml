  "solutions": [
    {
      "id": "sol-petya-tree-invariant",
      "title": "Ориентация к движущемуся корню",
      "text": "Выберем вершину \\(r\\), её соседа \\(s\\), направим все рёбра дерева к \\(r\\) и поставим фишку в \\(s\\). Первым ходом Петя идёт \\(s\\to r\\). После этого перед каждым разворотом Васи все рёбра дерева направлены к вершине \\(v\\), в которой стоит фишка. Вася разворачивает одно инцидентное ребро \\(vu\\), и оно становится единственным исходящим ребром из \\(v\\). Петя идёт по нему в \\(u\\). Теперь все рёбра направлены к \\(u\\): в дереве путь к новому корню отличается от пути к старому корню только направлением ребра \\(uv\\). Инвариант восстановлен, поэтому Петя может ходить бесконечно.",
