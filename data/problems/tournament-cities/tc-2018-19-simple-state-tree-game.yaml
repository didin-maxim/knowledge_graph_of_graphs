  "ideas": [
    {
      "id": "idea-tree-token-sink",
      "title": "Все пути ведут к туристу",
      "text": "В дереве можно выбрать целевую вершину и ориентировать каждое ребро по единственному пути к ней. После первого хода турист оказывается в этой вершине; затем каждый разворот Васи даёт Пете единственное исходящее ребро, а проход по нему снова делает текущую вершину общей целью всех ориентированных путей.",
