        "id": "stmt-graph",
        "text": "Дано дерево с не менее чем двумя вершинами. Петя сначала ориентирует все рёбра дерева и выбирает начальную вершину фишки. На каждом своём ходе Петя обязан передвинуть фишку по исходящему ребру в соседнюю вершину, после чего Вася разворачивает одно ребро, инцидентное новой вершине фишки. Если перед ходом Пети из текущей вершины нет исходящих рёбер, Вася выигрывает. Докажите, что Петя может выбрать начальную ориентацию, начальную вершину и дальнейшие ходы так, чтобы ходить бесконечно долго при любых ответах Васи.",
