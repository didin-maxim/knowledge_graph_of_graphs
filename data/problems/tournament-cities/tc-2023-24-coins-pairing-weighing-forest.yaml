        "title": "Монеты весом 9 и 10 граммов",
        "text": "На столе лежат \\(2n\\) неразличимых на вид монет. Известно, что \\(n\\) из них весят по 9 г, а остальные \\(n\\) — по 10 г. Требуется разбить их на \\(n\\) пар так, чтобы общий вес каждой пары равнялся 19 г. Докажите, что это можно сделать менее чем за \\(n\\) взвешиваний на чашечных весах без гирь, которые показывают, равны ли чаши, а если нет, то какая тяжелее.",
