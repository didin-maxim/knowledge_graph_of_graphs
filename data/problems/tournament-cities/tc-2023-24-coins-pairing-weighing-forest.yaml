    {
      "id": "sol-forest-accounting",
      "title": "Алгоритм с кучками и лесом сравнений",
      "text": "Удобно сначала вычесть из веса каждой монеты 9 г: монеты имеют веса 0 и 1, а нужная пара имеет вес 1. Для n=1 ничего делать не надо. Для n=2 сравним две монеты A и B: если они равны, пары (A,C),(B,D) подходят, а если не равны, подходят (A,B),(C,D). Для n=3 достаточно двух взвешиваний: сравнить A с B и C с D; при двух равенствах взять (A,C),(B,D),(E,F), при одном неравенстве, скажем в первом сравнении, взять (A,B),(C,E),(D,F), при двух неравенствах взять (A,B),(C,D),(E,F).\n\nПусть теперь n ≥ 4. Произвольно разобьём монеты на n исходных пар. Пару веса 0 назовём лёгкой, веса 1 — средней, веса 2 — тяжёлой; лёгких и тяжёлых исходных пар поровну. Если мы узнаем тип каждой исходной пары, то средние пары оставим, а каждую лёгкую пару объединим с тяжёлой, беря по одной монете из каждой, и получим две средние пары.\n\nБудем строить кучки исходных пар. В ещё не использованном наборе сравниваем первую пару со второй, третьей и так далее, пока впервые не появится неравенство. Все пары, участвовавшие в этой серии, образуют кучку: в ней есть несколько равных пар одного типа и одна пара другого типа; мы знаем, какая из двух частей кучки легче. Затем повторяем то же с оставшимися парами. В конце может остаться хвост из пар, которые между собой равны и не образовали кучку.\n\nИз каждой кучки выделим группу: одну пару из более лёгкой части и одну пару из более тяжёлой части. Сравниваем первую группу со второй, третьей и так далее, пока не появится неравенство. Если, например, первая группа легче k-й, то лёгкая пара первой группы на самом деле имеет вес 0, а тяжёлая пара k-й группы имеет вес 2. Эти две известные пары вместе дают эталонную группу X веса 2. Сравнивая X со всеми ещё не сравненными группами, мы определяем типы пар в соответствующих кучках: группа веса меньше 2 состоит из пар 0 и 1, равная X — из 0 и 2, большая X — из 1 и 2. Если есть хвост равных пар, сравниваем одну такую пару со средней парой, составленной из одной монеты известной лёгкой пары и одной монеты известной тяжёлой пары; так определяется тип всего хвоста. В кучках, которые были равны первой до k-й, остаётся только один вариант неопределённости: неизвестные части могут быть соответственно (1,0), (1,1) или (2,1). Единственный подходящий вариант выбирается из условия, что общее число лёгких и тяжёлых исходных пар одинаково.\n\nЕсли же все выделенные группы равны между собой, то все более лёгкие части кучек имеют один общий тип, все более тяжёлые части — один общий тип, и хвост, если он есть, тоже имеет один общий тип. Обозначим размеры этих трёх наборов через a,b,c, пропуская пустые наборы: если один из них пуст, типы сразу восстанавливаются из равенства числа лёгких и тяжёлых пар. В непустом случае почти всегда это равенство также однозначно задаёт типы; неоднозначность возможна только при a=c, a+c=b; при b=c, b+c=a; при a=b, c=a+b; или при a=b=c. В первых двух случаях одно дополнительное сравнение пары из соответствующей части с парой хвоста различает варианты; в третьем типы уже вынуждены быть 0,2 и 1; в четвёртом, так как n ≠ 3, в каждом наборе есть по крайней мере две пары, и одно сравнение группы из одной нижней и одной верхней пары с двумя парами хвоста различает варианты. После этого тип каждой исходной пары известен, и применяется стандартная процедура.\n\nОсталось проверить число взвешиваний. Построим граф на n исходных парах: каждому взвешиванию сопоставим ребро между двумя исходными парами, которые оно связывает; если взвешивались группы, берём по одному представителю из каждой группы, а если пара сравнивалась с половиной X, соединяем её с одной из пар, образующих X. Внутри каждой кучки первые сравнения строят дерево-звезду. Сравнения групп каждый раз соединяют разные уже построенные компоненты кучек, а сравнения с хвостом присоединяют изолированные вершины хвоста. Дополнительное сравнение в редких финальных случаях также присоединяет ещё не связанную с этой компонентой часть. Поэтому циклов не возникает: полученный граф — лес на n вершинах. В лесу не больше n-1 рёбер, значит, взвешиваний меньше n.",
