      "id": "idea-weighings-as-forest",
      "title": "Взвешивания как рёбра леса",
      "text": "Чтобы доказать ограничение на число взвешиваний, достаточно сопоставить каждому существенному взвешиванию ребро между исходными парами и проверить, что циклы не возникают.",
