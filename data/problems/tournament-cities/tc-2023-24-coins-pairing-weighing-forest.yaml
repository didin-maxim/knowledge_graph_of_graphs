  "solutions": [
    {
      "id": "sol-forest-accounting",
      "title": "Контроль числа взвешиваний через лес",
      "text": "Сначала монеты произвольно разбиваются на пары, веса которых могут быть 18, 19 или 20 г; пар весов 18 и 20 г поровну. Алгоритм сравнивает пары и группы пар так, чтобы в конце определить тип каждой пары, после чего лёгкие и тяжёлые пары склеиваются в правильные пары по 19 г. Для контроля числа сравнений строится граф на исходных парах: каждое сравнение добавляет ребро между парами, которые оно фактически связывает. В каждом случае алгоритма новое ребро соединяет разные компоненты этого графа, поэтому получается лес. Лес на \\(n\\) вершинах имеет не больше \\(n-1\\) рёбер, значит сделано меньше \\(n\\) взвешиваний.",
      "examples": [
        {
          "type": "image",
          "title": "Граф сравнений остаётся лесом",
          "path": "assets/examples/tc-2023-24/comparison-forest-growth.png",
