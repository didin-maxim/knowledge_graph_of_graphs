  ],
  "solutions": [
    {
      "id": "sol-longest-path-parity",
      "title": "Длиннейший путь и чётность",
      "text": "Выберем в графе длиннейший простой путь \\(v_0,v_1,\\ldots,v_k\\). Все соседи вершины \\(v_0\\) лежат среди вершин этого пути, иначе путь можно было бы продлить. У вершины \\(v_0\\) есть хотя бы три соседа на пути. Если среди них есть \\(v_i\\) с нечётным i, то вершины \\(v_0,v_1,\\ldots,v_i\\) образуют цикл чётной длины \\(i+1\\). Если же все три соседа имеют чётные номера, то берём двух из них, например \\(v_i\\) и \\(v_j\\), где i<j; тогда отрезок пути от \\(v_i\\) до \\(v_j\\) вместе с двумя рёбрами к \\(v_0\\) образует цикл длины \\(j-i+2\\), а это чётное число.",
