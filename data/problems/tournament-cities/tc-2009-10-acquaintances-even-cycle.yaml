        "title": "Участники олимпиады и круглый стол",
        "text": "Среди участников олимпиады каждый знаком не менее чем с тремя другими. Докажите, что можно выбрать группу из чётного числа участников, причём больше двух человек, и посадить их за круглый стол так, чтобы каждый был знаком с обоими соседями.",
