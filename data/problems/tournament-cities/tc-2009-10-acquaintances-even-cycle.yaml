  "ideas": [
    {
      "id": "idea-longest-path-parity-neighbors",
      "title": "Соседи конца длиннейшего пути дают чётный цикл",
      "text": "Берём длиннейший путь. Все соседи его конца лежат на этом пути; среди трёх соседей два находятся на позициях одной чётности, и соответствующие циклы от конца пути имеют одинаковую чётность. Один из них даёт чётный цикл.",
      "tags": [
