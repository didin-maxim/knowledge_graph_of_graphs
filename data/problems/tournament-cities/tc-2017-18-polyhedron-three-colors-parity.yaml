    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Дан 3-регулярный связный плоский граф, все грани которого раскрашены в красный, жёлтый и синий цвета. Ребро назовём разноцветным, если две грани по разные стороны от него имеют разные цвета. Докажите, что число вершин, инцидентных трём разноцветным рёбрам, чётно.",
