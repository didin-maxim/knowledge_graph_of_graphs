        "title": "Раскраска граней многогранника",
        "text": "В каждой вершине выпуклого многогранника сходятся три грани. Каждая грань покрашена в красный, жёлтый или синий цвет. Докажите, что число вершин, в которых сходятся грани трёх разных цветов, чётно.",
