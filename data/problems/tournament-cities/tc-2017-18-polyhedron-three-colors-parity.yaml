  "solutions": [
    {
      "id": "sol-handshaking",
      "title": "Лемма о рукопожатиях",
      "text": "Рассмотрим граф многогранника и удалим все рёбра, по обе стороны от которых лежат грани одного цвета. В полученном графе трёхцветная вершина имеет степень \\(3\\), вершина с двумя цветами имеет степень \\(2\\), а одноцветная вершина имеет степень \\(0\\). По лемме о рукопожатиях в любом графе число вершин нечётной степени чётно. Значит, чётно и число трёхцветных вершин.",
      "idea_ids": [
        "idea-delete-monochromatic-edges"
      ],
      "standard_idea_ids": [
        "double_counting"
      ],
      "status": "ai_checked",
      "definition_ids": [
        "degree"
      ]
    },
    {
      "id": "sol-bicolor-paths",
      "title": "Пути между красно-жёлтыми рёбрами",
      "text": "Можно зафиксировать пару цветов, например красный и жёлтый. Из каждой трёхцветной вершины выходит ровно одно ребро, разделяющее красную и жёлтую грани. Продолжая путь по таким рёбрам, мы приходим к другой трёхцветной вершине; промежуточные вершины имеют ровно два таких ребра. Поэтому трёхцветные вершины разбиваются на пары.",
