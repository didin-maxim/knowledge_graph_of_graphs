    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Пусть \\(N\\ge 2\\). Неизвестен простой граф на \\(N\\) вершинах. За один вопрос можно узнать, принадлежит ли выбранная пара вершин множеству рёбер. Докажите, что любое детерминированное дерево решений, которое всегда правильно определяет связность графа, в худшем случае должно спросить обо всех \\(\\binom{N}{2}\\) парах вершин.",
