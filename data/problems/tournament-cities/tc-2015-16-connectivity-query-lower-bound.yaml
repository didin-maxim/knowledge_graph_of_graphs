      {
        "id": "stmt-original",
        "title": "64 города и вопросы о дорогах",
        "text": "В стране 64 города, некоторые пары из них соединены дорогой, но нам неизвестно, какие именно. Можно выбрать любую пару городов и получить ответ на вопрос: есть ли дорога между ними? Нужно узнать, можно ли в этой стране добраться от любого города до любого другого, двигаясь по дорогам. Докажите, что не существует алгоритма, позволяющего сделать это менее чем за 2016 вопросов.",
        "source_id": "src-problems-65735",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
