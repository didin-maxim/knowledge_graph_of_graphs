      "id": "idea-adversary-keeps-spanning-tree-possible",
      "title": "Противник сохраняет дерево",
      "text": "Ответы на вопросы выбираются так, чтобы перед последним неизвестным ребром оставшийся смешанный граф был деревом: последнее ребро может как сохранить связность, так и разрушить её.",
