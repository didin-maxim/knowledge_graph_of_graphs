  "solutions": [
    {
      "id": "sol-adversary-cycle-bridge",
      "title": "Стратегия противника через циклы и мосты",
      "text": "Представим полный граф на 64 вершинах: непроверенные пары считаются белыми, положительные ответы — чёрными, отрицательные — удалёнными. Когда алгоритм спрашивает про белое ребро, противник удаляет его, если оно лежит на цикле текущего графа из чёрных и белых рёбер; иначе объявляет его чёрным. Такой ход сохраняет связность текущего графа, а чёрные рёбра никогда не образуют цикл. Перед последним вопросом остаётся одно белое ребро, циклов уже нет, значит весь текущий граф — дерево. Если последнее ребро удалить, связность нарушится; если сохранить, граф останется связным. Поэтому до последнего вопроса алгоритм не может знать правильный ответ.",
