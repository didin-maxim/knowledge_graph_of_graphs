      "id": "sol-path-parity",
      "title": "Маршруты между парами городов",
      "text": "Разобьём 100 городов на 50 пар. Так как дорожный граф связен, для каждой пары можно выбрать маршрут, соединяющий города этой пары. Для каждой дороги посчитаем, в скольких выбранных маршрутах она встретилась, и объявим главными ровно те дороги, у которых эта кратность нечётна. В фиксированном городе его собственный маршрут входит или выходит через одну дорогу, а каждый чужой маршрут либо не проходит через город, либо входит и выходит, давая вклад 0 или 2. Поэтому число главных дорог, выходящих из каждого города, нечётно.",
