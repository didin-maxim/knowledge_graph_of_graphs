        "id": "stmt-original",
        "title": "Два турнира с одинаковыми парами",
        "text": "В первый день \\(2n\\) школьников играли в пинг-понг навылет: сначала сыграли двое, затем победитель сыграл с третьим, победитель этой пары — с четвёртым и так далее, пока не сыграл последний школьник. Во второй день те же школьники разыграли кубок: сначала произвольно разбились на пары, проигравшие выбыли, победители снова произвольно разбились на пары и так далее. Оказалось, что наборы игравших пар в первый и во второй день были одни и те же. Найдите наибольшее возможное значение \\(n\\).",
