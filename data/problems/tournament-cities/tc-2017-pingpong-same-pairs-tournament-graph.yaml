      "id": "idea-played-pairs-graph",
      "title": "Граф сыгранных партий",
      "text": "Рассматривается граф сыгранных партий: вершины — игроки, рёбра — сыгранные матчи. В игре первого дня после удаления всех вершин степени 1 остаётся путь. Во второй день удалённые листья — это проигравшие в первом круге, а оставшийся граф является графом кубка на победителях первого круга; если он путь, то победителей первого круга не больше 4.",
