  "solutions": [
    {
      "id": "sol-played-pairs-graph",
      "title": "Граф матчей и первый слой листьев",
      "text": "Ответ: наибольшее возможное значение равно \\(4\\).\n\nПусть \\(N=2n\\) — число игроков. Построим граф сыгранных пар: его вершины — игроки, а ребро соединяет двух игроков, если они играли друг с другом. В оба дня было \\(N-1\\) матчей, и по условию множества рёбер совпадают.\n\nСначала проанализируем граф первого дня. Игроки вступают по одному: после первого матча текущий победитель играет со следующим игроком, затем новый текущий победитель снова играет со следующим, и так далее. Каждый новый игрок добавляет одну новую вершину и одно ребро к текущему победителю, поэтому получается дерево.\n\nИгроки, которые в какой-то момент становились текущими победителями, образуют путь: если первый такой победитель — \\(a_1\\), затем его сменил \\(a_2\\), затем \\(a_3\\), то возникают рёбра\n\\[\na_1-a_2-a_3-\\cdots .\n\\]\nКаждый игрок, который вошёл, сразу проиграл и больше не играл, является листом, присоединённым к одной вершине этого пути. Поэтому после удаления всех вершин степени 1 из графа первого дня остаётся путь, возможно пустой или одноточечный.\n\nТеперь рассмотрим тот же граф как граф кубка второго дня. Все проигравшие в первом круге сыграли ровно один матч, значит они являются листьями. После удаления этих листьев остаётся граф кубка на \\(N/2=n\\) победителях первого круга. Если \\(n\\ge5\\), то общий победитель должен выиграть как минимум три последующих матча, значит его степень в оставшемся графе не меньше 3. Такой граф не может быть путём. Следовательно, \\(n\\le4\\).\n\nДля \\(n=4\\) пример существует. Возьмём восемь игроков. Во второй день проведём кубковые матчи\n\\[\n1\\!-\\!2,\\ 3\\!-\\!4,\\ 5\\!-\\!6,\\ 7\\!-\\!8,\\ 2\\!-\\!4,\\ 6\\!-\\!8,\\ 4\\!-\\!8,\n\\]\nс победителями \\(2,4,6,8,4,8,8\\). В первый день пусть порядок вступления будет\n\\[\n1,2,4,3,8,7,6,5,\n\\]\nа победители выбираются так, чтобы сыгранные пары были\n\\[\n1\\!-\\!2,\\ 2\\!-\\!4,\\ 4\\!-\\!3,\\ 4\\!-\\!8,\\ 8\\!-\\!7,\\ 8\\!-\\!6,\\ 6\\!-\\!5.\n\\]\nЭто тот же набор пар. Значит, \\(n=4\\) возможно, а большее \\(n\\) невозможно.",
