      "title": "Граф сыгранных партий",
      "text": "Официальное решение строит граф, вершинами которого являются игроки, а рёбрами — сыгранные партии. Для игры навылет после удаления висячих вершин остаётся путь; для кубка тот же граф после удаления висячих вершин должен быть графом турнира на победителях первого этапа.",
