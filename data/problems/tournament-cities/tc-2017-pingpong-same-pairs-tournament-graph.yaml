  "solutions": [
    {
      "id": "sol-played-pairs-graph",
      "title": "Граф партий и удаление висячих вершин",
      "text": "Построим граф: вершины — игроки, рёбра — сыгранные партии. В игре первого дня выберем партии, победители которых раньше не выигрывали; соответствующие рёбра образуют путь, а остальные рёбра одним концом примыкают к этому пути. Поэтому после удаления всех висячих вершин остаётся путь без крайних вершин. Рассмотрим тот же граф как граф кубкового турнира. После удаления висячих вершин остаётся граф турнира на \\(2n-1\\) победителях первого этапа. Он может быть путём только при \\(n\\le 3\\), иначе победитель кубка имеет степень не меньше 3. Значит, \\(n\\le 3\\). При \\(n=3\\) пример дают пары кубка \\(1-2,3-4,5-6,7-8,2-4,6-8,4-8\\) и пары игры навылет \\(1-2,2-4,3-4,4-8,7-8,8-6,6-5\\).",
