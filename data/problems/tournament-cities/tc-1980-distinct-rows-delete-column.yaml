  "solutions": [
    {
      "id": "sol-essential-column-forest",
      "title": "Граф существенных столбцов",
      "text": "Назовём столбец существенным, если после его удаления какие-то две строки становятся одинаковыми. Тогда для такого столбца можно выбрать пару строк, которые отличаются ровно в этом столбце. Предположим, что все N столбцов существенны, и построим граф: вершины — строки, а для каждого столбца проведём ребро между выбранной для него парой строк. Если в этом графе есть цикл, возьмём на нём ребро, соответствующее столбцу c. На всех остальных рёбрах цикла строки имеют одинаковые значения в столбце c, потому что эти пары отличаются только в своих столбцах, не равных c. Значит, двигаясь по циклу от одного конца выбранного ребра к другому без этого ребра, получаем равенство значений в столбце c. Но выбранная пара должна отличаться в столбце c — противоречие. Значит, граф без циклов, а в графе на N вершинах без циклов не больше N-1 рёбер. Поэтому не все N столбцов существенны; несущественный столбец можно вычеркнуть.",
