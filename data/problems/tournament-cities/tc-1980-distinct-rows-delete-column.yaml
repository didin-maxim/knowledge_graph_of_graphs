      "id": "idea-essential-columns-form-forest",
      "title": "Существенные столбцы образуют граф без циклов",
      "text": "Если каждый столбец необходим, выберем для него пару строк, различающихся только в этом столбце. Эти пары становятся рёбрами графа на строках. Цикл невозможен: вдоль остальных рёбер значение в фиксированном столбце сохраняется, а на выбранном ребре должно измениться.",
