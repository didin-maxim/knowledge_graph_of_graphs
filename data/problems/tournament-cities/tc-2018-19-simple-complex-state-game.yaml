  "solutions": [
    {
      "id": "sol-tree-cycle",
      "title": "Дерево и индукция по графу с циклом",
      "text": "В простом государстве граф связен и не содержит циклов, то есть это дерево. Петя выбирает корень и ориентирует все рёбра к нему; после каждого разворота ребра около туриста тот идёт по развёрнутому ребру, и все пути снова направлены к его новой вершине. В сложном государстве граф содержит цикл. Для простого цикла Вася разворачивает ребро перед туристом, не давая вернуться назад без исчерпания хода. Для общего графа берётся минимальный цикл и удаляется вершина максимального расстояния от него; по индукции Вася выигрывает в меньшем связном графе с циклом. Если турист вынужден зайти в удалённую вершину, Вася разворачивает входящее ребро и возвращает игру в меньший граф, уменьшая число оставшихся входов.",
