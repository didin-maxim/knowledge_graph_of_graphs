    {
      "id": "idea-tree-root-orientation",
      "title": "Ориентация дерева к корню",
      "text": "В дереве можно выбрать корень и ориентировать каждое ребро к текущему положению туриста; после разворота одного инцидентного ребра турист идёт именно по нему, и инвариант восстанавливается.",
