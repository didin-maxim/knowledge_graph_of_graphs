        "text": "На сборах теннисистов было 30 мастеров и 30 юниоров. Каждый мастер сыграл с одним мастером и пятнадцатью юниорами, а каждый юниор — с одним юниором и пятнадцатью мастерами. Докажите, что найдутся такие два мастера и два юниора, что эти мастера сыграли между собой, юниоры — между собой, каждый из двух мастеров — хотя бы с одним из двух юниоров, а каждый из двух юниоров — хотя бы с одним из двух мастеров.",
