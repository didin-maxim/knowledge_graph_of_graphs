  "solutions": [
    {
      "id": "sol-ai-2x2-domino-parity",
      "title": "ИИ-решение через блоки 2x2 и чётность доминошек",
      "text": "Разобьём мастеров на 15 пар, сыгравших между собой, и поставим эти пары соседними столбцами таблицы \\(30\\times30\\). Аналогично разобьём юниоров на 15 пар, сыгравших между собой, и поставим эти пары соседними строками. Клетку таблицы закрасим, если соответствующие мастер и юниор сыграли друг с другом. В каждом столбце и в каждой строке закрашено ровно 15 клеток, поэтому всего закрашено \\(30\\cdot15=450\\) клеток, то есть половина таблицы. Разбиение на пары столбцов и пары строк разбивает таблицу на \\(15\\cdot15=225\\) блоков \\(2\\times2\\). Нужные два мастера и два юниора найдутся ровно тогда, когда в некотором блоке каждая строка и каждый столбец имеют хотя бы одну закрашенную клетку. Для блока \\(2\\times2\\) это равносильно тому, что среди закрашенных клеток есть одна из двух диагоналей. Предположим противное: ни в одном блоке такой диагонали нет. Тогда в каждом блоке не больше двух закрашенных клеток; если бы их было три или четыре, диагональ точно появилась бы. Но всего закрашенных клеток 450, а блоков 225, значит в каждом блоке ровно две закрашенные клетки. При отсутствии закрашенной диагонали эти две клетки в каждом блоке образуют горизонтальную или вертикальную доминошку. Рассмотрим фиксированную пару соседних столбцов, соответствующую паре мастеров. В каждом из этих двух столбцов закрашено по 15 клеток. Каждый горизонтальный домино-блок в этой вертикальной полосе даёт по одной закрашенной клетке в оба столбца; каждый вертикальный домино-блок даёт две клетки в один столбец и ни одной в другой. Так как суммарные числа закрашенных клеток в двух столбцах равны, количество вертикальных доминошек, лежащих в левом столбце пары, равно количеству вертикальных доминошек, лежащих в правом столбце пары. Значит, всего вертикальных доминошек в этой полосе чётно. Суммируя по всем 15 парам столбцов, получаем, что общее число вертикальных доминошек чётно. Точно так же, рассматривая пары строк, получаем, что общее число горизонтальных доминошек чётно. Но каждый из 225 блоков содержит ровно одну доминошку, горизонтальную или вертикальную, поэтому общее число доминошек равно 225, нечётно. Противоречие. Следовательно, существует блок с закрашенной диагональю, и соответствующие пара мастеров и пара юниоров удовлетворяют условию.",
