  "solutions": [
    {
      "id": "sol-odd-even",
      "title": "Нечётный и чётный случаи",
      "text": "Если \\(n=2k-1\\), обозначим гномов за столиками \\(A_i\\) и \\(B_i\\). Добрый волшебник добавляет рёбра \\((A_i,B_i)\\) и \\((A_i,B_{i+1})\\). После удаления \\(n\\) из \\(2n\\) рёбер в одной из двух систем останется хотя бы \\(k\\) рёбер; на нечётном цикле среди них найдутся две соседние перемычки. Эти две перемычки позволяют разрезать оба старых цикла и склеить их в один общий цикл. Если \\(n\\) чётно, раскрасим вершины каждого старого цикла в два цвета через одну. Сумма степеней по добавленным рёбрам равна \\(4n\\), поэтому у одного из четырёх цветовых классов она не больше \\(n\\). Злой волшебник удаляет все добавленные рёбра, инцидентные этому классу. Тогда каждая вершина этого класса остаётся соединённой только со своими двумя старыми соседями, и общий гамильтонов цикл через все вершины невозможен. Ответ: все нечётные \\(n>1\\).",
