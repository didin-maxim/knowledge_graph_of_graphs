      "id": "idea-reachable-cut",
      "title": "Разрез достижимых и недостижимых клеток",
      "text": "Если жук больше не может расширить множество достижимых клеток, все двери через границу ориентированы внутрь достижимого множества. Но в клеточном графе через такую границу есть по крайней мере два ребра, и одно из них должно было дать обратный переход.",
