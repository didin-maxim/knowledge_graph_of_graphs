        "title": "Ориентирование рёбер клеточного графа при первом проходе",
        "text": "В клеточном графе квадрата вершины соответствуют клеткам, а рёбра - общим сторонам клеток. При первом проходе по неориентированному ребру оно ориентируется в сторону движения; далее по нему можно ходить только в этом направлении. Требуется доказать, что из заданной начальной вершины можно посетить все вершины.",
