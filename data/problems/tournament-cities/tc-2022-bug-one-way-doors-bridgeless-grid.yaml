  "ideas": [
    {
      "id": "idea-reachable-cut",
      "title": "Разрез достижимых и недостижимых клеток",
      "text": "Если жук больше не может расширить множество достижимых клеток, все двери через границу ориентированы внутрь достижимого множества. Но в клеточном графе через такую границу есть по крайней мере два ребра, и одно из них должно было дать обратный переход.",
      "tags": [
        "connectivity"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-reachable-cut",
      "title": "Достижимые клетки и отсутствие мостов",
      "text": "Пусть \\(D\\) — множество клеток, в которых жук когда-либо мог оказаться, следуя уже открытым направлениям и открывая новые двери по мере движения. Предположим, что остались недостижимые клетки. Рассмотрим границу между \\(D\\) и её дополнением. Все уже открытые двери на этой границе должны быть направлены в сторону \\(D\\), иначе жук мог бы перейти наружу. В клеточном квадрате граница достижимой области не может состоять из единственного ребра-моста: между \\(D\\) и дополнением есть как минимум две соседние стороны. Значит, жук когда-то открыл одну из таких дверей, выйдя из недостижимой части в \\(D\\), а затем мог вернуться к другой граничной двери и расширить \\(D\\), противоречие. Поэтому все клетки достижимы. То же рассуждение работает для произвольного графа без мостов, если при первом проходе по ребру на нём рисуется стрелка.",
