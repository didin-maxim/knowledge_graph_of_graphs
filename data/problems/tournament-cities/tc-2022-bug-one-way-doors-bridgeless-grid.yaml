        "id": "stmt-original",
        "title": "Двери между соседними клетками",
        "text": "В клетчатом квадрате между каждыми двумя соседними по стороне клетками есть закрытая дверь. Жук начинает в одной клетке. Закрытую дверь он открывает в ту сторону, в которую идёт; через открытую дверь затем можно проходить только в этом направлении. Докажите, что жук сможет побывать во всех клетках.",
