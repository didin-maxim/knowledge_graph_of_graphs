  "solutions": [
    {
      "id": "sol-reachable-cut",
      "title": "Достижимые клетки и отсутствие мостов",
      "text": "Докажем немного более общее утверждение: если \\(G\\) - связный граф без мостов, то из любой начальной вершины можно пройти так, чтобы посетить все вершины, при этом каждое новое ребро при первом проходе ориентируется в сторону движения, а дальше используется только по стрелке. Клеточный граф квадрата без мостов: каждое ребро лежит в некотором маленьком прямоугольном цикле; для квадрата \\(1\\times1\\) утверждение тривиально.\n\nБудем строить маршрут постепенно. Важный инвариант такой: среди уже открытых дверей есть сильно связная ориентированная часть на множестве уже освоенных клеток \\(S\\). Это означает, что, находясь в любой клетке из \\(S\\), жук может по уже открытым дверям добраться до любой другой клетки из \\(S\\). В начале \\(S\\) состоит только из стартовой клетки, и инвариант верен.\n\nПусть \\(S\\) ещё не все вершины графа. Так как граф связен, из \\(S\\) выходит хотя бы одно ребро \\(uv\\), где \\(u\\in S\\), \\(v\\notin S\\). Это ребро не является мостом, поэтому оно лежит на некотором цикле. Если идти по этому циклу от \\(u\\) через \\(v\\), то рано или поздно мы впервые вернёмся в множество \\(S\\). Получаем путь\n\\[\nu=x_0,x_1,\\ldots,x_r=y,\n\\]\nу которого концы \\(u,y\\) лежат в \\(S\\), а все внутренние вершины \\(x_1,\\ldots,x_{r-1}\\) не лежат в \\(S\\). Все рёбра этого пути ещё закрыты: иначе внутренняя вершина пути уже была бы посещена и принадлежала бы \\(S\\).\n\nТеперь жук делает расширение. По инварианту он может внутри \\(S\\) добраться до клетки \\(u\\). Затем он проходит по закрытым дверям вдоль пути\n\\[\nu=x_0,x_1,\\ldots,x_r=y,\n\\]\nи тем самым открывает все эти двери в направлении от \\(u\\) к \\(y\\). Новые внутренние клетки пути становятся посещёнными; добавим их к \\(S\\).\n\nПроверим, что инвариант сохранился. Старые клетки из \\(S\\) по-прежнему сильно связны между собой. Из любой старой клетки можно добраться до \\(u\\), затем пройти по новому ориентированному пути и попасть в любую новую клетку на этом пути. Из новой клетки можно продолжить движение по тому же ориентированному пути до \\(y\\), а из \\(y\\) по старым открытым дверям добраться до любой старой клетки. Значит, после расширения все освоенные клетки снова образуют сильно связную ориентированную часть.\n\nКаждое расширение добавляет хотя бы одну новую клетку. Клеток конечное число, поэтому процесс закончится только тогда, когда \\(S\\) станет множеством всех клеток. Следовательно, жук сможет побывать во всех клетках.\n\nДля исходной задачи остаётся лишь заметить, что граф соседства клеток в клетчатом квадрате действительно не имеет мостов: удаление одной общей стороны двух соседних клеток не разрывает граф, потому что вокруг этой стороны можно обойти через соседние клетки по маленькому циклу; на границе квадрата тот же обход лежит в соседнем \\(2\\times1\\) или \\(1\\times2\\) прямоугольнике, если квадрат больше одной клетки.",
