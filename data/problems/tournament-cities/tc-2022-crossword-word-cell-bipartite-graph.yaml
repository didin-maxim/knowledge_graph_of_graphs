  "ideas": [
    {
      "id": "idea-crossword-incidence-graph",
      "title": "Двудольный граф слов и клеток",
      "text": "Официальное решение строит двудольный граф: первая доля — слова кроссворда, вторая — занятые клетки, а ребро соединяет слово с клеткой, если слово содержит эту клетку.",
      "tags": [
        "graph_model",
        "double_counting"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-incidence-degree-count",
      "title": "Оценка через двудольный граф инцидентности",
      "text": "Пример для прямоугольника \\(n\\times2\\) даёт \\(x=n+2\\) и \\(y=2\\), то есть отношение \\(1+n/2\\). Докажем, что больше нельзя. Выберем покрытие кроссворда наименьшим числом слов и назовём его слова правильными. Если в кроссворде \\(z\\) клеток, то правильные слова покрывают все клетки, поэтому сумма их длин не меньше \\(z\\). Каждое слово имеет длину не больше \\(n\\), значит, правильных слов не меньше \\(z/n\\). Для второй оценки можно удалить слова длины 1, после чего построить двудольный граф: вершины первой доли — все слова кроссворда, вершины второй — занятые клетки, ребро означает принадлежность клетки слову. Вершины-слова из минимального покрытия насыщают вторую долю; сумма их степеней не больше \\(ny\\), а каждое непокрывающее слово имеет степень хотя бы 2. Подсчёт рёбер даёт \\(x/y\\le 1+n/2\\).",
