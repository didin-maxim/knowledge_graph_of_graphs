        "id": "stmt-original",
        "title": "Кроссворд в квадрате n на n",
        "text": "Дан клетчатый квадрат \\(n\\times n\\). Кроссвордом будем называть некоторый набор его клеток. Словом называется любая горизонтальная или вертикальная полоска из клеток кроссворда, не содержащаяся ни в какой большей такой полоске. Пусть \\(x\\) — количество слов в кроссворде, а \\(y\\) — наименьшее количество слов, которыми можно покрыть все клетки кроссворда. Найдите максимум отношения \\(x/y\\) при данном \\(n\\).",
