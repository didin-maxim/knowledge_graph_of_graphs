  "solutions": [
    {
      "id": "sol-incidence-degree-count",
      "title": "Оценка через двудольный граф инцидентности",
      "text": "Ответ равен \\(1+\\frac n2\\).\n\nСначала покажем, что это значение достигается. Возьмём в квадрате \\(n\\times n\\) прямоугольник из двух соседних столбцов и всех \\(n\\) строк. Его слова — это \\(n\\) горизонтальных слов длины \\(2\\) и два вертикальных слова длины \\(n\\), поэтому \\(x=n+2\\). Все клетки можно покрыть двумя вертикальными словами, и одним словом покрыть их нельзя, значит \\(y=2\\). Получаем \\(x/y=(n+2)/2=1+n/2\\).\n\nДокажем верхнюю оценку. Пусть в кроссворде \\(z\\) клеток. Выберем покрытие минимальным числом слов; эти \\(y\\) слов назовём правильными, остальные слова — неправильными. Так как правильные слова покрывают все клетки, сумма их длин не меньше \\(z\\). Длина любого слова не превосходит \\(n\\), следовательно\n\\[\ny\\ge \\frac zn.\n\\]\n\nТеперь оценим число неправильных слов. Каждая клетка принадлежит не более чем одному горизонтальному и не более чем одному вертикальному слову. Поскольку клетка покрыта каким-то правильным словом, она может принадлежать не более чем одному неправильному слову. Значит, сумма длин всех неправильных слов не превосходит \\(z\\).\n\nЕсли слово состоит из одной клетки, то эта клетка не имеет соседней клетки кроссворда ни по горизонтали, ни по вертикали: иначе одноточечная полоска содержалась бы в большей полоске. Такая одиночная клетка не может быть покрыта никаким другим словом, поэтому соответствующее одноточечное слово входит в любое покрытие, в частности является правильным. Следовательно, каждое неправильное слово имеет длину хотя бы \\(2\\). Поэтому неправильных слов не больше \\(z/2\\).\n\nВсего слов \\(x\\) равно числу правильных плюс числу неправильных, значит\n\\[\nx\\le y+\\frac z2.\n\\]\nДелим на \\(y\\) и используем \\(y\\ge z/n\\):\n\\[\n\\frac xy\\le 1+\\frac{z}{2y}\\le 1+\\frac n2.\n\\]\nНижняя и верхняя оценки совпали, поэтому максимум равен \\(1+\\frac n2\\).",
