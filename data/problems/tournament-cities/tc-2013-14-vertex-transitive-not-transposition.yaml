      {
        "id": "stmt-original",
        "title": "Список железных дорог и перенумерации",
        "text": "Каждому городу в некоторой стране присвоен индивидуальный номер. Имеется список, в котором для каждой пары номеров указано, соединены города с данными номерами железной дорогой или нет. Оказалось, что, какие ни взять два номера M и N из списка, можно так перенумеровать города, что город с номером M получит номер N, но список по-прежнему будет верным. Верно ли, что, какие ни взять два номера M и N из списка, можно так перенумеровать города, что город с номером M получит номер N, город с номером N получит номер M, но список по-прежнему будет верным?",
        "source_id": "src-problems-64663",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": []
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Для конечного простого графа G назовём перенумерацию вершин допустимой, если после неё любые две новые вершины соединены ребром тогда и только тогда, когда до перенумерации были соединены соответствующие старые вершины. Известно, что для любых двух вершин u и v графа G существует допустимая перенумерация, переводящая u в v. Обязательно ли для любых u и v существует допустимая перенумерация, меняющая u и v местами?",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [
          "simple_graph"
        ]
      }
    ],
