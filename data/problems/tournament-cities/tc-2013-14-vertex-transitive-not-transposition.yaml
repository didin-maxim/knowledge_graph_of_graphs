  "ideas": [
    {
      "id": "idea-vertex-transitive-counterexample",
      "title": "Транзитивность не обязана содержать транспозиции",
      "text": "Условие говорит, что группа симметрий графа действует транзитивно на вершинах, но из этого не следует, что в ней есть симметрия, переставляющая любые две заданные вершины.",
