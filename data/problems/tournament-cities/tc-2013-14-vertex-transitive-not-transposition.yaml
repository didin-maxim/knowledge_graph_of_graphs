  "solutions": [
    {
      "id": "sol-counterexample-from-source",
      "title": "Контрпример с 12 городами",
      "text": "Ответ отрицательный. В опубликованном решении на problems.ru приведён граф на 12 городах с симметриями, позволяющими перевести любой номер в любой другой. Однако если попытаться поменять местами две специальные вершины, например 1 и 3 в нумерации источника, то их единственный общий сосед 2 должен остаться на месте; затем вынужденно фиксируется ещё один сосед, после чего сравнение числа общих соседей для пар вершин даёт противоречие. Полная проверка контрпримера зависит от рисунка графа в источнике.",
