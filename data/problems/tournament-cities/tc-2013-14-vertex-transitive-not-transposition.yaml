  "solutions": [
    {
      "id": "sol-counterexample-from-source",
      "title": "Явный контрпример: граф усечённого тетраэдра",
      "text": "Ответ отрицательный. Дадим контрпример без рисунка. Возьмём 12 вершин вида (i,j), где i,j\\in\\{1,2,3,4\\} и i\\ne j. Соединим две вершины ребром в двух случаях: либо у них одинаковая первая координата, то есть (i,j) соединена с (i,k) при j\\ne k, либо они имеют вид (i,j) и (j,i). Иными словами, есть четыре треугольника T_i=\\{(i,j):j\\ne i\\} и шесть рёбер, попарно соединяющих противоположно ориентированные пары.\n\nГраф вершинно-транзитивен: любая перестановка \\sigma множества \\{1,2,3,4\\} переводит (i,j) в (\\sigma(i),\\sigma(j)) и сохраняет оба типа рёбер. Для любых двух вершин (i,j) и (k,l) можно выбрать такую \\sigma, что \\sigma(i)=k и \\sigma(j)=l, значит, допустимая перенумерация переводит первую вершину во вторую.\n\nНо не всякую пару можно поменять местами. Покажем, что автоморфизмы этого графа только что описанные. Рёбра внутри треугольников лежат в треугольниках, а рёбра (i,j)(j,i) не лежат ни в одном треугольнике; поэтому любой автоморфизм переводит четыре треугольника T_i в четыре такие же треугольника. Пусть T_i перешёл в T_{\\sigma(i)}. Вершина (i,j) внутри T_i узнаётся как единственная вершина этого треугольника, соединённая внешним ребром с треугольником T_j; следовательно, она переходит в (\\sigma(i),\\sigma(j)). Значит, каждый автоморфизм действительно задаётся перестановкой \\sigma. Теперь если бы автоморфизм менял местами x=(1,2) и y=(2,3), то из x\\mapsto y получалось бы \\sigma(1)=2, \\sigma(2)=3, а из y\\mapsto x — одновременно \\sigma(2)=1, \\sigma(3)=2. Это невозможно. Значит, условие задачи выполнено, но требуемая взаимная перестановка двух номеров не всегда существует.",
      "idea_ids": [
        "idea-vertex-transitive-counterexample"
      ],
