  "solutions": [
    {
      "id": "sol-construct-63",
      "title": "Конструкция на 63 ладьи и запрет 64-й",
      "text": "Ответ: 63. Обозначим клетки как a1,...,h8. Сначала ставим ладьи в a1, a8, h8. Затем ставим b1,c1,d1,e1,f1,g1; после этого h7,h6,h5,h4,h3,h2. Далее заполняем столбцы слева направо: a2,a3,a4,a5,a6,a7, затем b2,b3,...,b8, затем c2,...,c8, и так далее до g2,...,g8. Всего поставлено 3+6+6+6+6\\cdot 7=63 ладьи, не занята только клетка h1. Проверка правила такова. На первом нижнем отрезке каждая новая ладья бьёт только ближайшую уже поставленную слева; на правом столбце — только ближайшую уже поставленную сверху. В столбце a каждая новая ладья бьёт две ладьи по своему столбцу, ближайшие сверху и снизу, и одну ладью в той же строке на h-столбце, всего три. В каждом из столбцов b,...,g новая ладья бьёт ближайшую уже поставленную ладью в своём столбце снизу и две ближайшие ладьи в своей строке, слева и справа, снова всего три. Значит, такая расстановка допустима.\n\nПоставить все 64 ладьи нельзя. В любой попытке заполнить всю доску рассмотрим тот момент, когда ставится последний из четырёх углов. К этому моменту два соседних с ним угла уже заняты: один лежит в той же строке, другой в том же столбце. Из угловой клетки новая ладья видит ровно две ранее поставленные ладьи — ближайшую в своей строке и ближайшую в своём столбце; другие ладьи на этих двух линиях закрыты ближайшими. Число две чётно, поэтому последний угол поставить нельзя. Следовательно, максимум равен 63.",
