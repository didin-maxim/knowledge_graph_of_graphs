      {
        "id": "stmt-original",
        "title": "Саша выставляет ладьи",
        "text": "Саша выставляет на пустую шахматную доску 8×8 ладьи: первую — куда захочет, а каждую следующую ставит так, чтобы она била нечётное число ранее выставленных ладей. Ладьи бьют по горизонтали и вертикали, если между ними нет другой ладьи. Какое наибольшее число ладей он сможет так выставить?",
        "source_id": "src-problems-98546",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": []
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Клетки доски 8×8 постепенно выбираются. На уже выбранных клетках задан граф видимости: две клетки смежны, если они лежат в одной строке или одном столбце и между ними в этой строке или столбце нет другой выбранной клетки. Найдите наибольшую длину последовательности выбора клеток, в которой каждая новая клетка, начиная со второй, имеет нечётное число соседей среди уже выбранных клеток в графе видимости.",
