  "ideas": [
    {
      "id": "idea-missing-corner-after-three-corners",
      "title": "Три угла запрещают четвёртый",
      "text": "Конструкция почти заполняет доску, но верхняя оценка ловит неизбежную ситуацию: когда три угла уже заняты, четвёртый угол всегда бьёт ровно две ладьи — ближайшую по строке и ближайшую по столбцу.",
      "tags": [
        "double_counting"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-construct-63",
      "title": "Конструкция на 63 ладьи и запрет 64-й",
      "text": "63 ладьи можно поставить так, как указано в источнике: сначала три угла, затем последовательно заполнить одну сторону, одну соседнюю сторону и оставшиеся вертикали так, чтобы каждая новая ладья била нечётное число уже стоящих. Поставить 64 ладьи нельзя. После того как заняты три угловые клетки, четвёртый угол, когда бы его ни пытались занять, будет бить ровно две ранее поставленные ладьи: ближайшую по своей горизонтали и ближайшую по своей вертикали. Это чётное число, значит четвёртый угол поставить нельзя. Поэтому максимум равен 63.",
