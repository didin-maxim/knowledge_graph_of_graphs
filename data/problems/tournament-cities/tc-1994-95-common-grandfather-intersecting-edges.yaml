  "solutions": [
    {
      "id": "sol-star-or-triangle",
      "title": "Звезда или треугольник",
      "text": "Построим граф, вершины которого — деды, а каждый ребёнок задаёт ребро между двумя своими дедами. По условию любые два таких ребра имеют общий конец. Если все 20 рёбер имеют общий конец, то соответствующий дед имеет 20 внуков, и всё доказано. Иначе найдутся два ребра с общим концом X, скажем XY и XZ, и есть ребро, не проходящее через X. Чтобы пересечь и XY, и XZ, оно обязано быть YZ. Теперь любое выбранное ребро должно пересекать все три стороны треугольника XYZ. В простом графе это возможно только для одной из сторон этого треугольника. Значит, все 20 детей имеют дедов среди X,Y,Z. Сумма чисел внуков у X,Y,Z равна 40, потому что каждый ребёнок посчитан у двух дедов. Поэтому у одного из трёх дедов не меньше \\(\\lceil 40/3\\rceil=14\\) внуков.",
      "idea_ids": [
        "idea-pairwise-intersecting-edges-star-or-triangle"
      ],
      "standard_idea_ids": [
        "double_counting",
        "pigeonhole_principle"
      ],
      "status": "ai_checked",
      "definition_ids": [
        "simple_graph"
      ]
    },
    {
      "id": "sol-three-grandfathers",
      "title": "Звезда или треугольник",
      "text": "Возьмём школьника A и двух его дедов X и Y. Если все школьники являются внуками X или все являются внуками Y, то всё доказано. Иначе найдётся школьник B, который не является внуком X; тогда его общий дед с A — это Y. Тем же рассуждением найдётся школьник C, который не является внуком Y; поскольку у A деды только X и Y, его общий дед с A — это X. У B и C есть общий дед Z. Покажем, что других дедов среди этих школьников нет. Пусть некоторый школьник D имеет деда W, отличного от X,Y,Z. Тогда D должен иметь общего деда с A, значит второй дед D равен X или Y. Если это X, то у D нет общего деда с B, у которого деды Y и Z; если это Y, то у D нет общего деда с C, у которого деды X и Z. Оба варианта невозможны. Значит, все дети приходятся внуками только дедам X, Y, Z. Всего у них 40 внуков с учётом повторения, поэтому у одного из трёх дедов не меньше \\(\\lceil 40/3\\rceil=14\\) внуков.",
      "idea_ids": [
        "idea-three-grandfathers"
      ],
      "standard_idea_ids": [
        "pigeonhole_principle"
      ],
      "status": "ai_checked"
    }
  ],
