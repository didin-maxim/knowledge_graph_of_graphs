  "solutions": [
    {
      "id": "sol-bound-boundary",
      "title": "Подсчёт границы двумя способами",
      "text": "Обозначим через \\(b\\) и \\(r\\) числа синих и красных клеток, а через \\(M\\) число общих сторон красных и синих клеток. Сверху считаем стороны красных клеток: надо вычесть стороны на границе таблицы и дважды учесть общие стороны двух красных клеток. Связность графа красных клеток даёт не меньше \\(r-1\\) таких общих сторон, поэтому \\(M\\le 2r-86\\). Снизу считаем стороны синих клеток: у них нет общих сторон друг с другом, а на границе таблицы синих сторон не больше \\(88\\), значит \\(M\\ge 4b-88\\). Из этих двух оценок и равенства \\(b+r=44^2\\) получается \\(b\\le (44^2+1)/3\\). Так как \\(44^2\\equiv1\\pmod3\\), целое \\(b\\) строго меньше трети всех клеток.",
      "idea_ids": [
