    "original": [
      {
        "id": "stmt-original",
        "title": "Клетки двух цветов",
        "text": "В таблице \\(44\\times44\\) часть клеток синие, а остальные красные. Никакие синие клетки не граничат друг с другом по стороне. Множество красных клеток связно по сторонам: от любой красной клетки можно добраться до любой другой красной, переходя из клетки в клетку через общую сторону и не заходя в синие клетки. Докажите, что синих клеток в таблице меньше трети.",
        "source_id": "src-problems-67296",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [
          "connected_graph"
        ]
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "В таблице \\(44\\times44\\) часть клеток синяя, остальные красные; никакие две синие клетки не имеют общей стороны. Граф красных клеток имеет вершины в красных клетках и рёбра между парами красных клеток с общей стороной. Известно, что этот граф связен. Докажите, что число синих клеток строго меньше \\(44^2/3\\).",
        "status": "ai_checked",
