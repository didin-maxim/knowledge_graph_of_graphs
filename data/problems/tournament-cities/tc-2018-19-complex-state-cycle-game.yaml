      {
        "id": "stmt-graph",
        "text": "Дан связный неориентированный граф, содержащий цикл. Петя сначала ориентирует все рёбра графа и выбирает начальную вершину фишки. На каждом своём ходе Петя обязан передвинуть фишку по исходящему ребру в соседнюю вершину, после чего Вася разворачивает одно ребро, инцидентное новой вершине фишки. Если перед ходом Пети из текущей вершины нет исходящих рёбер, Вася выигрывает. Докажите, что Вася имеет стратегию, которая при любой начальной ориентации, начальной вершине и дальнейших ходах Пети приводит к победе за конечное число ходов.",
