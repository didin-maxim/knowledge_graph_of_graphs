      "text": "В общем графе с циклом можно удалить вершину максимального расстояния от минимального цикла: оставшийся граф связен и всё ещё содержит цикл. Стратегия в меньшем графе либо выигрывает сразу, либо вынуждает Петю всё реже входить в удалённую вершину.",
