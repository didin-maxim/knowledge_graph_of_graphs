  "solutions": [
    {
      "id": "sol-vasya-cycle-induction",
      "title": "Индукция по числу вершин графа с циклом",
      "text": "Докажем более сильное утверждение: в любом связном графе с циклом Вася выигрывает независимо от ориентации рёбер и положения фишки в момент, когда наступает его ответ после хода Пети.\n\nБаза индукции — простой цикл. Пусть турист сделал ход из A_1 в A_2. После каждого такого хода Вася разворачивает следующее ребро цикла перед туристом. Если из-за этого у Пети нет исходящего ребра, Вася уже выиграл; иначе Петя вынужден идти дальше по циклу и не может вернуться назад по только что пройденному ребру. Когда турист впервые вернётся к A_1, Вася разворачивает ребро A_1A_2, и оба инцидентных ребра оказываются входящими в A_1, так что Петя проигрывает.\n\nПусть теперь граф не является простым циклом. Выберем в нём цикл C минимальной длины; он простой и без хорд. Есть вершина вне C, иначе весь граф был бы этим циклом. Возьмём вершину V вне C с максимальным расстоянием до C и обозначим через G граф после удаления V. Тогда G связен и содержит цикл C. По предположению индукции Вася имеет выигрышную стратегию в G при любой ориентации. Пока турист находится в G и ходит внутри G, Вася следует этой стратегии. Если Петя проигрывает внутри G, всё доказано. Если же стратегия вынуждает Петю выйти из G в V, Вася разворачивает ребро, по которому турист вошёл в V. Если после этого Петя не может выйти из V, он проиграл; иначе он возвращается в G, а Вася делает любой допустимый разворот в G и снова продолжает индукционную стратегию. При каждом таком заходе в V число рёбер, направленных из G в V, уменьшается на одно. Это число конечно, поэтому Петя не может бесконечно спасаться выходами в V; в конце он проиграет в G или в самой вершине V.",
