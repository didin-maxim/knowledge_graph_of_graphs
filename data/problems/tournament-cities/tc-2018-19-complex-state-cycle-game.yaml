        "id": "stmt-original",
        "title": "Игра в сложном государстве",
        "text": "В виртуальном компьютерном государстве не менее двух городов. Некоторые пары городов соединены дорогой, причём из каждого города можно добраться по дорогам до любого другого. Государство называется сложным, если можно, начав движение из какого-то города и не проходя дважды по одной и той же дороге, вернуться в этот город. Петя и Вася играют так: сначала Петя задаёт направление на каждой дороге и помещает туриста в один из городов; затем за ход Петя перемещает туриста по дороге в разрешённом направлении в соседний город, а Вася меняет направление одной дороги, входящей или выходящей из нового города туриста. Вася выигрывает, если Петя в какой-то момент не сможет сделать ход. Докажите, что в сложном государстве Вася может гарантировать победу, как бы ни играл Петя.",
        "source_id": "src-problems-66727",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [
          "connected_graph",
