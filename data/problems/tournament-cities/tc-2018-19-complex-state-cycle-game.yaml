  "solutions": [
    {
      "id": "sol-vasya-cycle-induction",
      "title": "Индукция от цикла",
      "text": "Докажем индукцией по числу вершин более сильное утверждение: если связный граф содержит цикл, то из любой ориентации и любого положения фишки в момент, когда Васе предстоит развернуть ребро, Вася за конечное время оставит фишку без исходящих рёбер.\n\nБаза: граф является простым циклом. Если сейчас из вершины фишки выходит ровно одно ребро, Вася разворачивает его внутрь и сразу запирает фишку. Если исходящих рёбер ноль или два, Вася одним разворотом оставляет ровно одно исходящее ребро; Петя вынужден пройти по нему. Обозначим этот ход \\(A_1\\to A_2\\) и выберем соответствующее направление обхода цикла. Теперь Вася смотрит на следующее ребро \\(A_2A_3\\). Если оно выходит из \\(A_2\\), Вася разворачивает его внутрь, и оба ребра при \\(A_2\\) становятся входящими. Если оно входит в \\(A_2\\), Вася разворачивает его наружу, и Петя вынужден перейти в \\(A_3\\). Вася повторяет правило. Либо фишка остановится раньше, либо обойдёт весь цикл; тогда при возвращении в \\(A_1\\) Вася разворачивает исходное ребро \\(A_1A_2\\) внутрь и останавливает фишку.\n\nИндукционный переход. Выберем цикл наименьшей длины \\(C\\). У него нет хорды, иначе хорда разделила бы его на два цикла, один из которых короче. Если граф не равен \\(C\\), выберем среди вершин вне \\(C\\) вершину \\(x\\), находящуюся на наибольшем расстоянии от \\(C\\). Граф \\(G-x\\) связен и всё ещё содержит \\(C\\). Действительно, для любой \\(y\\ne x\\) кратчайший путь от \\(y\\) к \\(C\\) не проходит через \\(x\\), иначе расстояние от \\(y\\) до \\(C\\) было бы больше расстояния от \\(x\\), вопреки максимальности выбора \\(x\\).\n\nВнутри \\(G-x\\) Вася применяет индукционную стратегию и не трогает рёбра, инцидентные \\(x\\). Если Петя проходит по стрелке \\(u\\to x\\), Вася немедленно разворачивает именно её в \\(x\\to u\\). На следующем ходу Петя обязательно выходит из \\(x\\) обратно в \\(G-x\\), после чего Вася заново запускает индукционную стратегию из нового состояния. Каждый уход в \\(x\\) навсегда уменьшает число стрелок, направленных из \\(G-x\\) в \\(x\\): одна такая стрелка разворачивается наружу, а в остальное время граничные рёбра не меняются. Поэтому уйти в \\(x\\) можно лишь конечное число раз. После последнего ухода индукционная стратегия за конечное время останавливает фишку в \\(G-x\\).\n\nЕсли в исходном рассматриваемом состоянии фишка находилась в \\(x\\), Вася сначала делает обязательный разворот. Если из \\(x\\) выходит ровно одна стрелка, он разворачивает её и сразу выигрывает. Иначе он разворачивает любое инцидентное \\(x\\) ребро так, чтобы исходящая стрелка существовала; первый ход Пети выводит фишку в \\(G-x\\), после чего применяется описанная стратегия. Индукция завершена.",
