  "ideas": [
    {
      "id": "idea-degree-color-obstruction",
      "title": "Цветовой класс с малой добавленной степенью",
      "text": "При чётном \\(n\\) каждый исходный цикл раскрашивается в два цвета через одну вершину. Среди четырёх цветовых классов есть класс, суммарная степень которого по добавленным рёбрам не больше \\(n\\). Удалив все добавленные рёбра, инцидентные этому классу, злой волшебник заставляет любой гамильтонов цикл содержать целый старый цикл, что невозможно.",
