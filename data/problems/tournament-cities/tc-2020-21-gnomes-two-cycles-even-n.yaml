        "hamiltonian_cycles"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-even-color-obstruction",
      "title": "Стратегия злого волшебника",
      "text": "Так как \\(n\\) чётно, раскрасим вершины каждого из двух исходных циклов в два цвета через одну; всего получим четыре цветовых класса. Рассмотрим граф из \\(2n\\) добавленных добрым волшебником рёбер. Сумма степеней всех вершин по этим рёбрам равна \\(4n\\), поэтому для одного из четырёх цветовых классов эта сумма не больше \\(n\\). Злой волшебник удаляет все добавленные рёбра, инцидентные вершинам этого класса; таких рёбер не больше \\(n\\), а если меньше, он удаляет произвольные добавленные рёбра до общего числа \\(n\\). После этого каждая вершина выбранного класса соединена только с двумя своими старыми соседями. Если бы в оставшемся графе был гамильтонов цикл, то у каждой такой вершины он был бы вынужден использовать оба старых ребра. Но выбранный класс занимает через одну все вершины одного из исходных циклов, значит гамильтонов цикл содержал бы все рёбра этого старого цикла, то есть имел бы внутри себя меньший цикл длины \\(n\\). Это невозможно для одного цикла через все \\(2n\\) вершин. Следовательно, при чётном \\(n\\) злой волшебник всегда может помешать.",
