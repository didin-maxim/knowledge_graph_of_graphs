        "id": "stmt-original",
        "title": "Гномы за двумя столиками: чётное n",
        "text": "Пусть \\(n\\) чётно. За каждым из двух круглых столиков сидит по \\(n\\) гномов. Каждый гном дружит только со своими соседями по своему столику слева и справа. Добрый волшебник хочет, чтобы всех \\(2n\\) гномов можно было рассадить за один круглый стол так, чтобы каждые два соседних гнома дружили между собой. Сначала добрый волшебник подружит любые \\(2n\\) пар гномов, а затем злой волшебник поссорит между собой \\(n\\) пар из этих \\(2n\\) новых пар. Докажите, что при чётном \\(n\\) злой волшебник может помешать желаемому, как бы ни действовал добрый волшебник.",
        "source_id": "src-problems-66880",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [
