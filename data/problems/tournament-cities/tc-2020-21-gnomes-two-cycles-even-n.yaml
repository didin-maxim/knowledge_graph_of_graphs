        "text": "Пусть \\(n\\) чётно. Дан граф, являющийся объединением двух непересекающихся циклов длины \\(n\\). Первый игрок произвольно добавляет \\(2n\\) новых рёбер. Докажите, что второй игрок может удалить \\(n\\) из добавленных рёбер так, что в оставшемся графе не будет гамильтонова цикла.",
