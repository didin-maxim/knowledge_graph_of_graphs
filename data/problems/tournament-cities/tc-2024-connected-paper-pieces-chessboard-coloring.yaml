        "id": "stmt-original",
        "title": "Наклеивание связных кусков белой и чёрной клетчатой бумаги",
        "text": "У Вани есть клетчатая бумага двух видов: белая и чёрная. Он вырезает кусок из любой бумаги и наклеивает на серую клетчатую доску \\(45\\times45\\), делая так много раз. Какое минимальное число кусков нужно наклеить, чтобы «раскрасить» клетки доски в шахматном порядке? Каждый кусок — набор клеток, в котором от любой клетки до любой другой можно пройти, переходя из клетки в соседнюю через их общую сторону. Можно наклеивать куски один поверх другого. Все клетки имеют размер \\(1\\times1\\).",
