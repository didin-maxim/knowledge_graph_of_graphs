  "solutions": [
    {
      "id": "sol-ai-ready-diagonal-pairs",
      "title": "ИИ-решение через готовые диагонали",
      "text": "Ответ: 45 кусков.\n\nСначала построим раскраску за 45 кусков. Возьмём центральную клетку доски. Для \\(r=0,1,\\ldots,44\\) обозначим через \\(D_r\\) множество клеток, расстояние от которых до центральной клетки по сторонам не больше \\(r\\). Это связные множества, причём \\(D_{44}\\) уже равно всей доске \\(45\\times45\\). Наклеим сначала кусок \\(D_{44}\\), затем \\(D_{43}\\), и так далее до \\(D_0\\), каждый раз выбирая цвет, противоположный цвету предыдущего куска. Клетка на расстоянии \\(d\\) от центра сверху в последний раз покрывается куском \\(D_d\\); так как в шахматной раскраске цвет клетки зависит ровно от чётности этого расстояния, подходящий выбор цвета центрального куска даёт шахматную раскраску всей доски. Значит, 45 кусков достаточно.\n\nДокажем, что меньшего числа кусков не хватит. В любой успешной последовательности можно считать, что первый наклеенный кусок — вся доска: если первый кусок был меньше, просто расширим его до всей доски тем же цветом. На итог это не влияет, потому что каждая клетка, не входившая в первый кусок, всё равно должна была быть покрыта каким-то более поздним куском, иначе она осталась бы серой.\n\nРассмотрим 89 диагоналей, параллельных диагонали из правого верхнего угла в левый нижний, и занумеруем их подряд от левого нижнего угла к правому верхнему. В шахматной раскраске каждая такая диагональ одноцветна, а соседние диагонали имеют разные цвета. Назовём диагональ готовой, если все её клетки уже имеют тот цвет, который они должны иметь в конечной шахматной раскраске. Будем считать потенциалом число пар соседних готовых диагоналей.\n\nПосле первого, целиком покрывающего доску, куска потенциал равен 0: все клетки одного цвета, поэтому из двух соседних диагоналей не могут быть готовы обе, ведь их итоговые цвета различны. В конце потенциал равен 88, потому что готовы все 89 диагоналей.\n\nПокажем, что один следующий кусок увеличивает потенциал не больше чем на 2. Пусть очередной связный кусок пересекает диагонали с номерами от \\(k\\) до \\(l\\); это именно непрерывный отрезок номеров, так как внутри связного куска между любыми двумя клетками есть путь по соседним клеткам, а вдоль такого пути номера диагоналей меняются только на 1. Все диагонали с номерами от \\(k\\) до \\(l\\) пересекают новый кусок, значит на каждой из них после хода есть клетка цвета этого куска. Поэтому никакая пара соседних диагоналей, обе лежащие внутри отрезка \\([k,l]\\), не может стать парой готовых диагоналей: итоговые цвета этих двух диагоналей противоположны, а на обеих после хода есть клетки одного и того же цвета. Пары соседних диагоналей, полностью лежащие вне \\([k,l]\\), этим ходом не меняются. Следовательно, новые готовые пары могут появиться только на двух границах: \\((k-1,k)\\) и \\((l,l+1)\\), если такие пары существуют. Значит, потенциал за ход возрастает максимум на 2.\n\nЧтобы поднять потенциал с 0 до 88, после первого куска нужны ещё как минимум 44 куска. Всего требуется не меньше \\(1+44=45\\) кусков. Вместе с конструкцией это даёт точный ответ 45.",
