  "solutions": [
    {
      "id": "sol-ai-selected-equal-pairs-counting",
      "title": "ИИ-решение: выбранные равные пары и подсчёт рёбер",
      "text": "Докажем от противного. Пусть в многограннике нет трёх рёбер одной длины. В каждой вершине выберем одну пару равных рёбер, выходящих из этой вершины; по условию такая пара существует.\n\nПокажем, что одно и то же ребро не может быть выбрано в парах при двух своих концах. Действительно, пусть ребро \\(uv\\) выбрано и в вершине \\(u\\), и в вершине \\(v\\). Тогда в вершине \\(u\\) оно равно некоторому другому ребру, выходящему из \\(u\\), а в вершине \\(v\\) оно равно некоторому другому ребру, выходящему из \\(v\\). Эти два других ребра различны: иначе вместе с \\(uv\\) они образовали бы две разные стороны между теми же двумя вершинами, что невозможно для рёбер выпуклого многогранника. Значит, есть три различных ребра одной длины, противоречие.\n\nИтак, выбранные при разных вершинах пары не пересекаются по рёбрам. Если у многогранника \\(V\\) вершин, то мы выбрали \\(2V\\) различных рёбер. С другой стороны, из каждой вершины выходит ровно три ребра, а каждое ребро имеет два конца, поэтому всего рёбер \\(E=3V/2\\). Получаем \\(2V\\le E=3V/2\\), что невозможно при \\(V>0\\). Противоречие доказывает, что в многограннике обязательно найдутся хотя бы три равных ребра.",
