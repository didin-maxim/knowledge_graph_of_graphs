  "solutions": [
    {
      "id": "sol-ai-coordinate-simplex",
      "title": "ИИ-решение через координатный симплекс",
      "text": "Ответ: могут.\n\nПостроим граф знакомств. Программистами будут все 11-ки \\((x_1,\\ldots,x_{11})\\) неотрицательных целых чисел с суммой \\(100\\). Два программиста знакомы, если их векторы отличаются ровно переносом одной единицы из одной координаты в другую: для некоторых \\(p\\ne q\\) одна координата увеличилась на 1, другая уменьшилась на 1, а остальные не изменились. Гениями объявим 11 векторов \\(G_i=(0,\\ldots,0,100,0,\\ldots,0)\\), у которых единственная ненулевая координата стоит на месте \\(i\\).\n\nПусть первая фирма первым ходом наняла программиста \\(A=(A_1,\\ldots,A_{11})\\). Среди координат \\(A\\) есть координата не меньше 10; перенумеруем координаты так, что \\(A_{11}\\ge 10\\). Второй фирме первым ходом нужно нанять программиста\n\\[\nB=(A_1+1,A_2+1,\\ldots,A_{10}+1,A_{11}-10).\n\\]\nЭто допустимый первый ход: сумма координат осталась равной \\(100\\), а последняя координата неотрицательна.\n\nПосле каждого хода будем обозначать через \\(M_i\\) максимум \\(i\\)-й координаты среди всех программистов, уже нанятых второй фирмой, а через \\(m_i\\) — такой же максимум для первой фирмы. После выбора \\(B\\) выполнено \\(M_i>m_i\\) для всех \\(i=1,\\ldots,10\\), потому что у первой фирмы пока есть только \\(A\\), а у второй есть \\(B\\) с первыми десятью координатами на 1 больше.\n\nПокажем, что вторая фирма может поддерживать эти десять строгих неравенств после каждого своего хода. За один ход первая фирма нанимает вершину, смежную с одной из своих прежних вершин, поэтому каждая координата нового вектора отличается от соответствующей координаты некоторого прежнего вектора первой фирмы не больше чем на 1. Следовательно, после хода первой фирмы только одно из чисел \\(m_i\\), \\(i\\le 10\\), может догнать соответствующее \\(M_i\\); перепрыгнуть через него оно не может.\n\nПусть после хода первой фирмы впервые для некоторого \\(i\\le 10\\) получилось \\(m_i=M_i=d<100\\). Так как \\(M_i=d\\), у второй фирмы уже есть нанятый программист \\(S=(S_1,\\ldots,S_{11})\\) с \\(S_i=d\\). Из \\(d<100\\) следует, что у \\(S\\) есть положительная координата \\(S_j>0\\) при некотором \\(j\\ne i\\). Рассмотрим соседа \\(T\\) вершины \\(S\\), полученного переносом единицы из координаты \\(j\\) в координату \\(i\\): \\(T_i=S_i+1=d+1\\), \\(T_j=S_j-1\\), остальные координаты те же. Эта вершина ещё не нанята: её \\(i\\)-я координата больше текущих максимумов \\(M_i\\) и \\(m_i\\). Поэтому вторая фирма может нанять \\(T\\), увеличив \\(M_i\\) и восстановив строгое \\(M_i>m_i\\).\n\nЕсли после хода первой фирмы ни одно равенство \\(m_i=M_i\\) для \\(i\\le 10\\) не возникло, то вторая фирма выбирает любую координату \\(i\\le 10\\), для которой \\(M_i<100\\), и точно так же берёт у уже нанятой ею вершины с \\(i\\)-й координатой \\(M_i\\) соседнюю вершину, увеличивающую эту координату на 1. Такая вершина не занята, поскольку её \\(i\\)-я координата больше прежнего \\(M_i\\), а также больше \\(m_i\\). Если же координат с \\(M_i<100\\) уже нет, то для всех \\(i=1,\\ldots,10\\) выполнено \\(M_i=100\\).\n\nРавенство \\(m_i=M_i=100\\) не может возникнуть как угроза: вектор с \\(i\\)-й координатой 100 единственный, и если он уже нанят второй фирмой, первая не может нанять его тоже; если же он был бы первым нанят первой фирмой, то до этого нарушилось бы поддерживаемое \\(M_i>m_i\\). Значит, описанная стратегия корректна до конца игры.\n\nКогда \\(M_i=100\\), это означает, что вторая фирма наняла ровно гения \\(G_i\\), потому что сумма всех координат равна \\(100\\). Поддерживая инвариант для \\(i=1,\\ldots,10\\), вторая фирма последовательно доводит все эти десять максимумов до 100 и тем самым нанимает гениев \\(G_1,\\ldots,G_{10}\\). Следовательно, построенные знакомства позволяют второй фирме гарантированно нанять 10 из 11 гениев независимо от действий первой.",
