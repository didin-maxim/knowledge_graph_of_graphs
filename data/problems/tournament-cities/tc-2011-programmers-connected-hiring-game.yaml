        "id": "stmt-original",
        "title": "Игра фирм с программистами",
        "text": "Две фирмы по очереди нанимают программистов, среди которых есть 11 всем известных гениев. Первого программиста каждая фирма выбирает произвольно, а каждый следующий должен быть знаком с кем-то из ранее нанятых данной фирмой. Если фирма не может нанять программиста по этим правилам, она прекращает приём, а другая может продолжать. Список программистов и их знакомств заранее известен. Могут ли знакомства быть устроены так, что фирма, вступающая в игру второй, сможет нанять 10 гениев, как бы ни действовала первая фирма?",
