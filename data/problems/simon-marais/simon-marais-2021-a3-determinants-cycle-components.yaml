  "solutions": [
    {
      "id": "sol-official-graph-pruning",
      "title": "Мультиграф строк и столбцов",
      "text": "Если у матрицы есть нулевая строка, то её детерминант равен 0. Если есть строка с одной единицей, разложим детерминант по этой строке и удалим эту строку вместе с соответствующим столбцом; модуль детерминанта не изменится. Повторяем эту процедуру. Если в какой-то момент не осталось строк, получаем модуль 1; если появилась нулевая строка, получаем 0. Иначе все оставшиеся строки содержат ровно две единицы.\n\nВ этом случае считаем оставшиеся столбцы вершинами, а каждую строку - ребром между двумя столбцами, в которых стоят единицы. Петель нет, потому что в одной строке две единицы стоят в разных столбцах, но кратные рёбра возможны. Если в получившемся мультиграфе есть изолированная вершина, то соответствующий столбец нулевой и детерминант равен 0. Если есть вершина степени 1, то соответствующий столбец содержит единственную единицу, и разложение по этому столбцу удаляет листовое ребро и эту вершину без изменения модуля детерминанта. После повторения остаётся мультиграф с n вершинами и n рёбрами, без вершин степеней 0 и 1. Сумма степеней равна 2n, поэтому при минимальной степени хотя бы 2 все вершины имеют степень ровно 2. Значит каждая компонента является циклом.\n\nКомпонента-цикл длины m даёт после подходящей перестановки строк и столбцов блок \\(J_m\\), в котором i-я строка имеет единицы в столбцах i и i+1 по модулю m. Если m чётно, сумма строк с нечётными номерами равна сумме строк с чётными номерами, значит строки линейно зависимы и det \\(J_m=0\\). Если m нечётно, из равенства \\(J_m\\) x=0 следует \\(x_i+x_{i+1}=0\\) для всех i, откуда \\(x_1=-x_2=x_3=\\ldots=-x_m=-x_1\\), значит x=0; поэтому det \\(J_m\\) ненулевой. В разложении det \\(J_m\\) ненулевые члены соответствуют только двум перестановкам: тождественной и циклическому сдвигу. Их знаки при нечётном m совпадают, так что |det \\(J_m|=2\\).\n\nСледовательно, если детерминант не равен 0, его модуль равен 2^k, где k - число нечётных циклов в оставшемся графе. Каждый нечётный цикл имеет длину хотя бы 3, а 2021=3*673+2, поэтому 0<=k<=673. Все положительные значения 2^k достигаются: возьмём k блоков \\(J_3\\), а оставшиеся позиции заполним единичными диагональными блоками. Отрицательные значения достигаются перестановкой двух строк в любой такой матрице, а значение 0 достигается, например, матрицей с нулевой строкой. Значит возможны ровно 0 и все ±2^k для 0<=k<=673, всего 1+2*674=1349 значений.",
