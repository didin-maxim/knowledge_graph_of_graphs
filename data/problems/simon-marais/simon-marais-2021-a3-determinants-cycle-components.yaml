      "id": "idea-prune-to-cycle-components",
      "title": "Удаление листьев оставляет объединение циклов",
      "text": "Строка с одной единицей и соответствующий столбец удаляются разложением Лапласа без изменения модуля детерминанта. Когда все оставшиеся строки имеют по две единицы, они задают рёбра мультиграфа. Если в этом графе есть изолированная вершина, соответствующий столбец нулевой; если есть вершина степени 1, по соответствующему столбцу снова можно разложить детерминант и удалить лист. После всех таких удалений остаётся граф с n вершинами, n рёбрами и минимальной степенью хотя бы 2. Тогда сумма степеней равна 2n, поэтому все степени равны 2, то есть компоненты являются циклами.",
