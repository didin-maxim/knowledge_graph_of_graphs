      "id": "idea-prune-to-cycle-components",
      "title": "Удаление листьев оставляет объединение циклов",
      "text": "Строка с одной единицей и соответствующий столбец удаляются разложением Лапласа. Когда все оставшиеся строки имеют по две единицы, они задают ребра мультиграфа. После удаления изолированных вершин и листьев остается граф с n вершинами, n ребрами и минимальной степенью хотя бы 2, значит все степени равны 2, то есть компоненты являются циклами.",
