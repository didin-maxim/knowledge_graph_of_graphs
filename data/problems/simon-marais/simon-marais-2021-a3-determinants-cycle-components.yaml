  "solutions": [
    {
      "id": "sol-official-graph-pruning",
      "title": "Мультиграф строк и столбцов",
      "text": "Если есть нулевая строка, детерминант равен 0. Если есть строка с одной единицей, разложим по этой строке и удалим ее вместе с соответствующим столбцом; модуль детерминанта не изменится. После повторения этой процедуры либо получаем детерминант 0 или 1, либо все оставшиеся строки содержат ровно две единицы. Теперь столбцы считаем вершинами, а каждую строку - ребром между двумя столбцами, в которых стоят единицы. Петель нет, кратные ребра возможны. Если появилась изолированная вершина или вершина степени 1, соответствующий столбец снова дает детерминант 0 или удаляется разложением Лапласа. В итоге остается мультиграф с n не больше 2021 вершинами и n ребрами, без вершин степеней 0 и 1. По сумме степеней все вершины имеют степень 2, значит граф распадается на циклы. Компонента-цикл длины m дает блок J_m. Если m четно, сумма четных строк блока равна сумме нечетных, поэтому детерминант блока равен 0. Если m нечетно, разложение по первому столбцу дает |det J_m|=2. Следовательно, ненулевой модуль детерминанта равен 2^k, где k - число нечетных циклов. Каждый такой цикл имеет длину хотя бы 3, а 2021=3*673+2, поэтому 0<=k<=673. Все значения 2^k достигаются: возьмем k блоков J_3, а оставшиеся позиции заполним единичными диагональными блоками. Значит возможны 0 и все ±2^k для 0<=k<=673, всего 1349 значений.",
