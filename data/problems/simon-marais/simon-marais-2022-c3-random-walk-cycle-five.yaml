        "title": "Условие",
        "text": "Кузнечик сидит на числовой прямой, изначально в точке 0. Каждую секунду он прыгает на единицу влево или вправо с равными вероятностями; направления прыжков независимы. Пусть p - вероятность того, что после 2022 прыжков кузнечик находится в числе, делящемся на 5. Определите, верно ли p<1/5, p=1/5 или p>1/5.",
