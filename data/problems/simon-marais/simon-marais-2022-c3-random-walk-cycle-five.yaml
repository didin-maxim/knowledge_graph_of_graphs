  "solutions": [
    {
      "id": "sol-official-cycle-recurrence",
      "title": "Рекуррентное решение на C5",
      "text": "Сведем задачу к блужданию по остаткам по модулю 5, то есть по циклу C5. Пусть a_n - вероятность быть в классе 0, b_n - в классе 1, c_n - в классе 2, d_n - в классе 3, e_n - в классе 4 после n шагов. По симметрии относительно вершины 0 имеем b_n=e_n и c_n=d_n. Поэтому a_{n+1}=b_n, b_{n+1}=(a_n+c_n)/2, c_{n+1}=(b_n+c_n)/2. Докажем индукцией, что для всех четных n>0 выполнено a_n>c_n>b_n. При n=2 имеем a_2=1/2, c_2=1/4, b_2=0. Если неравенства верны для четного n, то из рекуррентных соотношений через два шага получается a_{n+2}-c_{n+2}=(a_n-b_n)/4>0 и c_{n+2}-b_{n+2}=(a_n-b_n)/4+(c_n-b_n)/4>0. Индукционный шаг доказан. Число 2022 четно и положительно. Значит a_2022>c_2022>b_2022. Пять вероятностей a_2022,b_2022,c_2022,c_2022,b_2022 суммируются в 1 и не все равны; самая большая из них, a_2022, строго больше среднего 1/5. Поэтому p>1/5.",
