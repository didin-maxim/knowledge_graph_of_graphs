      "id": "idea-cycle-five-symmetry-order",
      "title": "Симметрия цикла и порядок вероятностей",
      "text": "Вероятности в вершинах 1 и 4 равны, как и в вершинах 2 и 3. Для четных моментов можно индукцией доказать строгий порядок a_n>c_n>b_n, где a_n - вероятность в 0, b_n - в 1 или 4, c_n - в 2 или 3. Тогда a_n больше среднего значения 1/5.",
