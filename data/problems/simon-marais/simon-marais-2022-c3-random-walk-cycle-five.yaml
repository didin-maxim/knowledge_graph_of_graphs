  "solutions": [
    {
      "id": "sol-official-cycle-recurrence",
      "title": "Рекуррентное решение на C5",
      "text": "Сведем задачу к остаткам по модулю 5. После каждого прыжка остаток меняется на `+1` или `-1`, поэтому мы получаем простой случайный обход по циклу `C5` с вершинами `0,1,2,3,4`. Искомая вероятность `p` равна вероятности оказаться в вершине `0` после 2022 шагов.\n\nПусть после `n` шагов вероятности в остатках `0,1,2,3,4` равны соответственно `a_n,b_n,c_n,d_n,e_n`. Старт и правило перехода симметричны относительно отражения цикла, меняющего `1` с `4` и `2` с `3`, поэтому для всех `n` имеем `b_n=e_n` и `c_n=d_n`. Значит достаточно следить за тремя числами `a_n,b_n,c_n`.\n\nИз вершины `0` можно попасть только в `1` или `4`, из вершины `1` - в `0` или `2`, а из вершины `2` - в `1` или `3`. С учетом симметрии получаем рекуррентные формулы\n\n`a_{n+1}=b_n`,\n\n`b_{n+1}=(a_n+c_n)/2`,\n\n`c_{n+1}=(b_n+c_n)/2`.\n\nДокажем индукцией по четным `n>0`, что `a_n>c_n>b_n`. Для `n=2` это видно непосредственно: за два шага кузнечик возвращается в `0` с вероятностью `1/2`, попадает в остатки `2` и `3` с вероятностью `1/4` каждый, а в остатки `1` и `4` не попадает. То есть `a_2=1/2`, `c_2=1/4`, `b_2=0`.\n\nПусть теперь для некоторого четного `n` выполнено `a_n>c_n>b_n`. Применим рекуррентные формулы два раза. Сначала\n\n`a_{n+2}=b_{n+1}=(a_n+c_n)/2`.\n\nТакже\n\n`c_{n+2}=(b_{n+1}+c_{n+1})/2=((a_n+c_n)/2+(b_n+c_n)/2)/2=(a_n+b_n+2c_n)/4`.\n\nПоэтому\n\n`a_{n+2}-c_{n+2}=(a_n-b_n)/4>0`.\n\nОставшуюся величину вычислим явно\n\n`b_{n+2}=(a_{n+1}+c_{n+1})/2=(b_n+(b_n+c_n)/2)/2=(3b_n+c_n)/4`,\n\nи значит\n\n`c_{n+2}-b_{n+2}=(a_n+b_n+2c_n-3b_n-c_n)/4=(a_n-b_n+c_n-b_n)/4>0`.\n\nИндукционный шаг доказан: для каждого положительного четного `n` вероятность в `0` строго больше вероятности в `2` или `3`, а та строго больше вероятности в `1` или `4`.\n\nЧисло 2022 четно и положительно, следовательно `a_2022>c_2022>b_2022`. Пять вероятностей после 2022 шагов имеют вид `a_2022,b_2022,c_2022,c_2022,b_2022` и в сумме дают 1. Так как `a_2022` строго больше остальных двух типов вероятностей, оно строго больше среднего значения пяти вероятностей, то есть больше `1/5`. Поэтому `p=a_2022>1/5`.",
