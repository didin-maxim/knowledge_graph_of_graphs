  "solutions": [
    {
      "id": "sol-official-odd-cycle",
      "title": "Нечетный цикл и стороны прямой",
      "text": "Построим граф G: вершины - данные точки, ребра - данные отрезки. По условию каждая вершина имеет степень 2, поэтому каждая связная компонента G является циклом. Суммарное число вершин равно 1001, значит хотя бы одна компонента C имеет нечетное число вершин. Пусть, к противоречию, существует прямая L, пересекающая каждое ребро во внутренней точке. Прямая L не может проходить через данную вершину P: две инцидентные ей стороны PA и PB могли бы пересекаться с L во внутренних точках только если соответственно A и B тоже лежат на L, но из-за отсутствия трех коллинеарных точек это возможно не более чем для одной из них. Значит все вершины C лежат вне L. Если L пересекает ребро цикла, его концы лежат по разные стороны от L. Следовательно, обходя C, мы должны чередовать стороны прямой. Это невозможно на нечетном цикле: последняя вершина после чередования оказывается на той же стороне, что и первая, а ребро между ними уже не пересекает L. Противоречие доказывает утверждение.",
