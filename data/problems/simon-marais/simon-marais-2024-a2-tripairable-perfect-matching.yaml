  "statements": {
    "original": [
      {
        "id": "stmt-original",
        "title": "Условие",
        "text": "Положительное целое \\(n\\) называется tripairable, если множество \\(\\{1,2,\\ldots,n\\}\\) можно разбить на непересекающиеся пары так, что сумма двух элементов в каждой паре является степенью 3. Например, \\(6\\) имеет такое разбиение: \\(\\{1,2\\}\\cup\\{3,6\\}\\cup\\{4,5\\}\\), поскольку \\(1+2=3^1\\), \\(3+6=3^2\\) и \\(4+5=3^2\\). Сколько положительных целых чисел, не превосходящих 2024, являются tripairable?",
        "source_id": "src-simon-marais-2024-A2-official",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [
          "matching"
        ],
        "distinct_from": [
          "stmt-graph"
        ]
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Для каждого \\(n\\) дан граф \\(G_n\\) на вершинах \\(1,2,\\ldots,n\\), где \\(i\\) и \\(j\\) соединены ребром тогда и только тогда, когда \\(i+j\\) — степень 3. Найдите число \\(n\\le2024\\), для которых \\(G_n\\) имеет совершенное паросочетание.",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
