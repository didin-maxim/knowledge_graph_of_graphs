  "ideas": [
    {
      "id": "idea-forced-outer-matching",
      "title": "Большие вершины имеют вынужденных партнеров",
      "text": "Если \\(2\\cdot3^k\\le n<3^{k+1}\\), то каждая вершина \\(j\\ge3^k\\) может быть сматчена только с \\(3^{k+1}-j\\). Поэтому весь верхний хвост вынужденно снимается, а существование совершенного паросочетания у \\(G_n\\) сводится к меньшему графу \\(G_m\\), где \\(m=3^{k+1}-n-1\\).",
      "tags": [
        "matching",
        "induction"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-ternary-zero-two",
      "title": "Троичная запись состоит только из 0 и 2",
      "text": "Числа из промежутка \\(3^k\\le n<2\\cdot3^k\\) сразу невозможны: вершине \\(3^k\\) не хватает партнера \\(2\\cdot3^k\\). В верхней половине промежутка снятие вынужденного хвоста заменяет младшие троичные цифры на дополнение к 2, поэтому подходящие \\(n\\) — ровно те, чья троичная запись не содержит цифры 1.",
      "tags": [
        "invariant"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-ternary-count",
      "title": "Сведение совершенного паросочетания к троичной записи",
      "text": "Считаем также \\(0\\) допустимым: пустой граф имеет пустое совершенное паросочетание. Докажем сильной индукцией по \\(n\\), что \\(G_n\\) имеет совершенное паросочетание тогда и только тогда, когда троичная запись \\(n\\) состоит только из цифр 0 и 2. Для \\(n=0\\) это верно.\n\nПусть \\(n>0\\), и пусть \\(3^k\\le n<3^{k+1}\\). Сначала рассмотрим вершину \\(3^k\\). Если она сматчена с \\(x\\), то \\(3^k+x\\) должно быть степенью 3. Эта сумма больше \\(3^k\\) и меньше \\(3^{k+2}\\), значит единственная возможность — \\(3^k+x=3^{k+1}\\), то есть \\(x=2\\cdot3^k\\). Поэтому при \\(n<2\\cdot3^k\\) совершенного паросочетания нет; ровно в этом случае старшая троичная цифра числа \\(n\\) равна 1.\n\nОстается случай \\(2\\cdot3^k\\le n<3^{k+1}\\). Для всякой вершины \\(j\\ge3^k\\) ее партнер также вынужден: сумма с партнером не может быть \\(3^k\\), а следующая возможная степень в пределах графа — только \\(3^{k+1}\\), поэтому партнер равен \\(3^{k+1}-j\\). Значит, все вершины от \\(3^{k+1}-n\\) до \\(n\\) спариваются симметрично, а неспаренным остатком является ровно граф \\(G_m\\) на вершинах \\(1,2,\\ldots,m\\), где \\(m=3^{k+1}-n-1\\). Любое совершенное паросочетание этого остатка вместе с вынужденными парами дает совершенное паросочетание \\(G_n\\), и наоборот. Следовательно, \\(G_n\\) подходит тогда и только тогда, когда подходит \\(G_m\\).\n\nЗапишем \\(n=2\\cdot3^k+r\\), где \\(0\\le r<3^k\\). Тогда \\(m=3^k-1-r\\). В троичной записи число \\(3^k-1\\) имеет \\(k\\) младших цифр, равных 2, поэтому переход от \\(r\\) к \\(m\\) заменяет каждую младшую цифру \\(d\\) на \\(2-d\\). Значит, младшие цифры \\(n\\) не содержат 1 тогда и только тогда, когда троичная запись \\(m\\) не содержит 1. По индукции критерий доказан.\n\nОстается посчитать \\(n\\le2024\\). Так как \\(2024=(2202222)_3\\), подходящие неотрицательные числа имеют один из видов \\(a_5a_4a_3a_2a_1a_0\\), \\(20a_4a_3a_2a_1a_0\\), \\(220a_3a_2a_1a_0\\), где все \\(a_i\\in\\{0,2\\}\\). Таких неотрицательных чисел \\(2^6+2^5+2^4=112\\); исключая \\(0\\), получаем \\(111\\).",
      "idea_ids": [
