  "ideas": [
    {
      "id": "idea-forced-outer-matching",
      "title": "Большие вершины имеют вынужденных партнеров",
      "text": "Если \\(3^k\\le n<3^{k+1}\\), то вершина \\(j\\) из верхнего хвоста может быть сматчена только с \\(3^{k+1}-j\\). Поэтому существование совершенного паросочетания у \\(G_n\\) сводится к меньшему графу \\(G_m\\), где \\(m=3^{k+1}-n-1\\).",
      "tags": [
        "matching",
        "induction"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-ternary-zero-two",
      "title": "Троичная запись состоит только из 0 и 2",
      "text": "Итерация вынужденного снятия хвоста показывает, что подходящие \\(n\\) — ровно те, чья троичная запись не содержит цифры 1.",
      "tags": [
        "invariant"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-ternary-count",
      "title": "Сведение совершенного паросочетания к троичной записи",
      "text": "Считаем также \\(0\\) допустимым: пустой граф имеет пустое совершенное паросочетание. Докажем индукцией по \\(k\\), что для \\(n<3^k\\) граф \\(G_n\\) имеет совершенное паросочетание тогда и только тогда, когда троичная запись \\(n\\) состоит только из цифр 0 и 2.\n\nПусть \\(3^k\\le n<3^{k+1}\\). Для всякой вершины \\(j\\ge3^k\\) сумма с ее партнером не может быть \\(3^k\\) и не может быть больше \\(3^{k+1}\\), поэтому партнер вынужден: это \\(3^{k+1}-j\\). Значит, весь верхний хвост спаривается симметрично, а остаток — это ровно граф \\(G_m\\) при \\(m=3^{k+1}-n-1\\). Следовательно, \\(G_n\\) имеет совершенное паросочетание тогда и только тогда, когда оно есть у \\(G_m\\). Такая замена в троичной записи меняет набор цифр 0/2 на дополнительный набор цифр 0/2, и индукция завершает критерий.\n\nОстается посчитать \\(n\\le2024\\). Так как \\(2024=(2202222)_3\\), подходящие положительные числа имеют один из видов \\(a_5a_4a_3a_2a_1a_0\\), \\(20a_4a_3a_2a_1a_0\\), \\(220a_3a_2a_1a_0\\), где все \\(a_i\\in\\{0,2\\}\\). Таких неотрицательных чисел \\(2^6+2^5+2^4=112\\); исключая \\(0\\), получаем \\(111\\).",
      "idea_ids": [
        "idea-forced-outer-matching",
        "idea-ternary-zero-two"
      ],
      "standard_idea_ids": [
        "induction"
      ],
      "status": "ai_checked",
