  "solutions": [
    {
      "id": "sol-official-structured",
      "title": "Сведение к дереву в половине додекаэдра",
      "text": "Рассматриваем рёбра додекаэдра как метрический граф. Официальная стратегия состоит из нескольких фаз.\n\nСначала пауки занимают заранее выбранные ключевые позиции; это возможно, потому что жук не может поймать пауков, а время не ограничено. Затем один из медленных пауков действует на специально выбранном подграфе, который является деревом: когда жук находится в дереве, движение по единственному пути к нему постепенно уменьшает доступную часть дерева. Если жук всё время остаётся в этом дереве, он неизбежно будет пойман; иначе его вынуждают прийти в вершину \\(W\\), находящуюся на расстоянии \\(1\\), \\(2\\) или \\(4\\) от фиксированной вершины \\(V\\).\n\nПусть \\(P\\) - плоскость, перпендикулярно делящая отрезок \\(VW\\). Для указанных расстояний эта плоскость является плоскостью зеркальной симметрии додекаэдра. Удаление точек графа, лежащих в \\(P\\), разбивает оставшуюся часть на две компоненты; пусть \\(H\\) - компонента, содержащая \\(W\\). Как граф, \\(H\\) содержит две циклические части с общим ребром. Можно выбрать вершину \\(X\\), соседнюю с этим общим ребром, так что \\(H\\setminus\\{X\\}\\) является деревом.\n\nПосле этого быстрый паук всё время движется симметрично жу́ку относительно плоскости \\(P\\). Поэтому если жук коснётся плоскости \\(P\\), быстрый паук окажется в той же точке и поймает его. Один медленный паук идёт в вершину \\(X\\) и остаётся там: если жук придёт в \\(X\\), он будет пойман. Оставшаяся область, где жук может безопасно находиться, лежит в дереве \\(H\\setminus\\{X\\}\\). Второй медленный паук начинает преследование в этом дереве, двигаясь по пути к жу́ку.\n\nУ жука остаются только три возможности: пересечь плоскость симметрии, попасть в охраняемую вершину \\(X\\) или оставаться в дереве \\(H\\setminus\\{X\\}\\). В первых двух случаях он пойман сразу, а в третьем дерево не содержит циклов, поэтому медленное преследование по единственному пути рано или поздно приводит к захвату. Следовательно, стратегия пауков выигрывает при любых начальных позициях и любом движении жука.",
