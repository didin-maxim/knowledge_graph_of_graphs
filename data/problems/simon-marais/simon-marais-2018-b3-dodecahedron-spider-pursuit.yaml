        "id": "stmt-original",
        "title": "Условие",
        "text": "Три паука пытаются поймать жука. Все они изначально находятся на рёбрах правильного додекаэдра с длиной ребра \\(1\\). В некоторый момент они начинают непрерывно двигаться вдоль рёбер додекаэдра. Жук и один из пауков имеют максимальную скорость \\(1\\), а два остальных паука имеют максимальную скорость \\(1/2018\\). Каждый игрок всегда знает своё положение и положения всех остальных; можно мгновенно разворачиваться и реагировать на поведение других. Пауки могут договариваться о стратегии до игры и во время игры. Если какой-либо паук когда-либо оказывается в той же точке, что и жук, пауки выигрывают. Докажите, что пауки могут выиграть независимо от начальных положений всех участников и от движения жука.",
