  "solutions": [
    {
      "id": "sol-official-structured",
      "title": "Сведение к дереву в половине додекаэдра",
      "text": "Рассматриваем рёбра додекаэдра как метрический граф \\(G\\), все рёбра имеют длину \\(1\\). Зафиксируем вершину \\(V\\). В графе додекаэдра относительно \\(V\\) есть соответственно \\(3,6,6,3,1\\) вершин на расстояниях \\(1,2,3,4,5\\); последняя вершина на расстоянии \\(5\\) единственна.\n\nПервая фаза. Быстрый паук идёт в \\(V\\), а один из медленных пауков — в единственную вершину, удалённую от \\(V\\) на расстояние \\(5\\). Это можно сделать независимо от жука: жук пауков не ловит, а время игры не ограничено. Пусть оба паука заняли эти позиции к моменту \\(t_0\\).\n\nВторая фаза. Оставшийся медленный паук может гарантировать, что после \\(t_0\\) жук посетит какую-нибудь вершину додекаэдра. Действительно, если жук после \\(t_0\\) вообще не посещает вершин, то он всё время остаётся во внутренности одного и того же ребра. Медленный паук доходит до этого ребра и затем идёт по нему к жуку. На отрезке жук не может пройти сквозь паука без поимки; значит, он либо будет пойман, либо вынужден выйти через конец ребра, то есть посетить вершину.\n\nКогда жук оказался в вершине, он не может быть ни в \\(V\\), ни в антиподальной к \\(V\\) вершине: там стоят пауки. Поэтому его расстояние от \\(V\\) равно \\(1\\), \\(2\\), \\(3\\) или \\(4\\). Если это расстояние равно \\(1\\), \\(2\\) или \\(4\\), обозначим эту вершину через \\(W\\). Если же жук попал в вершину уровня \\(3\\), пауки сначала вынуждают его прийти в вершину уровня \\(2\\) или \\(4\\). В самом деле, если жук никогда не посещает уровни \\(2\\) и \\(4\\), то он заперт в одном из малых подграфов, состоящих из двух соседних вершин уровня \\(3\\) и внутренних частей рёбер, ведущих к соседним вершинам уровней \\(2\\) и \\(4\\). Такой подграф является деревом с выходами в вершины уровней \\(2\\) и \\(4\\). Один из медленных пауков идёт в этом дереве по единственному пути к жуку; уже очищенная часть дерева отделена от жука положением паука, поэтому доступная жуком часть монотонно уменьшается. В конечном дереве это рано или поздно даёт поимку или вынуждает жука выйти через одну из граничных вершин уровня \\(2\\) или \\(4\\). В последнем случае снова обозначим эту вершину через \\(W\\). Пусть это произошло в момент \\(t_1\\).\n\nРассмотрим плоскость \\(P\\), перпендикулярно делящую отрезок \\(VW\\). Для расстояний \\(d(V,W)=1,2,4\\) эта плоскость является плоскостью зеркальной симметрии правильного додекаэдра; отражение относительно \\(P\\) переводит \\(V\\) в \\(W\\) и сохраняет граф \\(G\\). Удалим из метрического графа точки, лежащие в \\(P\\). Оставшаяся часть распадается на две компоненты; пусть \\(H\\) — компонента, содержащая \\(W\\). В официальной слоевой картине видно, что как граф \\(H\\) состоит из двух циклов с одним общим ребром. Выберем вершину \\(X\\), соседнюю с этим общим ребром, так что после удаления \\(X\\) подграф \\(H\\setminus\\{X\\}\\) становится деревом.\n\nНачиная с момента \\(t_1\\), быстрый паук всё время занимает точку, зеркально симметричную положению жука относительно \\(P\\). В момент \\(t_1\\) это уже верно: жук находится в \\(W\\), а быстрый паук — в \\(V\\). Поскольку отражение сохраняет рёбра и длины, а скорости у жука и быстрого паука одинаковые, быстрый паук может поддерживать такое зеркальное движение. Если жук коснётся плоскости \\(P\\), его точка совпадёт со своей зеркальной точкой, значит, там же окажется быстрый паук и жук будет пойман. Следовательно, не будучи пойманным, жук остаётся в компоненте \\(H\\).\n\nПосле \\(t_1\\) один медленный паук идёт в вершину \\(X\\) и остаётся там; пусть он занял её к моменту \\(t_2\\). Если после этого жук приходит в \\(X\\), он пойман. Если он касается \\(P\\), его ловит быстрый паук. Во всех остальных безопасных положениях после \\(t_2\\) жук находится в дереве \\(H\\setminus\\{X\\}\\). Второй медленный паук теперь преследует его внутри этого дерева, всё время двигаясь по единственному пути к текущему положению жука. Как и выше, жук не может пройти через паука, а компонента дерева, в которой он ещё может находиться, постепенно уменьшается. Так как дерево конечно, бесконечно уклоняться внутри него невозможно: жук либо пересечёт \\(P\\), либо попадёт в \\(X\\), либо будет пойман этим медленным пауком.\n\nИтак, во всех случаях пауки имеют стратегию, которая при любых начальных положениях и любом движении жука приводит к захвату.",
