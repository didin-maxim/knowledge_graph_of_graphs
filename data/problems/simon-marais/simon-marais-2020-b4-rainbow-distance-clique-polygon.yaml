      "id": "idea-singer-difference-set",
      "title": "Расстояния как разности в циклической группе",
      "text": "Если вершины правильного \\(N\\)-угольника занумеровать элементами \\(\\mathbb Z_N\\), то равенство расстояний эквивалентно равенству циклических разностей с точностью до знака. Поэтому достаточно найти \\(n\\)-элементное множество, у которого все упорядоченные ненулевые разности различны. При \\(n-1=p\\) такое множество даёт проективная прямая в плоскости над \\(\\mathbb F_p\\), отождествлённой с циклической группой порядка \\(p^2+p+1\\).",
