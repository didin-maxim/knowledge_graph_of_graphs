  "ideas": [
    {
      "id": "idea-singer-difference-set",
      "title": "Расстояния как разности в циклической группе",
      "text": "Если вершины занумеровать элементами Z_N, равенство расстояний эквивалентно равенству разностей с точностью до знака. Поэтому нужна n-элементная система, у которой все упорядоченные ненулевые разности различны. При n-1=p это дает классическую конструкцию через прямую в проективной плоскости над F_p.",
      "tags": [
        "graph_model",
        "coloring",
        "goal_construction"
      ],
      "status": "needs_human_review"
    }
  ],
  "solutions": [
    {
      "id": "sol-official-part-a",
      "title": "Конструкция при простом n-1",
      "text": "Положим p=n-1 и N=n^2-n+1=p^2+p+1. Занумеруем вершины многоугольника элементами Z_N. Расстояния между вершинами i,j и k,l равны тогда и только тогда, когда i-j равно плюс-минус (k-l) в Z_N. Поэтому достаточно построить подмножество D размера p+1, у которого все упорядоченные разности x-y при x не равно y различны. Официальное решение строит такое D через поле E из p^3 элементов. Пусть F=F_p, G=E^*, H=F^*. Тогда фактор K=G/H цикличен и имеет порядок (p^3-1)/(p-1)=N, так что его можно отождествить с Z_N. Выберем alpha из E вне F. Так как 1, alpha, alpha^2 линейно независимы над F, множество ненулевых элементов плоскости span_F(1,alpha) задает в K подмножество D из p+1=n точек. Если бы две упорядоченные пары различных элементов D давали один и тот же quotient, то после выбора представителей из {1} union {t+alpha: t in F} мы получили бы нетривиальное квадратное соотношение над F для alpha. Это невозможно. Значит все упорядоченные разности различны, а значит все неориентированные расстояния между выбранными вершинами различны. В графовой формулировке это радужная клика K_n.",
      "idea_ids": [
        "idea-singer-difference-set"
      ],
