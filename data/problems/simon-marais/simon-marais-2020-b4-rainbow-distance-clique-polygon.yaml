  "solutions": [
    {
      "id": "sol-official-part-a",
      "title": "Часть (a): конструкция Сингера при простом \\(n-1\\)",
      "text": "Положим \\(p=n-1\\) и \\(N=n^2-n+1=p^2+p+1\\). Занумеруем вершины правильного \\(N\\)-угольника элементами \\(\\mathbb Z_N\\) по кругу. Для двух пар вершин \\(i,j\\) и \\(k,l\\) расстояния равны тогда и только тогда, когда \\(i-j=\\pm(k-l)\\) в \\(\\mathbb Z_N\\). Поэтому достаточно построить множество \\(D\\subset \\mathbb Z_N\\) из \\(p+1=n\\) элементов, у которого все \\(p(p+1)=N-1\\) упорядоченные разности \\(x-y\\), где \\(x,y\\in D\\) и \\(x\\ne y\\), попарно различны. Тогда они автоматически пробегают все ненулевые элементы \\(\\mathbb Z_N\\), а равенство двух неориентированных расстояний между выбранными вершинами могло бы дать равенство двух таких упорядоченных разностей с точностью до знака; это возможно только для одной и той же неупорядоченной пары.\n\nПостроим такое \\(D\\). Пусть \\(F=\\mathbb F_p\\), а \\(E\\) — поле из \\(p^3\\) элементов, содержащее \\(F\\). Обозначим \\(G=E^*\\) и \\(H=F^*\\). Мультипликативная группа конечного поля циклична, значит фактор \\(K=G/H\\) тоже цикличен, причём\n\\[\n|K|=\\frac{|E^*|}{|F^*|}=\\frac{p^3-1}{p-1}=p^2+p+1=N.\n\\]\nВыберем изоморфизм \\(K\\cong \\mathbb Z_N\\). Теперь достаточно найти в \\(K\\) множество размера \\(p+1\\), у которого все упорядоченные частные \\(xy^{-1}\\) при \\(x\\ne y\\) различны: после выбранного изоморфизма частные в циклической мультипликативной записи становятся разностями в \\(\\mathbb Z_N\\).\n\nВыберем \\(\\alpha\\in E\\setminus F\\). Так как расширение имеет простую степень 3, элемент \\(\\alpha\\notin F\\) не может удовлетворять ненулевому многочлену над \\(F\\) степени не выше 2; иначе \\(F(\\alpha)\\) было бы собственным промежуточным расширением степени 2. Следовательно, \\(1,\\alpha,\\alpha^2\\) линейно независимы над \\(F\\). Рассмотрим двумерное \\(F\\)-подпространство \\(L=\\operatorname{span}_F(1,\\alpha)\\) и множество его ненулевых элементов \\(\\widetilde D=L\\setminus\\{0\\}\\subset E^*\\). Оно разбивается на классы по умножению на элементы \\(H=F^*\\); положим\n\\[\nD=\\widetilde D/H\\subset K.\n\\]\nЭто ровно множество точек проективной прямой, поэтому \\(|D|=(p^2-1)/(p-1)=p+1\\). Удобные представители этих классов таковы:\n\\[\n\\widehat D=\\{1\\}\\cup\\{t+\\alpha:t\\in F\\}.\n\\]\nДействительно, любой ненулевой элемент \\(s+t\\alpha\\) либо пропорционален \\(1\\), если \\(t=0\\), либо после деления на \\(t\\in F^*\\) имеет вид \\(t^{-1}s+\\alpha\\); разные элементы списка не пропорциональны над \\(F\\), потому что \\(1\\) и \\(\\alpha\\) линейно независимы.\n\nДокажем, что все упорядоченные частные элементов \\(D\\) различны. Пусть \\(x_1,x_2,x_3,x_4\\in\\widehat D\\), \\(x_1\\ne x_2\\), \\(x_3\\ne x_4\\), и в факторгруппе \\(K\\) выполнено\n\\[\n(x_1/x_2)H=(x_3/x_4)H.\n\\]\nТогда для некоторого \\(h\\in H=F^*\\) имеем \\(x_1x_4=hx_2x_3\\). Запишем каждый представитель в виде \\(x_i=\\varepsilon_i\\alpha+t_i\\), где \\(\\varepsilon_i\\in\\{0,1\\}\\), \\(t_i\\in F\\), причём при \\(\\varepsilon_i=0\\) обязательно \\(t_i=1\\). После раскрытия произведений и сравнения коэффициентов при \\(1,\\alpha,\\alpha^2\\) получаем систему\n\\[\n\\varepsilon_1\\varepsilon_4=h\\varepsilon_2\\varepsilon_3,\n\\]\n\\[\n\\varepsilon_1t_4+\\varepsilon_4t_1=h(\\varepsilon_2t_3+\\varepsilon_3t_2),\n\\]\n\\[\nt_1t_4=ht_2t_3.\n\\]\nЕсли \\(\\varepsilon_1\\varepsilon_4\\ne0\\), то из первой строки следует \\(\\varepsilon_1=\\varepsilon_2=\\varepsilon_3=\\varepsilon_4=1\\) и \\(h=1\\). Тогда\n\\(t_1+t_4=t_2+t_3\\) и \\(t_1t_4=t_2t_3\\). Две пары \\((t_1,t_4)\\) и \\((t_2,t_3)\\) имеют одну и ту же сумму и одно и то же произведение, значит совпадают как неупорядоченные пары. Поскольку \\(x_1\\ne x_2\\), имеем \\(t_1\\ne t_2\\), откуда \\(t_1=t_3\\) и \\(t_4=t_2\\). Значит \\(x_1=x_3\\) и \\(x_2=x_4\\).\n\nОстаётся случай \\(\\varepsilon_1\\varepsilon_4=0\\). При необходимости инвертируем оба частных, то есть меняем пары \\((x_1,x_2)\\) и \\((x_3,x_4)\\) на \\((x_2,x_1)\\) и \\((x_4,x_3)\\); поэтому можно считать, что \\(\\varepsilon_1=0\\), то есть \\(x_1=1\\). Так как \\(x_1\\ne x_2\\), получаем \\(\\varepsilon_2=1\\). Первая строка системы даёт \\(\\varepsilon_3=0\\), значит \\(x_3=1\\). Из \\(x_3\\ne x_4\\) следует \\(\\varepsilon_4=1\\). Вторая строка теперь даёт \\(h=1\\), а третья — \\(t_4=t_2\\). Следовательно, снова \\(x_1=x_3\\) и \\(x_2=x_4\\).\n\nИтак, равные упорядоченные частные возникают только от одной и той же упорядоченной пары элементов \\(D\\). Значит, после отождествления \\(K\\) с \\(\\mathbb Z_N\\) все упорядоченные ненулевые разности элементов \\(D\\) различны. Соответствующие \\(p+1=n\\) вершин правильного \\(N\\)-угольника имеют попарно различные расстояния. Поэтому при простом \\(n-1\\) число \\(n\\) натянуто.",
