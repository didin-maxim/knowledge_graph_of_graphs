        "title": "Условие",
        "text": "Пусть n не меньше 2, а P_n - правильный многоугольник с n^2-n+1 вершинами. Назовем n натянутым, если можно выбрать n вершин P_n так, чтобы все попарные расстояния между выбранными вершинами были различны. (a) Докажите, что если n-1 простое, то n натянуто. (b) Какие n не меньше 2 натянуты?",
