        "title": "Условие",
        "text": "Пусть \\(G\\) - конечный простой граф, а \\(k\\) - наибольшее число вершин в клике графа \\(G\\). Каждой вершине \\(G\\) присваивается неотрицательное вещественное число так, что сумма всех меток равна \\(1\\). Значением ребра называется произведение меток двух его концов, а значением разметки - сумма значений всех рёбер. Докажите, что максимальное возможное значение разметки графа \\(G\\) равно \\((k-1)/(2k)\\).",
