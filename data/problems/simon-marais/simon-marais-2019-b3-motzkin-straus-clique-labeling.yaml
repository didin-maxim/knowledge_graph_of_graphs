  "solutions": [
    {
      "id": "sol-official-motzkin-straus",
      "title": "Сжатие носителя до клики",
      "text": "Сначала получим нижнюю оценку. Возьмём максимальную клику размера \\(k\\), всем её вершинам присвоим метку \\(1/k\\), а всем остальным вершинам - метку \\(0\\). В этой клике \\(k(k-1)/2\\) рёбер, каждое имеет значение \\(1/k^2\\), поэтому значение разметки равно \\((k-1)/(2k)\\).\n\nДокажем, что больше получить нельзя. Рассмотрим произвольную разметку. Если существуют две несмежные вершины \\(u\\) и \\(v\\) с положительными метками \\(a\\) и \\(b\\), сравним суммы меток соседей этих вершин. Пусть сумма по соседям \\(u\\) не меньше суммы по соседям \\(v\\). Заменим метки \\(u,v\\) на \\(a+b,0\\). Поскольку между \\(u\\) и \\(v\\) нет ребра, вклад, связанный с этими двумя вершинами, изменяется линейно: мы переносим вес к вершине с не меньшей соседской суммой. Поэтому значение разметки не уменьшается. При этом число вершин с положительной меткой уменьшается.\n\nПовторяя такую операцию, мы придём к разметке не меньшего значения, в которой любые две вершины с положительными метками смежны. Значит, положительный носитель этой разметки является кликой. Пусть в нём \\(t\\) вершин с метками \\(a_1,\\ldots,a_t\\). Тогда \\(t\\le k\\) и \\(a_1+\\cdots+a_t=1\\). Значение разметки равно\n\\\\[\n\\sum_{1\\le i<j\\le t} a_i a_j = \\frac12\\left((a_1+\\cdots+a_t)^2-(a_1^2+\\cdots+a_t^2)\\right).\n\\\\]\nПо неравенству Коши \\(a_1^2+\\cdots+a_t^2\\ge 1/t\\). Поэтому значение не превосходит \\(\\frac12-\\frac1{2t}\\le \\frac12-\\frac1{2k}=(k-1)/(2k)\\).\n\nВместе с построением на максимальной клике это доказывает точное значение максимума.",
