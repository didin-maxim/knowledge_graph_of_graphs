  "solutions": [
    {
      "id": "sol-path-generating-function",
      "title": "Рекурсия для ожидаемого размера",
      "text": "Пусть \\(E_N\\) — ожидаемый размер итогового независимого множества в пути из \\(N\\) вершин, и положим \\(E_N=0\\) при \\(N\\le0\\). Рассмотрим \\(N=n+1\\). Если первая выбранная вершина стоит на позиции \\(i+1\\), то она добавляет 1 выбранную вершину, ее соседи запрещаются, а слева и справа остаются независимые задачи на путях длины \\(i-1\\) и \\(n-i-1\\). Поэтому\n\\[E_{n+1}=1+\\frac{2}{n+1}\\sum_{i=0}^{n-1}E_i.\\]\nВычитая соседние равенства, получаем\n\\[(n+2)E_{n+2}-(n+1)E_{n+1}=1+2E_n.\\]\n\nДля производящей функции \\(E(x)=\\sum_{n\\ge0}E_nx^n\\) это дает дифференциальное уравнение\n\\[(1-x)E'(x)-2xE(x)=\\frac1{1-x}.\\]\nС учетом \\(E(0)=0\\) получаем\n\\[E(x)=\\frac{1-e^{-2x}}{2(1-x)^2}.\\]\nТеперь извлечем главный член коэффициента. Так как\n\\[\\frac1{(1-x)^2}=\\sum_{m\\ge0}(m+1)x^m,\\qquad e^{-2x}=\\sum_{k\\ge0}\\frac{(-2)^k}{k!}x^k,\\]\nто\n\\[2E_n=(n+1)-\\sum_{k=0}^n\\frac{(-2)^k}{k!}(n+1-k).\n\\]\nПосле деления на \\(n\\) получаем\n\\[\\frac{2E_n}{n}=\\frac{n+1}{n}\\left(1-\\sum_{k=0}^n\\frac{(-2)^k}{k!}\\right)+\\frac1n\\sum_{k=1}^n\\frac{(-2)^k}{(k-1)!}.\\]\nВторая сумма ограничена по модулю равномерно, потому что ряд \\(\\sum_{k\\ge1}(-2)^k/(k-1)!\\) абсолютно сходится. Значит, при \\(n\\to\\infty\\)\n\\[\\frac{2E_n}{n}\\to1-e^{-2}.\\]\nПоскольку \\(S_N=E_N/N\\), окончательно\n\\[\\lim_{N\\to\\infty}S_N=\\frac{1-e^{-2}}2.\\]",
