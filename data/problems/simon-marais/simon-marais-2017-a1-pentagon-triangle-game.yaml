  "solutions": [
    {
      "id": "sol-official-strategy",
      "title": "Два случая после первого ответа",
      "text": "Ответ: первый игрок может гарантировать победу.\n\nОбозначим вершины пятиугольника через \\(1,2,3,4,5\\). Все стороны и диагонали вместе являются рёбрами полного графа \\(K_5\\), поэтому после первого синего ребра можно переименовывать остальные вершины без изменения игры. Первый игрок красит синим ребро \\(12\\). Первый красный ход второго либо инцидентен этому ребру, либо соединяет две вершины из множества \\(\\{3,4,5\\}\\). В первом случае, после переименования вершин, будем считать, что второй покрасил \\(23\\); во втором - что он покрасил \\(34\\). Это исчерпывает все ответы второго игрока.\n\nСлучай 1: второй игрок красит \\(23\\). Тогда первый красит \\(24\\). Теперь синие рёбра \\(12\\) и \\(24\\) дают угрозу: если второй не покрасит \\(14\\), то первый следующим ходом покрасит \\(14\\) и получит синий треугольник \\(124\\). Значит, чтобы не проиграть сразу, второй вынужден красить \\(14\\). После этого первый красит \\(25\\). У первого появляются две независимые угрозы: ребро \\(15\\) завершает синий треугольник \\(125\\), а ребро \\(45\\) завершает синий треугольник \\(245\\). Одним ходом второй может занять только одно из рёбер \\(15\\) и \\(45\\), поэтому на следующем ходу первое ещё свободное из них красит первый игрок и выигрывает.\n\nСлучай 2: второй игрок красит \\(34\\). Тогда первый красит \\(15\\). Синие рёбра \\(12\\) и \\(15\\) создают угрозу треугольника \\(125\\), так что второй, если хочет избежать немедленного проигрыша, вынужден покрасить \\(25\\). После этого первый красит \\(13\\). Теперь у первого снова две независимые угрозы: ребро \\(23\\) завершает синий треугольник \\(123\\), а ребро \\(35\\) завершает синий треугольник \\(135\\). Второй может закрыть лишь одну из этих угроз, и первым следующим ходом первый игрок завершает вторую.\n\nВ обоих возможных типах первого ответа второго игрока первый строит двойную угрозу и выигрывает синим одноцветным треугольником. Следовательно, именно первый игрок может гарантировать победу.",
