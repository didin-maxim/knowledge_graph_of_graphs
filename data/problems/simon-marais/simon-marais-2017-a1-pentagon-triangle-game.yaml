      "id": "idea-first-edge-symmetry",
      "title": "Первый ход можно зафиксировать по симметрии",
      "text": "Пусть вершины пятиугольника пронумерованы \\(1,2,3,4,5\\). Поскольку пять сторон и пять диагоналей образуют полный граф \\(K_5\\), можно свободно переименовывать вершины: первый игрок начинает с ребра \\(12\\), а первый ответ второго существенно бывает только двух типов - ребро, инцидентное \\(12\\), или ребро между двумя оставшимися вершинами. Их удобно обозначить как \\(23\\) и \\(34\\).",
