      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-double-threat",
      "title": "Создать две угрозы одним ходом",
      "text": "Стратегия первого игрока состоит в том, чтобы после вынужденного защитного ответа второго получить позицию с двумя разными синими рёбрами, каждое из которых завершает синий треугольник. Второй игрок может закрыть только одну угрозу.",
