  "solutions": [
    {
      "id": "sol-official-strategy",
      "title": "Два случая после первого ответа",
      "text": "Ответ: первый игрок может гарантировать победу.\n\nОбозначим вершины пятиугольника через \\(1,2,3,4,5\\). Первый игрок красит синим ребро \\(12\\). По симметрии пятиугольника второй игрок своим первым красным ходом попадает в один из двух существенно разных случаев: он красит ребро \\(23\\) или ребро \\(34\\).\n\nСлучай 1: второй игрок красит \\(23\\). Тогда первый красит \\(24\\). Если второй не покрасит \\(14\\), то первый следующим ходом покрасит \\(14\\) и получит синий треугольник \\(124\\). Значит, второй вынужден красить \\(14\\). После этого первый красит \\(25\\). Теперь у первого две угрозы: ребро \\(15\\) завершает треугольник \\(125\\), а ребро \\(45\\) завершает треугольник \\(245\\). Второй игрок может закрыть только одну из них, поэтому первый выигрывает следующим ходом.\n\nСлучай 2: второй игрок красит \\(34\\). Тогда первый красит \\(15\\). Чтобы не проиграть на треугольнике \\(125\\), второй вынужден покрасить \\(25\\). После этого первый красит \\(13\\). Теперь у первого две угрозы: ребро \\(23\\) завершает треугольник \\(123\\), а ребро \\(35\\) завершает треугольник \\(135\\). Второй может закрыть лишь одну угрозу, и первый выигрывает следующим ходом.\n\nВо всех возможных ответах второго игрока первый имеет стратегию, приводящую к одноцветному синему треугольнику раньше, чем второй сможет выиграть.",
