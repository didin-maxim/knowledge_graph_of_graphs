        "id": "stmt-original",
        "title": "Условие",
        "text": "На бумаге нарисованы пять сторон и пять диагоналей правильного пятиугольника. Два игрока по очереди раскрашивают по одному из этих десяти отрезков: первый игрок красит синим, второй - красным. Уже раскрашенный отрезок перекрашивать нельзя. Игрок выигрывает, если первым создал треугольник своего цвета, все три вершины которого являются вершинами правильного пятиугольника. Если все десять отрезков раскрашены и никто не выиграл, объявляется ничья. Определите, может ли первый игрок, второй игрок или ни один из них гарантировать победу.",
