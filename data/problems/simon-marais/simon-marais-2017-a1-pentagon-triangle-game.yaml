  "ideas": [
    {
      "id": "idea-first-edge-symmetry",
      "title": "Первый ход можно зафиксировать по симметрии",
      "text": "Пусть вершины пятиугольника пронумерованы \\(1,2,3,4,5\\). По симметрии первый игрок может начать с ребра \\(12\\), а второй ответит либо ребром, смежным с ним в пятиугольнике, либо ребром другого типа; официальное решение сводит это к двум случаям.",
      "tags": [
