  "solutions": [
    {
      "id": "sol-official-strategy",
      "title": "Пятивершинная стратегия двойной угрозы для всех n не меньше 5",
      "text": "При каждом \\(n\\ge 5\\) выигрывает Синий.\n\nПервым ходом Синий красит ребро \\(P_1P_2\\). Разберём положение первого красного ребра.\n\nСлучай 1. Красное ребро имеет общий конец с \\(P_1P_2\\). Переименуем концы так, чтобы оно было \\(P_2P_3\\), и выберем ещё две вершины \\(P_4,P_5\\). Синий красит \\(P_2P_4\\) и угрожает следующим ходом взять \\(P_1P_4\\), завершив треугольник \\(P_1P_2P_4\\). Если Красный не красит \\(P_1P_4\\), Синий немедленно выполняет угрозу, поэтому считаем, что \\(P_1P_4\\) стало красным. Тогда Синий красит \\(P_2P_5\\). Теперь рёбра \\(P_1P_5\\) и \\(P_4P_5\\) являются двумя угрозами: первое завершает синий треугольник \\(P_1P_2P_5\\), второе — треугольник \\(P_2P_4P_5\\).\n\nСлучай 2. Первое красное ребро не имеет общих концов с \\(P_1P_2\\). Обозначим его через \\(P_3P_4\\) и выберем пятую вершину \\(P_5\\). Синий красит \\(P_1P_5\\), угрожая ребром \\(P_2P_5\\). Если Красный не закроет угрозу, Синий сразу выиграет, поэтому \\(P_2P_5\\) становится красным. После этого Синий красит \\(P_1P_3\\). Свободные рёбра \\(P_2P_3\\) и \\(P_3P_5\\) одновременно завершают синие треугольники \\(P_1P_2P_3\\) и \\(P_1P_3P_5\\).\n\nВ обоих случаях перед третьим ходом Красного два имеющихся у него ребра не имеют общего конца: в первом случае это \\(P_2P_3\\) и \\(P_1P_4\\), во втором — \\(P_3P_4\\) и \\(P_2P_5\\). Поэтому одним новым ребром Красный не может получить треугольник: любые два ребра одного треугольника имеют общий конец. Одним ходом Красный закрывает не более одной из двух синих угроз, после чего Синий осуществляет вторую. Все использованные вершины различны, и именно условие \\(n\\ge 5\\) гарантирует их наличие.",
