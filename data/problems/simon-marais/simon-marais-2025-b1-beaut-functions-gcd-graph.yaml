  "ideas": [
    {
      "id": "idea-small-n-only-edge",
      "title": "При \\(n\\le5\\) единственное нетривиальное ребро — между 2 и 4",
      "text": "Для малых \\(n\\) условие различия цветов фактически нужно проверять только для пары \\(2,4\\), а нужные кратные в любом интервале длины \\(n\\) существуют по простому делению с остатком.",
      "tags": [
        "coloring"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-two-adjacent-lists-collapse",
      "title": "Для больших \\(n\\) две смежные вершины вынуждены получить один цвет",
      "text": "Если взять две смежные вершины больше половины \\(n\\), можно выбрать интервал длины \\(n\\), где единственное число, кратное хотя бы одной из них, — их произведение. Тогда правильная списочная раскраска невозможна.",
      "tags": [
        "extremal_choice",
        "coloring"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-n-at-most-five",
      "title": "Характеризация: \\(n\\le5\\)",
      "text": "Ответ: ровно \\(n\\le5\\).\n\nДля \\(n\\le5\\) в графе \\(H_n\\) единственное ребро, влияющее на условие различия цветов, — \\(2\\sim4\\). Для \\(n=1,2,3\\) достаточно выбрать в интервале \\(m+1,\\ldots,m+n\\) кратные соответственно 2 и 3 там, где они нужны. Для \\(n=4\\) в любом интервале длины 4 есть ровно одно число, кратное 4, и другое четное число, не кратное 4; ими раскрашиваем вершины 4 и 2 разными цветами. Для \\(n=5\\) дополнительно берем единственное кратное 5, а рассуждение для 2 и 4 остается тем же.\n\nПусть \\(n\\ge6\\). Если \\(n\\) четно, вершины \\(n\\) и \\(n-2\\) смежны в \\(H_n\\), обе больше \\(n/2\\). Выберем \\(m=n(n-2)-n/2\\). В интервале длины \\(n\\) единственное число, кратное \\(n\\) или \\(n-2\\), равно \\(n(n-2)\\). Значит, обе смежные вершины вынуждены получить один цвет, что невозможно. Если \\(n\\) нечетно, аналогично берем смежные вершины \\(n-1\\) и \\(n-3\\) и интервал вокруг \\((n-1)(n-3)\\); снова единственный допустимый цвет для обеих вершин совпадает. Поэтому при \\(n\\ge6\\) нужной раскраски для некоторого \\(m\\) нет.",
      "idea_ids": [
        "idea-small-n-only-edge",
        "idea-two-adjacent-lists-collapse"
      ],
      "standard_idea_ids": [
        "extremal_choice"
      ],
      "status": "ai_checked",
      "definition_ids": [
        "chromatic_number"
      ]
    }
