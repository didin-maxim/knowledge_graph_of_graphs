  "solutions": [
    {
      "id": "sol-n-at-most-five",
      "title": "Характеризация: \\(n\\le5\\)",
      "text": "Ответ: ровно \\(n\\le5\\).\n\nСначала построим beaut-функцию для любого \\(m\\), если \\(n\\le5\\). Среди чисел \\(1,2,\\ldots,n\\) только пара \\(2,4\\) может состоять из различных взаимно не простых чисел: остальные числа из \\(\\{1,2,3,4,5\\}\\), кроме 2 и 4, не имеют общего делителя больше 1 с другим числом из этого множества. Поэтому для \\(n=1\\) можно взять \\(f(1)=m+1\\). Для \\(n=2\\) выбираем для 2 любое четное число из \\(m+1,m+2\\), а для 1 любое значение. Для \\(n=3\\) выбираем кратное 2 для вершины 2 и кратное 3 для вершины 3; совпадение этих значений не запрещено, потому что \\(\\gcd(2,3)=1\\). Для \\(n=4\\) в любом интервале из четырех подряд идущих чисел есть ровно одно кратное 4 и еще одно четное число, не кратное 4; ими задаем разные значения \\(f(4)\\) и \\(f(2)\\). Для \\(n=5\\) делаем то же для 2 и 4 и дополнительно выбираем кратное 5 для \\(f(5)\\); возможные совпадения со значениями в вершинах 2,3,4 не нарушают условие, кроме пары 2 и 4, которая уже разведена.\n\nОсталось доказать невозможность для \\(n\\ge6\\) при подходящем \\(m\\). Если \\(n\\) четно, то вершины \\(n\\) и \\(n-2\\) смежны, так как имеют общий делитель 2, и обе больше \\(n/2\\). Положим \\(N=n(n-2)\\) и \\(m=N-n/2\\). Тогда интервал \\(m+1,\\ldots,m+n\\) равен \\(N-n/2+1,\\ldots,N+n/2\\). Число \\(N\\) делится и на \\(n\\), и на \\(n-2\\). Любое другое кратное \\(n\\) отстоит от \\(N\\) хотя бы на \\(n>n/2\\), а любое другое кратное \\(n-2\\) отстоит от \\(N\\) хотя бы на \\(n-2>n/2\\). Значит, единственное число интервала, кратное \\(n\\) или \\(n-2\\), — это \\(N\\). Поэтому вершины \\(n\\) и \\(n-2\\) вынуждены обе получить цвет \\(N\\), что противоречит правильности раскраски.\n\nЕсли \\(n\\) нечетно, то при \\(n\\ge7\\) вершины \\(n-1\\) и \\(n-3\\) смежны и обе больше \\((n-1)/2\\). Положим \\(N=(n-1)(n-3)\\) и \\(m=N-(n+1)/2\\). Тогда интервал \\(m+1,\\ldots,m+n\\) равен \\(N-(n-1)/2,\\ldots,N+(n-1)/2\\). Число \\(N\\) делится и на \\(n-1\\), и на \\(n-3\\). Любое другое кратное \\(n-1\\) отстоит от \\(N\\) хотя бы на \\(n-1>(n-1)/2\\), а любое другое кратное \\(n-3\\) отстоит от \\(N\\) хотя бы на \\(n-3>(n-1)/2\\), поскольку \\(n\\ge7\\). Следовательно, в этом интервале снова есть только один допустимый цвет для обеих смежных вершин, а именно \\(N\\). Противоречие показывает, что при \\(n\\ge6\\) не для всякого \\(m\\) существует beaut-функция.",
