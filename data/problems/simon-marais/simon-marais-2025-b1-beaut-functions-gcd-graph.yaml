        "text": "Функция \\(f:\\{1,2,\\ldots,n\\}\\to\\{m+1,m+2,\\ldots,m+n\\}\\), где \\(m,n\\) — положительные целые числа, называется beaut, если \\(a\\mid f(a)\\) для всех \\(a\\in\\{1,2,\\ldots,n\\}\\), и \\(f(a)\\ne f(b)\\) для любых различных \\(a,b\\) с \\(\\gcd(a,b)\\ne1\\). Найдите все положительные \\(n\\), такие что для любого положительного \\(m\\) существует beaut-функция.",
