  "statements": {
    "original": [
      {
        "id": "stmt-original",
        "title": "Условие",
        "text": "Функция \\(f:\\{1,2,\\ldots,n\\}\\to\\{m+1,m+2,\\ldots,m+n\\}\\), где \\(m,n\\) — положительные целые числа, называется beaut, если \\(a\\mid f(a)\\) для всех \\(a\\in\\{1,2,\\ldots,n\\}\\), и \\(f(a)\\ne f(b)\\) для любых различных \\(a,b\\) с \\(\\gcd(a,b)\\ne1\\). Найдите все положительные \\(n\\), такие что для любого положительного \\(m\\) существует beaut-функция.",
        "source_id": "src-simon-marais-2025-B1-official",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [
          "chromatic_number"
        ],
        "distinct_from": [
          "stmt-graph"
        ]
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Пусть \\(H_n\\) — граф на вершинах \\(1,2,\\ldots,n\\), где \\(a\\) и \\(b\\) смежны тогда и только тогда, когда \\(\\gcd(a,b)>1\\). Для заданного \\(m\\) вершина \\(a\\) имеет список допустимых цветов \\(L_a=\\{x\\in\\{m+1,\\ldots,m+n\\}:a\\mid x\\}\\). Найдите все \\(n\\), для которых при любом \\(m\\) граф \\(H_n\\) имеет правильную раскраску, выбирающую цвет каждой вершины из ее списка.",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
