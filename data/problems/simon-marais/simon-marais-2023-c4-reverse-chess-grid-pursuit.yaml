        "title": "Условие",
        "text": "Пусть \\(k\\) — положительное целое число. Кейра и Роланд играют в обратные шахматы. Сначала Роланд выбирает положительное целое число \\(n>k/2023\\). Затем Кейра ставит \\(k\\) королей на \\(k\\) различных клеток шахматной доски с \\(2023\\) столбцами и \\(n\\) строками. После этого Роланд ставит ладью на свободную клетку. Игроки по очереди ходят любым числом своих фигур, возможно нулевым; первой ходит Кейра. Король ходит на одну клетку по горизонтали, вертикали или диагонали. Король не может ходить на клетку, занятую другим королём, но может взять ладью. Если Кейра за один ход двигает несколько королей, она двигает их по одному. Ладья Роланда ходит на любое число клеток по горизонтали или вертикали, не может брать королей и не может проходить через клетку, занятую королём. При каких \\(k\\) Кейра может гарантировать взятие ладьи независимо от ходов Роланда и от выбранного им \\(n\\)?",
