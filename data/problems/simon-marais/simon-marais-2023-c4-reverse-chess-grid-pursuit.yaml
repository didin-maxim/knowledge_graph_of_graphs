  "solutions": [
    {
      "id": "sol-threshold-1012",
      "title": "Порог равен \\(1012\\)",
      "text": "Ответ: \\(k\\ge1012\\).\n\nСначала докажем, что при \\(k\\le1011\\) Роланд может избегать взятия бесконечно долго. Он выбирает число строк \\(n>2027\\cdot1012\\), что, в частности, больше \\(k/2023\\). Назовём строку безопасной в текущий момент, если она удалена по номеру хотя бы на \\(1014\\) от каждой строки, в которой стоит король. Каждый король делает небезопасными не более \\(2027\\) строк, поэтому при \\(k\\le1011\\) всегда существует безопасная строка.\n\nРоланд ставит ладью в безопасную строку. После первого хода Кейры короли всё ещё не могут находиться в этой строке, и Роланд переводит ладью горизонтально в первый столбец. Далее он повторяет один и тот же приём. Если в текущем столбце ладьи нет короля, ладья ходит вертикально в какую-нибудь безопасную строку, существующую в текущей позиции. Такой ход разрешён, потому что в её столбце нет королей, через которые ладья могла бы упереться. Если же в текущем столбце есть король, Роланд ходит ладьёй на две клетки вправо.\n\nОдин и тот же король не может закрывать столбец ладьи два раза подряд в такой серии: за ход Кейры он меняет номер столбца не более чем на \\(1\\), а ладья только что ушла на \\(2\\) столбца. Значит, каждый случай с закрытым столбцом требует нового короля и потому случается не более \\(1011\\) раз, пока ладья идёт от первого столбца вправо через столбцы \\(1,3,5,\\ldots,2023\\). Вся серия до следующего вертикального ухода занимает не более \\(1012\\) ходов Роланда и не более \\(1013\\) ходов Кейры. Ладья начинала её в безопасной строке с запасом \\(1014\\), поэтому ни один король за это время не успевает дойти до строки ладьи и взять её. После вертикального ухода в новую безопасную строку тот же аргумент начинается заново. Следовательно, при \\(k\\le1011\\) Кейра не имеет гарантированной победы.\n\nТеперь докажем, что \\(1012\\) королей достаточно. Кейра изначально ставит королей в верхнюю строку в столбцы \\(1,3,5,\\ldots,2023\\). Обозначим их слева направо \\(K_1,\\ldots,K_{1012}\\). Для \\(i=1,\\ldots,1011\\) король \\(K_i\\) отвечает за столбцы \\(2i-1\\) и \\(2i\\), а \\(K_{1012}\\) отвечает за столбец \\(2023\\). Если после постановки ладьи она находится в верхней строке, то ближайший король берёт её первым ходом Кейры.\n\nОстаётся случай, когда ладья ниже верхней строки. Кейра поддерживает такой инвариант: все короли стоят в одной строке, каждый внутри своего назначенного блока столбцов, а ладья находится ниже этой строки и не может пройти через неё вверх. На своём ходе Кейра передвигает всех королей на одну строку вниз. Тот король, чей блок содержит текущий столбец ладьи, выбирает в следующей строке именно этот столбец; остальные короли остаются внутри своих блоков. Блоки не пересекаются, поэтому короли занимают разные клетки, а каждый такой ход является допустимым ходом короля.\n\nПосле этого в столбце ладьи на строке барьера стоит король. Ладья не может его взять и не может пройти через его клетку, поэтому своим следующим ходом она остаётся ниже линии королей. Если она когда-либо оказывается прямо под линией, то на следующем ходу соответствующий король переходит в её клетку и берёт её. Иначе линия королей продолжает спускаться на одну строку за ход. Так как доска имеет конечное число строк, бесконечно оставаться строго ниже спускающейся линии невозможно; перед нижним краем ладья окажется непосредственно под барьером и будет взята. Значит, при \\(k=1012\\), а тем более при любом большем \\(k\\), у Кейры есть выигрышная стратегия.",
