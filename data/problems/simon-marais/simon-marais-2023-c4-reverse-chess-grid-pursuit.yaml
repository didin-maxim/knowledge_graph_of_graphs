        "id": "stmt-original",
        "title": "Условие",
        "text": "Пусть \\(k\\) — положительное целое число. Кейра и Роланд играют в обратные шахматы. Сначала Роланд выбирает положительное целое \\(n>k/2023\\). Кейра ставит \\(k\\) королей на различные клетки доски \\(2023\\times n\\). Затем Роланд ставит ладью на свободную клетку. Игроки по очереди ходят любым числом своих фигур, возможно нулевым; Кейра ходит первой. Король не может ходить на клетку, занятую другим королем, но может взять ладью. Если Кейра двигает несколько королей, она двигает их по одному. Ладья Роланда не может брать королей и не может проходить через клетку, занятую королем. При каких \\(k\\) Кейра может гарантировать взятие ладьи независимо от ходов Роланда и выбора \\(n\\)?",
        "source_id": "src-simon-marais-2023-C4-official",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [],
