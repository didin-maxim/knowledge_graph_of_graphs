    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "На вершинах прямоугольной решетки \\(2023\\times n\\) заданы два графа ходов: королевский граф, где соединены клетки на расстоянии Чебышева 1, и ладейный граф видимости по строкам и столбцам с запретом проходить через занятые вершины. Найдите пороговое число преследователей-королей, при котором они имеют выигрышную стратегию захвата одной ладьи для всех достаточно широких прямоугольников, удовлетворяющих \\(n>k/2023\\).",
