  "solutions": [
    {
      "id": "sol-threshold-1012",
      "title": "Порог равен 1012",
      "text": "Ответ: \\(k\\ge1012\\).\n\nЕсли \\(k\\le1011\\), Роланд выбирает число строк настолько большим, что после любого положения королей есть строки, удаленные от всех королей на большой запас; назовем их безопасными. Ладья стартует в безопасной строке. Если в ее столбце нет короля, она уходит по вертикали в новую безопасную строку. Если король закрывает ее столбец, ладья смещается на два столбца вправо. Один и тот же король не может снова быстро закрыть следующий столбец, поэтому таких блокировок не больше числа королей. Запаса расстояния до безопасной строки хватает, чтобы повторять уход бесконечно.\n\nПусть теперь \\(k=1012\\). Кейра добивается положения, где короли стоят в верхней строке в столбцах \\(1,3,5,\\ldots,2023\\). Король \\(K_i\\) отвечает за столбцы \\(2i-1\\) и \\(2i\\), а последний — за столбец 2023. Каждый ход короли сдвигаются на строку вниз; тот король, чья пара столбцов содержит ладью, выбирает нужный из двух столбцов. В графовой картине это движущийся разделяющий барьер: ладья всегда остается ниже линии королей и в конце оказывается непосредственно под ней, после чего ближайший король ее берет.",
