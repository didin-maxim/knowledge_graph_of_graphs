  "ideas": [
    {
      "id": "idea-dual-coloring-to-signed-area",
      "title": "Раскраска превращает задачу в знакопеременную сумму площадей",
      "text": "Так как соседние области имеют разные цвета, удобно считать синие площади с плюсом, а красные с минусом. Официальное решение использует симметрию относительно прямой \\(y=x\\): при нечетном \\(n\\) все малые треугольники попарно компенсируются, а при четном остаются лишние синие краевые треугольники.",
      "tags": [
        "region_adjacency",
        "double_counting"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-signed-area-outline",
      "title": "Через граф смежности областей и площади ячеек",
      "text": "Ответ: все нечетные \\(n\\).\n\nРассмотрим ограниченные области как вершины планарного двойственного графа. Цвет области меняется при переходе через каждый отрезок, поэтому цвет определяется четностью числа пересеченных границ от области у начала координат; это также объясняет единственность раскраски.\n\nОбозначим через \\(\\ell_k\\) прямую, соединяющую \\((0,k)\\) и \\((n-k,0)\\). Для \\(0\\le i\\le j\\le n\\) точка\n\\[P_{ij}=\\left(\\frac{(n-i)(n-j)}n,\\frac{ij}n\\right)\\]\nлежит на пересечении \\(\\ell_i\\) и \\(\\ell_j\\), а точки \\(P_{0j},P_{1j},\\ldots,P_{jn}\\) идут по \\(\\ell_j\\) через равные промежутки.\n\nЕсли \\(n\\) нечетно, часть рисунка ниже прямой \\(y=x\\) разбивается на пары соседних малых треугольников одинаковой площади и разных цветов; равенство промежутков на каждой \\(\\ell_j\\) дает равенство площадей в каждой паре. Отражение относительно \\(y=x\\) сохраняет тот же баланс, значит суммарные синяя и красная площади равны.\n\nЕсли \\(n\\) четно, почти все треугольники ниже \\(y=x\\) опять попарно компенсируются, но краевые синие треугольники оказываются вдвое больше своих красных партнеров. Поэтому синяя площадь строго больше красной, и равенства нет.",
      "idea_ids": [
        "idea-dual-coloring-to-signed-area"
      ],
      "standard_idea_ids": [
        "invariant"
      ],
      "status": "ai_checked",
