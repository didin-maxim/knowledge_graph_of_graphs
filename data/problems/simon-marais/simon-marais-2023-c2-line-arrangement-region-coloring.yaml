    "original": [
      {
        "id": "stmt-original",
        "title": "Условие",
        "text": "Для целого \\(n\\ge2\\) рассмотрим отрезки, соединяющие точки \\((0,k)\\) и \\((n-k,0)\\) при \\(k=0,1,\\ldots,n\\). Их объединение делит плоскость на одну неограниченную область и несколько ограниченных областей, каждая из которых является треугольником или четырехугольником. Эти ограниченные области можно единственным образом раскрасить в синий и красный цвета так, что области, имеющие общую сторону, имеют разные цвета, а область с вершиной \\((0,0)\\) синяя. Найдите все \\(n\\), для которых суммарная синяя площадь равна суммарной красной площади.",
        "source_id": "src-simon-marais-2023-C2-official",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [
          "planar_graph",
          "chromatic_number"
        ],
        "distinct_from": [
