  "solutions": [
    {
      "id": "sol-signed-area-outline",
      "title": "Через граф смежности областей и площади ячеек",
      "text": "Ответ: все нечетные \\(n\\).\n\nОбозначим через \\(\\ell_k\\) отрезок, соединяющий \\((0,k)\\) и \\((n-k,0)\\), и для \\(1\\le k\\le n-1\\) положим\n\\[q_k(x,y)=kx+(n-k)y-k(n-k).\\]\nПрямая \\(q_k=0\\) содержит \\(\\ell_k\\), а в области у начала координат все \\(q_k<0\\). При переходе через общий кусок границы, лежащий на \\(\\ell_k\\), меняется знак ровно одного \\(q_k\\), поэтому цвет области определяется четностью числа положительных \\(q_k\\). В частности, граф смежности ограниченных областей двудолен, а его 2-раскраска единственна после фиксации синего цвета у \\((0,0)\\).\n\nТеперь посчитаем синюю площадь с плюсом, а красную с минусом. Введем параметры \\(r,s\\) формулами\n\\[x=\\frac{(n-r)(n-s)}n,\\qquad y=\\frac{rs}n.\\]\nТогда\n\\[q_k(x,y)=(k-r)(k-s),\\]\nа якобиан этой замены равен \\((s-r)/n\\). Часть плоскости, разбитая на ограниченные области, получается при \\(0<r<s<n\\) после удаления диагональных клеток, прилегающих к кривой \\(r=s\\): эти диагональные клетки выходят в неограниченную область. Поэтому ограниченные области соответствуют клеткам\n\\[C_{ij}:\\quad i<r<i+1,\\qquad j<s<j+1,\\qquad 0\\le i<j\\le n-1.\\]\nИх границы лежат на прямых \\(r=i,i+1,s=j,j+1\\), то есть на отрезках исходной конфигурации; при \\(j=i+1\\) получается треугольник, иначе четырехугольник.\n\nПлощадь области, соответствующей \\(C_{ij}\\), равна\n\\[A_{ij}=\\int_i^{i+1}\\int_j^{j+1}\\frac{s-r}{n}\\,ds\\,dr=\\frac{j-i}{n}.\\]\nВнутри \\(C_{ij}\\) выражение \\(q_k=(k-r)(k-s)\\) положительно ровно для \\(k\\le i\\) и для \\(k\\ge j+1\\). Таких \\(k\\) среди \\(1,2,\\ldots,n-1\\) всего \\(i+n-1-j\\), значит знак вклада клетки равен \\((-1)^{i+n-1-j}\\). Клетка \\(C_{0,n-1}\\), прилегающая к началу координат, действительно имеет положительный знак.\n\nСледовательно, разность «синяя площадь минус красная площадь» равна\n\\[D_n=\\frac1n\\sum_{0\\le i<j\\le n-1}(-1)^{i+n-1-j}(j-i)=\\frac1n\\sum_{d=1}^{n-1}(n-d)d(-1)^{n-1-d},\\]\nгде \\(d=j-i\\).\n\nЕсли \\(n\\) нечетно, то слагаемые с номерами \\(d\\) и \\(n-d\\) имеют одинаковый множитель \\(d(n-d)\\), но противоположные знаки, поэтому \\(D_n=0\\). Если \\(n=2m\\) четно, то\n\\[nD_n=\\sum_{d=1}^{2m-1}d(2m-d)(-1)^{d+1}=m,\n\\]\nчто получается, например, вычитанием соседних четных и нечетных слагаемых:\n\\[\\sum_{t=1}^{m}(2t-1)(2m-2t+1)-\\sum_{t=1}^{m-1}2t(2m-2t)=m.\\]\nЗначит при четном \\(n\\) имеем \\(D_n=1/2>0\\), то есть синяя площадь больше красной. Равенство площадей возможно ровно при нечетных \\(n\\).",
