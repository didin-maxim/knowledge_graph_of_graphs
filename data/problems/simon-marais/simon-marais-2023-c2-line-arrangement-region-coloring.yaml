  "ideas": [
    {
      "id": "idea-dual-coloring-to-signed-area",
      "title": "Раскраска превращает задачу в знакопеременную сумму площадей",
      "text": "Так как соседние области имеют разные цвета, удобно считать синие площади с плюсом, а красные с минусом. Координатная замена \\(x=(n-r)(n-s)/n\\), \\(y=rs/n\\) превращает ограниченные области в клетки между целыми линиями \\(r=i\\), \\(s=j\\); цвет клетки зависит только от четности числа целых \\(k\\) вне промежутка \\((r,s)\\), а площадь клетки равна простой величине \\((j-i)/n\\).",
      "tags": [
