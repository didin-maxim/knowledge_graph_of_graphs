        ]
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Постройте граф смежности ограниченных областей: вершины соответствуют областям, а ребро соединяет две области, если они имеют общий отрезок границы положительной длины. Этот граф двудолен, и заданная раскраска является его единственной правильной 2-раскраской после фиксации цвета области у \\((0,0)\\). Определите все \\(n\\), для которых сумма площадей вершин одной доли равна сумме площадей вершин другой доли.",
