      "text": "Если две красные вершины лежат в разных компонентах, выбираем такую пару на минимальном расстоянии. Внутри отрезка между ними нет решётчатых точек; затем две соседние по решётке точки вынужденно оказываются синими, а симметричные относительно красных концов точки — красными. Среди четырёх серединообразных точек одна является решётчатой, не синей и ближе к обоим концам, что противоречит минимальности.",
