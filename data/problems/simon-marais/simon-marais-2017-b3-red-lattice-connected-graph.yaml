  "solutions": [
    {
      "id": "sol-official-graph-expanded",
      "title": "Связность красного графа и минимальный путь",
      "text": "Построим граф \\(G_R\\): его вершины — красные точки целочисленной решётки, а ребро соединяет две красные точки на расстоянии \\(1\\).\n\nСначала докажем, что \\(G_R\\) связен. Предположим противное и выберем красные точки \\(A=(a_1,a_2)\\) и \\(B=(b_1,b_2)\\) из разных компонент так, чтобы длина \\(AB\\) была минимальной. Тогда \\(AB>1\\). Если бы существовала красная точка \\(C\\), для которой одновременно \\(AC<AB\\) и \\(BC<AB\\), то, в какой бы компоненте она ни лежала, мы получили бы более близкую пару красных точек из разных компонент. Значит, такой красной точки нет.\n\nОтсюда внутри отрезка \\(AB\\) нет красных решётчатых точек. Синих точек на этом отрезке тоже нет по первому условию, потому что концы \\(A\\) и \\(B\\) красные. Следовательно, на внутренности \\(AB\\) вообще нет решётчатых точек. В частности, \\(A\\) и \\(B\\) имеют разные первые и разные вторые координаты. Без ограничения общности пусть \\(b_1>a_1\\) и \\(b_2>a_2\\).\n\nТочки \\(U=(a_1+1,a_2)\\) и \\(V=(b_1,b_2-1)\\) не могут быть красными: первая была бы соединена ребром с \\(A\\) и при этом лежала бы ближе к \\(B\\), а вторая была бы соединена ребром с \\(B\\) и лежала бы ближе к \\(A\\). Поэтому \\(U\\) и \\(V\\) синие. Так как \\(U\\) синяя, а середина отрезка от \\((a_1-1,a_2)\\) до \\(U\\) равна красной точке \\(A\\), второе условие запрещает точке \\(A'=(a_1-1,a_2)\\) быть синей; значит, \\(A'\\) красная. Для точки \\(V\\) тот же довод применяется к паре \\(V\\) и \\(B'=(b_1,b_2+1)\\), середина которой равна красной точке \\(B\\); следовательно, \\(B'\\) красная.\n\nРассмотрим четыре точки, являющиеся серединами отрезков \\(AB\\), \\(A'B\\), \\(AB'\\), \\(A'B'\\). Каждая из них лежит на отрезке между двумя красными точками, поэтому не может быть синей. Среди этих четырёх точек одна обязательно имеет целые координаты: выбор между \\(a_1+b_1\\) и \\(a_1+b_1-1\\), а также между \\(a_2+b_2\\) и \\(a_2+b_2+1\\), позволяет сделать обе координаты чётными после деления на \\(2\\). Эта решётчатая точка не синяя, значит красная; кроме того, она ближе и к \\(A\\), и к \\(B\\), чем \\(A\\) и \\(B\\) друг к другу. Получили запрещённую красную точку \\(C\\). Противоречие доказывает связность \\(G_R\\).\n\nТеперь предположим, что существуют три красные точки, образующие треугольник, внутри которого лежит синяя решётчатая точка. По связности \\(G_R\\) эти три красные точки содержатся в некотором конечном связном множестве красных точек \\(T\\); достаточно взять конечное объединение красных единичных путей между ними. Выпуклая оболочка \\(T\\) содержит исходный треугольник, а значит содержит синюю точку. Выберем среди всех таких конечных связных множеств красных точек множество \\(S\\) минимального размера.\n\nНам понадобится простое следствие минимальности. Пусть \\(P\\in S\\) и \\(S\\setminus\\{P\\}\\) остаётся связным. Если \\(A,B,C\\in S\\) и внутри треугольника \\(ABC\\) лежит синяя точка, то \\(P\\) обязана быть одной из вершин \\(A,B,C\\); иначе после удаления \\(P\\) осталось бы меньшее связное множество красных точек, выпуклая оболочка которого всё ещё содержит эту синюю точку.\n\nТакже используем два элементарных геометрических факта. Во-первых, для любых четырёх точек каждый из четырёх треугольников, полученных удалением одной точки, содержится в объединении трёх остальных таких треугольников. Во-вторых, выпуклая оболочка конечного множества из не менее чем трёх точек является объединением треугольников с вершинами из этого множества. Поэтому в \\(S\\) найдутся три точки, треугольник которых содержит синюю точку внутри.\n\nПокажем, что граф на множестве \\(S\\) является простым путём. Если это не так, то в конечном связном графе на \\(S\\) есть три различные вершины \\(P_1,P_2,P_3\\), удаление каждой из которых не нарушает связности. Для графа из трёх вершин это невозможно в единичной решётке, а значит существует ещё одна точка \\(Y\\in S\\). По предыдущему абзацу есть треугольник с вершинами из \\(S\\), внутри которого лежит синяя точка; по минимальности и удаляемости \\(P_1,P_2,P_3\\) этим треугольником может быть только \\(P_1P_2P_3\\). Но треугольник \\(P_1P_2P_3\\) покрывается объединением трёх треугольников \\(YP_1P_2\\), \\(YP_2P_3\\), \\(YP_3P_1\\). Тогда синяя точка лежит внутри одного из них, а этот треугольник не содержит одну из удаляемых вершин \\(P_i\\), что противоречит уже доказанному следствию минимальности. Итак, \\(S\\) имеет вид пути \\(R_1,R_2,\\ldots,R_n\\), где соседние вершины соединены единичными рёбрами и других рёбер в \\(S\\) нет.\n\nВыберем синюю решётчатую точку \\(B\\) в выпуклой оболочке \\(S\\), максимизирующую площадь треугольника \\(R_1BR_n\\). Такая точка существует, потому что в ограниченной выпуклой оболочке конечного множества только конечное число решётчатых точек. Синих точек на границе выпуклой оболочки нет: каждое её ребро соединяет две красные точки, а первый пункт условия запрещает синие точки на таком отрезке. Значит, \\(B\\) лежит внутри выпуклой оболочки. Поменяв концы пути местами при необходимости, считаем, что \\(R_1B\\ge R_nB\\).\n\nТочка \\(B\\) лежит внутри некоторого треугольника с вершинами из \\(S\\). По доказанному свойству удаляемых вершин этот треугольник обязан содержать оба конца пути, поэтому имеет вид \\(R_1R_jR_n\\), где \\(1<j<n\\). Треугольник \\(R_1R_jR_n\\) покрывается треугольниками \\(R_1R_2R_n\\), \\(R_1R_2R_j\\), \\(R_2R_jR_n\\). Если бы \\(B\\) лежала внутри одного из двух последних, то соответствующий треугольник не содержал бы один из концов \\(R_1\\) или \\(R_n\\), удаляемый без потери связности; это снова противоречило бы минимальности. Следовательно, \\(B\\) лежит внутри треугольника \\(R_1R_2R_n\\).\n\nОтразим \\(R_n\\) относительно \\(B\\): пусть \\(X\\) — точка, для которой \\(B\\) является серединой \\(XR_n\\). Так как \\(B\\) и \\(R_n\\) решётчатые, точка \\(X\\) тоже решётчатая. Если бы \\(X\\) была красной, то отрезок \\(XR_n\\) между двумя красными точками содержал бы синюю точку \\(B\\), что запрещено первым условием. Значит, \\(X\\) синяя. Площадь треугольника \\(XR_1R_n\\) вдвое больше площади \\(BR_1R_n\\), поэтому из максимальности выбора \\(B\\) следует, что \\(X\\) лежит вне выпуклой оболочки \\(S\\). В частности, \\(X\\) лежит вне треугольника \\(R_1R_2R_n\\). Поскольку отрезок \\(XR_n\\) проходит через внутреннюю точку \\(B\\) этого треугольника, четырёхугольник \\(R_1XR_2R_n\\) является выпуклым.\n\nОсталось получить угловое противоречие. Пусть \\(M\\) — середина \\(R_1R_n\\). Из \\(R_1B\\ge R_nB\\) следует \\(\\angle R_nMB\\le 90^\\circ\\). В треугольнике \\(XR_1R_n\\) точка \\(B\\) — середина стороны \\(XR_n\\), а неравенство \\(R_1B\\ge R_nB=XB\\) означает, что медиана из \\(R_1\\) не короче половины стороны \\(XR_n\\); по теореме косинусов это даёт \\(\\angle R_nR_1X\\le 90^\\circ\\). Так как луч \\(R_1R_2\\) лежит внутри угла \\(XR_1R_n\\), имеем также \\(\\angle R_2R_1X<90^\\circ\\) и \\(\\angle R_nR_1R_2<90^\\circ\\).\n\nНаконец, используем решётчатую оценку: единичный решётчатый отрезок \\(R_1R_2\\) из любой решётчатой точки вне его прямой виден под углом не больше \\(45^\\circ\\). Действительно, после поворота и сдвига можно считать \\(R_1=(0,0)\\), \\(R_2=(1,0)\\); для решётчатой точки \\((u,v)\\) с \\(v\\ne0\\) наибольший угол достигается при ближайших положениях \\((0,\\pm1)\\) или \\((1,\\pm1)\\), где он равен \\(45^\\circ\\). Поэтому \\(\\angle R_1XR_2\\le45^\\circ\\) и \\(\\angle R_1R_nR_2\\le45^\\circ\\).\n\nВ выпуклом четырёхугольнике \\(R_1XR_2R_n\\) три угла при \\(R_1\\), \\(X\\), \\(R_n\\) имеют сумму не больше \\(90^\\circ+45^\\circ+45^\\circ=180^\\circ\\). Тогда угол при \\(R_2\\) должен быть не меньше \\(180^\\circ\\), что невозможно для выпуклого четырёхугольника. Полученное противоречие показывает, что синей решётчатой точки внутри треугольника с красными вершинами быть не может.",
