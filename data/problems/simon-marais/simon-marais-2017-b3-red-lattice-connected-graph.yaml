  "solutions": [
    {
      "id": "sol-official-graph-expanded",
      "title": "Связность красного графа и минимальный путь",
      "text": "Построим граф \\(G_R\\): его вершины - красные точки решётки, а ребро соединяет две красные точки на расстоянии \\(1\\).\n\nСначала докажем, что \\(G_R\\) связен. Предположим противное и выберем красные точки \\(A=(a_1,a_2)\\) и \\(B=(b_1,b_2)\\) из разных компонент так, чтобы расстояние \\(AB\\) было минимальным. Тогда \\(AB>1\\). По минимальности не существует красной точки \\(C\\), которая была бы ближе и к \\(A\\), и к \\(B\\); иначе она соединила бы одну из компонент с более близкой парой. Значит, внутри отрезка \\(AB\\) нет красных точек, а по первому условию нет и синих, то есть на нём нет внутренних решётчатых точек. В частности, координаты \\(A\\) и \\(B\\) различаются по обеим осям. Пусть для определённости \\(B\\) правее и выше \\(A\\). Тогда точки \\((a_1+1,a_2)\\) и \\((b_1,b_2-1)\\) не могут быть красными, иначе дали бы меньшую пару, поэтому они синие. По условию о синих точках на расстоянии \\(2\\) получаем, что \\((a_1-1,a_2)\\) и \\((b_1,b_2+1)\\) красные. Среди четырёх естественных середин, построенных из этих сдвинутых точек, одна является решётчатой; она не синяя, значит красная, и лежит ближе и к \\(A\\), и к \\(B\\). Противоречие доказывает связность \\(G_R\\).\n\nТеперь предположим, что есть красный треугольник, внутри которого находится синяя решётчатая точка. Благодаря связности \\(G_R\\) три его красные вершины содержатся в некотором конечном связном множестве красных точек, чья выпуклая оболочка содержит синюю точку. Выберем такое множество \\(S\\) минимального размера.\n\nЕсли вершину \\(P\\in S\\) можно удалить, сохранив связность, то любая тройка красных точек из \\(S\\), треугольник которой содержит синюю точку, должна включать \\(P\\); иначе после удаления \\(P\\) минимальность была бы нарушена. Из простого факта о четырёх точках следует, что таких удаляемых вершин не может быть три: взяв четвёртую точку, один из трёх треугольников без одной из этих вершин тоже содержал бы синюю точку. Поэтому граф на \\(S\\) не ветвится; как конечный связный граф с не более чем двумя такими удаляемыми вершинами он имеет вид пути \\(R_1,R_2,\\ldots,R_n\\), где соседние вершины соединены единичными рёбрами.\n\nОстальная часть официального решения добивает этот минимальный путь геометрией. Выберем синюю точку \\(B\\) в выпуклой оболочке \\(S\\), максимизирующую площадь треугольника \\(R_1BR_n\\), и пусть \\(R_1B\\ge R_nB\\). По минимальности \\(B\\) лежит внутри треугольника \\(R_1R_2R_n\\). Отразим \\(R_n\\) относительно \\(B\\): пусть \\(X\\) такова, что \\(B\\) - середина \\(XR_n\\). Точка \\(X\\) решётчатая; поскольку отрезок \\(XR_n\\) содержит синюю точку \\(B\\), она не может быть красной, значит она синяя. Тогда треугольник \\(XR_1R_n\\) имеет вдвое большую площадь, и из выбора \\(B\\) следует, что \\(X\\) вне выпуклой оболочки \\(S\\). Но угловые ограничения для единичного решётчатого шага \\(R_1R_2\\) и расположения четырёх точек \\(R_1,X,R_2,R_n\\) заставляют один угол выпуклого четырёхугольника быть больше \\(180^\\circ\\), что невозможно.\n\nПолученное противоречие показывает, что синей точки внутри треугольника с красными вершинами быть не может.",
