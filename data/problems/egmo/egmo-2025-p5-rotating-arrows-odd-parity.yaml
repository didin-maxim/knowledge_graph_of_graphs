  "ideas": [
    {
      "id": "idea-checkerboard-parity",
      "title": "Шахматная чётность запрещает нечётный обход",
      "text": "В решётке каждый ход меняет цвет клетки. Если \\(n\\) нечётно, то \\(n^2\\) тоже нечётно, поэтому после \\(n^2\\) ходов нельзя оказаться в стартовой клетке того же цвета.",
      "tags": [
        "graph_symmetry",
        "goal_impossibility"
      ],
      "status": "needs_human_review"
    }
  ],
  "solutions": [
    {
      "id": "sol-parity-bound",
      "title": "Чётностный аргумент",
      "text": "Покрасим доску шахматно. Каждый допустимый ход переводит улитку в соседнюю по стороне клетку, значит цвет клетки меняется на каждом ходу.\n\nЕсли стартовая клетка была бы хорошей, то улитка прошла бы все \\(n^2\\) клеток ровно один раз и затем на \\(n^2\\)-м ходе вернулась бы в исходную клетку. Но при нечётном \\(n\\) число \\(n^2\\) нечётно, а после нечётного числа ходов цвет клетки должен измениться. Стартовая клетка имеет прежний цвет, поэтому такое возвращение невозможно. Следовательно, хороших клеток нет, и максимум равен \\(0\\).",
