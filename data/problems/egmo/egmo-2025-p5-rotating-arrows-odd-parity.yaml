        "id": "stmt-original-odd",
        "title": "Условие при нечётном n",
        "text": "Пусть \\(n>1\\) — нечётное целое. В каждой клетке доски \\(n\\times n\\) стоит стрелка вверх, вниз, влево или вправо. Улитка Турбо стартует из некоторой клетки и на каждом ходу переходит в соседнюю клетку по стрелке в своей текущей клетке; после каждого хода все стрелки на доске поворачиваются на \\(90^\\circ\\) против часовой стрелки. Клетка называется хорошей, если, стартуя из неё, Турбо посещает каждую клетку доски ровно один раз, не покидая доску, и затем возвращается в исходную клетку. Докажите, что хороших клеток быть не может, то есть максимум равен \\(0\\).",
