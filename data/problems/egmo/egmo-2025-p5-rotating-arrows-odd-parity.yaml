        "id": "stmt-graph-odd",
        "title": "Нечётная решётка как двудольный граф",
        "text": "Пусть \\(n>1\\) — нечётное целое, а вершины графа образуют клетки решётки \\([n]\\times[n]\\), где смежны клетки с общей стороной. В начальный момент из каждой вершины выбрано одно из направлений к соседней вершине решётки или к внешней стороне доски. После каждого шага все выбранные направления одновременно поворачиваются на четверть оборота против часовой стрелки. Стартовая вершина называется хорошей, если заданная текущими направлениями последовательность \\(v_0,v_1,\\ldots,v_{n^2}=v_0\\) определена, не выходит за пределы решётки и содержит каждую вершину ровно один раз среди \\(v_0,\\ldots,v_{n^2-1}\\). Докажите, что при любом начальном выборе направлений хороших стартовых вершин нет.",
