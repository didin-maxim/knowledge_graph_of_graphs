        "id": "stmt-original-even",
        "title": "Условие при чётном n",
        "text": "Пусть \\(n>1\\) — чётное целое. В каждой клетке доски \\(n\\times n\\) стоит стрелка вверх, вниз, влево или вправо. Улитка Турбо стартует из некоторой клетки и на каждом ходу переходит в соседнюю клетку по стрелке в своей текущей клетке; после каждого хода все стрелки на доске поворачиваются на \\(90^\\circ\\) против часовой стрелки. Клетка называется хорошей, если, стартуя из неё, Турбо посещает каждую клетку доски ровно один раз, не покидая доску, и затем возвращается в исходную клетку. Докажите, что максимально возможное число хороших клеток равно \\(n^2/4\\).",
