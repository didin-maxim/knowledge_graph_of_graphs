  "solutions": [
    {
      "id": "sol-dynamic-cycle-bound",
      "title": "Конструкция и верхняя оценка через динамический цикл",
      "text": "Докажем, что при чётном \\(n\\) максимум равен \\(n^2/4\\).\n\nСначала построим пример. На доске существует цикл, проходящий через все клетки ровно один раз: например, идём по верхней строке слева направо, затем по правому столбцу вниз, потом змейкой по столбцам \\(n-1,n-2,\\ldots,2\\) между второй и последней строками, после чего идём по первому столбцу вверх до клетки \\((2,1)\\) и возвращаемся в \\((1,1)\\). Обозначим клетки этого цикла через\n\\[\nc_0,c_1,\\ldots,c_{n^2-1},\\quad c_{n^2}=c_0.\n\\]\nВ клетке \\(c_i\\) поставим такую стрелку, чтобы после \\(i\\) общих поворотов она указывала из \\(c_i\\) в \\(c_{i+1}\\). Тогда старт из \\(c_0\\) проходит весь цикл и возвращается в \\(c_0\\). Так как \\(4\\mid n^2\\), после полного обхода конфигурация стрелок снова исходная. Старт из любой клетки \\(c_{4t}\\) видит тот же обход с циклическим сдвигом времени, поэтому хорошие клетки включают \\(c_0,c_4,c_8,\\ldots,c_{n^2-4}\\), то есть их \\(n^2/4\\).\n\nТеперь докажем, что больше быть не может. Зафиксируем хорошую траекторию\n\\[\na_0,a_1,\\ldots,a_{n^2-1},a_{n^2}=a_0.\n\\]\nПусть другая хорошая траектория равна \\(b_0,b_1,\\ldots,b_{n^2-1},b_{n^2}=b_0\\). Рассмотрим угол \\((1,1)\\). Любая хорошая траектория проходит через него либо как \\((2,1),(1,1),(1,2)\\), либо в обратном направлении. Для траектории \\(a\\) выберем обозначения соседей так, что \\(a_{i-1}=(2,1)\\), \\(a_i=(1,1)\\), \\(a_{i+1}=(1,2)\\), и пусть \\(b_j=(1,1)\\).\n\nЕсли \\(b\\) проходит угол в том же направлении, то стрелка в клетке \\((2,1)\\) в моменты \\(i-1\\) и \\(j-1\\) имеет одно направление, значит \\(i\\equiv j\\pmod 4\\). Тогда и в углу в моменты \\(i\\) и \\(j\\) направление совпадает. Повторяя сравнение вдоль траектории, получаем, что \\(b\\) — та же траектория, что \\(a\\), только сдвинутая на число шагов, кратное \\(4\\); значит её старт имеет вид \\(a_{4t}\\).\n\nЕсли \\(b\\) проходит угол в обратном направлении, то из сравнения стрелки в углу следует \\(i\\equiv j+1\\pmod 4\\). Тогда направление стрелки в клетке \\((1,2)\\) в момент \\(j-1\\) ведёт в угол, а соответствующее направление в момент \\(i+1\\) отличается поворотом на три четверти оборота. Но в траектории \\(a\\) в момент \\(i+1\\) улитка уже уходит из \\((1,2)\\) дальше по циклу; это несовместимо с одной и той же начальной конфигурацией стрелок. Значит обратное прохождение угла невозможно.\n\nИтак, каждая хорошая стартовая клетка лежит на фиксированной хорошей траектории в позиции с индексом, кратным \\(4\\). Таких позиций ровно \\(n^2/4\\), поэтому максимум равен \\(n^2/4\\).",
