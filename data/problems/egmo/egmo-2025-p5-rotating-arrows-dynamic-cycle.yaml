        "id": "stmt-original",
        "title": "Условие",
        "text": "Пусть \\(n>1\\) — целое. В каждой клетке доски \\(n\\times n\\) стоит стрелка вверх, вниз, влево или вправо. Улитка Турбо стартует из некоторой клетки и на каждом ходу переходит в соседнюю клетку по стрелке в своей текущей клетке; после каждого хода все стрелки на доске поворачиваются на \\(90^\\circ\\) против часовой стрелки. Клетка называется хорошей, если, стартуя из неё, Турбо посещает каждую клетку доски ровно один раз, не покидая доску, и затем возвращается в исходную клетку. Найдите максимально возможное число хороших клеток.",
        "source_id": "src-egmo-2025-official",
        "status": "needs_human_review",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [],
        "distinct_from": [
          "stmt-graph"
        ]
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Для хорошего старта траектория улитки задаёт ориентированный цикл длины \\(n^2\\), проходящий через все клетки ровно по одному разу; задача спрашивает, сколько вершин такого динамически согласованного гамильтонова цикла могут быть стартами одновременно.",
