      "status": "needs_human_review"
    },
    {
      "id": "idea-step-four-cycle-shift",
      "title": "Сдвиг на четыре шага сохраняет конфигурацию",
      "text": "После каждых четырёх ходов все стрелки возвращаются к исходным направлениям, поэтому один построенный цикл даёт хорошие старты в вершинах с шагом 4 вдоль цикла.",
