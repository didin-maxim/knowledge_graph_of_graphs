  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Сжатое официальное решение",
      "text": "Официальное решение показывает, что максимум равен \\(0\\) при нечётном \\(n\\) и \\(n^2/4\\) при чётном \\(n\\). При нечётном \\(n\\) используется шахматная раскраска: каждый ход переводит улитку в клетку другого цвета, а потому после \\(n^2\\) ходов она не может вернуться в стартовую клетку. Для чётного \\(n\\) строится явный цикл по всем клеткам доски, который змейкой проходит строки и затем замыкается вдоль первого столбца. Стрелки в клетках заранее поворачиваются так, чтобы после \\(i\\) шагов стрелка в \\(i\\)-й клетке указывала на следующую вершину этого цикла; это даёт один хороший старт. Так как через каждые 4 шага глобальная конфигурация стрелок снова совпадает с исходной, хорошими оказываются все вершины цикла с индексами, кратными 4, то есть \\(n^2/4\\) стартов. Для верхней оценки сравниваются траектории двух хороших стартов: официальное решение показывает, что они обязаны быть одним и тем же циклом сдвинутым на число ходов, кратное 4, поэтому хороших стартов не больше \\(n^2/4\\).",
      "idea_ids": [
