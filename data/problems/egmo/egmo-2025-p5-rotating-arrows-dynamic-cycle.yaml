      "id": "idea-checkerboard-parity",
      "title": "Шахматная чётность запрещает нечётный обход",
      "text": "На доске нечётного размера траектория меняет цвет клетки на каждом ходу, поэтому после \\(n^2\\) ходов не может вернуться в стартовую клетку.",
