  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Решение через отражения",
      "text": "Ответ: подходят ровно числа вида \\(2^t-1\\), где \\(t\\ge 1\\). Обозначим через \\(F(a,b)\\) число домино-разбиений прямоугольника \\(a\\times b\\); дополнительно положим \\(F(0,b)=F(a,0)=1\\). Сначала докажем лемму: если \\(m\\) чётно, то \\(F(m,2r+1)\\equiv F(m,r)\\pmod 2\\). Отразим все разбиения прямоугольника \\(m\\times(2r+1)\\) относительно средней вертикальной прямой. Неинвариантные разбиения разбиваются на пары, поэтому по модулю 2 остаются только симметричные. В симметричном разбиении каждая клетка центрального столбца должна быть покрыта домино внутри этого столбца: если домино из центрального столбца выходило бы влево или вправо, его отражение было бы вторым домино, покрывающим ту же центральную клетку. Так как \\(m\\) чётно, центральный столбец единственным образом заполняется вертикальными домино, а левая половина \\(m\\times r\\) выбирается произвольно и затем однозначно отражается вправо. Это даёт нужную конгруэнцию. Вторая лемма: при чётном \\(m\\ge2\\) число \\(F(m,m)\\) чётно. Отражение квадратной доски относительно главной диагонали также разбивает разбиения на пары. Неподвижных разбиений нет: диагональная клетка должна быть покрыта домино, и отражение этого домино либо является другим домино, снова покрывающим ту же клетку, либо требовало бы домино из двух клеток, касающихся только углом; оба варианта невозможны. Теперь классификация. Если \\(n\\) чётно, то, взяв \\(k=n/2\\), получаем прямоугольник \\(n\\times n\\), у которого число разбиений чётно; значит такое \\(n\\) не подходит. Если \\(n=2r+1\\) нечётно, то для любого \\(k\\) по первой лемме и повороту прямоугольника \\(F(n,2k)=F(2k,n)\\equiv F(2k,r)=F(r,2k)\\pmod2\\). Поэтому свойство для \\(2r+1\\) эквивалентно свойству для \\(r\\). Повторяя переход \\(n\\mapsto (n-1)/2\\), мы в конце приходим либо к положительному чётному числу, которое уже не подходит, либо к \\(0\\), для которого все числа \\(F(0,2k)\\) равны \\(1\\). Последнее происходит ровно для \\(n=2^t-1\\).",
