  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Сжатое официальное решение",
      "text": "Ответ: подходят ровно числа вида \\(2^t-1\\). В первом официальном решении используется парность под отражениями: для чётного \\(m\\) число разбиений \\(m\\times(2n+1)\\) сравнивается по модулю 2 с числом разбиений \\(m\\times n\\), поскольку неподвижные конфигурации должны целиком заполнять центральный столбец вертикальными домино. Кроме того, при чётном \\(n\\ge 2\\) число разбиений квадрата \\(n\\times n\\) чётно благодаря отражению по диагонали без неподвижных точек. Отсюда рекурсией получается классификация \\(n=2^t-1\\). Во втором официальном решении клетки двух цветов образуют двудольный граф, а домино-разбиения становятся его совершенными паросочетаниями. По модулю 2 число паросочетаний равно определителю матрицы смежности, и задача сводится к проверке её вырожденности над \\(\\mathbf F_2\\). Для чётных \\(n\\) строится ненулевой вектор ядра, а переход между \\(n\\) и \\(2n+1\\) реализуется зеркальным удвоением конструкции.",
