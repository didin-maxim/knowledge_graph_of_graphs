  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Сжатое официальное решение",
      "text": "Во втором официальном решении строится двудольный граф, где одна доля состоит из строк таблицы, другая — из столбцов, а каждая синяя клетка даёт ребро между своей строкой и своим столбцом. Тогда число синих клеток равно числу рёбер. Условие задачи переписывается как ограничение на суммы степеней концов для любой пары строка-столбец; отсюда сразу следует, что пустых строк и столбцов нет, а каждая связная компонента графа содержит хотя бы 4 вершины. Так как всего вершин \\(8m\\), компонент не больше \\(2m\\), а значит число рёбер не меньше \\(8m-2m=6m\\). Блочная конструкция из официального решения достигает этой оценки, так что минимум равен \\(6m\\).",
