        "id": "stmt-original",
        "title": "Условие",
        "text": "Пусть \\(m\\) — положительное целое. Рассматривается таблица \\(4m\\times 4m\\) из единичных клеток. Две разные клетки называются связанными, если они лежат в одной строке или в одном столбце. Некоторые клетки покрашены в синий цвет так, что каждая клетка связана хотя бы с двумя синими клетками. Найдите минимально возможное число синих клеток.",
