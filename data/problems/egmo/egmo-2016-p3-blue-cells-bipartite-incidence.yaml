        "text": "Построим двудольный граф: слева вершины-строки, справа вершины-столбцы, а каждая синяя клетка даёт ребро между своей строкой и своим столбцом. Условие задачи превращается в локальное ограничение на суммы степеней концов каждого возможного пересечения строки и столбца.",
