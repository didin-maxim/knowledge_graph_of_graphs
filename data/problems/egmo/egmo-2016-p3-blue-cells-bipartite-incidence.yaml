  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Решение через двудольный граф строк и столбцов",
      "text": "Ответ равен \\(6m\\).\n\nПостроим двудольный граф. В одной доле возьмем \\(4m\\) строк, в другой - \\(4m\\) столбцов. Синей клетке в строке \\(r\\) и столбце \\(c\\) сопоставим ребро \\(rc\\). Тогда число синих клеток равно числу ребер графа.\n\nДля клетки \\((r,c)\\) число синих клеток, связанных с ней и отличных от нее, равно\n\\[\n\\deg r+\\deg c-2\\mathbf 1_{rc\\in E}.\n\\]\nПо условию это число не меньше 2 для любых \\(r,c\\). В частности, в графе нет изолированных вершин: если, например, \\(\\deg r=0\\), то для всех столбцов \\(c\\) должно быть \\(\\deg c\\ge 2\\), откуда уже \\(|E|\\ge 8m\\), что сильнее требуемого. Поэтому далее можно считать, что все вершины имеют положительную степень.\n\nДокажем, что каждая компонента связности этого графа содержит не меньше четырех вершин. Компонента из одной вершины невозможна, так как изолированных вершин нет. Компонента из двух вершин была бы единственным ребром \\(rc\\); тогда для клетки \\((r,c)\\) получаем \\(1+1-2=0\\), противоречие. Компонента из трех вершин в двудольном графе является путем длины 2: одна вершина имеет степень 2, две другие степень 1. Если взять клетку, соответствующую ребру, инцидентному вершине степени 2, то для нее число связанных синих клеток равно \\(1+2-2=1\\), что также противоречит условию. Значит, компонент с 1, 2 или 3 вершинами нет.\n\nВсего вершин \\(8m\\), следовательно, компонент связности не больше \\(8m/4=2m\\). Если в компоненте \\(v\\) вершин, то она содержит не меньше \\(v-1\\) ребер. Суммируя по компонентам, получаем\n\\[\n|E|\\ge 8m-2m=6m.\n\\]\nЗначит, синих клеток не меньше \\(6m\\).\n\nПокажем, что \\(6m\\) достижимо. Разобьем таблицу на \\(m\\) непересекающихся блоков \\(4\\times4\\), стоящих вдоль главной диагонали. В каждом таком блоке покрасим в синий цвет шесть клеток\n\\[\n(1,1),(2,1),(3,1),(4,2),(4,3),(4,4),\n\\]\nпонимая координаты внутри блока; все остальные клетки оставим не синими.\n\nПроверим условие внутри одного блока. В первых трёх строках блока есть синяя клетка в первом столбце, а в четвёртой строке есть три синие клетки. В первом столбце блока есть три синие клетки, а во втором, третьем и четвёртом столбцах есть синяя клетка в четвёртой строке. Поэтому для любой клетки блока, кроме, возможно, самих шести синих клеток, в её строке и столбце вместе видны как минимум две синие клетки. Для синей клетки тоже всё верно после исключения самой клетки: у \\((1,1),(2,1),(3,1)\\) остаются две другие синие клетки в первом столбце; у \\((4,2),(4,3),(4,4)\\) остаются две другие синие клетки в четвёртой строке.\n\nЕсли клетка лежит вне диагональных блоков, то её строка принадлежит одному из блоков, а столбец — другому. В её строке есть хотя бы одна синяя клетка в диагональном блоке этой строки, и в её столбце есть хотя бы одна синяя клетка в диагональном блоке этого столбца. Эти две синие клетки различны, потому что рассматриваемая клетка не лежит в диагональном блоке. Значит, такая клетка тоже связана как минимум с двумя синими клетками. Таким образом, условие выполнено, а синих клеток ровно \\(6m\\).",
