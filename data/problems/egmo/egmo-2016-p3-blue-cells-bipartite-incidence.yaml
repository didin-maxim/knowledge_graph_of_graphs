    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Пусть \\(m\\) — положительное целое, а \\(G=(R,C,E)\\) — двудольный граф, в котором \\(|R|=|C|=4m\\). Для любых \\(r\\in R\\) и \\(c\\in C\\) выполнено неравенство \\(\\deg(r)+\\deg(c)-2\\mathbf 1_{rc\\in E}\\ge 2\\). Найдите минимально возможное число рёбер \\(|E|\\).",
        "status": "needs_human_review",
