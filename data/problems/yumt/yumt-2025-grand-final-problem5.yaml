  "solutions": [
    {
      "id": "sol-ai-root-leaf-counting",
      "title": "ИИ-решение: подсчет путей от корня к листьям",
      "text": "Ответ: 1/floor((n+1)^2/4).\n\nСначала докажем, что Боря всегда может получить не меньше этой величины. Рассмотрим произвольные граф, веса и стартовую вершину A, выбранные Аней, и возьмем в графе любое остовное дерево T с корнем A. Пусть M - максимальное среднее арифметическое на простом пути из A; достаточно оценивать только пути дерева, потому что они тоже являются простыми путями исходного графа.\n\nОбозначим листья корневого дерева T через L. Для листа x пусть P_x - путь от A до x, а |P_x| - число вершин в этом пути. По определению M для каждого листа x выполнено\nsum_{v in P_x} a_v <= M |P_x|,\nгде a_v - число в вершине v. Просуммируем эти неравенства по всем листьям. Левая часть равна сумме a_v, где каждая вершина v посчитана столько раз, сколько листьев лежит в ее поддереве; это число хотя бы 1. Поэтому левая часть не меньше sum_v a_v=1. Значит\n1 <= M sum_{x in L} |P_x|.        (1)\n\nПусть в T ровно l листьев. На любом пути от корня к листу все вершины, кроме последнего листа, являются нелистовыми вершинами дерева. Нелистовых вершин всего n-l, поэтому |P_x| <= n-l+1 для каждого листа x. Следовательно,\nsum_{x in L} |P_x| <= l(n-l+1) <= floor((n+1)^2/4).\nИз (1) получаем M >= 1/floor((n+1)^2/4). Значит такой выигрыш Боря гарантирует всегда.\n\nОсталось показать, что большего гарантировать нельзя. При n=1 Аня вынуждена поставить число 1 в единственной вершине, и ответ равен 1. Пусть n>=2. Выберем целое l, на котором достигается максимум l(n-l+1), то есть l(n-l+1)=floor((n+1)^2/4). Аня строит дерево-\"веник\": путь из n-l нелистовых вершин, начинающийся в A, и l листьев, прикрепленных к последней вершине этого пути. Во все нелистовые вершины она записывает 0, а в каждый лист - 1/l.\n\nЛюбой простой путь из A в этом дереве либо заканчивается до листьев и имеет среднее 0, либо доходит до одного листа. Во втором случае путь содержит n-l+1 вершин и ровно один положительный вес 1/l, поэтому его среднее равно\n(1/l)/(n-l+1)=1/[l(n-l+1)]=1/floor((n+1)^2/4).\nЗначит Аня может не позволить Боре получить больше этой величины. Нижняя и верхняя оценки совпадают.",
