  "ideas": [
    {
      "id": "idea-root-leaf-path-counting",
      "title": "Суммировать по путям от корня к листьям",
      "text": "Если M - наибольшее среднее на простом пути из стартовой вершины, то в любом остовном дереве сумма весов на каждом пути от корня к листу не превосходит M, умноженного на длину этого пути. Суммирование по листьям покрывает каждую вершину хотя бы один раз и дает нижнюю оценку на M через максимальную возможную сумму длин корень-лист.",
      "status": "ai_checked"
    },
    {
      "id": "idea-broom-extremal-tree",
      "title": "Экстремальный пример - веник",
      "text": "Чтобы минимизировать выигрыш Бори, Аня берет путь-ручку из n-l нелистовых вершин и прикрепляет к его концу l листьев, а весь вес поровну кладет в листья. Тогда любой ненулевой выигрыш равен 1/[l(n-l+1)], и нужно выбрать l, максимизирующее l(n-l+1).",
      "status": "ai_checked"
    }
