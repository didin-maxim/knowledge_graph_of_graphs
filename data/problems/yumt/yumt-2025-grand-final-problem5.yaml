        "title": "Оригинальная формулировка",
        "text": "Дано натуральное n.\nАня рисует связный граф на n вершинах, в которых она расставляет неотрицательные вещественные числа с суммой 1.\nОдну из вершин Аня называет стартовой вершиной A.\nУвидев этот граф и числа, Боря выбирает в нём простой путь, возможно длины 0, выходящий из A.\nВыигрыш Бори — среднее арифметическое чисел, записанных в вершинах этого пути.\nКакой наибольший выигрыш может гарантировать Боря вне зависимости от действий Ани?",
