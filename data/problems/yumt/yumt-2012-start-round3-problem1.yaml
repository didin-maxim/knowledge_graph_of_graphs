        "title": "Оригинальная формулировка",
        "text": "В стране 20 городов. Между любыми двумя городами есть двусторонние авиалинии.\nПо антимонопольному закону, если авиакомпания владеет двумя смежными линиями, то она не может владеть линией между крайними городами этого пути длины 2.\nМогут ли все авиалинии принадлежать четырём компаниям?",
