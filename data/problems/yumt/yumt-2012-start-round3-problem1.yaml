  "solutions": [
    {
      "id": "sol-ai-c5-blow-up",
      "title": "ИИ-решение: конструкция из пяти групп по четыре города",
      "text": "Ответ: да, могут.\n\nРазобьём 20 городов на 5 групп \\(A_0,A_1,A_2,A_3,A_4\\), по 4 города в каждой. Все индексы групп ниже считаются по модулю 5.\n\nЛинии между разными группами распределим между первыми двумя компаниями. Первая компания получает все линии между группами \\(A_i\\) и \\(A_{i+1}\\), то есть между соседними вершинами пятицикла. Вторая компания получает все остальные линии между разными группами, то есть линии между \\(A_i\\) и \\(A_{i+2}\\). Так покрыты все линии между разными группами: любые две вершины пятицикла либо соседние, либо находятся на расстоянии 2.\n\nОсталось распределить линии внутри каждой группы из 4 городов. В каждой группе обозначим города как \\(1,2,3,4\\). Третьей компании отдадим линии \\(12,23,34,41\\), а четвёртой компании -- линии \\(13\\) и \\(24\\). Так сделаем независимо в каждой из пяти групп.\n\nПроверим антимонопольное условие. Если какая-то компания нарушила бы закон, то нашлись бы три города, между каждой парой которых линии принадлежат этой одной компании, то есть появился бы одноцветный треугольник. Докажем, что таких треугольников нет.\n\nУ первой компании линии есть только между соседними группами пятицикла. Одноцветный треугольник первой компании не может иметь две вершины в одной группе, потому что линии внутри группы отданы третьей и четвёртой компаниям. Значит, его вершины лежали бы в трёх разных группах, а соответствующие три группы должны были бы попарно быть соседними в \\(C_5\\). Но в пятицикле нет треугольников. Для второй компании рассуждение такое же: её линии между группами образуют дополнение к \\(C_5\\), а оно тоже является пятициклом, поэтому треугольников не содержит.\n\nУ третьей и четвёртой компаний все линии лежат только внутри отдельных групп. Внутри одной группы третья компания получила цикл \\(1-2-3-4-1\\), в котором нет треугольника, а четвёртая компания получила только две несмежные линии \\(13\\) и \\(24\\), где треугольника тем более нет. Между разными группами у этих компаний линий нет, значит, и там одноцветный треугольник невозможен.\n\nИтак, все авиалинии распределены между четырьмя компаниями, и ни одна компания не владеет сразу тремя сторонами треугольника. Следовательно, закон выполнен.",
