        "title": "Оригинальная формулировка",
        "text": "В государстве 2011 городов. Каждая пара городов соединена односторонней авиалинией.\nИзвестно, что в каждый город входит не более k авиалиний и из каждого города выходит не более k авиалиний.\nПри каком наибольшем k независимо от схемы авиалиний, удовлетворяющей условию, из каждого города можно долететь до другого?",
