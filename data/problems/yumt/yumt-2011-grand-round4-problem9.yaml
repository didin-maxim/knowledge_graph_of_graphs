      "id": "sol-archive-card",
      "title": "Оценка через компоненты турнира",
      "text": "Ответ: k = 1507.\n\nРассмотрим ориентированный полный граф на 2011 вершинах. Докажем сначала, что при k <= 1507 из любого города можно долететь до любого другого. Предположим противное: граф не сильно связен. Тогда в его конденсации есть начальная сильная компонента S, в которую не входит ни одно ребро снаружи. Значит, все авиалинии между S и остальными городами направлены из S наружу. Если |S|=s, то внутри S сумма исходящих степеней равна s(s-1)/2, поэтому в S есть вершина, из которой внутри S выходит не меньше (s-1)/2 авиалинии. Из этой же вершины выходят авиалинии во все 2011-s городов вне S, так что её исходящая степень не меньше 2011-s+(s-1)/2=(4021-s)/2. Так как исходящая степень не превосходит 1507, получаем s >= 1007.\n\nТак же в конденсации есть конечная сильная компонента T, из которой не выходит ни одно ребро наружу. Все авиалинии между остальными городами и T направлены в T. Тем же подсчётом входящих степеней получаем |T| >= 1007. Но начальная и конечная компоненты различны и не пересекаются, а 1007+1007>2011. Противоречие. Значит, при k <= 1507 граф обязательно сильно связен.\n\nОсталось показать, что k=1508 уже не гарантирует связности. Разобьём города на две группы A и B размеров 1005 и 1006. Все авиалинии между группами направим из A в B. Внутри A возьмём регулярный турнир: из каждой вершины выходит и в каждую входит по 502 ребра. Внутри B возьмём турнир, в котором входящая и исходящая степени каждой вершины не превосходят 503, например почти регулярный турнир. Тогда для вершины из A исходящая степень равна не больше 1006+502=1508, а входящая не больше 502; для вершины из B входящая степень не больше 1005+503=1508, а исходящая не больше 503. Условие при k=1508 выполнено, но из B нельзя долететь в A. Следовательно, наибольшее подходящее k равно 1507.",
