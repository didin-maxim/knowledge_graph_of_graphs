  "solutions": [
    {
      "id": "sol-archive-card",
      "title": "Решение",
      "text": "Рассмотрим граф знакомств: вершины этого графа — животные, а рёбра — знакомства.\nПусть a — число рёбер между котами, b — число рёбер между псами, c — число рёбер между котами и псами. Обозначим через k число котов, а через p число псов.\nТогда среднее число знакомых кота среди котов равно 2a / k, среди псов равно c / k. По условию первое в три раза больше второго, значит,\n2a / k = 3c / k,\nоткуда 2a = 3c.\nТак же у пса среднее число знакомых среди псов равно 2b / p, среди котов равно c / p. По условию\n2b / p = 5c / p,\nоткуда 2b = 5c.\nСреднее число знакомых животных у кота равно (2a + c) / k, а у пса равно (2b + c) / p. По условию у пса это число вдвое больше, чем у кота:\n(2b + c) / p = 2(2a + c) / k.\nПодставляя 2a = 3c и 2b = 5c, получаем\n6c / p = 8c / k.\nТак как c > 0, отсюда следует k / p = 4 / 3.\nЗначит, котов в посёлке больше в 4/3 раза.",
