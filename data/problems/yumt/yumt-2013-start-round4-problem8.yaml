      "id": "idea-double-count-acquaintances-by-species",
      "title": "Двойной подсчёт знакомств по типам животных",
      "text": "Вводятся четыре суммы: знакомства кот-кот, кот-пёс, пёс-пёс и общее число знакомств; данные о средних значениях превращаются в линейные соотношения между ними.",
