        "title": "Оригинальная формулировка",
        "text": "В дачном посёлке из животных есть только псы и коты.\nУ кота в среднем втрое больше знакомых среди котов, чем среди псов. У пса в среднем впятеро больше знакомых среди псов, чем среди котов.\nУ пса среднее число знакомых животных вдвое больше, чем у кота.\nКого в посёлке больше: котов или псов, и во сколько раз?",
