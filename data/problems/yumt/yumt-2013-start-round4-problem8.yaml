        "id": "stmt-graph-bipartition-average-degrees",
        "text": "Вершины простого графа разбиты на два класса: котов и псов. Средняя по котам степень внутри класса котов втрое больше средней по котам степени в класс псов, средняя по псам степень внутри класса псов впятеро больше средней по псам степени в класс котов, а средняя полная степень вершины-пса вдвое больше средней полной степени вершины-кота. Определите отношение числа котов к числу псов.",
