  "solutions": [
    {
      "id": "sol-ai-independent-triangle-transversal",
      "title": "ИИ-решение: независимое множество, бьющее все треугольники",
      "text": "Докажем сначала лемму. В любом графе без \\(K_4\\), в котором любые два треугольника имеют общую вершину, существует независимое множество \\(S\\), пересекающее каждый треугольник.\n\nЕсли треугольников нет, берём \\(S=\\varnothing\\). Если есть вершина \\(x\\), принадлежащая всем треугольникам, берём \\(S=\\{x\\}\\). Остался случай, когда общей для всех треугольников вершины нет.\n\nСначала заметим, что тогда найдутся два треугольника, имеющие ровно одну общую вершину. Действительно, если любые два треугольника имели бы общее ребро, то возьмём два разных треугольника \\(abc\\) и \\(abd\\). Из отсутствия \\(K_4\\) следует, что \\(cd\\) не ребро. Любой другой треугольник должен иметь общее ребро и с \\(abc\\), и с \\(abd\\); из-за отсутствия ребра \\(cd\\) это возможно только если он содержит ребро \\(ab\\). Значит, все треугольники содержат, например, вершину \\(a\\), противоречие.\n\nПусть поэтому есть два треугольника \\(xab\\) и \\(xcd\\), пересекающиеся только по \\(x\\). Рассмотрим любой треугольник \\(T\\), не содержащий \\(x\\). Он обязан пересекать оба треугольника \\(xab\\) и \\(xcd\\). При этом \\(T\\) не может содержать одновременно \\(a\\) и \\(b\\): если его третья вершина, например, \\(c\\), то вершины \\(x,a,b,c\\) образовали бы \\(K_4\\); остальные варианты такие же. Аналогично \\(T\\) не может содержать одновременно \\(c\\) и \\(d\\). Значит, \\(T\\) имеет вид \\(pqy\\), где \\(p\\in\\{a,b\\}\\), \\(q\\in\\{c,d\\}\\), а \\(y\\) не принадлежит \\(\\{x,a,b,c,d\\}\\). Назовём такую вершину \\(y\\) хвостом треугольника \\(T\\).\n\nПусть \\(Y\\) — множество всех хвостов треугольников, не содержащих \\(x\\). Тогда \\(x\\) не смежна ни с одной вершиной из \\(Y\\): если \\(xy\\) было бы ребром для треугольника \\(pqy\\), то \\(x,p,q,y\\) образовали бы \\(K_4\\). Покажем, что \\(Y\\) независимо. Пусть разные хвосты \\(y_1,y_2\\) соответствуют треугольникам \\(p_1q_1y_1\\) и \\(p_2q_2y_2\\), где \\(p_i\\in\\{a,b\\}\\), \\(q_i\\in\\{c,d\\}\\). Если бы \\(y_1y_2\\) было ребром, то при \\(p_1=p_2\\) треугольник \\(p_1y_1y_2\\) не имел бы общих вершин с \\(xcd\\), а при \\(q_1=q_2\\) треугольник \\(q_1y_1y_2\\) не имел бы общих вершин с \\(xab\\). Если же \\(p_1\\ne p_2\\) и \\(q_1\\ne q_2\\), то сами треугольники \\(p_1q_1y_1\\) и \\(p_2q_2y_2\\) не имели бы общих вершин. Во всех случаях противоречие условию. Поэтому \\(Y\\) независимо.\n\nСледовательно, множество \\(S=\\{x\\}\\cup Y\\) независимо. Оно пересекает каждый треугольник: треугольники, содержащие \\(x\\), пересекаются с \\(S\\) по \\(x\\), а каждый треугольник без \\(x\\) содержит свой хвост из \\(Y\\). Лемма доказана.\n\nТеперь удалим из исходного графа найденное независимое множество \\(S\\). В индуцированном подграфе \\(G-S\\) треугольников нет, иначе такой треугольник исходного графа не пересекал бы \\(S\\). По условию \\(G-S\\) допускает правильную раскраску в \\(k\\) цветов. Все вершины \\(S\\) красим одним новым, \\((k+1)\\)-м цветом; это правильно, потому что \\(S\\) независимо. Получаем правильную раскраску всего графа в \\(k+1\\) цвет.",
