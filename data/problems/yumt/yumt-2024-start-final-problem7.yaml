  "solutions": [
    {
      "id": "sol-ai-double-sweep",
      "title": "ИИ-решение: двойной поиск самой далёкой вершины",
      "text": "Ответ: да.\n\nАна выбирает произвольную вершину, например 1, и спрашивает расстояния от неё до всех остальных 2023 вершин. Пусть a - одна из вершин, для которой это расстояние максимально.\n\nДокажем лемму: такая вершина a является концом некоторого диаметра дерева. Укореним дерево в вершине 1. Тогда первая серия вопросов просто сообщает глубины всех вершин, и a имеет максимальную глубину.\n\nВозьмём любые концы x и y диаметра. Пусть c - их наименьший общий предок в укоренённом дереве. Так как a имеет максимальную глубину, depth(a) >= depth(x) и depth(a) >= depth(y). Если a лежит в поддереве c, то она может лежать не более чем в одной из двух ветвей от c к x и к y; выберем конец z из другой ветви, а другой конец обозначим через w. Тогда путь от a к z проходит через c, поэтому\n\nd(a,z)=depth(a)+depth(z)-2depth(c) >= depth(w)+depth(z)-2depth(c)=d(x,y).\n\nЕсли же a не лежит в поддереве c, то для z=x или z=y наименьший общий предок a и z является предком c или равен c, то есть имеет глубину не больше depth(c). Выбрав z одним из концов, а w другим, снова получаем\n\nd(a,z)=depth(a)+depth(z)-2depth(lca(a,z)) >= depth(w)+depth(z)-2depth(c)=d(x,y).\n\nЗначит, расстояние от a до некоторой вершины не меньше длины диаметра. Больше диаметра оно быть не может, следовательно, a действительно является концом диаметра.\n\nТеперь Ана спрашивает расстояния от a до всех вершин, кроме самой a и вершины 1: расстояние d(a,1) уже известно из первого вопроса о паре (1,a). Это ещё 2022 вопроса. Пусть b - вершина, расстояние от a до которой максимально среди всех вершин. По лемме a является концом диаметра, значит эта максимальная величина равна диаметру дерева, и пара a,b искомая.\n\nВсего задано 2023+2022=4045 вопросов.",
