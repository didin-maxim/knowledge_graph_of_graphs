      "title": "Два раза найти самую далёкую вершину",
      "text": "В дереве любая вершина, наиболее удалённая от фиксированного корня, является концом некоторого диаметра. Поэтому достаточно сначала найти такую вершину a запросами расстояний от произвольного корня, а затем найти самую далёкую от a вершину b.",
