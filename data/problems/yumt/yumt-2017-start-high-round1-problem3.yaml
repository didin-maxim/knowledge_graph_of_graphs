  "solutions": [
    {
      "id": "sol-ai-distance-three-extremal",
      "title": "ИИ-решение: расстояние 3 и подсчет недостающих рёбер",
      "text": "Ответ: k_max = C(n-1,2).\n\nСначала докажем верхнюю оценку. Пусть Петя может выиграть на некотором исходном графе с k ребрами и выбранными городами A,B. До первого хода Васи Петя еще не разрушил ни одной дороги. Поэтому если в исходном графе расстояние от A до B не больше 2, Вася первым же ходом переходит в B и выигрывает. Следовательно, для выигрышной стратегии Пети необходимо, чтобы расстояние между A и B было хотя бы 3.\n\nЭто условие сразу ограничивает число ребер. Во-первых, ребра AB нет. Во-вторых, ни один город v, отличный от A и B, не может быть соединен дорогами одновременно с A и с B: иначе был бы путь A-v-B длины 2. Значит для каждого из n-2 таких городов отсутствует хотя бы одно из двух ребер Av и Bv. Все эти отсутствующие ребра различны, и вместе с отсутствующим ребром AB их не меньше n-1. В полном графе на n вершинах C(n,2) ребер, поэтому\nk <= C(n,2) - (n-1) = C(n-1,2).\n\nОсталось показать, что эта оценка достижима. Возьмем вершины A,B,x и еще n-3 вершин. На множестве из n-1 вершин, состоящем из A,x и этих n-3 вершин, проведем все ребра, кроме ребра Ax. Вершину B соединим единственным ребром с x. Граф связен, так как n>10, а число ребер равно\n(C(n-1,2)-1)+1 = C(n-1,2).\nРасстояние от A до B равно 3: например, A-s-x-B для любой из дополнительных вершин s, а более короткого пути нет, поскольку B соединена только с x, а ребра Ax нет.\n\nПетя выбирает эти A и B. Первым ходом Вася не может попасть в B, потому что до B нужно проехать три дороги. После этого Петя разрушает единственную дорогу xB. Город B становится изолированным, поэтому при дальнейшей игре Вася уже никогда не сможет попасть в B. Значит Петя выигрывает при k=C(n-1,2), и вместе с верхней оценкой это дает требуемый максимум.",
