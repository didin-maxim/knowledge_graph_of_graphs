      "id": "idea-disjoint-quadratics-form-a-chain-order",
      "title": "Непересекающиеся графики задают порядок",
      "text": "Если графики двух квадратных трёхчленов не пересекаются, то один из них всюду выше другого. Поэтому все попарно непересекающиеся трёхчлены образуют цепь по отношению всюду ниже; в такой цепи два элемента, несравнимые с третьим, вынуждены стоять рядом, иначе несравнимым был бы и каждый промежуточный элемент.",
