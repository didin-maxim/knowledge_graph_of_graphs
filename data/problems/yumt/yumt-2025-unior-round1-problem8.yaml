    {
      "id": "sol-ai-order-on-disjoint-quadratics",
      "title": "ИИ-решение: порядок по непересечению графиков",
      "text": "Ответ: только n = 2.\n\nСначала построим пример для n = 2. Расставим по циклу C_4 трёхчлены x^2, -x^2+2, x^2+1, -x^2+3. Соседние пары пересекаются: x^2 = -x^2+2, -x^2+2 = x^2+1, x^2+1 = -x^2+3 и -x^2+3 = x^2 имеют вещественные решения. Противоположные пары не пересекаются, потому что x^2+1 всюду выше x^2, а -x^2+3 всюду выше -x^2+2. Значит, C_4 реализуется.\n\nДокажем, что при n >= 3 это невозможно. Обозначим вершины цикла по порядку v_1, v_2, ..., v_{2n}, а соответствующий вершине v_i трёхчлен через P_i. Если графики P_i и P_j не пересекаются, то разность P_i-P_j нигде не обращается в ноль и потому имеет постоянный знак: один из двух трёхчленов всюду ниже другого. Будем писать P_i < P_j, если P_i(x) < P_j(x) при всех вещественных x. Это отношение транзитивно.\n\nВершины одной чётности в цикле C_{2n} попарно не соседние, значит, соответствующие им графики попарно не пересекаются. Поэтому P_2, P_4, ..., P_{2n} образуют линейный порядок по отношению <.\n\nЗафиксируем нечётную вершину v_{2i-1}. Она должна пересекаться ровно с двумя соседними чётными вершинами v_{2i-2} и v_{2i}; индексы понимаются по модулю 2n. Со всеми остальными чётными вершинами её график не пересекается, то есть соответствующие трёхчлены сравнимы с P_{2i-1}. Покажем, что P_{2i-2} и P_{2i} обязаны быть соседними в линейном порядке на чётных трёхчленах. Действительно, если между ними стоит некоторый чётный трёхчлен Q, то из P_{2i-2} < Q < P_{2i} или из P_{2i} < Q < P_{2i-2} следует: если P_{2i-1} < Q, то P_{2i-1} был бы ниже одного из крайних трёхчленов, а если Q < P_{2i-1}, то один из крайних трёхчленов был бы ниже P_{2i-1}. В обоих случаях P_{2i-1} оказался бы сравним хотя бы с одним из P_{2i-2}, P_{2i}, что противоречит их пересечению. Значит, промежуточного Q нет.\n\nИтак, для каждого i пара чётных вершин, соседних с v_{2i-1}, должна быть соседней парой в одном линейном порядке на n чётных вершинах. Таких пар получается n: {v_{2n},v_2}, {v_2,v_4}, ..., {v_{2n-2},v_{2n}}. Но в линейном порядке из n элементов всего n-1 соседних пар. При n >= 3 это невозможно. Следовательно, кроме уже построенного случая n = 2 решений нет.",
