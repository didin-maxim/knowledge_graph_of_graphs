        "title": "Оригинальная формулировка",
        "text": "Изначально N неотрицательных целых чисел расставлены в вершинах связного графа, в котором не меньше 3 вершин; сумма этих чисел равна 2N.\nВася и Петя ходят по очереди. За ход сначала Вася вычитает 3 из одного числа, а затем Петя прибавляет по 1 к какому-то числу и двум из его соседей.\nПетя выигрывает, если Вася не может сделать очередной ход.\nДля каких связных графов с не менее чем 3 вершинами у Пети есть выигрышная стратегия при любой начальной расстановке чисел?",
