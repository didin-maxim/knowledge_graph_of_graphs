      "id": "idea-zykov-turan-product",
      "title": "Свести к графу Турана и оценить произведение",
      "text": "По теореме Зыкова число клик каждого фиксированного размера среди графов на n вершинах с кликовым числом не больше k максимально у графа Турана T(n,k). В полном k-дольном графе с размерами долей a_1,...,a_k общее число клик равно произведению (a_i+1), потому что из каждой доли можно взять либо одну вершину, либо ничего.",
