  "solutions": [
    {
      "id": "sol-ai-zykov-turan-product-bound",
      "title": "ИИ-решение: теорема Зыкова и оценка произведения",
      "text": "Обозначим через c_r(G) число r-клик в графе G, считая c_0(G)=1 для пустой клики. Воспользуемся стандартной теоремой Зыкова: среди всех графов на n вершинах, не содержащих клики размера k+1, число r-клик для каждого фиксированного r максимально у графа Турана T(n,k), то есть у полного k-дольного графа с почти равными долями.\n\nТак как в нашем графе максимальная клика имеет размер k, он не содержит K_{k+1}. Поэтому\nsum_{r=0}^k c_r(G) <= sum_{r=0}^k c_r(T(n,k)).\nПусть размеры долей графа T(n,k) равны a_1,...,a_k; тогда a_i >= 1 и a_1+...+a_k=n. В полном k-дольном графе клика содержит не более одной вершины из каждой доли, а любой такой выбор действительно задаёт клику. Следовательно, общее число клик в T(n,k), включая пустую, равно\n(a_1+1)(a_2+1)...(a_k+1).\n\nОсталось оценить это произведение. Для любого целого y >= 2 верно y <= 3^{y/3}: при y=2 это 2 <= 3^{2/3}, при y=3 равенство, а дальше функция 3^{y/3}/y возрастает на целых y >= 3. Подставляя y_i=a_i+1, получаем\n(a_1+1)...(a_k+1) <= 3^{(a_1+1)/3}...3^{(a_k+1)/3} = 3^{(n+k)/3}.\n\nЗначит число всех клик исходного графа, включая пустую, не превосходит 3^{(n+k)/3}, что и требовалось доказать.",
