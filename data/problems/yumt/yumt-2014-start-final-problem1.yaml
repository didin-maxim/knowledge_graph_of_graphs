        "title": "Оригинальная формулировка",
        "text": "В стране 111 городов. Некоторые пары городов соединены одной или несколькими дорогами, не проходящими через другие города.\nИзвестно, что из любого города можно проехать в любой другой.\nОднако при закрытии на ремонт дорог любого кольцевого маршрута это свойство нарушается.\nКакое наибольшее число дорог может быть в стране?",
