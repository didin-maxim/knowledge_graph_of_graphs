  "solutions": [
    {
      "id": "sol-ai-spanning-tree-complement-cycle",
      "title": "ИИ-решение через остовное дерево и цикл вне него",
      "text": "Ответ: \\(220\\).\n\nСначала докажем, что больше быть не может. Обозначим через \\(G\\) мультиграф дорог, пусть в нём \\(n=111\\) вершин и \\(m\\) рёбер. Так как граф связен, в нём есть остовное дерево \\(T\\) с \\(n-1=110\\) рёбрами.\n\nПредположим, что \\(m\\ge 221\\). Тогда вне дерева \\(T\\) остаётся не меньше \\(m-110\\ge 111\\) рёбер. Рассмотрим граф на тех же \\(111\\) вершинах, составленный только из этих рёбер, не входящих в \\(T\\). Если бы в нём не было цикла, он был бы лесом, а лес на \\(111\\) вершинах имеет не больше \\(110\\) рёбер. Противоречие. Значит, среди рёбер вне \\(T\\) есть некоторый цикл \\(C\\).\n\nНо тогда после закрытия всех дорог цикла \\(C\\) все рёбра остовного дерева \\(T\\) останутся открытыми. Следовательно, по ним всё ещё можно проехать из любого города в любой другой. Это противоречит условию задачи. Поэтому \\(m\\le 220\\).\n\nОсталось показать, что \\(220\\) дорог достижимы. Выберем один город \\(O\\) и соединим его с каждым из остальных \\(110\\) городов ровно двумя параллельными дорогами. Всего получится \\(2\\cdot 110=220\\) дорог, и граф связен.\n\nВ таком графе любой кольцевой маршрут обязательно заходит хотя бы в один город, отличный от \\(O\\), и выходит из него обратно в \\(O\\). У этого города есть только две дороги, обе ведут в \\(O\\), поэтому в кольцевом маршруте используются обе эти дороги. После их закрытия этот город оказывается отрезанным от остальных. Значит, закрытие дорог любого кольцевого маршрута действительно нарушает связность. Итак, наибольшее число дорог равно \\(220\\).",
