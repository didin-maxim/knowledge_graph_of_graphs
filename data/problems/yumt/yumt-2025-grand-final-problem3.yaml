        "text": "Белла и Чингиз играют на полном графе из 2024 вершин, делая ходы по очереди; начинает Чингиз.\nВ свой ход Чингиз красит k рёбер в чёрный цвет, Белла — одно ребро в белый.\nИгра кончается, когда один из игроков не может сделать очередной ход.\nЕсли максимальная чёрная клика окажется строго больше максимальной белой, то выиграет Чингиз, иначе — Белла.\nПри каких k ≥ 3 Чингиз имеет выигрышную стратегию?",
