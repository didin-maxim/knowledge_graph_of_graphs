      "id": "idea-critical-edge-four-kempe-cycles",
      "title": "Критическое ребро лежит в четырёх Kempe-циклах",
      "text": "Если минимальный контрпример не 3-раскрашиваем, то удаление любого его ребра допускает 3-раскраску, в которой концы удалённого ребра имеют один цвет. Для двух двухцветных и двух трёхцветных циклических порядков цветов Kempe-перекраска вынуждает путь между этими концами; вместе с удалённым ребром получаются четыре различных цикла.",
