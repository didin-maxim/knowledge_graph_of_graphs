  "solutions": [
    {
      "id": "sol-ai-critical-edge-kempe-cycles",
      "title": "ИИ-решение: критическое ребро и четыре Kempe-цикла",
      "text": "Докажем сначала лемму. Пусть e=xy - такое ребро графа G, что G-e можно правильно раскрасить в 3 цвета, а G нельзя. Возьмём правильную 3-раскраску графа G-e. Концы x и y в ней имеют один цвет, иначе ребро e можно было бы вернуть. Назовём этот цвет 1.\n\nРассмотрим один из четырёх циклических порядков цветов:\n(1,2), (1,3), (1,2,3), (1,3,2). Для выбранного порядка построим ориентированный вспомогательный граф на тех же вершинах: каждое ребро между двумя последовательными цветами порядка ориентируем от цвета к следующему цвету, остальные рёбра игнорируем. Утверждаем, что в этом ориентированном графе есть путь из x в y.\n\nДействительно, пусть такого пути нет, и пусть S - множество вершин, достижимых из x. Циклически заменим цвет каждой вершины из S на следующий цвет выбранного порядка, остальные цвета не меняем. Правильность раскраски не нарушится: внутри S оба конца любого используемого ребра сдвигаются одновременно, а ребро из S наружу не может соединять цвет c с его следующим цветом, иначе оно было бы ориентировано из S наружу и внешняя вершина тоже была бы достижима. После такой перекраски вершина x уже не имеет цвета 1, а y всё ещё имеет цвет 1, значит можно добавить ребро xy и получить правильную 3-раскраску G. Противоречие.\n\nИтак, для каждого из четырёх порядков есть путь из x в y; добавляя ребро xy, получаем цикл, проходящий через e. Эти четыре цикла различны. Два порядка длины 2 используют соответственно только цвета {1,2} и {1,3}. Порядки длины 3 обязательно дают пути, на которых встречаются все три цвета, поэтому они не совпадают с двухцветными циклами; между собой они тоже не совпадают, потому что после x в одном порядке должен идти цвет 2, а в другом - цвет 3. Значит каждое такое критическое ребро лежит как минимум в четырёх циклах.\n\nТеперь предположим противное: существует граф из условия, который нельзя правильно раскрасить в 3 цвета. Выберем в нём по включению минимальный не 3-раскрашиваемый подграф H. Тогда для любого ребра e граф H-e уже 3-раскрашиваем, то есть e критично для 3-раскраски. По лемме e лежит в H как минимум в четырёх циклах. Но всякий цикл графа H является циклом исходного графа, а по условию исходного графа через e проходит не более трёх циклов. Противоречие. Следовательно, исходный граф 3-раскрашиваем.",
