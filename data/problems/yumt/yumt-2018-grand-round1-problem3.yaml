  "solutions": [
    {
      "id": "sol-ai-unicyclic-bound",
      "title": "ИИ-решение: граф должен быть не более чем унициклическим",
      "text": "Ответ: \\(100\\).\n\nПример. Возьмём цикл \\(C_{100}\\). Если удалить из него два ребра без общих концов, цикл распадётся на две непустые цепи, значит граф станет несвязным. Поэтому \\(100\\) рёбер достижимы.\n\nДокажем, что больше быть не может. Назовём мостом ребро, удаление которого уже само делает граф несвязным. Такие рёбра нам не мешают: если среди двух удаляемых рёбер есть мост, граф точно распадается. Поэтому вся трудность находится в частях графа, где мостов нет.\n\nУдалим из графа все мосты. Если среди оставшихся компонент есть две разные компоненты, содержащие циклы, выберем по одному ребру на цикле в каждой из них. Эти два ребра не имеют общих концов. Удаление одного ребра из компоненты без мостов не нарушает её связности, а все мосты исходного графа при этом остаются на месте. Значит, после удаления выбранных двух рёбер весь граф останется связным, что противоречит условию.\n\nОсталось доказать, что единственная компонента без мостов, содержащая цикл, обязана быть простым циклом. Пусть такая компонента \\(H\\) не является циклом. Возьмём в ней цикл \\(C\\). Так как \\(H\\) не равна этому циклу и в \\(H\\) нет мостов, найдётся путь \\(P\\), соединяющий две вершины \\(x,y\\) цикла \\(C\\), но не совпадающий ни с одной из двух дуг цикла между \\(x\\) и \\(y\\): это может быть хорда, а если есть вершины вне \\(C\\), то часть вне \\(C\\) должна иметь хотя бы два выхода к \\(C\\), иначе один из выходов был бы мостом. Тогда две дуги цикла \\(C\\) между \\(x\\) и \\(y\\) вместе с путём \\(P\\) образуют theta-подграф.\n\nВ двух из трёх цепей этого theta-подграфа можно выбрать по одному ребру без общих концов так, чтобы третья цепь по-прежнему соединяла \\(x\\) и \\(y\\). После удаления этих двух рёбер сам theta-подграф остаётся связным. Любая остальная компонента, присоединённая к нему внутри \\(H\\), имеет хотя бы два выхода к theta-подграфу, иначе один из выходов был бы мостом; значит она тоже не оторвётся. Снова получаем две непересекающиеся удалённые рёбра, после которых граф остаётся связным, противоречие.\n\nИтак, после удаления всех мостов в графе остаётся либо ничего циклического, либо ровно один простой цикл. Поэтому исходный связный граф является либо деревом, либо деревом с добавленным одним лишним ребром, то есть имеет не больше \\(100-1+1=100\\) рёбер. Пример цикла \\(C_{100}\\) показывает, что эта оценка точна.",
