      "id": "idea-at-most-one-cycle-block",
      "title": "Два независимых цикла дают безопасное удаление двух рёбер",
      "text": "Если в связном графе есть две разные циклические части или одна циклическая часть сложнее простого цикла, можно выбрать два непересекающихся ребра так, что после их удаления граф останется связным. Поэтому допустимый граф имеет не более одного цикла.",
