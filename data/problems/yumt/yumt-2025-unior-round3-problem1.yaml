  "solutions": [
    {
      "id": "sol-cycle-blocker-and-forest-counting",
      "title": "Множество из трех вершин и подсчет ребер к лесу",
      "text": "Будем пользоваться следующей стандартной леммой Ловаса, то есть частным случаем теоремы Эрдеша-Поши для двух циклов: если в конечном графе нет двух вершинно непересекающихся циклов, то существует множество \\(S\\) не более чем из трех вершин, пересекающее каждый цикл графа. Иными словами, после удаления \\(S\\) граф становится лесом. В нашей задаче условие «все циклы попарно имеют общую вершину» как раз означает, что двух вершинно непересекающихся циклов нет.\n\nЕсли в графе вообще нет циклов, то он является лесом и имеет не более \\(n-1\\) ребер. Далее считаем, что цикл есть. По лемме выберем множество \\(S\\), \\(|S|=s\\le 3\\), пересекающее все циклы. Положим \\(F=G-S\\). Тогда \\(F\\) - лес. Обозначим через \\(N=n-s\\) число его вершин, через \\(c\\) - число компонент леса \\(F\\), через \\(a\\) - число ребер между \\(S\\) и \\(F\\), а через \\(b\\) - число ребер внутри \\(S\\). Тогда\n\\[\n|E(G)|=|E(F)|+a+b\\le (N-c)+a+b.\n\\]\nОсталось оценить \\(a\\).\n\nДля вершины \\(v\\in V(F)\\) пусть \\(d_S(v)\\) - число ее соседей в \\(S\\). Если \\(d_S(v)=0\\) или \\(1\\), то вклад этой вершины в \\(a\\) не превосходит 1. Если \\(d_S(v)>=2\\), выберем \\(d_S(v)-1\\) различных пар вершин из множества соседей \\(v\\) в \\(S\\), например пары, соединяющие один фиксированный сосед с остальными. Эти пары можно выбрать для всех таких \\(v\\) без повторений: действительно, если две разные вершины \\(u,v\\in F\\) были бы смежны с одной и той же парой \\(x,y\\in S\\), то \\(x-u-y-v-x\\) был бы циклом длины 4, что запрещено условием. Поэтому\n\\[\na=\\sum_{v\\in F} d_S(v)\\le N+\\binom{s}{2}.\n\\]\nЗдесь первое слагаемое дает по одному ребру на каждую вершину леса, а все «лишние» ребра инъективно сопоставлены парам вершин из \\(S\\).\n\nТак как все циклы имеют длину не меньше 5, внутри \\(S\\) нет треугольника. При \\(s\\le 3\\) отсюда следует \\(b\\le 2\\); точнее, при \\(s=0,1,2,3\\) имеем соответственно \\(b\\le0,0,1,2\\). Рассмотрим случаи.\n\nЕсли \\(s=1\\), то \\(a\\le N\\), и, поскольку в графе есть цикл, лес \\(F\\) непуст или, во всяком случае, формула ниже только усиливается при \\(c\\ge1\\). Получаем\n\\[\n|E(G)|\\le (N-c)+N\\le 2N-1=2(n-1)-1\\le 2n-1.\n\\]\n\nЕсли \\(s=2\\), то \\(a\\le N+1\\) и \\(b\\le1\\). Поэтому\n\\[\n|E(G)|\\le (N-c)+(N+1)+1=2N+2-c\\le 2N+2=2n-2<2n-1.\n\\]\n\nЕсли \\(s=3\\), то \\(a\\le N+3\\) и \\(b\\le2\\). Тогда\n\\[\n|E(G)|\\le (N-c)+(N+3)+2=2N+5-c\\le 2N+5=2n-1.\n\\]\nВо всех случаях число ребер не превосходит \\(2n-1\\), что и требовалось доказать.",
