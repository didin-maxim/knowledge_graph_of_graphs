      "id": "idea-minimal-counterexample-low-degree",
      "title": "Минимальный контрпример должен сводиться к вершине степени не больше 2",
      "text": "Если в графе есть вершина степени 0 или 1, её можно удалить и применить индукцию; если есть вершина степени 2, после удаления оценка тоже сохраняется с точностью ровно до \\(2n-1\\). Поэтому естественный путь к решению: доказать, что в графе без треугольников и 4-циклов, где любые два цикла пересекаются по вершинам, обязательно есть вершина степени не больше 2. Эквивалентная трудная лемма: граф минимальной степени хотя бы 3 и обхвата хотя бы 5 содержит два непересекающихся по вершинам цикла.",
