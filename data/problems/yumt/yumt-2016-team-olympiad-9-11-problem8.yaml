      "id": "sol-archive-card",
      "title": "Удаления и развороты относительно топологического порядка",
      "text": "Ответ: 1000 разворачиваний.\n\nУсловие \"вылетев из любого города, нельзя вернуться в него\" означает, что в ориентированном графе авиарейсов не должно остаться ориентированных циклов.\n\nСначала докажем, что 1000 разворачиваний всегда хватит. По условию первый вредитель мог удалить некоторый набор F из 1000 рейсов так, что оставшийся граф стал ациклическим. В ациклическом ориентированном графе вершины можно расположить в таком порядке, что каждое оставшееся ребро идёт слева направо: берём город без входящих рейсов, ставим его первым и повторяем для оставшегося графа. Рассмотрим такой порядок для графа после удаления F. Все рейсы вне F уже направлены слева направо. Среди рейсов из F развернём ровно те, которые направлены справа налево. После этого все рейсы всего графа направлены слева направо, значит ориентированных циклов нет. Развернули не больше 1000 рейсов.\n\nТеперь докажем, что меньшего числа не гарантированно достаточно. Если после разворота r рейсов граф стал ациклическим, то удаление этих же r исходных рейсов из первоначального графа тоже даёт ациклический граф: это подграф полученного после разворотов ациклического графа. Но по условию удалить меньше 1000 рейсов недостаточно. Следовательно, r не может быть меньше 1000.\n\nИтак, второму вредителю гарантированно хватит 1000 разворачиваний, и в общем случае меньше гарантировать нельзя.",
