        "title": "Оригинальная формулировка",
        "text": "В стране между некоторыми парами городов установлено одностороннее беспересадочное авиасообщение.\nДва вредителя хотят добиться того, чтобы, вылетев из любого города, нельзя было вернуться в него.\nПервый вредитель умел закрывать рейсы. Он выяснил, что можно закрыть 1000 рейсов, добившись требуемого, но меньшего числа рейсов недостаточно; однако до начала действий его обнаружили и обезвредили.\nВторой вредитель умеет разворачивать направления рейсов.\nКакого минимального количества разворачиваний ему гарантированно хватит?",
