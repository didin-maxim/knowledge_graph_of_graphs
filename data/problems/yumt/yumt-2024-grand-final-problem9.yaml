  "solutions": [
    {
      "id": "sol-ai-diagonal-pair-orientation",
      "title": "ИИ-решение: ориентация графа диагональных пар",
      "text": "Будем считать, что заданное разбиение рёбер на 4-циклы зафиксировано. Так как степень каждой вершины исходного графа равна 4, а каждый проходящий через неё цикл использует ровно два инцидентных ей ребра, каждая вершина исходного графа принадлежит ровно двум циклам разбиения.\n\nПостроим вспомогательный граф H. Для каждого 4-цикла C возьмём две вершины графа H: это две пары противоположных вершин цикла C. Теперь пусть x - вершина исходного графа. Она лежит ровно в двух циклах разбиения, скажем C и D. В цикле C вершина x входит ровно в одну из двух противоположных пар, и в цикле D тоже ровно в одну такую пару. Соединим в H эти две вершины-пары ребром, соответствующим x.\n\nКаждая вершина графа H имеет степень 2: она является парой противоположных вершин некоторого 4-цикла, а в этой паре ровно две исходные вершины, каждая даёт по одному ребру H. Значит H является объединением циклов, если допускать возможные кратные рёбра. Ориентируем каждый такой цикл по кругу. Тогда в каждой вершине H ровно одно ребро входит и ровно одно выходит.\n\nПереведём эту ориентацию обратно в исходный граф. Если ребро H, соответствующее исходной вершине x, направлено к паре, принадлежащей циклу C, то припишем вершину x циклу C. Каждая исходная вершина приписана ровно одному из двух циклов, через которые она проходит.\n\nРассмотрим теперь любой 4-цикл C. Ему соответствуют две вершины графа H - две пары противоположных вершин C. В каждую из них входит ровно одно ребро, поэтому циклу C приписана ровно одна вершина из первой противоположной пары и ровно одна вершина из второй противоположной пары. В 4-цикле любые две вершины, выбранные из разных противоположных пар, соседние. Выберем в C ребро между этими двумя приписанными C вершинами.\n\nТак мы выбрали по одному ребру из каждого 4-цикла. Кроме того, каждая вершина исходного графа была приписана ровно одному циклу и используется только выбранным ребром этого цикла. Поэтому никакие два выбранных ребра не имеют общей вершины, то есть они образуют паросочетание.",
