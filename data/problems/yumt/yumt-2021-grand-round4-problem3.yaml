        "text": "Пусть есть граф на 2n вершинах, в котором каждое ребро покрашено в синий или красный цвет.\nСиние рёбра образуют полное паросочетание, а красные рёбра образуют дерево, содержащее все вершины графа.\nДокажите, что найдётся цветочередующийся цикл чётной длины.",
