  "solutions": [
    {
      "id": "sol-ai-kotzig-unique-perfect-matching",
      "title": "ИИ-решение через лемму Котцига",
      "text": "Обозначим через M синее совершенное паросочетание, а через G весь данный граф. Граф G связен, потому что красные рёбра сами образуют остовное дерево.\n\nПредположим, что цветочередующегося цикла нет. Тогда M единственное совершенное паросочетание в G. Действительно, если бы нашлось другое совершенное паросочетание N, то симметрическая разность M\\triangle N распалась бы на чётные циклы, где рёбра идут попеременно из M и из N. Все рёбра из M синие, а все рёбра из N\\setminus M красные, поэтому любой такой цикл был бы цветочередующимся.\n\nТеперь применим лемму Котцига: если связный граф имеет единственное совершенное паросочетание, то некоторое ребро этого паросочетания является мостом. Значит, некоторое синее ребро должно быть мостом графа G. Но это невозможно: если удалить любое синее ребро, красное дерево всё равно останется в графе и соединит все вершины. Противоречие. Следовательно, цветочередующийся цикл существует; он автоматически имеет чётную длину, поскольку цвета на нём чередуются.",
