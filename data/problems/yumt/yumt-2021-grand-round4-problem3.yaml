      "id": "idea-unique-perfect-matching-kotzig",
      "title": "Исключить единственность синего паросочетания",
      "text": "Если цветочередующегося цикла нет, то синее совершенное паросочетание единственно: иначе симметрическая разность двух паросочетаний дала бы чередующийся цикл. По лемме Котцига в связном графе с единственным совершенным паросочетанием некоторое ребро этого паросочетания является мостом, но синее ребро не может быть мостом из-за красного остовного дерева.",
