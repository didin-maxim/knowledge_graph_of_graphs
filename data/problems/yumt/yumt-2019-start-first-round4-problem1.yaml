      "id": "sol-archive-card",
      "title": "Решение",
      "text": "Ответ: 10.\nПусть компонент связности, содержащий цикл длины 8, имеет n вершин и m рёбер. Тогда n не меньше 8.\nЕсли бы m было не больше 9, то циклический ранг этой компоненты был бы равен m - n + 1 и не превосходил бы 2. Покажем, что в связном графе циклического ранга не больше 2 бывает не более трёх простых циклов.\nДействительно, выберем остовное дерево. Каждое ребро вне остова добавляет к дереву один фундаментальный цикл. Если вне остова не более двух рёбер, то есть не более двух фундаментальных циклов C1 и C2. Любой цикл графа обязан содержать хотя бы одно неостовное ребро, а значит может быть только C1, C2 или симметрической разностью C1 и C2. Следовательно, простых циклов не более трёх.\nНо в нашей задаче существуют циклы длин 3, 4, 5, 6, 7 и 8, то есть как минимум шесть различных циклов. Значит, m не может быть меньше 10. Итак, дорог не меньше 10.\nТеперь покажем, что 10 дорог достаточно. Возьмём цикл A-B-C-D-E-F-G-H-A длины 8 и добавим хорды A-C и A-F. Тогда получаются циклы:\nA-B-C длины 3,\nA-B-C-D-E-F-A длины 6,\nA-B-C-D-E-F-G-H-A длины 8,\nA-C-D-E-F-A длины 5,\nA-C-D-E-F-G-H-A длины 7,\nA-F-G-H-A длины 4.\nТаким образом, существуют циклы всех длин от 3 до 8, и всего дорог 10. Следовательно, минимальное число дорог равно 10.",
