        "text": "В стране некоторые пары городов соединены дорогами.\nОказалось, что в стране есть круговые маршруты без повторяющихся городов из 3, 4, 5, 6, 7 и 8 дорог.\nКакое наименьшее количество дорог может быть в стране?",
