      "id": "sol-ai-unbounded-by-isolated-vertices",
      "title": "ИИ-решение: конечного максимума нет",
      "text": "В данной формулировке конечного максимального числа вершин нет.\n\nДействительно, для любого натурального \\(N\\ge 2\\) построим граф на \\(N\\) вершинах так: проведём ровно одно ребро, а все остальные \\(N-2\\) вершины оставим изолированными. Степени всех вершин не превосходят \\(1\\), значит тем более не превосходят \\(3\\).\n\nПроверим требуемое свойство. Чтобы условие могло нарушиться, должны найтись четыре различные вершины \\(A,B,C,D\\), для которых одновременно существуют два ребра \\(AB\\) и \\(CD\\). Но в нашем графе всего одно ребро, поэтому такой четвёрки вообще нет. Следовательно, импликация из условия выполняется вакуозно.\n\nТакой пример существует при сколь угодно большом \\(N\\). Значит, по буквальной формулировке задачи количество вершин не ограничено сверху, и максимального конечного ответа не существует.",
      "idea_ids": [
        "idea-add-isolated-vertices"
      ],
      "standard_idea_ids": [],
      "status": "needs_human_review",
      "definition_ids": [
