      "id": "sol-reconstructed-no-isolated-answer-7",
      "title": "Ответ для реконструированной формулировки: \\(7\\)",
      "text": "Рассмотрим реконструированную задачу, где у графа нет изолированных вершин. Ответ равен \\(7\\).\n\nСначала заметим, что исходное условие запрещает индуцированное паросочетание из двух рёбер: если два ребра \\(AB\\) и \\(CD\\) не имеют общих концов, то среди четырёх вершин \\(A,B,C,D\\) должно быть третье ребро. Кроме того, граф без изолированных вершин автоматически связен. Действительно, две разные компоненты с рёбрами дали бы два непересекающихся ребра без какого-либо ребра между их концами.\n\nНам понадобится небольшая структурная лемма. Пусть \\(H\\) — связный граф без индуцированного \\(2K_2\\). Тогда либо в \\(H\\) есть доминирующее ребро, то есть каждая вершина лежит на этом ребре или смежна с одним из его концов, либо в \\(H\\) есть доминирующий индуцированный пятицикл. Доказательство короткое: берём максимальный индуцированный путь. Индуцированного пути на пяти вершинах быть не может, потому что его первое и последнее рёбра образовали бы индуцированный \\(2K_2\\). Если максимальный путь имеет не больше трёх вершин, его центральная вершина или центральное ребро доминирует граф: иначе кратчайший подход к недоминируемой вершине удлинил бы индуцированный путь. Остаётся максимальный индуцированный путь \\(v_1v_2v_3v_4\\). Если ребро \\(v_2v_3\\) не доминирует, то вершина, не смежная с \\(v_2\\) и \\(v_3\\), из-за максимальности пути и запрета индуцированного \\(2K_2\\) вынуждена быть смежной с \\(v_1\\) и \\(v_4\\); получается индуцированный \\(C_5\\). Тот же аргумент с кратчайшим подходом к этому циклу показывает, что цикл доминирует: иначе первое ребро подхода и подходящее ребро пятицикла дали бы индуцированный \\(2K_2\\).\n\nТеперь применим лемму к нашему графу \\(G\\). Если есть доминирующее ребро \\(uv\\), то все вершины лежат в \\(N[u]\\cup N[v]\\). Так как \\(uv\\) — ребро и степени обоих концов не превосходят \\(3\\), имеем\n\\[\n|V(G)|\\le |N[u]\\cup N[v]|\\le \\deg u+\\deg v\\le 6.\n\\]\nВ этом случае больше шести вершин быть не может.\n\nОстаётся случай доминирующего индуцированного пятицикла \\(C\\). Каждая вершина цикла уже имеет две соседние вершины на цикле, поэтому из-за ограничения степени \\(3\\) она может быть смежна не более чем с одной вершиной вне \\(C\\). Следовательно, суммарно из цикла наружу выходит не более пяти рёбер.\n\nПокажем, что вне \\(C\\) не может быть трёх вершин. Для внешней вершины \\(x\\) обозначим через \\(A_x\\) множество её соседей на цикле. Множества \\(A_x\\) непусты, потому что \\(C\\) доминирует, и попарно не пересекаются: одна вершина цикла не может иметь двух внешних соседей, иначе её степень стала бы хотя бы \\(4\\). Если две внешние вершины \\(x,y\\) не соединены ребром, то каждая вершина из \\(A_x\\) должна быть соседней на цикле с каждой вершиной из \\(A_y\\), иначе два ребра от \\(x\\) и \\(y\\) к циклу дали бы запрещённую четвёрку. Если же \\(xy\\) — ребро, то \\(A_x\\cup A_y\\) должно покрывать все рёбра пятицикла: иначе ребро \\(xy\\) и непокрытое ребро цикла снова дали бы запрещённую четвёрку.\n\nПредположим, что внешних вершин хотя бы три. Так как наружу из цикла выходит не более пяти рёбер, найдётся внешняя вершина \\(x\\), у которой ровно один сосед \\(a\\) на цикле. Вершина \\(x\\) не может иметь двух внешних соседей: каждый из них вместе с \\(a\\) должен покрывать все рёбра пятицикла, а для этого обязан быть смежен с обеими вершинами цикла, не соседними с \\(a\\); два таких множества соседей не могут быть непересекающимися. Значит, среди остальных внешних вершин найдутся две, не смежные с \\(x\\). Их соседи на цикле должны лежать среди двух соседей вершины \\(a\\); эти две вершины пятицикла между собой не смежны. Поэтому сами две внешние вершины должны быть соединены ребром. Но тогда объединение их соседей на цикле состоит всего из этих двух соседей \\(a\\), а оно не покрывает все рёбра пятицикла. Противоречие. Значит, вне доминирующего пятицикла не более двух вершин, и \\(|V(G)|\\le 5+2=7\\).\n\nОсталось привести пример на \\(7\\) вершинах. Возьмём пятицикл \\(a-b-c-d-e-a\\) и добавим две вершины \\(x\\) и \\(y\\). Соединим \\(x\\) с \\(b,d,y\\), а \\(y\\) с \\(a,c,x\\). Степени вершин равны \\(3,3,3,3,2,3,3\\), значит все они не превосходят \\(3\\), изолированных вершин нет. Проверка условия прямая: два непересекающихся ребра пятицикла уже имеют между концами соседнее ребро пятицикла; если одно из рёбер инцидентно \\(x\\) или \\(y\\), то добавленные связи \\(x b, x d, xy, ya, yc\\) дают третье ребро между концами любой такой пары. Следовательно, пример удовлетворяет условию и имеет \\(7\\) вершин.\n\nИтак, в реконструированной формулировке максимальное число вершин равно \\(7\\).",
