        "id": "stmt-original",
        "title": "Оригинальная формулировка",
        "text": "Граф G обладает следующим свойством: для любой четвёрки различных вершин A, B, C и D, если существуют рёбра AB и CD, то между этими вершинами есть ещё хотя бы одно ребро.\nКакое максимальное количество вершин может быть в этом графе, если степень каждой вершины не превышает 3?",
        "source_id": "src-yumt-2020-start-round1-problem4-official",
