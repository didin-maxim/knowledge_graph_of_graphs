        "text": "В стране 100 городов; некоторые пары городов соединены двусторонними авиарейсами.\nВсего есть 2014 авиарейсов; при этом существуют такие два города, что от одного к другому нельзя добраться ни одним, ни двумя рейсами.\nРейсы распределены между n авиакомпаниями, у каждой есть хотя бы один рейс.\nДля любых двух городов существует авиакомпания, рейсами которой можно добраться от первого города до второго, возможно с пересадками.\nПри каком наибольшем n это возможно?",
