      "title": "Плохая пара заряжает лишние рёбра компаний",
      "text": "Возьмём два города, между которыми нет пути длины 1 или 2. Для каждого другого города хотя бы один из двух рейсов к этой паре отсутствует, но эта отсутствующая пара должна соединяться внутри некоторой авиакомпании. Если у компании \\(m\\) рейсов, то она может отвечать не более чем за \\(m-1\\) таких городов; суммирование даёт верхнюю оценку на число компаний.",
