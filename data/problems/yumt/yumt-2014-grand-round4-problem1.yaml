      "id": "sol-ai-bad-pair-and-spanning-path",
      "title": "ИИ-решение: плохая пара и остовный путь",
      "text": "Ответ: \\(1916\\).\n\nСначала докажем, что больше быть не может. Рассмотрим граф, вершины которого — города, а рёбра — авиарейсы. Выберем два города \\(a\\) и \\(b\\), между которыми нельзя добраться ни одним, ни двумя рейсами. Значит, ребра \\(ab\\) нет, и ни один город не соединён рейсами одновременно с \\(a\\) и с \\(b\\).\n\nДля каждого из остальных 98 городов \\(v\\) выберем одну отсутствующую пару из \\(av\\), \\(bv\\): это возможно, потому что иначе \\(v\\) был бы общим соседом \\(a\\) и \\(b\\). По условию для выбранной отсутствующей пары существует авиакомпания, внутри рейсов которой её концы лежат в одной компоненте связности. Назначим город \\(v\\) одной такой авиакомпании.\n\nПокажем, что авиакомпания с \\(m\\) рейсами может получить не более \\(m-1\\) назначенных городов. Достаточно смотреть только на те компоненты её графа, которые содержат \\(a\\) или \\(b\\). Если компонента содержит, скажем, \\(a\\), но не содержит \\(b\\), и ей назначены \\(t\\) городов \\(v\\), то ни одно из рёбер \\(av\\) для этих городов не проведено. Чтобы связная компонента всё же соединяла \\(a\\) с каждым из этих \\(t\\) городов, в ней должно быть хотя бы \\(t+1\\) рёбер: от \\(a\\) должно выйти хотя бы одно ребро, а каждый из \\(t\\) городов не может быть достигнут этим ребром напрямую как ребром \\(av\\). Поэтому вклад \\(m-1\\) такой компоненты не меньше \\(t\\). То же верно для компоненты с \\(b\\).\n\nЕсли одна компонента содержит и \\(a\\), и \\(b\\), то из-за выбора плохой пары в ней нет ребра \\(ab\\) и нет вершины, смежной сразу с \\(a\\) и \\(b\\). Для \\(t\\) назначенных городов такая компонента содержит как минимум \\(t+2\\) вершин и связна, значит имеет хотя бы \\(t+1\\) рёбер; снова её вклад \\(m-1\\) не меньше \\(t\\). Складывая по компонентам данной авиакомпании, получаем требуемое утверждение.\n\nВсего назначено 98 городов. Поэтому\n\\[\n\\sum_{i=1}^n (m_i-1) \\ge 98,\n\\]\nгде \\(m_i\\) — число рейсов \\(i\\)-й авиакомпании. Но \\(\\sum m_i=2014\\), значит \\(2014-n\\ge 98\\), откуда \\(n\\le 1916\\).\n\nОсталось привести пример для \\(n=1916\\). Возьмём 100 городов \\(v_0,v_1,\\ldots,v_{99}\\). Одна авиакомпания выполняет рейсы вдоль пути\n\\(v_0v_1, v_1v_2, \\ldots, v_{98}v_{99}\\); у неё 99 рейсов, и её рейсами можно добраться между любыми двумя городами. Добавим ещё 1915 рейсов только между городами \\(v_1,\\ldots,v_{98}\\), все эти рейсы отдадим разным отдельным авиакомпаниям. Таких пар внутри 98 городов достаточно, потому что \\(\\binom{98}{2}=4753\\).\n\nВсего рейсов стало \\(99+1915=2014\\), а компаний \\(1+1915=1916\\). Города \\(v_0\\) и \\(v_{99}\\) не соединены одним рейсом и не имеют общего соседа: у \\(v_0\\) единственный сосед \\(v_1\\), а у \\(v_{99}\\) единственный сосед \\(v_{98}\\). Значит, условие про невозможность добраться одним или двумя рейсами тоже выполнено. Следовательно, наибольшее возможное \\(n\\) равно \\(1916\\).",
