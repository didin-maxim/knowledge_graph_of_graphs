  "solutions": [
    {
      "id": "sol-ai-critical-nonseparating-odd-cycle",
      "title": "ИИ-решение: через 4-критический подграф и неразделяющий нечётный цикл",
      "text": "Докажем от противного. Предположим, что граф G нельзя правильно раскрасить в три цвета, то есть χ(G) >= 4. Тогда в G есть 4-критический подграф H: χ(H)=4, но всякий собственный подграф H уже 3-раскрашиваем.\n\nИспользуем внешнюю теорему Крусенстьерна-Хафстрёма и Тофта: всякий 4-критический граф содержит индуцированный нечётный цикл C такой, что H-V(C) связен. Кроме того, у 4-критического графа минимальная степень не меньше 3, иначе вершину степени не более 2 можно было бы удалить, 3-раскрасить оставшийся граф и затем докрасить эту вершину.\n\nВозьмём такой цикл C в H. Так как C индуцирован, каждая его вершина имеет на самом цикле ровно двух соседей. Но степень каждой вершины в H не меньше 3, значит каждая вершина цикла C имеет хотя бы одного соседа в H-V(C). Подграф H-V(C) связен, поэтому после удаления только рёбер цикла C все вершины C всё равно остаются присоединёнными к связному остатку H-V(C). Следовательно, H-E(C) связен.\n\nПокажем, что тогда и G-E(C) связен. Действительно, C лежит внутри H, а все рёбра, соединяющие вершины вне H с H, не являются рёбрами цикла C и потому не удаляются; поскольку исходный G связен, каждая компонента графа G-V(H), если она есть, имеет путь к H и присоединяется к связному H-E(C). Значит G-E(C) связен.\n\nНо C - нечётный цикл графа G, а по условию удаление рёбер любого нечётного цикла должно делать граф несвязным. Получили противоречие. Поэтому χ(G) <= 3, то есть вершины G можно правильно окрасить в три цвета.",
