      "id": "sol-archive-card",
      "title": "Все дороги должны касаться областного города",
      "text": "Ответ: 2012 дорог.\n\nНазовём обычными 248 городов, не являющихся областными. Между двумя обычными городами дороги быть не может: сама эта дорога была бы путём между двумя обычными городами, не проходящим через областной город. Более того, запрет на дороги между обычными городами уже полностью обеспечивает условие задачи, потому что любой путь от одного обычного города к другому, если он существует, должен выйти из первого обычного города по дороге в областной город.\n\nЗначит, все дороги могут идти только либо между двумя областными городами, либо между областным и обычным городом. Таких пар городов не больше\n\\[\n\\binom 8 2 + 8\\cdot 248 = 28+1984=2012.\n\\]\nЭто верхняя оценка.\n\nОна достигается: соединим дорогой каждую пару городов, среди которых есть хотя бы один областной, и не будем соединять обычные города между собой. Тогда дорог ровно 2012, а любой путь между двумя обычными городами действительно проходит через областной город уже на первом шаге. Следовательно, максимальное число дорог равно 2012.",
