        "title": "Оригинальная формулировка",
        "text": "В стране 256 городов, из которых 8 — областные. Некоторые пары городов соединены между собой дорогами, но не более чем одной.\nЛюбой путь по дорогам между двумя обычными городами, если он есть, проходит хотя бы через один областной город.\nКакое наибольшее количество дорог могло быть в этой стране?",
