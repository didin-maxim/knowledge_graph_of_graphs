      "id": "idea-bridge-free-components-are-cycles",
      "title": "Разложить граф по мостам",
      "text": "Если удалить все мосты, то каждая нетривиальная компонента обязана быть циклом: в компоненте без мостов вершина степени хотя бы 3 дала бы три инцидентных ребра, и два разных ребра после удаления третьего одновременно стали бы мостами из одной вершины, что невозможно. Поэтому лишние сверх дерева рёбра считаются по циклическим компонентам, а каждая такая компонента содержит хотя бы 3 вершины.",
