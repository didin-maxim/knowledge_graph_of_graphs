  "solutions": [
    {
      "id": "sol-ai-bridge-free-cycle-components",
      "title": "ИИ-решение: компоненты без мостов являются циклами",
      "text": "Ответ: \\(n-1+\\lfloor n/3\\rfloor\\).\n\nНапомним, что мостом будем называть ребро, удаление которого само по себе нарушает связность графа. Удалим из графа все мосты. Получатся несколько компонент; назовём компоненту нетривиальной, если в ней есть хотя бы одно ребро. Внутри такой компоненты мостов уже нет: если некоторое её ребро было бы мостом в компоненте, то в исходном графе оно тоже отделяло бы одну часть этой компоненты вместе со всеми висящими на ней мостовыми ветвями от остального графа.\n\nПокажем, что каждая нетривиальная компонента после удаления мостов является циклом. Условие задачи наследуется такой компонентой: если два её смежных ребра можно удалить, не нарушив связность внутри компоненты, то после возвращения всех остальных компонент и мостов весь исходный граф тоже остался бы связным, что противоречит условию.\n\nИтак, пусть \\(H\\) — связная компонента без мостов, удовлетворяющая условию, и в \\(H\\) есть рёбра. Так как мостов нет, степень каждой вершины \\(H\\) не меньше 2. Докажем, что степень не может быть больше 2. Предположим противное: у вершины \\(v\\) есть три разных инцидентных ребра \\(e, f, g\\). Ребро \\(e\\) не является мостом, значит граф \\(H-e\\) связен. По условию удаление смежных рёбер \\(e\\) и \\(f\\) нарушает связность, поэтому в связном графе \\(H-e\\) ребро \\(f\\) является мостом. Аналогично \\(g\\) является мостом в \\(H-e\\).\n\nРассмотрим граф \\(H-e\\). Мосты \\(f\\) и \\(g\\) выходят из одной вершины \\(v\\). Если удалить \\(f\\), то отделится компонента, лежащая по другую сторону от \\(v\\); чтобы добавление ребра \\(e\\) уничтожало мостовость \\(f\\) в исходном \\(H\\), второй конец ребра \\(e\\) должен лежать именно в этой отделившейся части. Точно так же, чтобы добавление того же ребра \\(e\\) уничтожало мостовость \\(g\\), второй конец \\(e\\) должен лежать в отделившейся части за \\(g\\). Но эти две части для разных мостов, выходящих из \\(v\\), не пересекаются. Противоречие.\n\nЗначит, все степени в \\(H\\) равны 2, а связный конечный граф, все вершины которого имеют степень 2, является циклом.\n\nТеперь посчитаем рёбра. Пусть после удаления мостов получилось \\(c\\) циклических компонент и, возможно, несколько изолированных вершин. Если каждую циклическую компоненту стянуть в одну вершину, а изолированные вершины оставить как есть, то мосты исходного графа образуют дерево на получившихся компонентах; иначе исходный граф был бы несвязным или какой-то мост лежал бы в цикле. Поэтому число мостов равно числу компонент после удаления мостов минус 1.\n\nКаждая циклическая компонента с \\(s\\) вершинами имеет ровно \\(s\\) рёбер, а каждая изолированная вершина внутренних рёбер не имеет. Следовательно, если циклических компонент \\(c\\), то общее число рёбер равно\n\\[\n(n-1)+c.\n\\]\nДействительно, \\(n-1\\) рёбер дают мостовое дерево между всеми вершинами и компонентами, а каждая циклическая компонента добавляет ровно одно лишнее ребро сверх дерева. Но каждая циклическая компонента содержит хотя бы 3 вершины, значит \\(3c\\le n\\), то есть \\(c\\le \\lfloor n/3\\rfloor\\). Отсюда число рёбер не больше \\(n-1+\\lfloor n/3\\rfloor\\).\n\nОсталось показать, что эта оценка достигается. Возьмём \\(q=\\lfloor n/3\\rfloor\\) непересекающихся треугольников и ещё \\(n-3q\\) отдельных вершин. В каждом объекте выберем одну вершину и соединим только выбранные вершины мостами так, чтобы на объектах получилось дерево. В каждом треугольнике 3 ребра, а мостов между объектами на один меньше, чем объектов, поэтому всего получается \\(n-1+q=n-1+\\lfloor n/3\\rfloor\\) рёбер.\n\nПроверим условие в построенном графе. Если среди двух удаляемых смежных рёбер есть мост, то связность уже нарушается после удаления этого моста. Если же оба ребра лежат в одном треугольнике, то после их удаления либо изолируется общая вершина этих двух рёбер, либо, если это выбранная вершина с внешними мостами, две остальные вершины треугольника отделяются от неё и от остального графа. Значит, построение подходит, и максимум равен \\(n-1+\\lfloor n/3\\rfloor\\).",
