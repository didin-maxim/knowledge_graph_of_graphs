      "text": "Во внешнем источнике доказано более сильное утверждение: любой простой граф на n вершинах с не менее чем 2n-3 рёбрами содержит два простых цикла одинаковой длины. Задача ЮМТ является его прямым частным случаем, потому что при n=100 имеем 200 > 2·100 - 3 = 197. Следовательно, нужные два цикла одинаковой длины существуют и в графе из условия ЮМТ.",
