      "id": "sol-archive-card",
      "title": "Остовный лес и фундаментальные циклы",
      "text": "Выберем в каждой компоненте связности графа остовное дерево; вместе они образуют остовный лес F. Если компонент c, то в F ровно 100-c рёбер, а значит вне F лежит 200-(100-c)=100+c рёбер, в частности не меньше 101.\n\nКаждое ребро e, не входящее в F, соединяет две вершины одной компоненты. В дереве этой компоненты между ними есть единственный путь; добавив к нему e, получаем простой цикл. Для разных неостовных рёбер получаются разные циклы, потому что каждый такой цикл содержит ровно своё одно неостовное ребро.\n\nДлина любого простого цикла в простом графе на 100 вершинах может быть только одной из 98 величин: 3,4,...,100. Но построенных фундаментальных циклов не меньше 101. По принципу Дирихле среди них найдутся два цикла одинаковой длины.",
