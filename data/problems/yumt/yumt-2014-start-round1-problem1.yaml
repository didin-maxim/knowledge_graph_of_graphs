      "id": "sol-archive-card",
      "title": "Решение",
      "text": "Ответ: 3/4.\nКаждый паук лежит хотя бы на двух гранях тетраэдра: если он находится внутри ребра, то принадлежит двум граням, а если в вершине, то трём. Поэтому на четырёх граничных треугольниках тетраэдра, если считать пауков с повторениями, отмечено не менее 14 точек.\nПо принципу Дирихле найдётся грань, на границе которой лежат хотя бы 4 паука. Периметр этой грани равен 3, следовательно, он разбит этими четырьмя пауками как минимум на четыре дуги. Снова по принципу Дирихле две соседние точки на этом контуре находятся на расстоянии не более 3/4.\nЗначит, минимальное расстояние между некоторыми двумя пауками не превосходит 3/4, так что Яга не может гарантировать больше 3/4 килограмма золота.\nОценка достигается так. Посадим одного паука в вершину A тетраэдра ABCD. Ещё трёх пауков посадим на рёбра AB, AC, AD на расстоянии 3/4 от вершины A. Оставшихся трёх пауков посадим в середины рёбер BC, CD, DB. Тогда расстояние между любыми двумя ближайшими пауками равно 3/4. Следовательно, максимальный выигрыш действительно равен 3/4.",
