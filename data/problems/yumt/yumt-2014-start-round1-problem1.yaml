        "text": "Из палок длиной 1 собран каркас тетраэдра. Баба Яга сажает на каркас 7 пауков.\nИз расстояний между парами пауков, измеряемых кратчайшим путём по рёбрам тетраэдра, Кащей выбирает наименьшее расстояние R и платит Яге R килограммов золота.\nКакое наибольшее количество золота может обеспечить себе Яга?",
