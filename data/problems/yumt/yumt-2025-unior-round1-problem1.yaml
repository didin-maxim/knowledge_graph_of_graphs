  "solutions": [
    {
      "id": "sol-archive-card",
      "title": "Решение",
      "text": "Докажем утверждение по индукции по числу вершин графа.\nБаза очевидна: для графа из одной вершины утверждение верно.\nПусть теперь граф G имеет больше одной вершины. По условию в самом графе G есть вершина v степени не больше 2k - 1. Удалим её. Для любого подграфа графа G-v условие тоже выполняется, потому что каждый такой подграф является подграфом исходного графа. Значит, по предположению индукции вершины графа G-v можно разбить на k подграфов без циклов.\nРассмотрим соседей вершины v. Если бы в каждом из этих k подграфов у вершины v было хотя бы по два соседа, то степень v была бы не меньше 2k, что противоречит оценке deg(v) ≤ 2k - 1. Следовательно, найдётся подграф, в котором у v не более одного соседа.\nДобавим вершину v именно в этот подграф. Цикл при этом не появится: если у добавляемой вершины внутри выбранного подграфа нет соседей, то она просто образует изолированную вершину; если сосед один, то она присоединяется листом. В обоих случаях подграф остаётся ацикличным.\nОстальные подграфы не меняются. Значит, после возвращения вершины v мы снова получили разбиение вершин на k подграфов без циклов.\nИндукция завершена.",
