      "title": "Индукция по вершине малой степени",
      "text": "Условие на каждую подзадачу даёт вершину степени не больше 2k-1. Удаляя такую вершину и возвращая её обратно, можно распределять инцидентные рёбра между k лесами без создания цикла.",
