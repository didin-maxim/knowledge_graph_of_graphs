  "solutions": [
    {
      "id": "sol-ai-monochromatic-2paths",
      "title": "ИИ-решение: двойной подсчет одноцветных путей длины 2",
      "text": "Обозначим через \\(F(n)=floor(n^2/3)\\). Сначала докажем полезное свойство минимального контрпримера. Для n=5 утверждение F(5)=8 верно: в графе на пяти вершинах любой одноцветный цикл имел бы длину не больше 5, значит каждый из двух цветовых подграфов является лесом, и всего ребер не больше 2(5-1)=8.\n\nПредположим теперь, что существует контрпример с n>5 вершинами и m>F(n) ребрами, и выберем такой контрпример с минимальным n. Если у некоторой вершины v степень не превосходит F(n)-F(n-1), то после удаления v останется граф на n-1 вершинах с числом ребер больше F(n-1); условие на одноцветные циклы при удалении вершины сохраняется, что противоречит минимальности. Но\nF(n)-F(n-1)=floor(2n/3),\nпоэтому в минимальном контрпримере степень каждой вершины не меньше D=floor(2n/3)+1.\n\nПосчитаем одноцветные пути длины 2. Для вершины v пусть \\(r_v\\) и \\(b_v\\) - количества красных и синих ребер, выходящих из v. Число одноцветных путей длины 2 с серединой v равно \\(C(r_v,2)+C(b_v,2)\\). При фиксированной степени \\(d_v=r_v+b_v\\) эта сумма минимальна, когда \\(r_v\\) и \\(b_v\\) отличаются не более чем на 1, поэтому из \\(d_v\\ge D\\) получаем\n\\(C(r_v,2)+C(b_v,2) \\ge \\lfloor (D-1)^2/4 \\rfloor\\).\nСледовательно, общее число S одноцветных путей длины 2 не меньше\nS >= n floor(floor(2n/3)^2/4).        (1)\n\nТеперь оценим S сверху. Зафиксируем цвет и пару концов x,y. Если ребро xy имеет этот же цвет, то одноцветного пути x-u-y этого цвета быть не может, иначе возник бы одноцветный треугольник. Если же ребра xy этого цвета нет, то таких путей данного цвета не больше одного: две разные промежуточные вершины u,w дали бы одноцветный цикл x-u-y-w-x длины 4. Значит для красного цвета число таких путей не больше числа пар вершин, не соединенных красным ребром, то есть \\(C(n,2)-m_{red}\\); аналогично для синего. Суммируя по двум цветам, получаем\nS <= 2C(n,2)-m = n(n-1)-m < n(n-1)-F(n).        (2)\n\nОсталось сравнить (1) и (2). Пусть n=3k, 3k+1 или 3k+2. Тогда соответственно:\n- при n=3k: левая часть (1) не меньше 3k^3, а правая часть (2) меньше 6k^2-3k;\n- при n=3k+1: левая часть не меньше \\((3k+1)k^2\\), а правая меньше 6k^2+k;\n- при n=3k+2: левая часть не меньше (3k+2)k(k+1), а правая меньше 6k^2+5k+1.\nДля n>5 во всех трех случаях k>=2, и левая величина строго больше правой. Полученное противоречие доказывает, что \\(m\\le floor(n^2/3)\\).",
