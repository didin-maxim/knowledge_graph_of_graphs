      "id": "idea-count-monochromatic-2paths",
      "title": "Считать одноцветные пути длины 2",
      "text": "Если в одном цвете две разные двухзвенные цепочки имеют одни и те же концы, появляется одноцветный 4-цикл; если концы такой цепочки соединены ребром того же цвета, появляется одноцветный треугольник. Поэтому число одноцветных путей длины 2 имеет сильную верхнюю оценку, а минимальный контрпример дает сильную нижнюю оценку через степени.",
