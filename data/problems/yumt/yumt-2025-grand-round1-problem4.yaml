      "id": "idea-subdivided-claw-obstruction",
      "title": "Контрпример через три дважды удаленные листья",
      "text": "Если графики двух многочленов не пересекаются, то один из них всюду выше другого. В дереве с центральной вершиной и тремя ветвями длины 2 три крайних листа можно упорядочить по высоте. Тогда ветвь, отвечающая нижнему листу, вынуждает центральный многочлен быть ниже среднего листа, а ветвь, отвечающая верхнему листу, вынуждает его быть выше того же среднего листа.",
