      "id": "sol-ai-subdivided-claw-counterexample",
      "title": "ИИ-решение: контрпример с подразбиением звезды",
      "text": "Ответ: нет.\n\nСначала заметим простой факт. Если графики двух многочленов f и g не пересекаются, то многочлен f-g нигде не равен нулю. Так как R связна, знак f-g постоянен: либо f(x)>g(x) при всех x, либо f(x)<g(x) при всех x. Поэтому для непересекающихся графиков можно говорить, какой из них всюду выше.\n\nРассмотрим дерево S с 7 вершинами: есть центральная вершина o, из нее выходят три пути длины 2:\no-y_1-x_1, o-y_2-x_2, o-y_3-x_3.\nПокажем, что уже это дерево нельзя реализовать графиками многочленов. Предположим противное. Крайние листья x_1,x_2,x_3 попарно не соединены ребрами, значит их графики попарно не пересекаются. Перенумеруем ветви так, что соответствующие многочлены удовлетворяют\nf_{x_1}<f_{x_2}<f_{x_3}\nпри всех вещественных x.\n\nВершина y_1 соединена с x_1, но не соединена с x_2. Если бы f_{y_1}>f_{x_2} всюду, то из f_{x_2}>f_{x_1} следовало бы f_{y_1}>f_{x_1} всюду, и графики y_1 и x_1 не пересекались бы. Значит f_{y_1}<f_{x_2} всюду. Центральная вершина o не соединена с x_2, но соединена с y_1. Если бы f_o>f_{x_2} всюду, то f_o>f_{y_1} всюду, что невозможно из-за ребра oy_1. Следовательно, f_o<f_{x_2} всюду.\n\nАналогично для верхней ветви: вершина y_3 соединена с x_3, но не соединена с x_2, поэтому не может быть f_{y_3}<f_{x_2} всюду; иначе f_{y_3}<f_{x_3} всюду и ребро y_3x_3 не реализовалось бы. Значит f_{y_3}>f_{x_2} всюду. Но тогда из уже полученного f_o<f_{x_2} следует f_o<f_{y_3} всюду, а это противоречит ребру oy_3.\n\nИтак, S нереализуемо. Чтобы получить контрпример ровно на 10 вершинах, возьмем S и добавим к одному из его листьев еще путь из трех новых вершин. Если бы это 10-вершинное дерево реализовывалось графиками многочленов, то семь многочленов, соответствующие вершинам исходного S, реализовывали бы индуцированное поддерево S. Это невозможно. Значит Вася не может добиться желаемого независимо от дерева Пети.",
