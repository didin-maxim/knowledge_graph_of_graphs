    {
      "id": "sol-external-mse-chromatic-partition",
      "title": "Решение через дважды критическую теорему Штибица",
      "text": "Возьмём в исходном графе G минимальный по числу вершин индуцированный подграф H с χ(H)>4. Тогда H связен, K_5-свободен и на самом деле χ(H)=5: если удалить любую вершину v, то по минимальности χ(H-v)≤4, а потому добавление v отдельным цветом даёт χ(H)≤5.\n\nБолее того, для каждой вершины v выполнено χ(H-v)=4. Иначе при χ(H-v)≤3 можно было бы вернуть v новым четвёртым цветом и получить 4-раскраску H.\n\nДостаточно найти в H ребро xy, для которого χ(H-{x,y})≥4. Тогда берём B={x,y}, а A=V(G)\\B. Подграф на B содержит ребро, значит не 1-раскрашиваем. Подграф на A содержит H-{x,y}, значит не 3-раскрашиваем. Это и есть требуемое разбиение.\n\nПредположим, что такого ребра нет. Тогда для каждого ребра xy граф H-{x,y} 3-раскрашиваем. Он не может быть 2-раскрашиваемым: иначе H-x раскрашивался бы в 3 цвета после добавления y отдельным цветом, что противоречит χ(H-x)=4. Значит, для каждого ребра xy имеем χ(H-{x,y})=3.\n\nИтак, H — связный 5-хроматический граф, в котором удаление концов любого ребра уменьшает хроматическое число ровно на 2. По теореме Штибица о дважды критических 5-хроматических графах, доказанной в карточке stiebitz-double-critical-k5, единственный такой граф — K_5. Но H является индуцированным подграфом K_5-свободного графа G, противоречие. Следовательно, нужное ребро xy существует, и описанное выше разбиение A,B завершает доказательство.",
