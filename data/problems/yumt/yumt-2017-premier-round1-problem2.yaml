      "id": "idea-first-move-distance-and-leaf-target",
      "title": "Первый ход Васи и листовая цель",
      "text": "Если расстояние от начального города \\(A\\) до цели \\(B\\) не больше 2, Вася выигрывает первым ходом. Поэтому для выигрышной позиции Пети вершины \\(A\\) и \\(B\\) не смежны и не имеют общего соседа, что сразу ограничивает число рёбер. Равенство достигается почти полным графом: \\(B\\) является листом, а из полного графа на остальных вершинах удалено только ребро от \\(A\\) к соседу \\(B\\).",
