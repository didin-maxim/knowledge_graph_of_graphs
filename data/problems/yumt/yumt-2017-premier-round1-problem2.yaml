  "solutions": [
    {
      "id": "sol-ai-first-move-distance-leaf",
      "title": "ИИ-решение: расстояние до первого хода и листовая цель",
      "text": "Ответ: \\(\\binom{n-1}{2}=\\frac{(n-1)(n-2)}2\\).\n\nСначала докажем верхнюю оценку. Пусть Петя выбрал карту, города \\(A,B\\) и рассчитывает выиграть. Перед первым ходом Васи расстояние от \\(A\\) до \\(B\\) обязано быть больше 2: иначе Вася сразу за один ход переместил бы фишку в \\(B\\) и победил бы.\n\nЗначит, ребра \\(AB\\) нет, и у \\(A\\) и \\(B\\) нет общего соседа. Поэтому каждый из остальных \\(n-2\\) городов может быть соединён дорогой не более чем с одним из городов \\(A,B\\). Между самими остальными \\(n-2\\) городами дорог не больше, чем в полном графе. Следовательно,\n\\[\nk\\le \\binom{n-2}{2}+(n-2)=\\binom{n-1}{2}.\n\\]\n\nОсталось показать, что эта оценка достижима. Возьмём города \\(A,B,C\\) и ещё \\(n-3\\) городов. На всех городах, кроме \\(B\\), проведём полный граф, но удалим из него ребро \\(AC\\). После этого добавим единственную дорогу \\(BC\\). Тогда всего дорог\n\\[\n\\binom{n-1}{2}-1+1=\\binom{n-1}{2}.\n\\]\nГраф связен, прост, а расстояние от \\(A\\) до \\(B\\) равно 3: например, путь \\(A-D-C-B\\) существует для любого другого города \\(D\\), а пути длины 1 или 2 нет, потому что единственный сосед \\(B\\) — это \\(C\\), и ребро \\(AC\\) удалено.\n\nПетя отмечает эти города \\(A\\) и \\(B\\). Первым ходом Вася не может попасть в \\(B\\), поскольку до \\(B\\) из \\(A\\) нужно пройти три дороги. После первого хода Васи Петя разрушает единственную дорогу \\(BC\\), и город \\(B\\) становится изолированным. Поэтому дальше Вася уже никогда не сможет оказаться в \\(B\\), как бы он ни играл. Значит, Петя выигрывает при \\(k=\\binom{n-1}{2}\\), и это наибольшее возможное значение.",
