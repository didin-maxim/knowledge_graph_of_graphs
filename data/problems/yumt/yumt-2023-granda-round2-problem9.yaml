  "solutions": [
    {
      "id": "sol-hall-euler-face-counting",
      "title": "Теорема Холла и подсчёт граней",
      "text": "Для каждой грани рассмотрим множество вершин, лежащих на её границе. Нужно выбрать для всех граней различные представители из этих множеств. По теореме Холла достаточно проверить, что для любого набора S граней число вершин, инцидентных хотя бы одной грани из S, не меньше |S|.\n\nВозьмём произвольный набор S граней. Пусть H — плоский подграф исходного графа, состоящий из всех вершин и всех рёбер, лежащих на границах граней из S. Обозначим через v, e, c соответственно число вершин, рёбер и компонент связности графа H. Все выбранные грани остаются гранями рисунка H, поэтому |S| не превосходит полного числа граней H. По формуле Эйлера для c компонент это число равно e - v + c + 1.\n\nОценим e. Граф H двудолен. В каждой его компоненте с одной вершиной нет рёбер; в компоненте с двумя вершинами не больше одного ребра; в компоненте хотя бы с тремя вершинами стандартная планарная двудольная оценка даёт e_i <= 2v_i - 4. Во всех случаях e_i <= 2v_i - 2, значит e <= 2v - 2c. Тогда число граней H не больше (2v - 2c) - v + c + 1 = v - c + 1 <= v. Следовательно, |S| <= v, то есть условие Холла выполнено.\n\nЗначит существует система различных представителей: для каждой грани можно выбрать одну вершину на её границе, причём все выбранные вершины будут различны.",
