  "solutions": [
    {
      "id": "sol-archive-card",
      "title": "Официальное решение",
      "text": "Ответ: 14.\nРассмотрим двудольный граф, в котором вершины одной доли — 8 строк доски, вершины другой доли — 8 столбцов, а каждый выставленный ферзь задаёт ребро между своей строкой и своим столбцом.\nВ этом графе не может быть цикла. Действительно, если бы цикл был, то последний по времени ферзь из этого цикла бил бы по крайней мере двух ранее поставленных ферзей: одного по строке и одного по столбцу. Это противоречит условию. Значит, полученный граф является лесом, а потому число его рёбер не больше чем 16 - 1 = 15.\nПредположим, что удалось поставить 15 ферзей. Тогда соответствующий двудольный граф является деревом. Следовательно, между любыми двумя ферзями существует путь, идущий по занятым клеткам горизонтальными и вертикальными ходами.\nРазобьём все диагонали двух направлений на 14 классов: по 7 диагоналей каждого цвета. По принципу Дирихле среди 15 ферзей найдутся два, стоящие на одной такой диагонали. Диагональный ход между ними вместе с уже существующим путём по занятым клеткам образует цикл в графе ходов ферзя. Тогда последний поставленный ферзь на этом цикле в момент постановки бил бы хотя бы двух ферзей, что невозможно.\nИтак, 15 ферзей поставить нельзя, значит, максимум равен 14.\nНижняя оценка достигается явной расстановкой на 14 ферзей, приведённой в официальном разборе методом «пропеллера». Следовательно, ответ равен 14.",
