  "solutions": [
    {
      "id": "sol-official-expanded",
      "title": "Официальное решение, развёрнутое",
      "text": "Ответ: 14.\n\nСначала приведём пример на 14 ферзей. Будем нумеровать строки сверху вниз числами 1,2,...,8, а столбцы слева направо числами 1,2,...,8. Поставим ферзей в таком порядке:\n\\[\n(4,1),(3,1),(2,1),(1,1),(1,5),(1,6),(1,7),(1,8),(5,8),(6,8),(7,8),(8,4),(8,3),(8,2).\n\\]\nЭто ровно официальный пример методом «пропеллера». Проверим правило. Второй, третий и четвёртый ферзи стоят в первом столбце подряд и видят только ближайшего предыдущего ферзя: дальние закрыты ближайшим. Затем ферзи 5,6,7,8 идут по верхней строке вправо; каждый из них видит только ближайшего слева уже поставленного ферзя. Ферзи 9,10,11 идут вниз по восьмому столбцу; каждый видит только ближайшего сверху. Ферзь 12 в клетке (8,4) не видит ни одного ранее поставленного ферзя. Ферзи 13 и 14 идут по нижней строке влево и каждый видит только ближайшего справа. Значит, 14 ферзей действительно можно выставить.\n\nДокажем, что больше нельзя. Рассмотрим 30 специальных рядов доски: 8 вертикалей, 8 горизонталей и 14 диагоналей. Диагонали выбираются так: все 32 клетки одного цвета покрываем 7 диагоналями одного направления, а все 32 клетки другого цвета покрываем 7 диагоналями другого направления. Например, для клеток с чётной суммой координат берём диагонали \\(r-c=0,\\pm2,\\pm4,\\pm6\\), а для клеток с нечётной суммой координат берём диагонали \\(r+c=3,5,7,9,11,13,15\\). Тогда каждая клетка лежит ровно на трёх выбранных рядах: своей горизонтали, своей вертикали и одной выбранной диагонали.\n\nПервый ферзь занимает 3 выбранных ряда. Рассмотрим любой следующий ферзь. Если на двух из трёх выбранных рядов, проходящих через его клетку, уже есть ранее поставленные ферзи, то новый ферзь видит по крайней мере по одному ближайшему ферзю на каждом из этих двух рядов. Эти два видимых ферзя различны, потому что два разных ряда пересекаются только в клетке нового ферзя. Значит, такой новый ферзь бил бы минимум двух ранее поставленных ферзей, что запрещено. Следовательно, у каждого нового ферзя ранее занятым может быть не более один из его трёх выбранных рядов, и он занимает как минимум два новых выбранных ряда.\n\nВсего выбранных рядов 30. После первого ферзя остаётся 27 ещё не занятых рядов, а каждый следующий ферзь требует не менее двух новых рядов. Поэтому после первого можно поставить не более \\(\\lfloor 27/2\\rfloor=13\\) ферзей. Итак, всего не более \\(1+13=14\\) ферзей.\n\nДля связи с первым официальным доказательством отметим также более слабый промежуточный шаг. Если каждой занятой клетке сопоставить ребро между её строкой и столбцом, то циклов в таком двудольном графе нет: последний ферзь на цикле видел бы по строке и по столбцу по более раннему ферзю. Поэтому ферзей сначала получается не больше 15. Официальный разбор затем исключает 15 с помощью диагоналей и цикла ходов ферзя, но 30-рядовый подсчёт сразу даёт точную верхнюю оценку 14.\n\nПример и оценка совпадают, значит максимум равен 14.",
