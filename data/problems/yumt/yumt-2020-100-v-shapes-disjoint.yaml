      "id": "sol-ai-component-edge-pairing",
      "title": "Ответ 239 через компоненты с нечётным числом рёбер",
      "text": "Ответ: 239.\n\nСначала докажем лемму. В любой связной компоненте с q рёбрами можно выбрать \\(\\lfloor q/2\\rfloor\\) галочек без общих рёбер.\n\nДействительно, достаточно разбить все рёбра компоненты, кроме, возможно, одного, на пары соседних рёбер. Возьмём дерево поиска в глубину с корнем и будем обрабатывать вершины снизу вверх; в таком дереве каждое не древесное ребро соединяет вершину с её предком. В вершине v попарно соединяем все ещё не использованные рёбра, которые приходят к v из уже обработанной нижней части. Если осталось одно такое ребро и v не корень, соединим его с ребром дерева, ведущим к отцу v; если таких рёбер осталось чётное число, то ребро к отцу просто передаётся вверх. В корне после попарного соединения может остаться не более одного ребра. Каждая полученная пара имеет общую вершину, значит является галочкой.\n\nТеперь пусть в графе m рёбер. Обозначим через r число непустых компонент, в которых число рёбер нечётно. По лемме граф содержит не меньше\n\\[\n\\sum_i \\left\\lfloor \\frac{q_i}{2}\\right\\rfloor=\\frac{m-r}{2}\n\\]\nпопарно рёберно-непересекающихся галочек, где q_i -- числа рёбер в непустых компонентах.\n\nЕсли \\(m\\ge 239\\) и \\(r\\le 40\\), то \\((m-r)/2\\ge (239-40)/2>99\\), то есть галочек уже не меньше 100.\n\nОстаётся понять, что при \\(m\\ge 239\\) не может быть \\(r\\ge 41\\). Действительно, чтобы максимизировать число рёбер в графе на 100 вершинах при наличии хотя бы 41 нечётной непустой компоненты, надо взять 40 компонент по две вершины и все оставшиеся 20 вершин отдать одной компоненте: выпуклость функции \\(\\binom v2\\) показывает, что дробление большой компоненты только уменьшает максимум. На 20 вершинах нечётная компонента имеет не больше 189 рёбер, поскольку \\(\\binom{20}{2}=190\\) чётно. Поэтому всего рёбер не больше \\(189+40=229\\), противоречие с \\(m\\ge 239\\). Значит при 239 рёбрах 100 нужных галочек гарантированы.\n\nПокажем, что 238 рёбер недостаточно. Возьмём граф на 21 вершине с 199 рёбрами, например \\(K_{21}\\) с удалёнными 11 рёбрами, добавим 39 отдельных компонент \\(K_2\\) и одну изолированную вершину. Всего вершин \\(21+39\\cdot2+1=100\\), рёбер \\(199+39=238\\). Однорёберные компоненты не могут входить ни в одну галочку, а в большой компоненте 199 рёбер дают не больше \\(\\lfloor199/2\\rfloor=99\\) рёберно-непересекающихся галочек. Поэтому 100 галочек здесь нет.\n\nСледовательно, наименьшее n равно 239.",
