      "id": "idea-degree-sequence-parity-and-connectivity",
      "title": "Чётность суммы степеней и минимальная связность",
      "text": "Нужно совместить стандартное условие графичности по сумме степеней с тем, что связный граф на n вершинах имеет не меньше n-1 рёбер.",
