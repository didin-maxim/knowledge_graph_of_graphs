  "solutions": [
    {
      "id": "sol-archive-card",
      "title": "Решение",
      "text": "Ответ: только K = 4036.\nВо-первых, сумма степеней любого графа должна быть чётной. Кроме того, в связном графе на 2019 вершинах не меньше 2018 рёбер, поэтому сумма степеней не меньше 2·2018 = 4036. Значит, если нужное K существует для любых задуманных чисел, то K должно быть чётным и не меньше 4036.\nПокажем теперь, что при K > 4036 гарантии уже нет. Действительно, можно задумать числа\nK - 2018, 1, 1, ..., 1.\nИх сумма равна K. Если бы существовал граф с такими степенями, то степень первой вершины была бы равна K - 2018. Но в простом графе на 2019 вершинах степень любой вершины не превосходит 2018. Поэтому при K > 4036 получаем невозможность.\nОстаётся случай K = 4036. Тогда нужно показать, что любые 2019 натуральных чисел с такой суммой являются степенями некоторого связного графа. Но сумма степеней дерева на 2019 вершинах равна 2·2018 = 4036, и наоборот: любая последовательность из 2019 положительных целых чисел с суммой 4036 является последовательностью степеней некоторого дерева. Это стандартный критерий для степеней деревьев.\nСледовательно, при K = 4036 связный граф существует всегда, а при других K такой гарантии нет.",
