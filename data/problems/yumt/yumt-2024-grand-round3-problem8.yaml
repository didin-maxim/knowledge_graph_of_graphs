      "id": "idea-two-deletion-edge-count-degree-sums",
      "title": "Сравнить число рёбер после удаления пары",
      "text": "Так как после удаления любой пары вершин получается один и тот же граф, число оставшихся рёбер не зависит от пары. Значит, величина d(u)+d(v)-eps(u,v), где eps(u,v) показывает наличие ребра uv, постоянна для всех пар вершин. Сравнение вершин минимальной и максимальной степени почти сразу вынуждает регулярность графа, а регулярный граф не может одновременно иметь ребро и неребро.",
