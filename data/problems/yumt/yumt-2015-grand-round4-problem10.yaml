    {
      "id": "sol-archive-card",
      "title": "Полное решение через монохроматические компоненты",
      "text": "Ответ: D = 5n.\n\nПереведём условие на язык графов. Есть полный 5-дольный граф, доли которого — пять областей, в каждой доле по 5n вершин. Цвет ребра — авиакомпания, выполняющая соответствующий рейс. Нужно найти наибольший гарантированный размер одноцветной связной компоненты.\n\nСначала докажем, что компонента размера хотя бы 5n всегда найдётся. Пусть в некоторой раскраске все одноцветные компоненты имеют не более M вершин. Зафиксируем один цвет. Его компоненты имеют размеры m_1, m_2, ..., m_r, причём сумма этих размеров не превосходит общего числа вершин N = 25n. Каждая такая компонента является подграфом 5-дольного графа. Если в её пяти долях лежат a_1, ..., a_5 вершин, то число её рёбер не больше\n\n  sum_{i<j} a_i a_j = (m^2 - sum a_i^2)/2 <= (m^2 - m^2/5)/2 = 2m^2/5,\n\nгде m = a_1 + ... + a_5. Поэтому число рёбер выбранного цвета не превосходит\n\n  (2/5) * sum m_i^2 <= (2/5) * M * sum m_i <= (2/5) * M * 25n = 10nM.\n\nВсего цветов пять, значит общее число рёбер графа не превосходит 50nM. Но полный 5-дольный граф с долями по 5n вершин имеет\n\n  C(5,2) * (5n)^2 = 250n^2\n\nрёбер. Следовательно, 50nM >= 250n^2, откуда M >= 5n. Значит, всегда можно выбрать одну авиакомпанию и не менее 5n аэропортов, связных рейсами этой компании.\n\nОсталось построить пример, в котором больше 5n гарантировать нельзя. Пронумеруем области элементами поля Z_5. В каждой области i разобьём 5n аэропортов на пять групп V_{i,a} по n аэропортов, где a принадлежит Z_5. Для двух аэропортов из разных областей i и j, лежащих в группах V_{i,a} и V_{j,b}, покрасим ребро в цвет\n\n  c = (b - a)(j - i)^{-1} в Z_5.\n\nОбратный элемент существует, потому что 5 — простое число и i != j.\n\nЗафиксируем цвет c. Рёбра цвета c соединяют только такие группы, для которых b - a = c(j - i), то есть величина a - ci одинакова. Поэтому каждая компонента цвета c лежит в объединении пяти групп\n\n  V_{i, q + ci},  i in Z_5,\n\nпри некотором q in Z_5. В таком объединении ровно по одной группе из каждой области, всего 5n аэропортов, и рёбер цвета c между разными такими объединениями нет. Значит, в этой раскраске все одноцветные компоненты имеют размер не больше 5n.\n\nИтак, нижняя оценка и пример совпадают, поэтому D = 5n.",
