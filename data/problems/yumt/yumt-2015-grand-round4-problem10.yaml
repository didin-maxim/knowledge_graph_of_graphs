        "id": "stmt-original",
        "title": "Statement",
        "text": "Дано натуральное n. В республике 5 областей, в каждой области ровно 5n аэропортов.\nУ каждой из 5 авиакомпаний несколько двусторонних рейсов, каждый рейс соединяет два города из разных областей.\nДля любой пары городов из разных областей найдётся рейс одной из авиакомпаний, который соединяет города из этой пары.\nНайдите наибольшее целое D такое, что при данных условиях всегда можно выбрать одну авиакомпанию и D аэропортов так, чтобы из любого выбранного города можно было добраться до любого другого выбранного города только рейсами выбранной авиакомпании.",
