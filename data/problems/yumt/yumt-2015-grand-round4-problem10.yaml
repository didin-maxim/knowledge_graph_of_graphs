      "id": "sol-archive-card",
      "title": "Внешнее переносимое решение",
      "text": "Во внешнем источнике доказано общее утверждение: если k — простое число, то в любом k-раскрашивании рёбер полного k-дольного графа K_{kn,kn,...,kn} существует одноцветная связная компонента не менее чем из kn вершин; кроме того, эта оценка точна. Задача ЮМТ в точности соответствует случаю k=5, поскольку имеется 5 долей по 5n аэропортов и 5 цветов-авиакомпаний. Применяя внешний результат при k=5, сразу получаем, что для некоторой компании найдётся связное множество из не менее чем 5n аэропортов. Следовательно, искомая величина D равна 5n.",
