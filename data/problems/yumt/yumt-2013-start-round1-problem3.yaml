      "id": "sol-archive-card",
      "title": "Решение",
      "text": "Рассмотрим шесть чисел 3, 21, 7, 35, 5, 15. Каждое следующее делится на предыдущее или наоборот, поэтому на окружности получаем хорды 3-21, 21-7, 7-35, 35-5, 5-15, 15-3.\nЭти шесть хорд образуют цикл 3-21-7-35-5-15-3. Если бы никакие две хорды не пересекались внутри круга, то вершины любого такого цикла обязаны были бы располагаться на окружности именно в циклическом порядке 3, 21, 7, 35, 5, 15.\nТеперь рассмотрим число 45. Оно соединяется хордой с 3 и с 5, потому что делится и на 3, и на 5. Какую бы из шести дуг между соседними вершинами указанного цикла ни заняла точка 45, одна из хорд 3-45 или 5-45 обязательно пересечёт одну из сторон цикла внутри круга.\nСледовательно, пересекающиеся хорды существуют.",
