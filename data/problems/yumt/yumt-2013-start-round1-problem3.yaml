        "text": "24 точки на окружности занумерованы, возможно в беспорядке, нечётными числами 3, 5, 7, ..., 49.\nЕсли один номер делится на другой, то соответствующие точки соединяются хордой.\nДокажите, что найдутся хорды, пересекающиеся внутри круга.",
