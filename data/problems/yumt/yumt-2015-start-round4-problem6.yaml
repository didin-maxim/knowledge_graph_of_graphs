      "id": "idea-long-cycle-with-chords",
      "title": "Длинный цикл и хорды",
      "text": "Чтобы реализовать циклы многих длин, удобно взять длинный цикл и анализировать, какие дополнительные рёбра должны появиться как хорды; это быстро даёт нижнюю оценку на число дорог.",
