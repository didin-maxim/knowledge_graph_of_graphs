  "solutions": [
    {
      "id": "sol-archive-card",
      "title": "Решение",
      "text": "Ответ: 9.\nДля нижней оценки предположим, что дорог не более восьми. Так как существует маршрут по 7 городам, в графе дорог есть цикл длины 7, и семь дорог уже заняты этим циклом.\nРассмотрим восьмую дорогу. Если она не соединяет две вершины этого цикла, то она не может входить ни в один кольцевой маршрут, потому что вне цикла нет замкнутого обхода. Если же она соединяет две вершины цикла, то она является хордой и вместе с двумя дугами цикла образует ровно два новых цикла.\nЗначит, при восьми дорогах всего можно получить не более трёх различных циклов. Но по условию должны существовать циклы длин 3, 4, 5, 6 и 7, то есть как минимум пять разных циклов. Противоречие. Следовательно, дорог должно быть не меньше девяти.\nТеперь покажем, что девяти дорог достаточно. Возьмём цикл ABCDEFG длины 7 и добавим к нему хорды AC и AD. Тогда возникают циклы:\nABC длины 3,\nABCD длины 4,\nADEFG длины 5,\nACDEFG длины 6,\nABCDEFG длины 7.\nИтак, все требуемые длины реализованы, поэтому минимальное число дорог равно 9.",
