        "title": "Оригинальная формулировка",
        "text": "Туристическое агентство Орлятии предлагает кольцевые автобусные маршруты по стране.\nКаждый маршрут проходит по городам маршрута ровно по разу.\nЕсть маршруты из 3, 4, 5, 6 и 7 городов.\nКакое наименьшее число автодорог может быть в Орлятии, если каждая дорога соединяет два города и не проходит через другие города?\nС дороги на другую дорогу вне города переехать нельзя.",
