      "id": "idea-diameter-layers-paired-cliques",
      "title": "Слои от конца диаметрального пути",
      "text": "Берем диаметральный путь длины `2a - 1`, где `a = alpha(G)`, и делим вершины на слои по расстоянию от одного его конца. Равенство в оценке диаметра вынуждает пары слоев `L_{2i} \\cup L_{2i+1}` быть кликами: любая несмежная пара внутри такой пары слоев вместе с подходящими чередующимися вершинами пути дала бы независимое множество размера `a + 1`.",
