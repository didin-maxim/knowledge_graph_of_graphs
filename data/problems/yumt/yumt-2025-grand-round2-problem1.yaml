  "solutions": [
    {
      "id": "sol-ai-diameter-layers",
      "title": "ИИ-решение: пары слоев от конца диаметра",
      "text": "Обозначим `a = alpha(G)`. Возьмем кратчайший путь `v_0 v_1 ... v_{2a-1}` между двумя вершинами на расстоянии `2a - 1`. Пусть `L_k` -- множество вершин на расстоянии `k` от `v_0`. Так как диаметр равен `2a - 1`, слои `L_0,...,L_{2a-1}` покрывают все вершины графа. Кроме того, ребро может соединять только вершины одного слоя или соседних слоев.\n\nПокажем, что для каждого `i=0,1,...,a-1` множество `C_i = L_{2i} \\cup L_{2i+1}` является кликой. Если две несмежные вершины лежат в `L_{2i}`, то вместе со всеми четными вершинами пути `v_0,v_2,...,v_{2a-2}`, кроме `v_{2i}`, они образуют независимое множество размера `a+1`: с выбранными вершинами пути они несмежны, потому что номера слоев отличаются минимум на 2. Это невозможно.\n\nАналогично, если две несмежные вершины лежат в `L_{2i+1}`, то вместе со всеми нечетными вершинами пути, кроме `v_{2i+1}`, получается независимое множество размера `a+1`. Наконец, пусть `x \\in L_{2i}` и `y \\in L_{2i+1}` несмежны. Тогда вершины `x,y`, а также `v_0,v_2,...,v_{2i-2}` и `v_{2i+3},v_{2i+5},...,v_{2a-1}` попарно несмежны; их ровно `2+i+(a-i-1)=a+1`. Снова противоречие. Значит, каждое `C_i` -- клика. Эти `a` клик непусты, потому что содержат соответственно вершины пути `v_{2i}` и `v_{2i+1}`, и вместе покрывают весь граф.\n\nДокажем единственность. Рассмотрим любое разбиение на `a` клик. Четные вершины пути `v_0,v_2,...,v_{2a-2}` и нечетные вершины пути `v_1,v_3,...,v_{2a-1}` по отдельности образуют независимые множества размера `a`; значит, в каждой клике разбиения лежит ровно одна четная и ровно одна нечетная вершина этого пути. Вершина `v_0` среди нечетных вершин пути смежна только с `v_1`, поэтому `v_0` и `v_1` вынужденно лежат в одной клике. Далее индукцией: после того как клики с `v_0,v_2,...,v_{2i-2}` уже заняли `v_1,v_3,...,v_{2i-1}`, вершина `v_{2i}` из оставшихся нечетных вершин пути смежна только с `v_{2i+1}`, значит, `v_{2i}` и `v_{2i+1}` лежат в одной клике.\n\nТеперь любая вершина `x \\in L_{2i}` может лежать только в клике с `v_{2i}`, потому что со всеми другими четными вершинами пути она несмежна. Если же `x \\in L_{2i+1}`, то из четных вершин пути она может быть смежна только с `v_{2i}` и, возможно, с `v_{2i+2}`; но клика с `v_{2i+2}` уже содержит `v_{2i+3}`, а слои `2i+1` и `2i+3` не соединяются ребром. Поэтому `x` тоже обязана лежать в клике с `v_{2i}`. Следовательно, всякая допустимая разбивка совпадает с `C_i=L_{2i}\\cup L_{2i+1}`, и разбиение единственно.",
