  "solutions": [
    {
      "id": "sol-archive-card",
      "title": "Решение",
      "text": "Выберем все вершины нечётной степени. Их число чётно. Разобьём их на пары и к каждой паре добавим фиктивное ребро. Если между двумя вершинами уже было ребро, допускаем кратное ребро; получится связный мультиграф.\nПосле этого степени всех вершин станут чётными, а граф останется связным. Значит, в нём существует эйлеров цикл.\nПройдём по рёбрам этого эйлерова цикла по порядку и раскрасим их попеременно в два цвета: первое ребро в красный, второе в синий, третье в красный и так далее. Так как цикл замкнутый и в каждой вершине каждый приход по одному ребру сразу сопровождается уходом по следующему ребру, у каждой вершины числа красных и синих инцидентных рёбер в полученном мультиграфе совпадают.\nТеперь удалим все фиктивные рёбра. У вершины исходно чётной степени ничего не изменится: фиктивных рёбер в неё не входило, поэтому числа рёбер двух цветов останутся равными. У вершины исходно нечётной степени было ровно одно фиктивное ребро, значит после его удаления разность между числами красных и синих рёбер станет ровно 1.\nСледовательно, после удаления фиктивных рёбер мы получаем раскраску исходного графа в два цвета, в которой в каждой вершине количества рёбер двух цветов отличаются не более чем на 1.",
