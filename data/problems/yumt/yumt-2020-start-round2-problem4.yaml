    {
      "id": "idea-eulerize-and-alternate",
      "title": "Добалансировать нечётные степени и пройти эйлеровым маршрутом",
      "text": "После добавления фиктивных рёбер между вершинами нечётной степени получается эйлеров граф. Попеременная раскраска рёбер вдоль эйлерова обхода даёт почти равный баланс цветов в каждой вершине.",
