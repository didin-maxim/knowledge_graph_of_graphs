  "solutions": [
    {
      "id": "sol-euler-trails-alternating",
      "title": "Через эйлеров цикл и попеременную раскраску цепей",
      "text": "Добавим к графу фиктивные рёбра так, чтобы степени всех вершин стали чётными: вершины нечётной степени разобьём на пары и в каждой паре проведём одно фиктивное ребро. Если такое ребро уже было, считаем, что получился мультиграф. Он связен, и все его степени чётны, поэтому в нём есть эйлеров цикл.\n\nПройдём по этому эйлерову циклу и удалим из записи все фиктивные рёбра. Оставшиеся настоящие рёбра распадутся на несколько цепей исходного графа: каждая цепь начинается и заканчивается либо в вершинах, к которым были приписаны фиктивные рёбра, либо получается из участка между двумя соседними фиктивными рёбрами в эйлеровом цикле. Важно, что каждая исходно нечётная вершина является концом ровно одной такой цепи, а исходно чётные вершины концами цепей не являются.\n\nТеперь раскрасим рёбра каждой полученной цепи попеременно в два цвета, начиная с любого цвета. Внутри цепи всякая внутренняя вершина получает по одному ребру каждого цвета из каждой пары «вход-выход», поэтому вклад этой цепи в баланс цветов в такой вершине равен нулю. Конец цепи получает от этой цепи ровно одно ребро, значит его вклад по модулю равен 1.\n\nСледовательно, каждая вершина чётной степени, не являясь концом ни одной цепи, получает поровну рёбер двух цветов. Каждая вершина нечётной степени является концом ровно одной цепи и потому получает количества цветов, отличающиеся ровно на 1. Значит, в исходном графе построена требуемая раскраска.",
