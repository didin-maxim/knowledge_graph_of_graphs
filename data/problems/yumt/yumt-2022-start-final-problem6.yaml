      "id": "idea-maximal-matching-leaves-independent-set",
      "title": "Максимальное паросочетание оставляет независимое множество",
      "text": "Если в графе нет десяти попарно несмежных рёбер, максимальное паросочетание покрывает не больше 18 вершин. Все непокрытые вершины независимы; при размере паросочетания 9 отсутствие треугольников позволяет добавить к ним ещё один конец ребра паросочетания.",
