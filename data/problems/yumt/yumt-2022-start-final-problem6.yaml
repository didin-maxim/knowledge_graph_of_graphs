  "solutions": [
    {
      "id": "sol-maximal-matching-independent-set",
      "title": "Через максимальное паросочетание",
      "text": "Условие «среди любых трёх вершин есть две несмежных» означает, что в графе нет треугольников. Условие «среди любых десяти рёбер есть два с общим концом» означает, что в графе нет паросочетания из 10 рёбер.\n\nВозьмём максимальное по числу рёбер паросочетание M. Тогда |M| <= 9. Пусть U — множество вершин, не покрытых M. Так как M максимально, между двумя вершинами из U нет ребра: иначе это ребро можно было бы добавить к M. Значит U — независимое множество.\n\nЕсли |M| <= 8, то |U| >= 100 - 16 = 84, и тем более можно выбрать 83 попарно несмежные вершины. Остался случай |M| = 9. Тогда |U| = 82. Покажем, что к U можно добавить ещё одну вершину. Рассмотрим любое ребро xy из M. Не могут обе вершины x и y иметь соседей в U. Действительно, если x смежна с u из U, а y смежна с v из U, то u != v, иначе uxy был бы треугольником. Тогда вместо ребра xy в паросочетании можно взять два рёбра xu и yv; они не имеют общих концов и вместе с остальными рёбрами M дают паросочетание большего размера, противоречие.\n\nЗначит у каждого ребра M хотя бы один конец не имеет соседей в U. Выберем такой конец у одного ребра. Он не смежен ни с одной вершиной из U, поэтому вместе с U образует независимое множество размера 83.",
