    {
      "id": "idea-regular-tournament-cut",
      "title": "Регулярный турнир на 23 вершинах имеет все направленные разрезы размера хотя бы 11",
      "text": "В регулярном турнире на \\(23\\) вершинах каждая вершина имеет исходящую степень \\(11\\). Если \\(|S|=s\\), то из \\(S\\) наружу выходит \\(11s-\\binom{s}{2}=s(23-s)/2\\) дуг, а это не меньше \\(11\\).",
