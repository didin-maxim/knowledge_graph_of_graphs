  "solutions": [
    {
      "id": "sol-ai-regular-tournament-23",
      "title": "23 города через регулярный турнир (ИИ-решение)",
      "text": "Будем пользоваться стандартной олимпиадной моделью: между двумя городами проходит не более одной дороги, и если она есть, то имеет одно направление.\n\nСначала докажем нижнюю оценку. Рассмотрим любой город \\(A\\). Если из него выходит не больше \\(10\\) дорог, то можно закрыть все эти дороги и, при необходимости, ещё несколько других дорог, чтобы всего было закрыто \\(10\\). Тогда из \\(A\\) нельзя будет попасть ни в какой другой город, противоречие условию. Значит, из каждого города выходит хотя бы \\(11\\) дорог. Точно так же в каждый город входит хотя бы \\(11\\) дорог: иначе после закрытия всех входящих в него дорог в этот город нельзя было бы попасть из остальных.\n\nТак как между городом \\(A\\) и каждым другим городом есть не более одной дороги, сумма входящих и исходящих дорог, инцидентных \\(A\\), не превосходит числа остальных городов. Поэтому остальных городов не меньше \\(11+11=22\\), то есть всего городов не меньше \\(23\\).\n\nОсталось построить пример на \\(23\\) городах. Расположим города по кругу и занумеруем их остатками \\(0,1,\\ldots,22\\) по модулю \\(23\\). Между каждой парой городов проведём ровно одну дорогу: из \\(i\\) в \\(j\\), если разность \\(j-i\\) по модулю \\(23\\) равна одному из чисел \\(1,2,\\ldots,11\\); иначе дорога идёт из \\(j\\) в \\(i\\). Тогда из каждого города выходит ровно \\(11\\) дорог и в каждый город входит ровно \\(11\\) дорог.\n\nПокажем, что после закрытия любых \\(10\\) дорог из любого города всё ещё можно добраться до любого другого. До ремонта возьмём любое непустое собственное множество городов \\(S\\), пусть \\(|S|=s\\). Из городов множества \\(S\\) всего выходит \\(11s\\) дорог, считая и дороги внутри \\(S\\). Внутри \\(S\\) каждая пара городов соединена ровно одной направленной дорогой, поэтому внутренних исходящих дорог при таком подсчёте ровно \\(\\binom{s}{2}\\). Следовательно, из \\(S\\) наружу выходит\n\\[\n11s-\\binom{s}{2}=\\frac{s(23-s)}{2}\n\\]\nдорог. При \\(1\\le s\\le 22\\) это число не меньше \\(11\\). Значит, после закрытия любых \\(10\\) дорог из всякого непустого собственного множества городов всё равно остаётся хотя бы одна дорога наружу.\n\nТеперь зафиксируем после ремонта город \\(A\\) и обозначим через \\(R\\) множество городов, достижимых из \\(A\\). Если бы \\(R\\) было не всеми городами, то из \\(R\\) не было бы ни одной оставшейся дороги наружу: по такой дороге можно было бы добраться ещё в один город. Но мы только что доказали, что у любого непустого собственного множества после ремонта есть дорога наружу. Противоречие. Значит, из \\(A\\) достижимы все города. Так как \\(A\\) был произвольным, после закрытия любых \\(10\\) дорог страна остаётся связной по направлению движения. Минимальное число городов равно \\(23\\).",
