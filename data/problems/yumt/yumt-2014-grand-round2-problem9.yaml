      "id": "idea-ai-hard-candidate-4004",
      "title": "Кандидатная граница 4004 и место, требующее проверки",
      "text": "Если 1000 кубиков поставить в один прямой столбик \\(1000\\times 1\\times 1\\), то получается планарный граф с \\(4(1000+1)=4004\\) вершинами. Для нижней оценки естественно использовать двудольность графа рёбер кубиков и оценку \\(E\\le 2V-4\\) для планарного двудольного графа, но одной этой оценки недостаточно: нужно дополнительно доказать, что любая склейка, уменьшающая число вершин по сравнению с деревом кубиков в один слой, создаёт непланарный подграф. Этот шаг выглядит как отдельная нетривиальная лемма о циклах в графе склейки кубиков.",
      "status": "needs_human_review",
      "review_notes": "Непросто для ИИ: найден кандидат на ответ и конструкция, но нет самодостаточного доказательства ключевой леммы о непланарности циклических/уплотняющих склеек."
