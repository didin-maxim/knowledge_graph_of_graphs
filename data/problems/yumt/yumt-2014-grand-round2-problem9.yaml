      "id": "idea-planar-leaf-cube",
      "title": "Планарная склейка кубов разбирается по листовым кубам",
      "text": "Главный шаг — не пытаться уплотнять тело, а использовать планарность всего графа рёбер. Если у конечной склейки кубов планарный 1-скелет, то среди кубов есть такой, который соприкасается с остальной частью ровно по одной своей грани и больше не имеет с ней общих вершин или рёбер. Иначе в скелете возникает замкнутый пояс кубических рёбер, содержащий подразделение \\(K_{3,3}\\), что противоречит планарности. После удаления такого куба число отмеченных вершин уменьшается ровно на \\(4\\).",
