  "solutions": [
    {
      "id": "sol-leaf-cube-induction",
      "title": "Ответ 4004 через разбор планарной склейки",
      "text": "Ответ: \\(4004\\).\n\nСначала докажем лемму, которая является здесь основным содержанием планарности.\n\nЛемма. Пусть несколько единичных кубиков склеены гранями, тело связно, а граф, составленный из всех вершин и рёбер этих кубиков, планарен. Тогда, если кубиков больше одного, среди них есть кубик \\(Q\\), который имеет с остальным телом ровно одну общую грань и не имеет с ним других общих вершин или рёбер.\n\nДоказательство леммы. Рассмотрим плоскую укладку графа. Скелет одного куба — это граф куба; он 3-связен, поэтому его плоская укладка единственна с точностью до выбора внешней грани: шесть квадратных циклов, соответствующих граням куба, являются шестью границами областей. Значит, всё, что приклеено к данной грани куба, в любой плоской укладке должно лежать в соответствующей области этого квадратного цикла.\n\nЕсли утверждение леммы неверно, то при движении от куба к кубу через места соприкосновения, не позволяющие отделить «последний» куб, можно выбрать минимальную замкнутую цепочку кубов: каждый следующий куб приклеен к предыдущему по грани или касается уже построенной части по ребру/вершине так, что отделение последнего куба невозможно без сохранения дополнительного контакта. У такой минимальной цепочки вдоль границ общих граней получается замкнутый пояс из квадратов. В его графе есть подразделение \\(K_{3,3}\\): берём три попарно не соседние точки на одной стороне пояса и три соответствующие точки на противоположной стороне; три продольные полосы пояса и два обхода по его краям после стягивания участков дают все девять соединений между этими двумя тройками. Это запрещено теоремой Куратовского для планарного графа. Противоречие доказывает лемму.\n\nТеперь применим лемму индукцией по числу кубиков. Для одного кубика отмеченных вершин \\(8=4\\cdot1+4\\). Пусть для всякого планарного тела из \\(n-1\\) кубиков отмечено не меньше \\(4(n-1)+4\\) вершин. Возьмём планарное тело из \\(n\\) кубиков и удалим кубик \\(Q\\) из леммы. Оставшееся тело по-прежнему связано, потому что \\(Q\\) был листовым, и его граф рёбер остаётся планарным как подграф исходного. Кубик \\(Q\\) имел с остальным телом ровно одну общую грань, то есть четыре его вершины уже были отмечены, а четыре противоположные вершины принадлежали только \\(Q\\). Поэтому удаление \\(Q\\) уменьшает число отмеченных вершин ровно на \\(4\\). По предположению индукции после удаления осталось не меньше \\(4(n-1)+4\\) вершин, значит до удаления было не меньше\n\\[\n4(n-1)+4+4=4n+4.\n\\]\nПри \\(n=1000\\) получаем нижнюю оценку \\(4004\\).\n\nОсталось показать, что она достижима. Склеим все \\(1000\\) кубиков в один прямой столбик \\(1\\times1\\times1000\\). Его граф рёбер — это граф боковой поверхности прямоугольного параллелепипеда, четыре продольные цепочки вершин, соединённые квадратами; он очевидно планарен. В таком столбике на каждом из \\(1001\\) уровней есть по \\(4\\) вершины, всего \\(4\\cdot1001=4004\\) вершины.\n\nСледовательно, наименьшее возможное число отмеченных вершин равно \\(4004\\).",
