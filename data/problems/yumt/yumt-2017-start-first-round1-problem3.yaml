        "id": "stmt-original",
        "title": "Оригинальная формулировка",
        "text": "Дано натуральное число n > 10. Министры Петя и Вася играют в игру.\nУ них есть карта с n городами. В начале Петя соединяет их k ≥ n дорогами так, чтобы от любого города по дорогам можно было доехать до любого другого. Любые два города можно соединить не более чем одной дорогой.\nЗатем Петя отмечает два города A и B и помещает в город A фишку.\nДалее игроки ходят по очереди, начиная с Васи: каждым своим ходом Вася перемещает фишку в город, куда от текущего положения фишки можно пройти по одной имеющейся дороге. Петя же своим ходом разрушает одну дорогу.\nЕсли Вася в некоторый момент оказывается в городе B, то он побеждает. Иначе, то есть если Вася не может добиться попадания в B до остановки игры, выигрывает Петя.\nПри каком наибольшем k Петя может выиграть, как бы ни играл Вася?",
