      "id": "idea-complete-graph-minus-target-edge",
      "title": "Полный граф без ребра между стартом и целью",
      "text": "Полный граф сразу проигрышен для Пети: какие бы A и B он ни выбрал, Вася первым ходом переходит по ребру AB. Но если взять полный граф без одного ребра AB и выбрать его концы стартом и целью, Петя после каждого хода Васи удаляет ребро из текущего города фишки в B. Тогда перед каждым ходом Васи фишка стоит в городе, не смежном с B.",
