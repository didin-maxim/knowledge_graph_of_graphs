  "solutions": [
    {
      "id": "sol-ai-complete-minus-edge-invariant",
      "title": "ИИ-решение: полный граф без одного ребра и инвариант",
      "text": "Ответ: \\(\\binom n2-1\\).\n\nСначала получим верхнюю оценку. В простом графе на \\(n\\) вершинах не больше \\(\\binom n2\\) рёбер. Если \\(k=\\binom n2\\), граф полный. Тогда какие бы два города \\(A\\) и \\(B\\) Петя ни отметил, они соединены дорогой, и Вася первым же ходом переводит фишку из \\(A\\) в \\(B\\). Значит при полном графе Петя выиграть не может, поэтому \\(k\\le \\binom n2-1\\).\n\nПокажем, что \\(\\binom n2-1\\) достижимо. Петя строит полный граф на всех \\(n\\) городах, но не проводит одно ребро \\(AB\\). Такой граф связен при \\(n>2\\), в частности при данном \\(n>10\\), а число дорог равно \\(\\binom n2-1\\). Затем Петя отмечает именно эти города \\(A\\) и \\(B\\), фишка стоит в \\(A\\).\n\nСтратегия Пети такова. После каждого хода Васи, если текущий город фишки соединён дорогой с \\(B\\), Петя разрушает именно эту дорогу; если такой дороги уже нет, он разрушает любую оставшуюся дорогу. Перед первым ходом Васи ребра \\(AB\\) нет, поэтому Вася не может сразу попасть в \\(B\\). Далее после каждого хода Пети выполняется инвариант: текущий город фишки не соединён дорогой с \\(B\\). Следовательно, следующим ходом Вася не может перейти в \\(B\\) по одной дороге. Инвариант снова восстанавливается Петей после хода Васи.\n\nТак как дорог конечное число и Петя каждый свой ход разрушает одну дорогу до остановки игры, игра не может дать Васе возможность попасть в \\(B\\). Значит Петя выигрывает при \\(k=\\binom n2-1\\), и вместе с верхней оценкой это даёт максимум.",
