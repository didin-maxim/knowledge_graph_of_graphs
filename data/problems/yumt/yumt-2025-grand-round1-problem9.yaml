  "solutions": [
    {
      "id": "sol-ai-product-bound-grid-construction",
      "title": "ИИ-решение: оценка произведением и конструкция на трёхмерной сетке",
      "text": "Ответ: 38.\n\nДокажем сначала нижнюю оценку. Зафиксируем любую раскраску рёбер и допустимые разбиения вершин: для цвета r_i пусть вершина v лежит в группе c_i(v), где c_i(v) принимает a_i значений. Сопоставим вершине v тройку\n(c_1(v),c_2(v),c_3(v)).\nЕсли две разные вершины u и v получили бы одинаковую тройку, то ребро uv имело бы некоторый цвет r_i. Но тогда c_i(u)=c_i(v), что запрещено условием для цвета r_i. Значит все 2025 троек различны, поэтому\n2025 <= a_1 a_2 a_3.        (1)\n\nОстаётся минимизировать сумму положительных целых чисел a_1+a_2+a_3 при условии (1). При сумме не больше 37 произведение трёх положительных целых чисел максимально, когда они как можно ближе друг к другу; максимум равен 12*12*13=1872<2025. Следовательно, a_1+a_2+a_3 >= 38.\n\nПокажем, что 38 достижимо. Рассмотрим 2025 различных точек из множества\n{1,...,12} x {1,...,13} x {1,...,13}; всего там 12*13*13=2028 точек, так что выбрать 2025 можно. Эти точки будут вершинами полного графа. Для двух вершин-точек покрасим соединяющее их ребро в первый цвет r_i, для которого i-я координата этих точек различна. Такой i всегда есть, потому что точки различны.\n\nТеперь для цвета r_1 разобьём вершины по первой координате, для r_2 - по второй, для r_3 - по третьей. Если ребро имеет цвет r_i, то при его окрашивании i-я координата концов была различна; значит концы действительно лежат в разных группах соответствующего разбиения. Получаем a_1=12, a_2=13, a_3=13 и сумму 38.\n\nИтак, минимально возможное значение a_1+a_2+a_3 равно 38.",
