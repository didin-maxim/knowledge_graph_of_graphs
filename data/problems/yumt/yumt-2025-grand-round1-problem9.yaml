        "title": "Оригинальная формулировка",
        "text": "В полном графе с 2025 вершинами каждое ребро окрашено в один из цветов r1, r2 или r3.\nДля каждого i = 1, 2, 3 все вершины графа можно разделить на ai групп таким образом, что любые две вершины, соединённые ребром цвета ri, находятся в разных группах.\nНайдите минимально возможное значение a1 + a2 + a3.",
