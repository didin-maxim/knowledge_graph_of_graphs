      "id": "idea-encode-by-three-partitions",
      "title": "Кодировать вершину тройкой групп",
      "text": "Если для каждого цвета взять допустимое разбиение на группы, то две разные вершины не могут попасть в одну и ту же тройку групп: ребро между ними имеет некоторый цвет, а для этого цвета концы должны лежать в разных группах. Поэтому число вершин не превосходит произведения чисел групп.",
