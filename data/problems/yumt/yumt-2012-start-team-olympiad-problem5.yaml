      "id": "sol-archive-card",
      "title": "Официальное решение",
      "text": "Ответ: 66 дней.\nРассмотрим граф дежурств, в котором ученики являются вершинами, а каждая пара дежурных в некоторый день образует ребро.\nВ таком графе может быть не более одной изолированной вершины: если изолированных вершин хотя бы две, то для соответствующих двух учеников не найдётся дня, когда один дежурит, а другой нет. Кроме того, не может быть компоненты связности, состоящей ровно из одного ребра: её две вершины в любые дни либо обе дежурят вместе, либо обе не дежурят.\nЗначит, каждая неизолированная компонента содержит не менее трёх вершин. Если компонента содержит n вершин, то рёбер в ней не меньше n - 1, потому что связный граф содержит не меньше рёбер, чем дерево на тех же вершинах.\nПусть в графе k компонент связности, а числа вершин в них равны n1, ..., nk. Тогда число рёбер не меньше (n1 + ... + nk) - k = 100 - k. Чтобы это число было как можно меньше, надо сделать число компонент как можно больше. Одна компонента может состоять из одной вершины, а каждая другая должна содержать не менее трёх вершин. Поэтому k не превосходит 1 + 99 / 3 = 34. Следовательно, число рёбер не меньше 100 - 34 = 66.\nОценка точна: можно взять одну изолированную вершину и 33 компоненты по 3 вершины, каждая из которых является путём из двух рёбер. Для любых двух учеников из одной тройки найдётся день, когда дежурит ровно один из них, а ученика из изолированной вершины можно сравнить с любым неизолированным учеником по дню его дежурства. Значит, 66 дней достаточно.",
