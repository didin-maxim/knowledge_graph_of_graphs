        "id": "stmt-original",
        "title": "Statement",
        "text": "В школе учатся 100 учеников. Каждый день двое из них дежурят.\nТребуется составить график дежурств на некоторый период времени так, чтобы для любых двух учеников нашёлся день, когда один из них дежурит, а другой нет.\nКакое наименьшее количество дней может охватывать такой график?",
        "source_id": "src-yumt-2012-start-team-olympiad-problem5-official",
        "status": "ai_checked",
        "self_contained": {
