      "id": "sol-archive-card",
      "title": "Решение",
      "text": "Ответ: \\(\\lfloor 2n/3\\rfloor\\) рёбер.\n\nВ таком графе может быть не более одной изолированной вершины: если изолированных вершин хотя бы две, то для соответствующих двух вершин не найдётся ребра, инцидентного ровно одной из них. Кроме того, не может быть компоненты связности, состоящей ровно из одного ребра: её две вершины для любого ребра либо обе инцидентны ему, либо обе не инцидентны.\n\nЗначит, каждая неизолированная компонента содержит не менее трёх вершин. Если компонента содержит \\(s\\) вершин, то рёбер в ней не меньше \\(s-1\\). Пусть всего в графе \\(c\\) компонент. Тогда число рёбер не меньше \\(n-c\\). При описанных ограничениях число компонент не превосходит \\(\\lceil n/3\\rceil\\): может быть не более одной одноэлементной компоненты, а все остальные компоненты имеют размер хотя бы 3. Следовательно, рёбер не меньше \\(n-\\lceil n/3\\rceil=\\lfloor 2n/3\\rfloor\\).\n\nОценка точна. Разобьём \\(n\\) вершин на \\(\\lceil n/3\\rceil\\) групп так, чтобы была не более одна одноэлементная группа, а остальные группы имели размеры 3 или 4. В каждой группе размера хотя бы 3 проведём путь через все её вершины, а между разными группами рёбер не проведём. Тогда число рёбер равно \\(n-\\lceil n/3\\rceil=\\lfloor 2n/3\\rfloor\\). Любые две вершины в одной компоненте размера хотя бы 3 различаются некоторым ребром этой компоненты, а вершины из разных компонент различаются любым ребром, инцидентным одной из них. Значит, требуемое свойство выполнено.",
