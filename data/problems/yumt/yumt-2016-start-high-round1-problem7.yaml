  "solutions": [
    {
      "id": "sol-archive-card",
      "title": "Официальное решение",
      "text": "Ответ: 68 способов.\nРазобьём доску на 32 пары клеток, соединённых ходом коня; такое разбиение получается, если разбить доску на прямоугольники 2×4 и в каждом из них соединить клетки ходами коня. В каждой такой паре может стоять не более одного коня, поэтому при расстановке 31 коня ровно одна пара остаётся пустой.\nТеперь разобьём доску на четыре квадрата 4×4. Тогда три из них содержат по 8 коней, а один содержит 7 коней. Если в квадрате 4×4 стоят 8 не бьющих друг друга коней, то они занимают клетки только одного цвета. Рассматривая соседние квадраты, получаем, что в трёх полных квадратах цвет занятых клеток согласован, и возникают ровно два глобальных типа расположения, показанные в официальном разборе.\nДальнейший разбор четвёртого квадрата даёт следующее. В первом типе все 7 оставшихся коней тоже обязаны стоять на клетках того же цвета, и тогда можно выбрать любую из 32 клеток этого цвета, которую оставим пустой. Получаем 64 расстановки: два выбора цвета и 32 выбора пустой клетки этого цвета.\nВо втором типе, кроме конфигураций с одной пустой клеткой выбранного цвета, возможны ещё ровно 4 расстановки, когда 30 коней стоят на клетках одного цвета, а единственный конь другого цвета расположен в угловой клетке доски.\nИтак, всего получаем 64 + 4 = 68 способов.",
