    {
      "id": "sol-archive-card",
      "title": "Официальное решение, развёрнутое без рисунка",
      "text": "Ответ: 68 способов.\n\nБудем красить доску в шахматном порядке. Сначала докажем две маленькие леммы, которые заменяют рисунок из официального разбора.\n\nЛемма 1. В квадрате 4×4 можно поставить не более 8 попарно не бьющих друг друга коней; если поставлено ровно 8, то заняты все клетки одного цвета.\n\nДействительно, занумеруем строки и столбцы квадрата числами 1,2,3,4. Разобьём его клетки на 8 пар, в каждой паре клетки соединены ходом коня:\n\\((1,1)-(2,3)\\), \\((1,3)-(2,1)\\), \\((2,2)-(1,4)\\), \\((2,4)-(1,2)\\),\n\\((3,1)-(4,3)\\), \\((3,3)-(4,1)\\), \\((4,2)-(3,4)\\), \\((4,4)-(3,2)\\).\nИз каждой пары можно взять не более одной клетки, поэтому коней не больше 8. Если их ровно 8, то из каждой пары взята ровно одна клетка. Теперь если в одной паре выбрана чёрная клетка, то во всякой паре, чей белый представитель бьётся этой чёрной клеткой, тоже вынуждена быть выбрана чёрная клетка. Для приведённых 8 пар граф таких принуждений связен: первая пара связана с пятой, седьмой и восьмой; вторая - с шестой, седьмой и восьмой; третья - с пятой, шестой и седьмой; четвёртая - с пятой, шестой и восьмой. Значит выбор цвета в одной паре распространяется на все пары. Аналогично, если сначала выбрана белая клетка, во всех парах выбираются белые клетки. Лемма доказана.\n\nРазобьём всю доску 8×8 на четыре квадрата 4×4. По лемме 1 в каждом таком квадрате стоит не более 8 коней, а всего коней 31, поэтому в трёх квадратах стоит по 8 коней, а в четвёртом - 7. Три полных квадрата заняты клетками одного цвета каждый. Два соседних полных квадрата не могут быть заняты разными цветами: например, для горизонтально соседних квадратов, если левый занят чёрными, а правый белыми, то клетки \\((1,3)\\) левого и \\((2,5)\\) правого бьют друг друга; если наоборот, то бьют друг друга \\((1,4)\\) и \\((2,6)\\). Вертикальный случай получается поворотом. Поэтому все три полных квадрата заняты одним и тем же глобальным цветом; назовём его основным.\n\nОсталось разобрать четвёртый, неполный квадрат 4×4. Поворотом доски можно считать, что это левый верхний квадрат, а остальные три квадрата уже целиком заняты основным цветом. Рассмотрим, какие клетки неполного квадрата можно дополнительно занять.\n\nЕсли левый верхний угол имеет основной цвет, то все клетки другого цвета в неполном квадрате, не бьющиеся с занятыми клетками вне него, - это только \\((1,2)\\) и \\((2,1)\\). Но клетка \\((1,2)\\) бьёт три клетки основного цвета внутри квадрата: \\((2,4),(3,3),(3,1)\\), а клетка \\((2,1)\\) бьёт \\((1,3),(3,3),(4,2)\\). Поэтому, взяв хотя бы одну из них, нельзя добрать до 7 клеток в этом квадрате: остаётся слишком мало клеток основного цвета. Значит в этом случае семь коней неполного квадрата стоят на основных клетках, то есть просто одна из 8 основных клеток этого квадрата пуста.\n\nЕсли левый верхний угол имеет цвет, противоположный основному, то клетки противоположного основному цвета в неполном квадрате, не бьющиеся с занятыми клетками вне него, - это \\((1,1)\\) и \\((2,2)\\). Клетка \\((2,2)\\) бьёт четыре основные клетки внутри квадрата, поэтому с ней до 7 коней в квадрате снова не добраться. А клетка \\((1,1)\\) бьёт ровно две основные клетки, \\((2,3)\\) и \\((3,2)\\); тогда единственная смешанная возможность - поставить коня в угол \\((1,1)\\) и занять остальные шесть основных клеток неполного квадрата. Кроме того, как и раньше, можно занять любые семь из восьми основных клеток.\n\nТеперь считаем. Одноцветные расстановки получаются так: выбираем цвет доски, на котором будут стоять кони, и выбираем одну пустую клетку этого цвета. Это даёт \\(2\\cdot32=64\\) расстановки.\n\nСмешанные расстановки бывают только угловыми: выбираем один из четырёх углов доски, ставим туда единственного коня цвета, противоположного основному, а из основного цвета занимаем все клетки, кроме двух клеток, которые этот угловой конь бьёт. Для каждого угла такая расстановка единственна, значит их 4.\n\nИтого \\(64+4=68\\) способов.",
