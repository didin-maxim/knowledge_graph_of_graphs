  "solutions": [
    {
      "id": "sol-external-rmm-spanning-forest-counting",
      "title": "Адаптация решения RMM 2019: остовный лес и подсчёт циклов",
      "text": "Докажем от противного. Пусть G - простой граф с 3n вершинами и 5n рёбрами, в котором все простые циклы имеют попарно различные длины. При n=1 такого простого графа нет, потому что между тремя вершинами может быть не более трёх рёбер; далее считаем n>=2.\n\nВ простом графе на 3n вершинах длина простого цикла может быть только одним из чисел 3,4,...,3n. Поэтому, если длины всех циклов различны, всего циклов в G не больше 3n-2.\n\nВыберем в каждой компоненте G остовное дерево и объединим их в остовный лес F. Пусть c - число компонент. Тогда в F ровно 3n-c рёбер. Остальные рёбра обозначим через B; их число равно\nq=|B|=5n-(3n-c)=2n+c,\nзначит q>=2n+1.\n\nДля каждого ребра b из B добавление b к лесу F создаёт единственный простой цикл C_b. Пусть S_b - множество рёбер леса F, лежащих на этом цикле, то есть путь в F между концами b. Длина C_b равна |S_b|+1. По предположению все длины циклов различны, значит числа |S_b| для b из B тоже различны. Так как G прост, каждое ребро b соединяет две не смежные в F вершины, поэтому |S_b|>=2. Следовательно,\n\nsum_{b in B} |S_b| >= 2+3+...+(q+1)=q(q+3)/2.\n\nЭти вхождения рёбер леса в множества S_b распределены по 3n-c рёбрам леса. Поэтому некоторое ребро a леса входит в k множеств S_b, где\n\nk >= q(q+3)/(2(3n-c)) >= (2n+1)(2n+4)/(2(3n-1)) = (2n^2+5n+2)/(3n-1) > (2n+5)/3.\n\nОбозначим через B0 множество тех рёбер b из B, для которых a входит в S_b; тогда |B0|=k.\n\nВозьмём любые два различных ребра b1,b2 из B0. Два пути S_{b1} и S_{b2} в лесу F имеют общую часть, содержащую ребро a. Объединение циклов C_{b1} и C_{b2} образует тета-граф и содержит третий простой цикл D_{b1,b2}, проходящий через оба ребра b1 и b2. Этот цикл состоит из b1, b2 и рёбер леса, поэтому среди рёбер B0 он содержит ровно b1 и b2. Значит, разные пары {b1,b2} дают разные циклы D_{b1,b2}. Кроме того, эти циклы отличаются от фундаментальных циклов C_b, потому что C_b содержит ровно одно ребро из B, а D_{b1,b2} содержит два.\n\nИтак, в G есть по крайней мере q фундаментальных циклов и ещё k(k-1)/2 новых циклов. Поэтому число циклов строго больше\n\n2n+1 + ((2n+5)/3)((2n+2)/3)/2 = (2n^2+25n+14)/9.\n\nНо\n(2n^2+25n+14)/9 - (3n-2) = (2n^2-2n+32)/9 > 0,\nто есть циклов больше, чем 3n-2. Это противоречит тому, что при попарно различных длинах циклов их может быть не больше 3n-2. Следовательно, в G существуют два простых цикла равной длины.",
