      "id": "idea-spanning-forest-theta-counting",
      "title": "Остовный лес, фундаментальные циклы и тета-графы",
      "text": "Если все длины циклов различны, то фундаментальные циклы относительно остовного леса уже имеют разные длины. Их древесные части в сумме достаточно длинны, поэтому одно ребро леса лежит во многих таких циклах; пары этих циклов дают новые циклы в тета-графах, и общее число циклов становится больше числа возможных длин.",
