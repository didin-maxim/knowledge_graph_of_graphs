  "solutions": [
    {
      "id": "sol-ai-retrograde-state-game",
      "title": "ИИ-решение: критерий через выигрышные состояния",
      "text": "Обозначим через \\(G_R\\) и \\(G_B\\) красный и синий подграфы; пропуск хода будем считать петлёй в каждой вершине. Зафиксируем два цвета \\(C,D\\): фишка Волка ходит по \\(G_C\\), фишка Зайца — по \\(G_D\\). Для упорядоченных пар различных вершин построим множества \\(W_i^{C,D}\\). Сначала \\(W_0^{C,D}=\\varnothing\\). Если \\(W_i^{C,D}\\) уже построено, включим в \\(W_{i+1}^{C,D}\\) все пары из \\(W_i^{C,D}\\), а также пару \\((x,y)\\), если существует вершина \\(x'\\in N_C[x]\\) такая, что либо \\(x'=y\\), либо для каждого \\(y'\\in N_D[y]\\) выполнено: \\(y'=x'\\) или \\((x',y')\\in W_i^{C,D}\\). Здесь \\(N_C[x]\\) — замкнутая окрестность в цвете \\(C\\), то есть возможные позиции фишки Волка после одного хода или пропуска; аналогично для \\(N_D[y]\\). Так как пар конечное число, процесс стабилизируется; обозначим предельное множество через \\(W^{C,D}\\). Утверждение: Волк может гарантированно выиграть на данном раскрашенном графе тогда и только тогда, когда все упорядоченные пары различных вершин принадлежат обоим множествам \\(W^{R,B}\\) и \\(W^{B,R}\\). Действительно, если начальная пара лежит в \\(W_i^{C,D}\\), Волк делает ход в соответствующую вершину \\(x'\\). Если он не поймал Зайца сразу, то любой ход Зайца либо сам приводит фишку Зайца в \\(x'\\), либо переводит игру в состояние из \\(W_{i-1}^{C,D}\\); индукция по \\(i\\) даёт стратегию Волка. Обратно, если состояние не попало в предельное множество, то после любого хода Волка, не являющегося немедленной поимкой, у Зайца есть ответ, который снова оставляет состояние вне предельного множества. Повторяя такой ответ, Заяц бесконечно избегает встречи. Остаётся учесть начальный выбор: Заяц выбирает две вершины, цвета фишек и то, какая фишка достанется Волку. Поэтому Волк должен выигрывать из любой пары и при назначении Волку красной фишки против синей, и при назначении ему синей фишки против красной; это ровно два условия выше.",
