      "id": "idea-product-game-winning-region",
      "title": "Игра на парах вершин",
      "text": "Для фиксированного распределения фишек состояние задаётся упорядоченной парой \\((x,y)\\): где стоит фишка Волка и где стоит фишка Зайца. Выигрышные состояния Волка находятся обратной индукцией: состояние выигрышно, если у Волка есть ход, после которого любой не проигрывающий немедленно ответ Зайца снова ведёт в уже найденное выигрышное состояние.",
