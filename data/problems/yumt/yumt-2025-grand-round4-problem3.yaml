        "text": "Заяц и Волк играют в игру. Волк рисует граф, содержащий более одной вершины, и красит его рёбра в красный и синий цвет.\nПосле этого Заяц ставит в какие-то две вершины красную и синюю фишку и выбирает, какая из них достанется ему, а какая — Волку.\nЗатем игроки ходят по очереди, первым ходит Волк; за ход игрок может передвинуть свою фишку по ребру цвета этой фишки или пропустить ход.\nВолк выигрывает, если после нескольких ходов фишки окажутся в одной вершине.\nДля каких графов Волк может гарантированно выиграть?",
