  "ideas": [
    {
      "id": "idea-maximum-clique-remainder",
      "title": "Максимальная клика и остаток",
      "text": "Если \\(K\\) — максимальная клика размера \\(k\\), то достаточно доказать, что остаток \\(G\\setminus K\\) нельзя покрасить в \\(n-k\\) цветов. Иначе один цвет остатка можно перекрасить в цвета клики: каждая внешняя вершина не смежна хотя бы с одной вершиной максимальной клики.",
      "tags": [
        "coloring"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-kvant-maximum-clique",
      "title": "Отделить максимальную клику",
      "text": "Выберем в \\(G\\) клику \\(K\\) наибольшего размера; пусть \\(V(K)=\\{A_1,\\ldots,A_k\\}\\). Тогда \\(\\chi(K)=k\\), причём \\(k\\le n\\). Так как в \\(G\\) больше чем \\(n\\) вершин, клика \\(K\\) не совпадает со всем графом: если бы \\(K=G\\), то число вершин было бы \\(k\\le n\\).\n\nПоложим \\(G_1=K\\), а \\(G_2=G\\setminus K\\), то есть возьмём подграф, индуцированный всеми вершинами вне \\(K\\). Эти два подграфа не пересекаются по вершинам. Если \\(k=n\\), то \\(G_2\\) непуст, поэтому \\(\\chi(G_1)+\\chi(G_2)\\ge n+1\\). Остаётся случай \\(k<n\\).\n\nДокажем, что \\(\\chi(G_2)>n-k\\). Предположим противное: вершины \\(G_2\\) правильно раскрашены не более чем в \\(n-k\\) цветов. Обозначим эти цвета через \\(c_{k+1},\\ldots,c_n\\) (неиспользованные цвета можно просто добавить к списку), а вершину \\(A_i\\) клики покрасим в цвет \\(c_i\\) для \\(i=1,\\ldots,k\\). Получилась правильная \\(n\\)-раскраска всего графа.\n\nТеперь избавимся от цвета \\(c_n\\). Возьмём любую вершину \\(v\\) цвета \\(c_n\\). Она лежит вне \\(K\\). Если бы \\(v\\) была смежна со всеми вершинами \\(A_1,\\ldots,A_k\\), то \\(K\\cup\\{v\\}\\) была бы кликой большего размера, что невозможно. Значит, для этой вершины найдётся \\(A_i\\), не смежная с \\(v\\); перекрасим \\(v\\) в цвет \\(c_i\\). Сделаем так для всех вершин цвета \\(c_n\\).\n\nПосле перекраски правильность не нарушится. Действительно, до перекраски цвета \\(c_1,\\ldots,c_k\\) встречались только на соответствующих вершинах \\(A_1,\\ldots,A_k\\); каждая новая вершина цвета \\(c_i\\) специально выбрана не смежной с \\(A_i\\), а любые две перекрашенные вершины раньше имели общий цвет \\(c_n\\), значит, не были смежны между собой. Цвет \\(c_n\\) исчез, и мы получили правильную раскраску графа \\(G\\) в \\(n-1\\) цвет, противореча \\(\\chi(G)=n\\).\n\nСледовательно, \\(\\chi(G_2)\\ge n-k+1\\), и потому\n\\[\n\\chi(G_1)+\\chi(G_2)\\ge k+(n-k+1)=n+1.\n\\]\nИскомые непересекающиеся по вершинам подграфы найдены.",
