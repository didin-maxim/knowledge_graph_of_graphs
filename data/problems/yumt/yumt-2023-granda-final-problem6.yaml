        "title": "Оригинальная формулировка",
        "text": "Дано натуральное число n ≥ 3 и граф G с хроматическим числом χ(G) = n, у которого больше чем n вершин.\nДокажите, что в G найдутся два не пересекающихся по вершинам подграфа G1 и G2 такие, что χ(G1) + χ(G2) ≥ n + 1.",
