  "solutions": [
    {
      "id": "sol-archive-card",
      "title": "Развёрнутое замыкание Бонди — Хватала",
      "text": "Обозначим через G граф рейсов компании Super-Air. В нём 100 вершин, а важность аэропорта — это степень соответствующей вершины. Обозначим через H граф рейсов Concur-Air. По условию две вершины u и v соединены в H тогда и только тогда, когда deg_G(u)+deg_G(v) >= 100.\n\nНам понадобится простая лемма. Пусть в графе X на N вершинах две несмежные вершины a и b имеют deg_X(a)+deg_X(b) >= N. Тогда добавление ребра ab не может впервые создать гамильтонов цикл: если X+ab гамильтонов, то X тоже гамильтонов. Действительно, если гамильтонов цикл в X+ab не использует новое ребро, всё ясно. Если использует, то после удаления ребра ab остаётся гамильтонов путь\n\\[\nb=v_1,v_2,\\ldots,v_N=a\n\\]\nв графе X. Рассмотрим индексы i=1,\\ldots,N-1. Если для некоторого i одновременно есть рёбра av_i и bv_{i+1}, то в X есть гамильтонов цикл\n\\[\na v_i v_{i-1}\\ldots v_1 b v_{i+1} v_{i+2}\\ldots v_N=a.\n\\]\nЕсли такого i нет, то множества индексов, отвечающие соседям a среди v_1,\\ldots,v_{N-1}, и соседям b среди v_2,\\ldots,v_N, не пересекаются. Их размеры равны deg_X(a) и deg_X(b), поэтому deg_X(a)+deg_X(b) <= N-1, противоречие. Лемма доказана.\n\nТеперь получим H из G последовательным добавлением тех рёбер H, которых ещё нет в текущем графе. Для каждого такого ребра uv уже в исходном G выполнено deg_G(u)+deg_G(v) >= 100. В текущем графе степени вершин не меньше, чем в G, значит условие леммы тоже выполнено. Поэтому на каждом шаге добавление очередного ребра сохраняет свойство: если новый граф гамильтонов, то предыдущий граф гамильтонов.\n\nПо условию H имеет гамильтонов цикл. Применяя лемму в обратном порядке ко всем добавленным рёбрам, получаем, что исходный граф G тоже имеет гамильтонов цикл. На языке задачи это означает, что у Super-Air существует циклический маршрут, проходящий через каждый аэропорт ровно один раз.",
