  "solutions": [
    {
      "id": "sol-archive-card",
      "title": "Внешнее переносимое решение",
      "text": "Обозначим через G граф рейсов компании Super-Air, а через H — граф рейсов компании Concur-Air. По условию вершины u и v соединены в H тогда и только тогда, когда deg_G(u)+deg_G(v)≥100. Следовательно, H получается из G добавлением некоторых отсутствующих в G рёбер, каждое из которых удовлетворяет условию замыкания Бонди — Хватала: сумма степеней его концов в исходном графе G не меньше числа вершин. Теорема о замыкании утверждает, что добавление такого ребра не меняет гамильтоновость графа. Поэтому после последовательного добавления всех таких рёбер граф G гамильтонов тогда и только тогда, когда гамильтонов H. Но по условию в H существует гамильтонов цикл. Значит, гамильтонов цикл существует и в G, то есть у Super-Air тоже есть циклический маршрут через все 100 аэропортов.",
