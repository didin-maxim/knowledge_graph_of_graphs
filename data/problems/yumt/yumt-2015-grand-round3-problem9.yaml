        "id": "stmt-original",
        "title": "Statement",
        "text": "В стране 100 аэропортов. У компании Super-Air есть несколько прямых двусторонних рейсов; между двумя аэропортами не более одного прямого рейса компании.\nВажностью аэропорта называется число рейсов компании Super-Air, соединяющих его с другими аэропортами.\nНовая компания Concur-Air открывает прямой рейс между двумя городами тогда и только тогда, когда сумма важностей этих городов не менее 100.\nОказалось, что существует циклический маршрут из рейсов компании Concur-Air, проходящий через каждый аэропорт ровно один раз.\nДокажите, что то же условие выполнено и для рейсов компании Super-Air.",
