        "id": "stmt-winner-count-days",
        "title": "Лемма о числе победителей",
        "text": "Пусть \\(2n\\) команд играют полный круговой турнир за \\(2n-1\\) дней: в каждый день каждая команда играет ровно одну игру, в каждой игре есть один победитель и один проигравший, а за весь турнир каждая пара команд встречается ровно один раз. Для произвольного множества \\(D\\) дней обозначим через \\(W(D)\\) множество команд, которые выиграли хотя бы одну игру в один из дней из \\(D\\). Тогда \\(|W(D)|\\ge |D|\\).",
