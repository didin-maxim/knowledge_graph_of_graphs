  "solutions": [
    {
      "id": "sol-count-losses",
      "title": "Подсчет поражений выбранной внешней команды",
      "text": "Возьмем произвольное множество \\(D\\) из \\(m\\) дней. При \\(m=0\\) утверждение пусто, поэтому считаем \\(1\\le m\\le 2n-1\\). Пусть \\(W=W(D)\\) — множество команд, которые хотя бы раз выиграли в эти дни. Предположим, что \\(|W|<m\\). Тогда \\(|W|<2n\\), так что существует команда \\(x\\), не входящая в \\(W\\).\n\nВ каждый день из \\(D\\) команда \\(x\\) играла ровно одну игру. Она не могла выиграть такую игру, иначе входила бы в \\(W\\). Значит, в каждый из \\(m\\) выбранных дней команда \\(x\\) проиграла. Ее соперники в этих \\(m\\) играх попарно различны, потому что в полном круговом турнире команда \\(x\\) встречается с каждой другой командой не более одного раза. Каждый из этих соперников выиграл соответствующую игру, а значит принадлежит \\(W\\). Получается, что в \\(W\\) лежат по крайней мере \\(m\\) различных команд, противоречие с \\(|W|<m\\). Следовательно, \\(|W(D)|\\ge |D|\\).\n\nГрафовая формулировка получается тем же доказательством: паросочетания \\(M_i\\) — это дни, а начальные вершины ориентированных ребер — победители соответствующих игр.",
