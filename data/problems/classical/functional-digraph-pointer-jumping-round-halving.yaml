  "ideas": [
    {
      "id": "idea-charge-deleted-before-update",
      "title": "Выпавшие до обновления заряжаются полезным обновлениям",
      "text": "Если вершина исходного цикла или пути выпала до собственного обновления, ее выбросило более раннее обновление соседней предшествующей вершины. Одно такое обновление выбрасывает не более одной вершины, значит полезных обновлений не меньше, чем преждевременно выпавших.",
