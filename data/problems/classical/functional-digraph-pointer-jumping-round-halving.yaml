        "extremal_choice",
        "goal_bound"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-charging-proof",
      "title": "Доказательство зарядкой выпавших вершин",
      "text": "Рассмотрим сначала цикл длины \\(K>1\\) в начале раунда. Если вершина \\(a\\) обновляется, пока она еще лежит на текущем цикле, и на цикле в этот момент есть участок \\(a\\to b\\to c\\), то после замены стрелки на \\(a\\to c\\) вершина \\(b\\) выпадает из цикла. Значит, каждое такое полезное обновление уменьшает длину цикла на 1.\n\nВершина, которая была на исходном цикле, но к своему обновлению уже выпала из него, могла выпасть только из-за более раннего полезного обновления своей текущей предшествующей вершины на цикле. Одно полезное обновление выбрасывает не более одной такой вершины. Поэтому среди \\(K\\) исходных вершин цикла число полезно обновившихся не меньше числа выпавших до обновления, то есть полезно обновившихся не меньше \\(\\lceil K/2\\rceil\\). Длина цикла к концу раунда не превосходит \\(K-\\lceil K/2\\rceil=\\lfloor K/2\\rfloor\\).\n\nДля пути к петле \\(z\\to z\\) рассуждение такое же. Пусть в начале раунда путь от \\(a\\) до \\(z\\) имеет вид\n\\[\na=x_L\\to x_{L-1}\\to\\cdots\\to x_1\\to z.\n\\]\nОбновление вершины, пока она еще лежит на текущем пути от \\(a\\) к \\(z\\), перепрыгивает через следующую вершину и уменьшает длину этого пути на 1. Вершина начального пути, выпавшая до собственного обновления, заряжается более раннему полезному обновлению соседней предшествующей вершины; одно полезное обновление выбрасывает не более одной вершины. Следовательно, полезных обновлений среди \\(x_1,\\ldots,x_L\\) не меньше \\(\\lfloor L/2\\rfloor\\), и новая длина пути не превосходит \\(L-\\lfloor L/2\\rfloor=\\lceil L/2\\rceil\\).",
