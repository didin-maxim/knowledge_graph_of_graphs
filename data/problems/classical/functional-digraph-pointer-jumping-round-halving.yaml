        "id": "stmt-round-halving",
        "title": "Лемма",
        "text": "Пусть в функциональном ориентированном графе за один раунд каждая вершина обновляется ровно один раз в произвольном порядке: если в момент обновления \\(a\\to b\\to c\\), то стрелка \\(a\\to b\\) заменяется на \\(a\\to c\\). Тогда выполнены два утверждения. Если в начале раунда единственный направленный цикл имеет длину \\(K>1\\), то к концу раунда его длина не превосходит \\(\\lfloor K/2\\rfloor\\). Если же в начале раунда есть петля \\(z\\to z\\) и вершина \\(a\\) находится на расстоянии \\(L\\) от \\(z\\), то к концу раунда расстояние от \\(a\\) до \\(z\\) не превосходит \\(\\lceil L/2\\rceil\\).",
        "source_id": "src-cmo-2025-solutions",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
