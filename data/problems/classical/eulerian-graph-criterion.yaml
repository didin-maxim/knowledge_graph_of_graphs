  "solutions": [
    {
      "id": "sol-cycle-splicing",
      "title": "Алгоритм Хиерхольцера",
      "text": "Если есть эйлеров цикл, при каждом входе в вершину есть выход, поэтому степень каждой вершины четна. Обратно начнем идти из любой вершины по неиспользованным ребрам. Застрять в другой вершине нельзя: там число использованных инцидентных ребер входами и выходами отличается на 1, что противоречит четности после исчерпания. Значит получим цикл. Если остались ребра, из связности есть вершина построенного цикла, инцидентная неиспользованному ребру; строим от нее еще один цикл и вклеиваем. Повторяем до использования всех ребер.",
