  "ideas": [
    {
      "id": "idea-third-edge-forces-triangle",
      "title": "Третье ребро вне звезды замыкает треугольник",
      "text": "Если семейство не является звездой, то, выбрав два ребра с общим концом и третье ребро без этого конца, мы вынуждаем треугольник; после этого любое новое ребро обязано быть одной из его сторон.",
