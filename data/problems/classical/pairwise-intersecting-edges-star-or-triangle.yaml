        "id": "stmt-original-1",
        "text": "Пусть \\(F\\) — конечное множество рёбер простого графа. Предположим, что любые два ребра из \\(F\\) имеют общую вершину. Докажите, что либо все рёбра из \\(F\\) инцидентны одной и той же вершине, либо существует треугольник \\(xyz\\) такой, что каждое ребро из \\(F\\) является одним из рёбер \\(xy,xz,yz\\).",
