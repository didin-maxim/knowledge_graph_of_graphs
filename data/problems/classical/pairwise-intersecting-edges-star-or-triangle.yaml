  "solutions": [
    {
      "id": "sol-star-or-triangle",
      "title": "Либо звезда, либо треугольник",
      "text": "Если все рёбра из \\(F\\) имеют общий конец, то утверждение доказано. Иначе найдутся два ребра \\(xy\\) и \\(xz\\) из \\(F\\) и третье ребро \\(e\\in F\\), не инцидентное вершине \\(x\\). Так как \\(e\\) должно пересекать и \\(xy\\), и \\(xz\\), в простом графе это возможно только при \\(e=yz\\). Значит, в \\(F\\) уже содержатся три стороны треугольника \\(xyz\\). Теперь любое ребро из \\(F\\) обязано пересекать все три рёбра \\(xy,xz,yz\\). В простом графе это возможно только для самих рёбер \\(xy,xz,yz\\). Следовательно, все рёбра из \\(F\\) являются сторонами одного треугольника.",
