  "solutions": [
    {
      "id": "sol-face-counting",
      "title": "Двойной счет граней",
      "text": "Можно считать граф связным, иначе добавление ребер между компонентами не испортит планарность. По формуле Эйлера \\( v-e+f=2 \\). Сумма длин всех граней равна 2e, а в простом планарном графе каждая грань имеет длину хотя бы 3, значит 3f≤2e. Подставляя f=2-v+e, получаем 3(2-v+e)≤2e, откуда e≤3v-6.",
