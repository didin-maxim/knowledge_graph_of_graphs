      "id": "idea-hall-then-remove",
      "title": "Найти совершенное паросочетание и удалить",
      "text": "В регулярном двудольном графе условие Холла следует из подсчёта рёбер из множества левой доли в его соседей. После удаления совершенного паросочетания граф остаётся регулярным меньшей степени.",
