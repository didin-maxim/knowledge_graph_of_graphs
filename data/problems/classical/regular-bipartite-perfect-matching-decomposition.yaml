  "solutions": [
    {
      "id": "sol-hall-induction",
      "title": "Холл и индукция по степени",
      "text": "Пусть доли двудольного графа равны \\(X\\) и \\(Y\\). Так как граф \\(d\\)-регулярен и \\(d>0\\), подсчёт рёбер даёт \\(d|X|=d|Y|\\), значит \\(|X|=|Y|\\). Проверим условие Холла для доли \\(X\\). Для любого множества \\(S\\subseteq X\\) из него выходит ровно \\(d|S|\\) рёбер. Все эти рёбра входят в множество соседей \\(N(S)\\subseteq Y\\), а каждая вершина из \\(N(S)\\) инцидентна не более чем \\(d\\) таким рёбрам. Поэтому \\(d|S|\\le d|N(S)|\\), то есть \\(|S|\\le |N(S)|\\). По теореме Холла существует паросочетание, покрывающее всю долю \\(X\\); поскольку \\(|X|=|Y|\\), оно является совершенным.\n\nУдалим найденное совершенное паросочетание. Степень каждой вершины уменьшится ровно на 1, поэтому оставшийся граф будет \\((d-1)\\)-регулярным и двудольным. Повторяя рассуждение или применяя индукцию по \\(d\\), получаем разбиение всех рёбер исходного графа на \\(d\\) совершенных паросочетаний.",
