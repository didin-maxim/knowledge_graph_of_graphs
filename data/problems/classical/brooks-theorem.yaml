        ]
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph-1",
        "text": "Если связный граф G не является полной кликой и не является нечетным циклом, то \\( \\chi(G) \\le \\\\\\( \\Delta(G) \\) \\), где chi(G) — хроматическое число, а \\( \\Delta(G) \\) — максимальная степень вершины графа.",
        "status": "ai_checked",
