  "solutions": [
    {
      "id": "sol-sketch",
      "title": "Доказательство через жадный порядок",
      "text": "Обозначим \\(\\Delta=\\Delta(G)\\). Случаи \\(\\Delta\\le 2\\) немедленны: связный граф максимальной степени 0 или 1 является полной кликой, а при \\(\\Delta=2\\) это путь или цикл; пути и четные циклы 2-раскрашиваемы, а нечетные циклы ровно исключены. Далее пусть \\(\\Delta\\ge 3\\). Сначала докажем полезный факт: если связный граф H максимальной степени не больше \\(\\Delta\\) имеет вершину r степени меньше \\(\\Delta\\), то H раскрашивается в \\(\\Delta\\) цветов. Действительно, возьмем остовное дерево H с корнем r и упорядочим вершины в порядке невозрастания расстояния от r, а r поставим последней. При жадной раскраске каждая вершина, кроме r, имеет еще не раскрашенного родителя, значит видит не больше \\(\\Delta-1\\) уже раскрашенных соседей; вершина r тоже видит меньше \\(\\Delta\\) соседей. Поэтому свободный цвет всегда есть. Если G не \\(\\Delta\\)-регулярен, применяем этот факт к вершине степени меньше \\(\\Delta\\). Пусть теперь G \\(\\Delta\\)-регулярен. Если в G есть разрезная вершина v, то компоненты графа G-v вместе с v задают связные подграфы \\(G_i\\). В каждом \\(G_i\\) вершина v имеет степень меньше \\(\\Delta\\), поэтому \\(G_i\\) можно раскрасить в \\(\\Delta\\) цветов; перестановкой цветов добиваемся одного и того же цвета у v во всех этих раскрасках и склеиваем их. Остается 2-связный \\(\\Delta\\)-регулярный граф, не являющийся кликой. Докажем лемму Брукса для этого случая: существуют вершины x,y,z, где x и z не смежны, обе смежны с y, и граф \\(G-\\{x,z\\}\\) связен. Если G 3-связен, берем индуцированный путь x-y-z длины 2: он существует, потому что иначе окрестность каждой вершины была бы кликой, а связный регулярный граф с таким свойством был бы полной кликой. Тогда удаление любых двух вершин, в частности x и z, оставляет связный граф. Пусть G не 3-связен. Возьмем вершину y так, что \\(G-y\\) имеет разрезную вершину, и рассмотрим два концевых блока \\(B_1,B_2\\) графа \\(G-y\\). Так как G 2-связен, в каждом \\(B_i\\) есть вершина \\(x_i\\), смежная с y и не являющаяся разрезной вершиной графа \\(G-y\\); иначе единственная точка прикрепления блока отделяла бы его уже в G. Вершины \\(x_1\\) и \\(x_2\\) не смежны, поскольку лежат в разных концевых блоках. Удаление \\(x_1,x_2\\) не разрушает связность: каждый блок графа \\(G-y\\), из которого удалена неразрезная вершина, остается прикрепленным к своему cut-дереву блоков, остальные блоки не меняются, а вершина y имеет еще хотя бы одного соседа, потому что \\(\\Delta\\ge 3\\). Значит можно взять x=\\(x_1\\), z=\\(x_2\\). Лемма доказана. Теперь строим порядок раскраски. Вершины x и z ставим первыми и даем им один цвет; это допустимо, потому что они несмежны. В связном графе \\(G-\\{x,z\\}\\) берем остовное дерево с корнем y и упорядочиваем все остальные вершины, кроме y, в порядке невозрастания расстояния от y; вершину y ставим последней. При жадной раскраске всякая промежуточная вершина имеет еще не раскрашенного родителя на пути к y, поэтому среди уже раскрашенных соседей видит не больше \\(\\Delta-1\\) цветов. Последняя вершина y смежна с x и z, но эти две вершины имеют один и тот же цвет; следовательно, даже если степень y равна \\(\\Delta\\), среди ее соседей использовано не больше \\(\\Delta-1\\) различных цветов. Значит и y получает свободный цвет. Получена правильная раскраска G в \\(\\Delta\\) цветов. Исключенные графы действительно требуют исключения: \\(K_{\\Delta+1}\\) имеет хроматическое число \\(\\Delta+1\\), а нечетный цикл имеет \\(\\Delta=2\\) и хроматическое число 3.",
