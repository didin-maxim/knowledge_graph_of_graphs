  "solutions": [
    {
      "id": "sol-sketch",
      "title": "Схема доказательства",
      "text": "Полное доказательство требует разбора случаев. В олимпиадной версии обычно используется слабая форма: если в связном графе максимальной степени Delta есть вершина, удаление которой оставляет связный граф, и ее соседи можно заставить получить не все Delta цветов, то жадная раскраска в порядке обхода дает Delta-раскраску. Исключения — клики и нечетные циклы — ровно те случаи, где такой маневр невозможен.",
