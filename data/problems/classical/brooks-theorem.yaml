  "solutions": [
    {
      "id": "sol-sketch",
      "title": "Полное доказательство через порядок Ловаса",
      "text": "Рассматриваем конечный связный простой граф и обозначаем \\(\\Delta=\\Delta(G)\\). Цвета будем называть числами \\(1,\\ldots,\\Delta\\). Случаи \\(\\Delta\\le 2\\) просты. При \\(\\Delta=0\\) или \\(1\\) связный граф является соответственно одной вершиной или одним ребром, то есть полным графом. При \\(\\Delta=2\\) связный граф максимальной степени 2 есть путь или цикл; пути и четные циклы 2-раскрашиваемы, а нечетные циклы ровно входят в исключения. Далее считаем, что \\(\\Delta\\ge 3\\).\n\nСначала докажем жадную лемму. Пусть связный граф \\(H\\) имеет максимальную степень не больше \\(\\Delta\\), и в нем есть вершина \\(r\\) степени меньше \\(\\Delta\\). Тогда \\(H\\) можно раскрасить в \\(\\Delta\\) цветов. Возьмем остовное дерево \\(H\\) с корнем \\(r\\) и раскрашиваем вершины в порядке невозрастания расстояния от \\(r\\), оставляя \\(r\\) последней. У любой вершины, отличной от \\(r\\), есть родитель на пути к \\(r\\), и этот родитель еще не раскрашен; значит в момент раскраски такая вершина видит не больше \\(\\Delta-1\\) уже раскрашенных соседей. Вершина \\(r\\) тоже видит меньше \\(\\Delta\\) соседей. Поэтому каждый раз среди \\(\\Delta\\) цветов остается свободный.\n\nЕсли исходный граф \\(G\\) не \\(\\Delta\\)-регулярен, эта лемма сразу применяется к вершине степени меньше \\(\\Delta\\). Поэтому дальше пусть \\(G\\) \\(\\Delta\\)-регулярен. Если в \\(G\\) есть разрезная вершина \\(v\\), то для каждой компоненты \\(C\\) графа \\(G-v\\) рассмотрим подграф \\(G_C\\), порожденный \\(C\\cup\\{v\\}\\). В нем вершина \\(v\\) имеет меньше \\(\\Delta\\) соседей, потому что у \\(v\\) есть соседи как минимум в двух компонентах графа \\(G-v\\). По жадной лемме каждый \\(G_C\\) \\(\\Delta\\)-раскрашиваем. Переставляя названия цветов в отдельных раскрасках, добиваемся одного и того же цвета у \\(v\\), после чего раскраски склеиваются. Остается разобрать случай, когда \\(G\\) 2-связен, \\(\\Delta\\)-регулярен и не является полным графом.\n\nНам нужна лемма Брукса-Ловаса: в таком графе существуют вершины \\(x,y,z\\), для которых \\(x\\) и \\(z\\) не смежны, обе смежны с \\(y\\), а граф \\(G-\\{x,z\\}\\) связен. Докажем ее. Так как \\(G\\) связен и не полон, в нем есть индуцированный путь длины 2: берем две несмежные вершины и кратчайший путь между ними, тогда первые три вершины этого пути дают нужную тройку с несмежными концами. Если \\(G\\) 3-связен, удаление любых двух вершин не нарушает связность, и лемма доказана.\n\nПусть теперь \\(G\\) не 3-связен. Так как \\(G\\) 2-связен, найдутся две вершины \\(y,t\\), удаление которых разъединяет граф; значит \\(G-y\\) связен, но имеет разрезную вершину. Рассмотрим два концевых блока \\(B_1,B_2\\) графа \\(G-y\\). Здесь концевой блок означает лист в дереве блоков: он прикреплен к остальному графу \\(G-y\\) ровно одной разрезной вершиной. В каждом \\(B_i\\) есть вершина \\(x_i\\), которая смежна с \\(y\\) и не является разрезной вершиной графа \\(G-y\\). Иначе, если все соседи \\(y\\) внутри \\(B_i\\) сводились бы к единственной точке прикрепления блока, то удаление этой точки отделяло бы внутренние вершины \\(B_i\\) уже в исходном графе \\(G\\), что противоречит 2-связности.\n\nВершины \\(x_1\\) и \\(x_2\\) не смежны, потому что лежат в разных концевых блоках графа \\(G-y\\). Удаление \\(x_1,x_2\\) не разрушает связность графа \\(G-y\\): мы удаляем из двух листовых блоков неразрезные вершины, а все точки прикрепления и весь остальной блоковый каркас остаются на месте. Вершина \\(y\\) после удаления \\(x_1,x_2\\) тоже остается присоединенной к этому каркасу, поскольку \\(d(y)=\\Delta\\ge 3\\) и удалены только два ее соседа. Значит \\(G-\\{x_1,x_2\\}\\) связен, и можно взять \\(x=x_1\\), \\(z=x_2\\). Лемма доказана.\n\nТеперь завершаем раскраску. Выберем \\(x,y,z\\) из леммы. Сначала красим \\(x\\) и \\(z\\) одним и тем же цветом; это допустимо, потому что они несмежны. В связном графе \\(G-\\{x,z\\}\\) берем остовное дерево с корнем \\(y\\). Все остальные вершины, кроме \\(y\\), раскрашиваем в порядке невозрастания расстояния от \\(y\\), а \\(y\\) оставляем последней. Каждая такая промежуточная вершина в момент своей раскраски имеет еще не раскрашенного родителя на пути к \\(y\\), поэтому видит не больше \\(\\Delta-1\\) уже раскрашенных соседей и получает свободный цвет.\n\nОсталась вершина \\(y\\). Она смежна с \\(x\\) и \\(z\\), но эти два соседа имеют один и тот же цвет. Поэтому даже если \\(d(y)=\\Delta\\), среди соседей \\(y\\) использовано не более \\(\\Delta-1\\) различных цветов. Для \\(y\\) тоже есть свободный цвет, и мы получаем правильную раскраску всего \\(G\\) в \\(\\Delta\\) цветов. Исключения действительно необходимы: полный граф \\(K_{\\Delta+1}\\) требует \\(\\Delta+1\\) разных цветов, а нечетный цикл имеет \\(\\Delta=2\\) и хроматическое число 3.",
