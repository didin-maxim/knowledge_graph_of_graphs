      "id": "idea-greedy-order",
      "title": "Жадная раскраска в правильном порядке",
      "text": "Нужно упорядочить вершины так, чтобы при жадной раскраске каждая вершина, кроме контролируемых исключений, видела меньше Delta уже раскрашенных соседей.",
