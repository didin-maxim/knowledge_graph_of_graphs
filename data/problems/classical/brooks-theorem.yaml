  "statements": {
    "original": [
      {
        "id": "stmt-original-1",
        "text": "Пусть G — связный простой граф, а Delta — наибольшая степень его вершины. Если G не является полным графом и не является нечетным циклом, то вершины G можно правильно раскрасить в Delta цветов.",
        "source_id": "src-wikipedia-brooks",
        "status": "needs_review",
        "self_contained": {
