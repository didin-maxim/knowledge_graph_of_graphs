  "solutions": [
    {
      "id": "sol-even-core-and-double",
      "title": "Чётное ядро и удаление цветовой доли",
      "text": "Рассмотрим данный \\(n\\)-раскрашенный граф \\(G\\). Пока в нём есть вершина нечётной степени, удаляем её. Корректность раскраски при этом не нарушается. Через конечное число шагов получим подграф \\(H\\), в котором каждая вершина имеет чётную степень. Если \\(H\\) уже раскрашивается в \\(n-1\\) цветов, то всё доказано. Иначе зафиксируем в \\(H\\) правильную раскраску в цвета \\(1,\\dots,n\\) с непустой долей цвета \\(n\\). Теперь выполним операцию удвоения. В новом графе \\(D\\) каждая вершина \\(v\\) имеет степень \\(\\deg_H(v)+1\\), следовательно, нечётную. Кроме того, множество всех вершин цвета \\(n\\) в обеих копиях остаётся независимым. Поэтому эти вершины можно удалять одну за другой: удаление одной такой вершины меняет чётность степеней только её соседей, но не затрагивает степени остальных вершин цвета \\(n\\), так как между ними нет рёбер. После удаления всей цветовой доли \\(n\\) остаётся граф, правильно раскрашенный в цвета \\(1,\\dots,n-1\\).",
