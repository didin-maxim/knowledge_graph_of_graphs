      "id": "idea-even-core-then-delete-one-color-class",
      "title": "Сначала делаем все степени чётными, потом уничтожаем один цвет",
      "text": "После удаления всех доступных вершин нечётной степени остаётся граф, в котором все степени чётны. После удвоения степень каждой вершины становится нечётной, и любую фиксированную цветовую долю можно удалить целиком, потому что она остаётся независимой.",
