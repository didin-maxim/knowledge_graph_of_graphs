        "id": "stmt-original-1",
        "text": "Дан конечный простой граф, правильно раскрашенный в \\(n>1\\) цветов. Разрешены две операции: 1) удалить вершину нечётной степени вместе со всеми инцидентными ей рёбрами; 2) заменить текущий граф двумя непересекающимися копиями и добавить ребро между каждой вершиной одной копии и соответствующей вершиной другой. Докажите, что после конечного числа таких операций можно получить граф, правильно раскрашиваемый в \\(n-1\\) цветов.",
