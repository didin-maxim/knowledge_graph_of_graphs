        "id": "stmt-distance-layer-bound",
        "title": "Оценка четвертого слоя",
        "text": "Пусть \\(G\\) — конечный связный неориентированный граф, а \\(M\\ge1\\) — целое число. Для вершины \\(x\\) обозначим \\(L_i(x)=\\{y\\in V(G):\\operatorname{dist}(x,y)=i\\}\\). Если для каждой вершины \\(x\\) выполнено \\(|L_3(x)|\\le M\\), то для каждой вершины \\(x\\) выполнено \\(|L_4(x)|\\le \\left\\lfloor (M+1)^2/4\\right\\rfloor\\).",
