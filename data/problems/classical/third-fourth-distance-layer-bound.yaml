  "ideas": [
    {
      "id": "idea-partition-by-first-neighbor",
      "title": "Разбить четвертый слой по первому соседу",
      "text": "Фиксируем стартовую вершину \\(v\\). Каждую вершину из \\(L_4(v)\\) приписываем одному соседу \\(v\\), через которого идет кратчайший путь длины 4; затем сравниваем размеры получившихся классов с третьими слоями вокруг этих соседей.",
      "tags": [
        "connectivity",
        "double_counting"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-quadratic-maximum",
      "title": "Максимум произведения при равных частях",
      "text": "Если непустых классов \\(q\\), то каждый из них имеет размер не больше \\(M+1-q\\), поэтому весь четвертый слой имеет размер не больше \\(q(M+1-q)\\), а максимум этой квадратичной функции равен \\(\\lfloor(M+1)^2/4\\rfloor\\).",
      "tags": [
        "goal_bound"
