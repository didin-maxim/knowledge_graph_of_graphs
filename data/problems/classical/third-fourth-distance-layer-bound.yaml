  "solutions": [
    {
      "id": "sol-mse-neighbor-partition",
      "title": "Подсчет через разбиение по соседям стартовой вершины",
      "text": "Зафиксируем вершину \\(v\\) и перечислим ее соседей как \\(v_1,\\dots,v_p\\). Построим разбиение слоя \\(L_4(v)\\). Идем по соседям в этом порядке; в класс \\(V_i\\) кладем те еще не распределенные вершины \\(w\\in L_4(v)\\), для которых существует кратчайший путь \\(v-v_i-a-b-w\\). Тогда каждая вершина из \\(L_4(v)\\) попадет ровно в один класс, поэтому \\(|L_4(v)|=\\sum_i |V_i|\\).\n\nОставим только непустые классы и обозначим их размеры через \\(n_1,\\dots,n_q\\). Для фиксированного непустого класса \\(V_i\\) все его \\(n_i\\) вершин лежат на расстоянии 3 от соответствующего соседа \\(v_i\\). Кроме того, каждый другой непустой класс дает еще одну вершину на расстоянии 3 от \\(v_i\\): берем вершину \\(w\\) из этого другого класса и кратчайший путь от его первого соседа до \\(w\\); при переходе от расстояния не больше 2 от \\(v_i\\) к вершине \\(w\\), не принадлежащей классу \\(V_i\\), на этом пути возникает новый свидетель из \\(L_3(v_i)\\). Для разных классов такие свидетели можно выбрать различными, иначе общий свидетель дал бы более раннее присваивание одной из рассматриваемых вершин. Значит, \\(|L_3(v_i)|\\ge n_i+q-1\\).\n\nПо условию \\(|L_3(v_i)|\\le M\\), поэтому \\(n_i+q-1\\le M\\), то есть \\(n_i\\le M+1-q\\) для всех \\(i\\). Следовательно, \\(|L_4(v)|=\\sum_{i=1}^q n_i\\le q(M+1-q)\\). Правая часть как функция целого \\(q\\) не превосходит максимума произведения двух неотрицательных чисел с суммой \\(M+1\\), то есть \\(\\left\\lfloor (M+1)^2/4\\right\\rfloor\\). Вершина \\(v\\) была произвольной, поэтому та же оценка верна для каждого четвертого слоя.",
