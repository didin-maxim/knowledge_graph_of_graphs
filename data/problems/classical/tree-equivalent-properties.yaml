      {
        "id": "stmt-original-1",
        "text": "Для конечного простого графа следующие условия эквивалентны: граф связен и не имеет циклов; граф связен и имеет n-1 ребро, где n — число вершин; между любыми двумя вершинами существует ровно один простой путь.",
