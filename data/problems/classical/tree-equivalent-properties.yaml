    {
      "id": "sol-minimal-connected-subgraph",
      "title": "Доказательство через минимальный связный подграф",
      "text": "Пусть G — связный граф на n вершинах с n-1 ребром. Рассмотрим среди его связных остовных подграфов подграф H с минимальным числом рёбер. Тогда H минимально связен: удаление любого ребра разрушает связность. Но минимально связный граф не содержит циклов, потому что из цикла можно удалить одно ребро и связность сохранится. Значит H — дерево. Для дерева на n вершинах по обычной индукции имеем ровно n-1 ребро. Так как H остовен и H⊆G, но у G уже ровно n-1 ребро, получаем H=G. Следовательно, G само является деревом. В обратную сторону дерево имеет n-1 ребро по удалению листа, а единственность простого пути между любыми двумя вершинами немедленно следует из отсутствия циклов и связности.",
