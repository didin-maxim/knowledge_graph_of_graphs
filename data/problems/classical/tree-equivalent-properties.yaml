  "solutions": [
    {
      "id": "sol-leaf-induction",
      "title": "Доказательство через листья",
      "text": "В ацикличном связном графе любой максимальный простой путь заканчивается листьями, иначе путь можно продолжить или получить цикл. Удалив лист из дерева, получаем дерево на одну вершину меньше. По индукции дерево на n вершинах имеет n-1 ребро. Обратно, связный граф с n-1 ребром не может иметь цикл: удаление ребра из цикла сохранило бы связность и дало связный граф с n-2 ребрами, что невозможно, поскольку связный граф строится добавлением хотя бы одного ребра для каждой новой вершины.",
      "idea_ids": [
        "idea-leaf-induction"
      ],
      "status": "ai_checked",
      "standard_idea_ids": [
        "induction",
        "delete_to_simplify"
      ],
      "definition_ids": [
        "connected_graph",
