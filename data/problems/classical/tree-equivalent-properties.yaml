        "id": "stmt-graph-1",
        "text": "Связный граф на n вершинах является деревом тогда и только тогда, когда имеет n-1 ребро. Эквивалентно, дерево — это связный ацикличный граф, и в нем между любыми двумя вершинами существует единственный простой путь.",
