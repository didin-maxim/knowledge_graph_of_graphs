    {
      "id": "sol-minimal-connected-subgraph",
      "title": "Доказательство через минимальный связный подграф",
      "text": "Обозначим три свойства так: (1) граф связен и не имеет циклов; (2) граф связен и имеет \\(n-1\\) ребро; (3) между любыми двумя вершинами существует ровно один простой путь.\n\nСначала докажем, что (1) влечёт (2). В конечном связном ациклическом графе с \\(n>1\\) есть лист: возьмём длиннейший простой путь, и у его конца не может быть второго соседа, иначе путь продолжился бы или появился бы цикл. Удаление листа сохраняет связность оставшегося графа и уменьшает число вершин и рёбер на 1. Индукция по \\(n\\) даёт, что рёбер ровно \\(n-1\\).\n\nДокажем, что (2) влечёт (1). Рассмотрим среди связных остовных подграфов графа \\(G\\) подграф \\(H\\) с минимальным числом рёбер. Он не содержит циклов, потому что из цикла можно удалить одно ребро и связность сохранится. Значит, по уже доказанному в \\(H\\) ровно \\(n-1\\) ребро. Но в \\(G\\) тоже ровно \\(n-1\\) ребро и \\(H\\subseteq G\\), поэтому \\(H=G\\), то есть \\(G\\) ацикличен.\n\nТеперь (1) влечёт (3): связность даёт хотя бы один путь между двумя вершинами, а два разных простых пути между одной парой вершин вместе содержали бы цикл. Наконец, (3) влечёт (1): существование пути для каждой пары вершин означает связность, а любой цикл давал бы две разные простые дороги между двумя соседними на цикле вершинами. Следовательно, все три свойства эквивалентны.",
