  "solutions": [
    {
      "id": "sol-leaf-induction",
      "title": "Доказательство через листья",
      "text": "Докажем эквивалентность трех свойств для конечного простого графа \\(G\\) на \\(n\\) вершинах: связность и отсутствие циклов; связность и \\(n-1\\) ребро; единственность простого пути между любыми двумя вершинами.\n\nСначала пусть \\(G\\) связен и ацикличен. Если \\(n=1\\), ребер нет. При \\(n>1\\) возьмем максимальный простой путь \\(v_0v_1\\ldots v_k\\). Вершина \\(v_0\\) имеет степень 1: если у нее есть сосед не на этом пути, путь можно продолжить; если она соединена с какой-то \\(v_i\\), \\(i>1\\), возникает цикл. Тот же аргумент для другого конца пути показывает, что \\(v_k\\) тоже лист. Удалим лист \\(v_0\\) и единственное инцидентное ему ребро. Оставшийся граф по-прежнему связен: путь между двумя оставшимися вершинами не мог существенно использовать \\(v_0\\), потому что из листа нельзя выйти дальше. Циклов тоже не появилось. По индукции в оставшемся дереве \\(n-2\\) ребра, значит в \\(G\\) ровно \\(n-1\\) ребро.\n\nТеперь докажем, что всякий связный граф на \\(n\\) вершинах имеет не меньше \\(n-1\\) ребра. Действительно, начав с одной вершины и постепенно добавляя вершины связного графа в порядке их первого присоединения к уже достигнутой части, для каждой из остальных \\(n-1\\) вершин нужно хотя бы одно ребро к ранее добавленной части. Поэтому если связный граф с \\(n-1\\) ребром содержал бы цикл, то удаление любого ребра этого цикла сохранило бы связность и дало бы связный граф с \\(n-2\\) ребрами, что невозможно. Значит связный граф с \\(n-1\\) ребром ацикличен.\n\nОсталось связать это с единственностью пути. Если граф связен и ацикличен, путь между любыми двумя вершинами существует по связности. Двух разных простых путей между теми же вершинами быть не может: идя от одного конца, найдем первую вершину, где пути расходятся, и следующую общую вершину, где они снова встречаются; две разные части путей между этими вершинами образуют цикл. Значит простой путь единственен.\n\nОбратно, если между любыми двумя вершинами существует ровно один простой путь, то граф связен по существованию путей. Цикла в нем нет: на цикле между двумя соседними или несоседними вершинами можно пройти по двум разным дугам цикла, получив два разных простых пути. Следовательно, граф связен и ацикличен. Все три свойства эквивалентны.",
