  "ideas": [
    {
      "id": "idea-three_neighbors_split_odd_cycle",
      "title": "Три соседа разбивают цикл на дуги",
      "text": "Если внешняя вершина имеет на кратчайшем нечётном цикле три соседа, то одна из дуг между соседями даёт меньший нечётный цикл; исключение возможно только для треугольника, но тогда возникает \\(K_4\\).",
