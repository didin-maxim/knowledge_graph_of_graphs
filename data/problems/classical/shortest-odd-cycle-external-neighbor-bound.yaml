  "solutions": [
    {
      "id": "sol-odd-arc-or-k4",
      "title": "Нечётная дуга или \\(K_4\\)",
      "text": "Пусть вершина \\(x\\notin V(C)\\) смежна с тремя различными вершинами \\(a,b,c\\) цикла \\(C\\). Эти вершины разбивают цикл \\(C\\) на три дуги; так как длина \\(C\\) нечётна, хотя бы одна из дуг имеет нечётную длину. Если длина этой дуги больше 1, то вместе с рёбрами от \\(x\\) к её концам она образует нечётный цикл меньшей длины, чем \\(C\\), что невозможно. Следовательно, единственный оставшийся случай — выбранная нечётная дуга имеет длину 1. Тогда \\(C\\) является треугольником, и вершина \\(x\\) смежна со всеми тремя его вершинами. Но это даёт клику \\(K_4\\), запрещённую по условию. Противоречие.",
