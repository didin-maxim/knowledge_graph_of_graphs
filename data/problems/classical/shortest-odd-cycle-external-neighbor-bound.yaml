        "id": "stmt-original-1",
        "text": "Пусть \\(G\\) — простой граф без клики \\(K_4\\), а \\(C\\) — нечётный цикл минимальной длины в \\(G\\). Докажите, что любая вершина графа \\(G\\), не принадлежащая циклу \\(C\\), смежна не более чем с двумя вершинами цикла \\(C\\).",
