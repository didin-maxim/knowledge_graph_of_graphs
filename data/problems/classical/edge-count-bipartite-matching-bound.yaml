  "solutions": [
    {
      "id": "sol-konig-cover-count",
      "title": "Доказательство через покрытие рёбер",
      "text": "Докажем утверждение от противного. Пусть в \\(G\\) нет паросочетания размера \\(r\\), и пусть \\(M\\) — максимальное паросочетание. Тогда \\(|M|\\le r-1\\).\n\nНужен стандартный двудольный факт: в двудольном графе размер максимального паросочетания равен минимальному размеру вершинного покрытия. Напомним его короткое доказательство. Пусть доли равны \\(X,Y\\). От всех непокрытых паросочетанием \\(M\\) вершин доли \\(X\\) отметим вершины, достижимые чередующимися путями: из \\(X\\) идём по рёбрам не из \\(M\\), из \\(Y\\) — по рёбрам из \\(M\\). Если бы отметилась непокрытая вершина доли \\(Y\\), получился бы увеличивающий путь и паросочетание \\(M\\) не было бы максимальным. Пусть \\(Z\\) — множество отмеченных вершин. Тогда \\(C=(X\\setminus Z)\\cup(Y\\cap Z)\\) покрывает все рёбра: ребро из отмеченной вершины \\(X\\) в неотмеченную вершину \\(Y\\) либо сразу отметило бы правый конец, либо, если оно лежит в \\(M\\), показывало бы, что левый конец был достигнут из уже отмеченного правого. Каждое ребро из \\(M\\) имеет ровно один конец в \\(C\\), а непокрытые вершины в \\(C\\) не входят, значит \\(|C|=|M|\\). Меньшее покрытие невозможно, потому что оно должно касаться каждого ребра паросочетания \\(M\\).\n\nИтак, все рёбра \\(G\\) можно покрыть не более чем \\(r-1\\) вершинами. Каждая вершина двудольного графа с долями размера не больше \\(n\\) инцидентна не более чем \\(n\\) рёбрам. Поэтому всего рёбер не больше \\((r-1)n\\), что противоречит условию. Следовательно, паросочетание размера \\(r\\) существует.",
