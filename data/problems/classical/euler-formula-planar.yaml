    "original": [
      {
        "id": "stmt-original-1",
        "text": "Пусть связный граф нарисован на плоскости так, что его ребра не пересекаются вне общих концов. Если V — число вершин, E — число ребер, а F — число областей, на которые рисунок делит плоскость, включая внешнюю область, то \\( V-E+F=2 \\).",
