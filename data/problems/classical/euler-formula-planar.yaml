  ],
  "solutions": [
    {
      "id": "sol-reduce-to-tree",
      "title": "Сведение к дереву",
      "text": "Пока в связном плоском графе есть цикл, удалим ребро этого цикла. Связность не нарушится, число ребер уменьшится на 1, и две грани сольются в одну, так что v-e+f не изменится. В конце получится дерево: у него e=v-1 и f=1, значит v-e+f=v-(v-1)+1=2. Следовательно, равенство было верно и до всех удалений.",
