      "id": "idea-delete-cycle-edge",
      "title": "Удаление ребра из цикла",
      "text": "Удаление ребра, лежащего на цикле, уменьшает и число ребер, и число граней на 1, сохраняя v-e+f.",
      "tags": [
        "planar_graphs",
