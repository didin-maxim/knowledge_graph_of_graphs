        "id": "stmt-quadrangulation-count",
        "title": "Формула для числа четырёхугольников",
        "text": "Пусть связный плоский граф разбивает внутренность многоугольника на \\(q\\) четырёхугольных граней. Пусть на внешней границе графа \\(B\\) вершин, а внутри многоугольника \\(I\\) вершин. Тогда \\(q=I+B/2-1\\).",
