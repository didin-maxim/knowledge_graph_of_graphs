  "solutions": [
    {
      "id": "sol-euler-face-count",
      "title": "Двойной подсчёт граней",
      "text": "Обозначим через \\(V\\), \\(E\\), \\(F\\) числа вершин, рёбер и граней плоского графа, считая внешнюю грань. Тогда \\(V=I+B\\), а \\(F=q+1\\). По формуле Эйлера для связного плоского графа\n\\[\nV-E+F=2,\n\\]\nоткуда\n\\[\nE=I+B+q-1.\n\\]\n\nТеперь посчитаем стороны всех \\(q\\) внутренних четырёхугольных граней. С одной стороны, их \\(4q\\). С другой стороны, каждое внутреннее ребро граничит с двумя внутренними гранями и считается дважды, а каждое граничное ребро внешнего многоугольника считается один раз. Так как внешняя граница имеет \\(B\\) рёбер, получаем\n\\[\n4q=2E-B.\n\\]\nПодставляя найденное значение \\(E\\), имеем\n\\[\n4q=2(I+B+q-1)-B=2I+B+2q-2.\n\\]\nСледовательно, \\(2q=2I+B-2\\), то есть \\(q=I+B/2-1\\).",
