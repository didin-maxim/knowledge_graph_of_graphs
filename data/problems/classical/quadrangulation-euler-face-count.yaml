      "id": "idea-euler-plus-boundary-count",
      "title": "Эйлер плюс подсчёт граничных рёбер",
      "text": "Формула Эйлера выражает число рёбер через \\(I,B,q\\), а подсчёт сторон четырёхугольных граней даёт второе уравнение: внутренние рёбра считаются дважды, а \\(B\\) граничных рёбер — один раз.",
