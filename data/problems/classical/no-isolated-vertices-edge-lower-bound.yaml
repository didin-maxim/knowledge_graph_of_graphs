      "title": "Посчитать степени неизолированных вершин",
      "text": "Если изолирована не более одной вершины, то по крайней мере \\(N-1\\) вершин имеют степень не меньше 1. Поэтому сумма степеней не меньше \\(N-1\\), а каждое ребро даёт в эту сумму ровно 2.",
