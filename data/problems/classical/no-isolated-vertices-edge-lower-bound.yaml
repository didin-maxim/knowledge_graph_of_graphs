      "id": "sol-degree-sum",
      "title": "Доказательство через сумму степеней",
      "text": "Обозначим через \\(e\\) число рёбер графа \\(H\\). По условию в \\(H\\) не более одной изолированной вершины, значит как минимум \\(N-1\\) вершин имеют степень не меньше 1. Поэтому сумма степеней всех вершин не меньше \\(N-1\\). По лемме о рукопожатиях эта сумма равна \\(2e\\), следовательно \\(2e\\ge N-1\\). Так как \\(e\\) — целое число, получаем \\(e\\ge \\lceil (N-1)/2\\rceil\\).",
