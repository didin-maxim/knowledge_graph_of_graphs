    {
      "id": "idea-used-pair-blocks-crossing",
      "title": "Использованная соседняя пара блокирует переход",
      "text": "После того как путь прошёл через два соседних значения \\(m\\) и \\(m+1\\), перейти позже с чисел \\(\\le m-1\\) на числа \\(\\ge m+2\\) невозможно: ближайшие промежуточные значения уже использованы, а прямой скачок имеет длину не меньше 3.",
