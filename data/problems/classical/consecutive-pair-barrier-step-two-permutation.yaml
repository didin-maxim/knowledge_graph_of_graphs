  "statements": {
    "original": [
      {
        "id": "stmt-original",
        "text": "Пусть \\(a_1,a_2,\\ldots,a_n\\) — перестановка чисел \\(1,2,\\ldots,n\\), в которой \\(|a_i-a_{i+1}|\\le 2\\) для всех \\(i\\). Если для некоторого \\(k<n\\) числа \\(a_k\\) и \\(a_{k+1}\\) являются соседними целыми числами, то все члены справа от \\(a_{k+1}\\) лежат по одну сторону от этой пары: они либо все меньше \\(\\min(a_k,a_{k+1})\\), либо все больше \\(\\max(a_k,a_{k+1})\\).",
