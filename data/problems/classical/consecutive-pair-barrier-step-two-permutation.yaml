  "solutions": [
    {
      "id": "sol-gap-crossing-contradiction",
      "title": "Противоречие по первому переходу через зазор",
      "text": "Обозначим соседнюю пару через \\(m,m+1\\). Предположим, что справа от неё встречаются числа по обе стороны: хотя бы одно число не больше \\(m-1\\) и хотя бы одно число не меньше \\(m+2\\). Двигаясь по хвосту перестановки справа от этой пары, рассмотрим первый момент, когда последовательность переходит с одной стороны зазора \\(m,m+1\\) на другую. Этот переход не может использовать сами числа \\(m\\) и \\(m+1\\), потому что они уже стоят в позициях \\(k\\) и \\(k+1\\). Значит, два соседних члена хвоста имеют вид \\(x\\le m-1\\) и \\(y\\ge m+2\\), или наоборот. Тогда \\(|x-y|\\ge 3\\), что противоречит условию \\(|a_i-a_{i+1}|\\le 2\\). Следовательно, все члены справа от пары лежат по одну сторону от неё.",
