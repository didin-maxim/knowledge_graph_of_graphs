  "statements": {
    "original": [
      {
        "id": "stmt-original-1",
        "text": "Вершины любого простого планарного графа можно правильно раскрасить не более чем в пять цветов: любые две соседние вершины должны получить разные цвета.",
        "source_id": "src-wikipedia-five-color",
        "status": "needs_review",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [
          "simple_graph",
          "planar_graph",
          "chromatic_number"
        ]
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph-1",
        "text": "Для любого простого планарного графа G выполнено \\( \\chi(G) \\le 5 \\), где chi(G) — минимальное число цветов в правильной раскраске вершин графа.",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [
          "simple_graph",
          "planar_graph",
          "chromatic_number"
        ]
      }
    ],
    "olympiad_reformulations": [
      {
        "id": "stmt-map-five-colors",
        "title": "Раскраска карты",
        "text": "Плоская карта разбита на области. Нужно раскрасить все области не более чем в пять цветов так, чтобы любые две области, имеющие общую границу ненулевой длины, были разных цветов. Такая раскраска существует для любой плоской карты.",
        "source_id": "src-wikipedia-five-color",
