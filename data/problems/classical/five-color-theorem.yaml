      "title": "Две непересекающиеся цепи не могут скреститься",
      "text": "Если двухцветная цепь между первым и третьим соседями вместе с удаленной вершиной образует замкнутую кривую, то второй и четвертый соседи оказываются по разные стороны этой кривой; поэтому цепь между ними в двух других цветах невозможна.",
