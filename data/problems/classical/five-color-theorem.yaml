  "solutions": [
    {
      "id": "sol-kempe-sketch",
      "title": "Доказательство через цепи Кемпе",
      "text": "Доказываем индукцией по числу вершин. По оценке e<=3v-6 в планарном графе есть вершина x степени не больше 5. Удалим ее и раскрасим оставшийся граф в пять цветов. Если среди соседей x использованы не все цвета, красим x свободным цветом. Иначе у x пять соседей в циклическом порядке с цветами 1,...,5. Рассмотрим компоненту цветов 1 и 3, содержащую соседа цвета 1. Если она не содержит соседа цвета 3, меняем в ней цвета 1 и 3 и освобождаем цвет 1. Если содержит, планарность запрещает одновременно путь цветов 2 и 4 между соответствующими соседями; значит аналогично освобождаем один из цветов.",
