        "id": "stmt-map-five-colors",
        "title": "Раскраска карты",
        "text": "Плоская карта разбита на области. Нужно раскрасить все области не более чем в пять цветов так, чтобы любые две области, имеющие общую границу ненулевой длины, были разных цветов. Такая раскраска существует для любой плоской карты.",
