  "solutions": [
    {
      "id": "sol-switching-induction",
      "title": "Доказательство через переключение рёбер",
      "text": "Пусть последовательность \\(d_1\\ge d_2\\ge\\cdots\\ge d_n\\) графична. Рассмотрим любую реализацию этой последовательности простым графом и обозначим вершину степени \\(d_1\\) через \\(v_1\\). Среди остальных вершин выберем \\(d_1\\) вершин наибольших степеней; при равенстве степеней договоримся ставить соседей \\(v_1\\) раньше несоседей. Обозначим эти вершины через \\(v_2,\\ldots,v_{d_1+1}\\). Нам нужно показать, что существует реализация, где \\(v_1\\) соединена именно с ними.\n\nСреди всех реализаций с такой договоренностью выберем ту, где число соседей \\(v_1\\) внутри множества \\(\\{v_2,\\ldots,v_{d_1+1}\\}\\) максимально. Если оно уже равно \\(d_1\\), все хорошо. Иначе найдется вершина \\(x\\) среди \\(v_2,\\ldots,v_{d_1+1}\\), не соединенная с \\(v_1\\), и найдется сосед \\(y\\) вершины \\(v_1\\) вне этого множества. По выбору порядка степень \\(x\\) не меньше степени \\(y\\); более того, если степени равны, то сосед \\(y\\) был бы поставлен раньше несоседа \\(x\\). Поэтому на самом деле \\(d(x)>d(y)\\).\n\nИз \\(d(x)>d(y)\\) следует, что существует вершина \\(z\\), смежная с \\(x\\), но не смежная с \\(y\\). При этом \\(z\\ne v_1\\), потому что \\(x\\) не смежна с \\(v_1\\), и \\(z\\ne y\\), потому что граф простой. Теперь удалим ребра \\(v_1y\\) и \\(xz\\), а вместо них добавим \\(v_1x\\) и \\(yz\\). Новые ребра раньше отсутствовали: \\(v_1x\\) отсутствовало по выбору \\(x\\), а \\(yz\\) отсутствовало по выбору \\(z\\). Степени всех затронутых вершин сохранились, но у \\(v_1\\) стало на одного соседа больше среди выбранных \\(d_1\\) вершин. Это противоречит максимальности реализации.\n\nЗначит существует реализация, где \\(v_1\\) соединена с вершинами \\(v_2,\\ldots,v_{d_1+1}\\). Удалив \\(v_1\\), мы уменьшаем степени этих \\(d_1\\) вершин на 1 и получаем граф с остаточной последовательностью. Это доказывает необходимость шага Хавела-Хакими. Обратно, если остаточная последовательность реализована графом на вершинах \\(v_2,\\ldots,v_n\\), то добавим новую вершину \\(v_1\\) и соединим ее с \\(v_2,\\ldots,v_{d_1+1}\\). Тогда степени станут ровно исходными. Повторяя шаг, получаем алгоритм: последовательность графична тогда и только тогда, когда редукции доводят ее до всех нулей без отрицательных чисел.",
