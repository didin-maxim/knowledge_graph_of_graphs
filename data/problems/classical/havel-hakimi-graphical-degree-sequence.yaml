        "id": "stmt-algorithm",
        "title": "Алгоритмическая форма",
        "text": "Чтобы проверить, можно ли задать простой граф с данными степенями вершин, каждый раз берут наибольшую оставшуюся степень \\(d\\), соединяют соответствующую вершину с \\(d\\) вершинами наибольших оставшихся степеней и уменьшают эти \\(d\\) степеней на 1. Исходная последовательность графична тогда и только тогда, когда этот процесс заканчивается всеми нулями и нигде не требует отрицательной степени.",
