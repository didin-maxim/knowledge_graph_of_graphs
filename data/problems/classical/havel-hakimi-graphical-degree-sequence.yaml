        "id": "stmt-original-1",
        "title": "Один шаг Хавела-Хакими",
        "text": "Пусть \\(d_1\\ge d_2\\ge\\cdots\\ge d_n\\ge 0\\). Последовательность \\((d_1,d_2,\\ldots,d_n)\\) является последовательностью степеней некоторого простого графа тогда и только тогда, когда последовательность \\((d_2-1,d_3-1,\\ldots,d_{d_1+1}-1,d_{d_1+2},\\ldots,d_n)\\), после удаления нулей и упорядочивания, является последовательностью степеней простого графа. Если \\(d_1>n-1\\) или среди первых \\(d_1\\) оставшихся чисел после вычитания появляется отрицательное, последовательность не графична.",
