        "title": "Нижняя оценка на путь",
        "text": "Пусть \\(G\\) — конечный простой граф с хроматическим числом \\(\\chi(G)\\). Тогда в любой ориентации рёбер графа \\(G\\) есть ориентированный путь, содержащий не меньше \\(\\chi(G)-1\\) рёбер.",
