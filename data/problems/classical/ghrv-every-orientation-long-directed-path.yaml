  "solutions": [
    {
      "id": "sol-path-potential-coloring",
      "title": "Раскраска длинами путей",
      "text": "Зафиксируем произвольную ориентацию \\(D\\) графа \\(G\\). Для вершины \\(v\\) обозначим через \\(a(v)\\) максимальное число рёбер в ориентированном пути, который заканчивается в \\(v\\). Если в \\(D\\) есть дуга \\(u\\to v\\), то любой максимальный путь, заканчивающийся в \\(u\\), можно продолжить этой дугой, поэтому \\(a(v)\\ge a(u)+1\\). Значит, значения \\(a\\) на концах любого ребра различны. Следовательно, раскраска вершины \\(v\\) в цвет \\(a(v)+1\\) является правильной раскраской графа \\(G\\). Если бы все ориентированные пути имели меньше \\(\\chi(G)-1\\) рёбер, то все значения \\(a(v)\\) были бы не больше \\(\\chi(G)-2\\), и мы получили бы правильную раскраску графа в не более чем \\(\\chi(G)-1\\) цветов. Это противоречит определению хроматического числа. Поэтому в данной ориентации существует ориентированный путь длины хотя бы \\(\\chi(G)-1\\).",
