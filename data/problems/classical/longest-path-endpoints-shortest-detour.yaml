  "solutions": [
    {
      "id": "sol-cycle-longer-than-path",
      "title": "Цикл длиннее максимального пути",
      "text": "Пусть кратчайший путь \\(Q\\) имеет хотя бы одну внутреннюю вершину. Так как внутренние вершины \\(Q\\) не лежат на \\(P\\), объединение \\(P\\cup Q\\) содержит цикл, проходящий по всем вершинам \\(P\\) и по внутренним вершинам \\(Q\\). Число вершин этого цикла равно \\(|V(P)|+|V(Q)|-2>|V(P)|\\). Удалив из цикла любое ребро, получаем простой путь с большим числом вершин, чем у \\(P\\). Это противоречит максимальности \\(P\\). Следовательно, у \\(Q\\) нет внутренних вершин, и потому \\(Q\\) является ребром \\(v_1v_p\\).",
