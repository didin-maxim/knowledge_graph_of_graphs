  "ideas": [
    {
      "id": "idea-two_endpoint_paths_make_longer_cycle",
      "title": "Два непересекающихся пути между концами дают слишком длинный цикл",
      "text": "Если обход между концами максимального пути имеет хотя бы одну внутреннюю вершину, объединение двух путей образует цикл, содержащий больше вершин, чем исходный путь; из такого цикла извлекается более длинный путь.",
