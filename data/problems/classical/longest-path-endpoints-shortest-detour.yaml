    "original": [
      {
        "id": "stmt-original-1",
        "text": "Пусть \\(G\\) — связный простой граф, а \\(P=v_1v_2\\dots v_p\\) — простой путь максимальной длины в \\(G\\). Предположим, что существует кратчайший путь \\(Q\\) из \\(v_1\\) в \\(v_p\\), все внутренние вершины которого не лежат на \\(P\\). Докажите, что путь \\(Q\\) состоит из одного ребра, то есть \\(v_1v_p\\in E(G)\\).",
