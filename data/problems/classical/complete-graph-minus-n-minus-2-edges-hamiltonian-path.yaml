      "id": "idea-common-neighbor-connectivity",
      "title": "Сумма степеней даёт общего соседа",
      "text": "Так как удалено мало рёбер, для любых двух вершин \\(a,b\\) остаётся \\(\\deg a+\\deg b\\ge n\\). Отсюда у них есть общий сосед, а значит граф связен.",
