    {
      "id": "idea-longest-path-closes-cycle",
      "title": "Длиннейший путь замыкается в цикл",
      "text": "У концов длиннейшего пути все соседи лежат на самом пути. Большая сумма степеней концов заставляет два подходящих ребра к внутренним вершинам, которые замыкают вершины пути в цикл. Связность затем запрещает вершины вне пути.",
