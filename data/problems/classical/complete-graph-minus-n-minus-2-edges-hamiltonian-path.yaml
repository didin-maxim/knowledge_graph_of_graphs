  "solutions": [
    {
      "id": "sol-official-longest-path",
      "title": "Доказательство длиннейшим путём",
      "text": "Возьмём любые две вершины \\(a\\) и \\(b\\). В полном графе каждая из них имела степень \\(n-1\\). При удалении не более \\(n-2\\) рёбер сумма \\(\\deg a+\\deg b\\) уменьшается не более чем на \\(n-2\\), если считать только те удалённые рёбра, которые касаются хотя бы одной из этих двух вершин. Поэтому\n\\[\n\\deg a+\\deg b\\ge 2(n-1)-(n-2)=n.\n\\]\nЕсли бы у \\(a\\) и \\(b\\) не было общего соседа, то сумма их степеней была бы не больше \\(n-1\\). Значит, любые две вершины имеют общего соседа; в частности, граф связен.\n\nПусть \\(P:u=u_0,u_1,\n\\ldots,u_k=v\\) — длиннейший простой путь в \\(G\\). Все соседи \\(u\\) и \\(v\\) лежат среди вершин этого пути: иначе путь можно было бы продлить. Запишем соседей \\(u\\) на пути как \\(u_{i_1},\\ldots,u_{i_x}\\), где \\(1=i_1<\\cdots<i_x\\), а соседей \\(v\\) как \\(u_{j_1},\\ldots,u_{j_y}\\). Из оценки \\(x+y=\\deg u+\n\\deg v\\ge n\\) следует, что найдётся индекс \\(i\\), для которого есть рёбра \\(u u_{i+1}\\) и \\(u_i v\\). Тогда вершины пути \\(P\\) образуют цикл: идём от \\(u_{i+1}\\) назад к \\(u\\), затем по пути до \\(u_i\\), затем по ребру к \\(v\\), а после этого назад по пути до \\(u_{i+1}\\).\n\nЕсли какая-то вершина \\(w\\) не лежит на \\(P\\), то по связности существует путь от \\(w\\) к одной из вершин полученного цикла. Пройдя от \\(w\\) до цикла и затем по циклу через все вершины \\(P\\), получаем простой путь длиннее \\(P\\). Это противоречие. Следовательно, \\(P\\) проходит через все вершины графа, то есть является гамильтоновым путём.",
