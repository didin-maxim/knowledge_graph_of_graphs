  "solutions": [
    {
      "id": "sol-prufer-bijection",
      "title": "Биекция с последовательностями",
      "text": "Опишем кодирование дерева. Пока в дереве осталось больше двух вершин, возьмем лист с наименьшей меткой, запишем метку его единственного соседа и удалим этот лист. За один шаг число вершин уменьшается на 1, поэтому после \\(n-2\\) шагов останутся две вершины, а записанный код будет последовательностью длины \\(n-2\\) из чисел от 1 до \\(n\\).\n\nТеперь покажем, что по любой такой последовательности код восстанавливается единственным образом. Пусть дана последовательность \\(a_1,a_2,\\ldots,a_{n-2}\\). На первом шаге лист, который был удален при кодировании, не может встречаться в последовательности: если вершина когда-либо записывается, значит в тот момент она была соседом удаляемого листа и сама еще не удалялась. Поэтому первым удаленным листом должна быть наименьшая метка, не встречающаяся среди \\(a_1,\\ldots,a_{n-2}\\). Соединим эту вершину с \\(a_1\\) и удалим ее из списка оставшихся меток. Затем забудем первый член кода и повторим ту же операцию для хвоста \\(a_2,\\ldots,a_{n-2}\\). Когда код закончится, останутся две метки; соединим их последним ребром.\n\nПостроенный граф имеет \\(n\\) вершин и ровно \\(n-1\\) ребро. Он связен: каждая удаленная на каком-то шаге вершина получает ребро к вершине, которая на тот момент остается жить дальше, а две последние вершины соединяются между собой; двигаясь по этим ребрам, из любой вершины можно дойти до одной из последних двух. Следовательно, это дерево.\n\nОсталось проверить, что процедуры обратны друг другу. В восстановленном дереве вершина, выбранная на первом шаге восстановления, является листом и имеет наименьшую метку среди всех листьев: остальные метки, не встречающиеся в коде, не меньше ее, а метки, встречающиеся в коде, еще должны быть записаны как соседи и потому не могут быть удалены раньше. Значит кодирование восстановленного дерева сначала удалит именно эту вершину и запишет \\(a_1\\). После удаления первого ребра остается та же задача для хвоста кода. По индукции все последующие шаги также совпадают. Поэтому деревья на метках \\(1,\\ldots,n\\) взаимно однозначно соответствуют \\(n^{n-2}\\) последовательностям длины \\(n-2\\), и число таких деревьев равно \\(n^{n-2}\\).",
