  "solutions": [
    {
      "id": "sol-regularization-hall",
      "title": "Доказательство через Холла",
      "text": "Пусть \\(k=\\Delta(G)\\). Нижняя оценка очевидна: все рёбра, выходящие из вершины степени \\(k\\), должны иметь разные цвета, поэтому нужно не меньше \\(k\\) цветов.\n\nДокажем верхнюю оценку. Сначала докажем лемму: всякий \\(k\\)-регулярный двудольный граф с долями \\(X\\) и \\(Y\\) имеет совершенное паросочетание. Так как сумма степеней в обеих долях равна числу рёбер, имеем \\(k|X|=k|Y|\\), значит при \\(k>0\\) доли равны по размеру. Проверим условие Холла. Для любого \\(A\\subseteq X\\) из вершин \\(A\\) выходит ровно \\(k|A|\\) рёбер. Все они приходят в множество соседей \\(N(A)\\), а каждая вершина из \\(N(A)\\) принимает не больше \\(k\\) таких рёбер. Поэтому \\(k|A|\\le k|N(A)|\\), то есть \\(|N(A)|\\ge |A|\\). По теореме Холла существует паросочетание, покрывающее всю долю \\(X\\), а значит и всю долю \\(Y\\).\n\nТеперь из \\(k\\)-регулярного двудольного графа удалим найденное совершенное паросочетание. Степень каждой вершины уменьшится ровно на 1, поэтому останется \\((k-1)\\)-регулярный двудольный граф. Повторяя, разложим все рёбра на \\(k\\) совершенных паросочетаний. Если каждому паросочетанию дать свой цвет, то рёбра одного цвета не имеют общих концов, то есть получена правильная рёберная раскраска в \\(k\\) цветов.\n\nОсталось свести общий двудольный граф \\(G=(X,Y,E)\\) максимальной степени \\(\\Delta\\) к регулярному случаю. При необходимости добавим фиктивные вершины в меньшую долю, чтобы доли стали равными. Затем будем добавлять фиктивные рёбра между вершинами степени меньше \\(\\Delta\\) из разных долей. Если нужное ребро уже было, временно разрешим параллельное фиктивное ребро; это безвредно для рёберной раскраски, потому что параллельные рёбра всё равно должны получить разные цвета. Суммарный дефицит степеней в двух долях одинаков после выравнивания долей, поэтому процесс заканчивается \\(\\Delta\\)-регулярным двудольным мультиграфом. Его рёбра раскрашиваются в \\(\\Delta\\) цветов тем же рассуждением через Холла, которое работает и для двудольных мультиграфов. Удалив фиктивные рёбра и вершины, получаем раскраску исходного графа теми же \\(\\Delta\\) цветами.",
