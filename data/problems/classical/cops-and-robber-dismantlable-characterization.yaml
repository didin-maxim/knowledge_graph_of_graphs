        "id": "stmt-cop-win-iff-dismantlable",
        "title": "Характеризация графов, где хватает одного полицейского",
        "text": "Пусть \\(G\\) -- конечный непустой простой граф. Сначала полицейский выбирает начальную вершину, затем разбойник выбирает свою. После этого они ходят по очереди, начиная с полицейского; за ход разрешается остаться на месте или перейти в соседнюю вершину. Оба игрока всегда видят положение друг друга. Полицейский выигрывает, как только оказывается в одной вершине с разбойником.\n\nДля вершины \\(v\\) обозначим через \\(N[v]\\) её замкнутую окрестность: саму вершину и всех её соседей. Граф называется разбираемым, если его вершины можно занумеровать \\(v_1,\\ldots,v_m\\) так, что для каждого \\(i<m\\) в подграфе, индуцированном вершинами \\(v_i,\\ldots,v_m\\), найдётся \\(j>i\\), для которого \\(N[v_i]\\subseteq N[v_j]\\) в этом подграфе.\n\nТеорема Новаковского--Винклера: один полицейский имеет выигрышную стратегию на \\(G\\) тогда и только тогда, когда \\(G\\) разбираем.",
        "source_id": "src-nowakowski-winkler-cop-win-graphs",
        "status": "source_verified",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [
