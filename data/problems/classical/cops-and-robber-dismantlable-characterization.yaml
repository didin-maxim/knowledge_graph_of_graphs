  "ideas": [
    {
      "id": "idea-dominated-vertex-fold",
      "title": "Доминируемую вершину можно свернуть",
      "text": "Условие \\(N[v_i]\\subseteq N[v_j]\\) означает, что вершина \\(v_j\\) может служить тенью вершины \\(v_i\\): всякий допустимый ход из \\(v_i\\) можно отразить ходом из \\(v_j\\). Последовательное удаление таких вершин и даёт структурный сертификат победы одного полицейского.",
