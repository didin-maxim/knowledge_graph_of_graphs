        "id": "stmt-original",
        "title": "Верхняя оценка через раскраску",
        "text": "Пусть \\(G\\) — конечный простой граф, правильно раскрашенный в \\(k\\) цветов. Тогда рёбра графа \\(G\\) можно ориентировать так, что каждый ориентированный путь содержит не больше \\(k-1\\) рёбер. В частности, существует ориентация графа \\(G\\), в которой каждый ориентированный путь имеет длину не больше \\(\\chi(G)-1\\).",
