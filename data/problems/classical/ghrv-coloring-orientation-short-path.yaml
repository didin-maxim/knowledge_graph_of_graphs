      "id": "sol-monotone-colors",
      "title": "Монотонность цветов",
      "text": "Пронумеруем цвета числами \\(1,2,\\ldots,k\\). Каждое ребро между вершинами цветов \\(i\\) и \\(j\\) ориентируем от вершины меньшего цвета к вершине большего цвета. Правильность раскраски гарантирует, что концы ребра имеют разные цвета, поэтому ориентация определена корректно. Вдоль любого ориентированного пути цвет вершины на каждом шаге строго увеличивается. Значит, такой путь проходит через вершины попарно различных цветов в возрастающем порядке и содержит не больше \\(k\\) вершин, то есть не больше \\(k-1\\) рёбер. Применяя это к правильной раскраске в \\(\\chi(G)\\) цветов, получаем ориентацию, в которой все ориентированные пути имеют длину не больше \\(\\chi(G)-1\\).",
