  "solutions": [
    {
      "id": "sol-exact-r34",
      "title": "Доказательство верхней и нижней оценки",
      "text": "Докажем сначала верхнюю оценку. Пусть \\(G\\) — простой граф на 9 вершинах. Достаточно доказать, что в \\(G\\) есть треугольник или независимое множество из 4 вершин.\n\nЕсли у некоторой вершины \\(v\\) есть хотя бы 4 соседа, возьмём четыре из них. Если среди этих четырёх соседей есть ребро, то вместе с \\(v\\) оно образует треугольник. Если же рёбер между ними нет, то эти четыре вершины образуют независимое множество.\n\nОстаётся случай, когда все степени в \\(G\\) не превосходят 3. Сумма степеней равна удвоенному числу рёбер, поэтому она чётна. Если бы все 9 степеней были равны 3, сумма была бы равна 27, что невозможно. Значит, найдётся вершина \\(v\\) степени не больше 2. Тогда в дополнительном графе \\(\\overline G\\) вершина \\(v\\) имеет не меньше 6 соседей. По уже известному факту \\(R(3,3)=6\\), среди этих 6 соседей в \\(\\overline G\\) есть либо треугольник, либо независимая тройка. Треугольник в \\(\\overline G\\) вместе с \\(v\\) даёт независимое множество из 4 вершин в \\(G\\). Независимая тройка в \\(\\overline G\\) означает треугольник в \\(G\\). Верхняя оценка доказана.\n\nТеперь построим пример на 8 вершинах. Возьмём цикл \\(0,1,2,\\ldots,7,0\\) и добавим четыре ребра между противоположными вершинами: \\((0,4),(1,5),(2,6),(3,7)\\). Треугольника нет: две соседние вершины цикла не имеют общего соседа, который дал бы третью сторону треугольника, а противоположная хорда соединяет вершины одной чётности и не замыкается с двумя рёбрами цикла в треугольник. Независимое множество из 4 вершин в одном цикле \\(C_8\\) могло бы быть только одним из двух классов чётности: \\(\\{0,2,4,6\\}\\) или \\(\\{1,3,5,7\\}\\). Но в каждом из них есть добавленная хорда: соответственно \\((0,4),(2,6)\\) или \\((1,5),(3,7)\\). Значит, независимой четвёрки тоже нет. Поэтому \\(R(3,4)>8\\), а вместе с верхней оценкой \\(R(3,4)=9\\).",
