  "solutions": [
    {
      "id": "sol-bound-and-even-exact",
      "title": "Оценка и точность при Delta = 2m",
      "text": "Верхняя оценка следует из теоремы Беньямини — Цалика: если максимальная степень не превосходит Delta, то число кратчайших путей между вершинами на расстоянии t не больше 2(Delta/2)^t. В частности, при Delta = 2m получаем верхнюю оценку 2m^t.\n\nДля олимпиадной версии остаётся показать достижимость. Возьмём два внутренне непересекающихся пути длины t от x к y и заменим каждое ребро каждого пути на m параллельных рёбер. Степень каждой вершины не превосходит 2m, расстояние от x до y равно t, а каждый из двух путей даёт m^t кратчайших путей. Итого получается 2m^t кратчайших путей, значит максимум в случае Delta = 2m равен 2m^t.\n\nЕсли нужно самодостаточное доказательство верхней оценки в чётном случае, можно использовать послойный вариант из карточки Кубка Колмогорова. После удаления рёбер, не лежащих на кратчайших путях, для вершины v среднего слоя обозначим через in(v) и out(v) количества рёбер, входящих в этот слой и выходящих из него. Из in(v)+out(v) ≤ 2m следует in(v)out(v) ≤ m^2. Суммы S_i = sum out(v)p(v)^2 по слоям, где p(v) — число кратчайших путей от x до v, удовлетворяют S_i ≤ m^2 S_{i-1}; два применения неравенства Коши дают p(y) ≤ 2m^t.",
