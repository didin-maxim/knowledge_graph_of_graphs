  "solutions": [
    {
      "id": "sol-paper-bound",
      "title": "Compressed paper proof",
      "text": "Удалим все рёбра и вершины, не лежащие на кратчайших путях из \\(x\\) в \\(y\\). Оставшийся граф разбивается на слои по расстоянию от \\(x\\). Если \\(p(v)\\) — число кратчайших путей из \\(x\\) в \\(v\\), то переход между двумя соседними слоями оценивается неравенством Коши — Буняковского и ограничением на степени. Итерируя это послойное неравенство, получаем не более \\(2(\\Delta/2)^t\\) кратчайших путей из \\(x\\) в \\(y\\). Экстремальная конструкция состоит из двух внутренне непересекающихся цепочек длины \\(t\\), где на каждом шаге есть \\(\\Delta/2\\) параллельных вариантов выбора.",
