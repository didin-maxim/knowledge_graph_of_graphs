        "id": "stmt-lehman-criterion",
        "title": "Критерий победы соединяющего игрока вторым ходом",
        "text": "Пусть \\(G\\) -- конечный связный мультиграф. Два игрока по очереди забирают ещё не занятые рёбра, по одному за ход; первым ходит Разрушитель, вторым -- Соединитель. Ребро Разрушителя считается удалённым, а ребро Соединителя -- закреплённым. После распределения всех рёбер Соединитель выигрывает, если его закреплённые рёбра содержат связный остовный подграф, то есть остовное дерево.\n\nДокажите критерий Лемана: Соединитель, играя вторым, имеет выигрышную стратегию тогда и только тогда, когда \\(G\\) содержит два не имеющих общих рёбер остовных дерева.",
