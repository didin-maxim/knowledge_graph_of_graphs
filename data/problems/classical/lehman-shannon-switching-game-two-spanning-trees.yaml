  "solutions": [
    {
      "id": "sol-lehman-induction",
      "title": "Доказательство стратегическим заимствованием и стягиванием",
      "text": "Сначала докажем необходимость. Предположим, что у Соединителя есть выигрышная стратегия \\(S\\) при игре вторым. Построим одну полную партию, в которой связные остовные подграфы получат оба игрока. Разрушитель первым берёт произвольное ребро. Далее Соединитель играет по \\(S\\) обычным образом, считая ходы Разрушителя ходами соперника. Разрушитель со своего второго хода тоже применяет \\(S\\), но с переставленными ролями: ходы Соединителя он считает ходами первого игрока. Его самое первое ребро при этом служит дополнительным бонусом. Если воображаемая стратегия попросит взять уже принадлежащее ему бонусное ребро, Разрушитель берёт любое свободное ребро и продолжает считать требуемое ребро уже полученным; наличие лишнего своего ребра не может помешать монотонной цели связности.\n\nСтратегия \\(S\\) гарантирует, что в конце реальные рёбра Соединителя содержат связный остовный подграф. Та же стратегия с переставленными ролями гарантирует это для рёбер Разрушителя. Из каждого из двух непересекающихся наборов выберем по остовному дереву. Получатся два остовных дерева без общих рёбер.\n\nТеперь докажем достаточность индукцией по числу вершин. При стягивании ребра параллельное ему ребро может превратиться в петлю. Поэтому индукционное утверждение временно рассматриваем для мультиграфов, в которых разрешены петли: петля никогда не входит в остовное дерево и остаётся обычным игровым ребром. Если Разрушитель выбирает петлю, это ровно случай \\(e\\notin T_1\\cup T_2\\) ниже; Соединитель отвечает ребром дерева, а выбранная петля удаляется. Сам Соединитель петель не выбирает. Таким образом, все промежуточные стягивания входят в область индукции. Для графа из одной вершины утверждение очевидно. Пусть в \\(G\\) есть два непересекающихся по рёбрам остовных дерева \\(T_1,T_2\\), и Разрушитель первым берёт ребро \\(e\\).\n\nЕсли \\(e\\in T_1\\), то лес \\(T_1-e\\) имеет две компоненты. Дерево \\(T_2\\) связно, поэтому в нём есть ребро \\(f\\), соединяющее эти компоненты. Соединитель закрепляет \\(f\\). Удалим \\(e\\) и стянем \\(f\\). Образ \\(T_1-e\\) после стягивания является остовным деревом меньшего мультиграфа: две его компоненты склеились в одной вершине. Образ \\(T_2-f\\) также является остовным деревом: удаление \\(f\\) разбило \\(T_2\\) на две компоненты, а стягивание концов \\(f\\) снова склеило их. Эти два дерева по-прежнему не имеют общих рёбер. Случай \\(e\\in T_2\\) симметричен.\n\nЕсли \\(e\\notin T_1\\cup T_2\\), Соединитель закрепляет любое ребро \\(f\\in T_1\\). После удаления \\(e\\) и стягивания \\(f\\) граф \\((T_1-f)/f\\) является остовным деревом. Образ связного графа \\(T_2\\) после стягивания остаётся связным и содержит некоторое остовное дерево; оно не пересекается по рёбрам с образом \\(T_1-f\\). Значит, и в этом случае в меньшем мультиграфе есть два непересекающихся остовных дерева.\n\nПосле первого раунда Соединитель применяет индукционную стратегию к полученному меньшему мультиграфу. Стягивание закреплённого ребра означает, что если его последующие закреплённые рёбра соединят все вершины стянутого графа, то вместе с \\(f\\) они соединят все вершины исходного графа. Поэтому Соединитель выигрывает. Обе импликации доказаны.",
