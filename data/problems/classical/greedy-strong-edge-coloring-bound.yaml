  "ideas": [
    {
      "id": "idea-count-distance-two-edge-conflicts",
      "title": "Count edge conflicts within distance two",
      "text": "When an edge is colored greedily, only colors already used on edges adjacent to it or adjacent to one of those adjacent edges are forbidden. The maximum degree bound gives at most \\(2\\Delta^2-2\\Delta\\) such earlier edges.",
      "tags": [
        "coloring"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-greedy-distance-two-counting",
      "title": "Greedy counting proof",
      "text": "Order the edges arbitrarily and color them one by one. Suppose the next edge is \\(e=uv\\). A color is forbidden for \\(e\\) exactly when it has already appeared on an edge at edge-distance at most two from \\(e\\), because two edges of one color must form an induced matching with all other edges of that color.\n\nThere are at most \\((\\Delta-1)+(\\Delta-1)=2\\Delta-2\\) edges adjacent to \\(e\\). From the \\(u\\)-side, each of the at most \\(\\Delta-1\\) adjacent edges reaches a further endpoint from which at most \\(\\Delta-1\\) additional edges can continue; hence this side contributes at most \\((\\Delta-1)^2\\) edges at distance two. The same bound holds on the \\(v\\)-side. Thus the number of already colored edges whose colors can be forbidden is at most\n\\[\n(2\\Delta-2)+2(\\Delta-1)^2=2\\Delta^2-2\\Delta.\n\\]\nWith \\(2\\Delta^2-2\\Delta+1\\) colors, at least one color remains available for \\(e\\). Continuing greedily colors every edge, and the rule forbidding colors within distance two guarantees that each color class is an induced matching.",
      "idea_ids": [
        "idea-count-distance-two-edge-conflicts"
      ],
