        "id": "stmt-greedy-strong-edge-coloring-bound",
        "title": "Greedy bound",
        "text": "Let G be a finite graph with maximum degree at most \\(\\Delta\\). Then the edges of G can be colored with at most \\(2\\Delta^2-2\\Delta+1\\) colors so that every color class is an induced matching.",
