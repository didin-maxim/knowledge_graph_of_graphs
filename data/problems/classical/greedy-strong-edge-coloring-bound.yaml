  "solutions": [
    {
      "id": "sol-greedy-distance-two-counting",
      "title": "Жадное доказательство подсчётом",
      "text": "Упорядочим рёбра произвольно и будем красить их по одному. Пусть очередное ребро равно \\(e=uv\\). Цвет запрещён для \\(e\\) ровно тогда, когда он уже появился на ребре, находящемся от \\(e\\) на рёберном расстоянии не больше двух: два ребра одного цвета должны образовывать индуцированное паросочетание вместе со всеми остальными рёбрами этого цвета.\n\nС ребром \\(e\\) смежно не более \\((\\Delta-1)+(\\Delta-1)=2\\Delta-2\\) рёбер. Со стороны \\(u\\) каждое из не более чем \\(\\Delta-1\\) смежных рёбер ведёт к дальнейшему концу, из которого выходит не более \\(\\Delta-1\\) дополнительных рёбер; значит, эта сторона даёт не более \\((\\Delta-1)^2\\) рёбер на расстоянии два. Такая же оценка верна со стороны \\(v\\). Поэтому число уже окрашенных рёбер, чьи цвета могут быть запрещены, не превосходит\n\\[\n(2\\Delta-2)+2(\\Delta-1)^2=2\\Delta^2-2\\Delta.\n\\]\nПри \\(2\\Delta^2-2\\Delta+1\\) цветах для \\(e\\) остаётся хотя бы один доступный цвет. Продолжая жадно, мы окрашиваем все рёбра, а запрет цветов на расстоянии не больше двух гарантирует, что каждый цветовой класс является индуцированным паросочетанием.",
