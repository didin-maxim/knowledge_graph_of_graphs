  "ideas": [
    {
      "id": "idea-count-distance-two-edge-conflicts",
      "title": "Посчитать конфликтующие рёбра на расстоянии не больше двух",
      "text": "При жадной раскраске очередного ребра запрещены только цвета, уже использованные на рёбрах, смежных с ним или смежных с одним из таких смежных рёбер. Ограничение на максимальную степень даёт не более \\(2\\Delta^2-2\\Delta\\) таких ранее окрашенных рёбер.",
