      {
        "id": "stmt-color-codes-bipartite-layers",
        "title": "Лемма о двоичных кодах и двудольных слоях",
        "text": "Пусть вершины конечного графа \\(G\\) правильно раскрашены в \\(q\\) цветов. Положим \\(r=\\lceil\\log_2 q\\rceil\\). Тогда множество рёбер \\(G\\) можно разбить на \\(r\\) двудольных подграфов. В частности, у любого конечного графа максимальной степени не больше \\(\\Delta\\) множество рёбер можно разбить на \\(\\lceil\\log_2(\\Delta+1)\\rceil\\) двудольных подграфов.",
        "source_id": "src-kolmogorov-2008-official",
