  "ideas": [
    {
      "id": "idea-binary-color-code-layers",
      "title": "Использовать биты цветовых кодов как двудольные разбиения",
      "text": "Заменим каждый вершинный цвет двоичным кодом. Ребро соединяет вершины разных цветов, поэтому их коды различаются хотя бы в одной координате; если отнести ребро к такой координате, то каждый фиксированный координатный слой пересекает двудольное разбиение по этому биту.",
      "tags": [
        "coloring"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-greedy-delta-plus-one-colors",
      "title": "Жадная раскраска даёт нужные коды",
      "text": "Если известно только ограничение на максимальную степень, обычная жадная раскраска вершин даёт \\(\\Delta+1\\) правильных вершинных цветов; затем эти цвета кодируются двоичными строками длины \\(\\lceil\\log_2(\\Delta+1)\\rceil\\).",
      "tags": [
        "coloring"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-binary-code-edge-partition",
      "title": "Доказательство двоичными кодами цветов",
      "text": "Выберем для \\(q\\) вершинных цветов попарно различные двоичные строки длины \\(r\\). Это возможно, потому что \\(2^r\\ge q\\). Каждой вершине припишем строку, соответствующую её цвету.\n\nДля любого ребра \\(uv\\) цвета концов различны, значит, две приписанные строке различны. Выберем координату, в которой они различаются, например первую такую координату, и поместим \\(uv\\) в слой этой координаты. Так каждое ребро попадает ровно в один из \\(r\\) слоёв.\n\nЗафиксируем координату \\(i\\). В \\(i\\)-м слое каждое ребро соединяет вершину, у которой \\(i\\)-й бит равен 0, с вершиной, у которой \\(i\\)-й бит равен 1, потому что в этот слой попадали только рёбра с различными кодами концов в координате \\(i\\). Поэтому \\(i\\)-й слой двудолен, с долями, заданными значением \\(i\\)-го бита. Значит, рёбра разбиты на \\(r\\) двудольных подграфов.\n\nДля следствия раскрасим вершины графа максимальной степени не больше \\(\\Delta\\) жадно в произвольном порядке, используя \\(\\Delta+1\\) цвет: когда вершина окрашивается, на её уже окрашенных соседях стоит не более \\(\\Delta\\) цветов, поэтому некоторый цвет доступен. Применяя первую часть при \\(q=\\Delta+1\\), получаем разбиение рёбер на \\(\\lceil\\log_2(\\Delta+1)\\rceil\\) двудольных подграфов.",
