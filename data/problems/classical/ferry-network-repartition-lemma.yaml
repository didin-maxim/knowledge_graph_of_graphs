  "solutions": [
    {
      "id": "sol-repartition-network",
      "title": "Пара закрытого ребра и остальные вершины",
      "text": "После операции положим\n\\[\nA'=\\{a,b\\},\\qquad B'=(A\\cup B)\\setminus\\{a,b\\}.\n\\]\nНужно доказать, что каждая вершина из \\(B'\\) смежна и с \\(a\\), и с \\(b\\).\n\nПусть сначала \\(x\\in A\\setminus\\{a\\}\\). До операции вершина \\(x\\) была смежна с \\(b\\), потому что все поперечные рёбра между \\(A\\) и \\(B\\) присутствовали. Если \\(x\\) уже была смежна с \\(a\\), то ничего доказывать не нужно. Если же нет, то до операции \\(x\\) была смежна ровно с одной из вершин \\(a,b\\), а именно с \\(b\\); по правилу операции после удаления ребра \\(ab\\) добавляется ребро \\(xa\\). Значит, после операции \\(x\\) смежна и с \\(a\\), и с \\(b\\).\n\nСовершенно так же для любой вершины \\(y\\in B\\setminus\\{b\\}\\): до операции она была смежна с \\(a\\), а если не была смежна с \\(b\\), то после операции ребро \\(yb\\) добавляется. Поэтому и \\(y\\) после операции смежна с обоими вершинами \\(a\\) и \\(b\\).\n\nИтак, каждая вершина из \\(B'\\) смежна с обеими вершинами из \\(A'\\). Следовательно, новые доли \\(A'\\) и \\(B'\\) снова образуют полную двудольную сеть.",
