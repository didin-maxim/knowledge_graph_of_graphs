  "statements": {
    "original": [
      {
        "id": "stmt-original-1",
        "text": "Пусть вершины простого графа разбиты на две непустые доли \\(A\\) и \\(B\\), причём каждая вершина из \\(A\\) соединена с каждой вершиной из \\(B\\). Выберем ребро \\(ab\\) с \\(a\\in A\\), \\(b\\in B\\), удалим его и затем для каждой вершины, смежной ровно с одной из вершин \\(a,b\\), добавим ребро к другой из них. Докажите, что после этой операции те же вершины можно снова разбить на две непустые доли так, чтобы все поперечные рёбра присутствовали.",
