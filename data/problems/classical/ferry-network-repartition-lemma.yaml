      "id": "idea-pair-vs-rest",
      "title": "Новые доли: закрытая пара против остальных",
      "text": "После закрытия поперечного ребра \\(ab\\) естественно объявить одной долей пару \\(\\{a,b\\}\\), а второй долей — все остальные вершины. Остаётся проверить, что каждая из них стала смежной с обоими концами закрытого ребра.",
