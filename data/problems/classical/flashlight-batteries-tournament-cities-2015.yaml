  "ideas": [
    {
      "id": "idea-batteries-as-edges",
      "title": "Проверки как ребра графа",
      "text": "Батарейки считаются вершинами, а проверенные пары — ребрами. Чтобы гарантировать успех при любом наборе хороших батареек, каждое возможное множество хороших батареек должно содержать хотя бы одно ребро.",
      "tags": [
        "extremal_graph_theory"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-pile-construction",
      "title": "Оценка и конструкция кучками",
      "text": "Для случая \\(2n+1\\) батареек достаточно разбить батарейки на \\(n\\) кучек: одну кучку из трех батареек и \\(n-1\\) кучек из двух батареек. Проверим все пары внутри каждой кучки; всего получится \\(3+(n-1)=n+2\\) проверки. Среди \\(n+1\\) хороших батареек в какой-то кучке окажутся две хорошие, значит фонарик загорится.\n\nПокажем, что \\(n+1\\) проверки недостаточно. Рассмотрим граф проверок. В нем \\(n+1\\) ребер на \\(2n+1\\) вершинах, поэтому какие-то два ребра имеют общую вершину: иначе \\(n+1\\) попарно непересекающихся ребер использовали бы \\(2n+2\\) вершины. Объявим эту общую вершину плохой, а из каждого оставшегося проверенного ребра выберем по одному плохому концу. Так мы выбираем не больше \\(1+(n-1)=n\\) плохих батареек и задеваем каждую проверку; значит можно оставить как минимум \\(n+1\\) хороших батареек, среди которых нет проверенной пары.\n\nДля случая \\(2n\\) батареек конструкция дает \\(n+3\\): берем \\(n-1\\) кучку, две из них по три батарейки, остальные по две, и проверяем все пары внутри кучек. Любые \\(n\\) хороших батареек содержат две из одной кучки.\n\nОсталось доказать, что \\(n+2\\) проверок не хватает. Рассмотрим любой граф проверок с не более чем \\(n+2\\) ребрами на \\(2n\\) вершинах. Достаточно выбрать не более \\(n\\) плохих батареек, которые задевают каждое ребро: тогда остальные как минимум \\(n\\) батареек можно объявить хорошими, и ни одна проверка не сработает. Будем выбирать вершины степени хотя бы \\(2\\), каждый раз удаляя все инцидентные им ребра, пока оставшиеся ребра не станут попарно непересекающимися. Если таких выбранных вершин нет, то все ребра уже образуют паросочетание, а в графе на \\(2n\\) вершинах оно имеет не больше \\(n\\) ребер; выбираем по одному концу каждого ребра. Если выбрана ровно одна вершина, то оставшееся паросочетание лежит на \\(2n-1\\) вершине и имеет не больше \\(n-1\\) ребер; вместе с первой вершиной снова получаем не больше \\(n\\) плохих батареек. Если же выбрано \\(k\\ge2\\) вершин, то после них осталось не больше \\(n+2-2k\\) ребер, и можно задеть их, выбрав по одному концу каждого; всего будет не больше \\(k+n+2-2k=n+2-k\\le n\\) выбранных плохих батареек. Значит меньше \\(n+3\\) проверок не хватает.",
      "idea_ids": [
        "idea-batteries-as-edges"
      ],
      "standard_idea_ids": [
        "extremal_choice"
      ],
      "status": "ai_checked"
    },
    {
      "id": "sol-short-turan-context",
      "title": "Короткий внешний вариант через теорему Турана",
      "text": "Ту же нижнюю оценку можно записать короче в языке дополнительного графа. Если в чётном случае сделано не больше \\(n+2\\) проверок, то дополнение к графу проверок имеет больше рёбер, чем дополнение к кучковой конструкции из двух троек и \\(n-3\\) пар. По теореме Турана, применённой в форме запрета клики \\(K_n\\), в этом дополнении есть клика из \\(n\\) вершин. В исходном графе проверок это независимое множество из \\(n\\) батареек; их можно объявить хорошими, и ни одна проверка не сработает. Нечётный случай аналогично является малым частным экстремальным случаем, но школьное доказательство через пересекающиеся рёбра короче полной теоремы.",
