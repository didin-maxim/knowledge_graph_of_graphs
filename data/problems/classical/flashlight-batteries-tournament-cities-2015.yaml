  "solutions": [
    {
      "id": "sol-pile-construction",
      "title": "Оценка и конструкция кучками",
      "text": "Для случая 2n+1 батарейка достаточно разбить батарейки на n кучек: одну кучку из трех батареек и n-1 кучку из двух батареек. Проверим все пары внутри каждой кучки; всего получится n+2 проверки. Среди n+1 хороших батареек в какой-то кучке окажутся две хорошие, значит фонарик загорится. Нижняя оценка показывает, что n+1 проверки недостаточно: если две проверки имеют общую батарейку, можно объявить ее плохой, а из остальных проверок выбрать по одной плохой батарейке. Всего хватит n плохих батареек, и ни одна проверка не сработает. Для случая 2n батареек аналогично получается ответ n+3: конструкция — n-1 кучка, две из них по три батарейки, остальные по две; нижняя оценка устроена тем же выбором плохих батареек из проверенных пар.",
