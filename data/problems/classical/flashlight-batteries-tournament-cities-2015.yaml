  "solutions": [
    {
      "id": "sol-pile-construction",
      "title": "Оценка и конструкция кучками",
      "text": "Для случая \\(2n+1\\) батареек достаточно разбить батарейки на \\(n\\) кучек: одну кучку из трех батареек и \\(n-1\\) кучек из двух батареек. Проверим все пары внутри каждой кучки; всего получится \\(3+(n-1)=n+2\\) проверки. Среди \\(n+1\\) хороших батареек в какой-то кучке окажутся две хорошие, значит фонарик загорится.\n\nПокажем, что \\(n+1\\) проверки недостаточно. Рассмотрим граф проверок. В нем \\(n+1\\) ребер на \\(2n+1\\) вершинах, поэтому какие-то два ребра имеют общую вершину: иначе \\(n+1\\) попарно непересекающихся ребер использовали бы \\(2n+2\\) вершины. Объявим эту общую вершину плохой, а из каждого оставшегося проверенного ребра выберем по одному плохому концу. Так мы выбираем не больше \\(1+(n-1)=n\\) плохих батареек и задеваем каждую проверку; значит можно оставить как минимум \\(n+1\\) хороших батареек, среди которых нет проверенной пары.\n\nДля случая \\(2n\\) батареек конструкция дает \\(n+3\\): берем \\(n-1\\) кучку, две из них по три батарейки, остальные по две, и проверяем все пары внутри кучек. Любые \\(n\\) хороших батареек содержат две из одной кучки. Нижнюю оценку удобно прочитать через дополнение к графу проверок. Если проверок не больше \\(n+2\\), то в дополнении больше ребер, чем в графе Турана \\(T_{n-1}(2n)\\): ведь дополнение к построенной выше кучковой конструкции имеет ровно экстремальное число ребер без клики \\(K_n\\). По теореме Турана в дополнении есть клика из \\(n\\) вершин, то есть в исходном графе проверок есть независимое множество из \\(n\\) батареек. Их можно объявить хорошими, и ни одна проверка не сработает. Значит меньше \\(n+3\\) проверок не хватает.",
