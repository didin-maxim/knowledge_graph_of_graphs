        "text": "Пусть \\(n>2\\). Найдите минимальное число рёбер в простом графе на \\(2n+1\\) вершинах, у которого каждое множество из \\(n+1\\) вершин содержит хотя бы одно ребро. Также найдите минимальное число рёбер в простом графе на \\(2n\\) вершинах, у которого каждое множество из \\(n\\) вершин содержит хотя бы одно ребро.",
