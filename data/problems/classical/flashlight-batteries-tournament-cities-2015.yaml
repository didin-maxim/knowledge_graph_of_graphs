    {
      "id": "sol-short-turan-context",
      "title": "Короткий внешний вариант через теорему Турана",
      "text": "Рассмотрим граф проверок \\(H\\): его вершины — батарейки, а ребро означает, что соответствующая пара была проверена. Проверки гарантируют успех ровно тогда, когда любое возможное множество хороших батареек содержит ребро графа \\(H\\). Значит, в случае \\(2n+1\\) батареек нужно и достаточно, чтобы в \\(H\\) не было независимого множества размера \\(n+1\\); в случае \\(2n\\) батареек нужно и достаточно, чтобы в \\(H\\) не было независимого множества размера \\(n\\).\n\nПерейдём к дополнительному графу \\(\\overline H\\). Независимое множество в \\(H\\) становится кликой в \\(\\overline H\\). Поэтому в нечётном случае надо максимизировать число рёбер в \\(\\overline H\\) среди графов на \\(2n+1\\) вершинах без клики \\(K_{n+1}\\), а затем вычесть это число из \\(\\binom{2n+1}{2}\\). По теореме Турана максимум даёт полный \\(n\\)-дольный граф с долями, насколько возможно равными. При \\(2n+1\\) вершинах это доли размеров \\(3,2,2,\\ldots,2\\). В исходном графе \\(H\\) отсутствующие в \\(\\overline H\\) рёбра лежат только внутри этих долей, их число равно\n\\[\n\\binom32+(n-1)\\binom22=3+n-1=n+2.\n\\]\nЗначит, меньше \\(n+2\\) проверок не хватит, а кучковая конструкция с одной тройкой и \\(n-1\\) парами показывает, что \\(n+2\\) проверок достаточно.\n\nВ чётном случае запрещена клика \\(K_n\\) в \\(\\overline H\\). По теореме Турана берём полный \\((n-1)\\)-дольный граф на \\(2n\\) вершинах с равными насколько возможно долями. Так как \\(2n=2(n-1)+2\\), размеры долей равны \\(3,3,2,\\ldots,2\\): две тройки и \\(n-3\\) пар. Тогда минимальное число рёбер исходного графа проверок равно числу рёбер внутри долей:\n\\[\n2\\binom32+(n-3)\\binom22=6+n-3=n+3.\n\\]\nИ эта граница достигается, если проверить все пары внутри двух троек и внутри остальных пар. Следовательно, ответы: \\(n+2\\) для \\(2n+1\\) батареек и \\(n+3\\) для \\(2n\\) батареек.",
