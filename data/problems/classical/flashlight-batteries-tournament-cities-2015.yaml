    "graph_theory": [
      {
        "id": "stmt-graph-1",
        "text": "В первом пункте нужно выбрать минимальное число ребер в графе на 2n+1 вершине так, чтобы в любом множестве из n+1 вершин нашлось выбранное ребро; иначе говоря, граф не должен содержать независимое множество размера n+1. Во втором пункте нужно выбрать минимальное число ребер в графе на 2n вершинах так, чтобы в любом множестве из n вершин нашлось выбранное ребро; иначе говоря, граф не должен содержать независимое множество размера n.",
