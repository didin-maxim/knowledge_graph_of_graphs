      "id": "sol-double-counting",
      "title": "Двойной счет",
      "text": "Посчитаем пары (v,e), где вершина v инцидентна ребру e. С одной стороны, для фиксированной вершины таких пар deg(v), всего сумма степеней. С другой стороны, каждое ребро дает ровно две пары. Поэтому сумма степеней равна 2e(G). Так как эта сумма четна, число нечетных слагаемых в ней четно.",
