        "text": "Пусть \\(S\\) — конечное множество точек на плоскости, а \\(T\\) — дерево на вершинах \\(S\\), у которого сумма евклидовых длин рёбер максимальна среди всех деревьев на \\(S\\). Рассмотрим замкнутую ломаную с вершинами в \\(S\\). Если одно её ребро \\(AB\\) имеет длину строго меньше длины каждого другого ребра этой ломаной, то отрезок \\(AB\\) не является ребром дерева \\(T\\).",
