  "solutions": [
    {
      "id": "sol-cycle-exchange",
      "title": "Обмен по циклу",
      "text": "Докажем графовую формулировку. Предположим противное: строго самое лёгкое ребро \\(e=uv\\) некоторого цикла \\(C\\) входит в максимальный по суммарному весу остов \\(T\\). Удалим \\(e\\) из \\(T\\). Получатся две компоненты, одна содержит \\(u\\), другая содержит \\(v\\).\n\nПройдём по циклу \\(C\\) от \\(u\\) к \\(v\\), не используя ребро \\(e\\). В начале мы находимся в компоненте вершины \\(u\\), а в конце — в другой компоненте, значит на этом пути есть ребро \\(f\\), соединяющее две компоненты дерева \\(T-e\\). По условию \\(e\\) строго легче любого другого ребра цикла, поэтому \\(w(f)>w(e)\\).\n\nТогда \\(T-e+f\\) снова является остовным деревом: ребро \\(f\\) соединяет две компоненты, возникшие после удаления \\(e\\). Его суммарный вес больше веса \\(T\\), что противоречит максимальности \\(T\\). Следовательно, \\(e\\) не может входить в \\(T\\).\n\nГеометрическая версия получается из той же идеи. Замкнутая ломаная задаёт замкнутый обход в полном графе на точках \\(S\\), веса рёбер равны евклидовым длинам. Если \\(AB\\in T\\), то после удаления \\(AB\\) остальные звенья ломаной ведут из компоненты точки \\(B\\) в компоненту точки \\(A\\), поэтому среди них есть звено, пересекающее этот разрез. Оно строго длиннее \\(AB\\), и замена снова увеличивает суммарную длину дерева. Противоречие.",
