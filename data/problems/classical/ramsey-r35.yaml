  "solutions": [
    {
      "id": "sol-exact-r35",
      "title": "Доказательство верхней оценки и циклический пример",
      "text": "Докажем верхнюю оценку \\(R(3,5)\\le 14\\). Рассмотрим красно-синюю раскраску рёбер \\(K_{14}\\) и выберем вершину \\(v\\). Среди остальных 13 вершин либо хотя бы 5 соединены с \\(v\\) красным ребром, либо хотя бы 9 соединены с \\(v\\) синим ребром.\n\nВ первом случае рассмотрим 5 красных соседей вершины \\(v\\). Если между двумя из них есть красное ребро, то вместе с \\(v\\) оно даёт красный треугольник. Если красных рёбер между этими пятью вершинами нет, то все рёбра между ними синие, и это синяя \\(K_5\\).\n\nВо втором случае рассмотрим 9 синих соседей вершины \\(v\\). По \\(R(3,4)=9\\) среди них есть либо красный треугольник, либо синяя \\(K_4\\). Красный треугольник уже подходит, а синяя \\(K_4\\) вместе с \\(v\\) даёт синюю \\(K_5\\). Значит, \\(R(3,5)\\le 14\\).\n\nТеперь покажем, что 13 вершин недостаточно. Возьмём вершины \\(0,1,\\ldots,12\\) по модулю 13. Соединим две вершины ребром графа \\(G\\), если их разность по модулю 13 равна \\(\\pm 1\\) или \\(\\pm 5\\). В языке раскрасок это будут, например, красные рёбра; остальные рёбра считаем синими.\n\nВ \\(G\\) нет треугольника. Действительно, если треугольник содержит вершину 0, то две другие вершины должны лежать среди \\(\\pm1,\\pm5\\). Но разность любых двух различных чисел из \\(\\{1,12,5,8\\}\\) не равна \\(\\pm1\\) или \\(\\pm5\\) по модулю 13. Переносом всех вершин на одно и то же число любой предполагаемый треугольник сводится к этому случаю.\n\nОсталось проверить, что в \\(G\\) нет независимого множества из 5 вершин. Предположим, что выбраны 5 независимых вершин, и запишем по кругу промежутки между соседними выбранными вершинами. Сумма пяти промежутков равна 13. Ни один промежуток не равен 1 или 5, иначе две выбранные вершины были бы соединены ребром. Значит, все промежутки не меньше 2, а их сумма равна 13. Возможны только наборы промежутков \\(2,2,2,2,5\\), \\(2,2,2,3,4\\) или \\(2,2,3,3,3\\) с точностью до порядка. Первый набор сразу запрещён из-за промежутка 5. Во втором и третьем наборах на круге обязательно найдутся соседние промежутки 2 и 3; их сумма равна 5, значит, две выбранные вершины через одну стоят на циклическом расстоянии 5 и тоже соединены ребром. Противоречие.\n\nИтак, построен граф на 13 вершинах без треугольника и без независимой пятёрки. Следовательно, \\(R(3,5)>13\\). Вместе с верхней оценкой получаем \\(R(3,5)=R(5,3)=14\\).",
