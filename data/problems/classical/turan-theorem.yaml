  "solutions": [
    {
      "id": "sol-symmetrization",
      "title": "Доказательство через симметризацию",
      "text": "Среди всех \\(K_{r+1}\\)-свободных графов на данном множестве из \\(n\\) вершин выберем граф \\(G\\) с максимальным числом ребер, а среди таких графов — с максимальным значением \\(\\sum_v d(v)^2\\). Покажем, что \\(G\\) уже имеет турановскую структуру. Если \\(u\\) и \\(v\\) не смежны, то можно выполнить симметризацию Зыкова: удалить все ребра, инцидентные \\(u\\), и соединить \\(u\\) ровно с теми вершинами, с которыми соединена \\(v\\). Новая вершина \\(u\\) становится близнецом \\(v\\), а ребро \\(uv\\) не появляется, потому что \\(u\\notin N(v)\\). Запрещенная клика \\(K_{r+1}\\) при этом не возникает: всякая новая клика, содержащая \\(u\\), после замены \\(u\\) на \\(v\\) дала бы такую же клику в исходном графе. Число ребер меняется на \\(d(v)-d(u)\\). Поэтому в экстремальном графе не может быть несмежных вершин разных степеней: вершину меньшей степени можно было бы заменить копией вершины большей степени и получить больше ребер. Значит любые несмежные вершины имеют одинаковую степень. Осталось исключить случай, когда несмежные \\(u,v\\) имеют одинаковые степени, но разные окрестности. При симметризации \\(u\\) в копию \\(v\\) число ребер не меняется; то же верно для обратной симметризации \\(v\\) в копию \\(u\\). Если обозначить \\(A=N(v)\\setminus N(u)\\) и \\(B=N(u)\\setminus N(v)\\), то \\(|A|=|B|>0\\). Изменение суммы квадратов степеней в двух направлениях в сумме равно \\(2(|A|+|B|)>0\\): каждая вершина из множества, к которому новая копия присоединяется, получает прирост степени на 1, а каждая вершина из множества, от которого она отсоединяется, теряет 1. Следовательно, хотя бы одно из двух направлений сохраняет число ребер и увеличивает \\(\\sum_v d(v)^2\\), что противоречит выбору \\(G\\). Итак, любые две несмежные вершины в \\(G\\) имеют одинаковые окрестности. Разобьем вершины на классы отношения «равны или не смежны». Внутри класса ребер нет. Если две вершины лежат в разных классах, они обязаны быть смежны: иначе они имели бы одинаковые окрестности и попали бы в один класс. Значит \\(G\\) — полный многодольный граф. Если в нем \\(k\\) непустых долей, то выбор по одной вершине из каждой доли дает клику \\(K_k\\), поэтому из \\(K_{r+1}\\)-свободности следует \\(k\\le r\\). Для фиксированных размеров долей число ребер равно \\(\\sum_{i<j} a_i a_j=\\frac12(n^2-\\sum_i a_i^2)\\). При разрешенных не более чем \\(r\\) долях это выражение максимально, когда сумма квадратов размеров минимальна, то есть когда доли как можно более равны: если \\(a_i\\ge a_j+2\\), перенос одной вершины из большей доли в меньшую уменьшает \\(\\sum a_i^2\\) на \\(2(a_i-a_j-1)>0\\) и увеличивает число ребер. Поэтому экстремальные размеры отличаются не более чем на 1; если долей меньше \\(r\\), можно добавить пустые доли и применить тот же баланс. При \\(n=qr+s\\), \\(0\\le s<r\\), получаем \\(s\\) долей размера \\(q+1\\) и \\(r-s\\) долей размера \\(q\\), то есть граф \\(T_r(n)\\), а его число ребер равно \\(\\frac12\\bigl(n^2-s(q+1)^2-(r-s)q^2\\bigr)=\\frac{r-1}{2r}n^2-\\frac{s(r-s)}{2r}\\).",
