      {
        "id": "stmt-original",
        "text": "Пусть \\(X\\) — множество точек плоскости, никакие три точки из \\(X\\) не лежат на одной прямой. В графе Габриэля на \\(X\\) соединены те и только те пары \\(A,B\\), для которых замкнутый диск с диаметром \\(AB\\) не содержит других точек из \\(X\\). Тогда при рисовании рёбер отрезками между соответствующими точками никакие два ребра не пересекаются внутренними точками.",
        "source_id": "src-usamo-2025-p3-aops-wiki",
