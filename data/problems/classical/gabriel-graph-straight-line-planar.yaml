  "ideas": [
    {
      "id": "idea-crossing-gives-forbidden-disk-point",
      "title": "Пересечение даёт точку в диаметральном диске",
      "text": "Если два отрезка-ребра пересекаются, их четыре конца образуют выпуклый четырёхугольник. У одного из его углов величина не меньше \\(90^\\circ\\), а значит соответствующая вершина лежит в замкнутом диске с диаметром противоположного ребра.",
      "tags": [
        "planar_graphs"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-thales-crossing",
      "title": "Запрет пересечения через теорему Фалеса",
      "text": "Предположим, что два ребра \\(AC\\) и \\(BD\\), нарисованные отрезками, пересекаются внутренними точками. Тогда точки \\(A,B,C,D\\) являются вершинами выпуклого четырёхугольника. В любом выпуклом четырёхугольнике есть угол не меньше \\(90^\\circ\\); без ограничения общности пусть это угол \\(BAD\\).\n\nПо теореме Фалеса точка \\(A\\) лежит в замкнутом диске с диаметром \\(BD\\): для точек на окружности угол равен \\(90^\\circ\\), а для точек внутри диска он больше \\(90^\\circ\\). Но тогда диаметральный диск ребра \\(BD\\) содержит другую точку множества, а значит \\(BD\\) не могло быть ребром графа Габриэля. Противоречие. Следовательно, такие пересечения невозможны.",
