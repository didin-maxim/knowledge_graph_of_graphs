  "solutions": [
    {
      "id": "sol-pigeonhole",
      "title": "Доказательство через принцип Дирихле",
      "text": "Выберем вершину v. Среди пяти ребер из v хотя бы три одного цвета, скажем красные, к вершинам a,b,c. Если среди a,b,c есть красное ребро, оно вместе с v дает красный треугольник. Если красных ребер между a,b,c нет, то все три ребра между ними синие, и есть синий треугольник. Пример без одноцветного треугольника на 5 вершинах — цикл C5, где ребра одного цвета, а диагонали другого.",
