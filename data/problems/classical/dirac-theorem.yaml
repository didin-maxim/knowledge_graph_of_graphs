  "solutions": [
    {
      "id": "sol-longest-path",
      "title": "Доказательство через длиннейший путь",
      "text": "Пусть \\(v_1,\\ldots,v_k\\) — длиннейший простой путь в графе. Все соседи концов \\(v_1\\) и \\(v_k\\) лежат на этом пути, иначе путь можно было бы удлинить. Так как \\(\\deg(v_1)+\\deg(v_k)\\ge n\\ge k\\), среди позиций на пути найдётся индекс \\(i\\), для которого одновременно \\(v_k\\) смежна с \\(v_i\\), а \\(v_1\\) смежна с \\(v_{i+1}\\): иначе множества индексов \\(\\{i: v_kv_i\\in E\\}\\) и \\(\\{i: v_1v_{i+1}\\in E\\}\\) были бы непересекающимися подмножествами \\(\\{1,\\ldots,k-1\\}\\) суммарной мощности не меньше \\(k\\). Тогда рёбра \\(v_kv_i\\) и \\(v_1v_{i+1}\\) вместе с частями пути дают цикл \\(v_1,v_{i+1},v_{i+2},\\ldots,v_k,v_i,v_{i-1},\\ldots,v_1\\), проходящий через все вершины пути.\n\nОсталось доказать, что \\(k=n\\). Условие минимальной степени не меньше \\(n/2\\) делает граф связным: если бы были две компоненты, вершина в меньшей из них имела бы степень не больше размера этой компоненты минус 1, то есть меньше \\(n/2\\). Если \\(k<n\\), то по связности существует вершина вне построенного цикла, смежная с некоторой его вершиной. Разорвав цикл в этой вершине и добавив внешнюю вершину, получаем простой путь длины \\(k+1\\), что противоречит выбору \\(v_1,\\ldots,v_k\\). Значит, \\(k=n\\), и найденный цикл гамильтонов.",
