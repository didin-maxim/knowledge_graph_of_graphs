        "id": "stmt-original-1",
        "text": "Пусть G — простой граф на n>=3 вершинах. Если каждая вершина G соединена хотя бы с n/2 другими вершинами, то в G существует гамильтонов цикл, то есть цикл, проходящий через все вершины ровно один раз.",
