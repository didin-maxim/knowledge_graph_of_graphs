  "solutions": [
    {
      "id": "sol-longest-path",
      "title": "Доказательство через длиннейший путь",
      "text": "Пусть v1,...,vk — длиннейший путь. Все соседи v1 и vk лежат на этом пути. Так как deg(v1)+deg(vk)>=n и k<=n, существуют индексы i такие, что v1 смежна с \\( v_{i+1} \\), а vk смежна с \\( v_i \\); иначе две соответствующие позиции на пути не пересеклись бы. Тогда v1 \\( v_{i+1} \\) ... vk \\( v_i \\) ... v1 образует цикл длины k. Если k<n, вершина вне цикла, смежная с ним в связном компоненте, позволила бы удлинить путь; условие минимальной степени также дает связность. Значит k=n.",
