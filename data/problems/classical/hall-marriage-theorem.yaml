        "title": "Юноши, девушки и свадьбы",
        "text": "Есть конечное множество юношей и конечное множество девушек. Для каждого юноши известны девушки, с которыми он знаком. Нужно женить каждого юношу на знакомой ему девушке так, чтобы никакие два юноши не женились на одной и той же девушке. Это возможно тогда и только тогда, когда для любой группы из k юношей число девушек, знакомых хотя бы с одним юношей из этой группы, не меньше k.",
