    ],
    "graph_theory": [
      {
        "id": "stmt-graph-1",
        "text": "Пусть G=(X,Y,E) — конечный двудольный граф: каждое ребро соединяет вершину из X с вершиной из Y. В G существует паросочетание, покрывающее все вершины X, тогда и только тогда, когда для любого подмножества A вершин из X множество всех соседей N(A) в Y имеет размер хотя бы |A|.",
