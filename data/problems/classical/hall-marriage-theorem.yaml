  "solutions": [
    {
      "id": "sol-induction",
      "title": "Индукционное доказательство",
      "text": "Докажем графовую форму теоремы. Пусть двудольный граф имеет левую долю \\(X\\); нужно покрыть все вершины \\(X\\) паросочетанием. Необходимость очевидна: если паросочетание покрывает каждую вершину из \\(A\\subseteq X\\), то выбранные для них правые вершины различны и лежат в \\(N(A)\\), значит \\(|N(A)|\\ge |A|\\).\n\nДостаточность докажем индукцией по \\(|X|\\). Если для каждого непустого собственного \\(A\\subset X\\) выполнено строгое неравенство \\(|N(A)|>|A|\\), выберем любую вершину \\(x\\in X\\) и любого её соседа \\(y\\). Удалим \\(x\\) и \\(y\\). Для любого множества \\(A\\subseteq X\\setminus\\{x\\}\\) его окрестность могла уменьшиться не более чем на одну вершину, поэтому новая окрестность имеет размер не меньше \\(|N(A)|-1\\ge |A|\\). По индукции оставшиеся вершины \\(X\\setminus\\{x\\}\\) можно покрыть паросочетанием; добавив ребро \\(xy\\), покрываем всё \\(X\\).\n\nОстаётся случай, когда существует непустое собственное \\(A\\subset X\\) с \\(|N(A)|=|A|\\). По индукции подграф между \\(A\\) и \\(N(A)\\) имеет паросочетание, покрывающее \\(A\\). Рассмотрим оставшийся граф: левая доля \\(X\\setminus A\\), правая доля без \\(N(A)\\). Если в нём для некоторого \\(B\\subseteq X\\setminus A\\) условие Холла нарушилось, то в исходном графе множество \\(A\\cup B\\) имело бы окрестность размера меньше \\(|N(A)|+|B|=|A|+|B|\\), потому что новые соседи \\(B\\) вне \\(N(A)\\) меньше \\(|B|\\). Это противоречит условию Холла для исходного графа. Значит, по индукции можно покрыть и \\(X\\setminus A\\); вместе два паросочетания покрывают всё \\(X\\).",
      "idea_ids": [
        "idea-deficiency"
      ],
      "status": "ai_checked",
      "standard_idea_ids": [
        "induction"
      ]
    },
    {
      "id": "sol-tight-set-splitting",
      "title": "Доказательство через tight-подмножества",
      "text": "Докажем достаточность условия Холла индукцией, но будем разрезать задачу по tight-подмножествам, где |N(A)|=|A|. Возьмем вершину x из X. Если у некоторого соседа y вершины x удаление y из всех списков, кроме списка x, не нарушает условие Холла, то по индукции на меньшем графе покрываем X\\{x}, а затем сопоставляем x с y. Иначе для каждого соседа y находится подмножество A_y⊆X\\{x}, для которого после удаления y равенство Холла ломается; это возможно только если y уже лежит в N(A_y) и при этом |N(A_y)|=|A_y|. Берем любое такое tight-подмножество A. По индукции внутри подграфа на A и N(A) существует паросочетание, покрывающее A. Для оставшихся вершин условие Холла тоже сохраняется: если B⊆X\\A, то из |N(A∪B)|≥|A|+|B| и |N(A)|=|A| получаем |N(A∪B)\\N(A)|≥|B|. Значит по индукции покрывается и X\\A в дополнении к N(A). Объединяя два паросочетания, покрываем весь X.",
      "idea_ids": [
        "idea-deficiency",
        "idea-tight-set-splitting"
      ],
      "status": "ai_checked",
      "standard_idea_ids": [
        "induction"
      ]
    }
