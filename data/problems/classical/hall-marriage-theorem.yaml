  "solutions": [
    {
      "id": "sol-induction",
      "title": "Индукционное доказательство",
      "text": "Необходимость очевидна: разные вершины из A должны быть сопоставлены разным соседям. Для достаточности применяем индукцию по |X|. Если для каждого непустого собственного A выполнено |N(A)|>|A|, удаляем одну вершину x и одного ее соседа y, после чего условие Холла сохраняется. Если есть непустое собственное A с |N(A)|=|A|, по индукции покрываем A внутри N(A), а затем покрываем X\\A в оставшемся графе: иначе нарушение Холла там дало бы нарушение в исходном графе.",
      "idea_ids": [
