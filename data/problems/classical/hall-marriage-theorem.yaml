        "id": "stmt-original-1",
        "text": "Пусть есть конечный набор множеств A_1,...,A_n. Можно выбрать по одному элементу из каждого множества так, чтобы все выбранные элементы были различны, тогда и только тогда, когда для любых k множеств из этого набора их объединение содержит хотя бы k элементов.",
