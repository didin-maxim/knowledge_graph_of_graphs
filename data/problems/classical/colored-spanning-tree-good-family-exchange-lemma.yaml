        "id": "stmt-good-family-suspicious-edges",
        "title": "Хорошее семейство остовов",
        "text": "Пусть рёбра связного графа \\(G\\) раскрашены в красный, зелёный и синий цвета, а \\(|V(G)|=r+g+b+1\\). Для остова \\(T\\) обозначим через \\(r(T),g(T),b(T)\\) числа его рёбер трёх цветов. Назовём непустое семейство остовов \\(\\mathcal C\\) хорошим для тройки \\((r,g,b)\\), если каждое из чисел \\(r,g,b\\) лежит между минимальным и максимальным значениями соответствующего счётчика на \\(\\mathcal C\\). Ребро назовём подозрительным для \\(\\mathcal C\\), если оно входит в некоторые, но не во все остовы из \\(\\mathcal C\\). Если существует хотя бы одно хорошее семейство остовов, то существует остов \\(T\\) с \\(r(T)=r\\), \\(g(T)=g\\), \\(b(T)=b\\). Более того, любое хорошее семейство с минимальным числом подозрительных рёбер содержит такой остов.",
