  "solutions": [
    {
      "id": "sol-minimal-suspicious-edge-exchange",
      "title": "Доказательство минимальностью подозрительных рёбер",
      "text": "Для семейства \\(\\mathcal C\\) положим\n\\[\nr_0=\\min_{T\\in\\mathcal C}r(T),\\quad R_0=\\max_{T\\in\\mathcal C}r(T),\n\\]\nи аналогично \\(g_0,G_0,b_0,B_0\\). Хорошесть означает \\(r\\in[r_0,R_0]\\), \\(g\\in[g_0,G_0]\\), \\(b\\in[b_0,B_0]\\). Выберем хорошее семейство \\(\\mathcal C\\) с минимальным числом подозрительных рёбер. Нужно доказать, что в нём уже есть остов с нужной тройкой.\n\nПредположим обратное. Для каждого \\(T\\in\\mathcal C\\) сумма \\(r(T)+g(T)+b(T)\\) равна \\(|V(G)|-1=r+g+b\\). Если бы ни для одного цвета не было одновременно значения ниже цели и для другого цвета значения выше цели, то всякий остов, отличающийся от цели в одну сторону, нарушал бы равенство сумм. Поэтому после переименования цветов можно считать, что\n\\[\nr_0<r,\\qquad G_0>g.\n\\]\nТак как \\(\\mathcal C\\) хорошее, для синего цвета остаются два случая: \\(B_0=b\\) и \\(B_0>b\\).\n\nПервый случай: \\(B_0=b\\). Возьмём \\(T_0\\in\\mathcal C\\) с \\(g(T_0)=g_0\\). Из \\(G_0>g\\ge g_0\\) следует, что существует зелёное ребро \\(e\\), которое входит в некоторый остов семейства, но не входит в \\(T_0\\); оно подозрительно. Для каждого \\(T\\in\\mathcal C\\) построим \\(T'\\). Если \\(e\\notin T\\), оставим \\(T'=T\\). Если \\(e\\in T\\), то \\(T-e\\) имеет две компоненты. Остов \\(T_0\\) содержит ребро \\(e'\\), пересекающее соответствующий разрез; оно не лежит в \\(T-e\\), поэтому \\(T-e+e'\\) снова остов. Кроме того, \\(e'\\in T_0\\) и \\(e'\\notin T\\), значит \\(e'\\) было подозрительным в старом семействе. Положим \\(T'=T-e+e'\\) и \\(\\mathcal C'=\\{T':T\\in\\mathcal C\\}\\).\n\nВ новом семействе ребро \\(e\\) не входит ни в один остов. Новых подозрительных рёбер не появилось: добавлять мы могли только старые подозрительные рёбра, а ребро, которое раньше входило во все остовы или ни в один, не могло стать частичным при такой операции. Значит число подозрительных рёбер строго уменьшилось. Проверим хорошесть. Каждый изменённый остов теряет зелёное ребро и получает одно ребро произвольного цвета, поэтому\n\\[\ng(\\mathcal C')\\le g_0\\le g,\\quad G(\\mathcal C')\\ge G_0-1\\ge g,\n\\]\n\\[\nr(\\mathcal C')\\le r_0+1\\le r,\\quad R(\\mathcal C')\\ge R_0\\ge r.\n\\]\nСиних рёбер при удалении зелёного ребра не становится меньше, так что \\(B(\\mathcal C')\\ge B_0=b\\). При этом \\(T_0\\) не меняется и лежит в \\(\\mathcal C'\\), а потому \\(b(\\mathcal C')\\le b(T_0)\\le B_0=b\\). Значит \\(\\mathcal C'\\) хорошее, что противоречит минимальности \\(\\mathcal C\\).\n\nВторой случай: \\(B_0>b\\). Возьмём \\(T_0\\in\\mathcal C\\) с \\(r(T_0)=R_0\\). Так как \\(r_0<r\\le R_0\\), в \\(T_0\\) есть красное ребро \\(e\\), отсутствующее в некотором остове семейства; оно подозрительно. Для каждого \\(T\\in\\mathcal C\\) построим \\(T''\\). Если \\(e\\in T\\), оставим \\(T''=T\\). Если \\(e\\notin T\\), то \\(T+e\\) содержит единственный цикл через \\(e\\). Этот цикл не может целиком лежать в \\(T_0\\), иначе \\(T_0\\) содержал бы цикл; значит на нём есть ребро \\(e'\\notin T_0\\). Оно принадлежит \\(T\\), поэтому было подозрительным. Удалив \\(e'\\), получаем остов \\(T''=T-e'+e\\). Пусть \\(\\mathcal C''=\\{T'':T\\in\\mathcal C\\}\\).\n\nТеперь \\(e\\) входит во все остовы \\(\\mathcal C''\\), а удаляемые рёбра уже были подозрительными; как и раньше, новых подозрительных рёбер не появилось, и их число уменьшилось. Хорошесть сохраняется, потому что каждый изменённый остов получает красное ребро и теряет одно ребро произвольного цвета:\n\\[\nr(\\mathcal C'')\\le r_0+1\\le r,\\quad R(\\mathcal C'')\\ge R_0\\ge r,\n\\]\n\\[\ng(\\mathcal C'')\\le g_0\\le g,\\quad G(\\mathcal C'')\\ge G_0-1\\ge g,\n\\]\n\\[\nb(\\mathcal C'')\\le b_0\\le b,\\quad B(\\mathcal C'')\\ge B_0-1\\ge b.\n\\]\nСнова получено хорошее семейство с меньшим числом подозрительных рёбер, противоречие.\n\nОба случая невозможны. Следовательно, минимальное по числу подозрительных рёбер хорошее семейство содержит остов с цветовым вектором \\((r,g,b)\\). Графовая формулировка получается заменой \\((r,g,b)\\) на произвольный целочисленный вектор \\(x\\) с суммой \\(|V(G)|-1\\).",
