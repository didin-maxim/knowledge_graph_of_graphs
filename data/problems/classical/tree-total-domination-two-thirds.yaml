  "solutions": [
    {
      "id": "sol-longest-path-pruning",
      "title": "Induction by pruning a pendant fragment",
      "text": "We prove the statement by induction on n. The cases n=3 and n=4 are immediate: a path or a star on these orders is totally dominated by two adjacent vertices.\n\nThe induction uses a standard pruning claim. In every tree T with at least five vertices one can find a pendant connected fragment F, meeting the rest of the tree in at most one boundary vertex, and a set A inside F together with possibly that boundary vertex, such that: after deleting F the remaining graph is either a smaller tree or one of the direct small endings; every vertex of F and the boundary vertex have a neighbor in A union D whenever D is a total dominating set of the remaining tree; and |A| <= floor(2|F|/3) except for the case where |F| is two leaves with a common support, where adding the support costs only one vertex. To see the claim, take a longest path v0 v1 ... vk and root the tree at vk. All children of v1 are leaves. If v1 has at least two leaf children, use those leaves as F and add v1. Otherwise v1 has degree 2; then look one step farther at v2. If the path continues through a degree-2 vertex, use the pendant path v0 v1 v2 and add v1,v2. If v2 has side branches, the longest-path choice forces each such side branch to have height at most one; taking the side branch together with v0,v1 gives one of the same three-for-two local fragments. These are exactly the local shapes that can occur next to the end of a longest path.\n\nNow apply the claim. Delete the fragment F, use the induction hypothesis on the remaining tree when its order is at least 3, and then add the local set A. The definition of A ensures that all deleted vertices are dominated and that domination across the single boundary is preserved. The size estimate is also local: removing three vertices and adding two gives floor(2(n-3)/3)+2 = floor(2n/3), removing four or more and adding at most two is even cheaper, and removing at least two sibling leaves while adding only their support gives floor(2(n-r)/3)+1 <= floor(2n/3) for r >= 2. The exceptional remaining trees of order 1 or 2 occur only at the end of the pruning and are checked directly by choosing two adjacent vertices in the original final piece.\n\nThus each induction step reduces the tree and extends the selected set without exceeding the two-thirds budget. The resulting set has size at most floor(2n/3), and every vertex, selected or not, has a selected neighbor.",
