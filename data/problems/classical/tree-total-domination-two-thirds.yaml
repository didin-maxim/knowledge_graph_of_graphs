        "id": "stmt-tree-total-domination-two-thirds",
        "text": "Пусть \\(T\\) — дерево на \\(n\\ge 3\\) вершинах. Тогда существует множество \\(S\\) размера не больше \\(\\lfloor 2n/3\\rfloor\\), такое что у каждой вершины \\(T\\) есть сосед в \\(S\\). Эквивалентно, полное доминирующее число любого дерева порядка хотя бы 3 не превосходит \\(\\lfloor 2n/3\\rfloor\\).",
