      "id": "sol-longest-path-pruning",
      "title": "Индукция со срезанием висячего фрагмента",
      "text": "Доказываем утверждение индукцией по \\(n\\). Случаи \\(n=3\\) и \\(n=4\\) непосредственны: путь или звезда такого порядка полностью доминируются двумя соседними вершинами.\n\nВ индукции используется стандартное утверждение о срезании. В каждом дереве \\(T\\) с хотя бы пятью вершинами можно найти связный висячий фрагмент \\(F\\), который встречается с остальным деревом не более чем по одной граничной вершине, и множество \\(A\\) внутри \\(F\\), возможно вместе с этой граничной вершиной, так что после удаления \\(F\\) остаётся меньшее дерево или один из малых конечных случаев; каждая вершина \\(F\\) и граничная вершина имеют соседа в \\(A\\cup D\\), если \\(D\\) — полное доминирующее множество оставшегося дерева; и \\(|A|\\le \\lfloor 2|F|/3\\rfloor\\), кроме случая, когда \\(F\\) состоит из двух листьев с общей опорной вершиной, где добавление опорной вершины стоит только одну вершину. Чтобы увидеть это, возьмём длиннейший путь \\(v_0v_1\\ldots v_k\\) и укореним дерево в \\(v_k\\). Все дети \\(v_1\\) являются листьями. Если у \\(v_1\\) есть хотя бы два листовых ребёнка, берём эти листья в качестве \\(F\\) и добавляем \\(v_1\\). Иначе степень \\(v_1\\) равна 2; тогда смотрим на шаг дальше, на \\(v_2\\). Если путь продолжается через вершину степени 2, берём висячий путь \\(v_0v_1v_2\\) и добавляем \\(v_1,v_2\\). Если у \\(v_2\\) есть боковые ветви, выбор длиннейшего пути заставляет каждую такую ветвь иметь высоту не больше одного; взяв боковую ветвь вместе с \\(v_0,v_1\\), получаем один из тех же локальных фрагментов с расходом две вершины на три. Это ровно те локальные формы, которые могут появиться рядом с концом длиннейшего пути.\n\nТеперь применим это утверждение. Удаляем фрагмент \\(F\\), используем предположение индукции для оставшегося дерева, если его порядок хотя бы 3, и затем добавляем локальное множество \\(A\\). Определение \\(A\\) гарантирует, что все удалённые вершины доминированы и что доминирование через единственную границу сохранено. Оценка размера тоже локальна: удаление трёх вершин и добавление двух даёт \\(\\lfloor 2(n-3)/3\\rfloor+2=\\lfloor 2n/3\\rfloor\\), удаление четырёх или более вершин с добавлением не более двух ещё дешевле, а удаление хотя бы двух братских листьев с добавлением только их опорной вершины даёт \\(\\lfloor 2(n-r)/3\\rfloor+1\\le \\lfloor 2n/3\\rfloor\\) при \\(r\\ge 2\\). Исключительные оставшиеся деревья порядка 1 или 2 возникают только в конце срезания и проверяются напрямую выбором двух соседних вершин в исходном последнем фрагменте.\n\nТаким образом, каждый шаг индукции уменьшает дерево и продолжает выбранное множество, не превышая бюджет две трети. Полученное множество имеет размер не больше \\(\\lfloor 2n/3\\rfloor\\), и у каждой вершины, выбранной или нет, есть выбранный сосед.",
