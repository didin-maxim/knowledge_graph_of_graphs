        "id": "stmt-tree-total-domination-two-thirds",
        "text": "Let T be a tree on n >= 3 vertices. Then there is a set S of at most floor(2n/3) vertices such that every vertex of T has a neighbor in S. Equivalently, the total domination number of every tree of order at least 3 is at most floor(2n/3).",
