  "solutions": [
    {
      "id": "sol-complement-and-edge-reversal",
      "title": "Инвариантность чётности при перевороте ребра",
      "text": "Обозначим через h(G) число направленных гамильтоновых путей в конечном орграфе G. Сначала докажем вспомогательный факт: если n>1 и \\(\\overline G\\) — направленное дополнение G, то \\(h(G)\\equiv h(\\overline G)\\pmod 2\\). Для spanning-подграфа H графа G пусть s(H) — число нумераций вершин числами 1,...,n, при которых все дуги H идут из i в i+1. Если H не является объединением непересекающихся направленных путей, то s(H)=0; если является объединением k путей, то s(H)=k!, поэтому по модулю 2 вклад дают только сами гамильтоновы пути. Значит, \\(h(G)\\equiv \\sum_{E(H)\\subseteq E(G)}s(H)\\pmod 2\\). С другой стороны, нумерации, которые не задают гамильтонов путь в \\(\\overline G\\), — это ровно нумерации, где хотя бы одна соседняя дуга i→i+1 принадлежит G. По включениям-исключениям их число равно \\(\\sum_{E(H)\\subseteq E(G)}(-1)^{|E(H)|}s(H)\\), что по модулю 2 равно предыдущей сумме. Так как n! чётно, получаем \\(h(\\overline G)\\equiv h(G)\\pmod 2\\).\n\nТеперь пусть турнир T содержит ребро e=a→b, а T' получается из T заменой e на обратное ребро f=b→a. Положим \\(G_0=T-e\\), \\(G_e=G_0+e=T\\), \\(G_f=G_0+f=T'\\), \\(G_{ef}=G_0+e+f\\). Дополнение \\(G_{ef}\\) получается из \\(G_0\\) переворотом всех дуг; это не меняет число гамильтоновых путей, потому что каждому пути соответствует обратный порядок вершин. По вспомогательному факту \\(h(G_{ef})\\equiv h(G_0)\\pmod 2\\). При этом пути, появляющиеся при переходе от \\(G_0\\) к \\(G_{ef}\\), разбиваются на пути, использующие e, и пути, использующие f; один гамильтонов путь не может использовать обе эти противоположные дуги между a и b. Поэтому \\(h(G_{ef})-h(G_0)=(h(G_e)-h(G_0))+(h(G_f)-h(G_0))\\), откуда \\(h(G_e)+h(G_f)\\equiv h(G_{ef})+h(G_0)\\equiv0\\pmod2\\). Значит, \\(h(T)\\equiv h(T')\\pmod2\\): чётность инвариантна при перевороте одного ребра.\n\nПоследовательно перевернём ребра произвольного турнира так, чтобы получить транзитивный турнир на тех же вершинах. В транзитивном турнире существует ровно один направленный гамильтонов путь — порядок от максимальной вершины к минимальной по ориентации. Следовательно, исходный турнир имеет нечётное число гамильтоновых путей.",
