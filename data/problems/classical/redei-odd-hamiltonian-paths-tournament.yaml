      "title": "Чётность не меняется при перевороте одного ребра",
      "text": "Если два турнира отличаются только направлением одного ребра, то числа их гамильтоновых путей имеют одинаковую чётность. Поэтому любой турнир можно перевести в транзитивный турнир, где гамильтонов путь ровно один.",
