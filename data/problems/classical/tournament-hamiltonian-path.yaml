  "solutions": [
    {
      "id": "sol-insertion",
      "title": "Индукция со вставкой",
      "text": "Докажем индукцией по числу вершин. Для n=1 очевидно. Пусть в турнире без вершины x есть путь v1->v2->...->v_{n-1}. Если x->v1, ставим x в начало. Если v_{n-1}->x, ставим x в конец. Иначе найдется индекс i, для которого \\( v_i \\)->x и x->\\( v_{i+1} \\); вставляем x между \\( v_i \\) и \\( v_{i+1} \\). Получаем путь через все вершины.",
      "idea_ids": [
        "idea-insert-vertex"
      ],
      "status": "ai_checked",
      "standard_idea_ids": [
        "induction"
      ],
      "definition_ids": [
        "path",
        "tournament"
      ]
    },
    {
      "id": "sol-max-forward-edges",
      "title": "Доказательство через максимум прямых рёбер",
      "text": "Рассмотрим все линейные порядки вершин турнира и выберем такой, в котором число рёбер, направленных слева направо, максимально. Пусть это порядок v_1,...,v_n. Если для некоторого i ребро между соседними вершинами направлено назад, то есть v_{i+1}->v_i, то перестановка этих двух соседей не меняет ориентацию остальных пар, а для самой пары (v_i,v_{i+1}) превращает одно «плохое» ребро в «хорошее». Число рёбер слева направо увеличится, что противоречит максимальности выбранного порядка. Значит для каждого i выполнено v_i->v_{i+1}, и сам порядок уже задаёт гамильтонов путь.",
      "idea_ids": [
        "idea-max-forward-edges-order"
      ],
