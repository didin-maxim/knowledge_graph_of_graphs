    }
  ],
  "solutions": [
    {
      "id": "sol-insertion",
      "title": "Индукция со вставкой",
      "text": "Докажем индукцией по числу вершин. Для n=1 очевидно. Пусть в турнире без вершины x есть путь v1->v2->...->v_{n-1}. Если x->v1, ставим x в начало. Если v_{n-1}->x, ставим x в конец. Иначе найдется индекс i, для которого \\( v_i \\)->x и x->\\( v_{i+1} \\); вставляем x между \\( v_i \\) и \\( v_{i+1} \\). Получаем путь через все вершины.",
      "idea_ids": [
        "idea-insert-vertex"
      ],
