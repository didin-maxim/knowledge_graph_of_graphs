  "solutions": [
    {
      "id": "sol-insertion",
      "title": "Индукция со вставкой",
      "text": "Докажем индукцией по числу вершин. Для \\(n=1\\) утверждение очевидно. Удалим вершину \\(x\\); по предположению индукции в оставшемся турнире есть ориентированный путь \\(v_1\\to v_2\\to\\cdots\\to v_{n-1}\\), проходящий через все оставшиеся вершины. Если \\(x\\to v_1\\), ставим \\(x\\) в начало пути. Если \\(v_{n-1}\\to x\\), ставим \\(x\\) в конец. Остаётся случай \\(v_1\\to x\\) и \\(x\\to v_{n-1}\\). Тогда при движении по последовательности \\(v_1,\\ldots,v_{n-1}\\) впервые встретится вершина \\(v_{i+1}\\), которую бьёт \\(x\\); для предыдущей вершины ещё было \\(v_i\\to x\\). Поэтому можно заменить фрагмент \\(v_i\\to v_{i+1}\\) на \\(v_i\\to x\\to v_{i+1}\\). Получаем ориентированный путь через все вершины турнира.",
      "idea_ids": [
        "idea-insert-vertex"
      ],
      "status": "ai_checked",
      "standard_idea_ids": [
        "induction"
      ],
      "definition_ids": [
        "path",
        "tournament"
      ]
    },
    {
      "id": "sol-max-forward-edges",
      "title": "Доказательство через максимум прямых рёбер",
      "text": "Рассмотрим все линейные порядки вершин турнира и выберем такой, в котором число рёбер, направленных слева направо, максимально. Пусть это порядок v₁,...,vₙ. Если для некоторого i ребро между соседними вершинами направлено назад, то есть vᵢ₊₁→vᵢ, то перестановка этих двух соседей не меняет ориентацию остальных пар, а для самой пары (vᵢ,vᵢ₊₁) превращает одно «плохое» ребро в «хорошее». Число рёбер слева направо увеличится, что противоречит максимальности выбранного порядка. Значит для каждого i выполнено vᵢ→vᵢ₊₁, и сам порядок уже задаёт гамильтонов путь.",
