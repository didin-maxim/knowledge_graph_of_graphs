  "statements": {
    "original": [
      {
        "id": "stmt-original-1",
        "text": "В любом конечном турнире существует ориентированный путь, проходящий через все вершины. Турнир — это ориентированный граф, в котором между любой парой различных вершин проведена ровно одна стрелка в одну из двух сторон.",
        "source_id": "src-wikipedia-tournament",
        "status": "needs_review",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [
          "directed_graph",
          "path",
          "tournament"
        ]
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph-1",
        "text": "Если между любой парой вершин ориентированного графа проведено ровно одно ориентированное ребро, то вершины можно упорядочить \\( v_1,\\ldots,v_n \\) так, что для каждого i стрелка идет из \\( v_i \\) в \\( v_{i+1} \\).",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [
          "directed_graph",
          "path",
          "tournament"
        ]
      }
    ],
    "olympiad_reformulations": []
  },
  "ideas": [
    {
      "id": "idea-insert-vertex",
      "title": "Вставка вершины в путь",
      "text": "Новая вершина вставляется в уже построенный гамильтонов путь в первое место, где направление ребра меняется.",
      "tags": [
        "tournaments",
