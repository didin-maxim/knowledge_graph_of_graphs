  "solutions": [
    {
      "id": "sol-ear-decomposition",
      "title": "Доказательство через добавление ушей",
      "text": "Необходимость очевидна: если неориентированное ребро \\(e\\) было мостом, то после любой ориентации дуга, соответствующая \\(e\\), остается единственным переходом между двумя частями графа. В одну из сторон по этой дуге можно перейти только в одном направлении, поэтому сильной связности быть не может.\n\nДокажем достаточность. Пусть \\(G\\) связен и не имеет мостов. Начнем с любого цикла и ориентируем его циклически; полученный подграф сильно связен. Будем расширять уже построенный сильно связный ориентированный подграф \\(H\\). Если есть ребро с обоими концами в \\(H\\), его можно ориентировать произвольно: сильная связность не испортится. Если есть вершины вне \\(H\\), рассмотрим компоненту \\(K\\) графа \\(G-V(H)\\), смежную с \\(H\\). Так как мостов нет, эта компонента не может присоединяться к \\(H\\) единственным ребром: такое ребро было бы мостом. Значит, из \\(H\\) в \\(K\\) входят по крайней мере два ребра, и внутри \\(K\\) можно выбрать простой путь между соответствующими точками присоединения; вместе с двумя ребрами к \\(H\\) он дает путь, концы которого лежат в \\(H\\), а внутренние вершины лежат вне \\(H\\). Ориентируем весь этот путь от одного конца к другому и добавим его к \\(H\\). Новые вершины достижимы из старой части через начало пути, а из них можно пройти дальше до конца пути и затем куда угодно по сильной связности старого \\(H\\). Значит, сильная связность сохраняется.\n\nПовторяя этот шаг, включим все вершины и затем все оставшиеся ребра. Получим сильную ориентацию всего графа.",
