      "id": "idea-ears-orient-one-way",
      "title": "Ориентировать цикл и последовательно добавлять уши",
      "text": "Цикл ориентируется по кругу. Если уже ориентированная часть сильно связна, то новое ухо между двумя ее вершинами можно направить от одного конца к другому: до начала уха и от конца уха внутри старой части уже есть направленные пути.",
