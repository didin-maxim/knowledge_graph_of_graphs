  "solutions": [
    {
      "id": "sol-euler-suppression",
      "title": "Доказательство стягиванием цепочек",
      "text": "Если весь граф \\(H\\) является циклом, то утверждение очевидно: обхват не меньше \\(5m+1\\), значит на цикле можно взять \\(m\\) подряд идущих внутренних вершин степени \\(2\\).\n\nПусть теперь \\(H\\) не цикл и предположим, что нужного пути нет. Рассмотрим все максимальные простые пути, внутренние вершины которых имеют степень \\(2\\), а концы имеют степень не равную \\(2\\) или совпадают с точками ветвления. Стянем каждый такой путь в одно ребро. По предположению ни один из этих путей не содержит \\(m\\) внутренних вершин степени \\(2\\), поэтому каждое новое ребро заменяет путь длины не больше \\(m\\).\n\nОбозначим полученный граф через \\(H'\\). Он планарен. В нём нет вершин степени \\(1\\), потому что в \\(H\\) минимальная степень была хотя бы \\(2\\), а все вершины степени \\(2\\) были подавлены. Значит минимальная степень \\(H'\\) не меньше \\(3\\). Кроме того, в \\(H'\\) нет цикла длины не больше \\(5\\): такой цикл после разворачивания стянутых рёбер дал бы в \\(H\\) цикл длины не больше \\(5m\\), что запрещено обхватом \\(5m+1\\). В частности, петель и кратных рёбер, образующих циклы длины \\(1\\) или \\(2\\), тоже нет.\n\nИтак, \\(H'\\) — простой планарный граф минимальной степени хотя бы \\(3\\) и обхвата хотя бы \\(6\\). Пусть в нём \\(V\\) вершин, \\(E\\) рёбер и \\(F\\) граней. Из минимальной степени следует \\(2E\\ge3V\\). С другой стороны, каждая грань имеет длину не меньше \\(6\\), поэтому \\(2E\\ge6F\\), то есть \\(F\\le E/3\\). Формула Эйлера даёт \\(V-E+F=2\\), откуда \\(2\\le V-E+E/3=V-2E/3\\). Значит \\(E\\le3V/2-3\\), что противоречит \\(E\\ge3V/2\\). Противоречие доказывает существование требуемого пути.",
