  "statements": {
    "original": [
      {
        "id": "stmt-original",
        "text": "Пусть \\(G\\) — конечный простой граф, а \\(S\\subseteq V(G)\\) — подмножество заданного размера, для которого число ребер внутри \\(S\\) минимально среди всех подмножеств такого же размера. Для вершины \\(v\\) обозначим через \\(d_S(v)\\) число ее соседей в \\(S\\). Тогда для любых \\(r\\in S\\) и \\(b\\notin S\\) выполнено\n\\[\nd_S(b)-\\mathbf 1_{br}\\ge d_S(r),\n\\]\nгде \\(\\mathbf 1_{br}=1\\), если \\(b\\) и \\(r\\) смежны, и \\(0\\) иначе. В частности, \\(d_S(b)\\ge d_S(r)\\), а если \\(br\\) — ребро, то \\(d_S(b)>d_S(r)\\).",
        "source_id": "src-cmo-2020-solutions",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [
