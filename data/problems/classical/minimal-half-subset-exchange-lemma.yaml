  "ideas": [
    {
      "id": "idea-swap-cannot-improve",
      "title": "Обмен не должен уменьшать экстремальную величину",
      "text": "Если заменить \\(r\\in S\\) на \\(b\\notin S\\), то старые внутренние ребра, инцидентные \\(r\\), исчезают, а ребра от \\(b\\) к старым вершинам \\(S\\setminus\\{r\\}\\) становятся внутренними. Минимальность \\(S\\) запрещает уменьшение.",
      "tags": [
        "extremal_choice"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-one-swap",
      "title": "Доказательство одним обменом",
      "text": "Рассмотрим множество\n\\[\nS'=(S\\setminus\\{r\\})\\cup\\{b\\}.\n\\]\nОно имеет тот же размер, что и \\(S\\), поэтому по минимальности \\(S\\) число внутренних ребер в \\(S'\\) не меньше, чем в \\(S\\).\n\nПри переходе от \\(S\\) к \\(S'\\) исчезают ровно \\(d_S(r)\\) внутренних ребер: это ребра от \\(r\\) к другим вершинам \\(S\\). Появляются ровно \\(d_S(b)-\\mathbf 1_{br}\\) внутренних ребер: это ребра от \\(b\\) к вершинам из \\(S\\setminus\\{r\\}\\). Следовательно, прирост числа внутренних ребер равен\n\\[\n(d_S(b)-\\mathbf 1_{br})-d_S(r)\n\\]\nи не может быть отрицательным. Отсюда\n\\[\nd_S(b)-\\mathbf 1_{br}\\ge d_S(r).\n\\]\nЕсли \\(br\\) не является ребром, это сразу дает \\(d_S(b)\\ge d_S(r)\\). Если \\(br\\) является ребром, то \\(d_S(b)-1\\ge d_S(r)\\), то есть \\(d_S(b)>d_S(r)\\).",
