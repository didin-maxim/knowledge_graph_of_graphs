        "id": "stmt-dense-long-theta",
        "title": "Плотность больше \\(2t\\) на вершину вынуждает длинный theta-подграф",
        "text": "Пусть \\(t\\ge 1\\), а \\(G\\) — конечный простой связный граф такой, что \\(e(G)>2t|V(G)|\\). Тогда в \\(G\\) существуют вершины \\(a,b\\), ребро \\(ab\\), и два внутренне непересекающихся простых \\(a-b\\) пути, каждый длины хотя бы \\(t\\), причем вместе с ребром \\(ab\\) они образуют theta-подграф.",
