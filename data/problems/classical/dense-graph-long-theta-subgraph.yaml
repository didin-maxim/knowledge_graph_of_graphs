  "ideas": [
    {
      "id": "idea-prune-to-minimum-degree-and-use-longest-path",
      "title": "Очистить малые степени и посмотреть на конец длиннейшего пути",
      "text": "Пока есть вершина степени меньше \\(2t\\), ее можно удалить, сохранив строгую плотность \\(e>2t|V|\\) в оставшемся графе; затем берется плотная компонента с минимальной степенью хотя бы \\(2t\\). У конца длиннейшего пути все соседи лежат на этом пути, а большое число соседей дает две длинные дуги к подходящему соседу.",
