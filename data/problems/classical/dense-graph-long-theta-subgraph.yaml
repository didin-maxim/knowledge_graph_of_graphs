  "solutions": [
    {
      "id": "sol-pruning-longest-path",
      "title": "Доказательство через прореживание и длиннейший путь",
      "text": "Будем удалять из текущего графа вершины степени меньше \\(2t\\). Если в графе с \\(N\\) вершинами и \\(M>2tN\\) ребрами удалить вершину степени не больше \\(2t-1\\), то останется больше \\(2tN-(2t-1)>2t(N-1)\\) ребер, так что строгая плотность сохраняется. Поэтому после последовательных удалений останется непустой граф \\(H\\) с \\(e(H)>2t|V(H)|\\) и минимальной степенью хотя бы \\(2t\\); взяв компоненту с отношением \\(e/|V|\\) больше \\(2t\\), можно считать \\(H\\) связным.\n\nВозьмем в \\(H\\) длиннейший простой путь \\(P=x_0x_1\\ldots x_m\\). Все соседи вершины \\(x_0\\) лежат на \\(P\\), иначе путь можно было бы удлинить. Пусть эти соседи имеют индексы \\(1=i_1<i_2<\\cdots<i_r\\). Так как \\(\\delta(H)\\ge 2t\\), имеем \\(r\\ge 2t\\). Положим \\(a=x_0\\) и \\(b=x_{i_t}\\). Тогда \\(ab\\) — ребро. Первый \\(a-b\\) путь идет вдоль \\(P\\): \\(x_0x_1\\ldots x_{i_t}\\), и его длина \\(i_t\\ge t\\). Второй путь идет сначала по ребру \\(x_0x_{i_r}\\), а затем назад вдоль \\(P\\) до \\(x_{i_t}\\): \\(x_0x_{i_r}x_{i_r-1}\\ldots x_{i_t}\\). Его длина равна \\(1+i_r-i_t\\), а поскольку \\(i_r\\ge r\\ge 2t\\) и \\(i_t\\le i_r-(r-t)\\), она тоже не меньше \\(t+1\\). Внутренние вершины этих двух путей лежат соответственно на отрезках \\(x_1,\\ldots,x_{i_t-1}\\) и \\(x_{i_t+1},\\ldots,x_{i_r}\\), поэтому не пересекаются. Вместе с ребром \\(ab\\) они дают требуемый theta-подграф в \\(H\\), а значит и в исходном \\(G\\).",
      "idea_ids": [
