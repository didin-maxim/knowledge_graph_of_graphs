      "id": "sol-closure-sketch",
      "title": "Доказательство через максимальное добавление ребер",
      "text": "Добавим к G все ребра, которые можно добавить, не создавая гамильтонова цикла, и получим максимальный негамильтонов граф H. В H есть несмежные u,v, иначе H полный и гамильтонов. По условию \\( \\deg(u)+\\deg(v) \\ge n \\). Но в максимальном H граф H+uv имеет гамильтонов цикл, использующий uv; удалив uv, получаем гамильтонов путь от u к v. Стандартный аргумент с позициями соседей на этом пути и неравенством степеней замыкает путь в цикл уже в H, противоречие.",
