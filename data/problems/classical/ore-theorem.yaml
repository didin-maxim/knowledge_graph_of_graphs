      "id": "sol-closure-sketch",
      "title": "Самодостаточное доказательство через максимальное негамильтоново пополнение",
      "text": "Докажем от противного. Пусть \\(G\\) — простой граф на \\(n\\ge 3\\) вершинах, удовлетворяющий условию Оре, но не имеющий гамильтонова цикла.\n\nБудем добавлять к \\(G\\) недостающие ребра, пока это возможно без появления гамильтонова цикла. Так как недостающих ребер конечно много, процесс закончится. Обозначим полученный граф через \\(H\\). Тогда \\(H\\) имеет те же \\(n\\) вершин, содержит все ребра \\(G\\), сам не имеет гамильтонова цикла и максимален с этим свойством: если \\(xy\\) — любое ребро, которого нет в \\(H\\), то граф \\(H+xy\\) уже имеет гамильтонов цикл.\n\nПроверим, что условие Оре сохранилось для графа \\(H\\). Если две вершины \\(x,y\\) несмежны в \\(H\\), то они были несмежны и в исходном графе \\(G\\), потому что при переходе от \\(G\\) к \\(H\\) ребра только добавлялись. Кроме того, степени вершин не уменьшались, значит\n\\[\n\\deg_H(x)+\\deg_H(y)\\ge \\deg_G(x)+\\deg_G(y)\\ge n.\n\\]\nИтак, всякая несмежная пара в \\(H\\) тоже имеет сумму степеней хотя бы \\(n\\).\n\nГраф \\(H\\) не может быть полным: полный граф на \\(n\\ge 3\\) вершинах имеет гамильтонов цикл, например обход всех вершин в любом порядке и возвращение в первую. Поэтому в \\(H\\) есть несмежные вершины \\(u\\) и \\(v\\). По максимальности \\(H\\) граф \\(H+uv\\) гамильтонов. Любой гамильтонов цикл в \\(H+uv\\) обязан использовать новое ребро \\(uv\\), иначе этот же цикл целиком лежал бы в \\(H\\), что запрещено. Удалим из такого цикла ребро \\(uv\\). Останется гамильтонов путь в \\(H\\), проходящий через все вершины ровно по одному разу; занумеруем его так:\n\\[\nv_1,v_2,\\ldots,v_n,\n\\]\nгде \\(v_1=u\\), \\(v_n=v\\). При этом \\(v_1v_n\\notin E(H)\\).\n\nТеперь покажем, что этот путь можно замкнуть в цикл уже в \\(H\\). Рассмотрим два множества индексов\n\\[\nA=\\{i:1\\le i\\le n-1,\\ v_i v_n\\in E(H)\\},\\qquad\nB=\\{i:1\\le i\\le n-1,\\ v_1 v_{i+1}\\in E(H)\\}.\n\\]\nМножество \\(A\\) перечисляет всех соседей конца \\(v_n\\) на пути: все вершины графа лежат на пути, сам \\(v_n\\) себе не сосед, а \\(v_1v_n\\) не является ребром. Поэтому \\(|A|=\\deg_H(v_n)\\). Точно так же \\(B\\) перечисляет всех соседей конца \\(v_1\\): сосед \\(v_{i+1}\\) соответствует единственному индексу \\(i\\), и вершина \\(v_n\\) не добавляет лишнего индекса, потому что \\(v_1v_n\\notin E(H)\\). Значит, \\(|B|=\\deg_H(v_1)\\).\n\nЕсли бы множества \\(A\\) и \\(B\\) не пересекались, то они были бы двумя непересекающимися подмножествами множества \\(\\{1,2,\\ldots,n-1\\}\\). Тогда\n\\[\n\\deg_H(v_1)+\\deg_H(v_n)=|B|+|A|\\le n-1,\n\\]\nчто противоречит уже доказанному условию Оре для несмежных вершин \\(v_1\\) и \\(v_n\\) в графе \\(H\\). Следовательно, существует индекс \\(i\\), принадлежащий обоим множествам. Это означает, что в \\(H\\) одновременно есть ребра \\(v_i v_n\\) и \\(v_1v_{i+1}\\).\n\nИспользуем эти два ребра, чтобы построить гамильтонов цикл в \\(H\\). Идем из \\(v_1\\) по ребру к \\(v_{i+1}\\), затем вдоль исходного пути вперед до \\(v_n\\), потом по ребру \\(v_nv_i\\), после чего возвращаемся вдоль исходного пути назад через \\(v_{i-1},v_{i-2},\\ldots\\) к \\(v_1\\). Получается цикл\n\\[\nv_1,v_{i+1},v_{i+2},\\ldots,v_n,v_i,v_{i-1},\\ldots,v_1.\n\\]\nОн проходит через каждую вершину пути ровно один раз, а путь содержит все вершины \\(H\\). Значит, это гамильтонов цикл в \\(H\\), противоречие с выбором \\(H\\) как негамильтонова графа.\n\nПротиворечие показывает, что исходное предположение было неверным. Следовательно, всякий простой граф на \\(n\\ge 3\\) вершинах, удовлетворяющий условию Оре, имеет гамильтонов цикл.",
