        "id": "stmt-original-1",
        "text": "Пусть G — простой граф на n>=3 вершинах. Если для любых двух несмежных вершин u и v выполнено \\( \\deg(u)+\\deg(v) \\ge n \\), то в G существует гамильтонов цикл, то есть цикл, проходящий через все вершины ровно один раз.",
