  "solutions": [
    {
      "id": "sol-closure-sketch",
      "title": "Доказательство через максимальное добавление ребер",
      "text": "Предположим, что G не гамильтонов. Добавим к G все ребра, которые можно добавить, не создавая гамильтонова цикла, и получим максимальный по включению негамильтонов надграф H на тех же n вершинах. Для любой несмежной пары x,y в H эта пара была несмежной и в G, а степени при добавлении ребер только увеличиваются, поэтому в H также выполнено \\( \\deg_H(x)+\\deg_H(y) \\ge n \\). В H есть несмежные вершины u,v, иначе H был бы полным графом и имел бы гамильтонов цикл. По максимальности граф H+uv уже гамильтонов; более того, всякий его гамильтонов цикл обязан использовать новое ребро uv, иначе такой цикл лежал бы в H. Удалив uv из этого цикла, получаем гамильтонов путь \\( v_1,v_2,\\ldots,v_n \\) в H, где \\( v_1=u \\) и \\( v_n=v \\). Рассмотрим множества индексов \\( A=\\{i: 1\\le i\\le n-1,\\ v_i v_n\\in E(H)\\} \\) и \\( B=\\{i: 1\\le i\\le n-1,\\ v_1 v_{i+1}\\in E(H)\\} \\). Тогда \\( |A|=\\deg_H(v_n) \\), потому что все соседи \\( v_n \\) лежат на этом пути и \\( v_1v_n\\notin E(H) \\), а \\( |B|=\\deg_H(v_1) \\). Если бы A и B не пересекались, то \\( \\deg_H(v_1)+\\deg_H(v_n)=|A|+|B|\\le n-1 \\), что противоречит условию Оре для несмежных \\( v_1,v_n \\). Значит, существует индекс i, для которого одновременно \\( v_i v_n\\in E(H) \\) и \\( v_1 v_{i+1}\\in E(H) \\). Тогда \\( v_1,v_{i+1},v_{i+2},\\ldots,v_n,v_i,v_{i-1},\\ldots,v_1 \\) — гамильтонов цикл в H. Это противоречит выбору H как негамильтонова графа. Следовательно, исходный граф G гамильтонов.",
