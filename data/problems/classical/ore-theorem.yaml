      "title": "Добавление ребер",
      "text": "Если к негамильтонову графу максимально добавлять недостающие ребра, то любое оставшееся недостающее ребро после добавления создает гамильтонов цикл; удаление этого ребра дает гамильтонов путь, который замыкается позиционным аргументом по сумме степеней.",
