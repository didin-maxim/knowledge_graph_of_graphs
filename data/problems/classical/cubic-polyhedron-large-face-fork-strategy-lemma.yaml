        "id": "stmt-large-face-fork",
        "title": "Лемма о большой грани и вилке",
        "text": "Пусть дан скелет выпуклого многогранника с фиксированным вложением на сфере; в каждой его вершине сходятся ровно три ребра. Рассмотрим игру на гранях: два игрока по очереди выбирают ранее не выбранную грань, а игрок выигрывает, если после своего хода владеет всеми тремя гранями, инцидентными некоторой вершине. Тогда выполнены два утверждения. (1) Если у многогранника не меньше пяти граней, то существует грань, ограниченная не менее чем четырьмя ребрами. (2) Если первый игрок первым ходом выбирает любую грань \\(A\\), ограниченную \\(k\\ge4\\) ребрами, то после любого первого ответа второго игрока первый игрок может создать две одновременные угрозы и выиграть не позднее своего третьего хода.",
