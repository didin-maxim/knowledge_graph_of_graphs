  "solutions": [
    {
      "id": "sol-euler-large-face-and-fork",
      "title": "Доказательство через Эйлера и локальную вилку",
      "text": "Сначала докажем существование большой грани. Обозначим через \\(V,E,F\\) числа вершин, ребер и граней многогранника. Так как в каждой вершине сходятся ровно три ребра, двойной счет концов ребер дает \\(3V=2E\\). Предположим, что все грани треугольные. Тогда сумма длин границ граней равна \\(3F\\), а каждое ребро при таком счете входит в границы двух граней, значит \\(3F=2E\\). По формуле Эйлера для связного скелета выпуклого многогранника \\(V-E+F=2\\). Из \\(V=2E/3\\) и \\(F=2E/3\\) получаем \\(2E/3-E+2E/3=2\\), то есть \\(E=6\\) и \\(F=4\\). Следовательно, если \\(F\\ge5\\), не все грани треугольные; поскольку каждая грань имеет хотя бы три стороны, есть грань \\(A\\) длины \\(k\\ge4\\).\n\nТеперь докажем игровую часть для любой такой грани \\(A\\). Пусть первый игрок первым ходом выбирает \\(A\\). Перечислим грани, соседние с \\(A\\) по ее сторонам, в циклическом порядке обхода границы: \\(H_1,H_2,\\ldots,H_k\\). Эти грани попарно различны: у двух разных граней выпуклого многогранника не может быть двух разных общих ребер. После первого хода второго игрока среди \\(H_1,\\ldots,H_k\\) занята не более одна грань. В цикле длины \\(k\\ge4\\) с не более чем одной занятой позицией найдутся три подряд свободные позиции. Назовем соответствующие грани \\(B,C,D\\), где \\(C\\) стоит между \\(B\\) и \\(D\\). Вторым ходом первый игрок выбирает \\(C\\).\n\nГрани \\(B\\) и \\(C\\) примыкают к двум соседним сторонам грани \\(A\\); эти стороны имеют общий конец, и в этой вершине, из-за степени 3, инцидентны ровно три грани: \\(A,B,C\\). Поэтому ход первого игрока в \\(B\\) сразу завершил бы выигрышную тройку. Аналогично \\(A,C,D\\) имеют общую вершину на другом конце стороны, общей для \\(A\\) и \\(C\\), так что ход в \\(D\\) тоже сразу выигрывает. Второй игрок своим вторым ходом еще не может выиграть, потому что после него владеет только двумя гранями, и этим ходом может занять не более одной из граней \\(B,D\\). Значит, третьим ходом первый игрок выбирает оставшуюся свободной грань из \\(B,D\\) и выигрывает.",
