  "solutions": [
    {
      "id": "sol-first-nonzero-involution",
      "title": "Явное разбиение на пары",
      "text": "Возьмём произвольную ненулевую строку \\(x=(x_1,\\ldots,x_n)\\). Пусть \\(i\\) — первая координата, в которой \\(x_i\\ne0\\). Тогда \\(x_i\\) равно либо 1, либо 2. Определим строку \\(f(x)\\): все координаты, кроме \\(i\\)-й, оставим прежними, а в \\(i\\)-й заменим 1 на 2 или 2 на 1.\n\nСтрока \\(f(x)\\) тоже ненулевая. Она отличается от \\(x\\) ровно в одной координате, и значение в этой координате изменилось на 1, значит \\(x\\) и \\(f(x)\\) смежны в \\(G_n\\). Кроме того, у \\(f(x)\\) первая ненулевая координата снова равна \\(i\\), поскольку все координаты перед \\(i\\) остались нулевыми, а \\(i\\)-я осталась ненулевой. Поэтому повторное применение той же операции возвращает исходную строку: \\(f(f(x))=x\\).\n\nНаконец, \\(f(x)\\ne x\\) для любой ненулевой строки. Значит, \\(f\\) является инволюцией без неподвижных точек на множестве вершин \\(G_n\\). Разобьём вершины на двухэлементные орбиты \\(\\{x,f(x)\\}\\). Каждая такая орбита является ребром графа, и разные орбиты не пересекаются, поэтому эти рёбра образуют совершенное паросочетание.",
