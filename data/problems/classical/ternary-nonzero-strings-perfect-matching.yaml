        "id": "stmt-graph",
        "title": "Формулировка через индуцированный граф",
        "text": "Пусть \\(G_n\\) — граф на множестве вершин \\(\\{0,1,2\\}^n\\setminus\\{0^n\\}\\), где две вершины смежны тогда и только тогда, когда соответствующие строки отличаются ровно в одной координате на 1. Докажите, что \\(G_n\\) имеет совершенное паросочетание.",
