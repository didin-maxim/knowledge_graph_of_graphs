        "id": "stmt-nonzero-ternary-strings",
        "title": "Лемма о ненулевых троичных строках",
        "text": "Пусть \\(n\\ge1\\). Рассмотрим все строки длины \\(n\\) над алфавитом \\(\\{0,1,2\\}\\), кроме строки \\(0^n\\). Две строки считаются соседними, если они отличаются ровно в одной координате, причём значения в этой координате отличаются на 1. Тогда все ненулевые строки можно разбить на пары соседних строк.",
        "source_id": "src-putnam-2025-A3-official",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
