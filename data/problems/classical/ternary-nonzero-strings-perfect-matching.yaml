      "id": "idea-first-nonzero-coordinate",
      "title": "Первая ненулевая координата задаёт пару",
      "text": "У ненулевой строки первая ненулевая координата равна 1 или 2; если заменить в ней 1 на 2 или 2 на 1, все предыдущие координаты останутся нулевыми, поэтому у партнёра первая ненулевая координата та же.",
      "tags": [
        "matching"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-fixed-point-free-involution",
      "title": "Инволюция без неподвижных точек даёт паросочетание",
      "text": "Операция смены 1 и 2 в первой ненулевой координате обратна сама себе и никогда не оставляет строку на месте. Поэтому её орбиты — пары, а каждая пара соединена ребром графа.",
      "tags": [
        "matching"
      ],
      "status": "ai_checked"
    }
