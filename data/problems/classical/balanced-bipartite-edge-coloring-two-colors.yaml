  "solutions": [
    {
      "id": "sol-balanced-edge-coloring",
      "title": "Единое решение",
      "text": "Докажем графовую формулировку. В каждой компоненте двудольного графа числа вершин нечётной степени в двух долях имеют одинаковую чётность. Разобьём нечётные вершины каждой доли на пары, а если в обеих долях осталось по одной нечётной вершине, соединим эти две вершины. Для каждой такой пары добавим фиктивное ребро. Получится двудольный эйлеров мультиграф: все степени стали чётными.\n\nРазложим его рёбра на эйлеровы циклы и покрасим рёбра каждого цикла попеременно в два цвета. Поскольку граф двудольный, все эти циклы чётные; значит, на каждом цикле у каждой вершины поровну инцидентных рёбер двух цветов. Поэтому в графе с фиктивными рёбрами баланс в каждой вершине точный. Удалим фиктивные рёбра. Каждая исходно нечётная вершина была инцидентна ровно одному фиктивному ребру, а исходно чётные вершины — ни одному, поэтому после удаления в каждой вершине числа рёбер двух цветов отличаются не более чем на 1.\n\nДля задачи IMO строим двудольный граф, в котором вершины одной доли — занятые горизонтали, вершины другой доли — занятые вертикали, а каждая точка — ребро между своей горизонталью и вертикалью. Цвет ребра задаёт цвет точки. Условие баланса в вершине графа в точности означает баланс красных и белых точек на соответствующей горизонтали или вертикали.",
