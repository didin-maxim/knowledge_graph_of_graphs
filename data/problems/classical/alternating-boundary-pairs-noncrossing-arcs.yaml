  "solutions": [
    {
      "id": "sol-jordan-separation",
      "title": "Разделение простой замкнутой кривой",
      "text": "Проведем дугу \\(\\alpha\\), соединяющую \\(A\\) с \\(C\\). На границе диска есть две граничные дуги между \\(A\\) и \\(C\\): одна содержит \\(B\\), другая содержит \\(D\\). Возьмем ту граничную дугу, которая содержит \\(B\\), и объединим ее с \\(\\alpha\\). Получится простая замкнутая кривая.\n\nПо теореме Жордана эта кривая делит диск на две области. Точка \\(D\\) лежит на другой граничной дуге между \\(A\\) и \\(C\\), поэтому она находится по другую сторону от точки \\(B\\). Следовательно, любая дуга из \\(B\\) в \\(D\\) внутри диска обязана пересечь построенную замкнутую кривую. Она не может пересечь выбранную граничную дугу, если ее внутренняя часть лежит внутри диска и ее концы — только \\(B\\) и \\(D\\). Значит она должна пересечь \\(\\alpha\\). Поэтому дуги \\(AC\\) и \\(BD\\) не могут быть непересекающимися.",
