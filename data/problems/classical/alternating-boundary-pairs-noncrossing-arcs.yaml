  "statements": {
    "original": [
      {
        "id": "stmt-original",
        "text": "Пусть \\(A,B,C,D\\) — четыре различные точки на границе диска, расположенные на ней в циклическом порядке \\(A,B,C,D\\). Тогда две простые дуги внутри диска, соединяющие \\(A\\) с \\(C\\) и \\(B\\) с \\(D\\), не могут быть непересекающимися.",
