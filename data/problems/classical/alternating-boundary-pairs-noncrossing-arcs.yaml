    {
      "id": "idea-one-arc-separates-alternating-endpoints",
      "title": "Одна диагональная дуга разделяет два оставшихся конца",
      "text": "Дуга \\(AC\\) вместе с одной из двух граничных дуг между \\(A\\) и \\(C\\) образует простую замкнутую кривую; при чередующемся порядке точек \\(B\\) и \\(D\\) оказываются по разные стороны этой кривой.",
