  "solutions": [
    {
      "id": "sol-cycle-obstruction-and-unused-components",
      "title": "Цикловое препятствие и компоненты неиспользованных рёбер",
      "text": "Сначала предположим, что \\(G-c\\) содержит цикл \\(Z\\). Удалим рёбра \\(Z\\). Так как \\(G\\) эйлеров, а удаление цикла меняет степень каждой вершины на \\(Z\\) на 2, в графе \\(G-E(Z)\\) все степени по-прежнему чётны. Значит, компонента графа \\(G-E(Z)\\), содержащая \\(c\\), имеет эйлеров цикл. Возьмём этот цикл как начальный путь из \\(c\\). Он использует все рёбра своей компоненты и возвращается в \\(c\\), но рёбра \\(Z\\) остаются неиспользованными и уже недостижимы продолжением из \\(c\\) по неиспользованному ребру. Следовательно, не всякий путь из \\(c\\) продолжается.\n\nТеперь пусть \\(G-c\\) — лес. Возьмём любой путь \\(P\\) без повторения рёбер, начинающийся в \\(c\\), и пусть его текущий конец равен \\(x\\). Обозначим через \\(R=G-E(P)\\) граф неиспользованных рёбер. В \\(R\\) все вершины имеют чётную степень, кроме, возможно, \\(c\\) и \\(x\\); если \\(x\\ne c\\), именно эти две вершины имеют нечётную неиспользованную степень, а если \\(x=c\\), все неиспользованные степени чётны.\n\nРассмотрим связную компоненту \\(K\\) графа \\(R\\), не содержащую \\(x\\). Если \\(K\\) содержит \\(c\\), то обязательно \\(x\\ne c\\), и в \\(K\\) ровно одна вершина нечётной степени, что невозможно по лемме о рукопожатиях. Если \\(K\\) не содержит \\(c\\), то все степени в \\(K\\) чётны, но \\(K\\) является подграфом леса \\(G-c\\). Непустой лес хотя бы с одним ребром имеет лист степени 1, противоречие. Значит, каждая компонента \\(R\\), не содержащая \\(x\\), не имеет рёбер.\n\nПоэтому, если неиспользованные рёбра ещё остались, они лежат в компоненте \\(R\\), содержащей \\(x\\), и некоторое неиспользованное ребро инцидентно \\(x\\). Значит, путь можно продлить на одно ребро. Повторяя этот шаг, мы в конце используем все рёбра. Полный путь обязан закончиться в \\(c\\), потому что в \\(G\\) все степени чётны. Следовательно, это эйлеров цикл, продолжающий исходный путь.\n\nНаконец, \\(G-c\\) является лесом ровно тогда, когда ни один цикл \\(G\\) не избегает \\(c\\), то есть когда каждый цикл \\(G\\) содержит \\(c\\).",
