      "id": "idea-cycle-left-behind",
      "title": "Цикл вне центра можно оставить позади",
      "text": "Если цикл не проходит через \\(c\\), сначала удалим его рёбра. Компонента, содержащая \\(c\\), всё ещё эйлерова, поэтому можно обойти все её рёбра и вернуться в \\(c\\), оставив этот цикл в отдельной неиспользованной компоненте.",
