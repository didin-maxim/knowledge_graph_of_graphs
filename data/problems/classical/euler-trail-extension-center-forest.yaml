        "id": "stmt-euler-trail-extension-center-forest",
        "title": "Критерий продления пути из центральной вершины",
        "text": "Пусть \\(G\\) — конечный связный эйлеров граф, а \\(c\\in V(G)\\). Тогда любой путь без повторения рёбер, начинающийся в \\(c\\), можно продолжить неиспользованными рёбрами до эйлерова цикла графа \\(G\\) тогда и только тогда, когда \\(G-c\\) является лесом. Эквивалентно, каждый цикл графа \\(G\\) содержит \\(c\\). Для мультиграфов здесь используется обычное соглашение, что параллельные рёбра образуют цикл длины 2.",
