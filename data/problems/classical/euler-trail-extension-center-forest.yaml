      "title": "Неиспользованные рёбра остаются при текущем конце",
      "text": "После любого пути без повторения рёбер из \\(c\\) в \\(x\\) в графе неиспользованных рёбер нечётными могут быть только \\(c\\) и \\(x\\). Компонента неиспользованных рёбер вне \\(x\\) либо содержала бы ровно одну нечётную вершину, либо была бы ненулевым подграфом леса \\(G-c\\), все степени которого чётны; оба варианта невозможны.",
