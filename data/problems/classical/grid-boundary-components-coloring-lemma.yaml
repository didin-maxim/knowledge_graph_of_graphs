      "title": "Компоненты границы добавляют области по одной",
      "text": "Если стирать все границы между разными цветами, остаётся одна область. Возвращая нетривиальные компоненты графа границ по одной, каждая новая компонента может увеличить число монохроматических областей не более чем на один.",
