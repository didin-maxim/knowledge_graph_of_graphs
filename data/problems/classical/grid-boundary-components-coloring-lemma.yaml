    {
      "id": "idea-local-degrees-limit-components",
      "title": "Локальные степени ограничивают число компонент",
      "text": "В углах доски степень в графе границ равна нулю; в неугловых граничных узлах она равна 0 или 1; во внутренних узлах она чётна, то есть равна 0, 2 или 4. Поэтому почти каждая нетривиальная компонента требует как минимум четыре узла решётки, а исключения возможны только около четырёх углов.",
