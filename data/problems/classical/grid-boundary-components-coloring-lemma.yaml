  "solutions": [
    {
      "id": "sol-boundary-component-count",
      "title": "Граф границ и подсчёт компонент",
      "text": "Пусть \\(N\\) — число нетривиальных компонент графа границ \\(B\\).\n\nСначала докажем оценку на число областей. Если забыть все границы между разными цветами, вся доска является одной связной областью в смысле движения между клетками через общую вершину. Теперь добавим обратно нетривиальные компоненты границы по одной. Рёбра одной такой компоненты образуют связную преграду между красными и синими клетками; при добавлении этой преграды уже существующая область либо не делится, либо делится на две части. Значит, каждая компонента увеличивает число монохроматических областей не более чем на \\(1\\), и всего областей не больше \\(N+1\\).\n\nОсталось оценить \\(N\\) для нечётного \\(n\\). В угловых узлах решётки степень в \\(B\\) равна \\(0\\), потому что через угол не проходит внутренняя сторона между двумя клетками. В неугловом узле на границе доски степень равна \\(0\\) или \\(1\\). Во внутреннем узле сходятся четыре клетки; при обходе вокруг узла цвет меняется чётное число раз, поэтому степень этого узла в \\(B\\) равна \\(0\\), \\(2\\) или \\(4\\).\n\nРассмотрим нетривиальную компоненту. Если она не содержит граничных узлов, то все её вершины имеют степень хотя бы \\(2\\), а в квадратной решётке нет треугольников, поэтому в ней не меньше четырёх вершин. Если компонента содержит граничные узлы, то её концы на границе имеют степень \\(1\\), а внутренние вершины — степень \\(2\\) или \\(4\\). Компонента с менее чем четырьмя вершинами может появиться только возле угла доски: иначе два граничных конца нельзя соединить одним или двумя рёбрами решётки, не нарушив чётность степеней во внутренних узлах. Таких исключительных компонент не больше четырёх, по одной возле каждого угла.\n\nСледовательно, по сравнению с грубой оценкой \"четыре вершины на каждую нетривиальную компоненту\" можно потерять не больше четырёх вершин. Иными словами, все нетривиальные компоненты вместе занимают не менее \\(4N-4\\) узлов решётки. Четыре угловых узла имеют степень \\(0\\) и не входят ни в одну нетривиальную компоненту, поэтому всего узлов решётки не меньше\n\\[\n(4N-4)+4=4N.\n\\]\nТак как всего узлов \\((n+1)^2\\), получаем \\(4N\\le (n+1)^2\\), то есть \\(N\\le (n+1)^2/4\\).",
