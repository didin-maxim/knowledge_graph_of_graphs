        "id": "stmt-boundary-components",
        "text": "Рассмотрим раскраску клеток доски \\(n\\times n\\) в два цвета. Построим граф границ \\(B\\): его вершины — все \\((n+1)^2\\) узлов решётки, а две соседние по стороне решётки вершины соединены ребром тогда и только тогда, когда соответствующий отрезок является общей стороной двух клеток разных цветов. Компоненту графа \\(B\\), содержащую хотя бы одно ребро, назовём нетривиальной. Тогда число монохроматических областей клеток, где клетки одной области имеют один цвет и связаны через общие вершины, не превосходит числа нетривиальных компонент графа \\(B\\) плюс \\(1\\). Кроме того, если \\(n\\) нечётно, то число нетривиальных компонент графа \\(B\\) не превосходит \\((n+1)^2/4\\).",
