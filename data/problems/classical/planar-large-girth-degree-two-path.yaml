  "solutions": [
    {
      "id": "sol-contract-two-paths-and-euler",
      "title": "Стягивание 2-путей и формула Эйлера",
      "text": "Если какая-то компонента графа \\(H\\) является циклом, то из условия на обхват ее длина не меньше \\(5m+1\\), и на этом цикле можно взять любой путь из \\(m+1\\) ребер. Все его внутренние вершины имеют степень \\(2\\).\n\nОстается случай, когда есть нециклическая компонента. Будем работать в ней; минимальная степень по-прежнему не меньше \\(2\\). Предположим, что нужного пути нет. Стянем каждый максимальный путь, внутренние вершины которого имеют степень \\(2\\), в одно ребро. Концы такого максимального пути имеют степень хотя бы \\(3\\), а сам путь, по предположению, имеет длину не больше \\(m\\): иначе первые \\(m\\) внутренних вершин уже дали бы требуемый путь.\n\nОбозначим полученный граф через \\(K\\). Стягивание сохраняет планарность. В \\(K\\) нет петель: петля соответствовала бы циклу в \\(H\\) длины не больше \\(m\\). В \\(K\\) нет и кратных ребер: две параллельные дуги поднимались бы в два пути между одними и теми же концами, каждый длины не больше \\(m\\), а вместе они давали бы цикл длины не больше \\(2m\\). Значит, \\(K\\) — простой планарный граф. Кроме того, все его вершины имеют степень хотя бы \\(3\\).\n\nЕсли в \\(K\\) есть цикл длины \\(r\\le 5\\), то каждое его ребро поднимается в путь длины не больше \\(m\\), поэтому в \\(H\\) появился бы цикл длины не больше \\(rm\\le 5m\\), что противоречит обхвату не меньше \\(5m+1\\). Следовательно, обхват \\(K\\) не меньше \\(6\\).\n\nПусть у связного плоского вложения \\(K\\) есть \\(V\\) вершин, \\(E\\) ребер и \\(F\\) граней. Так как каждая грань имеет длину хотя бы \\(6\\), имеем \\(2E\\ge 6F\\). Из формулы Эйлера \\(V-E+F=2\\) следует \\(E\\le 3V/2-3\\). С другой стороны, минимальная степень хотя бы \\(3\\) дает \\(2E\\ge 3V\\), то есть \\(E\\ge 3V/2\\). Полученное противоречие доказывает лемму.",
