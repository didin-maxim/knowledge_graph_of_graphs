        "title": "Длинная цепочка вершин степени 2",
        "text": "Пусть \\(m\\ge 1\\), а \\(H\\) — конечный планарный граф с минимальной степенью хотя бы \\(2\\) и обхватом не меньше \\(5m+1\\). Тогда в \\(H\\) есть простой путь \\(v_0v_1\\ldots v_{m+1}\\), у которого все внутренние вершины \\(v_1,\\ldots,v_m\\) имеют степень \\(2\\) в \\(H\\).",
