        "id": "stmt-sim-no-draw",
        "title": "В полной партии SIM обязательно появляется проигравший",
        "text": "На рёбрах полного графа \\(K_6\\) два игрока по очереди красят по одному ещё не окрашенному ребру, каждый -- своим цветом. Игрок немедленно проигрывает, если после его хода три ребра его цвета образуют треугольник. Докажите, что ничья невозможна: не удастся окрасить все рёбра, не создав одноцветного треугольника.",
