  "solutions": [
    {
      "id": "sol-ramsey-r33",
      "title": "Доказательство через шесть рёбер из одной вершины",
      "text": "Предположим, что все рёбра \\(K_6\\) удалось окрасить двумя цветами без одноцветного треугольника. Выберем вершину \\(v\\). Из неё выходят пять рёбер, поэтому по принципу Дирихле не менее трёх из них имеют один цвет. Пусть, например, рёбра \\(va,vb,vc\\) красные.\n\nЕсли хотя бы одно из рёбер \\(ab,bc,ca\\) красное, то оно вместе с двумя красными рёбрами из \\(v\\) образует красный треугольник. Если ни одно из них не красное, то все три рёбра \\(ab,bc,ca\\) синие и образуют синий треугольник. В обоих случаях получено противоречие. Значит, всякая двухцветная раскраска рёбер \\(K_6\\) содержит одноцветный треугольник.\n\nТеперь вернёмся к игре. Если бы никто не проиграл раньше, после окраски последнего ребра получилась бы полная двухцветная раскраска \\(K_6\\), а потому в ней имелся бы одноцветный треугольник. Рассмотрим первый ход, после которого такой треугольник появился. На этом ходу меняется только набор рёбер цвета сделавшего ход игрока, поэтому новый треугольник имеет именно его цвет; по правилам этот игрок немедленно проигрывает. Следовательно, ничья невозможна.",
      "idea_ids": [
        "idea-r33-forces-loss"
      ],
