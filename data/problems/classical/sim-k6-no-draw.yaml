  "ideas": [
    {
      "id": "idea-r33-forces-loss",
      "title": "Последняя позиция была бы двухцветной раскраской \\(K_6\\)",
      "text": "Если бы партия дошла до полной раскраски без проигрыша, два цвета дали бы раскраску рёбер \\(K_6\\) без одноцветного треугольника. Это невозможно по элементарному доказательству \\(R(3,3)\\le6\\).",
