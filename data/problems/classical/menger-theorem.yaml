    {
      "id": "sol-flow-sketch",
      "title": "Доказательство через поток",
      "text": "Пусть G имеет n вершин, а s и t различны и несмежны. Сначала зафиксируем конечный целочисленный факт о потоках, чтобы не ссылаться на него извне. В конечной сети с целыми неотрицательными пропускными способностями начнем с нулевого потока и, пока в остаточной сети есть путь из источника a в сток b, увеличиваем поток вдоль такого пути на минимальную остаточную емкость его дуг. Эта величина положительна и цела, поэтому поток всегда остается целочисленным и его значение каждый раз возрастает хотя бы на 1; значение потока не превосходит суммарной емкости дуг, выходящих из a, значит процесс конечен. Когда остаточного a-b пути уже нет, пусть R — множество вершин, достижимых из a в остаточной сети. Тогда b не принадлежит R. Для всякой дуги u→v из R наружу ее прямая остаточная емкость равна 0, то есть f(u,v)=c(u,v); для всякой дуги v→u снаружи в R обратная остаточная емкость равна 0, то есть f(v,u)=0. Поэтому значение потока равно чистому потоку из R наружу, а он равен емкости разреза (R,V\\R). Значит построенный поток максимален, этот разрез минимален, и максимальный поток можно выбрать целочисленным.\n\nНам также понадобится разложение целочисленного потока. Если целочисленный a-b поток имеет положительное значение, то в подграфе дуг с положительным потоком существует a-b путь: иначе для множества вершин, достижимых из a по положительным дугам, чистый поток наружу был бы неположительным, что противоречит положительному значению потока. Выберем простой такой путь и вычтем по 1 из потока на всех его дугах. Сохранение потока в промежуточных вершинах не нарушается, значение уменьшается на 1, а поток остается целым и неотрицательным. Повторяя, раскладываем поток значения k в k единичных a-b путей; возможные циклы с потоком нам не нужны.\n\nТеперь построим ориентированную сеть для G. Для каждой вершины v создадим две копии vᵢn и v_out. Если v не равно s,t, проведем дугу vᵢn → v_out пропускной способности 1; для s и t эту внутреннюю дугу считаем имеющей пропускную способность M=n+1, чтобы разрез не платил за концы путей. Каждое неориентированное ребро xy заменим двумя дугами x_out → y_in и y_out → x_in пропускной способности M. Источник возьмем s_out, сток — t_in. Так как удаление всех вершин, кроме s,t, отделяет s от t, существует разрез емкости не больше n-2; значит минимальный разрез не использует дуги емкости M и состоит только из внутренних дуг vᵢn → v_out для некоторых v не равно s,t. Такое множество вершин действительно отделяет s от t: если бы в G после их удаления остался s-t путь, то его копия в сети прошла бы из источника в сток, не пересекая выбранный разрез. Обратно, любой вершинный разделитель X дает разрез емкости |X|, если перерезать дуги x_in → x_out для x из X. Поэтому минимальная емкость s-t разреза в сети равна минимальному размеру вершинного s-t разделителя в G.\n\nПо доказанному выше конечному целочисленному случаю max-flow/min-cut эта величина равна значению некоторого целочисленного максимального потока. Разложим его на единичные s_out-t_in пути в сети. Возвращая каждому такому пути исходные вершины G и удаляя возможные повторения вершин из получившегося маршрута, получаем s-t пути. Две разные единицы потока не могут пройти через одну и ту же внутреннюю вершину v, потому что всякий проход через v использует дугу vᵢn → v_out, а ее емкость равна 1. Следовательно, полученные пути попарно не имеют общих внутренних вершин. Значит число внутренне непересекающихся s-t путей не меньше размера минимального разделителя. Противоположное неравенство очевидно: каждый s-t разделитель должен содержать внутреннюю вершину каждого из попарно внутренне непересекающихся путей, причем для разных путей эти вершины различны. Итак, максимальное число таких путей равно минимальному размеру разделителя.",
