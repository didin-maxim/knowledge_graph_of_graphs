      "text": "Поставим емкость 1 на каждую дугу ориентированного графа и применим конечный целочисленный аргумент max-flow/min-cut, уже доказанный в этой карточке. Целочисленный поток значения \\(r\\) раскладывается в \\(r\\) единичных \\(s\\)-\\(t\\) путей; поскольку каждая дуга имеет емкость 1, эти пути попарно не пересекаются по дугам. Обратно, любое семейство дугово-непересекающихся путей пересекает каждый \\(s\\)-\\(t\\) разрез в различных дугах, поэтому число путей не превосходит размера разреза. Значит максимальное число таких путей равно минимальному размеру дугового разреза. Неориентированная реберная версия получается тем же аргументом с единичными емкостями на ребрах.",
