  "statements": {
    "original": [
      {
        "id": "stmt-original-1",
        "text": "Пусть s и t — две различные несмежные вершины конечного неориентированного графа. Минимальное число вершин, удаление которых отделяет s от t, равно максимальному числу путей из s в t, не имеющих общих внутренних вершин.",
        "source_id": "src-wikipedia-menger",
        "status": "needs_review",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [
          "path",
          "connected_graph"
        ]
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph-1",
        "text": "Для различных несмежных вершин s,t в конечном графе максимальное число попарно внутренне непересекающихся s-t путей равно минимальному размеру множества вершин, после удаления которого s и t оказываются в разных компонентах связности.",
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [
          "path",
          "connected_graph"
        ]
      }
