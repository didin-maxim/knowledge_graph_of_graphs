  "solutions": [
    {
      "id": "sol-flow-sketch",
      "title": "Доказательство через поток",
      "text": "Пусть G имеет n вершин, а s и t различны и несмежны. Построим ориентированную сеть. Для каждой вершины v создадим две копии v_in и v_out. Если v не равно s,t, проведем дугу v_in -> v_out пропускной способности 1; для s и t эту внутреннюю дугу считаем имеющей пропускную способность M=n+1, чтобы разрез не платил за концы путей. Каждое неориентированное ребро xy заменим двумя дугами x_out -> y_in и y_out -> x_in пропускной способности M. Источник возьмем s_out, сток — t_in. Так как удаление всех вершин, кроме s,t, отделяет s от t, существует разрез емкости не больше n-2; значит минимальный разрез не использует дуги емкости M и состоит только из внутренних дуг v_in -> v_out для некоторых v не равно s,t. Такое множество вершин действительно отделяет s от t: если бы в G после их удаления остался s-t путь, то его копия в сети прошла бы из источника в сток, не пересекая выбранный разрез. Обратно, любой вершинный разделитель X дает разрез емкости |X|, если перерезать дуги x_in -> x_out для x из X. Поэтому минимальная емкость s-t разреза в сети равна минимальному размеру вершинного s-t разделителя в G. По теореме о максимальном потоке и минимальном разрезе эта величина равна значению максимального потока; все емкости целые, значит можно взять целочисленный максимальный поток. Разложим его на единичные s_out-t_in пути в сети. Возвращая каждому такому пути исходные вершины G, получаем s-t пути. Две разные единицы потока не могут пройти через одну и ту же внутреннюю вершину v, потому что дуга v_in -> v_out имеет емкость 1. Следовательно, полученные пути попарно не имеют общих внутренних вершин. Значит число внутренне непересекающихся s-t путей не меньше размера минимального разделителя. Противоположное неравенство очевидно: каждый s-t разделитель должен содержать внутреннюю вершину каждого из попарно внутренне непересекающихся путей, причем для разных путей эти вершины различны. Итак, максимальное число таких путей равно минимальному размеру разделителя.",
