      "id": "sol-flow-sketch",
      "title": "Доказательство через поток",
      "text": "Раздвоим каждую вершину v на \\( v_i \\)n и v_out и проведем ребро \\( v_i \\)n v_out пропускной способности 1. Исходные ребра заменим ребрами бесконечной пропускной способности между соответствующими копиями. Тогда целочисленный максимальный поток из s в t раскладывается в внутренне непересекающиеся пути, а минимальный разрез выбирает вершины-разделители. Теорема о максимальном потоке и минимальном разрезе дает равенство.",
