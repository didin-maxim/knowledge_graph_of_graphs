    {
      "id": "sol-stiebitz-proof",
      "title": "Доказательство через общие окрестности и единственную 3-раскраску",
      "text": "Пусть G — double-critical 5-хроматический граф. Для ребра \\(e=xy\\) обозначим через \\(T(e)\\) множество общих соседей x и y.\n\nСначала докажем ключевой факт. Возьмём любую 3-раскраску c графа \\(G-\\{x,y\\}\\). Продлим её до 5-раскраски h всего G, дав x цвет 4, а y цвет 5. Так как G не 4-раскрашиваем, в этой 5-раскраске для каждого цвета i найдётся вершина цвета i, имеющая соседей всех остальных четырёх цветов: иначе цвет i можно было бы слить с отсутствующим у него соседним цветом и получить 4-раскраску. Для i=1,2,3 такая вершина цвета i смежна и с x, и с y, потому что вершины цветов 4 и 5 единственны. Значит, в \\(T(e)\\) встречаются все три цвета раскраски c.\n\nНазовём граф с хроматическим числом не больше 3 однозначно 3-раскрашиваемым, если любые две его 3-раскраски задают одно и то же разбиение на цветовые классы. Построим максимальную цепочку индуцированных подграфов \\(H_1\\subset H_2\\subset\\cdots\\subset H_r\\), где \\(|V(H_i)|=i\\), каждый \\(H_i\\) однозначно 3-раскрашиваем, и уже нельзя добавить к \\(H_r\\) одну вершину G так, чтобы снова получить однозначно 3-раскрашиваемый индуцированный подграф. Такая цепочка существует: по доказанному факту у любого ребра есть общий сосед, поэтому в G есть треугольник, а \\(K_1\\subset K_2\\subset K_3\\) подходит для начала. При этом \\(H_r\\ne G\\), поскольку G имеет хроматическое число 5.\n\nЗанумеруем вершины \\(H_r\\) в порядке их появления в цепочке. Выберем в \\(H_r\\) ребро xy так, чтобы меньший из номеров x и y был как можно больше. Тогда каждый общий сосед x и y в \\(H_r\\) появился раньше обоих концов: если бы общий сосед z появился позже одного из концов, то ребро z с другим концом имело бы больший минимальный номер. Поэтому все общие соседи x и y в \\(H_r\\) лежат в некотором \\(H_i\\subset H_r-\\{x,y\\}\\).\n\nРассмотрим 3-раскраску графа \\(G-\\{x,y\\}\\). На \\(H_i\\) она должна совпадать, с точностью до переименования цветов, с ограничением единственной 3-раскраски \\(H_r\\). В любой 3-раскраске \\(H_r\\) общие соседи смежных x и y имеют один и тот же третий цвет. Значит, множество \\(T(xy)\\cap V(H_r)\\) использует не больше одного цвета. Но весь \\(T(xy)\\) использует все три цвета, поэтому вне \\(H_r\\) найдутся две разные вершины u и v, смежные и с x, и с y.\n\nПокажем, что \\(H_r+u\\) и \\(H_r+v\\) 4-хроматичны. Если, например, \\(H_r+u\\) был бы 3-раскрашиваем, то его 3-раскраска на \\(H_r\\) была бы единственной, а цвет u был бы вынужденно третьим относительно смежных x и y; значит, \\(H_r+u\\) тоже был бы однозначно 3-раскрашиваем, что противоречит максимальности \\(H_r\\). С другой стороны, добавление одной вершины к 3-раскрашиваемому графу требует не больше одного нового цвета, так что хроматическое число равно 4.\n\nПоложим \\(X=V(G)\\setminus V(H_r)\\). Так как \\(H_r+u\\) уже 4-хроматичен, в \\(X\\setminus\\{u\\}\\) не может быть ребра ab: иначе double-critical свойство дало бы 3-раскраску \\(G-\\{a,b\\}\\), но этот граф содержит \\(H_r+u\\). Значит, \\(X\\setminus\\{u\\}\\) независимо. Тем же рассуждением с вершиной v множество \\(X\\setminus\\{v\\}\\) независимо. Всё X не может быть независимым, иначе 3-раскраску \\(H_r\\) можно было бы дополнить одним новым цветом для всех вершин X и получить 4-раскраску G. Следовательно, в X есть ребро, и из независимости \\(X\\setminus\\{u\\}\\) и \\(X\\setminus\\{v\\}\\) это ребро вынуждено быть uv. Тогда x,y,u,v попарно смежны, то есть в G есть клика K_4.\n\nПусть теперь \\(Q\\) — клика K_4, а \\(Y=V(G)\\setminus Q\\). Множество Y независимо: если бы в Y было ребро ab, то \\(G-\\{a,b\\}\\) содержал бы 4-хроматический подграф Q, что невозможно для double-critical 5-хроматического графа. Множество Y непусто, иначе G был бы K_4 и не имел бы хроматического числа 5. Возьмём \\(y\\in Y\\). Из связности G и независимости Y вершина y имеет соседа x в Q. По первому факту ребро xy лежит хотя бы в трёх треугольниках, а общие соседи x и y могут лежать только в трёх остальных вершинах Q. Поэтому y смежна со всеми вершинами Q, и \\(Q\\cup\\{y\\}\\) образует K_5. Тот же вывод верен для любой вершины из Y. Другой вершины \\(y'\\in Y\\) быть не может: после удаления вершин x и y граф \\(G-\\{x,y\\}\\) содержал бы K_4 на \\((Q\\setminus\\{x\\})\\cup\\{y'\\}\\), вопреки его 3-раскрашиваемости. Значит, \\(|Y|=1\\) и G изоморфен K_5.",
