        "id": "stmt-unique-insertion",
        "text": "Пусть на конечном множестве \\(A\\) задана ориентация троек: для любых трех различных элементов ровно один из двух циклических порядков считается положительным, то есть \\((x,y,z)\\) положительна тогда и только тогда, когда положительны ее циклические сдвиги \\((y,z,x)\\), \\((z,x,y)\\), а при перестановке двух элементов ориентация меняется. Предположим также четырехточечное правило: для любых четырех различных \\(a,b,c,d\\) пары условий \\((a,b,c)\\), \\((c,d,a)\\) одновременно положительны тогда и только тогда, когда \\((b,c,d)\\), \\((d,a,b)\\) одновременно положительны. Пусть \\(B=A\\setminus\\{z\\}\\), \\(|B|\\ge3\\), и ориентации всех троек из \\(B\\) задаются циклическим порядком \\(a_1,a_2,\\ldots,a_m\\): если три элемента встречаются на этом цикле в порядке \\(x,y,w\\), то \\((x,y,w)\\) положительна. Тогда существует единственный промежуток между соседними элементами этого цикла, в который можно вставить \\(z\\), чтобы полученный циклический порядок задавал все ориентации троек из \\(A\\). В частности, существует единственный индекс \\(i\\) по модулю \\(m\\), для которого \\((a_i,z,a_{i+1})\\) положительна.",
        "source_id": "src-putnam-1996-A4-kedlaya",
        "status": "ai_checked",
