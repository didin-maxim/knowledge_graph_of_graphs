  "solutions": [
    {
      "id": "sol-transitive-view-from-new-vertex",
      "title": "Доказательство через порядок, видимый из \\(z\\)",
      "text": "Будем писать \\((x,y,w)>0\\), если тройка положительна. На множестве \\(B\\) зададим отношение \\(x\\prec y\\) условием \\((z,x,y)>0\\). Из смены ориентации при обращении следует, что для любых различных \\(x,y\\in B\\) выполнено ровно одно из \\(x\\prec y\\), \\(y\\prec x\\).\n\nДокажем транзитивность. Пусть \\(x\\prec y\\) и \\(y\\prec w\\). Если на данном цикле для \\(B\\) тройка \\((x,w,y)>0\\), то применим четырехточечное правило к четверке \\((z,x,w,y)\\). Левая пара содержит \\((w,y,z)\\), а она отрицательна, потому что \\((z,y,w)>0\\). Правая пара, наоборот, положительна: \\((x,w,y)>0\\) по предположению о циклическом порядке, а \\((y,z,x)>0\\) является циклическим сдвигом \\((z,x,y)>0\\). Получается противоречие. Значит на цикле обязательно \\((x,y,w)>0\\).\n\nТеперь применим четырехточечное правило к четверке \\((z,x,y,w)\\). Тройки \\((z,x,y)\\) и \\((y,w,z)\\) положительны, причем вторая является циклическим сдвигом \\((z,y,w)>0\\). Поэтому положительны и \\((x,y,w)\\), \\((w,z,x)\\); отсюда \\((z,x,w)>0\\), то есть \\(x\\prec w\\). Отношение \\(\\prec\\) транзитивно, а значит упорядочивает \\(B\\) линейно: \\(b_1\\prec b_2\\prec\\cdots\\prec b_m\\).\n\nДля любых \\(r<s<t\\) из уже доказанного запрета на порядок \\((b_r,b_t,b_s)\\) следует, что на исходном цикле положительна \\((b_r,b_s,b_t)\\). Следовательно, если смотреть на исходный цикл от вершины \\(b_1\\), остальные вершины идут именно в порядке \\(b_2,b_3,\\ldots,b_m\\). То есть линейный порядок \\(b_1,\\ldots,b_m\\) является разрезом данного циклического порядка.\n\nВставим \\(z\\) непосредственно перед \\(b_1\\), или, что то же самое, между \\(b_m\\) и \\(b_1\\). Тройки без \\(z\\) уже согласованы с исходным циклом. Если тройка содержит \\(z\\) и две старые вершины \\(b_r,b_s\\), где \\(r<s\\), то по определению \\(b_r\\prec b_s\\), значит \\((z,b_r,b_s)>0\\), ровно как в новом циклическом порядке \\(z,b_1,\\ldots,b_m\\). Поэтому вставка корректна.\n\nНаконец, она единственна. Любая корректная вставка должна давать после \\(z\\) именно тот порядок старых вершин, который определяется отношением \\((z,x,y)>0\\), а этот порядок уже единственно равен \\(b_1,\\ldots,b_m\\). Значит \\(z\\) можно поставить только между \\(b_m\\) и \\(b_1\\). В обозначениях исходного цикла это ровно один промежуток между соседними \\(a_i\\) и \\(a_{i+1}\\), и только для него \\((a_i,z,a_{i+1})>0\\).",
