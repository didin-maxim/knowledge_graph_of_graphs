  ],
  "solutions": [
    {
      "id": "sol-delete-endpoint",
      "title": "Короткое доказательство от противного",
      "text": "Предположим, что \\(e=uv\\) — мост. После удаления \\(e\\) граф распадается на две компоненты: \\(U\\), содержащую \\(u\\), и \\(V\\), содержащую \\(v\\). Так как в графе хотя бы три вершины, хотя бы одна из множеств \\(U\\setminus\\{u\\}\\) и \\(V\\setminus\\{v\\}\\) непуста; без ограничения общности пусть \\(U\\setminus\\{u\\}\\) непуста. Тогда после удаления вершины \\(v\\) вершины из \\(U\\setminus\\{u\\}\\) не могут быть соединены с вершинами из \\(V\\setminus\\{v\\}\\), если такие есть, а если \\(V=\\{v\\}\\), то после удаления \\(u\\) вершина \\(v\\) отделяется от непустой части \\(U\\setminus\\{u\\}\\). В обоих случаях удаление некоторой вершины делает граф несвязным. Это противоречит условию, значит мостов нет.",
