      "id": "idea-delete-bridge-endpoint",
      "title": "Удалить конец предполагаемого моста",
      "text": "Мост разделяет граф на две стороны. Если удалить один из его концов, другая сторона моста уже не может быть соединена с оставшейся частью противоположной стороны.",
