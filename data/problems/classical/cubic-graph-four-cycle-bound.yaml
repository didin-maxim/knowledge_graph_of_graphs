        "id": "stmt-cubic-four-cycle-bound",
        "text": "Пусть G — простой 3-регулярный граф на n вершинах. Тогда число циклов длины 4 в G не превосходит 3n/2. Эта оценка точна: если n кратно 6, равенство достигается на несвязном объединении n/6 копий K₃,₃.",
