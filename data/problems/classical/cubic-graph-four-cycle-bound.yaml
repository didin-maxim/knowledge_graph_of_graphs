  "solutions": [
    {
      "id": "sol-double-count-incident-edge-pairs",
      "title": "Двойной счёт пар инцидентных рёбер",
      "text": "Рассмотрим пары вида (C,v), где C — 4-цикл графа G, а v — вершина этого цикла. Если число 4-циклов равно q, то таких пар ровно 4q.\n\nС другой стороны, каждой паре (C,v) соответствует неупорядоченная пара рёбер цикла C, инцидентных вершине v. В 3-регулярном графе у каждой вершины есть C(3,2)=3 пары инцидентных рёбер, всего 3n таких пар.\n\nЗафиксируем пару рёбер vu и vw. Любой 4-цикл, содержащий оба эти ребра, имеет вид v-u-x-w-v, где x — общий сосед вершин u и w, отличный от v. Так как у u и w после удаления ребер к v остаётся не более чем по два возможных соседа, таких вершин x, а значит и таких 4-циклов, не больше двух. Поэтому 4q не превосходит 2·3n=6n, откуда q ≤ 3n/2.\n\nОценка достигается на K₃,₃: его 4-циклы получаются выбором двух вершин в одной доле и двух вершин в другой доле, поэтому их C(3,2)^2=9=3·6/2. Несвязное объединение n/6 копий K₃,₃ при n, кратном 6, даёт ровно 9n/6=3n/2 циклов длины 4.",
