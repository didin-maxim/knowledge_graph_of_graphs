  "ideas": [
    {
      "id": "idea-protected-colors",
      "title": "Защищённые цвета",
      "text": "Текущий цвет называется защищённым, если он содержит целиком некоторый цветовой класс фиксированной эталонной раскраски \\(\\alpha\\). Перекраска другого целого \\(\\alpha\\)-класса не может разрушить эту защиту.",
      "tags": [
        "coloring"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-protected-singleton-recoloring",
      "title": "Исправлять по одному одноточечному классу",
      "text": "Зафиксируем эталонную раскраску \\(\\alpha\\) и назовём цвет текущей \\(\\beta\\)-раскраски защищённым, если он содержит все вершины некоторого \\(\\alpha\\)-цветового класса. Такой защищённый цвет содержит хотя бы две вершины, а дальнейшие операции с другими \\(\\alpha\\)-классами не делают его одноточечным.\n\nЕсли в текущей раскраске нет одноточечных цветовых классов, всё доказано. Иначе пусть цвет \\(c\\) встречается только на вершине \\(v\\). Пусть \\(A\\) — цветовой класс раскраски \\(\\alpha\\), содержащий \\(v\\). Перекрасим все вершины \\(A\\) в цвет \\(c\\), а остальные вершины оставим как были. Новая раскраска правильна: новый класс цвета \\(c\\) — это независимое множество \\(A\\), а все остальные цветовые классы только потеряли вершины из независимого множества.\n\nНи один цвет после этой операции не может исчезнуть. Если бы это произошло, полученная правильная раскраска использовала бы не более \\(k-1\\) непустых цветов, что противоречит \\(\\chi(G)=k\\). Поэтому мы всё ещё имеем правильную раскраску ровно в \\(k\\) цветов, а цвет \\(c\\) теперь защищён классом \\(A\\) и больше никогда не станет одноточечным.\n\nПовторяя этот шаг, мы на каждом ходе защищаем ранее незащищённый одноточечный цвет, а защищённые цвета остаются неодноточечными. Не более чем через \\(k\\) ходов одноточечных цветовых классов не останется.",
