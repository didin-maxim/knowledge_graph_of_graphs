        "id": "stmt-protected-color-recoloring",
        "title": "Лемма о защищённых цветах",
        "text": "Пусть \\(G\\) — конечный граф с \\(\\chi(G)=k\\). Предположим, что у \\(G\\) есть правильная \\(k\\)-раскраска \\(\\alpha\\), в которой каждый цветовой класс содержит хотя бы две вершины. Тогда любую правильную раскраску \\(\\beta\\), использующую ровно \\(k\\) непустых цветов, можно конечным числом перекрасок целых цветовых классов раскраски \\(\\alpha\\) преобразовать в правильную \\(k\\)-раскраску, где каждый цветовой класс содержит хотя бы две вершины.",
        "source_id": "src-kolmogorov-2007-official",
