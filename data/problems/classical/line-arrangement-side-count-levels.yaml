  "solutions": [
    {
      "id": "sol-horizontal-sweep",
      "title": "Доказательство горизонтальным проходом",
      "text": "Сначала слегка повернём всю конфигурацию так, чтобы ни одна из прямых не была горизонтальной. Это не меняет комбинаторику областей и их соседств. Ориентируем каждую прямую вверх, то есть в сторону возрастания координаты \\(y\\).\n\nПусть две области имеют общую сторону. Эта сторона лежит на некоторой прямой \\(\\ell\\). При переходе через неё точка меняет сторону только относительно \\(\\ell\\); относительно любой другой прямой обе области лежат с одной и той же стороны, иначе общая сторона была бы разрезана пересечением с этой другой прямой. Поэтому число прямых, справа от которых лежит область, меняется ровно на \\(1\\).\n\nОсталось доказать, что встречаются все уровни. Возьмём горизонтальную прямую \\(y=w\\), лежащую выше всех точек пересечения данных прямых. Каждая из данных прямых пересекает эту горизонталь, и эти точки пересечения различны: если две непараллельные прямые пересекали бы \\(y=w\\) в одной точке, то эта точка была бы их пересечением, а мы выбрали \\(w\\) выше всех таких точек; параллельные различные негоризонтальные прямые тоже дают разные точки пересечения с горизонталью.\n\nДвигаясь по \\(y=w\\) слева направо, мы сначала находимся слева от всех ориентированных вверх прямых. При пересечении очередной прямой переходим с её левой стороны на правую, а стороны относительно остальных прямых в этот момент не меняются. Следовательно, значения счётчика последовательно становятся \\(0,1,\\ldots,n\\). Между соседними точками пересечения горизонтали с данными прямыми, а также на двух крайних лучах, лежат точки областей исходного разбиения. Эти области и реализуют все значения \\(k=0,1,\\ldots,n\\).",
