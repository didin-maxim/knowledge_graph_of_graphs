        "id": "stmt-side-count-levels",
        "title": "Лемма о счётчике сторон",
        "text": "Пусть на плоскости дано \\(n\\) различных прямых, никакие три из которых не проходят через одну точку. После поворота можно считать, что ни одна прямая не горизонтальна; ориентируем каждую прямую в направлении возрастания координаты \\(y\\). Для области \\(R\\) обозначим через \\(k(R)\\) число прямых, справа от которых лежит \\(R\\). Тогда: (1) если две области имеют общую сторону, то их значения \\(k\\) отличаются ровно на \\(1\\); (2) для каждого \\(k=0,1,\\ldots,n\\) существует область \\(R\\) с \\(k(R)=k\\).",
