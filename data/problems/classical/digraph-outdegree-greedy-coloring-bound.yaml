  "ideas": [
    {
      "id": "idea-low-indegree-extend-coloring",
      "title": "Удалить вершину малой входящей степени и продолжить раскраску",
      "text": "Сумма входящих степеней равна сумме исходящих, поэтому средняя входящая степень не превосходит \\(r\\). Выбираем вершину входящей степени не больше \\(r\\), красим оставшийся граф по индукции, а затем возвращаем эту вершину: её входящие и исходящие соседи запрещают не больше \\(r+r=2r\\) цветов.",
      "tags": [
        "coloring",
        "induction"
      ],
