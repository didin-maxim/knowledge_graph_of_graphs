  "ideas": [
    {
      "id": "idea-low-indegree-extend-coloring",
      "title": "Delete a vertex of small indegree and extend",
      "text": "Since the total indegree equals the total outdegree, average indegree is at most \\(r\\). Choose a vertex with indegree at most \\(r\\), color the remaining graph by induction, and then return this vertex: its in-neighbors and out-neighbors forbid at most \\(r+r=2r\\) colors.",
      "tags": [
        "coloring",
        "induction"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-low-indegree-induction",
      "title": "Induction on the number of vertices",
      "text": "We prove the statement by induction on the number of vertices. The empty graph and one-vertex graph are immediate. Now let \\(D\\) be a finite directed graph with maximum outdegree at most \\(r\\). The sum of the indegrees equals the sum of the outdegrees, so the average indegree is also at most \\(r\\). Hence some vertex \\(v\\) has indegree at most \\(r\\).\n\nDelete \\(v\\). The remaining directed graph still has maximum outdegree at most \\(r\\), so by the induction hypothesis it has a coloring with colors \\(1,\\dots,2r+1\\) in which every directed edge has differently colored endpoints.\n\nWhen we put \\(v\\) back, a color is forbidden for \\(v\\) only if it already appears on an in-neighbor or an out-neighbor of \\(v\\). There are at most \\(r\\) out-neighbors because the outdegree of \\(v\\) is at most \\(r\\), and at most \\(r\\) in-neighbors by the choice of \\(v\\). Thus at most \\(2r\\) colors are forbidden. Among \\(2r+1\\) colors one color remains available for \\(v\\), and assigning it preserves the condition on every directed edge incident to \\(v\\). This completes the induction.",
      "idea_ids": [
        "idea-low-indegree-extend-coloring"
      ],
