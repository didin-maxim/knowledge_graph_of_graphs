        "id": "stmt-digraph-outdegree-greedy-coloring-bound",
        "title": "Лемма о раскраске при ограниченной исходящей степени",
        "text": "Пусть \\(r\\ge 0\\). Любой конечный ориентированный граф, в котором исходящая степень каждой вершины не превосходит \\(r\\), можно раскрасить в \\(2r+1\\) цвет так, чтобы концы каждой дуги имели разные цвета.",
