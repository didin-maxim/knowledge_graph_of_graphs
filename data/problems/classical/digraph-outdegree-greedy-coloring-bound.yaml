        "id": "stmt-digraph-outdegree-greedy-coloring-bound",
        "title": "Bounded outdegree coloring lemma",
        "text": "Let \\(r\\ge 0\\). Every finite directed graph in which each vertex has outdegree at most \\(r\\) can be colored with \\(2r+1\\) colors so that the endpoints of every directed edge have different colors.",
