  "solutions": [
    {
      "id": "sol-low-indegree-induction",
      "title": "Индукция по числу вершин",
      "text": "Докажем утверждение индукцией по числу вершин. Для пустого графа и графа из одной вершины всё очевидно. Пусть теперь \\(D\\) — конечный ориентированный граф с максимальной исходящей степенью не больше \\(r\\). Сумма входящих степеней равна сумме исходящих степеней, поэтому средняя входящая степень тоже не превосходит \\(r\\). Значит, найдётся вершина \\(v\\) входящей степени не больше \\(r\\).\n\nУдалим \\(v\\). В оставшемся ориентированном графе максимальная исходящая степень по-прежнему не больше \\(r\\), поэтому по предположению индукции он имеет раскраску цветами \\(1,\\dots,2r+1\\), в которой концы каждой дуги окрашены по-разному.\n\nВернём \\(v\\). Цвет для \\(v\\) запрещён только тогда, когда он уже стоит на входящем или исходящем соседе \\(v\\). Исходящих соседей не больше \\(r\\), потому что исходящая степень \\(v\\) не превосходит \\(r\\), а входящих соседей не больше \\(r\\) по выбору \\(v\\). Значит, запрещено не более \\(2r\\) цветов. Среди \\(2r+1\\) цветов остаётся доступный цвет для \\(v\\); присвоив его, мы сохраняем условие для всех дуг, инцидентных \\(v\\). Индукция завершена.",
