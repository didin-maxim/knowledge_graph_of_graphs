  "solutions": [
    {
      "id": "sol-common-neighbor-count",
      "title": "Доказательство двойным счётом",
      "text": "Обозначим степени вершин через \\(d_1,\\ldots,d_n\\), а число рёбер через \\(e\\). Посчитаем тройки \\((x,v,y)\\), где \\(x\\) и \\(y\\) — две различные соседние с \\(v\\) вершины. Для фиксированного центра \\(v\\) таких троек \\(\\binom{d(v)}2\\), поэтому всего их \\(\\sum_v \\binom{d(v)}2\\).\n\nС другой стороны, каждая такая тройка задаёт пару концов \\(x,y\\), имеющих общего соседа \\(v\\). Если какая-то пара вершин \\(x,y\\) имела бы двух разных общих соседей \\(u\\) и \\(v\\), то вершины \\(x,u,y,v\\) образовали бы цикл длины 4. Поэтому в графе без \\(C_4\\) каждая неупорядоченная пара концов встречается не более одного раза. Значит\n\\[\\sum_v \\binom{d(v)}2\\le \\binom n2.\\]\n\nРаскроем левую часть: \\(\\sum_v \\binom{d(v)}2=\\frac12\\sum_v d(v)^2-e\\), потому что \\(\\sum_v d(v)=2e\\). По неравенству Коши \\(\\sum_v d(v)^2\\ge (2e)^2/n\\). Поэтому\n\\[\\frac12\\cdot\\frac{4e^2}{n}-e\\le \\frac{n(n-1)}2.\\]\nУмножая на \\(2n\\), получаем \\(4e^2-2ne\\le n^2(n-1)\\). Это квадратное неравенство относительно \\(e\\). Из него следует\n\\[e\\le \\frac n4\\bigl(1+\\sqrt{4n-3}\\bigr).\\]\nВ частности, при больших \\(n\\) число рёбер не превосходит константы порядка \\(n^{3/2}\\).",
