        "id": "stmt-original-1",
        "title": "Школьная C4-свободная оценка",
        "text": "Пусть \\(G\\) — простой граф на \\(n\\) вершинах, в котором нет цикла длины 4. Тогда число его рёбер \\(e\\) удовлетворяет неравенству \\(e\\le \\frac n4\\bigl(1+\\sqrt{4n-3}\\bigr)\\). В частности, \\(e=O(n^{3/2})\\).",
