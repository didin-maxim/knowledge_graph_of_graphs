  "solutions": [
    {
      "id": "sol-entropy-bound",
      "title": "Энтропийное доказательство верхней оценки",
      "text": "Будем считать параллельные рёбра различными. Удалим из \\(G\\) всё, что не лежит на кратчайших путях из \\(x\\) в \\(y\\). В оставшемся мультиграфе каждая вершина лежит в некотором слое \\(L_i=\\{v:\\operatorname{dist}(x,v)=i\\}\\), а каждое ребро кратчайшего пути идёт из \\(L_i\\) в \\(L_{i+1}\\). Для вершины \\(v\\in L_i\\) обозначим через \\(a(v)\\) число рёбер из \\(L_{i-1}\\) в \\(v\\), а через \\(b(v)\\) число рёбер из \\(v\\) в \\(L_{i+1}\\). Для внутренних слоёв имеем \\(a(v)+b(v)\\le\\deg(v)\\le\\Delta\\), поэтому \\(a(v)b(v)\\le(\\Delta/2)^2\\).\n\nПусть всего кратчайших путей \\(N\\), и выберем один из них равновероятно. Его энтропия равна \\(\\log N\\). Если читать путь слева направо, то при известном префиксе следующий шаг выбирается среди не более чем \\(b(v)\\) рёбер, где \\(v\\) — текущая вершина. Значит\n\\[\\log N\\le \\mathbb E\\sum_{i=0}^{t-1}\\log b(X_i),\\]\nгде \\(X_i\\) — вершина пути в слое \\(i\\). Если читать тот же путь справа налево, получаем\n\\[\\log N\\le \\mathbb E\\sum_{i=1}^{t}\\log a(X_i).\\]\nСкладываем эти две оценки. Для концов используем только \\(b(x)\\le\\Delta\\) и \\(a(y)\\le\\Delta\\), а для каждой внутренней вершины — \\(a(X_i)b(X_i)\\le(\\Delta/2)^2\\). Тогда\n\\[2\\log N\\le 2\\log\\Delta+2(t-1)\\log(\\Delta/2).\\]\nСледовательно,\n\\[N\\le \\Delta(\\Delta/2)^{t-1}=2(\\Delta/2)^t.\\]\nЭто и требовалось доказать.",
      "idea_ids": [
        "idea-prune-to-shortest-path-layers",
        "idea-forward-backward-entropy"
      ],
