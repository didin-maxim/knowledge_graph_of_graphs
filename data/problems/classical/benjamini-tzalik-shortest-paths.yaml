        "title": "Теорема Беньямини — Цалика",
        "text": "Пусть \\(G\\) — конечный неориентированный мультиграф без петель, степени всех вершин которого не превосходят \\(\\Delta\\). Если две различные вершины \\(x,y\\) находятся на расстоянии \\(t\\ge1\\), то число кратчайших путей из \\(x\\) в \\(y\\), где параллельные рёбра считаются различными, не превосходит \\(2(\\Delta/2)^t\\).",
