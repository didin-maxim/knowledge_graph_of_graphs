      "text": "В сбалансированном двудольном случае выбирается лист максимальной глубины. Если у его соседа нет второй висячей ветки, удаление этого листа и его соседа даёт меньшее дерево, а паросочетания делятся на содержащие и не содержащие это висячее ребро.",
