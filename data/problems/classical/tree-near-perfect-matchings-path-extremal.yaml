  "solutions": [
    {
      "id": "sol-induction-bipartition",
      "title": "Индукция и разбор двудольных долей",
      "text": "Докажем утверждение индукцией по \\(n\\). При \\(n=2\\) паросочетание из одного ребра можно выбрать ровно \\(|E(T)|=3\\) способами, а \\(3=\\binom{3}{2}\\). Заметим также стандартный факт: в любом лесу совершенное паросочетание, если оно существует, единственно. Действительно, лист обязан быть покрыт единственным инцидентным ему ребром; удаляя оба конца этого ребра и повторяя рассуждение, получаем вынужденность всего паросочетания.\n\nПусть теперь \\(n\\ge 3\\), и утверждение уже доказано для меньших значений параметра. Рассмотрим двудольное разбиение дерева \\(T\\) на доли \\(A\\) и \\(B\\). Каждое паросочетание из \\(n-1\\) ребра покрывает ровно \\(n-1\\) вершин каждой доли, поэтому возможны только размеры долей \\((n-1,n+1)\\), \\((n,n)\\) и \\((n+1,n-1)\\).\n\nСначала пусть, например, \\(|A|=n+1\\), \\(|B|=n-1\\). Тогда всякая нужная выборка оставляет непокрытыми ровно две вершины из \\(A\\). После выбора этой пары оставшийся граф является лесом и имеет не более одного совершенного паросочетания. Значит, всего таких паросочетаний не больше \\(\\binom{n+1}{2}\\). При \\(n\\ge 3\\) равенство здесь невозможно. В самом деле, сумма степеней вершин доли \\(B\\) равна \\(|E(T)|=2n-1\\), поэтому в \\(B\\) есть вершина \\(x\\) степени не больше 2. Если бы равенство достигалось, то для каждой пары вершин из \\(A\\) после её удаления оставалось бы совершенное паросочетание. Выберем пару, содержащую всех соседей \\(x\\) (если соседей меньше двух, дополним её произвольными вершинами из \\(A\\)). Тогда после удаления этой пары вершина \\(x\\) изолирована, что делает совершенное паросочетание невозможным. Случай \\(|A|=n-1\\), \\(|B|=n+1\\) симметричен.\n\nОстаётся случай \\(|A|=|B|=n\\). Подвесим дерево за произвольную вершину и возьмём лист \\(v\\) максимальной глубины; пусть \\(u\\) — его сосед. Считаем, что \\(v\\in A\\), \\(u\\in B\\). Если у \\(u\\) есть ещё один висячий сосед \\(w\\), то вершины \\(v\\) и \\(w\\) нельзя покрыть одновременно, поскольку обе соединены только с \\(u\\). Значит, в каждом паросочетании из \\(n-1\\) ребра непокрыта одна из вершин \\(v,w\\) и ещё одна вершина из \\(B\\setminus\\{u\\}\\); для каждой такой пары непокрытых вершин оставшийся лес имеет не более одного совершенного паросочетания. Поэтому число паросочетаний не больше \\(2(n-1)\\), что строго меньше \\(\\binom{n+1}{2}\\) при \\(n\\ge 3\\).\n\nЗначит, других висячих соседей у \\(u\\) нет. Из максимальности глубины \\(v\\) следует, что у \\(u\\) нет и других сыновей: иначе под другим сыном нашёлся бы лист не меньшей глубины, а если этот сын сам лист, мы уже были бы в предыдущем случае. Следовательно, после удаления \\(u\\) и \\(v\\) остаётся дерево \\(T'\\) на \\(2n-2\\) вершинах с равными долями.\n\nРазделим нужные паросочетания в \\(T\\) на два типа. Первый тип не покрывает \\(v\\). Тогда вместе с \\(v\\) непокрыта ровно одна вершина доли \\(B\\); её можно выбрать не более чем \\(n\\) способами, и для каждого выбора оставшийся лес даёт не более одного паросочетания. Второй тип содержит ребро \\(uv\\). После удаления этого ребра остаётся паросочетание из \\(n-2\\) ребер в дереве \\(T'\\), а по предположению индукции таких паросочетаний не больше \\(\\binom{n}{2}\\). Итак, общее число не превосходит\n\\[\n n+\\binom{n}{2}=\\binom{n+1}{2}.\n\\]\n\nРазберём случай равенства при \\(n\\ge 3\\). Все приведённые оценки должны быть равенствами. В частности, для \\(T'\\) достигается равенство в индукционном утверждении; так как доли \\(T'\\) равны, исключительный случай \\(K_{1,3}\\) при четырёх вершинах невозможен, и по индукции \\(T'\\) является путём. Обозначим этот путь \\(a_1a_2\\ldots a_{2n-2}\\). В дереве \\(T\\) вершина \\(u\\) присоединена к одной вершине этого пути. Если она присоединена к концу пути, то вместе с ребром \\(uv\\) всё дерево \\(T\\) само является путём.\n\nПусть, напротив, \\(u\\) присоединена к внутренней вершине пути \\(T'\\). Среди вершин \\(a_2\\) и \\(a_{2n-3}\\) ровно одна лежит в доле \\(B\\). Если это \\(a_2\\), то после удаления непокрытых вершин \\(v\\) и \\(a_2\\) вершина \\(a_1\\) становится изолированной; если это \\(a_{2n-3}\\), то после удаления \\(v\\) и \\(a_{2n-3}\\) изолируется \\(a_{2n-2}\\). В обоих случаях для одного из \\(n\\) возможных выборов непокрытой вершины доли \\(B\\) паросочетания первого типа нет, значит их меньше \\(n\\), что противоречит равенству. Поэтому \\(u\\) присоединена к концу \\(T'\\), и \\(T\\) является путём.\n\nНаконец, для пути \\(P_{2n}\\) паросочетание из \\(n-1\\) ребра получается выбором \\(n-1\\) несоседних ребер среди \\(2n-1\\) ребра пути; число таких выборов равно \\(\\binom{(2n-1)-(n-1)+1}{n-1}=\\binom{n+1}{2}\\). Лемма доказана.",
