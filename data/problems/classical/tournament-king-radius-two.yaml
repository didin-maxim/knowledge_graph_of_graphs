    "graph_theory": [
      {
        "id": "stmt-graph-1",
        "text": "В любом турнире вершина максимальной исходящей степени является 2-королем: для любой другой вершины y либо есть стрелка x->y, либо существует вершина z такая, что x->z и z->y.",
