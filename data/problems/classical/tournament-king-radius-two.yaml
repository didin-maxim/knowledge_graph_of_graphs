      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-max-outdegree",
      "title": "Доказательство максимальной степенью",
      "text": "Пусть x — вершина с максимальной исходящей степенью. Возьмем вершину y. Если x→y, все готово. Иначе y→x. Предположим, что нет z с x→z→y. Тогда для каждого исходящего соседа z вершины x имеем y→z. Значит y бьет x и всех исходящих соседей x, поэтому исходящая степень y больше исходящей степени x, противоречие максимальности x.",
