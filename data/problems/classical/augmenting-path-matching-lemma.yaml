    "original": [
      {
        "id": "stmt-original-1",
        "text": "Пусть M — паросочетание в конечном графе. Путь называется увеличивающим относительно M, если его ребра попеременно не принадлежат и принадлежат M, а первая и последняя вершины не покрыты M. Тогда M максимально по числу ребер тогда и только тогда, когда увеличивающего пути относительно M не существует.",
