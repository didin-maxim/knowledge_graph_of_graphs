  "solutions": [
    {
      "id": "sol-symmetric-difference",
      "title": "Доказательство через симметрическую разность",
      "text": "Если есть увеличивающий путь, меняем на нем статус всех ребер: не входившие в M добавляем, входившие удаляем. Размер паросочетания увеличивается на 1. Обратно, пусть N — паросочетание большего размера. В графе из ребер симметрической разности M и N степени вершин не больше 2, поэтому компоненты — чередующиеся циклы и пути. Так как |N|>|M|, в одной компоненте ребер N больше, чем ребер M; это чередующийся путь, начинающийся и заканчивающийся ребрами N, то есть увеличивающий путь для M.",
