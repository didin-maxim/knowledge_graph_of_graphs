  "solutions": [
    {
      "id": "sol-deletion-order",
      "title": "Доказательство обратной жадной раскраской",
      "text": "Будем удалять вершины из графа. Пока граф непуст, по условию в текущем подграфе есть вершина степени не больше \\(d\\); удалим одну такую вершину и запишем ее в список. После удаления снова смотрим на оставшийся подграф и повторяем процесс. В конце все вершины удалены.\n\nТеперь раскрасим вершины в обратном порядке: сначала последнюю удаленную, затем предпоследнюю и так далее. Когда мы возвращаем некоторую вершину \\(v\\), среди уже возвращенных и раскрашенных вершин находятся только те ее соседи, которые оставались в графе после удаления \\(v\\). В момент удаления таких соседей было не больше \\(d\\). Значит среди \\(d+1\\) цветов занято не более \\(d\\), и для \\(v\\) остается хотя бы один свободный цвет. Выберем его.\n\nТак получаем правильную раскраску всего графа: каждое ребро проверяется в момент, когда красится более ранний по восстановлению конец, и этот конец получает цвет, отличный от уже раскрашенного соседа. Следовательно, граф можно раскрасить в \\(d+1\\) цвет.",
