        "id": "stmt-original-1",
        "title": "Раскраска вырожденного графа",
        "text": "Пусть \\(d\\) — неотрицательное целое число. Если в каждом непустом подграфе простого графа \\(G\\) есть вершина степени не больше \\(d\\), то вершины \\(G\\) можно правильно раскрасить в \\(d+1\\) цвет.",
