  "solutions": [
    {
      "id": "sol-union-bound",
      "title": "Доказательство через объединение множеств несоседей",
      "text": "Обозначим \\(q=\\lceil N/r\\rceil\\). Если \\(N\\le r\\) и \\(N\\ge1\\), то \\(q=1\\), а условие требовало бы \\(\\delta(G)\\ge N\\), что невозможно в простом графе на \\(N\\) вершинах. Поэтому невакуозен только случай \\(N\\ge r+1\\); далее работаем в нём.\n\nИз условия следует, что у каждой вершины не больше \\(q-2\\) несоседей: всего кроме самой вершины есть \\(N-1\\) других вершин, а соседей среди них не меньше \\(N-q+1\\).\n\nПокажем, что любую клику размера \\(s<r+1\\) можно продолжить. Пусть \\(C\\) — клика из \\(s\\) вершин, где \\(1\\le s\\le r\\). Вершина вне \\(C\\) не является общей соседкой всех вершин \\(C\\) только если она является несоседкой хотя бы одной вершины из \\(C\\). Таких плохих вершин не больше \\(s(q-2)\\). Поэтому общих соседей клики \\(C\\) вне самой \\(C\\) не меньше\n\\[\nN-s-s(q-2)=N-sq+s.\n\\]\nЕсли \\(N=ar+b\\), \\(0\\le b<r\\), то при \\(b=0\\) имеем \\(q=a\\), и для \\(s\\le r\\) получаем \\(N-sq+s=a(r-s)+s>0\\). При \\(b>0\\) имеем \\(q=a+1\\), и \\(N-sq+s=a(r-s)+b>0\\) для всех \\(s\\le r\\). Значит общий сосед существует, и клику можно увеличить на одну вершину.\n\nНачав с любой вершины и повторив этот шаг \\(r\\) раз, получаем клику размера \\(r+1\\).",
