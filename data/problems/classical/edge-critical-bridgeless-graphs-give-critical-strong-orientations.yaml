  "statements": {
    "original": [
      {
        "id": "stmt-original",
        "text": "Пусть \\(G\\) — конечный связный граф без мостов, причем для каждого ребра \\(e\\) граф \\(G-e\\) имеет мост. Тогда \\(G\\) допускает такую сильную ориентацию, что после удаления любого ориентированного ребра сильная связность нарушается. Более того, это верно для любой сильной ориентации \\(G\\).",
