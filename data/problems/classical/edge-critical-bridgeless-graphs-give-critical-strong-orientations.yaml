  "solutions": [
    {
      "id": "sol-robbins-plus-criticality",
      "title": "Роббинс и препятствие-мост",
      "text": "Так как в \\(G\\) нет мостов, по теореме Роббинса у \\(G\\) существует сильная ориентация. Возьмем любую такую ориентацию и любое ребро \\(e\\). По условию неориентированный граф \\(G-e\\) имеет мост. Если бы после удаления соответствующей дуги ориентированный граф оставался сильно связным, то его неориентированная основа \\(G-e\\) допускала бы сильную ориентацию. Но граф с мостом сильной ориентации не допускает: через мост можно пройти между двумя частями только в одном направлении. Противоречие. Значит, удаление любой дуги разрушает сильную связность.",
