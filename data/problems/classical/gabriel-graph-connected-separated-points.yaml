  "ideas": [
    {
      "id": "idea-distance-descent",
      "title": "Спуск по квадрату расстояния между компонентами",
      "text": "Если две точки лежат в разных компонентах и не соединены ребром, то внутри их диаметрального диска есть третья точка. Одна из двух новых пар снова соединяет разные компоненты, но имеет существенно меньший квадрат расстояния.",
      "tags": [
        "connectivity"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-distance-descent",
      "title": "Бесконечный спуск по расстоянию",
      "text": "Предположим, что граф Габриэля несвязен, и возьмём точки \\(p,q\\) из разных компонент. Если \\(pq\\) является ребром, эти точки лежат в одной компоненте, поэтому \\(pq\\) не ребро. Значит, в замкнутом диске с диаметром \\(pq\\) есть третья точка \\(r\\in X\\).\n\nТочка \\(r\\) не может одновременно лежать в компоненте \\(p\\) и в компоненте \\(q\\). Поэтому хотя бы одна из пар \\((p,r)\\), \\((r,q)\\) снова соединяет разные компоненты; обозначим её \\((u,v)\\), а второй отрезок от \\(r\\) к одному из концов \\(pq\\) обозначим через \\(w\\). Так как \\(r\\) лежит в диаметральном диске \\(pq\\), угол \\(prq\\) не меньше \\(90^\\circ\\), и из элементарной геометрии следует \\(uv^2\\le pq^2-w^2\\). При этом \\(w>1\\), потому что расстояния между различными точками множества больше \\(1\\). Значит, \\(uv^2<pq^2-1\\).\n\nПовторяя этот шаг, мы строили бы пары точек из разных компонент с неотрицательными квадратами расстояний, каждый раз уменьшающимися больше чем на \\(1\\). Это невозможно бесконечно. Следовательно, разных компонент нет, и граф связен.",
      "idea_ids": [
        "idea-distance-descent"
      ],
