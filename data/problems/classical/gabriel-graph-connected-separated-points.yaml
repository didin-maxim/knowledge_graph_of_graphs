      {
        "id": "stmt-original",
        "text": "Пусть \\(X\\) — конечное или бесконечное множество точек плоскости, расстояние между любыми двумя различными точками которого больше \\(1\\). В графе Габриэля на \\(X\\) соединены те и только те пары \\(A,B\\), для которых замкнутый диск с диаметром \\(AB\\) не содержит других точек из \\(X\\). Тогда этот граф связен.",
        "source_id": "src-usamo-2025-p3-aops-wiki",
