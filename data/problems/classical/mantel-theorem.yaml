  "solutions": [
    {
      "id": "sol-degree-sum",
      "title": "Доказательство через степени",
      "text": "Пусть \\(m=e(G)\\), а \\(d(v)\\) — степени вершин. Для каждого ребра \\(uv\\) в графе без треугольников множества \\(N(u)\\) и \\(N(v)\\) не пересекаются: общий сосед вместе с \\(u\\) и \\(v\\) дал бы треугольник. Поэтому \\(d(u)+d(v)\\le n\\). Просуммируем это неравенство по всем рёбрам. Левая часть равна \\(\\sum_v d(v)^2\\), потому что вклад \\(d(v)\\) появляется ровно для \\(d(v)\\) рёбер, инцидентных \\(v\\). Значит \\(\\sum_v d(v)^2\\le mn\\). По неравенству Коши \\((\\sum_v d(v))^2\\le n\\sum_v d(v)^2\\), а \\(\\sum_v d(v)=2m\\). Получаем \\(4m^2\\le n\\sum_v d(v)^2\\le n^2m\\). Если \\(m>0\\), делим на \\(m\\) и имеем \\(m\\le n^2/4\\); при \\(m=0\\) это очевидно. Так как \\(m\\) целое, \\(m\\le \\lfloor n^2/4\\rfloor\\).",
