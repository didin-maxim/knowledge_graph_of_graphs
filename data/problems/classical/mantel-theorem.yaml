  "solutions": [
    {
      "id": "sol-degree-sum",
      "title": "Доказательство через степени",
      "text": "Пусть m=e(G), а d(v) — степени. Для каждого ребра uv в графе без треугольников множества N(u) и N(v) не имеют общих вершин, поэтому d(u)+d(v) <= n. Суммируя по всем ребрам, получаем sum_v d(v)^2 <= mn. По неравенству Коши, (2m)^2 <= n sum_v d(v)^2 <= n^2 m. Отсюда m <= n^2/4.",
      "idea_ids": [
        "idea-neighborhood-independent"
      ],
