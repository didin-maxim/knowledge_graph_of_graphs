  "solutions": [
    {
      "id": "sol-exact-r44",
      "title": "Доказательство через \\(R(3,4)=9\\) и граф Пэли",
      "text": "Докажем верхнюю оценку. Рассмотрим красно-синюю раскраску рёбер \\(K_{18}\\) и выберем вершину \\(v\\). Из \\(v\\) выходит 17 рёбер, поэтому хотя бы 9 из них имеют один цвет; пусть для определённости это красные рёбра к множеству \\(A\\) из 9 вершин.\n\nПо \\(R(3,4)=9\\) внутри \\(A\\) найдётся либо красный треугольник, либо синяя \\(K_4\\). Если есть синяя \\(K_4\\), цель достигнута. Если есть красный треугольник, то вместе с вершиной \\(v\\) он образует красную \\(K_4\\), потому что все три ребра от \\(v\\) к этому треугольнику красные. Случай, когда у \\(v\\) есть 9 синих соседей, полностью симметричен. Значит, \\(R(4,4)\\le 18\\).\n\nДля нижней оценки построим раскраску на 17 вершинах без одноцветной \\(K_4\\). Возьмём вершины \\(\\mathbb Z_{17}\\). Соединим две вершины красным ребром, если их разность по модулю 17 лежит в множестве квадратичных вычетов\n\\[Q=\\{1,2,4,8,9,13,15,16\\}.\\]\nОстальные рёбра покрасим синим. Так как \\(-1=16\\in Q\\), правило не зависит от порядка вершин.\n\nПокажем, что красной \\(K_4\\) нет. Если такая клика есть, вычтем из всех её вершин одну и ту же вершину; тогда можно считать, что клика содержит 0. Остальные три вершины должны лежать в \\(Q\\), и разности между любыми двумя из них тоже должны лежать в \\(Q\\). Для каждой пары из \\(Q\\), которая вообще имеет общий третий красный сосед внутри \\(Q\\), этот общий сосед задаётся следующим списком:\n\\((1,4)\\to\\{2\\}\\), \\((1,8)\\to\\{9,16\\}\\), \\((1,13)\\to\\{9\\}\\), \\((1,15)\\to\\{2,16\\}\\), \\((2,8)\\to\\{4\\}\\), \\((2,9)\\to\\{1\\}\\), \\((2,13)\\to\\{4,15\\}\\), \\((2,16)\\to\\{1,15\\}\\), \\((4,9)\\to\\{8,13\\}\\), \\((4,15)\\to\\{2,13\\}\\), \\((4,16)\\to\\{8\\}\\), \\((8,13)\\to\\{4,9\\}\\), \\((8,15)\\to\\{16\\}\\), \\((9,15)\\to\\{13\\}\\), \\((9,16)\\to\\{1,8\\}\\), \\((13,16)\\to\\{15\\}\\). В каждой строке либо общий кандидат единственный, либо два кандидата не соединены красным ребром между собой. Поэтому выбрать три попарно красно соединённые вершины из \\(Q\\) нельзя; красной \\(K_4\\) нет.\n\nСиней \\(K_4\\) тоже нет. Действительно, если умножить все вершины на 3, то красные разности \\(Q\\) переходят в невычеты, потому что 3 не является квадратичным вычетом по модулю 17. Значит, умножение на 3 переводит красный граф в синий граф. Синий граф изоморфен красному, а в красном нет \\(K_4\\); следовательно, и в синем нет \\(K_4\\).\n\nМы построили раскраску \\(K_{17}\\) без одноцветной \\(K_4\\), значит, \\(R(4,4)>17\\). Вместе с верхней оценкой получаем \\(R(4,4)=18\\).",
