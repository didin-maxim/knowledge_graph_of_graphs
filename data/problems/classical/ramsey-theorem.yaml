      "id": "sol-recursive-bound",
      "title": "Рекуррентная оценка",
      "text": "Докажем рекурсию \\(R(r,s)\\le R(r-1,s)+R(r,s-1)\\) при базе \\(R(1,s)=R(r,1)=1\\). Возьмем полную красно-синюю раскраску на \\(N=R(r-1,s)+R(r,s-1)\\) вершинах и выберем вершину v. Среди остальных \\(N-1\\) вершин хотя бы \\(R(r-1,s)\\) соединены с v красным ребром или хотя бы \\(R(r,s-1)\\) соединены с v синим ребром. В первом случае применяем определение \\(R(r-1,s)\\) к красному множеству концов: если там есть красная \\(K_{r-1}\\), то вместе с v она дает красную \\(K_r\\); если там есть синяя \\(K_s\\), цель уже достигнута. Во втором случае применяем определение \\(R(r,s-1)\\) к синему множеству концов: синяя \\(K_{s-1}\\) вместе с v дает синюю \\(K_s\\), а красная \\(K_r\\) уже подходит. Индукция по \\(r+s\\) дает конечность всех чисел \\(R(r,s)\\).",
