      "id": "sol-recursive-bound",
      "title": "Рекуррентная оценка",
      "text": "Докажем \\( R(r,s) \\)<=R(r-1,s)+R(r,s-1). В полной раскраске на таком числе вершин выберем вершину v. Если красных ребер из v хотя бы R(r-1,s), то среди их концов есть красная K_{r-1}, которая вместе с v дает красную K_r, либо синяя K_s. Если красных ребер меньше, то синих концов хотя бы R(r,s-1), и аналогично получаем синюю K_s или красную K_r. База R(1,s)=R(r,1)=1.",
