      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-eventual-pool-size",
      "title": "Стабилизация числа шаров",
      "text": "При переходе к следующему моменту исчезает не более одного шара и добавляется ровно один новый, поэтому число шаров не убывает и ограничено сверху числом \\(L\\). Значит, с некоторого момента оно постоянно равно некоторому \\(b\\).",
      "tags": [
