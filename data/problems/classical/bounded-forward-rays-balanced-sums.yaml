        "id": "stmt-sequence",
        "title": "Последовательность с различными правыми концами",
        "text": "Пусть \\(L\\ge 1\\), и пусть \\((a_i)_{i\\ge 1}\\) - бесконечная последовательность целых чисел, такая что \\(1\\le a_i\\le L\\) для всех \\(i\\), а числа \\(i+a_i\\) попарно различны. Тогда существуют положительные целые числа \\(b\\) и \\(N\\), такие что для любых \\(n>m\\ge N\\) выполнено\n\\[\n\\left|\\sum_{i=m+1}^n (a_i-b)\\right|\\le \\left\\lfloor\\frac{(L-1)^2}{4}\\right\\rfloor.\n\\]",
