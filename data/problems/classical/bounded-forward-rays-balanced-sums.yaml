  "solutions": [
    {
      "id": "sol-pool-of-balls",
      "title": "Доказательство через пул шаров высот",
      "text": "Для каждого целого \\(t\\ge 0\\) рассмотрим пул шаров, соответствующих тем индексам \\(i\\), для которых \\(i\\le t<i+a_i\\). Шару индекса \\(i\\) приписываем высоту \\(h=i+a_i-t\\). Так как \\(1\\le a_i\\le L\\), каждая высота лежит в множестве \\(\\{0,1,\\dots,L-1\\}\\). Если два шара в один момент имели бы одинаковую высоту, то соответствующие стрелки имели бы один и тот же конец \\(i+a_i\\), что запрещено. Поэтому в пуле всегда не больше \\(L\\) шаров.\n\nПусть \\(B_t\\) - число шаров в момент \\(t\\). При переходе от \\(t\\) к \\(t+1\\) удаляется шар высоты 0, если он есть, добавляется новый шар, отвечающий индексу \\(t+1\\), а затем все высоты уменьшаются на 1. Следовательно, на каждом шаге мы удаляем не более одного шара и добавляем ровно один, так что \\(B_{t+1}\\ge B_t\\). Последовательность \\(B_t\\) неубывает и ограничена числом \\(L\\), значит, начиная с некоторого момента \\(N\\), она постоянно равна некоторому положительному целому \\(b\\).\n\nДля всякого \\(t\\ge N\\) в пуле обязательно есть шар высоты 0: иначе на следующем шаге ничего не удалилось бы, новый шар добавился бы, и число шаров стало бы \\(b+1\\), что противоречит стабилизации. Обозначим через \\(S_t\\) сумму высот всех шаров в момент \\(t\\). На стабилизированном участке переход можно считать так: удалить один шар высоты 0, добавить шар высоты \\(a_{t+1}\\), затем уменьшить все \\(b\\) высот на 1. Поэтому\n\\[\nS_{t+1}=S_t+a_{t+1}-b\n\\]\nдля всех \\(t\\ge N\\). Суммируя по \\(t=m,m+1,\\dots,n-1\\), получаем\n\\[\n\\sum_{i=m+1}^n(a_i-b)=S_n-S_m\n\\]\nпри всех \\(n>m\\ge N\\).\n\nОстается оценить возможный размах \\(S_t\\). После момента \\(N\\) среди \\(b\\) попарно различных высот из \\(\\{0,1,\\dots,L-1\\}\\) всегда есть высота 0. Минимальная возможная сумма таких высот равна \\(0+1+\\dots+(b-1)\\), а максимальная - \\(0+(L-1)+(L-2)+\\dots+(L-b+1)\\). Поэтому разность любых двух возможных значений \\(S_t\\) не превосходит\n\\[\n\\bigl(0+(L-1)+(L-2)+\\dots+(L-b+1)\\bigr)-\\bigl(0+1+\\dots+(b-1)\\bigr)=(b-1)(L-b).\n\\]\nПри целых \\(1\\le b\\le L\\) максимум выражения \\((b-1)(L-b)\\) равен \\(\\left\\lfloor (L-1)^2/4\\right\\rfloor\\). Значит,\n\\[\n\\left|\\sum_{i=m+1}^n(a_i-b)\\right|=|S_n-S_m|\\le \\left\\lfloor\\frac{(L-1)^2}{4}\\right\\rfloor\n\\]\nдля всех \\(n>m\\ge N\\), что и требовалось.",
