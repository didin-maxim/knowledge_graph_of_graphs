      "id": "idea-active-rays-as-balls",
      "title": "Активные стрелки как шары на высотах",
      "text": "В момент \\(t\\) берем все стрелки \\(i\\to i+a_i\\), пересекающие промежуток от \\(t\\) к \\(t+1\\), то есть такие, что \\(i\\le t<i+a_i\\). Такой стрелке соответствует шар высоты \\(i+a_i-t\\); из-за различных концов эти высоты попарно различны и лежат среди \\(1,2,\\dots,L\\).",
