      {
        "id": "stmt-original-1",
        "text": "Для любого конечного простого графа \\(G\\) существует независимое множество размера не меньше \\(\\sum_{v\\in V(G)} \\frac{1}{d(v)+1}\\), где \\(d(v)\\) — степень вершины \\(v\\). Иными словами, \\(\\alpha(G)\\ge \\sum_{v\\in V(G)}1/(d(v)+1)\\).",
