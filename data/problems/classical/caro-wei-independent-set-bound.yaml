  "ideas": [
    {
      "id": "idea-random-ordering",
      "title": "Случайный порядок вершин",
      "text": "Упорядочим вершины случайно и возьмем те вершины, которые идут раньше всех своих соседей. Такая вершина выбирается с вероятностью \\(1/(d(v)+1)\\), а выбранные вершины попарно несмежны.",
