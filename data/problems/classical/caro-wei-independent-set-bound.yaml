  ],
  "solutions": [
    {
      "id": "sol-random-order",
      "title": "Доказательство через случайный порядок",
      "text": "Выберем равновероятный случайный порядок всех вершин графа \\(G\\). Включим вершину \\(v\\) в множество \\(S\\), если среди вершин \\(\\{v\\}\\cup N(v)\\) она стоит первой. Если две вершины \\(u\\) и \\(v\\) смежны, то они не могут обе попасть в \\(S\\): из пары \\(u,v\\) только одна может быть раньше другой. Значит, \\(S\\) всегда является независимым множеством. Для фиксированной вершины \\(v\\) все \\(d(v)+1\\) вершин из ее замкнутой окрестности равноправны, поэтому вероятность события \\(v\\in S\\) равна \\(1/(d(v)+1)\\). По линейности математического ожидания \\(\\mathbb E|S|=\\sum_{v\\in V(G)}1/(d(v)+1)\\). Следовательно, при некотором порядке вершин размер построенного независимого множества не меньше этого ожидания.",
