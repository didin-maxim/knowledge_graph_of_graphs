      "id": "idea-longest-path-component",
      "title": "Длиннейший путь контролирует компоненту",
      "text": "Если нельзя удалить вершину малой степени, то концы длиннейшего пути имеют много соседей на этом пути и вынуждают цикл через все его вершины; связность тогда не позволяет иметь внешние вершины.",
