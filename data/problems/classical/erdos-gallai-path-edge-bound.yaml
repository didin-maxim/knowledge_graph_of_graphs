  "solutions": [
    {
      "id": "sol-induction-longest-cycle-free",
      "title": "Индукционное доказательство",
      "text": "Докажем утверждение индукцией по числу вершин \\(n\\). При \\(n=0\\) и \\(n=1\\) рёбер нет. Пусть утверждение уже доказано для меньших графов.\n\nЕсли \\(G\\) несвязен, применим индукционное предположение к каждой компоненте: каждая компонента тоже не содержит пути с \\(k+1\\) вершинами. Складывая оценки по компонентам, получаем нужное неравенство для всего графа. Поэтому далее считаем \\(G\\) связным.\n\nЕсли в \\(G\\) есть вершина \\(v\\) степени \\(d(v)\\le (k-1)/2\\), то граф \\(G-v\\) также не содержит пути с \\(k+1\\) вершинами. По индукции \\(e(G-v)\\le (k-1)(n-1)/2\\), откуда\n\\[e(G)=e(G-v)+d(v)\\le \\frac{(k-1)(n-1)}2+\\frac{k-1}2=\\frac{(k-1)n}2.\\]\n\nОстаётся случай, когда каждая вершина имеет степень больше \\((k-1)/2\\). Возьмем в \\(G\\) длиннейший простой путь \\(P=v_1v_2\\ldots v_m\\). По условию \\(m\\le k\\). Все соседи концов \\(v_1\\) и \\(v_m\\) лежат на этом пути, иначе путь можно было бы продлить.\n\nРассмотрим множества индексов\n\\[A=\\{i:1\\le i\\le m-1,\\ v_1v_{i+1}\\in E(G)\\}\\]\nи\n\\[B=\\{i:1\\le i\\le m-1,\\ v_iv_m\\in E(G)\\}.\\]\nИмеем \\(|A|=d(v_1)\\) и \\(|B|=d(v_m)\\), поэтому \\(|A|+|B|>k-1\\ge m-1\\). Оба множества лежат в множестве из \\(m-1\\) индексов, значит они пересекаются. Пусть \\(i\\in A\\cap B\\). Тогда есть рёбра \\(v_1v_{i+1}\\) и \\(v_iv_m\\), а вершины пути образуют цикл\n\\[v_1,v_{i+1},v_{i+2},\\ldots,v_m,v_i,v_{i-1},\\ldots,v_1,\\]\nкоторый проходит через все \\(m\\) вершин пути.\n\nЕсли бы существовала вершина вне \\(P\\), то из связности графа была бы вершина вне этого цикла, соединённая ребром с некоторой вершиной цикла, возможно после выбора ближайшей к циклу вершины на пути из внешней вершины к циклу. Тогда, войдя в цикл по этому ребру и обойдя цикл почти целиком, мы получили бы простой путь на \\(m+1\\) вершине. Это противоречит максимальности \\(P\\). Значит все вершины графа лежат на \\(P\\), то есть \\(n=m\\le k\\).\n\nВ этом последнем случае \\(e(G)\\le \\binom n2=n(n-1)/2\\le n(k-1)/2\\). Индукция завершена.",
