    {
      "id": "sol-chen-yu-reference",
      "title": "Самодостаточное доказательство теоремы Чэня — Юя и сведение Колмогорова",
      "text": "Докажем усиленную форму Чэня — Юя. Пусть G — 2-связный простой граф на n вершинах, e(G) <= 2n-4, и пусть x — заданная вершина. Тогда в G существует независимый вершинный разрез S, не содержащий x.\n\nБаза индукции. При n=3 единственный 2-связный простой граф — треугольник, у него 3=2n-3 ребра, поэтому условие e(G) <= 2n-4 не выполняется. При n=4 из 2-связности следует минимальная степень хотя бы 2, значит e(G) >= 4; вместе с e(G) <= 4 получаем G=C4. Для любой вершины x две ее соседние вершины образуют независимый разрез: после их удаления остаются две несмежные вершины, одна из которых x. Значит усиленная теорема верна для n=4.\n\nПусть n>=5, и усиленная теорема уже доказана для всех меньших порядков. Рассмотрим 2-связный G с e(G) <= 2n-4 и фиксированную вершину x. Если x не лежит ни в одном треугольнике, то N(x) независимо. Кроме того, N(x) является разрезом: после удаления N(x) вершина x изолирована, а другая вершина остается, поскольку иначе G-x был бы несвязным независимым множеством соседей x, что противоречит 2-связности G. Тогда N(x) — нужный разрез.\n\nОстается случай, когда x лежит в треугольнике xyz. Сожмем ребро xy в новую вершину x* и удалим петли и кратные ребра; полученный граф обозначим H. При сжатии исчезает ребро xy, а из двух ребер xz и yz остается одно, поэтому e(H) <= e(G)-2 <= 2(n-1)-4. Если H 2-связен, то по индукции в H есть независимый разрез S, не содержащий x*. Это же множество S не содержит x и y. Оно независимо в G, а если бы G-S был связен, то его сжатие по xy давало бы связный H-S; следовательно, S является независимым разрезом и в G.\n\nПусть теперь H не 2-связен. Тогда единственной возможной cut-вершиной H является x*: если бы cut-вершиной была w != x*, то компонента графа H-w, не содержащая x*, дала бы компоненту графа G-w, отделенную от остальных, вопреки 2-связности G. Значит H-x* несвязен, то есть {x,y} — разрез G.\n\nНам понадобится стандартная проверка. Пусть ab — ребро 2-связного графа G и {a,b} — разрез. Если C — непустое объединение компонент графа G-{a,b}, то индуцированный подграф на C ∪ {a,b} является 2-связным при условии, что среди компонент G-{a,b} есть хотя бы одна компонента вне C. Действительно, каждая компонента D графа G-{a,b} имеет соседей и с a, и с b; иначе a или b была бы cut-вершиной G. После удаления a все такие компоненты остаются связаны через b, а после удаления b — через a. После удаления вершины v из C каждая компонента оставшейся части имеет соседа хотя бы с a или с b; иначе v отделяла бы ее в исходном G. Так как ab — ребро, все эти части соединяются через a и b. Значит удаление любой одной вершины не нарушает связность такого подграфа.\n\nВыберем одну компоненту C графа G-{x,y}, а остальные компоненты объединим в D. По проверке выше подграфы G1=G[C ∪ {x,y}] и G2=G[D ∪ {x,y}] 2-связны; они индуцированы, имеют не меньше трех вершин, пересекаются ровно по {x,y}, оба содержат ребро xy, и G=G1 ∪ G2. Поэтому |V(G1)|+|V(G2)|=n+2 и e(G)=e(G1)+e(G2)-1.\n\nЕсли в G1 есть независимый разрез S, не содержащий x, то S является независимым разрезом и в G. В самом деле, если y не принадлежит S, то x и y лежат в одной компоненте G1-S из-за ребра xy; если y принадлежит S, то вся часть G2-S присоединяется к компоненте с x только через x. В обоих случаях какая-то компонента G1-S, не содержащая x, остается отделенной в G-S. Значит такого S в G1 быть не может; всякий независимый разрез G1 содержит x. По индукционному предположению это возможно только если e(G1) >= 2|V(G1)|-3; для |V(G1)|=3 это тоже верно, потому что единственный 2-связный простой граф на трех вершинах — треугольник. Тот же аргумент применим к G2, поэтому e(G2) >= 2|V(G2)|-3.\n\nТогда e(G)=e(G1)+e(G2)-1 >= (2|V(G1)|-3)+(2|V(G2)|-3)-1 = 2(n+2)-7 = 2n-3, что противоречит e(G) <= 2n-4. Противоречие завершает индукцию и доказывает усиленную теорему.\n\nТеперь докажем исходную связную формулировку. Пусть G связен и e(G) <= 2n-4. Если G имеет cut-вершину v, то одноэлементное множество {v} независимо и является вершинным разрезом. Если cut-вершины нет, то G 2-связен, и усиленная теорема дает независимый разрез, например, не содержащий любую заранее выбранную вершину. Следовательно, всякий связный граф с не более чем 2n-4 ребрами имеет независимый вершинный разрез.\n\nКолмогоровская задача является дословно этой связной формулировкой: требуется найти независимое множество вершин, удаление которого делает связный граф несвязным. Поэтому никакого дополнительного преобразования не нужно; доказанная теорема Чэня — Юя сразу закрывает и Kolmogorov reduction.",
