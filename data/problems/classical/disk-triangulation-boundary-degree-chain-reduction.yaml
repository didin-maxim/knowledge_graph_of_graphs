  "solutions": [
    {
      "id": "sol-euler-count-and-boundary-strip",
      "title": "Эйлеров подсчет и удаление цепи",
      "text": "Обозначим через \\(V,E,F\\) число вершин, ребер и внутренних треугольных граней. Для диска \\(V-E+F=1\\). Подсчет сторон всех треугольников дает \\(3F=2E-n\\): внутренние ребра считаются дважды, а \\(n\\) граничных ребер один раз. Если \\(B\\) — сумма степеней граничных вершин, то из условия на внутренние степени\n\\[\nB+6(V-n)\\le 2E.\n\\]\nПодставляя \\(V=1+E-F\\), получаем\n\\[\nB\\le 2E-6(V-n)=6n-6-4E+6F.\n\\]\nИз \\(3F=2E-n\\) следует \\(6F=4E-2n\\), поэтому \\(B\\le4n-6\\). Это доказывает (1).\n\nПусть теперь \\(n\\ge4\\). Если на границе есть вершина \\(v\\) степени \\(2\\), то ее единственные соседи — две соседние с ней граничные вершины. Значит, единственный треугольник около \\(v\\) является граничным ухом. Удаление этого уха заменяет две граничные стороны на одну и не меняет ни одну вершину, которая остается внутренней; поэтому условие на внутренние степени сохраняется.\n\nОстается случай \\(a(v)\\ge3\\) для всех граничных вершин. Из (1) имеем\n\\[\n\\sum_{v\\in\\partial T}(a(v)-4)\\le -6.\n\\]\nВершина степени \\(3\\) дает вклад \\(-1\\), вершина степени \\(4\\) — вклад \\(0\\), а вершина степени хотя бы \\(5\\) — положительный вклад. Поэтому вершин степени \\(3\\) больше, чем вершин степени хотя бы \\(5\\). Удалим из циклической записи граничных степеней все четверки. Среди оставшихся символов где-то стоят рядом две тройки; возвращая четверки между ними, получаем последовательную граничную цепь \\(w_1,\n\\ldots,w_k\\) со степенями \\(3,4,\n\\ldots,4,3\\). Так как \\(n\\ge4\\), можно выбрать ее не всей границей, поэтому \\(2\\le k\\le n-1\\).\n\nПусть \\(u\\) — граничная вершина перед \\(w_1\\), а \\(z\\) — граничная вершина после \\(w_k\\). Для граничных ребер \\(uw_1,w_1w_2,\n\\ldots,w_{k-1}w_k,w_kz\\) обозначим третьи вершины соответствующих треугольников через \\(x_0,x_1,\n\\ldots,x_k\\). Степень \\(w_1\\) равна \\(3\\), значит два треугольника у ребер \\(uw_1\\) и \\(w_1w_2\\) имеют одну и ту же третью вершину: \\(x_0=x_1\\). Аналогично \\(x_{k-1}=x_k\\).\n\nЕсли \\(2\\le j\\le k-1\\), то у \\(w_j\\) ровно четыре соседа: \\(w_{j-1}\\), \\(w_{j+1}\\), \\(x_{j-1}\\), \\(x_j\\). Следовательно, единственный треугольник около \\(w_j\\), не содержащий старого граничного ребра, есть \\(w_jx_{j-1}x_j\\). Значит, все треугольники, инцидентные цепи, лежат в списке из \\(k+1\\) треугольников на граничных ребрах и \\(k-2\\) внутренних треугольников \\(w_jx_{j-1}x_j\\). Их не больше \\(2k-1\\).\n\nЭти треугольники образуют приграничную полосу. При ее удалении старый граничный путь \\(u,w_1,\n\\ldots,w_k,z\\) заменяется на путь по вершинам \\(u,x_1,\n\\ldots,x_{k-1},z\\), возможно с отождествлениями уже существующих граничных вершин. Поэтому новая граница имеет не больше \\(n-k+(k-1)=n-1\\) сторон. Все вершины, которые остаются внутренними после удаления, не были инцидентны удаленной полосе и сохраняют свои старые степени; вершины \\(x_i\\), оказавшиеся на новой границе, больше не обязаны удовлетворять внутренней оценке. Значит, если остаток непуст, он является триангуляцией диска с тем же условием на оставшиеся внутренние вершины.",
