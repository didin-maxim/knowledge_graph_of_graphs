        "id": "stmt-boundary-degree-chain-reduction",
        "title": "Оценка суммы степеней и удаляемая граничная цепь",
        "text": "Пусть \\(T\\) — конечная триангуляция топологического диска: ее внешняя граница является простым циклом длины \\(n\\ge3\\), а все внутренние грани являются треугольниками. Предположим, что каждая внутренняя вершина имеет степень не меньше \\(6\\). Для граничной вершины \\(v\\) обозначим через \\(a(v)\\) ее степень в графе триангуляции. Тогда\n\\[\n\\sum_{v\\in \\partial T} a(v)\\le 4n-6. \\tag{1}\n\\]\nКроме того, если \\(n\\ge4\\), то выполняется одна из двух граничных редукций.\n\n1. Есть граничная вершина степени \\(2\\); тогда единственный треугольник при ней можно удалить, получив триангуляцию диска с \\(n-1\\) граничными сторонами и тем же условием на внутренние степени.\n\n2. Есть цепь последовательных граничных вершин \\(w_1,\n\\ldots,w_k\\), где \\(2\\le k\\le n-1\\), со степенями \\(3,4,\\ldots,4,3\\). Все треугольники, имеющие вершину среди \\(w_1,\n\\ldots,w_k\\), образуют приграничную полосу из не более чем \\(2k-1\\) треугольников; удалив эту полосу, мы либо удаляем весь диск, либо получаем триангуляцию диска с числом граничных сторон не больше \\(n-1\\), причем все оставшиеся внутренние вершины по-прежнему имеют степень не меньше \\(6\\).",
        "source_id": "src-putnam-2007-A6-kedlaya",
        "status": "ai_checked",
