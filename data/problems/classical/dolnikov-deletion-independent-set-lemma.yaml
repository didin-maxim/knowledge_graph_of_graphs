  "solutions": [
    {
      "id": "sol-hall-minimal-counterexample",
      "title": "Доказательство через Холла и минимальный контрпример",
      "text": "Предположим противное и выберем контрпример с минимальным \\(m\\). Возьмем в \\(Q\\) независимое множество \\(X\\) размера \\(m\\), а остальные вершины обозначим через \\(Y\\), так что \\(|Y|=m-1\\). Если бы для каждого \\(A\\subseteq Y\\) выполнялось \\(|N_X(A)|\\ge |A|\\), то по теореме Холла все вершины \\(Y\\) можно было бы сопоставить их различным соседям из \\(X\\). После удаления единственной несопоставленной вершины из \\(X\\) независимое множество могло бы взять не более одной вершины из каждой сопоставленной смежной пары, то есть имело бы размер не больше \\(m-1\\), противоречие. Значит, существует плохое множество \\(A\\subseteq Y\\), для которого \\(|A|>|N_X(A)|\\). Выберем такое \\(A\\) максимальным по включению и положим \\(|A|=a\\).\n\nДля любого \\(C\\subseteq Y\\setminus A\\) выполняется \\(|N_{X\\setminus N_X(A)}(C)|\\ge |C|\\); иначе \\(A\\cup C\\) тоже было бы плохим. По теореме Холла вершины \\(Y\\setminus A\\) можно попарно различно сопоставить их соседям из \\(X\\setminus N_X(A)\\). Пусть \\(B\\) — множество несопоставленных вершин из \\(X\\). Тогда \\(|B|=a+1\\), причем \\(N_X(A)\\subseteq B\\).\n\nРассмотрим индуцированный подграф \\(Q[A\\cup B]\\). Вне \\(A\\cup B\\) остались ровно \\(m-a-1\\) сопоставленных смежных пар, поэтому любое независимое множество берет оттуда не более \\(m-a-1\\) вершин. Следовательно, после удаления любой вершины из \\(A\\cup B\\) независимое множество размера \\(m\\), существующее по условию леммы, содержит внутри \\(A\\cup B\\) не менее \\(a+1\\) вершин. Значит, в \\(Q[A\\cup B]\\), который имеет \\(2a+1=2(a+1)-1\\) вершин, после удаления любой вершины остается независимое множество размера \\(a+1\\).\n\nЕсли \\(a+1<m\\), то по минимальности \\(m\\) в \\(Q[A\\cup B]\\) есть независимое множество размера \\(a+2\\). Добавив к нему все вершины \\(X\\setminus B\\), получаем независимое множество размера \\(m+1\\) в \\(Q\\), поскольку \\(X\\setminus B\\) не смежно ни с \\(A\\), ни с \\(B\\). Если же \\(a+1=m\\), то \\(A=Y\\), а из плохости \\(A\\) найдется вершина \\(x\\in X\\), не смежная ни с одной вершиной из \\(Y\\). После удаления \\(x\\) по условию есть независимое множество размера \\(m\\); добавляя к нему \\(x\\), снова получаем независимое множество размера \\(m+1\\). Противоречие доказывает лемму.",
