      "id": "idea-maximal-bad-set",
      "title": "Максимальное плохое множество",
      "text": "Выбирается независимое множество \\(X\\) размера \\(m\\), а остальные вершины образуют \\(Y\\). Если часть \\(A\\subseteq Y\\) имеет слишком мало соседей в \\(X\\), берется максимальное такое \\(A\\); вне него условие Холла уже выполняется.",
