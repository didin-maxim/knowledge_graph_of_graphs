        "title": "Форма через независимые множества",
        "text": "Пусть \\(Q\\) — конечный простой граф на \\(2m-1\\) вершинах. Если после удаления любой вершины графа \\(Q\\) в оставшемся графе существует независимое множество размера \\(m\\), то в самом \\(Q\\) существует независимое множество размера \\(m+1\\).",
