      "id": "idea-matched-pairs-force-core",
      "title": "Сопоставленные пары выталкивают независимость в ядро",
      "text": "Паросочетание между \\(Y\\setminus A\\) и частью \\(X\\) создает смежные пары. Поэтому большое независимое множество после удаления вершины вынуждено брать достаточно много вершин из меньшего подграфа на \\(A\\cup B\\).",
