  "solutions": [
    {
      "id": "sol-path-length-potentials",
      "title": "Доказательство через длины путей",
      "text": "Возьмем произвольную ориентацию \\(D\\) графа \\(G\\). Для каждой вершины \\(v\\) обозначим через \\(a(v)\\) максимальное число рёбер в ориентированном пути, который заканчивается в \\(v\\). Если есть дуга \\(u\\to v\\), то любой максимальный путь, заканчивающийся в \\(u\\), можно продолжить этой дугой, поэтому \\(a(v)\\ge a(u)+1\\). Значит, концы каждой дуги имеют разные значения \\(a\\), и раскраска вершины \\(v\\) в цвет \\(a(v)+1\\) является правильной раскраской исходного неориентированного графа. Все значения \\(a(v)\\) не превосходят \\(L(D)\\), поэтому использовано не больше \\(L(D)+1\\) цветов. Следовательно, \\(\\chi(G)\\le L(D)+1\\) для любой ориентации \\(D\\), то есть \\(L(D)\\ge \\chi(G)-1\\).\n\nДокажем обратное неравенство. Возьмем правильную раскраску графа \\(G\\) ровно в \\(\\chi(G)\\) цветов, пронумерованных \\(1,2,\\ldots,\\chi(G)\\). Ориентируем каждое ребро из вершины меньшего цвета в вершину большего цвета. Вдоль любого ориентированного пути цвета строго возрастают. Поэтому такой путь содержит не больше \\(\\chi(G)\\) вершин и имеет не больше \\(\\chi(G)-1\\) рёбер. Для этой ориентации \\(L(D)\\le \\chi(G)-1\\).\n\nМы доказали, что в любой ориентации \\(L(D)\\ge \\chi(G)-1\\), и построили ориентацию с \\(L(D)\\le \\chi(G)-1\\). Значит \\(\\min_D L(D)=\\chi(G)-1\\), или, что то же самое, \\(\\chi(G)=1+\\min_D L(D)\\).",
