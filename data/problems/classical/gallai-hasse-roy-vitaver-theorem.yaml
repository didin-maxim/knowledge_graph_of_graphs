        "id": "stmt-original-1",
        "title": "Хроматическое число через ориентации",
        "text": "Пусть \\(G\\) — конечный простой граф. Для ориентации \\(D\\) графа \\(G\\) обозначим через \\(L(D)\\) наибольшее число рёбер в ориентированном пути в \\(D\\). Тогда \\(\\chi(G)=1+\\min_D L(D)\\), где минимум берётся по всем ориентациям рёбер графа \\(G\\).",
