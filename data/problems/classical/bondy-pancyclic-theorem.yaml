      "id": "idea-dense-hamiltonian-forces-all-cycles",
      "title": "Dense Hamiltonian graphs are almost pancyclic",
      "text": "The theorem upgrades a Hamiltonian cycle plus the edge threshold n^2/4 to cycles of every length; the only extremal obstruction is the balanced complete bipartite graph.",
