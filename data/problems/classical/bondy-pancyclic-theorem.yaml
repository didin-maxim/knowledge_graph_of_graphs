      "title": "Mantel threshold with a Hamiltonian cycle",
      "text": "The same n^2/4 threshold as Mantel's theorem becomes much stronger when a Hamiltonian cycle is already present: except for the balanced bipartite extremal graph, it forces every cycle length, not just a triangle.",
