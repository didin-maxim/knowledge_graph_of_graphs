      ]
    },
    {
      "id": "sol-three-color-deletion-counting",
      "title": "Трёхцветное следствие через удаление одного цвета",
      "text": "Пусть \\(|V(G)|=n>0\\), а цвета равны 1, 2, 3. Удалим все вершины цвета 1; оставшийся подграф на цветах 2 и 3 не имеет циклов, потому что любой его цикл был бы циклом исходного графа, использующим только два цвета. Значит, этот подграф является лесом и содержит не более \\(n-1\\) рёбер. То же верно после удаления цвета 2 и после удаления цвета 3.\n\nСложим три полученные оценки. Каждое ребро исходного графа осталось хотя бы в одном из трёх подграфов: ребро между двумя разными цветами остаётся после удаления третьего цвета, а одноцветное ребро остаётся после удаления любого из двух других цветов. Поэтому \\(|E(G)|\\le 3(n-1)\\).",
