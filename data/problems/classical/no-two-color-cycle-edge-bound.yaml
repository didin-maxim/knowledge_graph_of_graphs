  "ideas": [
    {
      "id": "idea-two-color-subgraphs-are-forests",
      "title": "Двухцветный цикл ровно запрещён",
      "text": "Если подграф на двух цветах содержит цикл, то этот же цикл в исходном графе использует не более двух цветов. Поэтому условие про минимум три цвета в каждом цикле сразу превращает все двухцветные индуцированные подграфы в леса.",
      "tags": [
        "coloring",
        "trees"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-sum-forest-bounds-over-color-pairs",
      "title": "Сложить лесные оценки по парам цветов",
      "text": "Для каждой пары цветов лес даёт линейную оценку на число рёбер. При суммировании по парам каждое ребро исходного графа попадает хотя бы в один такой подграф: разноцветное ребро попадает в свою пару цветов, а одноцветное ребро попадает во все пары, содержащие этот цвет.",
      "tags": [
        "double_counting",
        "extremal_graph_theory"
      ],
      "status": "ai_checked"
    }
  ],
  "solutions": [
    {
      "id": "sol-general-pair-counting",
      "title": "Доказательство через пары цветов",
      "text": "Зафиксируем пару цветов \\(i<j\\). Если в индуцированном подграфе \\(G_{ij}=G[V_i\\cup V_j]\\) был бы цикл, то в исходном графе \\(G\\) этот цикл использовал бы только цвета \\(i\\) и \\(j\\), вопреки условию. Значит, каждый \\(G_{ij}\\) является лесом.\n\nЕсли \\(V_i\\cup V_j\\ne\\varnothing\\), то лес на \\(|V_i|+|V_j|\\) вершинах имеет не более \\(|V_i|+|V_j|-1\\) рёбер. Поэтому\n\\[\n\\sum_{i<j}|E(G_{ij})|\\le \\sum_{i<j,\\ V_i\\cup V_j\\ne\\varnothing}(|V_i|+|V_j|-1)\\le \\sum_{i<j}(|V_i|+|V_j|)=(r-1)|V(G)|.\n\\]\nОстаётся сравнить эту сумму с \\(|E(G)|\\). Ребро между разными цветами \\(i\\) и \\(j\\) входит в \\(G_{ij}\\), а ребро внутри цвета \\(i\\) входит в каждый \\(G_{ij}\\) при \\(j\\ne i\\). Следовательно, каждое ребро исходного графа посчитано в левой сумме хотя бы один раз, и \\(|E(G)|\\le \\sum_{i<j}|E(G_{ij})|\\). Это доказывает общий bound и, при \\(r=5\\), даёт \\(|E(G)|\\le 4|V(G)|\\).",
      "idea_ids": [
        "idea-two-color-subgraphs-are-forests",
        "idea-sum-forest-bounds-over-color-pairs"
      ],
