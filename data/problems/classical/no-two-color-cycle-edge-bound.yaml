  "statements": {
    "original": [
      {
        "id": "stmt-general-bound",
        "text": "Пусть вершины конечного простого графа \\(G\\) окрашены в \\(r\\ge 2\\) цветов, а каждый цикл в \\(G\\) содержит вершины как минимум трёх различных цветов. Обозначим через \\(V_i\\) класс вершин цвета \\(i\\), а через \\(G_{ij}\\) подграф, индуцированный множеством \\(V_i\\cup V_j\\). Тогда каждый \\(G_{ij}\\) является лесом. Поэтому\n\\[\n|E(G)|\\le \\sum_{1\\le i<j\\le r}|E(G_{ij})|\\le \\sum_{1\\le i<j\\le r,\\ V_i\\cup V_j\\ne\\varnothing} (|V_i|+|V_j|-1)\\le (r-1)|V(G)|.\n\\]\nВ частности, при \\(r=5\\) достаточно удобной оценки \\(|E(G)|\\le 4|V(G)|\\).",
        "source_ids": [
          "src-fyum-2010-tur3a-p7-official",
          "src-fyum-2010-tur3b-p3-official"
        ],
        "status": "ai_checked",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [
          "simple_graph",
          "cycle",
          "tree"
        ]
      },
      {
        "id": "stmt-three-colors-corollary",
        "text": "Следствие для трёх цветов. Если вершины графа \\(G\\) окрашены в три цвета и каждый цикл содержит вершины всех трёх цветов, то \\(|E(G)|\\le 3(|V(G)|-1)\\) при \\(|V(G)|>0\\). Действительно, после удаления любого одного цвета оставшийся двухцветный индуцированный подграф не содержит циклов, значит является лесом и имеет не более \\(|V(G)|-1\\) рёбер; сумма по трём удаляемым цветам считает каждое ребро хотя бы один раз.",
        "source_id": "src-fyum-2010-tur3b-p3-official",
        "status": "ai_checked",
