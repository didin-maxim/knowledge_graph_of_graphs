  "solutions": [
    {
      "id": "sol-gyarfas-simonyi-lemma-a",
      "title": "Доказательство леммы A Гьярфаша--Шимони",
      "text": "Докажем эквивалентную контрапозитивную форму: если в раскраске рёбер полного графа без радужных треугольников все использованные цвета связны как остовные графы, то цветов не может быть три или больше. Для нашей карточки это сразу даёт нужное утверждение для трёх цветов.\n\nПредположим противное и выберем минимальный по числу вершин контрпример \\(G\\): это галлаева раскраска полного графа, в ней использованы хотя бы три цвета, и каждый цветовой класс связен. В таком минимальном контрпримере у каждой вершины есть инцидентные рёбра всех цветов. Действительно, если вершина \\(x\\) не инцидентна ни одному ребру цвета \\(c\\), то в графе цвета \\(c\\) вершина \\(x\\) изолирована, а значит цвет \\(c\\) уже несвязен.\n\nЗафиксируем вершину \\(x\\) и рассмотрим раскраску \\(H=G-x\\). Если в \\(H\\) осталось только два цвета, то любой третий цвет в \\(G\\) встречается только на рёбрах из \\(x\\), то есть его цветовой граф является звездой с центром \\(x\\) и не покрывает связно все остальные вершины; это противоречит связности всех цветов в \\(G\\). Значит в \\(H\\) тоже используются хотя бы три цвета. По минимальности \\(G\\) граф \\(H\\) имеет несвязный цветовой класс; назовём этот цвет цветом 1, а его компоненты в \\(H\\) обозначим \\(C_1,\\ldots,C_k\\), где \\(k\\ge2\\).\n\nВажное простое наблюдение: если \\(C_i\\) и \\(C_j\\) -- две разные компоненты цвета 1 в \\(H\\), то все рёбра между ними имеют один и тот же цвет, отличный от 1. В самом деле, возьмём \\(u,u'\\in C_i\\) и \\(v\\in C_j\\). Внутри \\(C_i\\) есть путь цвета 1 от \\(u\\) к \\(u'\\). Если цвета рёбер \\(uv\\) и \\(u'v\\) различны, то вдоль этого пути найдутся соседние вершины \\(w,w'\\), для которых цвета \\(wv\\) и \\(w'v\\) различны; тогда треугольник \\(w w' v\\) имеет ребро \\(ww'\\) цвета 1 и два рёбра двух других цветов, то есть является радужным. Это запрещено. Поэтому цвет рёбер из \\(v\\) во всю компоненту \\(C_i\\) постоянен; повторяя аргумент по вершинам второй компоненты, получаем постоянство цвета на всём разрезе \\(C_i,C_j\\).\n\nПокажем теперь, что цвет 1 несвязен уже в \\(G\\). Если бы он стал связным после возвращения вершины \\(x\\), то из \\(x\\) выходило бы хотя бы одно ребро цвета 1 в каждую компоненту \\(C_i\\); выберем такие вершины \\(y_i\\in C_i\\). Так как все цвета в \\(G\\) инцидентны \\(x\\), существуют рёбра \\(xu\\) и \\(xv\\) цветов 2 и 3.\n\nЕсли \\(u\\) и \\(v\\) лежат в одной компоненте, скажем в \\(C_1\\), то возьмём \\(y_2\\in C_2\\). Треугольник \\(xuy_2\\) не радужный, а рёбра \\(xu\\) и \\(xy_2\\) имеют цвета 2 и 1, поэтому ребро \\(uy_2\\) обязано иметь цвет 2. Аналогично из треугольника \\(xvy_2\\) следует, что \\(vy_2\\) имеет цвет 3. Но оба ребра идут между одними и теми же компонентами \\(C_1\\) и \\(C_2\\), что противоречит только что доказанной одноцветности такого разреза.\n\nЕсли же \\(u\\) и \\(v\\) лежат в разных компонентах, скажем \\(u\\in C_1\\), \\(v\\in C_2\\), то из треугольника \\(xuy_2\\) снова следует, что \\(uy_2\\) имеет цвет 2, а из треугольника \\(xvy_1\\) следует, что \\(vy_1\\) имеет цвет 3. Это снова две разные окраски рёбер между \\(C_1\\) и \\(C_2\\), невозможные по наблюдению.\n\nИтак, цвет 1 несвязен и в \\(G\\), что противоречит выбору контрпримера. Следовательно, в любой галлаевой раскраске с тремя использованными цветами хотя бы один цветовой класс несвязен.",
