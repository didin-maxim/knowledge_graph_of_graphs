      "title": "Доказательство по опубликованной лемме",
      "text": "Гьярфаш и Шимони формулируют это как лемму A и доказывают минимальным контрпримером. Удаляют вершину, рассматривают несвязные компоненты одного цвета в меньшей раскраске Галлаи и используют однородность цветов между такими компонентами. При возвращении удалённой вершины тот же цвет остаётся несвязным, что даёт требуемый несвязный цветовой класс.",
