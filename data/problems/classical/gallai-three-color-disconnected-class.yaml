      "id": "idea-no-three-connected-colors",
      "title": "Три связных цвета вынуждают радужный треугольник",
      "text": "Удобна контрапозитивная форма: если в трёхцветной раскраске рёбер полного графа все три цветовых класса связны, то существует радужный треугольник.",
