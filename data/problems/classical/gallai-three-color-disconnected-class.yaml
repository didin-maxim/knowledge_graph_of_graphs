      "title": "Reference proof",
      "text": "Gyarfás and Simonyi state this as Lemma A and give a short minimal-counterexample proof: delete a vertex, take the disconnected color components in the smaller Gallai coloring, and use the homogeneity of colors between components to force the same color to remain disconnected after the vertex is restored.",
