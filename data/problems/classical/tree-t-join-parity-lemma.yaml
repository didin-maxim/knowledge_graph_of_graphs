  "solutions": [
    {
      "id": "sol-symmetric-difference-of-tree-paths",
      "title": "Симметрическая разность путей",
      "text": "Сначала докажем утверждение для дерева \\(D\\). Так как \\(|T|\\) чётно, разобьём вершины множества \\(T\\) на пары \\(\\{a_1,b_1\\},\\ldots,\\{a_k,b_k\\}\\). Для каждой пары возьмём единственный простой путь \\(P_i\\) в дереве \\(D\\) между \\(a_i\\) и \\(b_i\\). Определим \\(F\\) как симметрическую разность множеств рёбер этих путей: ребро входит в \\(F\\) тогда и только тогда, когда оно лежит в нечётном числе путей \\(P_i\\).\n\nПосмотрим на степени вершин в подграфе с множеством рёбер \\(F\\) по модулю 2. Для одного пути \\(P_i\\) вклад в степень каждой внутренней вершины равен 2, то есть чётен, а вклад в степени концов \\(a_i\\) и \\(b_i\\) равен 1. При переходе к симметрической разности мы просто складываем эти вклады по модулю 2: если одно и то же ребро встречается в двух путях, его двойной вклад исчезает. Поэтому нечётность степени вершины в \\(F\\) равна числу раз, когда эта вершина была концом выбранных путей, взятому по модулю 2. Каждая вершина из \\(T\\) является концом ровно одного пути, а вершины вне \\(T\\) не являются концами ни одного из них. Значит, нечётные степени в \\((V(D),F)\\) имеют ровно вершины из \\(T\\).\n\nТеперь пусть \\(G\\) — произвольный связный граф. Возьмём в нём остовное дерево \\(D\\). По доказанному в \\(D\\) существует множество рёбер \\(F\\) с нечётными степенями ровно в \\(T\\). Поскольку \\(E(D)\\subseteq E(G)\\), то же множество \\(F\\) подходит и для исходного графа \\(G\\). Лемма доказана.",
