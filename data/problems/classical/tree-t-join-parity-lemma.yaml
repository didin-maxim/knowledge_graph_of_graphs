      "id": "idea-pair-and-xor-paths",
      "title": "Попарные пути и сложение по модулю 2",
      "text": "Если сложить набор путей по модулю 2, то внутренняя вершина каждого пути меняет степень на 2, а концы пути — на 1. Поэтому после попарного соединения вершин из \\(T\\) нечётность степени остаётся только в этих концах.",
