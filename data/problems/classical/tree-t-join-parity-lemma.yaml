  "statements": {
    "original": [
      {
        "id": "stmt-original-1",
        "text": "Пусть \\(G\\) — конечный связный неориентированный граф, а \\(T\\) — чётное множество его вершин. Тогда существует множество рёбер \\(F\\subseteq E(G)\\), для которого вершины нечётной степени в подграфе \\((V(G),F)\\) — ровно вершины из \\(T\\). В частности, достаточно доказать это для дерева: в дереве можно попарно разбить вершины \\(T\\), соединить каждую пару единственным простым путём и взять симметрическую разность этих путей.",
