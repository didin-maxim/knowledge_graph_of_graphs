        "id": "stmt-asymptotic-player-two-win",
        "title": "Теорема Малекшахяна--Спиро для смещённой игры",
        "text": "Пусть \\(n,p,q\\ge 1\\) -- целые числа. На рёбрах полного графа \\(K_n\\) играют двое, первым ходит игрок 1. За свой ход игрок 1 забирает \\(p\\) ещё не занятых рёбер, а игрок 2 -- \\(q\\) таких рёбер; если перед ходом осталось меньше положенного числа рёбер, игрок забирает все оставшиеся. После заполнения графа через \\(G_1\\) и \\(G_2\\) обозначим графы из рёбер соответствующих игроков. Если \\(p<q\\), игрок 2 выигрывает ровно тогда, когда \\(\\omega(G_2)>\\omega(G_1)\\); при равенстве размеров наибольших клик выигрывает игрок 1. Для каждого \\(p\\ge1\\) существует целое \\(n_0=n_0(p)\\) такое, что при всех \\(n\\ge n_0\\) игрок 2 имеет выигрышную стратегию, если\n\\[\nq\\ge\\left(2+\\frac{12\\log_2\\log_2(p+1)}{\\log_2(p+1)}\\right)p+2.\n\\]\nВ частности, при всех достаточно больших \\(n\\) игрок 2 выигрывает игру с параметрами \\((p,q)=(1,4)\\).",
        "source_id": "src-malekshahian-spiro-clique-building-game",
        "status": "source_verified",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [
