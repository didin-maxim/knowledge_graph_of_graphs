  "ideas": [
    {
      "id": "idea-critical-independent-set",
      "title": "Критическое удаление рёбер даёт почти максимальное независимое множество",
      "text": "Если граф не имеет независимого множества размера \\(k\\), можно удалить рёбра до минимального по включению подграфа с тем же свойством. Удаление любого оставшегося ребра тогда создаёт независимое \\(k\\)-множество, а значит в исходном критическом графе есть независимое множество размера \\(k-1\\).",
      "tags": [
        "ramsey_theory",
        "extremal_choice"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-attach-leaf-from-independent-set",
      "title": "Лист достраивается из независимого множества",
      "text": "После удаления независимого множества \\(M\\) размера \\(k-1\\) остаётся ровно достаточно вершин, чтобы по индукции найти дерево \\(T\\) без одного листа. Любая вершина вне \\(M\\) смежна с некоторой вершиной из \\(M\\), иначе вместе с \\(M\\) она дала бы независимое множество размера \\(k\\).",
      "tags": [
