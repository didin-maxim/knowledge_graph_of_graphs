  "solutions": [
    {
      "id": "sol-leaf-induction",
      "title": "Индукция по числу вершин дерева",
      "text": "Докажем утверждение индукцией по \\(n\\). При \\(n=1\\) копия дерева из одной вершины есть в любом непустом графе, а при \\(k=1\\) независимое множество размера \\(1\\) тоже есть, так что базовые случаи очевидны.\n\nПусть \\(n>1\\), и пусть граф \\(G\\) на \\((n-1)(k-1)+1\\) вершинах не содержит независимого множества размера \\(k\\). Достаточно доказать, что он содержит заданное дерево \\(T\\). Удаляя из \\(G\\) рёбра, пока это возможно без появления независимого множества размера \\(k\\), получим остовный подграф \\(H\\), минимальный по рёбрам среди графов с \\(\\alpha(H)<k\\). В \\(H\\) есть независимое множество размера \\(k-1\\): если рёбер нет, это ясно из числа вершин; иначе для любого ребра \\(uv\\) граф \\(H-uv\\) уже имеет независимое множество \\(I\\) размера \\(k\\). В графе \\(H\\) множество \\(I\\) не независимо, и единственное добавленное обратно ребро внутри \\(I\\) — это \\(uv\\); поэтому \\(I\\setminus\\{u\\}\\) независимо и имеет размер \\(k-1\\). Обозначим такое множество через \\(M\\).\n\nУдалим из \\(T\\) лист \\(x\\) и обозначим получившееся дерево через \\(T'\\); пусть \\(y\\) — сосед листа \\(x\\) в \\(T\\). В графе \\(H-M\\) осталось\n\\[\n((n-1)(k-1)+1)-(k-1)=(n-2)(k-1)+1\n\\]\nвершин. Если бы в \\(H-M\\) было независимое множество размера \\(k\\), оно было бы независимым и в \\(H\\), что невозможно. Поэтому по индукционному предположению \\(H-M\\) содержит копию дерева \\(T'\\). Пусть вершина \\(z\\) этой копии соответствует вершине \\(y\\).\n\nТак как \\(M\\) независимо и имеет размер \\(k-1\\), вершина \\(z\\) обязана иметь соседа в \\(M\\); иначе \\(M\\cup\\{z\\}\\) было бы независимым множеством размера \\(k\\) в \\(H\\). Берём такой сосед как образ удалённого листа \\(x\\). Тогда копия \\(T'\\) вместе с этим ребром даёт копию всего дерева \\(T\\) в \\(H\\), а значит и в исходном графе \\(G\\).",
