        "text": "Пусть \\(T\\) — произвольное фиксированное дерево на \\(n\\) вершинах, а \\(k\\) — положительное целое число. Тогда всякий простой граф на \\((n-1)(k-1)+1\\) вершинах содержит либо копию дерева \\(T\\), либо независимое множество размера \\(k\\).",
