  "solutions": [
    {
      "id": "sol-alternating",
      "title": "Доказательство через чередующиеся пути",
      "text": "Пусть доли двудольного графа равны \\(X\\) и \\(Y\\), а \\(M\\) — максимальное паросочетание. Сначала заметим, что любое вершинное покрытие содержит хотя бы один конец каждого ребра из любого паросочетания, поэтому размер любого покрытия не меньше \\(|M|\\). Значит, достаточно построить вершинное покрытие ровно из \\(|M|\\) вершин.\n\nОтметим все вершины, достижимые чередующимися путями из непокрытых паросочетанием вершин доли \\(X\\). При таком обходе из вершины доли \\(X\\) разрешено идти только по ребрам, не входящим в \\(M\\), а из вершины доли \\(Y\\) — только по ребрам из \\(M\\). Пусть \\(Z\\) — множество отмеченных вершин.\n\nНи одна непокрытая вершина доли \\(Y\\) не отмечена: иначе путь от непокрытой вершины \\(X\\) до нее был бы увеличивающим, и, поменяв на этом пути ребра из \\(M\\) на ребра вне \\(M\\), мы получили бы большее паросочетание.\n\nПоложим \\(C=(X\\setminus Z)\\cup(Y\\cap Z)\\). Докажем, что \\(C\\) покрывает все ребра. Пусть ребро \\(xy\\), где \\(x\\in X\\), \\(y\\in Y\\), не покрыто множеством \\(C\\). Тогда \\(x\\notin C\\), значит \\(x\\in Z\\), и \\(y\\notin C\\), значит \\(y\\notin Z\\). Если \\(xy\\notin M\\), то из отмеченной вершины \\(x\\) по правилу обхода можно было бы отметить \\(y\\), противоречие. Если же \\(xy\\in M\\), то отмеченная вершина \\(x\\), покрытая ребром \\(M\\), могла быть достигнута только после перехода из \\(y\\) по этому ребру; значит \\(y\\) тоже была бы отмечена. Снова противоречие.\n\nОсталось посчитать размер \\(C\\). Каждое ребро паросочетания \\(M\\) имеет ровно один конец в \\(C\\): если его левый конец не отмечен, в \\(C\\) входит он; если левый конец отмечен, то по правилу чередующегося обхода отмечен и правый конец, и в \\(C\\) входит правый. Непокрытые вершины \\(X\\) отмечены и не входят в \\(C\\), а непокрытые вершины \\(Y\\), как доказано выше, не отмечены и тоже не входят в \\(C\\). Поэтому \\(|C|=|M|\\).\n\nМы построили вершинное покрытие размера \\(|M|\\), а меньшее покрытие невозможно, потому что оно должно покрывать все ребра паросочетания \\(M\\). Следовательно, максимальный размер паросочетания равен минимальному размеру вершинного покрытия.",
