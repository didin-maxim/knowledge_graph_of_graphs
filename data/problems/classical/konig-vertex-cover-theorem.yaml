        ]
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph-1",
        "text": "Если G — конечный двудольный граф, то \\( \\nu(G)=\\tau(G) \\), где nu(G) — максимальный размер паросочетания, а tau(G) — минимальный размер вершинного покрытия, то есть множества вершин, содержащего хотя бы один конец каждого ребра.",
