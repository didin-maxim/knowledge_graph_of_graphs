  "ideas": [
    {
      "id": "idea-alternating-reachability",
      "title": "Достижимость чередующимися путями",
      "text": "Из максимального паросочетания строится минимальное покрытие через вершины, достижимые чередующимися путями от непокрытых вершин одной доли.",
