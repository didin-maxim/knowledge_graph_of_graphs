  "solutions": [
    {
      "id": "sol-alternating",
      "title": "Доказательство через чередующиеся пути",
      "text": "Пусть M — максимальное паросочетание в двудольном графе с долями X,Y. Запустим чередующиеся пути из непокрытых вершин X: из X идем по ребрам не из M, из Y — по ребрам из M. Пусть Z — множество достижимых вершин. Тогда C=(X\\Z) union (Y cap Z) покрывает все ребра: иначе непокрытое ребро нарушило бы достижимость или дало увеличивающий путь. Каждое ребро M покрывает ровно одну вершину C, поэтому |C|=|M|. Так как любое покрытие имеет размер не меньше любого паросочетания, C минимально, M максимально.",
