      {
        "id": "stmt-original",
        "title": "Условие",
        "text": "Дана таблица \\(2n\\times 2n\\). Каждая клетка имеет один из \\(2n^2\\) цветов, причём каждый цвет встречается ровно дважды. Яна стоит в одной клетке, а шоколадка лежит в другой. За ход она либо идёт в соседнюю по стороне клетку, либо телепортируется в другую клетку того же цвета, причём типы ходов должны строго чередоваться и первым должен быть телепорт. Нужно определить, может ли Яна гарантированно дойти до шоколадки при любой раскраске и любых начальных клетках.",
        "source_id": "src-memo-2022-official",
        "status": "needs_human_review",
        "self_contained": {
          "status": "ai_checked"
        },
        "definition_ids": [],
        "distinct_from": [
          "stmt-graph"
        ]
      }
    ],
    "graph_theory": [
      {
        "id": "stmt-graph",
        "text": "Официальное решение не строит один явный граф клеток, но делит клетки на четыре класса достижимости в ориентированном графе состояний: достижимые с последним телепортом, с последним обычным шагом, обоими способами и недостижимые. Дальше используется инвариант попарной балансировки и домино-разбиение.",
        "status": "needs_human_review",
