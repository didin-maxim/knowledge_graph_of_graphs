  "ideas": [
    {
      "id": "idea-four-reachability-types",
      "title": "Четыре типа достижимости",
      "text": "Каждая клетка классифицируется по тому, каким типом последнего хода она достижима: только телепортом, только обычным шагом, обоими способами или вовсе недостижима. Это превращает задачу в анализ достижимости в состоянии с чередованием ходов.",
      "tags": [
        "connectivity"
      ],
      "status": "needs_human_review"
    },
    {
      "id": "idea-domino-balance",
      "title": "Домино и баланс классов",
      "text": "Клетки одного цвета образуют пары-партнёры. з чередования ходов следует, что число клеток, достижимых только телепортом, равно числу клеток, достижимых только обычным шагом. Если недостижимые клетки существуют, можно выбрать границу между достижимой и недостижимой клеткой и продолжить её до разбиения доски доминошками. Тогда одна из доминошек нарушает этот баланс, что даёт противоречие.",
      "tags": [
        "matching"
      ],
      "status": "needs_human_review"
    }
  ],
  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Сжатое официальное решение",
      "text": "Фиксируем раскраску и стартовую клетку. Каждую клетку относим к одному из четырёх классов: достижима только легальной последовательностью, оканчивающейся телепортом; только последовательностью, оканчивающейся обычным шагом; обоими способами; недостижима. Пары клеток одного цвета попарно переводят тип 'телепорт достижима' в тип 'обычный шаг достижима', поэтому этих клеток поровну. Сосед любой 'телепорт достижимой' клетки обязан быть 'обычно достижимым', а сосед легко достижимой клетки не может быть недостижим. Предположим, что недостижимая клетка есть. Тогда рядом с ней найдётся клетка, достижимая только обычным шагом. Покрываем всю доску доминошками так, чтобы эта пара попала в одну доминошку. В каждой доминошке, содержащей клетку типа 'только телепорт', есть клетка типа 'только обычный шаг', но выбранная доминошка даёт клетку второго типа без первой. Это противоречит равенству чисел двух типов. Значит недостижимых клеток нет, и Яна всегда может попасть в любую клетку, в частности к шоколадке.",
      "idea_ids": [
        "idea-four-reachability-types",
        "idea-domino-balance"
      ],
      "standard_idea_ids": [],
      "status": "needs_human_review"
    }
  ],
