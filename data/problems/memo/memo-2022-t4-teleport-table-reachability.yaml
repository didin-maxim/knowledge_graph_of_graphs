  "ideas": [
    {
      "id": "idea-four-reachability-types",
      "title": "Четыре типа достижимости",
      "text": "Каждая клетка классифицируется по тому, каким типом последнего хода она достижима: только телепортом, только обычным шагом, обоими способами или вовсе недостижима. Это превращает задачу в анализ достижимости в состоянии с чередованием ходов.",
      "tags": [
        "connectivity"
      ],
      "status": "needs_human_review"
    },
    {
      "id": "idea-domino-balance",
      "title": "Домино и баланс классов",
      "text": "Клетки одного цвета образуют пары-партнёры. з чередования ходов следует, что число клеток, достижимых только телепортом, равно числу клеток, достижимых только обычным шагом. Если недостижимые клетки существуют, можно выбрать границу между достижимой и недостижимой клеткой и продолжить её до разбиения доски доминошками. Тогда одна из доминошек нарушает этот баланс, что даёт противоречие.",
      "tags": [
        "matching"
      ],
      "status": "needs_human_review"
    }
  ],
  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Решение через граф переходов",
      "text": "Фиксируем раскраску и стартовую клетку. Каждую клетку относим к одному из четырёх классов: достижима только легальной последовательностью, оканчивающейся телепортом; только последовательностью, оканчивающейся обычным шагом; обоими способами; недостижима. Переход к парной клетке того же цвета взаимно переводит достижимость после обычного шага в достижимость после телепорта, поэтому клеток типов \"только телепорт\" и \"только обычный шаг\" поровну. Сосед любой клетки типа \"только телепорт\" обязан быть достижим после обычного шага, а сосед клетки, достижимой после телепорта, не может быть недостижим. Предположим, что недостижимая клетка есть. Так как доска связна и стартовая клетка достижима, найдётся соседняя пара из достижимой и недостижимой клетки; достижимая клетка в такой паре не может быть достижима после телепорта, значит она имеет тип \"только обычный шаг\". Покрываем всю доску доминошками так, чтобы эта соседняя пара попала в одну доминошку. В каждой доминошке, содержащей клетку типа \"только телепорт\", вторая клетка достижима после обычного шага; она не может быть типа \"оба\", иначе первая клетка тоже была бы достижима после обычного шага обратным соседним ходом. Значит каждой клетке типа \"только телепорт\" соответствует в её доминошке клетка типа \"только обычный шаг\". Выбранная доминошка даёт дополнительную клетку типа \"только обычный шаг\" без клетки типа \"только телепорт\", что противоречит равенству чисел двух типов. Следовательно, недостижимых клеток нет, и Яна всегда может попасть в любую клетку, в частности к шоколадке.",
