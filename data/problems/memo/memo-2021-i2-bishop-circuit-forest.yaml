    {
      "id": "idea-no-cycle-forest",
      "title": "Отсутствие слонового цикла значит лес",
      "text": "Слонов цикл и цикл в двудольном графе эквивалентны. Если циклов нет, граф является лесом. Кроме того, он имеет как минимум две компоненты, потому что клетки двух шахматных цветов попадают в разные компоненты. Значит число рёбер не превосходит числа вершин минус два.",
