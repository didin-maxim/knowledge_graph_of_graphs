  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Решение через лес диагоналей",
      "text": "Пусть вершины одной доли — все диагонали доски с наклоном \\(1\\), а вершины другой доли — все диагонали с наклоном \\(-1\\). Каждой красной клетке соответствует ровно одно ребро между двумя диагоналями, проходящими через эту клетку.\n\nРазберём связь с условием. Если красные клетки \\(a_1,a_2,\\ldots,a_{2r}\\) образуют слонов цикл, то соседние клетки лежат на общей диагонали, значит соответствующие рёбра в двудольном графе идут последовательно через общие вершины. Условие, что \\(a_k\\) и \\(a_{k+2}\\) не лежат на одной диагонали, запрещает немедленный возврат через ту же вершину графа. Поэтому получается настоящий цикл в двудольном графе. Обратно, любой цикл в этом двудольном графе, прочитанный по его рёбрам, даёт последовательность красных клеток со свойствами слонового цикла. Значит, отсутствие слоновых циклов равносильно тому, что построенный граф является лесом.\n\nНа доске \\(m\\times n\\) диагоналей каждого из двух направлений ровно \\(m+n-1\\), всего \\(2m+2n-2\\) вершин графа. Кроме того, граф имеет как минимум две компоненты. Действительно, если занумеровать строки и столбцы, то клетка \\((i,j)\\) соединяет диагонали с параметрами \\(i+j\\) и \\(i-j\\); при переходе по ребру сохраняется чётность этих параметров. Клетки двух шахматных цветов поэтому лежат в разных компонентах диагонального графа. У леса с \\(V\\) вершинами и хотя бы двумя компонентами не более \\(V-2\\) рёбер, следовательно красных клеток не больше\n\\[\n(2m+2n-2)-2=2m+2n-4.\n\\]\n\nОсталось показать достижимость. Покрасим все клетки первых двух строк, а также все клетки первого и последнего столбцов. Всего получится \\(2n+2(m-2)=2m+2n-4\\) красных клеток. Соответствующий диагональный граф ацикличен: сначала клетки первой строки дают попарно независимые рёбра; клетки второй строки присоединяют к ним новые диагонали одну за другой, а клетки первого и последнего столбцов в последующих строках также каждый раз добавляют ребро с новой крайней диагональю. Иначе говоря, все эти рёбра можно упорядочить так, что каждое новое ребро содержит хотя бы одну ранее не встречавшуюся вершину, поэтому цикл не возникает. Значит, слоновых циклов нет, и найденная верхняя оценка точна.",
