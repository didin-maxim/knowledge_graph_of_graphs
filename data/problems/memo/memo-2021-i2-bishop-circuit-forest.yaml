  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Решение через лес диагоналей",
      "text": "Пусть вершины одной доли - все положительные диагонали доски, а другой доли - все отрицательные диагонали. Красной клетке ставим в соответствие ребро между её двумя диагоналями. Последовательность красных клеток является слоновым циклом тогда и только тогда, когда соответствующие рёбра образуют цикл в этом двудольном графе: соседние клетки лежат на общей диагонали, а условие через одну клетку запрещает немедленный возврат по той же вершине. Поэтому при отсутствии слоновых циклов получается лес. Всего диагоналей \\(m+n-1\\) каждого типа, то есть вершин \\(2m+2n-2\\). Граф имеет хотя бы две компоненты: клетки разных шахматных цветов задают рёбра в разных компонентах, поскольку ход по ребру меняет тип диагонали, но сохраняет чётность суммы их индексов. Следовательно, у леса не более \\(2m+2n-4\\) рёбер, а значит и красных клеток. Эта оценка достигается, например, покраской первых двух строк, первого столбца и последнего столбца; это ровно \\(2n+2m-4\\) клеток, и соответствующий граф ацикличен, что прямо видно по последовательному добавлению крайних клеток как листьев.",
