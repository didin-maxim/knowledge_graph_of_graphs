      {
        "id": "stmt-graph",
        "text": "Рассмотрим двудольный граф, одна доля которого состоит из всех диагоналей доски с наклоном \\(1\\), а другая — из всех диагоналей с наклоном \\(-1\\). Каждая красная клетка задаёт ребро между двумя диагоналями, проходящими через эту клетку. Известно, что в этом графе нет циклов. Найдите наибольшее возможное число рёбер такого графа.",
