        "id": "stmt-original",
        "title": "Условие",
        "text": "На доске \\(m\\times n\\) некоторые клетки покрашены в красный цвет. Последовательность попарно различных красных клеток \\(a_1,a_2,\\dots,a_{2r}\\) при \\(2r\\ge 4\\) называется слоновым циклом, если для каждого \\(k\\) клетки \\(a_k\\) и \\(a_{k+1}\\) лежат на одной диагонали, а клетки \\(a_k\\) и \\(a_{k+2}\\) не лежат на одной диагонали. Найдите максимальное число красных клеток, если слоновых циклов нет.",
