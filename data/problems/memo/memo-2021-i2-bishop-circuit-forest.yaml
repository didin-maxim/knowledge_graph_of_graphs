      "id": "idea-diagonal-bigraph",
      "title": "Красные клетки как рёбра между диагоналями",
      "text": "Каждая красная клетка однозначно задаётся парой диагоналей двух наклонов. Поэтому конфигурация красных клеток естественно кодируется двудольным графом на множествах диагоналей.",
