        "id": "stmt-graph",
        "text": "Дан граф достижимости ладьи по одному ходу на некотором множестве не более 2025 красных клеток бесконечной решётки: вершины — красные клетки, а рёбра соединяют пары клеток, между которыми ладья может пройти за один ход, всё время оставаясь на красных клетках. Найдите наибольший возможный размер независимого множества вершин \\(S\\), в котором любые две различные вершины имеют общего соседа.",
