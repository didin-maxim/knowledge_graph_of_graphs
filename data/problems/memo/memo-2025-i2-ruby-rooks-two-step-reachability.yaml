  "ideas": [
    {
      "id": "idea-staircase-construction",
      "title": "Лестница даёт 63 ладьи",
      "text": "Оптимальная конструкция - красная фигура-лестница с длинами строк от 1 до 63 и ладьями на главной диагонали. Тогда в каждой строке и столбце по одной ладье, но любые две ладьи имеют общую промежуточную красную клетку.",
      "tags": [
        "connectivity"
      ],
      "status": "needs_human_review"
    },
    {
      "id": "idea-distinct-witness-squares",
      "title": "Разным парам ладей нужны разные промежуточные клетки",
      "text": "Для каждой пары ладей существует красная клетка, достижимая от обеих за один ход. Эти клетки для разных пар не могут совпадать, иначе три ладьи делили бы одну строку или столбец, и две из них били бы друг друга за один ход. Поэтому число красных клеток не меньше \\(n+\\binom n2\\).",
      "tags": [
        "double_counting"
      ],
      "status": "needs_human_review"
    }
  ],
  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Сжатое официальное решение",
      "text": "Конструкция на 63 ладьи получается из лестницы из 63 строк длины 1,2,...,63; на главной диагонали ставим 63 ладьи. Тогда в каждой строке и столбце не более одной ладьи, так что за один ход ладьи друг друга не достигают. Но любая пара ладей имеет общую красную клетку в прямоугольном углу своей лестничной области, поэтому достигается за два хода. Для верхней оценки пусть ладей \\(n\\). Для каждой пары ладей \\((i,j)\\) выберем красную клетку \\(S_{ij}\\), достижимую от обеих за один ход. Клетки \\(S_{ij}\\) для разных пар различны: если одна клетка служила бы двум разным парам, то какие-то две ладьи лежали бы в одной строке или одном столбце и били бы друг друга за один ход. Кроме того, ни одна из \\(S_{ij}\\) не совпадает с клеткой, где стоит ладья. Поэтому красных клеток не меньше \\(n+\\binom n2\\). Так как красных клеток не более 2025, получаем \\(n(n+1)/2\\le 2025\\), откуда \\(n\\le 63\\). Следовательно, максимум равен 63.",
