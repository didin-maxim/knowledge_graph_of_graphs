        "title": "Условие",
        "text": "На бесконечной клетчатой решётке некоторые клетки покрашены в красный цвет. Рубиновая ладья за один ход может пройти любое число клеток по строке или столбцу, оставаясь всё время на красных клетках. После того как покрашено не более 2025 красных клеток, Алиса ставит на некоторые из них ладьи так, чтобы никакие две ладьи не достигали друг друга за один ход, но любые две достигали друг друга за два хода. Найдите максимальное возможное число ладей.",
