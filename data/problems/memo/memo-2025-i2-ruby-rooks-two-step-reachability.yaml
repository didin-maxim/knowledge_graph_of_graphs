      "id": "idea-staircase-construction",
      "title": "Лестница даёт 63 ладьи",
      "text": "Оптимальная конструкция - красная фигура-лестница с длинами строк от 1 до 63 и ладьями на главной диагонали. Тогда в каждой строке и столбце по одной ладье, но любые две ладьи имеют общую промежуточную красную клетку.",
