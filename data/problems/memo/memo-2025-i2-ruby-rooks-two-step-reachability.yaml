  "solutions": [
    {
      "id": "sol-official-compressed",
      "title": "Решение через клетки-свидетели",
      "text": "Сначала построим пример на 63 ладьи. Покрасим клетки \\((i,j)\\), где \\(1\\le i\\le 63\\) и \\(1\\le j\\le i\\), то есть лестницу из строк длины \\(1,2,\\ldots,63\\). Ладьи поставим в клетки \\((i,i)\\). Две разные ладьи не стоят ни в одной строке и ни в одном столбце, поэтому за один ход они друг друга не достигают. Если \\(i<j\\), то клетка \\((j,i)\\) красная: она лежит в строке ладьи \\((j,j)\\) и в столбце ладьи \\((i,i)\\). Значит, ладья \\((i,i)\\) за один ход приходит в \\((j,i)\\), а оттуда за один ход в \\((j,j)\\). В лестнице покрашено \\(1+2+\\cdots+63=2016\\le2025\\) клеток, так что 63 ладьи возможны.\n\nДокажем, что больше нельзя. Пусть поставлено \\(n\\) ладей. Для каждой пары ладей выберем одну красную клетку-свидетель \\(S_{ij}\\), из которой обе ладьи достижимы за один ход; такая клетка существует по условию двухшаговой достижимости. Свидетель не может совпадать с клеткой, где стоит ладья, потому что тогда эта ладья достигала бы другую за один ход, что запрещено.\n\nПокажем, что разные пары ладей требуют разных свидетелей. Предположим, что одна и та же клетка \\(S\\) служит свидетелем для двух разных пар. Тогда как минимум три ладьи достижимы из \\(S\\) за один ход: если пары имеют общую ладью, это две пары вида \\((a,b)\\) и \\((a,c)\\); если не имеют, тем более свидетелю соответствуют четыре ладьи. Все эти ладьи лежат либо в строке \\(S\\), либо в столбце \\(S\\). По принципу Дирихле две из них лежат на одной из этих двух прямых, а значит достигают друг друга за один ход через красный отрезок этой строки или столбца. Это противоречит условию.\n\nСледовательно, кроме самих \\(n\\) клеток с ладьями, в красной фигуре есть по крайней мере \\(\\binom n2\\) различных клеток-свидетелей. Поэтому\n\\[\nn+\\binom n2\\le 2025.\n\\]\nТо есть \\(n(n+1)/2\\le2025\\). Так как \\(63\\cdot64/2=2016\\), а \\(64\\cdot65/2=2080>2025\\), получаем \\(n\\le63\\). Вместе с построением это даёт максимум 63.",
