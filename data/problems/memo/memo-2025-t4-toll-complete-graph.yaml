      "id": "idea-uniform-weight-upper-bound",
      "title": "Равные веса дают верхнюю оценку через лемму о рукопожатиях",
      "text": "Если все рёбра имеют одинаковый вес, то у каждой вершины можно удалить не более \\(n-1\\) инцидентных рёбер. По лемме о рукопожатиях это ограничивает общее число удалённых рёбер сверху числом \\(100\\binom n2\\).",
